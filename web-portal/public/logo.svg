<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TMAegis</title>
  <desc id="desc">Cyber-defense shield: an emerald M forms the shield walls, a cyan T forms the crown and central blade, with a glowing AI core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F2FE"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="504" height="504" rx="110" fill="url(#bg)" stroke="#1E293B" stroke-width="8"/>

  <!-- Aegis shield -->
  <polygon points="256,44 436,116 436,276 256,468 76,276 76,116" fill="#0F172A" stroke="#1E293B" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="256,44 436,116 436,276 256,468 76,276 76,116" fill="none" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>

  <!-- "M" wings: the shield walls -->
  <polygon points="100,132 152,152 256,300 256,364 152,232 152,318 100,266" fill="url(#emerald)"/>
  <polygon points="412,132 360,152 256,300 256,364 360,232 360,318 412,266" fill="url(#emerald)"/>

  <!-- "T" crown and central blade -->
  <g filter="url(#glow)">
    <polygon points="148,104 364,104 364,150 284,150 284,384 256,428 228,384 228,150 148,150" fill="url(#cyan)"/>
  </g>

  <!-- AI core spark -->
  <circle cx="256" cy="236" r="22" fill="#00F2FE" opacity="0.55" filter="url(#spark)"/>
  <circle cx="256" cy="236" r="14" fill="#FFFFFF"/>
</svg>
