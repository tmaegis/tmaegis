id: TMA-SOPHOS-4.6
title: Ensure Third-party Threat Feeds is enabled
description: Third party feed is a part of Active threat response feature on Sophos Firewall. It allows you to add threat intelligence from external threat feed sources to the firewall. The firewall automatically blocks traffic based on the IPv4 addresses, domains, and URLs listed in the feeds. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 2
severity: high
tags:
- sophos
- threat-prevention
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 4.6 Ensure Third-party Threat Feeds is enabled
audit:
  type: manual
  command: Navigate to Protect > Active threat response > Third-party feeds > Add Select the Action either 'Block' or 'Monitor' Indicator type from 'IPv4 address' , 'Domain' or 'URL' Enter the 'External URL' where the threat feed file is hosted. Under ' Authorization' select the authentication type to authorize the threat feed update. Select 'Validate server certificate' if you want to validate the server certificate Select the polling interval to synchronize the threat feed. Click on 'Test Connection' to test the connection and then Save the configuration.
remediation:
  type: iac_patch
  command: Navigate to Protect > Active threat response > Third-party feeds > Add Select the Action either 'Block' or 'Monitor' Indicator type from 'IPv4 address' , 'Domain'  or 'URL' Enter the 'External URL' where the threat feed file is hosted. Under ' Authorization' select the authentication type to authorize the threat feed update. Select 'Validate server certificate' if you want to validate the server certificate Select the polling interval to synchronize the threat feed. Click on 'Test Connection' to test the connection and then Save the configuration.
