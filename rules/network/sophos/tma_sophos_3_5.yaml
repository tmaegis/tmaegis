id: TMA-SOPHOS-3.5
title: Ensure No Expired Subscription Licenses
description: Licensing is used to enable various features on Sophos Firewall regardless whether the license is for hardware or software/virtual firewall. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: medium
tags:
- sophos
- updates
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 3.5 Ensure No Expired Subscription Licenses
audit:
  type: manual
  command: Navigate to 'System > Administration > Licensing'. Verify under 'Module subscription details' under 'Status' to ensure there is no expired licenses for all the subscriptions.
remediation:
  type: iac_patch
  command: Navigate to 'System > Administration > Licensing'. Under 'Module subscription details' and click 'Synchronize' to connect to the licensing server to get latest subscription details. Or contact Sophos immediately to renew the expired licenses.
