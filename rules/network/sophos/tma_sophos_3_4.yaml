id: TMA-SOPHOS-3.4
title: Ensure Sophos Firewall takes encrypted backup of the configuration and send to designated email address with scheduled frequency
description: Set Sophos Firewall to send encrypted backup of the configuration to administrators' email address or store at the backup FTP server. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- crypto
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 3.4 Ensure Sophos Firewall takes encrypted backup of the configuration and send to designated email address with scheduled frequency
audit:
  type: manual
  command: Navigate to 'System > Backup & Firmware > Backup & Restore > Backup'. Backup mode is set to either 'FTP' or 'Email'. When 'Backup mode' is set to 'FTP', verify that 'FTP server IP', 'Username' or 'FTP password' is set. When 'Backup mode' is set to 'Email' verify that 'Email Address' is set to the administrators' email address. Verify that 'Frequency' is set to 'Daily, Weekly or Monthly'. Verify that 'Encryption password' is set and ensure that encrypted backup can be sent successfully.
remediation:
  type: iac_patch
  command: Navigate to 'System > Backup & Firmware > Backup & Restore > Backup'. Backup mode is set to either 'FTP' or 'Email'. When 'Backup mode' is set to 'FTP', configure 'FTP server IP', 'Username' or 'FTP password'. When 'Backup mode' is set to 'Email', configure 'Email Address' to the administrators' email address. 'Frequency' is set to 'Daily, Weekly or Monthly'. Set strong 'Encryption password' and ensure that encrypted backup can be sent successfully. Store the 'Encryption password' in secure location for future recovery.
