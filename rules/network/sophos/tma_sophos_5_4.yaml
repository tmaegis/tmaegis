id: TMA-SOPHOS-5.4
title: Ensure Intrusion Prevention(IPS) policy is configured on active firewall rules
description: Network attacks can be prevented using IPS rules. The firewall matches signatures with traffic patterns and takes the action specified in the rule. IPS signatures identify threats and specify a recommended action to take when the firewall encounters matching traffic. Signatures are specific to applications, services, or platforms. The firewall includes predefined signatures and you can also create custom signatures. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 2
severity: high
tags:
- sophos
- threat-prevention
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 5.4 Ensure Intrusion Prevention(IPS) policy is configured on active firewall rules
audit:
  type: manual
  command: 'Navigate to ''Rules and policies > Firewall rules''. Navigate to configured firewall rules. Verify that ''Detect and prevent exploits (IPS)'' is configured with appropriate IPS rule based on the direction of the traffic. Either one of these rule should be present generalpolicy, lantowan_strict, lantowan_general, dmzpolicy, LAN TO WAN, LAN TO DMZ, WAN TO DMZ, WAN TO LAN, DMZ TO WAN, DMZ TO LAN or "custom IPS rule". It''s recommended to have IPS rule with client-side exploitation protection policy for user network with allowed outgoing. (Full steps: CIS 5.4.)'
remediation:
  type: iac_patch
  command: |-
    Navigate to 'Protect > Intrusion prevention > IPS policies > Enable IPS protection'
    Navigate to 'Rules and policies > Firewall rules'.
    Navigate to configured firewall rules. Set 'Detect and prevent exploits (IPS)' with appropriate IPS rule based on the direction of the traffic. Configure IPS policy with generalpolicy, lantowan_strict, lantowan_general, dmzpolicy, LAN TO WAN, LAN TO DMZ, WAN TO DMZ, WAN TO LAN, DMZ TO WAN, DMZ TO LAN or "custom IPS rule". Set IPS rule with client-side exploitation protection policy for user network with outgoing allowed. And similar policy with server side protection for any incoming firewall rules from WAN zone.
