id: TMA-SOPHOS-4.5
title: Ensure MDR Threat Feeds is enabled
description: MDR Threat Feeds is Sophos Managed Detection and Response (MDR) service that is integrated with the firewall. Sophos MDR analysts can push threat intelligence to the firewall directly from Sophos Central, allowing the firewall to coordinate defenses immediately. The feed is based on your network's traffic related to malicious servers. The firewall automatically blocks traffic based on the IPv4 addresses, domains, and URLs in the MDR threat feeds. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 2
severity: high
tags:
- sophos
- threat-prevention
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 4.5 Ensure MDR Threat Feeds is enabled
audit:
  type: manual
  command: 'Navigate to Protect > Active threat response > MDR threat feeds Enable ''MDR threat feeds'' Select the Action ''Log Only'' or ''Log and drop'' Log only: Only logs the threats. Log and drop: Logs and blocks threats.'
remediation:
  type: iac_patch
  command: 'Navigate to Protect > Active threat response > MDR threat feeds Enable ''MDR threat feeds'' Select the Action ''Log Only'' or ''Log and drop'' Log only: Only logs the threats. Log and drop: Logs and blocks threats.'
