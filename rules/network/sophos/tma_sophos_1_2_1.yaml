id: TMA-SOPHOS-1.2.1
title: Ensure SNMPv3 is selected for queries and traps
description: SNMP (Simple Network Management Protocol) gives access to Sophos Firewall information such as status of the firewall, service availability, CPU, memory and disk usage. Although Sophos Firewall supports SNMPv1 and SNMPv2c protocols, you should always use SNMPv3 for user and the authorized hosts to send traps. Specify encryption and authentication settings to ensure confidentiality, message integrity, and user validity. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- snmp
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.2.1 Ensure SNMPv3 is selected for queries and traps
audit:
  type: manual
  command: Navigate to 'System > Administration > SNMP'. Verify that SNMPv1 and v2 are not configured. Verify that 'SNMPv3 users and traps > Encryption algorithm' is configured with either AES or DES. Set appropriate password strength for both authentication and encryption.
remediation:
  type: iac_patch
  command: Navigate to 'System > Administration > SNMP'. Remove insecure SNMPv1 and v2 configurations. Set 'SNMPv3 users and traps > Encryption algorithm' is configured with either AES or DES. Set appropriate password strength for both authentication and encryption.
