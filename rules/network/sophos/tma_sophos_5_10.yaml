id: TMA-SOPHOS-5.10
title: Ensure No Firewall Rules with source 'ANY', service 'ANY' and destination 'ANY' from 'WAN' Zone
description: Allowed firewall rules with no specific source or ANY service definitions from WAN/untrusted zone could lead to unintended exposure to the outside threats. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- firewall-policy
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 5.10 Ensure No Firewall Rules with source 'ANY', service 'ANY' and destination 'ANY' from 'WAN' Zone
audit:
  type: manual
  command: Navigate to 'Protect > Rules and policies > Firewall rules'. Filter 'Destination zone' to 'LAN' or 'DMZ'. Verify that no allowed firewall rules from 'WAN' zone with service definition 'ANY' to 'LAN' or 'DMZ' zone with destination network set to 'ANY'.
remediation:
  type: iac_patch
  command: Navigate to 'Protect > Rules and policies > Firewall rules'. Filter 'Destination zone' to 'LAN' or 'DMZ'. Remove allowed firewall rules from 'WAN' zone with service definition 'ANY' to 'LAN' or 'DMZ' zone with destination network set to 'ANY'. Or change the rule to specific source/destination with target service definition.
