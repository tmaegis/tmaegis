id: TMA-SOPHOS-1.1.3
title: Ensure NTP servers are configured appropriately
description: Synchronize the clock on Sophos firewall with NTP servers. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: medium
tags:
- sophos
- time
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.1.3 Ensure NTP servers are configured appropriately
audit:
  type: manual
  command: Navigate to 'System > Administration > Time'. Verify that 'Time Zone' is set correctly. Verify that 'Use pre-defined NTP Server' Or 'Use custom NTP Server' is checked and synchronize the device's clock.
remediation:
  type: iac_patch
  command: Navigate to 'System > Administration > Time'. Set 'Time Zone' correctly. Set 'Use pre-defined NTP Server' Or 'Use custom NTP Server' is checked and synchronize the device's clock.
