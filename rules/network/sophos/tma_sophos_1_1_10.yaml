id: TMA-SOPHOS-1.1.10
title: Set Hostname
description: A hostname on a Sophos Firewall is simply the human-friendly name assigned to the device. It identifies the firewall on the network, in logs, in monitoring systems, and in Sophos Central. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: low
tags:
- sophos
- hardening
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.1.10 Set Hostname
audit:
  type: manual
  command: 'Check the hostname shown at the top-left of the web admin dashboard, or Administration > Device access > Hostname (older SFOS: System > Administration > Hostname), or run ''hostname'' from the advanced shell. It must be a unique, organisation-defined name, not the factory default.'
remediation:
  type: iac_patch
  command: |-
    GUI: Administration > Device access > Hostname: enter the new hostname (e.g. FW-HQ-EDGE01), Apply.
    CLI (advanced shell): set hostname <your-hostname>
