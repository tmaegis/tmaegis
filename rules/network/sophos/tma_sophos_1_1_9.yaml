id: TMA-SOPHOS-1.1.9
title: Ensure MFA for default admin
description: Implementing MFA strengthens the security of firewall console access by requiring an additional verification step, helping ensure that only authorized administrators can make changes to firewall configurations. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- authentication
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.1.9 Ensure MFA for default admin
audit:
  type: manual
  command: Navigate to ' System ' > 'Administration' > 'Device Access ' > 'Multi-factor Authentication for default admin' Turn ' ON ' MFA for default admin MFA doesn't apply to SSH sign-ins, allowing you to recover the account
remediation:
  type: iac_patch
  command: Navigate to ' System ' > 'Administration' > 'Device Access ' > 'Multi-factor Authentication for default admin' Turn ' ON ' MFA for default admin MFA doesn't apply to SSH sign-ins, allowing you to recover the account
