id: TMA-SOPHOS-1.1.2
title: Ensure login disclaimer is set
description: Configure a login disclaimer, ideally approved by the organization's legal team. This banner should at minimum prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word "welcome" or similar words of invitation. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: low
tags:
- sophos
- banner
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.1.2 Ensure login disclaimer is set
audit:
  type: manual
  command: Navigate to 'System > Administration > Admin and User Settings > Login Disclaimer Settings'. Verify 'Enable login disclaimer' is checked and disclaimer message is set appropriately.
remediation:
  type: iac_patch
  command: Navigate to 'System > Administration > Admin and User Settings > Login Disclaimer Settings'. 'Enable login disclaimer' is checked and set the disclaimer message appropriately.
