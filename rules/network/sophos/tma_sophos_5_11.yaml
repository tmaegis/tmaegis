id: TMA-SOPHOS-5.11
title: Ensure a Optimal Firewall health check score
description: Health check feature provides quick visibility into the overall security readiness and hygiene of the firewall deployment. It highlights the missing configurations, shows which issues are high, medium or low impact to prioritize them. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 2
severity: low
tags:
- sophos
- hardening
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 5.11 Ensure a Optimal Firewall health check score
audit:
  type: manual
  command: Navigate to ' Monitor & Analyze' > 'Firewall Health check' Policy compliance shows you the Compliant and Non-compliant status. It shows Compliant or Non-Compliant Status for Individual Policies. Under 'Action ' for Non-Compliant policy, select ' Fix '. This navigates you to configuration page for that control.
remediation:
  type: iac_patch
  command: Navigate to ' Monitor & Analyze' > 'Firewall Health check' Policy compliance shows you the Compliant and Non-compliant status. It shows Compliant or Non-Compliant Status for Individual Policies. Under 'Action ' for Non-Compliant policy, select ' Fix '. This navigates you to configuration page for that control.
