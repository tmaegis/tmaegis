id: TMA-SOPHOS-5.3
title: Ensure Application filter is set to block high risk (Risk Level 4 and 5) applications
description: When there is a firewall rule to allow outgoing traffic, configure it to identify and control Layer-7 applications and drop traffic that are classified under high risk applications (Risk Level 4 and 5) with application filter. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 2
severity: medium
tags:
- sophos
- threat-prevention
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 5.3 Ensure Application filter is set to block high risk (Risk Level 4 and 5) applications
audit:
  type: manual
  command: Navigate to 'Rules and policies > Firewall rules'. Verify that configured outgoing firewall rules with 'Identify and control applications (App control)' is set to 'Block high risk (Risk Level 4 and 5) apps'.
remediation:
  type: iac_patch
  command: Navigate to 'Rules and policies > Firewall rules'. Set the configured outgoing firewall rules with 'Identify and control applications (App control)' to 'Block high risk (Risk Level 4 and 5) apps'.
