id: TMA-SOPHOS-1.1.8
title: Ensure MFA for Web console access and remote access VPN
description: MFA adds an extra layer of security to the firewall's web console access. Enforcing MFA significantly reduces the risk of unauthorized configuration changes to the firewall. Similarly, enforcing MFA for the VPN connections adds an additional verification factor beyond passwords, ensuring that only verified users can establish a VPN session Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- authentication
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 1.1.8 Ensure MFA for Web console access and remote access VPN
audit:
  type: manual
  command: Navigate to ' Configure ' > 'Authentication' > 'Multi-factor authentication' > 'Multi-factor authentication settings' Select ' Specific Users and groups ' > ' Add the user or group ' Enable ' Generate OTP toles with next sign-in ' for automatic creation of OTP tokens. To enable MFA for Web admin console access, Enable Require MFA for 'Web admin console' To enable MFA for remote access VPN (IPsec and SSL VPN), Enable Require MFA for 'SSL VPN remote access' and 'IPSec remote access'
