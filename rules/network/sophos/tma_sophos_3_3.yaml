id: TMA-SOPHOS-3.3
title: Ensure ‘Hotfix' is set to ‘Allow Automatic Installation of hotfixes'
description: Set hotfixes to be applied automatically whenever there is an out-of-band security update is available for the device. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: medium
tags:
- sophos
- updates
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 3.3 Ensure ‘Hotfix' is set to ‘Allow Automatic Installation of hotfixes'
audit:
  type: manual
  command: Access Sophos CLI 'Select Option 4> system hotfix show'. Verify that 'system hotfix show output is Hotfix is enabled'.
remediation:
  type: iac_patch
  command: |-
    Access the Sophos CLI, select option 4 (Device Console) and run: system hotfix enable
    Confirm with: system hotfix show (output: Hotfix is enabled).
