id: TMA-SOPHOS-5.8
title: Ensure Firewall Rules with SMB, Netbios, RDP and other unencrypted protocols should not be directly accessible from WAN Zone
description: Window service ports directly accessible from WAN zone could lead to bruteforce attempts, wormable attacks and other unpatched vulnerabilities. Unencrypted protocols that could potentially impact confidentiality, integrity and availability shouldn't be directly accessible from the WAN Zone. Reviewed in the Sophos Firewall web admin console (SFOS has no plain-text configuration export to audit offline).
target: sophos
level: 1
severity: high
tags:
- sophos
- crypto
reference: CIS Sophos Firewall v22 Benchmark v1.0.0 - 5.8 Ensure Firewall Rules with SMB, Netbios, RDP and other unencrypted protocols should not be directly accessible from WAN Zone
audit:
  type: manual
  command: Navigate to 'Rules and policies > Firewall rules'. Verify the 'Firewall rules' with 'Source zone' 'WAN' with service ports 'TCP/UDP 445,137-139,3389,21,79,23,113,135,513,389,1433,5800,5900' exists in the allowed rules.
remediation:
  type: iac_patch
  command: Navigate to 'Rules and policies > Firewall rules'. Disable or only allow with specific source IP address in 'Firewall rules' with 'Source zone' 'WAN' with service ports 'TCP/UDP 445,137- 139,3389,21,79,23,113,135,513,389,1433,5800,5900'. When absolute necessary to allow access from Internet, consider the use of VPN.
