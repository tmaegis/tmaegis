id: TMA-F5-BIGIP-5.4
title: Ensure to disable unused services in BIG-IP configuration
description: To disable unused BIG-IP system daemons
target: f5-bigip
level: 1
severity: medium
tags:
- f5-bigip
- hardening
reference: CIS F5 Networks Benchmark v1.0.0 - 5.4 Ensure to disable unused services in BIG-IP configuration
audit:
  type: manual
  command: 1- Log in to the Configuration utility. 2- Go to System > Services > Services List 3-Check running service
remediation:
  type: iac_patch
  command: |-
    1- Log in to the Configuration utility.
    2- Go to System > Services > Services List
    3-Select the unnecessary services you want to disable , then click "stop"
    4-Click OK
