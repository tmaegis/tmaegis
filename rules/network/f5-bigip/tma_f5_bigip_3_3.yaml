id: TMA-F5-BIGIP-3.3
title: Ensure access to Configuration utility is restricted to needed IP addresses only
description: 'It is recommended to maintain secure access to the GUI by allowing only trusted IP addresses or range of IP addresses PASS requires sys httpd allow to be a list of addresses (not All). Audited against tmsh output with defaults shown: save the concatenated output of ''tmsh list auth password-policy all-properties'', ''tmsh list auth source all-properties'', ''tmsh list auth remote-user all-properties'', ''tmsh list auth radius all-properties'', ''tmsh list sys httpd all-properties'', ''tmsh list sys sshd all-properties'', ''tmsh list sys global-settings all-properties'', ''tmsh list cli global-settings all-properties'', ''tmsh list sys ntp'', ''tmsh list sys snmp all-properties'', ''tmsh list sys syslog'' and ''tmsh list net self all-properties''. Patterns are scoped to the named top-level block.'
target: f5-bigip
level: 1
severity: high
tags:
- f5-bigip
- management
reference: CIS F5 Networks Benchmark v1.0.0 - 3.3 Ensure access to Configuration utility is restricted to needed IP addresses only
audit:
  type: config_regex
  pattern: (?m)^sys httpd \{\n(?:[ \t]+[^\n]*\n)*?[ \t]+allow \{ (?:[0-9a-fA-F.:/\-]+ )+\}[ \t]*$
remediation:
  type: iac_patch
  command: |-
    tmsh modify sys httpd allow replace-all-with { 10.0.0.0/255.255.255.0 }
    tmsh save sys config
    # CIS guidance:
    If the output of the above command show ALL, the following command would be executed to modify the settings:
    modify modify /sys httpd allow replace-all-with { <IP address or IP address
    }
