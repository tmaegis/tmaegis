id: TMA-F5-BIGIP-6.3
title: Ensure to lockdown access logs to "Administrator , Resource Administrator and Auditor " roles only
description: To restrict access to the system logs.
target: f5-bigip
level: 1
severity: medium
tags:
- f5-bigip
- authentication
reference: CIS F5 Networks Benchmark v1.0.0 - 6.3 Ensure to lockdown access logs to "Administrator , Resource Administrator and Auditor " roles only
audit:
  type: manual
  command: 1-Login to Configuration utility 2-Go to System > Logs > Configuration > Options 3-Under "Log Access" , check who are allowed to access the logs.
remediation:
  type: iac_patch
  command: |-
    1-Login to Configuration utility
    2-Go to System > Logs > Configuration > Options
    3- Under Log Access : select "Allow" for:
    Administrator Resource Administrator Auditor Select "Deny" for other users .
