id: TMA-F5-BIGIP-6.4
title: Ensure that audit logging for "MCP, tmsh and GUI" is set to enabled
description: To enable audit logging on configuration changes that users or services make to the BIG-IP system.
target: f5-bigip
level: 1
severity: medium
tags:
- f5-bigip
- logging
reference: CIS F5 Networks Benchmark v1.0.0 - 6.4 Ensure that audit logging for "MCP, tmsh and GUI" is set to enabled
audit:
  type: manual
  command: '1-Login to Configuration utility 2-Go to System > Logs > Configuration > Options 3- Under Audit Logging : check MCP,tmsh and GUI'
remediation:
  type: iac_patch
  command: |-
    1-Login to Configuration utility
    2-Go to System > Logs > Configuration > Options
    3- Under Audit Logging :
    Select "Enable" for all items : "MCP" , "tmsh" and "GUI"
