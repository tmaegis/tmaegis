id: TMA-F5-BIGIP-2.6
title: Ensure External Users' Terminal Access is Disabled
description: 'To prevent remote users from gaining terminal access PASS requires auth remote-user remote-console-access disabled. Audited against tmsh output with defaults shown: save the concatenated output of ''tmsh list auth password-policy all-properties'', ''tmsh list auth source all-properties'', ''tmsh list auth remote-user all-properties'', ''tmsh list auth radius all-properties'', ''tmsh list sys httpd all-properties'', ''tmsh list sys sshd all-properties'', ''tmsh list sys global-settings all-properties'', ''tmsh list cli global-settings all-properties'', ''tmsh list sys ntp'', ''tmsh list sys snmp all-properties'', ''tmsh list sys syslog'' and ''tmsh list net self all-properties''. Patterns are scoped to the named top-level block.'
target: f5-bigip
level: 1
severity: medium
tags:
- f5-bigip
- authentication
reference: CIS F5 Networks Benchmark v1.0.0 - 2.6 Ensure External Users' Terminal Access is Disabled
audit:
  type: config_regex
  pattern: (?m)^auth remote-user \{\n(?:[ \t]+[^\n]*\n)*?[ \t]+remote-console-access disabled[ \t]*$
remediation:
  type: iac_patch
  command: |-
    tmsh modify auth remote-user remote-console-access disabled
    tmsh save sys config
    # CIS guidance:
    1. Log in to the Configuration utility.
    2. Go to System > Users > Authentication.
    3. Under External Users , click "Change".
    4. Set Terminal Access as "Disabled"
