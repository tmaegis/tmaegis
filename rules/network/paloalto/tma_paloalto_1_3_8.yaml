id: TMA-PALOALTO-1.3.8
title: Ensure 'New Password Differs By Characters' is greater than or equal to 3
description: 'This checks all new passwords to ensure that they differ by at least three characters from the previous password. PASS requires new-password-differs-by-characters of 3 or more. Audited against the PAN-OS running configuration in set format: run ''set cli config-output-format set'', then ''configure'' and ''show'' (or ''show config running'') and save the full output.'
target: paloalto
level: 1
severity: high
tags:
- paloalto
- authentication
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 1.3.8 Ensure 'New Password Differs By Characters' is greater than or equal to 3
audit:
  type: config_regex
  pattern: (?m)^set mgt-config password-complexity new-password-differs-by-characters (?:[3-9]|[1-9]\d+)[ \t]*$
remediation:
  type: iac_patch
  command: |-
    configure
    set mgt-config password-complexity new-password-differs-by-characters 3
    commit
    # CIS guidance:
    Navigate to Device > Setup > Management > Minimum Password Complexity Set New Password Differs By Characters to 3 or more
