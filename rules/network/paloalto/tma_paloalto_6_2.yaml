id: TMA-PALOALTO-6.2
title: Ensure a secure antivirus profile is applied to all relevant security policies
description: Create a secure antivirus profile and apply it to all security policies that could pass HTTP, SMTP, IMAP, POP3, FTP, or SMB traffic. The antivirus profile may be applied to the security policies directly or through a profile group.
target: paloalto
level: 1
severity: high
tags:
- paloalto
- threat-prevention
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.2 Ensure a secure antivirus profile is applied to all relevant security policies
audit:
  type: manual
  command: Navigate to Policies > Security . For each policy, navigate to [Policy Name] > Actions Verify there is a secure Antivirus profile applied to all security policies passing traffic - regardless of protocol. This can be set by Profiles or by Profile Group.
remediation:
  type: iac_patch
  command: Navigate to Policies > Security . For each policy, navigate to [Policy Name] > Actions Set an Antivirus profile or a Profile Group containing an AV profile for each security policy passing traffic - regardless of protocol.
