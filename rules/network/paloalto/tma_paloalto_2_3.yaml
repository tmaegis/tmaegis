id: TMA-PALOALTO-2.3
title: Ensure that User-ID is only enabled for internal trusted interfaces
description: Only enable the User-ID option for interfaces that are both internal and trusted. There is rarely a legitimate need to allow WMI probing (or any user-id identification) on an untrusted interface. The exception to this is identification of remote-access VPN users, who are identified as they connect.
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- authentication
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 2.3 Ensure that User-ID is only enabled for internal trusted interfaces
audit:
  type: manual
  command: Navigate to Network > Network Profiles > Interface Management. Verify that User-ID is only enabled for interfaces that are both internal and trusted.
remediation:
  type: iac_patch
  command: Navigate to Network > Network Profiles > Interface Management. Set User-ID to be checked only for interfaces that are both internal and trusted; uncheck it for all other interfaces.
