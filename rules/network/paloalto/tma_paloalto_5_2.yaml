id: TMA-PALOALTO-5.2
title: Ensure a WildFire Analysis profile is enabled for all security policies
description: Ensure that all files traversing the firewall are inspected by WildFire by setting a Wildfire file blocking profile on all security policies.
target: paloalto
level: 1
severity: high
tags:
- paloalto
- threat-prevention
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 5.2 Ensure a WildFire Analysis profile is enabled for all security policies
audit:
  type: manual
  command: 'Objects > Security Profiles > WildFire Analysis: verify a profile exists (Application any, File Types any, Direction both). For each Security rule with action Allow, Actions > Profile Setting must set a WildFire Analysis profile, or a Security Profile Group that includes one.'
remediation:
  type: iac_patch
  command: |-
    Navigate to Objects > Security Profiles > WildFire Analysis Profile and create a profile with Application Any, File Types Any and Direction Both.
    Navigate to Policies > Security. For each Security Policy Rule where the action is Allow, set Actions > Profile Setting > WildFire Analysis to that profile, or use a Security Profile Group that contains it.
