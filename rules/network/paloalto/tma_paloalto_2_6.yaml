id: TMA-PALOALTO-2.6
title: Ensure that the User-ID service account does not have interactive logon rights
description: Restrict the User-ID service account from interactively logging on to systems in the Active Directory domain.
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- authentication
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 2.6 Ensure that the User-ID service account does not have interactive logon rights
audit:
  type: manual
  command: Navigate to Active Directory Group Policies. Verify that Group Policies restricts the interactive logon privilege for the User-ID service account. or Navigate to Active Directory Managed Service Accounts. Verify that Managed Service Accounts restricts the interactive logon privilege for the User-ID service account.
remediation:
  type: iac_patch
  command: |-
    Navigate to Active Directory Group Policies. Set Group Policies to restrict the interactive logon privilege for the User-ID service account. or
    Navigate to Active Directory Managed Service Accounts. Set Managed Service Accounts to restrict the interactive logon privilege for the User-ID service account.
