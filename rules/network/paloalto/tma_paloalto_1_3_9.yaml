id: TMA-PALOALTO-1.3.9
title: Ensure 'Prevent Password Reuse Limit' is set to 24 or more passwords
description: 'This determines the number of unique passwords that have to be most recently used for a user account before a previous password can be reused. PASS requires password-history-count of 24 or more. Audited against the PAN-OS running configuration in set format: run ''set cli config-output-format set'', then ''configure'' and ''show'' (or ''show config running'') and save the full output.'
target: paloalto
level: 1
severity: high
tags:
- paloalto
- authentication
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 1.3.9 Ensure 'Prevent Password Reuse Limit' is set to 24 or more passwords
audit:
  type: config_regex
  pattern: (?m)^set mgt-config password-complexity password-history-count (?:2[4-9]|[3-9]\d|[1-9]\d\d+)[ \t]*$
remediation:
  type: iac_patch
  command: |-
    configure
    set mgt-config password-complexity password-history-count 24
    commit
    # CIS guidance:
    Navigate to Device > Setup > Management > Minimum Password Complexity. Set Prevent Password Reuse Limit to greater than or equal to 24
