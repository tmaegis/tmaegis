id: TMA-PALOALTO-2.4
title: Ensure that 'Include/Exclude Networks' is used if User-ID is enabled
description: If User-ID is configured, use the Include/Exclude Networks section to limit the User-ID scope to operate only on trusted networks. There is rarely a legitimate need to allow WMI probing or other User identification on an untrusted network.
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- authentication
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 2.4 Ensure that 'Include/Exclude Networks' is used if User-ID is enabled
audit:
  type: manual
  command: Navigate to Device > User Identification > User Mapping > Include/Exclude Networks. Verify that all trusted internal networks have a Discovery value of Include. Verify that all untrusted external networks have a Discovery value of Exclude. Note that any value in the trusted networks list implies that all other networks are untrusted.
remediation:
  type: iac_patch
  command: Navigate to Device > User Identification > User Mapping > Include/Exclude Networks. Set all trusted internal networks to have a Discovery value of Include. Set all untrusted external networks to have a Discovery value of Exclude. Note that any value in the trusted networks list implies that all other networks are untrusted.
