id: TMA-PALOALTO-6.12
title: Ensure secure URL filtering is enabled for all security policies allowing traffic to the Internet
description: Apply a secure URL filtering profile to all security policies permitting traffic to the Internet. The URL Filtering profile may be applied to the security policies directly or through a profile group.
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- threat-prevention
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.12 Ensure secure URL filtering is enabled for all security policies allowing traffic to the Internet
audit:
  type: manual
  command: 'To Verify URL Filtering: For each Security Policy that transits traffic to the public internet, navigate to Policies > Security > Security Profiles > [Policy Name] > Actions. Verify there is a URL Filtering profile that complies with the policies of the organization is applied to all Security Policies that transit traffic to the public internet.'
remediation:
  type: iac_patch
  command: 'To Set URL Filtering: For each Security Profile that transits traffic to the internet, navigate to Policies > Security > Security Profiles > [Policy Name] > Actions. Set a URL Filtering profile that complies with the policies of the organization is applied to all Security Policies that transit traffic to the public internet.'
