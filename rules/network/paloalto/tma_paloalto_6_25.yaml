id: TMA-PALOALTO-6.25
title: Ensure that 'DNS Policies' is configured on Anti-Spyware profiles if 'DNS Security' license is available
description: DNS security is an extensible cloud-based service capable of generating DNS signatures using advanced predictive analytics and machine learning. DNS Security protects from sophisticated DNS-based attacks.
target: paloalto
level: 1
severity: high
tags:
- paloalto
- threat-prevention
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.25 Ensure that 'DNS Policies' is configured on Anti-Spyware profiles if 'DNS Security' license is available
audit:
  type: manual
  command: 'Objects > Security Profiles > Anti-Spyware > DNS Policies (requires a DNS Security licence): confirm the policy action is sinkhole for every DNS Security category, and that the Command and Control Domains category uses packet capture extended-capture.'
remediation:
  type: iac_patch
  command: Navigate to Objects > Security Profiles > Anti-Spyware Go to DNS Policies tab. Configure policy action to sinkhole for all DNS Security categories. On Command and control Domains category, set the packet capture option to extended-capture.
