id: TMA-PALOALTO-1.3.3
title: Ensure 'Minimum Uppercase Letters' is greater than or equal to 1
description: 'This checks all new passwords to ensure that they contain at least one English uppercase character (A through Z). PASS requires minimum-uppercase-letters of 1 or more. Audited against the PAN-OS running configuration in set format: run ''set cli config-output-format set'', then ''configure'' and ''show'' (or ''show config running'') and save the full output.'
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- hardening
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 1.3.3 Ensure 'Minimum Uppercase Letters' is greater than or equal to 1
audit:
  type: config_regex
  pattern: (?m)^set mgt-config password-complexity minimum-uppercase-letters [1-9]\d*[ \t]*$
remediation:
  type: iac_patch
  command: |-
    configure
    set mgt-config password-complexity minimum-uppercase-letters 1
    commit
    # CIS guidance:
    Navigate to Device > Setup > Management > Minimum Password Complexity Set Minimum Uppercase Letters to greater than or equal to 1
