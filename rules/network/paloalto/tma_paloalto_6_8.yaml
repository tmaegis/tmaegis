id: TMA-PALOALTO-6.8
title: Ensure that PAN-DB URL Filtering is used
description: Configure the device to use PAN-DB URL Filtering instead of BrightCloud.
target: paloalto
level: 1
severity: medium
tags:
- paloalto
- threat-prevention
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.8 Ensure that PAN-DB URL Filtering is used
audit:
  type: manual
  command: Navigate to Device > Licenses. Click on PAN-DB URL Filtering. Verify Active is set to Yes.
remediation:
  type: iac_patch
  command: Navigate to Device > Licenses. Click on PAN-DB URL Filtering. Set Active to Yes.
