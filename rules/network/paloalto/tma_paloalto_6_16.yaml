id: TMA-PALOALTO-6.16
title: Ensure that a Zone Protection Profile with tuned Flood Protection settings enabled for all flood types is attached to all untrusted zones
description: Enable all Flood Protection options in the Zone Protection Profile attached to all untrusted zones. The Alert, Activate, and Maximum settings for Flood Protection depend highly on the environment and device used. Perform traffic analysis on the specific environment and firewall to determine accurate thresholds. Do not rely on default values to be appropriate for an environment. Setting these values for all interfaces is an approach that should be considered by many organizations, as traffic floods can result from internal testing or malware as well.
target: paloalto
level: 2
severity: medium
tags:
- paloalto
- firewall-policy
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.16 Ensure that a Zone Protection Profile with tuned Flood Protection settings enabled for all flood types is attached to all untrusted zones
audit:
  type: manual
  command: 'Network > Network Profiles > Zone Protection > Flood Protection: confirm SYN, UDP, ICMP, ICMPv6 and Other IP flood protection are all enabled with at least default thresholds, and that every untrusted zone (Network > Zones) uses the profile. CLI: show network profiles zone-protection-profile <name> flood.'
remediation:
  type: iac_patch
  command: |-
    In the GUI:
    Navigate to Network > Network Profiles > Zone Protection > Flood Protection. Set all settings to "enabled" with at least the default values.
    Navigate to Network > Zones, select each untrusted zone in turn, and set the Zone Protection Profile.
