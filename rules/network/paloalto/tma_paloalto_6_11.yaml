remediation:
  type: iac_patch
  command: |-
    configure
    set profiles url-filtering <profile> log-container-page-only no
    set profiles url-filtering <profile> log-http-hdr-user-agent yes
    set profiles url-filtering <profile> log-http-hdr-referer yes
    set profiles url-filtering <profile> log-http-hdr-xff yes
    commit
    # CIS guidance:
    Navigate to Objects > Security Profiles > URL Filtering > URL Filtering Profile > URL Filtering Settings. Set the following four settings:
    a. Log container page only box is un-checked
    b. Check the User-Agent box
    c. Check the Referer box
    d. Check the X-Forwarded-For box
