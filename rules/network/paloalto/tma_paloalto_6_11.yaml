id: TMA-PALOALTO-6.11
title: Ensure all HTTP Header Logging options are enabled
description: 'Enable all options (User-Agent, Referer, and X-Forwarded-For) for HTTP header logging. PASS requires log-container-page-only no and user-agent, referer and X-Forwarded-For header logging enabled. Audited against the PAN-OS running configuration in set format: run ''set cli config-output-format set'', then ''configure'' and ''show'' (or ''show config running'') and save the full output.'
target: paloalto
level: 1
severity: high
tags:
- paloalto
- logging
reference: CIS Palo Alto Firewall 11 Benchmark v1.2.0 - 6.11 Ensure all HTTP Header Logging options are enabled
