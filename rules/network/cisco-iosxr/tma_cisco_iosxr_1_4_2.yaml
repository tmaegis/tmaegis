id: TMA-CISCO-IOSXR-1.4.2
title: Set 'buffer size'
description: Enable system message logging to a local buffer. The device can copy and store log messages to an internal memory buffer. The buffered data is available only from a router exec or enabled exec session. This form of logging is useful for debugging and monitoring when logged in to a router. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- hardening
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.4.2 Set 'buffer size'
audit:
  type: config_regex
  pattern: (?m)^logging buffered \d+
remediation:
  type: iac_patch
  command: |-
    ! Configure buffered logging (with minimum size). Recommended size is 64000.
    logging buffered {logging_buffer_size}
