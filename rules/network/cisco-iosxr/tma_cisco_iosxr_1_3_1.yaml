id: TMA-CISCO-IOSXR-1.3.1
title: Disable CDP
description: 'Disable Cisco Discovery Protocol (CDP) service at device level. The Cisco Discovery Protocol is a proprietary protocol that Cisco devices use to identify each other on a LAN segment. It is useful only in network monitoring and troubleshooting situations but is considered a security risk because of the amount of ... CIS marks this Manual; automated: fails if CDP is enabled globally (''cdp''). Audited against the hierarchical output of ''show running-config'' (run ''terminal length 0'' first; not ''show running-config formal'').'
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- hardening
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.3.1 Disable CDP
audit:
  type: config_regex
  pattern: (?m)^cdp\s*$
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Disable Cisco Discovery Protocol (CDP) service globally.
    no cdp
