id: TMA-CISCO-IOSXR-1.1.4.2
title: command accounting
description: The router reports user activity to the TACACS+ or RADIUS security server in the form of accounting records. Each accounting record contains accounting AV pairs and is stored on the security server. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Fails if no 'aaa accounting commands' list exists or the console/line templates do not reference one. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- logging
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.1.4.2 command accounting
