id: TMA-CISCO-IOSXR-1.4.1
title: Enable logging
description: Enable logging of system messages. Logging provides a chronological record of activities on the Cisco device and allows monitoring of both operational and security related events. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- logging
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.4.1 Enable logging
audit:
  type: config_regex
  pattern: (?m)^logging trap \S+
remediation:
  type: iac_patch
  command: |-
    ! Enable system logging.
    logging trap {severity_level}
