id: TMA-CISCO-IOSXR-1.2.1
title: Set the 'hostname'
description: The hostname is used in prompts and default configuration filenames. The domain name is prerequisite for setting up SSH. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: low
tags:
- cisco-iosxr
- network
- hardening
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.2.1 Set the 'hostname'
audit:
  type: config_regex
  pattern: (?m)^hostname \S+
remediation:
  type: iac_patch
  command: |-
    ! Configure an appropriate host name for the router.
    hostname {hostname}
