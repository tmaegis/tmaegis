id: TMA-CISCO-IOSXR-1.4.3
title: Set 'logging console critical'
description: Verify logging to device console is enabled and limited to a rational severity level to avoid impacting system performance and management. This configuration determines the severity of messages that will generate console messages. Logging to console should be limited only to those messages required for immediate troubleshooting while logged into the device. CIS marks this Manual; automated as a config-line check. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- logging
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.4.3 Set 'logging console critical'
audit:
  type: config_regex
  pattern: (?m)^logging console critical\b
remediation:
  type: iac_patch
  command: |-
    ! Configure console logging level.
    logging console critical
