id: TMA-CISCO-IOSXR-1.5.2
title: Unset 'public' for 'snmp-server community'
description: An SNMP community string permits read-only access to all objects. The default community string "public" is well known. Using easy to guess, well known community string poses a threat that an attacker can effortlessly gain unauthorized access to the device. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: high
tags:
- cisco-iosxr
- network
- snmp
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.5.2 Unset 'public' for 'snmp-server community'
audit:
  type: config_regex
  pattern: (?m)(?i)^snmp-server community public(?:\s|$)
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Disable the default SNMP community string "public"
    no snmp-server community {community_string}
