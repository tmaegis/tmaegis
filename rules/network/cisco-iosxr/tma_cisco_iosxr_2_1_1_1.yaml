id: TMA-CISCO-IOSXR-2.1.1.1
title: Authentication (EIGRP)
description: 'Configure the EIGRP address family. Rationale: EIGRP is a true multi-protocol routing protocol and the ''address-family'' feature enables restriction of exchanges with specific neighbors. Passes when EIGRP is not configured. Audited against the hierarchical output of ''show running-config'' (run ''terminal length 0'' first; not ''show running-config formal'').'
target: cisco-iosxr
level: 2
severity: high
tags:
- cisco-iosxr
- network
- aaa
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 2.1.1.1 Authentication
audit:
  type: config_regex
  pattern: (?m)\A(?:[ \t]*(?:$|[^a \t\n]|a(?:$|[^u\n]|u(?:$|[^t\n]|t(?:$|[^h\n]|h(?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^t\n]|t(?:$|[^i\n]|i(?:$|[^c\n]|c(?:$|[^a\n]|a(?:$|[^t\n]|t(?:$|[^i\n]|i(?:$|[^o\n]|o(?:$|[^n\n]|n(?:$|[^ \n]| (?:$|[^k\n]|k(?:$|[^e\n]|e(?:$|[^y\n]|y(?:$|[^c\n]|c(?:$|[^h\n]|h(?:$|[^a\n]|a(?:$|[^i\n]|i(?:$|[^n\n]|n(?:$|[^ \n]))))))))))))))))))))))))[^\n]*\n)*[ \t]*router eigrp [^\n]*(?:\n(?:[ \t]*(?:$|[^a \t\n]|a(?:$|[^u\n]|u(?:$|[^t\n]|t(?:$|[^h\n]|h(?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^t\n]|t(?:$|[^i\n]|i(?:$|[^c\n]|c(?:$|[^a\n]|a(?:$|[^t\n]|t(?:$|[^i\n]|i(?:$|[^o\n]|o(?:$|[^n\n]|n(?:$|[^ \n]| (?:$|[^k\n]|k(?:$|[^e\n]|e(?:$|[^y\n]|y(?:$|[^c\n]|c(?:$|[^h\n]|h(?:$|[^a\n]|a(?:$|[^i\n]|i(?:$|[^n\n]|n(?:$|[^ \n]))))))))))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Configure the EIGRP address family.
    router eigrp {AS_number}
    address-family ipv4
    interface {interface}
    authentication keychain {key_chain_name}
