id: TMA-CISCO-IOSXR-1.5.7
title: Set 'priv' for each 'snmp-server group' using SNMPv3
description: Specifies authentication of a packet with encryption when using SNMPv3. SNMPv3 provides much improved security over previous versions by offering options for Authentication and Encryption of messages. When configuring a user for SNMPv3 you have the option of using a range of encryption schemes, or no encryption at all, to protect ... Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 2
severity: medium
tags:
- cisco-iosxr
- network
- snmp
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.5.7 Set 'priv' for each 'snmp-server group' using SNMPv3
audit:
  type: config_regex
  pattern: (?m)^snmp-server group \S+ v3 (?:auth|noauth)\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! For each SNMPv3 group created on your router add privacy options by issuing the following command...
    snmp-server group {snmp_group_name} v3 priv IPv4 {snmp_access-list}
