id: TMA-CISCO-IOSXR-2.2.1.2
title: Set 'ntp authentication-key'
description: Define an authentication key for Network Time Protocol (NTP). Using an authentication key provides a higher degree of security as only authenticated NTP servers will be able to update time for the Cisco device. CIS marks this Manual; automated as a config check under 'ntp'. Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 2
severity: high
tags:
- cisco-iosxr
- network
- ntp
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 2.2.1.2 Set 'ntp authentication-key'
audit:
  type: config_regex
  pattern: '(?m)^ntp[^\n]*\n(?:[ \t][^\n]*\n)*?[ \t]+authentication-key \d+ md5 '
remediation:
  type: iac_patch
  command: |-
    ! Configure at the NTP key ring and encryption key using the following command
    ntp authentication-key {ntp_key_id} md5 {ntp_key}
