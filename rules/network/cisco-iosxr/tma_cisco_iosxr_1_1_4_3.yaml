id: TMA-CISCO-IOSXR-1.1.4.3
title: network accounting
description: The router reports user activity to the TACACS+ or RADIUS security server in the form of accounting records. Each accounting record contains accounting AV pairs and is stored on the security server. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the hierarchical output of 'show running-config' (run 'terminal length 0' first; not 'show running-config formal').
target: cisco-iosxr
level: 1
severity: medium
tags:
- cisco-iosxr
- network
- logging
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 1.1.4.3 network accounting
audit:
  type: config_regex
  pattern: (?m)^aaa accounting network \S+ start-stop\b
remediation:
  type: iac_patch
  command: 'Configure an accounting list which includes the tacacs+ or radius server group, that was defined in the prerequisites or local or both: aaa accounting network default start-stop group {tacacs_group|radius_group}'
