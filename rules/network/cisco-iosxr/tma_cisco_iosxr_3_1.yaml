id: TMA-CISCO-IOSXR-3.1
title: URPF
description: 'Enable Unicast reverse path forwarding to prevent IP speeofing attacks. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-iosxr
level: 2
severity: medium
tags:
- cisco-iosxr
- network
- hardening
reference: CIS Cisco IOS XR 7.x Benchmark v1.0.1 - 3.1 URPF
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate key chain and mode are set on the appropriate interface(s) IOSXR#sh run interface mgmtEth 0/RP0/CPU0/0 Wed Jul 19 22:37:55.238 UTC interface MgmtEth0/RP0/CPU0/0 cdp ipv4 address dhcp ipv4 verify unicast source reachable-via rx'
remediation:
  type: iac_patch
  command: |-
    ! Configure the Interface with the RIPv2 key chain.
    int {interface}
    ipv4 verify unicast source reachable-via rx
