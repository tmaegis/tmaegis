id: TMA-FORTISWITCH-2.3.1.1
title: VLAN Pruning
description: Best practice to exercise VLAN pruning and limiting which VLANs are allowed over VLAN tagged interfaces.
target: fortiswitch
level: 2
severity: medium
tags:
- fortiswitch
- layer2
reference: CIS FortiSwitch Benchmark v1.0.0 - 2.3.1.1 VLAN Pruning
audit:
  type: manual
  command: 'Note: PortX indicates a numbered port on the FortiSwitch. Example: Port1, port2, port3, etc. From the CLI: show switch interface edit "portX" set allowed-vlans x,x,x From the GUI: 1. Switch > Interfaces > Select portX > Edit 2. Allowed VLANs 3. Ensure that "Allowed VLANs" are specified if the interface is a VLAN tagged interface.'
remediation:
  type: iac_patch
  command: |-
    Note: PortX indicates a numbered port on the FortiSwitch. Example: Port1, port2, port3, etc. From the CLI:
    config switch interface
        edit "portX"
            set allowed-vlans x,x,x
        end
    From the GUI:
    1. Switch > Interfaces > Select portX > Edit
    2. Allowed VLANs
    3. Ensure that "Allowed VLANs" are specified if the interface is a VLAN tagged interface.
