id: TMA-FORTISWITCH-2.1.2.1
title: Disable Auto-ISL
description: Disable Auto-ISL. PASS requires auto-isl disable in config switch global (as the CIS audit shows). Audited against FortiSwitchOS 'show full-configuration' output (standalone FortiSwitch, saved in full); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortiswitch
level: 2
severity: medium
tags:
- fortiswitch
- layer2
reference: CIS FortiSwitch Benchmark v1.0.0 - 2.1.2.1 Disable Auto-ISL
audit:
  type: config_regex
  pattern: (?m)^config switch global\n(?:[ \t]+[^\n]*\n)*?[ \t]+(?:set )?auto-isl disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config switch global
        set auto-isl disable
    end
    # CIS guidance:
    From the CLI:
    config switch global
        set auto-isl disable
    end
