id: TMA-FORTISWITCH-1.8.1.1
title: Disable FortiLAN Cloud (Standalone Mode)
description: Disabling FortiLAN Cloud when operating switch in standalone mode. PASS requires config system flan-cloud set status disable. Audited against FortiSwitchOS 'show full-configuration' output (standalone FortiSwitch, saved in full); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortiswitch
level: 2
severity: medium
tags:
- fortiswitch
- hardening
reference: CIS FortiSwitch Benchmark v1.0.0 - 1.8.1.1 Disable FortiLAN Cloud (Standalone Mode)
audit:
  type: config_regex
  pattern: (?m)^config system flan-cloud\n(?:[ \t]+[^\n]*\n)*?[ \t]+set status disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system flan-cloud
        set status disable
    end
    # CIS guidance:
    From the CLI:
    config system flan-cloud
        set status disable
    end
    From the GUI:
    1. System > FortiLAN Cloud
    2. Uncheck the "Enable" checkbox.
