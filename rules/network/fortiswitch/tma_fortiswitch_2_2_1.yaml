id: TMA-FORTISWITCH-2.2.1
title: Disable Auto-Network
description: FortiSwitch will send FortiLink packets by default, attempting to find a FortiGate where it can be controlled. PASS requires config switch auto-network set status disable. Audited against FortiSwitchOS 'show full-configuration' output (standalone FortiSwitch, saved in full); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortiswitch
level: 2
severity: medium
tags:
- fortiswitch
- layer2
reference: CIS FortiSwitch Benchmark v1.0.0 - 2.2.1 Disable Auto-Network
audit:
  type: config_regex
  pattern: (?m)^config switch auto-network\n(?:[ \t]+[^\n]*\n)*?[ \t]+set status disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config switch auto-network
        set status disable
    end
    # CIS guidance:
    From the CLI:
    config switch auto-network
        set status disable
    end
