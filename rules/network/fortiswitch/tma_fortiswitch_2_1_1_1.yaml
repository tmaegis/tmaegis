id: TMA-FORTISWITCH-2.1.1.1
title: Disable Auto Discovery FortiLink
description: FortiSwitch could send broadcast packets to try to find a Switch Controller like a FortiGate. PASS requires auto-fortilink-discovery disable in config switch global. Audited against FortiSwitchOS 'show full-configuration' output (standalone FortiSwitch, saved in full); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortiswitch
level: 2
severity: medium
tags:
- fortiswitch
- layer2
reference: CIS FortiSwitch Benchmark v1.0.0 - 2.1.1.1 Disable Auto Discovery FortiLink
audit:
  type: config_regex
  pattern: (?m)^config switch global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set auto-fortilink-discovery disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config switch global
        set auto-fortilink-discovery disable
    end
    # CIS guidance:
    From the CLI:
    config switch global
        set auto-fortilink-discovery disable
    end
