id: TMA-CISCO-NXOS-1.6.2
title: Configure a Time Zone
description: Timezones are a source of contention in larger corporations. On one hand, if infrastructure is configured with time consistent with the local timezone, then it is simpler to co-relate end-user symptoms and logs on end-user equipment with logs from network equipment. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: low
tags:
- cisco-nxos
- network
- ntp
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.6.2 Configure a Time Zone
audit:
  type: config_regex
  pattern: (?m)^clock timezone \S+ -?\d+ \d+
remediation:
  type: iac_patch
  command: |-
    ! To set the timezone, define the timezone name, the offset in hours, then the offset in seconds. The example below shows EST (Offset of -5 hours, zero seconds).
    clock timezone EST -5 0
