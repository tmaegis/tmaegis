id: TMA-CISCO-NXOS-1.2.7
title: Disable the Telnet Feature
description: Telnet is a clear-text administrative protocol. As such, both the credentials used to establish the session and all commands and data within the session are readable in clear-text, so can be intercepted or modified by an attacker. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: high
tags:
- cisco-nxos
- network
- management-plane
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.2.7 Disable the Telnet Feature
audit:
  type: config_regex
  pattern: (?m)^feature telnet\b
  must_not_match: true
remediation:
  type: iac_patch
  command: no feature telnet
