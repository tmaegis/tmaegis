id: TMA-CISCO-NXOS-1.9.2
title: Configure SNMP Traps
description: SNMP relies on an architecture which consists of a manager and an agent. SNMP Managers can be any machine on the network that is running SNMP to collect and process information from the devices on either the LAN or WAN. Utilizing traps can alert the user of issues or compromises in advance. For example if the device is overheating or if an admin users account is being utilized during odd hours. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- snmp
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.9.2 Configure SNMP Traps
audit:
  type: config_regex
  pattern: (?m)^snmp-server enable traps\b
remediation:
  type: iac_patch
  command: |-
    ! Examples of traps All notifications
    snmp-server enable traps CISCO-AAA-SERVER-MIB
    snmp-server enable traps aaa ENITY-MIB, CISCO-ENTITY-FRU-CONTROL-MIB, CISCO-ENTITY-SENSOR-MIB
    snmp-server enable traps entity
    snmp-server enable traps entity fru CISCO-LICENSE-MGR-MIB
    snmp-server enable traps license IF-MIB
    snmp-server enable traps link
    CISCO-PSM-MIB
    snmp-server enable traps port-security
    snmpv2-MIB
    snmp-server enable traps
    snmp
    snmp-server enable traps
    snmp authentication CISCO-FCC-MIB
    snmp-server enable traps fcc CISCO-DM-MIB
    snmp-server enable traps fcdomain CISCO-NS-MIB
    snmp-server enable traps fcns CISCO-FCS-MIB
    snmp-server enable traps fcs discovery-complete
    snmp-server enable traps fcs request-reject CISCO-FDMI-MIB
    snmp-server enable traps fdmi CISCO-FSPF-MIB
    snmp-server enable traps fspf CISCO-PSM-MIB
    snmp-server enable traps port-security CISCO-RSCN-MIB
    snmp-server enable traps rscn
    snmp-server enable traps rscn els
    snmp-server enable traps rscn ils CISCO-ZS-MIB
    snmp-server enable traps zone
    snmp-server enable traps zone default-zone-behavior-change
    snmp-server enable traps zone merge-failure
    snmp-server enable traps zone merge-success
    snmp-server enable traps zone request-reject
    snmp-server enable traps zone unsupp-mem
