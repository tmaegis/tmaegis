id: TMA-CISCO-NXOS-3.1.4.2
title: Create and use a single Loopback Address for Routing Protocol Peering
description: 'The use of a loopback interface is recommended for use in all routing protocols. This recommendation describes the configuration of the loopback interface. Routing protocol specific configurations are described under the respective routing protocols. Loopback interfaces are always up, and so are not dependent on physical interface link state issues (cabling or other link issues for instance). This means traffic sourced from a loopback interface can take any valid path to establish a routing relationship ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-nxos
level: 2
severity: low
tags:
- cisco-nxos
- network
- routing
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.1.4.2 Create and use a single Loopback Address for Routing Protocol Peering
audit:
  type: manual
  command: 'CIS assessment: Manual. switch# sho ip int brief | i Lo Lo0 10.11.11.1 protocol-up/link-up/admin-up'
remediation:
  type: iac_patch
  command: |-
    ! Creating the loopback interface is a simple process. Addressing the loopback, in particular computing the subnet mask will vary by the organization and application. Often smaller subnets can be used for loopbacks, depending on how many potential peers are possible.
    int loopback 0
    ip address 10.11.11.1 255.255.255.252 In order to use the loopback interface (rather than the closest interface to the routing peer), it must be explicitly configured in the routing protocol. This is described in the recommendations for each respective routing protocol.
