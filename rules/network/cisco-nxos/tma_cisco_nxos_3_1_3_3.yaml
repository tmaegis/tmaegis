id: TMA-CISCO-NXOS-3.1.3.3
title: Log OSPF Adjacency Changes
description: 'Logging changes to the BGP peering relationships is recommended. Any logged changes in a routing peer relationship will in the best case indicate a service issue due to standard operational issues (connectivity issues and so on) or in the worst case, could indicate malicious activity attempting to subvert the peering ... CIS marks this Manual; automated: passes when OSPF is not configured. Audited against the output of ''show running-config'' (run ''terminal length 0'' first; do not use ''show running-config all'', which adds default values).'
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- logging
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.1.3.3 Log OSPF Adjacency Changes
audit:
  type: config_regex
  pattern: (?m)\A(?:[ \t]*(?:$|[^l \t\n]|l(?:$|[^o\n]|o(?:$|[^g\n]|g(?:$|[^\-\n]|-(?:$|[^a\n]|a(?:$|[^d\n]|d(?:$|[^j\n]|j(?:$|[^a\n]|a(?:$|[^c\n]|c(?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^c\n]|c(?:$|[^y\n]|y(?:$|[^\-\n]|-(?:$|[^c\n]|c(?:$|[^h\n]|h(?:$|[^a\n]|a(?:$|[^n\n]|n(?:$|[^g\n]|g(?:$|[^e\n]|e(?:$|[^s\n])))))))))))))))))))))[^\n]*\n)*[ \t]*router ospf [^\n]*(?:\n(?:[ \t]*(?:$|[^l \t\n]|l(?:$|[^o\n]|o(?:$|[^g\n]|g(?:$|[^\-\n]|-(?:$|[^a\n]|a(?:$|[^d\n]|d(?:$|[^j\n]|j(?:$|[^a\n]|a(?:$|[^c\n]|c(?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^c\n]|c(?:$|[^y\n]|y(?:$|[^\-\n]|-(?:$|[^c\n]|c(?:$|[^h\n]|h(?:$|[^a\n]|a(?:$|[^n\n]|n(?:$|[^g\n]|g(?:$|[^e\n]|e(?:$|[^s\n])))))))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Enabling the logging of adjacencies is a single line in the OSPF process section. It is globally applied to all OSPF neighbors.
    router ospf <Process tag>
    log-adjacency-changes
