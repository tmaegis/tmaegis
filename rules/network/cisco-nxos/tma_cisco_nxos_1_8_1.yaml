id: TMA-CISCO-NXOS-1.8.1
title: Enable FIPS Mode
description: 'FIPS mode in NX-OS refers to the Federal Information Processing Standards (FIPS) 140-2 compliance mode. FIPS 140-2 is a U.S. government standard that specifies security requirements for cryptographic modules. When FIPS mode is enabled on NX-OS devices, it ensures that the cryptographic functions and processes adhere to these stringent security standards. Enabling FIPS mode in NX-OS is important for several reasons: 1. Compliance with Government Standards: FIPS 140-2 is a U.S. government standard that specifies security requirements for cryptographic modules. CIS marks this Manual; automated as a config-line check. Audited against the output of ''show running-config'' (run ''terminal length 0'' first; do not use ''show running-config all'', which adds default values).'
target: cisco-nxos
level: 2
severity: medium
tags:
- cisco-nxos
- network
- hardening
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.8.1 Enable FIPS Mode
audit:
  type: config_regex
  pattern: (?m)^fips mode enable\b
remediation:
  type: iac_patch
  command: fips mode enable
