id: TMA-CISCO-NXOS-3.1.4.3
title: Use Unicast Routing Protocols Only
description: 'Unicast routing protocols describe the destination routing peers by IP address. Multicast and Broadcast based routing protocols will discover routing neighbors dynamically. Because of this discovery process, a malicious actor can much more easily establish a peering relationship and hijack the routing protocol. While most routing protocols can be configured with authentication, multicast and broadcast routing protocols have an inherent weakness in their "trust" of any neighbor that advertises or will answer an advertisment. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-nxos
level: 2
severity: medium
tags:
- cisco-nxos
- network
- routing
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.1.4.3 Use Unicast Routing Protocols Only
audit:
  type: manual
  command: 'CIS assessment: Manual. In practice, this typically means "do not use RIP or EIGRP, OSPF in their default configuration, use unicast only" In order to audit for this, check for the "multicast group" keyword for each configured routing protocol. Note that there is in some cases a "-" character in this keyword, also that the word "multicast" does not have consistent upper/lower case from protocol to protocol.'
remediation:
  type: iac_patch
  command: Configure unicast routing only, for instance BGP.
