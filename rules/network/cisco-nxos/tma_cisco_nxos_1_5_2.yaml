id: TMA-CISCO-NXOS-1.5.2
title: Log all Successful and Failed Administrative Logins
description: By default failed logins are logged, but successful logins are not logged. This makes any configuration changes or successful malicious activity difficult to correctly attribute. Logging of all device login attempts allows the security team to investigate all login attempts and successful logins as needed. In some organizations and for some switches, even successful logins will be configured to generate an alert that must be compared ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 2
severity: high
tags:
- cisco-nxos
- network
- logging
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.5.2 Log all Successful and Failed Administrative Logins
audit:
  type: config_regex
  pattern: (?m)^logging level authpriv [5-7]\b
remediation:
  type: iac_patch
  command: login level authpriv 5
