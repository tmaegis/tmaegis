id: TMA-CISCO-NXOS-1.1.2.1
title: vty line authentication
description: Authenticate management access to the network devices. Typically a central authentication store combined with a fallback mechanism should be implemented to allow emergency access, in case the central authentication servers are not available. Management access to network devices must be authenticated. The default under AAA (local or network) is to require users to log in using a valid user name and password. This rule applies for both local and network AAA. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: high
tags:
- cisco-nxos
- network
- aaa
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.1.2.1 vty line authentication
audit:
  type: config_regex
  pattern: (?m)^aaa authentication login default group \S
remediation:
  type: iac_patch
  command: 'Configure central authentication for vty lines as follows: aaa authentication login default group <servergroup>'
