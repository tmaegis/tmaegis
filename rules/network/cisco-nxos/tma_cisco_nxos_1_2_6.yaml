id: TMA-CISCO-NXOS-1.2.6
title: Set the Maximum Number of VTY Sessions
description: This sets the maximum number of remote administrative sessions, which in most environments means the maximum number of SSH sessions. This setting prevents an attacker from a resource-exhaustion attack using protocol such as SSH. If there is no limit, an attacker could simply create SSH sessions and leave them in place until the NX-OS host resources (memory) would be exhausted. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: high
tags:
- cisco-nxos
- network
- management-plane
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.2.6 Set the Maximum Number of VTY Sessions
audit:
  type: config_regex
  pattern: (?m)^line vty[^\n]*\n(?:[ \t][^\n]*\n)*?[ \t]+session-limit \d+
remediation:
  type: iac_patch
  command: |-
    line vty
    session-limit 16
