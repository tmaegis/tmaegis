id: TMA-CISCO-NXOS-3.2.5
title: Disable IP Source-Routing
description: A malicious actor can influence the path that their traffic should take using source-routing. Disabling this on the NX-OS platform disables this feature for all transit traffic. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- routing
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.2.5 Disable IP Source-Routing
audit:
  type: config_regex
  pattern: (?m)^no ip source-route\b
remediation:
  type: iac_patch
  command: no ip source-route
