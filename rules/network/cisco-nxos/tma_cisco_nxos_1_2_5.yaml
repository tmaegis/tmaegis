id: TMA-CISCO-NXOS-1.2.5
title: Ensure Exec Timeout for Remote Administrative Sessions (VTY) is set to less than 10
description: This value sets the maximum time of an administrative session that is attached via a VTY line - in most installations this means the maximum time and SSH session can have. This value is set in minutes. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: high
tags:
- cisco-nxos
- network
- ntp
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.2.5 Ensure Exec Timeout for Remote Administrative Sessions (VTY) is set to less than 10
audit:
  type: config_regex
  pattern: (?m)^line vty[^\n]*\n(?:[ \t][^\n]*\n)*?[ \t]+exec-timeout (?:[1-9]|10)[ \t\r]*$
remediation:
  type: iac_patch
  command: |-
    line vty
    exec-timeout 10
