id: TMA-CISCO-NXOS-1.3.1
title: Pre-authentication Banner
description: A pre-authentication banner is displayed when a terminal connects, before a login occurs. This banner is useful for sending messages that affect all users (such as impending system shutdowns). This banner can also be used to notify unauthorized users of any penalties to accessing the device, or any logging that may be configured. Network banners are electronic messages that provide notice of legal rights to users of computer networks. From a legal standpoint, banners have following primary functions. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: low
tags:
- cisco-nxos
- network
- aaa
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.3.1 Pre-authentication Banner
audit:
  type: config_regex
  pattern: (?m)^banner motd \S
remediation:
  type: iac_patch
  command: |-
    ! Configure an MOTD banner as shown below. The delimiter character shown is a "^", but any character can serve as a delimiter.
    banner motd ^ > Enter MOTD Banner here. > End this message with the same delimiter as above > ^
