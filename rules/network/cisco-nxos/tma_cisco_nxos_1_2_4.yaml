id: TMA-CISCO-NXOS-1.2.4
title: Ensure Exec Timeout for Console Sessions is set for less than 10
description: Verify device is configured to automatically disconnect console sessions after a defined maximum session time, set in minutes. This prevents unauthorized users from misusing abandoned sessions. For example, if the network administrator disconnects leaving a console session open, that session will remain open (in the same state and privilege level) for the next person who connects a ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- ntp
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.2.4 Ensure Exec Timeout for Console Sessions is set for less than 10
audit:
  type: config_regex
  pattern: (?m)^line console[^\n]*\n(?:[ \t][^\n]*\n)*?[ \t]+exec-timeout (?:[1-9]|10)[ \t\r]*$
remediation:
  type: iac_patch
  command: |-
    line console
    exec-timeout 10
