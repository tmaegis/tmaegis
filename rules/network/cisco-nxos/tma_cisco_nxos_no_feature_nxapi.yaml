id: TMA-CISCO-NXOS-NO-FEATURE-NXAPI
title: Ensure NX-API is disabled when not used
description: NX-API exposes an HTTP/HTTPS programmable interface; disable it unless automation requires it and access is restricted. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 2
severity: medium
tags:
- cisco-nxos
- network
- management-plane
reference: CIS Cisco NX-OS Benchmark - Management Plane / Disable unneeded services (verify section number for your release)
audit:
  type: config_regex
  pattern: (?m)^feature nxapi\s*$
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    configure terminal
     no feature nxapi
    end
