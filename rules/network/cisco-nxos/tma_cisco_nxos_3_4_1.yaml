id: TMA-CISCO-NXOS-3.4.1
title: Configure LLDP
description: 'LLDP is a discovery protocol that transmits information about the capabilities and current status of a device and its interfaces. LLDP devices use the protocol to solicit information only from other LLDP devices. You can use LLDP to discover and view information about many devices that are directly attached to the switch. To permit the discovery of non-Cisco devices, the switch also supports the Link Layer Discovery Protocol (LLDP), a vendor-neutral device discovery protocol that is defined in the IEEE 802.1ab standard. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- routing
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.4.1 Configure LLDP
audit:
  type: manual
  command: 'CIS assessment: Manual. To show the global LLDP configuration switch# sho run lldp !Command: show running-config lldp !Running configuration last done at: Tue May 19 16:19:19 2020 !Time: Tue May 19 16:33:51 2020 version 9.3(3) Bios:version feature lldp To show the LLDP status for all interfaces: switch# sho lldp all Interface Information: Eth1/8 Enable (tx/rx/dcbx): Y/Y/Y Interface Information: Eth1/7 Enable (tx/rx/dcbx): Y/Y/Y Interface Information: Eth1/6 Enable (tx/rx/dcbx): Y/Y/Y To show connected LLDP capable devices (neighbors): switch# sho lldp ...'
remediation:
  type: iac_patch
  command: |-
    ! To enable the LLDP feature, then enable LLDP:
    feature lldp To disable LLDP globally:
    no feature lldp To disable LLDP on a specific interface - note that transmit and receive capabilities are controlled independently. While in many cases LLDP is not required at all, often only LLDP receive is needed for correct operation.:
    int Ethernet x/y
    no lldp transmit
    no lldp receive
