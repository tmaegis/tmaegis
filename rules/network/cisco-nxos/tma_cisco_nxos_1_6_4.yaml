id: TMA-CISCO-NXOS-1.6.4
title: Configure NTP Authentication
description: 'By default, NTP is a clear text, unauthenticated protocol. However, it can be configured to authenticate time sources. NTP authentication is an upstream protocol only -authenticated clients have assurance that they are receiving correct time, that the ntp packets have not been tampered with. Configuring authentication ensures that if the server key does not match the key configured on the NTP client, that the client will drop any NTP replies from that server. If multiple keys are configured,. CIS marks this Manual; automated: requires ''ntp authenticate'', an authentication-key, a trusted-key and a key on every ''ntp server''. Audited against the output of ''show running-config'' (run ''terminal length 0'' first; do not use ''show running-config all'', which adds default values).'
target: cisco-nxos
level: 2
severity: high
tags:
- cisco-nxos
- network
- ntp
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.6.4 Configure NTP Authentication
