id: TMA-CISCO-NXOS-1.2.3
title: Limit SSH Login Attempts to 3 or less
description: After a configured number of failed password attempts, an SSH session terminate. The default configuration for this is 3 failed attempts. CIS recommends using the default configuration for this setting. This setting makes brute force and dictionary attacks against SSH more difficult. The default (3) is not shown; fails only if more than 3 attempts are configured. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: high
tags:
- cisco-nxos
- network
- logging
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.2.3 Limit SSH Login Attempts to 3 or less
audit:
  type: config_regex
  pattern: (?m)^ssh login-attempts (?:[4-9]|\d{2,})\b
  must_not_match: true
remediation:
  type: iac_patch
  command: ssh login attempts 3
