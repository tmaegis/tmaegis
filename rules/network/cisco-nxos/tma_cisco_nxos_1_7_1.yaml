id: TMA-CISCO-NXOS-1.7.1
title: Disable Power on Auto Provisioning (POAP)
description: PowerOn Auto Provisioning (POAP) allows the switch to be auto-provisioned at the time of power-on. This can be extremely useful in a tightly controlled environment, with a solid "network as code" mindset and dev-ops procedures in place for network operations. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 2
severity: medium
tags:
- cisco-nxos
- network
- hardening
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.7.1 Disable Power on Auto Provisioning (POAP)
audit:
  type: config_regex
  pattern: (?m)^boot poap enable\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable POAP, use the command:
    no boot poap enable
