id: TMA-CISCO-NXOS-3.2.3
title: Disable Proxy ARP on all Layer 3 Interfaces
description: Proxy ARP is the technique in which one host, usually a router, answers ARP requests intended for another machine on a different network segment (vlan or subnet). By faking its identity, the router accepts responsibility for routing packets to the real destination. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all', which adds default values).
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- hardening
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 3.2.3 Disable Proxy ARP on all Layer 3 Interfaces
audit:
  type: config_regex
  pattern: (?m)^[ \t]*ip (?:local-)?proxy-arp\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Proxy ARP is disabled on all interfaces by default, and that configuration does not appear in the running or saved configuration. Proxy ARP only appears in the configuration if it is enabled (which is not desired in most cases). To disable this on an interface if it is enabled:
    no ip proxy-arp for instance:
    int vlan 9
    no ip proxy-arp
