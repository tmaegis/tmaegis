id: TMA-CISCO-NXOS-4.1
title: Configure Local Configuration Backup Schedule
description: 'Using the job scheduler function allows the user to automate backups. This ensures that regular backups are created. Having current backups creates an environment where the user can roll back a config in the event of configuration failure. Additionally in the event of a compromise a recent backup can get the device back up to running condition in a small matter of time. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-nxos
level: 1
severity: medium
tags:
- cisco-nxos
- network
- logging
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 4.1 Configure Local Configuration Backup Schedule
audit:
  type: manual
  command: 'CIS assessment: Manual. switch(config)# sho scheduler job'
remediation:
  type: iac_patch
  command: |-
    ! scheduler job name [local backup]
    copy running-config startup-config Set up timetable for this backup.
    scheduler schedule name [backups]
    schedule name [backups]
    time weekly [day 00:00]
