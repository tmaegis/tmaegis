id: TMA-CISCO-NXOS-1.5.4
title: Configure Logging Timestamps
description: 'Timestamps are incredibly important since they drive a number of important activities in our product. Most importantly, we use timestamps to filter data in your search results. Using timestamps allow you to discover the timeframe of an incident. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-nxos
level: 1
severity: low
tags:
- cisco-nxos
- network
- logging
reference: CIS Cisco NX-OS Benchmark v1.2.0 - 1.5.4 Configure Logging Timestamps
audit:
  type: manual
  command: 'CIS assessment: Manual. Using "show logging timestamp" is the reliable command to show this configuration setting, as it will show the default value of "seconds", which will not appear in the configuration: switch# sho logging timestamp Logging timestamp: Seconds'
remediation:
  type: iac_patch
  command: |-
    ! Use the "logging timestampe" command to configure this setting. Note that if set to "seconds" (the default), this command will not appear in the configuration.
    logging timestamp {microseconds | milliseconds | seconds}
