  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To restrict the IP Address/es on which the REST API will listen, enter the following command from the hierarchy:
    set system services rest https addresses <Service IP> Where <Service IP> is a single IP Address configured on one of the JUNOS Device's interfaces. To add multiple addresses, enter the following command:
    set system services rest https addresses [<Service IP 1> <Service IP 2> <Service IP ...> ] To remove a single address from the current list enter the following command:
    delete system services rest https addresses <Service IP>
