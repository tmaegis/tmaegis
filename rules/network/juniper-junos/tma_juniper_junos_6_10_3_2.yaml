id: TMA-JUNIPER-JUNOS-6.10.3.2
title: Ensure XNM-SSL Connection Limit is Set
description: If the XNM-SSL service is configured, connection limits should be set. JUNOScript can be configured to use SSL transport to prevent the exposure of sensitive data and authentication details on the network. If configured the XNM-SSL service will provide services on port TCP/3220. Passes when 'set system services xnm-ssl' is not configured; otherwise requires 'set system services xnm-ssl connection-limit'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.3.2 Ensure XNM-SSL Connection Limit is Set
