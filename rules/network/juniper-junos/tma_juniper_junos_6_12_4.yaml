id: TMA-JUNIPER-JUNOS-6.12.4
title: Ensure Local Logging is Set for Authentication and Authorization Events
description: Logging data for Authentication and Authorization events should be saved to a local file. Authentication and Authorization events are generated whenever a user logs in to the router or performs an action which requires Authorization, such as making a change. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.12.4 Ensure Local Logging is Set for Authentication and Authorization Events
audit:
  type: config_regex
  pattern: (?m)^set system syslog file \S+ authorization any\b
remediation:
  type: iac_patch
  command: |-
    ! To configure a local SYSLOG file for Auth events, issue the following command from the hierarchy;
    set system syslog file <filename> authorization any
