id: TMA-JUNIPER-JUNOS-6.21
title: Ensure ICMP Redirects are Disabled for IPv4
description: The Routing Engine should not send ICMP Redirect Messages. ICMP Redirect Messages provide a method for a router to communicate routing information with a host and is intended for use when a router receives packets to forward to a destination to which the host should have a direct route. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 6.21 Ensure ICMP Redirects are Disabled for IPv4
audit:
  type: config_regex
  pattern: (?m)^set system no-redirects\s*$
remediation:
  type: iac_patch
  command: |-
    ! To disable ICMP redirects globally for IPv4, issue the following command from the heirachy:
    set system no-redirects
