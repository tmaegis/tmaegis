id: TMA-JUNIPER-JUNOS-6.11.2
title: Ensure Auxiliary Port is Set as Insecure If Used
description: The Auxiliary Port should be set as Insecure if used. The Auxiliary Port on a Juniper Device is used to connect Modems and other devices to allow remote administration of the router when other connectivity is not possible. A disabled auxiliary port also passes. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.11.2 Ensure Auxiliary Port is Set as Insecure If Used
audit:
  type: config_regex
  pattern: (?m)^set system ports auxiliary (?:insecure|disable)\b
remediation:
  type: iac_patch
  command: |-
    ! To set the Auxiliary Port as Insecure, issue the following command from the hierarchy;
    set system ports auxiliary insecure
