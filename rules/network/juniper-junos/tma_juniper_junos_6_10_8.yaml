id: TMA-JUNIPER-JUNOS-6.10.8
title: Ensure FTP Service is Not Set
description: FTP should be disabled. File Transfer Protocol (FTP) can be used for loading and exporting configuration from a Juniper device, which can run an FTP Server Service to support these functions. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.8 Ensure FTP Service is Not Set
audit:
  type: config_regex
  pattern: (?m)^set system services ftp\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable the FTP service, issue the following command from the hierarchy;
    delete system services ftp
