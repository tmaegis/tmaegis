id: TMA-JUNIPER-JUNOS-4.2.4
title: Ensure loose authentication check is not configured
description: IS-IS Neighbors should be authenticated. Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure. Correct route information is required for routers to correctly direct traffic through the network. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 4.2.4 Ensure loose authentication check is not configured
audit:
  type: config_regex
  pattern: (?m)^set protocols isis [^\n]*\bloose-authentication-check\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! If you have deployed IS-IS in your network and have enabled loose authentication checking, re-enable it by issuing the following command from the hierarchy:
    delete protocols isis loose-authentication-check
