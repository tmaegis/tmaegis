id: TMA-JUNIPER-JUNOS-1.2
title: Ensure End of Life JUNOS Devices are not used
description: 'EoL JUNOS Devices should never be used in production networks. As with most vendors, Juniper Networks only support individual versions of Software and Hardware for a certain period of time in order to allow resources to be spent developing new products, rather than supporting old ones and because new features and ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 1.2 Ensure End of Life JUNOS Devices are not used
audit:
  type: manual
  command: 'CIS assessment: Manual. It is essentially that administrators follow Juniper EOLN announcements and plan to retire all EoL platforms following the timeline given in the EOLN by the EOSE date to ensure that this situation does not occur. You can subscribe to EOL Notices in the Juniper Knowledge Base by logging in with your Juniper Customer Account, navigating to "Manage Subscriptions" and adding "EOL" to "Technical Bulletins" Subscriptions. Juniper will automatically email you a notification when a new EOLN is issued.'
remediation:
  type: iac_patch
  command: Administrators should plan to retire all JUNOS Devices before they reach EOS/EOSE
