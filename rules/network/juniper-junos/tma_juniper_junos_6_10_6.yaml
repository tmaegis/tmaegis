id: TMA-JUNIPER-JUNOS-6.10.6
title: Ensure Telnet is Not Set
description: Cleartext Management Services should be disabled. Telnet is a remote management protocol that allows users to connect to the command line of a JUNOS router or other device. Because Telnet transmits all data (including passwords) in cleartext (unencrypted) over the network and provides no assurance of the ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.6 Ensure Telnet is Not Set
audit:
  type: config_regex
  pattern: (?m)^set system services telnet\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable Telnet access issue the following command from the hierarchy;
    delete system services telnet
