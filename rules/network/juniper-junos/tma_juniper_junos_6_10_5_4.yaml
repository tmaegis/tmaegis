remediation:
  type: iac_patch
  command: |-
    ! To configure REST HTTPS Mutual Authentication, enter the following command from the hierarchy:
    set system services rest https mutual-authentication <CA Profile> Where <CA Profile> is the name of an existing Certificate Authority Profile configured on the JUNOS Device for a Trusted CA. To configure a new CA Profile, use the following commands from the hierarchy:
    set security pki ca-profile <CA Profile> ca-identity <CA ID> It is recommended that a Certificate Revocation List be set for the CA Profile, by including the <CRL URL> using the following command:
    set security pki ca-profile <CA Profile> revocation-check crl <CRL URL> Finally, the CAs' Public Certificate should be obtained an uploaded to the JUNOS Device and linked to the CA Profile:
    run request security pki ca-certificate load ca-profile <CA Profile> filename <path and filename>
