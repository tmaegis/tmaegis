id: TMA-JUNIPER-JUNOS-6.10.5.4
title: Ensure REST HTTPS is Set to use Mutual Authentication
description: The REST HTTPS API should be configured for Mutual Authentication. The JUNOS REST API can be configured for access using either HTTP or HTTPS for connections. When configured to use HTTPS, X.509 Certificates are used to validate the JUNOS Devices identity to API Clients when they connect. Passes when 'set system services rest' is not configured; otherwise requires 'set system services rest https mutual-authentication'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.5.4 Ensure REST HTTPS is Set to use Mutual Authentication
