id: TMA-JUNIPER-JUNOS-6.10.2.6
title: Ensure Web-Management Interface Restriction is Set
description: JWeb access should be restricted to trusted networks. By default, when configured, the JWeb service will listen for incoming connections on all interfaces which have an IP Address configured, exposing JWeb to users on all networks through which the device is reachable. Passes when 'set system services web-management' is not configured; otherwise requires 'set system services web-management https interface'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.2.6 Ensure Web-Management Interface Restriction is Set
