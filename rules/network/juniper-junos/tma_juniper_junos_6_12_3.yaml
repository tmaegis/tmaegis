id: TMA-JUNIPER-JUNOS-6.12.3
title: Ensure Local Logging is Set for Firewall Events
description: Logging data for Firewall Events should be saved to a local file. The JUNOS Device's built in Firewall (configured under [edit firewall] and discussed in more detail elsewhere in this Benchmark) can be the first line of defense, so the logging it produces can be vital in responding to a security incident as well as a useful ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.12.3 Ensure Local Logging is Set for Firewall Events
audit:
  type: config_regex
  pattern: (?m)^set system syslog file \S+ firewall any\b
remediation:
  type: iac_patch
  command: |-
    ! To configure a local SYSLOG file for Firewall events, issue the following command from the hierarchy;
    set system syslog file <filename> firewall any Where <filename> is the file, in the default /var/log/ folder, that should be used to log these messages. You may, for example, choose to call the file firewall, in which case it can be read with the show log firewall command.
