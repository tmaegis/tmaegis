remediation:
  type: iac_patch
  command: |-
    ! To setup IPSEC SA based authentication, first configure a Security Association at the hierarchy; edit security-association <SA name> set description <description> set mode transport set manual direction bidirectional protocol ah set manual direction bidirectional algorithm hmac-sha1-96 set manual direction bidirectional authentication key <key> The SA must be bi-directional and must be configured with the same parameters on all neighbors reachable on the intended interface. Note that only Authenticated Header is configured in this example which provides mutual authentication but does not encrypt OSPFv3 protocol messages in transit. Next configure IPSEC SA based authentication for one or more interfaces which OSPF will be run over from the hierarchy;
    set protocols ospfv3 area <area number> interface <interface number> ipsec-sa <SA name>
