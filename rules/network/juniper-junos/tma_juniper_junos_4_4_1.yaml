id: TMA-JUNIPER-JUNOS-4.4.1
title: Ensure OSPFv3 authentication is set to IPSEC SA
description: OSPFv3 Neighbors should be strongly authenticated. Where it is deployed, OSPFv3 routing is vital for normal operation of an organization's network infrastructure. Correct route information is required for routers to correctly direct traffic through the network. Passes when OSPFv3 is not configured. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 4.4.1 Ensure OSPFv3 authentication is set to IPSEC SA
