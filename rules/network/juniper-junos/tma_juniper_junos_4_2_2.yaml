remediation:
  type: iac_patch
  command: |-
    ! If you have deployed IS-IS in your network you should consider configuring Hitless Key Rollover with SHA1 authentication for all neighbors at each IS-IS Level configured. First a key-chain must be configured. The same key-chain may be used for multiple levels or separate key-chains used for each level (or even for individual interfaces where required). From the hierarchy issue the following commands:
    set security authentication-key-chains key-chain <name> key <key number> secret "<secret key>"
    set security authentication-key-chains key-chain <name> key <key number> start-time "<yyyy-mm-dd.hh:mm:ss>"
    set security authentication-key-chains key-chain <name> key <key number> algorithm hmac-sha-1
    set security authentication-key-chains key-chain <name> key <key number> options isis-enhanced The start-time must be provided for all keys and provides the mechanism for controlled key rollover. Keys with a start time in the future can be configured across all of the devices in advance, when the time is reached all of the devices will hitlessly rollover to the new keys without disruption to IS-IS Adjacencies. Next the key should be set for all Levels at which SHA1 HMAC authentication will be used. From the hierarchy, issue the following command:
    set protocols isis level <level> authentication-key-chain <name> Where a different key is required for a specific area or interface, the key-chain used at the Level can be overridden on a per interface per level basis using the following command from the `' hierarchy:
    ! ... see the benchmark for the full procedure
