id: TMA-JUNIPER-JUNOS-3.4
title: Ensure interface description is set
description: All interfaces should have a description. JUNOS routers can be installed with tens or even hundreds of physical and logical interfaces of different types. To allow effective planning, troubleshooting and to avoid confusion & mistakes which may compromise your networks security, all interface units ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: juniper-junos
level: 1
severity: low
tags:
- juniper-junos
- network
- routing
reference: CIS Juniper OS Benchmark v2.1.0 - 3.4 Ensure interface description is set
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. From the command prompt, execute the following command: [edit] user@host#show interfaces | match "description" | count The returned value should be a positive integer equal to the number of configured interface units.'
remediation:
  type: iac_patch
  command: |-
    ! To configure an interface description enter the following command from the hierarchy.
    set interfaces <interface name> unit <unit number> description <description>
