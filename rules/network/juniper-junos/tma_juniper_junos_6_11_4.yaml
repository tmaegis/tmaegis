id: TMA-JUNIPER-JUNOS-6.11.4
title: Ensure Console Port is Set as Insecure
description: The JUNOS Device's Console Port should be set as Insecure. Administrators often use Console Port to configure the JUNOS Device when they have physical access to the device. In high security environments or deployments where the physical security of the router is minimal, such as CPE (Customer Premises Equipment), ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.11.4 Ensure Console Port is Set as Insecure
audit:
  type: config_regex
  pattern: (?m)^set system ports console insecure\b
remediation:
  type: iac_patch
  command: |-
    ! To set the Console Port as Insecure, issue the following command from the hierarchy;
    set system ports console insecure
