id: TMA-JUNIPER-JUNOS-6.10.4.2
title: Ensure NETCONF Connection Limit is Set
description: If the NETCONF service is configured, the Connection Limit should be set. NETCONF can be configured to use SSH transport to allow remote access while preventing the exposure of sensitive data and authentication details on the network. If configured, the NETCONF-over-SSH service will provide services on port TCP/830. Passes when 'set system services netconf ssh' is not configured; otherwise requires 'set system services netconf ssh connection-limit'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.4.2 Ensure NETCONF Connection Limit is Set
