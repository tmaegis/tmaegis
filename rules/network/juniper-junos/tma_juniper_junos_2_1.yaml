id: TMA-JUNIPER-JUNOS-2.1
title: Ensure "Protect RE" Firewall Filter is set for inbound traffic to the Routing Engine
description: 'Traffic to the Routing Engine should be filtered. JUNOS Devices can provide a wide range of services to the network and, as with any computer system, the more services that are offered and the more hosts to which they are available, the wider attack surface is offered to a potential attacker. CIS marks this Manual; automated: requires an input filter on lo0 family inet (filter content is not evaluated). Audited against the output of ''show configuration | display set | no-more'' (set format, not the curly-brace hierarchy).'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- routing
reference: CIS Juniper OS Benchmark v2.1.0 - 2.1 Ensure "Protect RE" Firewall Filter is set for inbound traffic to the Routing Engine
audit:
  type: config_regex
  pattern: (?m)^set interfaces lo0 unit \d+ family inet filter input(?:-list)? \S
remediation:
  type: iac_patch
  command: |-
    ! A full discussion of Firewall Filters is beyond the scope of this Benchmark. It is important to ensure that Firewall Filters include terms to match and accept all of your required Routing Protocols, Management Services and any other services used on your Junos Device. As noted elsewhere, it is strongly recommended that changes to Firewall Filters applied to the Loopback interface always be applied using commit confirmed so that the change will be automatically rolled back should the administrator lose connection after committing the change. To create a IPv4 firewall filter enter the following command from the hierarchy.
    edit firewall family inet
    edit firewall family inet filter <filter name>
    edit firewall family inet filter <filter name> term <term name>
    set firewall family inet filter <filter name> term <term name> from <match conditions>
    set firewall family inet filter <filter name> term <term name> then <action> An IPv6 firewall filter, if required, can be configured under the family inet6 from the same hierarchy. The following example filter allows SSH from the 192.168.1.0/24 network and OSPF from 10.0.0.0/8, while (implicitly) discarding all other traffic (without logging): firewall { family inet { filter ProtectRE { term AllowOSPF { from { protocol ospf; source-address 10.0.0.0/8; } then { accept; } } term AllowSSH { from { protocol tcp; source-address 192.168.1.0/24; destination-port ssh; } then { accept; log; syslog; } } } } } Once a suitable filter has been configured, it must be applied to the Loopback interface, using the following command from the hierarchy:
    ! ... see the benchmark for the full procedure
