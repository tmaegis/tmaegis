id: TMA-JUNIPER-JUNOS-4.5.1
title: Ensure RIP authentication is set to MD5 (RIP)
description: RIP Neighbors should be authenticated. Where it is deployed, RIP routing is vital for normal operation of an organization's network infrastructure. Correct route information is required for routers to correctly direct traffic through the network. Passes when RIP is not configured. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 4.5.1 Ensure RIP authentication is set to MD5
