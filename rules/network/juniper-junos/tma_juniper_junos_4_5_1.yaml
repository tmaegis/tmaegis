remediation:
  type: iac_patch
  command: |-
    ! If you have deployed RIP in your network you should use MD5 authentication for all neighbors. To configure authentication enter the following command from the hierarchy:
    set protocols rip authentication-type md5
    set protocols rip authentication-key <key>
