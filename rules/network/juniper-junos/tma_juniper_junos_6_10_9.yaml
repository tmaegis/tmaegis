id: TMA-JUNIPER-JUNOS-6.10.9
title: Ensure Finger Service is Not Set
description: The Finger service should be disabled. Finger is a simple TCP service dating back to the early 1970's that provides information on users logged into a system to other users on the network. While this was a useful feature in the early days of the Internet, providing information about a router to ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.9 Ensure Finger Service is Not Set
audit:
  type: config_regex
  pattern: (?m)^set system services finger\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! The Finger service is not enabled by default, however if it has been configured on your router it can by disabled by issuing the following command from the hierarchy;
    delete system services finger
