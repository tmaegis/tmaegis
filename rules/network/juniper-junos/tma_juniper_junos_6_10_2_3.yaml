remediation:
  type: iac_patch
  command: |-
    ! To configure Web-Management with a PKI Certificate issue the following command from the hierarchy:
    set system services web-management https pki-local-certificate <Certificate ID> Where <Certificate ID> is the name of a Certificate which has already been loaded to the devices PKI Store. To create a new Public/Private Key Pair in the devices PKI Store and generate Certificate Signing Request issue the following commands from Operational Mode:
    request security pki generate-key-pair certificate-id <Certificate ID> type <Algorithm> size <Size>
    request security pki generate-certificate-request certificate-id <Certificate ID> domain-name <Device DNS Name> subject <Device Subject DN> Where: - <Certificate ID> is the Name that will be used for this Certificate throughout configuration - <Algorithm> is the Encryption Algorithm to be used (this should be either RSA or ECC) - <Size> is the number of Bits used for the keys (use at least 2048bits for RSA or 256bits for ECC) - <Device DNS Name> is the FQDN which will be used to manage the device and -<Device Subject DN> is the Distinguished Name used to identify this device and certificate. Optionally, fields for email address, the device's IP Address and and output Filename for the PKCS#10 CSR which will be generated can be included. The CSR should then be submitted to the Certificate Authority for review and signing. Once the CA returns the Certificate it can be uploaded to the JUNOS device and imported with the following command from Operational Mode:
    ! ... see the benchmark for the full procedure
