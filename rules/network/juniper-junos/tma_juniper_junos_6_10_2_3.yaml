id: TMA-JUNIPER-JUNOS-6.10.2.3
title: Ensure Web-Management is Set to use PKI Certificate for HTTPS
description: 'JWeb should only be accessed using HTTPS with a PKI Certificate. JWeb can be configured to provide a Web GUI over either HTTP or HTTPS. When configured to use HTTPS X.509 Certificates are used to: - Share Public Encryption Keys - Provide Identity Information - Validate the Web Server''s Identity - Enforce Encryption Key ... Passes when ''set system services web-management'' is not configured; otherwise requires ''set system services web-management https pki-local-certificate''. Audited against the output of ''show configuration | display set | no-more'' (set format, not the curly-brace hierarchy).'
target: juniper-junos
level: 2
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.2.3 Ensure Web-Management is Set to use PKI Certificate for HTTPS
