id: TMA-JUNIPER-JUNOS-6.12.5
title: Ensure Local Logging is Set for Interactive-Commands
description: Logging data for Interactive Commands should be saved to a local file. When responding to a security incident or fault, a record of all of the commands issued on the JUNOS Devices, either through the CLI or through management APIs such as JUNOScript or NETCONF, can provide vital clues. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.12.5 Ensure Local Logging is Set for Interactive-Commands
audit:
  type: config_regex
  pattern: (?m)^set system syslog file \S+ interactive-commands any\b
remediation:
  type: iac_patch
  command: |-
    ! To configure a local SYSLOG file for Interactive Commands, issue the following command from the hierarchy;
    set system syslog file <filename> interactive-commands any Where <filename> is the file, in the default /var/log/ folder, that should be used to log these messages. You may, for example, choose to call the file interactive-commands, in which case it can be read with the show log interactive-commands command.
