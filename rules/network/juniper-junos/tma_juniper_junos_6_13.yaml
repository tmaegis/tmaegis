id: TMA-JUNIPER-JUNOS-6.13
title: Ensure Autoinstallation is Set to Disabled
description: Autoinstallation should be disabled. The Autoinstallation feature allows the JUNOS Device to automatically download and apply configuration from an FTP, TFTP or HTTP server on boot, having obtained IP Address details via DHCP or BOOTP. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 6.13 Ensure Autoinstallation is Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system autoinstallation\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable Autoinstallation issue the following command from the hierarchy;
    delete system autoinstallation
