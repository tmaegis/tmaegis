remediation:
  type: iac_patch
  command: |-
    ! If you have deployed IS-IS in your network you should use MD5 authentication for all neighbors at each IS-IS Level configured. To configure MD5 authentication and the secret key to be used, issue the following commands from the hierarchy:
    set protocols isis level <level> authentication-type md5
    set protocols isis level <level> authentication-key <key>
