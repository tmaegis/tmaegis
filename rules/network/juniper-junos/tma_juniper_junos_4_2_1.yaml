id: TMA-JUNIPER-JUNOS-4.2.1
title: Ensure IS-IS neighbor authentication is set to MD5
description: IS-IS Neighbors should be authenticated. Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure. Correct route information is required for routers to correctly direct traffic through the network. Passes when IS-IS is not configured; otherwise requires 'authentication-type md5' and an 'authentication-key'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 4.2.1 Ensure IS-IS neighbor authentication is set to MD5
