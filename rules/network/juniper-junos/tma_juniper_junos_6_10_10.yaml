remediation:
  type: iac_patch
  command: |-
    ! To disable DHCP services which are not required, issue the one of the following command from the configuration hierarchy: For DHCP configured with the Legacy DHCPD process:
    delete system services dhcp Or, for DHCP configured with the Enhanced JDHCPD process:
    delete system services dhcp-local-server
