id: TMA-JUNIPER-JUNOS-6.10.10
title: Ensure Unused DHCP Service is Not Set
description: The DHCP Server should be disabled when not required. When hardening any computer system for security, it is important to disable or uninstall any application that is not required. The same rule applies to routers and other network devices. Fails if the legacy DHCP service has no pool, or dhcp-local-server has no group (i.e. the service is configured but unused). Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.10 Ensure Unused DHCP Service is Not Set
