id: TMA-JUNIPER-JUNOS-6.10.2.7
title: Ensure Web-Management Interface Restriction is set to OOB Management
description: JWeb access should be restricted to trusted networks. By default, when configured, the JWeb service will listen for incoming connections on all interfaces which have an IP Address configured, exposing JWeb to users on all networks through which the device is reachable. Fails if J-Web is not interface-restricted or is bound to a non out-of-band interface. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.2.7 Ensure Web-Management Interface Restriction is set to OOB Management
