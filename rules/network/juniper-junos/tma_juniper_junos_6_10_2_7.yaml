remediation:
  type: iac_patch
  command: |-
    ! To apply JWEB Interface restrictions issue the following commands from the hierarchy: To set a single Interface:
    set system services web-management https interface <interface> Or to set multiple Interfaces:
    set system services web-management https interface [ <interface 1> <interface 2> <interface n> ] Interfaces should only be fxp0.0, em0.0, me0.0 or jmgmt0.0 (dependent on platform) dedicated Out Of Band Management ports.
