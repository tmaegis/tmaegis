id: TMA-JUNIPER-JUNOS-3.10
title: Ensure inbound firewall filter is set for Loopback interface
description: A Firewall Filter should be applied to lo0. JUNOS routers can provide a wide range of services to the network and, as with any computer system, the more services that are offered and the more hosts they are available to, the wider attack surface is offered to a potential attacker. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: low
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 3.10 Ensure inbound firewall filter is set for Loopback interface
audit:
  type: config_regex
  pattern: (?m)^set interfaces lo0 unit 0 family inet filter input(?:-list)? \S
remediation:
  type: iac_patch
  command: |-
    ! To apply a firewall filter to the loopback interface enter the following command from the hierarchy:
    set interfaces lo0 unit 0 family inet filter input <filter name>
