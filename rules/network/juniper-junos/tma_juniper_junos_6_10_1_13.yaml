id: TMA-JUNIPER-JUNOS-6.10.1.13
title: Ensure SSH Key Authentication is Disabled
description: SSH Key based Authentication should be disabled (if not used for automation). Due to the sensitive nature of SSH, potentially allowing full management of the targeted device, protecting SSH access using strong authentication methods is essential to the security of the device. CIS marks this Manual; automated as a config-line check. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.1.13 Ensure SSH Key Authentication is Disabled
audit:
  type: config_regex
  pattern: (?m)^set system services ssh no-public-keys\b
remediation:
  type: iac_patch
  command: |-
    ! To disable the use of SSH Key based Authentication, issue the following command from the hierarchy:
    set system services ssh no-public-keys
