remediation:
  type: iac_patch
  command: |-
    ! The XNM-SSL Rate Limit can be configured by issuing the following command from the hierarchy;
    set system services xnm-ssl rate-limit <limit> Where <limit> is the desired Rate Limit measured in Connection Attempts per Minute.
