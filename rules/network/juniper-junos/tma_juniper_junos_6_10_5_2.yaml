id: TMA-JUNIPER-JUNOS-6.10.5.2
title: Ensure REST is Set to HTTPS
description: The REST API should only be accessed using HTTPS. The JUNOS REST API can be configured for access using either HTTP or HTTPS for connections. HTTP transmits all data (including passwords) in clear text over the network and provides no assurance of the identity of the hosts involved. Passes when 'set system services rest' is not configured; otherwise requires 'set system services rest https'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.5.2 Ensure REST is Set to HTTPS
audit:
  type: config_regex
  pattern: (?m)\A(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^e\n]|e(?:$|[^t\n]|t(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^y\n]|y(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^e\n]|e(?:$|[^m\n]|m(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^i\n]|i(?:$|[^c\n]|c(?:$|[^e\n]|e(?:$|[^s\n]|s(?:$|[^ \n]| (?:$|[^r\n]|r(?:$|[^e\n]|e(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^ \n]| (?:$|[^h\n]|h(?:$|[^t\n]|t(?:$|[^t\n]|t(?:$|[^p\n]|p(?:$|[^s\n]))))))))))))))))))))))))))))))[^\n]*\n)*[ \t]*set system services rest (?:$|[^h\n]|h(?:$|[^t\n]|t(?:$|[^t\n]|t(?:$|[^p\n]|p(?:$|[^s\n])))))[^\n]*(?:\n(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^e\n]|e(?:$|[^t\n]|t(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^y\n]|y(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^e\n]|e(?:$|[^m\n]|m(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^i\n]|i(?:$|[^c\n]|c(?:$|[^e\n]|e(?:$|[^s\n]|s(?:$|[^ \n]| (?:$|[^r\n]|r(?:$|[^e\n]|e(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^ \n]| (?:$|[^h\n]|h(?:$|[^t\n]|t(?:$|[^t\n]|t(?:$|[^p\n]|p(?:$|[^s\n]))))))))))))))))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To configure REST over HTTPS, enter the following command from the hierarchy:
    set system services rest https server-certificate <Certificate ID> Where <Certificate ID> is the name of a Certificate which has already been loaded to the devices PKI Store. To create a new Public/Private Key Pair in the devices PKI Store and generate Certificate Signing Request issue the following commands from Operational Mode:
    request security pki generate-key-pair certificate-id <Certificate ID> type <Algorithm> size <Size>
    request security pki generate-certificate-request certificate-id <Certificate ID> domain-name <Device DNS Name> subject <Device Subject DN> Where: <Certificate ID> is the Name that will be used for this Certificate throughout configuration <Algorithm> is the Encryption Algorithm to be used (this should be either RSA or ECC) <Size> is the number of Bits used for the keys (use at least 2048bits for RSA or 256bits for ECC) <Device DNS Name> is the FQDN which will be used to manage the device and <Device Subject DN> is the Distinguished Name used to identify this device and certificate. Optionally, fields for email address, the device's IP Address and output Filename for the PKCS#10 CSR which will be generated can be included. The CSR should then be submitted to the Certificate Authority for review and signing. Once the CA returns the Certificate it can be uploaded to the JUNOS device and imported with the following command from Operational Mode:
    ! ... see the benchmark for the full procedure
