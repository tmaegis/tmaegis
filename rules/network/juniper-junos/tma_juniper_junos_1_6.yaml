id: TMA-JUNIPER-JUNOS-1.6
title: Ensure maximum RAM is installed
description: 'The router should have the maximum RAM installed. Some Denial of Service attacks rely on exhausting the target routers memory resources by bombarding the router with bogus requests or traffic, when the router runs out of memory it will stop being able to service genuine requests and may be unable to perform ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: low
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 1.6 Ensure maximum RAM is installed
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify that: The router should have the maximum RAM installed.'
remediation:
  type: iac_patch
  command: Installing the most RAM available for your system will both help to mitigate these attacks and boost performance of your routers. In most cases RAM upgrades are extremely cost effective way to increase router performance and survivability.
