id: TMA-JUNIPER-JUNOS-6.10.5.7
title: Ensure REST API Explorer is Not Set
description: The REST API Explorer should be disabled. When enabled, the JUNOS REST API can provide a Web GUI interface known as the REST API Explorer to allow developers to learn the API or test RPC calls. The API Explorer is not designed for use in production environments and adds an unnecessary additional ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.5.7 Ensure REST API Explorer is Not Set
audit:
  type: config_regex
  pattern: (?m)^set system services rest enable-explorer\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable the REST API Explorer, issue the following command from the hierarchy:
    delete system services rest enable-explorer This will disable the API Explorer for both HTTP and HTTPS access.
