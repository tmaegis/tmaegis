id: TMA-JUNIPER-JUNOS-1.4
title: Ensure configuration is backed up on a regular schedule
description: 'Regular backups should be made of the router. Backups of a routers configuration may be necessary when recovering from physical hardware failure, administrative errors or a successful attack. Preserving the evidence of an attack may also be necessary for regulatory compliance, forensic investigation or ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 1.4 Ensure configuration is backed up on a regular schedule
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify that: Regular backups should be made of the router.'
remediation:
  type: iac_patch
  command: A discussion of all possible backup methods is beyond the scope of this Benchmark. Consider the Archival section of this Benchmark for one method of obtaining remote backups whenever your configuration is changed. CVS tools such as RANCID provide an alternative method to backup and manage configuration files from a central location as well as keeping track of changes over time. Also consider a method of maintaining offline copies of your backup data, such as tape storage. This provides a vital tool in Disaster Recovery and is also extremely helpful when recovering from a successful attack, as you can be certain that the attacker was unable to alter the offline version.
