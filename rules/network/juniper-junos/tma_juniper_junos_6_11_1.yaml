id: TMA-JUNIPER-JUNOS-6.11.1
title: Ensure Auxiliary Port is Set to Disabled
description: The Auxiliary Port should be disabled when not required. The Auxiliary Port on a Juniper Device is used to connect Modems and other devices to allow remote administration of the router when other connectivity is not possible. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.11.1 Ensure Auxiliary Port is Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system ports auxiliary disable\b
remediation:
  type: iac_patch
  command: |-
    ! To disable the Auxiliary Port, issue the following command from the hierarchy;
    set system ports auxiliary disable
