id: TMA-JUNIPER-JUNOS-3.3
title: Ensure unused interfaces are set to disable
description: 'Unused interfaces should be explicitly disabled. JUNOS routers can be installed with tens or even hundreds of physical interfaces of different types. To ensure that unused interfaces are not connected to networks, either accidently or by a malicious user seeking to bypass security measures, all unused ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 3.3 Ensure unused interfaces are set to disable
audit:
  type: manual
  command: 'CIS assessment: Manual. From the command prompt, execute the following command: [edit] user@host#show interfaces <interface name> The following output should be returned <interface name> { disable; } Please note that other configuration items related to the interface may also appear between the curly braces.'
remediation:
  type: iac_patch
  command: |-
    ! To disable an interface enter the following command from the hierarchy.
    set interfaces <interface name> disable
