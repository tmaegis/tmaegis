id: TMA-JUNIPER-JUNOS-3.8
title: Ensure Loopback interface address is set
description: Configure a Loopback address. When a router needs to initiate connections to remote hosts, for example for SYSLOG or NTP, it will use the nearest interface for the packets source address. This can cause issues due to the possible variation in source, potentially causing packets to be ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: low
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 3.8 Ensure Loopback interface address is set
audit:
  type: config_regex
  pattern: (?m)^set interfaces lo0 unit 0 family inet address \S+
remediation:
  type: iac_patch
  command: |-
    ! To create a loopback interface enter the following command from the hierarchy:
    set interfaces lo0 unit 0 family inet address <ip address>
