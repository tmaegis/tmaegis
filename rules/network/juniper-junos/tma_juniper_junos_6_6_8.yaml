id: TMA-JUNIPER-JUNOS-6.6.8
title: Ensure login message is set
description: A login message should be displayed before a user logs into the router. Prior to a user logging into the router a legal notice should be displayed warning that they are connecting to a private system. This legal notice may be necessary to protect your organizations rights to pursue legal action or to monitor users of the system. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: low
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.6.8 Ensure login message is set
audit:
  type: config_regex
  pattern: (?m)^set system login message \S
remediation:
  type: iac_patch
  command: |-
    ! Configure a login message using the following command under the hierarchy:
    set system login message "<LEGAL NOTICE>"
