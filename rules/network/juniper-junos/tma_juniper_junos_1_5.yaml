id: TMA-JUNIPER-JUNOS-1.5
title: Ensure backup data is stored and transferred securely
description: 'Backups of router configuration should be secured. If an attacker has access to your router configuration files they have gained a lot of sensitive information about your network topology, defenses, weaknesses, critical servers and possibly your VPN keys and login information. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 1.5 Ensure backup data is stored and transferred securely
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify that: Backups of router configuration should be secured.'
remediation:
  type: iac_patch
  command: |-
    ! A discussion of securing your backup services is beyond the scope of this Benchmark, but at a minimum you should consider the following:
    - Never transfer configuration files using plain text protocols such as Telnet or FTP. Use SSH or SCP instead.
    - Restrict access to backups to the least number of administrative users possible.
    - Store offline backups in a physically secure, fire resistant, air tight safe.
    - Log access and changes to backups.
    - Secure any server that stores backups using the appropriate Center for Internet Security Benchmark.
    - Disable all unused services on the backup server.
