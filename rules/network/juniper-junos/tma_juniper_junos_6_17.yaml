id: TMA-JUNIPER-JUNOS-6.17
title: Ensure Ping Timestamps are Set to Disabled
description: The Routing Engine should not return Timestamp information to Ping Requests. When the Timestamp Request option is set in a Echo Request (ping) packet, a host generally responds with its current system time when the ping is received. Attackers may use Echo Requests with the Timestamp option set during recognizance of a network to ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: low
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.17 Ensure Ping Timestamps are Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system no-ping-time-stamp\b
remediation:
  type: iac_patch
  command: |-
    ! To ignore Echo Requests with the Timestamp Request option set, issue the following command from the hierarchy;
    set system no-ping-time-stamp
