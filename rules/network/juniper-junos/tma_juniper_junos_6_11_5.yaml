id: TMA-JUNIPER-JUNOS-6.11.5
title: Ensure Log-out-on-disconnect is Set for Console
description: Console sessions should be logged out as soon as the console cable is unplugged from the routers console port. Administrators often use a console port to configure JUNOS Devices when they have physical access to the device. When the administrator unplugs the cable from the console port, their session may be left logged in;. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.11.5 Ensure Log-out-on-disconnect is Set for Console
audit:
  type: config_regex
  pattern: (?m)^set system ports console log-out-on-disconnect\b
remediation:
  type: iac_patch
  command: |-
    ! To log console sessions out when the console cable is unplugged, issue the following command from the hierarchy;
    set system ports console log-out-on-disconnect
