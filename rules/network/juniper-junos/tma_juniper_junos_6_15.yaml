id: TMA-JUNIPER-JUNOS-6.15
title: Ensure Multicast Echo is Set to Disabled
description: The Routing Engine should ignore Echo Requests sent to Multicast addresses. An attacker may use multicast Echo Requests (pings) during recognizance of a network to obtain a list of network systems and what services they may be offering. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 6.15 Ensure Multicast Echo is Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system no-multicast-echo\b
remediation:
  type: iac_patch
  command: |-
    ! To ignore multicast Echo Requests, issue the following command from the hierarchy;
    set system no-multicast-echo
