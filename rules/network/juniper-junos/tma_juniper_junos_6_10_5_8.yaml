remediation:
  type: iac_patch
  command: |-
    ! To add an IP Address to the REST API Allowed Sources whitelist, enter the following command from the hierarchy:
    set system services rest control allowed-sources <Source IP> Where <Source IP> is a single host IP Address. To add multiple addresses to the Allowed Sources whitelist, enter the following command:
    set system services rest control allowed-sources [<Source IP 1> <Source IP 2> <Source IP ...> ] To remove a single address from the current list (for example, if the host is no longer used for Network Management) enter the following command:
    delete system services rest control allowed-sources <Source IP>
