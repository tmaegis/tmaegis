id: TMA-JUNIPER-JUNOS-6.10.5.8
title: Ensure REST Allowed Sources is Set
description: REST API Clients should be restricted to allowed sources. The REST API service allows remote scripts or users to connect to a JUNOS Device and execute RPC commands to operate and configure the device, potentially granting full control if connecting using a privileged account. Passes when 'set system services rest' is not configured; otherwise requires 'set system services rest control allowed-sources'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.5.8 Ensure REST Allowed Sources is Set
