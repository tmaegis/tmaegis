id: TMA-JUNIPER-JUNOS-6.16
title: Ensure Ping Record Route is Set to Disabled
description: The Routing Engine should ignore Echo Requests with the Record Route option set. When the Record Route Option is set on an Echo Request (ping), the hosts processing the packet should record their Interface addresses and a Timestamp on the response packet as it traverses the network (up to 9 hops) allowing the host that made the request to ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 6.16 Ensure Ping Record Route is Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system no-ping-record-route\b
remediation:
  type: iac_patch
  command: |-
    ! To disable reporting of Interface details in responses to Echo Requests with the Record Route option set, issue the following command from the hierarchy;
    set system no-ping-record-route
