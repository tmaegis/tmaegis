id: TMA-JUNIPER-JUNOS-3.5
title: Ensure proxy-arp is disabled
description: Do not use Proxy ARP. Address Resolution Protocol (ARP) provides resolution between IP and MAC Addresses (or other Network and Link Layer addresses on none IP networks) within a Layer 2 network. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 3.5 Ensure proxy-arp is disabled
audit:
  type: config_regex
  pattern: (?m)^set interfaces \S+ unit \d+ proxy-arp\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To disable Proxy ARP enter the following command from the hierarchy:
    delete interfaces <interface name> unit <unit number> proxy-arp
