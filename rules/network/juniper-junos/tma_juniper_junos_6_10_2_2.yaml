    \n]| (?:$|[^h\n]|h(?:$|[^t\n]|t(?:$|[^t\n]|t(?:$|[^p\n]|p(?:$|[^s\n]))))))))))))))))))))))))))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! To enable HTTPS access using the System Generated "Self Signed" Certificate, issue the following command from the hierarchy;
    set system services web-management https system-generated-certificate Alternatively, you may which to use a Local Certificate which is stored in the device's Configuration File:
    set system services web-management https local-certificate <Certificate Name> <Certificate Name> should match an X.509 Certificate loaded under the hierarchy as shown below:
    set security certificates <Certificate Name> load-key-file <File Name/URL> Where <File Name/URL> is either the name and path of a local Certificate and Key Pair file, or the URL from which the file can be fetched. Note
    - This method leaves the Certificate and Private Key as part of the devices Configuration file, potentially exposing them. This is not the preferred method to configure a certificate in most instances. Finally, you can configure JUNOS to use a PKI-Certificate:
    set system services web-management https pki-local-certificate <Certificate Name> Where <Certificate Name> is an X.509 Certificate which has already been loaded to the JUNOS device's local PKI store.
