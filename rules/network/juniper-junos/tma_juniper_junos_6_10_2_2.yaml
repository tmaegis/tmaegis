id: TMA-JUNIPER-JUNOS-6.10.2.2
title: Ensure Web-Management is Set to use HTTPS
description: JWeb should only be accessed using HTTPS. JWeb can be configured to provide a Web GUI over either HTTP or HTTPS. HTTP transmits all data (including passwords) in clear text over the network and provides no assurance of the identity of the hosts involved. Passes when 'set system services web-management' is not configured; otherwise requires 'set system services web-management https'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.2.2 Ensure Web-Management is Set to use HTTPS
