id: TMA-JUNIPER-JUNOS-4.2.5
title: Ensure IS-IS Hello authentication check is not suppressed
description: IS-IS Neighbors should be authenticated. Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure. Correct route information is required for routers to correctly direct traffic through the network. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 4.2.5 Ensure IS-IS Hello authentication check is not suppressed
audit:
  type: config_regex
  pattern: (?m)^set protocols isis [^\n]*\bno-hello-authentication\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! If you have deployed IS-IS in your network and have disabled hello authentication checking, re-enable it by issuing the following command from the hierarchy for each level at which it was configured:
    delete protocols isis level <level> no-hello-authentication
