id: TMA-JUNIPER-JUNOS-3.7
title: Ensure ICMP Redirects are set to disabled (on all untrusted IPv6 networks)
description: 'The Routing Engine should not send ICMP Redirect Messages. ICMP Redirect Messages provide a method for a router to communicate routing information with a host and is intended for use when a router receives packets to forward to a destination to which the host should have a direct route. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- hardening
reference: CIS Juniper OS Benchmark v2.1.0 - 3.7 Ensure ICMP Redirects are set to disabled (on all untrusted IPv6 networks)
audit:
  type: manual
  command: 'CIS assessment: Manual. From the command prompt, execute the following command: [edit] user@host#show interfaces | match "no-redirects-ipv6;" | count The above command should return an integer value equal to the number of untrusted interfaces on the device where IPv6 is configured. Because this is a subjective value, this recommendation is not scored.'
remediation:
  type: iac_patch
  command: |-
    ! To disable ICMP Redirect message generation on an untrusted network interface, issue the following command from the hierarchy;
    set interfaces <interface name> unit <unit number> family <address family> no-redirects
