id: TMA-JUNIPER-JUNOS-6.10.5.9
title: Ensure REST Connection Limit is Set
description: If the REST API service is configured, the Connection Limit should be set. The REST API may be accessed remotely, using either HTTP (though this is not recommended) or HTTPS. An attacker may attempt to open a large number of sessions to the REST API service to exhaust the routers resources or an authorized user may do so accidently, ... Passes when 'set system services rest' is not configured; otherwise requires 'set system services rest control connection-limit'. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.10.5.9 Ensure REST Connection Limit is Set
