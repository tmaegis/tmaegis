id: TMA-JUNIPER-JUNOS-6.11.3
title: Ensure Console Port is Set to Disabled
description: The JUNOS Device's Console Port should be disabled. Administrators often use Console Port on a JUNOS Device to configure the Device via the CLI when they have physical access to the device. In high security environments or deployments where the physical security of the JUNOS Device cannot be assured, such as ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- management-plane
reference: CIS Juniper OS Benchmark v2.1.0 - 6.11.3 Ensure Console Port is Set to Disabled
audit:
  type: config_regex
  pattern: (?m)^set system ports console disabled?\b
remediation:
  type: iac_patch
  command: |-
    ! To disable the Console Port, issue the following command from the hierarchy;
    set system ports console disabled
