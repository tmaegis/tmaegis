id: TMA-JUNIPER-JUNOS-6.12.2
title: Ensure At Least 2 External SYSLOG Hosts are Set with Any/Info
description: Logging data must be sent to at least two external SYSLOG servers. Log information from a JUNOS Device can be vital in detecting an attack and to allow incidents to be analyzed, investigated and (where appropriate) prosecuted. Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 2
severity: medium
tags:
- juniper-junos
- network
- logging
reference: CIS Juniper OS Benchmark v2.1.0 - 6.12.2 Ensure At Least 2 External SYSLOG Hosts are Set with Any/Info
audit:
  type: config_regex
  pattern: (?m)(?s:^set system syslog host \S+ any (?:any|info)\b.*^set system syslog host \S+ any (?:any|info)\b)
remediation:
  type: iac_patch
  command: |-
    ! SYSLOG data is recorded locally by default, you can configure external SYSLOG servers by issuing the following commands from the hierarchy;
    set system syslog host <Server 1> any <Severity>
    set system syslog host <Server 2> any <Severity> Where: - <Server 1> is the IP Address or Fully Qualified Domain Name of the first Remote SYSLOG or SIEM Server - <Server 2> is the IP Address or FQDN of a separate second Remote SYSLOG or SIEM Server. For added resilience, you may wish to place the second server on a different network to the first and this is recommended where possible. - <Severity> should be either any or info Some SYSLOG or SIEM Servers may require additional configuration items such as explicit-priority or structured-data options to be configured. It is possible to filter SYSLOG messages to be forwarded to the host using a match or match-string condition. This should not be set for the device's the Remote SYSLOG Hosts configured in meeting this Recommendation.
