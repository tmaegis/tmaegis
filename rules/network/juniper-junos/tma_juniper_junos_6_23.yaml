id: TMA-JUNIPER-JUNOS-6.23
title: Ensure Password is Set for PIC-Console-Authentication
description: Connections to the PIC Console should require a password. Many JUNOS Devices (including M, MX & T Series Routers, PTX Series and High End SRXs) utilize Physical Interface Cards to provide interface flexibility. Some PICs include additional Console Ports for performing advanced diagnostics on the Packet Forwarding ... Audited against the output of 'show configuration | display set | no-more' (set format, not the curly-brace hierarchy).
target: juniper-junos
level: 1
severity: high
tags:
- juniper-junos
- network
- aaa
reference: CIS Juniper OS Benchmark v2.1.0 - 6.23 Ensure Password is Set for PIC-Console-Authentication
audit:
  type: config_regex
  pattern: (?m)^set system pic-console-authentication encrypted-password \S
remediation:
  type: iac_patch
  command: |-
    ! To set a password for access to the PIC Console, issue the following command from the hierarchy:
    set system pic-console-authentication plain-text-password The JUNOS Device will prompt you to enter a new password, which must meet the complexity requirements configured under , as shown below:
    set system pic-console-authentication plain-text-password New password: Retype new password:
