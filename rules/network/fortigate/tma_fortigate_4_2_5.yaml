id: TMA-FORTIGATE-4.2.5
title: Enable grayware detection on antivirus
description: Grayware detection should be enabled. PASS requires grayware enable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 2
severity: high
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.2.5 Enable grayware detection on antivirus
audit:
  type: config_regex
  pattern: (?m)^config antivirus settings\n(?:[ \t]+[^\n]*\n)*?[ \t]+set grayware enable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config antivirus settings
        set grayware enable
    end
    # CIS guidance:
    On CLI:
    config antivirus settings
        set grayware enable
