id: TMA-FORTIGATE-2.1.9
title: Enable Global Strong Encryption
description: Enable FortiOS to only use strong encryption and allow only strong ciphers for communication PASS requires set strong-crypto enable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 2
severity: high
tags:
- fortigate
- crypto
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.9 Enable Global Strong Encryption
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set strong-crypto enable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set strong-crypto enable
    end
    # CIS guidance:
    CLI:
    config system global
        set strong-crypto enable
    end
