id: TMA-FORTIGATE-1.3
title: Disable all management related services on WAN port
description: Enabling any management related services on WAN interface is high risk. Management related services such as HTTPS, HTTP, ping, SSH, SNMP, and Radius should be disabled on WAN.
target: fortigate
level: 1
severity: medium
tags:
- fortigate
- management
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 1.3 Disable all management related services on WAN port
audit:
  type: manual
  command: 'On GUI: Go to "Network" > "Interfaces". Identify WAN interface and validate that HTTPS, HTTP, PING, SSH, SNMP, and Radius Accounting is not enabled in "Administrative Access" section. On CLI: ''FGT1 # show system interface'' Identify WAN interface and validate that "set allowaccess" does not include ping, https, http, ssh, snmp or radius-acct configured.'
remediation:
  type: iac_patch
  command: |-
    On GUI:
    Go to "Network" > "Interfaces". Review WAN interface and disable HTTPS, HTTP, ping, SSH, SNMP, and Radius services. On CLI:
    config system interface
        edit "port1"
            unselect allowaccess ping https ssh snmp http radius-acct
    Note:
    1. Interface name may differ based on deployment. For this example, port1 is deployed as WAN interface.
    2. "unselect allowaccess" will only show services that you have enabled. If you have not enabled snmp on that interface, then snmp option will not be available.
