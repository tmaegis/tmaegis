id: TMA-FORTIGATE-ADMIN-MAINTAINER
title: Ensure the maintainer account is disabled
description: The maintainer account allows a console user to reset the admin password with the serial number. PASS requires 'set admin-maintainer disable' in config system global. Ensure physical access and a recovery plan exist before disabling. Audited against FortiOS 'show full-configuration' output (patterns are scoped to the named 'config ... end' block, whose member lines are indented).
target: fortigate
level: 2
severity: medium
tags:
- fortigate
- authentication
reference: CIS Fortinet FortiGate Benchmark - Ensure the maintainer account is disabled (verify section number for your FortiOS release)
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+.*\n)*?[ \t]+set admin-maintainer disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set admin-maintainer disable
    end
