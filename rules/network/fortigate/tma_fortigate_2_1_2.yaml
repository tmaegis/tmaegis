id: TMA-FORTIGATE-2.1.2
title: Ensure 'Post-Login-Banner' is set
description: Sets the banner after users successfully log in. This is equivalent to Message of the Day (MOTD) in some other systems. PASS requires set post-login-banner enable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 1
severity: low
tags:
- fortigate
- banner
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.2 Ensure 'Post-Login-Banner' is set
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set post-login-banner enable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set post-login-banner enable
    end
    # CIS guidance:
    Run the following command in the CLI to enable the post-login-banner:
    config system global
        set post-login-banner enable
    end
    In the GUI, to edit the content of the post-login disclaimer message, go to System -> Replace Messages -> Extended View -> "Post-login Disclaimer Message". The edit screen is on the bottom right corner of the page. Click on "Save" after the editing is done.
