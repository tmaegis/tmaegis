id: TMA-FORTIGATE-4.1.2
title: Apply IPS Security Profile to Policies
description: Ensuring that traffic traversing between networks on the FortiGate have an IPS security profile inspecting it.
target: fortigate
level: 1
severity: high
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.1.2 Apply IPS Security Profile to Policies
audit:
  type: manual
  command: Review all firewall policies and ensure that traffic has an IPS security profile assigned for inspection.
remediation:
  type: iac_patch
  command: Configure on all "Allowed" firewall policies to have an appropriate IPS security profile applied to policies.
