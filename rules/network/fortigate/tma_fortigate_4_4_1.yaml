id: TMA-FORTIGATE-4.4.1
title: Create a Web Filtering Profile
description: Ensure FortiGuard Category-based Web filtering is blocking Security Risk categories
target: fortigate
level: 1
severity: medium
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.4.1 Create a Web Filtering Profile
audit:
  type: manual
  command: 'Security Profiles > Web Filter: in the profile applied to Internet policies confirm the Security Risk categories (Malicious Websites, Phishing, Spam URLs and the rest of the group) are set to Block. CLI: show webfilter profile <name> and check config ftgd-wf > config filters entries for those categories use set action block.'
remediation:
  type: iac_patch
  command: Apply Web Filter profile to the firewall policy or SD-WAN and ensure that the Security Risk categories, including Malicious Websites, Phishing, and Spam URLs, are configured to Block.
