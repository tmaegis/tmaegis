id: TMA-FORTIGATE-2.1.10
title: Ensure management GUI listens on secure TLS version
description: As we move towards better encryption capabilities, we need to also ensure GUI access is properly secured. TLS 1.3 is currently the most secure SSL/TLS supported version for SSL-encrypted administrator access (at this time of writing). PASS requires admin-https-ssl-versions to be exactly tlsv1-3. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 1
severity: high
tags:
- fortigate
- crypto
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.10 Ensure management GUI listens on secure TLS version
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set admin-https-ssl-versions tlsv1-3[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set admin-https-ssl-versions tlsv1-3
    end
    # CIS guidance:
    CLI:
    config system global
        set admin-https-ssl-versions tlsv1-3
