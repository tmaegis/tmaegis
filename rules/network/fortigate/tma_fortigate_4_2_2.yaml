id: TMA-FORTIGATE-4.2.2
title: Apply Antivirus Security Profile to Policies
description: Ensuring that traffic traversing between networks on the FortiGate has an Antivirus Security profile inspecting it.
target: fortigate
level: 2
severity: high
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.2.2 Apply Antivirus Security Profile to Policies
audit:
  type: manual
  command: Review all firewall policies and ensure that traffic has an antivirus security profile assigned for inspection.
remediation:
  type: iac_patch
  command: Review firewall policies and apply an appropriate antivirus security profile to policies.
