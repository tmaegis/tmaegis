id: TMA-FORTIGATE-4.5.4
title: Apply Application Control Security Profile to Policies
description: Ensuring that traffic traversing between networks on the FortiGate have an Application Control security profile inspecting it.
target: fortigate
level: 1
severity: medium
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.5.4 Apply Application Control Security Profile to Policies
audit:
  type: manual
  command: Review all firewall policies and ensure that traffic has an Application Control security profile assigned for inspection.
remediation:
  type: iac_patch
  command: Configure on all "Allowed" firewall policies to have an appropriate Application Control security profile applied to policies.
