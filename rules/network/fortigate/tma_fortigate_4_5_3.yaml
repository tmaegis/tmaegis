id: TMA-FORTIGATE-4.5.3
title: Ensure all Application Control related traffic is logged
description: Ensure no category is set to "Allow" on FortiGate Application Control.
target: fortigate
level: 1
severity: medium
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.5.3 Ensure all Application Control related traffic is logged
audit:
  type: manual
  command: 'On GUI: 1. Review "Security Profiles" > "Application Control". 2. Select the relevant App Control profile. Validate that no "Allow" action is set on any categories.'
remediation:
  type: iac_patch
  command: |-
    On GUI:
    1. Go to "Security Profiles" > "Application Control".
    2. Select the relevant App Control profile.
    3. Change any categories with "Allow" action to "Monitor".
