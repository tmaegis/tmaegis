id: TMA-FORTIGATE-2.1.13
title: Ensure Hostname is Not Displayed On Login GUI
description: Ensure that the device hostname is not displayed on the GUI login page PASS requires set gui-display-hostname disable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 2
severity: low
tags:
- fortigate
- management
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.13 Ensure Hostname is Not Displayed On Login GUI
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set gui-display-hostname disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set gui-display-hostname disable
    end
    # CIS guidance:
    To disable "gui-display-hostname" In the CLI:
    config system global
        set gui-display-hostname disable
    end
