id: TMA-FORTIGATE-4.5.1
title: Block high risk categories on Application Control
description: Ensure FortiGate Application Control blocks high risk applications to reduce attack surface.
target: fortigate
level: 1
severity: medium
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.5.1 Block high risk categories on Application Control
audit:
  type: manual
  command: 'GUI: 1. Go to "Security Profiles" > "Application Control". 2. Select App Control profile. Validate that "P2P" and "Proxy" category is blocked.'
remediation:
  type: iac_patch
  command: Review Application Control Security Profiles and validate that "P2P" and "Proxy" category is blocked.
