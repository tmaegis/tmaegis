id: TMA-FORTIGATE-3.1
title: Ensure that unused policies are reviewed regularly
description: All firewall policies should be reviewed regularly to verify the business purpose. Unused policies should be disabled and logged. Recommendation to review twice per year or inline with BCP practice (Business Continuity Plan). Some of the firewall policies will only be used during BCP, hence, the hit count might show 0 if the review is done too often.
target: fortigate
level: 2
severity: medium
tags:
- fortigate
- firewall-policy
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 3.1 Ensure that unused policies are reviewed regularly
audit:
  type: manual
  command: 'In CLI, type "diag firewall iprope show 100004 <policy_id>". In this example, we''ll verify policy with ID of 32. We''ll also need to clear the counter after each review so that we can tell if the policy is still being used for the next review : diag firewall iprope show 100004 32 idx=2 pkts/bytes=144967/135758174 asic_pkts/asic_bytes=0/0 flag=0x0 hit count:663 diag firewall iprope clear 100004 32 In the GUI, 1. Go to Policy & Objects. 2. Click on Firewall Policy. 3. Make sure that either the columns "Bytes" or "Hit Count" are visible. (Full steps: CIS 3.1.)'
remediation:
  type: iac_patch
  command: The remediation is to review and decide if you should delete unused policies.
