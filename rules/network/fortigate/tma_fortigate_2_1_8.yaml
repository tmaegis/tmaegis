id: TMA-FORTIGATE-2.1.8
title: Disable static keys for TLS
description: Disable support for static keys on TLS sessions terminating on the FortiGate PASS requires set ssl-static-key-ciphers disable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 2
severity: high
tags:
- fortigate
- crypto
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.8 Disable static keys for TLS
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set ssl-static-key-ciphers disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set ssl-static-key-ciphers disable
    end
    # CIS guidance:
    CLI:
    config system global
        set ssl-static-key-ciphers disable
    end
