id: TMA-FORTIGATE-2.1.1
title: Ensure 'Pre-Login Banner' is set
description: Configure a pre-login banner, ideally approved by the organization's legal team. This banner should, at minimum, prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word "welcome" or similar words of invitation. PASS requires set pre-login-banner enable. Audited against FortiOS 'show full-configuration' output (run it from the global context on VDOM-enabled units and save the full output); patterns are scoped to the named 'config ... end' block, whose member lines are indented.
target: fortigate
level: 1
severity: low
tags:
- fortigate
- banner
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 2.1.1 Ensure 'Pre-Login Banner' is set
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+[^\n]*\n)*?[ \t]+set pre-login-banner enable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set pre-login-banner enable
    end
    # CIS guidance:
    Run the following command in the CLI to enable the pre-login-banner:
    config system global
        set pre-login-banner enable
    end
    In the GUI, to edit the content of the pre-login disclaimer message:
    1. Go to 'System' -> 'Replacement Messages' -> 'Extended View' -> 'Pre-login Disclaimer Message'. The edit screen is on the bottom right corner of the page. Click on "Save" after the editing is done.
