id: TMA-FORTIGATE-ADMIN-TELNET
title: Ensure Telnet administrative access is disabled globally
description: The global admin-telnet switch disables the Telnet daemon for administration. PASS requires 'set admin-telnet disable' in config system global (FortiOS 7.x). Audited against FortiOS 'show full-configuration' output (patterns are scoped to the named 'config ... end' block, whose member lines are indented).
target: fortigate
level: 1
severity: high
tags:
- fortigate
- management
reference: CIS Fortinet FortiGate Benchmark - Ensure insecure administrative services are disabled (verify section number for your FortiOS release)
audit:
  type: config_regex
  pattern: (?m)^config system global\n(?:[ \t]+.*\n)*?[ \t]+set admin-telnet disable[ \t]*$
remediation:
  type: iac_patch
  command: |-
    config system global
        set admin-telnet disable
    end
