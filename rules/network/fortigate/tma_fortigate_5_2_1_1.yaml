id: TMA-FORTIGATE-5.2.1.1
title: Ensure Security Fabric is Configured
description: Ensure Root FortiGate is configured as security fabric root.
target: fortigate
level: 2
severity: medium
tags:
- fortigate
- hardening
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 5.2.1.1 Ensure Security Fabric is Configured
audit:
  type: manual
  command: 'Review through the GUI: 1. Go to "Security Fabric" -> Fabric Connectors and then select "Security Fabric Setup". 2. Validate that the root FortiGate has status set to enabled and the Security Fabric Role set to "Serve as Fabric Root". 3. Ensure that FortiAnalyzer settings are correct and that there is a defined Fabric name as well as interfaces selected that will "Allow other Security Fabric Devices to Join".'
remediation:
  type: iac_patch
  command: |-
    Remediation through the GUI:
    1. Go to "Security Fabric" -> Fabric Connectors and then select "Security Fabric Setup".
    2. On the root FortiGate, set the status to enabled and the Security Fabric Role to "Serve as Fabric Root".
    3. Configure FortiAnalyzer settings when prompted and define a Fabric name as well as interfaces that will "Allow other Security Fabric Devices to Join".
