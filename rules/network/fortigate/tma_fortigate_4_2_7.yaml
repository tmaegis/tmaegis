id: TMA-FORTIGATE-4.2.7
title: Enable CDR for proxy mode on XLSB, OpenOffice, and RTF files
description: Enabling Content Disarm & Reconstruction (CDR) for proxy mode on XLSB, OpenOffice, and RTF files enhances security by sanitizing potentially malicious content in these file types. This helps prevent threats embedded in documents while maintaining usability. Note that, this is only applicable for AV profiles and firewall policies in "Proxy mode".
target: fortigate
level: 2
severity: medium
tags:
- fortigate
- threat-prevention
reference: CIS FortiGate 7.4.x Benchmark v1.0.1 - 4.2.7 Enable CDR for proxy mode on XLSB, OpenOffice, and RTF files
audit:
  type: manual
  command: 'Ensure CDR is configured from GUI: 1. Go to Security Profiles > AntiVirus and click Create New. 2. Enable AntiVirus scan, and select Block. 3. Set Feature set to Proxy-based. 4. Under Inspected Protocols, enable one or more protocols that support proxy-based antivirus scanning. 5. Under APT Protection Options, enable Content Disarm and Reconstruction, and select Apply CDR to office files to disarm Microsoft Office and OpenOffice files, including RTF (Rich Text Format) and XLSB (Excel Binary Workbook) files.'
remediation:
  type: iac_patch
  command: |-
    To configure antivirus CDR in the GUI:
    1. Go to Security Profiles > AntiVirus and click Create New.
    2. Enable AntiVirus scan, and select Block.
    3. Set Feature set to Proxy-based.
    4. Under Inspected Protocols, enable one or more protocols that support proxy-based antivirus scanning.
    5. Under APT Protection Options, enable Content Disarm and Reconstruction, and select Apply CDR to office files to disarm Microsoft Office and OpenOffice files, including RTF (Rich Text Format) and XLSB (Excel Binary Workbook) files.
