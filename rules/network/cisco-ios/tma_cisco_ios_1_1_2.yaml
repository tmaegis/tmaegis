id: TMA-CISCO-IOS-1.1.2
title: Enable 'aaa authentication login'
description: Sets authentication, authorization and accounting (AAA) authentication at login. Using AAA authentication for interactive management access to the device provides consistent, centralized control of your network. The default under AAA (local or network) is to require users to log in using a valid user name and password. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.2 Enable 'aaa authentication login'
audit:
  type: config_regex
  pattern: (?m)^aaa authentication login \S+ \S
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA authentication method(s) for login authentication.
    aaa authentication login {default | aaa_list_name} [passwd-expiry] [method1] [method2]
