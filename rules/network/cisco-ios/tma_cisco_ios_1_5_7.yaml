id: TMA-CISCO-IOS-1.5.7
title: Set 'snmp-server host' when using SNMP
description: SNMP notifications can be sent as traps to authorized management systems. If SNMP is enabled for device management and device alerts are required, then ensure the device is configured to submit traps only to authorize management systems. Fails only when SNMP is configured (community/group/user) and no 'snmp-server host' is defined. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.7 Set 'snmp-server host' when using SNMP
audit:
  type: config_regex
  pattern: (?m)\A(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n]|p(?:$|[^\-\n]|-(?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^ \n]| (?:$|[^h\n]|h(?:$|[^o\n]|o(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^ \n])))))))))))))))))[^\n]*\n)*snmp-server (?:community|group|user) [^\n]*(?:\n(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n]|p(?:$|[^\-\n]|-(?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^ \n]| (?:$|[^h\n]|h(?:$|[^o\n]|o(?:$|[^s\n]|s(?:$|[^t\n]|t(?:$|[^ \n])))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Configure authorized SNMP trap community string and restrict sending messages to authorized management systems.
    snmp-server host {ip_address} {trap_community_string} {notification-type}
