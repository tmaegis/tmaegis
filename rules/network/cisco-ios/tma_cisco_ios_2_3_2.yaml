id: TMA-CISCO-IOS-2.3.2
title: Set 'ip address' for 'ntp server'
description: Use this command if you want to allow the system to synchronize the system software clock with the specified NTP server. To ensure that the time on your Cisco router is consistent with other devices in your network, at least two (and preferably at least three) NTP Server/s external to the router should be configured. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- ntp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.3.2 Set 'ip address' for 'ntp server'
audit:
  type: config_regex
  pattern: (?m)^ntp server \S+
remediation:
  type: iac_patch
  command: |-
    ! Configure at least one external NTP Server using the following commands
    ntp server {ntp-server_ip_address} or
    ntp server {ntp server vrf [vrf name] ip address}
