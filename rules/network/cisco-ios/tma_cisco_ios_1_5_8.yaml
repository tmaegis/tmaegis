id: TMA-CISCO-IOS-1.5.8
title: Set 'snmp-server enable traps snmp'
description: SNMP notifications can be sent as traps to authorized management systems. SNMP has the ability to submit traps . Fails only when SNMP is configured and 'snmp-server enable traps snmp' is absent. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.8 Set 'snmp-server enable traps snmp'
audit:
  type: config_regex
  pattern: (?m)\A(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n]|p(?:$|[^\-\n]|-(?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^ \n]| (?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^a\n]|a(?:$|[^b\n]|b(?:$|[^l\n]|l(?:$|[^e\n]|e(?:$|[^ \n]| (?:$|[^t\n]|t(?:$|[^r\n]|r(?:$|[^a\n]|a(?:$|[^p\n]|p(?:$|[^s\n]|s(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n])))))))))))))))))))))))))))))[^\n]*\n)*snmp-server (?:community|group|user|host) [^\n]*(?:\n(?:[ \t]*(?:$|[^s \t\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n]|p(?:$|[^\-\n]|-(?:$|[^s\n]|s(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^v\n]|v(?:$|[^e\n]|e(?:$|[^r\n]|r(?:$|[^ \n]| (?:$|[^e\n]|e(?:$|[^n\n]|n(?:$|[^a\n]|a(?:$|[^b\n]|b(?:$|[^l\n]|l(?:$|[^e\n]|e(?:$|[^ \n]| (?:$|[^t\n]|t(?:$|[^r\n]|r(?:$|[^a\n]|a(?:$|[^p\n]|p(?:$|[^s\n]|s(?:$|[^ \n]| (?:$|[^s\n]|s(?:$|[^n\n]|n(?:$|[^m\n]|m(?:$|[^p\n])))))))))))))))))))))))))))))[^\n]*))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Enable SNMP traps.
    snmp-server enable traps snmp authentication linkup linkdown coldstart
