id: TMA-CISCO-IOS-3.1.2
title: Set 'no ip proxy-arp'
description: 'Disable proxy ARP on all interfaces. Address Resolution Protocol (ARP) provides resolution between IP and MAC Addresses (or other Network and Link Layer addresses on none IP networks) within a Layer 2 network. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.1.2 Set 'no ip proxy-arp'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the proxy ARP status hostname#sh ip int {interface} | incl proxy-arp'
remediation:
  type: iac_patch
  command: |-
    ! Disable proxy ARP on all interfaces.
    interface {interface}
    no ip proxy-arp
