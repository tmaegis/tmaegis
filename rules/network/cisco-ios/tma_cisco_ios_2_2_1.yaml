id: TMA-CISCO-IOS-2.2.1
title: Set 'logging enable'
description: Enable logging of system messages. Logging provides a chronological record of activities on the Cisco device and allows monitoring of both operational and security related events. Checks for 'logging enable' under 'archive' / 'log config'. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.1 Set 'logging enable'
audit:
  type: config_regex
  pattern: (?m)^archive[ \t\r]*$[^\n]*\n(?:[ \t][^\n]*\n)*?[ \t]+logging enable\b
remediation:
  type: iac_patch
  command: |-
    ! Enable system logging.
    archive
    log config
    logging enable
    end
