id: TMA-CISCO-IOS-1.5.6
title: Create an 'access-list' for use with SNMP
description: 'You can use access lists to control the transmission of packets on an interface, control Simple Network Management Protocol (SNMP) access, and restrict the contents of routing updates. The Cisco IOS software stops checking the extended access list after a match occurs. SNMP ACLs control what addresses are authorized to manage and monitor the device via SNMP. If ACLs are not applied, then anyone with a valid SNMP community string may monitor and manage the router. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.6 Create an 'access-list' for use with SNMP
audit:
  type: manual
  command: 'CIS assessment: Manual. Perform the following to determine if the ACL is created: Verify you the appropriate access-list definitions hostname#sh ip access-list <snmp_acl_number>'
remediation:
  type: iac_patch
  command: |-
    ! Configure SNMP ACL for restricting access to the device from authorized management stations segmented in a trusted management zone.
    access-list <snmp_acl_number> permit <snmp_access-list>
    access-list deny any log
