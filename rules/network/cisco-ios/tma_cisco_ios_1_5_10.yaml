id: TMA-CISCO-IOS-1.5.10
title: Require 'aes 128' as minimum for 'snmp-server user' when using SNMPv3
description: 'Specify the use of a minimum of 128-bit AES algorithm for encryption when using SNMPv3. SNMPv3 provides much improved security over previous versions by offering options for Authentication and Encryption of messages. When configuring a user for SNMPv3 you have the option of using a range of encryption schemes, or no encryption at all, to protect ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.10 Require 'aes 128' as minimum for 'snmp-server user' when using SNMPv3
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the result show the appropriate user name and security settings hostname#show snmp user'
remediation:
  type: iac_patch
  command: |-
    ! For each SNMPv3 user created on your router add privacy options by issuing the following command.
    snmp-server user {user_name} {group_name} v3 auth sha {auth_password} priv aes 128 {priv_password} {acl_name_or_number}
