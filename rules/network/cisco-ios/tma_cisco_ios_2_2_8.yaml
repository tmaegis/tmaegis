id: TMA-CISCO-IOS-2.2.8
title: Set 'login success/failure logging'
description: Without generating audit records that are specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. Audit records can be generated from various components within the information system (e.g., module or policy filter). Requires both 'login on-failure log' and 'login on-success log'. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.8 Set 'login success/failure logging'
audit:
  type: config_regex
  pattern: (?m)(?s:^login on-failure log\b.*^login on-success log\b)|(?s:^login on-success log\b.*^login on-failure log\b)
remediation:
  type: iac_patch
  command: |-
    ! login on-failure log
    login on-success log
    end
