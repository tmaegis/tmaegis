id: TMA-CISCO-IOS-2.4.2
title: Set AAA 'source-interface'
description: Force AAA to use the IP address of a specified interface for all outgoing AAA packets. This is required so that the AAA server (RADIUS or TACACS+) can easily identify routers and authenticate requests by their IP address. CIS marks this Manual; automated as a config-line check. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.4.2 Set AAA 'source-interface'
audit:
  type: config_regex
  pattern: (?m)^[ \t]*ip (?:tacacs|radius) source-interface \S
remediation:
  type: iac_patch
  command: |-
    ! Bind AAA services to the loopback interface.
    ip radius source-interface loopback {loopback_interface_number} or
    aaa group server tacacs+ {group_name}
    ip tacacs source-interface {loopback_interface_number}
