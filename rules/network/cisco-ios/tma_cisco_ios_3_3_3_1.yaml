id: TMA-CISCO-IOS-3.3.3.1
title: Set 'neighbor password'
description: 'Enable message digest5 (MD5) authentication on a TCP connection between two BGP peers. Enforcing routing authentication reduces the likelihood of routing poisoning and unauthorized routers from joining BGP routing. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.3.1 Set 'neighbor password'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify you see the appropriate neighbor password is defined: hostname#sh run | sec router bgp'
remediation:
  type: iac_patch
  command: |-
    ! Configure BGP neighbor authentication where feasible.
    router bgp <bgp_as-number>
    neighbor <bgp_neighbor-ip | peer-group-name> password <password>
