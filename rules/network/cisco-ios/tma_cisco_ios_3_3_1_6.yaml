id: TMA-CISCO-IOS-3.3.1.6
title: Set 'authentication key-chain'
description: 'Configure the EIGRP address family key chain. This is part of the EIGRP authentication configuration. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.6 Set 'authentication key-chain'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate key chain is set hostname#sh run | sec router eigrp'
remediation:
  type: iac_patch
  command: |-
    ! Configure the EIGRP address family key chain.
    router eigrp <virtual-instance-name>
    address-family ipv4 autonomous-system {eigrp_as-number}
    af-interface {interface-name}
    authentication key-chain {eigrp_key-chain_name}
