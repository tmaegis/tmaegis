id: TMA-CISCO-IOS-3.3.1.5
title: Set 'af-interface default'
description: 'Defines user defaults to apply to EIGRP interfaces that belong to an address-family. Part of the EIGRP address-family setup. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.5 Set 'af-interface default'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the setting hostname#sh run | sec router eigrp'
remediation:
  type: iac_patch
  command: |-
    ! Configure the EIGRP address family.
    router eigrp <virtual-instance-name>
    address-family ipv4 autonomous-system {eigrp_as-number}
    af-interface default
