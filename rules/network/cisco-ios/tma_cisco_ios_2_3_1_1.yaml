id: TMA-CISCO-IOS-2.3.1.1
title: Set 'ntp authenticate'
description: Enable NTP authentication. Using authenticated NTP ensures the Cisco device only permits time updates from authorized NTP servers. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- ntp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.3.1.1 Set 'ntp authenticate'
audit:
  type: config_regex
  pattern: (?m)^ntp authenticate\s*$
remediation:
  type: iac_patch
  command: |-
    ! Configure NTP authentication:
    ntp authenticate
