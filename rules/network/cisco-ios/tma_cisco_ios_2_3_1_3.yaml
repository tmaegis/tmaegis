id: TMA-CISCO-IOS-2.3.1.3
title: Set the 'ntp trusted-key'
description: Ensure you authenticate the identity of a system to which Network Time Protocol (NTP) will synchronize. This authentication function provides protection against accidentally synchronizing the system to another system that is not trusted, because the other system must know the correct authentication key. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- ntp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.3.1.3 Set the 'ntp trusted-key'
audit:
  type: config_regex
  pattern: (?m)^ntp trusted-key \d+
remediation:
  type: iac_patch
  command: |-
    ! Configure the NTP trusted key using the following command
    ntp trusted-key {ntp_key_id}
