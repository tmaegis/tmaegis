id: TMA-CISCO-IOS-3.1.4
title: Set 'ip verify unicast source reachable-via'
description: 'Examines incoming packets to determine whether the source address is in the Forwarding Information Base (FIB) and permits the packet only if the source is reachable through the interface on which the packet was received (sometimes referred to as strict mode). Enabled uRPF helps mitigate IP spoofing by ensuring only packet source IP addresses only originate from expected interfaces. Configure unicast reverse-path forwarding (uRPF) on all external or high risk interfaces. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.1.4 Set 'ip verify unicast source reachable-via'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify uRPF is running on the appropriate interface(s) hostname#sh ip int {interface} | incl verify source'
remediation:
  type: iac_patch
  command: |-
    ! Configure uRPF.
    interface {interface_name}
    ip verify unicast source reachable-via rx allow-default
