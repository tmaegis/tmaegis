id: TMA-CISCO-IOS-1.3.2
title: Set the 'banner-text' for 'banner login'
description: Follow the banner login command with one or more blank spaces and a delimiting character of your choice. Then enter one or more lines of text, terminating the message with the second occurrence of the delimiting character. When a user connects to the router, the message-of-the-day (MOTD) banner (if configured) appears first, followed by the login banner and prompts. "Network banners are electronic messages that provide notice of legal rights to users of computer networks. From a legal standpoint, banners have four primary functions. - First, banners may be used to generate consent to real-time monitoring under Title III. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: low
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.3.2 Set the 'banner-text' for 'banner login'
audit:
  type: config_regex
  pattern: (?m)^banner login \S
remediation:
  type: iac_patch
  command: |-
    ! Configure the device so a login banner presented to a user attempting to access the device.
    banner login c Enter TEXT message. End with the character 'c'. <banner-text> c
