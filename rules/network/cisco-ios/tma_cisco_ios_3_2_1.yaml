id: TMA-CISCO-IOS-3.2.1
title: Set 'ip access-list extended' to Forbid Private Source Addresses from External Networks
description: 'This command places the router in access-list configuration mode, where you must define the denied or permitted access conditions by using the deny and permit commands. Configuring access controls can help prevent spoofing attacks. To reduce the effectiveness of IP spoofing, configure access control to deny any traffic from the external network that has a source address that should reside on the internal network. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.2.1 Set 'ip access-list extended' to Forbid Private Source Addresses from External Networks
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify you have the appropriate access-list definitions hostname#sh ip access-list {name | number}'
remediation:
  type: iac_patch
  command: |-
    ! Configure ACL for private source address restrictions from external networks.
    ip access-list extended {name | number}
    deny ip {internal_networks} any log
    deny ip 127.0.0.0 0.255.255.255 any log
    deny ip 10.0.0.0 0.255.255.255 any log
    deny ip 0.0.0.0 0.255.255.255 any log
    deny ip 172.16.0.0 0.15.255.255 any log
    deny ip 192.168.0.0 0.0.255.255 any log
    deny ip 192.0.2.0 0.0.0.255 any log
    deny ip 169.254.0.0 0.0.255.255 any log
    deny ip 224.0.0.0 31.255.255.255 any log
    deny ip host 255.255.255.255 any log
    permit {protocol} {source_ip} {source_mask} {destination} {destination_mask} log
    deny any any log
    interface <external_interface>
    access-group <access-list> in
