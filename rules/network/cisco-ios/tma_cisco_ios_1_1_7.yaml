id: TMA-CISCO-IOS-1.1.7
title: Set 'aaa accounting connection'
description: Provides information about all outbound connections made from the network access server. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.7 Set 'aaa accounting connection'
audit:
  type: config_regex
  pattern: (?m)^aaa accounting connection \S+ (?:start-stop|stop-only)\b
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA accounting for connections.
    aaa accounting connection {default | list-name | guarantee-first} {start-stop | stop-only | none} {radius | group group-name}
