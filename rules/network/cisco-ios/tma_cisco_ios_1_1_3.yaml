id: TMA-CISCO-IOS-1.1.3
title: Enable 'aaa authentication enable default'
description: Authenticates users who access privileged EXEC mode when they use the enable command. Using AAA authentication for interactive management access to the device provides consistent, centralized control of your network. The default under AAA (local or network) is to require users to log in using a valid user name and password. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.3 Enable 'aaa authentication enable default'
audit:
  type: config_regex
  pattern: (?m)^aaa authentication enable default \S
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA authentication method(s) for enable authentication.
    aaa authentication enable default {method1} enable
