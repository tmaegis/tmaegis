id: TMA-CISCO-IOS-1.3.4
title: Set the 'banner-text' for 'webauth banner'
description: This banner is displayed to all terminals connected and is useful for sending messages that affect all users (such as impending system shutdowns). Use the no exec-banner or no motd-banner command to disable the banner on a line. The no exec-banner command also disables the EXEC banner on the line. When a user connects to the router, the MOTD banner appears before the login prompt. "Network banners are electronic messages that provide notice of legal rights to users of computer networks. From a legal standpoint, banners have four primary functions. - First, banners may be used to generate consent to real-time monitoring under Title III. Only relevant where web authentication (auth-proxy) is used. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: low
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.3.4 Set the 'banner-text' for 'webauth banner'
audit:
  type: config_regex
  pattern: (?m)^ip admission auth-proxy-banner http\b
remediation:
  type: iac_patch
  command: |-
    ! Configure the webauth banner presented when a user connects to the device.
    ip admission auth-proxy-banner http {banner-text | filepath}
