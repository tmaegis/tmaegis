id: TMA-CISCO-IOS-NO-ENABLE-PASSWORD
title: Ensure 'enable password' is not configured
description: '''enable password'' is stored as type 0 or reversible type 7; only ''enable secret'' should be configured. Audited against the output of ''show running-config'' (run ''terminal length 0'' first and save the full output, do not use ''show startup-config'' or ''show running-config all'').'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS Benchmark - Management Plane / Password Rules (verify section number for your release)
audit:
  type: config_regex
  pattern: '(?m)^enable password '
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    configure terminal
     no enable password
     enable algorithm-type scrypt secret <STRONG_SECRET>
    end
