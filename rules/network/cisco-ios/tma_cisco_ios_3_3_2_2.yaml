id: TMA-CISCO-IOS-3.3.2.2
title: Set 'ip ospf message-digest-key md5'
description: 'Enable Open Shortest Path First (OSPF) Message Digest 5 (MD5) authentication. This is part of the OSPF authentication setup. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: low
tags:
- cisco-ios
- network
- routing
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.2.2 Set 'ip ospf message-digest-key md5'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate md5 key is defined on the appropriate interface(s) hostname#sh run int {interface}'
remediation:
  type: iac_patch
  command: |-
    ! Configure the appropriate interface(s) for Message Digest authentication
    interface {interface_name}
    ip ospf message-digest-key {ospf_md5_key-id} md5 {ospf_md5_key}
