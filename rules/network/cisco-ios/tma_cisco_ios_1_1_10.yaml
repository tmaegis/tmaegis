id: TMA-CISCO-IOS-1.1.10
title: Set 'aaa accounting system'
description: Performs accounting for all system-level events not associated with users, such as reloads. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.10 Set 'aaa accounting system'
audit:
  type: config_regex
  pattern: (?m)^aaa accounting system \S+ (?:start-stop|stop-only)\b
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA accounting system.
    aaa accounting system {default | list-name | guarantee-first} {start-stop | stop-only | none} {radius | group group-name}
