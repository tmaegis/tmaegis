id: TMA-CISCO-IOS-1.1.8
title: Set 'aaa accounting exec'
description: Runs accounting for the EXEC shell session. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.8 Set 'aaa accounting exec'
audit:
  type: config_regex
  pattern: (?m)^aaa accounting exec \S+ (?:start-stop|stop-only)\b
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA accounting for EXEC shell session.
    aaa accounting exec {default | list-name | guarantee-first} {start-stop | stop-only | none} {radius | group group-name}
