id: TMA-CISCO-IOS-2.1.7
title: Set 'no service pad'
description: Disable X.25 Packet Assembler/Disassembler (PAD) service. If the PAD service is not necessary, disable the service to prevent intruders from accessing the X.25 PAD command set on the router. CIS marks this Manual; automated as a config-line check. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.1.7 Set 'no service pad'
audit:
  type: config_regex
  pattern: (?m)^no service pad\s*$
remediation:
  type: iac_patch
  command: |-
    ! Disable the PAD service.
    no service pad
