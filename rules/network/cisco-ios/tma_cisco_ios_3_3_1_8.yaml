id: TMA-CISCO-IOS-3.3.1.8
title: Set 'ip authentication key-chain eigrp'
description: 'Specify the type of authentication used in Enhanced Interior Gateway Routing Protocol (EIGRP) packets per interface. Configuring EIGRP authentication key-chain number and name to restrict packet exchanges between network devices. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.8 Set 'ip authentication key-chain eigrp'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate key chain is set on the appropriate interface(s) hostname#sh ip eigrp int hostname#sh run int {interface_name} | incl key-chain'
remediation:
  type: iac_patch
  command: |-
    ! Configure the interface with the EIGRP key chain.
    interface {interface_name}
    ip authentication key-chain eigrp {eigrp_as-number} {eigrp_key-chain_name}
