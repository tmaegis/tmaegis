id: TMA-CISCO-IOS-3.3.1.9
title: Set 'ip authentication mode eigrp'
description: 'Configure authentication to prevent unapproved sources from introducing unauthorized or false routing messages. This is part of the EIGRP authentication configuration. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.9 Set 'ip authentication mode eigrp'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate authentication mode is set on the appropriate interface(s) hostname#sh ip eigrp int hostname#sh run int {interface_name} | incl authentication mode'
remediation:
  type: iac_patch
  command: |-
    ! Configure the interface with the EIGRP authentication mode.
    interface {interface_name}
    ip authentication mode eigrp {eigrp_as-number} md5
