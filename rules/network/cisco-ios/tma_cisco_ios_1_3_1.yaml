id: TMA-CISCO-IOS-1.3.1
title: Set the 'banner-text' for 'banner exec'
description: This command specifies a message to be displayed when an EXEC process is created (a line is activated, or an incoming connection is made to a vty). Follow this command with one or more blank spaces and a delimiting character of your choice. Then enter one or more lines of text, terminating the message with the second occurrence of the delimiting character. "Network banners are electronic messages that provide notice of legal rights to users of computer networks. From a legal standpoint, banners have four primary functions. - First, banners may be used to generate consent to real-time monitoring under Title III. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: low
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.3.1 Set the 'banner-text' for 'banner exec'
audit:
  type: config_regex
  pattern: (?m)^banner exec \S
remediation:
  type: iac_patch
  command: |-
    ! Configure the EXEC banner presented to a user when accessing the devices enable prompt.
    banner exec c Enter TEXT message. End with the character 'c'. <banner-text> c
