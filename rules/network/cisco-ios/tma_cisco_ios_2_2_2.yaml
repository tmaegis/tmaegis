id: TMA-CISCO-IOS-2.2.2
title: Set 'buffer size' for 'logging buffered'
description: Enable system message logging to a local buffer. The device can copy and store log messages to an internal memory buffer. The buffered data is available only from a router exec or enabled exec session. This form of logging is useful for debugging and monitoring when logged in to a router. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.2 Set 'buffer size' for 'logging buffered'
audit:
  type: config_regex
  pattern: (?m)^logging buffered \d+
remediation:
  type: iac_patch
  command: |-
    ! Configure buffered logging (with minimum size). Recommended size is 64000.
    logging buffered [log_buffer_size]
