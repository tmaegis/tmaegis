id: TMA-CISCO-IOS-3.3.1.4
title: Set 'address-family ipv4 autonomous-system'
description: 'Configure the EIGRP address family. Rationale: EIGRP is a true multi-protocol routing protocol and the ''address-family'' feature enables restriction of exchanges with specific neighbors. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.4 Set 'address-family ipv4 autonomous-system'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate address family is set hostname#sh run | sec router eigrp'
remediation:
  type: iac_patch
  command: |-
    ! Configure the EIGRP address family.
    router eigrp <virtual-instance-name>
    address-family ipv4 autonomous-system {eigrp_as-number}
