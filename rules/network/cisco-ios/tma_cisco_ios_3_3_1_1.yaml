id: TMA-CISCO-IOS-3.3.1.1
title: Set 'key chain'
description: 'Define an authentication key chain to enable authentication for routing protocols. A key chain must have at least one key and can have up to 2,147,483,647 keys. NOTE: Only DRP Agent, EIGRP, and RIPv2 use key chains. Routing protocols such as DRP Agent, EIGRP, and RIPv2 use key chains for authentication. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- routing
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.1 Set 'key chain'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate key chain is defined hostname#sh run | sec key chain'
remediation:
  type: iac_patch
  command: |-
    ! Establish the key chain.
    key chain {key-chain_name}
