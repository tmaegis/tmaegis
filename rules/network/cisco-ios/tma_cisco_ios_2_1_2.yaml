id: TMA-CISCO-IOS-2.1.2
title: Set 'no cdp run'
description: Disable Cisco Discovery Protocol (CDP) service at device level. The Cisco Discovery Protocol is a proprietary protocol that Cisco devices use to identify each other on a LAN segment. It is useful only in network monitoring and troubleshooting situations but is considered a security risk because of the amount of ... CIS marks this Manual (CDP may be needed operationally); automated as a config-line check. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.1.2 Set 'no cdp run'
audit:
  type: config_regex
  pattern: (?m)^no cdp run\s*$
remediation:
  type: iac_patch
  command: |-
    ! Disable Cisco Discovery Protocol (CDP) service globally.
    no cdp run
