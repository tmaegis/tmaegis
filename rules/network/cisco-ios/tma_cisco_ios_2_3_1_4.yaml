id: TMA-CISCO-IOS-2.3.1.4
title: Set 'key' for each 'ntp server'
description: 'Specifies the authentication key for NTP. This authentication feature provides protection against accidentally synchronizing the ntp system to another system that is not trusted, because the other system must know the correct authentication key. CIS marks this Manual; automated: fails if any ''ntp server'' line has no ''key <id>''. Audited against the output of ''show running-config'' (run ''terminal length 0'' first; do not use ''show running-config all'' or ''show startup-config'').'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- ntp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.3.1.4 Set 'key' for each 'ntp server'
audit:
  type: config_regex
  pattern: (?m)^ntp server (?:(?:[^k \t\n][^ \t\n]*|k(?:|[^e \t\n][^ \t\n]*|e(?:|[^y \t\n][^ \t\n]*|y(?:[^ \t\n][^ \t\n]*))))[ \t]+)*(?:(?:[^k \t\n][^ \t\n]*|k(?:|[^e \t\n][^ \t\n]*|e(?:|[^y \t\n][^ \t\n]*|y(?:[^ \t\n][^ \t\n]*)))))?$
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Configure each NTP Server to use a key ring using the following command.
    ntp server {ntp-server_ip_address}{key ntp_key_id}
