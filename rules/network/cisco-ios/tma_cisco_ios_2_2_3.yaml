id: TMA-CISCO-IOS-2.2.3
title: Set 'logging console critical'
description: Verify logging to device console is enabled and limited to a rational severity level to avoid impacting system performance and management. This configuration determines the severity of messages that will generate console messages. Logging to console should be limited only to those messages required for immediate troubleshooting while logged into the device. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.3 Set 'logging console critical'
audit:
  type: config_regex
  pattern: (?m)^logging console critical\b
remediation:
  type: iac_patch
  command: |-
    ! Configure console logging level.
    logging console critical
