id: TMA-CISCO-IOS-LOGIN-BLOCK-FOR
title: Ensure login brute-force protection is enabled ('login block-for')
description: login block-for enters quiet mode after repeated failed logins, slowing password guessing. Audited against the output of 'show running-config' (run 'terminal length 0' first and save the full output, do not use 'show startup-config' or 'show running-config all').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS Benchmark - Management Plane / Login Enhancements (verify section number for your release)
audit:
  type: config_regex
  pattern: (?m)^login block-for \d+ attempts \d+ within \d+
remediation:
  type: iac_patch
  command: |-
    configure terminal
     login block-for 120 attempts 3 within 60
     login on-failure log
    end
