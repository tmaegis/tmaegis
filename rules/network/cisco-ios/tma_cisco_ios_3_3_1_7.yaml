id: TMA-CISCO-IOS-3.3.1.7
title: Set 'authentication mode md5'
description: 'Configure authentication to prevent unapproved sources from introducing unauthorized or false service messages. This is part of the EIGRP authentication configuration. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.3.1.7 Set 'authentication mode md5'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the appropriate address family authentication mode is set hostname#sh run | sec router eigrp'
remediation:
  type: iac_patch
  command: |-
    ! Configure the EIGRP address family authentication mode.
    router eigrp <virtual-instance-name>
    address-family ipv4 autonomous-system {eigrp_as-number}
    af-interface {interface-name}
    authentication mode md5
