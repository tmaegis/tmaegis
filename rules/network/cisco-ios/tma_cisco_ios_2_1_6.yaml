id: TMA-CISCO-IOS-2.1.6
title: Set 'service tcp-keepalives-out'
description: Generate keepalive packets on idle outgoing network connections. Stale connections use resources and could potentially be hijacked to gain illegitimate access. The TCP keepalives-in service generates keepalive packets on idle incoming network connections (initiated by remote host). Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.1.6 Set 'service tcp-keepalives-out'
audit:
  type: config_regex
  pattern: (?m)^service tcp-keepalives-out\s*$
remediation:
  type: iac_patch
  command: |-
    ! Enable TCP keepalives-out service:
    service tcp-keepalives-out
