id: TMA-CISCO-IOS-3.2.2
title: Set inbound 'ip access-group' on the External Interface
description: 'This command places the router in access-list configuration mode, where you must define the denied or permitted access conditions by using the deny and permit commands. Configuring access controls can help prevent spoofing attacks. To reduce the effectiveness of IP spoofing, configure access control to deny any traffic from the external network that has a source address that should reside on the internal network. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 2
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.2.2 Set inbound 'ip access-group' on the External Interface
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the access-group is applied to the appropriate interface hostname#sh run | sec interface {external_interface}'
remediation:
  type: iac_patch
  command: |-
    ! Apply the access-group for the external (untrusted) interface
    interface {external_interface}
    ip access-group {name | number} in
