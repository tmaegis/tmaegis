id: TMA-CISCO-IOS-1.5.9
title: Set 'priv' for each 'snmp-server group' using SNMPv3
description: Specifies authentication of a packet with encryption when using SNMPv3. SNMPv3 provides much improved security over previous versions by offering options for Authentication and Encryption of messages. When configuring a user for SNMPv3 you have the option of using a range of encryption schemes, or no encryption at all, to protect ... Fails if any SNMPv3 group uses 'auth' or 'noauth' instead of 'priv'. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.9 Set 'priv' for each 'snmp-server group' using SNMPv3
audit:
  type: config_regex
  pattern: (?m)^snmp-server group \S+ v3 (?:auth|noauth)\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! For each SNMPv3 group created on your router add privacy options by issuing the following command...
    snmp-server group {group_name} v3 priv
