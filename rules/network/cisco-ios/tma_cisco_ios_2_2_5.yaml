id: TMA-CISCO-IOS-2.2.5
title: Set 'logging trap informational'
description: Limit messages logged to the syslog servers based on severity level informational. This determines the severity of messages that will generate simple network management protocol (SNMP) trap and or syslog messages. This setting should be set to either "debugging" (7) or "informational" (6), but no lower. 'logging trap informational' is the default and is not shown; fails if a less verbose trap level is set or trap logging is disabled. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.5 Set 'logging trap informational'
audit:
  type: config_regex
  pattern: (?m)^(?:logging trap (?:emergencies|alerts|critical|errors|warnings|notifications|[0-5])\b|no logging trap\b)
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Configure SNMP trap and syslog logging level.
    logging trap informational
