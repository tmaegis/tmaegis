id: TMA-CISCO-IOS-1.1.1
title: Enable 'aaa new-model'
description: This command enables the AAA access control system. Authentication, authorization and accounting (AAA) services provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.1 Enable 'aaa new-model'
audit:
  type: config_regex
  pattern: (?m)^aaa new-model\s*$
remediation:
  type: iac_patch
  command: |-
    ! Globally enable authentication, authorization and accounting (AAA) using the new-model command.
    aaa new-model
