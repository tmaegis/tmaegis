id: TMA-CISCO-IOS-1.1.6
title: Set 'aaa accounting' to log all privileged use commands using 'commands 15'
description: Runs accounting for all commands at the specified privilege level. Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed once authenticated and ... Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.1.6 Set 'aaa accounting' to log all privileged use commands using 'commands 15'
audit:
  type: config_regex
  pattern: (?m)^aaa accounting commands 15 \S+ (?:start-stop|stop-only)\b
remediation:
  type: iac_patch
  command: |-
    ! Configure AAA accounting for commands.
    aaa accounting commands 15 {default | list-name | guarantee-first} {start-stop | stop-only | none} {radius | group group-name}
