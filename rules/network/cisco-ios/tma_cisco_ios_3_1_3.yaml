id: TMA-CISCO-IOS-3.1.3
title: Set 'no interface tunnel'
description: 'Verify no tunnel interfaces are defined. Tunnel interfaces should not exist in general. They can be used for malicious purposes. If they are necessary, the network admin''s should be well aware of them and their purpose. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.1.3 Set 'no interface tunnel'
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify no tunnel interfaces are defined hostname#sh ip int brief | incl tunnel'
remediation:
  type: iac_patch
  command: |-
    ! Remove any tunnel interfaces.
    no interface tunnel {instance}
