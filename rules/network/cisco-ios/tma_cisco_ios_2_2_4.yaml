id: TMA-CISCO-IOS-2.2.4
title: Set IP address for 'logging host'
description: Log system messages and debug output to a remote host. Cisco routers can send their log messages to a Unix-style Syslog service. A syslog service simply accepts messages and stores them in files or prints them according to a simple configuration file. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.4 Set IP address for 'logging host'
audit:
  type: config_regex
  pattern: (?m)^logging (?:host \S+|\d{1,3}(?:\.\d{1,3}){3})
remediation:
  type: iac_patch
  command: |-
    ! Designate one or more syslog servers by IP address.
    logging host {syslog_server}
