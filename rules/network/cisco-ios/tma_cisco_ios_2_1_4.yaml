id: TMA-CISCO-IOS-2.1.4
title: Set 'no service dhcp'
description: Disable the Dynamic Host Configuration Protocol (DHCP) server and relay agent features on your router. The DHCP server supplies automatic configuration parameters, such as dynamic IP address, to requesting systems. A dedicated server located in a secured management zone should be used to provide DHCP services instead. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.1.4 Set 'no service dhcp'
audit:
  type: config_regex
  pattern: (?m)^no service dhcp\s*$
remediation:
  type: iac_patch
  command: |-
    ! Disable the DHCP server.
    no service dhcp
