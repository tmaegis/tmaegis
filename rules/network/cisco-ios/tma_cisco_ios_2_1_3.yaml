id: TMA-CISCO-IOS-2.1.3
title: Set 'no ip bootp server'
description: Disable the Bootstrap Protocol (BOOTP) service on your routing device. BootP allows a router to issue IP addresses. This should be disabled unless there is a specific requirement. CIS marks this Manual; automated as a config-line check. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.1.3 Set 'no ip bootp server'
audit:
  type: config_regex
  pattern: (?m)^(?:no ip bootp server|ip dhcp bootp ignore)\s*$
remediation:
  type: iac_patch
  command: |-
    ! Disable the bootp server.
    ip dhcp bootp ignore
