id: TMA-CISCO-IOS-2.3.1.2
title: Set 'ntp authentication-key'
description: Define an authentication key for Network Time Protocol (NTP). Using an authentication key provides a higher degree of security as only authenticated NTP servers will be able to update time for the Cisco device. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- ntp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.3.1.2 Set 'ntp authentication-key'
audit:
  type: config_regex
  pattern: (?m)^ntp authentication-key \d+ \S+ \S
remediation:
  type: iac_patch
  command: |-
    ! Configure at the NTP key ring and encryption key using the following command
    ntp authentication-key {ntp_key_id} md5 {ntp_key_hash}
