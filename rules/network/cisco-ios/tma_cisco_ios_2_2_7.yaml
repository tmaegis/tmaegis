id: TMA-CISCO-IOS-2.2.7
title: Set 'logging source interface'
description: Specify the source IPv4 or IPv6 address of system logging packets. This is required so that the router sends log messages to the logging server from a consistent IP address. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- logging
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 2.2.7 Set 'logging source interface'
audit:
  type: config_regex
  pattern: (?m)^logging source-interface \S
remediation:
  type: iac_patch
  command: |-
    ! Bind logging to the loopback interface.
    logging source-interface loopback {loopback_interface_number}
