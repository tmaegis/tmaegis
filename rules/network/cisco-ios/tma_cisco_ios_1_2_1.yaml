id: TMA-CISCO-IOS-1.2.1
title: Set 'privilege 1' for local users
description: 'Sets the privilege level for the user. Default device configuration does not require strong user authentication potentially enabling unfettered access to an attacker that is able to reach the device. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- aaa
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.2.1 Set 'privilege 1' for local users
audit:
  type: manual
  command: 'CIS assessment: Manual. Perform the following to determine if a user with an encrypted password is enabled: Verify all username results return "privilege 1" hostname#show running-config | incl privilege'
remediation:
  type: iac_patch
  command: |-
    ! Set the local user to privilege level 1.
    username <LOCAL_USERNAME> privilege 1
