id: TMA-CISCO-IOS-3.1.1
title: Set 'no ip source-route'
description: Disable the handling of IP datagrams with source routing header options. Source routing is a feature of IP whereby individual packets can specify routes. This feature is used in several kinds of attacks. Cisco routers normally accept and process source routes. Unless a network depends on source routing, it should be disabled. CIS marks this Manual; automated as a config-line check. Audited against the output of 'show running-config' (run 'terminal length 0' first; do not use 'show running-config all' or 'show startup-config').
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- hardening
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 3.1.1 Set 'no ip source-route'
audit:
  type: config_regex
  pattern: (?m)^no ip source-route\s*$
remediation:
  type: iac_patch
  command: |-
    ! Disable source routing.
    no ip source-route
