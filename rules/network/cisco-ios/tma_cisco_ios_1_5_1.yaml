id: TMA-CISCO-IOS-1.5.1
title: Set 'no snmp-server' to disable SNMP when unused
description: 'If not in use, disable simple network management protocol (SNMP), read and write access. SNMP read access allows remote monitoring and management of the device. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ios
level: 1
severity: medium
tags:
- cisco-ios
- network
- snmp
reference: CIS Cisco IOS XE 17.x Benchmark v2.2.1 - 1.5.1 Set 'no snmp-server' to disable SNMP when unused
audit:
  type: manual
  command: 'CIS assessment: Manual. Verify the result reads "SNMP agent not enabled" hostname#show snmp community'
remediation:
  type: iac_patch
  command: |-
    ! Disable SNMP read and write access if not in used to monitor and/or manage device.
    no snmp-server
