id: TMA-CISCO-IOS-NO-IP-HTTP-SERVER
title: Ensure the HTTP server is disabled ('no ip http server')
description: The plain-text HTTP management server exposes credentials and a web attack surface. Audited against the output of 'show running-config' (run 'terminal length 0' first and save the full output, do not use 'show startup-config' or 'show running-config all').
target: cisco-ios
level: 1
severity: high
tags:
- cisco-ios
- network
- management-plane
reference: CIS Cisco IOS Benchmark - Management Plane / Disable unneeded services (verify section number for your release)
audit:
  type: config_regex
  pattern: (?m)^ip http server\s*$
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    configure terminal
     no ip http server
    end
