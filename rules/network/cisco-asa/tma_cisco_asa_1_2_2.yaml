id: TMA-CISCO-ASA-1.2.2
title: Ensure 'Host Name' is set
description: Changes the device default hostname. The device hostname plays an important role in asset inventory and identification as a security requirement, but also in the public keys and certificate deployments as well as when correlating logs from different systems during an incident handling. Fails if the hostname is still the default (ciscoasa/asa). Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: low
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.2.2 Ensure 'Host Name' is set
audit:
  type: config_regex
  pattern: (?m)(?i)^hostname (?:ciscoasa|asa)[ \t\r]*$
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the enterprise naming convention to build the name_of_device
    - Step 2: Run the following to configure the device hostname
    hostname <name_of_device>
