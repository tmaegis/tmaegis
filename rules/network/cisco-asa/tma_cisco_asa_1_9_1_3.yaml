id: TMA-CISCO-ASA-1.9.1.3
title: Ensure 'trusted NTP server' exists
description: Sets a NTP server for which authentication is enabled in order to receive time information. When authentication is not enabled, attackers can disguise as NTP servers and broadcast wrong time and it will be difficult to correlate events upon an incident. In some other cases, attackers can perform NTP DDoS attacks such as NTP Amplification. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- ntp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.9.1.3 Ensure 'trusted NTP server' exists
audit:
  type: config_regex
  pattern: (?m)^ntp server \S+ (?:[^\n]* )?key \d+
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the authentication key ID <key_id>, the IP address of the NTP server <ip_address> and the interface <interface_name> used by the appliance to communicate with the NTP server.
    - Step 2: Run the following to configure the trusted NTP server
    ntp server <ip_address> key <key_id> source <interface_name>
