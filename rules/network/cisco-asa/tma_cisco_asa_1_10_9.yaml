id: TMA-CISCO-ASA-1.10.9
title: Ensure 'logging trap severity level' is greater than or equal to '5'
description: Determines which syslog messages should be sent to the syslog server. Syslog messages are an invaluable tool for accounting, monitoring, and routine troubleshooting. Logging to a central syslog server is a method of collecting messages from devices to a server running a syslog daemon. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.9 Ensure 'logging trap severity level' is greater than or equal to '5'
audit:
  type: config_regex
  pattern: (?m)^logging trap (?:[5-7]|notifications|informational|debugging)\b
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following command to verify logging trap is equal to 5:
    logging trap 5 The severity level can be chosen between 0 and 7
