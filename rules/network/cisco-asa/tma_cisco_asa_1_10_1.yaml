id: TMA-CISCO-ASA-1.10.1
title: Ensure 'logging' is enabled
description: Enables logging. Logging is fundamental for audit requirements and incident management and should be enabled on any business critical system storing or conveying information. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.1 Ensure 'logging' is enabled
audit:
  type: config_regex
  pattern: (?m)^logging enable\s*$
remediation:
  type: iac_patch
  command: |-
    ! Run the following to enable logging
    logging enable>
