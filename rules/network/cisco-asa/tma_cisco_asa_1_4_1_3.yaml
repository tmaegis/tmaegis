id: TMA-CISCO-ASA-1.4.1.3
title: Ensure known default accounts do not exist
description: Deletes the known default accounts configured. In order to attempt access to known devices' platforms, attackers use the available database of the known default accounts for each platform or Operating System. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- aaa
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.1.3 Ensure known default accounts do not exist
audit:
  type: config_regex
  pattern: (?m)(?i)^username (?:admin|asa|cisco|pix|root)\s
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the Enterprise customized administrative account <customized_admin_account> and password <admin_password>
    - Step 2: Run the following to create the customized administrative account as well as the required privilege level <privilege_level>
    username <customized_admin_account> password <admin_password> privilege <privilege_level>
    - Step 3: Run the following to delete the known default accounts identified during the audit
    no username <known_default_account>
