id: TMA-CISCO-ASA-1.4.3.3
title: Ensure 'aaa authentication secure-http-client' is configured correctly
description: Provides a secure method, SSL, to protect username and password to be sent in clear text. If HTTP authentication is used without the command aaa authentication secure-http-client, the username and password are sent from the client to the security appliance in clear text. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- aaa
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.3.3 Ensure 'aaa authentication secure-http-client' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^aaa authentication secure-http-client\s*$
remediation:
  type: iac_patch
  command: |-
    ! Configure the secure aaa authentication for http
    aaa authentication secure-http-client
