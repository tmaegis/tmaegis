id: TMA-CISCO-ASA-2.3
title: Ensure 'DNS Guard' is enabled
description: Enables the protection against DNS cache poisoning attacks. A DNS cache is poisoned when it contains incorrect entries that redirect traffic to an attacker website. When the DNS queries performed towards legitimate DNS servers, attackers can spoof the Identifier of the DNS header along with the DNS caching server UDP ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 2
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 2.3 Ensure 'DNS Guard' is enabled
audit:
  type: config_regex
  pattern: (?m)^dns-guard\s*$
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to enable the DNS Guard function.
    dns-guard
