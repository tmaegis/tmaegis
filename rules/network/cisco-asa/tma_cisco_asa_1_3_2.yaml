id: TMA-CISCO-ASA-1.3.2
title: Ensure 'Image Authenticity' is correct
description: Verifies for digitally signed images that the running image is from a trusted source. The software image being a code can be vulnerable to many attacks such as malicious code injection in the software, the modification of the code installed in the ROM. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.3.2 Ensure 'Image Authenticity' is correct
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. - Step 1: Run the following command to verify the authenticity of the image currently running on the security appliance hostname#show software authenticity running | in CiscoSystems$ Example: Asa-fw# show software authenticity running Image type : Release Signer Information Common Name : abraxas Organization Unit : ASAv Organization Name : CiscoSystems Certificate Serial Number : 565963AF Hash Algorithm : SHA2 512 Signature Algorithm : 2048-bit RSA Key Version : A Asa-fw# show software authenticity running | in CiscoSystems$ ...'
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Correct the errors on the hardware and software
    - Step 2: Run the audit procedure until the system is compliant
    - Step 3: Implement secure delivery of hardware and harden the software distribution server
