id: TMA-CISCO-ASA-THREAT-DETECTION-SCANNING
title: Ensure scanning threat detection is enabled
description: Scanning threat detection identifies hosts performing port/host scans and can shun them. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works but shows secrets in clear text).
target: cisco-asa
level: 2
severity: low
tags:
- cisco-asa
- network
- data-plane
reference: CIS Cisco Firewall ASA Benchmark - Data Plane / Threat Detection (verify section number for your release)
audit:
  type: config_regex
  pattern: (?m)^threat-detection scanning-threat\b
remediation:
  type: iac_patch
  command: |-
    configure terminal
     threat-detection basic-threat
     threat-detection scanning-threat
     threat-detection statistics access-list
    end
