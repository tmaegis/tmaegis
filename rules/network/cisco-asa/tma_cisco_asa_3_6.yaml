id: TMA-CISCO-ASA-3.6
title: Ensure 'threat-detection statistics' is set to 'tcp-intercept'
description: Enables threat detection statistics for attacks blocked by the TCP Intercept function. The TCP Intercept function helps protecting the network and particularly servers against DOS attacks. When the maximum count of allowed connections is reached, through the TCP Intercept function, the firewall will no longer allow connection to the impacted ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 3.6 Ensure 'threat-detection statistics' is set to 'tcp-intercept'
audit:
  type: config_regex
  pattern: (?m)^threat-detection statistics tcp-intercept\b
remediation:
  type: iac_patch
  command: |-
    ! Run the following to enable threat detection statistics for TCP Intercept
    threat-detection statistics tcp-intercept
