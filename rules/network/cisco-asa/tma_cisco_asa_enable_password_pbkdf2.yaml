id: TMA-CISCO-ASA-ENABLE-PASSWORD-PBKDF2
title: Ensure the enable password is stored as a PBKDF2 hash
description: Older releases hash the enable password with MD5 ('encrypted'); 9.5(1)+ stores it with PBKDF2 ('pbkdf2') once it is re-set. Fails unless 'enable password ... pbkdf2' is shown. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works but shows secrets in clear text).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- aaa
reference: CIS Cisco Firewall ASA Benchmark - Management Plane / Password Management (verify section number for your release)
audit:
  type: config_regex
  pattern: (?m)^enable password \S+ pbkdf2\b
remediation:
  type: iac_patch
  command: |-
    configure terminal
     enable password <STRONG_PASSWORD> level 15
    end
    ! Re-entering the password on 9.5(1)+ stores it as pbkdf2.
