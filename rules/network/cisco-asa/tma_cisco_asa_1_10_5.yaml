id: TMA-CISCO-ASA-1.10.5
title: Ensure 'logging history severity level' is set to greater than or equal to '5'
description: Determines which syslog messages should be sent to the SNMP server. Syslog messages are an invaluable tool for accounting, monitoring, and routine troubleshooting. They can be sent as SNMP traps to an SNMP server. This provides an additional method for the events to be viewed in real time and a backup method to Syslog servers ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.5 Ensure 'logging history severity level' is set to greater than or equal to '5'
audit:
  type: config_regex
  pattern: (?m)^logging history (?:[5-7]|notifications|informational|debugging)\b
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following command to set the logging level to 5:
    logging history 5 The severity level can be chosen between 0 and 7
