id: TMA-CISCO-ASA-1.4.3.2
title: Ensure 'aaa authentication http console' is configured correctly
description: Authenticates ASDM users who access the security appliance over HTTP. By default, the enable password is used in combination with no username for http access. The aaa command is used to define the TACACS+/RADIUS authentication method. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- aaa
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.3.2 Ensure 'aaa authentication http console' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^aaa authentication http console \S
remediation:
  type: iac_patch
  command: |-
    ! Configure the aaa authentication for http using the TACACS+ server-group as primary method and the local database as backup method.
    aaa authentication http console <server-group_name> local
