id: TMA-CISCO-ASA-1.4.5.1
title: Ensure 'aaa accounting command' is configured correctly
description: Enables accounting of administrative access by specifying that each command, or commands of a specified privilege level or higher, entered by an administrator/user is recorded and sent to the accounting server or servers. The AAA accounting feature enables to track the actions performed by users and to store the data collected into AAA serves for further audit or further analysis. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.5.1 Ensure 'aaa accounting command' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^aaa accounting command (?:privilege \d+ )?\S
remediation:
  type: iac_patch
  command: |-
    ! Run the following in order to record all the commands entered at all the privilege levels and to send them to the AAA servers
    aaa accounting command <server-group_name>
