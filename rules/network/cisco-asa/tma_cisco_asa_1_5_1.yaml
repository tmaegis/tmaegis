id: TMA-CISCO-ASA-1.5.1
title: Ensure 'ASDM banner' is set
description: Sets the banner message for the ASDM access. Configuring banner is an additional security safeguard to protect the device. In fact, banners are deterrent controls meant to discourage attackers by letting them know that their access is illegitimate and the possible consequences of going further. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: low
tags:
- cisco-asa
- network
- management-plane
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.5.1 Ensure 'ASDM banner' is set
audit:
  type: config_regex
  pattern: (?m)^banner asdm \S
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to set the ASDM banner where <line_of_message> is a line of the banner text.
    banner asdm <line_of_message> Repeat the command for each line if the banner text has several lines.
