id: TMA-CISCO-ASA-1.10.6
title: Ensure 'logging with timestamps' is enabled
description: Allows the timestamp to logs generated. Enabling timestamps, to mark the generation time of log messages, reduces the complexity of correlating events and tracing network attacks across multiple devices by providing a holistic view of events thus enabling faster troubleshooting of issues and ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: low
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.6 Ensure 'logging with timestamps' is enabled
audit:
  type: config_regex
  pattern: (?m)^logging timestamp\b
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to enable the logging timestamp
    logging timestamp
