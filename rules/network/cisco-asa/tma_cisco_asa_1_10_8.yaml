id: TMA-CISCO-ASA-1.10.8
title: Ensure 'logging buffered severity level' is greater than or equal to '3'
description: Determines which syslog messages should be temporary stored in the local buffer so they can be checked by the administrator. The internal log buffer serves as a temporary storage location, thus allowing the administrator performing a health check on the system to locally have the last logs generated. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.8 Ensure 'logging buffered severity level' is greater than or equal to '3'
audit:
  type: config_regex
  pattern: (?m)^logging buffered (?:[3-7]|errors|warnings|notifications|informational|debugging)\b
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following command to set the Logging Buffered to greater than or equal to 3:
    logging buffered 3 The severity level can be chosen between 0 through 7
