id: TMA-CISCO-ASA-1.9.1.1
title: Ensure 'NTP authentication' is enabled
description: Enables NTP authentication in order to receive time information only from trusted sources. When authentication is not enabled, attackers can disguise as NTP servers and broadcast wrong time and it will be difficult to correlate events upon an incident. In some other cases, attackers can perform NTP DDoS attacks such as NTP Amplification. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- ntp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.9.1.1 Ensure 'NTP authentication' is enabled
audit:
  type: config_regex
  pattern: (?m)^ntp authenticate\s*$
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to enable NTP authentication
    ntp authenticate
