id: TMA-CISCO-ASA-1.7.2
title: Ensure 'TLS 1.2' or greater is set for HTTPS access
description: 'Enable SSL server version to TLS 1.2. Given that the network may be prone to sniffing, the HTTP access to the security appliance must be secured with SSL or TLS protocols. The latest version of SSL that is SSL v3 is now inclined to many vulnerabilities and systems should use at least TLS 1.2 as ... Matches the PDF''s audit: ''ssl cipher tlsv1.2 ...'' (9.x) or ''ssl encryption aes256-sha1'' (8.x); ''ssl server-version tlsv1.2'' is also accepted. Audited against the output of ''show running-config'' (run ''terminal pager 0'' first; ''more system:running-config'' also works and shows unmasked secrets).'
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- management-plane
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.7.2 Ensure 'TLS 1.2' or greater is set for HTTPS access
audit:
  type: config_regex
  pattern: (?m)^ssl (?:cipher tlsv1\.2\b|server-version tlsv1\.[23]\b|encryption aes256-sha1\b)
remediation:
  type: iac_patch
  command: |-
    ! For version 8.x, run the following command to enable AES 256 algorithm
    ssl encryption aes256-sha1 For version 9.x, run the following command to enable AES 256 algorithm
    ssl cipher tlsv1.2
