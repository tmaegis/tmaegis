id: TMA-CISCO-ASA-1.11.3
title: Ensure 'snmp-server host' is set to 'version 3'
description: Sets the SNMP notification recipient or the NMS or SNMP manager that can connect to the ASA. An SNMP host is an IP address to which SNMP notifications and traps are sent or which can send requests (polling) to the security appliance. To configure SNMP Version 3 hosts, along with the target IP address, the SNMP username must be provided, because traps ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- snmp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.11.3 Ensure 'snmp-server host' is set to 'version 3'
audit:
  type: config_regex
  pattern: (?m)^snmp-server host \S+ \S+ (?:[^\n]* )?version 3\b
remediation:
  type: iac_patch
  command: |-
    ! Run the following to configure the SNMP v3 host
    snmp-server host <interface_name> <host_ip_address> version 3 <snmp_user>
