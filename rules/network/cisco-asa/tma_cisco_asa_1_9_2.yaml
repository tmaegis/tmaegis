id: TMA-CISCO-ASA-1.9.2
title: Ensure 'local timezone' is properly configured
description: Sets the local time zone information so that the time displayed by the ASA is more relevant to those who are viewing it. Having a correct time set on a Cisco ASA is important for two main reasons. The first reason is that digital certificates compare this time to the range defined by their Valid From and Valid To fields to define a specific validity period. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: low
tags:
- cisco-asa
- network
- ntp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.9.2 Ensure 'local timezone' is properly configured
audit:
  type: config_regex
  pattern: (?m)^clock timezone \S+
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire standard zone name (enterprise_zone_name) used by the enterprise (GMT, UTC, EDT, PST)
    - Step 2: Run the following to configure the required value
    clock timezone <enterprise_zone_name> <local_offset>
