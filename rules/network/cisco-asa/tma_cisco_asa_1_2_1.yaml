id: TMA-CISCO-ASA-1.2.1
title: Ensure 'Domain Name' is set
description: Sets the domain name for the security appliance. The domain name is important during the deployment of RSA keys and certificates used by the appliance. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: low
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.2.1 Ensure 'Domain Name' is set
audit:
  type: config_regex
  pattern: (?m)^domain-name \S
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the enterprise domain name (enterprise_domain)
    - Step 2: Run the following to configure the domain name
    domain-name <enterprise_domain>
