id: TMA-CISCO-ASA-1.7.3
title: Ensure 'SSL AES 256 encryption' is set for HTTPS access
description: Sets the SSL encryption algorithm to AES 256. Given that the network may be prone to sniffing, the HTTP access to the security appliance must be secured with SSL or TLS protocols. A secure encryption algorithm must be used. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- management-plane
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.7.3 Ensure 'SSL AES 256 encryption' is set for HTTPS access
audit:
  type: config_regex
  pattern: (?m)^ssl cipher tlsv1\.2 custom \"?[^\n]*AES256-SHA
remediation:
  type: iac_patch
  command: |-
    ! For version 9.x, run the following command to enable AES 256 algorithm
    ssl cipher tlsv1.2 custom AES256-SHA
