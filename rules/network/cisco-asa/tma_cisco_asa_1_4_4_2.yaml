id: TMA-CISCO-ASA-1.4.4.2
title: Ensure 'aaa authorization exec' is configured correctly
description: Limits the access to the privileged EXEC mode. When a user is placed in the privileged EXEC mode, valuable information can be obtained. The AAA authorization exec enforces the segregation of users rights so that only authorized users can get access to the privileged EXEC mode. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- aaa
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.4.2 Ensure 'aaa authorization exec' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^aaa authorization exec \S
remediation:
  type: iac_patch
  command: |-
    ! Run the following to enable the AAA authorization exec
    aaa authorization exec authentication-server auto-enable
