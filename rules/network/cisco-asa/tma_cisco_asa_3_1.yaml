id: TMA-CISCO-ASA-3.1
title: Ensure DNS services are configured correctly
description: Sets DNS server(s) to be used by the appliance to perform DNS queries. The security appliance may perform DNS queries in order to achieve URL filtering or threat protection against Botnet traffic. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 3.1 Ensure DNS services are configured correctly
audit:
  type: config_regex
  pattern: (?m)^dns domain-lookup \S+
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following to enable the DNS lookup
    dns domain-lookup <interface_name> <interface_name> is the name of the interface connected to the DNS server
    - Step 2: Configure the group of DNS servers
    dns server-group DefaultDNS
    - Step 3: Acquire the enterprise authorized DNS servers' IP addresses <dns_ip_address> and for each of them, run the following command to configure the DNS server in the DNS server group
    name-server <dns_ip_address>
