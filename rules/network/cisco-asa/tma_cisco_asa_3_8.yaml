id: TMA-CISCO-ASA-3.8
title: Ensure 'security-level' is set to '0' for Internet-facing interface
description: Sets the security level of the Internet facing interface to 0. Where security zones are not configured, the Internet facing interface is the most untrusted interface and must have the lowest security-level that is 0. Therefore, any traffic initiated from this interface to the other interfaces of the security appliance ... Passes when at least one interface has security-level 0; confirm it is the Internet-facing one. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 3.8 Ensure 'security-level' is set to '0' for Internet-facing interface
audit:
  type: config_regex
  pattern: (?m)^[ \t]+security-level 0\s*$
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the physical name of the Internet facing interface <interface_physical_name>
    - Step 2: Run the following command assigned the security-level 0
    interface <interface_physical_name>
    security-level 0
