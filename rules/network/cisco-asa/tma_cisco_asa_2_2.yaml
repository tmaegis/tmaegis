id: TMA-CISCO-ASA-2.2
title: Ensure 'noproxyarp' is enabled for untrusted interfaces
description: Disables the Proxy-ARP function on untrusted interfaces. The ASA replies to ARP requests performed to IP addresses belonging to its interfaces' subnets and also to global IP addresses in some NAT configurations. Where the appliance is not asked to be a proxy for ARP requests, the Proxy-ARP function should be ... Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 2
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 2.2 Ensure 'noproxyarp' is enabled for untrusted interfaces
audit:
  type: config_regex
  pattern: (?m)^sysopt noproxyarp \S+
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Acquire the name of the untrusted interface <untrusted_interface_name>
    - Step 2: Run the following command to disable the Proxy-ARP on the untrusted interface.
    sysopt noproxyarp <untrusted_interface_name>
