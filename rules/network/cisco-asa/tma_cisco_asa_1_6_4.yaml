id: TMA-CISCO-ASA-1.6.4
title: Ensure 'SCP protocol' is set to Enable for files transfers
description: Enables Secure Copy protocol. FTP and TFTP are protocols that transfer data in clear text across the network and thus are vulnerable to packet sniffing. Files and mostly configuration files should be transferred using secure protocols such as HTTPS or SCP. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 2
severity: medium
tags:
- cisco-asa
- network
- hardening
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.6.4 Ensure 'SCP protocol' is set to Enable for files transfers
audit:
  type: config_regex
  pattern: (?m)^ssh scopy enable\s*$
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to enable secure copy
    ssh scopy enable
