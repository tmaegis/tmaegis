id: TMA-CISCO-ASA-1.6.2
title: Ensure 'SSH version 2' is enabled
description: Sets the SSH version to 2. SSH is an application running on top of a reliable transport layer, such as TCP/IP, that provides strong authentication and encryption capabilities. The ASA allows SSH connections to the ASA for management purposes. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- management-plane
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.6.2 Ensure 'SSH version 2' is enabled
audit:
  type: config_regex
  pattern: (?m)^ssh version 2\s*$
remediation:
  type: iac_patch
  command: |-
    ! Run the following to enable SSH version 2
    ssh version 2
