id: TMA-CISCO-ASA-1.10.2
title: Ensure 'logging to monitor' is disabled
description: Disables the logging to monitor. The ASA by default send logs to monitor for Telnet and SSH sessions. The logs messages will continuously scroll on the monitor after the "Terminal Monitor" command is issued. This consumes a lot of resources causing high CPU usage and should be avoided. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.2 Ensure 'logging to monitor' is disabled
audit:
  type: config_regex
  pattern: (?m)^logging monitor\b
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to disable the logging monitor
    no logging monitor
