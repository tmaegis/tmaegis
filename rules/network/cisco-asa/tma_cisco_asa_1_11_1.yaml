id: TMA-CISCO-ASA-1.11.1
title: Ensure 'snmp-server group' is set to 'v3 priv'
description: Sets the SNMP v3 group with authentication and privacy. SNMP Version 3 provides security enhancements that are not available in SNMP Version 1 or SNMP Version 2c. SNMP Versions 1 and 2c transmit data between the SNMP server and SNMP agent in clear text. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- snmp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.11.1 Ensure 'snmp-server group' is set to 'v3 priv'
audit:
  type: config_regex
  pattern: (?m)^snmp-server group \S+ v3 priv\b
remediation:
  type: iac_patch
  command: |-
    ! Run the following to configure the SNMP v3 group.
    snmp-server group <group_name> v3 priv
