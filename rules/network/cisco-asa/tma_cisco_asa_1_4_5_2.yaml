id: TMA-CISCO-ASA-1.4.5.2
title: Ensure 'aaa accounting for SSH' is configured correctly
description: Enables accounting of administrative access by specifying the start and stop of SSH sessions. The AAA accounting feature enables to track the actions performed by users and to store the data collected into AAA serves for further audit or further analysis. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.4.5.2 Ensure 'aaa accounting for SSH' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^aaa accounting ssh console \S
remediation:
  type: iac_patch
  command: |-
    ! Run the following in order to record ssh session start and stop and to send them to the AAA servers
    aaa accounting ssh console <server-group_name>
