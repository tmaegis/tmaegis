id: TMA-CISCO-ASA-1.8.2
title: Ensure 'SSH session timeout' is less than or equal to '5' minutes
description: Sets the idle timeout for an SSH session before the security appliance terminates it. Limiting session timeout prevents unauthorized users from using abandoned sessions to perform malicious activities. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- ntp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.8.2 Ensure 'SSH session timeout' is less than or equal to '5' minutes
audit:
  type: config_regex
  pattern: (?m)^ssh timeout [1-5]\s*$
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following to set the SSH timeout to 5 minutes
    ssh timeout 5
