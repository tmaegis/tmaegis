id: TMA-CISCO-ASA-1.8.3
title: Ensure 'HTTP idle timeout' is less than or equal to '5' minutes
description: Sets the timeout for an HTTP session idle before the security appliance terminates it. Limiting session idle timeout prevents unauthorized users from using abandoned sessions to perform malicious activities. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: high
tags:
- cisco-asa
- network
- ntp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.8.3 Ensure 'HTTP idle timeout' is less than or equal to '5' minutes
audit:
  type: config_regex
  pattern: (?m)^http server idle-timeout [1-5]\s*$
remediation:
  type: iac_patch
  command: |-
    ! - Step 1: Run the following to set the HTTP timeout to less than or equal to 5 minutes
    http server idle-timeout 5
