id: TMA-CISCO-ASA-1.10.3
title: Ensure 'syslog hosts' is configured correctly
description: Sets the SNMP notification recipient or the NMS or SNMP manager that can connect to the ASA. Syslog messages are an invaluable tool for accounting, monitoring, and routine troubleshooting. Logging to a central syslog server is a method of collecting messages from devices to a server running a syslog daemon. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.3 Ensure 'syslog hosts' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^logging host \S+ \S+
remediation:
  type: iac_patch
  command: |-
    ! Run the following to configure the Syslog server
    logging host <interface_name> <host_ip_address>
