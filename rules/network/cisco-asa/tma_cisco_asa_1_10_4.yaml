id: TMA-CISCO-ASA-1.10.4
title: Ensure 'logging with the device ID' is configured correctly
description: Includes the device ID in the logs generated. In an environment where logs are collected from many different sources, identifying the logs from a specific device is alleviated by doing a query including the device's hostname included in the logs and helps to quickly gather the expected results. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- logging
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.10.4 Ensure 'logging with the device ID' is configured correctly
audit:
  type: config_regex
  pattern: (?m)^logging device-id \S
remediation:
  type: iac_patch
  command: |-
    ! Run the following to enable logging with the device hostname:
    logging device-id hostname In a multi-context security appliance, run the following command:
    logging device-id context-name
