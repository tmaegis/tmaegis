  pattern: (?m)\A(?:(?:[ \t]*(?:$|[^n \t\n]|n(?:$|[^e\n]|e(?:$|[^i\n]|i(?:$|[^g\n]|g(?:$|[^h\n]|h(?:$|[^b\n]|b(?:$|[^o\n]|o(?:$|[^r\n]|r(?:$|[^ \n])))))))))[^\n]*|[ \t]*neighbor (?:(?:[^p \t\n][^ \t\n]*|p(?:|[^a \t\n][^ \t\n]*|a(?:|[^s \t\n][^ \t\n]*|s(?:|[^s \t\n][^ \t\n]*|s(?:|[^w \t\n][^ \t\n]*|w(?:|[^o \t\n][^ \t\n]*|o(?:|[^r \t\n][^ \t\n]*|r(?:|[^d \t\n][^ \t\n]*|d(?:[^ \t\n][^ \t\n]*)))))))))[ \t]+)*(?:(?:[^p \t\n][^ \t\n]*|p(?:|[^a \t\n][^ \t\n]*|a(?:|[^s \t\n][^ \t\n]*|s(?:|[^s \t\n][^ \t\n]*|s(?:|[^w \t\n][^ \t\n]*|w(?:|[^o \t\n][^ \t\n]*|o(?:|[^r \t\n][^ \t\n]*|r(?:|[^d \t\n][^ \t\n]*|d(?:[^ \t\n][^ \t\n]*))))))))))?)\n)*router bgp [^\n]*(?:\n(?:(?:[ \t]*(?:$|[^n \t\n]|n(?:$|[^e\n]|e(?:$|[^i\n]|i(?:$|[^g\n]|g(?:$|[^h\n]|h(?:$|[^b\n]|b(?:$|[^o\n]|o(?:$|[^r\n]|r(?:$|[^ \n])))))))))[^\n]*|[ \t]*neighbor (?:(?:[^p \t\n][^ \t\n]*|p(?:|[^a \t\n][^ \t\n]*|a(?:|[^s \t\n][^ \t\n]*|s(?:|[^s \t\n][^ \t\n]*|s(?:|[^w \t\n][^ \t\n]*|w(?:|[^o \t\n][^ \t\n]*|o(?:|[^r \t\n][^ \t\n]*|r(?:|[^d \t\n][^
    \t\n]*|d(?:[^ \t\n][^ \t\n]*)))))))))[ \t]+)*(?:(?:[^p \t\n][^ \t\n]*|p(?:|[^a \t\n][^ \t\n]*|a(?:|[^s \t\n][^ \t\n]*|s(?:|[^s \t\n][^ \t\n]*|s(?:|[^w \t\n][^ \t\n]*|w(?:|[^o \t\n][^ \t\n]*|o(?:|[^r \t\n][^ \t\n]*|r(?:|[^d \t\n][^ \t\n]*|d(?:[^ \t\n][^ \t\n]*))))))))))?)))*\n?\z
  must_not_match: true
remediation:
  type: iac_patch
  command: |-
    ! Step 1 Enable BGP.
    Step 2 Define the Best Path for a BGP Routing Process.
    Step 3 Configure Policy Lists.
    Step 4 Configure AS Path Filters.
    Step 5 Configure Community Rules.
    Step 6 Configure IPv4 Address Family Settings.
    Step 7 Configure IPv6 Address Family Settings.
    router bgp 2
    bgp default local-preference 500
    policy-list Example-policy-list1 permit
    as-path access-list 35 permit testaspath
    community-list standard excomm1 permit 100 internet no-advertise no-export
    bgp router-id 10.86.118.3 ciscoasa(config-router-af) aggregate-address 10.86.118.0 255.255.255.0 as-set summary-only suppress-map example1 advertise-map example1 attribute-map example1
