id: TMA-CISCO-ASA-1.11.4
title: Ensure 'SNMP traps' is enabled
description: Enables SNMP traps to be sent to the NMS. The purpose of the SNMP service is to monitor in real time the events occurring on systems in order to meet the security requirement of availability of systems and services. Audited against the output of 'show running-config' (run 'terminal pager 0' first; 'more system:running-config' also works and shows unmasked secrets).
target: cisco-asa
level: 1
severity: medium
tags:
- cisco-asa
- network
- snmp
reference: CIS Cisco ASA 9.x Firewall Benchmark v1.1.0 - 1.11.4 Ensure 'SNMP traps' is enabled
audit:
  type: config_regex
  pattern: (?m)^snmp-server enable traps snmp\b
remediation:
  type: iac_patch
  command: |-
    ! Run the following command to enable SNMP traps
    snmp-server enable traps snmp authentication
    snmp-server enable traps snmp coldstart
    snmp-server enable traps snmp linkdown
    snmp-server enable traps snmp linkup
