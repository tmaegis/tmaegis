id: TMA-ARISTA-EOS-2.3.1
title: Roles
description: 'A role consists of rules that permit or deny access to a set of commands within specified command modes. For local users a role limits the commands they can run to the appropriate set for their job. Additional custom roles can be defined as needed or AAA services - such as TACACS+ - can be used to provide more granular access to the switch. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: arista-eos
level: 1
severity: medium
tags:
- arista-eos
- network
- aaa
reference: CIS Arista EOS Benchmark v1.0.0 - 2.3.1 Roles
audit:
  type: manual
  command: 'CIS assessment: Manual. show run all section ^role|username.*role This shows two local users with different roles username admin privilege 15 role network-admin secret sha512 XXXX username operations privilege 15 role network-operator secret sha512 XXX username user privilege 1 role network-admin nopassword role network-admin 10 permit command .* role network-operator 10 deny mode exec command configure|bash|python-shell|\| 20 permit mode exec command .*'
remediation:
  type: iac_patch
  command: Assign roles to local users with the username command username name [PRIVILEGE_LEVEL] SECURITY [ROLE_USER] SECURITY specifies the password assignment.
