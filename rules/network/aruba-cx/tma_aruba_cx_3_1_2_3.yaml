id: TMA-ARUBA-CX-3.1.2.3
title: BGP TTL Security
description: Enables BGP to establish connection with external peers residing on networks that are not directly connected
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.1.2.3 BGP TTL Security
audit:
  type: manual
  command: Where eBGP runs, run 'show run bgp' and confirm external neighbors use 'ttl-security-hops <n>'.
remediation:
  type: iac_patch
  command: |-
    Configuration to enable BGP neighbor ttl-security-hops -
    router bgp <ASN>
    neighbor {<IP-ADDR>|<PEER-GROUP-NAME>} ttl-security-hops
    <hop-count>
