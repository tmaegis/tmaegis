id: TMA-ARUBA-CX-1.5.2.3
title: Remote Authentication - RADIUS/RadSec/TACACS+
description: Remote Authentication involves the use of remote RADIUS , RadSec and TACACS+ servers for authenticating the management users. Remote AAA servers are used as single point of management to configure and store user accounts. They are often coupled with directories and management repositories, simplifying the setup and maintenance of the end-user accounts. PASS requires remote (RADIUS/RadSec/TACACS+) authentication for a management channel. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 2
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.5.2.3 Remote Authentication - RADIUS/RadSec/TACACS+
audit:
  type: config_regex
  pattern: (?m)^aaa authentication login (?:default|console|ssh|telnet|https-server) group \S+
remediation:
  type: iac_patch
  command: |-
    aaa authentication login default group tacacs1 local
    # CIS guidance:
    Enable remote authentication for desired management interface. Default – Includes all the management interfaces -
    aaa authentication login <console/default/ssh/telnet/https-
    <RADIUS/TACACS+ group-list>
