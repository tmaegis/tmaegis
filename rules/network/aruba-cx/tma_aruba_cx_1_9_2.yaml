id: TMA-ARUBA-CX-1.9.2
title: https-server idle session management
description: https-server sessions are used by both the REST API and Web management interface (WebUI). By default, an https-server session will remain open for 20 minutes while idle. Customers should be setting the idle session timeout to the lowest value that can be tolerated.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.9.2 https-server idle session management
audit:
  type: manual
  command: Run 'show https-server' and confirm 'Session timeout' is set to the organisation's idle limit (default 20 minutes); configure it with 'https-server session-timeout <minutes>'.
remediation:
  type: iac_patch
  command: |-
    The session-timeout option can be used to set the idle session timeout:
    https-server session-timeout <minutes>
