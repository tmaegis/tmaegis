id: TMA-ARUBA-CX-3.2.1.1
title: DHCPv4 & DHCPv6 Snooping Enablement
description: DHCP snooping protects the network from common DHCP attacks, including address spoofing resulting from a rogue DHCP server operating on the network or exhaustion of addresses on a DHCP server caused by mass address requests by an attacker on the network. DHCP snooping designates trusted DHCP servers and ports on which DHCP requests and responses are accepted.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- layer2
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.2.1.1 DHCPv4 & DHCPv6 Snooping Enablement
audit:
  type: manual
  command: Run 'show dhcpv4-snooping' and 'show dhcpv6-snooping'. Snooping must be enabled globally and on user VLANs, uplinks to DHCP servers must be trusted, and authorized servers should be listed.
remediation:
  type: iac_patch
  command: |-
    The following is a DHCPv4-snooping sample configuration -
    dhcpv4-snooping
    vlan <vlan-id>
    dhcpv4-snooping
    exit
    interface <trusted interface id>
    dhcpv4-snooping trust
    exit
    dhcpv4-snooping authorized-server <ipv4-server-address> vrf
    <vrf-name> The following is a DHCPv6-snooping sample configuration:
    dhcpv6-snooping
    vlan <vlan-id>
    dhcpv6-snooping
    exit
    interface <trusted interface id>
    dhcpv6-snooping trust
    exit
    dhcpv6-snooping authorized-server <ipv6-server-address> vrf
    <vrf-name>
