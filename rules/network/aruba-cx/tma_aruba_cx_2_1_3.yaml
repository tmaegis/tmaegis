id: TMA-ARUBA-CX-2.1.3
title: Disable Unused Physical Interfaces
description: Disable unused physical interfaces.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 2.1.3 Disable Unused Physical Interfaces
audit:
  type: manual
  command: Run 'show interface physical' (or 'show interface brief') and confirm every physical port that is not in use is administratively down ('shutdown').
remediation:
  type: iac_patch
  command: |-
    Disable unused physical interfaces
    conf
    interface 1/1/1
    shutdown
