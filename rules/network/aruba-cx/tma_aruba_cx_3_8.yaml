id: TMA-ARUBA-CX-3.8
title: IPv6 Destination Guard
description: The IPv6 Destination Guard feature in AOS-CX switches provides security by validating IPv6 traffic against a known database of allowed destinations. It ensures only authorized destination IP addresses are reachable, mitigating risks of unauthorized access or malicious activity within the network.This feature requires the binding table to be populated with the help of DHCPv6 snooping, ND snooping, or static-ip-bindings. Destination guard enables the destination address based filtering of IPv6 traffic and blocks the Neighbor Discovery (ND) protocol resolution for destination addresses that are not found in the binding table.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- firewall-policy
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.8 IPv6 Destination Guard
audit:
  type: manual
  command: Where IPv6 is used, run 'show ipv6 destination-guard' and confirm destination guard is enabled on user VLANs.
remediation:
  type: iac_patch
  command: |-
    Configuring IPV6 Destination Guard on a VLAN -
    vlan <id>
    ipv6 destination-guard
