id: TMA-ARUBA-CX-1.8.1.1
title: SFTP and SCP
description: The copy command is widely used in AOS-CX switches to transfer files, configurations and log messages. The commonly used file transfer protocol TFTP transfers files in plaintext, so attackers can easily capture and view the contents of transferred packets. Secure copy protocols encrypt the copy payload to prevent unwanted access to the transferred data
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- hardening
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.8.1.1 SFTP and SCP
audit:
  type: manual
  command: 'Review backup scripts, jobs and operating procedures: every ''copy'' to or from the switch must use scp:// or sftp:// URLs, never tftp:// or ftp:// (also check ''show job'' for scheduled copies).'
remediation:
  type: iac_patch
  command: |-
    Select secure copy protocols when copying files to or from the switch. To copy a file to the device:
    copy scp://root@10.0.1.1/config  running-config
    or
    copy sftp://root@10.0.1.1/config running-config
    To copy a file from the device:
    copy running-config scp://root@10.0.1.1/config cli
    or
    copy running-config sftp://root@10.0.1.1/config cli vrf mgmt
