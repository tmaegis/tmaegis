id: TMA-ARUBA-CX-1.1.4
title: Set an Export Password
description: All AOS-CX switches ship with a default password that's used to export any customer secrets contained with the switch configuration. Display of secrets through 'show' commands or exporting the entire switch configuration will have its secrets encrypted with this password prior to being displayed. AOS-CX allows customers to set their own password to ensure that their switch secrets cannot be loaded onto another AOS-CX switch.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.1.4 Set an Export Password
audit:
  type: manual
  command: 'Run ''show service export-password''. It must report ''Export password: custom'' (not ''default'').'
remediation:
  type: iac_patch
  command: |-
    Set a custom export password using the following command:
    service export-password
    Enter password: ******** Confirm password: ********
