id: TMA-ARUBA-CX-2.1.1
title: Disable USB and Bluetooth on Device
description: Disable USB Auxiliary port PASS requires 'no usb' and 'bluetooth disable'. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 2
severity: medium
tags:
- aruba-cx
- hardening
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 2.1.1 Disable USB and Bluetooth on Device
audit:
  type: config_regex
  pattern: (?m)(?:^no usb[ \t]*$(?s:.*?)^bluetooth disable[ \t]*$|^bluetooth disable[ \t]*$(?s:.*?)^no usb[ \t]*$)
remediation:
  type: iac_patch
  command: |-
    no usb
    bluetooth disable
    # CIS guidance:
    no usb
    bluetooth disable
