id: TMA-ARUBA-CX-4.3.1
title: Control Plane ACL Management
description: Restrict Management Access to trusted management devices
target: aruba-cx
level: 2
severity: medium
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 4.3.1 Control Plane ACL Management
audit:
  type: manual
  command: Run 'show access-list control-plane' and confirm a control-plane ACL is applied to the management VRF(s) permitting only management networks and denying (and logging) all other traffic to the switch.
remediation:
  type: iac_patch
  command: |-
    conf
    access-list ip <acl-name>
    permit ip <ip address or network> any
    deny ip any any log
    apply access-list ip <acl-name> control-plane vrf mgmt
