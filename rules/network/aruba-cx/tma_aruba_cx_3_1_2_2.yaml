id: TMA-ARUBA-CX-3.1.2.2
title: Authenticate BGP Peers Using MD5
description: The TCP sessions between the two peers can be secured by adding MD5 protection to the TCP session header
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.1.2.2 Authenticate BGP Peers Using MD5
audit:
  type: manual
  command: Where BGP runs, run 'show run bgp' and confirm every neighbor (or peer group) has a 'password' configured (TCP MD5 authentication).
remediation:
  type: iac_patch
  command: |-
    The TCP sessions between the two peers can be secured by adding MD5 protection to the TCP session header. The MD5 digest acts like a password between peers. This configuration is done within the BGP configuration context, and both peers need to configure the same password either plaintext or ciphertext.
    router bgp <ASN>
    neighbor {<IP-ADDR>|<PEER-GROUP-NAME>} password
    [{ciphertext | plaintext} <PASSWORD>]
