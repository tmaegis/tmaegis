id: TMA-ARUBA-CX-3.6
title: ND Snooping
description: ND (Neighbor Discovery) Snooping is a security feature that enhances IPv6 network integrity by monitoring and validating IPv6 neighbor discovery messages. It prevents malicious activities such as ND spoofing and rogue advertisements. ND snooping drops invalid ND packets, and combined with IPv6 Source Lockdown, blocks data traffic from invalid hosts. ND snooping learns the source MAC addresses, source IPv6 addresses, input interfaces and VLANs of incoming ND messages and data packets to build IP binding entries.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- layer2
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.6 ND Snooping
audit:
  type: manual
  command: Where IPv6 is used, run 'show nd-snooping' and confirm ND snooping is enabled globally and on user VLANs.
remediation:
  type: iac_patch
  command: |-
    The following are sample VLAN configurations of globally enabled ND snooping -
    nd-snooping
    vlan <vlan-id>
    nd-snooping
    exit
