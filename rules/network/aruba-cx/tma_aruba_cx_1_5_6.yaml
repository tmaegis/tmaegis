id: TMA-ARUBA-CX-1.5.6
title: Login Privilege Elevation for Administrators
description: By default, the AOS-CX switches only allow the administrator user to perform the "enable" command and when executed, the user is elevated in privilege without prompting for a password. To increase the security, login privilege elevation feature can be enabled. Configuration provided to enable/disable the privilege-elevation feature & will be disabled by default. The customer will have to enable this feature & then re-login for the privilege-elevation feature to take effect.. PASS requires login privilege-elevation for the administrators group. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 2
severity: medium
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.5.6 Login Privilege Elevation for Administrators
audit:
  type: config_regex
  pattern: (?m)^aaa authentication login privilege-elevation group administrators\b
remediation:
  type: iac_patch
  command: |-
    aaa authentication login privilege-elevation group administrators
    # CIS guidance:
    To enable login privilege-elevation for group administrators -
    aaa authentication login privilege-elevation group
    administrators
