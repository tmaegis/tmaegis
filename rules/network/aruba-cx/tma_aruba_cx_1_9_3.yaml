id: TMA-ARUBA-CX-1.9.3
title: Two-factor authentication with the https-server server
description: Two-factor authentication provides an additional level of security by requiring administrators to perform X.509 certificate-based authentication with the AOS-CX https- server. The two factors are possession of the certificate private key and knowledge of the password associated with the certificate private key. The switch must be configured with the corresponding CA certificate which issued the administrator's certificate. PASS requires certificate (two-factor) authentication on the https-server. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.9.3 Two-factor authentication with the https-server server
audit:
  type: config_regex
  pattern: (?m)^https-server authentication certificate\b
remediation:
  type: iac_patch
  command: |-
    https-server authentication certificate authorization radius username common_name
    # CIS guidance:
    https-server authentication certificate authorization radius
    username common_name
