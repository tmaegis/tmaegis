id: TMA-ARUBA-CX-1.11.1
title: Assign a custom certificate to syslog-client
description: Syslog-client will default to using the "local-cert". The "local-cert" is a self-signed certificate generated internally by the switch at first boot. PASS requires a custom certificate assigned to the syslog-client application. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- logging
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.11.1 Assign a custom certificate to syslog-client
audit:
  type: config_regex
  pattern: (?m)^crypto pki application syslog-client certificate \S+
remediation:
  type: iac_patch
  command: |-
    crypto pki application syslog-client certificate <CERT-NAME>
    # CIS guidance:
    The 'crypto pki application' command can be used to assign a certificate to the syslog- client:
    crypto pki application syslog-client certificate <CERT-NAME>
