id: TMA-ARUBA-CX-1.2.1
title: SSH Public Key Authentication
description: This sequence describes configuring public-key authentication
target: aruba-cx
level: 2
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.2.1 SSH Public Key Authentication
audit:
  type: manual
  command: Run 'show ssh authentication-method' (SSH publickey authentication must be Enabled) and 'show user <username> authorized-key' for each administrator to confirm an SSH public key is installed.
remediation:
  type: iac_patch
  command: |-
    user <username>  authorized-key <user public-key>
    Added SSH client's authorized-key with key-identifier 1.
