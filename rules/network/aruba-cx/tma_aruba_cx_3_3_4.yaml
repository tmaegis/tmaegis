id: TMA-ARUBA-CX-3.3.4
title: MLD Snooping ACL
description: Multicast Listener Discovery (MLD) snooping is a feature designed to optimize multicast traffic across the network by preventing multicast flooding within a VLAN. MLD snooping forwards multicast traffic only to ports that have initiated an MLD request for the multicast group. Additionally, MLD snooping supports configuration to drop packets that do not match the configured version and allows blocking multicast traffic on specific ports. This mechanism reduces unnecessary multicast traffic and improves network efficiency.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.3.4 MLD Snooping ACL
audit:
  type: manual
  command: Where MLD snooping is enabled, run 'show run | in "ipv6 mld snooping"' and confirm an access list is applied ('ipv6 mld snooping apply access-list <acl>').
remediation:
  type: iac_patch
  command: |-
    To configure the MLD snooping ACL -
    ipv6 mld snooping apply access list <ACL-NAME>
