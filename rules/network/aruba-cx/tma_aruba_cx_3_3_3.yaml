id: TMA-ARUBA-CX-3.3.3
title: IGMP Snooping ACL
description: IGMP snooping operates on a Layer 2 device as a multicast constraining mechanism designed to enhance multicast forwarding efficiency. It creates Layer 2 multicast forwarding entries by processing IGMP packets exchanged between hosts and routers. Without IGMP snooping, the switch would flood multicast packets to all hosts within a VLAN. By enabling IGMP snooping, the Layer 2 device forwards multicast packets associated with known multicast groups only to the receivers that have expressed interest, thereby conserving bandwidth on segments of the network where no hosts have requested the multicast traffic.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.3.3 IGMP Snooping ACL
audit:
  type: manual
  command: Where IGMP snooping is enabled, run 'show run | in "ip igmp snooping"' and confirm an access list is applied ('ip igmp snooping apply access-list <acl>') to restrict joinable groups.
remediation:
  type: iac_patch
  command: |-
    To apply ACL to IGMP Snooping -
    ip igmp snooping apply access list <ACL-NAME>
