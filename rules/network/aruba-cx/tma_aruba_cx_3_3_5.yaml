id: TMA-ARUBA-CX-3.3.5
title: MSDP Authentication & SA Filtering
description: The Multicast Source Discovery Protocol (MSDP) connects multiple PIM-SM domains, enabling RPs to share multicast source information using SA messages over TCP. It simplifies interdomain multicast routing by supporting an interdomain source tree instead of a shared tree.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.3.5 MSDP Authentication & SA Filtering
audit:
  type: manual
  command: Where MSDP runs, run 'show run msdp' and confirm every peer has a password and SA filters in and out ('sa-filter in/out access-list <acl>').
remediation:
  type: iac_patch
  command: |-
    Configuration to enable Authentication -
    router msdp
    ip msdp peer <ip-address>
    password plaintext <password>
    User can prevent the incoming and outgoing SA messages on MSDP router by creating incoming and outgoing filter lists using an ACL. Configuration to associate ACL -
    sa-filter in access-list <acl-name>
    sa-filter out access-list <acl-name>
