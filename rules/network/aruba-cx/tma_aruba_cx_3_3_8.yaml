id: TMA-ARUBA-CX-3.3.8
title: Multicast BSR Boundary
description: PIM Bootstrap messages (BSMs) play a crucial role in electing a Rendezvous Point (RP) for multicast routing within a domain. However, exchanging these messages across different multicast domains is undesirable, as it can result in the unintended election of an RP in a domain where it does not belong, disrupting multicast operations. To address this, the bsr-boundary configuration can be applied to boundary interfaces, ensuring that PIM BSMs originating from external domains are dropped and that internally generated BSMs are confined to their domain.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.3.8 Multicast BSR Boundary
audit:
  type: manual
  command: Where PIM BSR is used, review 'show run interface' and confirm 'ip pim-sparse bsr-boundary' is set on interfaces facing other PIM domains.
remediation:
  type: iac_patch
  command: |-
    Configuration to enable Multicast BSR Boundary -
    interface <ID>
    ip pim-sparse bsr-boundary
