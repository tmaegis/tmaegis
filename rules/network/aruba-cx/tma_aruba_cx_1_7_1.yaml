id: TMA-ARUBA-CX-1.7.1
title: Firmware Validation
description: 'All AOS-CX switch firmware is signed by HPE at the time the firmware is created. The firmware signature is verified at the time of download and verified at every boot. The public keys used to verify the firmware is stored within the bootloader and firmware. The firmware is digitally signed with RSA-3072 and SHA-256. If the switch firmware validation fails at boot, the switch will fail to boot with one of the following error messages and drop the user into the ServiceOS login screen: Error: Signature verification failed Error: Signature not found Error: Invalid signature'
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- updates
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.7.1 Firmware Validation
audit:
  type: manual
  command: Run 'show images verify primary' and 'show images verify secondary'. Both must report that the image is valid (signed and compatible) before the switch is booted from it.
remediation:
  type: iac_patch
  command: Firmware without a valid signature will not boot. A new firmware image with a valid signature should be copied onto the device.
