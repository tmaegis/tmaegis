id: TMA-ARUBA-CX-3.3.6
title: MSDP SA Cache limit
description: By default, the MSDP SA has no limit configured per peer. All (S, G) entries within the system capacities are allowed. If there is a reboot or HA switchover, the (S, G) cache allocation occurs based on first come first served basis. The (S, G) entries are allocated until they reach the system capacity or peer limit based on whichever is reached first and new sets of (S, G) requests are discarded.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- routing
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.3.6 MSDP SA Cache limit
audit:
  type: manual
  command: Where MSDP runs, run 'show run msdp' and confirm each peer has an 'sa-limit <value>' configured.
remediation:
  type: iac_patch
  command: |-
    Configuration to enable MSDP SA cached limit -
    router msdp
    ip msdp peer <peer-address>
    sa-limit <value>
