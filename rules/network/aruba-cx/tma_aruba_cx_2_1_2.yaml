id: TMA-ARUBA-CX-2.1.2
title: Front Panel Security
description: This sequence describes auditing the front panel reset button status
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- hardening
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 2.1.2 Front Panel Security
audit:
  type: manual
  command: Run 'show front-panel-security status'. 'Front panel factory reset' must be disabled (the default) so the reset button cannot wipe the configuration.
remediation:
  type: iac_patch
  command: n/a
