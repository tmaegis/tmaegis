id: TMA-ARUBA-CX-1.5.4.1
title: Local Accounting
description: 'Local Accounting records all the CLI and REST access activities by users from all channels. It logs and helps to track all the configuration changes and show command executions happened at the switch for auditing or accounting purposes. This accounting information is captured and made available locally (Enabled by default and always active) and, if desired, for sending to remote AAA servers: Exec Accounting: user login/logout events. Command accounting: commands executed by users. System accounting: remote accounting On/Off events. Interactions on the non-CLI interfaces: REST and WebUI. PASS requires local accounting. Audited against AOS-CX ''show running-config'' output (saved in full); context blocks such as ''password complexity'' or ''cli-session'' are matched by their indented member lines.'
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.5.4.1 Local Accounting
audit:
  type: config_regex
  pattern: (?m)^aaa accounting (?:all|all-mgmt|exec|command|commands|system) [^\n]*\blocal\b
remediation:
  type: iac_patch
  command: |-
    aaa accounting all-mgmt default start-stop local
    # CIS guidance:
    aaa accounting commands {exec|command|system} local
