id: TMA-ARUBA-CX-1.5.1.1
title: Radius Server Configuration
description: 'Remote AAA with RADIUS provides the following for your Aruba CX switch: Authentication using remote RADIUS AAA servers. Command authorization is not supported by RADIUS servers, however, user- defined local user groups can be configured with command-authorization rules, providing locally configured per command authorization for members of such groups. See User- defined user groups . In the switch default state (without user-defined local groups), basic role-based authorization is available with the three built-in roles (administrators, operators, auditors). Transmission of locally collected accounting information to remote RADIUS servers. PASS requires a RADIUS server host and an aaa radius server group. Audited against AOS-CX ''show running-config'' output (saved in full); context blocks such as ''password complexity'' or ''cli-session'' are matched by their indented member lines.'
target: aruba-cx
level: 2
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.5.1.1 Radius Server Configuration
audit:
  type: config_regex
  pattern: (?m)(?:^radius-server host \S+(?s:.*?)^aaa group server radius \S+|^aaa group server radius \S+(?s:.*?)^radius-server host \S+)
remediation:
  type: iac_patch
  command: |-
    radius-server host 10.0.0.30 key plaintext <key> vrf mgmt
    aaa group server radius radius1
        server 10.0.0.30 vrf mgmt
    # CIS guidance:
    To Configure RADIUS Server -
    radius-server host {<FQDN> | <IPV4> | <IPV6>} [key [plaintext
    <PASSKEY> | ciphertext <PASSKEY>]] [vrf <VRF-NAME>] To Associate RADIUS Server to the group -
    aaa group server radius <group-name>
    server <FQDN | IPv4 | IPv6> vrf <vrf>
    exit
