id: TMA-ARUBA-CX-1.2.3
title: SSH Server Port Customization
description: This sequence describes configuring which IP port SSH server listens on PASS requires an SSH server port other than 22. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.2.3 SSH Server Port Customization
audit:
  type: config_regex
  pattern: (?m)^ssh server port (?:\d|[013-9]\d|2[013-9]|\d{3,})[ \t]*$
remediation:
  type: iac_patch
  command: |-
    ssh server port 44444
    # CIS guidance:
    conf
    ssh server port 44444
    Active SSH sessions will be terminated. Do you want to continue (y/n)? y
