id: TMA-ARUBA-CX-3.2.1.2
title: DHCPv6 Guard
description: DHCPv6 guard is an extension of DHCPv6 snooping. When the DHCPv6 snooping feature is configured globally and on the VLAN, the ports are configured as trusted and untrusted ports. DHCPv6 guard enhances this by creating a policy and applying it on a port and on the VLAN. This policy contains multiple attributes which are compared against the packet that is received on trusted ports. If the packet complies with the attributes of the policy, it is forwarded to the destination port; otherwise the packet is dropped.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- layer2
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.2.1.2 DHCPv6 Guard
audit:
  type: manual
  command: Where IPv6 is used, run 'show dhcpv6-snooping guard-policy' and confirm a DHCPv6 guard policy (server ACL, preference limits, client prefix-list) is applied to user VLANs.
remediation:
  type: iac_patch
  command: |-
    The following are sample configurations of DHCPv6 guard -
    dhcpv6-snooping guard-policy <policy-name>
    match server access-list <acl-name>
    preference min <6>
    preference max <250>
    match client prefix-list <prefix-list>
    exit
    vlan <vlan-id>
    dhcpv6-snooping guard-policy <policy-name>
