id: TMA-ARUBA-CX-1.1.7
title: RBAC - Customer defined local user groups
description: 'AOS-CX switches include three different built-in local user groups: administrators, operators, auditors. Administrators have full read-write access, operators have read- only access, and auditors can read the logs. There may be scenarios where customers need a a local user group with a different set of permissions. User-defined local user groups allow customers to create their own user group with specific CLI commands allowed for members of that group.'
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.1.7 RBAC - Customer defined local user groups
audit:
  type: manual
  command: Run 'show user-group' and confirm customer-defined local user groups exist for the roles in use (beyond the built-in administrators, auditors and operators), each with rules that permit only the commands that role needs ('show user-group <group>').
remediation:
  type: iac_patch
  command: |-
    Create local user groups as needed:
    user-group group
    10 permit cli command "<command>"
    20 permit cli command "<command>"
    exit
