id: TMA-ARUBA-CX-1.14
title: Create Hostname
description: The host-name property should be set up to be unique name on the management network. This enables the switch to be resolved with a unique FQDN. PASS requires a hostname to be configured. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 1
severity: low
tags:
- aruba-cx
- hardening
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.14 Create Hostname
audit:
  type: config_regex
  pattern: (?m)^hostname \S+
remediation:
  type: iac_patch
  command: |-
    hostname <name>
    # CIS guidance:
    hostname _[name]_
    2 Interface Interface level security in HPE ANW CX switches ensures secure access and protects against threats by safeguarding both physical and virtual interfaces. This section will cover features that handles security in the interface level
    2.1 Physical Security
