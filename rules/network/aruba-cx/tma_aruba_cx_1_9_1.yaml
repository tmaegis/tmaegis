id: TMA-ARUBA-CX-1.9.1
title: https-server default enablement
description: On AOS-CX, the https-server is enabled by default allowing customers to access the device via its REST API or Web interface (WebUI). On campus products, the https- server is enabled on the default VRF. Products with an OOBM interface also have the https-server enabled on the mgmt VRF.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.9.1 https-server default enablement
audit:
  type: manual
  command: Run 'show https-server' and confirm the https-server (REST/Web UI) is enabled only on the VRFs where it is required (e.g. mgmt), or disabled entirely with 'no https-server vrf <VRF>' if it is not used.
remediation:
  type: iac_patch
  command: |-
    Customers that do not wish to have the https-server enabled can disable it using the following:
    no https-server vrf <VRF-NAME>
