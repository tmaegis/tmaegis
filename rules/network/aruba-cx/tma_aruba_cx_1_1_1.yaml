id: TMA-ARUBA-CX-1.1.1
title: Create security user group
description: This sequence creates a new local user group which can be used for security administrators.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.1.1 Create security user group
audit:
  type: manual
  command: Run 'show user-group' and confirm a security administrator user group exists whose rules permit 'show security-logs*', 'clear security-logs' and 'copy security-log*', and that security administrators are members of it.
remediation:
  type: iac_patch
  command: |-
    user-group <group>
        permit cli command "show security-logs*"
        permit cli command "clear security-logs"
        permit cli command "copy security-log*"
        exit
    user <name> group <group> password
