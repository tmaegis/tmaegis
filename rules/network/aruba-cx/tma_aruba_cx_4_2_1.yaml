id: TMA-ARUBA-CX-4.2.1
title: Spaning Tree BPDU Protect
description: This sequence describes configuring Spanning Tree's BPDU Protect feature
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- layer2
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 4.2.1 Spaning Tree BPDU Protect
audit:
  type: manual
  command: 'Run ''show spanning-tree interface <id>'' for every access (edge) port and confirm ''BPDU Guard : enabled''.'
remediation:
  type: iac_patch
  command: |-
    interface 1/1/20
    no shutdown
    no routing
    vlan access 10
    spanning-tree bpdu-guard
    exit
