id: TMA-ARUBA-CX-3.1.2.1
title: Control Plane ACL for BGP Peering Sessions
description: Utilizing the control-place ACL functionality to limit BGP communication to configured BGP peers
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 3.1.2.1 Control Plane ACL for BGP Peering Sessions
audit:
  type: manual
  command: Where BGP runs, run 'show access-list control-plane' and confirm a control-plane ACL permits TCP/179 only from configured BGP peers and denies all other TCP/179 traffic.
remediation:
  type: iac_patch
  command: |-
    Devices running BGP listen for connections on TCP port 179. When establishing a BGP peer session, one device actively establishes a relationship with the other peer by sending the first TCP SYN packet. This device is at the outgoing side of the connection. The other peer, hearing the TCP SYN, responds with a SYN or ACK at the incoming connection. As each peer can assume either role, ACL entries need to be configured for BGP in both directions. Sample Control Plane ACL example is shown below, the these entries permit traffic from 10.20.0.10 so that it can establish a BGP peering session with the device. Either side could play the outgoing or incoming role in the BGP connection, so the ACL requires two entries per peer After allowing traffic from all configured peers, block all other devices from establishing a BGP peering session by denying all other traffic to or from TCP port 179.
    access-list ip <CONTROLPLANE-ACL-NAME>
    800 comment LOCKDOWN BGP SESSIONS
    805 permit tcp <10.20.0.10> gt 1023 any eq 179
    810 permit tcp <10.20.0.10> eq 179 any gt 1023
    815 deny tcp any gt 1023 any eq 179
    820 deny tcp any eq 179 any gt 1023
    990 comment ALLOW ANYTHING ELSE
    1000 permit any any any
    exit
    switch(config) apply access-list {ip|ipv6} <CONTROLPLANE-ACL-NAME> control-
    plane vrf <VRF-NAME>
