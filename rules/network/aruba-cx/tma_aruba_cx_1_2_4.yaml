id: TMA-ARUBA-CX-1.2.4
title: Recommended Ciphers, MACs, and Algorithms
description: This sequence describes configuring SSH server ciphers, MACs, and algorithms
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- crypto
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.2.4 Recommended Ciphers, MACs, and Algorithms
audit:
  type: manual
  command: Run 'show ssh server' and review the Ciphers, Host Key Algorithms, Key Exchange Algorithms, MACs and Public Key Algorithms lists. Only organisation-approved strong algorithms should be enabled (set with 'ssh ciphers', 'ssh macs', 'ssh key-exchange-algorithms', 'ssh host-key-algorithms', 'ssh public-key-algorithms').
remediation:
  type: iac_patch
  command: |-
    ssh ciphers aes128-ctr aes256-ctr aes128-cbc aes256-cbc
    ssh macs hmac-sha2-256 hmac-sha2-512 hmac-sha1
    ssh key-exchange-algorithms ecdh-sha2-nistp256 ecdh-sha2-
    nistp384 diffie-hellman-group14-sha1
    ssh host-key-algorithms ecdsa-sha2-nistp256 ecdsa-sha2-
    nistp384 ecdsa-sha2-nistp521
    ssh public-key-algorithms ecdsa-sha2-nistp256 ecdsa-sha2-
    nistp384 ecdsa-sha2-nistp521
