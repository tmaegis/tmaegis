id: TMA-ARUBA-CX-1.2.6
title: SSH Server Key
description: This sequence describes configuring the SSH server keys.
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- management
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.2.6 SSH Server Key
audit:
  type: manual
  command: 'Run ''show ssh host-key'' and confirm the SSH server host keys are strong: ECDSA (nistp256 or larger), ED25519, and RSA of at least 2048 bits. Regenerate weak keys with ''ssh host-key <type> ...''.'
remediation:
  type: iac_patch
  command: |-
    To set ssh server key:
    ssh host-key <key-type> <curve/bits>
    To set a nistp256 ecdsa server-key:
    ssh host-key ecdsa ecdsa-sha2-nistp256
    ecdsa host-key will be overwritten. Do you want to continue (y/n)? y to set an ed25519 server-key:
    ssh host-key ed25519
    ed25519 host-key will be overwritten. Do you want to continue (y/n)? y To set a 256-bit RSA server-key:
    ssh host-key rsa bits 2048
    rsa host-key will be overwritten. Do you want to continue (y/n)? y
