id: TMA-ARUBA-CX-4.2.2
title: Spanning Tree Root Protect
description: This sequence describes configuring Spanning Tree's Root Protect feature
target: aruba-cx
level: 1
severity: medium
tags:
- aruba-cx
- layer2
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 4.2.2 Spanning Tree Root Protect
audit:
  type: manual
  command: 'Run ''show spanning-tree interface <id>'' for ports facing switches that must never become root and confirm ''Root Guard : enabled''.'
remediation:
  type: iac_patch
  command: |-
    interface 1/1/21
    no shutdown
    no routing
    vlan trunk allow all
    vlan trunk native 1
    spanning-tree root-guard
    exit
