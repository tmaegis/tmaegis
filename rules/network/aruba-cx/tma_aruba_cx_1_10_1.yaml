id: TMA-ARUBA-CX-1.10.1
title: ServiceOS Password
description: This sequence descries enabling password authentication for ServiceOS login. PASS requires system serviceos password-prompt. Audited against AOS-CX 'show running-config' output (saved in full); context blocks such as 'password complexity' or 'cli-session' are matched by their indented member lines.
target: aruba-cx
level: 1
severity: high
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.10.1 ServiceOS Password
audit:
  type: config_regex
  pattern: (?m)^system serviceos password-prompt\b
remediation:
  type: iac_patch
  command: |-
    system serviceos password-prompt
    # CIS guidance:
    Enable ServiceOS password authentication:
    system serviceos password-prompt
