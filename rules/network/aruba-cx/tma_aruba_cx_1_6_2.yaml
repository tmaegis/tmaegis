id: TMA-ARUBA-CX-1.6.2
title: TLS Minimum Version
description: The switch supports TLS version 1.2 and 1.3 and secure cipher suites for each TLS version supported.
target: aruba-cx
level: 2
severity: high
tags:
- aruba-cx
- crypto
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.6.2 TLS Minimum Version
audit:
  type: manual
  command: Run 'show tls global' and confirm 'Minimum TLS version' is 1.2 (or 1.3) and that only strong cipher suites are allowed.
remediation:
  type: iac_patch
  command: AOS-CX supports only TLS 1.2 and 1.3; keep the minimum TLS version at 1.2 or higher and allow only strong cipher suites (see 'show tls global').
