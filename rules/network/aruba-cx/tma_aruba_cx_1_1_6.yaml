id: TMA-ARUBA-CX-1.1.6
title: Default admin account password
description: The AOS-CX switches ship with a built-in, default user account named 'admin'. In accordance with the 2020 California password law, AOS-CX switches require that customers set the password for this built-in user account at first login.
target: aruba-cx
level: 1
severity: critical
tags:
- aruba-cx
- authentication
reference: CIS HPE Aruba Networking CX Switch Benchmark v1.0.1 - 1.1.6 Default admin account password
audit:
  type: manual
  command: 'There is no stored setting to audit: on first login AOS-CX forces a password for the built-in ''admin'' account. Confirm with the device owner that a strong, unique admin password was set (or reset it with ''user admin password'').'
remediation:
  type: iac_patch
  command: |-
    If a customer fails to set a strong password for the built-in 'admin' user account, he/she can set the password using the following command:
    user admin password
    Enter password: ************ Confirm password: ************
