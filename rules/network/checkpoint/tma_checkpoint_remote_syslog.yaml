id: TMA-CHECKPOINT-REMOTE-SYSLOG
title: Ensure logs are sent to a remote syslog server
description: PASS requires at least one 'add syslog log-remote-address' entry. Audited against the Gaia clish 'show configuration' output.
target: checkpoint
level: 1
severity: medium
tags:
- checkpoint
- logging
reference: CIS Check Point Firewall Benchmark - Logging - Remote syslog server (verify section number for your Gaia release)
audit:
  type: config_regex
  pattern: (?m)^add syslog log-remote-address \S+
remediation:
  type: iac_patch
  command: |-
    add syslog log-remote-address 10.0.0.50 level info
    save config
    WebUI: System Management > System Logging > Remote System Logging.
