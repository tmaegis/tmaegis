id: TMA-CHECKPOINT-2.1.8
title: Ensure Host Name is set
description: Changes the device default hostname. PASS requires a hostname to be set. Audited against the Gaia clish 'show configuration' output (run 'show configuration' in clish on each gateway and management server and save the full output).
target: checkpoint
level: 1
severity: low
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 2.1.8 Ensure Host Name is set
audit:
  type: config_regex
  pattern: (?m)^set hostname \S+
remediation:
  type: iac_patch
  command: |-
    set hostname <name>
    save config
    # CIS guidance:
    Run the following command to set Host Name. CLI:
    set hostname <name>
    GUI:
    Navigate to Network Management > Hosts and DNS > System Name > Host Name
