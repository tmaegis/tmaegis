id: TMA-CHECKPOINT-3.4
title: Ensure Hit count is Enable for the rules
description: The Hit Count setting shows the number of hits for the rules if enabled. When a new connection crosses a Firewall, hits are incremented for the matching rule.
target: checkpoint
level: 2
severity: low
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.4 Ensure Hit count is Enable for the rules
audit:
  type: manual
  command: Go to the following path in Smart Console and verify Enable Hit Count is enabled. Navigate to Global Properties > Hit Count Verify 'Enable Hit Count' is checked
remediation:
  type: iac_patch
  command: |-
    Go to the following path in Smart Console and Enable the Enable Hit Count setting.
    Navigate to Global Properties > Hit Count Checked the 'Enable Hit Count' setting
