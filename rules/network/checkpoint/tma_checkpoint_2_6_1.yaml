id: TMA-CHECKPOINT-2.6.1
title: Ensure mgmtauditlogs is set to on
description: The mgmtauditlogs specifies if the Gaia sends the Gaia audit logs (for configuration changes that authorized users make) to a Check Point Management Server. PASS requires set syslog mgmtauditlogs on. Audited against the Gaia clish 'show configuration' output (run 'show configuration' in clish on each gateway and management server and save the full output).
target: checkpoint
level: 1
severity: medium
tags:
- checkpoint
- logging
reference: CIS Check Point Firewall Benchmark v1.1.0 - 2.6.1 Ensure mgmtauditlogs is set to on
audit:
  type: config_regex
  pattern: (?m)^set syslog mgmtauditlogs on[ \t]*$
remediation:
  type: iac_patch
  command: |-
    set syslog mgmtauditlogs on
    save config
    # CIS guidance:
    Run the following command to enable the mgmtauditlogs. CLI:
    set syslog mgmtauditlogs on
    GUI:
    Navigate to System Management > System Logging > System Logging checked the Send audit logs to management server upon successful configuration
