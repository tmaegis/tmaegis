id: TMA-CHECKPOINT-3.10
title: Ensure Drop Out of State TCP Packets is enabled
description: The Drop out of state TCP Packets setting will drop the out of state or non-synchronized TCP Packets for which firewall does not have a matching state table entry.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.10 Ensure Drop Out of State TCP Packets is enabled
audit:
  type: manual
  command: Go to the following path and verify Drop Out of State TCP Packets and Log on Drop is enabled. SmartConsole > Global Properties > Stateful Inspection Verify Drop Out of State TCP Packets and Log on Drop is checked.
remediation:
  type: iac_patch
  command: Go to the following path and checked the Drop Out of State TCP Packets and Log on Drop. SmartConsole > Global Properties > Stateful Inspection Checked the Drop Out of State TCP Packets and Log on Drop
