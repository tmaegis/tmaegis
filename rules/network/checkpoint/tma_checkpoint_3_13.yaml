id: TMA-CHECKPOINT-3.13
title: Ensure Disk Space Alert is set
description: This is used to generate the Log and Alert when disk space reaches the configured limit.
target: checkpoint
level: 1
severity: low
tags:
- checkpoint
- logging
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.13 Ensure Disk Space Alert is set
audit:
  type: manual
  command: Verify Disk Space Alert is configured if disk space goes beyond the organization defined configured limit. SmartConsole > Gateways & Servers > Select each Gateway > Logs > Local Storage * When disk space is below is checked and value MBytes or Percentage is configured * Issue alert is set to Log, Popup Alert, Mail or SNMP trap alert.
remediation:
  type: iac_patch
  command: Go to the following path and configured the Disk Space Alert. SmartConsole > Gateways & Servers > Select each Gateway > Logs > Local Storage * Checked the When disk space is below and value MBytes or Percentage is configured as per the Organization Policy. * Set the Issue alert to Log, Popup Alert, Mail or SNMP trap alert.
