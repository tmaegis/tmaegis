id: TMA-CHECKPOINT-3.18
title: Ensure Allow bi-directional NAT is enabled
description: Allow bi-directional NAT applies to automatic NAT rules in the NAT Rule Base and allows two automatic NAT rules to match a connection. Without Bidirectional NAT, only one automatic NAT rule can match a connection.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.18 Ensure Allow bi-directional NAT is enabled
audit:
  type: manual
  command: Verify Allow bi-directional NAT under Global Properties is enabled. SmartConsole > Gateways & Servers > select each Gateway > NAT - Network Address Translation Verify Allow bi-directional NAT is checked.
remediation:
  type: iac_patch
  command: 'SmartConsole > Gateways & Servers > select each Gateway > NAT - Network Address Translation: check Allow bi-directional NAT (the CIS text says ''Unchecked'', which contradicts the recommendation).'
