id: TMA-CHECKPOINT-3.2
title: Configure a Default Drop/Cleanup Rule
description: Ensure that the final rule in the rulebase explicitly drops all services, destinations, etc not specifically allowed in the previous rules. It is important that any access not explicitly allowed be explicitly dropped.
target: checkpoint
level: 2
severity: high
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.2 Configure a Default Drop/Cleanup Rule
audit:
  type: manual
  command: Verify the last rule is present in the rulebase which is denying all traffic from any source to any destination.
remediation:
  type: iac_patch
  command: Create or edit the last rule in the rulebase which is denying all traffic from any source to any destination.
