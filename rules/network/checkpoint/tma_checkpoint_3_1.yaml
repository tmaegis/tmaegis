id: TMA-CHECKPOINT-3.1
title: Enable the Firewall Stealth Rule
description: Create a rule to drop Any Service from Any Source or Any VPN that attempts to connect to the gateway.
target: checkpoint
level: 2
severity: high
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.1 Enable the Firewall Stealth Rule
audit:
  type: manual
  command: Login to the Management Server via SmartConsole and create or edit the stealth rule and make sure it is on top of all rules and only allowed sources and services are allowed to access the Gateway.
remediation:
  type: iac_patch
  command: Login to the Management Server via SmartDashboard and create or edit the stealth rule, allowed only required IP address to manage the gateway and make sure it is on top of all rules.
