id: TMA-CHECKPOINT-3.11
title: Ensure Drop Out of State ICMP Packets is enabled
description: This drops the out of state ICMP packets.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.11 Ensure Drop Out of State ICMP Packets is enabled
audit:
  type: manual
  command: Go to the following path and verify Drop Out of State ICMP Packets and Log on Drop is enabled. SmartConsole > Global Properties > Stateful Inspection Verify Drop Out of State ICMP Packets and Log on Drop is checked.
remediation:
  type: iac_patch
  command: Go to the following path and checked the Drop Out of State ICMP Packets and Log on Drop. SmartConsole > Global Properties > Stateful Inspection Checked the Drop Out of State ICMP Packets and Log on Drop
