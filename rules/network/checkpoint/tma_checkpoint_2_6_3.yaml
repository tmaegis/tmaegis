id: TMA-CHECKPOINT-2.6.3
title: Ensure cplogs is set to on
description: 'The cplogs specifies if the Gaia sends the Gaia system logs to a Check Point Management Server: PASS requires set syslog cplogs on. Audited against the Gaia clish ''show configuration'' output (run ''show configuration'' in clish on each gateway and management server and save the full output).'
target: checkpoint
level: 1
severity: medium
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 2.6.3 Ensure cplogs is set to on
audit:
  type: config_regex
  pattern: (?m)^set syslog cplogs on[ \t]*$
remediation:
  type: iac_patch
  command: |-
    set syslog cplogs on
    save config
    # CIS guidance:
    Run the following command to enable the cplogs. CLI:
    set syslog cplogs on
    GUI:
    Navigate to System Management > System Logging > System Logging checked the Send Syslog messages to management server
