id: TMA-CHECKPOINT-3.20
title: Ensure Logging is enabled for Track Options of Global Properties
description: This defines the system-wide logging and alerting of parameters.
target: checkpoint
level: 1
severity: medium
tags:
- checkpoint
- logging
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.20 Ensure Logging is enabled for Track Options of Global Properties
audit:
  type: manual
  command: Verify Logging is set to Log or Popup Alert or Mail Alert or SNMP Trap Alert for the following events SmartConsole > Global Properties > Log and Alert > Track Options VPN successful key exchange VPN packet handling errors VPN configuration & key exchange errors IP Options drop Administrative Notification Connection matched by SAM Dynamic object resolution failure Packet is incorrectly tagged Packet tagging brute force attack Verify Log every authenticated HTTP connection is enabled.
remediation:
  type: iac_patch
  command: 'SmartConsole > Global Properties > Log and Alert > Track Options: set Log (or Popup Alert, Mail Alert or SNMP Trap Alert) for VPN successful key exchange, VPN packet handling errors, VPN configuration & key exchange errors, IP Options drop, Administrative Notification, Connection matched by SAM, Dynamic object resolution failure, Packet is incorrectly tagged and Packet tagging brute force attack. Check Log every authenticated HTTP connection.'
