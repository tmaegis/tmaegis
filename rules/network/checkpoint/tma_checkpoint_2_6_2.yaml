id: TMA-CHECKPOINT-2.6.2
title: Ensure auditlog is set to permanent
description: The auditlog specifies if the Gaia saves the logs for configuration changes that authorized users have done. PASS requires set syslog auditlog permanent. Audited against the Gaia clish 'show configuration' output (run 'show configuration' in clish on each gateway and management server and save the full output).
target: checkpoint
level: 1
severity: medium
tags:
- checkpoint
- logging
reference: CIS Check Point Firewall Benchmark v1.1.0 - 2.6.2 Ensure auditlog is set to permanent
audit:
  type: config_regex
  pattern: (?m)^set syslog auditlog permanent[ \t]*$
remediation:
  type: iac_patch
  command: |-
    set syslog auditlog permanent
    save config
    # CIS guidance:
    Run the following command to enable the auditlog. CLI:
    set syslog auditlog permanent
    GUI:
    Navigate to System Management > System Logging > System Logging checked the Send audit logs to syslog upon successful configuration
