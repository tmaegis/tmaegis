id: TMA-CHECKPOINT-2.1.2
title: Ensure 'Message Of The Day (MOTD)' is set
description: Sets the MOTD message. PASS requires set message motd on (with an organisation-defined msgvalue). Audited against the Gaia clish 'show configuration' output (run 'show configuration' in clish on each gateway and management server and save the full output).
target: checkpoint
level: 1
severity: low
tags:
- checkpoint
- banner
reference: CIS Check Point Firewall Benchmark v1.1.0 - 2.1.2 Ensure 'Message Of The Day (MOTD)' is set
audit:
  type: config_regex
  pattern: (?m)^set message motd on\b
remediation:
  type: iac_patch
  command: |-
    set message motd on msgvalue "MOTD BANNER"
    save config
    # CIS guidance:
    Run the following command to enable and configured the MOTD setting. CLI:
    set message motd on msgvalue "MOTD BANNER"
    GUI:
    Navigate to System Management -> Messages -> Message of the day Checked the Message of the day and add "MOTD Banner".
