id: TMA-CHECKPOINT-3.19
title: Ensure Automatic ARP Configuration NAT is enabled
description: Proxy ARP is a mechanism that allows the configuration of a Gateway to respond to ARP requests on behalf of other hosts.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.19 Ensure Automatic ARP Configuration NAT is enabled
audit:
  type: manual
  command: Verify Automatic ARP Configuration NAT under Global Properties is enabled. SmartConsole > Gateways & Servers > select each Gateway > NAT - Network Address Translation Verify Automatic ARP Configuration NAT is checked.
remediation:
  type: iac_patch
  command: 'SmartConsole > Gateways & Servers > select each Gateway > NAT - Network Address Translation: check Automatic ARP Configuration (the CIS text says ''Unchecked'', which contradicts the recommendation).'
