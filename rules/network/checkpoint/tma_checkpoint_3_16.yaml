id: TMA-CHECKPOINT-3.16
title: Ensure Accept Domain Name over UDP (Queries) is not enabled
description: The 'Domain Name Over UDP (Queries)' is a global property setting which is used to allow or reject all the UDP-type DNS packets to and from anywhere. These rules are considered as rule zero which are execute before any user-defined rules.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.16 Ensure Accept Domain Name over UDP (Queries) is not enabled
audit:
  type: manual
  command: Verify Accept Accept Domain Name over UDP (Queries) under Global Properties is not enabled. SmartConsole > Gateways & Servers > select each Gateway > Firewall Verify Accept Accept Domain Name over UDP (Queries) is unchecked.
remediation:
  type: iac_patch
  command: Go to the following path and Configured the Accept Accept Domain Name over UDP (Queries). SmartConsole > Gateways & Servers > select each Gateway > Firewall Unchecked the Accept Accept Domain Name over UDP (Queries)
