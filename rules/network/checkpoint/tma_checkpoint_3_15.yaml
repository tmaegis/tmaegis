id: TMA-CHECKPOINT-3.15
title: Ensure Accept Domain Name over TCP (Zone Transfer) is not enabled
description: The 'Domain Name Over TCP (Zone transfer)' is a global property setting which is used to allow or reject all the TCP-type DNS packets to and from anywhere. These rules are considered as rule zero which are executed before any user-defined rules.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- firewall-policy
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.15 Ensure Accept Domain Name over TCP (Zone Transfer) is not enabled
audit:
  type: manual
  command: Verify Accept Accept Domain Name over TCP (Zone Transfer) under Global Properties is not enabled. SmartConsole > Gateways & Servers > select each Gateway > Firewall Veiry Accept Accept Domain Name over TCP (Zone Transfer) is unchecked.
remediation:
  type: iac_patch
  command: Go to the following path and Configured the Accept Accept Domain Name over TCP (Zone Transfer). SmartConsole > Gateways & Servers > select each Gateway > Firewall Unchecked the Accept Accept Domain Name over TCP (Zone Transfer)
