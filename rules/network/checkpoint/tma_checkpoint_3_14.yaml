id: TMA-CHECKPOINT-3.14
title: Ensure Accept RIP is not enabled
description: The Accept RIP is a Global property setting which you can set either to accept or reject the RIP packets which is using UDP Port 520. RIP maintains information about reachable systems and routes to those systems.
target: checkpoint
level: 2
severity: medium
tags:
- checkpoint
- hardening
reference: CIS Check Point Firewall Benchmark v1.1.0 - 3.14 Ensure Accept RIP is not enabled
audit:
  type: manual
  command: Verify Accept RIP under Global Properties is not enabled. SmartConsole > Gateways & Servers > select each Gateway > Firewall Veiry Accept RIP is unchecked.
remediation:
  type: iac_patch
  command: Go to the following path and Configured the Accept RIP. SmartConsole > Gateways & Servers > select each Gateway > Firewall Unchecked the Accept RIP
