id: TMA-PFSENSE-5.2.1
title: Ensure time zone is properly configured
description: Sets the local time zone information so that the device's time display is more accurate for viewers.
target: pfsense
level: 1
severity: low
tags:
- pfsense
- time
reference: CIS pfSense Firewall Benchmark v1.1.0 - 5.2.1 Ensure time zone is properly configured
audit:
  type: manual
  command: 'System > General Setup: confirm Timezone matches the organisation''s standard and Timeservers lists approved NTP servers. Services > NTP: confirm the NTP service is enabled (the CIS audit checks Enable NTP Server).'
remediation:
  type: iac_patch
  command: |-
    In the GUI:
    -
    Navigate to Services > NTP
    - Checked the 'Enable NTP Server' Field
    - CLIck 'Save'
