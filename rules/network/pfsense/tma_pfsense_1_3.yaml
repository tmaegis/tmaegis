id: TMA-PFSENSE-1.3
title: Ensure 'Message Of The Day (MOTD)' is set
description: Sets the MOTD message.
target: pfsense
level: 1
severity: low
tags:
- pfsense
- banner
reference: CIS pfSense Firewall Benchmark v1.1.0 - 1.3 Ensure 'Message Of The Day (MOTD)' is set
audit:
  type: manual
  command: 'From the pfSense shell run: cat /etc/motd. Confirm it contains the organisation''s approved message of the day instead of the FreeBSD default text.'
remediation:
  type: iac_patch
  command: |-
    In pfSense Shell:
    Type 'Message Of The Day (MOTD)' message here vi /etc/motd
