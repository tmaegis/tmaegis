id: TMA-EXTREME-SLX-2.5.3
title: Syslog Audit Class Configuration
description: A syslog audit class is a categorization mechanism used in logging systems to classify and group different types of audit events. This allows administrators to define what specific events or activities should be logged. PASS requires auditlog classes SECURITY, CONFIGURATION and FIRMWARE. Audited against SLX-OS 'show running-config' output (saved in full).
target: extreme-slx
level: 1
severity: medium
tags:
- extreme-slx
- logging
reference: CIS ExtremeNetworks SLX-OS 20.X.X Benchmark v1.0.1 - 2.5.3 Syslog Audit Class Configuration
audit:
  type: config_regex
  pattern: (?m)(?:^logging auditlog class SECURITY\b(?s:.*?)^logging auditlog class CONFIGURATION\b(?s:.*?)^logging auditlog class FIRMWARE\b|^logging auditlog class SECURITY\b(?s:.*?)^logging auditlog class FIRMWARE\b(?s:.*?)^logging auditlog class CONFIGURATION\b|^logging auditlog class CONFIGURATION\b(?s:.*?)^logging auditlog class SECURITY\b(?s:.*?)^logging auditlog class FIRMWARE\b|^logging auditlog class CONFIGURATION\b(?s:.*?)^logging auditlog class FIRMWARE\b(?s:.*?)^logging auditlog class SECURITY\b|^logging auditlog class FIRMWARE\b(?s:.*?)^logging auditlog class SECURITY\b(?s:.*?)^logging auditlog class CONFIGURATION\b|^logging auditlog class FIRMWARE\b(?s:.*?)^logging auditlog class CONFIGURATION\b(?s:.*?)^logging auditlog class SECURITY\b)
remediation:
  type: iac_patch
  command: |-
    configure terminal
    logging auditlog class SECURITY
    logging auditlog class CONFIGURATION
    logging auditlog class FIRMWARE
    end
    # CIS guidance:
    logging auditlog class SECURITY
    logging auditlog class CONFIGURATION
    logging auditlog class FIRMWARE
