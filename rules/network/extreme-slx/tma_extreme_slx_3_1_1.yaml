id: TMA-EXTREME-SLX-3.1.1
title: Disable Unused Interfaces
description: Any unused interface should be disabled. The SLX-OS switches enable all ports by default. However, unused ports should be disabled and only used ports should be enabled.
target: extreme-slx
level: 1
severity: medium
tags:
- extreme-slx
- management
reference: CIS ExtremeNetworks SLX-OS 20.X.X Benchmark v1.0.1 - 3.1.1 Disable Unused Interfaces
audit:
  type: manual
  command: Run 'show interface status' (e.g. 'show interface status | include Eth.*Down | count') and confirm every Ethernet port that is not connected or not in use is administratively shut down.
remediation:
  type: iac_patch
  command: |-
    interface ethernet 1-32
    shutdown
