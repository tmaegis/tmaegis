id: TMA-CISCO-FTD-3.1.1
title: Secure the Network Time Protocol Server
description: 'Network Time Protocol (NTP) is intended to synchronize all participating devices to within a few milliseconds of Coordinated Universal Time (UTC). NTP is important for correct logging and tracking of events. Synchronizing the system time on the management center and its managed devices is essential to successful operation of Firepower. We strongly recommend using a secure and trusted Network Time Protocol (NTP) server to synchronize system time on the management ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- ntp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 3.1.1 Secure the Network Time Protocol Server
audit:
  type: manual
  command: 'CIS assessment: Manual. Devices > Platform Settings > Time Synchronization (verify NTP server)'
remediation:
  type: iac_patch
  command: 'Devices > Platform Settings > Time Synchronization > _Configure one of the following clock options:_ Via NTP from Defense Center-(Default). The managed device gets time from the NTP servers you configured for the management center (except for authenticated NTP servers) and synchronizes time with those servers directly. However, if any of the following are true, the managed device synchronizes time from the management center: The management center''s NTP servers are not reachable by the device. The management center has no unauthenticated servers. Via NTP from-If your management center is using NTP servers on the network, select this option and enter the fully-qualified DNS name (such as ntp.example.com), or IPv4 or IPv6 address, of the same NTP servers you specified in System > Configuration > Time Synchronization. If the NTP servers are not reachable, the management center acts as an NTP server.'
