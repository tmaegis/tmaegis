id: TMA-CISCO-FTD-3.2.1
title: Disable fragment reassembly
description: Attackers use fragmentation to evade security systems such as firewalls or IPS because the checks are usually performed on the first fragment. They can then put malicious payload in the other fragments to perform DoS against internal systems. Checks the LINA config for 'fragment chain 1 <ifname>' pushed by Platform Settings > Fragment Settings. Automated checks run against the FTD LINA configuration from 'show running-config' on the FTD CLI (configuration is pushed by the FMC); FMC GUI settings are manual checks.
target: cisco-ftd
level: 2
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 3.2.1 Disable fragment reassembly
audit:
  type: config_regex
  pattern: (?m)^fragment chain 1 \S+
remediation:
  type: iac_patch
  command: Devices > Platform Settings > create an FTD policy > Fragment Settings > set Chain (Packet) to '1' > Save and Deploy
