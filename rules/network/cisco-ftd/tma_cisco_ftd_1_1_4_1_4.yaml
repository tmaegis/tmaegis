id: TMA-CISCO-FTD-1.1.4.1.4
title: Manage a Realm
description: 'This section describes how to perform various maintenance tasks for a realm using controls on the Realms page. As a network administrator it is critical that you are able to administrate your realms, rules and identities. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.4 Manage a Realm
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Log in to the Firepower Management Center. 2. Click System > Integration. 3. Click Realms. View all of your available Realms.'
remediation:
  type: iac_patch
  command: 1. Log in to the Firepower Management Center. 2. Click System > Integration. 3. Click Realms. 4. To delete a realm, click Delete (delete icon). 5. To edit a realm, click Edit (edit icon) next to the realm and make changes as described in [Create a Realm](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configura tion/guide/fpmc-config-guide-v601/Identity_Policies_and_Realms.html#task_F9ED2AF84F604438ACDC2124237DC518) . 6. To enable a realm, slide State to the right; to disable a realm, slide it to the left. 7. To download users and user groups, click Download (download icon). 8. To copy a realm, click Copy (copy icon).
