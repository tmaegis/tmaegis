id: TMA-CISCO-FTD-1.1.1.2
title: Do not use the default "admin" account
description: 'The use of named accounts is recommended for all access to the Firepower interface. The default "admin" account should only be used in exceptional circumstances. The built in "admin" account has full rights to all facets of the Firepower platform. If a change is made by this account, linking this change back to an actual person or automated process can be difficult or impossible. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: high
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.1.2 Do not use the default "admin" account
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Access the Firepower Management Center (FMC): You can access the FMC using a web browser by entering its IP address in the address bar. Make sure you have administrative privileges to perform this task. 2. Log in to the FMC: Use the default "admin" account to log in. If this succeeds you have verified that the "admin" account is active.'
remediation:
  type: iac_patch
  command: |-
    ! 1. Create a New User:
    - Go to "System" in the FMC navigation menu.
    - Under "System Configuration," click on "Users."
    - Click the "Add" button to create a new user account.
    - Enter the new user's details, including a unique username and password.
    - Assign the appropriate role and permissions to the new user, such as Administrator or another custom role with the necessary privileges. 2. Disable or Delete the Default "admin" Account:
    - While still in the "Users" section, locate the "admin" account.
    - You can either disable or delete the "admin" account. Disabling is a safer option in case you need to revert changes later, but deletion is more secure. To disable the account, simply uncheck the "Enable" option next to the "admin" account. To delete the account, select the "admin" account and click the "Delete" button. 3. Log Out and Log Back In: Log out of the FMC, and then log back in using the new user account you created. 4. Test the New User Account: Verify that the new user account has the necessary privileges and access to perform administrative tasks on the Cisco Firepower firewall. 5. Update Documentation: Ensure that you document the changes you've made, including the new user account details and any changes to the "admin" account.
