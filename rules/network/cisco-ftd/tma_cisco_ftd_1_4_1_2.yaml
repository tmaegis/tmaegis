id: TMA-CISCO-FTD-1.4.1.2
title: Ensure that the Health Policy is assigned to the managed Firepower Appliances
description: This checks to ensure that an appropriate Health Policy is assigned to all managed Firepower devices. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.1.2 Ensure that the Health Policy is assigned to the managed Firepower Appliances
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. - Navigate to Devices > Device Management - Select each device in turn - Verify that under Device > Health, that the appropriate Health Policy is applied (see Recommendation 1.4.1.1) Alternatively: - Navigate to System (Gear icon) > Health > Policy - Click the "checkmark" icon next to the Policy being applied - Verify that the Devices and FMC servers that you wish to apply this policy to all have this policy applied (second column)'
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear icon) > Health > Policy
    - Click the "checkmark" icon next to the Policy being applied
    - Select the Devices and FMC servers that you wish to apply this policy to
    - Press "Apply"
