id: TMA-CISCO-FTD-1.1.4.1.7
title: Manage an Identity Rule
description: 'Describes the technique and ability to manage Identity Rule''s. Important task for an administrator of an organization. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.7 Manage an Identity Rule
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. If you haven''t already done so, log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity View your Identity Rule''s.'
remediation:
  type: iac_patch
  command: 1. If you haven't already done so, log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity . 3. Click Edit (edit icon) next to the policy you want to edit. If View (view button) appears instead, the configuration belongs to an ancestor domain, or you do not have permission to modify the configuration. 4. To edit an identity rule, click Edit (edit icon) and make changes as described in [Create an Identity Policy](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configur ation/guide/fpmc-config-guide-v601/Identity_Policies_and_Realms.html#task_33C92E69A3F8487BAC3CBCB849102892) . 5. To delete an identity rule, click Delete (delete icon). 6. To create a rule category, click Add Category and choose the position and the rule. 7. Click Save.
