id: TMA-CISCO-FTD-1.1.1.1
title: Restrict access to the local Admin account
description: 'The default Admin user should never be used for anything outside of initial setup. Default admin is the only account on the device on initial setup. Access to this account should be restricted. Utilizing individual accounts allow for more accurate logging. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: high
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.1.1 Restrict access to the local Admin account
audit:
  type: manual
  command: 'CIS assessment: Manual. Review the FMC Syslog logs, looking for events similar to: 2021-12-25 13:31:11 User.Info s-hof-fpmgt.mscu.com Dec 25 18:31:11 mojo_server.pl: s-hof-fpmgt: admin@127.0.0.1, Login, Login Success<000>x0a<000>x00'
remediation:
  type: iac_patch
  command: 'Set up alerts on the FMC Syslog logs, looking for events similar to: 2021-12-25 13:31:11 User.Info s-hof-fpmgt.mscu.com Dec 25 18:31:11 mojo_server.pl: s-hof-fpmgt: admin@127.0.0.1, Login, Login Success<000>x0a<000>x00'
