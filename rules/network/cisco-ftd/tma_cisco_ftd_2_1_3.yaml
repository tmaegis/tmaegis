id: TMA-CISCO-FTD-2.1.3
title: Intrusion prevention policy
description: Intrusion policies are sets of intrusion detection and prevention setting that inspect traffic for violations and in the case of inline deployments can block malicious traffic. These policies are the system's last line of defense before traffic transitions to its destination. The Firepower System delivers several base intrusion policies, which enable you to take advantage of the experience of the Cisco Talos Intelligence Group (Talos). Ensuring that the base policies give you the ability to block or mitigate malicious traffic. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 2
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 2.1.3 Intrusion prevention policy
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. Policies > Access Control > Intrusion Compare Intrusion policies. Ensure base policy is applied
remediation:
  type: iac_patch
  command: Policies > Access Control > Intrusion Create Policy using a minimum of the Base Policy.
