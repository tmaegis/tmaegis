id: TMA-CISCO-FTD-2.1.9
title: Enable secure Site to Site VPN tunnelling protocols
description: 'A secure VPN uses strong encryption protocols making it difficult for anyone to intercept data. Traffic is masked to prevent leakage. Strong encryption is recommended with the VPN tunneling. The IKEv2 policy should include AES-256 or AES-GCM-256 for encryption, a Diffie-Hellman group of 20, a SHA-384 or SHA-512 integrity hash, and a Pseudo Random Function (PRF) hash of SHA-384 or SHA-512. Secure VPN settings are important to protect privacy and data. Secure settings ensure that your online activities are encrypted and anonymized. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 2.1.9 Enable secure Site to Site VPN tunnelling protocols
audit:
  type: manual
  command: 'CIS assessment: Manual. Navigate to Devices > VPN > Site To Site. Under Add VPN, click Firepower Threat Defense Device'
remediation:
  type: iac_patch
  command: Follow Cisco's Guidance https://www.cisco.com/c/en/us/support/docs/security-vpn/ipsec-negotiation-ike-protocols/215470-site-to-site-vpn-configuration-on-ftd-ma.html#toc-hId--1324915693
