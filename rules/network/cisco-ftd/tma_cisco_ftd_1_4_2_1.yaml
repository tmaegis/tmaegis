id: TMA-CISCO-FTD-1.4.2.1
title: Configure Central Logging for FMC
description: 'Syslog allows for central logging in almost every environment in a format that almost all logging infrastructure can consume. In higher security environments, SNMPv3 Traps should be used (see Recommendations in Section 1.4.3). Central logging is critical in almost every environment. Central logging facilitates: - detecting security events - Incident response to security events - detection of operational events and problems - detection of trends in the environment, especially if a ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- logging
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.2.1 Configure Central Logging for FMC
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. First, verify a Syslog Alert Configuration: - Navigate to Policies > Actions > Alerts > Alerts - Verify that a Syslog destination is set correctly for your organization. Next, navigate to Policies > Actions > Alerts > Impact Flag Alerts - Verify that your created Syslog server is set as a target - Verify email and SNMP alert destinations as appropriate to your organization - Verify that "Syslog" is set for all Alerts - Verify that email and SNMP notifications for each as appropriate for your organization Next, navigate to Policies > ...'
remediation:
  type: iac_patch
  command: |-
    ! First, create a Syslog Alert Configuration:
    - Navigate to Policies > Actions > Alerts > Alerts
    - Create an Alert Configuration
    - Set a Host Name, IP, Port (default 514) and Severity
    - Choose "Save" Next, navigate to Policies > Actions > Alerts > Impact Flag Alerts
    - At a minimum, set your created Syslog server as a target
    - Set email and SNMP alert destinations as appropriate to your organization
    - Set destinations for all Impact Flags. Syslog should be set for all, set email and SNMP notifications for each as appropriate for your organization Next, navigate to Policies > Actions > Alerts > Discover Event Alerts
    - At a minimum, set your created Syslog server as a target
    - Set email and SNMP alert destinations as appropriate to your organization
    - Set destinations for all Events. Syslog should be set for all, set email and SNMP notifications for each as appropriate for your organization Next, navigate to Policies > Actions > Alerts > Advanced Malware Protection Alerts
    - At a minimum, set your created Syslog server as a target
    - Set email and SNMP alert destinations as appropriate to your organization
    - Set destinations for all Events. Syslog should be set for all, set email and SNMP notifications for each as appropriate for your organization
