id: TMA-CISCO-FTD-3.1.2
title: Secure the Domain Name System (DNS)
description: 'Devices communicating with each other over a network generally rely on DNS to translate hostnames to IP addresses. Certain FTD functions use DNS examples include NTP, access control policies, VPN services provided by the threat defense, ping, or traceroute. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: low
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 3.1.2 Secure the Domain Name System (DNS)
audit:
  type: manual
  command: 'CIS assessment: Manual. Devices > Platform Settings > DNS > DNS Settings (verify DNS Server Settings)'
remediation:
  type: iac_patch
  command: Devices > Platform Settings > DNS > DNS Settings > Check Enable DNS name resolution by device Configure the DNS Server Groups
