id: TMA-CISCO-FTD-2.1.5
title: Access Policy File Policy
description: 'FirePower allows detection of files by type, then imposing an action on detected files, which can consist of any or all of: Block Malware Detect Files Block Files Malware Cloud Lookup With in these categories, processing options include: Spero Analysis for MSEXE Dynamic Analysis Capacity Handling (if busy, store suspect files for later processing) Local Malware Analysis Reset Connection These values are configurable ... Files downloaded from the public internet, via email or direct download are a prime source of malware in most organizations today. For an initial infection vector, the most common by far is Office documents that have embedded macros or other active content. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 2.1.5 Access Policy File Policy
audit:
  type: manual
  command: 'CIS assessment: Manual. - Verify that your organization has a written and approved policy that has been communicated to the people affected by that policy. - Navigate to Policies > Malware and File - Edit your file policy - Verify that your file policy implements the written policy as closely as possible. - Verify that this file policy to all "Permit" rules in the Access Control Policy (Policies > Access Control)'
remediation:
  type: iac_patch
  command: |-
    ! - Verify that your organization has a written and approved policy that has been communicated to the people affected by that policy.
    - Navigate to Policies > Malware and File
    - Edit or Create your file policy
    - Verify that your file policy implements the written policy as closely as possible.
    - Apply this file policy to all "Permit" rules in the Access Control Policy (Policies > Access Control)
