id: TMA-CISCO-FTD-1.4.1.1
title: Create a Health Policy for your FMC Server
description: The Health Policy defines various settings indicating the overall health and resource utilization of the FMC Server and the Firepower Appliances. The defaults are sufficient for many environments, but should be reviewed. In many environments it might be desired to lower some thresholds. The ISE monitor is disabled by default, given that the User Agent method of correlating user accounts to IP addresses ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.1.1 Create a Health Policy for your FMC Server
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. - Navigate to System (Gear logo) > Health > Policy - Open the Health Policy in use - Verify the settings below: - ensure that the policy is set for all Firepower appliances and FMC servers Default Settings: - Policy Run Time Interval: 5 minutes (adjust downwards as needed, keeping available resources in mind) - AMP For Endpoints Status: On - AMP for Firepower Status: On - Appliance Heartbeat: On - Automatic Application Bypass Status: On - Backlog Status: On - CPU Usage: On (Warning = 80%, Critical = 90%, adjust downwards as needed) - ...'
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear logo) > Health > Policy
    - Create a New Policy or Edit the existing one
    - Set the following Values: Default Settings:
    - Policy Run Time Interval: 5 minutes (adjust downwards as needed, keeping available resources in mind)
    - AMP For Endpoints Status: On
    - AMP for Firepower Status: On
    - Appliance Heartbeat: On
    - Automatic Application Bypass Status: On
    - Backlog Status: On
    - CPU Usage: On (Warning = 80%, Critical = 90%, adjust downwards as needed)
    - Appliance Configuration Resource Utilization
    - Cluster/Failover Status: On
    - Configuration Database: On (Warning = 15GB, Critical = 50GB, adjust downwards as needed)
    - Disk Status: On
    - Disk Usage: On (Warning = 85%, Critical = 90%, 2HD Warning = 97%, 2HD Critical = 99%, adjust downward as needed)
    - FMC HA Status: On
    - Hardware Alarms: On
    - Health Monitor Process: On (Warning - 30 minutes since last event, Criticalk = 60 minutes, adjust downward as required)
    - Host Limit: On (Warning = 50 hosts, Critical = 10, adjust upwards as needed)
    - Inline Link Mismatch Alarms: On
    - Interface Status: On
    - Intrusion and File Event Rate: On (Warning Threshold = 30 events per second, Critical = 50, adjust downward as required)
    - Link State Propagation: On
    - Local Malware Analysis: On
    - Memory Usage: On (Warning Threshold = 80%, Critical = 90%, adjust downward as required)
    - Platform Faults: On (Severity is set to Critical, do not suggest changing this)
    - Power Supply: On
    - Process Status: On
    - RRD Server Process: On (Warning = 2 restarts, Critical = 3, do not recommend adjusting)
    ! ... see the benchmark for the full procedure
