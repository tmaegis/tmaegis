id: TMA-CISCO-FTD-1.4.2.5
title: Set Firepower Sensor / Devices to Synchronize time to FMC
description: Set all managed Firepower devices to acquire their time synchronization from the FMC Server. Setting a reliable, consistent time source is critical for all security operations. A reliable time sync ensures that logs from disparate sources reflect the correct sequence of events, whether investigating from the point of view of a single device (and ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- ntp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.2.5 Set Firepower Sensor / Devices to Synchronize time to FMC
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. - Navigate to Devices > Device Management - Edit each device in turn - Under the "System" section, verify that the correct time and correct timezone for your organization''s policies are shown. Also: - In this same page, under "Device" > Applied Policies, ensure that a Platform Settings Policy is applied. - Select that Platform Settings Policy - Under Time Synchronization ensure that "Set My Clock" is set to "Via NTP from Management Center"'
remediation:
  type: iac_patch
  command: Navigate to Devices > Platform Settings Edit or create a Platform Settings Policy Under Time Synchronization, Change "Set My Clock" to "Via NTP from Management Center" Save this change Select "Policy Assignments" (top right of the page) Ensure that the appropriate devices are in the "Selected Devices" column for this Policy. Repeat for all managed devices if multiple policies are required to cover all devices. Again, save your change Deploy to apply the change to all devices
