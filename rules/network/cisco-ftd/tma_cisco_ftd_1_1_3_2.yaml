id: TMA-CISCO-FTD-1.1.3.2
title: Use Dedicated User Accounts for API Access
description: 'Keeping standard admin users (who use the UI or occassionally the CLI) separate from accounts that are used for scripting and automation is a key security principal. Keeping interactive and automated access separate is key in most situations that involve automation, in particular if automation is used to enforce policy. An account that logs in interactively and makes a deliberate change is most likely a change that is ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 2
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.3.2 Use Dedicated User Accounts for API Access
audit:
  type: manual
  command: 'CIS assessment: Manual. Review the assigned users, and collect the privilege level for each. Manual Method: Automated method: https://www.cisco.com/c/en/us/td/docs/security/firepower/ftd-api/guide/ftd-rest-api/external-users-ftd-api.html Review the login date/time for each account, and verify that these are appropriate. Inactive accounts should be deactivated, and accounts operating outside of approved times or source IP ranges should be investigated.'
remediation:
  type: iac_patch
  command: '! Follow the remediation procedure in the benchmark: Use Dedicated User Accounts for API Access'
