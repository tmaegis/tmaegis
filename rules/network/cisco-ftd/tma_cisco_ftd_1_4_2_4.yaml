id: TMA-CISCO-FTD-1.4.2.4
title: Set FMC Time Synchronization to Multiple Reliable NTP Source(s)
description: Configure the FMC Server to acquire it's time from a reliable source, consistent with your organization's policies. Setting a reliable time source is critical for all security operations. A reliable time sync ensures that logs from disparate sources reflect the correct sequence of events, whether investigating from the point of view of a single device (and single log) or ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- ntp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.2.4 Set FMC Time Synchronization to Multiple Reliable NTP Source(s)
audit:
  type: manual
  command: 'Not reliably checkable from an exported configuration. - Navigate to: System (Gear Icon) > Configuration > Time - Ensure that reliable time sources are configured, matching the policy of your organization - Ensure that all "Offset" values in this list are less than 5 milliseconds'
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to: System (Gear Icon) > Configuration > Time Synchronization
    - Set "Serve Time via NTP" to "Enabled"
    - Configure "Set My Clock" to "Via NTP"
    - Ensure that multiple independent NTP sources are in the NTP Server List in this window
    - Depending on your organization, your policy may be to use internal NTP Servers, external NTP Servers or some mix of the two.
