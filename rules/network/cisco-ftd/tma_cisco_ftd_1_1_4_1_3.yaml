id: TMA-CISCO-FTD-1.1.4.1.3
title: Create an Identity Rule
description: 'These are the Rules that will be applied within your Identity Policy. Identity Rules are the actions that are performed on users in the specified realms. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.3 Create an Identity Rule
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity Verify that all documented Identity Policies are in place and that they have applicable rules.'
remediation:
  type: iac_patch
  command: |-
    1. If you haven't done so already, log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity . 3. Click Edit (edit icon) next to the identity policy to which to add the identity rule. 4. If View (view button) appears instead, the configuration belongs to an ancestor domain, or you do not have permission to modify the configuration. 5. Click Add Rule. 6. Enter a Name. 7. Specify whether the rule is Enabled. 8. To add the rule to an existing category, indicate where you want to Insert the rule. To add a new category, click Add Category. 9. Choose a rule Action from the list. 10. Click Realms & Settings. 11. Choose a realm for the identity rule from the Realms list. You must associate a realm with every identity rule. 12. The only exception to the realm requirement is implementing user control using only the ISE SGT attribute tag. In this case, you do not need to configure a realm for the ISE server. ISE SGT attribute conditions can be configured in policies with or without an associated identity policy. 13. If you're configuring captive portal, see [How to Configure the Captive Portal for User Control.](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/config uration/guide/fpmc-config-guide-v601/User_Identity_Sources.html#task_B09D4711593E4506890BB8BE25B39B31) 14. (Optional) To add conditions to the identity rule, see [Rule Condition Types](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configura tion/guide/fpmc-config-guide-v601/fpmc-config-guide-v601_chapter_01010111.html#id_16297). 15. Click Add. 16. In the policy
