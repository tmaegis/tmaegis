id: TMA-CISCO-FTD-3.2.2
title: Block older SSL and TLS versions
description: Transport Layer Protocol or TLS utilities cryptography to encrypt web traffic. Firepower Threat Defense can block older TLS and SSL version to help protect the network from compromise. It is recommended that you move to TLS 1.3 for your enterprise. By using TLS 1.3 you can enhance the security and performance of you network communications while maintaining privacy and complying with modern standards. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: high
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 3.2.2 Block older SSL and TLS versions
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. Policies > Access Control > SSL Ensure that a rule exists blocking older versions of SSL and TLS.
remediation:
  type: iac_patch
  command: Policies > Access Control > SSL 1. Click add rule 2. In the _Name_ field enter a name for the rule 3. From the _Action_ list select Block or Block with reset 4. Click _Version_ 5. Select older versions of TLS 6. Save Rule Because this is a specific rule, order it earlier in your policy than more general rules such as application-matching rules.
