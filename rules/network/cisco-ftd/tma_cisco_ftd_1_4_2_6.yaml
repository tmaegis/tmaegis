id: TMA-CISCO-FTD-1.4.2.6
title: Configure Audit Logging to be Sent to Syslog
description: Audit Logging logs the details of all configuration changes. Logging configuration changes facilitates troubleshooting of any resulting issues that might happen post change. From a security perspective, if a configuration change should result in a security exposure or event, the audit log will help define the time ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- logging
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.2.6 Configure Audit Logging to be Sent to Syslog
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. - Navigate to System (Gear Icon) > Configuration > Audit Log - Ensure that "Send Audit Log to Syslog" is enabled - Ensure that the Host field is set to the correct Syslog Host - Ensure that "Severity" is set to "INFO" (the default value)
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear Icon) > Configuration > Audit Log
    - Set "Send Audit Log to Syslog" to enabled
    - Set the "Host" field to the correct Syslog Host
    - Set the "Severity" value to "INFO" (the default value)
