id: TMA-CISCO-FTD-1.3.5
title: Regularly update the Firepower Sensors
description: The Firepower Infrastructure OS Components are updated frequently by Cisco. It is recommended that the version of the Firepower Sensors be checked monthly at a minimum, and updated if recommended. In most cases it is recommended that the Firepower Sensors be kept at the same version as the FMC Server. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.3.5 Regularly update the Firepower Sensors
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. - Navigate to Devices > Device Management - Verify that the version of each sensor is at the desired level, and that all sensors are at a consistent version - Unless a different version is in use on one or more sensors for a documented reason (for instance, a new version is being tested or the update process is in progress but not complete), it is recommended that all sensors run the same version, and that this version matches the FMC Server version
remediation:
  type: iac_patch
  command: |-
    ! Before updating, it is recommended that the release notes for the target version are reviewed to assess any potential new issues that may be introduced, or any new functions or behavior changes that need to be accounted for. The release notes will also often have update time estimates, which can help in appropriately scheduling maintenance windows. It is also recommended that a formal testing procedure be written for Firepower, and that this procedure is executed after each update to ensure full functionality post update. To update a Firepower sensor:
    - Navigate to System (Gear Icon) > Updates > Product Updates
    - If needed, upload the required Sensor Update to the update list
    - Choose "Deploy" on the required update
    - Select the Sensor (or Sensors if multiple devices are being updated at once) that is/are the target of the update
    - Choose "Launch Readiness Check". Note that this can take an extended period of time.
    - If this completes successfully, Choose "Install". Note that this can take an extended period of time, and will frequently take the Firepower Sensor(s) out of service and/or reboot the sensor.
    - Updating Firepower Sensors will almost always interrupt service, which means that it is recommended that this only be done in a scheduled maintenance window.
    - If redundant sensors are deployed, usually only one sensor in a pair will be updated at once to eliminate the service outage aspect of the update.
    ! ... see the benchmark for the full procedure
