id: TMA-CISCO-FTD-1.3.1
title: Scheduled Rule Updates
description: The Snort Vulnerability database should be automatically downloaded and deployed at a reasonable cadence, preferably daily. If the IPS Rule database is not updated frequently, then newer attacks may not be detected, and improved detections of existing attacks will not be used. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.3.1 Scheduled Rule Updates
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. - Navigate to System (Gear Icon) > Updates - Choose "Rule Updates" - Under "Recurring Rule Update Imports", verify that "Enable Recurring Rule Update Imports from the Support Site" is enabled - Verify that the update frequency is set to "Daily", with a scheduled time that complies with the policies of the organization. - Ensure that "Policy Deploy" is selected, unless there is an equivalent manual test / deploy procedure in place.
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear Icon) > Updates
    - Choose "Rule Updates"
    - Under "Recurring Rule Update Imports", choose "Enable Recurring Rule Update Imports from the Support Site"
    - Choose an update frequency and schedule. Daily updates are recommended, the update time is should be schedule for an off-peak time window to minimize the potential affect on traffic that IPS rule updates can have. (note that this impact is usually considered to be of low risk)
    - Choose "Policy Deploy", unless there is an equivalent manual test / deploy procedure in place.
