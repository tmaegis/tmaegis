id: TMA-CISCO-FTD-1.1.4.1.5
title: Compare Realms
description: 'Utilize this technique to find differences between your Realms. You must be an Admin, Access Admin, Network Admin, or Security Approver to perform this task. Important task for an Administrator. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.5 Compare Realms
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Log in to the Firepower Management Center. 2. Click System > Integration. 3. Click Realms. 4. Click System > Integration. 5. Click Realms. 6. Click Compare Realms.'
remediation:
  type: iac_patch
  command: 1. Log in to the Firepower Management Center. 2. Click System > Integration. 3. Click Realms. 4. Click System > Integration. 5. Click Realms. 6. Click Compare Realms. 7. Choose Compare Realm from the Compare Against list. 8. Choose the realms you want to compare from the Realm A and Realm B lists. 9. Click OK. 10. To navigate individually through changes, click Previous or Next above the title bar. 11. (Optional.) Click Comparison Report to generate the realm comparison report. 12. (Optional.) Click New Comparison to generate a new realm comparison view.
