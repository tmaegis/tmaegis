id: TMA-CISCO-FTD-1.1.4.1.6
title: Manage an Identity Policy
description: 'In a multidomain deployment, the system displays policies created in the current domain, which you can edit. It also displays policies created in ancestor domains, which you cannot edit. To view and edit policies created in a lower domain, switch to that domain. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.6 Manage an Identity Policy
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. If you haven''t done so already, log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity'
remediation:
  type: iac_patch
  command: 1. If you haven't done so already, log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity . 3. To delete a policy, click Delete (delete icon). If the controls are dimmed, the configuration belongs to an ancestor domain, or you do not have permission to modify the configuration. 4. To edit a policy, click Edit (edit icon) next to the policy and make changes as described in [Create an Identity Policy](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configur ation/guide/fpmc-config-guide-v601/Identity_Policies_and_Realms.html#task_33C92E69A3F8487BAC3CBCB849102892) . If View (view button) appears instead, the configuration belongs to an ancestor domain, or you do not have permission to modify the configuration. 5. To copy a policy, click Copy (copy icon). 6. To generate a report for the policy, click Report (Report icon) as described in [Generating Current Policy Reports](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configu
    ration/guide/fpmc-config-guide-v601/Policy_Management.html#task_CCED983433824793AF09203FDAD1AF53). 7. To compare policies, see [Comparing Policies](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/config uration/guide/fpmc-config-guide-v601/Policy_Management.html#task_ABA1FE48DBBB44BC9FF40243FCC58BF6).
