id: TMA-CISCO-FTD-1.4.3.1
title: If SNMP is configured, ensure that SNMP v3 only is used to Manage your FMC Server
description: 'Ensure that if SNMP is configured, that only SNMPv3 is enabled for FMC. SNMP is commonly used to manage an alert on common device metrics such as CPU Utilization, Link Utilization and Temperature. Older versions of SNMP (1,2,2c) were all unencrypted, and often used default "string" values to authenticate, allowing disclosure of ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- snmp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.3.1 If SNMP is configured, ensure that SNMP v3 only is used to Manage your FMC Server
audit:
  type: manual
  command: 'CIS assessment: Manual. - Navigate to System (Gear Icon) / SNMP - Ensure that the SNMP Version is set to "Version 3" - Ensure that SNMPv3 Users exist such that: - if applicable, the "Encryption Password Type" is set to "Encrypted" - if applicable, the "Auth Algorithm Type" is set to SHA or SHA256 - if applicable, the "Encryption Type" is set to AES256'
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear Icon) / SNMP
    - Set the SNMP Version to "Version 3"
    - Choose "Add User"
    - Configure SNMPv3 Users such that:
    - If applicable, set the "Encryption Password Type" is set to "Encrypted"
    - If applicable, set the "Auth Algorithm Type" to SHA or SHA256
    - If applicable, set the "Encryption Type" to AES256
    - Save your changes
