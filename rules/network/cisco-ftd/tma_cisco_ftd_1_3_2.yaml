id: TMA-CISCO-FTD-1.3.2
title: Scheduled Geolocation Updates
description: The Geo Location database should be automatically downloaded and deployed at a reasonable cadence, preferably daily. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- ntp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.3.2 Scheduled Geolocation Updates
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. - Navigate to System (Gear Icon) > Updates > Gelolocation Updates - Under "recurring Geolocation Updates", ensure that "Enable Recurring Weekly Updates from the Support Site" is selected - Ensure that the scheduled day and time matches any policies your organization may have in place. - verify that the "Geolocation Update Version" (at the top of the screen) matches the expected recent value. - This version can also be found by Navigating to Overview > Dashboard > Status
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear Icon) > Updates
    - Choose "Geolocation Updates"
    - Under "Recurring Rule Update Imports", enable "Enable Recurring Weekly Updates from the Support Site"
    - Set the scheduled day and time to match any policies your organization may have in place.
