id: TMA-CISCO-FTD-1.3.4
title: Regularly update the FMC Server Version
description: 'The Firepower Infrastructure OS Components are updated frequently by Cisco. It is recommended that the version of the FMC Server be checked monthly at a minimum, and updated if recommended. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.3.4 Regularly update the FMC Server Version
audit:
  type: manual
  command: 'CIS assessment: Manual. Navigate to Overview > Dashboard > Status Verify that the software version is at the desired level'
remediation:
  type: iac_patch
  command: |-
    ! Before updating, it is recommended that the release notes for the target version are reviewed to assess any potential new issues that may be introduced, or any new functions or behavior changes that need to be accounted for. The release notes will also often have update time estimates, which can help in appropriately scheduling maintenance windows. It is also recommended that a formal testing procedure be written for Firepower, and that this procedure is executed after each update to ensure full functionality post update. To update FMC:
    - Navigate to System (Gear Icon) > Updates > Product Updates
    - If needed, upload the required FMC Update to the update list
    - Choose "Deploy" on the required update
    - Select the FMC Server that is the target of the update
    - Choose "Launch Readiness Check". Note that this can take an extended period of time.
    - If this completes successfully, Choose "Install". Note that this can take an extended period of time, and will frequently take the FMC Server out of service and/or reboot the server. It is recommended that this only be done in a scheduled maintenance window.
    - Execute your testing procedure to ensure that there are no functional changes that will affect the people or clients that use systems that are protected by your FMC installation.
