id: TMA-CISCO-FTD-1.1.3.1
title: Set Appropriate Roles for all Administrative Users
description: 'The Firepower Management platform has the ability to assign roles (RBAC) to each administrative user. In smaller environments it is common to see all administrative users with full read/write access, but as organizations grow, it is recommended that people who only need reporting or other read-only access be assigned to more restrictive roles. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: high
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.3.1 Set Appropriate Roles for all Administrative Users
audit:
  type: manual
  command: 'CIS assessment: Manual. Navigate to System / Users Verify that all user accounts have appropriate Roles assigned (in the Roles column), matching their job requirements.'
remediation:
  type: iac_patch
  command: |-
    ! Navigate to System / Users Edit the target user. Select any of the following Roles either singly or in combination, as required:
    - Administrator (Externally Set)
    - External Database User (Read Only)
    - Security Analyst
    - Security Analyst (Read Only)
    - Security Approver
    - Intrusion Admin
    - Access Admin
    - Network Admin
    - Maintenance User
    - Discovery Admin
    - Threat Intelligence Director (TID) User
