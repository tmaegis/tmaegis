id: TMA-CISCO-FTD-1.1.4.1.2
title: Create an Identity Policy
description: 'An identity policy associates traffic on your network with an authoritative identity source and a realm. After configuring one or more identity policies, you can associate one with an access control policy and deploy the access control policy to a managed device. Identity policies contain identity rules. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.2 Create an Identity Policy
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity Verify that all documented Identity Policies are in place.'
remediation:
  type: iac_patch
  command: '1. Log in to the Firepower Management Center. 2. Click Policies > Access Control > Identity and click New Policy. 3. Enter a Name and, optionally, a Description. 4. Click Save. 5. To add a rule to the policy, click Add Rule as described in [Create an Identity Rule](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configurat ion/guide/fpmc-config-guide-v601/Identity_Policies_and_Realms.html#task_A2FCBE057F6A42D598D24C5280D0C238) 6. To create a rule category, click Add Category. 7. To configure captive portal active authentication, click Active Authentication as described in [Configure the Captive Portal Part 1: Create an Identity Policy.](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configu ration/guide/fpmc-config-guide-v601/User_Identity_Sources.html#id_61520) 8. Click Save to save the identity policy.'
