id: TMA-CISCO-FTD-1.1.4.1.1
title: Create a Realm
description: 'A realm consists of one or more LDAP or Microsoft Active Directory servers that share the same directory credentials. You must configure a realm to perform user and user group queries, user control, or to configure an authoritative identity source. Realms are connections between the Firepower Management Center and the user accounts on the servers you monitor. They specify the connection settings and authentication filter settings for the server. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- aaa
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.4.1.1 Create a Realm
audit:
  type: manual
  command: 'CIS assessment: Manual. 1. Log in to the Firepower Management Center. 2. Click System > Integration. 3. Click Realms. Verify that documented Realms exist.'
remediation:
  type: iac_patch
  command: |-
    ! 1. To create a new realm, click Add Realm. 2. To perform other tasks (such as enable, disable, or delete a realm), see Manage a Realm. 3. Enter the following realm information:
    - Name: A unique name for the realm. The system supports alphanumeric and special characters.
    - Description: (Optional.) Enter a description of the realm.
    - Type: The type of realm, AD for Microsoft Active Directory or LDAP for other supported LDAP repositories.
    - AD Primary Domain: For Microsoft Active Directory realms only. Domain for the Active Directory server where users should be authenticated.
    - Directory Username and Directory Password: For Microsoft Active Directory realms only. Domain for the Active Directory server where users should be authenticated.
    - Base DN (Distinguished Name): The directory tree on the server where the Firepower Management Center should begin searching for user data.
    - Group DN: The directory tree on the server where the Firepower Management Center should search for users with the group attribute
    ! ... see the benchmark for the full procedure
