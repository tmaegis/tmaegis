id: TMA-CISCO-FTD-2.1.7
title: Access Policy - URL Filtering
description: 'Firepower allows restriction of sites by category and reputation. For instance, allowing "hacking" sites of good reputation only would likely permit information security blogs and tools, but block sites that post pirated software or key generation tools. Site categories can be blocked for many reasons. In most organizations, these can be divided into "Human Resources" and "IT" reasons. The first category will include things like sites that by their nature are outright illegal to access in the workplace, as ... CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 2.1.7 Access Policy - URL Filtering
audit:
  type: manual
  command: 'CIS assessment: Manual. - Verify that a written policy is in place to restrict access to internet sites by category. - Navigate to Policies > Access Control. - Edit the Access Control Policy - Verify that one or more "block by category" rules exist, and ensure that they provide complete coverage (and no more) when compared to the written policy.'
remediation:
  type: iac_patch
  command: |-
    ! - Verify that a written policy is in place to restrict access to internet sites by category.
    - Navigate to Policies > Access Control.
    - Edit the Access Control Policy
    - Create one or more "block by category" rules, with blocked categories in compliance with the written policy.
