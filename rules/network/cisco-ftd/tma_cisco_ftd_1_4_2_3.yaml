id: TMA-CISCO-FTD-1.4.2.3
title: Monitor for Clock Drift within the Firepower Infrastructure
description: This setting generates an alert if any of the various times in the Firepower infrastructure do not agree with each other. Setting a reliable time source is critical for all security operations. A reliable time sync ensures that logs from disparate sources reflect the correct sequence of events, whether investigating from the point of view of a single device (and single log) or ... Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 1
severity: medium
tags:
- cisco-ftd
- network
- ntp
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.4.2.3 Monitor for Clock Drift within the Firepower Infrastructure
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. - Navigate to System (Gear Icon) > Health > Policy - Create a Policy or Edit the existing Policy - Choose "Time Synchronization Status" - Ensure that this setting is set to "Enabled" - Under "Deploy > Deployment History, ensure that all managed devices have had a recent deploy that includes this setting
remediation:
  type: iac_patch
  command: |-
    ! - Navigate to System (Gear Icon) > Health > Policy
    - Create a Policy or Edit the existing Policy
    - Choose "Time Synchronization Status"
    - Choose "Enabled"
    - Save the Policy change, this applies the change to the FMC server
    - Deploy the policy to Deploy this change to all managed devices.
