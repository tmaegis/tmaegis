id: TMA-CISCO-FTD-2.1.6
title: Decrypt traffic
description: SSL decryption policies turn encrypted traffic into plaintext traffic. This allows the FTD device to apply URL filtering, intrusion and malware control as well as services that require deep packet inspection. If your policies allow the traffic it is then re-encrypted before it leaves the device. Encrypted traffic can hide malicious content or activities. By decrypting the traffic, the firewall can inspect it for malware or other threats. Decryption allows the firewall to analyze web pages, applications and files. Not reliably checkable from an exported configuration. Reported as SKIP with review instructions.
target: cisco-ftd
level: 2
severity: medium
tags:
- cisco-ftd
- network
- hardening
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 2.1.6 Decrypt traffic
audit:
  type: manual
  command: Not reliably checkable from an exported configuration. Verify ssl decryption is enabled. Policy > SSL Decryption > SSL Decryption. After you enable SSL decryption Policy > SSL Decryption > configure default action for policy.
remediation:
  type: iac_patch
  command: Policy > SSL Decryption > enable SSL Decryption. After you enable SSL decryption Policy > SSL Decryption > configure default action for policy.
