id: TMA-CISCO-FTD-1.1.3.3
title: Restrict access to the FMC CLI
description: 'By default, there is one admin user with full administrator rights to the FTD CLI command line. This admin user can create multiple accounts and grant them either basic, which is read-only, or config, which is read-write, access levels. Appropriate access levels should be administered depending on the user''s role. Access to the CLI should be restricted to lower the overall attack surface. CIS assessment: Manual. Reported as SKIP with review instructions.'
target: cisco-ftd
level: 1
severity: high
tags:
- cisco-ftd
- network
- management-plane
reference: CIS Cisco Firepower Threat Defense Benchmark v1.0.0 - 1.1.3.3 Restrict access to the FMC CLI
audit:
  type: manual
  command: 'CIS assessment: Manual. Users with config level access can use the CLI command expert to access the Linux shell. This is available to the admin account, local users, and external users with config level access.'
remediation:
  type: iac_patch
  command: To block access to the Linux shell, administrators can use the system lockdown-sensor command. Once this command is used, any non-administrator user who logs in will only have access to the FTD CLI command.
