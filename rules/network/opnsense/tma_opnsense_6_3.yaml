id: TMA-OPNSENSE-6.3
title: Ensure Remote Syslog is Configured
description: OPNsense must forward logs to a remote log server or SIEM using syslog. Local-only logs can be erased during compromise and are not sufficient for enterprise IR.
target: opnsense
level: 1
severity: medium
tags:
- logging
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 6.3 Ensure Remote Syslog is Configured
audit:
  type: manual
  command: 1. Navigate to System → Settings → Logging / Targets (or Syslog depending on build) 2. Confirm at least one remote syslog target exists. 3. Confirm logs are received by the SIEM.
remediation:
  type: iac_patch
  command: 1. Navigate to System → Settings → Logging / Targets (or Syslog depending on build) 2. Configure syslog target(s) to an enterprise log platform.
