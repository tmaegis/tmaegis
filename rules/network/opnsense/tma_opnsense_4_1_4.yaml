id: TMA-OPNSENSE-4.1.4
title: Ensure Every Rule Has a Description Using a Standard Format
description: 'Every firewall rule must include a description using the format: <ZONE> → <DEST> : <SERVICE> (Purpose) Descriptions are required for auditability and safe change control.'
target: opnsense
level: 1
severity: medium
tags:
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 4.1.4 Ensure Every Rule Has a Description Using a Standard Format
audit:
  type: manual
  command: 1. Navigate to Firewall → Rules 2. Verify no rule has an empty description field. 3. Verify descriptions are meaningful and standardized.
remediation:
  type: iac_patch
  command: 1. Navigate to Firewall → Rules 2. Verify no rule has an empty description field. 3. Verify descriptions are meaningful and standardized. 4. Update any rules that do not comply 5. Save each rule
