id: TMA-OPNSENSE-2.2
title: Ensure LDAP or RADIUS server configured
description: Configured the LDAP Servers or Radius server for central authentication. Authentication, authorization and accounting (AAA) scheme provide an authoritative source for managing and monitoring access for devices.
target: opnsense
level: 1
severity: high
tags:
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 2.2 Ensure LDAP or RADIUS server configured
audit:
  type: config_regex
  pattern: <authserver>(?:[^<]|<[^/<]|</[^a<]|</a[^u<]|</au[^t<]|</aut[^h<]|</auth[^s<]|</auths[^e<]|</authse[^r<]|</authser[^v<]|</authserv[^e<]|</authserve[^r<]|</authserver[^><])*?<type>(?:ldap|radius)</type>
remediation:
  type: iac_patch
  command: 'In the GUI: - Navigate to System > Access > Servers - Click the Orange Plus sign in the top right - Enter the details needed for your LDAP server - Click ''Save'' at the bottom'
