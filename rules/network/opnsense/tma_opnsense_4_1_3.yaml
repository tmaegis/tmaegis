id: TMA-OPNSENSE-4.1.3
title: Ensure “Any → Any” Rules are Prohibited
description: You must not deploy any rule that permits “any source → any destination → any port.” This defeats segmentation and enables unrestricted lateral movement.
target: opnsense
level: 1
severity: high
tags:
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 4.1.3 Ensure “Any → Any” Rules are Prohibited
audit:
  type: manual
  command: '1. Navigate to Firewall → Rules → [All interfaces] 2. Identify rules where: - Source = any - Destination = any - Destination port = any'
remediation:
  type: iac_patch
  command: '1. Navigate to Firewall → Rules → [All interfaces] 2. Identify rules where: - Source = any - Destination = any - Destination port = any 3. Remove the rule. - Replace with explicit rules using aliases.'
