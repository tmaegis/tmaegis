id: TMA-OPNSENSE-1.1
title: Ensure SSH warning banner is configured
description: Before authentication is allowed, a file containing its contents must be provided to the remote user, as specified by the Banner argument. Banners are used to inform users who are connected of the specific site's connection rules. The prosecution of computer system intruders may be aided by the display of a warning message prior to the normal user login.
target: opnsense
level: 1
severity: low
tags:
- opnsense
- ssh
reference: CIS OPNsense Benchmark v1.0.0 - 1.1 Ensure SSH warning banner is configured
audit:
  type: manual
  command: 'In the CLI: 1. Run the following command and verify that output should contain ''Banner'' parameter: cat /etc/ssh/my_banner Ensure a file exists in the /etc/ssh/ directory and that it contains the information you want in your ssh banner. 2. Run the following command and verify that a file exists, and that it references the above referenced "my_banner" file via a line such as: Banner /etc/ssh/my_banner'
remediation:
  type: iac_patch
  command: 'In the CLI: 1. Create a banner file in the /etc/ssh/ directory via the following command vi /etc/ssh/my_banner 2. To ensure your banner remains, you should utilize OPNsense''s Targeted Overlays system by creating a file in the following directory: vi /usr/local/etc/ssh/sshd_config.d/99-custom.conf 3. Then insert the following text in the 99-custom.conf file to reference your ssh banner file: Banner /etc/ssh/my_banner Save and exit the file 4. Restart OPNsense via the gui.'
