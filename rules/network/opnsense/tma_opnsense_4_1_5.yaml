id: TMA-OPNSENSE-4.1.5
title: Ensure Aliases are Used for Hosts, Networks, and Port Groups
description: 'You must use aliases for: - Any host referenced more than once - Any port group referenced more than once - All VLANs / security zones Aliases reduce errors and simplify audits.'
target: opnsense
level: 1
severity: medium
tags:
- network
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 4.1.5 Ensure Aliases are Used for Hosts, Networks, and Port Groups
audit:
  type: manual
  command: '1. Navigate to Firewall → Aliases 2. Confirm: - Networks are defined as aliases - Common port groups exist (DNS, NTP, Web, AD, etc.) 3. Confirm rules reference aliases instead of raw IPs repeatedly.'
remediation:
  type: iac_patch
  command: '1. Navigate to Firewall → Aliases 2. Confirm: - Networks are defined as aliases - Common port groups exist (DNS, NTP, Web, AD, etc.) 3. Confirm rules reference aliases instead of raw IPs repeatedly. 4. Create aliases and update rules accordingly.'
