id: TMA-OPNSENSE-4.1.6
title: Ensure Rules are Implemented on the Ingress Interface
description: You must define rules on the interface where traffic enters the firewall. OPNsense evaluates rules based on ingress interface. Misplaced rules cause bypass or failure.
target: opnsense
level: 1
severity: medium
tags:
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 4.1.6 Ensure Rules are Implemented on the Ingress Interface
audit:
  type: manual
  command: 1. Navigate to Firewall → Rules 2. Validate each rule exists on the correct ingress interface.
remediation:
  type: iac_patch
  command: 1. Navigate to Firewall → Rules 2. Validate each rule exists on the correct ingress interface. 3. Move rules to the correct interface, if they are on the wrong one.
