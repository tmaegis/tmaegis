id: TMA-OPNSENSE-6.1
title: Ensure Logging is Enabled for Inter-Zone Deny Rules
description: All deny rules that enforce segmentation between VLANs/zones must have logging enabled. Inter-zone denies are high-signal and reveal lateral movement attempts.
target: opnsense
level: 1
severity: medium
tags:
- logging
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 6.1 Ensure Logging is Enabled for Inter-Zone Deny Rules
audit:
  type: config_regex
  pattern: <syslog>(?:[^<]|<[^/<]|</[^s<]|</s[^y<]|</sy[^s<]|</sys[^l<]|</sysl[^o<]|</syslo[^g<]|</syslog[^><])*?(?:<enable(?:\s*/>|>[^<]*</enable>)(?:[^<]|<[^/<]|</[^s<]|</s[^y<]|</sy[^s<]|</sys[^l<]|</sysl[^o<]|</syslo[^g<]|</syslog[^><])*?<remoteserver>[^<\s][^<]*</remoteserver>|<remoteserver>[^<\s][^<]*</remoteserver>(?:[^<]|<[^/<]|</[^s<]|</s[^y<]|</sy[^s<]|</sys[^l<]|</sysl[^o<]|</syslo[^g<]|</syslog[^><])*?<enable(?:\s*/>|>[^<]*</enable>))
remediation:
  type: iac_patch
  command: 1. Navigate to Firewall → Rules 2. Identify deny rules between VLANs 3. Enable logging for segmentation deny rules.
