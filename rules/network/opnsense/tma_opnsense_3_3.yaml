id: TMA-OPNSENSE-3.3
title: Ensure default password of admin is changed
description: Ensure the default password is changed for the root user. Using default passwords for the 'root' account could cause a compromise to the system.
target: opnsense
level: 1
severity: medium
tags:
- auth
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 3.3 Ensure default password of admin is changed
audit:
  type: config_regex
  pattern: <sshguard_blocktime>(?:[3-9]\d\d|\d{4,})</sshguard_blocktime>
remediation:
  type: iac_patch
  command: 'In the GUI: - Navigate to System > Access > Users - Click the Pencil Icon under ''Commands'' - Change the password of the default ''root'' user account. - Click ''Save'' at the bottom of the page.'
