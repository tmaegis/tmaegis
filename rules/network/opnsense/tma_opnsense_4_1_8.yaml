id: TMA-OPNSENSE-4.1.8
title: Ensure Floating Rules are Restricted to Cross-Zone Policy Use Cases
description: 'Floating rules must be used only when: - Policy must apply across multiple interfaces - “Quick” evaluation is required Floating rules can override interface policy and cause unexpected behavior.'
target: opnsense
level: 1
severity: medium
tags:
- opnsense
reference: CIS OPNsense Benchmark v1.0.0 - 4.1.8 Ensure Floating Rules are Restricted to Cross-Zone Policy Use Cases
audit:
  type: manual
  command: '1. Navigate to Firewall → Rules → Floating 2. Validate each floating rule has: - documented justification - limited scope'
remediation:
  type: iac_patch
  command: '1. Navigate to Firewall → Rules → Floating 2. Validate each floating rule has: - documented justification - limited scope 3. Move rules to interface rulesets when possible.'
