id: TMA-MACOS-2.1.1.5
title: Audit Freeform Sync to iCloud
description: Starting with macOS 13.1 Apple has made FreeForm, a collaboration tool, available for macOS, iOS and iPadOS. This application allows for extensive whiteboard creation and sharing using iCloud. Organizations may want to audit the use of Freeform iCloud sharing of internally created boards.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.1.1.5 Audit Freeform Sync to iCloud
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Disallow iCloud Freeform Sync set to your organization''s requirement. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.applicationaccess, key allowCloudFreeform The output should match your organization''s requirement'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.applicationaccess allowCloudFreeform = <<true/false>/>.'
