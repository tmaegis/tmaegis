id: TMA-MACOS-5.2.5
title: Ensure Complex Password Must Contain Special Character Is Configured
description: 'Complex passwords contain one character from each of the following classes: English uppercase letters, English lowercase letters, Westernized Arabic numerals, and non- alphanumeric characters. Ensure that a special character is part of the password policy on the computer.'
target: macos
level: 2
severity: high
tags:
- macos
- system-access
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 5.2.5 Ensure Complex Password Must Contain Special Character Is Configured
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Min Complex Length set to ≥ 1. Terminal: pref1=$(sudo /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep -e "policyAttributePassword matches ''(.*[^a-zA-Z0-9].*){1,}''" | cut -b 12-67) && pref2=$(sudo /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep -A1 minimumSymbols | ...'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_BK="/Library/Application Support/TMAegis/backup"; mkdir -p "$TMA_BK"; TMA_TS=$(/bin/date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && /bin/cp -p "$1" "$TMA_BK/$(/usr/bin/basename "$1").$TMA_TS.bak"; return 0; }
    out=$(/usr/bin/pwpolicy -getaccountpolicies 2>/dev/null)
    if printf '%s\n' "$out" | /usr/bin/grep -q policyCategory; then
      echo "TMAegis: account policies already present; not overwriting (merge manually)" >&2; exit 1
    fi
    t=$(/usr/bin/mktemp /tmp/tma-pwpolicy.XXXXXX) || exit 1
    /bin/cat > "$t" <<'EOPLIST'
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
    <key>policyCategoryAuthentication</key>
    <array><dict>
    <key>policyContent</key>
    <string>(policyAttributeFailedAuthentications &lt; policyAttributeMaximumFailedAuthentications) OR (policyAttributeCurrentTime &gt; policyAttributeLastFailedAuthenticationTime + autoEnableInSeconds)</string>
    <key>policyIdentifier</key><string>tmaegis-lockout</string>
    <key>policyParameters</key>
    <dict><key>autoEnableInSeconds</key><integer>900</integer>
    <key>policyAttributeMaximumFailedAuthentications</key><integer>5</integer></dict>
    </dict></array>
    <key>policyCategoryPasswordChange</key>
    <array><dict>
    <key>policyContent</key>
    <string>policyAttributeCurrentTime &gt; policyAttributeLastPasswordChangeTime + (policyAttributeExpiresEveryNDays * 24 * 60 * 60)</string>
    <key>policyIdentifier</key><string>tmaegis-expiry</string>
    <key>policyParameters</key>
    <dict><key>policyAttributeExpiresEveryNDays</key><integer>365</integer></dict>
    </dict></array>
    <key>policyCategoryPasswordContent</key>
    <array>
    <dict>
    <key>policyContent</key>
    <string>policyAttributePassword matches '.{15,}'</string>
    <key>policyIdentifier</key><string>tmaegis-minlength</string>
    <key>policyParameters</key>
    <dict><key>minimumLength</key><integer>15</integer></dict>
    </dict>
    <dict>
    <key>policyContent</key>
    <string>policyAttributePassword in policyAttributePasswordHistory = 0</string>
    <key>policyIdentifier</key><string>tmaegis-history</string>
    <key>policyParameters</key>
    <dict><key>policyAttributePasswordHistoryDepth</key><integer>24</integer></dict>
    </dict>
    </array>
    </dict>
    </plist>
    EOPLIST
    /usr/bin/pwpolicy -getaccountpolicies > "$TMA_BK/pwpolicy.$TMA_TS.bak" 2>/dev/null
    /usr/bin/pwpolicy -setaccountpolicies "$t"; rc=$?
    /bin/rm -f "$t"; exit $rc
  guidance: "Profile (preferred): com.apple.mobiledevice.passwordpolicy minComplexChars = <integer><value≥1></integer>. Terminal: sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy -setaccountpolicies \"requiresSymbol=<value≥1>\" ; sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy \"requiresSymbol=1\"."
