id: TMA-MACOS-2.4.1
title: Audit Menu Bar and Control Center Icons
description: The Menu Bar is the horizontal strip that runs across the very top of your Mac's screen. The Control Center is a panel that groups the most frequently used system settings into one convenient location, similar to Control Center on an iPhone or iPad.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.4.1 Audit Menu Bar and Control Center Icons
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > Menu Bar > Verify that all items listed in the Allow in the menu bar section are allowed by your organization > Control Center icon in the menu bar > Verify that the Control Center options meet your organization''s requirements.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Menu Bar > Remove any items in Allow in the menu bar section are not allowed by your organization. Control Center icon in the menu bar > Set the Control Center options to meet your organization''s requirements.'
