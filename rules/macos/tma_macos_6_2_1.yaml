id: TMA-MACOS-6.2.1
title: Ensure Protect Mail Activity in Mail Is Enabled
description: Apple provides privacy protection that should be enabled for the mail app on macOS to reduce information collection from a user that receives email.
target: macos
level: 2
severity: medium
tags:
- macos
- applications
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 6.2.1 Ensure Protect Mail Activity in Mail Is Enabled
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: Mail > Mail in the menu bar > Settings > Privacy > Verify that Protect Mail Activity is enabled.'
remediation:
  type: iac_patch
  command: 'GUI: Mail > Mail in the menu bar > Settings > Privacy > Set Protect Mail Activity to enabled.'
