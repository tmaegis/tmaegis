id: TMA-MACOS-2.3.2.2
title: Ensure the Time Service Is Enabled
description: In macOS 10.14, Apple replace ntp with timed for time services, and is used to ensure correct time is kept. Correct date and time settings are required for authentication protocols, file creation, modification dates and log entries.
target: macos
level: 1
severity: medium
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.3.2.2 Ensure the Time Service Is Enabled
os_family:
- macos-26
audit:
  type: command
  command: |-
    out=$(/bin/launchctl list 2>/dev/null) || exit 1
    printf '%s\n' "$out" | /usr/bin/grep -c 'com.apple.timed' || true
  expected_output: '1'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /bin/launchctl enable system/com.apple.timed 2>/dev/null
    /bin/launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.timed.plist 2>/dev/null
    /bin/launchctl kickstart system/com.apple.timed 2>/dev/null; true
  guidance: "If the timed service has been disabled, assume that the operating system has been compromised. Back up any files, and do a clean install to a known good Operating System."
