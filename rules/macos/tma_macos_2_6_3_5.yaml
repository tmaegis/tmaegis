id: TMA-MACOS-2.6.3.5
title: Ensure Share iCloud Analytics Is Disabled
description: Share iCloud Analytics shares analytics of usage and data from your iCloud account to Apple to help improve its products and services (including Siri and other intelligent features). Turn off all Analytics and Improvements sharing. This setting will not appear if the user is not signed into a personal Apple Account.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.6.3.5 Ensure Share iCloud Analytics Is Disabled
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > Privacy & Security > Analytics & Improvements > Verify that Share iCloud Analytics is disabled.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Privacy & Security > Analytics & Improvements > Verify that Share iCloud Analytics is disabled.'
