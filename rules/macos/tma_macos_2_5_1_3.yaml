id: TMA-MACOS-2.5.1.3
title: Ensure Mail Summarization Is Disabled
description: Apple Intelligence's Mail summarization feature uses AI to quickly condense long emails or entire email threads into a few key sentences or bullet points.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.5.1.3 Ensure Mail Summarization Is Disabled
os_family:
- macos-26
audit:
  type: command
  command: |-
    /usr/bin/osascript -l JavaScript <<'EOS'
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess').objectForKey('allowMailSummary').js
    EOS
  expected_output: 'false'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/defaults write "/Library/Preferences/com.apple.applicationaccess" 'allowMailSummary' -bool false
    /usr/bin/killall cfprefsd 2>/dev/null; true
  guidance: "Profile (preferred): com.apple.applicationaccess allowMailSummary = <false/>."
