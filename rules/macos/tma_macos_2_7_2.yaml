id: TMA-MACOS-2.7.2
title: Audit iPhone Mirroring
description: iPhone Mirroring is a new feature offered in iOS 18 and macOS 15.0 Sequoia. It allows a macOS device to remotely access an iOS device connected to the same Apple Account. If a user has different Apple Accounts signed into iOS and macOS (ex. a managed Apple Account on macOS and a personal Apple Account on iOS), the feature is not available.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.7.2 Audit iPhone Mirroring
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Allow iPhone Mirroring set to True or False based on your organization''s requirements. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple. applicationaccess, key allowiPhoneMirroring The output will be either true, allow iPhone mirroring, or false, disable iPhone mirroring.'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.applicationaccess allowiPhoneMirroring = either <true/> or <false/> depending on your. GUI: System Settings > Desktop & Dock > Under the Widgets sub-header, verify iPhone is configured to your organization''s requirements.'
