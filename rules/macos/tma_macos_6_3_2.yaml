id: TMA-MACOS-6.3.2
title: Audit History and Remove History Items
description: Organizational management of user web browsing history is a challenge affected by multiple facets. Organizations should decide whether to manage browser history and how much history should be maintained.
target: macos
level: 2
severity: low
tags:
- macos
- applications
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 6.3.2 Audit History and Remove History Items
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has HistoryAgeInDaysLimit set to your organization''s requirements. Terminal: sudo /usr/sbin/system_profiler SPConfigurationProfileDataType | /usr/bin/grep HistoryAgeInDaysLimit | /usr/bin/tr -d '' '' The output will be HistoryAgeInDaysLimit = followed by your organizations requirements.'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.Safari HistoryAgeInDaysLimit = <integer><1,7,14,31,365,36500></integer>.'
