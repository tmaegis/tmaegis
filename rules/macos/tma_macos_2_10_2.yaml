id: TMA-MACOS-2.10.2
title: Ensure Power Nap Is Disabled for Intel Macs
description: 'Power Nap allows the system to stay in low power mode, especially while on battery power, and periodically connect to previously known networks with stored credentials for user applications to phone home and get updates. This capability requires FileVault to remain unlocked and the use of previously joined networks to be risk accepted based on the SSID without user input. Audit: Intel Macs only; Apple silicon reports 0 (not applicable).'
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.10.2 Ensure Power Nap Is Disabled for Intel Macs
os_family:
- macos-26
audit:
  type: command
  command: |-
    [ -x /usr/bin/pmset ] || exit 1
    /usr/sbin/sysctl -n machdep.cpu.brand_string | /usr/bin/grep -q Intel || { echo 0; exit 0; }
    /usr/bin/pmset -g custom | /usr/bin/awk '$1 == "powernap" && $2 == 1 {n++} END {print n+0}'
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/sbin/sysctl -n machdep.cpu.brand_string | /usr/bin/grep -q Intel || exit 0
    /usr/bin/pmset -a powernap 0
  guidance: "Terminal: sudo /usr/bin/pmset -a powernap 0. GUI: Desktop Instructions: System Settings > Energy Saver > Set Power Nap to disabled > UPS (if applicable) > Set Power Nap to disabled. Laptop Instructions: System Settings > Battery > Power Adapter (for laptops only) > Set Power Nap to disabled > Battery > Set Power Nap to disabled > UPS (if applicable) > Set Power Nap to disabled."
