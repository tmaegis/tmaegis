id: TMA-MACOS-2.3.3.6
title: Ensure Remote Apple Events Is Disabled
description: Apple Events is a technology that allows one program to communicate with other programs. Remote Apple Events allows a program on one computer to communicate with a program on a different computer.
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.3.3.6 Ensure Remote Apple Events Is Disabled
os_family:
- macos-26
audit:
  type: command
  command: /usr/sbin/systemsetup -getremoteappleevents 2>/dev/null
  expected_output: 'Remote Apple Events: Off'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/sbin/systemsetup -setremoteappleevents off
  guidance: "Terminal: sudo /usr/sbin/systemsetup -setremoteappleevents off. GUI: System Settings > General > Sharing > Set Remote Apple Events to disabled."
