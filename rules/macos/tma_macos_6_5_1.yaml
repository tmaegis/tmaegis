id: TMA-MACOS-6.5.1
title: Audit Passwords
description: Apple has provided a new interface in macOS Monterey for managing passwords that mirrors the interfaced capability already available in iOS. Password management in macOS was previously available in both Safari Preferences and in Keychain Access. Apple is attempting to simplify password management for macOS and make the user experience more similar to iOS.
target: macos
level: 1
severity: low
tags:
- macos
- applications
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 6.5.1 Audit Passwords
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: Passwords > Enter the user''s password > Security > Verify that any recommendations or compromised passwords are set to match your organization''s settings > Review applications with stored passwords to ensure that Enterprise managed passwords are not stored inappropriately. Application interfaces may need to be considered as well, as they allow the opportunity to store passwords that should not be saved.'
remediation:
  type: iac_patch
  command: 'GUI: Passwords > Enter the user''s password > Security > Remove stored passwords that should not be saved > Update any passwords that are compromised and are still in use by the organization.'
