id: TMA-MACOS-5.3.2
title: Ensure all APFS and HFS+ external user storage volumes are encrypted
description: 'Apple developed the APFS (Apple File System) structure primarily for flash and solid- state drives. This file structure was first made available in 10.12 and then became the default in 10.13. Apple introduced CoreStorage with Mac OS X 10.7 Lion. It is used as the default for formatting on macOS volumes prior to macOS 10.13 High Sierra. All HFS and CoreStorage Volumes should be encrypted. Audit: Fails when any attached external APFS/HFS+ volume reports FileVault: No; no external volumes is compliant.'
target: macos
level: 1
severity: high
tags:
- macos
- system-access
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 5.3.2 Ensure all APFS and HFS+ external user storage volumes are encrypted
os_family:
- macos-26
audit:
  type: command
  command: |-
    [ -x /usr/sbin/diskutil ] || exit 1
    out=$(/usr/sbin/diskutil list external | /usr/bin/grep -E 'APFS Volume|Apple_HFS|Logical Volume' | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info | /usr/bin/grep -E "Volume Name|FileVault")
    if printf '%s\n' "$out" | /usr/bin/grep -qE 'FileVault: +No'; then printf '%s\n' "$out"; else echo compliant; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: Use Disk Utility to erase a user disk and format as APFS (Encrypted).
