id: TMA-MACOS-5.3.1
title: Ensure all internal user storage APFS volumes are encrypted
description: 'Apple developed the APFS (Apple File System) structure primarily for flash and solid- state drives. This file structure was first made available in 10.12 and then became the default in 10.13. macOS computers generally have several volumes created as part of APFS formatting, including Preboot, Recovery and Virtual Memory (VM), as well as traditional user disks. Audit: Fails when any internal APFS user volume (Preboot, Recovery and VM excluded) reports FileVault: No.'
target: macos
level: 1
severity: high
tags:
- macos
- system-access
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 5.3.1 Ensure all internal user storage APFS volumes are encrypted
os_family:
- macos-26
audit:
  type: command
  command: |-
    [ -x /usr/sbin/diskutil ] || exit 1
    out=$(/usr/sbin/diskutil list internal | /usr/bin/grep 'APFS Volume' | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info | /usr/bin/grep -E "Volume Name|FileVault" | /usr/bin/sed '/Preboot/{N;d;}' | /usr/bin/sed '/Recovery/{N;d;}' | /usr/bin/sed '/VM/{N;d;}')
    if printf '%s\n' "$out" | /usr/bin/grep -qE 'FileVault: +No'; then printf '%s\n' "$out"; else echo compliant; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: Use Disk Utility to erase a user disk and format as APFS (Encrypted).
