id: TMA-MACOS-2.3.3.1
title: Ensure Screen Sharing Is Disabled
description: Screen Sharing allows a computer to connect to another computer on a network and display the computer’s screen. While sharing the computer’s screen, the user can control what happens on that computer, such as opening documents or applications, opening, moving, or closing windows, and even shutting down the computer.
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.3.3.1 Ensure Screen Sharing Is Disabled
os_family:
- macos-26
audit:
  type: command
  command: |-
    out=$(/bin/launchctl list 2>/dev/null) || exit 1
    printf '%s\n' "$out" | /usr/bin/grep -cE 'com.apple.screensharing$' || true
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /bin/launchctl disable system/com.apple.screensharing 2>/dev/null
    /bin/launchctl bootout system/com.apple.screensharing 2>/dev/null
    /bin/launchctl unload -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null; true
  guidance: "Terminal: sudo /bin/launchctl disable system/com.apple.screensharing ; sudo /bin/launchctl bootout system/com.apple.screensharing. GUI: System Settings > General > Sharing > Set Screen Sharing to disabled."
