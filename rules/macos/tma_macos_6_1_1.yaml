id: TMA-MACOS-6.1.1
title: Audit Show All Filename Extensions
description: A filename extension is a suffix added to a base filename that indicates the base filename's file format. This is intended for any user that logs into the GUI and has a home folder and not for service accounts. For the audit, we will continue to verify that every account with a home folder has filename extensions enabled.
target: macos
level: 1
severity: low
tags:
- macos
- applications
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 6.1.1 Audit Show All Filename Extensions
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: Finder > Finder in the menu bar > Settings > Advanced > Verify that Show all filename extensions is set. Terminal: sudo -u <username> /usr/bin/defaults read /Users/<username>/Library/Preferences/.GlobalPreferences.plist AppleShowAllExtensions ; sudo -u firstuser /usr/bin/defaults read /Users/firstuser/Library/Preferences/.GlobalPreferences.plist AppleShowAllExtensions'
remediation:
  type: iac_patch
  command: 'Terminal: sudo -u <username> /usr/bin/defaults write /Users/<username>/Library/Preferences/.GlobalPreferences.plist AppleShowAllExtensions -bool true ; sudo killall Finder ; sudo -u seconduser /usr/bin/defaults write /Users/secondname/Library/Preferences/.GlobalPreferences.plist AppleShowAllExtensions -bool true. GUI: Finder > Finder in the menu bar > Settings > Advanced > Set Show all filename extensions to enabled.'
