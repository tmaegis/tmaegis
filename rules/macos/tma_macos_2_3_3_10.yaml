id: TMA-MACOS-2.3.3.10
title: Ensure Bluetooth Sharing Is Disabled
description: 'Bluetooth Sharing allows files to be exchanged with Bluetooth-enabled devices. This setting only disables the receiving of files and requires both devices to be paired through Bluetooth as well as accepted by the receiver. This setting does not disable the ability to send files from the device to another paired Bluetooth device. Audit: Checks PrefKeyServicesEnabled for every local user (UID > 500); an unset key is the off-by-default state.'
target: macos
level: 1
severity: medium
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.3.3.10 Ensure Bluetooth Sharing Is Disabled
os_family:
- macos-26
audit:
  type: command
  command: |-
    ul=$(/usr/bin/dscl . -list /Users UniqueID 2>/dev/null) || exit 1
    bad=""
    for u in $(printf '%s\n' "$ul" | /usr/bin/awk '$2 > 500 {print $1}'); do
      v=$(/usr/bin/sudo -u "$u" /usr/bin/defaults -currentHost read com.apple.Bluetooth PrefKeyServicesEnabled 2>/dev/null)
      [ -n "$v" ] && [ "$v" != 0 ] && bad="$bad $u"
    done
    if [ -z "$bad" ]; then echo compliant; else echo "Bluetooth Sharing enabled for:$bad"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for u in $(/usr/bin/dscl . -list /Users UniqueID 2>/dev/null | /usr/bin/awk '$2 > 500 {print $1}'); do
      /usr/bin/sudo -u "$u" /usr/bin/defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false 2>/dev/null
    done; true
  guidance: "Terminal: sudo -u <username> /usr/bin/defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false ; sudo -u firstuser /usr/bin/defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false. GUI: System Settings > General > Sharing > Set Bluetooth Sharing to disabled."
