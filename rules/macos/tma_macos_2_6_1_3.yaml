id: TMA-MACOS-2.6.1.3
title: Audit Location Services Access
description: macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant information to users. While Location Services may be very useful, it may not be desirable to allow all applications that can use Location Services to use your location for Internet queries in order to provide tailored content based on your current location.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.6.1.3 Audit Location Services Access
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > Privacy & Security > Location Services > Verify that the applications allowed to access Location Services are set to your organization''s requirements Perform the following steps to verify what websites are enabled to ask for access to. Location Services: Safari > Safari from the menu bar > Settings > Websites > Location > Verify that When visiting other websites is set to your organization''s requirements. Terminal: sudo /usr/bin/defaults read /var/db/locationd/clients.plist Ensure that all applications listed have been authorized to access location information.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Privacy & Security > Location Services > Set any applications listed to your organization''s requirements Perform the following steps to set websites to ask for permission to access Location. Services: Safari > Safari from the menu bar > Settings > Websites > Location > Set When visiting other websites to your organization''s requirements.'
