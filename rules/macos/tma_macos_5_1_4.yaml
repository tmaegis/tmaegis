id: TMA-MACOS-5.1.4
title: Ensure Signed System Volume (SSV) Is Enabled
description: Signed System Volume is a security feature introduced in macOS 11.0 Big Sur. During system installation, a SHA-256 cryptographic hash is calculated for all immutable system files and stored in a Merkle tree which itself is hashed as the Seal. Both are stored in the metadata of the snapshot created of the System volume. The seal is verified by the boot loader at startup.
target: macos
level: 1
severity: high
tags:
- macos
- system-access
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 5.1.4 Ensure Signed System Volume (SSV) Is Enabled
os_family:
- macos-26
audit:
  type: command
  command: /usr/bin/csrutil authenticated-root status 2>/dev/null
  expected_output: 'Authenticated Root status: enabled'
remediation:
  type: iac_patch
  command: If SSV has been disabled, assume that the operating system has been compromised. Back up any files, and do a clean install to a known good Operating System.
