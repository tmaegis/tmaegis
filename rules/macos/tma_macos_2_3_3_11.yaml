id: TMA-MACOS-2.3.3.11
title: Ensure Computer Name Does Not Contain PII or Protected Organizational Information
description: If the computer is used in an organization that assigns host names, it is a good idea to change the computer name to the host name. This is more of a best practice than a security measure. If the host name and the computer name are the same, computer support may be able to track problems down more easily.
target: macos
level: 2
severity: medium
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.3.3.11 Ensure Computer Name Does Not Contain PII or Protected Organizational Information
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Sharing > Verify that Hostname is set to your organization''s parameters.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > General > Sharing > Edit > Set Hostname to your organization''s parameters.'
