id: TMA-MACOS-6.3.8
title: Audit AutoFill
description: AutoFill capabilities in a Web Browser are a feature to allow a user to avoid re-typing the same user information in every form that a user encounters. Part of the modern internet consists of vendors establishing a seemingly close relationship with as many users as possible to market to them, data-mine from them and sell their data to third- party data aggregators.
target: macos
level: 2
severity: low
tags:
- macos
- applications
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 6.3.8 Audit AutoFill
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has safariAllowAutoFill set to your organization''s requirements. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.applicationaccess, key safariAllowAutoFill'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.applicationaccess safariAllowAutoFill = <<true>or<false>/>.'
