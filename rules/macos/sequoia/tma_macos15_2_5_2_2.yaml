id: TMA-MACOS15-2.5.2.2
title: Ensure Listen for (Siri) Is Disabled
description: macOS includes the Siri digital assistant and if enabled it is always listening in case it is needed. In Sonoma a user may choose either "Hey Siri" or either "Siri" and "Hey Siri." In either case, Siri is using the microphone at all times to listen for instructions and then can record questions once activated.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.5.2.2 Ensure Listen for (Siri) Is Disabled
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has VoiceTriggerUserEnabled set to 0. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.Siri, key VoiceTriggerUserEnabled'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.Siri set to VoiceTriggerUserEnabled = <false/>.'
