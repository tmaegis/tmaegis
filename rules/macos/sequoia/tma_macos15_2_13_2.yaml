id: TMA-MACOS15-2.13.2
title: Ensure Guest Access to Shared Folders Is Disabled
description: Allowing guests to connect to shared folders enables users to access selected shared folders and their contents from different computers on a network.
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.13.2 Ensure Guest Access to Shared Folders Is Disabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    out=$(/usr/sbin/sysadminctl -smbGuestAccess status 2>&1) || exit 1
    printf '%s\n' "$out" | /usr/bin/grep -q "SMB guest access disabled" && echo compliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/sbin/sysadminctl -smbGuestAccess off 2>/dev/null; true
  guidance: "Terminal: sudo /usr/sbin/sysadminctl -smbGuestAccess off. GUI: System Settings > Users & Groups > i next to the Guest User > Set Allow guests to connect to shared folders to disabled."
