id: TMA-MACOS15-2.2.2
title: Ensure Firewall Stealth Mode Is Enabled
description: 'While in Stealth mode, the computer will not respond to unsolicited probes, dropping that traffic. Audit: Passes when EnableStealthMode is true in a profile or socketfilterfw reports stealth mode on.'
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.2.2 Ensure Firewall Stealth Mode Is Enabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    [ -x /usr/bin/osascript ] || exit 1
    p=$(/usr/bin/osascript -l JavaScript <<'EOS'
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.security.firewall').objectForKey('EnableStealthMode').js
    EOS
    )
    s=$(/usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode 2>/dev/null)
    if [ "$p" = true ] || printf '%s' "$s" | /usr/bin/grep -q 'stealth mode is on'; then echo compliant; else echo "EnableStealthMode=${p:-unset}; $s"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  guidance: "Profile (preferred): com.apple.security.firewall EnableStealthMode = <true/>. Terminal: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on. GUI: System Settings > Network > Firewall > Options > Set Enabled stealth mode to enabled."
