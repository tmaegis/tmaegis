id: TMA-MACOS15-2.12.1
title: Ensure Users' Accounts Do Not Have a Password Hint
description: 'Password hints help the user recall their passwords for various systems and/or accounts. In most cases, password hints are simple and closely related to the user''s password. Audit: Counts users that have any password hint text.'
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.12.1 Ensure Users' Accounts Do Not Have a Password Hint
os_family:
- macos-15
audit:
  type: command
  command: |-
    out=$(/usr/bin/dscl . -list /Users hint 2>/dev/null) || exit 1
    printf '%s\n' "$out" | /usr/bin/awk 'NF > 1 {n++} END {print n+0}'
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/dscl . -list /Users hint 2>/dev/null | /usr/bin/awk 'NF > 1 {print $1}' | while IFS= read -r u; do
      /usr/bin/dscl . -delete "/Users/$u" hint
    done; true
  guidance: "Terminal: sudo /usr/bin/dscl . -list /Users hint . -delete /Users/<username> hint ; sudo /usr/bin/dscl . -list /Users hint . -delete /Users/firstuser hint ; sudo /usr/bin/dscl . -list /Users hint . -delete /Users/seconduser hint. GUI: System Settings > Touch ID & Passwords (or Login Password on non-Touch ID Macs) > Change > Change the password and ensure that no text is entered in the Password hint box."
