id: TMA-MACOS15-2.15.1
title: Audit Notification Settings
description: Notification capabilities are designed to allow users to receive updates from applications that are not currently in use. These can be background applications or even notices from processes running on a computer that is not currently being actively used.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.15.1 Audit Notification Settings
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > Notifications > Verify that Show previews for each application is set to your organization''s requirements.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Notifications > any applications that are not in compliance with your organization''s requirements > Turn off or mute notifications that may expose information to unauthorized people that might be able to view screens of organizational computers.'
