id: TMA-MACOS15-2.11.5
title: Ensure Show Password Hints Is Disabled
description: Password hints are user-created text displayed when an incorrect password is used for an account.
target: macos
level: 1
severity: high
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.11.5 Ensure Show Password Hints Is Disabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    /usr/bin/osascript -l JavaScript <<'EOS'
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow').objectForKey('RetriesUntilHint').js
    EOS
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/defaults write "/Library/Preferences/com.apple.loginwindow" 'RetriesUntilHint' -int 0
    /usr/bin/killall cfprefsd 2>/dev/null; true
  guidance: "Profile (preferred): com.apple.loginwindow RetriesUntilHint = <integer>0</integer>. Terminal: sudo /usr/bin/defaults write /Library/Preferences/com.apple.loginwindow RetriesUntilHint -int 0. GUI: System Settings > Lock Screen > Set 'Show password hints` to disabled."
