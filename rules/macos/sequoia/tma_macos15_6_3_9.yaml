id: TMA-MACOS15-6.3.9
title: Audit Pop-up Windows
description: Browser pop-up windows have long been one of the most annoying delivery mechanisms of unwanted web content. The content can be unwanted content, including Not Safe For Work, or malicious content relying on a user interacting with the pop-up. Safari has a built-in capability to disable pop-ups that should be enabled.
target: macos
level: 1
severity: low
tags:
- macos
- applications
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 6.3.9 Audit Pop-up Windows
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: Safari > Safari from the menu bar > Settings > Websites > Pop-up Windows > Verify the websites listed in Allow pop-up windows on the website below:. are allowed according to your organization''s requirements Verify that When visiting other websites is set to Block and Notify or Block.'
remediation:
  type: iac_patch
  command: 'GUI: Safari > Safari from the menu bar > Settings > Websites > Pop-up Windows > Set all websites to Block and Notify or Block, listed in Allow pop-up windows on the website below:, or select Remove to remove a website > Set that When visiting other websites is set to Block and Notify or Block.'
