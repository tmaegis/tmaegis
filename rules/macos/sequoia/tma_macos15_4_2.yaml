id: TMA-MACOS15-4.2
title: Ensure HTTP Server Is Disabled
description: macOS used to have a graphical front-end to the embedded Apache web server in the operating system. Personal web sharing could be enabled to allow someone on another computer to download files or information from the user's computer. Personal web sharing from a user endpoint has long been considered questionable, and Apple has removed that capability from the GUI.
target: macos
level: 1
severity: medium
tags:
- macos
- network
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 4.2 Ensure HTTP Server Is Disabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    out=$(/bin/launchctl list 2>/dev/null) || exit 1
    printf '%s\n' "$out" | /usr/bin/grep -c 'org.apache.httpd' || true
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/sbin/apachectl stop 2>/dev/null
    /bin/launchctl disable system/org.apache.httpd 2>/dev/null
    /bin/launchctl bootout system/org.apache.httpd 2>/dev/null
    /bin/launchctl unload -w /System/Library/LaunchDaemons/org.apache.httpd.plist 2>/dev/null; true
  guidance: "Terminal: sudo /usr/sbin/apachectl stop ; sudo /bin/launchctl unload -w /System/Library/LaunchDaemons/org.apache.httpd.plist."
