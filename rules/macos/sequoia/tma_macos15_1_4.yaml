id: TMA-MACOS15-1.4
title: Ensure Install Application Updates from the App Store Is Enabled
description: Ensure that application updates are installed after they are available from Apple. These updates do not require reboots or administrator privileges for end users.
target: macos
level: 1
severity: medium
tags:
- macos
- software-update
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 1.4 Ensure Install Application Updates from the App Store Is Enabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    /usr/bin/osascript -l JavaScript <<'EOS'
    function run() {
      let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.commerce').objectForKey('AutoUpdate'))
      let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate').objectForKey('AutomaticallyInstallAppUpdates'))
      if ( pref1 == 1 || pref2 == 1 ) {
        return("true")
      } else {
        return("false")
      }
    }
    EOS
  expected_output: 'true'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/defaults write "/Library/Preferences/com.apple.commerce" 'AutoUpdate' -bool true
    /usr/bin/defaults write "/Library/Preferences/com.apple.SoftwareUpdate" 'AutomaticallyInstallAppUpdates' -bool true
    /usr/bin/killall cfprefsd 2>/dev/null; true
  guidance: "Profile (preferred): com.apple.SoftwareUpdate AutomaticallyInstallAppUpdates = <true/>. Terminal: sudo /usr/bin/defaults write /Library/Preferences/com.apple.commerce AutoUpdate -bool TRUE. GUI: System Settings > General > Software Update > i > Set Install application updates from the App Store to enabled > Done."
