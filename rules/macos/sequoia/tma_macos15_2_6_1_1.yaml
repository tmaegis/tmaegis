id: TMA-MACOS15-2.6.1.1
title: Ensure Location Services Is Enabled
description: macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant information to users. With the operating system verifying the location, users do not need to change the time or the time zone. The computer will change them based on the user's location.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.6.1.1 Ensure Location Services Is Enabled
os_family:
- macos-15
audit:
  type: command
  command: |-
    n=$(/bin/launchctl list 2>/dev/null | /usr/bin/grep -c com.apple.locationd)
    e=$(/usr/bin/sudo -u _locationd /usr/bin/osascript -l JavaScript <<'EOS'
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.locationd').objectForKey('LocationServicesEnabled').js
    EOS
    ) || exit 1
    if [ "${n:-0}" -ge 1 ] && [ "$e" = true ]; then echo compliant; else echo "locationd=$n LocationServicesEnabled=${e:-unset}"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/sudo -u _locationd /usr/bin/defaults -currentHost write com.apple.locationd LocationServicesEnabled -bool true
    /bin/launchctl enable system/com.apple.locationd 2>/dev/null
    /bin/launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.locationd.plist 2>/dev/null
    /bin/launchctl kickstart -k system/com.apple.locationd 2>/dev/null; true
  guidance: "Terminal: sudo /bin/launchctl load -w /System/Library/LaunchDaemons/com.apple.locationd.plist ; sudo /usr/bin/defaults write /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd LocationServicesEnabled -bool true ; sudo /usr/bin/killall locationd. GUI: System Settings > Privacy & Security > Location Services > Set Location Services to enabled."
