id: TMA-MACOS15-2.14.1
title: Audit Game Center Settings
description: With macOS 10.13, Apple has introduced a separate section for Game Center in System Settings. It is possible to log in with the Apple ID and use the iCloud-based Game Center services. Game Center is a feature from Apple that allows users to engage in game-related activities with friends when playing multiplayer games online on the Game Center social network.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.14.1 Audit Game Center Settings
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Allow GameCenter set to your organization''s requirements. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.applicationaccess, key allowGameCenter If the output is false, Game Center is disabled. If the output is true Game Center is enabled.'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.applicationaccess allowGameCenter.'
