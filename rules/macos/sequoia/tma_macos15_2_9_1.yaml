id: TMA-MACOS15-2.9.1
title: Ensure Help Apple Improve Search Is Disabled
description: Apple provides a mechanism to send diagnostic and analytics data back to Apple to help them improve the platform. Information sent to Apple may contain internal organizational information that should be controlled and not available for processing by Apple.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.9.1 Ensure Help Apple Improve Search Is Disabled
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Search Queries Data Sharing Status set to 2. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.assistant.support, key Search Queries Data Sharing Status'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.assistant.support set to Search Queries Data Sharing Status = <integer>2</integer>.'
