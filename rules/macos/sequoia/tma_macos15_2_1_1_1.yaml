id: TMA-MACOS15-2.1.1.1
title: Audit iCloud Passwords & Keychain
description: The iCloud Passwords & Keychain is Apple's synchronization service that works with Apple Accounts to synchronize password, passkey, and credit card information across macOS, iOS, iPadOS. The capability allows users to use synced password, passkey, and credit card information in either macOS, iOS, or iPadOS for use in Safari and other applications.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.1.1.1 Audit iCloud Passwords & Keychain
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has Disallow iCloud Keychain Sync set to your organization''s requirements. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.applicationaccess, key allowCloudKeychainSync If the output is false, iCloud Passwords & Keychain Sync is disabled. If the output is true, iCloud Passwords & Keychain sync is enabled.'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.applicationaccess allowCloudKeychainSync.'
