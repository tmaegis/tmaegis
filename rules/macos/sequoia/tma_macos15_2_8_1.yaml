id: TMA-MACOS15-2.8.1
title: Audit Universal Control Settings
description: Universal Control is an Apple feature that allows Mac users to control multiple other Macs and iPads with the same keyboard, mouse, and trackpad using the same Apple Account. The technology relies on already available iCloud services, particularly Handoff. Universal Control simplifies the use of iCloud connectivity of multiple computers using the same Apple Account.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 15.0 Sequoia Benchmark v2.1.0 - 2.8.1 Audit Universal Control Settings
os_family:
- macos-15
audit:
  type: manual
  command: 'GUI: System Settings > General > Device Management > Verify that an installed profile has with com.apple.universalcontrol in Settings and has Disable set to your organization''s parameters. Terminal: sudo /usr/bin/osascript -l JavaScript (JXA) reading NSUserDefaults suite com.apple.universalcontrol, key Disable If the output is true, Universal Control is disabled. If it is false, then Universal Control is enabled.'
remediation:
  type: iac_patch
  command: 'Profile (preferred): com.apple.universalcontrol Disable; com.apple.coreservices.useractivityd ClipboardSharingEnabled.'
