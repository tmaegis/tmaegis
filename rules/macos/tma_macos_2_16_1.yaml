id: TMA-MACOS-2.16.1
title: Audit Wallet & Apple Pay Settings
description: Touch ID is a prerequisite for using Apple Pay and Wallet on macOS. Apple Pay allows an Apple account holder to enroll their credit cards in Apple Pay and pay enrolled vendors without using the physical card or number. Apple's service eliminates the requirement to send the credit card number itself to the vendor.
target: macos
level: 2
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.16.1 Audit Wallet & Apple Pay Settings
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > Wallet & Apple Pay > Verify the Wallet & Apple Pay settings match your organization''s requirements.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Wallet & Apple Pay > Set the Wallet & Apple Pay settings to your organization''s requirements.'
