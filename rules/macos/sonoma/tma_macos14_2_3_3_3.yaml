id: TMA-MACOS14-2.3.3.3
title: Ensure Printer Sharing Is Disabled
description: By enabling Printer Sharing, the computer is set up as a print server to accept print jobs from other computers. Dedicated print servers or direct IP printing should be used instead. Disabling Printer Sharing mitigates the risk of attackers attempting to exploit the print server to gain access to the system.
target: macos
os_family:
- macos-14
level: 1
severity: medium
tags:
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 2.3.3.3 Ensure Printer Sharing Is Disabled
audit:
  type: command
  command: 'out=$(/usr/sbin/cupsctl 2>/dev/null) || exit 1

    printf ''%s\n'' "$out" | /usr/bin/grep -c "_share_printers=0" || true'
  expected_output: '1'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/sbin/cupsctl --no-share-printers
  guidance: "Graphical Method: Perform the following steps to disable Printer Sharing: 1. Open System Settings 2. Select General 3. Select Sharing 4. Set Printer Sharing to disabled Terminal Method: Run the following command to disable Printer Sharing: % /usr/bin/sudo /usr/sbin/cupsctl --no-share-printers"
