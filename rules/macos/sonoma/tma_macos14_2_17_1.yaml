id: TMA-MACOS14-2.17.1
title: Audit Internet Accounts for Authorized Use
description: Apple provides a section in System Settings to create and display Internet Accounts. Setting up an Internet Account allows the user to configure access to pre-existing accounts that are Internet Accessible. The Internet Accounts section is not managing network access to firewall rules, it only provides a location to manage credentials and audit external accounts for applications that make use of the "Internet Accounts." Some applications, like Thunderbird and Firefox, do not natively use Internet Accounts and store credentials with the application settings. Disabling the Internet Accounts section does not block access if network reachable, it just makes auditing and use more difficult. Depending on the maturity of network controls, auditing the providers listed in Internet Accounts is part of managing acceptable use. Internet provided services may be restricted in your organization an...
target: macos
os_family:
- macos-14
level: 1
severity: low
tags:
- auth
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 2.17.1 Audit Internet Accounts for Authorized Use
audit:
  type: manual
  command: 'Graphical Method: Perform the following steps to verify what accounts have been added to Internet Accounts: 1. Open System Settings 2. Select Internet Accounts 3. Verify that all accounts are set to your organization''s requirements'
remediation:
  type: iac_patch
  command: 'Graphical Method: Perform the following steps to set accounts in Internet Accounts to your organization''s requirements: 1. Open System Settings 2. Select Internet Accounts 3. For each account, select the account 4. Verify that each sync option is set to yout organization''s requirements 5. (Optional) Select Delete Account... to remove the account 6. (Optional) Select Add Account... to add an account to the system'
