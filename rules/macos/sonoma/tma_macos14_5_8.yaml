id: TMA-MACOS14-5.8
title: Ensure a Login Window Banner Exists
description: A Login window banner warning informs the user that the system is reserved for authorized use only. It enforces an acknowledgment by the user that they have been informed of the use policy in the banner if required. The system recognizes either the .txt and the .rtf formats. An access warning may reduce a casual attacker's tendency to target the system. Access warnings may also aid in the prosecution of an attacker by evincing the attacker's knowledge of the system's private status, acceptable use policy, and authorization requirements.
target: macos
os_family:
- macos-14
level: 2
severity: medium
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 5.8 Ensure a Login Window Banner Exists
audit:
  type: command
  command: "set -- /Library/Security/PolicyBanner.*\n[ -e \"$1\" ] || exit 1\nfor f in \"$@\"; do\n  p=$(/usr/bin/stat -f %A \"$f\") || exit 1\n  case \"$p\" in ??4) ;; *) echo \"$f mode $p\"; exit 0;; esac\ndone\necho compliant"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    set -- /Library/Security/PolicyBanner.*
    if [ ! -e "$1" ]; then
      printf '%s\n' "Authorized use only. Activity may be monitored and reported." > /Library/Security/PolicyBanner.txt
    fi
    for f in /Library/Security/PolicyBanner.*; do /usr/sbin/chown root:wheel "$f"; /bin/chmod 644 "$f"; done
  guidance: "Terminal Method: Run the following commands to create or edit the login window text and set the proper permissions: Edit (or create) a PolicyBanner.txt or PolicyBanner.rtf file, in the /Library/Security/ folder, to include the required login window banner text. Perform the following to set permissions on the policy banner file: % /usr/bin/sudo /bin/chmod o+r /Library/Security/PolicyBanner.txt % /usr/bin/sudo /bin/chmod o+r /Library/Security/PolicyBanner.rtf Note: If your organization uses an .rtfd file to set the policy banner, run % /usr/bin/sudo /bin/chmod o+rx /Library/Security/PolicyBanner.rtfd to update the permissions."
