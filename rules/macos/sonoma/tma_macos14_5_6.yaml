id: TMA-MACOS14-5.6
title: Ensure the "root" Account Is Disabled
description: The root account is a superuser account that has access privileges to perform any actions and read/write to any file on the computer. With some versions of Linux, the system administrator may commonly use the root account to perform administrative functions. Previous versions of the benchmark included a graphical check for the audit and remediation as well as a different Terminal command for the remediation. After extensive testing, it was discovered that if root was enabled it could be granted a secure token which was not removed with the previous remediation. To rectify this issue, the audit was updated to verify if root has a secure token even if the root account is not enabled. The remediation was also updated to remove root's secure token as well as an updated command to disable the root user. Enabling and using the root account puts the system at risk since any successful exploi...
target: macos
os_family:
- macos-14
level: 1
severity: high
tags:
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 5.6 Ensure the "root" Account Is Disabled
audit:
  type: command
  command: 'out=$(/usr/bin/dscl . -read /Users/root AuthenticationAuthority 2>&1)

    printf ''%s\n'' "$out" | /usr/bin/grep -q "No such key: AuthenticationAuthority" && echo compliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/dscl . -delete /Users/root AuthenticationAuthority 2>/dev/null; true
  guidance: "Terminal Method: Run the following commands to disable the root user: % /usr/bin/sudo /usr/bin/fdesetup remove -user root 2>/dev/null % /usr/bin/sudo /usr/bin/dscl /Local/Default delete /Users/root AuthenticationAuthority"
