id: TMA-MACOS14-2.6.7
title: Audit Lockdown Mode
description: Apple introduced Lockdown Mode as a security feature in their 2022 OS releases that provides additional security protection Apple describes as extreme. Users and organizations that suspect some users are targets of advanced attacks must consider using this control. When lockdown mode is enabled, specific trusted websites can be excluded from Lockdown protection if necessary. Lockdown Mode was designed by Apple as an aggressive approach to commonly attacked OS features where additional controls could reduce the attack surface. IT systems and devices, including their users, are subject to continuous exploit attempts. Most of that activity is not from an advanced attacker and can be considered background noise to a patched, hardened device. Advanced attackers are of more concern and a risk review to understand organizational targets and use Lockdown Mode where appropriate is necessary.
target: macos
os_family:
- macos-14
level: 2
severity: low
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 2.6.7 Audit Lockdown Mode
audit:
  type: manual
  command: 'Graphical Method: Perform the following steps to verify the settings for Lockdown Mode: 1. Open System Settings 2. Select Privacy & Security 3. Verify Lockdown Mode is set to your organization''s requirements Terminal Method: Run the following command to verify that Lockdown mode is enabled for the user: $ /usr/bin/sudo -u <username> /usr/bin/defaults read .GlobalPreferences.plist LDMGlobalEnabled 2>/dev/null When Lockdown mode has been enabled, it will return 1 and when disabled return 0. If Lockdown has never been enabled, it will return no value. NOTE: Lockdown mode is set per local user, therefore you must iterate through each local user to verify the settings.'
remediation:
  type: iac_patch
  command: 'Graphical Method: Perform the following steps to set Lockdown Mode to your organization''s requirements: 1. Open System Settings 2. Select Privacy & Security 3. Set Lockdown Mode to your organization''s requirements'
