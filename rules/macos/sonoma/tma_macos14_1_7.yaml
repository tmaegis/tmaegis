id: TMA-MACOS14-1.7
title: Ensure Software Update Deferment Is Less Than or Equal to 30 Days
description: 'Apple provides the capability to manage software updates on Apple devices through mobile device management. Part of those capabilities permit organizations to defer software updates and allow for testing. Many organizations have specialized software and configurations that may be negatively impacted by Apple updates. If software updates are deferred, they should not be deferred for more than 30 days. This control only verifies that deferred software updates are not deferred for more than 30 days. Note: Software deferment is deprecated by Apple and will be removed in a future OS release/update. Apple Device Management Profile - SoftwareUpdate Apple software updates almost always include security updates. Attackers evaluate updates to create exploit code in order to attack unpatched systems. The longer a system remains unpatched, the greater an exploit possibility exists in which there...'
target: macos
os_family:
- macos-14
level: 1
severity: high
tags:
- macos
- patching
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 1.7 Ensure Software Update Deferment Is Less Than or Equal to 30 Days
audit:
  type: command
  command: "/usr/bin/osascript -l JavaScript <<'EOS'\nfunction run() {\n  let delay = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess').objectForKey('enforcedSoftwareUpdateDelay'))\n  if ( delay == null || delay <= 30 ) {\n    return(\"true\")\n  } else {\n    return(\"false\")\n  }\n}\nEOS"
  expected_output: 'true'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/defaults delete /Library/Preferences/com.apple.applicationaccess enforcedSoftwareUpdateDelay 2>/dev/null
    /usr/bin/killall cfprefsd 2>/dev/null; true
  guidance: "Profile Method: Create or edit a configuration profile with the following information: 1. The PayloadType string is com.apple.applicationaccess 2. The key to include is enforcedSoftwareUpdateDelay 3. The key must be set to <integer><1-30></integer> Note: The key enforcedSoftwareUpdateDelay is for all updates through software updates. If your organization needs to delay major OS upgrades on a separate timescale than minor OS updates (or App Store updates), see the Additional Information section for a breakdown of what keys to use."
