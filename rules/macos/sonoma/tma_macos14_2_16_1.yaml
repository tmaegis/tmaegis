id: TMA-MACOS14-2.16.1
title: Audit Wallet & Apple Pay Settings
description: Touch ID is a prerequisite for using Apple Pay and Wallet on macOS. Apple Pay allows an Apple account holder to enroll their credit cards in Apple Pay and pay enrolled vendors without using the physical card or number. Apple's service eliminates the requirement to send the credit card number itself to the vendor. Apple Pay on a Mac allows the use of credit cards the user has already enrolled and reduces user risk for credit card purchases. Some environments may have rules around purchases from organizationally managed computers and may want to discourage shopping from them. It is difficult to block access to websites that allow purchases, and Apple Pay has more controls for user protection than the manual entry of credit card information.
target: macos
os_family:
- macos-14
level: 2
severity: low
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 2.16.1 Audit Wallet & Apple Pay Settings
audit:
  type: manual
  command: 'Graphical Method: Perform the following to verify Wallet & Apple Pay settings: 1. Open System Settings 2. Select Wallet & Apple Pay 3. Verify the Wallet & Apple Pay settings match your organization''s requirements'
remediation:
  type: iac_patch
  command: 'Graphical Method: Perform the following steps to set Wallet & Apple Pay to your organization''s requirements: 1. Open System Settings 2. Select Wallet & Apple Pay 3. Set the Wallet & Apple Pay settings to your organization''s requirements'
