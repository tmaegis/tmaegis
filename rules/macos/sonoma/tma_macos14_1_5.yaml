id: TMA-MACOS14-1.5
title: Ensure Install Application Updates from the App Store Is Enabled
description: Ensure that application updates are installed after they are available from Apple. These updates do not require reboots or administrator privileges for end users. Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
target: macos
os_family:
- macos-14
level: 1
severity: high
tags:
- macos
- patching
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 1.5 Ensure Install Application Updates from the App Store Is Enabled
audit:
  type: command
  command: "/usr/bin/osascript -l JavaScript <<'EOS'\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate').objectForKey('ConfigDataInstall'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate').objectForKey('CriticalUpdateInstall'))\n  if ( pref1 == 1 && pref2 == 1 ) {\n    return(\"true\")\n  } else {\n    return(\"false\")\n  }\n}\nEOS"
  expected_output: 'true'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /usr/bin/defaults write "/Library/Preferences/com.apple.SoftwareUpdate" 'ConfigDataInstall' -bool true
    /usr/bin/defaults write "/Library/Preferences/com.apple.SoftwareUpdate" 'CriticalUpdateInstall' -bool true
    /usr/bin/killall cfprefsd 2>/dev/null; true
  guidance: "Graphical Method: Perform the following steps to enable App Store updates to install automatically: 1. Open System Settings 2. Select General 3. Select Software Update 4. Select the i 5. Set Install application updates from the App Store to enabled 6. Select Done Terminal Method: Run the following command to turn on App Store auto updating: % /usr/bin/sudo /usr/bin/defaults write /Library/Preferences/com.apple.commerce AutoUpdate -bool TRUE Note: This remediation requires a log out and log in to show in the GUI. Profile Method: Create or edit a configuration profile with the following information: 1. The PayloadType string is com.apple.SoftwareUpdate 2. The key to include is AutomaticallyInstallAppUpdates 3. The key must be set to <true/>"
