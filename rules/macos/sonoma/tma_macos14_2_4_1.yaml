id: TMA-MACOS14-2.4.1
title: Audit Menu Bar and Control Center Icons
description: 'The Menu Bar is the horizontal strip that runs across the very top of your Mac''s screen. The Control Center is a panel that groups the most frequently used system settings into one convenient location, similar to Control Center on an iPhone or iPad. The presence of an unfamiliar or persistent icon, especially those indicating active sensors when you are not actively using an app that needs them, ex: the orange/green/purple dots for microphone, camera, or system audio. Inconsiderate application vendors may insert an icon in the menu bar on application install without user interaction.'
target: macos
os_family:
- macos-14
level: 1
severity: low
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 2.4.1 Audit Menu Bar and Control Center Icons
audit:
  type: manual
  command: 'Graphical Method: Perform the following steps to verify Menu Bar and Control Center icons: 1. Open System Settings 2. Select Menu Bar 3. Verify that all items listed in the Allow in the menu bar section are allowed by your organization 4. Select the Control Center icon in the menu bar 5. Verify that the Control Center options meet your organization''s requirements'
remediation:
  type: iac_patch
  command: 'Graphical Method: Perform the following steps to set (or remove) Menu Bar and Control Center icons: 1. Open System Settings 2. Select Menu Bar 3. Remove any items in Allow in the menu bar section are not allowed by your organization Note: If there are unrecognized applications in the Allow in the Menu Bar section, this is a finding and should be investigated. 4. Select the Control Center icon in the menu bar 5. Set the Control Center options to meet your organization''s requirements Note: If there are unrecognized settings in Control Center, this is a finding and should be investigated.'
