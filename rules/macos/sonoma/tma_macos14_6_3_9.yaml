id: TMA-MACOS14-6.3.9
title: Audit Pop-up Windows
description: Browser pop-up windows have long been one of the most annoying delivery mechanisms of unwanted web content. The content can be unwanted content, including Not Safe For Work, or malicious content relying on a user interacting with the pop-up. Safari has a built-in capability to disable pop-ups that should be enabled. Pop-up windows are almost always unwanted content and should be blocked.
target: macos
os_family:
- macos-14
level: 1
severity: low
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 6.3.9 Audit Pop-up Windows
audit:
  type: manual
  command: 'Graphical Method: Perform the following to verify that the pop-up settings in Safari: 1. Open Safari 2. Select Safari from the menu bar 3. Select Settings 4. Select Websites 5. Select Pop-up Windows 6. Verify the websites listed in Allow pop-up windows on the website below: are allowed according to your organization''s requirements 7. Verify that When visiting other websites is set to Block and Notify or Block'
remediation:
  type: iac_patch
  command: 'Graphical Method: Perform the following to configure pop-ups in Safari: 1. Open Safari 2. Select Safari from the menu bar 3. Select Settings 4. Select Websites 5. Select Pop-up Windows 6. Set all websites to Block and Notify or Block, listed in Allow pop-up windows on the website below:, or select Remove to remove a website 7. Set that When visiting other websites is set to Block and Notify or Block'
