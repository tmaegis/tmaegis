id: TMA-MACOS14-3.1
title: Ensure Security Auditing Is Enabled
description: macOS's audit facility, auditd, receives notifications from the kernel when certain system calls, such as open, fork, and exit, are made. These notifications are captured and written to an audit log. Apple has deprecated auditd as of macOS 11.0 Big Sur. In macOS 14.0 Sonoma it is no longer enabled by default and it is suggested to use an application that integrates with the EndpointSecurity API. These applications are third party and not built into the macOS. Until auditd is removed from macOS completely, running the binary is the best way to collect logging in macOS and the only one that is part of the OS. Logs generated by auditd may be useful when investigating a security incident as they may help reveal the vulnerable application and the actions taken by a malicious actor.
target: macos
os_family:
- macos-14
level: 1
severity: high
tags:
- logging
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 3.1 Ensure Security Auditing Is Enabled
audit:
  type: command
  command: 'out=$(/bin/launchctl list 2>/dev/null) || exit 1

    printf ''%s\n'' "$out" | /usr/bin/grep -qi com.apple.auditd && echo compliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    /bin/launchctl enable system/com.apple.auditd 2>/dev/null
    /bin/launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.auditd.plist 2>/dev/null
    /bin/launchctl kickstart system/com.apple.auditd 2>/dev/null; true
  guidance: "Terminal Method: Perform the following to enable security auditing: Run the following command to load auditd and create the audit_control file: % /usr/bin/sudo /bin/launchctl load -w /System/Library/LaunchDaemons/com.apple.auditd.plist % /usr/bin/sudo /bin/cp /etc/security/audit_control.example /etc/security/audit_control"
