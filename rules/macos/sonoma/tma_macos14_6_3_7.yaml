id: TMA-MACOS14-6.3.7
title: Ensure Show Full Website Address in Safari Is Enabled
description: Attackers use websites with malicious or unwanted content to exploit the user or the computer. Part of the attack chain is to lure someone to load their content rather than the desired content. In order to reduce the risk in interacting with unwanted content, the full website address should always be displayed in Safari. Full visibility into what site is being visited is important for privacy and security.
target: macos
os_family:
- macos-14
level: 1
severity: low
tags:
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 6.3.7 Ensure Show Full Website Address in Safari Is Enabled
audit:
  type: command
  command: 'out=$(/usr/sbin/system_profiler SPConfigurationProfileDataType 2>/dev/null) || exit 1

    printf ''%s\n'' "$out" | /usr/bin/grep -E ''ShowFullURLInSmartSearchField'' | /usr/bin/tr -d '' '''
  expected_output: ShowFullURLInSmartSearchField=1;
remediation:
  type: iac_patch
  command: 'Profile Method: Create or edit a configuration profile with the following information: 1. The PayloadType string is com.apple.Safari 2. The key to include is ShowFullURLInSmartSearchField 3. The key must be set to: <true/>'
