id: TMA-MACOS14-5.9
title: Ensure the Guest Home Folder Does Not Exist
description: In the previous two controls, the guest account login has been disabled and sharing to guests has been disabled, as well. There is no need for the legacy Guest home folder to remain in the file system. When normal user accounts are removed, you have the option to archive it, leave it in place, or delete. In the case of the guest folder, the folder remains in place without a GUI option to remove it. If at some point in the future a Guest account is needed, it will be re-created. The presence of the Guest home folder can cause automated audits to fail when looking for compliant settings within all User folders, as well. Rather than ignoring the folder's continued existence, it is best removed. The Guest home folders are unneeded after the Guest account is disabled and could be used inappropriately.
target: macos
os_family:
- macos-14
level: 1
severity: high
tags:
- macos
- sonoma
reference: CIS Apple macOS 14.0 Sonoma Benchmark v3.1.0 - 5.9 Ensure the Guest Home Folder Does Not Exist
audit:
  type: command
  command: 'out=$(/bin/ls /Users/ 2>/dev/null) || exit 1

    printf ''%s\n'' "$out" | /usr/bin/grep -cx Guest || true'
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    [ -d /Users/Guest ] && [ ! -L /Users/Guest ] && /bin/rm -rf /Users/Guest; true
  guidance: "Terminal Method: Run the following command to remove the Guest user home folder: % /usr/bin/sudo /bin/rm -R /Users/Guest Note: If the Guest folder exists it maybe a legacy folder. If so, the folder should be removed. If you are unsure if the Guest folder is a legacy folder, then your organization should research why that folder is there. Also research what is contained (or was contained) within it before removing the folder."
