id: TMA-MACOS-2.17.1
title: Audit Internet Accounts for Authorized Use
description: Apple provides a section in System Settings to create and display Internet Accounts. Setting up an Internet Account allows the user to configure access to pre-existing accounts that are Internet Accessible.
target: macos
level: 1
severity: low
tags:
- macos
- system-settings
reference: CIS Apple macOS 26 Tahoe Benchmark v1.1.0 - 2.17.1 Audit Internet Accounts for Authorized Use
os_family:
- macos-26
audit:
  type: manual
  command: 'GUI: System Settings > Internet Accounts > Verify that all accounts are set to your organization''s requirements.'
remediation:
  type: iac_patch
  command: 'GUI: System Settings > Internet Accounts > For each account, select the account > Verify that each sync option is set to your organization''s requirements > (Optional) Select Delete Account... to remove the account > (Optional) Select Add Account... to add an account to the system.'
