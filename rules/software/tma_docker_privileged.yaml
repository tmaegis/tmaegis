id: TMA-DOCKER-NO-PRIVILEGED
title: Ensure no running container is privileged
description: Privileged containers have nearly full host access.
target: docker
level: 1
severity: critical
tags:
- docker
- containers
reference: CIS Docker Benchmark - Container runtime
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo 0; exit 0; }; out=$(docker inspect --format '{{.HostConfig.Privileged}}' $ids) || exit 1; printf '%s\n' "$out" | grep -c true || true
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Remove ''privileged: true'' from the container/compose/Kubernetes spec and redeploy'
