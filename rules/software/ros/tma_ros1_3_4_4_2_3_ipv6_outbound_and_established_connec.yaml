id: TMA-ROS1-3.4.4.2.3
title: Ensure IPv6 outbound and established connections are configured
description: Configure the firewall rules for new outbound, and established IPv6 connections. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- network
reference: CIS ROS Melodic Benchmark v1.0.0 - 3.4.4.2.3 Ensure IPv6 outbound and established connections are configured
audit:
  type: manual
  command: 'Run the following command and verify all rules for new outbound, and established connections match site policy: # ip6tables -L -v -n OR If IPv6 is disabled: Run the following command and verify that no lines are returned. # grep "^\s*linux" /boot/grub2/grub.cfg | grep -v ipv6.disable=1 OR # grep "^\s*linux" /boot/grub/grub.cfg | grep -v ipv6.disable=1'
remediation:
  type: iac_patch
  command: 'Configure iptables in accordance with site policy. The following commands will implement a policy to allow all outbound connections and all established connections: # ip6tables -A OUTPUT -p tcp -m state --state NEW,ESTABLISHED -j ACCEPT # ip6tables -A OUTPUT -p udp -m state --state NEW,ESTABLISHED -j ACCEPT # ip6tables -A OUTPUT -p icmp -m state --state NEW,ESTABLISHED -j ACCEPT # ip6tables -A INPUT -p tcp -m state --state ESTABLISHED -j ACCEPT # ip6tables -A INPUT -p udp -m state --state ESTABLISHED -j ACCEPT # ip6tables -A INPUT -p icmp -m state --state ESTABLISHED -j ACCEPT'
