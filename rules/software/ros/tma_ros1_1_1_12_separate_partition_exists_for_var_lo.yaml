id: TMA-ROS1-1.1.12
title: Ensure separate partition exists for /var/log/audit
description: The auditing daemon, auditd , stores log data in the /var/log/audit directory. The audit requires /var/log/audit to be a separate mount (findmnt). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: low
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.1.12 Ensure separate partition exists for /var/log/audit
audit:
  type: command
  shell: bash
  command: findmnt -kn /var/log/audit >/dev/null 2>&1 && echo compliant || echo '/var/log/audit is not a separate partition'
  expected_output: compliant
remediation:
  type: iac_patch
  command: For new installations, during installation create a custom partition setup and specify a separate partition for /var/log/audit . For systems that were previously installed, create a new partition and configure /etc/fstab as appropriate.
