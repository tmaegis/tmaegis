id: TMA-ROS1-4.1.2.1
title: Ensure audit log storage size is configured
description: Configure the maximum size of the audit log file. Once the log reaches the maximum size, it will be rotated and a new log file will be started. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- logging
reference: CIS ROS Melodic Benchmark v1.0.0 - 4.1.2.1 Ensure audit log storage size is configured
audit:
  type: manual
  command: 'Run the following command and ensure output is in compliance with site policy: # grep max_log_file /etc/audit/auditd.conf max_log_file = <MB>'
remediation:
  type: iac_patch
  command: 'Set the following parameter in /etc/audit/auditd.conf in accordance with site policy: max_log_file = <MB>'
