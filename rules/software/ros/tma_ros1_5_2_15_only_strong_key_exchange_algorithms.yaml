id: TMA-ROS1-5.2.15
title: Ensure only strong Key Exchange algorithms are used
description: Key exchange is any method in cryptography by which cryptographic keys are exchanged between two parties, allowing use of a cryptographic algorithm. If the sender and receiver wish to exchange encrypted messages, each must be equipped to encrypt messages to be sent and decrypt messages received The audit fails when sshd -T lists any of the weak key exchange algorithms named in the benchmark. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- access-control
reference: CIS ROS Melodic Benchmark v1.0.0 - 5.2.15 Ensure only strong Key Exchange algorithms are used
audit:
  type: command
  shell: bash
  command: |-
    command -v sshd >/dev/null 2>&1 || exit 1
    out=$(sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I 2>/dev/null | cut -d' ' -f1)" 2>/dev/null) || out=$(sshd -T 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk 'tolower($1)=="kexalgorithms"{print tolower($2); exit}')
    [ -n "$v" ] || { echo 'KexAlgorithms unset'; exit 1; }
    bad=0
    for w in diffie-hellman-group1-sha1 diffie-hellman-group14-sha1 diffie-hellman-group-exchange-sha1; do case ",$v," in *",$w,"*) echo "weak KexAlgorithms: $w"; bad=1 ;; esac; done
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
  requires_file:
  - /etc/ssh/sshd_config
remediation:
  type: iac_patch
  command: 'Edit the /etc/ssh/sshd_config file add/modify the KexAlgorithms line to contain a comma separated list of the site approved key exchange algorithms Example: KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman- group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18- sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie- hellman-group-exchange-sha256'
