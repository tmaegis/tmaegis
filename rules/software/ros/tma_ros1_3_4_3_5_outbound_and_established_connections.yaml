id: TMA-ROS1-3.4.3.5
title: Ensure outbound and established connections are configured
description: Configure the firewall rules for new outbound, and established connections Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- network
reference: CIS ROS Melodic Benchmark v1.0.0 - 3.4.3.5 Ensure outbound and established connections are configured
audit:
  type: manual
  command: 'Run the following commands and verify all rules for established incoming connections match site policy: site policy: # nft list ruleset | awk ''/hook input/,/}/'' | grep -E ''ip protocol (tcp|udp|icmp) ct state'' Output should be similar to: ip protocol tcp ct state established accept ip protocol udp ct state established accept ip protocol icmp ct state established accept Run the folllowing command and verify all rules for new and established outbound connections match site policy # nft list ruleset | awk ''/hook output/,/}/'' | grep -E ''ip protocol (tcp|udp|icmp) ct state'' Output should be similar ...'
remediation:
  type: iac_patch
  command: 'Configure nftables in accordance with site policy. The following commands will implement a policy to allow all outbound connections and all established connections: # nft add rule inet filter input ip protocol tcp ct state established accept # nft add rule inet filter input ip protocol udp ct state established accept # nft add rule inet filter input ip protocol icmp ct state established accept # nft add rule inet filter output ip protocol tcp ct state new,related,established accept # nft add rule inet filter output ip protocol udp ct state new,related,established accept # nft add rule inet filter output ip protocol icmp ct state new,related,established accept'
