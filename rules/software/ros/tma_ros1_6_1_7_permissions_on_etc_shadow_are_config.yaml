id: TMA-ROS1-6.1.7
title: Ensure permissions on /etc/shadow- are configured
description: The /etc/shadow- file is used to store backup information about user accounts that is critical to the security of those accounts, such as the hashed password and other security information. The audit requires /etc/shadow- owned by root, group root or shadow, mode 0640 or more restrictive. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.1.7 Ensure permissions on /etc/shadow- are configured
audit:
  type: command
  shell: bash
  command: |-
    sg=$(awk -F: '$1 == "shadow" {print $3}' /etc/group)
    [ -e /etc/shadow- ] || { echo '/etc/shadow- not found'; exit 1; }
    set -- $(stat -Lc '%a %u %g' /etc/shadow-) || exit 1
    m=$((8#$1)); [ $((m & ~8#0640)) -eq 0 ] || { echo "/etc/shadow- mode $1 exceeds 0640"; exit 1; }
    [ "$2" = 0 ] || { echo "/etc/shadow- uid $2"; exit 1; }
    case " 0 ${sg:-0} " in *" $3 "*) echo compliant ;; *) echo "/etc/shadow- gid $3" ;; esac
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to set permissions on /etc/shadow-: # chown root:shadow /etc/shadow- # chmod u-x,go-rwx /etc/shadow-'
