id: TMA-ROS1-5.3.3
title: Ensure password reuse is limited
description: The /etc/security/opasswd file stores the users' old passwords and can be checked to ensure that users are not recycling recent passwords. The audit requires pam_pwhistory.so with remember=5 or more in /etc/pam.d/common-password. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- access-control
reference: CIS ROS Melodic Benchmark v1.0.0 - 5.3.3 Ensure password reuse is limited
audit:
  type: command
  shell: bash
  command: |-
    l=$(grep -E '^\s*password\s+required\s+pam_pwhistory\.so' /etc/pam.d/common-password) || { echo 'pam_pwhistory not configured'; exit 1; }
    r=$(printf '%s\n' "$l" | grep -Eo 'remember=[0-9]+' | cut -d= -f2 | head -n 1)
    [ "${r:-0}" -ge 5 ] && echo compliant || echo "remember=${r:-unset}"
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Edit the /etc/pam.d/common-password file to include the remember option and conform to site policy as shown: password required pam_pwhistory.so remember=5'
