id: TMA-ROS1-3.4.2.4
title: Ensure outbound connections are configured
description: Configure the firewall rules for new outbound connections. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- network
reference: CIS ROS Melodic Benchmark v1.0.0 - 3.4.2.4 Ensure outbound connections are configured
audit:
  type: manual
  command: 'Run the following command and verify all rules for new outbound connections match site policy: # ufw status numbered'
remediation:
  type: iac_patch
  command: 'Configure ufw in accordance with site policy. The following commands will implement a policy to allow all outbound connections on all interfaces: # ufw allow out on all'
