id: TMA-ROS1-3.4.3.1
title: Ensure iptables are flushed
description: nftables is a replacement for iptables, ip6tables, ebtables and arptables Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- network
reference: CIS ROS Melodic Benchmark v1.0.0 - 3.4.3.1 Ensure iptables are flushed
audit:
  type: manual
  command: 'Run the following commands to ensure no iptables rules exist For iptables: # iptables -L No rules shoulb be returned For ip6tables: # ip6tables -L No rules should be returned'
remediation:
  type: iac_patch
  command: 'Run the following commands to flush iptables: For iptables: # iptables -F For ip6tables # ip6tables -F'
