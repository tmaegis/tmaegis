id: TMA-ROS1-1.1.6
title: Ensure separate partition exists for /var
description: The /var directory is used by daemons and other system services to temporarily store dynamic data. Some directories created by these processes may be world-writable. The audit requires /var to be a separate mount (findmnt). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: low
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.1.6 Ensure separate partition exists for /var
audit:
  type: command
  shell: bash
  command: findmnt -kn /var >/dev/null 2>&1 && echo compliant || echo '/var is not a separate partition'
  expected_output: compliant
remediation:
  type: iac_patch
  command: For new installations, during installation create a custom partition setup and specify a separate partition for /var . For systems that were previously installed, create a new partition and configure /etc/fstab as appropriate.
