id: TMA-ROS1-1.2.1
title: Ensure package manager repositories are configured
description: Systems need to have package manager repositories configured to ensure they receive the latest patches and updates. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.2.1 Ensure package manager repositories are configured
audit:
  type: manual
  command: 'Run the following command and verify package repositories are configured correctly: # apt-cache policy'
remediation:
  type: iac_patch
  command: Configure your package manager repositories according to site policy.
