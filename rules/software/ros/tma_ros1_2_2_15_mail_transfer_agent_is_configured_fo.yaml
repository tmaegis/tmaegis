id: TMA-ROS1-2.2.15
title: Ensure mail transfer agent is configured for local-only mode
description: Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming mail and transfer the messages to the appropriate user or mail server. If the system is not intended to be a mail server, it is recommended that the MTA be configured to only process local mail. The audit requires nothing to listen on port 25 except 127.0.0.1 and ::1 (ss). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- services
reference: CIS ROS Melodic Benchmark v1.0.0 - 2.2.15 Ensure mail transfer agent is configured for local-only mode
audit:
  type: command
  shell: bash
  command: |-
    command -v ss >/dev/null 2>&1 || exit 1
    l=$(ss -Hlntu 2>/dev/null | awk '$5 ~ /:25$/ {print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]|::1):25$')
    [ -z "$l" ] && echo compliant || echo "MTA listening on: $(printf '%s ' $l)"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    if command -v postconf >/dev/null 2>&1; then
      tma_bak /etc/postfix/main.cf
      postconf -e 'inet_interfaces = loopback-only'
      systemctl try-restart postfix 2>/dev/null || postfix reload 2>/dev/null
    elif [ -f /etc/exim4/update-exim4.conf.conf ]; then
      tma_bak /etc/exim4/update-exim4.conf.conf
      if grep -q '^dc_local_interfaces=' /etc/exim4/update-exim4.conf.conf; then sed -i "s/^dc_local_interfaces=.*/dc_local_interfaces='127.0.0.1 ; ::1'/" /etc/exim4/update-exim4.conf.conf
      else echo "dc_local_interfaces='127.0.0.1 ; ::1'" >> /etc/exim4/update-exim4.conf.conf; fi
      update-exim4.conf 2>/dev/null; systemctl try-restart exim4 2>/dev/null
    elif [ -f /etc/exim/exim.conf ]; then
      tma_bak /etc/exim/exim.conf
      grep -q '^local_interfaces' /etc/exim/exim.conf && sed -i 's/^local_interfaces.*/local_interfaces = <; 127.0.0.1 ; ::1/' /etc/exim/exim.conf || sed -i '1i local_interfaces = <; 127.0.0.1 ; ::1' /etc/exim/exim.conf
      systemctl try-restart exim 2>/dev/null
    fi
    true
  guidance: "Edit /etc/postfix/main.cf and add the following line to the RECEIVING MAIL section. If the line already exists, change it to look like the line below: inet_interfaces = loopback-only Restart postfix: # systemctl restart postfix"
