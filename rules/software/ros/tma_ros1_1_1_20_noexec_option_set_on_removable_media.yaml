id: TMA-ROS1-1.1.20
title: Ensure noexec option set on removable media partitions
description: The noexec mount option specifies that the filesystem cannot contain executable binaries. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.1.20 Ensure noexec option set on removable media partitions
audit:
  type: manual
  command: 'Run the following command and verify that the noexec option is set on all removable media partitions. # mount'
remediation:
  type: iac_patch
  command: Edit the /etc/fstab file and add noexec to the fourth field (mounting options) of all removable media partitions. Look for entries that have mount points that contain words such as floppy or cdrom. See the fstab(5) manual page for more information.
