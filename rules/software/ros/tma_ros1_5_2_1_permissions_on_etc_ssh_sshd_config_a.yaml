id: TMA-ROS1-5.2.1
title: Ensure permissions on /etc/ssh/sshd_config are configured
description: The /etc/ssh/sshd_config file contains configuration specifications for sshd. The command below sets the owner and group of the file to root. The audit requires /etc/ssh/sshd_config root:root with no group/other permissions. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- access-control
reference: CIS ROS Melodic Benchmark v1.0.0 - 5.2.1 Ensure permissions on /etc/ssh/sshd_config are configured
audit:
  type: command
  shell: bash
  command: |-
    [ -e /etc/ssh/sshd_config ] || { echo '/etc/ssh/sshd_config not found'; exit 1; }
    set -- $(stat -Lc '%a %u %g' /etc/ssh/sshd_config) || exit 1
    m=$((8#$1)); [ $((m & ~8#0600)) -eq 0 ] || { echo "/etc/ssh/sshd_config mode $1 exceeds 0600"; exit 1; }
    [ "$2" = 0 ] || { echo "/etc/ssh/sshd_config uid $2"; exit 1; }
    case " 0 " in *" $3 "*) echo compliant ;; *) echo "/etc/ssh/sshd_config gid $3" ;; esac
  expected_output: compliant
  requires_file:
  - /etc/ssh/sshd_config
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for f in /etc/ssh/sshd_config $(find /etc/ssh/sshd_config.d -type f 2>/dev/null); do
      [ -e "$f" ] || continue
      chown root:root "$f"; m=$(stat -Lc %a "$f"); chmod "$(printf '%o' $((8#$m & 8#0600)))" "$f"
    done
    exit 0
  guidance: "Run the following commands to set ownership and permissions on /etc/ssh/sshd_config: # chown root:root /etc/ssh/sshd_config # chmod og-rwx /etc/ssh/sshd_config"
