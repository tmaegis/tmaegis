id: TMA-ROS1-4.1.3
title: Ensure events that modify date and time information are collected
description: Capture events where the system date and/or time has been modified. The parameters in this section are set to determine if the adjtimex (tune kernel clock), settimeofday (Set time, using timeval and timezone structures) stime (using seconds since 1/1/1970) or clock_settime (allows for the setting of several internal clocks and timers) system calls have been executed and always ... The audit inspects the loaded rules (auditctl -l, 64-bit syscalls). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- logging
reference: CIS ROS Melodic Benchmark v1.0.0 - 4.1.3 Ensure events that modify date and time information are collected
audit:
  type: command
  shell: bash
  command: |-
    command -v auditctl >/dev/null 2>&1 || exit 1
    out=$(auditctl -l 2>/dev/null) || exit 1
    bad=0
    printf '%s\n' "$out" | grep -E -- '(-k |key=)time-change( |$)' | grep -Fq -- '-w /etc/localtime ' || { echo 'missing watch: -w /etc/localtime -k time-change'; bad=1; }
    printf '%s\n' "$out" | grep -E -- '(-k |key=)time-change( |$)' | grep -F 'arch=b64' | grep -Eq -- '-S ([^ ]*,)?adjtimex(,| |$)' || { echo 'missing b64 syscall rule: adjtimex -k time-change'; bad=1; }
    printf '%s\n' "$out" | grep -E -- '(-k |key=)time-change( |$)' | grep -F 'arch=b64' | grep -Eq -- '-S ([^ ]*,)?settimeofday(,| |$)' || { echo 'missing b64 syscall rule: settimeofday -k time-change'; bad=1; }
    printf '%s\n' "$out" | grep -E -- '(-k |key=)time-change( |$)' | grep -F 'arch=b64' | grep -Eq -- '-S ([^ ]*,)?clock_settime(,| |$)' || { echo 'missing b64 syscall rule: clock_settime -k time-change'; bad=1; }
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'For 32 bit systems Edit or create a file in the /etc/audit/rules.d/ directory ending in .rules Example: vi /etc/audit/rules.d/time-change.rules and add the following lines: -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time- change -a always,exit -F arch=b32 -S clock_settime -k time-change -w /etc/localtime -p wa -k time-change For 64 bit systems Edit or create a file in the /etc/audit/rules.d/ directory ending in .rules Example: vi /etc/audit/rules.d/time-change.rules and add the following lines: -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time- change -a always,exit -F ...'
