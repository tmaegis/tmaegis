id: TMA-ROS1-6.1.1
title: Audit system file permissions
description: The Ubuntu package manager has a number of useful options. One of these, the --verify option, can be used to verify that system packages are correctly installed. The --verify option can be used to verify a particular package or to verify all system packages. If no output is returned, the package is installed correctly. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.1.1 Audit system file permissions
audit:
  type: manual
  command: 'Run the following command to review all installed packages. Note that this may be very time consuming and may be best scheduled via the cron utility. It is recommended that the output of this command be redirected to a file that can be reviewed later. # dpkg --verify <package name>'
remediation:
  type: iac_patch
  command: Correct any discrepancies found and rerun the audit until output is clean or risk is mitigated or accepted.
