id: TMA-ROS1-5.3.2
title: Ensure lockout for failed password attempts is configured
description: Lock out users after n unsuccessful consecutive login attempts. The first sets of changes are made to the PAM configuration files. The second set of changes are applied to the program specific PAM configuration file. The second set of changes must be applied to each program that will lock out users. The audit requires pam_tally2.so with deny=5 or less in common-auth and pam_deny.so plus pam_tally2.so in common-account (the benchmark example also sets unlock_time=900). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- access-control
reference: CIS ROS Melodic Benchmark v1.0.0 - 5.3.2 Ensure lockout for failed password attempts is configured
audit:
  type: command
  shell: bash
  command: |-
    a=$(grep -E '^\s*auth\s+required\s+pam_tally2\.so' /etc/pam.d/common-auth) || { echo 'pam_tally2 not in common-auth'; exit 1; }
    d=$(printf '%s\n' "$a" | grep -Eo 'deny=[0-9]+' | cut -d= -f2); [ -n "$d" ] && [ "$d" -ge 1 ] && [ "$d" -le 5 ] || { echo "deny=${d:-unset}"; exit 1; }
    grep -Eq '^\s*account\s+\S+\s+pam_deny\.so' /etc/pam.d/common-account && grep -Eq '^\s*account\s+required\s+pam_tally2\.so' /etc/pam.d/common-account && echo compliant || echo 'pam_deny/pam_tally2 not in common-account'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Edit the /etc/pam.d/common-auth file and add the auth line below: auth required pam_tally2.so onerr=fail audit silent deny=5 unlock_time=900 Edit the /etc/pam.d/common-account file and add the account lines bellow: account requisite pam_deny.so account required pam_tally.so Note: If a user has been locked out because they have reached the maximum consecutive failure count defined by deny= in the pam_tally2.so module, the user can be unlocked by issuing the command /sbin/pam_tally2 -u <username> --reset. This command sets the failed count to 0, effectively unlocking the user.'
