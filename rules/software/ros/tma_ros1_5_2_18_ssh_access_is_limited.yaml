id: TMA-ROS1-5.2.18
title: Ensure SSH access is limited
description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended that at least one of the following options be leveraged: AllowUsers The AllowUsers variable gives the system administrator the option of allowing specific users to ssh into the system. The list consists of space separated user names. The audit requires at least one of AllowUsers, AllowGroups, DenyUsers or DenyGroups. The audit reads the effective sshd configuration (sshd -T, root). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.'
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- access-control
reference: CIS ROS Melodic Benchmark v1.0.0 - 5.2.18 Ensure SSH access is limited
audit:
  type: command
  shell: bash
  command: |-
    command -v sshd >/dev/null 2>&1 || exit 1
    out=$(sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I 2>/dev/null | cut -d' ' -f1)" 2>/dev/null) || out=$(sshd -T 2>/dev/null) || exit 1
    printf '%s\n' "$out" | grep -Eiq '^(allowusers|allowgroups|denyusers|denygroups)\s+\S+' && echo compliant || echo 'no AllowUsers/AllowGroups/DenyUsers/DenyGroups'
  expected_output: compliant
  requires_file:
  - /etc/ssh/sshd_config
remediation:
  type: iac_patch
  command: 'Edit the /etc/ssh/sshd_config file to set one or more of the parameter as follows: AllowUsers <userlist> AllowGroups <grouplist> DenyUsers <userlist> DenyGroups <grouplist>'
