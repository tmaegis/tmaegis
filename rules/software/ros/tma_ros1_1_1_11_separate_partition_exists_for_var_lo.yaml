id: TMA-ROS1-1.1.11
title: Ensure separate partition exists for /var/log
description: The /var/log directory is used by system services to store log data . The audit requires /var/log to be a separate mount (findmnt). Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: low
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.1.11 Ensure separate partition exists for /var/log
audit:
  type: command
  shell: bash
  command: findmnt -kn /var/log >/dev/null 2>&1 && echo compliant || echo '/var/log is not a separate partition'
  expected_output: compliant
remediation:
  type: iac_patch
  command: For new installations, during installation create a custom partition setup and specify a separate partition for /var/log . For systems that were previously installed, create a new partition and configure /etc/fstab as appropriate.
