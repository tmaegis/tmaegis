id: TMA-ROS1-6.2.15
title: Ensure no duplicate user names exist
description: Although the useradd program will not let you create a duplicate user name, it is possible for an administrator to manually edit the /etc/passwd file and change the user name. The audit requires no duplicate user names in /etc/passwd. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.2.15 Ensure no duplicate user names exist
audit:
  type: command
  shell: bash
  command: |-
    d=$(cut -d: -f1 /etc/passwd | sort | uniq -d) || exit 1
    [ -z "$d" ] && echo compliant || { echo 'duplicate user names:'; printf '%s\n' "$d"; }
  expected_output: compliant
remediation:
  type: iac_patch
  command: Based on the results of the audit script, establish unique user names for the users. File ownerships will automatically reflect the change as long as the users have unique UIDs.
