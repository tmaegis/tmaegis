id: TMA-ROS1-4.2.1.6
title: Ensure remote rsyslog messages are only accepted on designated log hosts.
description: By default, rsyslog does not listen for log messages coming in from remote systems. The ModLoad tells rsyslog to load the imtcp.so module so it can listen over a network via TCP. The InputTCPServerRun option instructs rsyslogd to listen on the specified TCP port. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- logging
reference: CIS ROS Melodic Benchmark v1.0.0 - 4.2.1.6 Ensure remote rsyslog messages are only accepted on designated log hosts.
audit:
  type: manual
  command: 'Run the following commands and verify the resulting lines are uncommented on designated log hosts and commented or removed on all others: # grep ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf $ModLoad imtcp # grep ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf $InputTCPServerRun 514'
remediation:
  type: iac_patch
  command: 'For hosts that are designated as log hosts, edit the /etc/rsyslog.conf file and un- comment or add the following lines: $ModLoad imtcp $InputTCPServerRun 514 For hosts that are not designated as log hosts, edit the /etc/rsyslog.conf file and comment or remove the following lines: # $ModLoad imtcp # $InputTCPServerRun 514 Run the following command to reload the rsyslogd configuration: # systemctl restart rsyslog'
