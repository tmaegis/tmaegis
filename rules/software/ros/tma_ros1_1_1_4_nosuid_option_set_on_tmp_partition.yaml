id: TMA-ROS1-1.1.4
title: Ensure nosuid option set on /tmp partition
description: The nosuid mount option specifies that the filesystem cannot contain setuid files. The audit requires the nosuid mount option on /tmp when it is a separate mount (findmnt); not applicable otherwise. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.1.4 Ensure nosuid option set on /tmp partition
audit:
  type: command
  shell: bash
  command: if ! findmnt -kn /tmp >/dev/null 2>&1; then echo compliant; elif findmnt -kn -o OPTIONS /tmp | tr ',' '\n' | grep -qx -- nosuid; then echo compliant; else echo '/tmp is mounted without nosuid'; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/tmp; o=nosuid
    findmnt -kn "$p" >/dev/null 2>&1 || exit 0
    if grep -qE "^[^#][^[:space:]]*[[:space:]]+$p[[:space:]]" /etc/fstab 2>/dev/null; then
      awk -v p="$p" -v o="$o" '$0 !~ /^#/ && $2==p { n=split($4,a,","); f=0; for(i=1;i<=n;i++) if(a[i]==o) f=1; if(!f) $4=$4","o } {print}' OFS='\t' /etc/fstab > /etc/fstab.tma && cat /etc/fstab.tma > /etc/fstab && rm -f /etc/fstab.tma
    fi
    mount -o "remount,$o" "$p" 2>/dev/null || true; true
  guidance: "Edit the /etc/fstab file and add nosuid to the fourth field (mounting options) for the /tmp partition. See the fstab(5) manual page for more information. Run the following command to remount /tmp : # mount -o remount,nosuid /tmp or Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to add nosuid to the /tmp mount options: [Mount] Options=mode=1777,strictatime,noexec,nodev,nosuid Run the following command to remount /tmp : # mount -o remount,nosuid /tmp"
