id: TMA-ROS1-6.2.12
title: Ensure all groups in /etc/passwd exist in /etc/group
description: Over time, system administration errors and changes can lead to groups being defined in /etc/passwd but not in /etc/group . The audit requires every primary GID in /etc/passwd to exist in /etc/group. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.2.12 Ensure all groups in /etc/passwd exist in /etc/group
audit:
  type: command
  shell: bash
  command: |-
    bad=$(awk -F: '{print $4}' /etc/passwd | sort -u | while read -r g; do awk -F: -v g="$g" '$3 == g {f=1} END {exit !f}' /etc/group || echo "GID $g in /etc/passwd does not exist in /etc/group"; done)
    [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for g in $(awk -F: '{print $4}' /etc/passwd | sort -u); do
      case "$g" in ''|*[!0-9]*) continue;; esac
      awk -F: -v g="$g" '$3==g{f=1} END{exit !f}' /etc/group && continue
      n=tmaegis_gid$g
      getent group "$n" >/dev/null || groupadd -g "$g" "$n" || groupadd -o -g "$g" "$n"
    done
    true
  guidance: "Analyze the output of the Audit step above and perform the appropriate action to correct any discrepancies found."
