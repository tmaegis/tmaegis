id: TMA-ROS1-1.8.1.4
title: Ensure permissions on /etc/motd are configured
description: The contents of the /etc/motd file are displayed to users after login and function as a message of the day for authenticated users. The audit requires /etc/motd (if present) to be root:root with mode 644 or stricter. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: low
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.8.1.4 Ensure permissions on /etc/motd are configured
audit:
  type: command
  shell: bash
  command: |-
    [ -e /etc/motd ] || { echo compliant; exit 0; }
    set -- $(stat -Lc '%a %u %g' /etc/motd) || exit 1
    m=$((8#$1)); [ $((m & ~8#0644)) -eq 0 ] || { echo "/etc/motd mode $1 exceeds 0644"; exit 1; }
    [ "$2" = 0 ] || { echo "/etc/motd uid $2"; exit 1; }
    case " 0 " in *" $3 "*) echo compliant ;; *) echo "/etc/motd gid $3" ;; esac
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to set permissions on /etc/motd : # chown root:root /etc/motd # chmod u-x,go-wx /etc/motd'
