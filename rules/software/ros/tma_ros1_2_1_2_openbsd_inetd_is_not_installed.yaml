id: TMA-ROS1-2.1.2
title: Ensure openbsd-inetd is not installed
description: The inetd daemon listens for well known services and dispatches the appropriate daemon to properly respond to service requests. The audit requires openbsd-inetd not to be installed. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- services
reference: CIS ROS Melodic Benchmark v1.0.0 - 2.1.2 Ensure openbsd-inetd is not installed
audit:
  type: command
  shell: bash
  command: |-
    command -v dpkg-query >/dev/null 2>&1 || exit 1
    bad=0
    for p in openbsd-inetd; do
      s=$(dpkg-query -W -f='${Status}' "$p" 2>/dev/null)
      case "$s" in *' installed') echo "$p is installed"; bad=1 ;; esac
    done
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to uninstall openbsd-inetd: apt-get remove openbsd-inetd'
