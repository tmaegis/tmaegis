id: TMA-ROS1-6.1.3
title: Ensure permissions on /etc/gshadow- are configured
description: The /etc/gshadow- file is used to store backup information about groups that is critical to the security of those accounts, such as the hashed password and other security information. The audit requires /etc/gshadow- owned by root, group root or shadow, mode 0640 or more restrictive. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.1.3 Ensure permissions on /etc/gshadow- are configured
audit:
  type: command
  shell: bash
  command: |-
    sg=$(awk -F: '$1 == "shadow" {print $3}' /etc/group)
    [ -e /etc/gshadow- ] || { echo '/etc/gshadow- not found'; exit 1; }
    set -- $(stat -Lc '%a %u %g' /etc/gshadow-) || exit 1
    m=$((8#$1)); [ $((m & ~8#0640)) -eq 0 ] || { echo "/etc/gshadow- mode $1 exceeds 0640"; exit 1; }
    [ "$2" = 0 ] || { echo "/etc/gshadow- uid $2"; exit 1; }
    case " 0 ${sg:-0} " in *" $3 "*) echo compliant ;; *) echo "/etc/gshadow- gid $3" ;; esac
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the one of the following chown commands as appropriate and the chmod to set permissions on /etc/gshadow- : # chown root:root /etc/gshadow- OR # chown root:shadow /etc/gshadow- # chmod g-wx,o-rwx /etc/gshadow-'
