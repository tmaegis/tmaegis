id: TMA-ROS1-1.9
title: Ensure updates, patches, and additional security software are installed
description: Periodically patches are released for included software either due to security flaws or to include additional functionality. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.9 Ensure updates, patches, and additional security software are installed
audit:
  type: manual
  command: 'Verify there are no updates or patches to install: # apt -s upgrade'
remediation:
  type: iac_patch
  command: 'Use your package manager to update all packages on the system according to site policy. Run the following command to update all packages following local site policy guidance on applying updates and patches: # apt upgrade OR # apt dist-upgrade'
