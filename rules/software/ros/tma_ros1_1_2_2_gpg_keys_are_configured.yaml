id: TMA-ROS1-1.2.2
title: Ensure GPG keys are configured
description: Most packages managers implement GPG key signing to verify package integrity during installation. Manual review against site policy. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- system
reference: CIS ROS Melodic Benchmark v1.0.0 - 1.2.2 Ensure GPG keys are configured
audit:
  type: manual
  command: 'Verify GPG keys are configured correctly for your package manager: # apt-key list'
remediation:
  type: iac_patch
  command: Update your package manager GPG keys in accordance with site policy.
