id: TMA-ROS1-6.1.2
title: Ensure permissions on /etc/passwd are configured
description: The /etc/passwd file contains user account information that is used by many system utilities and therefore must be readable for these utilities to operate. The audit requires /etc/passwd owned by root, group root, mode 0644 or more restrictive. Host-level control from the CIS ROS Melodic benchmark (Ubuntu 18.04 robot hosts); run as root.
target: ros
level: 1
severity: medium
tags:
- ros
- ros1
- melodic
- maintenance
reference: CIS ROS Melodic Benchmark v1.0.0 - 6.1.2 Ensure permissions on /etc/passwd are configured
audit:
  type: command
  shell: bash
  command: |-
    [ -e /etc/passwd ] || { echo '/etc/passwd not found'; exit 1; }
    set -- $(stat -Lc '%a %u %g' /etc/passwd) || exit 1
    m=$((8#$1)); [ $((m & ~8#0644)) -eq 0 ] || { echo "/etc/passwd mode $1 exceeds 0644"; exit 1; }
    [ "$2" = 0 ] || { echo "/etc/passwd uid $2"; exit 1; }
    case " 0 " in *" $3 "*) echo compliant ;; *) echo "/etc/passwd gid $3" ;; esac
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/passwd
    [ -e "$p" ] || exit 0
    chown root:root "$p" 2>/dev/null || chown root "$p"
    chmod 644 "$p"
  guidance: "Run the following command to set permissions on /etc/passwd: # chown root:root /etc/passwd # chmod u-x,go-wx /etc/passwd"
