id: TMA-NGINX-4.1.12
title: Ensure HTTP/3.0 is used
description: HTTP/2 is the established standard for web communication, offering significant performance benefits over HTTP/1.1 through multiplexing. For 2025 and beyond, HTTP/3 should also be enabled. HTTP/3 operates over the QUIC protocol, which is built on UDP, to solve head-of-line blocking, reduce connection setup time, and improve performance on unreliable networks. Requires HTTP/2 on the TCP listener (listen ... http2 or http2 on), a listen ... quic UDP listener and an Alt-Svc header advertising h3. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 2
severity: low
tags:
- nginx
- tls
reference: CIS NGINX Benchmark v3.0.0 - 4.1.12 Ensure HTTP/3.0 is used
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="listen" && $0~/http2/ {h2=1} $1=="http2" && a(2)=="on"{h2=1} $1=="listen" && $0~/quic/ {q=1} $1=="add_header" && tolower(a(2))=="alt-svc" && $0~/h3=/ {alt=1} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (h2&&q&&alt)?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: iac_patch
  command: listen 443 ssl; http2 on; listen 443 quic reuseport; add_header Alt-Svc 'h3=":443"; ma=86400' always; Then run nginx -t and reload nginx.
