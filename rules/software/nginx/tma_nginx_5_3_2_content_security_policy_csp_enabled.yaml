id: TMA-NGINX-5.3.2
title: Ensure that Content Security Policy (CSP) is enabled and configured properly
description: Content Security Policy (CSP) is an HTTP response header that allows site administrators to declare approved sources of content that browsers are allowed to load on that page. It is a mechanism to detect and mitigate certain types of attacks, including Cross-Site Scripting (XSS) and data injection attacks. Every Content-Security-Policy add_header must contain default-src and frame-ancestors, avoid unsafe-inline/unsafe-eval and carry always. Whether the policy is restrictive enough still needs review. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 2
severity: low
tags:
- nginx
- headers
reference: CIS NGINX Benchmark v3.0.0 - 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="add_header" && tolower(a(2))=="content-security-policy"{n++; l=tolower($0); if((l~/default-src/ && l~/frame-ancestors/ && l!~/unsafe-inline/ && l!~/unsafe-eval/) && a(NF)=="always") ok++} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (n>0&&ok==n)?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: iac_patch
  command: add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always; Then run nginx -t and reload nginx.
