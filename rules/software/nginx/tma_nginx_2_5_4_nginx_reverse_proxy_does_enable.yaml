id: TMA-NGINX-2.5.4
title: Ensure the NGINX reverse proxy does not enable information disclosure
description: 'When NGINX acts as a reverse proxy, it forwards headers sent by the upstream application (e.g., "X-Powered-By: Custom_APP" or "Server: Apache/2.4"). These headers should be stripped before the response reaches the client to prevent information disclosure about the backend infrastructure. When proxy_pass (or fastcgi_pass) is used, proxy_hide_header (fastcgi_hide_header) must hide both X-Powered-By and Server. Compliant when NGINX proxies nothing. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.'
target: nginx
level: 1
severity: low
tags:
- nginx
- information-disclosure
reference: CIS NGINX Benchmark v3.0.0 - 2.5.4 Ensure the NGINX reverse proxy does not enable information disclosure
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="proxy_pass"{p=1} $1=="fastcgi_pass"{f=1} $1=="proxy_hide_header"{h=tolower(a(2)); if(h=="x-powered-by") px=1; if(h=="server") ps=1} $1=="fastcgi_hide_header"{h=tolower(a(2)); if(h=="x-powered-by") fx=1; if(h=="server") fs=1} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print ((!p||(px&&ps))&&(!f||(fx&&fs)))?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Add 'proxy_hide_header X-Powered-By;' and 'proxy_hide_header Server;' (fastcgi_hide_header for FastCGI) to the http block. Then run nginx -t and reload nginx.
