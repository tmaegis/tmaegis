id: TMA-NGINX-5.3.3
title: Ensure the Referrer Policy is enabled and configured properly
description: The Referrer-Policy HTTP header controls how much referrer information (sent via the Referer header) should be included with requests. It allows site administrators to restrict the data sent to upstream servers when a user clicks a link or loads a resource. This is a privacy control to prevent leaking sensitive URL parameters or internal path structures to third parties. Every Referrer-Policy add_header must use no-referrer, same-origin, strict-origin or strict-origin-when-cross-origin and carry always. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 2
severity: low
tags:
- nginx
- headers
reference: CIS NGINX Benchmark v3.0.0 - 5.3.3 Ensure the Referrer Policy is enabled and configured properly
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="add_header" && tolower(a(2))=="referrer-policy"{n++; l=tolower($0); if((l~/(no-referrer|same-origin|strict-origin)/ && l!~/no-referrer-when-downgrade/) && a(NF)=="always") ok++} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (n>0&&ok==n)?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v nginx >/dev/null 2>&1 || exit 0
    tma_audit() ( out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="add_header" && tolower(a(2))=="referrer-policy"{n++; l=tolower($0); if((l~/(no-referrer|same-origin|strict-origin)/ && l!~/no-referrer-when-downgrade/) && a(NF)=="always") ok++} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (n>0&&ok==n)?"compliant":"noncompliant"}'
    )
    tma_ok() { [ "$(tma_audit 2>/dev/null | tail -n 1)" = compliant ]; }
    tma_ok && exit 0
    files=$(nginx -T 2>/dev/null | sed -n 's/^# configuration file \(.*\):$/\1/p' | sort -u)
    main=$(nginx -t 2>&1 | sed -n 's/.*the configuration file \([^ ]*\) syntax is ok.*/\1/p' | head -n 1)
    [ -f "$main" ] || main=/etc/nginx/nginx.conf
    [ -f "$main" ] || exit 1
    bk=$(mktemp -d) || exit 1
    for f in $files; do mkdir -p "$bk$(dirname "$f")"; cp -p "$f" "$bk$f"; done
    tma_restore() { for f in $files; do cp -p "$bk$f" "$f"; done; }
    tma_http() { sed -i -E "0,/^([[:space:]]*)http[[:space:]]*\{/s||&\n\1    $1|" "$main"; }
    for f in $files; do [ -w "$f" ] && sed -i -E -e '/^[[:space:]]*add_header[[:space:]]+Referrer-Policy[[:space:]]/I{/always;/!s/;([[:space:]]*(#.*)?)$/ always;\1/}' "$f"; done
    tma_ok || tma_http 'add_header Referrer-Policy "no-referrer" always;'
    nginx -t >/dev/null 2>&1 || { tma_restore; echo "nginx -t failed, change rolled back" >&2; exit 1; }
    nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null; rm -rf "$bk"; true
  guidance: "add_header Referrer-Policy \"strict-origin-when-cross-origin\" always; Then run nginx -t and reload nginx."
