id: TMA-NGINX-4.1.9
title: Ensure upstream server traffic is authenticated with a client certificate
description: In a reverse proxy configuration, NGINX acts as a client when communicating with an upstream server. To secure this server-to-server connection based on a Zero Trust principle, mutual TLS (mTLS) must be used. This is achieved by configuring NGINX to present its own client certificate to the upstream server. When proxy_pass https:// is used, proxy_ssl_certificate and proxy_ssl_certificate_key must be configured. The upstream side (requiring client certificates) is not checked; compliant when no TLS upstream exists. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 1
severity: medium
tags:
- nginx
- tls
reference: CIS NGINX Benchmark v3.0.0 - 4.1.9 Ensure upstream server traffic is authenticated with a client certificate
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="proxy_pass" && a(2)~/^https:/ {hp=1} $1=="proxy_ssl_certificate"{c=1} $1=="proxy_ssl_certificate_key"{k=1} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (!hp||(c&&k))?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Add 'proxy_ssl_certificate /etc/nginx/ssl/client.crt; proxy_ssl_certificate_key /etc/nginx/ssl/client.key;' to the proxied locations. Then run nginx -t and reload nginx.
