id: TMA-NGINX-4.1.6
title: Ensure awareness of TLS 1.3 new Diffie-Hellman parameters
description: This control is not applicable to environments exclusively using TLS 1.3. The TLS 1.3 protocol (RFC 8446) deprecates the use of custom finite-field Diffie- Hellman (DHE) groups, which were configured via the ssl_dhparam directive in NGINX. Instead, TLS 1.3 exclusively uses a set of pre-defined, standardized, and secure elliptic curve (ECDHE) and finite-field (FFDHE) groups for its key exchange mechanism. Passes implicitly when TLS 1.3 is used exclusively (every ssl_protocols is TLSv1.3) and the obsolete ssl_dhparam directive is not configured. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 1
severity: low
tags:
- nginx
- tls
reference: CIS NGINX Benchmark v3.0.0 - 4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk '{l=$0; o=""; q=""; for(i=1;i<=length(l);i++){c=substr(l,i,1); if(q!=""){o=o c; if(c==q) q=""; continue} if(c=="\""||c=="\047"){q=c; o=o c; continue} if(c=="#") break; if(c==";"||c=="{"){print o c; o=""; continue} if(c=="}"){if(o~/[^[:space:]]/) print o; print "}"; o=""; continue} o=o c} if(o~/[^[:space:]]/) print o}' | awk 'function a(i,  x){x=$i; sub(/;$/,"",x); gsub(/["\047]/,"",x); return x} function inb(n,  i){for(i=1;i<=sp;i++) if(st[i]==n) return 1; return 0} $1=="ssl_protocols"{n++; if(NF!=2 || a(2)!="TLSv1.3") bad=1} $1=="ssl_dhparam"{bad=1} {o=gsub(/\{/,"{"); c=gsub(/\}/,"}"); while(o-->0){sp++; b=$1; sub(/\{.*/,"",b); st[sp]=b} while(c-->0 && sp>0) sp--} END{print (n>0&&!bad)?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Set 'ssl_protocols TLSv1.3;' and remove ssl_dhparam. Then run nginx -t and reload nginx.
