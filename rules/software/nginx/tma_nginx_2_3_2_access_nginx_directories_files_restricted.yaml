id: TMA-NGINX-2.3.2
title: Ensure access to NGINX directories and files is restricted
description: The NGINX configuration directory (/etc/nginx or equivalent) and its contents should have restrictive permissions to enforce the principle of least privilege. Directories should be accessible only by the root user and the root group (and potentially read/execute by the group), but not by others. Files should be readable/writable by root and readable by the group, but inaccessible to others. Counts directories under /etc/nginx more permissive than 750 and files more permissive than 640; expects 0. Evaluated on the merged configuration printed by `nginx -T` (all included files; needs permission to read them). CIS marks this recommendation Manual; the automated check implements its audit procedure.
target: nginx
level: 1
severity: medium
tags:
- nginx
- permissions
reference: CIS NGINX Benchmark v3.0.0 - 2.3.2 Ensure access to NGINX directories and files is restricted
audit:
  type: command
  command: '[ -d /etc/nginx ] || exit 1; { find /etc/nginx -type d -perm /027 -print; find /etc/nginx -type f -perm /137 -print; } 2>/dev/null | wc -l'
  expected_output: '0'
  requires_file:
  - /etc/nginx
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v nginx >/dev/null 2>&1 || exit 0
    find /etc/nginx -type d -exec chmod g-w,o-rwx {} + ; find /etc/nginx -type f -exec chmod u-x,g-wx,o-rwx {} +
  guidance: "find /etc/nginx -type d -exec chmod 750 {} + ; find /etc/nginx -type f -exec chmod 640 {} + (keep private keys at 400)."
