id: TMA-NGINX-X-FRAME-OPTIONS
title: Ensure the X-Frame-Options header is configured
description: X-Frame-Options (SAMEORIGIN or DENY) mitigates clickjacking. Note add_header in a nested block replaces, not extends, the parent set, so check location blocks too. Evaluated on the merged configuration from `nginx -T` (includes covered); requires permission to run nginx -T.
target: nginx
level: 1
severity: medium
tags:
- nginx
- headers
reference: CIS NGINX Benchmark - Ensure X-Frame-Options header is configured and enabled (verify section number for your release)
audit:
  type: command
  command: out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk 'tolower($1)=="add_header"{h=tolower($2); gsub(/["\047]/,"",h); if(h=="x-frame-options"){n++; if(tolower($0)~/(sameorigin|deny)/) ok++}} END{print (n>0&&ok==n)?"compliant":"noncompliant"}'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v nginx >/dev/null 2>&1 || exit 0
    tma_audit() ( out=$(nginx -T 2>/dev/null) || exit 1; printf '%s\n' "$out" | awk 'tolower($1)=="add_header"{h=tolower($2); gsub(/["\047]/,"",h); if(h=="x-frame-options"){n++; if(tolower($0)~/(sameorigin|deny)/) ok++}} END{print (n>0&&ok==n)?"compliant":"noncompliant"}'
    )
    tma_ok() { [ "$(tma_audit 2>/dev/null | tail -n 1)" = compliant ]; }
    tma_ok && exit 0
    files=$(nginx -T 2>/dev/null | sed -n 's/^# configuration file \(.*\):$/\1/p' | sort -u)
    main=$(nginx -t 2>&1 | sed -n 's/.*the configuration file \([^ ]*\) syntax is ok.*/\1/p' | head -n 1)
    [ -f "$main" ] || main=/etc/nginx/nginx.conf
    [ -f "$main" ] || exit 1
    bk=$(mktemp -d) || exit 1
    for f in $files; do mkdir -p "$bk$(dirname "$f")"; cp -p "$f" "$bk$f"; done
    tma_restore() { for f in $files; do cp -p "$bk$f" "$f"; done; }
    tma_http() { sed -i -E "0,/^([[:space:]]*)http[[:space:]]*\{/s||&\n\1    $1|" "$main"; }
    for f in $files; do [ -w "$f" ] && sed -i -E -e '/^[[:space:]]*add_header[[:space:]]+X-Frame-Options[[:space:]]/I{/always;/!s/;([[:space:]]*(#.*)?)$/ always;\1/}' "$f"; done
    tma_ok || tma_http 'add_header X-Frame-Options SAMEORIGIN always;'
    nginx -t >/dev/null 2>&1 || { tma_restore; echo "nginx -t failed, change rolled back" >&2; exit 1; }
    nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null; rm -rf "$bk"; true
  guidance: "Add 'add_header X-Frame-Options \"SAMEORIGIN\" always;' to each server block. Then run nginx -t and reload nginx."
