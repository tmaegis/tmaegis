id: TMA-NGINX-1.2.1
title: Ensure package manager repositories are properly configured
description: 'Package repositories must be trustworthy, properly configured, and maintained to ensure the system receives timely security patches, bug fixes, and support for modern protocols. While Operating System (OS) vendors provide NGINX packages, these versions are often frozen at older release points ("stable" but stale). Manual review: the benchmark gives no reliable automated check for this control.'
target: nginx
level: 1
severity: medium
tags:
- nginx
- installation
reference: CIS NGINX Benchmark v3.0.0 - 1.2.1 Ensure package manager repositories are properly configured
audit:
  type: manual
  command: 'To verify that package manager repositories are configured correctly and point to a trusted source (either the OS vendor or official NGINX), run the following commands: Red Hat / Rocky-Linux: dnf repolist -v | grep -i nginx Debian / Ubuntu: apt-cache policy nginx Evaluation: Verify that the repository URL points to a trusted domain (e.g., nginx.org, rhel..., ubuntu...). Ensure that the repository is enabled. Check that no unknown or untrusted third-party repositories are configured for NGINX.'
remediation:
  type: iac_patch
  command: 'Configure your package manager to use a trusted repository that meets your version requirements. To enable the official NGINX repository (Recommended for HTTP/3 support): Follow the instructions at nginx.org/en/linux_packages.html for your specific distribution. This typically involves adding the NGINX signing key and creating a repository configuration file.'
