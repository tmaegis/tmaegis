id: TMA-NGINX-1.2.2
title: Ensure the latest software package is installed
description: 'As new security vulnerabilities are discovered, the corresponding fixes are implemented by your NGINX software package provider. Installing the latest software version ensures these fixes are available on your system. Manual review: the benchmark gives no reliable automated check for this control.'
target: nginx
level: 1
severity: medium
tags:
- nginx
- installation
reference: CIS NGINX Benchmark v3.0.0 - 1.2.2 Ensure the latest software package is installed
audit:
  type: manual
  command: 'To verify your NGINX package is up to date, run the following command (example): Redhat: dnf info nginx'
remediation:
  type: iac_patch
  command: 'To install the latest NGINX package, run the following command (example): Redhat: dnf update nginx -y'
