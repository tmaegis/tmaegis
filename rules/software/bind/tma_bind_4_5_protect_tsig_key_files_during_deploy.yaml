id: TMA-BIND-4.5
title: Protect TSIG Key Files During Deployment
description: 'Do not expose the TSIG key files through insecure network transmission of the files when deployed, or via insecure permissions or shares on any intermediate systems used for the key deployment. Manual review: the check needs remote queries, architecture knowledge or site policy.'
target: bind
level: 1
severity: medium
tags:
- bind
- dns
- tsig
reference: CIS ISC BIND DNS Server 9.11 Benchmark v1.0.0 - 4.5 Protect TSIG Key Files During Deployment
audit:
  type: manual
  command: Review the technical procedure for generating and deploying the TSIG keys to ensure the files are not inappropriately disclosed on the original systems where the key is generated, on any intermediate systems, or file shares. Also, ensure that the process does not allow the keys to be copied over the network via clear text of weak file transfer protocols, such as telnet, ftp or rcp.
remediation:
  type: iac_patch
  command: 'Perform the following: ; Correct the deployment procedure to ensure secure transmission and intermediate storage protection of keys during deployment. ; Regenerate new keys via the corrected procedure and replace all previous TSIG keys.'
