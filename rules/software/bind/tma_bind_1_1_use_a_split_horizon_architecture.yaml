id: TMA-BIND-1.1
title: Use a Split-Horizon Architecture
description: 'Running a Split-Horizon DNS architecture refers to running authoritative DNS servers and services for external DNS queries separate from the internal authoritative DNS servers, which answer all queries originating from within the organization. Manual review: the check needs remote queries, architecture knowledge or site policy.'
target: bind
level: 1
severity: medium
tags:
- bind
- dns
- architecture
reference: CIS ISC BIND DNS Server 9.11 Benchmark v1.0.0 - 1.1 Use a Split-Horizon Architecture
audit:
  type: manual
  command: 'Perform the following to audit for compliance: Review the network and DNS architecture, and identify the external authoritative DNS servers along with the internal authoritative DNS servers to ensure they are separate and serve only external and only internal clients respectively. Review the external DNZ zones to ensure only minimal name information is included in the external zones. Perform a query of an internal only name to the external DNS servers to ensure they do not provide a positive response.'
remediation:
  type: iac_patch
  command: 'Perform the following for remediation: Implement Split-Horizon Architecture to separate external and internal DNS services. The external DNS servers should respond only to names of approved external services, such as web, email and VPN services.'
