id: TMA-SHAREPOINT-3.9
title: Ensure that SharePoint application servers are protected by a reverse proxy
description: A reverse proxy is server component that sits between the internet and the web servers. It accepts HTTPS requests, provides various services, and forwards the requests to one or many servers. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- network
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.9 Ensure that SharePoint application servers are protected by a reverse proxy
audit:
  type: manual
  command: Review the SharePoint architecture and network diagrams and verify all HTTPS requests from users reach the SharePoint servers only through a reverse proxy (no direct client access to the web front ends).
remediation:
  type: iac_patch
  command: Deploy a reverse proxy that terminates/inspects all HTTPS requests and routes them to the SharePoint servers; block direct client access to the servers.
