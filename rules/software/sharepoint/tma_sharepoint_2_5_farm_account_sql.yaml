id: TMA-SHAREPOINT-2.5
title: Ensure the SharePoint farm service account (database access account) is configured with the minimum privileges on the SQL server.
description: The SharePoint farm service account (database access account) must be configured with the minimum privileges on the SQL server Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- service-accounts
- sql
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 2.5 Ensure the SharePoint farm service account (database access account) is configured with the minimum privileges on the SQL server.
audit:
  type: manual
  command: In SQL Server Management Studio on the farm's SQL instance open Security > Logins > <farm service account> > Server Roles. Verify only dbcreator and securityadmin are checked (plus public). Get-SPFarm | Select DefaultServiceAccount shows the account.
remediation:
  type: iac_patch
  command: In SSMS > Security > Logins > farm account > Server Roles, check ONLY dbcreator and securityadmin (ALTER SERVER ROLE <role> DROP MEMBER [DOMAIN\farm] for others).
