id: TMA-SHAREPOINT-5.2
title: Ensure that remote sessions for accessing security functions and security-relevant information are audited
description: Remote access to SharePoint security functions (e.g., user management, audit log management, etc.) and security relevant information requires the activity be audited by the organization. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- logging
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 5.2 Ensure that remote sessions for accessing security functions and security-relevant information are audited
audit:
  type: manual
  command: 'For each site collection subject to auditing: Settings > Site Settings > Site collection audit settings. Verify all events the organization requires to be audited (e.g. editing users and permissions, deleting/restoring items, security-relevant changes) are selected.'
remediation:
  type: iac_patch
  command: 'Site Settings > Site collection audit settings: select the events required by organizational policy and click OK, for each site collection in scope.'
