id: TMA-SHAREPOINT-6.3
title: Ensure that SharePoint user sessions are terminated upon user logoff and when the idle time limit is exceeded
description: The SharePoint platform should be configured with a user session idle time limit of 15 minutes. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- sessions
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 6.3 Ensure that SharePoint user sessions are terminated upon user logoff and when the idle time limit is exceeded
audit:
  type: manual
  command: Central Administration > Application Management > Manage Web Applications > each web application > General Settings > Web Page Security Validation. Verify Security Validation is On and 'Security Validation Expires' is set to 15 minutes ($wa.FormDigestSettings shows Enabled/Expires).
remediation:
  type: iac_patch
  command: 'General Settings > Web Page Security Validation: On, expires after 15 minutes (or $wa.FormDigestSettings.Enabled = $true; $wa.FormDigestSettings.Timeout = New-TimeSpan -Minutes 15; $wa.Update()).'
