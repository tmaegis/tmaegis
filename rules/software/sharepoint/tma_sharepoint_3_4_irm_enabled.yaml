id: TMA-SHAREPOINT-3.4
title: Ensure SharePoint identifies data type, specification, and usage when transferring information between different security domains so policy restrictions may be applied.
description: SharePoint must identify data type, specification, and usage when transferring information between different security domains so policy restrictions may be applied. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- data-protection
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.4 Ensure SharePoint identifies data type, specification, and usage when transferring information between different security domains so policy restrictions may be applied.
audit:
  type: manual
  command: Central Administration > Security > Configure information rights management. Finding if 'Do not use IRM on this server' is selected or a configuration error is shown (e.g. '... IRM will not work until the client is configured properly'). RMS must be located via AD or specified.
remediation:
  type: iac_patch
  command: 'Central Administration > Security > Configure information rights management: select ''Use the default RMS server specified in Active Directory'' or specify the RMS server; ensure ''Do not use IRM on this server'' is not selected.'
