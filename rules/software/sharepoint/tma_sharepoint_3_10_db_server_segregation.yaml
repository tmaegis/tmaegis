id: TMA-SHAREPOINT-3.10
title: Ensure SharePoint database servers are segregated from application server and placed in a secure zone.
description: Segregating the SharePoint database server from the application server provides a layered defense architecture. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- network
- sql
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.10 Ensure SharePoint database servers are segregated from application server and placed in a secure zone.
audit:
  type: manual
  command: Review the SharePoint architecture and verify the SharePoint database server is segregated from the application servers and placed in a secure network zone, with only the required ports open from the application servers.
remediation:
  type: iac_patch
  command: Move the SharePoint database server into a secure network zone and open only the specific ports required from the application servers.
