id: TMA-SHAREPOINT-3.11
title: Ensure that the SharePoint Central Administration interface is not hosted in the DMZ.
description: The SharePoint Central Administration site should not be installed onto the network DMZ, which is exposed to external internet connections. Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- network
- central-admin
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.11 Ensure that the SharePoint Central Administration interface is not hosted in the DMZ.
audit:
  type: manual
  command: Note the Central Administration URL (e.g. http://server:port) on an admin workstation, then try to open it from a workstation or server in the DMZ. Finding if it is reachable from the DMZ or if a server hosting Central Administration is in the DMZ.
remediation:
  type: iac_patch
  command: 'Remove Central Administration from DMZ servers: run the SharePoint Products Configuration Wizard, choose Do not disconnect from the server farm, then Yes, I want to remove the website from this machine.'
