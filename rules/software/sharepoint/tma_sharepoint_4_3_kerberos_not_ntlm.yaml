id: TMA-SHAREPOINT-4.3
title: Ensure Windows Authentication uses Kerberos and not the NT Lan Manager (NTLM) authentication protocol
description: If Windows Authentication mechanisms are used on SharePoint, the system should be configured to use the Kerberos authentication protocol rather than the NT Lan Manager (NTLM) equivalent. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- authentication
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 4.3 Ensure Windows Authentication uses Kerberos and not the NT Lan Manager (NTLM) authentication protocol
audit:
  type: manual
  command: Central Administration > Manage web applications > Authentication Providers > each zone. Verify Integrated Windows authentication is checked with Negotiate (Kerberos) selected, not NTLM. (Get-SPAuthenticationProvider -WebApplication <url> -Zone <zone> shows DisableKerberos = False.)
remediation:
  type: iac_patch
  command: 'Authentication Providers > zone: check Integrated Windows authentication and select Negotiate (Kerberos); register HTTP SPNs for the application pool accounts first.'
