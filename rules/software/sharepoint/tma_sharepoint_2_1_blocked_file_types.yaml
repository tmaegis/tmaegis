id: TMA-SHAREPOINT-2.1
title: Ensure 'Blocked File Types' is configured to match the enterprise blacklist
description: A common tactic of malware is to identify the type of malicious code protection software running on the system and deactivate it. Malicious code includes viruses, worms, Trojan horses, and Spyware. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- malware
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 2.1 Ensure 'Blocked File Types' is configured to match the enterprise blacklist
audit:
  type: manual
  command: Central Administration > Security > Define blocked file types. For each web application (Change Web Application), compare the blocked list with the enterprise file-type blacklist; every blacklisted extension must be present. ($wa.BlockedFileExtensions lists them in PowerShell.)
remediation:
  type: iac_patch
  command: Central Administration > Security > Define blocked file types > select the web application > add each blacklisted extension (one per line) > OK. Repeat for every web application.
