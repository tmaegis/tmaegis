id: TMA-SHAREPOINT-FARM-ADMINS
title: Ensure Farm Administrators group membership is restricted
description: Farm Administrators have full control over every server and site collection; membership must be limited to named administrators.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- accounts
reference: CIS Microsoft SharePoint Server Benchmark - Service accounts / Farm Administrators group (verify section number for your release)
audit:
  type: manual
  command: 'Central Administration > Security > Manage the farm administrators group: confirm only approved named admin accounts [and BUILTIN\Administrators if required] are members; no users, broad groups or service accounts other than the farm account. Also check Get-SPShellAdmin output and the local Administrators group on each farm server.'
remediation:
  type: iac_patch
  command: Remove unapproved members from the Farm Administrators group in Central Administration and with Remove-SPShellAdmin; document approved membership.
