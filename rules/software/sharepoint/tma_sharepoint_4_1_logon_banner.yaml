id: TMA-SHAREPOINT-4.1
title: Ensure SharePoint displays an approved system use notification message or banner before granting access to the system.
description: SharePoint web applications must display an approved system use notification message or banner before granting access. Manual review.
target: sharepoint
level: 1
severity: low
tags:
- sharepoint
- banner
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 4.1 Ensure SharePoint displays an approved system use notification message or banner before granting access to the system.
audit:
  type: manual
  command: Obtain the list of web applications (Get-SPWebApplication), browse to each web application's home page and verify the approved system-use notification/warning banner is displayed before access is granted.
remediation:
  type: iac_patch
  command: Configure every web application to show the approved warning banner at session start (e.g. a banner page referenced from global.asax that redirects back after acknowledgement); back up global.asax first.
