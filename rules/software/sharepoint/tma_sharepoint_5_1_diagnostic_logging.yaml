id: TMA-SHAREPOINT-5.1
title: Ensure that auditable events and diagnostic tracking settings within the SharePoint system is consistent with the organization's security plans
description: SharePoint must allow designated organizational personnel to select which auditable events are to be audited by specific components of the system. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- logging
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 5.1 Ensure that auditable events and diagnostic tracking settings within the SharePoint system is consistent with the organization's security plans
audit:
  type: manual
  command: Central Administration > Monitoring > Configure diagnostic logging. Verify the selected event categories and event/trace levels match those defined in the organization's system security plan (Get-SPLogLevel lists them). Inconsistency is a finding.
remediation:
  type: iac_patch
  command: 'Central Administration > Monitoring > Configure diagnostic logging: set event categories and trace levels to match the system security plan (or Set-SPLogLevel).'
