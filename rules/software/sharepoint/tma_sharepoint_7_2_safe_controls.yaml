id: TMA-SHAREPOINT-7.2
title: Ensure that the SafeControls list is set to the minimum set of controls needed for your sites
description: The Safe Controls list contains the names of controls and Web Parts, specific to your SharePoint site, that server administrators can designate as safe for use on any .aspx page within a site. This list is part of the Web.config file in your Web application root. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- web-parts
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 7.2 Ensure that the SafeControls list is set to the minimum set of controls needed for your sites
audit:
  type: manual
  command: Open the web.config of each web application root and review the <SafeControls> section. Verify only SafeControl entries for approved, required assemblies/namespaces are present (each with Safe="True" only where needed); remove unused custom entries.
remediation:
  type: iac_patch
  command: Remove SafeControl entries for assemblies that are not required (prefer deploying web parts via solution packages so entries are managed), keeping only the minimum set needed by your sites.
