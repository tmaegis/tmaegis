id: TMA-SHAREPOINT-2.3
title: Ensure the SharePoint setup account is configured with the minimum privileges in Active Directory.
description: The SharePoint setup account must be configured with the minimum privileges in Active Directory. Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- service-accounts
- least-privilege
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 2.3 Ensure the SharePoint setup account is configured with the minimum privileges in Active Directory.
audit:
  type: manual
  command: In Active Directory Users and Computers open the SharePoint setup account > Member Of. Verify it is a member of Domain Users only, and that no other delegated rights, services or permissions are assigned to it.
remediation:
  type: iac_patch
  command: Remove the setup account from every AD group other than Domain Users and remove any additional delegated permissions.
