id: TMA-SHAREPOINT-1.3
title: Ensure specific whitelisted IP addresses, IP address ranges, and/or domains are set
description: Access to the SharePoint web application should be restricted to a certain group of users. Typically, this is done through restricting IP addresses to selectively allow known and approved user populations. Manual review.
target: sharepoint
level: 1
severity: medium
tags:
- sharepoint
- network
- central-admin
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 1.3 Ensure specific whitelisted IP addresses, IP address ranges, and/or domains are set
audit:
  type: manual
  command: In IIS Manager select the 'SharePoint Central Administration v4' site > IP Address and Domain Restrictions. Verify allow entries list only approved administrative IP addresses, ranges and/or domains, and that unlisted clients are denied.
remediation:
  type: iac_patch
  command: IIS Manager > SharePoint Central Administration v4 > IP Address and Domain Restrictions > Add Allow Entry for each approved admin address/range; set the default for unspecified clients to Deny.
