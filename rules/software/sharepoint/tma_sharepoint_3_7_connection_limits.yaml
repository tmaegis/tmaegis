id: TMA-SHAREPOINT-3.7
title: Ensure that SharePoint is set to reject or delay network traffic generated above configurable traffic volume thresholds.
description: SharePoint must reject or delay, as defined by the organization, network traffic generated above configurable traffic volume thresholds. Manual review.
target: sharepoint
level: 1
severity: low
tags:
- sharepoint
- availability
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.7 Ensure that SharePoint is set to reject or delay network traffic generated above configurable traffic volume thresholds.
audit:
  type: manual
  command: In IIS Manager, for each SharePoint site that receives user traffic open Advanced Settings > Connection Limits. Verify Connection Time-out, Maximum Bandwidth and Maximum Concurrent Connections each have a configured (non-default/limited) value.
remediation:
  type: iac_patch
  command: 'IIS Manager > site > Advanced Settings > Connection Limits: set Connection Time-out, Maximum Bandwidth and Maximum Concurrent Connections for every user-facing SharePoint site.'
