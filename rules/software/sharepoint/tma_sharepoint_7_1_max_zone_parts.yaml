id: TMA-SHAREPOINT-7.1
title: Ensure that the MaxZoneParts setting for Web Parts is configured
description: Limit the number of web parts in SharePoint to a minimum value that is needed. Manual review.
target: sharepoint
level: 1
severity: low
tags:
- sharepoint
- web-parts
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 7.1 Ensure that the MaxZoneParts setting for Web Parts is configured
audit:
  type: manual
  command: On each Web Front End open the web.config of every SharePoint IIS site and find <WebPartLimits MaxZoneParts="50" PropertySize="1048576"/>. Verify MaxZoneParts is configured to the minimum value your pages require (default 50).
remediation:
  type: iac_patch
  command: 'Edit web.config on every WFE: set <WebPartLimits MaxZoneParts="<minimum needed>" .../>, save, then run iisreset during a maintenance window.'
