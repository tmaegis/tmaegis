id: TMA-SHAREPOINT-2.7
title: Ensure the SharePoint Central Administration site is not accessible from Extranet or Internet connections
description: The SharePoint central administration site should be configured so that its ports and interfaces are not accessible to untrusted external or internet connections. Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- network
- central-admin
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 2.7 Ensure the SharePoint Central Administration site is not accessible from Extranet or Internet connections
audit:
  type: manual
  command: Determine the Central Administration port (stsadm -o getadminport from %CommonProgramFiles%\Microsoft Shared\Web Server Extensions\16\BIN, or Get-SPWebApplication -IncludeCentralAdministration). Verify in the firewall rules that this server/port is not reachable from the Internet, extranet or other external connections.
remediation:
  type: iac_patch
  command: Configure perimeter and host firewalls so the Central Administration port is reachable only from internal administrative networks.
