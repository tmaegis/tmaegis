id: TMA-SHAREPOINT-4.4
title: Ensure Anonymous authentication is denied
description: SharePoint web applications should be configured to disallow anonymous authentication, which would allow users to authenticate and use the applications without confirming their identity. Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- authentication
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 4.4 Ensure Anonymous authentication is denied
audit:
  type: manual
  command: 'Central Administration > Manage web applications > select each web application > Authentication Providers > each zone. Verify ''Enable anonymous access'' is not selected. PowerShell aid: Get-SPWebApplication | % { $_.IisSettings.Values } | ? AllowAnonymous.'
remediation:
  type: iac_patch
  command: 'Authentication Providers > each zone: clear ''Enable anonymous access'' and save. Repeat for each web application.'
