id: TMA-SHAREPOINT-2.4
title: Ensure the SharePoint setup account is configured with the minimum privileges on the SQL server.
description: The SharePoint setup account must be configured with the minimum privileges on the SQL server. Manual review.
target: sharepoint
level: 1
severity: high
tags:
- sharepoint
- service-accounts
- sql
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 2.4 Ensure the SharePoint setup account is configured with the minimum privileges on the SQL server.
audit:
  type: manual
  command: In SQL Server Management Studio on the farm's SQL instance open Security > Logins > <SharePoint setup account> > Server Roles. Verify only dbcreator and securityadmin are checked (plus public). sysadmin or other roles are non-compliant.
remediation:
  type: iac_patch
  command: In SSMS > Security > Logins > setup account > Server Roles, check only dbcreator and securityadmin (ALTER SERVER ROLE <role> DROP MEMBER [DOMAIN\setup] for others).
