id: TMA-SHAREPOINT-3.8
title: Ensure that On-Premise SharePoint servers is configured without OneDrive redirection linkages.
description: Disable OneDrive Redirection for On-Premise SharePoint servers Manual review.
target: sharepoint
level: 1
severity: low
tags:
- sharepoint
- hybrid
reference: CIS Microsoft SharePoint 2019 Benchmark v1.0.0 - 3.8 Ensure that On-Premise SharePoint servers is configured without OneDrive redirection linkages.
audit:
  type: manual
  command: Central Administration > Office 365 > Configure OneDrive and Sites links. Verify the My Site URL field is empty so on-premises users are not redirected to OneDrive/SharePoint Online.
remediation:
  type: iac_patch
  command: 'Central Administration > Office 365 > Configure OneDrive and Sites links: remove any URL from the My Site URL field and save.'
