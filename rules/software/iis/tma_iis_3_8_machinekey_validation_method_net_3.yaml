id: TMA-IIS-3.8
title: Ensure 'MachineKey validation method - .Net 3.5' is configured
description: 'The machineKey element of the ASP.NET web.config specifies the algorithm and keys that ASP.NET will use for encryption. The Machine Key feature can be managed to specify hashing and encryption settings for application services such as view state, Forms authentication, membership and roles, and anonymous identification. The following validation methods are available ... Manual review: the benchmark gives no reliable automated check for this control.'
target: iis
level: 2
severity: low
tags:
- iis
- aspnet
reference: CIS Microsoft IIS 10 Benchmark v1.2.1 - 3.8 Ensure 'MachineKey validation method - .Net 3.5' is configured
audit:
  type: manual
  command: 'To verify the Machine Key validation method using IIS Manager: 1. Open IIS Manager and navigate to the level that was configured, the WEBROOT, or server in this case 2. In the features view, double click Machine Key 3. On the Machine Key page, verify that SHA1 is selected in the validation method dropdown'
remediation:
  type: iac_patch
  command: 'Machine key encryption can be set by using the UI, running appcmd.exe commands, by editing configuration files directly, or by writing WMI scripts. To set the Machine Key encryption at the global level using an appcmd.exe command: %systemroot%\system32\inetsrv\appcmd set config /commit:WEBROOT /section:machineKey /validation:SHA1 Note: When Appcmd.exe is used to configure the <machineKey> element at the global level in IIS, the /commit:WEBROOT switch must be included so that configuration changes are made to the root web.config file instead of ApplicationHost.config.'
