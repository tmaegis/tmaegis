id: TMA-IIS-7.6
title: Ensure TLS 1.2 is Enabled
description: TLS 1.2 is the most recent and mature protocol for protecting the confidentiality and integrity of HTTP traffic. SCHANNEL\Protocols\TLS 1.2\Server must have Enabled=1 and DisabledByDefault=0. PowerShell 5.1; reads the registry (run elevated).
target: iis
level: 1
severity: medium
tags:
- iis
- tls
reference: CIS Microsoft IIS 10 Benchmark v1.2.1 - 7.6 Ensure TLS 1.2 is Enabled
audit:
  type: registry
  command: $base = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols'; $p = Get-ItemProperty -Path "$base\TLS 1.2\Server" -ErrorAction SilentlyContinue; if ($null -ne $p -and $p.Enabled -eq 1 -and $p.DisabledByDefault -eq 0) { 'compliant' } else { 'noncompliant' }
  expected_output: compliant
  requires_file:
  - C:\Windows\System32\inetsrv\config\applicationHost.config
remediation:
  type: iac_patch
  command: New-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Force | Out-Null; set DWORD Enabled=1 and DisabledByDefault=0, then reboot.
