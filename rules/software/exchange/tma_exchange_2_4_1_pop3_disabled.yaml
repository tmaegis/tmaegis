id: TMA-EXCHANGE-2.4.1
title: Ensure 'POP3' Windows services are 'Disabled'
description: Post Office Protocol 3 (POP3) is an email protocol for receiving email messages from a server and transferring to a client device. On Exchange Server 2019 with the Mailbox role installed, it is set to manual startup by default. Prints the number of POP3 services (MSExchangePOP3, MSExchangePOP3BE) whose StartType is not Disabled (expected 0). Uses Get-Service only; fails if the services are not present. Run on each Mailbox server.
target: exchange
level: 1
severity: medium
tags:
- exchange
- services
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 2.4.1 Ensure 'POP3' Windows services are 'Disabled'
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; $bad = @(Get-Service -Name MSExchangePOP3, MSExchangePOP3BE -ErrorAction Stop | Where-Object { "$($_.StartType)" -ne 'Disabled' }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Stop-Service MSExchangePOP3, MSExchangePOP3BE; Get-Service MSExchangePOP3, MSExchangePOP3BE | Set-Service -StartupType Disabled
