id: TMA-EXCHANGE-1.5
title: Ensure 'Spam quarantine mailbox exists' is set to '<SmtpAddress>'
description: 'This parameter is used to specify an SMTP address to be used as a spam quarantine mailbox. Note: All messages that are equal to or greater than the value set in the SCLQuarantineEnabled parameter are sent to the SMTP address set in the QuarantineMailbox parameter. Manual: the quarantine mailbox must be a valid, working, monitored address. Run on each Edge Transport server.'
target: exchange
level: 1
severity: low
tags:
- exchange
- antispam
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 1.5 Ensure 'Spam quarantine mailbox exists' is set to '<SmtpAddress>'
audit:
  type: manual
  command: 'On the Edge Transport server run: Get-ContentFilterConfig | Select Name, QuarantineMailbox. Confirm QuarantineMailbox is set to a valid, working SMTP address of a mailbox that exists and is monitored. Not set (default) is non-compliant.'
remediation:
  type: iac_patch
  command: Set-ContentFilterConfig -QuarantineMailbox <QuarantineMailbox SmtpAddress>
