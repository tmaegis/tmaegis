id: TMA-EXCHANGE-2.4.5
title: Ensure 'SMTP automated banner response' is set to '220 SMTP Server Ready'
description: This policy setting specifies a custom SMTP 220 banner which is displayed to remote messaging servers that connect to the receive connector. Prints the number of Receive connectors whose Banner is not exactly '220 SMTP Server Ready' (expected 0); the default banner discloses server name and product. Run on a Mailbox server (organization-wide objects are read from AD). Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: low
tags:
- exchange
- transport
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 2.4.5 Ensure 'SMTP automated banner response' is set to '220 SMTP Server Ready'
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $bad = @(Get-ReceiveConnector -ErrorAction Stop | Where-Object { "$($_.Banner)" -ne '220 SMTP Server Ready' }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-ReceiveConnector -Identity '<connector>' -Banner '220 SMTP Server Ready'
