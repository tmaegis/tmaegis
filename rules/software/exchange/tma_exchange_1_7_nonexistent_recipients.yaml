id: TMA-EXCHANGE-1.7
title: Ensure 'Nonexistent recipients' is set to 'True'
description: 'This parameter is used to decide if messages whose recipient doesn''t exist in the organization are blocked. When this parameter is set to $true, the Recipient Filter Agent blocks these messages. Note: The Set-RecipientFilterConfig cmdlet must be enabled Manual per the benchmark (recipient validation depends on EdgeSync/AD data on the Edge server). Run on each Edge Transport server.'
target: exchange
level: 1
severity: medium
tags:
- exchange
- antispam
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 1.7 Ensure 'Nonexistent recipients' is set to 'True'
audit:
  type: manual
  command: 'On the Edge Transport server run: Get-RecipientFilterConfig | Select Name, RecipientValidationEnabled. RecipientValidationEnabled must be True so messages to nonexistent recipients are rejected; also confirm EdgeSync replicates recipient data so validation works.'
remediation:
  type: iac_patch
  command: Set-RecipientFilterConfig -RecipientValidationEnabled $true
