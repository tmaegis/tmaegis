id: TMA-EXCHANGE-2.3.4
title: Ensure 'Enable automatic forwards to remote domains' is set to 'False'
description: This policy setting is used to determine if the server can send automatic forwards to remote domains. Prints the number of remote domains where AutoForwardEnabled is not False (expected 0). Automatic forwarding to external domains is a common exfiltration path. Every remote domain (including Default) is checked. Run on a Mailbox server (organization-wide objects are read from AD). Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: high
tags:
- exchange
- remote-domains
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 2.3.4 Ensure 'Enable automatic forwards to remote domains' is set to 'False'
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $bad = @(Get-RemoteDomain -ErrorAction Stop | Where-Object { $_.AutoForwardEnabled -ne $false }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-RemoteDomain '<RemoteDomain>' -AutoForwardEnabled $false
