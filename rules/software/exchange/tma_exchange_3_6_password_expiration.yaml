id: TMA-EXCHANGE-3.6
title: Ensure 'Password expiration' is set to '365' or less
description: This policy setting is used to specify how long before a password expires. PasswordExpiration must be 365 days or less (Unlimited fails). Prints the number of mobile device mailbox policies that do not comply (expected 0). Run on a Mailbox server; every mobile device mailbox policy is checked. Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: low
tags:
- exchange
- mobile
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 3.6 Ensure 'Password expiration' is set to '365' or less
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $ts = { param($v) $s = "$v"; if (-not $s -or $s -eq 'Unlimited') { $null } else { [timespan]$s } }; $num = { param($v) $s = "$v"; if ($s -match '^\d+$') { [int64]$s } else { $null } }; $bad = @(Get-MobileDeviceMailboxPolicy -ErrorAction Stop | Where-Object { $t = & $ts $_.PasswordExpiration; $null -eq $t -or $t.TotalDays -gt 365 }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-MobileDeviceMailboxPolicy '<Profile>' -PasswordExpiration 365.00:00:00 (any value up to 365 days)
