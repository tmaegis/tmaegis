id: TMA-EXCHANGE-3.11
title: Ensure 'Time without user input before password must be re-entered' is set to '15'
description: This policy setting prompts users for a password after the device has been inactive for a specified period of time. MaxInactivityTimeLock must be 15 minutes or less (Unlimited fails). Prints the number of mobile device mailbox policies that do not comply (expected 0). Run on a Mailbox server; every mobile device mailbox policy is checked. Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: medium
tags:
- exchange
- mobile
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 3.11 Ensure 'Time without user input before password must be re-entered' is set to '15'
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $ts = { param($v) $s = "$v"; if (-not $s -or $s -eq 'Unlimited') { $null } else { [timespan]$s } }; $num = { param($v) $s = "$v"; if ($s -match '^\d+$') { [int64]$s } else { $null } }; $bad = @(Get-MobileDeviceMailboxPolicy -ErrorAction Stop | Where-Object { $t = & $ts $_.MaxInactivityTimeLock; $null -eq $t -or $t.TotalMinutes -gt 15 }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-MobileDeviceMailboxPolicy '<Profile>' -MaxInactivityTimeLock 00:15:00
