id: TMA-EXCHANGE-4.4
title: 'Ensure ''Send connector: Configure protocol logging'' is set to ''Verbose'''
description: A protocol log is a record of the SMTP activity between messaging servers as part of message delivery. This SMTP activity occurs on Send connectors and Receive connectors that are configured with the transport service on Mailbox servers and Edge Transport servers. Prints the number of Send connectors whose ProtocolLoggingLevel is not Verbose (expected 0). Run on each Edge Transport and Mailbox server. Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: medium
tags:
- exchange
- logging
reference: 'CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 4.4 Ensure ''Send connector: Configure protocol logging'' is set to ''Verbose'''
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $bad = @(Get-SendConnector -ErrorAction Stop | Where-Object { "$($_.ProtocolLoggingLevel)" -ne 'Verbose' }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-SendConnector '<connector>' -ProtocolLoggingLevel Verbose
