id: TMA-EXCHANGE-2.2.8
title: 'Ensure ''External send connector authentication: DNS routing'' is set to ''True'''
description: This policy setting determines if DNS is used to route outbound mail via the send connector. Prints the number of Send connectors where DNSRoutingEnabled is not True (expected 0). All Send connectors are checked; a connector that intentionally routes through a smart host will be reported and should be reviewed. Run on a Mailbox server (organization-wide objects are read from AD). Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: low
tags:
- exchange
- transport
reference: 'CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 2.2.8 Ensure ''External send connector authentication: DNS routing'' is set to ''True'''
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $bad = @(Get-SendConnector -ErrorAction Stop | Where-Object { $_.DNSRoutingEnabled -ne $true }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-SendConnector '<connector>' -DNSRoutingEnabled $true
