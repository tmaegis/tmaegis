id: TMA-EXCHANGE-2.1.6
title: Ensure 'Do not permanently delete items until the database has been backed up' is set to 'True'
description: This policy setting can prohibit items from being permanently deleted until the database has been backed up. Prints the number of mailbox databases where RetainDeletedItemsUntilBackup is not True (expected 0). Run on a Mailbox server (organization-wide objects are read from AD). Run from an Exchange Management Shell or after `Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn`; the audit loads the snap-in itself when Get-ExchangeServer is missing and fails if it cannot.
target: exchange
level: 1
severity: medium
tags:
- exchange
- mailbox
- retention
reference: CIS Microsoft Exchange Server 2019 Benchmark v1.0.1 - 2.1.6 Ensure 'Do not permanently delete items until the database has been backed up' is set to 'True'
audit:
  type: command
  command: $ErrorActionPreference = 'Stop'; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn -ErrorAction Stop }; if (-not (Get-Command Get-ExchangeServer -ErrorAction SilentlyContinue)) { throw 'Exchange Management Shell cmdlets are not available' }; $bad = @(Get-MailboxDatabase -ErrorAction Stop | Where-Object { $_.RetainDeletedItemsUntilBackup -ne $true }); $bad.Count
  expected_output: '0'
remediation:
  type: iac_patch
  command: Set-MailboxDatabase '<database>' -RetainDeletedItemsUntilBackup $true
