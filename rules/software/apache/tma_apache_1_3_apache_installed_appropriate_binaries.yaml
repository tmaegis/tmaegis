id: TMA-APACHE-1.3
title: Ensure Apache Is Installed From the Appropriate Binaries
description: 'The CIS Apache Benchmark recommends using the Apache binary provided by your vendor for most situations in order to reduce the effort and increase the effectiveness of maintenance and security patches. However, to keep the benchmark as generic and applicable to all Unix/Linux platforms as possible, a default source build has been used for this benchmark. Important Note ... Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- planning
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 1.3 Ensure Apache Is Installed From the Appropriate Binaries
audit:
  type: manual
  command: Review the configuration as described in the CIS benchmark.
remediation:
  type: iac_patch
  command: 'Installation depends on the operating system platform. For a source build, consult the Apache 2.4 documentation on compiling and installing https://httpd.apache.org/docs/2.4/install.html for a Red Hat Enterprise Linux 5 or 6, the following yum command could be used. # yum install httpd'
