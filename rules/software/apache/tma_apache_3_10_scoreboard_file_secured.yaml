id: TMA-APACHE-3.10
title: Ensure the ScoreBoard File Is Secured
description: 'The ScoreBoardFile directive sets a file path which the server will use for inter- process communication (IPC) among the Apache processes. On most Linux platforms, shared memory will be used instead of a file in the file system, so this directive is not generally needed and does not need to be specified. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- accounts
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 3.10 Ensure the ScoreBoard File Is Secured
audit:
  type: manual
  command: 1. Check to see if the ScoreBoardFile is specified in any of the Apache configuration files. If it is not present, the configuration is compliant. 2. Find the directory in which the ScoreBoardFile would be created. The default value is the ServerRoot/logs directory. 3. Verify that the scoreboard file directory is not a directory within the Apache DocumentRoot 4. Verify that the ownership and group of the directory is root:root (or the user under which Apache initially starts up if not root). 5.
remediation:
  type: iac_patch
  command: 1. Check to see if the ScoreBoardFile is specified in any of the Apache configuration files. If it is not present, no changes are required. 2. If the directive is present, find the directory in which the ScoreBoardFile would be created. The default value is the ServerRoot/logs directory. 3. Modify the directory if the ScoreBoardFile is in a directory within the Apache DocumentRoot 4. Change the ownership and group to be root:root, if not already. 5. Change the permissions so that the directory is only writable by root, or the user under which apache initially starts up (default is root), 6. Check that the scoreboard file directory is on a locally mounted hard drive rather than an NFS mounted file system.
