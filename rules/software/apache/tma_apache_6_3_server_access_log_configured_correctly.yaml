id: TMA-APACHE-6.3
title: Ensure the Server Access Log Is Configured Correctly
description: 'The LogFormat directive defines a nickname for a log format and information to be included in the access log entries. The CustomLog directive specifies the log file, syslog facility or piped logging utility. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- logging
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 6.3 Ensure the Server Access Log Is Configured Correctly
audit:
  type: manual
  command: 'Perform the following steps to determine if the recommended state is implemented: 1. Verify the CustomLog directive is configured to an appropriate log file, syslog facility, or piped logging utility and the directive uses a log format that includes all of the format string tokens listed below. The log format string may be specified as a LogFormat nickname or as an explicit string. For example, either of the following two configurations are compliant ...'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: 1. Add or modify the LogFormat directives in the Apache configuration to use the combined` format show as shown below. LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" combined 2. Add or modify the CustomLog directives in the Apache configuration to use the combined format with an appropriate log file, syslog facility or piped logging utility. CustomLog log/access_log combined 3. Add a similar CustomLog directives for each virtual host configured if the virtual host will have different people responsible for the web site. Each responsible individual or organization needs access to their own web logs as well as the skills/training/tools for monitoring the logs.'
