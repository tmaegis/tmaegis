id: TMA-APACHE-11.4
title: Ensure Only the Necessary SELinux Booleans are Enabled
description: 'SELinux booleans allow or disallow behavior specific to the Apache web server. Common examples include whether CGI execution is allowed, or if the httpd server is allowed to communicate with the current terminal (tty). Communication with the terminal, may be necessary for entering a passphrase during start up to decrypt a private key. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 2
severity: low
tags:
- apache
- selinux
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 11.4 Ensure Only the Necessary SELinux Booleans are Enabled
audit:
  type: manual
  command: 'Perform the following steps to determine if the recommended state is implemented: Review the SELinux httpd booleans that are enabled to ensure only the necessary booleans are enabled for the current and the configured state. Due to the variety and complexity of web server usages and organizational needs, a preset recommendation of enabled booleans is not practical. Run either of the two commands below to show only the enabled httpd related booleans.'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: To disable the SELinux httpd booleans that are determined to be unnecessary, use the setsebool command as shown below with the -P option to make the change persistent. # setsebool -P httpd_enable_cgi off # getsebool httpd_enable_cgi httpd_enable_cgi --> off'
