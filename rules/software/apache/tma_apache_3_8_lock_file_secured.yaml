id: TMA-APACHE-3.8
title: Ensure the Lock File Is Secured
description: 'The Mutex directive sets the locking mechanism used to serialize access to resources. It may be used to specify that a lock file is to be used as a mutex mechanism and may provide the path to the lock file to be used with the fcntl(2) or flock(2) system calls. Most Linux systems will default to using semaphores instead, so the directive may not apply. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- accounts
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 3.8 Ensure the Lock File Is Secured
audit:
  type: manual
  command: Verify the configuration does NOT include a Mutex directive with the mechanism of fcntl, flock or file. If one of the file locking mechanisms is configured, then find the directory in which the lock file would be created. The default value is the ServerRoot/logs directory. 1. Verify that the lock file directory is not a directory within the Apache DocumentRoot 2. Verify that the ownership and group of the directory is root:root (or the user under which Apache initially starts up if not root). 3.
remediation:
  type: iac_patch
  command: Find the directory path in which the lock file would be created. The default value is the ServerRoot/logs directory. 1. Modify the directory if the path is a directory within the Apache DocumentRoot 2. Change the ownership and group to be root:root, if not already. 3. Change the permissions so that the directory is only writable by root, or the user under which Apache initially starts up (default is root), 4. Check that the lock file directory is on a locally mounted hard drive rather than an NFS mounted file system.
