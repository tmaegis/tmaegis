id: TMA-APACHE-1.2
title: Ensure the Server Is Not a Multi-Use System
description: 'Default server configurations often expose a wide variety of services unnecessarily increasing the risk to the system. Just because a server can perform many services doesn''t mean it is wise to do so. The number of services and daemons executing on the Apache Web server should be limited to those necessary, with the Web server being the only primary function of the server. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- planning
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 1.2 Ensure the Server Is Not a Multi-Use System
audit:
  type: manual
  command: 'Leverage the package or services manager for your OS to list enabled services and review with documented business needs of the server. On Red Hat systems, the following will produce the list of current services enabled: systemctl list-unit-files --state enabled'
remediation:
  type: iac_patch
  command: 'Leverage the package or services manager for your OS to uninstall or disable unneeded services. On Red Hat systems, the following will disable a given service: chkconfig <servicename> off'
