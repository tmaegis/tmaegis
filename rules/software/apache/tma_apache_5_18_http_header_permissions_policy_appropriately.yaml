id: TMA-APACHE-5.18
title: Ensure HTTP Header Permissions-Policy is set appropriately
description: 'The HTTP Permissions-Policy is a control that provides a way to allow or deny the use of certain browser features within a document or within any <iframe> element in the document. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 2
severity: low
tags:
- apache
- features
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 5.18 Ensure HTTP Header Permissions-Policy is set appropriately
audit:
  type: manual
  command: 'Perform the following steps to determine if the recommended state is implemented: Query a Header directive for Permissions-Policy is present in the Apache configuration and has the condition Header Set ''Permissions-Policy'' shown below: # grep -I Permissions-Policy $APACHE_PREFIX/conf/httpd.conf Header set Permissions-Policy "<Directive> <allowlist>" Header Permissions-Policy configurations should be set to match required browser features, functions and origins.'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: Add or modify the Header directive for the Permissions-Policy header in the Apache configuration to have the appropriate condition as shown below. Header set Permissions-Policy "<Directive> <allowlist>"'
