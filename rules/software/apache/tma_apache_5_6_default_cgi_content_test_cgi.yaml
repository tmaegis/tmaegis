id: TMA-APACHE-5.6
title: Ensure the Default CGI Content test-cgi Script Is Removed
description: 'Most Web Servers, including Apache installations have default CGI content which is not needed or appropriate for production use. The primary function for these sample programs is to demonstrate the capabilities of the web server. A common default CGI content for Apache installations is the script test-cgi. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 2
severity: low
tags:
- apache
- features
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 5.6 Ensure the Default CGI Content test-cgi Script Is Removed
audit:
  type: manual
  command: 'Perform the following to determine if the recommended state is implemented: 1. Locate cgi-bin files and directories enabled in the Apache configuration via Script, ScriptAlias or ScriptAliasMatch directives. 2. Ensure the test-cgi script is not installed in any configured cgi-bin directory.'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: 1. Locate cgi-bin files and directories enabled in the Apache configuration via Script, ScriptAlias, ScriptAliasMatch directives. 2. Remove the test-cgi default CGI in cgi-bin directory if it is installed. # rm $APACHE_PREFIX/cgi-bin/test-cgi'
