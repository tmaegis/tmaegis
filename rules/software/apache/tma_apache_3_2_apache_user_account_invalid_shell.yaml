id: TMA-APACHE-3.2
title: Ensure the Apache User Account Has an Invalid Shell
description: The apache account must not be used as a regular login account, and should be assigned an invalid or nologin shell to ensure that the account cannot be used to login. The account named by the User directive must have /sbin/nologin (or /dev/null) as its login shell. Reads the main configuration (APACHE_CONF overrides; default /etc/apache2/apache2.conf, /etc/httpd/conf/httpd.conf or /usr/local/apache2/conf/httpd.conf) and every Include/IncludeOptional file.
target: apache
level: 1
severity: medium
tags:
- apache
- accounts
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 3.2 Ensure the Apache User Account Has an Invalid Shell
audit:
  type: command
  shell: bash
  command: 'c=${APACHE_CONF:-}; if [ -z "$c" ]; then for f in /etc/apache2/apache2.conf /etc/httpd/conf/httpd.conf /usr/local/apache2/conf/httpd.conf /etc/apache2/httpd.conf; do [ -f "$f" ] && { c=$f; break; }; done; fi; [ -r "$c" ] || exit 1; R=$(awk ''tolower($1)=="serverroot"{v=$2; gsub(/"/,"",v); print v; exit}'' "$c"); [ -n "$R" ] || R=$(dirname "$c"); shopt -s nocasematch; inc(){ local p g l; [ ${#FUNCNAME[@]} -lt 16 ] || return 0; p=$1; case $p in /*) ;; *) p=$R/$p;; esac; [ -d "$p" ] && p="$p/*"; for g in $p; do [ -f "$g" ] || continue; while IFS= read -r l || [ -n "$l" ]; do if [[ $l =~ ^[[:space:]]*include(optional)?[[:space:]]+\"?([^\"[:space:]]+) ]]; then inc "${BASH_REMATCH[2]}"; else printf ''%s\n'' "$l"; fi; done < "$g"; done; }; cfg=$(inc "$c" | sed -e ''s/^[[:space:]]*//'' -e ''/^#/d'' -e ''/^$/d''); shopt -u nocasematch; ev(){ case $1 in ''${''*''}'') local n=${1#??}; n=${n%?}; local v; v=$(sed -n "s/^[[:space:]]*export[[:space:]]*$n=//p" "${APACHE_ENVVARS:-/etc/apache2/envvars}"
    2>/dev/null | tail -n1 | tr -d "\"''"); printf ''%s\n'' "${v:-$1}";; *) printf ''%s\n'' "$1";; esac; }; u=$(ev "$(printf ''%s\n'' "$cfg" | awk ''tolower($1)=="user"{v=$2} END{print v}'')"); [ -n "$u" ] && [ "${u#\$}" = "$u" ] || { echo noncompliant; exit 0; }; sh=$(getent passwd "$u" | cut -d: -f7) || exit 1; case "$sh" in */nologin|/dev/null) echo compliant;; *) echo noncompliant;; esac'
  expected_output: compliant
  requires_file:
  - /etc/apache2/apache2.conf
  - /etc/httpd/conf/httpd.conf
  - /usr/local/apache2/conf/httpd.conf
  - /etc/apache2/httpd.conf
remediation:
  type: iac_patch
  command: chsh -s /sbin/nologin <apache user> (use /usr/sbin/nologin on Debian/Ubuntu).
