id: TMA-APACHE-6.5
title: Ensure Applicable Patches Are Applied
description: 'Apply available Apache patches within 1 month of availability. Obviously knowing about newly discovered vulnerabilities is only part of the solution; there needs to be a process in place where patches are tested and installed. These patches fix diverse problems, including security issues. Manual review: the benchmark gives no reliable automated check for this control.'
target: apache
level: 1
severity: medium
tags:
- apache
- logging
reference: CIS Apache HTTP Server 2.4 Benchmark v2.4.0 - 6.5 Ensure Applicable Patches Are Applied
audit:
  type: manual
  command: 'Perform the following steps to determine if the recommended state is implemented: 1. When Apache was built from source: Check the Apache web site for latest versions, date of releases and any security patches. https://httpd.apache.org/security/vulnerabilities_24.html Apache patches are available https://www.apache.org/dist/httpd/patches If newer versions with security patches more than 1 month old and are not installed, then the installation is not sufficiently up-to-date. When using platform packages Check for vendor supplied updates from the vendor web site.'
remediation:
  type: iac_patch
  command: 'Update to the latest Apache release available according to either of the following: 1. When building from source: Read release notes and related security patch information Download latest source and any dependent modules such as mod_security. Build new Apache software according to your build process with the same configuration options. Install and test the new software according to your organization''s testing process. Move to production according to your organization''s deployment process. When using platform packages: Read release notes and related security patch information Download and install latest available Apache package and any dependent software. Test the new software according to your organization''s testing process. Move to production according to your organization''s deployment process.'
