id: TMA-WEBSPHERE-4.4.21
title: Ensure 'default-error-page' is set for web applications
description: When errors occur in a Web application or before the application dispatch, an error message is displayed to the user. By default, the app server displays an exception stack dump of the error. A default error handler or page should be defined for all applications. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.4.21 Ensure 'default-error-page' is set for web applications
audit:
  type: manual
  command: Ensure that the default-error-page attribute is set to an error page in the web-ext element of all of the webApplication elements in the Liberty configuration. grep -w -R -i 'default-error-page' ${server.config.dir} The default error page can also be set in the web.xml file in the application. For legacy web applications, the default error page can also be set in the ibm-web- ext.xml or ibm-web-ext.xmi files in the application.
remediation:
  type: iac_patch
  command: Add the default-error-page attribute on the web-ext element for all webApplication elements in ${server.config.dir}/configDropins/overrides/*.xml and set it to a valid error page. <webApplication ... > <web-ext default-error-page="errorPageName.jsp"/>
