id: TMA-WEBSPHERE-4.4.4
title: Ensure 'hostNameExcludeList' is set to the hostnames to be excluded for web traffic
description: Host names can be allowed or blocked from creating inbound TCP connections to different HTTP endpoints. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.4.4 Ensure 'hostNameExcludeList' is set to the hostnames to be excluded for web traffic
audit:
  type: manual
  command: Ensure the hostNameExcludeList attribute is set to a list of host names in all tcpOptions elements in the Liberty configuration. grep -w -R -i 'hostNameExcludeList' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add the hostNameExcludeList attribute to all tcpOptions elements to ${server.config.dir}/configDropins/overrides/*.xml and set to comma-separated list of host names. <tcpOptions hostNameExcludeList="*.abc.com,sample.all.com" />
