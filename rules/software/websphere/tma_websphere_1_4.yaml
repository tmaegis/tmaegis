id: TMA-WEBSPHERE-1.4
title: Ensure that only one user ID has write access to the WebSphere Liberty configuration files
description: Ensure that only one user ID has write access to the WebSphere Liberty configuration files. If there are multiple administrators, they can use sudo and the /etc/sudoers file to elevate their privilege when write access is required. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 1.4 Ensure that only one user ID has write access to the WebSphere Liberty configuration files
audit:
  type: manual
  command: Verify that all WebSphere administrators have been added to the group that owns the server's configuration directory, which will grant them read but not write access. Ensure that the user that owns the server's configuration directory is a non-login user. Use sudo and the /etc/sudoers file to grant the administrators the ability to elevate their privilege to the user that owns the server's configuration directory when write access is required.
remediation:
  type: iac_patch
  command: Create a single, non-login, user ID that owns the server's configuration directory. Add any WebSphere administrators to the group that owns the server's configuration directory, which will automatically give them read access to the server's configuration, but not write access. Use sudo and the /etc/sudoers file to allow these administrators to elevate their privilege to the user ID that owns the server's configuration directory when write access is required.
