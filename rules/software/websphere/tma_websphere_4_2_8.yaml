id: TMA-WEBSPHERE-4.2.8
title: Ensure that CA (Certificate Authority) certificates are used
description: SSL/TLS certificates are used to establish trust during the secure communications. Certificates can be a simple self-signed cert or can be from a well established or known CA authority. TMAegis cannot evaluate this reliably, so it is reported as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.2.8 Ensure that CA (Certificate Authority) certificates are used
audit:
  type: manual
  command: Ensure that Owner and Issuer values are not the same, which typically implies that the certificate is not be self signed. Other information in the certificate can also confirm this. keytool -list -v -keystore <keystore file name> -storepass <store password> - storetype <store type> | grep 'Owner\|Issuer'
remediation:
  type: iac_patch
  command: Add non self signed CA certificates as described here.
