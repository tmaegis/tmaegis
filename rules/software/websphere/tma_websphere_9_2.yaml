id: TMA-WEBSPHERE-9.2
title: Ensure the location attribute in the SSL configurations points to a valid SAF Keyring containing SSL/TLS certificates
description: 'The SAF Keyrings is a z/OS facility to hold the certificates that are used during the SSL/TLS communication. This recommendation only applies to Liberty on z/OS; on other platforms the audit reports not applicable and passes. Audit: reads server.xml, configDropins/defaults/*.xml, configDropins/overrides/*.xml and files pulled in with <include> for every Liberty server found under WLP_USER_DIR, /opt/ibm/wlp/usr, /opt/IBM/WebSphere/Liberty/usr, /opt/ol/wlp/usr, /usr/local/wlp/usr or /config; it ignores XML comments and fails if no server.xml is readable. Every <keyStore> must use a safkeyring: location with fileBased="false".'
target: websphere
level: 1
severity: high
tags:
- websphere
- zos
- tls
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 9.2 Ensure the location attribute in the SSL configurations points to a valid SAF Keyring containing SSL/TLS certificates
audit:
  type: command
  command: |-
    bad=0; n=0; nl='
    '
    r=""
    for b in "${WLP_USER_DIR:-}" /opt/ibm/wlp/usr /opt/IBM/WebSphere/Liberty/usr /opt/ol/wlp/usr /usr/local/wlp/usr; do
      [ -n "$b" ] && [ -d "$b/servers" ] || continue
      for s in "$b"/servers/*/; do [ -f "${s}server.xml" ] && r="$r$s$nl"; done
    done
    [ -f /config/server.xml ] && r="$r/config/$nl"
    strip(){ awk 'BEGIN{RS="<!--"} NR==1{printf "%s",$0; next} {i=index($0,"-->"); if(i) printf "%s",substr($0,i+3)}'; }
    gather(){ s=$1; { cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml; } 2>/dev/null | strip
      for loc in $(cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml 2>/dev/null | strip | tr '\r\n\t' '   ' | grep -oE '<include[[:space:]][^>]*>' | sed -n 's/.*location[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p'); do
        case $loc in http*) continue;; esac; loc=$(printf '%s' "$loc" | sed "s#\${server.config.dir}/*##"); case $loc in /*) f=$loc;; *) f=$s$loc;; esac
        [ -f "$f" ] && strip < "$f"; done; }
    tag(){ printf '%s\n' "$X" | grep -oE "<$1([[:space:]][^>]*)?>"; }
    chk(){ t=$(tag "$1"); if [ -z "$t" ]; then [ "$5" = na ] && return 0; [ "$4" = y ] && return 0; return 1; fi
      tot=$(printf '%s\n' "$t" | grep -c ''); v=$(printf '%s\n' "$t" | sed -n "s/.*[[:space:]]$2[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p"); st=0
      [ -n "$v" ] && st=$(printf '%s\n' "$v" | grep -c ''); case " config httpSession webAppSecurity jwtSso webContainer httpDispatcher applicationMonitor sslDefault httpOptions ltpa mpMetrics samesite transportLayer authenticationLayer attributeLayer " in *" $1 "*) [ "$st" -gt 0 ] && tot=$st;; esac; ok=$3; neg=n; case $ok in '!'*) neg=y; ok=${ok#!};; esac
      if [ "$st" -gt 0 ]; then m=$(printf '%s\n' "$v" | grep -ciE "^($ok)\$"); if [ "$neg" = n ]; then [ "$m" -eq "$st" ] || return 1; else [ "$m" -eq 0 ] || return 1; fi; fi
      [ "$st" -lt "$tot" ] && [ "$4" != y ] && return 1; return 0; }
    IFS="$nl"; for s in $r; do n=$((n+1)); X=$(gather "$s" | tr '\r\n\t' '   ' | tr -s ' ')
    [ "$(uname -s)" = "OS/390" ] || { echo "not applicable: not a z/OS system"; continue; }
    chk keyStore fileBased false n d || bad=1
    chk keyStore location "safkeyring:.*" n d || bad=1
    done; unset IFS; [ "$n" -gt 0 ] || exit 1; [ "$bad" -eq 0 ] && echo compliant || echo noncompliant
  expected_output: compliant
  shell: sh
  requires_file:
  - /opt/ibm/wlp/usr/servers
  - /opt/IBM/WebSphere/Liberty/usr/servers
  - /opt/ol/wlp/usr/servers
  - /usr/local/wlp/usr/servers
  - /config/server.xml
remediation:
  type: iac_patch
  command: Configure the location attribute in the keyStore elements referenced by the SSL configurations to point to a valid SAF Keyring location that contains the SSL/TLS certificates and set the fileBased attribute to false in ${server.config.dir}/configDropins/overrides/<any file name>.xml. <keyStore id="DefaultKeyStore" location="safkeyring:///Keyring.LIBERTY" type="JCERACFKS" fileBased="false" readOnly="true" /> <keyStore id="DefaultTrustStore" location="safkeyring:///Keyring.LIBERTY" type="JCERACFKS" fileBased="false" readOnly="true" />
