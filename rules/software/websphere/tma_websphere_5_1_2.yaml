id: TMA-WEBSPHERE-5.1.2
title: Ensure 'establishTrustInClient' is set to 'required' within the CSIv2 Authentication Layer
description: 'The CSIv2 Authentication policy configures security at the Authentication layer when accessing EJB applications using RMI/IIOP. Audit: reads server.xml, configDropins/defaults/*.xml, configDropins/overrides/*.xml and files pulled in with <include> for every Liberty server found under WLP_USER_DIR, /opt/ibm/wlp/usr, /opt/IBM/WebSphere/Liberty/usr, /opt/ol/wlp/usr, /usr/local/wlp/usr or /config; it ignores XML comments and fails if no server.xml is readable. establishTrustInClient on the CSIv2 <authenticationLayer> must be Required. Passes when no <authenticationLayer> element is configured (feature not in use). An unset attribute is accepted because the Liberty default is compliant.'
target: websphere
level: 1
severity: high
tags:
- websphere
- csiv2
- authentication
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 5.1.2 Ensure 'establishTrustInClient' is set to 'required' within the CSIv2 Authentication Layer
audit:
  type: command
  command: |-
    bad=0; n=0; nl='
    '
    r=""
    for b in "${WLP_USER_DIR:-}" /opt/ibm/wlp/usr /opt/IBM/WebSphere/Liberty/usr /opt/ol/wlp/usr /usr/local/wlp/usr; do
      [ -n "$b" ] && [ -d "$b/servers" ] || continue
      for s in "$b"/servers/*/; do [ -f "${s}server.xml" ] && r="$r$s$nl"; done
    done
    [ -f /config/server.xml ] && r="$r/config/$nl"
    strip(){ awk 'BEGIN{RS="<!--"} NR==1{printf "%s",$0; next} {i=index($0,"-->"); if(i) printf "%s",substr($0,i+3)}'; }
    gather(){ s=$1; { cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml; } 2>/dev/null | strip
      for loc in $(cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml 2>/dev/null | strip | tr '\r\n\t' '   ' | grep -oE '<include[[:space:]][^>]*>' | sed -n 's/.*location[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p'); do
        case $loc in http*) continue;; esac; loc=$(printf '%s' "$loc" | sed "s#\${server.config.dir}/*##"); case $loc in /*) f=$loc;; *) f=$s$loc;; esac
        [ -f "$f" ] && strip < "$f"; done; }
    tag(){ printf '%s\n' "$X" | grep -oE "<$1([[:space:]][^>]*)?>"; }
    chk(){ t=$(tag "$1"); if [ -z "$t" ]; then [ "$5" = na ] && return 0; [ "$4" = y ] && return 0; return 1; fi
      tot=$(printf '%s\n' "$t" | grep -c ''); v=$(printf '%s\n' "$t" | sed -n "s/.*[[:space:]]$2[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p"); st=0
      [ -n "$v" ] && st=$(printf '%s\n' "$v" | grep -c ''); case " config httpSession webAppSecurity jwtSso webContainer httpDispatcher applicationMonitor sslDefault httpOptions ltpa mpMetrics samesite transportLayer authenticationLayer attributeLayer " in *" $1 "*) [ "$st" -gt 0 ] && tot=$st;; esac; ok=$3; neg=n; case $ok in '!'*) neg=y; ok=${ok#!};; esac
      if [ "$st" -gt 0 ]; then m=$(printf '%s\n' "$v" | grep -ciE "^($ok)\$"); if [ "$neg" = n ]; then [ "$m" -eq "$st" ] || return 1; else [ "$m" -eq 0 ] || return 1; fi; fi
      [ "$st" -lt "$tot" ] && [ "$4" != y ] && return 1; return 0; }
    IFS="$nl"; for s in $r; do n=$((n+1)); X=$(gather "$s" | tr '\r\n\t' '   ' | tr -s ' ')
    chk authenticationLayer establishTrustInClient Required y na || bad=1
    done; unset IFS; [ "$n" -gt 0 ] || exit 1; [ "$bad" -eq 0 ] && echo compliant || echo noncompliant
  expected_output: compliant
  shell: sh
  requires_file:
  - /opt/ibm/wlp/usr/servers
  - /opt/IBM/WebSphere/Liberty/usr/servers
  - /opt/ol/wlp/usr/servers
  - /usr/local/wlp/usr/servers
  - /config/server.xml
remediation:
  type: iac_patch
  command: Set the establishTrustInClient attribute in ORB > serverPolicy.csiv2 > layers > authenticationLayer to Required in the ${server.config.dir}/configDropins/overrides/<any file name>.xml <orb id="defaultOrb"> <serverPolicy.csiv2> <layers> <authenticationLayer mechanisms="LTPA,GSSUP" establishTrustInClient="Required"/> </layers> </serverPolicy.csiv2> </orb>
