id: TMA-WEBSPHERE-1.2
title: Ensure extraneous files and directories are removed
description: The installation might provide example applications, documentation, and other directories which may not serve a production use. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 1.2 Ensure extraneous files and directories are removed
audit:
  type: manual
  command: 'Check for the existence of extraneous resources: $ ls -l ${wlp.user.dir}/extension \ ${wlp.user.dir}/shared \ ${wlp.user.dir}/server \ ${wlp.user.dir}/client There should be no non-production client extension/shared resource(s)/server/client in these folders'
remediation:
  type: iac_patch
  command: 'Remove extraneous resources for each: Extension: $ rm -rf ${wlp.user.dir}/extension/<non-production extension> Shared resource(s): $ rm -rf ${wlp.user.dir}/shared/<non-production shared resource(s)> Server: $ rm -rf ${wlp.user.dir}/server/<non-production server> Client: $ rm -rf ${wlp.user.dir}/client/<non-production client>'
