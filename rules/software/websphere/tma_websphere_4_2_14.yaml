id: TMA-WEBSPHERE-4.2.14
title: Ensure SP800-131a recommendation is used for stronger cryptographic keys and more robust algorithms.
description: The National Institute of Standards and Technology (NIST) SP800-131a recommendation enforces stronger cryptographic keys and more robust algorithms. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 2
severity: high
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.2.14 Ensure SP800-131a recommendation is used for stronger cryptographic keys and more robust algorithms.
audit:
  type: manual
  command: The SP800-131a recommendation can be enforced by setting the system property com.ibm.jsse2.sp800-131 to strict when using IBM JDK. For other JDKs, follow their specific instructions. Set com.ibm.jsse2.sp800-131=strict in the jvm.options file. More information on how to set the system properties provided in the reference section. grep -w -R -i 'com.ibm.jsse2.sp800-131=strict' ${server.config.dir}
remediation:
  type: iac_patch
  command: Configure the system property -Dcom.ibm.jsse2.sp800-131 to strict in the jvm.options file. The link in reference section provides more information on how to customize the Liberty environment with system properties. In the jvm.options file add the following -Dcom.ibm.jsse2.sp800-131=strict ...
