id: TMA-WEBSPHERE-7.4
title: Ensure the 'addressIncludeList' attribute is set to a whitelist of IP addresses
description: IP addresses can be allowed or blocked from creating inbound TCP connections to different HTTP endpoints. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 7.4 Ensure the 'addressIncludeList' attribute is set to a whitelist of IP addresses
audit:
  type: manual
  command: Ensure the addressIncludeList attribute is set to a list of IP addresses in all tcpOptions elements in the Liberty configuration. grep -w -R -i 'addressIncludeList' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add the addressIncludeList attribute to all tcpOptions elements to ${server.config.dir}/configDropins/overrides/*.xml and set to comma-separated list of IP Address. <tcpOptions addressIncludeList="254.*.*.9,255.0.0.2" />
