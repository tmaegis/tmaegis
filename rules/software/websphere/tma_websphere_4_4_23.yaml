id: TMA-WEBSPHERE-4.4.23
title: Ensure virtual hosts are Defined to isolate JMX communication and application traffic
description: 'Isolate JMX communication and application traffic using separate virtual hosts for applications. Audit: reads server.xml, configDropins/defaults/*.xml, configDropins/overrides/*.xml and files pulled in with <include> for every Liberty server found under WLP_USER_DIR, /opt/ibm/wlp/usr, /opt/IBM/WebSphere/Liberty/usr, /opt/ol/wlp/usr, /usr/local/wlp/usr or /config; it ignores XML comments and fails if no server.xml is readable. Requires a virtual-host name binding for the applications and at least one <virtualHost> whose id is not default_host, so that JMX traffic on default_host is separated from application traffic.'
target: websphere
level: 1
severity: medium
tags:
- websphere
- web-applications
- virtual-hosts
- jmx
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.4.23 Ensure virtual hosts are Defined to isolate JMX communication and application traffic
audit:
  type: command
  command: |-
    bad=0; n=0; nl='
    '
    r=""
    for b in "${WLP_USER_DIR:-}" /opt/ibm/wlp/usr /opt/IBM/WebSphere/Liberty/usr /opt/ol/wlp/usr /usr/local/wlp/usr; do
      [ -n "$b" ] && [ -d "$b/servers" ] || continue
      for s in "$b"/servers/*/; do [ -f "${s}server.xml" ] && r="$r$s$nl"; done
    done
    [ -f /config/server.xml ] && r="$r/config/$nl"
    strip(){ awk 'BEGIN{RS="<!--"} NR==1{printf "%s",$0; next} {i=index($0,"-->"); if(i) printf "%s",substr($0,i+3)}'; }
    gather(){ s=$1; { cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml; } 2>/dev/null | strip
      for loc in $(cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml 2>/dev/null | strip | tr '\r\n\t' '   ' | grep -oE '<include[[:space:]][^>]*>' | sed -n 's/.*location[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p'); do
        case $loc in http*) continue;; esac; loc=$(printf '%s' "$loc" | sed "s#\${server.config.dir}/*##"); case $loc in /*) f=$loc;; *) f=$s$loc;; esac
        [ -f "$f" ] && strip < "$f"; done; }
    tag(){ printf '%s\n' "$X" | grep -oE "<$1([[:space:]][^>]*)?>"; }
    chk(){ t=$(tag "$1"); if [ -z "$t" ]; then [ "$5" = na ] && return 0; [ "$4" = y ] && return 0; return 1; fi
      tot=$(printf '%s\n' "$t" | grep -c ''); v=$(printf '%s\n' "$t" | sed -n "s/.*[[:space:]]$2[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p"); st=0
      [ -n "$v" ] && st=$(printf '%s\n' "$v" | grep -c ''); case " config httpSession webAppSecurity jwtSso webContainer httpDispatcher applicationMonitor sslDefault httpOptions ltpa mpMetrics samesite transportLayer authenticationLayer attributeLayer " in *" $1 "*) [ "$st" -gt 0 ] && tot=$st;; esac; ok=$3; neg=n; case $ok in '!'*) neg=y; ok=${ok#!};; esac
      if [ "$st" -gt 0 ]; then m=$(printf '%s\n' "$v" | grep -ciE "^($ok)\$"); if [ "$neg" = n ]; then [ "$m" -eq "$st" ] || return 1; else [ "$m" -eq 0 ] || return 1; fi; fi
      [ "$st" -lt "$tot" ] && [ "$4" != y ] && return 1; return 0; }
    IFS="$nl"; for s in $r; do n=$((n+1)); X=$(gather "$s" | tr '\r\n\t' '   ' | tr -s ' ')
    printf "%s" "$X" | grep -q "virtual-host name" || bad=1
    tag virtualHost | sed -n "s/.*[[:space:]]id[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" | grep -qvx default_host || bad=1
    done; unset IFS; [ "$n" -gt 0 ] || exit 1; [ "$bad" -eq 0 ] && echo compliant || echo noncompliant
  expected_output: compliant
  shell: sh
  requires_file:
  - /opt/ibm/wlp/usr/servers
  - /opt/IBM/WebSphere/Liberty/usr/servers
  - /opt/ol/wlp/usr/servers
  - /usr/local/wlp/usr/servers
  - /config/server.xml
remediation:
  type: iac_patch
  command: 'Ensure the following to enable virtual hosting. 1. Configure the application with virtual-host name in the enterpriseApplication or webApplication elements in the [Liberty configuration]${server.config.dir}/configDropins/overrides/*.xml <webApplication ... > <web-bnd virtual-host name="myApplication1"/> </webApplication> Note: The virtual-host name can also be set in the ibm-web.bnd.xml file in the application. 2. Configure the application to use the specific virtual host in ${server.config.dir}/configDropins/overrides/*.xml. <virtualHost id="myApplication1"> <hostAlias>your_host_name:9080</hostAlias> </virtualHost>'
