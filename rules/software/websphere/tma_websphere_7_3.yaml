id: TMA-WEBSPHERE-7.3
title: Ensure the 'addressExcludeList' attribute is set to a whitelist of hostnames
description: IP addresses can be allowed or blocked from creating inbound TCP connections to different HTTP endpoints. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 7.3 Ensure the 'addressExcludeList' attribute is set to a whitelist of hostnames
audit:
  type: manual
  command: Ensure the addressExcludeList attribute is set to a list of hostnames in all tcpOptions elements in the Liberty configuration. grep -w -R -i 'addressExcludeList' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add the addressExcludeList attribute to all tcpOptions elements to ${server.config.dir}/configDropins/overrides/*.xml and set it to a comma- separated list of IP addresses. <tcpOptions addressExcludeList="254.1.0.9,*.1.255.0" />
