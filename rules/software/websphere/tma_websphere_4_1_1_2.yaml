id: TMA-WEBSPHERE-4.1.1.2
title: Ensure 'cookieHttpOnly' HttpOnly attribute is set to 'true' for session cookies
description: The HttpOnly attribute on a cookie prevents the cookie from being accessed by the client side scripts. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.1.1.2 Ensure 'cookieHttpOnly' HttpOnly attribute is set to 'true' for session cookies
audit:
  type: manual
  command: Ensure the cookieHttpOnly attribute in the httpSession element is set to true in the Liberty configuration grep -w -R -i 'cookieHttpOnly' ${server.config.dir}
remediation:
  type: iac_patch
  command: Set the cookieHttpOnly attribute to true in the httpSession element in the ${server.config.dir}/configDropins/overrides/<any file name>.xml <httpSession cookieHttpOnly="true" />
