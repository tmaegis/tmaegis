id: TMA-WEBSPHERE-4.4.6
title: Ensure 'hostNameIncludeList' is set to the host names that will be allowed for web traffic
description: Host names can be allowed or blocked from creating inbound TCP connections to different HTTP endpoints. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.4.6 Ensure 'hostNameIncludeList' is set to the host names that will be allowed for web traffic
audit:
  type: manual
  command: Ensure the hostNameIncludeList attribute is set to a list of host names in all tcpOptions elements in the Liberty configuration. grep -w -R -i 'hostNameIncludeList' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add the hostNameIncludeList attribute to all tcpOptions elements to ${server.config.dir}/configDropins/overrides/*.xml and set to comma-separated list of host names. <tcpOptions hostNameIncludeList="*.def.com,sample.here.com" />
