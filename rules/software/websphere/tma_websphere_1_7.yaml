id: TMA-WEBSPHERE-1.7
title: Ensure the WebSphere Liberty Installation is Validated
description: Ensure that all WebSphere Liberty binaries were installed successfully and that you are running the latest fix pack version. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 1.7 Ensure the WebSphere Liberty Installation is Validated
audit:
  type: manual
  command: 'Validate your WebSphere Liberty installation by running the command below: ${wlp_install_dir}/bin/productInfo validate Expected result: Start product validation... Product validation completed successfully. Validate that you are running with the latest fixpack. ${wlp_install_dir}/bin/productInfo version Expected result: Product version: YY.0.0.FP In the output, YY is the last two digits of the year that the fixpack was released, and FP represents the fixpack number for that year. Ensure that this matches that latest fixpack available from IBM.'
remediation:
  type: iac_patch
  command: If the audit procedure fails, remove your current installation and install from a more secure location, ensuring that you are installing the latest fixpack from a trusted source.
