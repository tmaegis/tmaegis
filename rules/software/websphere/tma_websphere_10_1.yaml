id: TMA-WEBSPHERE-10.1
title: Ensure Unused Features are Removed
description: The Websphere Liberty architecture provides developers with the option to tune their server to only the features that they need. For example, the JDBC feature only needs to be added if database access is required. If you did not want any remote administrative access to the REST interface, you would remove the REST feature. TMAegis cannot evaluate this reliably, so it is reported as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 10.1 Ensure Unused Features are Removed
audit:
  type: manual
  command: Review the configuration for features not being used in Liberty configuration. This includes aggregated features containing multiple features. The features are listed under in the featureManager element. To review all of the individual features used in the server, review the messages.log for the CWWKF0012I message. grep -w -R -i CWWKF0012I ${server.config.dir}
remediation:
  type: iac_patch
  command: Removed any unneeded features listed under the featureManager element in the Liberty configuration
