id: TMA-WEBSPHERE-4.1.2.1
title: Ensure 'sameSiteCookie' attribute is set to 'Strict'
description: The SameSite attribute is used by web browsers to determine if a particular cookie should be sent with a request. Setting this attribute can help protect against Cross Site Request Forgery (CSRF) attacks. It is recommended to set the SameSite attribute to Strict. A Strict value for the SameSite attribute ensures the cookie is only sent by the web browser if the site for the cookie matches the site in the address bar, for example. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.1.2.1 Ensure 'sameSiteCookie' attribute is set to 'Strict'
audit:
  type: manual
  command: Ensure the sameSiteCookie attribute is set to Strict in the webAppSecurity element in the Liberty configuration grep -w -R -i 'sameSiteCookie' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add the sameSiteCookie attribute to the webAppSecurity element in ${server.config.dir}/configDropins/overrides/<any file name>.xml. Set the sameSiteCookie value to Strict. <webAppSecurity sameSiteCookie="Strict"/>
