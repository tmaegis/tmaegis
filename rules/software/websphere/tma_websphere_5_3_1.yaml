id: TMA-WEBSPHERE-5.3.1
title: Ensure filters are configured for Java serialization (JEP 290)
description: Java provides configuration to allow incoming streams of object-serialization data to be filtered in order to improve both security and robustness. This allows The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: medium
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 5.3.1 Ensure filters are configured for Java serialization (JEP 290)
audit:
  type: manual
  command: Check for the System property jdk.serialFilter in the ${server.config.dir}/bootstrap.properties file or the security property in $JAVA_HOME/conf/security/java,properties and confirm it has the correct filters set to restrict Java deserialization to the trusted classes. jdk.serialFilter
remediation:
  type: iac_patch
  command: Set the System property jdk.serialFilter in the ${server.config.dir}/bootstrap.properties file to the correct filters to restrict classes to be deserialized. For example, jdk.serialFilter=!com.myCompany.restrictClass;com.myCompany.allowClass
