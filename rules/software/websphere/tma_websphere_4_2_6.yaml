id: TMA-WEBSPHERE-4.2.6
title: Ensure 'transport-guarantee' is set to 'CONFIDENTIAL' for all web applications
description: 'The transport-guarantee setting of CONFIDENTIAL will enforce that the application can only be accessed through HTTPS secure connection. HTTPS protocol protects the integrity and confidentiality of data between the client and the server. Audit: reads WEB-INF/web.xml of exploded applications (and of .war files when unzip is installed) under shared/apps, <server>/apps and <server>/dropins; every descriptor that has a <security-constraint> must contain transport-guarantee CONFIDENTIAL. Passes when no descriptor is found. Annotation-based and ibm-web-ext settings are not evaluated.'
target: websphere
level: 1
severity: medium
tags:
- websphere
- tls
- web-applications
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 4.2.6 Ensure 'transport-guarantee' is set to 'CONFIDENTIAL' for all web applications
audit:
  type: command
  command: |-
    bad=0; n=0; nl='
    '
    r=""
    for b in "${WLP_USER_DIR:-}" /opt/ibm/wlp/usr /opt/IBM/WebSphere/Liberty/usr /opt/ol/wlp/usr /usr/local/wlp/usr; do
      [ -n "$b" ] && [ -d "$b/servers" ] || continue
      for s in "$b"/servers/*/; do [ -f "${s}server.xml" ] && r="$r$s$nl"; done
    done
    [ -f /config/server.xml ] && r="$r/config/$nl"
    strip(){ awk 'BEGIN{RS="<!--"} NR==1{printf "%s",$0; next} {i=index($0,"-->"); if(i) printf "%s",substr($0,i+3)}'; }
    gather(){ s=$1; { cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml; } 2>/dev/null | strip
      for loc in $(cat "${s}server.xml" "${s}"configDropins/defaults/*.xml "${s}"configDropins/overrides/*.xml 2>/dev/null | strip | tr '\r\n\t' '   ' | grep -oE '<include[[:space:]][^>]*>' | sed -n 's/.*location[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p'); do
        case $loc in http*) continue;; esac; loc=$(printf '%s' "$loc" | sed "s#\${server.config.dir}/*##"); case $loc in /*) f=$loc;; *) f=$s$loc;; esac
        [ -f "$f" ] && strip < "$f"; done; }
    tag(){ printf '%s\n' "$X" | grep -oE "<$1([[:space:]][^>]*)?>"; }
    chk(){ t=$(tag "$1"); if [ -z "$t" ]; then [ "$5" = na ] && return 0; [ "$4" = y ] && return 0; return 1; fi
      tot=$(printf '%s\n' "$t" | grep -c ''); v=$(printf '%s\n' "$t" | sed -n "s/.*[[:space:]]$2[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p"); st=0
      [ -n "$v" ] && st=$(printf '%s\n' "$v" | grep -c ''); case " config httpSession webAppSecurity jwtSso webContainer httpDispatcher applicationMonitor sslDefault httpOptions ltpa mpMetrics samesite transportLayer authenticationLayer attributeLayer " in *" $1 "*) [ "$st" -gt 0 ] && tot=$st;; esac; ok=$3; neg=n; case $ok in '!'*) neg=y; ok=${ok#!};; esac
      if [ "$st" -gt 0 ]; then m=$(printf '%s\n' "$v" | grep -ciE "^($ok)\$"); if [ "$neg" = n ]; then [ "$m" -eq "$st" ] || return 1; else [ "$m" -eq 0 ] || return 1; fi; fi
      [ "$st" -lt "$tot" ] && [ "$4" != y ] && return 1; return 0; }
    descs(){ u=${s%servers/*/}; find "$u"shared/apps "${s}apps" "${s}dropins" -type f -path "*$1" 2>/dev/null; }
    wars(){ u=${s%servers/*/}; find "$u"shared/apps "${s}apps" "${s}dropins" -type f -name '*.war' 2>/dev/null; }
    appchk(){ # suffix guard-regex required-regex
      for f in $(descs "$1"); do C=$(cat "$f"); printf '%s' "$C" | grep -qE "$2" && { printf '%s' "$C" | grep -qE "$3" || return 1; }; done
      if command -v unzip >/dev/null 2>&1; then for w in $(wars); do C=$(unzip -p "$w" "$1" 2>/dev/null); [ -n "$C" ] && printf '%s' "$C" | grep -qE "$2" && { printf '%s' "$C" | grep -qE "$3" || return 1; }; done; fi; return 0; }
    IFS="$nl"; for s in $r; do n=$((n+1)); X=$(gather "$s" | tr '\r\n\t' '   ' | tr -s ' ')
    appchk WEB-INF/web.xml "<security-constraint" "<transport-guarantee>[[:space:]]*CONFIDENTIAL" || bad=1
    done; unset IFS; [ "$n" -gt 0 ] || exit 1; [ "$bad" -eq 0 ] && echo compliant || echo noncompliant
  expected_output: compliant
  shell: sh
  requires_file:
  - /opt/ibm/wlp/usr/servers
  - /opt/IBM/WebSphere/Liberty/usr/servers
  - /opt/ol/wlp/usr/servers
  - /usr/local/wlp/usr/servers
  - /config/server.xml
remediation:
  type: iac_patch
  command: 'Add the transport-guarantee attribute to user-data-constraint element under the security-constraint in ${wlp.user.dir}/shared/apps/WEB-INF/web.xml and set the value to CONFIDENTIAL. <security-constraint> ... <user-data-constraint> <transport-guarantee>CONFIDENTIAL</transport-guarantee> </user-data-constraint> Note: The security-constraints can also be set in the code using annotations like @ServletSecurity.TransportGuarantee'
