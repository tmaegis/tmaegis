id: TMA-WEBSPHERE-6.4
title: Ensure SOAP messages are Signed and encrypted with WS- Security policy
description: Signing and encrypting SOAP messages protects JAX-WS web services. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: high
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 6.4 Ensure SOAP messages are Signed and encrypted with WS- Security policy
audit:
  type: manual
  command: Ensure that SignedParts and EncryptedParts are specified in the WS-Security policy in wsdl or policy attachment files for each web service. grep -w -R 'SignedParts\|EncryptedParts' ${server.config.dir}
remediation:
  type: iac_patch
  command: Add SignedParts and EncryptedParts assertions to sign and encrypt SOAP Body wsdl or policy attachment files for each web service. <wsp:Policy> ... <sp:SignedParts> <sp:Body /> </sp:SignedParts> ... <sp:EncryptedParts> <sp:Body /> </sp:EncryptedParts> ... </wsp:Policy>
