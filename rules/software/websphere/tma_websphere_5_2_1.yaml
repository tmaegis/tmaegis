id: TMA-WEBSPHERE-5.2.1
title: Ensure 'sslEnabled' is set to 'true' within the CSIv2 TransportLayer - needsReview/Zech
description: The CSIv2 Transport policy configures security at the transport layer when accessing EJB applications using RMI/IIOP. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: high
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 5.2.1 Ensure 'sslEnabled' is set to 'true' within the CSIv2 TransportLayer - needsReview/Zech
audit:
  type: manual
  command: Ensure the sslEnabled attribute in the ORB > clientPolicy.csiv2 > layers > transportLayer element is set to true in the Liberty configuration grep -w -R -i 'sslEnabled' ${server.config.dir}
remediation:
  type: iac_patch
  command: Set the sslEnabled attribute in ORB > clientPolicy.csiv2 > layers > transportLayer to true in the ${server.config.dir}/configDropins/overrides/<any file name>.xml <orb id="defaultOrb"> <clientPolicy.csiv2> <layers> <transportLayer sslEnabled="true"/> </layers> </clientPolicy.csiv2> </orb>
