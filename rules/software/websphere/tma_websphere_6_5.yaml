id: TMA-WEBSPHERE-6.5
title: Ensure that 2048 bit keys are used for signing and encrypting SOAP messages with WS-Security policy
description: Using keys with at least 2048 bits in length when signing and encrypting SOAP messages using WS-Security policy is more secure. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: websphere
level: 1
severity: high
tags:
- websphere
- manual-review
reference: CIS IBM WebSphere Liberty Benchmark v1.0.0 - 6.5 Ensure that 2048 bit keys are used for signing and encrypting SOAP messages with WS-Security policy
audit:
  type: manual
  command: 'Use a keytool to view the keys used in signing and encrypting and ensure that the key size is 2048 bits or higher. keytool -list -v -keystore <keystore file name> -storepass <store password> - storetype <store type> | grep ''Signature algorithm name\|Subject Public Key Algorithm'' ... Signature algorithm name: SHA256withRSA Subject Public Key Algorithm: 2048-bit RSA key ...'
remediation:
  type: iac_patch
  command: Create signing and encryption keys with key size of 2048 bits or higher.
