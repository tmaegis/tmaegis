id: TMA-VMWARE-3.26
title: Host must enable the highest version of TLS supported
description: The host should be configured to operate using the highest version of TLS supported to ensure secure communications. ESXi 8, by default, comes with TLS 1.2 enabled, although re-enabling other protocols is possible if required. Employing the highest version of TLS aids in protecting against known vulnerabilities present in older versions. The audit reads UserVars.ESXiVPsDisabledProtocols with esxcli and requires sslv3, tlsv1 and tlsv1.1 to be listed. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- management
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 3.26 Host must enable the highest version of TLS supported
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /UserVars/ESXiVPsDisabledProtocols 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/^ *String Value: *//p' | head -n 1)
    if printf "%s" "$v" | tr "A-Z" "a-z" | tr -d " " | tr "," "\n" | grep -qx sslv3 && printf "%s" "$v" | tr "A-Z" "a-z" | tr -d " " | tr "," "\n" | grep -qx tlsv1 && printf "%s" "$v" | tr "A-Z" "a-z" | tr -d " " | tr "," "\n" | grep -qx "tlsv1[.]1"; then echo compliant; else echo "/UserVars/ESXiVPsDisabledProtocols = '$v' (expected sslv3,tlsv1,tlsv1.1 disabled)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /UserVars/ESXiVPsDisabledProtocols -s 'sslv3,tlsv1,tlsv1.1'
  guidance: "Disable unsupported/legacy protocol versions using Broadcom-supported TLS configuration procedures for ESXi 8 and dependent services. Test vCenter, backup, monitoring, and API integrations before broad deployment."
