id: TMA-VMWARE-8.1
title: VMware Tools must be a version that has not reached End of General Support status
description: 'Ensuring VMware Tools is running a version that has not reached its End of General Support (EOGS) status is imperative for maintaining a secure and supported environment. A version within its support period guarantees regular updates, security patches, and vendor support. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- vmware-tools
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 8.1 VMware Tools must be a version that has not reached End of General Support status
audit:
  type: manual
  command: 'Inside each guest OS: Within each applicable guest operating system, execute VMwareToolboxCmd.exe -v. Compare the installed VMware Tools version to Broadcom lifecycle/support information and verify it has not reached End of General Support.'
remediation:
  type: iac_patch
  command: To remediate this recommendation, upgrade VMware Tools to a supported release using vSphere, the guest package manager/open-vm-tools, or an enterprise software deployment tool. Reboot the guest if required and verify the installed version.
