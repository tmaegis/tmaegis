id: TMA-ESXI9-1.7
title: Host integrated hardware management controller must enable remote logging of events
description: 'The host''s integrated hardware management controller provides critical out-of-band server oversight. For enhanced security, it is essential to configure this controller to log events remotely. This practice ensures that hardware-related logs are sent to an off-site location, protecting them from potential tampering and offering a centralized record of server health and ... Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- hardware
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 1.7 Host integrated hardware management controller must enable remote logging of events
audit:
  type: manual
  command: Access the hardware management controller and verify that remote event logging/syslog forwarding is enabled and configured to send hardware, security, authentication, and management events to an approved centralized log collector.
remediation:
  type: iac_patch
  command: 'Locate the controller''s Syslog, Remote Logging, Event Forwarding, or equivalent configuration and: 1. Enable remote event logging. 2. Configure the hostname or IP address of the approved centralized log collector. 3. Configure the appropriate port and protocol. 4. Use TLS or another protected transport where supported. 5. Select the required event categories, including hardware, security, authentication, firmware, and administrative events. 6. Save the configuration.'
