id: TMA-ESXI9-8.15
title: VMware Tools must deactivate Guest Operations unless required
description: 'Guest Operations are a set of functions that underpin most host-to-guest interaction. Deactivating them reduces attack surface but also drastically reduces functionality. Ensure that your environment does not require these functions. Do not do this on template VMs. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 2
severity: low
tags:
- vmware
- esxi
- vmware-tools
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 8.15 VMware Tools must deactivate Guest Operations unless required
audit:
  type: manual
  command: 'Inside each guest OS: Within the guest operating system, execute vmware-toolbox-cmd config get guestoperations disabled (or VMwareToolboxCmd.exe). Unless Guest Operations is required, verify the value is true. Do not treat templates requiring guest customization as automatically noncompliant without reviewing the operational need.'
remediation:
  type: iac_patch
  command: To remediate this recommendation, execute vmware-toolbox-cmd config set guestoperations disabled true or VMwareToolboxCmd.exe config set guestoperations disabled true. Restart VMware Tools if required and test dependent workflows such as guest customization, backup, automation, and orchestration.
