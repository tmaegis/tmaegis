id: TMA-ESXI9-3.11
title: Host must enforce password complexity
description: The enforcement of password complexity is managed through the Security.PasswordQualityControl parameter, allowing configuration of password length, character set requirements, and failed logon attempt restrictions. The recommended setting is "retry=3 min=disabled,15,15,15,15 max=64 similar=deny passphrase=3". The audit reads Security.PasswordQualityControl with esxcli and requires min=disabled,disabled,disabled,disabled,N with N of 15 or more. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: high
tags:
- vmware
- esxi
- management
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 3.11 Host must enforce password complexity
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /Security/PasswordQualityControl 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/^ *String Value: *//p' | head -n 1)
    m=$(printf '%s\n' "$v" | tr ' ' '\n' | sed -n 's/^min=//p' | head -n 1)
    [ -n "$m" ] || { echo "no min= in '$v'"; exit 1; }
    printf '%s\n' "$m" | awk -F, '{ if (NF == 5 && $1 == "disabled" && $2 == "disabled" && $3 == "disabled" && $4 == "disabled" && $5 ~ /^[0-9]+$/ && $5 + 0 >= 15) print "compliant"; else print "min=" $0 }'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /Security/PasswordQualityControl -s 'retry=3 min=disabled,disabled,disabled,disabled,15'
  guidance: "To set the password complexity requirements, perform the following PowerCLI command: Get-VMHOST | Get-AdvancedSetting -Name \"Security.PasswordQualityControl\" | Set- AdvancedSetting -Value \"retry=3 min=disabled,disabled,disabled,disabled,15\" The above requires all passwords to be 15 or more characters long and comprised of at least one character from four distinct character sets."
