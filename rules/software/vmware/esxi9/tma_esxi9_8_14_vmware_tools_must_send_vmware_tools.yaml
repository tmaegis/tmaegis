id: TMA-ESXI9-8.14
title: VMware Tools must send VMware Tools logs to the system log service
description: 'Adjusting the logging destination in VMware Tools from the default file on disk to system log services streamlines log management. It redirects logs to syslog on Linux guests and the Windows Event Service on Microsoft Windows guests for centralized monitoring, management, and archiving. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- vmware-tools
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 8.14 VMware Tools must send VMware Tools logs to the system log service
audit:
  type: manual
  command: 'Inside each guest OS: Review VMware Tools logging destination and verify Tools messages are sent to the guest operating system''s system logging facility (syslog/journald on Linux or the approved Windows logging mechanism) rather than only to an unmanaged local file.'
remediation:
  type: iac_patch
  command: To remediate this recommendation, configure VMware Tools logging to use the system log service for the guest OS. Restart VMware Tools if required and verify a test Tools event reaches the system log.
