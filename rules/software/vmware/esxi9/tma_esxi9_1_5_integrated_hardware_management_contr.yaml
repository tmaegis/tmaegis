id: TMA-ESXI9-1.5
title: Host integrated hardware management controller must be secure
description: 'Many servers have integrated hardware management controllers that can be extremely helpful when monitoring and updating hardware, settings, and firmware. These controllers should be checked to ensure that ALL unused functionality is disabled, ALL unused access methods are disabled, passwords and password controls are set, and firewalling and access control is in place so that ... Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- hardware
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 1.5 Host integrated hardware management controller must be secure
audit:
  type: manual
  command: '1. Verify whether the ESXi host exposes a BMC interface: esxcli hardware ipmi bmc get 2. Find the hardware management controller and review: ; Firmware is current and vendor-supported. ; Default accounts and default passwords are not in use. ; Administrative accounts are individually assigned. ; Strong password/authentication policy is configured. ; MFA is enabled where supported. ; HTTPS/TLS is used for web management. ; Weak or obsolete protocols are disabled. ; SSH/IPMI access is disabled unless operationally required. ; Management access is restricted to authorized management networks.'
remediation:
  type: iac_patch
  command: Configure the controller according to the organization's secure-management baseline.
