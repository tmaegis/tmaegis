id: TMA-ESXI9-6.5.1
title: Host SSH daemon, if enabled, must use FIPS 140-2/140-3 validated ciphers
description: For enhanced security, if the SSH daemon is enabled on the host, it must utilize FIPS 140-2/140-3 validated ciphers. This requirement ensures the encryption standards are robust and compliant with regulatory mandates. The audit reads the Ciphers directive of /etc/ssh/sshd_config and requires only AES-based (FIPS-approved) ciphers. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- services
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 6.5.1 Host SSH daemon, if enabled, must use FIPS 140-2/140-3 validated ciphers
audit:
  type: command
  command: |-
    f=/etc/ssh/sshd_config; [ -r "$f" ] || exit 1
    c=$(awk 'tolower($1)=="ciphers" {print tolower($2); exit}' "$f")
    [ -n "$c" ] || { echo 'Ciphers not set explicitly'; exit 1; }
    bad=$(printf '%s\n' "$c" | tr ',' '\n' | grep -v '^aes' | tr '\n' ' ')
    [ -z "$bad" ] && echo compliant || echo "non-FIPS ciphers: $bad"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    f=/etc/ssh/sshd_config
    [ -f "$f" ] || exit 0
    k=ciphers; v=aes128-ctr,aes192-ctr,aes256-ctr
    cp -p "$f" "$f.tmaegis.bak" 2>/dev/null
    # the audit and sshd both honour the FIRST occurrence, so drop old lines and put ours first
    { printf '%s %s\n' "$k" "$v"; grep -viE "^[[:space:]]*$k[[:space:]]" "$f.tmaegis.bak"; } > "$f.tma.new" && cat "$f.tma.new" > "$f"
    rm -f "$f.tma.new"; true
  guidance: "To remediate this recommendation, configure the SSH daemon to use only the approved FIPS-capable cipher list supported by the installed ESXi build. Validate access from approved administration clients before deploying broadly."
