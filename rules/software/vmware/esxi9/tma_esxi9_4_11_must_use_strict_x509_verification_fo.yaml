id: TMA-ESXI9-4.11
title: Host must use strict x509 verification for TLS-enabled remote logging endpoints
description: When employing remote logging with TLS-enabled endpoints, it is essential to ensure the utmost integrity and authenticity of the certificates in use. The "x509-strict" option provides a higher level of security by performing additional validity checks on CA root certificates during the verification process. The audit reads Syslog.global.certificate.strictX509Compliance with esxcli and requires true (1). Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- logging
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 4.11 Host must use strict x509 verification for TLS-enabled remote logging endpoints
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /Syslog/global/certificate/strictX509Compliance 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk '$1=="Int" && $2=="Value:" {print $3; exit}')
    case "$v" in ''|*[!0-9-]*) echo '/Syslog/global/certificate/strictX509Compliance: no integer value'; exit 1 ;; esac
    if [ "$v" -eq 1 ]; then echo compliant; else echo "/Syslog/global/certificate/strictX509Compliance = $v (expected true/1)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /Syslog/global/certificate/strictX509Compliance -i 1
  guidance: "Utilize PowerCLI to remediate </> Powershell Get-VMHost | Get-AdvancedSetting -Name \"Syslog.global.certificate.strictX509Compliance\" | Set-AdvancedSetting -Value $true -Confirm:$false Verify with Get-VMHost | Get-AdvancedSetting -Name \"Syslog.global.certificate.strictX509Compliance\" Expected Calue is: Value = True"
