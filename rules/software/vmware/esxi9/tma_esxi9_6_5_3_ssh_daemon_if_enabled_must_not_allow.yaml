id: TMA-ESXI9-6.5.3
title: Host SSH daemon, if enabled, must not allow use of gateway ports
description: When enabled, the SSH daemon on the host should have the gateway ports feature disabled to prevent remote hosts from forwarding connections. This is a hardening measure to ensure that the SSH service is securely configured against potential forwarding misuses. The audit reads /etc/ssh/sshd_config and requires GatewayPorts no (unset = OpenSSH default no). Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- services
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 6.5.3 Host SSH daemon, if enabled, must not allow use of gateway ports
audit:
  type: command
  command: |-
    f=/etc/ssh/sshd_config; [ -r "$f" ] || exit 1
    v=$(awk 'tolower($1)=="gatewayports" {print tolower($2); exit}' "$f")
    case "$v" in '') echo compliant ;; no) echo compliant ;; *) echo "GatewayPorts $v" ;; esac
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    f=/etc/ssh/sshd_config
    [ -f "$f" ] || exit 0
    k=gatewayports; v=no
    cp -p "$f" "$f.tmaegis.bak" 2>/dev/null
    # the audit and sshd both honour the FIRST occurrence, so drop old lines and put ours first
    { printf '%s %s\n' "$k" "$v"; grep -viE "^[[:space:]]*$k[[:space:]]" "$f.tmaegis.bak"; } > "$f.tma.new" && cat "$f.tma.new" > "$f"
    rm -f "$f.tma.new"; true
  guidance: "To remediate this recommendation, set GatewayPorts no in the supported ESXi SSH configuration. Restart SSH only during an authorized maintenance/admin window and verify the effective setting."
