id: TMA-ESXI9-1.8
title: Host integrated hardware management controller must secure authentication
description: 'Connections to centralized authentication sources, like Active Directory, should be disabled or carefully considered as attack vectors and dependency loops (for authentication, authorization, DNS, DHCP, and time). Consider managing local accounts on these devices through the APIs and CLI interfaces provided. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 2
severity: low
tags:
- vmware
- esxi
- hardware
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 1.8 Host integrated hardware management controller must secure authentication
audit:
  type: manual
  command: '1. Access the hardware management controller and verify that: ; Default credentials are not in use. ; Each administrator has an individually assigned account. ; Shared administrative accounts are avoided. ; Strong password requirements are enforced. ; Multi-factor authentication is enabled where supported. ; Directory- based authentication such as LDAP/AD is used where supported. ; Anonymous or unauthenticated access is disabled. ; Unused local accounts are disabled or removed. ; Account lockout / throttling is enabled. ; Management sessions time out after inactivity.'
remediation:
  type: iac_patch
  command: 'Recommended remediations by configuring authentication according to the approved security baseline: 1. Change all default passwords. 2. Disable or rename default accounts where the platform permits. 3. Create individually assigned administrator accounts. 4. Remove or disable unused accounts. 5. Enforce strong password complexity and minimum-length requirements. 6. Configure account lockout or login throttling after repeated authentication failures. 7. Enable MFA where supported. 8. Integrate the controller with approved centralized authentication such as Active Directory, LDAP, RADIUS, or TACACS+ where supported. 9.'
