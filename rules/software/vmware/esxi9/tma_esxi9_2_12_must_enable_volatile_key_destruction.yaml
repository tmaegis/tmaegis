id: TMA-ESXI9-2.12
title: Host must enable volatile key destruction
description: By default, ESXi ensures that pages allocated for virtual machines (VMs), userspace applications, and kernel threads are zeroed out at the time of allocation, to prevent the exposure of sensitive data like cryptographic keys to other clients. However, these keys can remain in host memory for an extended period if the memory is not reused. The audit reads Mem.MemEagerZero with esxcli and requires 1. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 2
severity: low
tags:
- vmware
- esxi
- base
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 2.12 Host must enable volatile key destruction
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /Mem/MemEagerZero 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk '$1=="Int" && $2=="Value:" {print $3; exit}')
    case "$v" in ''|*[!0-9-]*) echo '/Mem/MemEagerZero: no integer value'; exit 1 ;; esac
    if [ "$v" -eq 1 ]; then echo compliant; else echo "/Mem/MemEagerZero = $v (expected 1)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /Mem/MemEagerZero -i 1
  guidance: "1. Utilize the administrative PowerCLI session. 2. Execute: Get-VMHost | Get-AdvancedSetting -Name Mem.MemEagerZero | Set-AdvancedSetting -Value 1 -Confirm:$false"
