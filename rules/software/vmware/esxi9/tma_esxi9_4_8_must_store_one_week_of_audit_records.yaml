id: TMA-ESXI9-4.8
title: Host must store one week of audit records
description: Ensuring a local storage capacity for a week's worth of audit records is imperative, especially when a remote audit record storage facility is used. This provision is critical during anticipated interruptions in record delivery to the remote facility, preventing loss or overwriting of audit records. The audit reads Syslog.global.auditRecord.storageCapacity (MiB) with esxcli and requires the recommended 100 or more; confirm it holds 7 days of records. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- logging
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 4.8 Host must store one week of audit records
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /Syslog/global/auditRecord/storageCapacity 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk '$1=="Int" && $2=="Value:" {print $3; exit}')
    case "$v" in ''|*[!0-9-]*) echo '/Syslog/global/auditRecord/storageCapacity: no integer value'; exit 1 ;; esac
    if [ "$v" -ge 100 ]; then echo compliant; else echo "/Syslog/global/auditRecord/storageCapacity = $v (expected 100 or more)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /Syslog/global/auditRecord/storageCapacity -i 100
  guidance: "Increase the local audit-record storage capacity to store at least 7 days worth of audit logs. execute: esxcli system auditrecords local set --size=<MiB>"
