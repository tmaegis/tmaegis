id: TMA-ESXI9-8.4
title: VMware Tools on deployed virtual machines must prevent being recustomized
description: 'Preventing re-customization of deployed virtual machines is essential to mitigate the risk of adversarial access through cloning and subsequent customization. Once a VM is deployed, it should be safeguarded against further customization to maintain the integrity of its configurations and data. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 2
severity: low
tags:
- vmware
- esxi
- vmware-tools
reference: CIS VMware ESXi 9.0 Benchmark v1.0.0 - 8.4 VMware Tools on deployed virtual machines must prevent being recustomized
audit:
  type: manual
  command: 'Inside each guest OS: Review VMware Tools guest customization settings on deployed VMs and verify deployed systems cannot be unexpectedly recustomized. Do not apply this control to templates where customization is intentionally required.'
remediation:
  type: iac_patch
  command: To remediate this recommendation, disable post-deployment recustomization using the VMware Tools configuration supported for the guest OS and environment. Test provisioning/customization workflows first and retain customization capability only on approved templates or build images.
