id: TMA-VMWARE-8.5
title: VMware Tools must limit the automatic addition of features
description: 'Limit the automatic addition of features during VMware Tools upgrade processes to maintain the desired security profile of the guest operating system from vSphere. This control can be managed by setting the configuration parameter to a specified value. The parameter governing this behavior is autoupgrade allow-add-feature with a recommended setting of false. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- vmware-tools
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 8.5 VMware Tools must limit the automatic addition of features
audit:
  type: manual
  command: 'Inside each guest OS: Review VMware Tools configuration for automatic feature installation. Verify that automatic addition of optional Tools features is disabled or restricted unless explicitly required by the guest''s management design.'
remediation:
  type: iac_patch
  command: To remediate this recommendation, configure VMware Tools so optional features are not automatically added during reconfiguration/upgrade. Use the supported vmware- toolbox-cmd config set/Windows VMwareToolboxCmd.exe config set mechanism or enterprise deployment package and document required exceptions.
