id: TMA-VMWARE-4.6
title: Host must enable audit record logging
description: Enabling audit record logging on ESXi hosts ensures the local storage of audit records, providing a trail of activities performed on the host. This measure is pivotal for accountability, troubleshooting, and security investigations. The parameter governing this behavior is Syslog.global.auditRecord.storageEnable with a recommended setting of TRUE. The audit reads Syslog.global.auditRecord.storageEnable with esxcli and requires true (1). Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- logging
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 4.6 Host must enable audit record logging
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /Syslog/global/auditRecord/storageEnable 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk '$1=="Int" && $2=="Value:" {print $3; exit}')
    case "$v" in ''|*[!0-9-]*) echo '/Syslog/global/auditRecord/storageEnable: no integer value'; exit 1 ;; esac
    if [ "$v" -eq 1 ]; then echo compliant; else echo "/Syslog/global/auditRecord/storageEnable = $v (expected true/1)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /Syslog/global/auditRecord/storageEnable -i 1
  guidance: "To enable local audit-record logging: 1. Execute command: esxcli system auditrecords local enable 2. Verify remediation with: esxcli system auditrecords get 3. passing results: Audit Record Storage Active: true"
