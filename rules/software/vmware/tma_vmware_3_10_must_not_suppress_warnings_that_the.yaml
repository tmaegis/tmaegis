id: TMA-VMWARE-3.10
title: Host must not suppress warnings that the shell is enabled
description: Having warnings for enabled SSH or ESXi Shell provides insight into potential security risks. Disabling such warnings can mask ongoing attacks. The parameter governing this behavior is UserVars.SuppressShellWarning with a recommended value of 0. The audit reads UserVars.SuppressShellWarning with esxcli and requires 0. Runs in the ESXi Shell (busybox sh) as root.
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- management
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 3.10 Host must not suppress warnings that the shell is enabled
audit:
  type: command
  command: |-
    out=$(esxcli system settings advanced list -o /UserVars/SuppressShellWarning 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | awk '$1=="Int" && $2=="Value:" {print $3; exit}')
    case "$v" in ''|*[!0-9-]*) echo '/UserVars/SuppressShellWarning: no integer value'; exit 1 ;; esac
    if [ "$v" -eq 0 ]; then echo compliant; else echo "/UserVars/SuppressShellWarning = $v (expected 0)"; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v esxcli >/dev/null 2>&1 || exit 0
    esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 0
  guidance: "From an administrative PowerCLI session. 1. Execute Get-VMHost | Get-AdvancedSetting -Name UserVars.SuppressShellWarning | Set-AdvancedSetting -Value 0 - Confirm:$false 2. Shell access should normally remain disabled; do not suppress the warning when it is enabled."
