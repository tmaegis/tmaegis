id: TMA-VMWARE-7.20
title: Virtual machines must limit access through the "dvfilter" network API
description: 'The dvFilter interface facilitates network traffic filtering and inspection, predominantly via tools like NSX. It''s vital to allow only authorized tools to access this interface to uphold network security. Unauthorized access could lead to illicit network traffic inspection or misuse. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- virtual-machine
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 7.20 Virtual machines must limit access through the "dvfilter" network API
audit:
  type: manual
  command: 'To verify this information utilize the vSphere interface as follows: 1. Select the VM then select Actions followed by Edit Settings. 2. Click on the VM Options tab then expand Advanced. 3. Click on EDIT CONFIGURATION. 4. Verify that ethernet0.filter1.name = dv-filter1 where ethernet0 is the network adapter interface of the virtual machine that is to be protected, filter1 is the number of the filter that is being used, and dv-filter1 is the name of the particular data path kernel module that is protecting the VM.'
remediation:
  type: iac_patch
  command: 'To set this configuration utilize the vSphere interface as follows: 1. Select the VM then select Actions followed by Edit Settings. 2. Click on the VM Options tab then expand Advanced. 3. Click on EDIT CONFIGURATION. 4. Remove the value from ethernet0.filter1.name = dv-filter. ; Parameters are removed when no value is present 5. Click OK. You may also configure a VM to allow dvfilter access via the following method in the VMX file: 1.'
