id: TMA-VMWARE-7.11
title: Virtual machines must remove unnecessary AHCI devices
description: 'Removing unnecessary devices from virtual machines minimizes the attack surface and reduces potential pathways for data exfiltration or unauthorized data capture. This practice aligns with the principle of least functionality, ensuring that VMs have only the essential components required to perform their designated functions. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- virtual-machine
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 7.11 Virtual machines must remove unnecessary AHCI devices
audit:
  type: manual
  command: Inspect VM hardware for unnecessary SATA/AHCI controllers. With PowerCLI/Get- View, review virtual devices and identify VirtualAHCIController devices that do not back a required virtual disk or CD/DVD device.
remediation:
  type: iac_patch
  command: To remediate this recommendation, power off the VM if required and remove unused AHCI/SATA controllers only after removing or moving dependent devices. Do not remove a controller that is actively backing a required virtual disk.
