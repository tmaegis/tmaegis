id: TMA-VMWARE-3.15
title: Host must be configured with an appropriate maximum password age
description: 'Implementing a maximum password age, as determined by the Security.PasswordMaxDays parameter, is aligned with modern password policies outlined in NIST 800-63B Section 5.1.1.2, which argue against forced periodic password changes provided that passwords have sufficient complexity. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- management
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 3.15 Host must be configured with an appropriate maximum password age
audit:
  type: manual
  command: From an administrative PowerCLI session 1. Execute Get-VMHost | Get-AdvancedSetting -Name Security.PasswordMaxDays 2. Verify that the value matches organizational policy or 99999 when periodic password rotation is not required by policy.
remediation:
  type: iac_patch
  command: 1. Set the approved value with Get-VMHost | Get-AdvancedSetting -Name Security.PasswordMaxDays | Set-AdvancedSetting -Value <approved_days> -Confirm:$false 2. Document any policy-driven value that differs from the benchmark baseline.
