id: TMA-VMWARE-1.1
title: Host hardware must have auditable, authentic, and up to date system & device firmware
description: 'Hardware firmware is not immune to serious issues affecting confidentiality, integrity, or availability. Vulnerable system management controllers & management engines can provide places for attackers to establish persistence, in order to re-infect and re- compromise hosts after reboots and updates. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- hardware
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 1.1 Host hardware must have auditable, authentic, and up to date system & device firmware
audit:
  type: manual
  command: 'The preferred approach is to utilize a vendor-supported, VMware-compatible firmware and driver combination. Leverage Broadcom''s Lifecycle Manager hardware compatibility checks or similar tools if available. If that is not available, manually inventory: ; System BIOS/UEFI ; BMC / iDRAC / iLO firmware ; TPM firmware ; RAID/storage controller firmware ; HBA firmware ; NIC firmware ; Fibre Channel adapter firmware ; NVMe / storage-device firmware where applicable'
remediation:
  type: iac_patch
  command: 'Proposed remediation guidelines: 1. Verify the exact server model and hardware components. 2. Obtain firmware only from the OEM/vendor: o Dell o HPE o Lenovo o Cisco o etc. 3. Verify that the proposed firmware and associated ESXi driver are supported for your ESXi 8 release. 4. Place the ESXi host in maintenance mode. 5. Apply firmware through the vendor-supported mechanism (for example): o Dell iDRAC / OpenManage o HPE iLO / SPP o Lenovo XClarity o Cisco UCS Manager o Vendor bootable firmware package o Vendor Hardware Support Manager 6. Reboot the physical host if required. 7. Re-run the firmware inventory. 8. Confirm device/driver/firmware compatibility. 9. Exit maintenance mode.'
