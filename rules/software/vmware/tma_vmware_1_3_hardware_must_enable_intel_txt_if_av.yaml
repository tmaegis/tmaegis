id: TMA-VMWARE-1.3
title: Host hardware must enable Intel TXT, if available
description: 'Intel Xeon Scalable Processor platforms have Trusted Execution Technology, or TXT, that help harden systems against malware, rootkits, BIOS & firmware attacks, and more. When enabled, ESXi will take advantage of security benefits offered by this technology. Manual review: the check needs vCenter/PowerCLI, firmware or guest access, or an organization-specific value.'
target: vmware
level: 1
severity: medium
tags:
- vmware
- esxi
- hardware
reference: CIS VMware ESXi 8.0 Benchmark v1.4.0 - 1.3 Host hardware must enable Intel TXT, if available
audit:
  type: manual
  command: '1. Execute: esxcli hardware trustedboot get 2. For hardware that supports Intel Trusted Execution Technology, verify: Drtm Enabled: true Tpm Present: true Note: If Drtm Enabled is false, determine whether Intel TXT is supported by the host hardware and firmware. If TXT is supported but not enabled, the host is not compliant.'
remediation:
  type: iac_patch
  command: Place the ESXi host into maintenance mode and reboot the physical server. Enter the system BIOS/UEFI configuration and enable TPM 2.0 and Intel Trusted Execution Technology (TXT), where supported. Save the firmware configuration and perform a full reboot.
