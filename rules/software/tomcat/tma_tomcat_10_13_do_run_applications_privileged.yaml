id: TMA-TOMCAT-10.13
title: Do not run applications as privileged
description: 'Setting the privileged attribute for an application changes the class loader to the Server class loader instead of the Shared class loader. Counts context files (conf/context.xml, conf/Catalina/*/*.xml, webapps/*/META-INF/context.xml) that set privileged="true"; expects 0. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- isolation
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 10.13 Do not run applications as privileged
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; n=0; for f in "$B/conf/context.xml" "$B"/conf/Catalina/*/*.xml "$B"/webapps/*/META-INF/context.xml; do [ -f "$f" ] || continue; x "$f" | grep -Eq '[[:space:]]privileged[[:space:]]*=[[:space:]]*.true' && n=$((n+1)); done; echo $n
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; for f in "$B/conf/context.xml" "$B"/conf/Catalina/*/*.xml "$B"/webapps/*/META-INF/context.xml; do
      [ -f "$f" ] && grep -Eq '[[:space:]]privileged[[:space:]]*=[[:space:]]*.true' "$f" || continue
      cp -p "$f" "$f.tmaegis.bak"
      sed -i -E "s/([[:space:]]privileged[[:space:]]*=[[:space:]]*)([\"'])true([\"'])/\\1\\2false\\3/" "$f"
    done
    echo "restart Tomcat for the change to take effect"; true
  guidance: "Remove privileged=\"true\" (default false) from every Context/Resources element. Restart Tomcat afterwards."
