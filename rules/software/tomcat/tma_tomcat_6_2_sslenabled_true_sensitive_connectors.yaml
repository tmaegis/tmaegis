id: TMA-TOMCAT-6.2
title: Ensure SSLEnabled is set to True for Sensitive Connectors
description: 'The SSLEnabled setting determines if SSL is enabled for a specific Connector. It is recommended that SSL be utilized for any Connector that sends or receives sensitive information, such as authentication credentials or personal information. Manual review: the benchmark gives no reliable automated check for this control.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- tls
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 6.2 Ensure SSLEnabled is set to True for Sensitive Connectors
audit:
  type: manual
  command: Review the server.xml and ensure all Connectors sending or receiving sensitive information have the SSLEnabled attribute set to true.
remediation:
  type: iac_patch
  command: In server.xml, set the SSLEnabled attribute to true for each Connector that sends or receives sensitive information <Connector … SSLEnabled="true" … />
