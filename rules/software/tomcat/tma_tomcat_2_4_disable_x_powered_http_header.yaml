id: TMA-TOMCAT-2.4
title: Disable X-Powered-By HTTP Header and Rename the Server Value for all Connectors
description: 'The xpoweredBy setting determines if Apache Tomcat will advertise its presence via the X-Powered-By HTTP header. It is recommended that this value be set to false. The server attribute overrides the default value that is sent down in the HTTP header further masking Apache Tomcat. Counts Connector elements in server.xml with xpoweredBy="true"; expects 0. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- information-disclosure
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 2.4 Disable X-Powered-By HTTP Header and Rename the Server Value for all Connectors
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; s=$(x "$B/conf/server.xml") || exit 1; printf '%s\n' "$s" | grep -E '^Connector[[:space:]]' | grep -Ec 'xpoweredBy[[:space:]]*=[[:space:]]*.true' || true
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; command -v perl >/dev/null 2>&1 || { echo "perl is required" >&2; exit 1; }
    f="$B/conf/server.xml"; [ -f "$f" ] || exit 0
    bk=$(mktemp -d) || exit 1; cp -p "$f" "$bk/server.xml"
    cat > "$bk/edit.pl" <<'TMAEOF'
    my ($tag, $attr, $val, $mode, $lim) = @ENV{qw(TC_TAG TC_ATTR TC_VAL TC_MODE TC_LIM)};
    local $/; my $t = <STDIN>;
    $t =~ s{(<$tag\b)([^>]*?)(\s*/?>)}{
      my ($a, $b, $c) = ($1, $2, $3);
      if ($b =~ /\b$attr\s*=\s*"([^"]*)"/) {
        my $cur = $1;
        my $keep = ($mode eq 'num' && $cur =~ /^\d+$/ && $cur >= 1 && $cur <= $lim) || ($mode eq 'from' && $cur eq $lim);
        $b =~ s/\b$attr\s*=\s*"[^"]*"/$attr="$val"/ unless $keep;
      } elsif ($mode ne 'from') { $b .= qq( $attr="$val") }
      "$a$b$c" }gse;
    print $t;
    TMAEOF
    TC_TAG=Connector TC_ATTR=xpoweredBy TC_VAL=false TC_MODE=from TC_LIM=false perl "$bk/edit.pl" < "$f" > "$f.tma.new" || exit 1

    if command -v xmllint >/dev/null 2>&1 && ! xmllint --noout "$f.tma.new" 2>/dev/null; then rm -f "$f.tma.new"; echo "result is not well-formed XML, unchanged" >&2; exit 1; fi
    [ -s "$f.tma.new" ] && cat "$f.tma.new" > "$f"; rm -f "$f.tma.new"; rm -rf "$bk"
    echo "restart Tomcat for the change to take effect"; true
  guidance: "Remove xpoweredBy=\"true\" (default false) from every <Connector> in server.xml. Restart Tomcat afterwards."
