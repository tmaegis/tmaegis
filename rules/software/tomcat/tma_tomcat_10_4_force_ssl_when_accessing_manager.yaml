id: TMA-TOMCAT-10.4
title: Force SSL when accessing the manager application via HTTP
description: 'Use the transport-guarantee attribute to ensure SSL protection when accessing the manager application. When the manager application is deployed, webapps/manager/WEB-INF/web.xml must set <transport-guarantee>CONFIDENTIAL</transport-guarantee>. Compliant when manager is not deployed. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored. CIS marks this recommendation Manual; the automated check implements its audit procedure.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- tls
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 10.4 Force SSL when accessing the manager application via HTTP
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; [ -e "$B/webapps/manager" ] || [ -e "$B/conf/Catalina/localhost/manager.xml" ] || { echo compliant; exit 0; }; x "$B/webapps/manager/WEB-INF/web.xml" 2>/dev/null | grep -Eq '^transport-guarantee>[[:space:]]*CONFIDENTIAL' && echo compliant || echo noncompliant
  expected_output: compliant
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Add <user-data-constraint><transport-guarantee>CONFIDENTIAL</transport-guarantee></user-data-constraint> to the manager security-constraint. Restart Tomcat afterwards.
