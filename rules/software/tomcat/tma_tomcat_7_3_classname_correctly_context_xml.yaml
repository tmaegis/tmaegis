id: TMA-TOMCAT-7.3
title: Ensure className is set correctly in context.xml
description: 'Ensure the className attribute is set to AccessLogValve. The className attribute determines the access log valve to be used for logging. Counts applications whose META-INF/context.xml has no AccessLogValve; expects 0. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- logging
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 7.3 Ensure className is set correctly in context.xml
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; [ -d "$B/webapps" ] || exit 1; n=0; for a in "$B"/webapps/*/; do [ -d "$a" ] || continue; x "$a/META-INF/context.xml" 2>/dev/null | grep -Eq '^Valve[[:space:]].*org\.apache\.catalina\.valves\.AccessLogValve' || n=$((n+1)); done; echo $n
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Add <Valve className="org.apache.catalina.valves.AccessLogValve" directory="$CATALINA_HOME/logs/" prefix="access_log" fileDateFormat="yyyy-MM-dd.HH" suffix=".log" pattern="%h %t %H cookie:%{SESSIONID}c request:%{SESSIONID}r %m %U %s %q %r"/> to each application META-INF/context.xml. Restart Tomcat afterwards.
