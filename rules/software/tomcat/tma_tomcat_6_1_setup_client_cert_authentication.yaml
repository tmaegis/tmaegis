id: TMA-TOMCAT-6.1
title: Setup Client-cert Authentication
description: 'Client-cert authentication requires that each client connecting to the server have a certificate to authenticate. This is generally regarded as stronger authentication than a password as it requires the client to have the certificate and not just know a password. At least one Connector/SSLHostConfig must require client certificates (clientAuth="true" or certificateVerification="required"). Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- tls
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 6.1 Setup Client-cert Authentication
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; s=$(x "$B/conf/server.xml") || exit 1; printf '%s\n' "$s" | awk 'function at(n,  r){if(match($0,"[[:space:]]" n "[[:space:]]*=[[:space:]]*[\"\047][^\"\047]*")){r=substr($0,RSTART,RLENGTH); sub(/^[^=]*=[[:space:]]*./,"",r); return r} return "-unset-"} /^(Connector|SSLHostConfig)[[:space:]]/ && (at("clientAuth")=="true" || at("certificateVerification")=="required") {ok=1} END{print ok?"compliant":"noncompliant"}'
  expected_output: compliant
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: On the TLS connector set <SSLHostConfig certificateVerification="required" ...> (or clientAuth="true"). Restart Tomcat afterwards.
