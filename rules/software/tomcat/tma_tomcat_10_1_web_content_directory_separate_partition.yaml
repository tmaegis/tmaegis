id: TMA-TOMCAT-10.1
title: Ensure Web content directory is on a separate partition from the Tomcat system files
description: 'Store web content on a separate partition from Tomcat system files. The web document directory is where the files which are served to the end user reside. In the past, directory traversal exploits have allowed malicious users to wreak havoc on a web server including executing code, uploading files, and reading sensitive data. The mount point of $CATALINA_BASE/webapps must differ from that of $CATALINA_HOME. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored. CIS marks this recommendation Manual; the automated check implements its audit procedure.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- filesystem
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 10.1 Ensure Web content directory is on a separate partition from the Tomcat system files
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; [ -d "$B/webapps" ] && [ -d "$H" ] || exit 1; a=$(df -P "$B/webapps" | awk 'NR==2{print $6}') || exit 1; b=$(df -P "$H" | awk 'NR==2{print $6}') || exit 1; [ -n "$a" ] && [ "$a" != "$b" ] && echo compliant || echo noncompliant
  expected_output: compliant
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Move the web content (appBase) to a dedicated partition and update appBase in server.xml. Restart Tomcat afterwards.
