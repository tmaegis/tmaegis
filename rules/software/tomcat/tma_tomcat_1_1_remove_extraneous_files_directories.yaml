id: TMA-TOMCAT-1.1
title: Remove extraneous files and directories
description: 'The installation may provide example applications, documentation, and other directories which may not serve a production use. Counts the default applications examples, docs, ROOT, host-manager and manager (directories or .war files) in $CATALINA_BASE/webapps; expects 0. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored. CIS marks this recommendation Manual; the automated check implements its audit procedure.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- deployment
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 1.1 Remove extraneous files and directories
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; [ -d "$B/webapps" ] || exit 1; n=0; for a in examples docs ROOT host-manager manager; do for p in "$B/webapps/$a" "$B/webapps/$a.war"; do [ -e "$p" ] && n=$((n+1)); done; done; echo $n
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: rm -rf $CATALINA_HOME/webapps/{examples,docs,ROOT,host-manager,manager} (and the matching .war files) unless required. Restart Tomcat afterwards.
