id: TMA-TOMCAT-5.1
title: Use secure Realms
description: 'A realm is a database of usernames and passwords used to identify valid users of web applications. Review the Realms configuration to ensure Tomcat is not configured to use MemoryRealm, JDBCRealm, UserDatabaseRealm, or JAASRealm. Counts Realm elements in server.xml using MemoryRealm, JDBCRealm, UserDatabaseRealm or JAASRealm (the default UserDatabaseRealm fails); expects 0. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- authentication
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 5.1 Use secure Realms
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; s=$(x "$B/conf/server.xml") || exit 1; printf '%s\n' "$s" | grep -E '^Realm[[:space:]]' | grep -Ec 'className[[:space:]]*=[[:space:]]*.[^"]*(MemoryRealm|JDBCRealm|UserDatabaseRealm|JAASRealm)' || true
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Replace these realms with DataSourceRealm or JNDIRealm (LDAP) in server.xml. Restart Tomcat afterwards.
