id: TMA-TOMCAT-10.5
title: Rename the manager application
description: 'The manager application allows administrators to manage Tomcat remotely via a web interface. The manager application should be renamed to make it harder for attackers or automated scripts to locate. Counts conf/Catalina/localhost/manager.xml, webapps/host-manager/manager.xml and webapps/manager; expects 0 (the manager is renamed or removed). Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored. CIS marks this recommendation Manual; the automated check implements its audit procedure.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- deployment
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 10.5 Rename the manager application
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; n=0; for p in "$B/conf/Catalina/localhost/manager.xml" "$B/webapps/host-manager/manager.xml" "$B/webapps/manager"; do [ -e "$p" ] && n=$((n+1)); done; echo $n
  expected_output: '0'
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Rename the manager application (move webapps/manager and its context descriptor to a non-default name) or remove it. Restart Tomcat afterwards.
