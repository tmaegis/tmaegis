id: TMA-TOMCAT-10.19
title: Ensure Manager Application Passwords are Encrypted
description: 'Apache Tomcat ships with a Manager Application which requires users with a role of manager-gui, manager-status, manager-script, and/or manager-jmx to authenticate. The usernames and passwords to log onto the Manager Application are stored in the tomcat-users.xml in plain text by default. Manual review: the benchmark gives no reliable automated check for this control.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- hardening
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 10.19 Ensure Manager Application Passwords are Encrypted
audit:
  type: manual
  command: 'Perform the following to determine if password digests are in use: $ grep -i <login-config>[.\n]*<auth-method>DIGEST</auth-method>[.\n]*<realm- name>UserDatabase</realm-name>[.\n]*</login-config> $CATALINA_HOME/webapps/manager/WEB-INF/web.xml If a Realm exists without a digest attribute or without a value for the digest attribute, this is a fail.'
remediation:
  type: iac_patch
  command: '1. Generate the encrypted password: cd $CATALINA_HOME/bin digest.bat -a sha-256 YOURPASSWORD This will return the original password followed by encrypted password: YOURPASSWORD:240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74 c720a9 2. Replace the plain text password with the above encrypted password generated above in CATALINA_HOME/conf/tomcat-user.xml file as follows. <user username="admin" password="240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c72 0a9" roles="manager-gui"/> 3. Add the digest element as a child to the login-config element where the realm-name element has a value of UserDatabase. For example: <login-config> <auth-method>DIGEST</auth-method> <realm-name>UserDatabase</realm-name> </login-config>'
