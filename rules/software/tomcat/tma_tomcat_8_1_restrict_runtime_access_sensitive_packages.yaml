id: TMA-TOMCAT-8.1
title: Restrict runtime access to sensitive packages
description: 'package.access grants or revokes access to listed packages during runtime. It is recommended that application access to certain packages be restricted. package.access in conf/catalina.properties must still contain sun., org.apache.catalina., org.apache.coyote., org.apache.tomcat. and org.apache.jasper. Whether additional packages are appropriate needs review. Reads $CATALINA_BASE (default /opt/tomcat) and $CATALINA_HOME (default: $CATALINA_BASE); set them for packaged installs (e.g. CATALINA_BASE=/var/lib/tomcat10, CATALINA_HOME=/usr/share/tomcat10). XML comments are ignored.'
target: tomcat
level: 1
severity: medium
tags:
- tomcat
- isolation
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 8.1 Restrict runtime access to sensitive packages
audit:
  type: command
  command: B=${CATALINA_BASE:-/opt/tomcat}; H=${CATALINA_HOME:-$B}; O=${TOMCAT_OWNER:-tomcat_admin}; G=${TOMCAT_GROUP:-tomcat}; x(){ [ -r "$1" ] || return 1; awk 'BEGIN{RS="<!--"} NR==1{print;next} {i=index($0,"-->"); if(i) print substr($0,i+3)}' "$1" | tr '\n\t\r' '   ' | tr '<' '\n'; }; f="$B/conf/catalina.properties"; [ -r "$f" ] || exit 1; v=$(awk '/^[[:space:]]*package\.access[[:space:]]*=/{p=1} p{l=$0; c=(l~/\\[[:space:]]*$/); sub(/\\[[:space:]]*$/,"",l); s=s l; if(!c) p=0} END{sub(/^[^=]*=/,"",s); gsub(/[[:space:]]/,"",s); print s}' "$f"); bad=0; for k in sun. org.apache.catalina. org.apache.coyote. org.apache.tomcat. org.apache.jasper.; do case ",$v," in *",$k,"*) ;; *) bad=1;; esac; done; [ "$bad" = 0 ] && echo compliant || echo noncompliant
  expected_output: compliant
  requires_file:
  - /opt/tomcat/conf/server.xml
  - /usr/local/tomcat/conf/server.xml
  - /usr/share/tomcat/conf/server.xml
  - /var/lib/tomcat9/conf/server.xml
  - /var/lib/tomcat10/conf/server.xml
  - /var/lib/tomcat11/conf/server.xml
remediation:
  type: iac_patch
  command: Set package.access = sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.apache.tomcat. (plus any site-specific packages) in conf/catalina.properties. Restart Tomcat afterwards.
