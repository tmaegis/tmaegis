id: TMA-TOMCAT-1.2
title: Disable Unused Connectors
description: 'The default installation of Tomcat includes connectors with default settings. These are traditionally set up for convenience. It is best to remove these connectors and enable only what is needed. Manual review: the benchmark gives no reliable automated check for this control.'
target: tomcat
level: 2
severity: low
tags:
- tomcat
- hardening
reference: CIS Apache Tomcat 10.1 Benchmark v1.0.0 - 1.2 Disable Unused Connectors
audit:
  type: manual
  command: 'Execute the following command to find configured Connectors. Ensure only those required are present and not commented out: $ grep "Connector" $CATALINA_HOME/conf/server.xml'
remediation:
  type: iac_patch
  command: 'Within the $CATALINA_HOME/conf/server.xml, remove, or comment out, each unused Connector. For example, to disable an instance of the HTTPConnector, remove the following: <Connector className="org.apache.catalina.connector.http.HttpConnector" ... connectionTimeout="60000"/>'
