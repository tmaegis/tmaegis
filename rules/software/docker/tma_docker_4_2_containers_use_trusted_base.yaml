id: TMA-DOCKER-4.2
title: Ensure that containers use only trusted base images
description: 'You should ensure that container images you use are either written from scratch or are based on another established and trusted base image downloaded over a secure channel. Official repositories contain Docker images curated and optimized by the Docker community or by their vendor. There is no guarantee that these images are safe and do not contain security vulnerabilities or malicious ... Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.2 Ensure that containers use only trusted base images
audit:
  type: manual
  command: 'You should review what Docker images are present on the host by executing the command below: docker images This command lists all the container images that are currently available for use on the Docker host. You should then review the origin of each image and review its contents in line with your organization''s security policy. You can use the command below to review the history of commits to the image. docker history <imageName>'
remediation:
  type: iac_patch
  command: The following procedures are useful for establishing trust for a specific image. Configure and use Docker Content trust. View the history of each Docker image to evaluate its risk, dependent on the sensitivity of the application you wish to deploy using it. Scan Docker images for vulnerabilities at regular intervals.
