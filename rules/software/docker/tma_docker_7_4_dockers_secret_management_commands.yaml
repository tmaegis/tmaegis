id: TMA-DOCKER-7.4
title: Ensure that Docker's secret management commands are used for managing secrets in a swarm cluster
description: 'You should use Docker''s in-built secret management command for control of secrets. Docker has various commands for managing secrets in a swarm cluster. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 7.4 Ensure that Docker's secret management commands are used for managing secrets in a swarm cluster
audit:
  type: manual
  command: 'On a swarm manager node, you should run the command below and ensure docker secret management is used in your environment where this is in line with your IT security policy. docker secret ls Expected state: You should follow the docker secret documentation and use it to manage secrets effectively.'
remediation:
  type: iac_patch
  command: You should follow the docker secret documentation and use it to manage secrets effectively.
