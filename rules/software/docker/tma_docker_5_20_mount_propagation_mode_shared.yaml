id: TMA-DOCKER-5.20
title: Ensure mount propagation mode is not set to shared
description: A shared (or rshared) mount propagates mount changes between the container and the host. Flags containers with any mount whose Propagation is shared or rshared. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: medium
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.20 Ensure mount propagation mode is not set to shared
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}}{{range .Mounts}} {{.Propagation}}{{end}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '/ r?shared( |$)/ {print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: iac_patch
  command: Redeploy without :shared/:rshared bind-mount propagation (use the default rprivate, or slave if required).
