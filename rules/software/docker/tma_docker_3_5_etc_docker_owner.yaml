id: TMA-DOCKER-3.5
title: Ensure that the /etc/docker directory ownership is set to root:root
description: The /etc/docker directory (holds TLS keys and daemon config) must be owned by root:root so that unprivileged users cannot alter Docker behaviour. The audit stats every existing candidate path (/etc/docker); not applicable when none exists.
target: docker
level: 1
severity: high
tags:
- docker
- permissions
reference: CIS Docker Benchmark v1.9.0 - 3.5 Ensure that the /etc/docker directory ownership is set to root:root
audit:
  type: command
  command: for f in /etc/docker; do [ -e "$f" ] || continue; o=$(stat -Lc '%U:%G' "$f") || exit 1; [ "$o" = root:root ] || { echo "$f $o"; exit 0; }; done; echo compliant
  expected_output: compliant
  requires_file:
  - /etc/docker
remediation:
  type: command
  command: for f in /etc/docker; do if [ -e "$f" ]; then chown root:root "$f" || exit 1; fi; done
