id: TMA-DOCKER-4.10
title: Ensure only verified packages are installed
description: 'You should verify the authenticity of packages before installing them into images. Verifying authenticity of software packages is essential for building a secure container image. Packages with no known provenance could potentially be malicious or have vulnerabilities that could be exploited. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 2
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.10 Ensure only verified packages are installed
audit:
  type: manual
  command: 'Run the command below to get the list of images: docker images Run the command below for each image in the list above, and check how the authenticity of the packages is being determined. This could be via the use of GPG keys or other secure package distribution mechanisms. docker history <IMAGE ID> Alternatively, if you have access to Dockerfile for the image, verify that the authenticity of the packages is checked.'
remediation:
  type: iac_patch
  command: You should use a secure package distribution mechanism of your choice to ensure the authenticity of software packages.
