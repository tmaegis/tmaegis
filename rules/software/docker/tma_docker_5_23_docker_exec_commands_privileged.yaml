id: TMA-DOCKER-5.23
title: Ensure that docker exec commands are not used with the privileged option
description: 'You should not use docker exec with the --privileged option. Using the --privileged option in docker exec commands gives extended Linux capabilities to the command. This could potentially be an insecure practice, particularly when you are running containers with reduced ... Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 2
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 5.23 Ensure that docker exec commands are not used with the privileged option
audit:
  type: manual
  command: 'If you have auditing enabled as recommended in Section 1, you can use the command below to filter out docker exec commands that use the --privileged option. ausearch -k docker | grep exec | grep privileged Expected state: You should not use the --privileged option in docker exec commands.'
remediation:
  type: iac_patch
  command: You should not use the --privileged option in docker exec commands.
