id: TMA-DOCKER-4.11
title: Ensure all signed artifacts are validated
description: 'Validate artifacts signatures before uploading to the package registry. Cryptographic signature is a tool to verify artifact authenticity. Every artifact is supposed to be signed by its creator in order to verify that it wasn''t compromised until it got to the client. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.11 Ensure all signed artifacts are validated
audit:
  type: manual
  command: 'Ensure every artifact in the package has been validated with its signature. Expected state: Validate every artifact with its signature. It is recommended to do so automatically.'
remediation:
  type: iac_patch
  command: Validate every artifact with its signature. It is recommended to do so automatically.
