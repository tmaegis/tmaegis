id: TMA-DOCKER-5.5
title: Ensure that privileged containers are not used
description: A privileged container gets all capabilities and device access and can trivially take over the host. Flags containers with HostConfig.Privileged true. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: critical
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.5 Ensure that privileged containers are not used
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}} {{.HostConfig.Privileged}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '$2=="true" {print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: iac_patch
  command: 'Redeploy without --privileged (compose: remove ''privileged: true''); grant only specific capabilities or devices that are required.'
