id: TMA-DOCKER-5.28
title: Ensure that Docker commands always make use of the latest version of their image
description: 'You should always ensure that you are using the latest version of the images within your repository and not cached older versions. Multiple Docker commands such as docker pull, docker run etc. are known to have an issue where by default, they extract the local copy of the image, if present, even though there is an updated version of the image with ... Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 5.28 Ensure that Docker commands always make use of the latest version of their image
audit:
  type: manual
  command: 'You should carry out the following steps: Step 1: Open your image repository and list the image version history for the image you are inspecting. Step 2: Observe the status when the docker pull command is triggered. If the status is shown as Image is up to date, it means that you are getting the cached version of the image. Step 3: Match the version of the image you are running to the latest version reported in your repository and this will tell you whether you are running the cached version or the latest copy.'
remediation:
  type: iac_patch
  command: You should use proper version pinning mechanisms (the "latest" tag which is assigned by default is still vulnerable to caching attacks) to avoid extracting cached older versions. Version pinning mechanisms should be used for base images, packages, and entire images. You can customize version pinning rules according to your requirements.
