id: TMA-DOCKER-5.22
title: Ensure the default seccomp profile is not Disabled
description: The default seccomp profile blocks dangerous syscalls; seccomp=unconfined removes that protection. Flags containers whose SecurityOpt disables seccomp. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: high
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.22 Ensure the default seccomp profile is not Disabled
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}}{{range .HostConfig.SecurityOpt}} {{.}}{{end}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '/seccomp[:=]unconfined/{print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: iac_patch
  command: Redeploy without --security-opt seccomp=unconfined; supply a tailored profile with --security-opt seccomp=<profile.json> if needed.
