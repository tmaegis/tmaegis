id: TMA-DOCKER-4.4
title: Ensure images are scanned and rebuilt to include security patches
description: 'Images should be scanned frequently for any vulnerabilities. You should rebuild all images to include these patches and then instantiate new containers from them. Vulnerabilities are loopholes or bugs that can be exploited by hackers or malicious users, and security patches are updates to resolve these vulnerabilities. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.4 Ensure images are scanned and rebuilt to include security patches
audit:
  type: manual
  command: 'List all the running instances of containers by executing the command below: docker ps --quiet For each container instance, use the package manager within the container (assuming there is one available) to check for the availability of security patches. Alternatively, run image vulnerability assessment tools to scan all the images in your environment.'
remediation:
  type: iac_patch
  command: Images should be re-built ensuring that the latest version of the base images are used, to keep the operating system patch level at an appropriate level. Once the images have been re-built, containers should be re-started making use of the updated images.
