id: TMA-DOCKER-5.26
title: Ensure that the container is restricted from acquiring additional privileges
description: no-new-privileges stops processes in the container gaining privileges through setuid/setgid binaries. Compliant when it is set daemon-wide in daemon.json (container SecurityOpt then stays empty) or every running container has it in SecurityOpt. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: high
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.26 Ensure that the container is restricted from acquiring additional privileges
audit:
  type: command
  command: grep -Eq '"no-new-privileges"[[:space:]]*:[[:space:]]*true' /etc/docker/daemon.json 2>/dev/null && { echo compliant; exit 0; }; ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}}{{range .HostConfig.SecurityOpt}} {{.}}{{end}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '!/no-new-privileges(:true|=true)?( |$)/{print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v docker >/dev/null 2>&1 || command -v dockerd >/dev/null 2>&1 || exit 0
    command -v jq >/dev/null 2>&1 || { echo "jq is required to edit /etc/docker/daemon.json" >&2; exit 1; }
    f=/etc/docker/daemon.json
    mkdir -p /etc/docker
    [ -s "$f" ] || echo '{}' > "$f"
    jq -e . "$f" >/dev/null 2>&1 || { echo "$f is not valid JSON, not touching it" >&2; exit 1; }
    cp -p "$f" "$f.tmaegis.bak"
    jq '.["no-new-privileges"]=true' "$f.tmaegis.bak" > "$f.tma.new" || { rm -f "$f.tma.new"; exit 1; }
    if command -v dockerd >/dev/null 2>&1 && ! dockerd --validate --config-file "$f.tma.new" >/dev/null 2>&1; then
      rm -f "$f.tma.new"; echo "dockerd rejected the new configuration, left unchanged" >&2; exit 1; fi
    if cmp -s "$f.tma.new" "$f"; then rm -f "$f.tma.new"; exit 0; fi
    cat "$f.tma.new" > "$f"; rm -f "$f.tma.new"
    # reload (SIGHUP) only; a full restart interrupts containers unless live-restore is on
    systemctl reload docker 2>/dev/null || true; true
  guidance: "Run containers with --security-opt=no-new-privileges (compose: security_opt: [\"no-new-privileges:true\"]) or set \"no-new-privileges\": true in /etc/docker/daemon.json."
