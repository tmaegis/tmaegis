id: TMA-DOCKER-5.21
title: Ensure that the host's UTS namespace is not shared
description: Sharing the host's UTS namespace allows the container to change the host's hostname. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: medium
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.21 Ensure that the host's UTS namespace is not shared
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}} {{.HostConfig.UTSMode}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '$2=="host"{print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: iac_patch
  command: 'Redeploy without --uts=host (compose: remove ''uts: host'').'
