id: TMA-DOCKER-3.1
title: Ensure that the docker.service file ownership is set to root:root
description: The docker.service unit file must be owned by root:root so that unprivileged users cannot alter Docker behaviour. The audit stats every existing candidate path (/usr/lib/systemd/system/docker.service, /lib/systemd/system/docker.service, /etc/systemd/system/docker.service); not applicable when none exists.
target: docker
level: 1
severity: high
tags:
- docker
- permissions
reference: CIS Docker Benchmark v1.9.0 - 3.1 Ensure that the docker.service file ownership is set to root:root
audit:
  type: command
  command: for f in /usr/lib/systemd/system/docker.service /lib/systemd/system/docker.service /etc/systemd/system/docker.service; do [ -e "$f" ] || continue; o=$(stat -Lc '%U:%G' "$f") || exit 1; [ "$o" = root:root ] || { echo "$f $o"; exit 0; }; done; echo compliant
  expected_output: compliant
  requires_file:
  - /usr/lib/systemd/system/docker.service
  - /lib/systemd/system/docker.service
  - /etc/systemd/system/docker.service
remediation:
  type: command
  command: for f in /usr/lib/systemd/system/docker.service /lib/systemd/system/docker.service /etc/systemd/system/docker.service; do if [ -e "$f" ]; then chown root:root "$f" || exit 1; fi; done
