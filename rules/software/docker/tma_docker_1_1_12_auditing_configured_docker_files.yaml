id: TMA-DOCKER-1.1.12
title: Ensure auditing is configured for Docker files and directories - /etc/containerd/config.toml
description: Auditing /etc/containerd/config.toml records changes to and use of a security-relevant Docker/containerd component, supporting incident investigation. The audit lists the loaded kernel audit rules (auditctl -l, needs root) and looks for a watch or path rule on /etc/containerd/config.toml. Not applicable when /etc/containerd/config.toml is not present.
target: docker
level: 2
severity: medium
tags:
- docker
- auditd
- host
reference: CIS Docker Benchmark v1.9.0 - 1.1.12 Ensure auditing is configured for Docker files and directories - /etc/containerd/config.toml
audit:
  type: command
  command: out=$(auditctl -l 2>/dev/null) || exit 1; printf '%s\n' "$out" | grep -Eq -e '[ =]/etc/containerd/config\.toml/?( |$)' && echo compliant || echo missing
  expected_output: compliant
  requires_file:
  - /etc/containerd/config.toml
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v auditctl >/dev/null 2>&1 || exit 0
    mkdir -p /etc/audit/rules.d
    f=/etc/audit/rules.d/docker.rules
    grep -qxF -e '-w /etc/containerd/config.toml -k docker' "$f" 2>/dev/null || echo '-w /etc/containerd/config.toml -k docker' >> "$f"
    augenrules --load >/dev/null 2>&1 || auditctl -w /etc/containerd/config.toml -k docker 2>/dev/null || true; true
  guidance: "Add '-w /etc/containerd/config.toml -k docker' to /etc/audit/rules.d/docker.rules, then load it with 'augenrules --load' (or restart auditd)."
