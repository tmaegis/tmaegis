id: TMA-DOCKER-5.24
title: Ensure that docker exec commands are not used with the user=root option
description: 'You should not use docker exec with the --user=root option. Using the --user=root option in a docker exec command, executes it within the container as the root user. This could potentially be insecure, particularly when you are running containers with reduced capabilities or ... Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 2
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 5.24 Ensure that docker exec commands are not used with the user=root option
audit:
  type: manual
  command: 'If you have auditing enabled as recommended in Section 1, you can use the command below to filter out docker exec commands that use the --user=root option. ausearch -k docker | grep exec | grep user Expected state: You should not use the --user=root option in docker exec commands.'
remediation:
  type: iac_patch
  command: You should not use the --user=root option in docker exec commands.
