id: TMA-DOCKER-5.11
title: Ensure that the memory usage for containers is limited
description: Without a memory limit a single container can exhaust host memory (denial of service). Flags containers with HostConfig.Memory = 0. The audit inspects every running container (docker ps -q) and prints the offending names; a host with no running containers is compliant.
target: docker
level: 1
severity: medium
tags:
- docker
- runtime
reference: CIS Docker Benchmark v1.9.0 - 5.11 Ensure that the memory usage for containers is limited
audit:
  type: command
  command: ids=$(docker ps -q) || exit 1; [ -z "$ids" ] && { echo compliant; exit 0; }; out=$(docker inspect --format '{{.Name}} {{.HostConfig.Memory}}' $ids) || exit 1; bad=$(printf '%s\n' "$out" | awk '$2=="0"{print $1}'); [ -z "$bad" ] && echo compliant || printf '%s\n' "$bad"
  expected_output: compliant
  requires_file:
  - /usr/bin/docker
  - /usr/local/bin/docker
  - /usr/bin/dockerd
  - /usr/local/bin/dockerd
remediation:
  type: iac_patch
  command: 'Redeploy with a memory limit (docker run --memory=512m ...; compose: deploy.resources.limits.memory / mem_limit).'
