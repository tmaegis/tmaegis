id: TMA-DOCKER-2.9
title: Ensure the default ulimit is configured appropriately
description: 'Set the default ulimit options as appropriate in your environment. ulimit provides control over the resources available to the shell and to processes which it starts. Setting system resource limits judiciously can save you from disasters such as a fork bomb. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 2.9 Ensure the default ulimit is configured appropriately
audit:
  type: manual
  command: 'To confirm this setting you should review the dockerd start-up options and any settings in /etc/docker/daemon.json. To review the dockerd startup options, use: ps -ef | grep dockerd Ensure that the --default-ulimit parameter is set as appropriate. The contents of /etc/docker/daemon.json should also be reviewed for this setting.'
remediation:
  type: iac_patch
  command: 'Run Docker in daemon mode and pass --default-ulimit as argument with respective ulimits as appropriate in your environment and in line with your security policy. For example: dockerd --default-ulimit nproc=1024:2048 --default-ulimit nofile=100:200'
