id: TMA-DOCKER-4.3
title: Ensure that unnecessary packages are not installed in the container
description: 'Containers should have as small a footprint as possible, and should not contain unnecessary software packages which could increase their attack surface. Unnecessary software should not be installed into containers, as doing so increases their attack surface. Only packages strictly necessary for the correct operation of the application being deployed should be installed. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.3 Ensure that unnecessary packages are not installed in the container
audit:
  type: manual
  command: 'List all the running instances of containers by executing the command below: docker ps --quiet For each container instance, execute the relevant command for listing all installed packages, e.g.: docker exec $INSTANCE_ID rpm -qa The command above lists the packages installed. You should review the list and ensure that everything installed is actually required.'
remediation:
  type: iac_patch
  command: You should not install anything within the container that is not required. You should consider using a minimal base image rather than the standard CentOS, Debian, or Red Hat images if you can. Some of the options available include BusyBox and Alpine. Not only can this trim your image size considerably, but there would also be fewer pieces of software which could contain vectors for attack.
