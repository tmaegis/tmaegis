id: TMA-DOCKER-7.1
title: Ensure that the minimum number of manager nodes have been created in a swarm
description: 'You should ensure that the minimum number of required manager nodes is created in a swarm. Manager nodes within a swarm have control over the swarm and can change its configuration, including modifying security parameters. Having excessive manager nodes could render the swarm more susceptible to compromise. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 7.1 Ensure that the minimum number of manager nodes have been created in a swarm
audit:
  type: manual
  command: 'Run docker info and verify the number of managers. docker info --format ''{{ .Swarm.Managers }}'' Alternatively run the below command. docker node ls | grep ''Leader'' Expected state: If an excessive number of managers is configured, the excess nodes can be demoted to workers using the following command: docker node demote <ID> Where <ID> is the node ID value of the manager to be demoted.'
remediation:
  type: iac_patch
  command: 'If an excessive number of managers is configured, the excess nodes can be demoted to workers using the following command: docker node demote <ID> Where <ID> is the node ID value of the manager to be demoted.'
