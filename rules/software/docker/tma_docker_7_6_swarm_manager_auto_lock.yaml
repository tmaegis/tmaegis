id: TMA-DOCKER-7.6
title: Ensure that the swarm manager auto-lock key is rotated periodically
description: 'You should rotate the swarm manager auto-lock key periodically. The swarm manager auto-lock key is not automatically rotated. Good security practice is to rotate keys. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: low
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 7.6 Ensure that the swarm manager auto-lock key is rotated periodically
audit:
  type: manual
  command: Currently, there is no mechanism to find out when the key was last rotated on a swarm manager node. You should check with the system administrator to see if there is a key rotation process, and how often the key is rotated.
remediation:
  type: iac_patch
  command: 'You should run the command below to rotate the keys: docker swarm unlock-key --rotate Additionally, to facilitate auditing of this recommendation, you should maintain key rotation records and ensure that you establish a pre-defined frequency for key rotation.'
