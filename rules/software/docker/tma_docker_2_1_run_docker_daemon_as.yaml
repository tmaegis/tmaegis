id: TMA-DOCKER-2.1
title: Run the Docker daemon as a non-root user, if possible
description: 'Rootless mode executes the Docker daemon and containers inside a user namespace, with both the daemon and the container are running without root privileges. Rootless mode allows running the Docker daemon and containers as a non-root user to mitigate potential vulnerabilities in the daemon and the container runtime. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 2.1 Run the Docker daemon as a non-root user, if possible
audit:
  type: manual
  command: 'Running the following command will show any running dockerd processes and which user that is managing the daemon. ps -fe | grep ''dockerd'' Expected state: Follow the current Docker documentation on how to install the Docker daemon as a non-root user.'
remediation:
  type: iac_patch
  command: Follow the current Docker documentation on how to install the Docker daemon as a non-root user.
