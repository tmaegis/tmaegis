id: TMA-DOCKER-4.9
title: Ensure secrets are not stored in Dockerfiles
description: 'Do not store any secrets in Dockerfiles. Docker images are not opaque and contain information about the commands used to build them. As such secrets should not be included in Dockerfiles used to build images as they will be visible to any users of the image. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: high
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 4.9 Ensure secrets are not stored in Dockerfiles
audit:
  type: manual
  command: 'Run the below command to get the list of images: docker images Run the below command for each image in the list above, and look for any secrets: docker history <IMAGE ID> Alternatively, if you have access to Dockerfile for the image, verify that there are no secrets as described above.'
remediation:
  type: iac_patch
  command: Do not store any kind of secrets within Dockerfiles. Where secrets are required during the build process, make use of a secrets management tool, such as the buildkit builder included with Docker.
