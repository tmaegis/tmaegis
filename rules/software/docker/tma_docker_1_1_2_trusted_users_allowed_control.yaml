id: TMA-DOCKER-1.1.2
title: Ensure only trusted users are allowed to control Docker daemon
description: 'The Docker daemon currently requires access to the Docker socket which is, by default, owned by the user root and the group docker. Docker allows you to share a directory between the Docker host and a guest container without limiting the access rights of the container. Reported as a manual review item: the audit needs a site-specific judgement.'
target: docker
level: 1
severity: medium
tags:
- docker
- manual
reference: CIS Docker Benchmark v1.9.0 - 1.1.2 Ensure only trusted users are allowed to control Docker daemon
audit:
  type: manual
  command: 'Execute the following command on the docker host and ensure that only trusted users are members of the docker group. getent group docker Expected state: You should remove any untrusted users from the docker group. Additionally, you should not create a mapping of sensitive directories from the host to container volumes.'
remediation:
  type: iac_patch
  command: You should remove any untrusted users from the docker group. Additionally, you should not create a mapping of sensitive directories from the host to container volumes.
