id: TMA-DOCKER-3.2
title: Ensure that docker.service file permissions are appropriately set
description: The docker.service unit file must have mode 644 or more restrictive so that it cannot be modified by non-root users. The audit flags any existing candidate path (/usr/lib/systemd/system/docker.service, /lib/systemd/system/docker.service, /etc/systemd/system/docker.service) with permission bits outside 644; not applicable when none exists.
target: docker
level: 1
severity: high
tags:
- docker
- permissions
reference: CIS Docker Benchmark v1.9.0 - 3.2 Ensure that docker.service file permissions are appropriately set
audit:
  type: command
  command: for f in /usr/lib/systemd/system/docker.service /lib/systemd/system/docker.service /etc/systemd/system/docker.service; do [ -e "$f" ] || continue; out=$(find "$f" -maxdepth 0 -perm /7133) || exit 1; [ -z "$out" ] || { echo "$f"; exit 0; }; done; echo compliant
  expected_output: compliant
  requires_file:
  - /usr/lib/systemd/system/docker.service
  - /lib/systemd/system/docker.service
  - /etc/systemd/system/docker.service
remediation:
  type: command
  command: for f in /usr/lib/systemd/system/docker.service /lib/systemd/system/docker.service /etc/systemd/system/docker.service; do if [ -e "$f" ]; then chmod 644 "$f" || exit 1; fi; done
