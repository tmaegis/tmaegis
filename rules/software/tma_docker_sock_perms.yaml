id: TMA-DOCKER-SOCK-PERMS
title: Ensure docker.sock is owned by root:docker with mode 660
description: Limits who can control the Docker daemon.
target: docker
level: 1
severity: high
tags:
- docker
reference: CIS Docker Benchmark - Docker daemon configuration files / socket permissions
audit:
  type: command
  command: stat -Lc '%a %U %G' /var/run/docker.sock
  expected_output: 660 root docker
remediation:
  type: command
  command: chown root:docker /var/run/docker.sock && chmod 660 /var/run/docker.sock
