id: TMA-TDSQL-11.4
title: Ensure Cross-Shard Operations Are Appropriately Controlled
description: tdsql_trx_cross_shard_op_whitelist controls the types of cross-shard operations allowed within a distributed transaction.
target: tdsql
level: 2
severity: low
tags:
- tdsql
- transactions
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 11.4 Ensure Cross-Shard Operations Are Appropriately Controlled
audit:
  type: manual
  command: On the SQLEngine run SHOW VARIABLES LIKE 'tdsql_trx_cross_shard_op_whitelist'; If the business does not require cross-shard writes the value must be READ; the default READ,WRITE is acceptable only where cross-shard writes are a documented requirement.
remediation:
  type: iac_patch
  command: 'Configure the allowed operation types according to business needs, minimizing cross- shard write operations: If the business does not require cross-shard writes, set it to READ. If cross-shard writes are required, keep the default READ,WRITE.'
