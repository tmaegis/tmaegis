id: TMA-TDSQL-4.5
title: Ensure Symbolic Links Are Disabled
description: MySQL's symbolic links feature allows placing a table's data and index files in directories outside datadir. When enabled, it can be abused for filesystem-level attacks. Runs the mysql client against the TDSQL data node selected by TDSQL_MYSQL_OPTS (e.g. "-h10.0.0.5 -P4001 -utdsql_audit"); keep the password in ~/.my.cnf or a login path rather than MYSQL_PWD or the command line (see 1.4 and 1.5).
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- hardening
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 4.5 Ensure Symbolic Links Are Disabled
audit:
  type: sql_query
  command: out=$(mysql ${TDSQL_MYSQL_OPTS:-} -NBe "SELECT @@global.have_symlink" 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: DISABLED
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v mysql >/dev/null 2>&1 || exit 0
    cli() { mysql ${TDSQL_MYSQL_OPTS:-} -NB "$@"; }
    dir=; for x in /etc/mysql/mysql.conf.d /etc/mysql/mariadb.conf.d /etc/mysql/conf.d /etc/my.cnf.d; do [ -d "$x" ] && { dir=$x; break; }; done
    [ -n "$dir" ] || { echo "no mysql conf.d directory found" >&2; exit 1; }
    setv() { # name option value
      printf '[mysqld]\n%s=%s\n' "$2" "$3" > "$dir/99-tmaegis-$1.cnf"; chmod 644 "$dir/99-tmaegis-$1.cnf"
      cli -e "SET GLOBAL $1 = '$3'" 2>/dev/null || true; }
    printf '[mysqld]\nskip_symbolic_links\n' > "$dir/99-tmaegis-have_symlink.cnf"
  guidance: "Add skip-symbolic-links = 1 to the [mysqld] section of my.cnf / the parameter template and restart the instance."
