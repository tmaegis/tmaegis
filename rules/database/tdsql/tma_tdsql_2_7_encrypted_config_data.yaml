id: TMA-TDSQL-2.7
title: Ensure Sensitive Configuration Data Is Encrypted
description: Sensitive data in configuration files (passwords, keys, connection strings) should be stored in encrypted form. TDSQL provides AES encryption and base64 encoding for credential protection.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- credentials
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.7 Ensure Sensitive Configuration Data Is Encrypted
audit:
  type: manual
  command: '# Check for cleartext passwords in the configuration grep -rn ''password'' /path/to/tdsql/conf/ | grep -v ''#'' | head -20 # Encrypted passwords appear as long base64-encoded strings. # Short, simple cleartext strings indicate unencrypted passwords.'
remediation:
  type: iac_patch
  command: 'Encrypt all passwords using TDSQL''s encryption tools. Ensure the master key used for encryption is stored separately from the encrypted data and managed by an independent key management process. Integrating with a KMS is strongly recommended. Encryption process overview: 1.'
