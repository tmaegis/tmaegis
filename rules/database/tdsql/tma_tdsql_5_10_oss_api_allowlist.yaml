id: TMA-TDSQL-5.10
title: Ensure the OSS API Allowlist Is Configured
description: TDSQL OSS supports an IP allowlist for API callers, restricting management API access to specific IP addresses.
target: tdsql
level: 2
severity: medium
tags:
- tdsql
- network
- oss
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 5.10 Ensure the OSS API Allowlist Is Configured
audit:
  type: manual
  command: 'Check the allowlist configuration in scheduler.xml: <whitelist ip="..." .../> Confirm the ip field is not empty.'
remediation:
  type: iac_patch
  command: 'Configure the allowlist IP list (allowing only the management/operations subnets): <whitelist ip="10.0.1.0/24;10.0.2.100" .../>'
