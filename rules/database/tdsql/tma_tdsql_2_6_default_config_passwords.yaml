id: TMA-TDSQL-2.6
title: Ensure Default Configuration Passwords Have Been Changed
description: 'All default/sample passwords must be changed before production deployment: scheduler.xml: oc_tool password, system user passwords oss.json: system accounts (tdsqlsys_kp_new, tdsqlsys_check, tdsqlsys_agent, tdsqlsys_repl, tdsqlsys_normal) ZooKeeper authentication credentials MySQL root and administrative user passwords'
target: tdsql
level: 1
severity: critical
tags:
- tdsql
- credentials
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.6 Ensure Default Configuration Passwords Have Been Changed
audit:
  type: manual
  command: 'Run grep -rE ''password\s*=\s*"(root|admin|123456|password|test)"'' <tdsql>/conf/ (must return nothing) and grep -E "password|pwd" <tdsql>/conf/scheduler.xml: values must be long encrypted strings. Diff the password fields of the installed scheduler.xml against the install template; any value equal to the template sample value is a finding.'
remediation:
  type: iac_patch
  command: 'Change all default passwords and use TDSQL''s encrypted storage capability: <!-- Use a strong, encrypted password --> <oc_tool location="/data/oc_agent/bin" port="8966" user="tdsql" password=" <encrypted_strong_password>" /> TDSQL provides a password encryption utility for offline password encryption.'
