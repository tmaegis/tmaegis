id: TMA-TDSQL-6.6
title: Ensure OSS Management Operations Are Audited
description: The TDSQL OSS management plane records write-type administrative operations independently of database SQL auditing. This audit trail must be available and retained for instance lifecycle actions, configuration changes, and account or privilege changes.
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- logging
- audit
- oss
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 6.6 Ensure OSS Management Operations Are Audited
audit:
  type: manual
  command: 1. Confirm in the TDSQL management platform that the OSS audit database is configured and healthy. 2. Identify a recent non-destructive write-type management operation, such as an approved parameter-template update. 3. Confirm that it appears in the OSS audit view or database with operator, source, action, timestamp, result, and target object. 4. Confirm that OSS records are included in centralized collection and retention. Do not use query_interfaces_logged_in_audit as the test for this recommendation; that setting controls query-interface auditing and is assessed in 6.10.
remediation:
  type: iac_patch
  command: Configure or repair the OSS audit database through the supported TDSQL management procedure. Verify that write-type operations generate records, protect the audit- database credentials as described in 2.7, and include OSS records in the centralized collection defined in 6.8.
