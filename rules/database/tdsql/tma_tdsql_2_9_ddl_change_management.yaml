id: TMA-TDSQL-2.9
title: Ensure a DDL Change Management Process Is Established
description: Schema changes (DDL) should follow a formal change management process. TDSQL specifies SQL files in the sql/ directory named V[version]_[batch]__[description].sql, which are required to be idempotent and re-entrant.
target: tdsql
level: 2
severity: low
tags:
- tdsql
- change-management
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.9 Ensure a DDL Change Management Process Is Established
audit:
  type: manual
  command: '# Verify that SQL change files follow the naming convention ls /path/to/tdsql/sql/*/V*.sql # Verify that changes are under version control git log --oneline /path/to/tdsql/sql/'
remediation:
  type: iac_patch
  command: 'Establish a DDL change management policy: Submit all changes as SQL files in the V[version]_[batch]__[description].sql format Changes must be idempotent Require review and approval before deployment Test in a non-production environment first'
