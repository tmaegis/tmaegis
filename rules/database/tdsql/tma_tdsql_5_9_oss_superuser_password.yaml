id: TMA-TDSQL-5.9
title: Ensure the OSS Super User Password Has Been Changed
description: The OSS management platform includes a built-in super user (osssuper) for initialization and emergency management operations.
target: tdsql
level: 1
severity: critical
tags:
- tdsql
- credentials
- oss
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 5.9 Ensure the OSS Super User Password Has Been Changed
audit:
  type: manual
  command: 'Check <super_user username="osssuper" pwd="..."> in <tdsql>/conf/scheduler.xml: the pwd value must be in encrypted form (a long base64/ciphertext string) and must differ from the install template (diff <(grep super_user <installed>/conf/scheduler.xml) <(grep super_user <template>/scheduler.xml)). The template sample value is a finding.'
remediation:
  type: iac_patch
  command: 1. Change the super user password to a strong random value (16+ characters including uppercase, lowercase, digits, and special characters) and store it encrypted with the cluster master key. 2. Enable automatic password rotation (rotation="1"). 3. Restrict the super user's source IP (set the host field to a specific IP range, avoiding %).
