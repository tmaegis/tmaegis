id: TMA-TDSQL-7.2
title: Ensure the TDSQL Password Complexity Policy Is Enabled
description: Password complexity for database accounts must be enforced through the supported TDSQL management-platform account policy. The policy should define an organization- approved minimum length and required character classes.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- authentication
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 7.2 Ensure the TDSQL Password Complexity Policy Is Enabled
audit:
  type: manual
  command: 1. Review the password policy configured in the TDSQL management platform for the target 8.0 instances. 2. Confirm that minimum length and character-class requirements meet the organization standard. 3. Confirm that accounts are created and modified through the TDSQL management platform. 4. Review a recent approved password-change record to confirm enforcement.
remediation:
  type: iac_patch
  command: Configure the required password strength in the TDSQL management platform and use the platform to rotate non-compliant credentials. Do not install or rely on the upstream validate_password component unless Tencent confirms support for the exact TXSQL version and deployment mode.
