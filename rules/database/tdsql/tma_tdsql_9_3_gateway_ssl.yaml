id: TMA-TDSQL-9.3
title: Ensure the Gateway Has SSL Enabled
description: 'The TDSQL Gateway is the entry point for client connections and should enable SSL to protect communication between clients and the gateway. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: tdsql
level: 1
severity: high
tags:
- tdsql
- tls
- gateway
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 9.3 Ensure the Gateway Has SSL Enabled
audit:
  type: manual
  command: 'In the OSS management platform (or the Gateway proxy.json) check gateway.mode.ssl.open for every instance: 0 (the default, disabled) is a finding; 1 enables optional encryption, 2 enforces encryption (recommended) and 3 adds mutual authentication.'
remediation:
  type: iac_patch
  command: 'Modify the Gateway parameter via the OSS management platform: { "Name": "gateway.mode.ssl.open", "value": "2" }'
