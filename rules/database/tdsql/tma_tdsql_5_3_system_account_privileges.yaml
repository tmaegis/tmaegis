id: TMA-TDSQL-5.3
title: Ensure System Account Privileges Are Minimized
description: TDSQL includes several built-in system accounts for different purposes. Each account should hold only the minimum privileges necessary for its function.
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- privileges
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 5.3 Ensure System Account Privileges Are Minimized
audit:
  type: manual
  command: Run SHOW GRANTS FOR 'tdsqlsys_check'@'%'; SHOW GRANTS FOR 'tdsqlsys_agent'@'%'; SHOW GRANTS FOR 'tdsqlsys_repl'@'%'; (and the other tdsqlsys_* accounts) and compare each with the minimum privileges required for its function per the benchmark table (e.g. tdsqlsys_repl only REPLICATION SLAVE, REPLICATION CLIENT). Any extra privilege is a finding.
remediation:
  type: iac_patch
  command: 'Adjust system account privileges through the TDSQL Manager to ensure each account holds only the necessary privileges. Note: Modifying system account privileges may affect normal operation of TDSQL components; test thoroughly before making changes.'
