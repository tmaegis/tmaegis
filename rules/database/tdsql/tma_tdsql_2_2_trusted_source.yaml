id: TMA-TDSQL-2.2
title: Ensure TDSQL Is Installed from a Trusted Source
description: TDSQL binaries should be obtained only from trusted, verified sources. Package integrity should be verified via checksums or digital signatures before deployment.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- supply-chain
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.2 Ensure TDSQL Is Installed from a Trusted Source
audit:
  type: manual
  command: '# Verify binary integrity sha256sum /path/to/tdsql/bin/oss_server sha256sum /path/to/tdsql/bin/scheduler # Compare against the published checksums'
remediation:
  type: iac_patch
  command: 'Download TDSQL only from official repositories. When building from source: cd /path/to/TDSQL_OSS/build ./build.sh -j Maintain a checksum record of deployed binaries.'
