id: TMA-TDSQL-1.5
title: Ensure Passwords Are Not Passed via the Command Line
description: When using the MySQL client or TDSQL tools, passwords should not be specified via the command-line arguments -p<password> or --password=. Counts running MySQL client processes and shell-history entries that pass a password inline (-p<password> or --password=). Restricted to MySQL client tools to avoid false matches such as mkdir -p.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- credentials
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 1.5 Ensure Passwords Are Not Passed via the Command Line
audit:
  type: command
  command: 'out=$(ps -eo args= 2>/dev/null) || exit 1; p=$(printf ''%s\n'' "$out" | grep -v tdsql_cli_pw_audit | grep -cE ''(mysql|mysqladmin|mysqldump|mysqlbinlog|mysqlsh)[^|;]*[[:space:]](-p[^[:space:]]|--password=)'' || true); h=$(cat /root/.bash_history /home/*/.bash_history 2>/dev/null | grep -cE ''(mysql|mysqladmin|mysqldump|mysqlbinlog|mysqlsh)[^|;]*[[:space:]](-p[^[:space:]]|--password=)'' || true); echo $((p + h)) # tdsql_cli_pw_audit'
  expected_output: '0'
remediation:
  type: iac_patch
  command: Use a MySQL option file (~/.my.cnf with [client] user/password, mode 600) or the TDSQL encrypted credential system instead of -p<password>; clear affected shell history entries and rotate any exposed passwords.
