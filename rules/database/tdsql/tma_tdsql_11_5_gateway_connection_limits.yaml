id: TMA-TDSQL-11.5
title: Ensure Gateway Connection Limits Are Configured
description: 'The TDSQL Gateway connection limit (gateway.security.conn.conn_limit) prevents a single client or attacker from exhausting all connection resources. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- gateway
- availability
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 11.5 Ensure Gateway Connection Limits Are Configured
audit:
  type: manual
  command: 'In the OSS management platform (or the Gateway proxy.json) check gateway.security.conn.conn_limit for every instance: it must be greater than 0 and sized to the instance specification; 0 (the default, unlimited) is a finding.'
remediation:
  type: iac_patch
  command: 'Set a reasonable connection limit according to the instance specification and business needs: { "Name": "gateway.security.conn.conn_limit", "value": "5000" }'
