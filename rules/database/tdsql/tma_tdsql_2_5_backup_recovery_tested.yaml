id: TMA-TDSQL-2.5
title: Ensure Backup Recovery Is Tested Regularly
description: The backup recovery process should be tested regularly, including full restore and point- in-time recovery.
target: tdsql
level: 2
severity: medium
tags:
- tdsql
- backup
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.5 Ensure Backup Recovery Is Tested Regularly
audit:
  type: manual
  command: '# Review the following documentation: # - Date of the most recent successful recovery test # - Documented recovery procedures # - Measured recovery time # - Data integrity verification results'
remediation:
  type: iac_patch
  command: 1. Establish a quarterly backup recovery test schedule. 2. Document recovery procedures for each backup type. 3. Test in an isolated environment. 4. Record and review recovery results.
