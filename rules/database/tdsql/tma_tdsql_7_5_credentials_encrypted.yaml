id: TMA-TDSQL-7.5
title: Ensure Credentials Are Stored Encrypted
description: Database passwords, API keys, and other credentials in TDSQL component configuration files should be stored encrypted and must not appear in cleartext.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- credentials
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 7.5 Ensure Credentials Are Stored Encrypted
audit:
  type: manual
  command: Inspect scheduler.xml (oc_tool password, audit_database password, super_user pwd, manager_db password, whitelist user_password tokens) and oss.json system-account *_pwd_encrypt fields. Every password/token must be in encrypted form (long base64/ciphertext); any short readable or cleartext value is a finding.
remediation:
  type: iac_patch
  command: '1. TDSQL provides an AES encryption tool that encrypts all passwords with the cluster master key: Passwords are stored in encrypted form in ZooKeeper. Password fields in configuration files should be filled in after processing with the encryption tool. 2. The cluster master key should be generated independently for each cluster via the deployment-side key injection process and provided at runtime via an environment variable or KMS;'
