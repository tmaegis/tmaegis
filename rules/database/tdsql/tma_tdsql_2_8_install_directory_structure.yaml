id: TMA-TDSQL-2.8
title: Ensure the TDSQL Installation Directory Structure Is Well-Organized
description: "TDSQL should follow a well-organized directory structure: <tdsql_root>/ \u251C\u2500\u2500 bin/ # Executables and scripts \u251C\u2500\u2500 conf/ # Configuration files (scheduler.xml, oss.json, etc.) \u251C\u2500\u2500 boot/ # Boot modules and SSL certificates \u251C\u2500\u2500 data/ # Runtime data \u251C\u2500\u2500 log/ # Log files \u251C\u2500\u2500 sql/ # Database schema files \u2514\u2500\u2500 lib/ # Shared libraries"
target: tdsql
level: 1
severity: low
tags:
- tdsql
- hardening
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.8 Ensure the TDSQL Installation Directory Structure Is Well-Organized
audit:
  type: manual
  command: '# Verify the directory structure ls -la /path/to/tdsql/ # Ensure there are no data files in the binary directory find /path/to/tdsql/bin/ -name ''*.dat'' -o -name ''*.ibd'' # Ensure there are no executable files in the data directory find /path/to/tdsql/data/ -executable -type f'
remediation:
  type: iac_patch
  command: Install using the standard TDSQL installation procedure via install.sh, which creates the canonical directory structure.
