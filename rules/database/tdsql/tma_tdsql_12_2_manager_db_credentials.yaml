id: TMA-TDSQL-12.2
title: Ensure Manager Database Credentials Are Encrypted
description: The credential (tdsqlsys_kp_new) used by the TDSQL Manager to connect to MySQL instances should be stored encrypted.
target: tdsql
level: 1
severity: high
tags:
- tdsql
- credentials
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 12.2 Ensure Manager Database Credentials Are Encrypted
audit:
  type: manual
  command: 'Check the Manager DB configuration in scheduler.xml: <manager_db user="tdsqlsys_kp_new" password="..." /> Confirm the password field is encrypted (base64-encoded, length >= 24 bytes), not a short readable string. Also verify the value differs from the install template''s initial value.'
remediation:
  type: iac_patch
  command: 'Encrypt the password using the TDSQL encryption tool: # Encrypt with the cluster master key (see section 2.6 for tool details) /path/to/tdsql/bin/crypt_tool -e "<cluster_master_key>" "<plain_password>" # Put the resulting ciphertext into the manager_db.password field of scheduler.xml'
