id: TMA-TDSQL-2.1
title: Ensure Dedicated Hosts Are Used for TDSQL Components
description: 'TDSQL components should be deployed on dedicated hosts that do not run other application workloads. This applies to all components: OSS, Manager/Scheduler/Keeper, MySQL instances, Proxy, and ZooKeeper.'
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- architecture
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.1 Ensure Dedicated Hosts Are Used for TDSQL Components
audit:
  type: manual
  command: '# Check for non-TDSQL processes listening on network ports ss -tlnp | grep -v -E ''(mysqld|oss_server|scheduler|zookeeper|tdsqlproxy|oc_agent)'' # Review running processes ps aux --sort=-%mem | head -20'
remediation:
  type: iac_patch
  command: Deploy TDSQL on dedicated hosts. Remove unnecessary software packages. Use TDSQL's set/group architecture to achieve component isolation.
