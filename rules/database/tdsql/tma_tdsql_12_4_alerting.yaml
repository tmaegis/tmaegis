id: TMA-TDSQL-12.4
title: Ensure the Alerting Mechanism Is Enabled and Configured
description: HA primary-replica switchover Critical An instance underwent a switchover Backup failure Major A data backup task failed Insufficient disk space Critical Data directory disk usage exceeded the threshold ZK connection anomaly Critical Metadata service connection interrupted VIP anomaly Critical Virtual IP switched or lost 3.
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- monitoring
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 12.4 Ensure the Alerting Mechanism Is Enabled and Configured
audit:
  type: manual
  command: In the TDSQL management platform confirm alert notification channels (email, SMS, WeCom, etc.) and recipients are configured, all Critical-level alert types (node/instance down, primary switch, replication delay, disk usage, backup failure) are enabled, and aggregation/escalation policies exist. Missing channels or disabled critical alerts are a finding.
remediation:
  type: iac_patch
  command: 1. Configure alert recipients and channels. 2. Ensure all Critical-level alerts are enabled. 3. Configure alert aggregation and escalation policies.
