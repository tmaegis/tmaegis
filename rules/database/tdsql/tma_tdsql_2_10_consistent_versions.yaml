id: TMA-TDSQL-2.10
title: Ensure TDSQL Component Versions Are Consistent Across the Cluster
description: All TDSQL components in a cluster should run the same version to avoid compatibility issues and ensure security patches are applied uniformly.
target: tdsql
level: 1
severity: medium
tags:
- tdsql
- patching
reference: CIS Tencent TDSQL 10.3.22 Benchmark v1.0.0 - 2.10 Ensure TDSQL Component Versions Are Consistent Across the Cluster
audit:
  type: manual
  command: On every node run <tdsql>/bin/oss_server --version and <tdsql>/bin/scheduler --version, or call the OSS TDSQL.GetDbVersion / TDSQL.TdsqlModuleVersion interfaces for the cluster, and compare the results. All OSS, Scheduler/Keeper, Agent, Gateway and data-node versions must match across the cluster; a mismatch outside a planned rolling upgrade is a finding.
remediation:
  type: iac_patch
  command: Plan and execute a rolling upgrade to ensure version consistency. Follow the TDSQL upgrade documentation.
