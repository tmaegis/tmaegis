id: TMA-COCKROACHDB-4.4
title: Centralize and Standardize User Management
description: Self-hosted CockroachDB clusters should maintain consistent and centralized management of database user identities to ensure secure, controlled, and predictable access. CockroachDB supports several external authentication systems-such as OIDC, GSSAPI/Kerberos, and LDAP-but organizations may also centralize identity management by standardizing how CockroachDB accounts are created, assigned roles, and deprovisioned.
target: cockroachdb
level: 1
severity: medium
tags:
- cockroachdb
- authentication
reference: CIS CockroachDB v25.x Benchmark v1.0.0 - 4.4 Centralize and Standardize User Management
audit:
  type: manual
  command: 'Confirm a documented user lifecycle (approval, standard role assignment, prompt deprovisioning). Run SHOW USERS; and compare against the authorised user list/HR records: no orphaned, shared or unused accounts may remain. Where supported, check that LDAP/OIDC/Kerberos integration is used for human users.'
remediation:
  type: iac_patch
  command: '1. Establish a centralized user management process Document and enforce: - Account creation approval - Standardized role/privilege assignment - Required justification for role elevation - Timely account deprovisioning 2. Remove orphaned or unauthorized accounts DROP USER <username>; Only after confirming the user is no longer required and privileges are reassigned as needed.'
