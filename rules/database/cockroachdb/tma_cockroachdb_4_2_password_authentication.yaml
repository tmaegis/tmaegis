id: TMA-COCKROACHDB-4.2
title: Restrict and Secure Password Authentication
description: CockroachDB self-hosted clusters support several authentication methods for SQL clients, including passwords, SCRAM-SHA-256, TLS client certificates, and others such as GSSAPI/Kerberos (Enterprise), JWT, LDAP/AD and OIDC.
target: cockroachdb
level: 1
severity: high
tags:
- cockroachdb
- authentication
reference: CIS CockroachDB v25.x Benchmark v1.0.0 - 4.2 Restrict and Secure Password Authentication
audit:
  type: manual
  command: Run SHOW CLUSTER SETTING server.user_login.password_encryption; (must be scram-sha-256) and review SHOW USERS; plus SELECT username FROM system.users WHERE "hashedPassword" IS NOT NULL. Privileged and service accounts should use certificates; any remaining password hashes should be SCRAM-SHA-256 and passwords must meet length policy (server.user_login.min_password_length).
remediation:
  type: iac_patch
  command: '1. Enable SCRAM-SHA-256 for new passwords Configure the cluster to use SCRAM-SHA-256 for all newly set passwords: SET CLUSTER SETTING server.user_login.password_encryption = ''scram-sha-256''; This ensures that any CREATE USER ... WITH PASSWORD or ALTER USER ... WITH PASSWORD operations store SCRAM-SHA-256 hashes. 2.'
