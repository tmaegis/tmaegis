id: TMA-REDIS-PROTECTED-MODE
title: Ensure protected-mode is enabled
description: protected-mode refuses external connections when no password is set.
target: redis
level: 1
severity: high
tags:
- database
- redis
reference: CIS Redis Benchmark - Network Security
audit:
  type: file_regex
  file_path: /etc/redis/redis.conf
  pattern: (?m)^\s*protected-mode\s+yes\b
remediation:
  type: file_line
  file_path: /etc/redis/redis.conf
  match_regex: (?m)^\s*#?\s*protected-mode\b.*$
  replace_line: protected-mode yes
  backup_files:
  - /etc/redis/redis.conf
