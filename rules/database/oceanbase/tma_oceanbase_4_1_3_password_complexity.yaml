id: TMA-OCEANBASE-4.1.3
title: Ensure Password Complexity Policies are in Place
description: OceanBase MySQL tenants support configuring password complexity policies through tenant-level system variables. Enabling password complexity policies helps prevent weak password usage and raises the bar for password cracking. Runs obclient with the connection options in OB_CONN (default "-h127.0.0.1 -P2881 -uroot@sys"); point it at the MySQL-mode tenant being assessed and supply the password via OB_CONN (-p...) or a [client] section in ~/.my.cnf. Passes when validate_password_length >= 14, validate_password_check_user_name = ON, validate_password_policy = MEDIUM (or stronger) and the mixed-case, number and special-character counts are each >= 1.
target: oceanbase
level: 2
severity: medium
tags:
- oceanbase
- authentication
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 4.1.3 Ensure Password Complexity Policies are in Place
audit:
  type: sql_query
  command: 'out=$(obclient ${OB_CONN:--h127.0.0.1 -P2881 -uroot@sys} -N -B -e "SHOW VARIABLES LIKE ''validate_password%''" 2>/dev/null) || exit 1; printf ''%s\n'' "$out" | awk -F''\t'' ''{v[$1] = toupper($2)} END {ok = (v["validate_password_length"] + 0 >= 14 && v["validate_password_check_user_name"] == "ON" && (v["validate_password_policy"] == "MEDIUM" || v["validate_password_policy"] == "STRONG") && v["validate_password_mixed_case_count"] + 0 >= 1 && v["validate_password_number_count"] + 0 >= 1 && v["validate_password_special_char_count"] + 0 >= 1); print ok ? "compliant" : "noncompliant"}'''
  expected_output: compliant
remediation:
  type: iac_patch
  command: SET GLOBAL validate_password_length = 14; SET GLOBAL validate_password_check_user_name = ON; SET GLOBAL validate_password_policy = MEDIUM; SET GLOBAL validate_password_mixed_case_count = 1; SET GLOBAL validate_password_number_count = 1; SET GLOBAL validate_password_special_char_count = 1;
