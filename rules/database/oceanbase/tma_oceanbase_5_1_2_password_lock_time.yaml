id: TMA-OCEANBASE-5.1.2
title: Ensure 'PASSWORD_LOCK_TIME' Is Greater than or Equal to '1'
description: The PASSWORD_LOCK_TIME setting determines how many days must pass for the user's account to be unlocked after the set number of failed login attempts has occurred. The suggested value for this is one day or greater.
target: oceanbase
level: 1
severity: low
tags:
- oceanbase
- authentication
- oracle-mode
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 5.1.2 Ensure 'PASSWORD_LOCK_TIME' Is Greater than or Equal to '1'
audit:
  type: manual
  command: In the Oracle-mode tenant run SELECT PROFILE, RESOURCE_NAME, LIMIT FROM SYS.DBA_PROFILES WHERE PROFILE = 'DEFAULT' AND RESOURCE_NAME = 'PASSWORD_LOCK_TIME'; The value must be 1 (day) or greater; check other profiles in use the same way.
remediation:
  type: iac_patch
  command: Remediate this setting by executing the following SQL statement for each PROFILE returned by the audit procedure. ALTER PROFILE <profile_name> LIMIT PASSWORD_LOCK_TIME 1;
