id: TMA-OCEANBASE-5.1.5
title: Ensure 'PASSWORD_VERIFY_FUNCTION' Is Set for All Profiles
description: The PASSWORD_VERIFY_FUNCTION determines password settings requirements when a user password is changed at the SQL command prompt. It should be set for all profiles.
target: oceanbase
level: 1
severity: medium
tags:
- oceanbase
- authentication
- oracle-mode
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 5.1.5 Ensure 'PASSWORD_VERIFY_FUNCTION' Is Set for All Profiles
audit:
  type: manual
  command: In the Oracle-mode tenant run SELECT PROFILE, RESOURCE_NAME, LIMIT FROM SYS.DBA_PROFILES WHERE RESOURCE_NAME = 'PASSWORD_VERIFY_FUNCTION'; Every profile must name a valid password verification function; NULL (the default) is a finding.
remediation:
  type: iac_patch
  command: 'Create a custom password verification function which fulfills the password requirements of the organization. ALTER PROFILE <profile_name> LIMIT PASSWORD_VERIFY_FUNCTION <password_verify_func>; It is recommended that the password verification feature implement the following requirements to meet security standards: - Passwords must be at least 14 characters long.'
