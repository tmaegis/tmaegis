id: TMA-OCEANBASE-5.4.3
title: Enable Audit Options According to Requirements
description: Enabling the audit option causes auditing of any attempt, successful or not to do database operations. For auditing requests, audit rule should be configured to align with specific requirements.
target: oceanbase
level: 1
severity: medium
tags:
- oceanbase
- logging
- audit
- oracle-mode
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 5.4.3 Enable Audit Options According to Requirements
audit:
  type: manual
  command: In the Oracle-mode tenant review SELECT * FROM SYS.ALL_DEF_AUDIT_OPTS; SELECT * FROM SYS.DBA_STMT_AUDIT_OPTS; and SELECT * FROM SYS.DBA_OBJ_AUDIT_OPTS; The views must show auditing enabled for the critical and high-risk statements and objects your policy requires; an empty view or missing high-risk activities is a finding.
remediation:
  type: iac_patch
  command: 'To remediate this setting, execute one of the following SQL statements. 1. Audit specified statement operation: AUDIT <statement_operation> BY <username> WHENEVER [NOT] SUCCESSFUL; 2. Audit specified operations on a specififed database object: AUDIT <object_operations> ON <obj_name> | ON DEFAULT;'
