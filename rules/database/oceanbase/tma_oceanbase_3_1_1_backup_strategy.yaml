id: TMA-OCEANBASE-3.1.1
title: Backup Strategy in Place
description: A backup strategy should be in place.
target: oceanbase
level: 1
severity: high
tags:
- oceanbase
- backup
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 3.1.1 Backup Strategy in Place
audit:
  type: manual
  command: 'Verify that a backup strategy exists and is actively configured for OceanBase tenants: - If OceanBase Cloud Platform (OCP) is used, review the backup policies and schedules configured in OCP for each production tenant. Confirm that backups are scheduled at an appropriate frequency (e.g., daily) and that recent successful backup jobs are recorded in the OCP job history.'
remediation:
  type: iac_patch
  command: 'Establish a formal backup strategy aligned with business continuity requirements: - Define backup scope (which tenants/databases), frequency, retention period, and storage location. - If using OCP, configure automated backup policies through the platform''s backup management interface. - If not using OCP, implement and document a repeatable backup procedure using supported OceanBase tools, and schedule it via cron or orchestration systems.'
