id: TMA-OCEANBASE-2.1
title: Ensure the Appropriate Version for OceanBase Software Is Installed
description: The OceanBase installation version should be the most recent that are compatible with the organization's operational needs.
target: oceanbase
level: 1
severity: high
tags:
- oceanbase
- patching
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 2.1 Ensure the Appropriate Version for OceanBase Software Is Installed
audit:
  type: manual
  command: 'Run SELECT ob_version(); and compare the result with the OceanBase Product Lifecycle page: the current date must be before the End of Standard Support (or End of Extended Support) date of that version, preferably an LTS release on its latest patch. An EOL version is a finding.'
remediation:
  type: iac_patch
  command: 'Perform the following steps for remediation: 1. Identify the target version: - Check the Release Notes to find the latest LTS (Long Term Support) version or the latest compatible patch version. 2. Download and apply the upgrade: - Download the installation package for the target version. - Upgrade the observer using the OceanBase Control Platform (OCP) or your standard upgrade procedure.'
