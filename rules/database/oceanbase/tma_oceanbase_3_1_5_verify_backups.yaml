id: TMA-OCEANBASE-3.1.5
title: Verify Backups are Good
description: Backups should be validated on a regular basis.
target: oceanbase
level: 1
severity: medium
tags:
- oceanbase
- backup
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 3.1.5 Verify Backups are Good
audit:
  type: manual
  command: 'Review evidence that backup validation is performed systematically: - Examine backup validation or recovery test reports from the past 12 months (or per organizational policy). These may include: o Test plans and execution records from OceanBase Control Platform (OCP) recovery sampling tasks; o Screenshots, logs, or audit trails showing successful restore operations; o Post-test summaries confirming data consistency and application functionality. - If OCP is used, confirm that recovery sampling tasks are configured and have executed successfully within the review period.'
remediation:
  type: iac_patch
  command: 'Establish a formal backup validation program: - Implement regular recovery sampling tasks via OceanBase Cloud Platform (OCP), scheduled at intervals aligned with business risk (e.g., quarterly for critical systems). - Ensure each test includes: o Restoration of a representative tenant or dataset; o Verification of data completeness and consistency; o Validation that applications can operate correctly on the restored data.'
