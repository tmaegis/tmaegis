id: TMA-OCEANBASE-3.1.3
title: Configure Alert Threshold for Unexpected Backup Events
description: An alert should be triggered when the unexpected backup events occur such as data backup timeout, log backup delay or no successful data backup in many days.
target: oceanbase
level: 1
severity: medium
tags:
- oceanbase
- backup
- monitoring
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 3.1.3 Configure Alert Threshold for Unexpected Backup Events
audit:
  type: manual
  command: 'Review the backup alert configuration for each OceanBase tenant to confirm that meaningful thresholds are defined and aligned with organizational requirements: - If OceanBase Cloud Platform (OCP) is used, examine the tenant-level backup policy settings and verify that alert thresholds are configured for the following conditions: o Data backup timeout o Log backup delay o Consecutive days without a successful data backup - Confirm that the configured thresholds reflect the organization''s operational needs-for example, the "days without backup" threshold should not exceed the backup ...'
remediation:
  type: iac_patch
  command: "Configure or adjust backup alert thresholds to ensure timely notification of failures: - In OceanBase Cloud Platform (OCP), update the tenant's backup strategy to define appropriate alert thresholds based on observed backup behavior and business requirements. o For Data Backup Timeout, set the threshold to a value greater than the typical completion time of recent successful backups (e.g., 1.5\xD7 average duration)."
