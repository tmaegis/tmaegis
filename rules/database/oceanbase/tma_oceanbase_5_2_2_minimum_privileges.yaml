id: TMA-OCEANBASE-5.2.2
title: Minimum Privileges
description: The unnecessary privileges should be revoked from user to minimize security risks and adhere to the principle of least privilege.
target: oceanbase
level: 1
severity: medium
tags:
- oceanbase
- privileges
- oracle-mode
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 5.2.2 Minimum Privileges
audit:
  type: manual
  command: To assess this recommendation, execute the following SQL statement. SELECT * FROM DBA_SYS_PRIVS; SELECT * FROM DBA_ROLE_PRIVS; SELECT * FROM USER_TAB_PRIVS; The returned user's privileges should address the needs of the organization, should not have unnecessary or excessive system, role, or object permissions.
remediation:
  type: iac_patch
  command: 'Remediate this setting by executing the following SQL statement: REVOKE <role> FROM <username>; REVOKE <system_privilege> FROM <username>; REVOKE <operation_privilege> on <object> FROM <username>;'
