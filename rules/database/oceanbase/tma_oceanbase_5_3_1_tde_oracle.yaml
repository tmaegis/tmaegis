id: TMA-OCEANBASE-5.3.1
title: Use TDE for At-Rest Data Encryption
description: Transparent Data Encryption (TDE) at-rest encryption protects your critical data by enabling data-at-rest encryption in the database. It protects the privacy of your information, prevents data breaches and helps meet regulatory requirements.
target: oceanbase
level: 1
severity: high
tags:
- oceanbase
- encryption
- oracle-mode
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 5.3.1 Use TDE for At-Rest Data Encryption
audit:
  type: manual
  command: In the Oracle-mode tenant run SELECT TABLE_NAME, ENCRYPTED FROM V$OB_ENCRYPTED_TABLES; Tables holding sensitive data must be listed with ENCRYPTED = YES; no rows, or NO for a table that requires at-rest encryption, is a finding.
remediation:
  type: iac_patch
  command: 'Remediate this setting by executing the following SQL statements to enable TDE for tables according to the organization requirements: 1. Create a tablespace and specify the encryption algorithm. CREATE TABLESPACE <tablespace_name> ENCRYPTION USING ''<encryption algorithm>'' 2. Move the unencrypted table to the tablespace. ALTER TALBE <table_name> TABLESPACE <tablespace_name>; 3. Perform a full compaction on the table.'
