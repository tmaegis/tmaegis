id: TMA-OCEANBASE-3.1.2
title: Enable Automatic Major Compaction before Backup
description: Automatic major compaction should be enabled before the backup is scheduled.
target: oceanbase
level: 1
severity: low
tags:
- oceanbase
- backup
reference: CIS OceanBase Enterprise Edition V4 Benchmark v1.0.0 - 3.1.2 Enable Automatic Major Compaction before Backup
audit:
  type: manual
  command: 'Review the backup configuration for each OceanBase tenant to confirm that automatic major compaction is enabled as part of the backup policy: - If the OceanBase Cloud Platform (OCP) is used, examine the tenant-level backup settings within OCP and verify that the option to enable automatic major compaction (or equivalent setting related to compaction triggering during backup) is activated.'
remediation:
  type: iac_patch
  command: 'Ensure that automatic major compaction is enabled for all tenants that are configured for backup: - When using OceanBase Cloud Platform (OCP), update the tenant''s backup policy to include automatic major compaction as a prerequisite step. - In environments managed without OCP, work with database administrators to configure the system to trigger major compaction automatically prior to backup execution, in accordance with OceanBase best practices.'
