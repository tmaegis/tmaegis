id: TMA-MSSQL-2.9
title: Ensure 'Trustworthy' Database Property is set to 'Off'
description: 'The TRUSTWORTHY database option allows database objects to access objects in other databases under certain circumstances. Default: By default, this database property is OFF (is_trustworthy_on = 0), except for the msdb database in which it is required to be ON. Runs one sqlcmd query with its defaults (Windows authentication to the local default instance); set SQLCMDSERVER, SQLCMDUSER and SQLCMDPASSWORD for another instance or SQL authentication. Needs VIEW SERVER STATE / sysadmin-level read access.'
target: mssql
level: 1
severity: high
tags:
- mssql
- database
- privileges
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 2.9 Ensure 'Trustworthy' Database Property is set to 'Off'
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE is_trustworthy_on = 1 AND name <> 'msdb';"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Execute the following T-SQL statement against the databases (replace <database_name> below) returned by the Audit Procedure: ALTER DATABASE [<database_name>] SET TRUSTWORTHY OFF;'
