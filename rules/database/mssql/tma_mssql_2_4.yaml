id: TMA-MSSQL-2.4
title: Ensure 'Database Mail XPs' Server Configuration Option is set to '0'
description: 'The Database Mail XPs option controls the ability to generate and transmit email messages from SQL Server. Both value and value_in_use must equal 0. Default: By default, this option is disabled (0). Runs one sqlcmd query with its defaults (Windows authentication to the local default instance); set SQLCMDSERVER, SQLCMDUSER and SQLCMDPASSWORD for another instance or SQL authentication. Needs VIEW SERVER STATE / sysadmin-level read access.'
target: mssql
level: 1
severity: medium
tags:
- mssql
- database
- surface-area
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 2.4 Ensure 'Database Mail XPs' Server Configuration Option is set to '0'
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN CAST(value AS int) = 0 AND CAST(value_in_use AS int) = 0 THEN 'compliant' ELSE 'noncompliant' END FROM sys.configurations WHERE name = 'Database Mail XPs';"
  expected_output: compliant
remediation:
  type: sql_exec
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'Database Mail XPs', 0; RECONFIGURE; EXEC sp_configure 'show advanced options', 0; RECONFIGURE;"
