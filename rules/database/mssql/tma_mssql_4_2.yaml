id: TMA-MSSQL-4.2
title: Ensure 'CHECK_EXPIRATION' Option is set to 'ON' for All SQL Authenticated Logins Within the Sysadmin Role
description: 'Applies the same password expiration policy used in Windows to passwords used inside SQL Server. On AWS RDS only the rdsa account being listed is acceptable. Default: CHECK_EXPIRATION is ON by default when using SSMS to create a SQL authenticated login. CHECK_EXPIRATION is OFF by default when using T-SQL CREATE LOGIN syntax without specifying the ... Runs one sqlcmd query with its defaults (Windows authentication to the local default instance); set SQLCMDSERVER, SQLCMDUSER and SQLCMDPASSWORD for another instance or SQL authentication. Needs VIEW SERVER STATE / sysadmin-level read access.'
target: mssql
level: 1
severity: medium
tags:
- mssql
- database
- authentication
- password-policy
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 4.2 Ensure 'CHECK_EXPIRATION' Option is set to 'ON' for All SQL Authenticated Logins Within the Sysadmin Role
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM (SELECT l.name FROM sys.sql_logins AS l WHERE IS_SRVROLEMEMBER('sysadmin', l.name) = 1 AND l.is_expiration_checked <> 1 AND l.is_disabled = 0 UNION ALL SELECT l.name FROM sys.sql_logins AS l JOIN sys.server_permissions AS p ON l.principal_id = p.grantee_principal_id WHERE p.type = 'CL' AND p.state IN ('G','W') AND l.is_expiration_checked <> 1 AND l.is_disabled = 0) AS x;"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'For each <login_name> found by the Audit Procedure, execute the following T-SQL statement: ALTER LOGIN [<login_name>] WITH CHECK_EXPIRATION = ON;'
