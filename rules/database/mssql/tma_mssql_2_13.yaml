id: TMA-MSSQL-2.13
title: Ensure the 'sa' Login Account is set to 'Disabled'
description: 'The sa account is a widely known and often widely used SQL Server account with sysadmin privileges. This is the original login created during installation and always has the principal_id=1 and sid=0x01. Checks the original sa login by SID 0x01 so a renamed sa is still found. Default: By default, the sa login account is disabled at install time when Windows Authentication Mode is selected. If mixed mode (SQL Server and Windows Authentication) is selected at install, the ... Runs one sqlcmd query with its defaults (Windows authentication to the local default instance); set SQLCMDSERVER, SQLCMDUSER and SQLCMDPASSWORD for another instance or SQL authentication. Needs VIEW SERVER STATE / sysadmin-level read access.'
target: mssql
level: 1
severity: high
tags:
- mssql
- database
- authentication
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 2.13 Ensure the 'sa' Login Account is set to 'Disabled'
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.server_principals WHERE sid = 0x01 AND is_disabled = 0;"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Confirm no application or job uses the sa login (SID 0x01), then run: USE [master]; DECLARE @tsql nvarchar(max) = ''ALTER LOGIN '' + QUOTENAME(SUSER_NAME(0x01)) + '' DISABLE''; EXEC (@tsql);'
