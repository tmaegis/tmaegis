id: TMA-MSSQL-3.7
title: Ensure the SQL Server's Full-Text Service Account is Not an Administrator
description: 'The service account and/or service SID used by the MSSQLFDLauncher service for a default instance or MSSQLFDLauncher$<InstanceName> service for a named instance should not be a member of the Windows Administrator group either directly or indirectly (via a group). This also means that the account known as LocalSystem (aka NT AUTHORITY\SYSTEM) should not be used for the Full-Text service as this account has higher privileges than the SQL ... Default: By default, the Service Account (or Service SID) is not a member of the Administrators group.'
target: mssql
level: 1
severity: medium
tags:
- mssql
- database
- manual
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 3.7 Ensure the SQL Server's Full-Text Service Account is Not an Administrator
audit:
  type: manual
  command: Verify that the service account (in case of a local or AD account) and service SID are not members of the Windows Administrators group.
remediation:
  type: iac_patch
  command: In the case where LocalSystem is used, use SQL Server Configuration Manager to change to a less privileged account. Otherwise, remove the account or service SID from the Administrators group. You may need to run the SQL Server Configuration Manager if underlying permissions had been changed or if SQL Server Configuration Manager was not originally used to set the service account.
