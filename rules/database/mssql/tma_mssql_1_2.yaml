id: TMA-MSSQL-1.2
title: Ensure Single-Function Member Servers are Used
description: It is recommended that SQL Server software be installed on a dedicated server. This architectural consideration affords security flexibility in that the database server can be placed on a separate subnet allowing access only from particular hosts and over particular protocols. Degrees of availability are easier to achieve as well - over time, an enterprise can move from a single database server to a failover to a cluster using load balancing ...
target: mssql
level: 1
severity: low
tags:
- mssql
- database
- manual
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 1.2 Ensure Single-Function Member Servers are Used
audit:
  type: manual
  command: Ensure that no other roles are enabled for the underlying operating system and that no excess tooling is installed, per enterprise policy.
remediation:
  type: iac_patch
  command: Uninstall excess tooling and/or remove unnecessary roles from the underlying operating system.
