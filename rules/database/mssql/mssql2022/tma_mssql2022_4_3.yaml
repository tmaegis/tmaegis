id: TMA-MSSQL2022-4.3
title: Ensure 'CHECK_POLICY' Option is set to 'ON' for All SQL Authenticated Logins
description: Applies the same password complexity policy used in Windows to passwords used inside SQL Server. Ensure SQL authenticated login passwords comply with the secure password policy applied by the Windows Server Benchmark so that they cannot be easily compromised via brute force attack.
target: mssql
level: 1
severity: medium
tags:
- auth
- logging
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 4.3 Ensure 'CHECK_POLICY' Option is set to 'ON' for All SQL Authenticated Logins
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.sql_logins WHERE is_policy_checked = 0;"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'For each <login_name> found by the Audit Procedure, execute the following T-SQL statement: ALTER LOGIN [<login_name>] WITH CHECK_POLICY = ON; Note: In the case of AWS RDS do not perform this remediation for the Master account.'
