id: TMA-MSSQL2022-6.1
title: Ensure Database and Application User Input is Sanitized
description: Always validate user input received from a database client or application by testing type, length, format, and range prior to transmitting it to the database server. Sanitizing user input drastically minimizes risk of SQL injection.
target: mssql
level: 1
severity: medium
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 6.1 Ensure Database and Application User Input is Sanitized
audit:
  type: manual
  command: Check with the application teams to ensure any database interaction is through the use of stored procedures and not dynamic SQL. Revoke any INSERT, UPDATE, or DELETE privileges to users so that modifications to data must be done through stored procedures. Verify that there's no SQL query in the application code produced by string concatenation.
remediation:
  type: iac_patch
  command: 'The following steps can be taken to remediate SQL injection vulnerabilities: - Review TSQL and application code for SQL Injection - Only permit minimally privileged accounts to send user input to the server - Minimize the risk of SQL injection attack by using parameterized commands and stored procedures - Reject user input containing binary data, escape sequences, and comment characters - Always validate user input and do not use it directly to build SQL statements'
