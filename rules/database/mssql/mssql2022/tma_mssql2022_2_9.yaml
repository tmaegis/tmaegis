id: TMA-MSSQL2022-2.9
title: Ensure 'Trustworthy' Database Property is set to 'Off'
description: The TRUSTWORTHY database option allows database objects to access objects in other databases under certain circumstances. Provides protection from malicious CLR assemblies or extended procedures.
target: mssql
level: 1
severity: high
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 2.9 Ensure 'Trustworthy' Database Property is set to 'Off'
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE is_trustworthy_on = 1 AND name <> 'msdb';"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Execute the following T-SQL statement against the databases (replace <database_name> below) returned by the Audit Procedure: ALTER DATABASE [<database_name>] SET TRUSTWORTHY OFF;'
