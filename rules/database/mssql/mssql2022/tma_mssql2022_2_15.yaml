id: TMA-MSSQL2022-2.15
title: Ensure 'AUTO_CLOSE' is set to 'OFF' on contained databases
description: AUTO_CLOSE determines if a given database is closed or not after a connection terminates. If enabled, subsequent connections to the given database will require the database to be reopened and relevant procedure caches to be rebuilt. Because authentication of users for contained databases occurs within the database not at the server\instance level, the database must be opened every time to authenticate a user. The frequent opening/closing of the database consumes additional server resources and may contribute to a denial of service.
target: mssql
level: 1
severity: low
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 2.15 Ensure 'AUTO_CLOSE' is set to 'OFF' on contained databases
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE containment <> 0 AND is_auto_close_on = 1;"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Execute the following T-SQL, replacing <database_name> with each database name found by the Audit Procedure: ALTER DATABASE <database_name> SET AUTO_CLOSE OFF;'
