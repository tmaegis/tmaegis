id: TMA-MSSQL2022-3.7
title: Ensure the SQL Server’s Full-Text Service Account is Not an Administrator
description: The service account and/or service SID used by the MSSQLFDLauncher service for a default instance or MSSQLFDLauncher$<InstanceName> service for a named instance should not be a member of the Windows Administrator group either directly or indirectly (via a group). This also means that the account known as LocalSystem (aka NT AUTHORITY\SYSTEM) should not be used for the Full-Text service as this account has higher privileges than the SQL Server service requires. Following the principle of least privilege, the service account should have no more privileges than required to do its job. For SQL Server services, the SQL Server Setup will assign the required permissions directly to the service SID. No additional permissions or privileges should be necessary.
target: mssql
level: 1
severity: medium
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 3.7 Ensure the SQL Server’s Full-Text Service Account is Not an Administrator
audit:
  type: manual
  command: Verify that the service account (in case of a local or AD account) and service SID are not members of the Windows Administrators group.
remediation:
  type: iac_patch
  command: In the case where LocalSystem is used, use SQL Server Configuration Manager to change to a less privileged account. Otherwise, remove the account or service SID from the Administrators group. You may need to run the SQL Server Configuration Manager if underlying permissions had been changed or if SQL Server Configuration Manager was not originally used to set the service account.
