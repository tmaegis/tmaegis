id: TMA-MSSQL2022-2.10
title: Ensure Unnecessary SQL Server Protocols are set to 'Disabled'
description: SQL Server supports Shared Memory, Named Pipes, and TCP/IP protocols. However, SQL Server should be configured to use the bare minimum required based on the organization's needs. Using fewer protocols minimizes the attack surface of SQL Server and, in some cases, can protect it from remote attacks.
target: mssql
level: 1
severity: low
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 2.10 Ensure Unnecessary SQL Server Protocols are set to 'Disabled'
audit:
  type: manual
  command: Open SQL Server 2022 Configuration Manager; go to the SQL Server Network Configuration. Ensure that only required protocols are enabled.
remediation:
  type: iac_patch
  command: Open SQL Server 2022 Configuration Manager; go to the SQL Server Network Configuration. Ensure that only required protocols are enabled. Disable protocols not necessary.
