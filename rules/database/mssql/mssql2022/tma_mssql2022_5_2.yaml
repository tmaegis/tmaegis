id: TMA-MSSQL2022-5.2
title: Ensure 'Default Trace Enabled' Server Configuration Option is set to '1'
description: The default trace provides audit logging of database activity including account creations, privilege elevation and execution of DBCC commands. Default trace provides valuable audit information regarding security-related activities on the server.
target: mssql
level: 1
severity: medium
tags:
- mssql
- sqlserver-2022
reference: CIS Microsoft SQL Server 2022 Benchmark v1.3.0 - 5.2 Ensure 'Default Trace Enabled' Server Configuration Option is set to '1'
audit:
  type: sql_query
  command: sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN CAST(value AS int) = 1 AND CAST(value_in_use AS int) = 1 THEN 'compliant' ELSE 'noncompliant' END FROM sys.configurations WHERE name = 'default trace enabled';"
  expected_output: compliant
remediation:
  type: command
  command: |
    sqlcmd -b -h -1 -W -Q "SET NOCOUNT ON; EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'default trace enabled', 1; RECONFIGURE; EXEC sp_configure 'show advanced options', 0; RECONFIGURE;"
  guidance: "Run the following T-SQL command: EXECUTE sp_configure 'show advanced options', 1; RECONFIGURE; EXECUTE sp_configure 'default trace enabled', 1; RECONFIGURE; GO EXECUTE sp_configure 'show advanced options', 0; RECONFIGURE;"
