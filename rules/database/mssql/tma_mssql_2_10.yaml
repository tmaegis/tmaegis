id: TMA-MSSQL-2.10
title: Ensure Unnecessary SQL Server Protocols are set to 'Disabled'
description: 'SQL Server supports Shared Memory, Named Pipes, and TCP/IP protocols. However, SQL Server should be configured to use the bare minimum required based on the organization''s needs. Default: By default, TCP/IP and Shared Memory protocols are enabled on all commercial editions.'
target: mssql
level: 1
severity: low
tags:
- mssql
- database
- manual
reference: CIS Microsoft SQL Server 2025 Benchmark v1.0.0 - 2.10 Ensure Unnecessary SQL Server Protocols are set to 'Disabled'
audit:
  type: manual
  command: Open SQL Server Configuration Manager; go to the SQL Server Network Configuration. Ensure that only required protocols are enabled.
remediation:
  type: iac_patch
  command: Open SQL Server Configuration Manager; go to the SQL Server Network Configuration. Ensure that only required protocols are enabled. Disable protocols not necessary.
