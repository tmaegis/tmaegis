id: TMA-MYSQL-2.5
title: Do Not Reuse Usernames
description: Database user accounts should not be reused for multiple applications or users.
target: mysql
level: 1
severity: low
tags:
- mysql
- database
- authentication
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.5 Do Not Reuse Usernames
audit:
  type: manual
  command: 'List accounts: SELECT host, user, plugin FROM mysql.user WHERE user NOT IN (''mysql.infoschema'',''mysql.session'',''mysql.sys''); Each account must belong to exactly one system account, person or application; shared or reused usernames are a fail.'
remediation:
  type: iac_patch
  command: Create a separate account per person, application and system account, migrate their grants, and drop the shared accounts.
