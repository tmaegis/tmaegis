id: TMA-MYSQL-4.1
title: Ensure the Latest Security Patches are Applied
description: Periodically, updates to MySQL server are released to resolve bugs, mitigate vulnerabilities, and provide new features. It is recommended that MySQL installations are up to date with the latest security updates.
target: mysql
level: 1
severity: high
tags:
- mysql
- database
- patching
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 4.1 Ensure the Latest Security Patches are Applied
audit:
  type: manual
  command: Run SHOW VARIABLES WHERE Variable_name LIKE 'version'; and compare with the latest release and security announcements from Oracle (Critical Patch Updates) and your OS vendor. An outdated release is a fail.
remediation:
  type: iac_patch
  command: Upgrade MySQL to the latest release of the installed series with the package manager during a maintenance window and run the upgrade steps for the release.
