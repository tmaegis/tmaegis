id: TMA-MYSQL-2.1.2
title: Verify Backups are Good
description: Backups should be validated on a regular basis.
target: mysql
level: 1
severity: medium
tags:
- mysql
- database
- backup
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.1.2 Verify Backups are Good
audit:
  type: manual
  command: 'Check reports of backup validation tests: backups must be restored regularly to a test system and verified.'
remediation:
  type: iac_patch
  command: Implement a regular restore test of backups and keep the validation reports.
