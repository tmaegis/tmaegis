id: TMA-MYSQL-10.2
title: Allowlist Approved Servers Belonging to a MySQL InnoDB Cluster
description: Optionally, specify an allowlist of approved servers that belong to the MySQL InnoDB Cluster.
target: mysql
level: 2
severity: medium
tags:
- mysql
- database
- replication
- network
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 10.2 Allowlist Approved Servers Belonging to a MySQL InnoDB Cluster
audit:
  type: manual
  command: Run SELECT @@group_replication_ip_allowlist; on each InnoDB Cluster member. The value must list only the IPv4/IPv6 addresses, subnets or host names of approved cluster members (AUTOMATIC or overly broad ranges are a finding).
remediation:
  type: iac_patch
  command: 'Set the allowlist on each member: STOP GROUP_REPLICATION; SET PERSIST group_replication_ip_allowlist = ''<ip1>,<ip2>,<subnet>''; START GROUP_REPLICATION; (or ipAllowlist in MySQL Shell).'
