id: TMA-MYSQL-2.4
title: Do Not Specify Passwords in the Command Line
description: When a command is executed on the command line, for example mysql -u admin -p password or mysqlsh -u admin -p password, the password may be visible in the user's shell/command history or in the process list.
target: mysql
level: 1
severity: medium
tags:
- mysql
- database
- credentials
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.4 Do Not Specify Passwords in the Command Line
audit:
  type: manual
  command: Check the process list (ps -ef) and shell histories for mysql/mysqldump invocations with -p<password> or --password=<password>. Any visible password is a fail.
remediation:
  type: iac_patch
  command: Use -p without a value (prompt), an option file with mode 0600 or mysql_config_editor login paths instead of passwords on the command line, and clear exposed history entries.
