id: TMA-MYSQL-1.7
title: Ensure MySQL is Run Under a Sandbox Environment
description: Use of the chroot() system call at startup, Systemd with settings to achieve isolation, or docker will put MySQL in a Sandbox environment.
target: mysql
level: 2
severity: low
tags:
- mysql
- database
- os
- isolation
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 1.7 Ensure MySQL is Run Under a Sandbox Environment
audit:
  type: manual
  command: 'Check whether MySQL is confined: chroot option (grep -r ''^chroot'' /etc/mysql /etc/my.cnf*; must differ from datadir), systemd unit runs as a non-root user (systemctl status mysqld: Main PID not owned by root), or it runs in a container (docker ps / podman ps). None of these is a fail.'
remediation:
  type: iac_patch
  command: Run MySQL under systemd as the mysql user, in a container, or with chroot=<path> under [mysqld], and keep SELinux/AppArmor confinement enabled.
