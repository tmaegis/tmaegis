id: TMA-MYSQL-5.3
title: Ensure 'PROCESS' is Not Granted to Non-Administrative Users
description: The PROCESS privilege found in the mysql.user table determines whether a given user can see statement execution information for all sessions.
target: mysql
level: 2
severity: medium
tags:
- mysql
- database
- authorization
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 5.3 Ensure 'PROCESS' is Not Granted to Non-Administrative Users
audit:
  type: manual
  command: Run SELECT GRANTEE FROM INFORMATION_SCHEMA.USER_PRIVILEGES WHERE PRIVILEGE_TYPE = 'PROCESS'; Ensure only administrative users are returned in the result set.
remediation:
  type: iac_patch
  command: REVOKE PROCESS ON *.* FROM '<user>'@'<host>'; for each non-administrative grantee.
