id: TMA-MYSQL-2.1.1
title: Backup Policy in Place
description: A backup policy should be in place.
target: mysql
level: 1
severity: medium
tags:
- mysql
- database
- backup
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.1.1 Backup Policy in Place
audit:
  type: manual
  command: Check that a backup schedule exists (crontab -l for the backup user, systemd timers or the backup tool scheduler) covering all databases.
remediation:
  type: iac_patch
  command: Define and schedule regular full and incremental backups (mysqldump/MySQL Shell dump utilities/MySQL Enterprise Backup), e.g. via cron or systemd timers.
