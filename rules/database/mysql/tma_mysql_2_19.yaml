id: TMA-MYSQL-2.19
title: Ensure FIPS 140-2 OpenSSL Cryptography Is Used
description: Install, configure, and use OpenSSL on a platform that has a NIST certified FIPS 140-2 installation of OpenSSL. This provides MySQL instances the ability to generate and validate cryptographic hashes to protect unclassified information requiring confidentiality and cryptographic protection, in accordance with the data owner's requirements.
target: mysql
level: 1
severity: medium
tags:
- mysql
- database
- crypto
- fips
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.19 Ensure FIPS 140-2 OpenSSL Cryptography Is Used
audit:
  type: manual
  command: FIPS mode requires MySQL built against a FIPS-certified OpenSSL 3.0 with the FIPS provider installed and the OS in FIPS mode (cat /proc/sys/crypto/fips_enabled = 1). In MySQL 8.4 check that the OpenSSL configuration activates the fips provider (openssl list -providers) and that mysqld logs no FIPS errors at start-up.
remediation:
  type: iac_patch
  command: Enable OS FIPS mode (e.g. fips-mode-setup --enable on RHEL), install the OpenSSL 3 FIPS provider, configure OpenSSL to load it, and restart MySQL.
