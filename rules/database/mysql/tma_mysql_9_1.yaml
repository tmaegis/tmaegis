id: TMA-MYSQL-9.1
title: Ensure Replication Traffic is Secured
description: The replication traffic between servers should be secured. Security measures should include ensuring the confidentiality and integrity of the traffic, and performing mutual authentication between the servers before performing replication.
target: mysql
level: 1
severity: high
tags:
- mysql
- database
- replication
- tls
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 9.1 Ensure Replication Traffic is Secured
audit:
  type: manual
  command: Check that replication traffic uses a private network, a VPN, SSL/TLS or an SSH tunnel for confidentiality, integrity and mutual server authentication.
remediation:
  type: iac_patch
  command: Secure replication with TLS (CHANGE REPLICATION SOURCE TO SOURCE_SSL=1, SOURCE_SSL_CA=... and REQUIRE SSL/X509 for the replication account) or a private network/VPN.
