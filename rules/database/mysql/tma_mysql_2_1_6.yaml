id: TMA-MYSQL-2.1.6
title: Backup of Configuration and Related Files
description: It is important to include configuration, log, key, certificates, and customized files in backups.
target: mysql
level: 1
severity: low
tags:
- mysql
- database
- backup
- manual
reference: CIS Oracle MySQL Community Server 8.4 Benchmark v1.1.0 - 2.1.6 Backup of Configuration and Related Files
audit:
  type: manual
  command: 'Check that the backup includes: edited configuration files (my.cnf and included files, mysqld-auto.cnf (SET PERSIST)), key management/keyring files, audit log files, SSL certificates and keys, UDF libraries and custom source code.'
remediation:
  type: iac_patch
  command: Add these configuration and related files to the backup set.
