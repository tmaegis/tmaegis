id: TMA-YUGABYTEDB-3.1.8
title: Ensure syslog messages are not suppressed
description: When logging to Syslog and this is on, then each message will be prefixed by an increasing sequence number.
target: yugabytedb
level: 1
severity: low
tags:
- yugabytedb
- logging
reference: CIS YugabyteDB Benchmark v2.0.0 - 3.1.8 Ensure syslog messages are not suppressed
audit:
  type: manual
  command: Run SHOW syslog_sequence_numbers; in ysqlsh. Where syslog is a log destination it must be on (the default), so that repeated messages are not suppressed by the syslog daemon; off is a finding.
remediation:
  type: iac_patch
  command: Set it with the YB-TServer GFlag --ysql_pg_conf_csv="syslog_sequence_numbers='on'" on every YB-TServer and restart it.
