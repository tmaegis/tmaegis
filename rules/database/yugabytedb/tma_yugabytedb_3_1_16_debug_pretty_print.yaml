id: TMA-YUGABYTEDB-3.1.16
title: Ensure 'debug_pretty_print' is enabled
description: Enabling debug_pretty_print indents the messages produced by debug_print_parse, debug_print_rewritten, or debug_print_plan making them significantly easier to read. Runs ysqlsh (add the YugabyteDB bin directory to PATH) against PGHOST/PGPORT (default 127.0.0.1:5433) as PGUSER (default yugabyte); supply the password through PGPASSWORD or ~/.pgpass.
target: yugabytedb
level: 1
severity: low
tags:
- yugabytedb
- logging
reference: CIS YugabyteDB Benchmark v2.0.0 - 3.1.16 Ensure 'debug_pretty_print' is enabled
audit:
  type: sql_query
  command: out=$(ysqlsh -h "${PGHOST:-127.0.0.1}" -p "${PGPORT:-5433}" -U "${PGUSER:-yugabyte}" -d "${PGDATABASE:-yugabyte}" -tAc "SHOW debug_pretty_print" 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: 'on'
remediation:
  type: iac_patch
  command: Set it with the YB-TServer GFlag --ysql_pg_conf_csv="debug_pretty_print='on'" on every YB-TServer and restart it.
