id: TMA-YUGABYTEDB-1.5
title: Ensure latest version of YugabyteDB is installed
description: 'The YugabyteDB installation version, along with the patches, should be the most recent that is compatible with the organization''s operational needs. When obtaining and installing software packages (typically via apt-get or you can compile the source code), it''s imperative that packages (or the source code, tarball) are sourced only from valid and authorized repository download.yugabyte.com. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: yugabytedb
level: 2
severity: high
tags:
- yugabytedb
- patching
reference: CIS YugabyteDB Benchmark v2.0.0 - 1.5 Ensure latest version of YugabyteDB is installed
audit:
  type: manual
  command: Run ./bin/yugabyted version (or cat <install dir>/version_metadata.json) on every node and compare with the YugabyteDB release notes. The release series must be supported and on its latest patch build; an old or unsupported version is a finding.
remediation:
  type: iac_patch
  command: 'Upgrade to the latest stable version of the YugabyteDB software: Upgrade YB-Master Use the following procedure to upgrade a YB-Master: 1. Stop the older version of the YB-Master process, as follows: pkill yb-master 2. Verify that you are on the directory of the new version, as follows: cd /home/yugabyte/softwareyb-$VER/ 3. Start the newer version of the YB-Master process. For more information, see Start YB-Masters. 4.'
