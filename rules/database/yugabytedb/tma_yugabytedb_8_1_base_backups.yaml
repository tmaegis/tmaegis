id: TMA-YUGABYTEDB-8.1
title: Ensure base backups are configured and functional
description: Backup and restoration is the process of creating and storing copies of your data for protection against data loss. With a proper backup strategy, you can always restore your data to a most-recent known working state and minimize application downtime. This in turn guarantees business and application continuity.
target: yugabytedb
level: 1
severity: high
tags:
- yugabytedb
- backup
reference: CIS YugabyteDB Benchmark v2.0.0 - 8.1 Ensure base backups are configured and functional
audit:
  type: manual
  command: 'Run yb-admin -master_addresses <masters> list_snapshot_schedules: at least one active schedule must exist. Run yb-admin -master_addresses <masters> list_snapshots: the most recent snapshot of each schedule must be COMPLETE (FAILED or CREATING, or no COMPLETE snapshot, is a finding). Confirm snapshots are also exported off-cluster and restores are tested.'
remediation:
  type: iac_patch
  command: 'Using distributed snapshots allows you to back up a database and then restore it in case of a software or operational error, with minimal recovery time objectives (RTO) and overhead. To back up a database, create a snapshot using the create_database_snapshot command, as follows: ./bin/yb-admin -master_addresses <ip1:7100,ip2:7100,ip3:7100> create_database_snapshot ysql.<database_name> A unique ID for the snapshot is returned, as shown in the ...'
