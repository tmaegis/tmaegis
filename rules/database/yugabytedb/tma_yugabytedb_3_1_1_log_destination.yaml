id: TMA-YUGABYTEDB-3.1.1
title: Ensure the log destinations are set correctly
description: 'YugabyteDB by default supports logging server messages to stderr. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: yugabytedb
level: 1
severity: medium
tags:
- yugabytedb
- logging
reference: CIS YugabyteDB Benchmark v2.0.0 - 3.1.1 Ensure the log destinations are set correctly
audit:
  type: manual
  command: Run SHOW log_destination; in ysqlsh. The value (default stderr) must include every log destination your organisation logging policy requires (e.g. stderr, csvlog, syslog). Missing required destinations are a finding.
remediation:
  type: iac_patch
  command: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the following GFLAG to YB-TServer: ./bin/yb-tserver --ysql_pg_conf_csv="log_destination=''stderr''"'
