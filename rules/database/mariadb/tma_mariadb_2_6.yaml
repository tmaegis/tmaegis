id: TMA-MARIADB-2.6
title: Ensure 'password_lifetime' is Less Than or Equal to '365'
description: 'Password expiration provides users with a unique time bounded password lifetime. Fails when default_password_lifetime exceeds 365 or an account in mysql.global_priv overrides it with 0 (never) or more than 365 days. Runs mariadb -NBe with the client defaults: as root on the server the unix_socket plugin usually authenticates; otherwise put an administrative account in ~/.my.cnf (mode 0600), not MYSQL_PWD (see 1.4/1.6).'
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- authentication
- password
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.6 Ensure 'password_lifetime' is Less Than or Equal to '365'
audit:
  type: sql_query
  command: out=$(mariadb -NBe "SELECT IF(@@global.default_password_lifetime <= 365 AND (SELECT COUNT(*) FROM mysql.global_priv WHERE JSON_EXTRACT(Priv, '\$.password_lifetime') = 0 OR JSON_EXTRACT(Priv, '\$.password_lifetime') > 365) = 0, 'compliant', 'noncompliant')" 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v mysql >/dev/null 2>&1 || exit 0
    cli() { mysql -NB "$@"; }
    dir=; for x in /etc/mysql/mysql.conf.d /etc/mysql/mariadb.conf.d /etc/mysql/conf.d /etc/my.cnf.d; do [ -d "$x" ] && { dir=$x; break; }; done
    [ -n "$dir" ] || { echo "no mysql conf.d directory found" >&2; exit 1; }
    setv() { # name option value
      printf '[mysqld]\n%s=%s\n' "$2" "$3" > "$dir/99-tmaegis-$1.cnf"; chmod 644 "$dir/99-tmaegis-$1.cnf"
      cli -e "SET GLOBAL $1 = '$3'" 2>/dev/null || true; }
    setv default_password_lifetime default_password_lifetime 365
  guidance: "SET GLOBAL default_password_lifetime = 365; add default_password_lifetime=365 under [mariadbd], and fix per-account overrides with ALTER USER <user>@<host> PASSWORD EXPIRE INTERVAL 365 DAY;"
