id: TMA-MARIADB-2.4
title: Do Not Reuse Usernames
description: Database user accounts should not be reused for multiple applications or users.
target: mariadb
level: 1
severity: low
tags:
- mariadb
- database
- authentication
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.4 Do Not Reuse Usernames
audit:
  type: manual
  command: 'List accounts: SELECT host, user, plugin FROM mysql.user WHERE user NOT IN (''mysql'',''root'',''mariadb.sys''); Each account must belong to exactly one system account, person or application; shared or reused usernames are a fail.'
remediation:
  type: iac_patch
  command: Create a separate account per person, application and system account, migrate their grants, and drop the shared accounts.
