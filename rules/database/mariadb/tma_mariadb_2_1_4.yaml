id: TMA-MARIADB-2.1.4
title: The Backups Should be Properly Secured
description: The backup files will contain all data in the databases. Filesystem permissions and/or encryption should be used to prevent unauthorized users from gaining access to the backups.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- backup
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.1.4 The Backups Should be Properly Secured
audit:
  type: manual
  command: 'Check who can access backup files: they must not be world-readable or in a world-readable directory, group access only for a backup-specific group, offsite copies restricted, and backups encrypted with a key stored separately (not a guessable password).'
remediation:
  type: iac_patch
  command: Restrict backup files and directories (e.g. chmod 600/700, backup-specific owner/group), encrypt backups, and store the encryption key separately from the backups.
