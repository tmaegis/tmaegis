id: TMA-MARIADB-1.6
title: Verify That 'MYSQL_PWD' is Not Set in Users' Profiles
description: MariaDB can read a default database password from an environment variable called MYSQL_PWD. Run as root; counts Bash login scripts in /home/*, /root and /etc/environment that mention MYSQL_PWD.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- credentials
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 1.6 Verify That 'MYSQL_PWD' is Not Set in Users' Profiles
audit:
  type: command
  command: '[ "$(id -u)" -eq 0 ] || exit 1; n=$(grep -ls MYSQL_PWD /home/*/.bashrc /home/*/.profile /home/*/.bash_profile /root/.bashrc /root/.profile /root/.bash_profile /etc/environment 2>/dev/null | wc -l); echo "$n"'
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for f in /home/*/.bashrc /home/*/.profile /home/*/.bash_profile /root/.bashrc /root/.profile /root/.bash_profile /etc/environment; do
      [ -f "$f" ] && grep -q MYSQL_PWD "$f" && { cp -p "$f" "$f.tmaegis.bak"; sed -i '/MYSQL_PWD/s/^/# disabled by TMAegis: /' "$f"; }
    done; true
  guidance: "Remove MYSQL_PWD from the listed login scripts and use a protected option file (~/.my.cnf, mode 0600) instead."
