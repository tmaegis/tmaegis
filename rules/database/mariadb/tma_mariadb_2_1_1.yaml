id: TMA-MARIADB-2.1.1
title: Backup Policy in Place
description: A backup policy should be in place.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- backup
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.1.1 Backup Policy in Place
audit:
  type: manual
  command: Check that a backup schedule exists (crontab -l for the backup user, systemd timers or the backup tool scheduler) covering all databases.
remediation:
  type: iac_patch
  command: Define and schedule regular full and incremental backups (mariadb-backup), e.g. via cron or systemd timers.
