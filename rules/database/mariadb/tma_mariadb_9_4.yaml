id: TMA-MARIADB-9.4
title: Ensure only approved ciphers are used for Replication
description: MariaDB supports multiple encryption ciphers that can be used for TLS connections during replication. Ciphers can vary in strength, speed and overhead.
target: mariadb
level: 2
severity: medium
tags:
- mariadb
- database
- replication
- tls
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 9.4 Ensure only approved ciphers are used for Replication
audit:
  type: manual
  command: If replication uses TLS, run SHOW REPLICA STATUS\G on the replica and verify Master_SSL_Cipher lists only approved ciphers/cipher suites. An empty value or unapproved ciphers is a fail.
remediation:
  type: iac_patch
  command: STOP REPLICA; CHANGE MASTER TO MASTER_SSL_CIPHER = '<approved cipher list>'; START REPLICA;
