id: TMA-MARIADB-2.1.7
title: Backup of Configuration and Related Files
description: It is important to include configuration, log, key, certificates, and customized files in backups.
target: mariadb
level: 1
severity: low
tags:
- mariadb
- database
- backup
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.1.7 Backup of Configuration and Related Files
audit:
  type: manual
  command: 'Check that the backup includes: edited configuration files (mariadb.cnf and included files), key management/keyring files, audit log files, SSL certificates and keys, UDF libraries and custom source code.'
remediation:
  type: iac_patch
  command: Add these configuration and related files to the backup set.
