id: TMA-MARIADB-2.1.3
title: Secure Backup Credentials
description: A database user with the least amount of privileges required to perform backup is needed. The credentials for this user should be protected. The password, certificate, and any other credentials should be protected.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- backup
- credentials
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.1.3 Secure Backup Credentials
audit:
  type: manual
  command: Check permissions of files containing backup passwords and/or SSL keys (ls -l on option files and key files used by backup jobs); they must be readable only by the backup account.
remediation:
  type: iac_patch
  command: chmod 600 the files holding backup credentials/keys and chown them to the backup user; prefer an option file over passwords on the command line.
