id: TMA-MARIADB-6.5
title: Ensure the Audit Plugin Can't be Unloaded
description: 'Set server_audit to FORCE_PLUS_PERMANENT Runs mariadb -NBe with the client defaults: as root on the server the unix_socket plugin usually authenticates; otherwise put an administrative account in ~/.my.cnf (mode 0600), not MYSQL_PWD (see 1.4/1.6).'
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- logging
- audit
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 6.5 Ensure the Audit Plugin Can't be Unloaded
audit:
  type: sql_query
  command: out=$(mariadb -NBe "SELECT IFNULL((SELECT LOAD_OPTION FROM information_schema.PLUGINS WHERE PLUGIN_NAME = 'SERVER_AUDIT'), 'NOT_LOADED')" 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: FORCE_PLUS_PERMANENT
remediation:
  type: iac_patch
  command: Set server_audit=FORCE_PLUS_PERMANENT under [mariadbd] in /etc/mysql/mariadb.conf.d/50-server.cnf (or /etc/my.cnf.d/server.cnf), then restart MariaDB.
