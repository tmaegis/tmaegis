id: TMA-MARIADB-2.3
title: Do Not Specify Passwords in the Command Line
description: When a command is executed on the command line, for example mariadb -u admin -p password, the password may be visible in the user's shell/command history or in the process list.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- credentials
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.3 Do Not Specify Passwords in the Command Line
audit:
  type: manual
  command: Check the process list (ps -ef) and shell histories for mariadb/mysqldump invocations with -p<password> or --password=<password>. Any visible password is a fail.
remediation:
  type: iac_patch
  command: Use -p without a value (prompt), an option file with mode 0600 instead of passwords on the command line, and clear exposed history entries.
