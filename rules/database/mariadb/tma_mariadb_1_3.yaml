id: TMA-MARIADB-1.3
title: Disable MariaDB Command History
description: On Unix, the mysql client writes a record of executed statements to a history file. By default, this file is named .mysql_history and is created in your home directory. To specify a different file, set the value of the MYSQL_HISTFILE environment variable. Run as root; counts client history files under /home and /root that are not symlinks to /dev/null.
target: mariadb
level: 2
severity: low
tags:
- mariadb
- database
- credentials
- history
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 1.3 Disable MariaDB Command History
audit:
  type: command
  command: '[ "$(id -u)" -eq 0 ] || exit 1; l=$(find /home /root -maxdepth 4 \( -name .mysql_history -o -name .mariadb_history \) 2>/dev/null); n=0; for x in $l; do [ "$(readlink "$x")" = /dev/null ] || n=$((n+1)); done; echo "$n"'
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for h in $(find /home /root -maxdepth 4 \( -name .mysql_history -o -name .mariadb_history -o -path '*/.mysqlsh/history*' \) 2>/dev/null); do
      [ "$(readlink "$h")" = /dev/null ] || { rm -f "$h" && ln -s /dev/null "$h"; }
    done; true
  guidance: "For each user remove the history file and prevent re-creation: rm -f ~<user>/.mysql_history && ln -s /dev/null ~<user>/.mysql_history, or export MYSQL_HISTFILE=/dev/null in the shell startup script."
