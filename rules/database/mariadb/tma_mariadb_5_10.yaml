id: TMA-MARIADB-5.10
title: Securely Define Stored Procedures and Functions DEFINER and INVOKER
description: Stored procedure and stored function declarations include a definition of permissions which can be used to escalate permissions. It's important to inspect these settings to ensure they do not unnecessarily escalate privileges.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- authorization
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 5.10 Securely Define Stored Procedures and Functions DEFINER and INVOKER
audit:
  type: manual
  command: Run SHOW PROCEDURE STATUS; and SHOW FUNCTION STATUS; and inspect Definer and Security_type. For SQL SECURITY DEFINER routines owned by powerful users, review the code (SHOW CREATE PROCEDURE/FUNCTION <name>) and information_schema.routines/parameters.
remediation:
  type: iac_patch
  command: Use SQL SECURITY INVOKER where possible, or set DEFINER to a least-privileged account (ALTER/CREATE ... DEFINER=...), and restrict EXECUTE on sensitive routines.
