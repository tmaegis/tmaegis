id: TMA-MARIADB-4.1
title: Ensure the Latest Security Patches are Applied
description: Periodically, updates to MariaDB server are released to resolve bugs, mitigate vulnerabilities, and provide new features. It is recommended that MariaDB installations are up to date with the latest security updates.
target: mariadb
level: 1
severity: high
tags:
- mariadb
- database
- patching
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 4.1 Ensure the Latest Security Patches are Applied
audit:
  type: manual
  command: Run SHOW VARIABLES WHERE Variable_name LIKE 'version'; and compare with the latest release and security announcements from MariaDB and your OS vendor. An outdated release is a fail.
remediation:
  type: iac_patch
  command: Upgrade MariaDB to the latest release of the installed series with the package manager during a maintenance window and run the upgrade steps for the release.
