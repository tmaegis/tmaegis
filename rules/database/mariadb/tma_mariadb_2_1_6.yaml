id: TMA-MARIADB-2.1.6
title: Disaster Recovery (DR) Plan
description: A disaster recovery plan should be created. MariaDB Galera Cluster (group replication), MariaDB Replication (asynchronous replication) or both may be used. A replica in a different data center and offsite backups may be used.
target: mariadb
level: 1
severity: medium
tags:
- mariadb
- database
- backup
- manual
reference: CIS MariaDB 10.11 Benchmark v1.0.0 - 2.1.6 Disaster Recovery (DR) Plan
audit:
  type: manual
  command: Check that a documented disaster recovery plan exists (e.g. a replica in another data center or offsite backups), including recovery time objectives and tested procedures.
remediation:
  type: iac_patch
  command: Create and test a disaster recovery plan (offsite backups, replicas in a separate location, documented restore steps).
