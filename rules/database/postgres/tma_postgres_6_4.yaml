id: TMA-POSTGRES-6.4
title: Ensure 'SIGHUP' Runtime Parameters are Configured
description: PostgreSQL runtime parameters that are executed by the SIGHUP signal.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- configuration
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.4 Ensure 'SIGHUP' Runtime Parameters are Configured
audit:
  type: manual
  command: Run SELECT name, setting FROM pg_settings WHERE context = 'sighup' ORDER BY 1; and compare with your approved baseline and the configuration files. Any unexpected value is a fail.
remediation:
  type: iac_patch
  command: Restore approved values in postgresql.conf/postgresql.auto.conf and run SELECT pg_reload_conf(); (or send SIGHUP to the postmaster).
