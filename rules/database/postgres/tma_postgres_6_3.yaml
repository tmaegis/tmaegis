id: TMA-POSTGRES-6.3
title: Ensure 'Postmaster' Runtime Parameters are Configured
description: PostgreSQL runtime parameters that are executed by the postmaster process.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- configuration
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.3 Ensure 'Postmaster' Runtime Parameters are Configured
audit:
  type: manual
  command: Run SELECT name, setting FROM pg_settings WHERE context = 'postmaster' ORDER BY 1; and compare with your approved baseline and with postgresql.conf/postgresql.auto.conf and $PGDATA/postmaster.opts. Any unexpected change is a fail.
remediation:
  type: iac_patch
  command: Restore approved values in the configuration files and restart PostgreSQL (a full stop/start if the value came from the pg_ctl command line).
