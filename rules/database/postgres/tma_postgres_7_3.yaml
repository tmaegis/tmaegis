id: TMA-POSTGRES-7.3
title: Ensure base backups are configured and functional
description: A 'base backup' is a copy of the PRIMARY host's data cluster ($PGDATA) and is used to create STANDBY hosts and for Point In Time Recovery (PITR) mechanisms. Base backups should be copied across networks in a secure manner using an encrypted transport mechanism.
target: postgres
level: 1
severity: medium
tags:
- postgres
- database
- backup
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 7.3 Ensure base backups are configured and functional
audit:
  type: manual
  command: Confirm that base backups (pg_basebackup, pgBackRest or similar) exist, are taken on a regular schedule, are stored off-host, and that restores are tested.
remediation:
  type: iac_patch
  command: Schedule regular base backups (e.g. pg_basebackup -D <dir> -Ft -z -P or pgBackRest), store them separately from the database server with restricted access, and test restores.
