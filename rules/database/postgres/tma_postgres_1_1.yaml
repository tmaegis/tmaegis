id: TMA-POSTGRES-1.1
title: Ensure packages are obtained from authorized repositories
description: Standard Linux distributions, although possessing the requisite packages, often do not have PostgreSQL pre-installed. The installation process includes installing the binaries and the means to generate a data cluster. Package installation should include both the server and client packages.
target: postgres
level: 1
severity: medium
tags:
- postgres
- database
- packages
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 1.1 Ensure packages are obtained from authorized repositories
audit:
  type: manual
  command: 'List enabled package repositories (RHEL: dnf repolist all | grep -E ''enabled$''; Debian/Ubuntu: apt-cache policy) and confirm each is organization-approved (e.g. vendor OS repos or the PGDG repository). Inspect installed PostgreSQL packages (rpm -qa | grep postgres or dpkg -l | grep postgres) and confirm they come from those sources. Any unapproved repository is a fail.'
remediation:
  type: iac_patch
  command: Disable or remove unapproved repositories and reinstall PostgreSQL packages from an authorized source (OS vendor or PGDG).
