id: TMA-POSTGRES-3.1.9
title: Ensure the maximum log file size is set correctly
description: The log_rotation_size setting determines the maximum size of an individual log file. Once the maximum size is reached, automatic log file rotation will occur.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- logging
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 3.1.9 Ensure the maximum log file size is set correctly
audit:
  type: manual
  command: Run SHOW log_rotation_size; (default 0, size-based rotation disabled) and confirm the value matches your logging policy.
remediation:
  type: iac_patch
  command: ALTER SYSTEM SET log_rotation_size = '1GB'; (example) then SELECT pg_reload_conf();
