id: TMA-POSTGRES-3.1.13
title: Ensure the program name for PostgreSQL syslog messages is correct
description: The syslog_ident setting specifies the program name used to identify PostgreSQL messages in syslog logs. An example of a possible program name is postgres.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- logging
- syslog
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 3.1.13 Ensure the program name for PostgreSQL syslog messages is correct
audit:
  type: manual
  command: If logging to syslog, run SHOW syslog_ident; (default postgres) and confirm the program name matches your logging policy so messages from this cluster can be identified.
remediation:
  type: iac_patch
  command: ALTER SYSTEM SET syslog_ident = 'proddb'; (example) then SELECT pg_reload_conf();
