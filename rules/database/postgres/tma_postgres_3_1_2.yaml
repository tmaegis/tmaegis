id: TMA-POSTGRES-3.1.2
title: Ensure the log destinations are set correctly
description: PostgreSQL supports several methods for logging server messages, including stderr, csvlog, syslog, and jsonlog. On Windows, eventlog is also supported. One or more of these destinations should be set for server log output.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- logging
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 3.1.2 Ensure the log destinations are set correctly
audit:
  type: manual
  command: Run SHOW log_destination; (default stderr) and confirm it contains every destination required by your logging policy (stderr, csvlog, jsonlog, syslog, eventlog). Missing required destinations are a fail.
remediation:
  type: iac_patch
  command: ALTER SYSTEM SET log_destination = 'csvlog'; (or a comma-separated list such as 'csvlog, syslog') then SELECT pg_reload_conf();
