id: TMA-POSTGRES-6.11
title: Ensure the pgcrypto extension is installed and configured correctly
description: PostgreSQL must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of organization-defined information at rest (to include, at a minimum, PII and classified information) on organization-defined information system components.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- crypto
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.11 Ensure the pgcrypto extension is installed and configured correctly
audit:
  type: manual
  command: Run SELECT * FROM pg_available_extensions WHERE name = 'pgcrypto'; If data requires encryption and pgcrypto is not available/installed (installed_version empty), this is a fail. If disk or filesystem encryption is required, have the owners demonstrate it.
remediation:
  type: iac_patch
  command: Install the contrib package if needed and run CREATE EXTENSION pgcrypto; in the databases that store data requiring column-level encryption; keep keys outside the database.
