id: TMA-POSTGRES-1.2
title: Install only required packages
description: 'Depending on the distribution, several other packages next to the mandatory postgresql might have been installed upon a system. Typical add-on packages are: ; postgresql-doc: PostgreSQL documentation. ; phppgadmin: PostgreSQL web-based administration tool. ; ...'
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- packages
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 1.2 Install only required packages
audit:
  type: manual
  command: List installed PostgreSQL packages (rpm -qa | grep -i postgres or dpkg -l | grep -i postgres) and compare with apt search postgresql / dnf search postgresql. Only packages required for this server's role (server, client, needed contrib/extensions) should be installed; anything unneeded is a finding.
remediation:
  type: iac_patch
  command: Remove PostgreSQL packages and extensions not required for the server role with the OS package manager (dnf remove / apt remove).
