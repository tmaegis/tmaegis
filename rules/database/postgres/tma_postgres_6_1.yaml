id: TMA-POSTGRES-6.1
title: Understanding attack vectors and runtime parameters
description: Understanding the vulnerability of PostgreSQL runtime parameters by the particular delivery method, or attack vector.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- configuration
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.1 Understanding attack vectors and runtime parameters
audit:
  type: manual
  command: Review all configuration settings (SELECT name, setting, source, context FROM pg_settings ORDER BY context, name;) and the files postgresql.conf, postgresql.auto.conf and pg_hba.conf, and confirm logging records all modifications and changes to the RDBMS.
remediation:
  type: iac_patch
  command: Keep configuration files under change control, restrict who can write them (postgres only), and enable logging/auditing (3.1.x, 3.2) so parameter changes are recorded.
