id: TMA-POSTGRES-6.5
title: Ensure 'Superuser' Runtime Parameters are Configured
description: PostgreSQL runtime parameters that can only be executed by the server's superuser, postgres.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- configuration
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.5 Ensure 'Superuser' Runtime Parameters are Configured
audit:
  type: manual
  command: Run SELECT name, setting FROM pg_settings WHERE context = 'superuser' ORDER BY 1; and compare with your approved baseline; also check per-role/database overrides (SELECT * FROM pg_db_role_setting;). Any unexpected value is a fail.
remediation:
  type: iac_patch
  command: Restore approved values in the configuration files (reload), and remove unwanted overrides with ALTER ROLE/ALTER DATABASE ... RESET <parameter>;
