id: TMA-POSTGRES-4.10
title: Ensure all accounts that can log in have passwords
description: If not using certificate-based authentication, all database accounts that have the ability to login should have a password set.
target: postgres
level: 1
severity: high
tags:
- postgres
- database
- authentication
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 4.10 Ensure all accounts that can log in have passwords
audit:
  type: manual
  command: Run SELECT rolname FROM pg_authid WHERE rolpassword IS NULL AND rolcanlogin; Any returned account that is not known to authenticate with certificates (or peer/GSS) is a potential fail.
remediation:
  type: iac_patch
  command: Set a password for each listed account with \password <user> in psql (ALTER ROLE ... PASSWORD writes the password to logs), or switch it to certificate authentication.
