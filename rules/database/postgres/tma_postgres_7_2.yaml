id: TMA-POSTGRES-7.2
title: Ensure logging of replication commands is configured
description: Enabling the log_replication_commands setting causes each attempted replication from the server to be logged.
target: postgres
level: 1
severity: low
tags:
- postgres
- database
- replication
- logging
- manual
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 7.2 Ensure logging of replication commands is configured
audit:
  type: manual
  command: Run SHOW log_replication_commands; If replication is used and the value is off, replication commands are not logged and this is a fail.
remediation:
  type: iac_patch
  command: ALTER SYSTEM SET log_replication_commands = 'on'; SELECT pg_reload_conf();
