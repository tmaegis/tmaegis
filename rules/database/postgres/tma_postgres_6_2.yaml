id: TMA-POSTGRES-6.2
title: Ensure 'backend' runtime parameters are configured correctly
description: In order to serve multiple clients efficiently, the PostgreSQL server launches a new "backend" process for each client. The runtime parameters in this benchmark section are controlled by the backend process. Checks the benchmark's expected backend values ignore_system_indexes=off, jit_debugging_support=off, jit_profiling_support=off and post_auth_delay=0 (log_connections/log_disconnections are 3.1.20/3.1.21). Runs psql as ${PGUSER:-postgres} against ${PGDATABASE:-postgres}; set PGHOST/PGPORT and use ~/.pgpass (not PGPASSWORD, see 1.6/1.7) when peer authentication is not available.
target: postgres
level: 1
severity: medium
tags:
- postgres
- database
- configuration
reference: CIS PostgreSQL 18 Benchmark v1.0.0 - 6.2 Ensure 'backend' runtime parameters are configured correctly
audit:
  type: sql_query
  command: out=$(psql -X -U "${PGUSER:-postgres}" -d "${PGDATABASE:-postgres}" -tAc "SELECT CASE WHEN (SELECT count(*) FROM pg_settings WHERE (name, setting) IN (('ignore_system_indexes','off'),('jit_debugging_support','off'),('jit_profiling_support','off'),('post_auth_delay','0'))) = 4 THEN 'compliant' ELSE 'noncompliant' END" 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v psql >/dev/null 2>&1 || exit 0
    psql -X -U "${PGUSER:-postgres}" -d "${PGDATABASE:-postgres}" -c "ALTER SYSTEM SET ignore_system_indexes = off" -c "ALTER SYSTEM SET jit_debugging_support = off" -c "ALTER SYSTEM SET jit_profiling_support = off" -c "ALTER SYSTEM SET post_auth_delay = 0" -c "SELECT pg_reload_conf()"
  guidance: "Correct unauthorized backend parameters in postgresql.conf/postgresql.auto.conf (or the pg_ctl command line / $PGDATA/postmaster.opts) and restart PostgreSQL; compare SELECT name, setting FROM pg_settings WHERE context IN ('backend','superuser-backend') with your baseline."
