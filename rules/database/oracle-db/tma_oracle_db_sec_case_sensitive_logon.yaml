id: TMA-ORACLE-SEC-CASE-SENSITIVE-LOGON
title: Ensure 'SEC_CASE_SENSITIVE_LOGON' is set to TRUE
description: Case-sensitive passwords greatly enlarge the password search space. The parameter is deprecated in newer releases where passwords are always case sensitive; a missing parameter is treated as TRUE. Run on the database host as the Oracle software owner with ORACLE_HOME, ORACLE_SID and PATH set; connects with 'sqlplus -S / as sysdba' (OS authentication).
target: oracle-db
level: 1
severity: medium
tags:
- oracle-db
- database
- oracle
- authentication
- password-policy
reference: CIS Oracle Database 19c Benchmark v2.0.0 - 2.3.15 Ensure 'SEC_CASE_SENSITIVE_LOGON' Is Set to 'TRUE' (not in the 23ai v1.1.0 benchmark; the parameter is desupported there)
audit:
  type: sql_query
  command: |
    out=$(sqlplus -S -L / as sysdba 2>/dev/null <<'EOF'
    whenever sqlerror exit failure
    set heading off feedback off pagesize 0 verify off echo off trimspool on
    select nvl((select upper(value) from v$parameter where name = 'sec_case_sensitive_logon'), 'TRUE') from dual;
    exit
    EOF
    ) || exit 1
    printf '%s\n' "$out"
  expected_output: 'TRUE'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v sqlplus >/dev/null 2>&1 || exit 0
    sqlplus -S -L / as sysdba <<'EOF'
    whenever sqlerror exit failure
    ALTER SYSTEM SET SEC_CASE_SENSITIVE_LOGON = TRUE SCOPE = BOTH;
    exit
    EOF
  guidance: "ALTER SYSTEM SET SEC_CASE_SENSITIVE_LOGON = TRUE SCOPE = BOTH; (check SQLNET.ALLOWED_LOGON_VERSION_SERVER first)"
