id: TMA-ORACLE-DB-6.6.1
title: Ensure Proxy User Privileges Are Revoked from Unauthorized 'GRANTEE'
description: Oracle Database supports proxy user authentication, which allows a client user to connect to the database as a proxy user.
target: oracle-db
level: 1
severity: medium
tags:
- oracle-db
- database
- oracle
- manual
reference: CIS Oracle Database 23ai Benchmark v1.1.0 - 6.6.1 Ensure Proxy User Privileges Are Revoked from Unauthorized 'GRANTEE'
audit:
  type: manual
  command: SELECT CON_ID_TO_CON_NAME(J.CON_ID) AS CONTAINERNAME,J.* FROM CDB_PROXIES J If any unauthorized users are granted proxy user privileges, this is a fail.
remediation:
  type: iac_patch
  command: To remediate this recommendation, execute the following SQL statement. ALTER USER <CLIENT_USER> REVOKE CONNECT THROUGH <PROXY_USER>;
