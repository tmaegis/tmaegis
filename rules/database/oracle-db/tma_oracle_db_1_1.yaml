id: TMA-ORACLE-DB-1.1
title: Ensure That Appropriate Version/Patches For Oracle Software Are Installed
description: The Oracle installation version and patches should be the most recent that are compatible with the organization's operational needs.
target: oracle-db
level: 1
severity: high
tags:
- oracle-db
- database
- oracle
- manual
reference: CIS Oracle Database 23ai Benchmark v1.1.0 - 1.1 Ensure That Appropriate Version/Patches For Oracle Software Are Installed
audit:
  type: manual
  command: 'To assess this recommendation, use the following example shell command as appropriate for your environment. For example, on Linux systems: opatch lsinventory | grep -e "^.*<latest_patch_version_number>\s*.*$" For example, on Windows systems: opatch lsinventory | find "<latest_patch_version_number>"'
remediation:
  type: iac_patch
  command: Download and apply the latest quarterly Critical Patch Update patches.
