id: TMA-ORACLE-DB-3.8
title: Ensure 'INACTIVE_ACCOUNT_TIME' Is Less than or Equal to '120'
description: 'The INACTIVE_ACCOUNT_TIME parameter in Oracle specifies the number of days an account can remain inactive before it is automatically locked. This setting helps mitigate security risks by reducing the exposure of unused accounts, which could be exploited for unauthorized access. UNLIMITED counts as 9999 and fails. Default: The default value may vary based on Oracle versions and configurations. Run on the database host as the Oracle software owner with ORACLE_HOME, ORACLE_SID and PATH set; connects to the CDB root with ''sqlplus -S / as sysdba'' (OS authentication) so CDB_/GV$ views cover all open PDBs.'
target: oracle-db
level: 1
severity: medium
tags:
- oracle-db
- database
- oracle
- password-policy
reference: CIS Oracle Database 23ai Benchmark v1.1.0 - 3.8 Ensure 'INACTIVE_ACCOUNT_TIME' Is Less than or Equal to '120'
audit:
  type: sql_query
  command: |
    out=$(sqlplus -S -L / as sysdba 2>/dev/null <<'EOF'
    whenever sqlerror exit failure
    set heading off feedback off pagesize 0 verify off echo off trimspool on define off
    select count(*) from (
      select p.con_id, p.profile, to_number(decode(p.limit, 'DEFAULT',
        (select decode(d.limit, 'UNLIMITED', '9999', d.limit) from cdb_profiles d
          where d.profile = 'DEFAULT' and d.resource_name = p.resource_name and d.con_id = p.con_id),
        'UNLIMITED', '9999', p.limit)) lim
      from cdb_profiles p where p.resource_name = 'INACTIVE_ACCOUNT_TIME'
    ) where lim > 120;
    exit
    EOF
    ) || exit 1
    printf '%s\n' "$out"
  expected_output: '0'
remediation:
  type: iac_patch
  command: Remediate this setting by executing the following SQL statement for each PROFILE returned by the audit procedure. ALTER PROFILE DEFAULT LIMIT INACTIVE_ACCOUNT_TIME 120
