id: TMA-ORACLE-DB-2.1.3
title: Ensure 'ACCEPT_SHA1_CERTS' Is Configured Correctly
description: 'The setting ACCEPT_SHA1_CERTS specifies whether Oracle accepts certificates signed with the SHA1 algorithm. Note: See Additional Information regarding the deprecation of this setting. Fails when an uncommented ACCEPT_SHA1_CERTS = TRUE line is present in listener.ora. Default: The default value for ACCEPT_SHA1_CERTS is FALSE. Reads the file from $TNS_ADMIN, or $ORACLE_HOME/network/admin when TNS_ADMIN is unset (Linux/UNIX hosts); fails when neither directory exists.'
target: oracle-db
level: 1
severity: medium
tags:
- oracle-db
- database
- oracle
- network
- tls
reference: CIS Oracle Database 23ai Benchmark v1.1.0 - 2.1.3 Ensure 'ACCEPT_SHA1_CERTS' Is Configured Correctly
audit:
  type: command
  command: 'd="${TNS_ADMIN:-${ORACLE_HOME:?ORACLE_HOME not set}/network/admin}"; [ -d "$d" ] || { echo "missing $d"; exit 1; }; f="$d/listener.ora"; [ -f "$f" ] || { echo compliant; exit 0; }; n=$(grep -Eic ''^[^#]*ACCEPT_SHA1_CERTS[[:space:]]*=[[:space:]]*TRUE[[:space:]]*$'' "$f"); [ "$n" = 0 ] && echo compliant || echo "noncompliant: TRUE set in $f"'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    d="${TNS_ADMIN:-${ORACLE_HOME:?ORACLE_HOME not set}/network/admin}"
    [ -d "$d" ] || exit 1
    for n in sqlnet.ora listener.ora; do f="$d/$n"; [ -f "$f" ] || { [ "$n" = sqlnet.ora ] && : > "$f" || continue; }
      cp -p "$f" "$f.tmaegis.bak"
      { grep -viE '^[[:space:]]*ACCEPT_SHA1_CERTS[[:space:]]*=' "$f.tmaegis.bak"; echo 'ACCEPT_SHA1_CERTS=FALSE'; } > "$f.tma.new" && cat "$f.tma.new" > "$f"; rm -f "$f.tma.new"
    done; true
  guidance: "To remediate this recommendation, remove ACCEPT_SHA1_CERTS from listener.ora, or set the ACCEPT_SHA1_CERTS to the value FALSE. In addition to listener.ora, this parameter must also be set to FALSE in sqlnet.ora."
