id: TMA-ORACLE-DB-5.4
title: Ensure All Export Activities Are Audited
description: 'Auditing all export activities in Oracle is crucial for several security and compliance reasons such as data leakage prevention, accountability and traceability as well as compliance with regulations. Default: Export datapump activities are not audited by default. Run on the database host as the Oracle software owner with ORACLE_HOME, ORACLE_SID and PATH set; connects to the CDB root with ''sqlplus -S / as sysdba'' (OS authentication) so CDB_/GV$ views cover all open PDBs.'
target: oracle-db
level: 1
severity: medium
tags:
- oracle-db
- database
- oracle
- logging
- audit
reference: CIS Oracle Database 23ai Benchmark v1.1.0 - 5.4 Ensure All Export Activities Are Audited
audit:
  type: sql_query
  command: |
    out=$(sqlplus -S -L / as sysdba 2>/dev/null <<'EOF'
    whenever sqlerror exit failure
    set heading off feedback off pagesize 0 verify off echo off trimspool on define off
    with cis_audit(con_id, audit_option) as (select c.con_id, 'EXPORT' from v$containers c where c.open_mode = 'READ WRITE'),
    audit_enabled as (
      select distinct aud.con_id, aud.audit_option from containers(audit_unified_policies) aud
      where aud.audit_option in ('EXPORT') and aud.audit_option_type = 'DATAPUMP ACTION'
      and exists (select 1 from containers(audit_unified_enabled_policies) e
        where e.success = 'YES' and e.failure = 'YES' and e.enabled_option = 'BY USER' and e.entity_name = 'ALL USERS'
        and e.policy_name = aud.policy_name and e.con_id = aud.con_id)
    )
    select count(*) from cis_audit c
    where not exists (select 1 from audit_enabled e where e.audit_option = c.audit_option and e.con_id = c.con_id);
    exit
    EOF
    ) || exit 1
    printf '%s\n' "$out"
  expected_output: '0'
remediation:
  type: iac_patch
  command: 'Execute the following SQL statement in the CDB and in each PDB to remediate this recommendation: ALTER AUDIT POLICY CIS_CDB_EXPORT ADD ACTIONS COMPONENT=datapump EXPORT; Note: If you do not have CIS_CDB_EXPORT, please create one using the CREATE AUDIT POLICY statement. Refer to Section 8.4 where a PL/SQL block is provided to help create or modify the audit policy to remediate this item in both container and pluggable database.'
