id: TMA-MONGODB-1.1
title: Ensure the appropriate MongoDB software version/patches are installed
description: 'The MongoDB installation version, along with the patch level, should be the most recent that is compatible with the organization''s operational needs. In addition, regularly view latest minor security patch updates for security vulnerability fixes (CVE Related) from MongoDB website: https://www.mongodb.com/alerts'
target: mongodb
level: 1
severity: medium
tags:
- mongodb
- patching
reference: CIS MongoDB 8 Benchmark v2.0.0 - 1.1 Ensure the appropriate MongoDB software version/patches are installed
audit:
  type: manual
  command: 'Run mongod --version (Windows: mongod.exe --version) and db.version() in mongosh. Compare the running release with the MongoDB supported-versions and security-advisory pages; the version must be supported and carry the latest patch release your organisation has approved.'
remediation:
  type: iac_patch
  command: 'Upgrade to the latest version of the MongoDB software: 1. Backup the data set. 2. Download the binaries for the latest MongoDB revision from the MongoDB Download Page and store the binaries in a temporary location. The binaries download as compressed files that extract to the directory structure used by the MongoDB installation. 3. Shutdown the MongoDB instance. 4. Replace the existing MongoDB binaries with the downloaded binaries. 5.'
