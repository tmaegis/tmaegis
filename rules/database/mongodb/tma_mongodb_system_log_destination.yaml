id: TMA-MONGO-SYSTEM-LOG-DESTINATION
title: Ensure system activity is logged to a file or syslog
description: systemLog.destination file or syslog keeps server logs persistently instead of only on stdout. Checks the YAML config file /etc/mongod.conf (SKIP when it does not exist).
target: mongodb
level: 1
severity: medium
tags:
- mongodb
- database
- logging
reference: CIS MongoDB Benchmark - Audit Logging / System Log (verify section number for your release)
audit:
  type: file_regex
  file_path: /etc/mongod.conf
  pattern: (?m)^systemLog:[ \t]*\n(?:[ \t]*(?:#[^\n]*)?\n|[ \t]+[^\n]*\n)*?[ \t]+destination:[ \t]*['\x22]?(?:file|syslog)\b
  requires_file:
  - /etc/mongod.conf
remediation:
  type: iac_patch
  command: 'Set systemLog.destination: file and systemLog.path: /var/log/mongodb/mongod.log in /etc/mongod.conf and restart mongod'
