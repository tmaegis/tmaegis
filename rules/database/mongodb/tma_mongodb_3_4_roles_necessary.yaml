id: TMA-MONGODB-3.4
title: Ensure that each role for each MongoDB database is needed and grants only the necessary privileges
description: Reviewing all roles periodically and eliminating unneeded roles as well as unneeded privileges from necessary roles helps minimize the privileges that each user has.
target: mongodb
level: 1
severity: medium
tags:
- mongodb
- privileges
reference: CIS MongoDB 8 Benchmark v2.0.0 - 3.4 Ensure that each role for each MongoDB database is needed and grants only the necessary privileges
audit:
  type: manual
  command: 'Perform the following command to view all roles on the database on which the command runs, including both built-in and user-defined roles, as well as the privileges granted by each role. Ensure that only necessary roles are listed and only the necessary privileges are listed for each role. db.runCommand( { rolesInfo: 1, showPrivileges: true, showBuiltinRoles: true } )'
remediation:
  type: iac_patch
  command: 'To revoke specified privileges from the user-defined role on the database where the command is run. The revokePrivilegesFromRole command has the following syntax: { revokePrivilegesFromRole: "\<role\>", privileges:  [  { resource: { \<resource\> }, actions: [ "\<action\>", ... ] },  ...  ], }'
