id: TMA-MONGODB-2.2
title: Ensure that MongoDB does not bypass authentication via the localhost exception
description: MongoDB should not be set to bypass authentication via the localhost exception. The localhost exception allows the user to enable authorization before creating the first user in the system. When active, the localhost exception allows all connections from the localhost interface to have full access to that instance. The exception applies only when there are no users created in the MongoDB instance. Checks the YAML config file /etc/mongod.conf (SKIP when it does not exist). The localhost exception is enabled by default, so the setting must be present and false.
target: mongodb
level: 1
severity: high
tags:
- mongodb
- authentication
reference: CIS MongoDB 8 Benchmark v2.0.0 - 2.2 Ensure that MongoDB does not bypass authentication via the localhost exception
audit:
  type: file_regex
  file_path: /etc/mongod.conf
  pattern: (?m)^[ \t]*enableLocalhostAuthBypass:[ \t]*['\x22]?(?:false|0)\b
  requires_file:
  - /etc/mongod.conf
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    f=/etc/mongod.conf
    [ -f "$f" ] || exit 0
    cp -p "$f" "$f.tmaegis.bak"
    sec=setParameter; key=enableLocalhostAuthBypass; val=false
    awk -v sec="$sec" -v key="$key" -v val="$val" '
      function flush() { if (insec && !done) { print "  " key ": " val; done = 1 } }
      /^[^ \t#][^:]*:/ { flush(); insec = ($0 ~ "^" sec ":[ \t]*(#.*)?$"); if (insec) seen = 1; print; next }
      insec && $0 ~ "^[ \t]+" key ":" { if (!done) { print "  " key ": " val; done = 1 } ; next }
      { print }
      END { flush(); if (!seen) { print sec ":"; print "  " key ": " val } }' "$f.tmaegis.bak" > "$f.tma.new" && cat "$f.tma.new" > "$f"
    rm -f "$f.tma.new"
    echo "restart mongod for the change to take effect"; true
  guidance: "Add 'setParameter: {enableLocalhostAuthBypass: false}' to /etc/mongod.conf (or start mongod with --setParameter enableLocalhostAuthBypass=0) and restart mongod."
