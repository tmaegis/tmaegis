id: TMA-MONGODB-3.2
title: Ensure that role-based access control is enabled and configured appropriately
description: Role-based access control (RBAC) is a method of regulating access to resources based on the roles of individual users within an enterprise. A user is granted one or more roles that determine the user's access to database resources and operations. Outside of role assignments, the user has no access to the system. MongoDB can use RBAC to govern access to MongoDB systems.
target: mongodb
level: 1
severity: medium
tags:
- mongodb
- privileges
reference: CIS MongoDB 8 Benchmark v2.0.0 - 3.2 Ensure that role-based access control is enabled and configured appropriately
audit:
  type: manual
  command: 'Connect with mongosh as the user administrator and list users and roles (db.getUsers(), db.getRoles({showPrivileges: true}) in each database). Verify every user is assigned only the roles it needs and that privileges are granted through roles rather than individually.'
remediation:
  type: iac_patch
  command: 1. Establish roles for MongoDB. 2. Assign the appropriate privileges to each role. 3. Assign the appropriate users to each role. 4. Remove any individual privileges assigned to users that are now addressed by the roles. 5. See the reference below for more Information.
