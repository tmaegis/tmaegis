id: TMA-MONGODB-6.2
title: Ensure that operating system resource limits are set for MongoDB
description: Operating systems provide ways to limit and control the usage of system resources such as threads, files, and network connections on a per-process and per-user basis
target: mongodb
level: 2
severity: low
tags:
- mongodb
- operations
reference: CIS MongoDB 8 Benchmark v2.0.0 - 6.2 Ensure that operating system resource limits are set for MongoDB
audit:
  type: manual
  command: 'To verify the resource limits set for MongoDB, run the following commands. Extract the process ID for MongoDB: ps -ef | grep mongod View the limits associated with that process number: cat /proc/1322/limits'
remediation:
  type: iac_patch
  command: 'Every deployment may have unique requirements and settings. Recommended thresholds and settings are particularly important for MongoDB deployments: - f (file size): unlimited - t (cpu time): unlimited - v (virtual memory): unlimited [1] - n (open files): 64000 - m (memory size): unlimited [1] [2] - u (processes/threads): 64000 Restart the mongod and mongos instances after changing the ulimit settings to ensure that the changes take effect.'
