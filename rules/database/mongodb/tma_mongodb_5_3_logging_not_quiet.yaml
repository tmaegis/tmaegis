id: TMA-MONGODB-5.3
title: Ensure that logging captures as much information as possible
description: 'The SystemLog.quiet option stops logging of information such as: - connection events - authentication events - replication sync activities - evidence of some potentially impactful commands being run (eg: drop, dropIndexes, validate) This information should be logged whenever possible. This check is only for Enterprise editions. Checks the YAML config file /etc/mongod.conf (SKIP when it does not exist). Passes when systemLog.quiet is absent or false.'
target: mongodb
level: 2
severity: low
tags:
- mongodb
- logging
reference: CIS MongoDB 8 Benchmark v2.0.0 - 5.3 Ensure that logging captures as much information as possible
audit:
  type: file_regex
  file_path: /etc/mongod.conf
  pattern: (?m)^[ \t]*quiet:[ \t]*['\x22]?true\b
  must_not_match: true
  requires_file:
  - /etc/mongod.conf
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    f=/etc/mongod.conf
    [ -f "$f" ] || exit 0
    cp -p "$f" "$f.tmaegis.bak"
    sec=systemLog; key=quiet; val=false
    awk -v sec="$sec" -v key="$key" -v val="$val" '
      function flush() { if (insec && !done) { print "  " key ": " val; done = 1 } }
      /^[^ \t#][^:]*:/ { flush(); insec = ($0 ~ "^" sec ":[ \t]*(#.*)?$"); if (insec) seen = 1; print; next }
      insec && $0 ~ "^[ \t]+" key ":" { if (!done) { print "  " key ": " val; done = 1 } ; next }
      { print }
      END { flush(); if (!seen) { print sec ":"; print "  " key ": " val } }' "$f.tmaegis.bak" > "$f.tma.new" && cat "$f.tma.new" > "$f"
    rm -f "$f.tma.new"
    echo "restart mongod for the change to take effect"; true
  guidance: "Set systemLog.quiet: false (or remove the quiet setting) in /etc/mongod.conf and restart mongod."
