id: TMA-MONGO-CONFIG-PERMISSIONS
title: Ensure /etc/mongod.conf is not writable by group or readable by others
description: The configuration file can reference key files and TLS settings; it should be mode 640 or stricter. SKIP when the file does not exist.
target: mongodb
level: 1
severity: medium
tags:
- mongodb
- database
- permissions
- filesystem
reference: CIS MongoDB Benchmark - File Permissions / Configuration File (verify section number for your release)
audit:
  type: command
  command: p=$(stat -c %a /etc/mongod.conf 2>/dev/null) || exit 1; if [ $((0$p & 037)) -eq 0 ]; then echo compliant; else echo "mode $p"; fi
  expected_output: compliant
  requires_file:
  - /etc/mongod.conf
remediation:
  type: command
  command: chmod 640 /etc/mongod.conf
