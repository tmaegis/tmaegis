id: TMA-CASSANDRA-1.5
title: Ensure the Cassandra service is run as a non-root user
description: Though Cassandra database may be run as root, it should run as another non-root user. FAILs when no CassandraDaemon process is running.
target: cassandra
level: 1
severity: high
tags:
- cassandra
- service-account
reference: CIS Apache Cassandra 5.0 Benchmark v1.1.0 - 1.5 Ensure the Cassandra service is run as a non-root user
audit:
  type: command
  command: out=$(ps -eo user=,args= | grep '[C]assandraDaemon') || exit 1; printf '%s\n' "$out" | awk '$1 == "root" {n++} END {print n+0}'
  expected_output: '0'
remediation:
  type: iac_patch
  command: Create a dedicated cassandra system user, chown the data, commitlog, saved_caches and log directories to it and start the service with User=cassandra.
