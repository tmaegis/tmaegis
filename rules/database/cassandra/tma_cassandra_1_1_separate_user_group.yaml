id: TMA-CASSANDRA-1.1
title: Ensure a separate user and group exist for Cassandra
description: Create separate userid and group for Cassandra. The benchmark rates this recommendation Manual; the automated check covers its objective pass criterion. Passes when the cassandra group and user exist and the user is a member (primary or supplementary) of the group.
target: cassandra
level: 1
severity: medium
tags:
- cassandra
- service-account
reference: CIS Apache Cassandra 5.0 Benchmark v1.1.0 - 1.1 Ensure a separate user and group exist for Cassandra
audit:
  type: command
  command: 'g=$(getent group cassandra) || exit 1; u=$(getent passwd cassandra) || exit 1; gid=$(printf ''%s'' "$g" | cut -d: -f3); ugid=$(printf ''%s'' "$u" | cut -d: -f4); members=$(printf ''%s'' "$g" | cut -d: -f4); if [ "$gid" = "$ugid" ] || printf ''%s'' ",$members," | grep -q '',cassandra,''; then echo compliant; else echo ''user not in group''; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: groupadd cassandra; useradd -m -d /home/cassandra -s /bin/bash -g cassandra -u <UID> cassandra (use an unused UID).
