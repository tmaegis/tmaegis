id: TMA-CASSANDRA-1.3
title: Ensure the latest version of Python is installed
description: 'A prerequisite to installing Cassandra is the installation of Python. The version of Python installed should be the most recent that is compatible with the organizations'' operational needs. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: cassandra
level: 1
severity: low
tags:
- cassandra
- patching
reference: CIS Apache Cassandra 5.0 Benchmark v1.1.0 - 1.3 Ensure the latest version of Python is installed
audit:
  type: manual
  command: Run python3 --version (or python -V) on hosts that use cqlsh. An old or unsupported Python release is a finding; cqlsh requires a currently supported Python 3 release.
remediation:
  type: iac_patch
  command: '1. Uninstall the old/unsupported version of Python, if present. 2. Download the latest compatible release of the Python: https://www.python.org/downloads/ 3. Follow the provided installation instructions to complete the install.'
