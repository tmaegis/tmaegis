id: TMA-CASSANDRA-3.3
title: Ensure there are no unnecessary roles or excessive privileges
description: Verify each role is require and has only the privileges needed to do its job.
target: cassandra
level: 1
severity: medium
tags:
- cassandra
- privileges
reference: CIS Apache Cassandra 5.0 Benchmark v1.1.0 - 3.3 Ensure there are no unnecessary roles or excessive privileges
audit:
  type: manual
  command: 'As a superuser, retrieve all roles: list roles; Retrieve all permissions for all roles select * from system_auth.role_permissions; If there are any unnecessary roles or roles with excessive privileges this is a finding.'
remediation:
  type: iac_patch
  command: Remove any unnecessary roles and/or permissions in accordance with organizational needs.
