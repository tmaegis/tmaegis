id: TMA-CASSANDRA-1.2
title: Ensure the latest version of Java is installed
description: 'A prerequisite to installing Cassandra is the installation of Java. The version of Java installed should be the most recent that is compatible with the organization''s operational needs. Assessed manually here: the benchmark check is environment-specific and cannot be evaluated reliably by a single command.'
target: cassandra
level: 1
severity: medium
tags:
- cassandra
- patching
reference: CIS Apache Cassandra 5.0 Benchmark v1.1.0 - 1.2 Ensure the latest version of Java is installed
audit:
  type: manual
  command: Run java -version on every node. The JDK/JRE must be a supported, fully patched release of a Java version supported by your Cassandra release (Cassandra 5.0 supports Java 11 and 17). An old or unsupported Java version is a finding.
remediation:
  type: iac_patch
  command: 1. Uninstall the old/unsupported version of Java, if present. 2. Download the latest compatible release of the Java JDK, or OpenJDK. 3. Follow the provided installation instructions to complete the install.
