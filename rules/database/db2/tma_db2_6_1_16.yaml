id: TMA-DB2-6.1.16
title: Secure QUIESCECONNECT Authority
description: The QUIESCECONNECT role grants the authority to a user to access a database even in the quiesced state.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.16 Secure QUIESCECONNECT Authority
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where quiesceconnectauth = ''Y'' 3. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE QUIESCE_CONNECT ON DATABASE FROM USER <username>'
