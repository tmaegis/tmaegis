id: TMA-DB2-9.3
title: Protecting Backups
description: Backups of your database should be stored securely in a location with full access for administrators, read and execute access for group, and no access for users.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 9.3 Protecting Backups
audit:
  type: manual
  command: Review the privileges applied to your backups.
remediation:
  type: iac_patch
  command: Define a security policy for all backups that specifies the privileges they should be assigned.
