id: TMA-DB2-6.2.2
title: Review Roles
description: Roles provide several advantages that make it easier to manage privileges in a database system. Security administrators can control access to their databases in a way that mirrors the structure of their organizations (they can create roles in the database that map directly to the job functions in their organizations). The assignment of privileges is simplified. Instead of granting the same ...
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.2.2 Review Roles
audit:
  type: manual
  command: '1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following and review the results to determine if each role name still has a business requirement to access the data: db2 => select rolename from syscat.roleauth where grantortype <> ''S'' group by rolename'
remediation:
  type: iac_patch
  command: 'To remove a role from the database: 1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following: db2 => drop role <role name>'
