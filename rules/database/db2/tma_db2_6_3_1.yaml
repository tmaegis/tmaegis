id: TMA-DB2-6.3.1
title: Review Organization's Policies Against Db2 RCAC Policies
description: 'DB2 Row and Column Access Control (RCAC) Policies control access to Db2 tables. They should match the organization''s security and database access policies, and they should be regularly reviewed for gaps. Default: Not installed'
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.3.1 Review Organization's Policies Against Db2 RCAC Policies
audit:
  type: manual
  command: Schedule and complete a regular review of all organization security and data access database policies against the current Db2 policies to determine if gaps exist. 1. Identify each written organization policy. 2. Find the matching Db2 RCAC policy. 3. Determine if the RCAC policy applies and correctly supports the written policy. 4. If no matching Db2 RCAC policy is found, record a 'gap' for future remediation.
remediation:
  type: iac_patch
  command: 1. Create RCAC policies for each 'gap' listed from the Audit procedure. 2. Review the newly created Db2 RCAC policy against the organization's written policies.
