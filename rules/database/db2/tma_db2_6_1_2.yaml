id: TMA-DB2-6.1.2
title: Secure SYSCTRL Authority
description: 'The sysctrl_group parameter defines the system administrator group with system control (SYSCTRL) authority. It is recommended that the sysctrl_group group contains authorized users only. Default: The default value for sysctrl_group is NULL.'
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.2 Secure SYSCTRL Authority
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the sysctrl_group value in the output and ensure the value is not NULL: SYSCTRL group name (SYSCTRL_GROUP) = DB2CTRL 4. Review the members of the sysctrl_group on the operating system. Linux: cat /etc/group | grep <sysctrl group name> Windows: 1. Run compmgmt.msc 2. Click ''Local Users and Groups'' 3. Double click ''Groups'' 4. Double click the <sysctrl group name> 5. Review group members'
remediation:
  type: iac_patch
  command: 'Define a valid group name for the SYSCTRL group. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update dbm cfg using sysctrl_group <sysctrl group name>'
