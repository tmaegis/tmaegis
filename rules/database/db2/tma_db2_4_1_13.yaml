id: TMA-DB2-4.1.13
title: Specify a Secure Location for External Tables (EXTBL_LOCATION)
description: The EXTBL_LOCATION database configuration parameter provides an allow list of paths that external tables may access for local files, for both reading and writing. It is recommended that this value be set to appropriate paths with the understanding that confidential data may reside in this directory. Specifying appropriate paths is part of an organizations standard operating procedures (SOP).
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.1.13 Specify a Secure Location for External Tables (EXTBL_LOCATION)
audit:
  type: manual
  command: 'Perform the following Db2 commands to determine if a EXTBL_LOCATION is specified: 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => get database configuration 3. Locate the EXTBL_LOCATION value in the output: Allowed paths for external tables (EXTBL_LOCATION) = /home/db2inst1 If the value does not match what has been specified in the SOP, then follow the remediation steps.'
remediation:
  type: iac_patch
  command: 'To specify an external table location, perform the following commands: 1. Connect to the Db2 database db2 => connect to <dbname> 2. Run the following command: db2 => update database configuration using extbl_location <paths>'
