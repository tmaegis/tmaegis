id: TMA-DB2-4.5.2
title: Remove Unused Schemas
description: A schema is a logical grouping of database objects. It is recommended that unused schemas be removed from the database. Marked Automated in the benchmark, but deciding which schemas are unused needs human review.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.5.2 Remove Unused Schemas
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select schemaname from syscat.schemata 3. Review the list of schemas'
remediation:
  type: iac_patch
  command: 'Remove unnecessary schemas. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => drop schema <schema name> restrict'
