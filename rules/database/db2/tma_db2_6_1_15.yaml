id: TMA-DB2-6.1.15
title: Secure EXTERNALROUTINE Authority
description: The EXTERNALROUTINE authority grants a user the privilege to create user-defined functions and procedures in a specific database.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.15 Secure EXTERNALROUTINE Authority
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where externalroutineauth = ''Y'' 3. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: 'Revoke this permission from any unauthorized users. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE CREATE_EXTERNAL_ROUTINE ON DATABASE FROM USER <username>'
