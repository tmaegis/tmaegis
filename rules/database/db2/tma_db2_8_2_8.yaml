id: TMA-DB2-8.2.8
title: Backup Your Password In Case Stash File is Inaccessible or Corrupted
description: If the keystore is inaccessible, there is no way to decrypt the data in the database. Therefore, protecting and backing up the password to the keystore is important to avoid data loss.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.8 Backup Your Password In Case Stash File is Inaccessible or Corrupted
audit:
  type: manual
  command: Store the password in a safe place, like other similar passwords.
remediation:
  type: iac_patch
  command: You may use a password manager to store the password in a secure manner.
