id: TMA-DB2-6.1.3
title: Secure SYSMAINT Authority
description: 'The sysmaint_group parameter defines the system administrator group that possesses the system maintenance (SYSMAINT) authority. It is recommended that the sysmaint_group group contains authorized users only. Default: The default value for sysmaint_group is NULL.'
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.3 Secure SYSMAINT Authority
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the sysmaint_group value in the output and ensure the value is not NULL: SYSMAINT group name (SYSMAINT_GROUP) = DB2MAINT 4. Review the members of the sysmaint_group on the operating system. Linux: cat /etc/group | grep <sysmaint group name> Windows: 1. Run compmgmt.msc 2. Click ''Local Users and Groups'' 3. Double click ''Groups'' 4. Double click the <sysmaint group name> 5. Review group members'
remediation:
  type: iac_patch
  command: 'Define a valid group name for the SYSMAINT group. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration using sysmaint_group <sysmaint group name>'
