id: TMA-DB2-4.2.49
title: Restrict Access to SYSCAT.AUDITEXCEPTIONS
description: The SYSCAT.AUDITEXCEPTIONS view contains audit exceptions that are associated with an object. It is recommended that the PUBLIC role be restricted from accessing this view.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.2.49 Restrict Access to SYSCAT.AUDITEXCEPTIONS
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select grantee from syscat.tabauth where tabschema = ''SYSCAT'' and tabname = ''AUDITEXCEPTIONS'' and grantee = ''PUBLIC'' 3. If the output contains zero rows, then it is considered a Pass. Otherwise, PUBLIC has SELECT privilege and the remediation steps should be followed.'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v db2 >/dev/null 2>&1 || exit 0
    db="${DB2DBDFT:?set DB2DBDFT to the database to audit}"
    db2 connect to "$db" >/dev/null || exit 1
    db2 "REVOKE ALL PRIVILEGES ON TABLE SYSCAT.AUDITEXCEPTIONS FROM PUBLIC"
    rc=$?; db2 connect reset >/dev/null 2>&1; db2 terminate >/dev/null 2>&1; exit $rc
  guidance: "Revoke access from PUBLIC. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE SELECT ON SYSCAT.AUDITEXCEPTIONS FROM PUBLIC"
