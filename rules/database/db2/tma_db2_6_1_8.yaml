id: TMA-DB2-6.1.8
title: Secure DATAACCESS Authority
description: Grants the authority to access data. The DATAACCESS authority allows the grantee to leverage DML level commands i.e. SELECT, INSERT, UPDATE, DELETE, LOAD, and EXECUTE any package or routine. The DATAACCESS authority cannot be granted to PUBLIC.
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.8 Secure DATAACCESS Authority
audit:
  type: manual
  command: '1. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where dataaccessauth = ''Y'' 2. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: Revoke DATAACCESS authority from any unauthorized users. db2 => REVOKE DATAACCESS ON DATABASE FROM USER <username>
