id: TMA-DB2-5.5
title: 'Database Manager Configuration Parameter: TRUST_CLNTAUTH'
description: This database manager configuration parameter is only active when the authentication parameter is set to CLIENT which is not a recommended setting as discussed in the [authentication parameter section](#specify-a-secure-authentication- type-authentication). If the parameter is set to CLIENT, the user ID and password are not needed, but if they are provided, authentication will occur at the ... Passes when the effective connection authentication (SRVCON_AUTH, or AUTHENTICATION when SRVCON_AUTH is NOT_SPECIFIED) is not CLIENT; otherwise TRUST_CLNTAUTH must be SERVER. Run as the instance owner (or with sqllib/db2profile sourced) so the db2 CLP reads this instance's configuration.
target: db2
level: 1
severity: high
tags:
- db2
- database
- authentication
reference: 'CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.5 Database Manager Configuration Parameter: TRUST_CLNTAUTH'
audit:
  type: command
  command: 'out=$(db2 get dbm cfg 2>/dev/null) || exit 1; printf ''%s\n'' "$out" | awk ''{ if (match($0, /\([A-Z0-9_]+\) *=/)) { k = substr($0, RSTART + 1, RLENGTH); sub(/\).*/, "", k); v = $0; sub(/^[^=]*=/, "", v); gsub(/[ \t]/, "", v); c[k] = v } } END { if (((c["SRVCON_AUTH"] == "NOT_SPECIFIED" || c["SRVCON_AUTH"] == "") ? c["AUTHENTICATION"] : c["SRVCON_AUTH"]) != "CLIENT" || c["TRUST_CLNTAUTH"] == "SERVER") print "compliant"; else print "noncompliant: " "SRVCON_AUTH=" c["SRVCON_AUTH"] " AUTHENTICATION=" c["AUTHENTICATION"] " TRUST_CLNTAUTH=" c["TRUST_CLNTAUTH"] }'''
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v db2 >/dev/null 2>&1 || exit 0
    db2 update dbm cfg using TRUST_CLNTAUTH SERVER
  guidance: "1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration parameter using trust_clntauth SERVER 3. Restart the Db2 instance. db2 => db2stop db2 => db2start"
