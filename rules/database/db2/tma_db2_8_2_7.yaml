id: TMA-DB2-8.2.7
title: Backup Your Keystore
description: The keystore stores encryption keys used to encrypt your database. Losing the key will make the data inaccessible. If the keystore with encryption keys is lost, there is no way to decrypt the data.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.7 Backup Your Keystore
audit:
  type: manual
  command: Check that you are backing up your keystore regularly. Keep in mind that even if the encryption key has been rotated, logs may still need access to the old key. Do not delete keys.
remediation:
  type: iac_patch
  command: Regularly backup your keystore and stash files, using mechanisms outside of Db2.
