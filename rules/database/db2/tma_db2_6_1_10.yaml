id: TMA-DB2-6.1.10
title: Secure WLMADM Authority
description: The WLMADM authority manages workload objects for a database. Holders of DBADM authority implicitly also hold WLMADM authority.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.10 Secure WLMADM Authority
audit:
  type: manual
  command: '1. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where wlmadmauth = ''Y'' 2. Determine if the grantee(s) are correctly set.'
remediation:
  type: iac_patch
  command: 'Revoke any user who should NOT have WLMADM authority: db2 => REVOKE WLMADM ON DATABASE FROM USER <username>'
