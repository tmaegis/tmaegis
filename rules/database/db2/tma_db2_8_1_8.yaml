id: TMA-DB2-8.1.8
title: Configure a Client-side Key Store for TLS (SSL_CLNT_KEYDB)
description: To enable TLS support in a Db2 client, it is possible to configure a key store in the database manager configuration that will contain root certificates to be used for secure TLS communication between a Db2 client and Db2 server.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.8 Configure a Client-side Key Store for TLS (SSL_CLNT_KEYDB)
audit:
  type: manual
  command: 'erform the following to determine if SSL_CLNT_KEYDB is set. 1. Run the following command: db2 => get database manager configuration 2. Locate the value of SSL_CLNT_KEYDB in the output: SSL client keydb file (SSL_CLNT_KEYDB) ='
remediation:
  type: iac_patch
  command: 'Perform the following to set SSL_CLNT_KEYDB: 1. Run the following command, where <path> is the fully qualified path to the keystore file: db2 => update dbm cfg using SSL_CLNT_KEYDB <path> 2. (Optional) To use the Microsoft certificate store on Windows, set SSL_CLNT_KEYDB to GSK_MS_CERTIFICATE_STORE: db2 => update dbm cfg using SSL_CLNT_KEYDB GSK_MS_CERTIFICATE_STORE 3. Restart the client application. If the CLP is being used, run the following command to terminate the background process db2 => terminate If a client-side keystore file is being used, ensure that any users running client applications, and administrators have access to the file. Do not grant world readable or world writable permissions on the stash file.'
