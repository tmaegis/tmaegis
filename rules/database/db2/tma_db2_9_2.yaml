id: TMA-DB2-9.2
title: Enable Backup Redundancy
description: Backup redundancy ensures that multiple instances of database backups exist.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 9.2 Enable Backup Redundancy
audit:
