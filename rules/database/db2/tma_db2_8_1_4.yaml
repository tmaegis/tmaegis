id: TMA-DB2-8.1.4
title: Configure the Service Name for TLS (SSL_SVCENAME)
description: 'The SSL_SVCENAME database manager configuration parameter controls which port Db2 will listen on for TLS encrypted connections. SSL_SVCENAME can consist of one of the following: ; A port number ; Service name defined in /etc/services (UNIX/Linux) or %WINDIR%\system32\drivers\etc\services (windows)'
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.4 Configure the Service Name for TLS (SSL_SVCENAME)
audit:
  type: manual
  command: 'Perform the following to determine if SSL_SVCENAME is set. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the value of SSL_SVCENAME in the output: SSL service name (SSL_SVCENAME) ='
remediation:
  type: iac_patch
  command: 'Perform the following to set SSL_SVCENAME: 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command, where <service> is a port number or named service. db2 => update dbm cfg using SSL_SVCENAME <service> Db2 must be recycled (db2stop/db2start) for changes to SSL_SVCENAME to take effect.'
