id: TMA-DB2-8.1.9
title: Configure a Client-side Stash File for TLS (SSL_CLNT_STASH)
description: If a key store file is being used to configure client-side TLS support in a Db2 instance, a stash file should also be configured to allow the Db2 client to be able to read certificates from the keystore. If the Microsoft certificate store is configured on a Windows platform, a stash file is not required.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.9 Configure a Client-side Stash File for TLS (SSL_CLNT_STASH)
audit:
  type: manual
  command: 'Perform the following to set SSL_CLNT_STASH: 1. Run the following command, where <path> is the fully qualified path to the keystore file: db2 => update dbm cfg using SSL_CLNT_KEYDB <path> 2. Restart the client application. If the CLP is being used, run the following command to terminate the background process db2 => terminate If a stash file is being used, ensure that any users running client applications, and administrators have access to the file. Do not grant world readable or world writable permissions on the stash file. If the Microsoft certificate store is being used on Windows, it ...'
remediation:
  type: iac_patch
  command: 'Perform the following to set SSL_CLNT_STASH: 1. Run the following command, where is the fully qualified path to the keystore file: db2 => update dbm cfg using SSL_CLNT_KEYDB <path> 2. Restart the client application. If the CLP is being used, run the following command to terminate the background process db2 => terminate If a stash file is being used, ensure that any users running client applications, and administrators have access to the file. Do not grant world readable or world writable permissions on the stash file. If the Microsoft certificate store is being used on Windows, it is not necessary to set SSL_CLNT_STASH.'
