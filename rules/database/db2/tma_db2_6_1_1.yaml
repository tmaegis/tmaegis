id: TMA-DB2-6.1.1
title: Secure SYSADM Authority
description: 'The sysadm_group parameter defines the system administrator group (SYSADM) authority. It is recommended that the sysadm_group group contains authorized users only. Default: The default value for sysadm_group is NULL.'
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.1 Secure SYSADM Authority
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the sysadm_group value in the output and ensure the value is not NULL: (SYSADM_GROUP) = DB2ADM 4. Review the members of the sysadm_group on the operating system. Linux: cat /etc/group | grep <sysadm group name> Windows: 1. Run compmgmt.msc 2. Click ''Local Users and Groups'' 3. Double click ''Groups'' 4. Double click the <sysadm group name> 5. Review group members'
remediation:
  type: iac_patch
  command: 'Define a valid group name for the SYSADM group. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration using sysadm_group <sys adm group name>'
