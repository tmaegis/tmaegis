id: TMA-DB2-4.1.11
title: Set Maximum Number of Applications (MAXAPPLS)
description: 'The MAXAPPLS parameter specifies the maximum number of concurrent applications that can be connected (both local and remote) to a database. In an instance with a single database, it is recommended that this value be set to AUTOMATIC. While this indicates that any number of connections should be allowed, an upper limit of MAX_CONNECTIONS database manager configuration parameter is still ... Automated for the single-database case (MAXAPPLS = AUTOMATIC). In multi-database instances a fixed value is acceptable when the sum of MAXAPPLS is <= MAX_CONNECTIONS; review such FAILs manually. Database-level check: set DB2DBDFT to the database name to audit (the rule connects to it with the instance owner''s credentials and fails when DB2DBDFT is unset). Run as the instance owner (or with sqllib/db2profile sourced) so the db2 CLP reads this instance''s configuration.'
target: db2
level: 1
severity: low
tags:
- db2
- database
- availability
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.1.11 Set Maximum Number of Applications (MAXAPPLS)
audit:
  type: command
  command: 'db="${DB2DBDFT:?set DB2DBDFT to the database to audit}"; out=$(db2 get db cfg for "$db" 2>/dev/null) || exit 1; printf ''%s\n'' "$out" | awk ''{ if (match($0, /\([A-Z0-9_]+\) *=/)) { k = substr($0, RSTART + 1, RLENGTH); sub(/\).*/, "", k); v = $0; sub(/^[^=]*=/, "", v); gsub(/[ \t]/, "", v); c[k] = v } } END { if (index(c["MAXAPPLS"], "AUTOMATIC") == 1) print "compliant"; else print "noncompliant: " c["MAXAPPLS"] }'''
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v db2 >/dev/null 2>&1 || exit 0
    db="${DB2DBDFT:?set DB2DBDFT to the database to audit}"
    db2 update db cfg for "$db" using MAXAPPLS AUTOMATIC
  guidance: "1. Connect to the Db2 database db2 => connect to <dbname> 2. If a single database is used in the instance, run the following command: db2 => update database configuration using maxappls AUTOMATIC 3. If multiple databases are used in the instance, determine appropriate values for each database such that the sum of MAXAPPLS values equals the MAX_CONNECTIONS database manager configuration parameter value (for example 100 for each of 2 databases when MAX_CONNECTIONS is 200), and run the following command: db2 => update database configuration using maxappls 200"
