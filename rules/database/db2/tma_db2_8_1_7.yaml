id: TMA-DB2-8.1.7
title: Unset the Service Name for Plaintext Communication (SVCENAME)
description: The SSVCENAME database manager configuration parameter controls which port Db2 will listen on for unencrypted connections.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.7 Unset the Service Name for Plaintext Communication (SVCENAME)
audit:
  type: manual
  command: 'Perform the following to determine if SSL_SVCENAME is set. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the value of SVCENAME in the output: TCP/IP Service name (SVCENAME) ='
remediation:
  type: iac_patch
  command: 'Perform the following to unset SVCENAME: 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command, where <service> is a port number or named service. db2 => update dbm cfg using SVCENAME NULL Db2 must be recycled (db2stop/db2start) for changes to SSL_SVCENAME to take effect.'
