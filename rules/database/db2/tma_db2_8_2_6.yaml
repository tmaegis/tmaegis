id: TMA-DB2-8.2.6
title: Create a Strong Password
description: When creating or changing passwords for local keystone files, ensure that the passwords are strong, by using the -strong parameter of the gsk8capicmd_64 command.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.6 Create a Strong Password
audit:
  type: manual
  command: Password is set during the keystore create command. You cannot check what password you used via a command; you have to manage the the password yourself.
remediation:
  type: iac_patch
  command: 'Use the -strong parameter on the gsk8capicmd_64 command: $ gsk8capicmd_64 -keydb -create -dbmykeystore.p12 -pw <yourpasswordhere> -strong -stash'
