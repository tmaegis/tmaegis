id: TMA-DB2-6.1.9
title: Secure ACCESSCTRL Authority
description: ACCESSCTRL authority is the authority required to grant and revoke privileges on objects within a specific database. Some of these privileges include BINDADD, CONNECT, CREATETAB, CREATE_EXTERNAL_ROUTINE, LOAD, and QUIESCE_CONNECT. It has no inherent privilege to access data stored in tables, except the catalog tables and views. The ACCESSCTRL authority cannot be granted to PUBLIC.
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.9 Secure ACCESSCTRL Authority
audit:
  type: manual
  command: '1. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where accessctrlauth = ''Y'' 2. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: Revoke ACCESSCTRL authority from any unauthorized users. db2 => REVOKE ACCESSCTRL ON DATABASE FROM USER <username>
