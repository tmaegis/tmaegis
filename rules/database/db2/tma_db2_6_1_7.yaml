id: TMA-DB2-6.1.7
title: Secure SQLADM Authority
description: The SQLADM authority is required to monitor, tune, and alter SQL statements.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.7 Secure SQLADM Authority
audit:
  type: manual
  command: '1. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where sqladmauth = ''Y'' 2. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: Revoke SQLADM authority from any unauthorized users. db2 => REVOKE SQLADM ON DATABASE FROM USER <username>
