id: TMA-DB2-8.2.4
title: Secure the Stash File
description: A stash file is an obfuscated file that contains the credentials that are needed to access the keystore. If a keystore password was not provided during db2start, the password will be retrieved from the stash file. A stash file is created when -stash command is used during the creation of the keystore.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.4 Secure the Stash File
audit:
  type: manual
  command: 'A stash file is used when a file with the same name as the PKCS12 keystore file exists but with a .sth extension. For example, if the keystore is called keystore.p12, the stash file, if it exists, will be in the same directory with the name keystore.sth. You can determine the location of the stash file by examining the KEYSTORE_LOCATION database manager configuration parameter. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the KEYSTORE_LOCATION value in the output: Keystore location ...'
remediation:
  type: iac_patch
  command: 'Change the permissions for the file: $ chmod 600 keystore.sth'
