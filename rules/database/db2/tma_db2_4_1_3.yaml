id: TMA-DB2-4.1.3
title: Auto-restart After Abnormal Termination (AUTORESTART)
description: 'The AUTORESTART parameter specifies if the database manager will start a crash recovery automatically when the first user tries to connect to a database which has previously terminated abnormally. If the parameter is set to OFF an explicit RESTART DATABASE command has to be issued to initiate a crash recovery. It is recommended that this parameter is set to ON (which is also the default). Default: The default value for AUTORESTART is ON. Database-level check: set DB2DBDFT to the database name to audit (the rule connects to it with the instance owner''s credentials and fails when DB2DBDFT is unset). Run as the instance owner (or with sqllib/db2profile sourced) so the db2 CLP reads this instance''s configuration.'
target: db2
level: 1
severity: low
tags:
- db2
- database
- availability
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.1.3 Auto-restart After Abnormal Termination (AUTORESTART)
audit:
  type: command
  command: 'db="${DB2DBDFT:?set DB2DBDFT to the database to audit}"; out=$(db2 get db cfg for "$db" 2>/dev/null) || exit 1; printf ''%s\n'' "$out" | awk ''{ if (match($0, /\([A-Z0-9_]+\) *=/)) { k = substr($0, RSTART + 1, RLENGTH); sub(/\).*/, "", k); v = $0; sub(/^[^=]*=/, "", v); gsub(/[ \t]/, "", v); c[k] = v } } END { if (c["AUTORESTART"] == "ON") print "compliant"; else print "noncompliant: " c["AUTORESTART"] }'''
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v db2 >/dev/null 2>&1 || exit 0
    db="${DB2DBDFT:?set DB2DBDFT to the database to audit}"
    db2 update db cfg for "$db" using AUTORESTART ON
  guidance: "1. Connect to the Db2 database db2 => connect to <dbname> 2. Run the following command: db2 => update database configuration using autorestart on"
