id: TMA-DB2-5.7
title: DB2_GRP_LOOKUP Registry Variable (Windows only)
description: The DB2_GRP_LOOKUP registry variable specifies which Windows security mechanism is used to enumerate the groups that a user belongs to. Periodic review of this variable is required to ensure that the correct location is being used for group definitions during authentication.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.7 DB2_GRP_LOOKUP Registry Variable (Windows only)
audit:
  type: manual
  command: 'Verify that the DB2_GRP_LOOKUP registry variable is set to the correct location by running the following command: db2set -all'
remediation:
  type: iac_patch
  command: 'Run the following command to set the DB2_GRP_LOOKUP registry variable to the appropriate location for group lookup: db2set DB2_GRP_LOOKUP=<location for group lookup>'
