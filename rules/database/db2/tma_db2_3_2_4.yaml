id: TMA-DB2-3.2.4
title: Enable Extended Security (DB2_EXTSECURITY)
description: The DB2_EXTSECURITY registry variable determines whether extended security is enabled on Windows. Extended security enables file permissions for all Db2 objects so they can be accessed by users in DB2ADMNS and DB2USERS groups. It is recommended that extended security be enabled. This registry variable only applies to Db2 Servers running on Windows. DB2_EXTSECURITY applies to Windows servers only, so it is reviewed manually.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 3.2.4 Enable Extended Security (DB2_EXTSECURITY)
audit:
  type: manual
  command: 'erify that extended security is enabled by running the following command: db2set -all | grep DB2_EXTSECURITY The above command should yield a value of ON.'
remediation:
  type: iac_patch
  command: 'Run the following command to enable extended security (consult documentation for additional options as appropriate): db2extsec'
