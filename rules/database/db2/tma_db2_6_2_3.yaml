id: TMA-DB2-6.2.3
title: Review Role Members
description: Having roles that have been granted specific privileges, then assigning users to the roles, is usually considered the best way to grant application access. Because granting privileges to individual users can be more difficult to track and maintain against unauthorized access, users should be assigned to organization-defined database roles according to the needs of the business. As users leave ...
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.2.3 Review Role Members
audit:
  type: manual
  command: '1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following to review and verify that the role members are correct for each role: db2 => select rolename,grantee from syscat.roleauth where grantortype <> ''S'' group by rolename, grantee'
remediation:
  type: iac_patch
  command: 'To remove a role member from a particular role: 1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following: db2 => revoke role <role name> from <role member>'
