id: TMA-DB2-1.1.1
title: Install Available Updates
description: The Db2 product is identified by a <Version>.<Release>.<Modpack>.<Fixpack> scheme. For example, 12.1.2.0 refers to version 12, release 1, modpack 2 fixpack 0. Modification packs contain new features as well as defect fixes and are indicated by a change in the modification and fix pack numbers in the product identifier. Fix packs contain only defect fixes and are indicated by a change in just ...
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 1.1.1 Install Available Updates
audit:
  type: manual
  command: 'Perform the following Db2 commands to obtain the version: $ db2level DB21085I This instance or install (instance name, where applicable: "db2inst1") uses "64" bits and DB2 code release "SQL12012" with level identifier "02030110". Informational tokens are "DB2 v12.1.2.0", "special_64532", "DYN2508011629AMD64_64532", and Fix Pack "0".'
remediation:
  type: iac_patch
  command: Apply the latest fix pack as offered from IBM.
