id: TMA-DB2-6.1.19
title: Secure Schema ACCESSCTRL Authority
description: The Schema ACCESSCTLR authority allows a user grant and revoke privileges within a specific schema. It is recommended that the Schema ACCESSCTRL authority be granted to authorized users only.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.19 Secure Schema ACCESSCTRL Authority
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select distinct schemaname, grantee, granteetype from syscat.schemaauth where ACCESSCTRLAUTH = ''Y'' 3. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: 'Revoke this permission from any unauthorized users. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE ACCESSCTRL ON SCHEMA <schema> FROM USER <username>'
