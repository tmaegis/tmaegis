id: TMA-DB2-6.1.6
title: Secure DBADM Authority
description: The DBADM (database administration) role grants the authority to a user to perform administrative tasks on a specific database. It is recommended that the DBADM role be granted to authorized users only.
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.6 Secure DBADM Authority
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where dbadmauth = ''Y'' 3. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: 'Revoke this permission from any unauthorized users. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE DBADM ON DATABASE FROM USER <username>'
