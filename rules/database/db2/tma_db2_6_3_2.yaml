id: TMA-DB2-6.3.2
title: Review Row Permission Logic According to Policy
description: The logic behind instituting row permissions is crucial for a successful security policy. Inspecting this logic and comparing it to the security policy will assure that all aspects of the data access controls are being adhered to.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.3.2 Review Row Permission Logic According to Policy
audit:
  type: manual
  command: '1. Connect to database environment: db2 => connect to <dbname> 2. Run the following and review the results to confirm that the row permissions are correct and that they comply with the existing security policy: db2 => select role.rolename, control.ruletext from syscat.roles role inner join syscat.controls control on locate(role.rolename,control.ruletext) <> 0 where enable = ''Y'' and enforced = ''A'' and valid = ''Y'' and controltype = ''R'''
remediation:
  type: iac_patch
  command: 1. Create RCAC Policies for each 'gap' listed from the Audit procedure. 2. Review the newly created Db2 RCAC policy against the organization's policy.
