id: TMA-DB2-5.10
title: DB2CHGPWD_EEE Registry Variable
description: The DB2CHGPWD_EEE registry variable specifies whether users are able to change passwords through Db2 in a partitioned database environment. It is recommended to set this variable to NO.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.10 DB2CHGPWD_EEE Registry Variable
audit:
  type: manual
  command: 'Verify that the DB2CHGPWD_EEE registry variable is set to the correct location by running the following command: db2set -all'
remediation:
  type: iac_patch
  command: 'Run the following command to set the DB2CHGPWD_EEE registry variable to NO: db2set DB2CHGPWD_EEE=NO'
