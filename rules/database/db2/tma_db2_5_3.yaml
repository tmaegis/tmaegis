id: TMA-DB2-5.3
title: 'Database Manager Configuration Parameter: ALTERNATE_AUTH_ENC'
description: The ALTERNATE_AUTH_ENC database manager configuration parameter specifies the encryption algorithm that is used to encrypt user ID and password that are sent from the client during a connect or attach. This parameter is in effect when the authentication method that is negotiated between the client and the server is SERVER_ENCRYPT. It is recommended to set this parameter to AES_ONLY.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: 'CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.3 Database Manager Configuration Parameter: ALTERNATE_AUTH_ENC'
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the ALTERNATE_AUTH_ENC value in the output: Alternate authentication (ALTERNATE_AUTH_ENC) = AES_ONLY'
remediation:
  type: iac_patch
  command: '1. Attach to the Db2 instance db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration parameter using alternate_auth_enc aes_only 3. Restart the Db2 instance. db2 => db2stop db2 => db2start'
