id: TMA-DB2-8.2.13
title: Set CFG Values in a Single Command
description: Db2 uses KEYSTORE_TYPE and KEYSTORE_LOCATION to access the keystore.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.13 Set CFG Values in a Single Command
audit:
  type: manual
  command: 'You can check what values you have set for these parameters as follows: $ db2 get dbm cfg | grep KEYSTORE Keystore type (KEYSTORE_TYPE) = PKCS12 Keystore location (KEYSTORE_LOCATION) = /path/to/file.p12'
remediation:
  type: iac_patch
  command: 'You can execute the following command to change the values in one line: db2 => update dbm cfg using keystore_type pkcs12 keystore_location /path/to/file.p12; DB20000I The UPDATE DATABASE MANAGER CONFIGURATION command completed successfully.'
