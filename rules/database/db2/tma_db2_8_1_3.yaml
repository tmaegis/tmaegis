id: TMA-DB2-8.1.3
title: Configure an Endpoint Certificate (SSL_SVR_LABEL)
description: The SSL_SVR_LABEL database manager configuration parameter controls which certificate Db2 will serve to clients. This certificate must have its associated certificate chain present in the server-side key store and must be associated with a private key.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.3 Configure an Endpoint Certificate (SSL_SVR_LABEL)
audit:
  type: manual
  command: 'Perform the following to determine if SSL_SVR_LABEL is set. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the value of SSL_SVR_LABEL in the output: SSL server certificate label (SSL_SVR_LABEL) ='
remediation:
  type: iac_patch
  command: 'Perform the following to set SSL_SVR_LABEL: 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command, where <label> is the name of a certificate present in the server-side key store. db2 => update dbm cfg using SSL_SVR_LABEL <label> Updating the value of SSL_SVR_LABEL while attached to the instance will cause the certificate served by Db2 to change while instance is running, with no effect on existing connections.'
