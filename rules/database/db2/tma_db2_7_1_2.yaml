id: TMA-DB2-7.1.2
title: Disable Limited Audit of Applications (DB2_LIMIT_AUDIT_APPS)
description: The DB2_LIMIT_AUDIT_APPS registry variable contains a list of application names that should not be audited. It is recommended that this variable should not be set and all applications should be audited. The DB2_LIMIT_AUDIT_APPS registry variable is not documented.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 7.1.2 Disable Limited Audit of Applications (DB2_LIMIT_AUDIT_APPS)
audit:
  type: manual
  command: 'Perform the following to determine if the DB2_LIMIT_AUDIT_APPS registry variable is set: db2set -all | grep DB2_LIMIT_AUDIT_APPS The above command should not yield a value.'
remediation:
  type: iac_patch
  command: 'Perform the following command to remove any applications from the list: db2set DB2_LIMIT_AUDIT_APPS='
