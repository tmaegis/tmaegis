id: TMA-DB2-6.2.4
title: Nested Roles
description: The user-defined roles in Db2 can be nested in the same fashion as Windows security groups, i.e. a nested group has both its directly assigned permissions as well as the assigned group permissions. By nesting roles, the database administrator is saving time by only having to assign a group of users versus assigning them individually. Nesting roles properly can often ease the application of ...
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.2.4 Nested Roles
audit:
  type: manual
  command: '1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following to identify any nested roles: db2 => select grantee, rolename from syscat.roleauth where grantee in (select rolename from syscat.roles) If value is blank, this would be considered passing.'
remediation:
  type: iac_patch
  command: 'To remove a nested role, perform the following: 1. Connect to Db2 database: db2 => connect to <dbname> 2. Run the following: db2 => revoke role <role name> from role <role>'
