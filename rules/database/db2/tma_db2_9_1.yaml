id: TMA-DB2-9.1
title: Leverage the Least Privilege Principle
description: The Db2 database instance will execute under the context of a given security principle. It is recommended that this service have the least privileges possible. Furthermore, it is advisable to have the Db2 service executed using the Db2 instance owner and monitor such accounts for unauthorized access to the sensitive data.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 9.1 Leverage the Least Privilege Principle
audit:
  type: manual
  command: Review all accounts that have access to the Db2 database service to ensure least privilege is applied.
remediation:
  type: iac_patch
  command: Ensure that all accounts have the absolute minimal privilege granted to perform their tasks.
