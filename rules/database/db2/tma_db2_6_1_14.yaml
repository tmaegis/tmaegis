id: TMA-DB2-6.1.14
title: Secure LOAD Authority
description: The LOAD role grants the authority to a user to load data into tables. It is recommended that the LOAD role be granted to authorized users only.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.14 Secure LOAD Authority
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => select distinct grantee, granteetype from syscat.dbauth where loadauth = ''Y'' 3. Review the list of users, groups, and roles in the above output to ensure only approved users, groups, and roles are assigned.'
remediation:
  type: iac_patch
  command: 'Revoke this permission from any unauthorized users. 1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => REVOKE LOAD ON DATABASE FROM USER <username>'
