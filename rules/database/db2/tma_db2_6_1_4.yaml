id: TMA-DB2-6.1.4
title: Secure SYSMON Authority
description: 'The sysmon_group parameter defines the operating system groups with system monitor (SYSMON) authority. It is recommended that the sysmon_group group contain authorized users only. Default: The default value for sysmon_group is NULL.'
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.1.4 Secure SYSMON Authority
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the sysmon_group value in the output and ensure the value is not NULL: SYSMON group name (SYSMON_GROUP) = DB2MON 4. Review the members of the sysmon_group on the operating system. Linux: cat /etc/group | grep <sysmon group name> Windows: 1. Run compmgmt.msc 2. Click ''Local Users and Groups'' 3. Double click ''Groups'' 4. Double click the <sysmon group name> 5. Review group members'
remediation:
  type: iac_patch
  command: 'Define a valid group name for the SYSMON group. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration using sysmon_group <sysmon group name>'
