id: TMA-DB2-5.1
title: Specify a Secure Connection Authentication Type (SRVCON_AUTH)
description: 'The SRVCON_AUTH database manager configuration parameter specifies how and where authentication takes place for incoming connections to the database. This parameter overrides the AUTHENTICATION parameter. This parameter can take on any of the following values: ; NOT_SPECIFIED ; SERVER ; SERVER_ENCRYPT ; KERBEROS ; KRB_SERVER_ENCRYPT ; GSSPLUGIN ; GSS_SERVER_ENCRYPT ; SERVER_ENCRYPT_TOKEN ...'
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.1 Specify a Secure Connection Authentication Type (SRVCON_AUTH)
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the SRVCON_AUTH value in the output: Server Connection Authentication (SRVCON_AUTH) = SERVER Any value other than CLIENT is acceptable.'
remediation:
  type: iac_patch
  command: '1. Attach to the Db2 instance db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration parameter using srvcon_auth <authentication type> 3. Restart the Db2 instance. db2 => db2stop db2 => db2start Refer to the ''encryption of data in motion'' section for more information about using SSL for client-server communication.'
