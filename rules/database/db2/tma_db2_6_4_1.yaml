id: TMA-DB2-6.4.1
title: Ensure Trusted Contexts are Enabled
description: A Trusted Context object provides a means of enforcing encryption, assigning privileges based on roles, and ensuring that the actions performed on behalf of a user are performed in the context of the user's ID and privileges.
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 6.4.1 Ensure Trusted Contexts are Enabled
audit:
  type: manual
  command: 'Issue the following command to verify that a Trusted Context object is enabled: db2 => select contextname, enabled from syscat.contexts where enabled = ''Y'''
remediation:
  type: iac_patch
  command: If there is no enabled Trusted Context object, create a Trusted Context object if needed and enable it.
