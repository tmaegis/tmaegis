id: TMA-DB2-8.1.1
title: Configure a Server-side Key Store for TLS (SSL_SVR_KEYDB)
description: To enable TLS support in a Db2 server, it is necessary to configure a key store that will contain certificates to be used for secure TLS communication between a Db2 client and Db2 server.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.1.1 Configure a Server-side Key Store for TLS (SSL_SVR_KEYDB)
audit:
  type: manual
  command: 'Perform the following to determine if SSL_SVR_KEYDB is set. 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the value of CATALOG_NOAUTH in the output: SSL server keydb file (SSL_SVR_KEYDB) = Ensure SSL_SVR_KEYDB is not blank.'
remediation:
  type: iac_patch
  command: 'Perform the following to set SSL_SVR_KEYDB: 1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command, where <path> is the fully qualified path to the keystore file: db2 => update dbm cfg using SSL_SVR_KEYDB <path> 3. (Optional) To use the Microsoft certificate store on Windows, set SSL_SVR_KEYDB to GSK_MS_CERTIFICATE_STORE: db2 => update dbm cfg using SSL_SVR_KEYDB GSK_MS_CERTIFICATE_STORE If a keystore file is being used, ensure only the instance owner and administrators have access to the file. Do not grant world readable or world writable permissions on the keystore file.'
