id: TMA-DB2-8.2.11
title: Keep Master Key Labels Unique
description: Db2 uses the MK label to uniquely identify each MK, and stores the label value in each encrypted object, be it a database, transaction log, or backup file. This stored MK label value identifies the MK key material that is used to decrypt the data in the object. Creating MK labels is part of an organizations standard operating procedures (SOP).
target: db2
level: 2
severity: low
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 8.2.11 Keep Master Key Labels Unique
audit:
  type: manual
  command: Check the organization's SOP for creating master key labels to ensure it includes specific guidance on creating unique master key labels.
remediation:
  type: iac_patch
  command: Update the SOP to provide guidance found missing during the audit.
