id: TMA-DB2-4.1.9
title: Establish Retention Set Size for Backups (NUM_DB_BACKUPS)
description: The NUM_DB_BACKUPS parameter specifies the number of backups to retain for a database before marking the oldest backup as deleted. It is recommended that this parameter be set to at least 12.
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 4.1.9 Establish Retention Set Size for Backups (NUM_DB_BACKUPS)
audit:
  type: manual
  command: '1. Connect to the Db2 database. db2 => connect to <dbname> 2. Run the following command: db2 => get database configuration 3. Locate the NUM_DB_BACKUPS value in the output: Number of database backups to retain (NUM_DB_BACKUPS) = 12'
remediation:
  type: iac_patch
  command: '1. Connect to the Db2 database db2 => connect to <dbname> 2. Run the following command: db2 => update database configuration using num_db_backups 12'
