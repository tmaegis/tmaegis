id: TMA-DB2-5.2
title: Specify a Secure Authentication Type (AUTHENTICATION)
description: The AUTHENTICATION database manager configuration parameter specifies how and where authentication takes place for incoming connections to the database as well as local authorization of commands run outside a connection or attachment, such as tools run from the command line. This parameter can be overridden by the SRVCON_AUTH parameter for incoming connections. This parameter can take on any ...
target: db2
level: 1
severity: high
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.2 Specify a Secure Authentication Type (AUTHENTICATION)
audit:
  type: manual
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => get database manager configuration 3. Locate the AUTHENTICATION value in the output: Database manager authentication (AUTHENTICATION) = SERVER'
remediation:
  type: iac_patch
  command: '1. Attach to the Db2 instance. db2 => attach to <db2instance> 2. Run the following command: db2 => update database manager configuration parameter using authentication <authentication type> 3. Restart the Db2 instance. db2 => db2stop db2 => db2start Refer to the ''encryption of data in motion'' section for more information about using SSL for client-server communication.'
