id: TMA-DB2-5.6
title: Secure Permissions for All Authentication Plugins
description: The following database manager configuration parameters allow the use of custom plugins for authentication and group lookup purposes. ; CLNT_PW_PLUGIN ; CLNT_KRB_PLUGIN ; GROUP_PLUGIN ; LOCAL_GSSPLUGIN ; SRVCON_GSSPLUGIN_LIST ; SRVCON_PW_PLUGIN The permissions on the plugins specified by any of the above parameters should be secured so that users other than the instance owner don't have write ...
target: db2
level: 1
severity: medium
tags:
- db2
- database
- manual
reference: CIS IBM Db2 12.1 Benchmark v1.0.0 - 5.6 Secure Permissions for All Authentication Plugins
audit:
  type: manual
  command: 'Steps for Linux: ; 32-bit and 64-bit client side user authentication plugins are found in $DB2PATH/security32/plugin/client and $DB2PATH/security64/plugin/client directories respectively ; 32-bit and 64-bit server side user authentication plugins are found in $DB2PATH/security32/plugin/server and $DB2PATH/security64/plugin/server directories respectively Review the permissions of the plugins that are in use: ls -al Steps for Windows: ; 32-bit and 64-bit client side user authentication plugins are found in $DB2PATH\security\plugin\instance name\client ; 32-bit and 64-bit server side user ...'
remediation:
  type: iac_patch
  command: 'To change permissions of a file on Linux: chmod 755 <file> To change permissions of a file on Windows: 1. Right-click on the file 2. Choose properties 3. Select the Security tab 4. Grant the Full Control authority to all Db2 administrator accounts 5. Grant only read and execute privileges to all other accounts (revoke any other privileges)'
