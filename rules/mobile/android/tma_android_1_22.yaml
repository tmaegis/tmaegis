id: TMA-ANDROID-1.22
title: Keep device Apps up to date
description: 'Regularly update device apps. The recommended state for this setting is: Update apps.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.22 Keep device Apps up to date
audit:
  type: manual
  command: 'Follow the below steps to verify that Apps are up to date: Tap/slide up Launcher > Launch Play Store App in the App drawer > Menu > My apps & Games > Verify that all apps are up to date.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to update all Apps: Tap/slide up Launcher > Launch Play Store App in the App drawer > Menu > My apps & Games > If there are any updates pending, then tap Update All.'
