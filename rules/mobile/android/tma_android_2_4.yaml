id: TMA-ANDROID-2.4
title: Ensure 'Device Information' is set to 'Disabled'
description: 'Disable storing device information to your account. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: medium
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.4 Ensure 'Device Information' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Device Information setting is Disabled: Settings Gear Icon > Privacy > Advanced > Activity Controls > Verify that Device Information setting is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Device Information setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle Device Information setting to OFF position.'
