id: TMA-ANDROID-1.3
title: Ensure 'Make pattern visible' is set to 'Disabled' (if using a pattern as device lock mechanism)
description: 'Disable pattern visibility if using a pattern as device lock mechanism. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: low
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.3 Ensure 'Make pattern visible' is set to 'Disabled' (if using a pattern as device lock mechanism)
audit:
  type: manual
  command: 'Follow the below steps and verify that device unlock pattern is not visible: Settings Gear Icon > Security > If Screen lock has Pattern underneath the text, follow further steps. If not, then this recommendation is not applicable > Gear Icon next to Screen lock > Verify that the Make pattern visible switch is Disabled.'
remediation:
  type: iac_patch
  command: 'To disable device unlock pattern visibility, follow the below steps: Settings Gear Icon > Security > If Screen lock has Pattern underneath the text, follow further steps. If not, then this recommendation is not applicable > Gear Icon next to Screen lock > Toggle Make pattern visible to OFF position.'
