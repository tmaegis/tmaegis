id: TMA-ANDROID-1.14
title: Ensure 'Use network-provided time' and 'Use network- provided time zone' are set to 'Enabled'
description: 'The Use network-provided time and Use network-provided time zone settings allow the device to automatically update its time and time zone based on the network it is connected to. When these settings are enabled, the device will periodically check with the network to ensure that its time and time zone are accurate. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.14 Ensure 'Use network-provided time' and 'Use network- provided time zone' are set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Use network-provided time and Use network- provided time zone setting is Enabled: phone''s Settings app > System > Date & time > Verify that Use network-provided time setting is Enabled > Verify that Use network-provided time zone setting is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Use network-provided time and Use network- provided time zone settings: phone''s Settings app > System > Date & time > Toggle Use network-provided time setting to ON position > Toggle Use network-provided time zone setting to ON position.'
