id: TMA-ANDROID-2.6
title: Ensure 'YouTube Search History' is set to 'Disabled'
description: 'Disable storing YouTube Search History to a user''s account. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.6 Ensure 'YouTube Search History' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that YouTube Search History setting is Disabled: phone''s Settings app > Privacy > Advanced > Activity Controls > Verify that YouTube Search History setting is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable YouTube Search History setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle YouTube Search History setting to OFF position.'
