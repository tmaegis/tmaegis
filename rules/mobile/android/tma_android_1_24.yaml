id: TMA-ANDROID-1.24
title: Ensure 'Guest profiles' do not exist
description: 'Do not add any guest profiles on the device. Guest profiles allows users to create temporary profiles for guests or other individuals who may need to use the device without accessing the owner''s personal data. The recommended state for this setting is: Remove Guest profiles.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.24 Ensure 'Guest profiles' do not exist
audit:
  type: manual
  command: 'Follow the below steps to verify that the Guest profile do not exist: phone''s Settings app > System > Advanced > Multiple users > Verify that Guests is grayed out.'
remediation:
  type: iac_patch
  command: 'Follow the below steps remove the Guest profile: Quick Settings drawer > Profile icon > Switch to Guest profile > Quick Settings drawer > Remove guest > Confirm removal by tapping remove.'
