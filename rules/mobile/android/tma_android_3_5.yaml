id: TMA-ANDROID-3.5
title: Ensure 'Search and URL suggestions' is set to 'Disabled'
description: 'Google Chrome uses a prediction service to show related searches, matches from browsing history, and popular websites while a user types in the address bar. The recommended state for this setting is: Disabled.'
target: android
level: 2
severity: low
tags:
- android
- chrome
reference: CIS Google Android Benchmark v1.6.0 - 3.5 Ensure 'Search and URL suggestions' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Search and URL suggestions is Disabled: Chrome Icon > Menu Icon > Settings > Privacy > Verify that Search and URL suggestions checkbox is unchecked.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to Disable the Search and URL suggestions feature: Chrome Icon > Menu Icon > Settings > Privacy > Uncheck the Search and URL suggestions checkbox.'
