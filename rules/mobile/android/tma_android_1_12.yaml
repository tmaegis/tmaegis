id: TMA-ANDROID-1.12
title: Ensure 'Smart Lock' is set to 'Disabled'
description: 'Smart Lock detects the device''s presence and automatically keeps it unlocked even if it has a screen password, pin or pattern enabled. Using Smart Lock allows the device to be unlocked if preconditions are met. The recommended state for this setting is: Disabled.'
target: android
level: 2
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.12 Ensure 'Smart Lock' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Smart Lock is Disabled: phone''s Settings app > Security > Advanced > Trust agents > Verify that Smart Lock (Google) is OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Smart Lock: phone''s Settings app > Security > Advanced > Trust agents > Toggle Smart Lock (Google) to OFF position.'
