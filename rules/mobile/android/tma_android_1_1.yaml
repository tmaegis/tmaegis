id: TMA-ANDROID-1.1
title: Ensure device firmware is up to date
description: 'Ensure that the device is kept up to date with security patch levels. The recommended state for this setting is: Apply updates.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.1 Ensure device firmware is up to date
audit:
  type: manual
  command: 'To verify that your device is updated to the most recent firmware version: phone''s Settings app > System > Advanced > System update > Verify that the Android Security patch level is current and that no new updates exist.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to check and update the device security patch level: phone''s Settings app > System > Advanced > System Updates > Check for update > Apply the update if available.'
