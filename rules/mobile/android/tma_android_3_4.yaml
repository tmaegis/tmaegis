id: TMA-ANDROID-3.4
title: Ensure 'Safe Browsing' is set to 'Enabled'
description: 'This setting controls the Safe Browsing feature. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: medium
tags:
- android
- chrome
reference: CIS Google Android Benchmark v1.6.0 - 3.4 Ensure 'Safe Browsing' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Safe Browsing is Enabled: Chrome Icon > Menu Icon > Settings > Privacy > Verify that Safe Browsing checkbox is checked.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to Enable the Safe Browsing feature: Chrome Icon > Menu Icon > Settings > Privacy > Check the Safe Browsing checkbox.'
