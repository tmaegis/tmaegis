id: TMA-ANDROID-2.1
title: Ensure 'Lock screen' is set to 'Don't show notifications at all'
description: 'Disable notifications on the lock screen. The recommended state for this setting is: Don''t show notifications at all.'
target: android
level: 1
severity: high
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.1 Ensure 'Lock screen' is set to 'Don't show notifications at all'
audit:
  type: manual
  command: 'To verify notifications on the lock screen are not shown: phone''s Settings app > Apps & notifications > Notifications > Advanced > Lock Screen > Verify that Lock Screen is set to Don''t show notifications at all.'
remediation:
  type: iac_patch
  command: 'Follow these steps to set the lock screen to show no notifications: phone''s Settings app > Apps & notifications > Notifications > Advanced > Lock Screen > Lock Screen and set it to Don''t show notifications at all.'
