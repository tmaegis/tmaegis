id: TMA-ANDROID-1.13
title: Ensure 'Find My Device' is set to 'Enabled'
description: 'Find My Device allows users to remotely locate, lock, or erase their device in case it is lost or stolen. The recommended state for this setting is: Enabled.'
target: android
level: 2
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.13 Ensure 'Find My Device' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Find My Device is Enabled: phone''s Settings app > Security > Verify that the Find My Device is ON.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Find My Device: phone''s Settings app > Security > Find My Device > Toggle slider to the ON position.'
