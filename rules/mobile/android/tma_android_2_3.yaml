id: TMA-ANDROID-2.3
title: Ensure 'Web and App Activity' is set to 'Disabled'
description: 'Disable linking of web and app activity to your account when you are logged out. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.3 Ensure 'Web and App Activity' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Web & App Activity setting is Disabled: phone''s Settings app > Privacy > Advanced > Activity Controls > Verify that Web & App Activity setting is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Web & App Activity setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle Web & App Activity setting to OFF position.'
