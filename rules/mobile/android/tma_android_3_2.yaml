id: TMA-ANDROID-3.2
title: Ensure 'Location' is set to 'Enabled'
description: 'This setting controls if a site asks before accessing the location. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: low
tags:
- android
- chrome
reference: CIS Google Android Benchmark v1.6.0 - 3.2 Ensure 'Location' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Location is Enabled: Chrome Icon > Menu Icon > Settings > Site settings > Verify that Location displays Ask first.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to Enable the Location permission request: Chrome Icon > Menu Icon > Settings > Site settings > Location > Toggle to the ON position.'
