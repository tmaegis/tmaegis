id: TMA-ANDROID-1.25
title: Review app permissions periodically
description: 'Review device app''s permissions periodically. App permissions allow control over which capabilities or information apps could access on the device. Permissions can extend from using device hardware to accessing data. The recommended state for this setting is: Review app permissions regularly.'
target: android
level: 1
severity: low
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.25 Review app permissions periodically
audit:
  type: manual
  command: 'Follow the below steps to review app permissions: phone''s Settings app > Apps & notifications > See all apps > on each permission and review the apps that have them.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to set app permissions appropriately: phone''s Settings app > Apps & notifications > App permissions > on each permission and review the apps that have them > Disable the app permissions that are over-permissive.'
