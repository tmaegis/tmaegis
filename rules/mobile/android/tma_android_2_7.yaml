id: TMA-ANDROID-2.7
title: Ensure 'YouTube Watch History' is set to 'Disabled'
description: 'Disable storing YouTube Watch History to a user account. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.7 Ensure 'YouTube Watch History' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that YouTube Watch History setting is Disabled: phone''s Settings app > Privacy > Advanced > Activity Controls > Verify that YouTube Watch History is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable YouTube Watch History setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle YouTube Watch History setting to OFF position.'
