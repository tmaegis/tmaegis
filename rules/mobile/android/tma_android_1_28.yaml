id: TMA-ANDROID-1.28
title: Review existing user profiles periodically
description: Review any user profiles on the device. Remove those that are no longer required.
target: android
level: 1
severity: low
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.28 Review existing user profiles periodically
audit:
  type: manual
  command: 'Review the list of user profiles. Follow the below steps to view the list of profile that exist: phone''s Settings app > System > Advanced > Multiple users > Review the list of user profiles.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to delete any unnecessary profiles: phone''s Settings app > System > Advanced > Multiple users > any unnecessary profile > Delete User. 2 Android OS Privacy Settings This section provides the privacy-related recommendation for Android OS.'
