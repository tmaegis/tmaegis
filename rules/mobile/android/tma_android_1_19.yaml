id: TMA-ANDROID-1.19
title: Ensure 'Ask for unlock pattern/PIN/password before unpinning' is set to 'Enabled'
description: 'A user can pin an app and hand the device to a friend. With the screen pinned, the friend can use only that app. To use the other apps again, the user can unpin the screen. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.19 Ensure 'Ask for unlock pattern/PIN/password before unpinning' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Ask for pattern/PIN/password before unpinning setting is Enabled: phone''s Settings app > Security > Advanced > Screen pinning > If Screen Pinning is On, then verify that Ask for pattern/PIN/password before unpinning setting is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Ask for pattern/PIN/password before unpinning: phone''s Settings app > Security > Advanced > Screen pinning > If you are using Screen Pinning, then toggle Ask for pattern/PIN/password before unpinning setting to ON position.'
