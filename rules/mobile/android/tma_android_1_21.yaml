id: TMA-ANDROID-1.21
title: Ensure 'Wi-Fi assistant' is set to 'Disabled'
description: 'The Wi-Fi assistant setting allows users to automatically connect to high-quality open Wi-Fi networks. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.21 Ensure 'Wi-Fi assistant' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Wi-Fi assistant is Disabled: phone''s Settings app > Google > Networking > Verify that Wi-Fi assistant is turned OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Wi-Fi assistant: phone''s Settings app > Google > Networking > Toggle Wi-Fi assistant to OFF position.'
