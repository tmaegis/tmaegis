id: TMA-ANDROID-1.6
title: Ensure 'Lock Screen Message' is configured
description: 'Set a message to be displayed on the locked screen. The recommended state for this setting is: Configure Lock Screen Message.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.6 Ensure 'Lock Screen Message' is configured
audit:
  type: manual
  command: 'Follow the below steps and verify that Lock screen message is set: phone''s Settings app > Display > Advanced > Lock screen display > Lock screen message > Verify that a suitable Lock screen message is set.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to set up a Lock screen message: phone''s Settings app > Display > Advanced > Lock screen display > Lock screen message > Write your message and tap Save.'
