id: TMA-ANDROID-1.10
title: Ensure 'Install unknown apps' is set to 'Disabled'
description: 'The Install unknown apps setting in Android allows users to install apps from sources other than the Google Play Store. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.10 Ensure 'Install unknown apps' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Install unknown apps is Disabled: phone''s Settings app > Apps & notifications > Advanced > Special app access > Install unknown apps > Verify that all of the apps in the list show Not allowed.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Install unknown apps: phone''s Settings app > Apps & notifications > Advanced > Special app access > Install unknown apps > any app showing Allowed > Toggle Allow from this source to OFF position.'
