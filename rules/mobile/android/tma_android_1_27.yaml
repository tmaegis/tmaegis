id: TMA-ANDROID-1.27
title: Ensure that no 3rd party keyboards are installed
description: A number of 3rd party custom keyboards are available for Android devices.
target: android
level: 1
severity: low
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.27 Ensure that no 3rd party keyboards are installed
audit:
  type: manual
  command: 'Verify that no 3rd Party keyboards are installed: phone''s Settings app > Apps & Notifications > See All Apps > Review the list of installed apps and verify that no 3rd party keyboards are installed.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to uninstall 3rd party keyboards: phone''s Settings app > Apps & Notifications > See All Apps > Review the list of installed apps and remove any 3rd party keyboards that are installed.'
