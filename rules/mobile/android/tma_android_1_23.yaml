id: TMA-ANDROID-1.23
title: Ensure 'Add users from lock screen' is set to 'Disabled'
description: 'The Add users from lock screen setting allows users to add new users to the device from the lock screen without having to enter the primary user''s password. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.23 Ensure 'Add users from lock screen' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Add users from lock screen setting is Disabled: phone''s Settings app > System > Advanced > Multiple users > Verify that Add users from lock screen setting is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Add users from lock screen setting: phone''s Settings app > System > Advanced > Multiple users > Toggle Add users from lock screen setting to OFF position.'
