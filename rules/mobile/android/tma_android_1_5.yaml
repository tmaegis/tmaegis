id: TMA-ANDROID-1.5
title: Ensure 'Power button instantly locks' is set to 'Enabled'
description: 'Pressing the power button should lock the device instantly. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.5 Ensure 'Power button instantly locks' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps and verify that Power button instantly locks is Enabled: phone''s Settings app > Security > Gear icon next to Screen lock > Verify that Power button instantly locks is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable the Power button instantly locks setting: phone''s Settings app > Security > Gear icon next to Screen lock > Toggle Power button instantly locks setting to ON position.'
