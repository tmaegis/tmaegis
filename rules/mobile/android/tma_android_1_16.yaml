id: TMA-ANDROID-1.16
title: Ensure 'Allow remote lock and erase' is set to 'Enabled'
description: 'The allow remote lock and erase setting allows users to remotely lock their device with a new passcode or erase all data in the event of loss or theft. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.16 Ensure 'Allow remote lock and erase' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Allow remote lock and erase setting is Enabled: phone''s Settings app > Security > Device admin apps > Verify that Find My Device is Enabled and Allow remote lock and erase is listed underneath.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Allow remote lock and erase: phone''s Settings app > Security > Device admin apps > Find My Device toggle > Activate this device.'
