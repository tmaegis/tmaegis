id: TMA-ANDROID-1.15
title: Ensure 'Remotely locate this device' is set to 'Enabled'
description: 'The Remotely locate this device setting allows users to locate their lost or stolen device remotely, as long as it is connected to the internet. By enabling this feature, users can easily track the location of their device on a map, lock it remotely with a custom message and phone number, and even erase all data on the device to protect sensitive information. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.15 Ensure 'Remotely locate this device' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Remotely locate this device setting is Enabled: phone''s Settings app > Google > Security > Find My Device > Verify that Remotely locate this device setting is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Remotely locate this device: phone''s Settings app > Google > Security > Find My Device > Toggle Remotely locate this device setting to ON position.'
