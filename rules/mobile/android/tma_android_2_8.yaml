id: TMA-ANDROID-2.8
title: Ensure 'Google Location History' is set to 'Disabled'
description: 'Disable storing device location history. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.8 Ensure 'Google Location History' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Google Location History setting is Disabled: phone''s Settings app > Privacy > Advanced > Activity Controls > Verify that Google Location History setting is turned OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Google Location History setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle Google Location History setting to OFF position.'
