id: TMA-ANDROID-1.2
title: Ensure 'Screen Lock' is set to 'Enabled'
description: 'Enabling the Screen lock setting helps secure Android devices. This setting helps prevent unauthorized access to your device and protects data from being compromised. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.2 Ensure 'Screen Lock' is set to 'Enabled'
audit:
  type: manual
  command: 'Verify that a Pattern, PIN or Password has been set for the device: Settings > Security > Verify that Screen lock has Pattern, PIN or Password underneath the text.'
remediation:
  type: iac_patch
  command: 'To configure a Pattern, PIN or Password for the device: Settings > Security > Screen Lock > Pattern, PIN or Password > Enter a complex Pattern, PIN or Password > Continue > Enter in the same complex Pattern, PIN or Password again > OK.'
