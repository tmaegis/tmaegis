id: TMA-ANDROID-1.20
title: Ensure 'Screen timeout' is set to '2 minutes'
description: 'The Screen timeout setting allows users to specify the amount of time that elapses before the device''s screen automatically turns off. The recommended state for this setting is: 2 Minutes.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.20 Ensure 'Screen timeout' is set to '2 minutes'
audit:
  type: manual
  command: 'Follow the below steps to verify that Screen timeout setting is set to 2 minute: phone''s Settings app > Display > Advanced > Verify that Screen timeout is set to 2 minutes.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to set Screen timeout setting to 2 minutes: phone''s Settings app > Display > Advanced > Screen timeout > on time duration of 2 minutes.'
