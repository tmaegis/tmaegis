id: TMA-ANDROID-1.17
title: Ensure 'Scan device for security threats' is set to 'Enabled'
description: 'The Scan device for security threats feature on Android Google is a built-in security feature that allows users to scan their device for any potential security threats. When this feature is enabled, the device will periodically scan for malware, spyware, and other potential security threats. The recommended state for this setting is: Enabled'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.17 Ensure 'Scan device for security threats' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Scan device for security threats setting is Enabled: phone''s Settings app > Google > Security > Google Play Protect > Settings Gear icon > Verify that Scan device for security threats setting is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Scan device for security threats: phone''s Settings app > Google > Security > Google Play Protect > Settings Gear icon > Toggle Scan device for security threats setting to ON position.'
