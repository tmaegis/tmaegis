id: TMA-ANDROID-2.10
title: Ensure 'Wi-Fi scanning' Is 'Disabled'
description: Wi-Fi scanning is a feature that allows your device to continuously scan for nearby Wi-Fi networks even when Wi-Fi is turned off. While it's used to improve location accuracy for services like Google Maps and Find My Phone, it also presents some security and privacy risks.
target: android
level: 1
severity: medium
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.10 Ensure 'Wi-Fi scanning' Is 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Wi-Fi assistant is Disabled: phone''s Settings app > Location > Location services > Wi-Fi scanning > Verify that Wi-Fi scanning is turned OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Wi-Fi assistant: phone''s Settings app > Location > Location services > Wi-Fi scanning > Toggle Wi-Fi scanning to OFF position.'
