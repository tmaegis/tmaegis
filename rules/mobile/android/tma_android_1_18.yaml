id: TMA-ANDROID-1.18
title: Ensure 'Improve harmful app detection' is set to 'Enabled'
description: 'The Improve harmful app detection setting enables Google to scan apps on the device in real-time, analyze their behavior, and compare them against a database of known malicious apps. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.18 Ensure 'Improve harmful app detection' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Improve harmful app detection setting is Enabled: phone''s Settings app > Google > Security > Google Play Protect > Verify that Improve harmful app detection setting is Enabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Improve harmful app detection: phone''s Settings app > Google > Security > Google Play Protect > Toggle Improve harmful app detection setting to ON position.'
