id: TMA-ANDROID-1.8
title: Ensure 'Show passwords' is set to 'Disabled'
description: 'This setting controls whether passwords typed into a user''s Android device are visible on screen or hidden. When this setting is disabled, the password is concealed, and only the most recent character is visible for a short time after it has been pressed. The recommended state for this setting is: Disabled.'
target: android
level: 2
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.8 Ensure 'Show passwords' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify Show passwords is set to Disabled: phone''s Settings app > Privacy > Verify that Show passwords slider is OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Show passwords: phone''s Settings app > Privacy > Toggle Show passwords to OFF position.'
