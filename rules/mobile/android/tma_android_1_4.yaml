id: TMA-ANDROID-1.4
title: Ensure 'Automatically Lock' is set to 'Immediately'
description: 'Immediately lock the phone as soon as the device goes to sleep. The recommended state for this setting is: Immediately.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.4 Ensure 'Automatically Lock' is set to 'Immediately'
audit:
  type: manual
  command: 'Follow the below steps and verify that Automatically Look is set to Immediately: phone''s Settings app > Security > Gear icon next to Screen lock > Verify that Automatically lock has a text Immediately after sleep underneath it.'
remediation:
  type: iac_patch
  command: 'Follow the below steps and set Automatically Lock to Immediately: phone''s Settings app > Security > Gear icon next to Screen lock > Automatically lock > Immediately.'
