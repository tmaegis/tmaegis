id: TMA-ANDROID-3.3
title: Ensure 'Allow third-party cookies' is set to 'Disabled'
description: 'A third-party cookie is sent by a domain that differs from the domain in the browser''s address bar. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: low
tags:
- android
- chrome
reference: CIS Google Android Benchmark v1.6.0 - 3.3 Ensure 'Allow third-party cookies' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Allow third-party cookies is Disabled: Chrome Icon > Menu Icon > Settings > Site settings > Verify that Allow third-party cookies displays Allowed, except third- party.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to Disabled the Allow third-party cookies option: Chrome Icon > Menu Icon > Settings > Site settings > Allow third-party cookies > Uncheck the Allow third-party cookies checkbox.'
