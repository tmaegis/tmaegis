id: TMA-ANDROID-2.9
title: Ensure 'Opt out of Ads Personalization' is set to 'Enabled'
description: 'The Opt out of Ads Personalization setting allows users to control how their data is used for personalized advertising. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.9 Ensure 'Opt out of Ads Personalization' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Opt out of Ads Personalization setting is Enabled: phone''s Settings app > Google > Ads > Verify that Opt out of Ads Personalization setting is turned ON.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to enable Opt out of Ads Personalization setting: phone''s Settings app > Google > Ads > Toggle Opt out of Ads Personalization setting to ON position.'
