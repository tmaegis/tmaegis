id: TMA-ANDROID-1.9
title: Ensure 'Developer Options' is set to 'Disabled'
description: 'The Developer Options is a hidden settings menu on Android devices that provides advanced tools and options for developers and advanced users. The recommended state for this setting is: Disabled.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.9 Ensure 'Developer Options' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Developer Options is Disabled: phone''s Settings app > System > Advanced > Developer options > Verify that it is OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Developer Options: phone''s Settings app > System > Advanced > Developer options > Toggle it to OFF position.'
