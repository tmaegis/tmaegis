id: TMA-ANDROID-1.11
title: Do not root a user device
description: 'Rooting an Android device means gaining administrative access to the device''s system files and settings. This allows users to install custom firmware, modify system files, and perform other advanced operations that are not possible with a standard, unrooted device. The recommended state for this setting is: Do not Root.'
target: android
level: 1
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.11 Do not root a user device
audit:
  type: manual
  command: Identifying a rooted device is not straightforward. You may need to install a terminal or root checker app to detect rooted devices. Alternatively, the device manufacturer may provide documentation describing how to detect rooting.
remediation:
  type: iac_patch
  command: Follow your device manufacturer documentation to completely un-root a user device.
