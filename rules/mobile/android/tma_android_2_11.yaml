id: TMA-ANDROID-2.11
title: Ensure 'Bluetiooth' scanning' Is 'Disabled'
description: Bluetooth scanning allows the device to find nearby Bluetooth devices and services, even when Bluetooth is turned off. This feature, part of location services, is mainly for improving location accuracy but carries significant security and privacy risks.
target: android
level: 1
severity: medium
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.11 Ensure 'Bluetiooth' scanning' Is 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Wi-Fi assistant is Disabled: phone''s Settings app > Location > Location services > Bluetooth scanning > Verify that Bluetooth scanning is turned OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Wi-Fi assistant: phone''s Settings app > Location > Location services > Bluetooth scanning > Toggle Bluetooth scanning to OFF position.'
