id: TMA-ANDROID-2.5
title: Ensure 'Voice & Audio Activity' is set to 'Disabled'
description: 'Disable saving your voice and other audio to your Google Account. The recommended state for this setting is: Disabled. Note: This setting is applicable only for Google Pixel line of devices.'
target: android
level: 1
severity: low
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.5 Ensure 'Voice & Audio Activity' is set to 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Voice & Audio Activity setting is Disabled: phone''s Settings app > Privacy > Advanced > Activity Controls > Verify that Voice & Audio Activity setting is Disabled.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Voice & Audio Activity setting: phone''s Settings app > Privacy > Advanced > Activity Controls > Toggle Voice & Audio Activity setting to OFF position.'
