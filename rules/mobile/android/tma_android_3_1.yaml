id: TMA-ANDROID-3.1
title: Ensure 'Microphone' is set to 'Enabled'
description: 'This setting controls if a site asks before accessing the microphone. The recommended state for this setting is: Enabled.'
target: android
level: 1
severity: low
tags:
- android
- chrome
reference: CIS Google Android Benchmark v1.6.0 - 3.1 Ensure 'Microphone' is set to 'Enabled'
audit:
  type: manual
  command: 'Follow the below steps to verify that Microphone is Enabled: Chrome Icon > Menu Icon > Settings > Site settings > Verify that Microphone displays Ask first.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to Enable the Microphone permission request: Chrome Icon > Menu Icon > Settings > Site settings > Microphone > Toggle to the ON position.'
