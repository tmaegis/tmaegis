id: TMA-ANDROID-2.2
title: Ensure 'Back up to Google Drive' is 'Disabled'
description: 'Disable Backup to Google Drive. The recommended state for this setting is: Disabled.'
target: android
level: 2
severity: medium
tags:
- android
- google-account-privacy
reference: CIS Google Android Benchmark v1.6.0 - 2.2 Ensure 'Back up to Google Drive' is 'Disabled'
audit:
  type: manual
  command: 'Follow the below steps to verify Back up to Google Drive is Disabled: phone''s Settings app > System > Advanced > Backup > Verify that Back up to Google Drive is OFF.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Back up to Google Drive: phone''s Settings app > System > Advanced > Backup > Back up to Google Drive > Toggle it to OFF position > OK on warning popup.'
