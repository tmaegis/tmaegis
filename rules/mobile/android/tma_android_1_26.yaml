id: TMA-ANDROID-1.26
title: Ensure 'Bluetooth' Pairing is Configured
description: 'Bluetooth provides wireless connections to a wide range of devices like handsfree headsets, internet sharing and data transfer. The recommended state for Bluetooth is: Disabled.'
target: android
level: 1
severity: medium
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.26 Ensure 'Bluetooth' Pairing is Configured
audit:
  type: manual
  command: 'Verify that Bluetooth is configured according to site policies: phone''s Settings app > Connected Devices > Connection Preferences > Bluetooth > Verify that Bluetooth is turned off or that all paired devices are authorized.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Bluetooth: phone''s Settings app > Connected Devices > Connection Preferences > Bluetooth > Toggle Bluetooth setting to OFF position.'
