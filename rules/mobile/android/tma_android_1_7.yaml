id: TMA-ANDROID-1.7
title: Do not connect to untrusted Wi-Fi networks
description: 'The Do not connect to untrusted Wi-Fi networks setting protects users from potential security threats when connecting to Wi-Fi networks. When this setting is enabled, the device will automatically avoid connecting to any Wi-Fi networks that it deems untrusted, based on a set of predefined criteria. The recommended state for this setting is: Only connect to trusted networks.'
target: android
level: 2
severity: high
tags:
- android
- device-settings
reference: CIS Google Android Benchmark v1.6.0 - 1.7 Do not connect to untrusted Wi-Fi networks
audit:
  type: manual
  command: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an untrusted network: phone''s Settings app > Network & internet > Verify that the Wi-Fi switch is in the Off position or is connected to a trusted network only.'
remediation:
  type: iac_patch
  command: 'Follow the below steps to disable Wi-Fi or connect to a trusted network: phone''s Settings app > Network & internet > Toggle Wi-Fi setting to the Off position or connect to a trusted network.'
