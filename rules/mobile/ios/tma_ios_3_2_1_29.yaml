id: TMA-IOS-3.2.1.29
title: Ensure "Allow password sharing (supervised only)" is set to "Disabled"
description: 'This recommendation pertains to sharing credentials between devices, such as through AirDrop. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.29 Ensure "Allow password sharing (supervised only)" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow password sharing (supervised only) is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Restrictions > Confirm Password sharing is not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow password sharing (supervised only) > Deploy the Configuration Profile.
