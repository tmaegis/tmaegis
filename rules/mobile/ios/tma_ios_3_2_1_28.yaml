id: TMA-IOS-3.2.1.28
title: Ensure "Allow proximity based password sharing requests" is set to "Disabled"
description: 'This recommendation pertains to preventing proximity-based password sharing from institutionally-owned devices. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.28 Ensure "Allow proximity based password sharing requests" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow proximity based password sharing requests is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Proximity password requests not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow proximity based password sharing requests > Deploy the Configuration Profile.
