id: TMA-IOS-2.9.1
title: Ensure External Intelligence Extensions Is Disabled
description: 'The External Intelligence Extensions allows Apple Intelligence to interface with 3rd part generative AI tools. Apple''s external intelligence extension represents a calculated risk. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.9.1 Ensure External Intelligence Extensions Is Disabled
audit:
  type: manual
  command: From the device, Settings > General > VPN & Device Management > Verify that an installed configuration profile has a profile installed with the restriction External intelligence integrations not allowed > Verify that an installed configuration profile also has a profile installed with the restriction Sign-ins with external intelligence integrations not allowed.
remediation:
  type: iac_patch
  command: 'Profile Method: Create or edit a configuration profile with the following information: The PayloadType string is com.apple.applicationaccess > The key to include is allowExternalIntelligenceIntegrations > The key must be set to <false/> > The second key to include is allowExternalIntelligenceIntegrationsSignIn > The key must be set to <false/>.'
