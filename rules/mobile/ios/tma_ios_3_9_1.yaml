id: TMA-IOS-3.9.1
title: Ensure "If Lost, Return to..." Message is "Configured"
description: 'This recommendation pertains to configuring a lock screen message. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.9.1 Ensure "If Lost, Return to..." Message is "Configured"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Lock Screen Message tab > verify that in the "If Lost, Return to..." Message is configured appropriately. Or, from the device: Wake the device > Verify on the lock screen that an appropriate message is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Lock Screen Message tab > in the "If Lost, Return to..." Message field, configure an appropriate message > Deploy the Configuration Profile.
