id: TMA-IOS-3.4.6
title: Ensure "Maximum number of failed attempts" is set to "6"
description: 'This recommendation pertains to the number of attempted logins before automatic deletion of a device''s cryptographic key. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.4.6 Ensure "Maximum number of failed attempts" is set to "6"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that Maximum number of failed attempts is set to 6. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Max failed attempts is set to 6.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > set the Maximum number of failed attempts to 6 > Deploy the Configuration Profile.
