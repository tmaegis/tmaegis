id: TMA-IOS-4.1.5
title: Review Airprint
description: 'This recommendation pertains to Apple''s AirPrint, a feature for printing without installing printer-specific drivers. Profile: Level 2 - End-User Owned Devices, Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.1.5 Review Airprint
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow AirPrint (supervised only) is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm AirPrint is not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow AirPrint (supervised only) > Deploy the Configuration Profile.
