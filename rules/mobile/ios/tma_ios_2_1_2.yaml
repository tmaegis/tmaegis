id: TMA-IOS-2.1.2
title: Ensure "Controls when the profile can be removed" is set to "Always"
description: 'This recommendation pertains to the removal of a given configuration profile. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.1.2 Ensure "Controls when the profile can be removed" is set to "Always"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > General tab > verify that under the heading Security, the menu Controls when the profile can be removed is set to Always. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Verify Remove Profile is displayed near the bottom of the screen.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > General tab > under the heading Security, set the menu Controls when the profile can be removed to Always > Deploy the Configuration Profile.
