id: TMA-IOS-4.1.1
title: Review Manage Sharing & Access
description: 'Managing Sharing & Access is a new feature available with iOS 16, which allows users to review what is being shared with people and apps via a wizard to determine if current settings are adequate or if some access needs to be revoked. It also allows the review of settings related to a user''s Apple ID. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.1.1 Review Manage Sharing & Access
audit:
  type: manual
  command: 'From the device: Settings > Privacy & Secuurity > Safety Check > Manage Sharing & Access > Continue > Go through the 3 steps to review the settings > Done at the end of the procedure.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Privacy & Secuurity > Safety Check > Manage Sharing & Access > Continue > Remove sharing from any applications or people that are outside your organization''s requirements > Done at the end of the procedure.'
