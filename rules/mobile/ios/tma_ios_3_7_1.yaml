id: TMA-IOS-3.7.1
title: Ensure "Allow user to move messages from this account" is set to "Disabled"
description: 'This recommendation pertains to whether a message can be moved from an institutionally-configured mail account to an end user-configured mail account. It also limits forwarding or replying from a different account than the one from which the message originated. Note: This recommendation only applies if an institutionally-configured mail account resides on the device. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.7.1 Ensure "Allow user to move messages from this account" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Mail tab > verify that the checkbox for Allow user to move messages from this account is unchecked. From the device, there is no audit mechanism.'
remediation:
  type: iac_patch
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Mail tab > uncheck the checkbox for Allow user to move messages from this account.'
