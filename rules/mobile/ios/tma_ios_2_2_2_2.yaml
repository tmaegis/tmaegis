id: TMA-IOS-2.2.2.2
title: Ensure "Accept cookies" is set to "From websites I visit" or "From current website only"
description: 'This recommendation pertains to the automatic acceptance of third-party cookies. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.2.2 Ensure "Accept cookies" is set to "From websites I visit" or "From current website only"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Apps, the menu for Accept cookies is set to From websites I visit or From current website only. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Cookie policy enforced is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Apps, set the Accept cookies menu to From websites I visit or From current website only > Deploy the Configuration Profile.
