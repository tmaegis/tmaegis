id: TMA-IOS-2.9.3
title: Ensure Mail Summarization Is Disabled
description: 'Apple Intelligence''s Mail summarization feature uses AI to quickly condense long emails or entire email threads into a few key sentences or bullet points. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.9.3 Ensure Mail Summarization Is Disabled
audit:
  type: manual
  command: Currently there is no specific way to verify that Main Summarization is disabled through either Apple Configurator 2 or through the GUI.
remediation:
  type: iac_patch
  command: 'Profile Method: Create or edit a configuration profile with the following information: The PayloadType string is com.apple.applicationaccess > The key to include is allowMailSummary > The key must be set to <false/>.'
