id: TMA-IOS-4.6
title: Review "Mail Privacy Protection" settings
description: 'Mail Privacy Protection helps protect user privacy by preventing email senders from learning information about the activity they engage with using the Mail application. When turned on, this feature hides user IP addresses. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.6 Review "Mail Privacy Protection" settings
audit:
  type: manual
  command: 'From the device: Settings > Mail > Privacy Protection > Verify that Protect Mail Activity is enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Mail > Privacy Protection > Enable Protect Mail Activity.'
