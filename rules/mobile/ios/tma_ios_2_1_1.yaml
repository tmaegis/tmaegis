id: TMA-IOS-2.1.1
title: Ensure a "Consent Message" has been "Configured"
description: 'This recommendation pertains to the configuration of a consent message shown at the time of a configuration profile installation. Typically, the enrollment of devices into a Mobile Device Management (MDM) solution requires users to provide their approval. Such approval can waive the need of a consent message. The enrolled MDM must be the organization approved MDM. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.1.1 Ensure a "Consent Message" has been "Configured"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > General tab > verify that under the heading Consent Message, there is an appropriate consent message configured. There is no method to determine if the installed configuration profile included a consent message from the device.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > General tab > under the heading Consent Message, insert an appropriate consent message > Deploy the Configuration Profile.
