id: TMA-IOS-3.2.1.7
title: Ensure "Allow USB drive access in Files app" is set to "Disabled"
description: 'This recommendation pertains to preventing the Files app from accessing USB media. Profile: Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.7 Ensure "Allow USB drive access in Files app" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow USB drive access in Files app is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm USB drives not accessible in Files app is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow USB drive access in Files app > Deploy the Configuration Profile.
