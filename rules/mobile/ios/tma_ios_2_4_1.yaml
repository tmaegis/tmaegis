id: TMA-IOS-2.4.1
title: Ensure "Allow simple value" is set to "Disabled"
description: 'This recommendation pertains to passcode requirements. A simple passcode is defined as containing repeated characters, or increasing/decreasing characters (such as 123 or CBA). Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.4.1 Ensure "Allow simple value" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that the checkbox for Allow simple value is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Simple passcodes allowed displays No.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > uncheck the checkbox for Allow simple value > Deploy the Configuration Profile.
