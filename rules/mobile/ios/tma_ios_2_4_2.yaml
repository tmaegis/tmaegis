id: TMA-IOS-2.4.2
title: Ensure "Require alphanumeric value" is set to "Enabled"
description: 'Passwords set by users must contain at least one letter and one number. Profile: Level 2 - End-User Owned Devices, Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.4.2 Ensure "Require alphanumeric value" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that the checkbox for Require alphanumeric value is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Require alphanumeric value displays Yes.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > check the checkbox for Require alphanumeric value > Deploy the Configuration Profile.
