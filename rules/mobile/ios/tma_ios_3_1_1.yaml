id: TMA-IOS-3.1.1
title: Ensure "Controls when the profile can be removed" is set to "Never"
description: 'This recommendation pertains to the removal of a given configuration profile. Typically, the enrollment of devices into a Mobile Device Management (MDM) does not allow a user to remove any managed configurations. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.1.1 Ensure "Controls when the profile can be removed" is set to "Never"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > General tab > verify that under the heading Security, the menu Controls when the profile can be removed is set to Never. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Verify Remove Profile is not displayed near the bottom of the screen.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > General tab > under the heading Security, set the menu Controls when the profile can be removed to Never > Deploy the Configuration Profile.
