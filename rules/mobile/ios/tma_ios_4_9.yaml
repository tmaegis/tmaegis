id: TMA-IOS-4.9
title: Ensure the latest iOS device architecture is used by high- value targets
description: 'This recommendation pertains to the physical device(s) used by high-value targets. Profile: Level 2 - End-User Owned Devices, Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: medium
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.9 Ensure the latest iOS device architecture is used by high- value targets
audit:
  type: manual
  command: Ensure the device(s) deployed to high-value targets are of the latest generation architecture.
remediation:
  type: iac_patch
  command: 'Replace the device(s). As of publication, the latest iOS device architectures are: • iPhone 13 and iPhone 13 Mini using the Apple A15 Bionic processor • iPhone 13 Pro and iPhone 13 Pro Max using the Apple A15 Bionic processor • iPad Mini 8.3" using the Apple A15 Bionic processor • iPad 10.2" using the Apple A13 Bionic processor • iPad Air 10.9" using the Apple A14 Bionic processor • iPad Pro 11" and 12.9" using the Apple M1 processor'
