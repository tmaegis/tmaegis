id: TMA-IOS-4.1.3
title: Review Lockdown Mode
description: 'Lockdown Mode is a new operational model made available with iOS. It ensures a high level of security by limiting or disabling a nummber of features of the device. Lockdown Mode blocks most attachment types in Messages, blocks FaceTime calls from non-contacts, limits web browsing functions, prevents configuration profiles from being installed, and more, with a full list available in our Lockdown article. Profile: Level 2 - End-User Owned Devices, Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.1.3 Review Lockdown Mode
audit:
  type: manual
  command: 'From the device: Settings > Privacy & Security > Under Security, verify the status of Lockdown Mode.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Privacy & Security > Lockdown Mode > Turn On Lockdown Mode > Turn On Lockdown Mode > Turn On & Restart > Enter the device passcode.'
