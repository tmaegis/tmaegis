id: TMA-IOS-2.2.1.6
title: Ensure "Force automatic date and time" is set to "Enabled"
description: 'It is possible to automatically set the date and time on devices running iOS 12 and later. The time zone updates only when the device can determine its location, such as when a device has a cellular connection or a Wi-Fi connection with location services enabled. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.1.6 Ensure "Force automatic date and time" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality the checkbox for Force automatic date and time is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Automatic date & time enforced is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, check the checkbox for Force automatic date and time > Deploy the Configuration Profile.
