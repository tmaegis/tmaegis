id: TMA-IOS-4.1.4
title: Ensure "App Privacy Report" is enabled
description: 'App Privacy Report is a tool that provides details about how often apps access your data, such as location, camera, microphone, and more. The tool also returns information about each app''s network activity and website network activity, as well as the web domains that all apps contact most frequently. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.1.4 Ensure "App Privacy Report" is enabled
audit:
  type: manual
  command: 'From the device: Settings > Privacy & Security > App Privacy Report > Verify the status of App Privacy Report.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Privacy & Security > services you want to disable or modify > Set any/all applications to the settings for your organization''s requirements.'
