id: TMA-IPADOS-4.1.6
title: Ensure "Stolen Device Protection" Is Enabled
description: 'With the release of iOS and iPadOS 17.3, Apple added the ability to restrict when a passcode can be reset. Turning this on will protect a user if their phone is stolen and the thief has obtained the user''s passcode. If the passcode is compromised, a user''s iCloud credentials can be reset or altered, giving access to the user''s AppleID. Profile: Level 2 - End-User Owned Devices. iPadOS-specific: applies to iPad devices (differs from the iOS 26 benchmark item).'
target: ios
level: 2
severity: medium
tags:
- ios
- ipados
- device-settings
reference: CIS Apple iPadOS 26 Benchmark v1.0.0 - 4.1.6 Ensure "Stolen Device Protection" Is Enabled
audit:
  type: manual
  command: 'From the device: Settings > Face ID & Passcode > Enter the passcode > Stolen Device Protection > Verify Stolen Device Protection is enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Face ID & Passcode > Enter the passcode > Stolen Device Protection > Enable Stolen Device Protection.'
