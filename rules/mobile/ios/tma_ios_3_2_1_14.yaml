id: TMA-IOS-3.2.1.14
title: Ensure "Allow installing configuration profiles" is set to "Disabled"
description: 'This recommendation pertains to the installation of additional configuration profiles. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.14 Ensure "Allow installing configuration profiles" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow installing configuration profiles is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Installing configuration profiles not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow installing configuration profiles > Deploy the Configuration Profile.
