id: TMA-IOS-3.2.1.19
title: Ensure "Allow pairing with non-Configurator hosts" is set to "Disabled"
description: 'This recommendation pertains to allowing data communication with a host computer. Profile: Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.19 Ensure "Allow pairing with non-Configurator hosts" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow pairing with non-Configurator hosts is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Pairing with iTunes not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow pairing with non-Configurator hosts > Deploy the Configuration Profile.
