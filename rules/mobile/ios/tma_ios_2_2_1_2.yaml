id: TMA-IOS-2.2.1.2
title: Ensure "Allow managed apps to store data in iCloud" is set to "Disabled"
description: 'This recommendation pertains to managed applications storing and syncing data through iCloud. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.1.2 Ensure "Allow managed apps to store data in iCloud" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow managed apps to store data in iCloud is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Managed apps cloud sync not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow managed apps to store data in iCloud > Deploy the Configuration Profile.
