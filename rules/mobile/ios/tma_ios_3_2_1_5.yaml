id: TMA-IOS-3.2.1.5
title: Review "Allow iCloud Keychain" settings
description: 'iCloud Keychain allows passwords associated with an Apple Account to be used by the authenticated user for their Apple Account. If an organization''s users are using personal Apple Accounts with organization owned devices, than organizations should review whether enterprise passwords/passkeys/accounts are being stored in users'' personal iCloud Keychain. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.5 Review "Allow iCloud Keychain" settings
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow iCloud Keychain is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm iCloud Keychain not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow iCloud Keychain > Deploy the Configuration Profile.
