id: TMA-IOS-4.5
title: Review "iCloud Private Relay" settings
description: 'iCloud Private Relay is a service offered by Apple as part of an iCloud+ subscription. It allows users on iOS 15, iPadOS 15, macOS Monterey, or later versions of iOS, iPadOS, and macOS to browse the Web more privately by hiding the user''s actual IP address. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.5 Review "iCloud Private Relay" settings
audit:
  type: manual
  command: 'From the device: Settings > <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is displayed beneath > iCloud > Private Relay > Verify that Private Relay is enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is displayed beneath > iCloud > Private Relay > Enable Private Relay.'
