id: TMA-IOS-3.2.1.26
title: Ensure "Force Apple Watch wrist detection" is set to "Enabled"
description: 'This recommendation pertains to configuring wrist detection on paired Apple Watches. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.26 Ensure "Force Apple Watch wrist detection" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Force Apple Watch wrist detection is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Wrist detection enforced on Apple Watch is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, check the checkbox for Force Apple Watch wrist detection > Deploy the Configuration Profile.
