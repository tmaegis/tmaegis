id: TMA-IOS-4.3
title: Ensure "Install iOS Updates" of "Automatic Updates" is set to "Enabled"
description: 'This recommendation pertains to the automatic installation of operating system updates. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.3 Ensure "Install iOS Updates" of "Automatic Updates" is set to "Enabled"
audit:
  type: manual
  command: 'From the device: Settings > General > Software Updates > Automatic Updates > Verify that Download iOS Updates and Install iOS Updates are enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > General > Software Updates > Automatic Updates > Enable Download iOS Updates and Install iOS Updates.'
