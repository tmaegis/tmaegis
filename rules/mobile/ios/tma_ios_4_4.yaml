id: TMA-IOS-4.4
title: Ensure "Software Update" returns "Your software is up to date."
description: 'This recommendation pertains to updating and upgrading the operating system of a given device. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.4 Ensure "Software Update" returns "Your software is up to date."
audit:
  type: manual
  command: 'From the device: Settings > General > Software Update > Verify that iOS is up to date. is returned.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > General > Software Update > Install or Download and Install and then allow device to complete the installation.'
