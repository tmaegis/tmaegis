id: TMA-IPADOS-2.2.1.1
title: Ensure "Allow voice dialing while device is locked" is set to "Disabled"
description: 'This recommendation pertains to initiating phone calls while a device is locked. Voice dialing is handled separately from Siri. Profile: Level 1 - End-User Owned Devices. iPadOS-specific: applies to iPad devices (differs from the iOS 26 benchmark item).'
target: ios
level: 1
severity: low
tags:
- ios
- ipados
- end-user-owned
reference: CIS Apple iPadOS 26 Benchmark v1.0.0 - 2.2.1.1 Ensure "Allow voice dialing while device is locked" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow voice dialing while device is locked is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Voice dialing while locked not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow voice dialing while device is locked > Deploy the Configuration Profile.
