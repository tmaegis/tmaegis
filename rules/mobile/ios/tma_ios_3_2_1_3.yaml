id: TMA-IOS-3.2.1.3
title: Ensure "Allow iCloud backup" is set to "Disabled"
description: 'This recommendation pertains to allowing iCloud backup. This recommendation does block educational institutions from being able to use iCloud backup with devices issued to students. Because of this, we do not recommend educational institutions enable this recommendation for those devices. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.3 Ensure "Allow iCloud backup" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow iCloud backup is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm iCloud backup not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow iCloud backup > Deploy the Configuration Profile.
