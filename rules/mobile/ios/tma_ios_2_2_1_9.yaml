id: TMA-IOS-2.2.1.9
title: Ensure "Treat AirDrop as unmanaged destination" is set to "Enabled"
description: 'This recommendation pertains to AirDrop in the context of Apple''s managed app implementation. The terms "managed" and "unmanaged" refer to application classifications made through Managed Open In, a feature introduced in iOS 7. Managed Open In provides for data containerization. Institutionally-provisioned applications are designated as managed. Applications elected by the end user are designated as unmanaged. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.1.9 Ensure "Treat AirDrop as unmanaged destination" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Treat AirDrop as unmanaged destination is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Sharing managed documents using AirDrop not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, check the checkbox for Treat AirDrop as unmanaged destination > Deploy the Configuration Profile.
