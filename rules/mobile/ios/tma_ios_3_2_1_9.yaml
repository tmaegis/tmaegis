id: TMA-IOS-3.2.1.9
title: Ensure "Force encrypted backups" is set to "Enabled"
description: 'This recommendation pertains to iTunes backup encryption of iOS and iPadOS devices. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.9 Ensure "Force encrypted backups" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Force encrypted backups is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Encrypted backups enforced is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, check the checkbox for Force encrypted backups > Deploy the Configuration Profile.
