id: TMA-IOS-3.4.3
title: Ensure "Minimum passcode length" is set to a value of "6" or greater
description: 'This recommendation pertains to minimum passcode length. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.4.3 Ensure "Minimum passcode length" is set to a value of "6" or greater
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that the Minimum passcode length is set to 6,. or greater. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Minimum length displays 6, or greater.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > set the Minimum passcode length to 6, or greater > Deploy the Configuration Profile.
