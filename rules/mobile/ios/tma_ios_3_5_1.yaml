id: TMA-IOS-3.5.1
title: Ensure "Disable Association MAC Randomization" is "Configured"
description: 'This recommendation pertains to disabling MAC randomization as needed. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.5.1 Ensure "Disable Association MAC Randomization" is "Configured"
audit:
  type: manual
  command: 'This is a per-network configuration setting. The auditor will need to determine which solution is appropriate for a specific network. From the Configuration Profile: Apple Configurator > Configuration Profile > Wi-Fi tab > relevant Wi-Fi configuration > Verify that the checkbox for Disable Association MAC Randomization is checked. From the device: Settings > Wi-Fi > relevant network > Ensure Private Addressis disabled.'
remediation:
  type: iac_patch
  command: 'This remediation procedure cannot be accomplished with a checkbox, it needs to be applied on a per-network basis as appropriate. From the Configuration Profile: Apple Configurator > Configuration Profile > Wi-Fi tab > relevant Wi-Fi configuration > check the checkbox for Disable Association MAC Randomization > Deploy the Configuration Profile. From the device: Settings > Wi-Fi > relevant network > Disable the option Private Address.'
