id: TMA-IOS-2.4.5
title: Ensure "Maximum grace period for device lock" is set to "Immediately"
description: 'This recommendation pertains to the amount of time a device may be unlocked without entering a passcode after that device has been locked. Devices with TouchID enabled do not allow a grace period. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.4.5 Ensure "Maximum grace period for device lock" is set to "Immediately"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that Maximum grace period for device lock is set to Immediately. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Max grace period displays Immediately.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > set the Maximum grace period for device lock to Immediately > Deploy the Configuration Profile.
