id: TMA-IOS-3.2.1.25
title: Ensure "Require Touch ID / Face ID authentication before AutoFill" is set to "Enabled"
description: 'This recommendation pertains to forcing re-authentication at each AutoFill operation. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.25 Ensure "Require Touch ID / Face ID authentication before AutoFill" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Require Touch ID / Face ID authentication before AutoFill is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Authentication before Auto Filling passwords enforced is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, check the checkbox for Require Touch ID / Face ID authentication before AutoFill > Deploy the Configuration Profile.
