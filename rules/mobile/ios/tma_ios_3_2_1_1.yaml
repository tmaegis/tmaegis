id: TMA-IOS-3.2.1.1
title: Ensure "Allow screenshots and screen recording" is set to "Disabled"
description: 'This recommendation pertains to limiting screenshots and screen recordings. Profile: Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.1 Ensure "Allow screenshots and screen recording" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow screenshots and screen recording is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Screen capture and recording not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow screenshots and screen recording > Deploy the Configuration Profile.
