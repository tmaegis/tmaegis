id: TMA-IOS-4.7
title: Ensure "Automatic Downloads" of "App Updates" is set to "Enabled"
description: 'This recommendation pertains to the automatic installation of application updates. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.7 Ensure "Automatic Downloads" of "App Updates" is set to "Enabled"
audit:
  type: manual
  command: 'From the device: Settings > App Store > Verify that under AUTOMATIC DOWNLOADS, App Updates is enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > iTunes & App Store > Under AUTOMATIC DOWNLOADS, enable App Updates.'
