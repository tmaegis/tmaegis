id: TMA-IOS-3.2.1.27
title: Ensure "Allow setting up new nearby devices" is set to "Disabled"
description: 'This recommendation pertains to Apple''s Quick Start setup feature. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.27 Ensure "Allow setting up new nearby devices" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow setting up new nearby devices is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Proximity Setup to a new device is not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow setting up new nearby devices > Deploy the Configuration Profile.
