id: TMA-IOS-4.10
title: Verify iPhone Mirroring Settings
description: 'iPhone Mirroring is a new feature offered in iOS 18 and macOS 15.0 Sequoia. It allows a macOS device to remotely access an iOS device connected to the same Apple Account. If a user has different Apple Accounts signed into iOS and macOS (ex. a managed Apple Account on macOS and a personal Apple Account on iOS) then there is no ability to mirror the iOS device on the macOS device. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.10 Verify iPhone Mirroring Settings
audit:
  type: manual
  command: 'From the device: Settings > General > AirPlay & Continuity` > Verify that iPhone Mirroring is set to your organization''s requirements.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > General > AirPlay & Continuity` > Set iPhone Mirroring to your organization''s requirements.'
