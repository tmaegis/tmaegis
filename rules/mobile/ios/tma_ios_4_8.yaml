id: TMA-IOS-4.8
title: Ensure "Find My iPhone/iPad" is set to "Enabled" on end user-owned devices
description: 'This recommendation pertains to remote device locating, locking, and erasure by the end user. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.8 Ensure "Find My iPhone/iPad" is set to "Enabled" on end user-owned devices
audit:
  type: manual
  command: 'From the device: Settings > <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is displayed beneath > Find My > Verify Find My iPhone, Find My Network and Send Last Location are enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is displayed beneath > Find My > Enable Find My iPhone, Find My Network and Send Last Location.'
