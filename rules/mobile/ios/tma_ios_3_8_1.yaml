id: TMA-IOS-3.8.1
title: Ensure "Notification Settings" are configured for all "Managed Apps"
description: 'This recommendation pertains to the configuration of notification settings on a per- application basis. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.8.1 Ensure "Notification Settings" are configured for all "Managed Apps"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Notifications tab > verify that each managed app includes a configuration entry. Or, from the device: Settings > Notifications > Verify that managed apps are grayed out to indicate that their notification settings are managed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Notifications tab > Configure and/or click the + to add notification settings on a per-app basis > Deploy the Configuration Profile.
