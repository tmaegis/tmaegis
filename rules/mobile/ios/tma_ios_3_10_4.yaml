id: TMA-IOS-3.10.4
title: Ensure Writing Tools Is Disabled
description: 'Apple Intelligence Writing Tools are a suite of AI-powered features integrated across iOS, iPadOS, and macOS, enabling users to enhance their text by proofreading for errors, rewriting content to adjust tone or style, summarizing lengthy passages into concise forms, and even composing new text from scratch. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.10.4 Ensure Writing Tools Is Disabled
audit:
  type: manual
  command: Currently there is no specific way to verify that Writing Tools is disabled through either Apple Configurator 2 or through the GUI.
remediation:
  type: iac_patch
  command: 'Profile Method: Create or edit a configuration profile with the following information: The PayloadType string is com.apple.applicationaccess > The key to include is allowWritingTools > The key must be set to <false/>.'
