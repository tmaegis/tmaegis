id: TMA-IOS-3.2.1.4
title: Ensure "Allow iCloud documents & data" is set to "Disabled"
description: 'This recommendation pertains to the storage and syncing of data through iCloud from institutionally-owned devices. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.4 Ensure "Allow iCloud documents & data" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow iCloud documents & data is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Documents in the Cloud not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow iCloud documents & data > Deploy the Configuration Profile.
