id: TMA-IOS-2.6.1
title: Ensure "VPN" is "Configured"
description: 'This recommendation pertains to establishing a virtual private network (VPN) connection when appropriate. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.6.1 Ensure "VPN" is "Configured"
audit:
  type: manual
  command: 'This audit procedure cannot be accomplished with a checkbox verification. As mentioned below, a per-application VPN configuration is the preferred solution, but a system-wide VPN is also acceptable. The auditor will need to determine which solution, and to what extent in the per-application VPN case, is appropriate. From the Configuration Profile: Apple Configurator > Configuration Profile > VPN tab > enter an appropriate VPN configuration > Deploy the Configuration Profile. From the device: Settings > General > VPN > Inspect the configuration.'
remediation:
  type: iac_patch
  command: 'This remediation procedure cannot be accomplished with a checkbox. As mentioned below, a per-application VPN configuration is the preferred option, but a system-wide VPN is also acceptable. An appropriate solution will need to be determined and implemented. From the Configuration Profile: Apple Configurator > Configuration Profile > VPN tab > enter an appropriate VPN configuration > Deploy the Configuration Profile. From the device: Settings > General > VPN > Enter an appropriate VPN configuration.'
