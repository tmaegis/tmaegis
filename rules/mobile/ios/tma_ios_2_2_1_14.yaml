id: TMA-IOS-2.2.1.14
title: Ensure "Show Notification Center in Lock screen" is set to "Disabled"
description: 'This recommendation pertains to the display of Notification Center on the lock screen. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.1.14 Ensure "Show Notification Center in Lock screen" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Show Notification Center in Lock screen is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Notifications view on lock screen not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Show Notification Center in Lock screen > Deploy the Configuration Profile.
