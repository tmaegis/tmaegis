id: TMA-IOS-3.7.2
title: Ensure 'Allow Mail Drop' is set to 'Disabled'
description: 'This recommendation pertains to whether a message attachment can be uploaded and accessed through Apple''s Mail Drop service. NOTE: This recommendation only applies if an institutionally configured mail account resides on the iOS device. Profile: Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.7.2 Ensure 'Allow Mail Drop' is set to 'Disabled'
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > In the left windowpane, click on the Mail tab > In the right windowpane, verify that the checkbox for Allow Mail Drop is unchecked. From the device, there is no audit mechanism.'
remediation:
  type: iac_patch
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > In the left windowpane, click on the Mail tab > In the right windowpane, uncheck the checkbox for Allow Mail Drop.'
