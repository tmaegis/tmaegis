id: TMA-IOS-4.1.2
title: Review Emergency Reset
description: 'Emergency Reset is a one-tap option that allows user protection by revoking everything an iOS device is sharing with all people and apps, including things like location information, home data, photo albums and more. Emergency Reset also allows users to remove all emergency contacts and reset their Apple ID and password so that no one can log into their account. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.1.2 Review Emergency Reset
audit:
  type: manual
  command: There is no way to audit Emergency Reset since it is not a state that can be set.
remediation:
  type: iac_patch
  command: 'From the device: Settings > Privacy & Secuurity > Safety Check > Emergency Reset > Start Emergency Reset > Follow the onscreen instructions until the procedure is complete.'
