id: TMA-IOS-3.2.1.17
title: Ensure "Allow modifying cellular data app settings" is set to "Disabled"
description: 'This recommendation pertains to modifying the use of cellular data by applications. Profile: Level 2 - Institutionally-Owned Devices.'
target: ios
level: 2
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.17 Ensure "Allow modifying cellular data app settings" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow modifying cellular data app settings is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Changing app cellular data usage not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow modifying cellular data app settings > Deploy the Configuration Profile.
