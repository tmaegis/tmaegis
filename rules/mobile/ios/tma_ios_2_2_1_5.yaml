id: TMA-IOS-2.2.1.5
title: Ensure "Allow users to accept untrusted TLS certificates" is set to "Disabled"
description: 'This recommendation pertains to the acceptance of untrusted TLS certificates. Profile: Level 2 - End-User Owned Devices.'
target: ios
level: 2
severity: high
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.1.5 Ensure "Allow users to accept untrusted TLS certificates" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow users to accept untrusted TLS certificates is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Establishing untrusted TLS connections not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow users to accept untrusted TLS certificates > Deploy the Configuration Profile.
