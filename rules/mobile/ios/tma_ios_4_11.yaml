id: TMA-IOS-4.11
title: Ensure RCS Messaging Is Enabled Instead of SMS/MMS Where Available
description: 'Apple added the new messaging standard RCS (Rich Communication Services) in iOS 18. RCS is the modern, industry-standard protocol intended to replace the outdated SMS (Short Message Service) and MMS (Multimedia Message Service) protocols. Profile: Level 1 - End-User Owned Devices, Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- device-settings
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 4.11 Ensure RCS Messaging Is Enabled Instead of SMS/MMS Where Available
audit:
  type: manual
  command: 'From the device: Settings > Apps > Messages > RCS Messaging > Verify RCS Messaging is enabled.'
remediation:
  type: iac_patch
  command: 'From the device: Settings > Apps > Messages > RCS Messaging > Enable RCS Messaging.'
