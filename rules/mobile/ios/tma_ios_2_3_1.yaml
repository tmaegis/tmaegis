id: TMA-IOS-2.3.1
title: Ensure "Managed Safari Web Domains" is "Configured"
description: 'This recommendation pertains to whether Safari, as well as Mobile Device Management (MDM) deployed browsers, will consider certain URL patterns for managed application spaces only. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.3.1 Ensure "Managed Safari Web Domains" is "Configured"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Domains tab > verify that under Managed Safari Web Domains each appropriate URL pattern is configured.'
remediation:
  type: iac_patch
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Domains tab > under Managed Safari Web Domains enter the appropriate URL pattern(s) > Deploy the Configuration Profile.'
