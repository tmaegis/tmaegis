id: TMA-IOS-3.2.1.18
title: Ensure "Allow USB accessories while the device is locked" is set to "Disabled"
description: 'This recommendation pertains to allowing USB devices communicate with a locked device. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.18 Ensure "Allow USB accessories while the device is locked" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, that the checkbox for Allow USB accessories while the device is locked is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm USB accessories while locked allowed is NOT displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow USB accessories while the device is locked > Deploy the Configuration Profile.
