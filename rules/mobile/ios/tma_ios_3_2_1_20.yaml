id: TMA-IOS-3.2.1.20
title: Ensure "Allow documents from managed sources in unmanaged destinations" is set to "Disabled"
description: 'This recommendation pertains to Apple''s managed application implementation. The terms "managed" and "unmanaged" refer to app classifications made through Managed Open In, a feature introduced in iOS 7. Managed Open In provides for data containerization. Institutionally-provisioned apps are designated managed. Apps elected by the end user are designated unmanaged. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.2.1.20 Ensure "Allow documents from managed sources in unmanaged destinations" is set to "Disabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Functionality, the checkbox for Allow documents from managed sources in unmanaged destinations is unchecked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Opening documents from managed to unmanaged apps not allowed is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Functionality, uncheck the checkbox for Allow documents from managed sources in unmanaged destinations > Deploy the Configuration Profile.
