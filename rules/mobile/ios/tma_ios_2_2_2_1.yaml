id: TMA-IOS-2.2.2.1
title: Ensure "Force fraud warning" is set to "Enabled"
description: 'This recommendation pertains to the Safari feature which warns end users about visiting suspected fraudulent websites. Profile: Level 1 - End-User Owned Devices.'
target: ios
level: 1
severity: medium
tags:
- ios
- end-user-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 2.2.2.1 Ensure "Force fraud warning" is set to "Enabled"
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Restrictions tab > verify that under the tab Apps, the checkbox for Force fraud warning is checked. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Confirm Safari fraud warning enforced is displayed.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Restrictions tab > under the tab Apps, check the checkbox for Force fraud warning > Deploy the Configuration Profile.
