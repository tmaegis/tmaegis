id: TMA-IOS-3.4.4
title: Ensure "Maximum Auto-Lock" is set to "2 minutes" or less
description: 'This recommendation pertains to the maximum number of minutes a device may remain inactive before auto-locking. Note: This recommendation refers to maximum auto-lock, consistent with the interface language, but iOS and iPadOS devices treat the auto-lock function as equaling exactly 2 minutes. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: high
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.4.4 Ensure "Maximum Auto-Lock" is set to "2 minutes" or less
audit:
  type: manual
  command: 'From the Configuration Profile: Apple Configurator > Configuration Profile > Passcode tab > verify that the Maximum Auto-Lock is set to 2 minutes. Or, from the device: Settings > General > VPN & Device Management > <_Profile Name_> > Restrictions > Passcode > Confirm Max inactivity displays 2 minutes.'
remediation:
  type: iac_patch
  command: Apple Configurator > Configuration Profile > Passcode tab > set the Maximum Auto-Lock to 2 > Deploy the Configuration Profile.
