id: TMA-IOS-3.10.2
title: Ensure Notes Summarization Is Disabled
description: 'Apple Intelligence''s Notes summarization feature quickly condenses content within the Notes app. This includes summarizing written text you''ve highlighted or, notably, automatically generating summaries from audio recordings taken directly within Notes, like lectures or meetings, helping you grasp key information at a glance. Profile: Level 1 - Institutionally-Owned Devices.'
target: ios
level: 1
severity: low
tags:
- ios
- institutionally-owned
reference: CIS Apple iOS 26 Benchmark v1.0.0 - 3.10.2 Ensure Notes Summarization Is Disabled
audit:
  type: manual
  command: Currently there is no specific way to verify that Notes Summarization is disabled through either Apple Configurator 2 or through the GUI.
remediation:
  type: iac_patch
  command: 'Profile Method: Create or edit a configuration profile with the following information: The PayloadType string is com.apple.applicationaccess > The key to include is allowNotesTranscription > The key must be set to <false/> > The second key to include is allowNotesTranscriptionSummary > The key must be set to <false/>.'
