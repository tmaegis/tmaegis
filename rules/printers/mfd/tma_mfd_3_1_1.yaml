id: TMA-MFD-3.1.1
title: Require PIN for Confidential Job Retrieval
description: Many MFDs can be configured to require a pin or RFID interaction to retrieve print jobs. It is recommended that a PIN, or other authorization mechanism, be required to access print jobs. Leveraging a job retrieval authorization mechanism, such as a PIN, will ensure the confidentiality of print, fax, and scan jobs.
target: printer
level: 1
severity: medium
tags:
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 3.1.1 Require PIN for Confidential Job Retrieval
