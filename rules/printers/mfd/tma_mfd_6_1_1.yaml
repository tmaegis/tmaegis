id: TMA-MFD-6.1.1
title: Enable Print Spooler Access Logging
description: Print spoolers typically contain functionality to log all submitted requests. It is recommended that these facilities be enabled on the print spooler, logging levels be set to ensure adequate details are preserved, and logs be reviewed. When a security event occurs, spooler access logs may provide investigators with information necessary to determine the extent and origin of the event.
target: printer
level: 1
severity: medium
tags:
- access-control
- logging
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 6.1.1 Enable Print Spooler Access Logging
audit:
  type: manual
  command: 'Verify compliance with CIS Multi-Function Device Benchmark v1.0.0 section 6.1.1: Enable Print Spooler Access Logging.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS Multi-Function Device Benchmark v1.0.0 section 6.1.1 to configure: Enable Print Spooler Access Logging.'
