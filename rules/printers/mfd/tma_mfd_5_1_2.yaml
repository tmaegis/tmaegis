id: TMA-MFD-5.1.2
title: Rename Default Accounts
description: Multi-Function Devices are typically configured with default user accounts that are common to all devices of the same make/model. It is recommended that default usernames be changed. Renaming default accounts will reduce an attacker’s ability to ascertain valid device credentials. 6. Logging and Monitoring This section provides guidance on the secure configuration of the logging and monitoring capabilities of the Multi-Function Device. 6.1 Enable Logging
target: printer
level: 1
severity: medium
tags:
