id: TMA-MFD-4.2.1
title: Uninstall or Disable all Unused Packages
description: Multi-Function Devices often come equipped with software-based features that may not be utilized. It is recommended that unused software-based features be disabled. Uninstalling or disabling utilizing software packages will reduce the attack surface of the Multi-Function Device. 5. User Management This section provides guidance on the secure configuration of the user and account management capabilities of the Multi-Function Device. 5.1 Default Accounts
target: printer
level: 1
severity: medium
