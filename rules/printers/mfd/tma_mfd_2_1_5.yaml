id: TMA-MFD-2.1.5
title: Disable Unused Protocols
description: Many MFDs can participate in networks that operate over a variety of protocols, including IP, IPX/SPX, and AppleTalk. As a defense in depth measure, it is recommended that all unused network-layer protocols supported by the MFD be disabled. This configuration will reduce risk introduced by vulnerabilities that are exposed over such protocols.
target: printer
level: 1
severity: medium
tags:
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 2.1.5 Disable Unused Protocols
audit:
  type: manual
  command: 'Verify compliance with CIS Multi-Function Device Benchmark v1.0.0 section 2.1.5: Disable Unused Protocols.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS Multi-Function Device Benchmark v1.0.0 section 2.1.5 to configure: Disable Unused Protocols.'
