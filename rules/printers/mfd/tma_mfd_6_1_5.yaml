id: TMA-MFD-6.1.5
title: Enable Print to Share Logging
description: Multi-Function Devices that contain print to file share capabilities typically contain functionality to log all such requests including the destination email address. It is recommended that these facilities be enabled on the device, logging levels be set to ensure adequate details are preserved, and logs be reviewed. When a security event occurs, these logs may provide investigators with information necessary to determine the extent and origin of the event. Additionally, these logs may be useful to isolate information leaks. 7. Miscellaneous Recommendations This section provides guidance on the secure configuration of miscellaneous capabilities of the Multi-Function Device. 7.1 Certificates
target: printer
level: 1
severity: medium
tags:
- logging
- mfd
- printer
