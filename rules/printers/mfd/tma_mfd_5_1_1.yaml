id: TMA-MFD-5.1.1
title: Change Default Passwords
description: Multi-Function Devices are typically configured with default user accounts that are common to all devices of the same make/model. It is recommended that default passwords be changed. Changing the default password for all default accounts will reduce the probability of unauthorized access to the device.
target: printer
level: 1
severity: medium
tags:
- auth
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 5.1.1 Change Default Passwords
audit:
  type: manual
  command: 'Verify compliance with CIS Multi-Function Device Benchmark v1.0.0 section 5.1.1: Change Default Passwords.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS Multi-Function Device Benchmark v1.0.0 section 5.1.1 to configure: Change Default Passwords.'
