id: TMA-MFD-3.1.2
title: Accept Jobs from Only Authorized Spoolers and Users
description: It is recommended that print jobs be restricted to only those jobs that originate from authorized spoolers or users. By limiting access to device print services to only authorized spoolers and users the exposure to load-based denial of service attacks is reduced. 4. Application Development Platforms This section provides guidance on the secure configuration of the Multi-Function Device with respect to its application development platform. 4.1 Application Signatures
target: printer
level: 1
severity: medium
