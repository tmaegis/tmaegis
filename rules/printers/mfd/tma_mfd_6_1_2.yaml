id: TMA-MFD-6.1.2
title: Enable Print Job Logging
description: MFDs commonly contain functionality to log all submitted requests. It is recommended that these facilities be enabled on the device, logging levels be set to ensure adequate details are preserved, and logs be reviewed. When a security event occurs, these logs may provide investigators with information necessary to determine the extent and origin of the event.
target: printer
level: 1
severity: medium
tags:
- logging
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 6.1.2 Enable Print Job Logging
audit:
  type: manual
  command: 'Verify compliance with CIS Multi-Function Device Benchmark v1.0.0 section 6.1.2: Enable Print Job Logging.'
remediation:
