id: TMA-MFD-6.1.4
title: Enable Print to Email Logging
description: Multi-Function Devices that contain print to email capabilities typically contain functionality to log all such requests including the destination email address. It is recommended that these facilities be enabled on the device, logging levels be set to ensure adequate details are preserved, and logs be reviewed. When a security event occurs, these logs may provide investigators with information necessary to determine the extent and origin of the event. Additionally, these logs may be useful to isolate information leaks.
target: printer
level: 1
severity: medium
tags:
- logging
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 6.1.4 Enable Print to Email Logging
audit:
