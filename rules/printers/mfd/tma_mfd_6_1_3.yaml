id: TMA-MFD-6.1.3
title: Enable Print to Fax Logging
description: Multi-Function Devices that contain print to fax capabilities typically contain functionality to log all such requests including the destination fax number. It is recommended that these facilities be enabled on the device, logging levels be set to ensure adequate details are preserved, and logs be reviewed. When a security event occurs, these logs may provide investigators with information necessary to determine the extent and origin of the event. Additionally, these logs may be useful to isolate information leaks.
target: printer
level: 1
severity: medium
tags:
- logging
- mfd
- printer
reference: CIS Multi-Function Device Benchmark v1.0.0 - 6.1.3 Enable Print to Fax Logging
audit:
