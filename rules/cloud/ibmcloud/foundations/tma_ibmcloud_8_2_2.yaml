id: TMA-IBMCLOUD-8.2.2
title: Ensure access settings to secrets follow least privilege rule and allow access for a limited time to applications and non- administrative users as needed
description: You can enable different levels of access to IBM Cloud® Secrets Manager resources in your IBM Cloud account by creating and modifying IBM Cloud IAM access policies. As an account owner, determine an access policy type for users, service IDs, and access groups based on your internal access control requirements. For example, if you want to grant user access to Secrets Manager at the most minimal scope available, you can assign access to a secret group in an instance. Review your IAM settings to confirm that permissive access to the Secrets Manager service is not allowed. Grant access to secrets for non-administrative users and applications only for the duration necessary to complete their tasks and promptly revoke access when it is no longer required. Limit access to specific Secrets Manager instances or secret groups and assign only the minimum service role necessary for the required o...
target: ibmcloud
level: 1
severity: high
tags:
- access-control
- cloud
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 8.2.2 Ensure access settings to secrets follow least privilege rule and allow access for a limited time to applications and non- administrative users as needed
audit:
  type: manual
  command: 'Using Console: 1. Log in to the IBM Cloud® console. 2. Go to Manage, Access (IAM) and assign access to your Secrets Manager instance: a. Create an access group for the users and service IDs that you want to give access to and add those users to the access group in IAM. For example, you might have a group of security admins that might need the same level of access. b. After you create an access group and add users, go to Manage, Access (IAM), Access Groups. c. Select a table row and click the Actions menu to open a list of options for that access group. d. Click Assign Access. e. From the list of services, select Secrets Manager and click Next. f. In the Resources section, select Specific resources. Choose a region and Secrets Manager service instance. Then, click Next. If you choose not to provide a specific instance, access is assigned for all instances of the service within the region that you selected. If you choose not to select a region, access is granted for all instances
    of the service in your account. Choose a combination of platform and service access roles to assign access for access group. g. Review your selections and click Add. h. Click Assign. i. Now you can add us...'
remediation:
  type: iac_patch
  command: 'Using Console: Remove a user from an Access Group 1. Log in to the IBM Cloud® console. 2. Go to Manage, Access (IAM), Access Groups a. Select your Access Group and click the Actions menu to open a list of options for that access group. b. Click Manage group. c. Select the user you would like to remove and click the Actions menu to remove it.'
