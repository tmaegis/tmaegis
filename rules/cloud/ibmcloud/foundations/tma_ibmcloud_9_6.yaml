id: TMA-IBMCLOUD-9.6
title: Ensure no workspace network security groups allow inbound traffic from the Internet from 0.0.0.0/0 to any fileshare port
description: It is recommended that inbound traffic from the Internet to file sharing application ports is restricted, following the principle of least privilege access. These ports are NetBIOS (139), SMB (445), FTP (21). Removing uncontrolled connectivity from the Internet to file sharing services, such as SMB, reduces a PowerVS resources’ risk exposure.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
- network
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 9.6 Ensure no workspace network security groups allow inbound traffic from the Internet from 0.0.0.0/0 to any fileshare port
audit:
  type: manual
  command: '1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. In the left navigation panel, expand Networking and then select Network security groups. For each NSG perform the following: a. Select the access control list name b. Ensure no Inbound Rule exists that has a port range that includes ports 139, 445 or 21 and has a Source of 0.0.0.0/0.'
remediation:
  type: iac_patch
  command: '1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. For each network security group, perform the following: a. Select the network security group name. b. Identify the Inbound rule to be removed, then select Delete.'
