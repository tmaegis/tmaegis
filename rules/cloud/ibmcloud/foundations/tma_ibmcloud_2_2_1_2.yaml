id: TMA-IBMCLOUD-2.2.1.2
title: Ensure IBM Cloud® Block Storage for Virtual Private Cloud is encrypted with KYOK
description: By default, IBM Cloud® Block Storage for Virtual Private Cloud provides provider- managed encryption for all data. For enhanced security, customers can bring their own encryption keys and manage them through IBM Key Management Service – Hyper Protect Crypto Services (HPCS). The customer can choose to use KYOK instead of provider-managed keys for enhanced security. When it comes to encryption of data at rest in IBM Cloud, the best practice is to allow customers use encryption capabilities offered by Hardware Security Module crypto service. IBM Cloud Hyper protect Crypto Service (HPCS) offers Keep your Own Key (KYOK) capabilities that allow customers to have exclusive key control over encryption keys. This provides a significant level of control over encryption keys where only authorized users have access (no privileged users included IBM Cloud Admins) to encryption keys, in turn increa...
target: ibmcloud
level: 2
severity: medium
tags:
- cloud
- encryption
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 2.2.1.2 Ensure IBM Cloud® Block Storage for Virtual Private Cloud is encrypted with KYOK
audit:
  type: manual
  command: 'You can use the IBM® Cloud Block Storage for Virtual Private Cloud configuration properties to verify whether a block volume is enabled to use Hyper Protect Crypto Service. From Console, Navigate to your block volume resource: 1. In the IBM Cloud console, go to the Menu icon, VPC Infrastructure, Storage, Block storage volumes. A list of all block storage volumes displays. 2. For each of the volumes listed, ensure the encryption field specifies Hyper Protect.'
remediation:
  type: iac_patch
  command: You will not be able to add Hyper Protect Crypto Services as the key management service once data is already written to a Cloud Block Storage Volumes. In order to ensure that data is encrypted using Hyper Protect Crypto Services you will need to create a new Cloud Block Storage volume, set it to use Hyper Protect Crypto Services key management service and then upload/copy the existing data to this new volume.
