id: TMA-IBMCLOUD-1.10
title: Ensure contact phone number is valid
description: A valid phone number should be on record with IBM Cloud in the event that IBM needs to contact you regarding your IBM Cloud account. Maintaining a valid phone number on record is important to make sure you receive important account related information from IBM Cloud when necessary.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 1.10 Ensure contact phone number is valid
audit:
  type: manual
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. Click Avatar icon, Profile. 3. Verify the Primary phone number and Alternate phone number fields in the Contact information section contain your correct phone numbers.'
remediation:
  type: iac_patch
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. Click Avatar icon, Profile. 3. Click the Edit link in the Contact information section 4. Update your Primary and Alternate phone numbers.'
