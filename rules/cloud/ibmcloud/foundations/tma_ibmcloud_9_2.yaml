id: TMA-IBMCLOUD-9.2
title: Ensure no workspace security groups allow ingress from 0.0.0.0/0 to port 3389
description: It is recommended that workspace security groups do not allow unrestricted ingress access from 0.0.0.0/0 to port 3389, which is the Remote Desktop Protocol (RDP) port used for remote server administration. Restricting access to the RDP port reduces the attack surface and lowers risk to PowerVS resources by preventing access to a critical administrative port.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 9.2 Ensure no workspace security groups allow ingress from 0.0.0.0/0 to port 3389
audit:
  type: manual
  command: 'Perform the following tasks to determine if the account is configured as prescribed: 1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. In the left navigation panel, expand Networking and then select Network security groups. For each NSG perform the following: a. Select the access control list name b. Ensure no Inbound Rule exists that has a port range that includes port 22 and has a Source of 0.0.0.0/0. Note that a port range value of ALL or a port range that includes port 3389, e.g. 3300-3400, are inclusive of port 3389.'
remediation:
  type: iac_patch
  command: '1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. For each network security group, perform the following: a. Select the network security group name. b. Identify the Inbound rule to be removed, then select Delete.'
