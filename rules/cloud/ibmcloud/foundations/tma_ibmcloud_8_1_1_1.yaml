id: TMA-IBMCLOUD-8.1.1.1
title: Ensure IBM Key Protect has automated rotation for customer managed keys enabled
description: IBM® Key Protect for IBM Cloud® allows you to rotate your root key (CRK) which is the key material created within the KMS Hardware Security Module (HSM) when you created the root key using KP APIs. This CRK is used to encrypt the Data Encryption Key (DEK) that is used to encrypt your data. By encrypting the DEK (wDEK), wDEK can be stored with the data. It is a best practice to rotate your CRK (that is, to create a new version of the key) on a regular basis. Regular rotations reduce what is known as the "cryptoperiod" of the key and can also be used in specific cases such as personnel turnover, process malfunctions, or the detection of a security issue. You can set a rotation interval on the CRK or manually rotate the CRK based on your organization policy. When it's time to rotate the key based on the rotation interval that you specify, Key Protect automatically creates a new root key...
