reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 1.12 Ensure Context-Based Restrictions are implemented to enforce secure, conditional access to critical resources based on network location, IP range, or identity attributes
audit:
  type: manual
  command: 'To check if you have a Context-Based Restriction (CBR) set in IBM Cloud, follow these steps: 1. Log in to the IBM Cloud Console: 2. Navigate to IAM, Context-based restrictions in the left-hand menu 3. Under the Rules tab, you''ll see a list of all active CBR rules in your account. Each rule will show: o The network zone it applies to (e.g., IP ranges, VPCs) o The target service or resource (e.g., Cloud Object Storage, Key Protect) o The action (allow or deny) o Any conditions or exceptions 4. You can click on each rule to view its details, including which users or services it affects and when it was last modified. 5. If no rules are listed, then no CBRs are currently enforced in your account.'
remediation:
  type: iac_patch
  command: 'To create new trusted profile, complete the following steps: 1. Log in to the IBM Cloud Console: 2. Navigate to Manage, Context-based restrictions, then select Network zones from the left navigation menu. 3. click Create and define the network zone(s) you want to allow access from, using allowed or denied IP addresses, subnets, or ranges, VPCs, and IBM Cloud services. 4. Select Rules from the left navigation menu 5. Click Create and select the service, APIs, and resources you want the rule to apply to, select the context including the zone you defined, and specify whether to enable or report on this rule.'
