reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 6.1.2 Ensure Web application firewall is ENABLED in IBM Cloud Internet Services (CIS)
audit:
  type: manual
  command: 'The Web Application Firewall setting can be audited using the following mechanisms Using Console: 1. Login to the IBM Cloud at https://cloud.ibm.com 2. Click Menu icon, Resource list 3. Select the Cloud Internet Service Instance 4. Select the domain that needs to be audited from the domains drop down 5. Choose the Security section from the left panel. 6. Click on the WAF tab in the Security panel. 7. Make sure the CIS Managed Ruleset and CIS OWASP Core Ruleset are both deployed and enabled Using API: 1. Run the curl command below. The value for $iam_token will be the IBM Cloud iam token retrieved by running the command ibmcloud iam oauth-tokens Request: curl -s https://api.cis.cloud.ibm.com/v1/{crn}/zones/{zoneid}/rulesets/phases/http_re quest_firewall_managed/entrypoint \ -H ''content-type: application/json'' \ -H ''accept: application/json'' \ -H "x-auth-user-token: Bearer $iam_token" | jq ''.result.rules[] | {ruleid: .action_parameters.id, enabled: .enabled}'' Response: {
    "ruleid": "efb7b8c949ac4650a09736fc376e9aee", "enabled": true } { "ruleid": "4814384a9e5d4991b9815dcfc25d2f1f", "enabled": true } In the above response rules map to the deployed ruleset ids as shown below CIS Mana...'
remediation:
  type: iac_patch
  command: 'The Web Application Firewall can be enabled in Cloud Internet Services using the following procedure Using Console 1. Login to the IBM Cloud at https://cloud.ibm.com 2. Click Menu icon, Resource list 3. Select the Cloud Internet Service Instance 4. Select the domain that needs to be audited from the domains drop down 5. Choose the Security section from the left panel. 6. Click on the WAF tab in the Security panel. 7. Deploy the following WAF managed rulesets by clicking the Deploy button next to them o CIS Managed Ruleset o CIS OWASP Core Ruleset 8. After rulesets are deployed or if they are already deployed, make sure they are enabled by clicking on the toggle under the Status column. Note: For WAF to be inline of the request flow, the DNS records or global load balancers need to have proxies enabled. Only when the records are proxied, the traffic will flow through the Cloud Internet Services reverse proxy and will get inspected.'
