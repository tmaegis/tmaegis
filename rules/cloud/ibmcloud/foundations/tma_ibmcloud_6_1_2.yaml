id: TMA-IBMCLOUD-6.1.2
title: Ensure Web application firewall is ENABLED in IBM Cloud Internet Services (CIS)
description: 'A Web Application Firewall (WAF) is a security solution designed to protect web applications by monitoring, filtering, and blocking malicious HTTP/S (OSI Layer 7) traffic between a client (usually a browser) and a web server. What is a Web Application Firewall? A WAF sits between the internet and your web application, acting as a reverse proxy that inspects incoming and outgoing web traffic. It uses rule-based logic, machine learning, or behavioral analysis to detect and prevent common threats including the OWASP Top-10 attack techniques. A WAF may use one or more of the following detection methods: - Signature-based detection (matches known attack patterns) - Anomaly-based detection (flags behavior outside the baseline) - Policy-based rules (user-defined or vendor-supplied rules) Key benefits of a CIS WAF The IBM Cloud™ Internet Services WAF is an easy way to set up, manage, and cust...'
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
