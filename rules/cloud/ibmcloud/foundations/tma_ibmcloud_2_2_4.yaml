id: TMA-IBMCLOUD-2.2.4
title: Ensure secondary volumes are encrypted with customer managed keys
description: By default, IBM Cloud® Block Storage for Virtual Private Cloud provides provider- managed encryption for all data. For enhanced security, customers can bring their own encryption keys and manage them through IBM Key Management Services – Key Protect or Hyper Protect Crypto Services (HPCS). With customer-managed keys, only customers can access and manage their master root keys, giving them full control over their data security.
target: ibmcloud
level: 2
severity: medium
tags:
- cloud
- crypto
- encryption
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 2.2.4 Ensure secondary volumes are encrypted with customer managed keys
audit:
  type: manual
  command: 'You can use the IBM® Cloud Block Storage for Virtual Private Cloud configuration properties to verify whether a block volume is enabled to use Key Protect or Hyper Protect key management services. From Console, Navigate to your block volume resource: 1. In the IBM Cloud console, go to Menu icon, VPC Infrastructure, Storage, Block storage volumes. A list of all block storage volumes will be displayed. 2. For each volumes listed with Attachment Type column value "Data", ensure the encryption field is Not pointing to "Provider Managed".'
remediation:
  type: iac_patch
  command: You will not be able to change encryption option once data is already written to a Cloud Block Storage Volume. In order to ensure that data is encrypted using customer managed keys you will need to create a new Cloud Block Storage volume, set it to use either Key Protect or Hyper Protect key management service and then upload/copy the existing data to this new volume.
