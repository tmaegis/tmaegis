id: TMA-IBMCLOUD-3.4
title: Ensure alerts are defined on custom views to notify of unauthorized requests, critical account actions, and high-impact operations in your account
description: Events that you collect and centralize in the IBM Cloud Logs service provide information about actions that take place on your account. You can define alerts to notify promptly of problems, anomalies, and abnormal situations. Each event reports information about who requested an action on your account (initiator details), what action was requested, the resource on which the action was requested (target details), and outcome of the request. Each event is based on the Cloud Auditing Data Federation (CADF) standard. For more information about the IBM event definition, see Event types and Event fields. In IBM Cloud Activity Tracker Event Routing, events from core IBM Cloud platform services are collected automatically and can be routed to a destination for analysis such as the IBM Cloud Logs service instances in your account. Events are also collected automatically for enabled-AT services...
target: ibmcloud
level: 2
severity: low
tags:
- auth
- cloud
