id: TMA-IBMCLOUD-3.3
title: Ensure that events are collected and processed to identify anomalies or abnormal events
description: Events that you collect and centralize in the IBM Cloud Logs service provide information about actions that take place on your account. You can analyze this data to resolve problems, identify anomalies, and be notified of abnormal situations. IBM Cloud Logs and IBM Cloud Activity Tracker Event Routing add audit capabilities to your IBM Cloud architecture. Each event reports information about who requested an action on your account (initiator details), what action was requested, the resource on which the action was requested (target details), and outcome of the request. Each event is based on the Cloud Auditing Data Federation (CADF) standard. For more information about the IBM event definition, see Event types and Event fields. In IBM Cloud Activity Tracker Event Routing, events from core IBM Cloud platform services are collected automatically and can be routed to a destination for an...
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
