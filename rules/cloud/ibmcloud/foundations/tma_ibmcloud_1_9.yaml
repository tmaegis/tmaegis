id: TMA-IBMCLOUD-1.9
title: Ensure contact email is valid
description: In order to receive emails and account alerts related to an IBM Cloud account, a valid email address should always be on record with IBM Cloud. If you lose access to an email address, you should update your email address on record to ensure continuity of correspondence. Maintaining a valid email address on record is important to make sure you receive important account related information.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 1.9 Ensure contact email is valid
audit:
  type: manual
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. Click Avatar icon, Profile. 3. Verify the Email field in the Contact information section contains your correct email address.'
remediation:
  type: iac_patch
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. Click Avatar icon, Profile. 3. Click the Edit link in the Contact information section 4. Update your email to the correct email address.'
