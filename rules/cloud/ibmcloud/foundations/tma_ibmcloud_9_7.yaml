id: TMA-IBMCLOUD-9.7
title: Ensure no workspace network security groups allow inbound traffic from the Internet allowing access from 0.0.0.0/0 to telnet port (23) or RSH port (514)
description: It is recommended the inbound traffic from the Internet to telnet port (23) or remote shell (RSH, port 514) is restricted. These protocols are insecure/deprecated and should not be used in general.
target: ibmcloud
level: 1
severity: medium
tags:
- access-control
- cloud
- ibmcloud
- network
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 9.7 Ensure no workspace network security groups allow inbound traffic from the Internet allowing access from 0.0.0.0/0 to telnet port (23) or RSH port (514)
audit:
  type: manual
  command: 'Perform the following tasks to determine if the account is configured as prescribed: 1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. In the left navigation panel, expand Networking and then select Network security groups. For each NSG perform the following: a. Select the access control list name b. Ensure no Inbound Rule exists that has a port range that includes ports 23 or 514 and has a Source of 0.0.0.0/0.'
remediation:
  type: iac_patch
  command: '1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. For each network security group, perform the following: a. Select the network security group name. b. Identify the Inbound rule to be removed, then select Delete.'
