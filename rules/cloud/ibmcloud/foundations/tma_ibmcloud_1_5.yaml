id: TMA-IBMCLOUD-1.5
title: Ensure no owner account API key exists
description: API keys by definition allow access to your account and resources in your account. The API key authenticates the identity and allows all access assigned to the identity for which it was created, therefore an API key created by user with administrative privileges has administrative level access to resources in the account. In accordance with the practice of granting least privilege, API keys should not be created by an account owner because of the level of privilege automatically granted to account-owner created API keys.
target: ibmcloud
level: 1
severity: high
tags:
- cloud
- crypto
- ibmcloud
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 1.5 Ensure no owner account API key exists
audit:
  type: manual
  command: To check for the existence of an API key created by an administrative user, complete the following steps. 1. Login as any administrative user at cloud.ibm.com 2. Click Manage, Access (IAM) 3. Click API keys 4. Check for any API keys that appear under the My IBM Cloud API keys view
remediation:
  type: iac_patch
  command: 'To delete an API key, complete the following steps: 1. Login as the administrative user at cloud.ibm.com 2. In the console, go to Manage, Access (IAM) 3. Click on API keys 4. Identify the row of the API key that you want to delete and select Delete from the Actions List of actions icon menu (found on the right hand side of the row). 5. Then, confirm the deletion by clicking Delete. 6. If you have scenarios where you need a higher level of access, then you should setup a Trusted Profile with these privileges and use it with a less privileged identity'
