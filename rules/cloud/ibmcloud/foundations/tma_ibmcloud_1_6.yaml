id: TMA-IBMCLOUD-1.6
title: Ensure multi-factor authentication (MFA) is enabled for all users in account
description: Requires users to provide multiple factors of login credentials to authenticate their identity and gain access to IBM Cloud resources. Multifactor authentication (MFA) adds an additional layer of security to an account by requiring users to provide an additional login credential. This requirement helps protect accounts from stolen, phished, or weak password exploits.
target: ibmcloud
level: 1
severity: high
tags:
- auth
- cloud
- ibmcloud
- mfa
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 1.6 Ensure multi-factor authentication (MFA) is enabled for all users in account
audit:
  type: manual
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. From the Menu bar, click Manage, Access (IAM). 3. Click Settings, Account login. 4. Verify Multifactor authentication does not say None'
remediation:
  type: iac_patch
  command: 'Using Console: 1. Log in to IBM Cloud at https://cloud.ibm.com. 2. From the Menu bar, click Manage, Access (IAM). 3. Click Settings, Account login. 4. Click Edit for the Account login setting. 5. Select Non-federated users only, or All users depending on which type of authentication you want to require. 6. Select the checkbox to confirm that you understand the impact of requiring MFA for users in your account, if you select the non-federated users only option. 7. Click Update.'
