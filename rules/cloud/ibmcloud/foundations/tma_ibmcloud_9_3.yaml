id: TMA-IBMCLOUD-9.3
title: Ensure no workspace network security groups allow ingress from 0.0.0.0/0 to port 22
description: It is recommended that no workspace security groups allow unrestricted ingress access to SSH on port 22. This control is intended to reduce the PowerVS resource attack surface and risk of compromise by preventing access to administrative ports, like SSH.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
- network
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 9.3 Ensure no workspace network security groups allow ingress from 0.0.0.0/0 to port 22
audit:
  type: manual
  command: 'Perform the following tasks to determine if the account is configured as prescribed: 1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. In the left navigation panel, expand Networking and then select Network security groups. For each NSG perform the following: a. Select the access control list name b. Ensure no Inbound Rule exists that has a port range that includes port 22 and has a Source of 0.0.0.0/0. A port range value of ALL or a port range that includes port 22, e.g. 0-1024, are inclusive of port 22.'
remediation:
  type: iac_patch
  command: '1. Login to the IBM Cloud Portal at https://cloud.ibm.com and select Power Virtual Server user interface. 2. In the navigation panel, click Workspaces, then select the workspace that contains the Network Security Groups to review and open the Workspace details page. 3. From the workspace details page, click view virtual servers. 4. For each network security group, perform the following: a. Select the network security group name. b. Identify the Inbound rule to be removed, then select Delete.'
