id: TMA-IBMCLOUD-3.5
title: Ensure the account owner can login only from a list of authorized countries/IP ranges
description: Monitor the account owner's access to the IBM Cloud account is done from authorized locations that are restricted by IP addresses. By default, a user can log in from any IP address. In IBM Cloud, you can restrict a user to log in only from specific IP addresses. Therefore, you can define for the account owner the list of IP addresses that are allowed. Other IP addresses will be restricted. This configuration feature per user allows you to restrict access from controlled locations and adds an additional level of security into your IBM Cloud account. When a user such as the account owner logs in, information about its IP address is included in the Activity Tracker security event. You can monitor and be notified when this event is generated in the account. You can obtain in the security event information about unauthorized location.
target: ibmcloud
level: 1
severity: medium
tags:
- auth
- cloud
- ibmcloud
- logging
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 3.5 Ensure the account owner can login only from a list of authorized countries/IP ranges
audit:
  type: manual
  command: 'Complete the following steps to check if you monitor the locations from which the account owner logs in to the account: First, you need to identify the email of the account owner. 1. In the Cloud UI, go to Manage, Access (IAM), then select Users. 2. Identify the user that has the tag owner. 3. Select the account owner. Then, click Details. 4. Copy the email address of the account owner. Second, launch the IBM Cloud Logs instance in the region where Frankfurt and ''global'' events are routed. This is the instance where login security events are collected in the account. In the All Views section, look for a view that monitors the account owner login attempts. The search query should be set to: (action login) AND initiator.name:<email address> AND -initiator.host.address:(<list of IP addresses>), where is the account owner email address, and <list of IP addresses> is the list of authorized IP addresses that are separated by OR, for example, (xxx.xxx.xxx.xxx OR xxx.xxx.xxx.xxx).
    Then, check that at least one alert has been configured for audit events that deviate from the expected source IPs. Additionally, context-based restrictions protect your resources by denying access to identiti...'
remediation:
  type: iac_patch
  command: 'Complete the following steps to monitor the locations from which the account owner logs in to the account: First, you need to identify the email of the account owner. 1. In the Cloud UI, go to Manage, Access (IAM), then select Users. 2. Identify the user that has the tag owner. 3. Select the account owner. Then, click Details. 4. Copy the email address of the account owner and the list of authorized IP addresses. 5. Launch the IBM Cloud Logs instance in the region where Frankfurt and global events are routed. This is the instance where login security events are collected in the account. 6. Create an alert based on any deviations where the Account Owner logs in from an unauthorized IP address. For example, use the following query: (action login) AND initiator.name:<email address> AND - initiator.host.address:(<list of IP addresses>). Replace with the account owner''s email address. Replace <list of IP addresses> with the list of IP addresses that are separated by OR, for example,
