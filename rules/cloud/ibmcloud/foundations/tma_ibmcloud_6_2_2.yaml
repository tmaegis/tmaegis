id: TMA-IBMCLOUD-6.2.2
title: Ensure the default security group of every VPC restricts all traffic
description: VPC security groups provide stateful filtering of ingress/egress network traffic to Virtual Server. It is recommended that no security group allows unrestricted ingress access to a Virtual Server. Unless modified, the default security group allows inbound traffic from all members of the group that is, all other virtual servers that are attached to this security group. Removing uncontrolled connectivity to a Virtual Server, reduces a server's exposure to risk.
target: ibmcloud
level: 1
severity: medium
tags:
- cloud
- ibmcloud
- network
reference: CIS IBM Cloud Foundations Benchmark v2.0.0 - 6.2.2 Ensure the default security group of every VPC restricts all traffic
audit:
  type: manual
  command: 'Perform the following tasks to determine if the account is configured as prescribed: Using Console: 1. Login to the IBM Cloud Portal at https://cloud.ibm.com. 2. At the Menu icon, select VPC Infrastructure, VPC Layout, Security Groups`. 3. For the default security group, perform the following: a. Ensure no Inbound Rule exists that allows unrequited traffic to the Virtual Servers.'
remediation:
  type: iac_patch
  command: 'Using Console: 1. Login to the IBM Cloud Portal at https://cloud.ibm.com. 2. At the Menu icon, select VPC Infrastructure, VPC Layout, Security Groups. 3. For the default security group, perform the following: a. Identify the Inbound rule. b. Update the rule to only allow the required traffic flow.'
