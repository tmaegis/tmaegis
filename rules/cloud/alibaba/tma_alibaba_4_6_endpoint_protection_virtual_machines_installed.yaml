id: TMA-ALIBABA-4.6
title: Ensure that the endpoint protection for all Virtual Machines is installed
description: 'Install endpoint protection for all virtual machines. Installing endpoint protection systems (like Security Center for Alibaba Cloud) provides for real-time protection capability that helps identify and remove viruses, spyware, and other malicious software, with ... Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- ecs
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 4.6 Ensure that the endpoint protection for all Virtual Machines is installed
audit:
  type: manual
  command: 'Using the Alibaba Cloud Management Console: 1. Logon to Security Center Console 2. Select Overview 3. Ensure all ECS are installed with Security Center agent Expected state: Using the Alibaba Cloud Management Console: 1. Logon to Security Center Console 2. Select Settings 3. Click Agent 4. On the Agent tab, select the virtual machines without Security Center agent installed 5. Click Install'
remediation:
  type: iac_patch
  command: 'Using the Alibaba Cloud Management Console: 1. Logon to Security Center Console 2. Select Settings 3. Click Agent 4. On the Agent tab, select the virtual machines without Security Center agent installed 5. Click Install'
