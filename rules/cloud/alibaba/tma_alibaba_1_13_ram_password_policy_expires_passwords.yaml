id: TMA-ALIBABA-1.13
title: Ensure RAM password policy expires passwords in 365 days or greater
description: RAM password policies can require passwords to be expired after a given number of days. It is recommended that the password policy expire passwords after 365 days or greater. To frequent password changes are more harmful than beneficial. They offer no containment benefits and enforce bad habits-since they encourage users to choose variants of older passwords. Reads MaxPasswordAge from aliyun ram GetPasswordPolicy. Compliant when MaxPasswordAge is 0 (expiry disabled) or 365 or greater, as the benchmark audit states. Read-only aliyun CLI calls; credentials and default region come from the CLI's normal profile (aliyun configure, ~/.aliyun/config.json or ALIBABA_CLOUD_* environment variables). JSON output is parsed with sed/awk. A missing CLI or credential fails the check.
target: alibaba
level: 1
severity: high
tags:
- alibaba
- ram
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 1.13 Ensure RAM password policy expires passwords in 365 days or greater
audit:
  type: command
  command: |-
    out=$(aliyun ram GetPasswordPolicy 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/.*"MaxPasswordAge"[[:space:]]*:[[:space:]]*"\{0,1\}\([^",}]*\)"\{0,1\}.*/\1/p' | head -n 1)
    { [ "$v" -eq 0 ] || [ "$v" -ge 365 ]; } 2>/dev/null && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: aliyun ram SetPasswordPolicy --MaxPasswordAge 365 (repeat the other current policy parameters, which SetPasswordPolicy resets), or RAM console > Settings > Security Settings > Password Strength Settings.
