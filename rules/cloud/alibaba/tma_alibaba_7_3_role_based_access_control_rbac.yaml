id: TMA-ALIBABA-7.3
title: Ensure role-based access control (RBAC) authorization is Enabled on Kubernetes Engine Clusters
description: 'In Kubernetes, authorizers interact by granting a permission if any authorizer grants the permission. The legacy authorizer in Kubernetes Engine grants broad, statically defined permissions. To ensure that RBAC limits permissions correctly, you must disable the legacy authorizer. In Kubernetes, RBAC is used to grant permissions to resources at the cluster and namespace level. RBAC allows you to define roles with rules containing a set of permissions, and the subaccounts who bind the roles could ... Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- ack
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 7.3 Ensure role-based access control (RBAC) authorization is Enabled on Kubernetes Engine Clusters
audit:
  type: manual
  command: 'Using the management console: 1. Logon to ACK console 2. Select the target RAM sub-account in the Clusters -> Authorizations page 3. After RAM user/role is selected, configure the RBAC roles on specific clusters or namespaces'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to ACK console 2. Select the target RAM sub-account and configure the RBAC roles on specific clusters or namespaces.'
