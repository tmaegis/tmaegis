id: TMA-ALIBABA-1.14
title: Ensure RAM password policy temporarily blocks logon after 5 incorrect logon attempts within an hour
description: RAM password policies can temporarily block logon after several incorrect logon attempts within an hour. It is recommended that the password policy is set to temporarily block logon after 5 incorrect logon attempts within an hour. Temporarily blocking logon for incorrect password input increases account resiliency against brute force logon attempts. Reads MaxLoginAttemps from aliyun ram GetPasswordPolicy. MaxLoginAttemps (the API spelling) must be between 1 and 5. Read-only aliyun CLI calls; credentials and default region come from the CLI's normal profile (aliyun configure, ~/.aliyun/config.json or ALIBABA_CLOUD_* environment variables). JSON output is parsed with sed/awk. A missing CLI or credential fails the check.
target: alibaba
level: 1
severity: high
tags:
- alibaba
- ram
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 1.14 Ensure RAM password policy temporarily blocks logon after 5 incorrect logon attempts within an hour
audit:
  type: command
  command: |-
    out=$(aliyun ram GetPasswordPolicy 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/.*"MaxLoginAttemps"[[:space:]]*:[[:space:]]*"\{0,1\}\([^",}]*\)"\{0,1\}.*/\1/p' | head -n 1)
    [ "$v" -ge 1 ] 2>/dev/null && [ "$v" -le 5 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: aliyun ram SetPasswordPolicy --MaxLoginAttemps 5 (repeat the other current policy parameters, which SetPasswordPolicy resets), or RAM console > Settings > Security Settings > Password Strength Settings.
