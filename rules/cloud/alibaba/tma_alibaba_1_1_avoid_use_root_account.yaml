id: TMA-ALIBABA-1.1
title: Avoid the use of the "root" account
description: 'An Alibaba Cloud account can be viewed as a "root" account. The "root" account has full control permissions to all cloud products and resources under such account. It is highly recommended that the use of this account should be avoided. The "root" account is the owner of the resources under an Alibaba Cloud account. This account pays for and has full control permissions to resources. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: high
tags:
- alibaba
- ram
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 1.1 Avoid the use of the "root" account
audit:
  type: manual
  command: You can enable ActionTrail for your account, and create a trail to deliver all action logs to Alibaba Cloud Log Service. Then, you can enable an alarm to discover the usage of "root" account and receive notifications on those conditions. Implement the Ensure a log metric filter and alarm exist for usage of "root" account recommendation in the Logging and Monitoring section to receive notifications of root account usage.
remediation:
  type: iac_patch
  command: All users should operate resources at the RAM user level and follow the principle of least privilege. Follow the remediation instructions of the Ensure RAM policies are attached only to groups or roles recommendation. For more information about RAM user, see terms of RAM user.
