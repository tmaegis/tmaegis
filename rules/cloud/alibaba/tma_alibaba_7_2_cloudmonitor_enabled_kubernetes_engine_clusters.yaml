id: TMA-ALIBABA-7.2
title: Ensure CloudMonitor is set to Enabled on Kubernetes Engine Clusters
description: 'The monitoring service in Kubernetes Engine clusters depends on the Alibaba Cloud CloudMonitor agent to access additional system resources and application services in virtual machine instances. The monitor can access metrics about CPU utilization, some disk traffic metrics, network traffic, and disk IO information ... By Enabling CloudMonitor installation you will have system metrics and custom metrics. System metrics are measurements of the cluster''s infrastructure, such as CPU or memory usage. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- ack
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 7.2 Ensure CloudMonitor is set to Enabled on Kubernetes Engine Clusters
audit:
  type: manual
  command: 'Using the management console: 1. Logon to ACK console 2. Select the target cluster and click its name into cluster detail page 3. Select the Nodes on the left column and click the Monitor link on the Actions column of the selected node 4. Check if OS Metrics data existing in the CloudMonitor page of the selected ECS node'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to ACK console 2. Click the Create Kubernetes Cluster button and set CloudMonitor Agent to Enabled under creation options.'
