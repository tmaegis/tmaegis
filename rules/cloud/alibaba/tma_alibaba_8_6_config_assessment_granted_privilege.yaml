id: TMA-ALIBABA-8.6
title: Ensure that Config Assessment is granted with privilege
description: 'Grant Security Center''s Cloud Platform Configuration Assessment the privilege to access other cloud product. Prior to using Cloud Platform Configuration Assessment, it requires privilege to assess other cloud product''s settings. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- security-center
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 8.6 Ensure that Config Assessment is granted with privilege
audit:
  type: manual
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Config Assessment. 3. Ensure that the prompt of asking privilege is not shown. Expected state: Using the management console: 1. Logon to Security Center Console. 2. Select Config Assessment. 3. Click Authorize.'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Config Assessment. 3. Click Authorize.'
