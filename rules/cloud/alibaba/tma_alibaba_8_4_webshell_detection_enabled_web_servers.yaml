id: TMA-ALIBABA-8.4
title: Ensure that Webshell detection is enabled on all web servers
description: 'Enable webshell detection on all web servers to scans periodically the Web directories for detecting webshells on servers. Web servers are exposed to the Internet and they are commonly attacked through injected webshell by attackers. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- security-center
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 8.4 Ensure that Webshell detection is enabled on all web servers
audit:
  type: manual
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click General. 4. Click Manage in Webshell Detection. 5. Ensure all web servers are included. Expected state: Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click General. 4. Click Manage in Webshell Detection. 5. Add all web servers.'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click General. 4. Click Manage in Webshell Detection. 5. Add all web servers.'
