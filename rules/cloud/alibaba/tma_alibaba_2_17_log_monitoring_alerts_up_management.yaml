id: TMA-ALIBABA-2.17
title: Ensure a log monitoring and alerts are set up for Management Console sign-in without MFA
description: 'Real-time monitoring of API calls can be achieved by directing ActionTrail Logs to Log Service and establishing corresponding query and alarms. It is recommended that a query and alarm be established for console logins that are not protected by multi-factor authentication (MFA). Monitoring for single-factor console logins will increase visibility into accounts that are not protected by MFA. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: high
tags:
- alibaba
- logging
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 2.17 Ensure a log monitoring and alerts are set up for Management Console sign-in without MFA
audit:
  type: manual
  command: 'Perform the following steps to ensure log monitoring and alerts are set for Management Console sign-in without MFA. 1. Logon to SLS Console. 2. Click Log Service Audit Service in the navigation pane to go to the Log Service Audit Service page. 3. Ensure the Action Trail are Enabled under the Access to Cloud Products > Global Configuration page, and click Central Project. 4. Select Alerts. 5. Ensure below alert rule has been enabled and saved in the target actiontrail_log "event.eventName": ConsoleSignin and "addionalEventData.loginAccount": false'
remediation:
  type: iac_patch
  command: 'Perform the following to ensure the log monitoring and alerts are set up for Management Console sign-in without MFA: 1. Logon to SLS Console. 2. Click Log Service Audit Service in the navigation pane. 3. Go to Access to Cloud Products > Global Configuration page. a. Select a location of project for logs. b. Check the Action Trail and configure a proper days. c. Click Save to save the changes. 4. Go to Access to Cloud Products > Global Configurations click Central Project. 5. Select Log Management > Actiontrail Log. 6. In the search/analytics console, input below query "event.eventName": ConsoleSignin and "addionalEventData.loginAccount": false 7.'
