id: TMA-ALIBABA-1.7
title: Ensure RAM password policy requires at least one uppercase letter
description: RAM password policies can be used to ensure password complexity. It is recommended that the password policy require at least one uppercase letter. Enhancing complexity of a password policy increases account resiliency against brute force logon attempts. Reads RequireUppercaseCharacters from aliyun ram GetPasswordPolicy. Read-only aliyun CLI calls; credentials and default region come from the CLI's normal profile (aliyun configure, ~/.aliyun/config.json or ALIBABA_CLOUD_* environment variables). JSON output is parsed with sed/awk. A missing CLI or credential fails the check.
target: alibaba
level: 1
severity: high
tags:
- alibaba
- ram
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 1.7 Ensure RAM password policy requires at least one uppercase letter
audit:
  type: command
  command: |-
    out=$(aliyun ram GetPasswordPolicy 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/.*"RequireUppercaseCharacters"[[:space:]]*:[[:space:]]*"\{0,1\}\([^",}]*\)"\{0,1\}.*/\1/p' | head -n 1)
    [ "$v" = true ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: aliyun ram SetPasswordPolicy --RequireUppercaseCharacters true (repeat the other current policy parameters, which SetPasswordPolicy resets), or RAM console > Settings > Security Settings > Password Strength Settings.
