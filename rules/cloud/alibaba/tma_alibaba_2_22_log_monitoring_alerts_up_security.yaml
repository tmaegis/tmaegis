id: TMA-ALIBABA-2.22
title: Ensure a log monitoring and alerts are set up for security group changes
description: 'Real-time monitoring of API calls can be achieved by directing ActionTrail Logs to Log Service and establishing corresponding query and alarms. Security Groups are a stateful packet filter that controls ingress and egress traffic within a VPC. Monitoring changes to security group will help ensure that resources and services are not unintentionally exposed. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 2
severity: medium
tags:
- alibaba
- logging
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 2.22 Ensure a log monitoring and alerts are set up for security group changes
audit:
  type: manual
  command: Perform the following steps to ensure log monitoring and alerts are set for security group changes. 1. Logon to SLS Console. 2. Click Log Service Audit Service in the navigation pane to go to the Log Service Audit Service page. 3. Ensure the Action Trail are Enabled under the Access to Cloud Products > Global Configuration page, and click Central Project. 4. Select Alerts. 5.
remediation:
  type: iac_patch
  command: Perform the following to ensure the log monitoring and alerts are set up for security group changes。 1. Logon to SLS Console. 2. Click Log Service Audit Service in the navigation pane. 3. Go to Access to Cloud Products > Global Configuration page. a. Select a location of project for logs. b. Check the Action Trail and configure a proper days. c. Click Save to save the changes. 4. Go to Access to Cloud Products > Global Configurations click Central Project. 5. Select Log Management > Actiontrail Log. 6. In the search/analytics console, input below query.
