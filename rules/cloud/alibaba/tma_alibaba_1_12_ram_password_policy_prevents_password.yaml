id: TMA-ALIBABA-1.12
title: Ensure RAM password policy prevents password reuse
description: It is recommended that the password policy prevent the reuse of passwords. Preventing password reuse increases account resiliency against brute force logon attempt. Reads PasswordReusePrevention from aliyun ram GetPasswordPolicy. PasswordReusePrevention must be 5 or more. Read-only aliyun CLI calls; credentials and default region come from the CLI's normal profile (aliyun configure, ~/.aliyun/config.json or ALIBABA_CLOUD_* environment variables). JSON output is parsed with sed/awk. A missing CLI or credential fails the check.
target: alibaba
level: 1
severity: high
tags:
- alibaba
- ram
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 1.12 Ensure RAM password policy prevents password reuse
audit:
  type: command
  command: |-
    out=$(aliyun ram GetPasswordPolicy 2>/dev/null) || exit 1
    v=$(printf '%s\n' "$out" | sed -n 's/.*"PasswordReusePrevention"[[:space:]]*:[[:space:]]*"\{0,1\}\([^",}]*\)"\{0,1\}.*/\1/p' | head -n 1)
    [ "$v" -ge 5 ] 2>/dev/null && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: aliyun ram SetPasswordPolicy --PasswordReusePrevention 5 (repeat the other current policy parameters, which SetPasswordPolicy resets), or RAM console > Settings > Security Settings > Password Strength Settings.
