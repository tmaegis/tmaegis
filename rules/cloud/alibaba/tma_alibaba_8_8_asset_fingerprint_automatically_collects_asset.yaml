id: TMA-ALIBABA-8.8
title: Ensure that Asset Fingerprint automatically collects asset fingerprint data
description: '10/14/2026 2.0.1 UPDATE - All Recs: Updated CIS Controls mappings and added NIST 800-53r5 and CSF 2.0 06/02/2025 2.0.0 UPDATE - Ensure that multi-factor authentication is enabled for all RAM users that have a console password - add default value (Ticket 25019) 06/04/2025 2.0.0 UPDATE - Multiple Recommendations - ... The Enterprise Edition allows for enhanced investigation collection of artifacts to identify root cause in a more timely manner of single or multiple server instances hosted within the cloud. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- security-center
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 8.8 Ensure that Asset Fingerprint automatically collects asset fingerprint data
audit:
  type: manual
  command: 'Using the management console: 1. Logon to Security Center Console 2. Select Investigation > Asset Fingerprints 3. Click Settings 4. Ensure the Refresh Frequencies are all set to Collected once a day Expected state: Using the management console: 1. Logon to Security Center Console 2. Select Investigation> Asset Fingerprints 3. Click Setting and set the Refresh Frequencies 4. Set refresh frequency Automatic collection to Collected once a day'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to Security Center Console 2. Select Investigation> Asset Fingerprints 3. Click Setting and set the Refresh Frequencies 4. Set refresh frequency Automatic collection to Collected once a day'
