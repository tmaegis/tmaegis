id: TMA-ALIBABA-8.5
title: Ensure that notification is enabled on all high risk items
description: 'Enable all risk item notification in Vulnerability, Baseline Risks, Alerts and Accesskey Leak event detection categories. To make sure that relevant security operators would receive notifications as soon as security events happens. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- security-center
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 8.5 Ensure that notification is enabled on all high risk items
audit:
  type: manual
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click Notification. 4. Review notification settings and ensure all high-risk items are enabled. Expected state: Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click Notification. 4. Enable all high-risk items on Notification setting.'
remediation:
  type: iac_patch
  command: 'Using the management console: 1. Logon to Security Center Console. 2. Select Settings. 3. Click Notification. 4. Enable all high-risk items on Notification setting.'
