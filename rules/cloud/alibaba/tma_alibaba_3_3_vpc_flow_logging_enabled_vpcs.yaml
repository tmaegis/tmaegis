id: TMA-ALIBABA-3.3
title: Ensure VPC flow logging is enabled in all VPCs
description: 'You can use the flow log function to monitor the IP traffic information for an ENI, a VSwitch or a VPC. If you create a flow log for a VSwitch or a VPC, all the Elastic Network Interfaces, including the newly created Elastic Network Interfaces, are monitored. VPC Flow Logs provide visibility into network traffic that traverses the VPC and can be used to detect anomalous traffic or insight during security workflows. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 2
severity: medium
tags:
- alibaba
- network
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 3.3 Ensure VPC flow logging is enabled in all VPCs
audit:
  type: manual
  command: '1. Logon to VPC console. 2. In the left-side navigation pane, click FlowLog. 3. Check for every existing VPC to ensure that there is an associated VPC ID on the FlowLog tab. Expected state: 1. Logon to VPC console. 2. In the left-side navigation pane, click FlowLog. 3. Follow the instruction to create FlowLog for each of your VPCs'
remediation:
  type: iac_patch
  command: 1. Logon to VPC console. 2. In the left-side navigation pane, click FlowLog. 3. Follow the instruction to create FlowLog for each of your VPCs
