id: TMA-ALIBABA-7.8
title: Ensure ENI multiple IP mode support for Kubernetes Cluster
description: 'Alibaba Cloud ENI (Elastic Network Interface) has supported assign ranges of internal IP addresses as aliases to a single virtual machine''s ENI network interfaces. This is useful if you have lots of services running on a VM and you want to assign each service a different IP address without quota limitation. With the feature of ENI multiple IP mode, Kubernetes Engine clusters can allocate IP addresses from a CIDR block known to Terway network plugin. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: medium
tags:
- alibaba
- ack
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 7.8 Ensure ENI multiple IP mode support for Kubernetes Cluster
audit:
  type: manual
  command: 'Using the management console: 1. Logon to ACK console 2. Select the target cluster name and go into the cluster detail page 3. Check if the meta of Network Plugin in Cluster Information is Terway Expected state: Only the Terway network plugin support the Network Policy feature, so please make sure not choose Flannel as network plugin when creating cluster. Using the management console: 1. Logon to ACK console 2. Click the Create Kubernetes Cluster button and select Terway in Network Plugin option.'
remediation:
  type: iac_patch
  command: 'Only the Terway network plugin support the Network Policy feature, so please make sure not choose Flannel as network plugin when creating cluster. Using the management console: 1. Logon to ACK console 2. Click the Create Kubernetes Cluster button and select Terway in Network Plugin option.'
