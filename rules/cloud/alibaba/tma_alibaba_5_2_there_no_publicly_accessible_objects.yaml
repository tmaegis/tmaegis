id: TMA-ALIBABA-5.2
title: Ensure that there are no publicly accessible objects in storage buckets
description: 'A bucket is a container used to store objects in Object Storage Service (OSS). All objects in OSS are stored in buckets. It is recommended that storage object ACL should not grant public access. Allowing public access to objects allows anyone with an internet connection to access sensitive data that is important to your business. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 1
severity: high
tags:
- alibaba
- oss
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 5.2 Ensure that there are no publicly accessible objects in storage buckets
audit:
  type: manual
  command: 'Using the Management Console: 1. Logon to OSS console. 2. In the bucket-list pane, click on a target OSS bucket 3. Click on Files in top middle of the console 4. Click on View details in the right column on a target object 5. Ensure File ACL is set to private'
remediation:
  type: iac_patch
  command: 'Using the Management Console: 1. Logon to OSS console. 2. In the bucket-list pane, click on a target OSS bucket 3. Click on Files in top middle of the console 4. Hover on More in the right column on a target object 5. Click Set ACL 6. Click Private 7. Click Save'
