id: TMA-ALIBABA-5.8
title: Ensure server-side encryption is set to 'Encrypt with Service Key'
description: 'Enable server-side encryption (Encrypt with Service Key) for objects. Server-side encryption protects your data at rest. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 2
severity: high
tags:
- alibaba
- oss
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 5.8 Ensure server-side encryption is set to 'Encrypt with Service Key'
audit:
  type: manual
  command: 'Perform the following to determine if the OSS bucket is configured to use SSE-KMS: Using the management console: 1. Logon to OSS console. 2. In the bucket-list pane, click on the target OSS bucket 3. Click on Basic Setting in top middle of the console 4. Under the Server-side Encryption section, ensure the target OSS Bucket Encryption is set to KMS and the Encryption Method of KMS and the service key (alias/acs/oss) is selected.'
remediation:
  type: iac_patch
  command: 'Using the management console: Perform the following to configure the OSS bucket to use SSE-KMS: 1. Logon to OSS console. 2. In the bucket-list pane, click on the target OSS bucket 3. Click Basic Setting in top middle of the console 4. Under the Server-side Encryption section, click on configure 5. Click KMS and select KMS service key(alias/acs/oss)'
