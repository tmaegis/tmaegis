id: TMA-ALIBABA-8.3
title: Ensure that Automatic Quarantine is enabled
description: 'Enable automatic quarantine in Security Center may 1ncure additional cost. Once a virus is detected, the automatic quarantine feature prevents the virus from being executed. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 2
severity: medium
tags:
