id: TMA-ALIBABA-3.2
title: Ensure that SSH access is restricted from the internet
description: 'Security groups provide stateful filtering of ingress/egress network traffic to Alibaba Cloud resources. It is recommended that no security group allows unrestricted ingress access to port 22 or port 3389. Removing unfettered connectivity to remote console services, such as SSH or RDP, reduces a server''s exposure to risk. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: alibaba
level: 2
severity: high
tags:
- alibaba
- network
reference: CIS Alibaba Cloud Foundation Benchmark v2.0.1 - 3.2 Ensure that SSH access is restricted from the internet
audit:
  type: manual
  command: 1. Logon to ECS Console 2. In the left-side navigation pane, choose Network & Security > Security Groups. 3. Ensure Port is not equal to 22 or 3389 and Action is not Allow. 4. Ensure IP Ranges is not equal to 0.0.0.0 under Source filters.
remediation:
  type: iac_patch
  command: 1. Logon to ECS Console 2. Go to Security Group 3. Find the Security Group you want to modify 4. Modify Source IP range to specific IP 5. Save
