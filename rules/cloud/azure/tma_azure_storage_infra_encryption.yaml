id: TMA-AZURE-STORAGE-INFRA-ENCRYPTION
title: Ensure infrastructure encryption is enabled for storage accounts
description: Infrastructure encryption adds a second AES-256 layer at the infrastructure level. Every storage account must have encryption.requireInfrastructureEncryption true. Read-only Azure CLI calls against the current subscription; credentials come from the CLI's normal sign-in (az login, a service principal or managed identity; select the subscription with az account set). A missing CLI or session fails the check.
target: azure
level: 2
severity: low
tags:
- azure
- storage
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - Storage Accounts - infrastructure (double) encryption (verify section number for your release)
audit:
  type: command
  command: 'out=$(az storage account list --query ''[?encryption.requireInfrastructureEncryption!=`true`].name'' -o tsv 2>/dev/null) || exit 1

    [ -z "$out" ] && echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Infrastructure encryption can only be set at creation: create a new account with --require-infrastructure-encryption true (Terraform: infrastructure_encryption_enabled = true) and migrate the data.'
