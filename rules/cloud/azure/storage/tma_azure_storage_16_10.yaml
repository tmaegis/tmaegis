id: TMA-AZURE-STORAGE-16.10
title: Ensure storage logging is Enabled for Table Service for 'Read', 'Write', and 'Delete' Requests
description: 'Azure Table storage is a service that stores structured NoSQL data in the cloud, providing a key/attribute store with a schema-less design. Storage Logging happens server-side and allows details for both successful and failed requests to be recorded in the storage account. These logs allow users to see the details of read, write, and delete operations against the tables. Storage Logging log entries contain the following information about individual requests: timing information such as start time, end-to-end latency, and server latency; authentication details; concurrency information; and the sizes of the request and response messages. Storage Analytics logs contain detailed information about successful and failed requests to a storage service. This information can be used to monitor each individual request to a storage service for increased security or diagnostics. Requests are logged...'
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- logging
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 16.10 Ensure storage logging is Enabled for Table Service for 'Read', 'Write', and 'Delete' Requests
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage accounts. 2. For each storage account, under Monitoring, select Diagnostic settings. 3. Select the table resource listed beneath the storage account. 4. Confirm at least one diagnostic setting has StorageRead, StorageWrite, and StorageDelete selected under Logs, routed to an appropriate destination (Log Analytics workspace, storage account, or event hub). Audit from Azure CLI The Audit must check the same Azure Monitor diagnostic settings the Portal configures. The previously used classic Storage Analytics logging mechanism was retired in August 2023 and does not reflect diagnostic settings. For each storage account, list the diagnostic settings on the table service: az monitor diagnostic-settings list \ --resource "/subscriptions/<subscription-id>/resourceGroups/<resource- group>/providers/Microsoft.Storage/storageAccounts/<storage- account>/tableServices/default" The output should contain a setting whose logs array enables StorageRead,
    StorageWrite, and StorageDelete (enabled: true). No diagnostic setting, or any of the three categories disabled or absent, is non-compliant.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage accounts. 2. For each storage account, under Monitoring, select Diagnostic settings. 3. Select the table resource listed beneath the storage account. 4. Select + Add diagnostic setting (or Edit setting on an existing one). 5. Check StorageRead, StorageWrite, and StorageDelete. 6. Select an appropriate destination and select Save. Remediate from Azure CLI Create a diagnostic setting on the table service enabling all three log categories (example routes to a Log Analytics workspace): az monitor diagnostic-settings create \ --name <diagnostic-setting-name> \ --resource "/subscriptions/<subscription-id>/resourceGroups/<resource- group>/providers/Microsoft.Storage/storageAccounts/<storage- account>/tableServices/default" \ --workspace <log-analytics-workspace-resource-id> \ --logs ''[{"category":"StorageRead","enabled":true},{"category":"StorageWrite","enabl ed":true},{"category":"StorageDelete","enabled":true}]'''
