id: TMA-AZURE-STORAGE-11.1
title: Ensure double encryption is used for Azure Data Box in high-security environments
description: Enabling double encryption on Azure Data Box applies an additional layer of encryption to safeguard data during physical transfer. This approach enhances confidentiality and integrity, ensuring that sensitive information remains secure against unauthorized access if the device is lost, stolen, or intercepted. Double encryption ensures strong security for high-risk or regulated environments where data protection is critical. It enhances defense-in-depth and minimizes the risk of exposure, even during physical compromise in transit.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- encryption
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 11.1 Ensure double encryption is used for Azure Data Box in high-security environments
audit:
  type: manual
  command: 'Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: c349d81b-9985-44ae-a8da-ff98d108ede8 - Name: ''Azure Data Box jobs should enable double encryption for data at rest on the device'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal When creating a new Azure Data Box order, on the Security page, under Double encryption, check the box next to Enable double encryption for the order.
