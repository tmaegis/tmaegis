id: TMA-AZURE-STORAGE-16.1.3
title: Ensure that Storage Account Access Keys are Periodically Regenerated
description: For increased security, regenerate storage account access keys periodically. When a storage account is created, Azure generates two 512-bit storage access keys which are used for authentication when the storage account is accessed. Rotating these keys periodically ensures that any inadvertent access or exposure does not result from the compromise of these keys. Cryptographic key rotation periods will vary depending on your organization's security requirements and the type of data which is being stored in the Storage Account. For example, PCI DSS mandates that cryptographic keys be replaced or rotated 'regularly,' and advises that keys for static data stores be rotated every 'few months.' For the purposes of this recommendation, 90 days will prescribed for the reminder. Review and adjustment of the 90 day period is recommended, and may even be necessary. Your organization's security re...
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- crypto
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 16.1.3 Ensure that Storage Account Access Keys are Periodically Regenerated
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage accounts. 2. For each storage account, under Security + networking, select Access keys. 3. Review the Last rotated date for each key. If a key was last rotated more than 90 days ago (or longer than your organization''s validity period), it should be regenerated. Audit from Azure CLI List storage accounts: az storage account list --query "[].{name:name, resourceGroup:resourceGroup}" For each account, check the Activity Log for a key regeneration in the last 90 days. Note the Activity Log retains only ~90 days, so this confirms recent rotation but cannot prove a key has never been rotated: az monitor activity-log list --offset 90d --query "[?contains(authorization.action, ''regenerateKey'')].{action:authorization.action, status:status.value}" A successful regenerateKey action within the period is compliant. Note: there is no built-in Azure Policy that audits whether access keys are periodically regenerated. (Policy 044985bb audits the key-expiration
    policy, not regeneration, and has been moved to the key-rotation-reminder recommendation.)'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage Accounts. 2. For each Storage Account with outdated keys, under Security + networking, go to Access keys. 3. Click Rotate key next to the outdated key, then click Yes to the prompt confirming that you want to regenerate the access key. After Azure regenerates the Access Key, you can confirm that Access keys reflects a Last rotated date of (0 days ago). Remediate from Azure CLI For each storage account with an outdated key, regenerate the primary key, then repeat with --key secondary for the secondary key: az storage account keys renew \ --resource-group <resource-group> \ --account-name <storage-account> \ --key primary'
