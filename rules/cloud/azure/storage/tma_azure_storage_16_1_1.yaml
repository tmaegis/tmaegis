id: TMA-AZURE-STORAGE-16.1.1
title: Ensure that 'Enable key rotation reminders' is enabled for each Storage Account
description: Access Keys authenticate application access requests to data contained in Storage Accounts. A periodic rotation of these keys is recommended to ensure that potentially compromised keys cannot result in a long-term exploitable credential. The "Rotation Reminder" is an automatic reminder feature for a manual procedure. Reminders such as those generated by this recommendation will help maintain a regular and healthy cadence for activities which improve the overall efficacy of a security program. Cryptographic key rotation periods will vary depending on your organization's security requirements and the type of data which is being stored in the Storage Account. For example, PCI DSS mandates that cryptographic keys be replaced or rotated 'regularly,' and advises that keys for static data stores be rotated every 'few months.' For the purposes of this recommendation, 90 days will prescribed f...
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- crypto
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 16.1.1 Ensure that 'Enable key rotation reminders' is enabled for each Storage Account
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage accounts. 2. For each storage account, under Security + networking, select Access keys. 3. If an Edit rotation reminder button is shown, a key-expiration/rotation reminder policy is set (compliant) - select it and confirm the Remind me every interval suits your security program. If only a Set rotation reminder button is shown, no policy is set (non-compliant). Audit from Azure CLI For each storage account, verify a key-expiration policy (the rotation reminder) is configured: az storage account show \ --name <storage-account> \ --resource-group <resource-group> \ --query "{KeyPolicy:keyPolicy}" A keyPolicy with a keyExpirationPeriodInDays value is compliant; a null keyPolicy is non-compliant. Audit from PowerShell $account = Get-AzStorageAccount -ResourceGroupName <resource-group> -Name <storage-account> $account.KeyPolicy.KeyExpirationPeriodInDays $account.KeyCreationTime A returned KeyExpirationPeriodInDays (the reminder interval; Microsoft
    recommends 90 days) is compliant; an empty value is non-compliant. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Poli...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage accounts. 2. For each non-compliant storage account, under Security + networking, select Access keys. 3. Select Set rotation reminder. 4. Check Enable key rotation reminders. 5. Under Send reminders, select Custom, then set Remind me every to 90 and the period to Days. 6. Select Save. Remediate from Azure CLI A key-expiration policy requires both account access keys to have been created at least once; rotate them first if their creation time is null. Then set the reminder interval (in days): az storage account update \ --name <storage-account> \ --resource-group <resource-group> \ --key-exp-days 90 Remediate from PowerShell $rgName = <resource-group> $accountName = <storage-account> $account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName if ($account.KeyCreationTime.Key1 -eq $null -or $account.KeyCreationTime.Key2 -eq $null) { Write-Output "You must regenerate both keys at least once before setting an expiration
    policy" } else { Set-AzStorageAccount -ResourceGroupName $rgName -Name $accountName - KeyExpirationPeriodInDay 90 }'
