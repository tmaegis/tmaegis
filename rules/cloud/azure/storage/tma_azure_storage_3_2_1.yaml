id: TMA-AZURE-STORAGE-3.2.1
title: Ensure soft delete on Recovery Services vaults is Enabled
description: Soft delete provides additional protection for Recovery Services vault data. With soft delete enabled, deleted backup data can be recovered within the retention period. Important backup data could be accidentally deleted or removed by a malicious actor. With soft delete enabled, data is retained for at least 14 days before permanent deletion, allowing for the recovery of the backup data.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 3.2.1 Ensure soft delete on Recovery Services vaults is Enabled
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Recovery Services vaults. 2. Click the name of a Recovery Services vault. 3. Under Settings, click Properties. 4. Under Soft Delete and security settings, click Update. 5. Ensure the box next to Enable soft delete for cloud workloads is checked. 6. Ensure the box next to Enable soft delete and security settings for hybrid workloads is checked. 7. Ensure that the Soft delete retention period is set to an appropriate value between 14 and 180, inclusive. 8. Repeat steps 1-7 for each Recovery Services vault. Audit from Azure CLI Run the following command to list Recovery Services vaults: az backup vault list For each Recovery Services vault, run the following command: az backup vault show --resource-group <resource-group> --name <recovery- services-vault> Ensure that under softDeleteSettings, softDeleteState is set to Enabled, enhancedSecurityState is set to Enabled, and softDeleteRetentionPeriodInDays is set to an appropriate value between 14 and
    180, inclusive. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, yo...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Recovery Services vaults. 2. Click the name of a Recovery Services vault. 3. Under Settings, click Properties. 4. Under Soft Delete and security settings, click Update. 5. Check the box next to Enable soft delete for cloud workloads. 6. Check the box next to Enable soft delete and security settings for hybrid workloads. 7. In the box next to Soft delete retention period, set an appropriate number of days for deleted data to be retained, between 14 and 180, inclusive. 8. If it is appropriate for your organization, check the box next to Enable always- on soft delete. Note: Once enabled, this setting cannot be disabled. 9. If enabling always-on soft delete, check the box next to Confirm enabling always-on soft delete. 10. Click Update. 11. Repeat steps 1-10 for each Recovery Services vault requiring remediation. Remediate from Azure CLI Run the following command to list Recovery Services vaults: az backup vault list For each Recovery Services
    vault requiring remediation, run the following command to enable soft delete and set an appropriate number of days for deleted data to be retained, between 14 and 180, inclusive: az backup vault backup-prop...'
