id: TMA-AZURE-STORAGE-17.3
title: Ensure Storage Explorer is using the latest version
description: Ensure all users accessing Azure Storage resources with Storage Explorer are using the latest version of the software, applying updates promptly to safeguard against new vulnerabilities and benefit from the latest security enhancements. Using the latest version of Storage Explorer is essential for safeguarding access to Azure Storage resources.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 17.3 Ensure Storage Explorer is using the latest version
audit:
  type: manual
  command: Audit from Storage Explorer for MacOS 1. Go to Storage Explorer. 2. From the menu bar, click Microsoft Azure Storage Explorer. 3. Click About. 4. Check the Version listed. 5. Compare the installed version with the latest released version from https://github.com/microsoft/AzureStorageExplorer/releases. 6. Ensure that the installed Storage Explorer version matches the latest released version.
remediation:
  type: iac_patch
  command: Remediate from Storage Explorer for MacOS 1. Go to Storage Explorer. 2. From the menu bar, click Microsoft Azure Storage Explorer. 3. Click Check for Updates. 4. Follow the instructions to install the latest version of Storage Explorer.
