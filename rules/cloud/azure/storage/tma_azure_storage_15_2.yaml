id: TMA-AZURE-STORAGE-15.2
title: Ensure that shared access signature (SAS) tokens expire within an hour
description: Shared access signature (SAS) tokens provide restricted access to Azure Storage resources (such as blobs, files, queues, or tables) for a defined time period with specific permissions. They enable users to interact with the resources without exposing account keys, offering precise control over the permitted actions (e.g., read, write) and the duration of access. To minimize security risks, SAS tokens should be configured with the shortest possible lifespan, ideally lasting no longer than an hour. A short lifespan for SAS tokens is recommended to minimize the risk of unauthorized access. SAS tokens grant time-limited access to resources, and a longer duration increases the opportunity for misuse if the token is compromised. By setting a shorter lifespan, the potential for security breaches is reduced.
target: azure
level: 2
severity: medium
tags:
- access-control
- auth
- azure
- cloud
- storage
reference: CIS Microsoft Azure Storage Services Benchmark v2.0.0 - 15.2 Ensure that shared access signature (SAS) tokens expire within an hour
audit:
  type: manual
  command: Currently, SAS token expiration times cannot be audited. Until Microsoft makes the token expiration time a setting rather than a token creation parameter, this recommendation will require manual verification.
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal If SAS have been created without a short lifespan and were created with a stored access policy (SAP), the SAS can be revoked by deleting the SAP or updating the SAP expiration time to a time in the past: 1. Go to Storage accounts. 2. Click on a storage account. 3. Under Data storage, click Queues. 4. Click the three dots next to a listed item. 5. Click Access policy. 6. Click the three dots next to an access policy. 7. Click Delete. 8. Click Save. 9. Repeat steps 1-8 as needed to revoke SAS created with SAP. If SAS have been created without a short lifespan and were not created with a SAP, the SAS can be revoked by regenerating the storage account access keys: Note: Regenerating access keys can affect any applications or Azure services that are dependent on the storage account key. 1. Go to Storage accounts. 2. Click on a storage account. 3. Under Security + networking, click Access keys. 4. Next to each key, click Rotate key. 5. Click Yes to confirm.
    6. Repeat steps 1-5 as needed to revoke SAS.'
