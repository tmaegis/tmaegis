id: TMA-AZURE-STORAGE-16.1.4
title: Ensure that a shared access signature (SAS) expiration policy is configured
description: Shared access signature (SAS) tokens grant delegated, time-bound access to data in a storage account. A SAS expiration policy is a storage-account-level setting that specifies a recommended upper limit (a maximum validity period) for the lifetime of those SAS tokens. When the policy is enabled, Azure evaluates every new SAS against the limit and either records (the default Log action) or rejects (the Block action) any SAS whose requested expiry exceeds it. This recommendation ensures that a SAS expiration policy is configured on the storage account so that a maximum SAS token validity is defined. SAS tokens grant time-bound, delegated access to storage data, and a leaked or over- shared token remains usable until it expires. Without an expiration policy, tokens can be minted with arbitrarily long lifetimes, widening the window in which a compromised token can be abused. Defining an ac...
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
