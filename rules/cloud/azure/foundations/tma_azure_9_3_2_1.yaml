id: TMA-AZURE-9.3.2.1
title: Ensure Private Endpoints are Used to Access Storage Accounts
description: Use private endpoints for your Azure Storage accounts to allow clients and services to securely access data located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures together. This creates further security through segmenting network traffic and preventing outside sources from accessing it. Securing traffic between services through encryption protects the data from easy interception and reading.
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.3.2.1 Ensure Private Endpoints are Used to Access Storage Accounts
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Open the Storage Accounts blade. 2. For each listed Storage Account, perform the following check: 3. Under the Security + networking heading, click on Networking. 4. Click on the Private endpoint connections tab at the top of the networking window. 5. Ensure that for each VNet that the Storage Account must be accessed from, a unique Private Endpoint is deployed and the Connection state for each Private Endpoint is Approved. Repeat the procedure for each Storage Account. Audit from PowerShell $storageAccount = Get-AzStorageAccount -ResourceGroup ''<ResourceGroupName>'' - Name ''<storageaccountname>'' Get-AzPrivateEndpoint -ResourceGroup ''<ResourceGroupName>''|Where-Object {$_.PrivateLinkServiceConnectionsText -match $storageAccount.id} If the results of the second command returns information, the Storage Account is using a Private Endpoint and complies with this Benchmark, otherwise if the results of the second command are empty, the Storage Account
    generates a finding. Audit from Azure CLI az storage account show --name ''<storage account name>'' --query "privateEndpointConnections[0].id" If the above command returns data, the Storage Account complies with th...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Open the Storage Accounts blade 2. For each listed Storage Account, perform the following: 3. Under the Security + networking heading, click on Networking 4. Click on the Private endpoint connections tab at the top of the networking window 5. Click the + Private endpoint button 6. In the 1 - Basics tab/step: o Enter a name that will be easily recognizable as associated with the Storage Account (Note: The "Network Interface Name" will be automatically completed, but you can customize it if needed.) o Ensure that the Region matches the region of the Storage Account o Click Next 7. In the 2 - Resource tab/step: o Select the target sub-resource based on what type of storage resource is being made available o Click Next 8. In the 3 - Virtual Network tab/step: o Select the Virtual network that your Storage Account will be connecting to o Select the Subnet that your Storage Account will be connecting to o (Optional) Select other network settings as appropriate
    for your environment o Click Next 9. In the 4 - DNS tab/step: o (Optional) Select other DNS settings as appropriate for your environment o Click Next 10. In the 5 - Tags tab/step: o (Optional) Set a...'
