id: TMA-AZURE-9.3.2.3
title: Ensure Default Network Access Rule for Storage Accounts is Set to Deny
description: 'Restricting default network access helps to provide a new layer of security, since storage accounts accept connections from clients on any network. To limit access to selected networks, the default action must be changed. NOTE: This recommendation is only applicable if Public Network Access has not been disabled due to necessity or exception. Storage accounts should be configured to deny access to traffic from all networks (including internet traffic). Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific applications to be built. Access can also be granted to public internet IP address ranges to enable connections from specific internet or on-premises clients. When network rules are configured, only applications from allowed networks can access a storage account. When calling from an allowed network, applications contin...'
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.3.2.3 Ensure Default Network Access Rule for Storage Accounts is Set to Deny
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage Accounts. 2. For each storage account, under Security + networking, click Networking. 3. Click the Firewalls and virtual networks heading. 4. Ensure that Public network access is not set to Enabled from all networks. Audit from Azure CLI Ensure defaultAction is not set to Allow. az storage account list --query ''[*].networkRuleSet'' Audit from PowerShell Connect-AzAccount Set-AzContext -Subscription <subscription ID> Get-AzStorageAccountNetworkRuleset -ResourceGroupName <resource group> -Name <storage account name> | Select-Object DefaultAction PowerShell Result - Non-Compliant DefaultAction : Allow PowerShell Result - Compliant DefaultAction : Deny Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 34c877ad-507e-4c82-993e-3452a6e0ad3c - Name: ''Storage accounts should restrict network access'' - Policy ID: 2a1a9cdf-e04d-429a-8416-3bfb72a1b26f - Name: ''Storage accounts sho...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Storage Accounts. 2. For each storage account, under Security + networking, click Networking. 3. Click the Firewalls and virtual networks heading. 4. Set Public network access to Enabled from selected virtual networks and IP addresses. 5. Add rules to allow traffic from specific networks and IP addresses. 6. Click Save. Remediate from Azure CLI Use the below command to update default-action to Deny. az storage account update --name <StorageAccountName> --resource-group <resourceGroupName> --default-action Deny
