id: TMA-AZURE-2.1.7
title: Ensure that Diagnostic Log Delivery is Configured for Azure Databricks
description: 'Azure Databricks Diagnostic Logging provides insights into system operations, user activities, and security events within a Databricks workspace. Enabling diagnostic logs helps organizations: - Detect security threats by logging access, job executions, and cluster activities. - Ensure compliance with industry regulations such as SOC 2, HIPAA, and GDPR. - Monitor operational performance and troubleshoot issues proactively. Diagnostic logging provides visibility into security and operational activities within Databricks workspaces while maintaining an audit trail for forensic investigations, and it supports compliance with regulatory standards that require logging and monitoring.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.7 Ensure that Diagnostic Log Delivery is Configured for Azure Databricks
audit:
  type: manual
  command: 'Audit from Azure Portal Check if diagnostic logging is enabled for the Databricks workspace: 1. Go to Azure Databricks. 2. Select a workspace. 3. In the left-hand menu, select Monitoring > Diagnostic settings. 4. Verify if a diagnostic setting is configured. If not, diagnostic logging is not enabled. Ensure that logging is enabled for the following categories: - accounts: User account activities. - Filesystem: Databricks Filesystem Logs - clusters: Cluster state changes and errors. - notebook: Execution events. - jobs: Job execution tracking. Verify that logs are being sent to one or more of the following destinations: - Azure Log Analytics workspace: For analysis and querying. - Azure Storage Account: For long-term retention. - Azure Event Hubs: For integration with SIEM tools. Audit from Azure CLI Check if diagnostic logging is enabled for the Databricks workspace: az monitor diagnostic-settings list --resource <databricks-resource-id> If the output is empty, no diagnostic
    settings are configured. Verify log categories being collected: az monitor diagnostic-settings show --name <setting-name> --resource <databricks-resource-id> Review the output to confirm that the necessary l...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Enable diagnostic logging for Azure Databricks: 1. Navigate to your Azure Databricks workspace. 2. In the left-hand menu, select Monitoring > Diagnostic settings. 3. Click + Add diagnostic setting. 4. Under Category details, select the log categories you wish to capture, such as AuditLogs, Clusters, Notebooks, and Jobs. 5. Choose a destination for the logs: o Log Analytics workspace: For advanced querying and monitoring. o Storage account: For long-term retention. o Event Hub: For integration with third-party systems. 6. Provide a Name for the diagnostic setting. 7. Click Save. Implement log retention policies: 1. Navigate to your Log Analytics workspace. 2. Under General, select Usage and estimated costs. 3. Click Data Retention. 4. Adjust the retention period slider to the desired number of days (up to 730 days). 5. Click OK. Monitor logs for anomalies: 1. Navigate to Azure Monitor. 2. Select Alerts > + New alert rule. 3. Under Scope, specify the
    Databricks resource. 4. Define Condition based on log queries that identify anomalies (e.g. unauthorized access attempts). 5. Configure Actions to notify stakeholders or trigger automated responses. 6. Prov...'
