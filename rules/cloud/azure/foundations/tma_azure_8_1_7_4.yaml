id: TMA-AZURE-8.1.7.4
title: Ensure That Microsoft Defender for SQL Servers on Machines Is Set To 'On'
description: Turning on Microsoft Defender for SQL servers on machines enables threat detection for SQL servers on machines, providing threat intelligence, anomaly detection, and behavior analytics in Microsoft Defender for Cloud. Enabling Microsoft Defender for SQL servers on machines allows for greater defense- in-depth, functionality for discovering and classifying sensitive data, surfacing and mitigating potential database vulnerabilities, and detecting anomalous activities that could indicate a threat to your database.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.7.4 Ensure That Microsoft Defender for SQL Servers on Machines Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Ensure the toggle switch next to SQL servers on machines is set to On. Audit from Azure CLI Ensure Defender for SQL is licensed with the following command: az security pricing show -n SqlServerVirtualMachines Ensure the ''PricingTier'' is set to ''Standard'' Audit from PowerShell Run the following command: Get-AzSecurityPricing -Name ''SqlServerVirtualMachines'' | Select-Object Name,PricingTier Ensure the ''PricingTier'' is set to ''Standard'' Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 6581d072-105e-4418-827f-bd446d56421b - Name: ''Azure Defender for SQL servers on machines should be enabled'' - Policy ID: abfb4388-5bf4-4ad7-ba82-2cd2f41ceae9 - Name: ''Azure Defender for SQL should...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Set the toggle switch next to SQL servers on machines to On. 7. Select Continue. 8. Select Save. Remediate from Azure CLI Run the following command: az security pricing create -n SqlServerVirtualMachines --tier ''standard'' Remediate from PowerShell Run the following command: Set-AzSecurityPricing -Name ''SqlServerVirtualMachines'' -PricingTier ''Standard'''
