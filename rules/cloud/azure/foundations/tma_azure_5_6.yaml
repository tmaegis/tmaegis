id: TMA-AZURE-5.6
title: Ensure that 'Subscription leaving Microsoft Entra tenant' and 'Subscription entering Microsoft Entra tenant' is set to 'Permit no one'
description: Users who are set as subscription owners are able to make administrative changes to the subscriptions and move them into and out of Microsoft Entra ID. Permissions to move subscriptions in and out of a Microsoft Entra tenant must only be given to appropriate administrative personnel. A subscription that is moved into a Microsoft Entra tenant may be within a folder to which other users have elevated permissions. This prevents loss of data or unapproved changes of the objects within by potential bad actors.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.6 Ensure that 'Subscription leaving Microsoft Entra tenant' and 'Subscription entering Microsoft Entra tenant' is set to 'Permit no one'
audit:
  type: manual
  command: Audit from Azure Portal 1. From the Azure Portal Home select the portal menu 2. Select Subscriptions 3. In the horizontal menu select Manage Policies 4. Ensure Subscription leaving Microsoft Entra tenant and Subscription entering Microsoft Entra tenant are set to Permit no one
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From the Azure Portal Home select the portal menu 2. Select Subscriptions 3. In the horizontal menu select Manage Policies 4. Set Subscription leaving Microsoft Entra tenant and Subscription entering Microsoft Entra tenant to Permit no one 5. Click Save changes
