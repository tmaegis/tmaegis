id: TMA-AZURE-8.1.7.3
title: Ensure That Microsoft Defender for (Managed Instance) Azure SQL Databases Is Set To 'On'
description: Turning on Microsoft Defender for Azure SQL Databases enables threat detection for Managed Instance Azure SQL databases, providing threat intelligence, anomaly detection, and behavior analytics in Microsoft Defender for Cloud. Enabling Microsoft Defender for Azure SQL Databases allows for greater defense-in- depth, includes functionality for discovering and classifying sensitive data, surfacing and mitigating potential database vulnerabilities, and detecting anomalous activities that could indicate a threat to your database.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.7.3 Ensure That Microsoft Defender for (Managed Instance) Azure SQL Databases Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Ensure the toggle switch next to Azure SQL Databases is set to On. Audit from Azure CLI Run the following command: az security pricing show -n SqlServers Ensure -PricingTier is set to Standard Audit from PowerShell Run the following command: Get-AzSecurityPricing -Name ''SqlServers'' | Select-Object Name,PricingTier Ensure the -PricingTier is set to Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 7fe3b40f-802b-4cdd-8bd4-fd799c948cc2 - Name: ''Azure Defender for
    Azure SQL Database servers should be enabled'' - Policy ID: abfb7388-5bf4-4ad7-ba99-2cd2f41cebb9 - Name: ''Azure Defender for SQL should be enabled for unprotected SQL Managed Instances'' - Policy ID: 3bc8a0d5-38e...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Set the toggle switch next to Azure SQL Databases to On. 7. Select Continue. 8. Select Save. Remediate from Azure CLI Run the following command: az security pricing create -n SqlServers --tier ''standard'' Remediate from PowerShell Run the following command: Set-AzSecurityPricing -Name ''SqlServers'' -PricingTier ''Standard'''
