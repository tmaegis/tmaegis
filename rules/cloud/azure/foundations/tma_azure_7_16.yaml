id: TMA-AZURE-7.16
title: Ensure Azure Network Security Perimeter is Used to Secure Azure Platform-as-a-service Resources
description: Azure Network Security Perimeter creates a logical boundary around Azure platform-as- a-service (PaaS) resources outside of virtual networks. By default, the network security perimeter denies public access to associated PaaS resources, with the ability to define explicit rules for inbound and outbound traffic. While an automated assessment procedure exists for this recommendation, the assessment status remains manual. Determining appropriate network security perimeter profiles and resource assignments depends on the context and requirements of each organization and environment. Network security perimeter denies public access to PaaS resources, reducing exposure and mitigating data exfiltration risks.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 7.16 Ensure Azure Network Security Perimeter is Used to Secure Azure Platform-as-a-service Resources
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Resource groups. 2. Click the name of a resource group. 3. Take note of PaaS resources. 4. Go to Network Security Perimeters. 5. Click the name of a network security perimeter. 6. Under Settings, click Associated resources. 7. Take note of the associated resources. 8. Repeat steps 1-7 and ensure each PaaS resource is associated with a network security perimeter. Audit from Azure CLI Run the following command to list resource groups: az group list For each resource group, run the following command to list resources: az resource list --resource-group <resource-group> Take note of PaaS resources. For each resource group, run the following command to list network security perimeters: az network perimeter list --resource-group <resource-group> For each network security perimeter, run the following command to list resources: az network perimeter association list --resource-group <resource-group> -- perimeter-name <network-security-perimeter> Ensure
    each PaaS resource is associated with a network security perimeter.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Create and associate PaaS resources with a new network security perimeter: 1. Go to Network Security Perimeters. 2. Click + Create. 3. Select a Subscription and Resource group, provide a Name, select a Region, and provide a Profile name. 4. Click Next. 5. Click + Add. 6. Check the box next to a PaaS resource to associate it with the network security perimeter. 7. Click Select. 8. Click Next. 9. Configure appropriate Inbound access rules for your organization. 10. Click Next. 11. Configure appropriate Outbound access rules for your organization. 12. Click Review + create. 13. Click Create. Associate PaaS resources with an existing network security perimeter: 1. Go to Network Security Perimeters. 2. Click the name of a network security perimeter. 3. Under Settings, click Associated resources. 4. Click + Add. 5. Select Associate resources with a new profile or Associate resources with an existing profile. 6. To associate resources with a new profile:
    a) Provide a Name. b) Click Next. c) Click + Add. d) Check the box next to a PaaS resource to associate it with the network security perimeter. e) Click Select. f) Click Next. g) Configure appropriate Inboun...'
