id: TMA-AZURE-6.1.1.6
title: Ensure that Virtual Network Flow Logs are Captured and Sent to Log Analytics
description: Ensure that virtual network flow logs are captured and fed into a central log analytics workspace. Virtual network flow logs provide critical visibility into traffic patterns. Sending logs to a Log Analytics workspace enables centralized analysis, correlation, and alerting for faster threat detection and response.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- logging
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.6 Ensure that Virtual Network Flow Logs are Captured and Sent to Log Analytics
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Network Watcher. 2. Under Logs, select Flow logs. 3. Click Add filter. 4. From the Filter drop-down menu, select Flow log type. 5. From the Value drop-down menu, check Virtual network only. 6. Click Apply. 7. Ensure that at least one virtual network flow log is listed and is configured to send logs to a Log Analytics Workspace. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 2f080164-9f4d-497e-9db6-416dc9f7b48a - Name: ''Network Watcher flow logs should have traffic analytics enabled'' - Policy ID: 4c3c6c5f-0d47-4402-99b8-aa543dd8bcee - Name: ''Audit flow logs configuration for every virtual network'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Network Watcher. 2. Under Logs, click Flow logs. 3. Click + Create. 4. Select a subscription. 5. Next to Flow log type, select Virtual network. 6. Click + Select target resource. 7. Select Virtual network. 8. Select a virtual network. 9. Click Confirm selection. 10. Select a storage account, or create a new storage account. 11. Set the retention in days for the storage account. 12. Click Next. 13. Under Analytics, for Flow logs version, select Version 2. 14. Check the box next to Enable traffic analytics. 15. Select a processing interval. 16. Select a Log Analytics Workspace. 17. Click Next. 18. Optionally, add Tags. 19. Click Review + create. 20. Click Create. 21. Repeat steps 1-20 for each subscription or virtual network requiring remediation.
