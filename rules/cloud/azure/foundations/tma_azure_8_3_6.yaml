id: TMA-AZURE-8.3.6
title: Ensure that Role Based Access Control for Azure Key Vault is Enabled
description: The recommended way to access Key Vaults is to use the Azure Role-Based Access Control (RBAC) permissions model. Azure RBAC is an authorization system built on Azure Resource Manager that provides fine-grained access management of Azure resources. It allows users to manage Key, Secret, and Certificate permissions. It provides one place to manage all permissions across all key vaults. The new RBAC permissions model for Key Vaults enables a much finer grained access control for key vault secrets, keys, certificates, etc., than the vault access policy. This in turn will permit the use of privileged identity management over these roles, thus securing the key vaults with JIT Access management.
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
- crypto
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.3.6 Ensure that Role Based Access Control for Azure Key Vault is Enabled
audit:
  type: manual
  command: 'Requisite Permissions - read section overview! Data-plane access not required. Can be audited and remediated with Azure Resource Manager permissions. Audit from Azure Portal 1. From Azure Home open the Portal Menu in the top left corner. 2. Select Key Vaults. 3. Select a Key Vault to audit. 4. Under Settings select Access configuration. 5. Ensure the Permission Model radio button is set to Azure role-based access control. Audit from Azure CLI Run the following command for each Key Vault in each Resource Group: az keyvault show --resource-group <resource_group> --name <vault_name> Ensure the enableRbacAuthorization setting is set to true within the output of the above command. Audit from PowerShell Run the following PowerShell command: Get-AzKeyVault -Vaultname <vault_name> -ResourceGroupName <resource_group> Ensure the Enabled For RBAC Authorization setting is set to True Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a
    link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions...'
remediation:
  type: iac_patch
  command: 'Requisite Permissions - read section overview! Data-plane access not required. Can be audited and remediated with Azure Resource Manager permissions. Remediate from Azure Portal Key Vaults can be configured to use Azure role-based access control on creation. For existing Key Vaults: 1. From Azure Home open the Portal Menu in the top left corner 2. Select Key Vaults 3. Select a Key Vault to audit 4. Under Settings select Access configuration 5. Set the Permission model radio button to Azure role-based access control, taking note of the warning message 6. Click Save 7. Select Access Control (IAM) 8. Select the Role Assignments tab 9. Reapply permissions as needed to groups or users Remediate from Azure CLI To enable RBAC Authorization for each Key Vault, run the following Azure CLI command: az keyvault update --resource-group <resource_group> --name <vault_name> -- enable-rbac-authorization true Remediate from PowerShell To enable RBAC authorization on each Key Vault, run the following
    PowerShell command: Update-AzKeyVault -ResourceGroupName <resource_group> -VaultName <vault_name> -EnableRbacAuthorization $True'
