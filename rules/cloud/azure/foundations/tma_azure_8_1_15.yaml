id: TMA-AZURE-8.1.15
title: Ensure that 'Notify about attack paths with the following risk level (or higher)' is Enabled
description: Enables emailing attack paths to the subscription owner or other designated security contact. Enabling attack path emails ensures that attack path emails are sent by Microsoft. This ensures that the right people are aware of any potential security issues and can mitigate the risk.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.15 Ensure that 'Notify about attack paths with the following risk level (or higher)' is Enabled
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment settings. 4. Click on the appropriate Subscription. 5. Click on Email notifications. 6. Under Notification types, ensure that the box next to Notify about attack paths with the following risk level (or higher) is checked, and an appropriate risk level is selected. 7. Repeat steps 1-6 for each Subscription. Audit from Azure CLI Including a Subscription ID at the $0 in /subscriptions/$0/providers, ensure the below command returns "sourceType": "AttackPath", and that "minimalRiskLevel" is set to an appropriate risk level: az account get-access-token --query "{subscription:subscription,accessToken:accessToken}" --out tsv | xargs -L1 bash -c ''curl -X GET -H "Authorization: Bearer $1" -H "Content-Type: application/json" https://management.azure.com/subscriptions/$0/providers/Microsoft.Security/se curityContacts?api-version=2023-12-01-preview''
    | jq ''.|.[]'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment settings. 4. Click on the appropriate Subscription. 5. Click on Email notifications. 6. Under Notification types, check the box next to Notify about attack paths with the following risk level (or higher), and select an appropriate risk level from the drop-down menu. 7. Repeat steps 1-6 for each Subscription.
