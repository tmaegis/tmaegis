id: TMA-AZURE-8.1.1.1
title: Ensure Microsoft Defender CSPM is Set to 'On'
description: Enable Microsoft Defender CSPM to continuously assess cloud resources for security misconfigurations, compliance risks, and exposure to threats. Microsoft Defender CSPM provides detailed visibility into the security state of assets and workloads and offers hardening guidance to help improve security posture.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.1.1 Ensure Microsoft Defender CSPM is Set to 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, click Environment settings. 3. Click the name of a subscription. 4. Select the Defender plans blade. 5. Under Cloud Security Posture Management (CSPM), in the row for Defender CSPM, ensure Status is set to On. Audit from Azure CLI Run the following command to get the CloudPosture plan pricing tier: az security pricing show --name CloudPosture --query pricingTier Ensure "Standard" is returned. Audit from PowerShell Run the following command to get the CloudPosture plan pricing tier: Get-AzSecurityPricing -Name CloudPosture | Select-Object PricingTier Ensure Standard is returned. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy
    ID: 1f90fc71-a595-4066-8974-d4d0802e8ef0 - Name: ''Microsoft Defender CSPM should be enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, click Environment settings. 3. Click the name of a subscription. 4. Select the Defender plans blade. 5. Under Cloud Security Posture Management (CSPM), in the row for Defender CSPM, set the toggle switch for Status to On. 6. Click Save. Remediate from Azure CLI Run the following command to enable Defender CSPM: az security pricing create --name CloudPosture --tier Standard --extensions name=ApiPosture isEnabled=true Remediate from PowerShell Run the following command to enable Defender CSPM: Set-AzSecurityPricing -Name CloudPosture -PricingTier Standard -Extension ''[{"name":"ApiPosture","isEnabled":"True"}]'''
