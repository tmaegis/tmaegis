id: TMA-AZURE-5.3.4
title: Ensure that All 'Privileged' Role Assignments are Periodically Reviewed
description: 'Periodic review of privileged role assignments is performed to ensure that the privileged roles assigned to users are accurate and appropriate. Privileged roles are crown jewel assets that can be used by malicious insiders, threat actors, and even through mistake to significantly damage an organization in numerous ways. These roles should be periodically reviewed to: - identify lingering permissions assignment (e.g. an administrator has been terminated, the administrator account is being retained, but the permissions are no longer necessary and has not been properly addressed by process) - detect lateral movement through privilege escalation (e.g. an account with administrative permission has been compromised and is elevating other accounts in an attempt to circumvent detection mechanisms)'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.3.4 Ensure that All 'Privileged' Role Assignments are Periodically Reviewed
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Subscriptions. 3. Select a subscription. 4. Select Access control (IAM). 5. In the horizontal menu, select Roles. 6. In the second horizontal menu select Privileged administrator roles. 7. For each role, audit by selecting the View link under the Details column. 8. Once selected, choose Assignments to view the users and resources that are assigned the role. NOTE: The judgement of what constitutes ''appropriate and current'' assignments requires a clear understanding of your organization''s personnel, systems, policy, and security requirements. This cannot be effectively prescribed in procedure.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS Microsoft Azure Foundations Benchmark v6.0.0 section 5.3.4 to configure: Ensure that All ''Privileged'' Role Assignments are Periodically Reviewed.'
