id: TMA-AZURE-8.1.6.1
title: Ensure That Microsoft Defender for App Services Is Set To 'On'
description: Turning on Microsoft Defender for App Service enables threat detection for App Service, providing threat intelligence, anomaly detection, and behavior analytics in the Microsoft Defender for Cloud. Enabling Microsoft Defender for App Service allows for greater defense-in-depth, with threat detection provided by the Microsoft Security Response Center (MSRC).
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.6.1 Ensure That Microsoft Defender for App Services Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud 2. Under Management, select Environment Settings 3. Click on the subscription name 4. Select Defender plans 5. Ensure Status is On for App Service Audit from Azure CLI Run the following command: az security pricing show -n AppServices Ensure -PricingTier is set to Standard Audit from PowerShell Run the following command: Get-AzSecurityPricing -Name ''AppServices'' |Select-Object Name,PricingTier Ensure the -PricingTier is set to Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 2913021d-f2fd-4f3d-b958-22354e2bdbcb - Name: ''Azure Defender for App Service should be enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud 2. Under Management, select Environment Settings 3. Click on the subscription name 4. Select Defender plans 5. Set App Service Status to On 6. Select Save Remediate from Azure CLI Run the following command: az security pricing create -n Appservices --tier ''standard'' Remediate from PowerShell Run the following command: Set-AzSecurityPricing -Name "AppServices" -PricingTier "Standard"'
