id: TMA-AZURE-6.1.1.5
title: Ensure that Network Security Group Flow Logs are Captured and Sent to Log Analytics
description: Ensure that network flow logs are captured and fed into a central log analytics workspace. Retirement Notice On September 30, 2027, network security group (NSG) flow logs will be retired. As of June 30, 2025, creating new NSG flow logs is no longer possible. Azure recommends migrating to virtual network flow logs. Review https://azure.microsoft.com/en- us/updates?id=Azure-NSG-flow-logs-Retirement for more information. For virtual network flow logs, consider applying the recommendation, Ensure that virtual network flow logs are captured and sent to Log Analytics, from this section. Network Flow Logs provide valuable insight into the flow of traffic around your network and feed into both Azure Monitor and Azure Sentinel (if in use), permitting the generation of visual flow diagrams to aid with analyzing for lateral movement, etc.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- logging
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.5 Ensure that Network Security Group Flow Logs are Captured and Sent to Log Analytics
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Navigate to Network Watcher. 2. Under Logs, select Flow logs. 3. Click Add filter. 4. From the Filter drop-down, select Flow log type. 5. From the Value drop-down, check Network security group only. 6. Click Apply. 7. Ensure that at least one network security group flow log is listed and is configured to send logs to a Log Analytics Workspace. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 27960feb-a23c-4577-8d36-ef8b5f35e0be - Name: ''All flow log resources should be in enabled state'' - Policy ID: c251913d-7d24-4958-af87-478ed3b9ba41 - Name: ''Flow logs should be configured for every network security group'' - Policy ID: 4c3c6c5f-0d47-4402-99b8-aa543dd8bcee - Name: ''Flow logs
    should be configured for every virtual network'''
remediation:
  type: iac_patch
  command: As of June 30, 2025, creating new NSG flow logs is no longer possible. Azure recommends migrating to virtual network flow logs. Consider applying the recommendation, Ensure that virtual network flow logs are captured and sent to Log Analytics, from this section.
