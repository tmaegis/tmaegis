id: TMA-AZURE-8.3.1
title: Ensure that the Expiration Date is Set for all Keys in Key Vaults using RBAC
description: 'Ensure that all Keys in Azure Key Vaults using Role Based Access Control (RBAC) have an expiration date set. Note: The audit commands require data-plane access to each Key Vault in addition to the management-plane Reader role. Without data-plane access these commands return empty results silently. The Azure Key Vault enables users to store and use cryptographic keys within the Microsoft Azure environment. The exp (expiration date) attribute identifies the expiration date on or after which the key MUST NOT be used for encryption of new data, wrapping of new keys, and signing. By default, keys never expire. It is thus recommended that keys be rotated in the key vault and set an explicit expiration date for all keys to help enforce the key rotation. This ensures that the keys cannot be used beyond their assigned lifetimes.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- crypto
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.3.1 Ensure that the Expiration Date is Set for all Keys in Key Vaults using RBAC
audit:
  type: manual
  command: 'Requisite RBAC Permissions for Keys - read section overview! Audit Role = Key Vault Crypto User Audit from Azure Portal 1. Go to Key vaults. 2. For each Key vault, under Objects select, Keys. 3. In the main pane, ensure that the status of the key is enabled. 4. For each enabled key, ensure that an appropriate Expiration date is set. Audit from Azure CLI Get a list of all the key vaults in your Azure environment by running the following command: az keyvault list Then for each key vault listed ensure that the output of the below command contains Key ID (kid), enabled status as true and Expiration date (expires) is not empty or null: az keyvault key list --vault-name <VaultName> --query ''[*].{"kid":kid,"enabled":attributes.enabled,"expires":attributes.expires}'' Audit from PowerShell Retrieve a list of Azure Key Vaults: Get-AzKeyVault For each Key vault run the following command to determine which vaults are configured to use RBAC. (Get-AzKeyVault -VaultName <Vault Name>).EnableRbacAuthorization
    For each Key vault with the EnableRbacAuthorization setting set to True, run the following command. Get-AzKeyVaultKey -VaultName <Vault Name> | Where-Object { $_.Enabled -and - not $_.Expire...'
remediation:
  type: iac_patch
  command: 'Requisite RBAC Permissions for Keys - read section overview! Remediation Role = Key Vault Crypto Officer Remediate from Azure Portal 1. Go to Key vaults. 2. For each Key vault, under Objects, select Keys. 3. In the main pane, ensure that the status of the key(s) is Enabled. 4. Click on the Key without Expiration date. 5. Click the checkbox Set expiration date and set an appropriate Expiration date on the Key. 6. Click Apply. Remediate from Azure CLI Update the Expiration date for the key using the below command: az keyvault key set-attributes --name <keyName> --vault-name <vaultName> -- expires Y-m-d''T''H:M:S''Z'' Remediate from PowerShell Set-AzKeyVaultKeyAttribute -VaultName <VaultName> -Name <KeyName> -Expires <DateTime>'
