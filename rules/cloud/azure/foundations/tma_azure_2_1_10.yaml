id: TMA-AZURE-2.1.10
title: Ensure 'Allow Public Network Access' is set to 'Disabled'
description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access. Use private endpoints to securely manage access within trusted networks. Disabling public network access improves security by ensuring that Azure Databricks workspaces are not exposed on the public internet.
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.10 Ensure 'Allow Public Network Access' is set to 'Disabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings click Networking. 4. Under Network access, ensure Allow Public Network Access is set to Disabled. 5. Repeat steps 1-4 for each workspace. Audit from Azure CLI Run the following command to list workspaces: az databricks workspace list For each workspace, run the following command to get the publicNetworkAccess setting: az databricks workspace show --resource-group <resource-group> --name <workspace> --query publicNetworkAccess Ensure that "Disabled" is returned. Audit from PowerShell Run the following command to list workspaces: Get-AzDatabricksWorkspace Run the following command to get the workspace in a resource group with a given name: $workspace = Get-AzDatabricksWorkspace -ResourceGroupName <resource-group> - Name <workspace> Run the following command to get the PublicNetworkAccess setting: $workspace.PublicNetworkAccess Ensure that Disabled is returned. Repeat for each
    workspace. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings click Networking. 4. Under Network access, next to Allow Public Network Access, click the radio button next to Disabled. 5. Click Save. 6. Repeat steps 1-5 for each workspace requiring remediation. Remediate from Azure CLI For each workspace requiring remediation, run the following command to set publicNetworkAccess to Disabled: az databricks workspace update --resource-group <resource-group> --name <workspace> --public-network-access Disabled Remediate from PowerShell For each workspace requiring remediation, run the following command to set PublicNetworkAccess to Disabled: Update-AzDatabricksWorkspace -ResourceGroupName <resource-group> -Name <workspace> -PublicNetworkAccess Disabled'
