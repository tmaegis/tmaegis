id: TMA-AZURE-6.1.1.7
title: Ensure that a Microsoft Entra Diagnostic Setting Exists to Send Microsoft Graph Activity Logs to an Appropriate Destination
description: Ensure that a Microsoft Entra diagnostic setting is configured to send Microsoft Graph activity logs to a suitable destination, such as a Log Analytics workspace, storage account, or event hub. This enables centralized monitoring and analysis of all HTTP requests that the Microsoft Graph service receives and processes for a tenant. Microsoft Graph activity logs provide visibility into HTTP requests made to the Microsoft Graph service, helping detect unauthorized access, suspicious activity, and security threats. Configuring diagnostic settings in Microsoft Entra ensures these logs are collected and sent to an appropriate destination for monitoring, analysis, and retention.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.7 Ensure that a Microsoft Entra Diagnostic Setting Exists to Send Microsoft Graph Activity Logs to an Appropriate Destination
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to Microsoft Entra ID. 2. Under Monitoring, click Diagnostic settings. 3. Next to each diagnostic setting, click Edit setting, and review the selected log categories and destination details. 4. Ensure that at least one diagnostic setting is configured to send MicrosoftGraphActivityLogs to an appropriate destination.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Microsoft Entra ID. 2. Under Monitoring, click Diagnostic settings. 3. Click + Add diagnostic setting. 4. Provide a Diagnostic setting name. 5. Under Logs > Categories, check the box next to MicrosoftGraphActivityLogs. 6. Configure an appropriate destination for the logs. 7. Click Save.
