id: TMA-AZURE-8.1.14
title: Ensure that 'Notify about alerts with the following severity (or higher)' is Enabled
description: Enables emailing security alerts to the subscription owner or other designated security contact. Enabling security alert emails ensures that security alert emails are sent by Microsoft. This ensures that the right people are aware of any potential security issues and can mitigate the risk.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.14 Ensure that 'Notify about alerts with the following severity (or higher)' is Enabled
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment settings. 4. Click on the appropriate Subscription. 5. Click on Email notifications. 6. Under Notification types, ensure that the box next to Notify about alerts with the following severity (or higher) is checked, and an appropriate severity level is selected. 7. Repeat steps 1-6 for each Subscription. Audit from Azure CLI Including a Subscription ID at the $0 in /subscriptions/$0/providers, ensure the below command returns "state": "On", and that "minimalSeverity" is set to an appropriate severity level: az account get-access-token --query "{subscription:subscription,accessToken:accessToken}" --out tsv | xargs -L1 bash -c ''curl -X GET -H "Authorization: Bearer $1" -H "Content-Type: application/json" https://management.azure.com/subscriptions/$0/providers/Microsoft.Security/se curityContacts?api-version=2020-01-01-preview'' | jq ''.|.[]
    | select(.name=="default")''|jq ''.properties.alertNotifications'' Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy def...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment settings. 4. Click on the appropriate Subscription. 5. Click on Email notifications. 6. Under Notification types, check box next to Notify about alerts with the following severity (or higher) and select an appropriate severity level from the drop-down menu. 7. Click Save. 8. Repeat steps 1-7 for each Subscription requiring remediation. Remediate from Azure CLI Use the below command to enable Send email notification for high severity alerts: az account get-access-token --query "{subscription:subscription,accessToken:accessToken}" --out tsv | xargs -L1 bash -c ''curl -X PUT -H "Authorization: Bearer $1" -H "Content-Type: application/json" https://management.azure.com/subscriptions/<$0>/providers/Microsoft.Security/ securityContacts/default1?api-version=2017-08-01-preview -d@"input.json"'' Where input.json contains the data below,
    replacing validEmailAddress with a single email address or multiple comma-separated email addresses: { "id": "/subscriptions/<subscriptionId>/providers/Microsoft.Security/securityContact s/default", "name": "...'
