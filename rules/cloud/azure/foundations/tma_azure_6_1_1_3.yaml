id: TMA-AZURE-6.1.1.3
title: Ensure the Storage Account Containing the Container with Activity Logs is Encrypted with Customer-managed Key (CMK)
description: Customer-managed keys introduce additional depth to security by providing a means to manage access control for encryption keys. Where compliance and security frameworks indicate the need, and organizational capacity allows, sensitive data at rest can be encrypted using customer-managed keys (CMK) rather than Microsoft-managed keys. By default in Azure, data at rest tends to be encrypted using Microsoft-managed keys. If your organization wants to control and manage encryption keys for compliance and defense-in-depth, customer-managed keys can be established. Configuring the storage account with the activity log export container to use CMKs provides additional confidentiality controls on log data, as a given user must have read permission on the corresponding storage account and must be granted decrypt permission by the CMK. While it is possible to automate the assessment of this recomm...
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- containers
- crypto
- encryption
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.3 Ensure the Storage Account Containing the Container with Activity Logs is Encrypted with Customer-managed Key (CMK)
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Monitor. 2. Select Activity log. 3. Select Export Activity Logs. 4. Select a Subscription. 5. Note the name of the Storage Account for the diagnostic setting. 6. Navigate to Storage accounts. 7. Click on the storage account name noted in Step 5. 8. Under Security + networking, click Encryption. 9. Ensure Customer-managed keys is selected and a key is set. Audit from Azure CLI 1. Get storage account id configured with log profile: az monitor diagnostic-settings subscription list --subscription <subscription id> --query ''value[*].storageAccountId'' 2. Ensure the storage account is encrypted with CMK: az storage account list --query "[?name==''<Storage Account Name>'']" In command output ensure keySource is set to Microsoft.Keyvault and keyVaultProperties is not set to null Audit from PowerShell Get-AzStorageAccount -ResourceGroupName <resource group name> -Name <storage account name>|select-object -ExpandProperty encryption|format-list Ensure the
    value of KeyVaultProperties is not null or empty, and ensure KeySource is not set to Microsoft.Storage. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Monitor. 2. Select Activity log. 3. Select Export Activity Logs. 4. Select a Subscription. 5. Note the name of the Storage Account for the diagnostic setting. 6. Navigate to Storage accounts. 7. Click on the storage account. 8. Under Security + networking, click Encryption. 9. Next to Encryption type, select Customer-managed keys. 10. Complete the steps to configure a customer-managed key for encryption of the storage account. Remediate from Azure CLI az storage account update --name <name of the storage account> --resource- group <resource group for a storage account> --encryption-key- source=Microsoft.Keyvault --encryption-key-vault <Key Vault URI> -- encryption-key-name <KeyName> --encryption-key-version <Key Version> Remediate from PowerShell Set-AzStorageAccount -ResourceGroupName <resource group name> -Name <storage account name> -KeyvaultEncryption -KeyVaultUri <key vault URI> -KeyName <key name>
