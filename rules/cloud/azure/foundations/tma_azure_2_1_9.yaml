id: TMA-AZURE-2.1.9
title: Ensure 'No Public IP' is Set to 'Enabled'
description: Enable secure cluster connectivity (also known as no public IP) on Azure Databricks workspaces to ensure that clusters do not have public IP addresses and communicate with the control plane over a secure connection. Enabling secure cluster connectivity limits exposure to the public internet, improving security and reducing the risk of external attacks.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.9 Ensure 'No Public IP' is Set to 'Enabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings, click Networking. 4. Under Network access, ensure that Deploy Azure Databricks workspace with Secure Cluster Connectivity (No Public IP) is set to Enabled. 5. Repeat steps 1-4 for each workspace. Audit from Azure CLI Run the following command to list workspaces: az databricks workspace list For each workspace, run the following command to get the enableNoPublicIp setting: az databricks workspace show --resource-group <resource-group> --name <workspace> --query parameters.enableNoPublicIp.value Ensure that true is returned. Audit from PowerShell Run the following command to list workspaces: Get-AzDatabricksWorkspace Run the following command to get the workspace in a resource group with a given name: $workspace = Get-AzDatabricksWorkspace -ResourceGroupName <resource-group> - Name <workspace> Run the following command to get the EnableNoPublicIp setting: $workspace.EnableNoPublicIP
    Ensure that True is returned. Repeat for each workspace. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy defini...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings, click Networking. 4. Under Network access, next to Deploy Azure Databricks workspace with Secure Cluster Connectivity (No Public IP), click the radio button next to Enabled. 5. Click Save. 6. Repeat steps 1-5 for each workspace requiring remediation. Remediate from Azure CLI For each workspace requiring remediation, run the following command to set enableNoPublicIp to true: az databricks workspace update --resource-group <resource-group> --name <workspace> --enable-no-public-ip true Remediate from PowerShell For each workspace requiring remediation, run the following command to set EnableNoPublicIP to True: Update-AzDatabricksWorkspace -ResourceGroupName <resource-group> -Name <workspace> -EnableNoPublicIP'
