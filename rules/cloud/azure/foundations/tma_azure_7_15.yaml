id: TMA-AZURE-7.15
title: Ensure Bot Protection is Enabled in Azure Web Application Firewall Policy on Azure Application Gateway
description: Enable bot protection on the Web Application Firewall to block or log requests from known malicious IP addresses identified through the Microsoft Threat Intelligence feed. Internet traffic from bots can scrape, scan, and search for application vulnerabilities. Enabling bot protection stops requests from known malicious IP addresses and enhances the overall security of your application by reducing exposure to automated attacks.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 7.15 Ensure Bot Protection is Enabled in Azure Web Application Firewall Policy on Azure Application Gateway
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Application gateways. 2. Click the name of an application gateway. 3. Under Settings, click Web application firewall. 4. Under Associated web application firewall policy, click the policy name. 5. Under Settings, click Managed rules. 6. Ensure a Rule Id containing Microsoft_BotManagerRuleSet is listed. 7. Click the > to expand the row. 8. Ensure the Status for Malicious Bots is set to Enabled. 9. Repeat steps 1-8 for each application gateway. Audit from Azure CLI Run the following command to list application gateways: az network application-gateway list For each application gateway, run the following command to get the firewall policy id: az network application-gateway show --resource-group <resource-group> --name <application-gateway> --query firewallPolicy.id For each firewall policy, run the following command to get the managed rule sets: az network application-gateway waf-policy show --ids <firewall-policy> -- query managedRules.managedRuleSets
    Ensure a managed rule set with ruleSetType of Microsoft_BotManagerRuleSet is returned, and that no ruleGroupOverrides for ruleGroupName KnownBadBots with state Disabled are returned. Audit from Azure P...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Application gateways. 2. Click the name of an application gateway. 3. Under Settings, click Web application firewall. 4. Under Associated web application firewall policy, click the policy name. 5. Under Settings, click Managed rules. 6. Click Assign. 7. Under Bot Management ruleset, click to display the drop-down menu. 8. Select a Microsoft_BotManagerRuleSet. 9. Click Save. 10. Click X to close the panel. 11. Repeat steps 1-10 for each application gateway and firewall policy requiring remediation. Remediate from Azure CLI For each firewall policy requiring remediation, run the following command to enable bot protection: az network application-gateway waf-policy managed-rule rule-set add -- resource-group <resource-group> --policy-name <firewall-policy> --type Microsoft_BotManagerRuleSet --version <0.1|1.0|1.1>'
