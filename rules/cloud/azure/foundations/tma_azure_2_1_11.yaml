id: TMA-AZURE-2.1.11
title: Ensure Private Endpoints are used to access Azure Databricks workspaces
description: Use private endpoints for Azure Databricks workspaces to allow clients and services to securely access data located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures together. This creates further security through segmenting network traffic and preventing outside sources from accessing it. Using private endpoints for Azure Databricks workspaces ensures that all communication between clients, services, and data sources occurs over a secure, private IP space within an Azure Virtual Network (VNet). This approach eliminates exposure to the publ...
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.11 Ensure Private Endpoints are used to access Azure Databricks workspaces
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings, click Networking. 4. Click Private endpoint connections. 5. Ensure a private endpoint connection exists with a connection state of Approved. 6. Repeat steps 1-5 for each workspace. Audit from Azure CLI Run the following command to list workspaces: az databricks workspace list For each workspace, run the following command to get the privateEndpointConnections configuration: az databricks workspace show --resource-group <resource-group> --name <workspace> --query privateEndpointConnections Ensure a private endpoint connection is returned with a privateLinkServiceConnectionState status of Approved. Audit from PowerShell Run the following command to list workspaces: Get-AzDatabricksWorkspace Run the following command to get the workspace in a resource group with a given name: $workspace = Get-AzDatabricksWorkspace -ResourceGroupName <resource-group> - Name <workspace> Run the following
    command to get the PrivateEndpointConnection configuration: $workspace.PrivateEndpointConnection | Select-Object -Property Id,PrivateLinkServiceConnectionStateStatus Ensure a private endpoint connec...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Databricks. 2. Click the name of a workspace. 3. Under Settings, click Networking. 4. Click Private endpoint connections. 5. Click + Private endpoint. 6. Under Project details, select a Subscription and a Resource group. 7. Under Instance details, provide a Name, Network Interface Name, and select a Region. 8. Click Next : Resource >. 9. Select a Target sub-resource. 10. Click Next : Virtual Network >. 11. Under Networking, select a Virtual network and a Subnet. 12. Optionally, configure Private IP configuration and Application security group. 13. Click Next : DNS >. 14. Optionally, configure Private DNS integration. 15. Click Next : Tags >. 16. Optionally, configure tags. 17. Click Next : Review + create >. 18. Click Create. 19. Repeat steps 1-18 for each workspace requiring remediation. Remediate from Azure CLI For each workspace requiring remediation, run the following command to create a private endpoint connection: az network private-endpoint
    create --resource-group <resource-group> --name <private-endpoint> --location <location> --vnet-name <virtual-network> -- subnet <subnet> --private-connection-resource-id <workspace> --connect...'
