id: TMA-AZURE-6.1.2.4
title: Ensure that Activity Log Alert Exists for Delete Network Security Group
description: Create an activity log alert for the Delete Network Security Group event. Monitoring for "Delete Network Security Group" events gives insight into network access changes and may reduce the time it takes to detect suspicious activity.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- logging
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.2.4 Ensure that Activity Log Alert Exists for Delete Network Security Group
audit:
  type: manual
  command: Audit from Azure Portal 1. Navigate to the Monitor blade. 2. Click on Alerts. 3. In the Alerts window, click on Alert rules. 4. Ensure an alert rule exists where the Condition column contains Operation name=Microsoft.Network/networkSecurityGroups/delete. 5. Click on the Alert Name associated with the previous step. 6. Ensure the Condition panel displays the text Whenever the Activity Log has an event with Category='Administrative', Operation name='Delete Network Security Group' and does not filter on Level, Status or Caller. 7. Ensure the Actions panel displays an Action group is assigned to notify the appropriate personnel in your organization. Audit from Azure CLI az monitor activity-log alert list --subscription <subscription ID> --query "[].{Name:name,Enabled:enabled,Condition:condition.allOf,Actions:actions}" Look for Microsoft.Network/networkSecurityGroups/delete in the output Audit from PowerShell Get-AzActivityLogAlert -SubscriptionId <subscription ID>|where-object {$_.ConditionAllOf.Equal
    -match "Microsoft.Network/networkSecurityGroups/delete"}|select-object Location,Name,Enabled,ResourceGroupName,ConditionAllOf Audit from Azure Policy If referencing a digital copy of t...
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Navigate to the Monitor blade. 2. Select Alerts. 3. Select Create. 4. Select Alert rule. 5. Choose a subscription. 6. Select Apply. 7. Select the Condition tab. 8. Click See all signals. 9. Select Delete Network Security Group (Network Security Group). 10. Click Apply. 11. Select the Actions tab. 12. Click Select action groups to select an existing action group, or Create action group to create a new action group. 13. Follow the prompts to choose or create an action group. 14. Select the Details tab. 15. Select a Resource group, provide an Alert rule name and an optional Alert rule description. 16. Click Review + create. 17. Click Create. Remediate from Azure CLI az monitor activity-log alert create --resource-group "<resource group name>" --condition category=Administrative and operationName=Microsoft.Network/networkSecurityGroups/delete and level=<verbose | information | warning | error | critical> --scope "/subscriptions/<subscription ID>" --name
