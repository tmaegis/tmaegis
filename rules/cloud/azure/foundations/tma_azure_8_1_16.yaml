id: TMA-AZURE-8.1.16
title: Ensure that Microsoft Defender External Attack Surface Monitoring (EASM) is Enabled
description: An organization's attack surface is the collection of assets with a public network identifier or URI that an external threat actor can see or access from outside your cloud. It is the set of points on the boundary of a system, a system element, system component, or an environment where an attacker can try to enter, cause an effect on, or extract data from, that system, system element, system component, or environment. The larger the attack surface, the harder it is to protect. This tool can be configured to scan your organization's online infrastructure such as specified domains, hosts, CIDR blocks, and SSL certificates, and store them in an Inventory. Inventory items can be added, reviewed, approved, and removed, and may contain enrichments ("insights") and additional information collected from the tool's different scan engines and open-source intelligence sources. A Defender EASM wo...
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- monitoring
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.16 Ensure that Microsoft Defender External Attack Surface Monitoring (EASM) is Enabled
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to Microsoft Defender EASM. 2. Ensure that at least one Microsoft Defender EASM workspace is listed. 3. Click the name of a workspace. 4. Ensure the workspace is configured appropriately for your environment and organization. 5. Repeat steps 3-4 for each workspace.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Microsoft Defender EASM. 2. Click + Create. 3. Under Project details, select a subscription. 4. Select or create a resource group. 5. Under Instance details, enter a name for the workspace. 6. Select a region. 7. Click Review + create. 8. Click Create. 9. Once the deployment has completed, go to Microsoft Defender EASM. 10. Click the workspace name. 11. Configure the workspace appropriately for your environment and organization.
