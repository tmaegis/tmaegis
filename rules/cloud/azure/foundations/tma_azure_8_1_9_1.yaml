id: TMA-AZURE-8.1.9.1
title: Ensure That Microsoft Defender for Resource Manager Is Set To 'On'
description: Microsoft Defender for Resource Manager scans incoming administrative requests to change your infrastructure from both CLI and the Azure portal. Scanning resource requests lets you be alerted every time there is suspicious activity in order to prevent a security threat from being introduced.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.9.1 Ensure That Microsoft Defender for Resource Manager Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Ensure Status is set to On for Resource Manager. Audit from Azure CLI Ensure the output of the below command is Standard az security pricing show -n ''Arm'' --query ''pricingTier'' Audit from PowerShell Get-AzSecurityPricing -Name ''Arm'' | Select-Object Name,PricingTier Ensure the output of PricingTier is Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: c3d20c29-b36d-48fe-808b-99a87530ad99 - Name: ''Azure Defender for Resource Manager should be enabled'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Select On under Status for Resource Manager. 6. Select Save. Remediate from Azure CLI Use the below command to enable Standard pricing tier for Defender for Resource Manager az security pricing create -n 'Arm' --tier 'Standard' Remediate from PowerShell Use the below command to enable Standard pricing tier for Defender for Resource Manager Set-AzSecurityPricing -Name 'Arm' -PricingTier 'Standard'
