id: TMA-AZURE-8.1.10
title: Ensure that Microsoft Defender for Cloud is Configured to Check VM Operating Systems for Updates
description: 'Ensure that the latest OS patches for all virtual machines are applied. Windows and Linux virtual machines should be kept updated to: - Address a specific bug or flaw - Improve an OS or application’s general stability - Fix a security vulnerability Microsoft Defender for Cloud retrieves a list of available security and critical updates from Windows Update or Windows Server Update Services (WSUS), depending on which service is configured on a Windows VM. The security center also checks for the latest updates in Linux systems. If a VM is missing a system update, the security center will recommend system updates be applied.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- patching
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.10 Ensure that Microsoft Defender for Cloud is Configured to Check VM Operating Systems for Updates
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu 2. Select Microsoft Defender for Cloud 3. Then the Recommendations blade 4. Ensure that there are no recommendations for System updates should be installed on your machines (powered by Update Center) Alternatively, you can employ your own patch assessment and management tool to periodically assess, report and install the required security patches for your OS. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: f85bf3e0-d513-442e-89c3-1784ad63382b - Name: ''System updates should be installed on your machines (powered by Update Center)'' - Policy ID: bd876905-5b84-4f73-ab2d-2e7a7c4568d9 - Name: ''Machines should be configured to periodically check
    for missing system updates'''
remediation:
  type: iac_patch
  command: Follow Microsoft Azure documentation to apply security patches from the security center. Alternatively, you can employ your own patch assessment and management tool to periodically assess, report, and install the required security patches for your OS.
