id: TMA-AZURE-7.9
title: Ensure 'Authentication type' is Set to 'Azure Active Directory' only for Azure VPN Gateway Point-to-Site Configuration
description: Enable only 'Azure Active Directory' (Microsoft Entra ID) authentication for Azure VPN Gateway point-to-site connections. Microsoft Entra ID authentication provides strong security and centralized identity management, and reduces risks associated with static credentials and certificate management.
target: azure
level: 2
severity: low
tags:
- auth
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 7.9 Ensure 'Authentication type' is Set to 'Azure Active Directory' only for Azure VPN Gateway Point-to-Site Configuration
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Virtual network gateways. 2. Under VPN gateway, click VPN gateways. 3. Click the name of a VPN gateway. 4. Under Settings, click Point-to-site configuration. 5. Ensure Authentication type is set to Azure Active Directory only. 6. Repeat steps 1-5 for each VPN gateway. Audit from CLI az network vnet-gateway show -g <rg> -n <name> --query "vpnClientConfiguration.vpnAuthenticationTypes" Each gateway''s vpnClientConfiguration.vpnAuthenticationTypes array tells you the auth method. The check passes when it equals ["AAD"] (Azure Active Directory only). Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 21a6bc25-125e-4d13-b82d-2e19b7208ab7 - Name: ''VPN gateways should use only Azure
    Active Directory (Azure AD) authentication for point-to-site users'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Virtual network gateways. 2. Under VPN gateway, click VPN gateways. 3. Click the name of a VPN gateway. 4. Under Settings, click Point-to-site configuration. 5. Ensure Authentication type click to expand the drop-down menu. 6. Check the box next to Azure Active Directory, and uncheck the boxes next to Azure certificate and RADIUS authentication. 7. Provide a Tenant, Audience, and Issuer for the Azure Active Directory configuration. 8. Click Save. 9. Repeat steps 1-8 for each VPN gateway requiring remediation.
