id: TMA-AZURE-8.1.3.4
title: Ensure that 'Agentless scanning for machines' Component Status is Set to 'On'
description: Using disk snapshots, the agentless scanner scans for installed software, vulnerabilities, and plain text secrets. The Microsoft Defender for Cloud agentless machine scanner provides threat detection, vulnerability detection, and discovery of sensitive information.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.3.4 Ensure that 'Agentless scanning for machines' Component Status is Set to 'On'
audit:
  type: manual
  command: Audit from Azure Portal 1. From the Azure Portal Home page, select Microsoft Defender for Cloud 2. Under Management select Environment Settings 3. Select a subscription 4. Under Settings > Defender Plans, click Settings & monitoring 5. Under the Component column, locate the row for Agentless scanning for machines 6. Ensure that On is selected Repeat the above for any additional subscriptions.
remediation:
  type: iac_patch
  command: Audit from Azure Portal 1. From the Azure Portal Home page, select Microsoft Defender for Cloud 2. Under Management select Environment Settings 3. Select a subscription 4. Under Settings > Defender Plans, click Settings & monitoring 5. Under the Component column, locate the row for Agentless scanning for machines 6. Select On 7. Click Continue in the top left Repeat the above for any additional subscriptions.
