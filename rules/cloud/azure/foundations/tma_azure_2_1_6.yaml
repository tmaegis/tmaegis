id: TMA-AZURE-2.1.6
title: Ensure that Usage is Restricted and Expiry is Enforced for Databricks Personal Access Tokens
description: 'Databricks personal access tokens (PATs) provide API-based authentication for users and applications. By default, users can generate API tokens without expiration, leading to potential security risks if tokens are leaked, improperly stored, or not rotated regularly. To mitigate these risks, administrators should: - Restrict token creation to approved users and service principals. - Enforce expiration policies to prevent long-lived tokens. - Monitor token usage and revoke unused or compromised tokens. Restricting usage and enforcing expiry for personal access tokens reduces exposure to long-lived tokens, minimizes the risk of API abuse if compromised, and aligns with security best practices through controlled issuance and enforced expiry.'
target: azure
level: 1
severity: high
tags:
- access-control
- auth
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.6 Ensure that Usage is Restricted and Expiry is Enforced for Databricks Personal Access Tokens
audit:
  type: manual
  command: 'Azure Databricks administrators can monitor and revoke personal access tokens within their workspace. Detailed instructions are available in the "Monitor and Revoke Personal Access Tokens" section of the Microsoft documentation: https://learn.microsoft.com/en-us/azure/databricks/admin/access-control/tokens. To evaluate the usage of personal access tokens in your Azure Databricks account, you can utilize the provided notebook that lists all PATs not rotated or updated in the last 90 days, allowing you to identify tokens that may require revocation. This process is detailed here: https://learn.microsoft.com/en-us/azure/databricks/admin/access- control/tokens. Implementing diagnostic logging provides a comprehensive reference of audit log services and events, enabling you to track activities related to personal access tokens. More information can be found in the diagnostic log reference section: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-logs.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Disable personal access tokens: If your workspace does not require PATs, you can disable them entirely to prevent their use. 1. Navigate to your Azure Databricks workspace. 2. Click the Settings icon and select Admin Console. 3. Go to the Advanced tab. 4. Under Personal Access Tokens, toggle the setting to Disabled. Databricks CLI: databricks workspace-conf set-status --json ''{"enableTokens": "false"}'' Control who can create and use personal access tokens: Define which users or groups are authorized to create and utilize PATs. 1. Navigate to your Azure Databricks workspace. 2. Click the Settings icon and select Admin Console. 3. Go to the Advanced tab. 4. Click on Personal Access Tokens and then Permissions. 5. Assign the appropriate permissions (e.g. No Permissions, Can Use, Can Manage) to users or groups. Set maximum lifetime for new personal access tokens: Limit the validity period of new tokens to reduce potential misuse. Databricks CLI: databricks
    workspace-conf set-status --json ''{"maxTokenLifetimeDays": "90"}'' Monitor and revoke personal access tokens: Periodically review active tokens and revoke any that are unnecessary or potentially compromi...'
