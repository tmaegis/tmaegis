id: TMA-AZURE-6.1.1.9
title: Ensure that Intune Logs are Captured and Sent to Log Analytics
description: Ensure that Intune logs are captured and fed into a central log analytics workspace. Intune includes built-in logs that provide information about your environments. Sending logs to a Log Analytics workspace enables centralized analysis, correlation, and alerting for faster threat detection and response.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.9 Ensure that Intune Logs are Captured and Sent to Log Analytics
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Intune. 2. Click Reports. 3. Under Azure monitor, click Diagnostic settings. 4. Next to each diagnostic setting, click Edit setting, and review the selected log categories and destination details. 5. Ensure that at least one diagnostic setting is configured to send the following logs to a Log Analytics workspace: o AuditLogs o OperationalLogs o DeviceComplianceOrg o Devices o Windows365AuditLogs'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Intune. 2. Click Reports. 3. Under Azure monitor, click Diagnostic settings. 4. Click + Add diagnostic setting. 5. Provide a Diagnostic setting name. 6. Under Logs > Categories, check the box next to each of the following logs: o AuditLogs o OperationalLogs o DeviceComplianceOrg o Devices o Windows365AuditLogs 7. Under Destination details, check the box next to Send to Log Analytics workspace. 8. Select a Subscription. 9. Select a Log Analytics workspace. 10. Click Save.'
