id: TMA-AZURE-9.2.1
title: Ensure That Soft Delete for Blobs on Azure Blob Storage Storage Accounts is Enabled
description: Blobs in Azure storage accounts may contain sensitive or personal data, such as ePHI or financial information. Data that is erroneously modified or deleted by an application or a user can lead to data loss or unavailability. It is recommended that soft delete be enabled on Azure storage accounts with blob storage to allow for the preservation and recovery of data when blobs or blob snapshots are deleted. Blobs can be deleted incorrectly. An attacker or malicious user may do this deliberately in order to cause disruption. Deleting an Azure storage blob results in immediate data loss. Enabling this configuration for Azure storage accounts ensures that even if blobs are deleted from the storage account, the blobs are recoverable for a specific period of time, which is defined in the "Retention policies," ranging from 7 to 365 days.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.2.1 Ensure That Soft Delete for Blobs on Azure Blob Storage Storage Accounts is Enabled
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage Accounts. 2. For each Storage Account with blob storage, under Data management, go to Data protection. 3. Ensure that Enable soft delete for blobs is checked. 4. Ensure that the retention period is a sufficient length for your organization. Audit from Azure CLI Run the following command to list storage accounts: az storage account list Run the following command to determine if a storage account has containers: az storage container list --account-name <storage-account> For each storage account with containers, ensure that the output of the below command contains "enabled": true and days is not null: az storage blob service-properties delete-policy show --account-name <storage-account>'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage Accounts. 2. For each Storage Account with blob storage, under Data management, go to Data protection. 3. Check the box next to Enable soft delete for blobs. 4. Set the retention period to a sufficient length for your organization. 5. Click Save. Remediate from Azure CLI For each storage account requiring remediation, run the following command to enable soft delete for blobs: az storage blob service-properties delete-policy update --days-retained <retention-days> --account-name <storage-account> --enable true'
