id: TMA-AZURE-8.1.5.1
title: Ensure That Microsoft Defender for Storage Is Set To 'On'
description: Turning on Microsoft Defender for Storage enables threat detection for Storage, providing threat intelligence, anomaly detection, and behavior analytics in the Microsoft Defender for Cloud. Enabling Microsoft Defender for Storage allows for greater defense-in-depth, with threat detection provided by the Microsoft Security Response Center (MSRC).
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.5.1 Ensure That Microsoft Defender for Storage Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Ensure Status is set to On for Storage. Audit from Azure CLI Ensure the output of the below command is Standard az security pricing show -n StorageAccounts Audit from PowerShell Get-AzSecurityPricing -Name ''StorageAccounts'' | Select-Object Name,PricingTier Ensure output for Name PricingTier is StorageAccounts Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 640d2586-54d2-465f-877f-9ffc1d2109f4 - Name: ''Microsoft Defender for Storage should be enabled'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Set Status to On for Storage. 6. Select Save. Remediate from Azure CLI Ensure the output of the below command is Standard az security pricing create -n StorageAccounts --tier 'standard' Remediate from PowerShell Set-AzSecurityPricing -Name 'StorageAccounts' -PricingTier 'Standard'
