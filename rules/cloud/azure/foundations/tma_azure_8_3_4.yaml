id: TMA-AZURE-8.3.4
title: Ensure that the Expiration Date is set for All Secrets in Key Vaults using access policies (legacy)
description: 'Ensure that all Secrets in Azure Key Vaults with access policies have an expiration date set. Note: Using access policies is a legacy method. For improved security, use the Role- Based Access Control (RBAC) permission model instead of access policies when managing Azure Key Vault. RBAC restricts permission management to only the Owner and User Access Administrator roles, ensuring a clear separation between security and administrative tasks. With the Access Policy permission model, users with the Contributor, Key Vault Contributor, or any role that includes Microsoft.KeyVault/vaults/write permissions can grant themselves data plane access by configuring a Key Vault access policy. This can result in unauthorized access and management of your key vaults, keys, secrets, and certificates. To reduce this risk, limit Contributor role access to key vaults when using the Access Policy model. T...'
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- crypto
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.3.4 Ensure that the Expiration Date is set for All Secrets in Key Vaults using access policies (legacy)
audit:
  type: manual
  command: 'Requisite Access Policy Permissions for Secrets - read section overview! Audit Permissions = Secrets: List, Get Audit from Azure Portal 1. Go to Key vaults. 2. For each Key vault, under Objects, select Secrets. 3. In the main pane, ensure that the status of the secret(s) is Enabled. 4. Ensure the Expiration date column is not empty. Audit from Azure CLI Get a list of all the key vaults in your Azure environment by running the following command: az keyvault list For each key vault, ensure that the output of the below command contains ID (id), enabled status as true and Expiration date (expires) is not empty or null: az keyvault secret list --vault-name <KEYVALUTNAME> --query ''[*].{"kid":kid,"enabled":attributes.enabled,"expires":attributes.expires}'' Audit from PowerShell Retrieve a list of Key vaults: Get-AzKeyVault For each Key vault run the following command to determine which vaults are configured to use RBAC: Get-AzKeyVault -VaultName <Vault Name> For each Key Vault with
    the EnableRbacAuthorization setting set to False or empty, run the following command. Get-AzKeyVaultSecret -VaultName <Vault Name> Make sure the Expires setting is configured with a value as appropriate where...'
remediation:
  type: iac_patch
  command: 'Requisite Access Policy Permissions for Secrets - read section overview! Remediation Permissions = Secrets: List, Get, Set Remediate from Azure Portal 1. Go to Key vaults. 2. For each Key vault, click on Secrets. 3. In the main pane, ensure that the status of the secret(s) is Enabled. 4. Click on the secret(s) without Expiration date. 5. Click on the current version secret 6. Click the checkbox Set expiration date and set an appropriate Expiration date on the secret. 7. Click Apply. Remediate from Azure CLI Update the Expiration date for the secret using the below command: az keyvault secret set-attributes --name <secret_name> --vault-name <vault_name> --expires Y-m-d''T''H:M:S''Z'' Remediate from PowerShell For each Key vault with the EnableRbacAuthorization setting set to False or empty, run the following command. Set-AzKeyVaultSecret -VaultName <vault_name> -Name <secret_name> -Expires <date_time>'
