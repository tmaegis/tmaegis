id: TMA-AZURE-2.1.5
title: Ensure that Unity Catalog is Configured for Azure Databricks
description: Unity Catalog is a centralized governance model for managing and securing data in Azure Databricks. It provides fine-grained access control to databases, tables, and views using Microsoft Entra ID identities. Unity Catalog also enhances data lineage, audit logging, and compliance monitoring, making it a critical component for security and governance. - Enforces centralized access control policies and reduces data security risks. - Enables identity-based authentication via Microsoft Entra ID. - Improves compliance with industry regulations (e.g. GDPR, HIPAA, SOC 2) by providing audit logs and access visibility. - Prevents unauthorized data access through table-, row-, and column-level security (RLS & CLS).
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.5 Ensure that Unity Catalog is Configured for Azure Databricks
audit:
  type: manual
  command: 'Method 1: Verify unity catalog deployment: 1. As an Azure Databricks account admin, log into the account console. 2. Click Workspaces. 3. Find your workspace and check the Metastore column. If a metastore name is present, your workspace is attached to a Unity Catalog metastore and therefore enabled for Unity Catalog. Method 2: Run a SQL query to confirm Unity Catalog enablement Run the following SQL query in the SQL query editor or a notebook that is attached to a Unity Catalog-enabled compute resource. No admin role is required. SELECT CURRENT_METASTORE(); If the query returns a metastore ID like the following, then your workspace is attached to a Unity Catalog metastore and therefore enabled for Unity Catalog.'
remediation:
  type: iac_patch
  command: 'Use the remediation procedure written in this article: https://learn.microsoft.com/en- us/azure/databricks/data-governance/unity-catalog/get-started.'
