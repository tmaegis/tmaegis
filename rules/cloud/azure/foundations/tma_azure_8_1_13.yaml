id: TMA-AZURE-8.1.13
title: Ensure 'Additional email addresses' is Configured with a Security Contact Email
description: Microsoft Defender for Cloud emails the subscription owners whenever a high-severity alert is triggered for their subscription. You should provide a security contact email address as an additional email address. Microsoft Defender for Cloud emails the Subscription Owner to notify them about security alerts. Adding your Security Contact's email address to the 'Additional email addresses' field ensures that your organization's Security Team is included in these alerts. This ensures that the proper people are aware of any potential compromise in order to mitigate the risk in a timely fashion.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.13 Ensure 'Additional email addresses' is Configured with a Security Contact Email
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment Settings. 4. Click on the appropriate Management Group, Subscription, or Workspace. 5. Click on Email notifications. 6. Ensure that a valid security contact email address is listed in the Additional email addresses field. Audit from Azure CLI Ensure the output of the below command is not empty and is set with appropriate email ids: az account get-access-token --query "{subscription:subscription,accessToken:accessToken}" --out tsv | xargs -L1 bash -c ''curl -X GET -H "Authorization: Bearer $1" -H "Content-Type: application/json" https://management.azure.com/subscriptions/$0/providers/Microsoft.Security/se curityContacts?api-version=2020-01-01-preview'' | jq ''.|.[] | select(.name=="default")''|jq ''.properties.emails'' Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the
    associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 4f...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Microsoft Defender for Cloud. 3. Under Management, select Environment Settings. 4. Click on the appropriate Management Group, Subscription, or Workspace. 5. Click on Email notifications. 6. Enter a valid security contact email address (or multiple addresses separated by commas) in the Additional email addresses field. 7. Click Save. Remediate from Azure CLI Use the below command to set Security contact emails to On. az account get-access-token --query "{subscription:subscription,accessToken:accessToken}" --out tsv | xargs -L1 bash -c ''curl -X PUT -H "Authorization: Bearer $1" -H "Content-Type: application/json" https://management.azure.com/subscriptions/$0/providers/Microsoft.Security/se curityContacts/default?api-version=2020-01-01-preview -d@"input.json"'' Where input.json contains the data below, replacing validEmailAddress with a single email address or multiple comma-separated email addresses:
    { "id": "/subscriptions/<Your_Subscription_Id>/providers/Microsoft.Security/securityC ontacts/default", "name": "default", "type": "Microsoft.Security/securityContacts", "properties": { "email": "<validEma...'
