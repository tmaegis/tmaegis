id: TMA-AZURE-7.10
title: Ensure Azure Web Application Firewall (WAF) is Enabled on Azure Application Gateway
description: Azure Web Application Firewall helps protect applications from common exploits and attacks by inspecting and filtering incoming traffic. Using Azure Web Application Firewall with Azure Application Gateway reduces exposure to external threats by mitigating attacks on public facing applications.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 7.10 Ensure Azure Web Application Firewall (WAF) is Enabled on Azure Application Gateway
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Application gateways. 2. Click the name of an application gateway. 3. In the Overview, under Essentials, ensure Tier is set to WAF V2. 4. Repeat steps 1-3 for each application gateway. Audit from Azure CLI Run the following command to list application gateways: az network application-gateway list For each application gateway, run the following command to get the firewall policy id: az network application-gateway show --resource-group <resource-group> --name <application-gateway> --query firewallPolicy.id Ensure a firewall policy id is returned. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 564feb30-bf6a-4854-b4bb-0d2d2d1e6c66 - Name: ''Web Application Firewall (WAF) should
    be enabled for Application Gateway'''
remediation:
  type: iac_patch
  command: 'Note: Basic tier application gateways cannot be upgraded to the WAF V2 tier. Create a new WAF V2 tier application gateway to replace a Basic tier application gateway. Remediate from Azure Portal To remediate a Standard V2 tier application gateway: 1. Go to Application gateways. 2. Click Add filter. 3. From the Filter drop-down menu, select SKU size. 4. Check the box next to Standard_v2 only. 5. Click Apply. 6. Click the name of an application gateway. 7. Under Settings, click Web application firewall. 8. Under Configure, next to Tier, click WAF V2. 9. Select an existing or create a new WAF policy. 10. Click Save. 11. Repeat steps 1-10 for each Standard V2 tier application gateway requiring remediation.'
