id: TMA-AZURE-9.3.1.1
title: Ensure That 'Enable key rotation reminders' is Enabled for Each Storage Account
description: Access Keys authenticate application access requests to data contained in Storage Accounts. A periodic rotation of these keys is recommended to ensure that potentially compromised keys cannot result in a long-term exploitable credential. The "Rotation Reminder" is an automatic reminder feature for a manual procedure. Reminders such as those generated by this recommendation will help maintain a regular and healthy cadence for activities which improve the overall efficacy of a security program. Cryptographic key rotation periods will vary depending on your organization's security requirements and the type of data which is being stored in the Storage Account. For example, PCI DSS mandates that cryptographic keys be replaced or rotated 'regularly,' and advises that keys for static data stores be rotated every 'few months.' For the purposes of this recommendation, 90 days will be prescribe...
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- crypto
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.3.1.1 Ensure That 'Enable key rotation reminders' is Enabled for Each Storage Account
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage Accounts 2. For each Storage Account, under Security + networking, go to Access keys 3. If the button Edit rotation reminder is displayed, the Storage Account is compliant. Click Edit rotation reminder and review the Remind me every field for a desirable periodic setting that fits your security program''s needs. If the button Set rotation reminder is displayed, the Storage Account is not compliant. Audit from Powershell $rgName = <resource group name for the storage> $accountName = <storage account name> $account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName Write-Output $accountName -> Write-Output "Expiration Reminder set to: $($account.KeyPolicy.KeyExpirationPeriodInDays) Days" Write-Output "Key1 Last Rotated: $($account.KeyCreationTime.Key1.ToShortDateString())" Write-Output "Key2 Last Rotated: $($account.KeyCreationTime.Key2.ToShortDateString())" Key rotation is recommended if the creation date for any key is
    empty. If the reminder is set, the period in days will be returned. The recommended period is 90 days. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Storage Accounts 2. For each Storage Account that is not compliant, under Security + networking, go to Access keys 3. Click Set rotation reminder 4. Check Enable key rotation reminders 5. In the Send reminders field select Custom, then set the Remind me every field to 90 and the period drop down to Days 6. Click Save Remediate from Powershell $rgName = <resource group name for the storage> $accountName = <storage account name> $account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName if ($account.KeyCreationTime.Key1 -eq $null -or $account.KeyCreationTime.Key2 -eq $null){ Write-output ("You must regenerate both keys at least once before setting expiration policy") } else { $account = Set-AzStorageAccount -ResourceGroupName $rgName -Name $accountName -KeyExpirationPeriodInDay 90 } $account.KeyPolicy.KeyExpirationPeriodInDays
