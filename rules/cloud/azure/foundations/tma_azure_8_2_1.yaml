id: TMA-AZURE-8.2.1
title: Ensure That Microsoft Defender for IoT Hub Is Set To 'On'
description: Microsoft Defender for IoT acts as a central security hub for IoT devices within your organization. IoT devices are very rarely patched and can be potential attack vectors for enterprise networks. Updating their network configuration to use a central security hub allows for detection of these breaches.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.2.1 Ensure That Microsoft Defender for IoT Hub Is Set To 'On'
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to IoT Hub. 2. Select an IoT Hub to validate. 3. Select Overview in Defender for IoT. 4. The Threat prevention and Threat detection screen will appear, if Defender for IoT is Enabled.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to IoT Hub. 2. Select an IoT Hub to validate. 3. Select Overview in Defender for IoT. 4. Click on Secure your IoT solution, and complete the onboarding.
