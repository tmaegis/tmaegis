id: TMA-AZURE-8.1.7.1
title: Ensure That Microsoft Defender for Azure Cosmos DB Is Set To 'On'
description: Microsoft Defender for Azure Cosmos DB scans all incoming network requests for threats to your Azure Cosmos DB resources. In scanning Azure Cosmos DB requests within a subscription, requests are compared to a heuristic list of potential security threats. These threats could be a result of a security breach within your services, thus scanning for them could prevent a potential security threat from being introduced.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.7.1 Ensure That Microsoft Defender for Azure Cosmos DB Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. On the Databases row click on Select types >. 6. Ensure the toggle switch next to Azure Cosmos DB is set to On. Audit from Azure CLI Ensure the output of the below command is Standard az security pricing show -n CosmosDbs --query pricingTier Audit from PowerShell Get-AzSecurityPricing -Name ''CosmosDbs'' | Select-Object Name,PricingTier Ensure output of -PricingTier is Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: adbe85b5-83e6-4350-ab58-bf3a4f736e5e - Name: ''Microsoft Defender for Azure Cosmos DB should be
    enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. On the Databases row click on Select types >. 6. Set the toggle switch next to Azure Cosmos DB to On. 7. Click Continue. 8. Click Save. Remediate from Azure CLI Run the following command: az security pricing create -n ''CosmosDbs'' --tier ''standard'' Remediate from PowerShell Use the below command to enable Standard pricing tier for Azure Cosmos DB Set-AzSecurityPricing -Name ''CosmosDbs'' -PricingTier ''Standard'
