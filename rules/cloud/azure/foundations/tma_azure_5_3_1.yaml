id: TMA-AZURE-5.3.1
title: Ensure that Azure Admin Accounts Are Not Used for Daily Operations
description: Microsoft Azure admin accounts should not be used for routine, non-administrative tasks. Using admin accounts for daily operations increases the risk of accidental misconfigurations and security breaches.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.3.1 Ensure that Azure Admin Accounts Are Not Used for Daily Operations
audit:
  type: manual
  command: 'Audit from Azure Portal Monitor: 1. Go to Monitor. 2. Click Activity log. 3. Review the activity log and ensure that admin accounts are not being used for daily operations. Microsoft Entra ID: 1. Go to Microsoft Entra ID. 2. Under Monitoring, click Sign-in logs. 3. Review the sign-in logs and ensure that admin accounts are not being accessed more frequently than necessary.'
remediation:
  type: iac_patch
  command: 'If admin accounts are being used for daily operations, consider the following: - Monitor and alert on unusual activity. - Enforce the principle of least privilege. - Revoke any unnecessary administrative access. - Use Conditional Access to limit access to resources. - Ensure that administrators have separate admin and user accounts. - Use Microsoft Entra ID Protection to detect, investigate, and remediate identity- based risks. - Use Privileged Identity Management (PIM) in Microsoft Entra ID to limit standing administrator access to privileged roles, discover who has access, and review privileged access.'
