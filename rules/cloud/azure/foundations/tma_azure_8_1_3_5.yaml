id: TMA-AZURE-8.1.3.5
title: Ensure that 'File Integrity Monitoring' Component Status is Set to 'On'
description: File Integrity Monitoring (FIM) is a feature that monitors critical system files in Windows or Linux for potential signs of attack or compromise. FIM provides a detection mechanism for compromised files. When FIM is enabled, critical system files are monitored for changes that might indicate a threat actor is attempting to modify system files for lateral compromise within a host operating system.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- monitoring
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.3.5 Ensure that 'File Integrity Monitoring' Component Status is Set to 'On'
audit:
  type: manual
  command: Audit from Azure Portal 1. From the Azure Portal Home page, select Microsoft Defender for Cloud 2. Under Management select Environment Settings 3. Select a subscription 4. Under Settings > Defender Plans, click Settings & monitoring 5. Under the Component column, locate the row for File Integrity Monitoring 6. Ensure that On is selected Repeat the above for any additional subscriptions.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From the Azure Portal Home page, select Microsoft Defender for Cloud 2. Under Management select Environment Settings 3. Select a subscription 4. Under Settings > Defender Plans, click Settings & monitoring 5. Under the Component column, locate the row for File Integrity Monitoring 6. Select On 7. Click Continue in the top left Repeat the above for any additional subscriptions.
