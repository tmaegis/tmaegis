id: TMA-AZURE-5.3.3
title: Ensure That Use of the 'User Access Administrator' Role is Restricted
description: The User Access Administrator role grants the ability to view all resources and manage access assignments at any subscription or management group level within the tenant. Due to its high privilege level, this role assignment should be removed immediately after completing the necessary changes at the root scope to minimize security risks. The User Access Administrator role provides extensive access control privileges. Unnecessary assignments heighten the risk of privilege escalation and unauthorized access. Removing the role immediately after use minimizes security exposure.
target: azure
level: 1
severity: high
tags:
- access-control
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.3.3 Ensure That Use of the 'User Access Administrator' Role is Restricted
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Subscriptions. 3. Select a subscription. 4. Select Access control (IAM). 5. In the horizontal menu select Roles. 6. Search for User Access Administrator. 7. In the Details column select View. 8. In the horizontal menu select Assignments. 9. Audit the list for assignments. Audit from Azure CLI Run the following command: az role assignment list --role "User Access Administrator" --scope "/" Ensure that the command does not return any User Access Administrator role assignment information.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Subscriptions. 3. Select a subscription. 4. Select Access control (IAM). 5. Select Access control (IAM). 6. In the horizontal menu select Roles. 7. Search for User Access Administrator. 8. In the Details column select View. 9. In the horizontal menu select Assignments. 10. Select the user you wish to remove. 11. Select Remove. Remediate from Azure CLI Run the following command: az role assignment delete --role "User Access Administrator" --scope "/"'
