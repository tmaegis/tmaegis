id: TMA-AZURE-2.1.12
title: Ensure Azure Databricks groups are reviewed periodically
description: Groups are used in Role Based Access Control to apply permissions to users and should be audited. To ensure accurate privileges for your Azure Databricks implementation, your organization should review all users and permission assignments on a regular interval.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 2.1.12 Ensure Azure Databricks groups are reviewed periodically
audit:
  type: manual
  command: Audit from Azure Portal 1. From Azure Home select Azure Databricks. 2. Select the Databricks implementation you wish to audit. 3. Select Access control (IAM). 4. In the horizontal menu select Role assignments. 5. Audit the list for each role and its assignment to each user.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From Azure Home select Azure Databricks. 2. Select the Databricks implementation you wish to audit. 3. Select Access control (IAM). 4. Scroll down and select Add role assignment. 5. Search for the role you wish to add. Then select Next. 6. Select the group members you wish to add. Then select Next. 7. Review the info you have chosen, then select Review + assign.
