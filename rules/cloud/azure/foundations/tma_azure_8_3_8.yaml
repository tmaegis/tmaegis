id: TMA-AZURE-8.3.8
title: Ensure Private Endpoints are Used to Access Azure Key Vault
description: Use private endpoints to allow clients and services to securely access data located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures together. This creates further security through segmenting network traffic and preventing outside sources from accessing it. Private endpoints will secure network traffic from Azure Key Vault to the resources requesting secrets and keys. Securing traffic between services through encryption protects the data from easy interception and reading. Private endpoints will keep network requests to Azure Key Vault lim...
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
- crypto
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.3.8 Ensure Private Endpoints are Used to Access Azure Key Vault
audit:
  type: manual
  command: Requisite Permissions - read section overview! Data-plane access not required. Can be audited and remediated with Azure Resource Manager permissions. Audit from Azure Portal 1. From Azure Home open the Portal Menu in the top left. 2. Select Key Vaults. 3. Select a Key Vault to audit. 4. Select Networking in the left column. 5. Select Private endpoint connections from the top row. 6. View if there is an endpoint attached. Audit from Azure CLI Run the following command within a subscription for each Key Vault you wish to audit. az keyvault show --name <keyVaultName> Ensure that privateEndpointConnections is not null. Audit from PowerShell Run the following command within a subscription for each Key Vault you wish to audit. Get-AzPrivateEndpointConnection -PrivateLinkResourceId '/subscriptions/<subscriptionNumber>/resourceGroups/<resourceGroup>/providers /Microsoft.KeyVault/vaults/<keyVaultName>/' Ensure that the response contains details of a private endpoint. Audit from Azure Policy
