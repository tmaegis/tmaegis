id: TMA-AZURE-6.1.1.4
title: Ensure that Logging for Azure Key Vault is 'Enabled'
description: Enable AuditEvent logging for key vault instances to ensure interactions with key vaults are logged and available. Monitoring how and when key vaults are accessed, and by whom, enables an audit trail of interactions with confidential information, keys, and certificates managed by Azure Key Vault. Enabling logging for Key Vault saves information in a user provided destination of either an Azure storage account or Log Analytics workspace. The same destination can be used for collecting logs for multiple Key Vaults.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- crypto
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.4 Ensure that Logging for Azure Key Vault is 'Enabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Key vaults. 2. For each Key vault, under Monitoring, go to Diagnostic settings. 3. Click Edit setting next to a diagnostic setting. 4. Ensure that a destination is configured. 5. Under Category groups, ensure that audit and allLogs are checked. Audit from Azure CLI List all key vaults az keyvault list For each keyvault id az monitor diagnostic-settings list --resource <id> Ensure that storageAccountId reflects your desired destination and that categoryGroup and enabled are set as follows in the sample outputs below. "logs": [ { "categoryGroup": "audit", "enabled": true, }, { "categoryGroup": "allLogs", "enabled": true, } Audit from PowerShell List the key vault(s) in the subscription Get-AzKeyVault For each key vault, run the following: Get-AzDiagnosticSetting -ResourceId <key_vault_id> Ensure that StorageAccountId, ServiceBusRuleId, MarketplacePartnerId, or WorkspaceId is set as appropriate. Also, ensure that enabled is set to true, and that
    categoryGroup reflects both audit and allLogs category groups. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definiti...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Key vaults. 2. Select a Key vault. 3. Under Monitoring, select Diagnostic settings. 4. Click Edit setting to update an existing diagnostic setting, or Add diagnostic setting to create a new one. 5. If creating a new diagnostic setting, provide a name. 6. Configure an appropriate destination. 7. Under Category groups, check audit and allLogs. 8. Click Save. Remediate from Azure CLI To update an existing Diagnostic Settings az monitor diagnostic-settings update --name "<diagnostic_setting_name>" -- resource <key_vault_id> To create a new Diagnostic Settings az monitor diagnostic-settings create --name "<diagnostic_setting_name>" -- resource <key_vault_id> --logs "[{category:audit,enabled:true},{category:allLogs,enabled:true}]" <[--event- hub <event_hub_ID> --event-hub-rule <event_hub_auth_rule_ID> | --storage- account <storage_account_ID> |--workspace <log_analytics_workspace_ID> | -- marketplace-partner-id <solution_resource_ID>]> Remediate
    from PowerShell Create the Log settings object $logSettings = @() $logSettings += New-AzDiagnosticSettingLogSettingsObject -Enabled $true - Category audit $logSettings += New-AzDiagnosticSettingLogSettingsO...
