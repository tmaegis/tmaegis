id: TMA-AZURE-9.3.1.3
title: Ensure 'Allow storage account key access' for Azure Storage Accounts is 'Disabled'
description: Every secure request to an Azure Storage account must be authorized. By default, requests can be authorized with either Microsoft Entra credentials or by using the account access key for Shared Key authorization. Microsoft Entra ID provides superior security and ease of use compared to Shared Key and is recommended by Microsoft. To require clients to use Microsoft Entra ID for authorizing requests, you can disallow requests to the storage account that are authorized with Shared Key.
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- crypto
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.3.1.3 Ensure 'Allow storage account key access' for Azure Storage Accounts is 'Disabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage accounts. 2. Click on a storage account. 3. Under Settings, click Configuration. 4. Under Allow storage account key access, ensure that the radio button next to Disabled is selected. 5. Repeat steps 1-4 for each storage account. Audit from Azure CLI Run the following command to list storage accounts: az storage account list For each storage account, run the following command: az storage account show --resource-group <resource-group> --name <storage- account> Ensure that allowSharedKeyAccess is set to false. Audit from PowerShell Run the following command to list storage accounts: Get-AzStorageAccount Run the following command to get the storage account in a resource group with a given name: $storageAccount = Get-AzStorageAccount -ResourceGroupName <resource-group> - Name <storage-account> Run the following command to get the shared key access setting for the storage account: $storageAccount.allowSharedKeyAccess Ensure that the command
    returns False. Repeat for each storage account. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage accounts. 2. Click on a storage account. 3. Under Settings, click Configuration. 4. Under Allow storage account key access, click the radio button next to Disabled. 5. Click Save. 6. Repeat steps 1-5 for each storage account requiring remediation. Remediate from Azure CLI For each storage account requiring remediation, run the following command to disallow shared key authorization: az storage account update --resource-group <resource-group> --name <storage- account> --allow-shared-key-access false Remediate from PowerShell For each storage account requiring remediation, run the following command to disallow shared key authorization: Set-AzStorageAccount -ResourceGroupName <resource-group> -Name <storage- account> -AllowSharedKeyAccess $false'
