id: TMA-AZURE-8.1.3.2
title: Ensure that 'Vulnerability assessment for machines' Component Status is set to 'On'
description: Enable vulnerability assessment for machines on both Azure and hybrid (Arc enabled) machines. Vulnerability assessment for machines scans for various security-related configurations and events such as system updates, OS vulnerabilities, and endpoint protection, then produces alerts on threat and vulnerability findings.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.3.2 Ensure that 'Vulnerability assessment for machines' Component Status is set to 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu 2. Select Microsoft Defender for Cloud 3. Under Management, select Environment Settings 4. Select a subscription 5. Click on Settings & monitoring 6. Ensure that Vulnerability assessment for machines is set to On Repeat the above for any additional subscriptions. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 501541f7-f7e7-4cd6-868c-4190fdad3ac9 - Name: ''A vulnerability assessment solution should be enabled on your virtual machines'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From Azure Home select the Portal Menu 2. Select Microsoft Defender for Cloud 3. Under Management, select Environment Settings 4. Select a subscription 5. Click on Settings & Monitoring 6. Set the Status of Vulnerability assessment for machines to On 7. Click Continue Repeat the above for any additional subscriptions.
