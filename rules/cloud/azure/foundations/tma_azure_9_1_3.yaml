id: TMA-AZURE-9.1.3
title: Ensure 'SMB channel encryption' is Set to 'AES-256-GCM' or Higher for SMB file shares
description: Implement SMB channel encryption with AES-256-GCM for SMB file shares to ensure data confidentiality and integrity in transit. This method offers strong protection against eavesdropping and man-in-the-middle attacks, safeguarding sensitive information. AES-256-GCM encryption enhances the security of data transmitted over SMB channels by safeguarding it from unauthorized interception and tampering.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- encryption
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 9.1.3 Ensure 'SMB channel encryption' is Set to 'AES-256-GCM' or Higher for SMB file shares
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Storage accounts. 2. Click the name of a storage account. 3. Under Data storage, click File shares. 4. Under File share settings, click the link next to Security. 5. Under SMB channel encryption, ensure that AES-256-GCM, or higher, is the only checked SMB channel encryption setting. 6. Repeat steps 1-5 for each storage account. Audit from Azure CLI Run the following command to list storage accounts: az storage account list For each storage account, run the following command: az storage account file-service-properties show --resource-group <resource- group> --account-name <storage-account> Ensure that under protocolSettings > smb, channelEncryption is set to AES-256- GCM;, or higher, only. Audit from PowerShell Run the following command to list storage accounts: Get-AzStorageAccount Run the following command to get the file service properties for a storage account in a resource group with a given name: $storageaccountfileservice = Get-AzStorageFileServiceProperty
    - ResourceGroupName <resource-group> -AccountName <storage-account> Run the following command to get the SMB channel encryption setting: $storageaccountfileservice.ProtocolSettings.Smb.Ch...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Storage accounts. 2. Click the name of a storage account. 3. Under Data storage, click File shares. 4. Under File share settings, click the link next to Security. 5. If Profile is set to Maximum compatibility, click the drop-down menu and select Maximum security or Custom. 6. If selecting Custom, under SMB channel encryption, uncheck the boxes next to AES-128-CCM and AES-128-GCM. 7. Click Save. 8. Repeat steps 1-7 for each storage account requiring remediation. Remediate from Azure CLI For each storage account requiring remediation, run the following command to set the SMB channel encryption: az storage account file-service-properties update --resource-group <resource- group> --account-name <storage-account> --channel-encryption AES-256-GCM Remediate from PowerShell For each storage account requiring remediation, run the following command to set the SMB channel encryption: Update-AzStorageFileServiceProperty -ResourceGroupName <resource-group>
    - StorageAccountName <storage-account> -SmbChannelEncryption AES-256-GCM'
