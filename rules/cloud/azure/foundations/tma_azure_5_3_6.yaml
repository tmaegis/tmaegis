id: TMA-AZURE-5.3.6
title: Ensure 'Tenant Creator' Role Assignments are Periodically Reviewed
description: Perform a periodic review of the Tenant Creator role assignment to ensure that the assignments are accurate and appropriate. This recommendation should be applied alongside the recommendation "Ensure that 'Restrict non-admin users from creating tenants' is set to 'Yes'". Unnecessary assignments increase the risk of privilege escalation and unauthorized access.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.3.6 Ensure 'Tenant Creator' Role Assignments are Periodically Reviewed
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to Microsoft Entra ID. 2. Under Manage, click Roles and administrators. 3. In the search bar, type Tenant Creator. 4. Click the role. 5. Review the assignments and ensure that they are appropriate.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Microsoft Entra ID. 2. Under Manage, click Roles and administrators. 3. In the search bar, type Tenant Creator. 4. Click the role. 5. Click the name of an assignment. 6. Check the box next to the Tenant Creator role. 7. Click X Remove assignments. 8. Click Yes. 9. Repeat steps 1-8 for each assignment requiring remediation.
