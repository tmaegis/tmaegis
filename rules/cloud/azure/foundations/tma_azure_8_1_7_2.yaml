id: TMA-AZURE-8.1.7.2
title: Ensure That Microsoft Defender for Open-Source Relational Databases Is Set To 'On'
description: Turning on Microsoft Defender for Open-source relational databases enables threat detection for Open-source relational databases, providing threat intelligence, anomaly detection, and behavior analytics in the Microsoft Defender for Cloud. Enabling Microsoft Defender for Open-source relational databases allows for greater defense-in-depth, with threat detection provided by the Microsoft Security Response Center (MSRC).
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.7.2 Ensure That Microsoft Defender for Open-Source Relational Databases Is Set To 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Ensure the toggle switch next to Open-source relational databases is set to On. Audit from Azure CLI Run the following command: az security pricing show -n OpenSourceRelationalDatabases --query pricingTier Audit from PowerShell Get-AzSecurityPricing | Where-Object {$_.Name -eq ''OpenSourceRelationalDatabases''} | Select-Object Name, PricingTier Ensure output for Name PricingTier is OpenSourceRelationalDatabases Standard Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 0a9fbe0d-c5c4-4da8-87d8-f4fd77338835
    - Name: ''Azure Defender for open-source relational databases should be enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, select Environment Settings. 3. Click on the subscription name. 4. Select the Defender plans blade. 5. Click Select types > in the row for Databases. 6. Set the toggle switch next to Open-source relational databases to On. 7. Select Continue. 8. Select Save. Remediate from Azure CLI Run the following command: az security pricing create -n ''OpenSourceRelationalDatabases'' --tier ''standard'' Remediate from PowerShell Use the below command to enable Standard pricing tier for Open-source relational databases set-azsecuritypricing -name "OpenSourceRelationalDatabases" -pricingtier "Standard"'
