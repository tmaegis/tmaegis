id: TMA-AZURE-8.5
title: Ensure Azure DDoS Network Protection is Enabled on Virtual Networks
description: Azure DDoS Network Protection defends resources in virtual networks against distributed denial-of-service (DDoS) attacks. While an automated assessment procedure exists for this recommendation, the assessment status remains manual. Determining the appropriateness of enabling Azure DDoS Network Protection depends on the context and requirements of each organization and environment. Virtual networks and resources are protected against attacks, helping to ensure reliability and availability for critical workloads.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.5 Ensure Azure DDoS Network Protection is Enabled on Virtual Networks
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Virtual networks. 2. Click the name of a virtual network. 3. Under Settings, click DDoS protection. 4. Ensure DDoS Network Protection is set to Enable. 5. Repeat steps 1-4 for each virtual network. Audit from Azure CLI Run the following command to list virtual networks: az network vnet list For each virtual network, run the following command to get the DDoS protection setting: az network vnet show --resource-group <resource-group> --name <virtual- network> --query enableDdosProtection Ensure true is returned. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: a7aca53f-2ed4-4466-a25e-0b45ade68efd - Name: ''Azure DDoS Protection should be enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Virtual networks. 2. Click the name of a virtual network. 3. Under Settings, click DDoS protection. 4. Next to DDoS Network Protection, click Enable. 5. Provide a DDoS protection plan resource ID, or select a DDoS protection plan from the drop-down menu. 6. Click Save. 7. Repeat steps 1-6 for each virtual network requiring remediation. Remediate from Azure CLI For each virtual network requiring remediation, run the following command to enable DDoS protection: az network vnet update --resource-group <resource-group> --name <virtual- network> --ddos-protection true --ddos-protection-plan <ddos-protection-plan>'
