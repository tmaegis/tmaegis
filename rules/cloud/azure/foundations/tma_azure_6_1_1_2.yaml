id: TMA-AZURE-6.1.1.2
title: Ensure Diagnostic Setting Captures Appropriate Categories
description: 'Prerequisite: A Diagnostic Setting must exist. If a Diagnostic Setting does not exist, the navigation and options within this recommendation will not be available. Please review the recommendation at the beginning of this subsection titled: "Ensure that a ''Diagnostic Setting'' exists." The diagnostic setting should be configured to log the appropriate activities from the control/management plane. A diagnostic setting controls how the diagnostic log is exported. Capturing the diagnostic setting categories for appropriate control/management plane activities allows proper alerting.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 6.1.1.2 Ensure Diagnostic Setting Captures Appropriate Categories
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Monitor. 2. Click Activity log. 3. Click on Export Activity Logs. 4. Select the appropriate Subscription. 5. Click Edit setting next to a diagnostic setting. 6. Ensure that the following categories are checked: Administrative, Alert, Policy, and Security. Audit from Azure CLI Ensure the categories ''Administrative'', ''Alert'', ''Policy'', and ''Security'' set to: ''enabled: true'' az monitor diagnostic-settings subscription list --subscription <subscription ID> Audit from PowerShell Ensure the categories Administrative, Alert, Policy, and Security are set to Enabled:True Get-AzSubscriptionDiagnosticSetting -Subscription <subscriptionID> Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 3b980d31-7904-4bb7-8575-5665739a8052 - Name: ''An activity log alert should exist for specific Security operations'' - Policy ID: b954148f-4c11-4c38-8221-be76711e194a - Name: ''An activity log alert should...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Monitor. 2. Click Activity log. 3. Click on Export Activity Logs. 4. Select the Subscription from the drop down menu. 5. Click Edit setting next to a diagnostic setting. 6. Check the following categories: Administrative, Alert, Policy, and Security. 7. Choose the destination details according to your organization''s needs. 8. Click Save. Remediate from Azure CLI az monitor diagnostic-settings subscription create --subscription <subscription id> --name <diagnostic settings name> --location <location> <[- -event-hub <event hub ID> --event-hub-auth-rule <event hub auth rule ID>] [-- storage-account <storage account ID>] [--workspace <log analytics workspace ID>] --logs "[{category:Security,enabled:true},{category:Administrative,enabled:true},{ca tegory:Alert,enabled:true},{category:Policy,enabled:true}]" Remediate from PowerShell $logCategories = @(); $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject - Category Administrative
    -Enabled $true $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject - Category Security -Enabled $true $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject - Category...'
