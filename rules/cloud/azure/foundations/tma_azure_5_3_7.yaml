id: TMA-AZURE-5.3.7
title: Ensure All Non-privileged Role Assignments are Periodically Reviewed
description: 'Perform a periodic review of non-privileged role assignments to ensure that the non- privileged roles assigned to users are appropriate. Note: Determining ''appropriate'' assignments requires a clear understanding of your organization''s personnel, systems, policies, and security requirements. This cannot be effectively prescribed in a procedure. To ensure the principle of least privilege is followed, non-privileged role assignments should be reviewed periodically to confirm that users are granted only the minimum level of permissions they need to perform their tasks.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.3.7 Ensure All Non-privileged Role Assignments are Periodically Reviewed
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to Subscriptions. 2. Click the name of a subscription. 3. Click Access control (IAM). 4. Click Role assignments. 5. Click Job function roles. 6. For each role, ensure the assignments are appropriate. 7. Repeat steps 1-6 for each subscription.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Subscriptions. 2. Click the name of a subscription. 3. Click Access control (IAM). 4. Click Role assignments. 5. Click Job function roles. 6. Check the box next to any inappropriate assignments. 7. Click Delete. 8. Click Yes. 9. Repeat steps 1-8 for each subscription.
