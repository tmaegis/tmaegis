id: TMA-AZURE-7.6
title: Ensure that Network Watcher is 'Enabled' for Azure Regions That are in Use
description: Enable Network Watcher for physical regions in Azure subscriptions. Network diagnostic and visualization tools available with Network Watcher help users understand, diagnose, and gain insights to the network in Azure.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- network
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 7.6 Ensure that Network Watcher is 'Enabled' for Azure Regions That are in Use
audit:
  type: manual
  command: Audit from Azure Portal 1. Use the Search bar to search for and click on the Network Watcher service. 2. From the Overview menu item, review each Network Watcher listed, and ensure that a network watcher is listed for each region in use by the subscription. Audit from Azure CLI az network watcher list --query "[].{Location:location,State:provisioningState}" -o table This will list all network watchers and their provisioning state. Ensure provisioningState is Succeeded for each network watcher. az account list-locations --query "[?metadata.regionType=='Physical'].{Name:name,DisplayName:regionalDisplayNam e}" -o table This will list all physical regions that exist in the subscription. Compare this list to the previous one to ensure that for each region in use, a network watcher exists with provisioningState set to Succeeded. Audit from PowerShell Get a list of Network Watchers Get-AzNetworkWatcher Make sure each watcher is set with the ProvisioningState setting set to Succeeded
    and all Locations that are in use by the subscription are using a watcher. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Po...
remediation:
  type: iac_patch
  command: Opting out of Network Watcher automatic enablement is a permanent change. Once you opt-out you cannot opt-in without contacting support. To manually enable Network Watcher in each region where you want to use Network Watcher capabilities, follow the steps below. Remediate from Azure Portal 1. Use the Search bar to search for and click on the Network Watcher service. 2. Click Create. 3. Select a Region from the drop-down menu. 4. Click Add. Remediate from Azure CLI az network watcher configure --locations <region> --enabled true --resource- group <resource_group>
