id: TMA-AZURE-5.5
title: Ensure that a Custom Role is Assigned Permissions for Administering Resource Locks
description: Resource locking is a powerful protection mechanism that can prevent inadvertent modification or deletion of resources within Azure subscriptions and resource groups, and it is a recommended NIST configuration. Given that the resource lock functionality is outside of standard Role-Based Access Control (RBAC), it would be prudent to create a resource lock administrator role to prevent inadvertent unlocking of resources.
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.5 Ensure that a Custom Role is Assigned Permissions for Administering Resource Locks
audit:
  type: manual
  command: 'Audit from Azure Portal 1. In the Azure portal, navigate to a subscription or resource group. 2. Click Access control (IAM). 3. Click Roles. 4. Click Type : All. 5. Click to view the drop-down menu. 6. Select Custom role. 7. Click View in the Details column of a custom role. 8. Review the role permissions. 9. Click Assignments and review the assignments. 10. Click the X to exit the custom role details page. 11. Repeat steps 7-10. Ensure that at least one custom role exists that assigns the Microsoft.Authorization/locks permission to appropriate members. 12. Repeat steps 1-11 for each subscription or resource group.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. In the Azure portal, navigate to a subscription or resource group. 2. Click Access control (IAM). 3. Click + Add. 4. Click Add custom role. 5. In the Custom role name field enter Resource Lock Administrator. 6. In the Description field enter Can Administer Resource Locks. 7. For Baseline permissions select Start from scratch. 8. Click Next. 9. Click Add permissions. 10. In the Search for a permission box, type Microsoft.Authorization/locks. 11. Click the result. 12. Check the box next to Permission. 13. Click Add. 14. Click Review + create. 15. Click Create. 16. Click OK. 17. Click + Add. 18. Click Add role assignment. 19. In the Search by role name, description, permission, or ID box, type Resource Lock Administrator. 20. Select the role. 21. Click Next. 22. Click + Select members. 23. Select appropriate members. 24. Click Select. 25. Click Review + assign. 26. Click Review + assign again. 27. Repeat steps 1-26 for each subscription or resource
