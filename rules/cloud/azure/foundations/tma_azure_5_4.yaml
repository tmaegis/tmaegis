id: TMA-AZURE-5.4
title: Ensure that No Custom Subscription Administrator Roles Exist
description: The principle of least privilege should be followed and only necessary privileges should be assigned instead of allowing full administrative access. Custom roles in Azure with administrative access can obfuscate the permissions granted and introduce complexity and blind spots to the management of privileged identities. For less mature security programs without regular identity audits, the creation of Custom roles should be avoided entirely. For more mature security programs with regular identity audits, Custom Roles should be audited for use and assignment, used minimally, and the principle of least privilege should be observed when granting permissions
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- iam
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.4 Ensure that No Custom Subscription Administrator Roles Exist
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Subscriptions. 3. Select a subscription. 4. Select Access control (IAM). 5. Select Roles. 6. Click Type and select Custom role from the drop-down menu. 7. Select View next to a role. 8. Select JSON. 9. Check for assignableScopes set to the subscription, and actions set to *. 10. Repeat steps 7-9 for each custom role. Audit from Azure CLI List custom roles: az role definition list --custom-role-only True Check for entries with assignableScope of the subscription, and an action of * Audit from PowerShell Connect-AzAccount Get-AzRoleDefinition |Where-Object {($_.IsCustom -eq $true) -and ($_.Actions.contains(''*''))} Check the output for AssignableScopes value set to the subscription. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this
    URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: a451c1ef-c6ca-483d-87ed-f49761e3ffb5 - Name: ''Audit usage of custom RBAC roles'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. From Azure Home select the Portal Menu. 2. Select Subscriptions. 3. Select a subscription. 4. Select Access control (IAM). 5. Select Roles. 6. Click Type and select Custom role from the drop-down menu. 7. Check the box next to each role which grants subscription administrator privileges. 8. Select Delete. 9. Select Yes. Remediate from Azure CLI List custom roles: az role definition list --custom-role-only True Check for entries with assignableScope of the subscription, and an action of *. To remove a violating role: az role definition delete --name <role name> Note that any role assignments must be removed before a custom role can be deleted. Ensure impact is assessed before deleting a custom role granting subscription administrator privileges.'
