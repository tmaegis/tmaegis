id: TMA-AZURE-8.1.2.1
title: Ensure Microsoft Defender for APIs is Set to 'On'
description: Microsoft Defender for APIs offers full lifecycle protection, detection, and response coverage for APIs. While an automated assessment procedure exists for this recommendation, the assessment status remains manual. Due to its potentially high cost, Microsoft Defender for APIs may not be suitable for all environments and should be evaluated carefully before implementation. Microsoft Defender for APIs helps provide visibility into business-critical APIs, assess and improve their security posture, prioritize vulnerability remediation, and detect threats in real time.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 8.1.2.1 Ensure Microsoft Defender for APIs is Set to 'On'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, click Environment settings. 3. Click the name of a subscription. 4. Select the Defender plans blade. 5. Under Cloud Workload Protection (CWP), in the row for APIs, ensure the Status is set to On. Audit from Azure CLI Run the following command to get the Api plan pricing tier: az security pricing show --name Api --query pricingTier Ensure "Standard" is returned. Audit from PowerShell Run the following command to get the Api plan pricing tier: Get-AzSecurityPricing -Name Api | Select-Object PricingTier Ensure Standard is returned. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 7926a6d1-b268-4586-8197-e8ae90c877d7 - Name:
    ''Microsoft Defender for APIs should be enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Microsoft Defender for Cloud. 2. Under Management, click Environment settings. 3. Click the name of a subscription. 4. Select the Defender plans blade. 5. Under Cloud Workload Protection (CWP), in the row for APIs, set the toggle switch for Status to On. 6. Select a plan. 7. Click Save to save the plan selection. 8. Click Save to enable Defender for APIs. Remediate from Azure CLI Run the following command to enable Defender for APIs: az security pricing create --name Api --tier Standard --subplan <subplan> Valid subplan values: P1, P2, P3, P4, and P5. Remediate from PowerShell Run the following command to enable Defender for APIs: Set-AzSecurityPricing -Name Api -PricingTier Standard -SubPlan <subplan> Valid SubPlan values: P1, P2, P3, P4, and P5.'
