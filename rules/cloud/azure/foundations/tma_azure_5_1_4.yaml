id: TMA-AZURE-5.1.4
title: Ensure that 'Allow users to remember multifactor authentication on devices they trust' is Disabled
description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access, ignore the recommendations in this section and proceed to the Conditional Access section.] Do not allow users to remember multi-factor authentication on devices. Remembering Multi-Factor Authentication (MFA) for devices and browsers allows users to have the option to bypass MFA for a set number of days after performing a successful sign-in using MFA. This can enhance usability by minimizing the number of times a user may need to perform two-step verification on the same device. However, if an account or device is compromised, remembering MFA for trusted devices may affect security. Hence, it is recommended that users not be allowed to bypass MFA.'
target: azure
level: 1
severity: high
tags:
- auth
- azure
- cloud
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - 5.1.4 Ensure that 'Allow users to remember multifactor authentication on devices they trust' is Disabled
audit:
  type: manual
  command: Audit from Azure Portal 1. From Azure Home select the Portal Menu 2. Select Microsoft Entra ID 3. Under Manage, click Users 4. Click the Per-user MFA button on the top bar 5. Click on Service settings 6. Ensure that Allow users to remember multi-factor authentication on devices they trust is not enabled
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From Azure Home select the Portal Menu 2. Select Microsoft Entra ID 3. Under Manage, click Users 4. Click the Per-user MFA button on the top bar 5. Click on Service settings 6. Uncheck the box next to Allow users to remember multi-factor authentication on devices they trust 7. Click Save
