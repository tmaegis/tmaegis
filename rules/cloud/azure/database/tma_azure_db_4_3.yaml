id: TMA-AZURE-DB-4.3
title: Ensure that Data Factory is using Azure Key Vault to store Credentials and Secrets
description: Azure Key Vault is a way to securely store secrets and keys, and create role based access control permissions to services and users to access them. Use of Azure Key Vault is greatly recommended over less secure options like hard coding credentials into code.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- crypto
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 4.3 Ensure that Data Factory is using Azure Key Vault to store Credentials and Secrets
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Data Factories select a factory to audit. 2. Under the Overview selection scroll down in the right pane and select Launch studio under Azure Data Factory Studio. 3. In the left column select the briefcase and wrench for Manage. 4. In the left column select Linked Services under Connections. 5. Browse the linked services to determine if there is a connection to an Azure key vault. It has a circle icon with a key in it. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 127ef6d7-242f-43b3-9eef-947faf1725d0 - Name: ''Azure Data Factory linked services should use Key Vault for storing secrets'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal Retrieve Managed Identity Object ID 1. From Azure Data Factories select a factory to link to an Azure Key Vault. 2. In the left column, expand > Settings and select Properties. 3. Select Managed Identity Object ID and save this code for later. Set Permissions for Key Vault Note this presumes the use of RBAC Access control, not Access policies. 1. From Key vaults select a key vault to grant access to. 2. Select + Add, and select Add role assignment from the dropdown. 3. For the Role, search for key vault. Listed are various permissions to be assigned. Determine your organization's permission need, but Key Vault Reader is satisfactory for basic key and secrets access. 4. Select Next 5. In the new screen, next to Assign access to, select Managed identity. 6. Next to Members select + Select members. 7. Choose your subscription, and either under Managed identity scroll to Data Factory and select it, or search by your Data Factory's name. 8. Select your Data
