id: TMA-AZURE-DB-2.3
title: Ensure that 'Minimum TLS version' is set to TLS v1.2 (or higher)
description: Setting the 'Minimum TLS version' helps reduce (but not eliminate) TLS protocol vulnerabilities by preventing the use of significantly outdated versions of TLS. The Secure Sockets Layer (SSL) protocol encrypts network traffic transiting between server and client. Using only the most recent versions of SSL protocols (TLS version 1.2 and higher) eliminates susceptibility to known exploited vulnerabilities of outdated versions of TLS. If TLS 1.2 does not provide additional granular configuration options for supported cipher suites, there's a chance that default ciphers which employ Cipher Block Chaining (CBC) mode may be enabled which would introduce Padding Oracle types of vulnerabilities. TLS 1.3 does not support CBC mode ciphers by default and by default supports GCM ciphers which include an extra authentication step during the clear text to cipher text encryption process. TLS version...
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- tls
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.3 Ensure that 'Minimum TLS version' is set to TLS v1.2 (or higher)
audit:
  type: manual
  command: Audit From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance listed, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, under Settings, click on Advanced Settings 5. Review the setting under Minimum TLS version If 1.2 (Recommended) (or a higher version) is selected, the configuration for that instance is compliant.
remediation:
  type: iac_patch
  command: Remediate From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance listed, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, under Settings, click on Advanced Settings 5. Click the drop-down menu under Minimum TLS version 6. Select 1.2 (Recommended) (higher versions are preferred when available)
