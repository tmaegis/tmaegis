id: TMA-AZURE-DB-6.9
title: Ensure server parameter 'log_connections' is set to 'ON' for PostgreSQL servers
description: Enable log_connections on PostgreSQL servers. Enabling log_connections helps PostgreSQL Database to log attempted connection to the server, as well as successful completion of client authentication. Log data can be used to identify, troubleshoot, and repair configuration errors and suboptimal performance.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.9 Ensure server parameter 'log_connections' is set to 'ON' for PostgreSQL servers
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type log_connections. 5. Ensure that log_connections is set to ON. Audit from Azure CLI Ensure the below command returns a Value of on: az postgres flexible-server parameter show --resource-group <resourceGroup> - -server-name <serverName> --name log_connections Audit from PowerShell Ensure the below command returns a Value of on: Get-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name log_connections Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy
    ID: 086709ac-11b5-478d-a893-9567a16d2ae3 - Name: ''Log connections should be enabled for PostgreSQL flexible servers'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type log_connections. 5. Set log_connections to ON. 6. Click Save. Remediate from Azure CLI Use the below command to update log_connections configuration. az postgres flexible-server parameter set --resource-group <resourceGroupName> --server-name <serverName> --name log_connections --value on Remediate from PowerShell Use the below command to update log_connections configuration. Update-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <ResourceGroupName> -ServerName <ServerName> -Name log_connections -Value on
