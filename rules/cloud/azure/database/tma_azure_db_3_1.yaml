id: TMA-AZURE-DB-3.1
title: Ensure That 'Firewalls & Networks' Is Limited to Use Selected Networks Instead of All Networks
description: Limiting your Cosmos DB to only communicate on whitelisted networks lowers its attack footprint. Selecting certain networks for your Cosmos DB to communicate restricts the number of networks including the internet that can interact with what is stored within the database.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- database
- network
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 3.1 Ensure That 'Firewalls & Networks' Is Limited to Use Selected Networks Instead of All Networks
audit:
  type: manual
  command: 'Audit From Azure Portal 1. Open the portal menu. 2. Select the Azure Cosmos DB blade 3. Select a Cosmos DB to audit. 4. Select Networking. 5. Under Public network access, ensure Selected networks is selected. 6. Under Virtual networks, ensure appropriate virtual networks are configured. Audit From Azure CLI Retrieve a list of all CosmosDB database names: az cosmosdb list For each database listed, run the following command: az cosmosdb show <database id> For each database, ensure that isVirtualNetworkFilterEnabled is set to true Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 862e97cf-49fc-4a5c-9de4-40d4e2e7c8eb - Name: ''Azure Cosmos DB accounts should have firewall rules'''
remediation:
  type: iac_patch
  command: Remediate From Azure Portal 1. Open the portal menu. 2. Select the Azure Cosmos DB blade. 3. Select a Cosmos DB account to audit. 4. Select Networking. 5. Under Public network access, select Selected networks. 6. Under Virtual networks, select + Add existing virtual network or + Add a new virtual network. 7. For existing networks, select subscription, virtual network, subnet and click Add. For new networks, provide a name, update the default values if required, and click Create. 8. Click Save.
