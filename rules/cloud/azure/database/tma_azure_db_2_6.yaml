id: TMA-AZURE-DB-2.6
title: Ensure that 'Public Network Access' is 'Disabled'
description: Disabling public network access restricts the service from accessing public networks. A secure network architecture requires carefully constructed network segmentation. Public Network Access tends to be overly permissive and introduces unintended vectors for threat activity.
target: azure
level: 2
severity: low
tags:
- access-control
- azure
- cloud
- database
- network
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.6 Ensure that 'Public Network Access' is 'Disabled'
audit:
  type: manual
  command: 'Audit From Azure Portal NOTE: This procedure applies only to instances that are not using VNets. 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, click on Private Endpoint 5. Review the button to the right of + Private Endpoint If the button is titled enable public network access, the configuration for that instance is currently disabled and compliant. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 470baccb-7e51-4549-8b1a-3e5be069f663 - Name: ''Azure Cache for Redis should disable public network access'''
remediation:
  type: iac_patch
  command: 'Remediate From Azure Portal NOTE: A Private Endpoint must exist before the “Disable public network access” button allows the configuration change to be performed via Portal. 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, click on Private Endpoint 5. Click the Disable public network access button.'
