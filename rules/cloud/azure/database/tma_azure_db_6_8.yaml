id: TMA-AZURE-DB-6.8
title: Ensure server parameter 'log_disconnections' is set to 'ON' for PostgreSQL servers
description: Enable log_disconnections on PostgreSQL servers. Enabling log_disconnections helps PostgreSQL Database to Logs end of a session, including duration, which in turn generates query and error logs. Query and error logs can be used to identify, troubleshoot, and repair configuration errors and sub- optimal performance.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.8 Ensure server parameter 'log_disconnections' is set to 'ON' for PostgreSQL servers
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. Search for log_disconnections. 5. Ensure that log_disconnections is set to ON. Audit from Azure CLI Ensure log_disconnections value is set to ON az postgres flexible-server parameter show --resource-group <resourceGroupName> --server-name <serverName> --name log_disconnections Audit from PowerShell Ensure log_disconnections value is set to ON Get-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <ResourceGroupName> -ServerName <ServerName> -Name log_disconnections Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy
    ID: 1d14b021-1bae-4f93-b36b-69695e14984a - Name: ''Disconnections should be logged for PostgreSQL flexible servers'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. Search for log_disconnections. 5. Set log_disconnections to ON. 6. Click Save. Remediate from Azure CLI Use the below command to update log_disconnections configuration. az postgres flexible-server parameter set --resource-group <resourceGroupName> --server-name <serverName> --name log_disconnections -- value on Remediate from PowerShell Use the below command to update log_disconnections configuration. Update-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <ResourceGroupName> -ServerName <ServerName> -Name log_disconnections -Value on
