id: TMA-AZURE-DB-3.5
title: Ensure critical data is encrypted with customer-managed keys (CMK)
description: Customer-managed keys introduce additional depth to security by providing control over encryption keys. Where required, and organizational capacity allows, sensitive data at rest can be encrypted using customer-managed keys. While it is possible to automate the assessment of this recommendation, the assessment status remains "Manual" due to ideally limited scope. The scope of application should be carefully considered to account for organizational capacity, and targeted to workloads with specific need for CMK. Customer-managed keys provide greater control over the creation, rotation, and revocation of encryption keys, supporting strict security and compliance requirements.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- crypto
- database
- encryption
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 3.5 Ensure critical data is encrypted with customer-managed keys (CMK)
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Cosmos DB. 2. Select the name of an Azure Cosmos DB account. 3. Under Settings, select Data Encryption. 4. Ensure Encryption Key Type is set to Customer-managed key. 5. Repeat steps 1-4 for each account. Audit from Azure CLI Run the following command to list Azure Cosmos DB accounts: az cosmosdb list For each account, run the following command to get the Key Vault key URI: az cosmosdb show --resource-group <resource-group> --name <cosmos-db> --query keyVaultKeyUri Ensure an Azure Key Vault key URI is returned. Audit from PowerShell Run the following command to get Azure Cosmos DB accounts for a given resource group: Get-AzCosmosDBAccount -ResourceGroupName <resource-group> Run the following command to get the account with a given name: $cosmosdb = Get-AzCosmosDBAccount -ResourceGroupName <resource-group> -Name <cosmos-db> Run the following command to get the Key Vault key URI: $cosmosdb.KeyVaultKeyUri Ensure an Azure Key Vault key URI is
    returned. Repeat for each account. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to Azure Cosmos DB. 2. Select the name of an Azure Cosmos DB account. 3. Under Settings, select Data Encryption. 4. Set Encryption Key Type to Customer-managed key. 5. Provide a key URI. 6. Select Save. 7. Repeat steps 1-6 for each account requiring remediation.
