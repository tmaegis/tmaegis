id: TMA-AZURE-DB-5.4
title: Ensure Private Endpoints Are Used for Azure MySQL Databases
description: Private links make resources available via a private endpoint to a network you select. Tunneling between subscriptions, resource groups, without the need for traditional network routing. For sensitive data, private endpoints allow granular control of which services can communicate with Azure MySQL and ensure that this network traffic is private. This can be set this up on a case by case basis for each service to be connected.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 5.4 Ensure Private Endpoints Are Used for Azure MySQL Databases
audit:
  type: manual
  command: Audit from Azure Portal 1. From Azure Database for MySQL flexible servers select a server to audit. 2. In the column expand > Settings. 3. Select Networking. 4. Scroll down to the bottom to determine if there are any private endpoints attached to the server.
remediation:
  type: iac_patch
  command: Audit from Azure Portal 1. From Azure Database for MySQL flexible servers select a server to audit. 2. In the column expand > Settings. 3. Select Networking. 4. Scroll down to the bottom, and select + Create private endpoint. 5. Select a subscription and resource group. 6. Enter an instance name, network interface name, and select the same region that your MySQL server is in. 7. Verify that the information on Resource is correct. Then select Next 8. Select the virtual network, and subnet and select Next. 9. Choose whether to use a dynamic or static IP address and select Next. 10. Choose Yes or No on Integreate with private DNS zone. 11. If Yes then select the subscription and resource group, then select Next. 12. Enter any desired tags, then select Next. 13. Verify the information, then select Create.
