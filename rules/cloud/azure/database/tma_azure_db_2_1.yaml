id: TMA-AZURE-DB-2.1
title: Ensure 'Microsoft Entra Authentication' is 'Enabled'
description: Ensuring that Microsoft Entra Authentication is ‘Enabled’ provides a natively integrated use of identities already defined with Microsoft Entra ID. The use of a centralized Identity and Access Management (IAM) solution such as Microsoft Entra ID is highly recommended for all activity related to Identity, Authentication, Authorization, and Accountability. Decentralized IAM – such as local authentication methods – may present additional vulnerability and introduce avoidable administrative complexity.
target: azure
level: 1
severity: medium
tags:
- auth
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.1 Ensure 'Microsoft Entra Authentication' is 'Enabled'
audit:
  type: manual
  command: Audit From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, click on Authentication 5. Review the checkbox next to Enable Microsoft Entra Authentication If the checkbox is Checked, the configuration for that instance is compliant.
remediation:
  type: iac_patch
  command: Remediate From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, click on Authentication 5. Check the checkbox next to Enable Microsoft Entra Authentication
