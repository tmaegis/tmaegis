id: TMA-AZURE-DB-3.2
title: Ensure that Cosmos DB uses Private Endpoints where possible
description: Private endpoints limit network traffic to approved sources. For sensitive data, private endpoints allow granular control of which services can communicate with Cosmos DB and ensure that this network traffic is private. This can be set this up on a case by case basis for each service to be connected.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 3.2 Ensure that Cosmos DB uses Private Endpoints where possible
audit:
  type: manual
  command: 'Audit From Azure Portal 1. Open the portal menu. 2. Select the Azure Cosmos DB blade. 3. Select the Azure Cosmos DB account. 4. Select Networking. 5. Ensure Public network access is set to Selected networks. 6. Ensure the listed networks are set appropriately. 7. Select Private access. 8. Ensure a private endpoint exists and Connection state is Approved. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 58440f8a-10c5-4151-bdce-dfbaad4a20b7 - Name: ''CosmosDB accounts should use private link'''
remediation:
  type: iac_patch
  command: 'Remediate From Azure Portal 1. Open the portal menu. 2. Select the Azure Cosmos DB blade. 3. Select the Azure Cosmos DB account. 4. Select Networking. 5. Select Private access. 6. Click + Private Endpoint. 7. Provide a Name. 8. Click Next. 9. From the Resource type drop down, select Microsoft.AzureCosmosDB/databaseAccounts. 10. From the Resource drop down, select the Cosmos DB account. 11. Click Next. 12. Provide appropriate Virtual Network details. 13. Click Next. 14. Provide appropriate DNS details. 15. Click Next. 16. Optionally provide Tags. 17. Click Next : Review + create. 18. Click Create.'
