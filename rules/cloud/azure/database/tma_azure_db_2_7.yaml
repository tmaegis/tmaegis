id: TMA-AZURE-DB-2.7
title: Ensure Azure Cache for Redis is Using a Private Link
description: Private links make resources available via a private endpoint to a network you select. Tunneling between subscriptions, resource groups, without the need for traditional network routing. Networking communication should be segmented to prevent undesired interception.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.7 Ensure Azure Cache for Redis is Using a Private Link
audit:
  type: manual
  command: 'Audit From Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. Expand the Administration menu in the left column. 4. Select Networking. 5. View the private endpoints associated with the cache. Audit From PowerShell 1. Run the following code block with the identifying information for your environment. Get-AzPrivateEndpoint-ResourceGroupName <ResourceGroupName> | Where-Object{ $_.PrivateLinkServiceConnections.PrivateLinkServiceId -eq <AzureCacheforRedisName> } 2. View the private endpoints associated with the cache. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 960e650e-9ce3-4316-9590-8ee2c016ca2f - Name: ''Azure Cache for Redis should use private link'''
remediation:
  type: iac_patch
  command: 'Remediate From Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. In the left column expand Administration. 4. Select Networking. 5. In the top heading select Private Endpoints. 6. Select + Private Endpoint. 7. Select your subscription and resource group then select Next : Resource >. 8. Select Connect to an Azure resource in my directory. 9. Enter your subscription id or select from the dropdown. 10. Under Resource type select Microsoft.Cache/redisEnterprise from the dropdown. 11. Select your resource and your sub-resource of redisEnterprise. 12. Select your desired virtual network. 13. Select your desired subnet. 14. Determine whether you want to dynamically or statically allocate an IP address. 15. Select your network application security group or select + Create to create a new one, the select Next. 16. Determine if you want to create a dns entry in a private DNS zone or on your own DNS servers. If in a private DNS zone select the desired subscription
    and resource group. Select next. 17. Enter any tags necessary, then click next. 18. Review the settings and select Create. 19. After creation your Cache will be available in your network at the FQDN...'
