id: TMA-AZURE-DB-5.3
title: Ensure `Public Network Access` is `Disabled` for Azure Database for MySQL
description: Setting public networks to disabled prevents requests from the public internet. Disabling public network access prevents Azure Database for MySQL servers from communicating with the public internet and requires the use of Private endpoints for granular network control and segmentation.
target: azure
level: 2
severity: low
tags:
- access-control
- azure
- cloud
- database
- network
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 5.3 Ensure `Public Network Access` is `Disabled` for Azure Database for MySQL
audit:
  type: manual
  command: 'Audit from Azure Portal 1. From Azure Database for MySQL select the database you wish to audit. 2. In the left column expand > Settings. 3. Select Networking. 4. Ensure that Public network access is not selected Audit from Powershell 1. Run the following command with the identifying details for your subscription. Get-AzMySqlFlexibleServer -name <servername> -ResourceGroupName <resourcegroupname> | Select-Object -property NetworkPublicNetworkAccess 2. Ensure that Public network access is Disabled. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: c9299215-ae47-4f50-9c54-8a392f68a052 - Name: ''Public network access should be disabled for MySQL flexible servers'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. From Azure Database for MySQL select the database you wish to audit. 2. In the left column expand > Settings. 3. Select Networking. 4. Uncheck the checkbox under Public Access
