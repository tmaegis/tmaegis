id: TMA-AZURE-DB-3.6
title: Ensure the firewall does not allow all network traffic
description: Do not allow all network traffic. Restrict access to specific IP addresses or ranges. Allowing all network traffic limits the effectiveness of a firewall.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- network
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 3.6 Ensure the firewall does not allow all network traffic
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Cosmos DB. 2. Select the name of an Azure Cosmos DB account. 3. Under Settings, select Networking. 4. Under Public access, if Public network access is set to Selected networks, ensure 0.0.0.0 is not listed under Firewall > IPs. 5. Repeat steps 1-4 for each account. Audit from Azure CLI Run the following command to list Azure Cosmos DB accounts: az cosmosdb list For each account, run the following command to get the list of allowed IP addresses: az cosmosdb show --resource-group <resource-group> --name <cosmos-db> --query ipRules Ensure that the response does not contain "0.0.0.0". Audit from PowerShell Run the following command to get Azure Cosmos DB accounts for a given resource group: Get-AzCosmosDBAccount -ResourceGroupName <resource-group> Run the following command to get the account with a given name: $cosmosdb = Get-AzCosmosDBAccount -ResourceGroupName <resource-group> -Name <cosmos-db> Run the following command to get the list of
    allowed IP addresses: $cosmosdb.IpRules Ensure that the response does not contain 0.0.0.0. Repeat for each account. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Cosmos DB. 2. Select the name of an Azure Cosmos DB account. 3. Under Settings, select Networking. 4. Under Public access, Firewall > IPs, select the Delete icon next to 0.0.0.0. 5. Select Save. 6. Repeat steps 1-5 for each account requiring remediation. Remediate from Azure CLI For each account requiring remediation, run the following command to update the list of allowed IP addresses, excluding 0.0.0.0: az cosmosdb update --resource-group <resource-group> --name <cosmos-db- account> --ip-range-filter <comma-separated-list-of-allowed-ip-addresses> Remediate from PowerShell For each account requiring remediation, run the following command to update the list of allowed IP addresses, excluding 0.0.0.0: Update-AzCosmosDBAccount -ResourceGroupName <resource-group> -Name <cosmos- db-account> -IpRule <comma-separated-list-of-allowed-ip-addresses>'
