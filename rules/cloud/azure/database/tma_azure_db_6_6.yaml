id: TMA-AZURE-DB-6.6
title: Ensure server parameter 'logfiles.retention_days' is greater than 3 days for PostgreSQL server
description: Ensure logfiles.retention_days on PostgreSQL flexible servers is set to an appropriate value. Configuring logfiles.retention_days determines the duration in days that Azure Database for PostgreSQL retains log files. Query and error logs can be used to identify, troubleshoot, and repair configuration errors and sub-optimal performance.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.6 Ensure server parameter 'logfiles.retention_days' is greater than 3 days for PostgreSQL server
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type logfiles.retention_days. 5. Ensure that the VALUE is between 4 and 7 (inclusive). Audit from Azure CLI Ensure logfiles.retention_days value is greater than 3. az postgres flexible-server parameter show --resource-group <resourceGroup> - -server-name <serverName> --name logfiles.retention_days Audit from Powershell Ensure logfiles.retention_days value is greater than 3: Get-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name logfiles.retention_days'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type logfiles.retention_days. 5. Input a value between 4 and 7 (inclusive). 6. Click Save. Remediate from Azure CLI Use the below command to update logfiles.retention_days configuration: az postgres flexible-server parameter set --resource-group <resourceGroup> -- server-name <serverName> --name logfiles.retention_days --value <4-7> Remediate from Powershell Use the below command to update logfiles.retention_days configuration: Update-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name logfiles.retention_days -Value <4-7>'
