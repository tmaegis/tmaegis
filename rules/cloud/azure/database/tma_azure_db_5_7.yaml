id: TMA-AZURE-DB-5.7
title: Ensure server parameter 'error_server_log_file' is Enabled for MySQL Database Server
description: Enable error logs on MySQL flexible servers. With error_server_log_file enabled, MySQL Database will log database errors to a logging solution. These logs assist in producing a forensic trail that can be used for investigation or for detection when paired with a SIEM.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 5.7 Ensure server parameter 'error_server_log_file' is Enabled for MySQL Database Server
audit:
  type: manual
  command: 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threat- detection#lt-3-enable-logging-for-security-investigation 3. https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-error-logs
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Part 1 - Turn on audit logs 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for MySQL flexible servers. 3. For each database, under Settings, click Server parameters. 4. Set error_server_log_file to ON. 5. Click Save. Part 2 - Capture audit logs (diagnostic settings is for example only, send these logs to the appropriate data sink for your logging needs) 1. Under Monitoring, select Diagnostic settings. 2. Select + Add diagnostic setting. 3. Provide a diagnostic setting name. 4. Under Categories, select MySQL Audit Logs. 5. Specify destination details. 6. Click Save. It may take up to 10 minutes for the logs to appear in the configured destination. Remediate from PowerShell Use the below command to enable error_server_log_file: Update-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name error_server_log_file -Value on'
