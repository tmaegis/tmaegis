id: TMA-AZURE-DB-6.2
title: Ensure Azure Database for PostgreSQL uses only Microsoft Entra Authentication
description: Ensuring that Microsoft Entra Authentication is the only authentication method prevents the local PostgreSQL authentication from being used. The use of a centralized Identity and Access Management (IAM) solution such as Microsoft Entra ID is highly recommended for all activity related to Identity, Authentication, Authorization, and Accountability. Decentralized IAM – such as local authentication methods – may present additional vulnerability and introduce avoidable administrative complexity.
target: azure
level: 1
severity: medium
tags:
- auth
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.2 Ensure Azure Database for PostgreSQL uses only Microsoft Entra Authentication
audit:
  type: manual
  command: Audit from Azure Portal 1. From Azure Database for PostgreSQL select a server to audit. 2. Under the Security section, click Authentication 3. In the main window, under the Authentication header, ensure that "Authentication method:" reflects the selection of Microsoft Entra authentication only.
remediation:
  type: iac_patch
  command: Audit from Azure Portal 1. From Azure Database for PostgreSQL select a server to remediate. 2. Under the Security section, click Authentication 3. In the main window, under the Authentication header where "Authentication method:" provides three options, select Microsoft Entra authentication only.
