id: TMA-AZURE-DB-5.8
title: Ensure server parameter 'require_secure_transport' is set to 'ON' for MySQL Server
description: Enable require_secure_transport on MySQL flexible servers. The Secure Sockets Layer (SSL) protocol encrypts network traffic transiting between server and client. Enforcing SSL connections between database server and client applications helps protect against "man in the middle" attacks by encrypting the data stream between the server and application.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 5.8 Ensure server parameter 'require_secure_transport' is set to 'ON' for MySQL Server
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for MySQL flexible servers. 3. For each database, under Settings, click Server parameters. 4. In the filter bar, type require_secure_transport. 5. Ensure that the value for require_secure_transport is ON. Audit from Azure CLI Ensure the below command returns a value of on: az mysql flexible-server parameter show --resource-group <resourceGroup> -- server-name <serverName> --name require_secure_transport Audit from PowerShell Ensure the below command returns a Value of on: Get-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> - ServerName <serverName> -Name require_secure_transport'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for MySQL flexible servers. 3. For each database, under Settings, click Server parameters. 4. In the filter bar, type require_secure_transport. 5. Set the VALUE for require_secure_transport to ON. 6. Click Save. Remediate from Azure CLI Use the below command to enable require_secure_transport: az mysql flexible-server parameter set --resource-group <resourceGroup> -- server-name <serverName> --name require_secure_transport --value on Remediate from PowerShell Use the below command to enable require_secure_transport: Update-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name require_secure_transport -Value on'
