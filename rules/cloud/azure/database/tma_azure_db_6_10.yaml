id: TMA-AZURE-DB-6.10
title: Ensure server parameter 'require_secure_transport' is set to 'ON' for PostgreSQL server
description: Enable require_secure_transport on PostgreSQL flexible servers. SSL connectivity helps to provide a new layer of security by connecting database server to client applications using Secure Sockets Layer (SSL). Enforcing SSL connections between database server and client applications helps protect against "man in the middle" attacks by encrypting the data stream between the server and application.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.10 Ensure server parameter 'require_secure_transport' is set to 'ON' for PostgreSQL server
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type require_secure_transport. 5. Ensure that the VALUE for require_secure_transport is set to ON. Audit from Azure CLI Ensure the below command returns a value of on: az postgres flexible-server parameter show --resource-group <resourceGroup> - -server-name <serverName> --name require_secure_transport Audit from PowerShell Ensure the below command returns a Value of on: Get-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name require_secure_transport Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: c29c38cb-74a7-4505-9a06-e588ab86620a - Name: ''Enforce SSL connection should be enabled for PostgreSQL flexible servers'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type require_secure_transport. 5. Set the VALUE for require_secure_transport to ON. 6. Click Save. Remediate from Azure CLI Use the below command to enable require_secure_transport: az postgres flexible-server parameter set --resource-group <resourceGroup> -- server-name <serverName> --name require_secure_transport --value on Remediate from PowerShell Update-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name require_secure_transport - Value on'
