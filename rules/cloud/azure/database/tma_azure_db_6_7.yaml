id: TMA-AZURE-DB-6.7
title: Ensure server parameter 'log_checkpoints' is set to 'ON' for PostgreSQL server
description: Enable log_checkpoints on PostgreSQL flexible servers. Enabling log_checkpoints helps the PostgreSQL Database to Log each checkpoint, which in turn generates query and error logs. However, access to transaction logs is not supported. Query and error logs can be used to identify, troubleshoot, and repair configuration errors and sub-optimal performance.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 6.7 Ensure server parameter 'log_checkpoints' is set to 'ON' for PostgreSQL server
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type log_checkpoints. 5. Ensure that the VALUE for log_checkpoints is set to ON. Audit from Azure CLI Ensure the below command returns a value of on: az postgres flexible-server parameter show --resource-group <resourceGroup> - -server-name <serverName> --name log_checkpoints Audit from PowerShell Ensure the below command returns a Value of on: Get-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name log_checkpoints Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 70be9e12-c935-49ac-9bd8-fd64b85c1f87 - Name: ''Log checkpoints should be enabled for PostgreSQL flexible servers'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for PostgreSQL servers. 3. For each server, under Settings, click Server parameters. 4. In the filter bar, type log_checkpoints. 5. Set the VALUE for log_checkpoints to ON. 6. Click Save. Remediate from Azure CLI Use the below command to enable log_checkpoints: az postgres flexible-server parameter set --resource-group <resourceGroup> -- server-name <serverName> --name log_checkpoints --value on Remediate from PowerShell Update-AzPostgreSqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name log_checkpoints -Value on'
