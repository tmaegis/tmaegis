id: TMA-AZURE-DB-5.5
title: Ensure server parameter 'audit_log_enabled' is set to 'ON' for MySQL flexible server
description: Enable audit_log_enabled on MySQL flexible servers. Enabling audit_log_enabled helps MySQL Database to log items such as connection attempts to the server, DDL/DML access, and more. Log data can be used to identify, troubleshoot, and repair configuration errors and suboptimal performance.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- database
- logging
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 5.5 Ensure server parameter 'audit_log_enabled' is set to 'ON' for MySQL flexible server
audit:
  type: manual
  command: 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threat- detection#lt-3-enable-logging-for-security-investigation 3. https://learn.microsoft.com/en-us/azure/mysql/flexible-server/tutorial-configure- audit#configure-auditing-by-using-the-azure-cli 4. https://www.azadvertizer.net/azpolicyadvertizer/4dc90661-5d91-41f1-be00- d243f6f3fe9c.html
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Part 1 - Turn on audit logs 1. Login to Azure Portal using https://portal.azure.com. 2. Go to Azure Database for MySQL flexible servers. 3. For each database, under Settings, click Server parameters. 4. Set audit_log_enabled to ON. 5. Click Save. Part 2 - Capture audit logs (diagnostic settings is for example only, send these logs to the appropriate data sink for your logging needs) 1. Under Monitoring, select Diagnostic settings. 2. Select + Add diagnostic setting. 3. Provide a diagnostic setting name. 4. Under Categories, select MySQL Audit Logs. 5. Specify destination details. 6. Click Save. It may take up to 10 minutes for the logs to appear in the configured destination. Remediate from Azure CLI Use the below command to enable audit_log_enabled : az mysql flexible-server parameter set --resource-group <resourceGroup> -- server-name <serverName> --name audit_log_enabled --value on Remediate from PowerShell Use the below command to enable audit_log_enabled
    : Update-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup> -ServerName <serverName> -Name audit_log_enabled -Value on'
