id: TMA-AZURE-DB-2.9
title: Ensure 'Access Keys Authentication' is set to 'Disabled'
description: Ensure access key authentication is disabled for Azure Cache for Redis instances. Use Microsoft Entra for secure cache authentication. Access keys introduce security risks and management challenges, as they are long- lived secrets vulnerable to expose or misuse. Microsoft Entra authentication provides centralized identity and access management, reducing risk and improving overall security.
target: azure
level: 1
severity: medium
tags:
- access-control
- auth
- azure
- cloud
- crypto
- database
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.9 Ensure 'Access Keys Authentication' is set to 'Disabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. Under Settings, select Authentication. 4. Select Access keys. 5. Ensure Disable Access Keys Authentication is checked. 6. Repeat steps 1-5 for each cache. Audit from Azure CLI Run the following command to list caches: az redis list For each cache, run the following command to get the disableAccessKeyAuthentication setting: az redis show --resource-group <resource-group> --name <cache> --query disableAccessKeyAuthentication Ensure true is returned. Audit from PowerShell Run the following command to list caches: Get-AzRedisCache Run the following command to get the cache in a resource group with a given name: $cache = Get-AzRedisCache -ResourceGroupName <resource-group> -Name <cache> Run the following command to get the DisableAccessKeyAuthentication setting: $cache.DisableAccessKeyAuthentication Ensure True is returned. Repeat for each cache. Audit From Azure Policy If referencing a digital
    copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. Under Settings, select Authentication. 4. Select Access keys. 5. Check Disable Access Keys Authentication. 6. Select Save. 7. Select Yes to confirm. 8. Repeat steps 1-7 for each cache. Remediate from Azure CLI For each cache requiring remediation, run the following command to disable access key authentication: az redis update --resource-group <resource-group> --name <cache> --set "disableAccessKeyAuthentication=true" Remediate from PowerShell For each cache requiring remediation, run the following command to disable access key authentication: Set-AzRedisCache -ResourceGroupName <resource-group> -Name <cache> - DisableAccessKeyAuthentication $true'
