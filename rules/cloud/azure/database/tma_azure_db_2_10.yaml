id: TMA-AZURE-DB-2.10
title: Ensure 'Update Channel' is set to 'Stable'
description: Ensure all Azure Cache for Redis instances are configured to use the stable update channel. By using the stable update channel, organizations minimize the risk of introducing issues that may exist in preview update streams. The stable update channel improves security posture and reduces exposure to vulnerabilities.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- database
- patching
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.10 Ensure 'Update Channel' is set to 'Stable'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. Under Settings, select Schedule updates. 4. Ensure Update Channel is set to Stable. 5. Repeat steps 1-4 for each cache. Audit from Azure CLI Run the following command to list caches: az redis list For each cache, run the following command to get the updateChannel setting: az redis show --resource-group <resource-group> --name <cache> --query updateChannel Ensure "Stable" is returned. Audit from PowerShell Run the following command to list caches: Get-AzRedisCache Run the following command to get the cache in a resource group with a given name: $cache = Get-AzRedisCache -ResourceGroupName <resource-group> -Name <cache> Run the following command to get the UpdateChannel setting: $cache.UpdateChannel Ensure Stable is returned. Repeat for each cache.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Azure Cache for Redis. 2. Select the name of a cache. 3. Under Settings, select Schedule updates. 4. Set Update Channel to Stable. 5. Select Save. 6. Repeat steps 1-5 for each cache requiring remediation. Remediate from Azure CLI For each cache requiring remediation, run the following command to set updateChannel to Stable: az redis update --resource-group <resource-group> --name <cache> --set "updateChannel=Stable" Remediate from PowerShell For each cache requiring remediation, run the following command to set UpdateChannel to Stable: Set-AzRedisCache -ResourceGroupName <resource-group> -Name <cache> - UpdateChannel Stable'
