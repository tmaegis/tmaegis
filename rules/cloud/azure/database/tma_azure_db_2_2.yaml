id: TMA-AZURE-DB-2.2
title: Ensure that 'Allow access only via SSL' is set to 'Yes'
description: Setting ‘Allow access only via SSL’ to ‘Yes’ ensures that data in transit to and from Azure Cache for Redis is encrypted using TLS. Data in transit which is not encrypted is vulnerable to attacks including adversary-in-the- middle (AITM or MITM), eavesdropping, or session hijack. These attacks can result in the compromise and exfiltration of data.
target: azure
level: 1
severity: medium
tags:
- access-control
- azure
- cloud
- database
- tls
reference: CIS Microsoft Azure Database Services Benchmark v2.0.0 - 2.2 Ensure that 'Allow access only via SSL' is set to 'Yes'
audit:
  type: manual
  command: 'Audit From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, under Settings, click on Advanced Settings 5. Review the setting under Allow access only via SSL If Yes is selected, the configuration for that instance is compliant. Audit From Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 22bee202-a82f-4305-9a2a-6d7f44d4dedb - Name: ''Only secure connections to your Azure Cache for Redis should be enabled'' - Policy ID: 766f5de3-c6c0-4327-9f4d-042ab8ae846c - Name: ''Configure Azure Cache for Redis to disable non SSL ports'''
remediation:
  type: iac_patch
  command: Remediate From Azure Portal 1. Search for and open the Azure Cache for Redis service 2. For each instance, repeat the remaining steps 3. Click on the name of the instance 4. In the blade menu on the left, under Settings, click on Advanced Settings 5. Select Yes under the Allow access only via SSL heading
