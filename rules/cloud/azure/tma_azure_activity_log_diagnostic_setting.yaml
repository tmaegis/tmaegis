id: TMA-AZURE-ACTIVITY-LOG-DIAGNOSTIC-SETTING
title: Ensure a diagnostic setting exists for the subscription activity log
description: Activity log entries are kept only 90 days in the platform; a subscription diagnostic setting exports them to Log Analytics, storage or Event Hubs for longer retention and alerting. Read-only Azure CLI calls against the current subscription; credentials come from the CLI's normal sign-in (az login, a service principal or managed identity; select the subscription with az account set). A missing CLI or session fails the check.
target: azure
level: 1
severity: medium
tags:
- azure
- logging
reference: CIS Microsoft Azure Foundations Benchmark v6.0.0 - Logging and Monitoring - subscription activity log diagnostic setting (verify section number for your release)
audit:
  type: command
  command: 'out=$(az monitor diagnostic-settings subscription list --query ''(value || @)[].name'' -o tsv 2>/dev/null) || exit 1

    [ -n "$out" ] && echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'az monitor diagnostic-settings subscription create --name activity-export --location <region> --workspace <log-analytics-id> (or --storage-account) --logs ''[{"category":"Administrative","enabled":true},...]''; Terraform: azurerm_monitor_diagnostic_setting with target_resource_id = subscription id.'
