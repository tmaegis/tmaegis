id: TMA-AZURE-COMPUTE-2.1.18
title: Ensure app is integrated with a virtual network
description: Integrate App Service apps with a virtual network to enable access to resources in or through a non-internet-routable virtual network. Integrate App Service apps with a virtual network for increased security and control.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.18 Ensure app is integrated with a virtual network
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Outbound traffic configuration, next to Virtual network integration, ensure that a virtual network and subnet name are displayed. 5. Repeat steps 1-4 for each app. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the virtual network subnet ID: az webapp show --resource-group <resource-group-name> --name <app-name> -- query "virtualNetworkSubnetId" Ensure that a virtual network subnet ID is returned. Audit from PowerShell Run the following command to list apps: Get-AzWebApp Run the following command to get the app in a resource group with a given name: $app = Get-AzWebapp -ResourceGroupName <resource-group-name> -Name <app-name> Run the following command to get the virtual network subnet ID: $app.virtualNetworkSubnetId Ensure that a virtual network subnet ID is returned. Repeat for each
    app. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can sea...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Outbound traffic configuration, next to Virtual network integration, click Not configured. 5. Click Add virtual network integration. 6. Select an existing App Service Plan connection, or select New connection and select a subscription, virtual network, and subnet. 7. Click Connect. 8. Repeat steps 1-7 for each app requiring remediation. Remediate from Azure CLI For each app requiring remediation, run the following command to integrate with a virtual network: az webapp vnet-integration add --resource-group <resource-group-name> --name <app-name> --vnet <virtual-network-name> --subnet <subnet-name> Remediate from PowerShell For each app requiring remediation, run the following commands to integrate with a virtual network: Prepare parameters: $siteName = ''<app-name>'' $vNetResourceGroupName = ''<virtual-network-resource-group-name>'' $appResourceGroupName
    = ''<app-resource-group-name>'' $vNetName = ''<virtual-network-name>'' $integrationSubnetName = ''<subnet-name>'' $vNetSubscriptionId = ''<subscription-guid>'' Check if the subnet is delegated to Microsoft.Web/serverF...'
