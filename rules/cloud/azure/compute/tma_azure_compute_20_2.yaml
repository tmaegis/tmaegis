id: TMA-AZURE-COMPUTE-20.2
title: Ensure that 'OS and Data' disks are encrypted with Customer Managed Key (CMK)
description: Ensure that OS disks (boot volumes) and data disks (non-boot volumes) are encrypted with CMK (Customer Managed Keys). Customer Managed keys can be either ADE or Server Side Encryption (SSE). Encrypting the IaaS VM's OS disk (boot volume) and Data disks (non-boot volume) ensures that the entire content is fully unrecoverable without a key, thus protecting the volume from unwanted reads. PMK (Platform Managed Keys) are enabled by default in Azure-managed disks and allow encryption at rest. CMK is recommended because it gives the customer the option to control which specific keys are used for the encryption and decryption of the disk. The customer can then change keys and increase security by disabling them instead of relying on the PMK key that remains unchanging. There is also the option to increase security further by using automatically rotating keys so that access to disk is ensured...
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- compute
- crypto
- encryption
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.2 Ensure that 'OS and Data' disks are encrypted with Customer Managed Key (CMK)
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Virtual machines. 2. For each virtual machine, go to Settings. 3. Click on Disks. 4. Ensure that the OS disk and Data disks have encryption set to CMK. Audit from PowerShell $ResourceGroupName="yourResourceGroupName" $DiskName="yourDiskName" $disk=Get-AzDisk -ResourceGroupName $ResourceGroupName -DiskName $DiskName $disk.Encryption.Type Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: ca88aadc-6e2b-416c-9de2-5a0f01d1693f - Name: ''Linux virtual machines should enable Azure Disk Encryption or EncryptionAtHost'' - Policy ID: 3dc5edcd-002d-444c-b216-e123bbfa37c0 - Name: ''Windows virtual machines should enable Azure Disk Encryption or EncryptionAtHost'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Note: Disks must be detached from VMs to have encryption changed. 1. Go to Virtual machines 2. For each virtual machine, go to Settings 3. Click on Disks 4. Click the ellipsis (...), then click Detach to detach the disk from the VM 5. Now search for Disks and locate the unattached disk 6. Click the disk then select Encryption 7. Change your encryption type, then select your encryption set 8. Click Save 9. Go back to the VM and re-attach the disk Remediate from PowerShell $KVRGname = ''MyKeyVaultResourceGroup''; $VMRGName = ''MyVirtualMachineResourceGroup''; $vmName = ''MySecureVM''; $KeyVaultName = ''MySecureVault''; $KeyVault = Get-AzKeyVault -VaultName $KeyVaultName -ResourceGroupName $KVRGname; $diskEncryptionKeyVaultUrl = $KeyVault.VaultUri; $KeyVaultResourceId = $KeyVault.ResourceId; Set-AzVMDiskEncryptionExtension -ResourceGroupName $VMRGname -VMName $vmName -DiskEncryptionKeyVaultUrl $diskEncryptionKeyVaultUrl - DiskEncryptionKeyVaultId $KeyVaultResourceId;
    NOTE: During encryption it is likely that a reboot will be required. It may take up to 15 minutes to complete the process. For Linux machines you may need to set the -skipVmBackup parameter.'
