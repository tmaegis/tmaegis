id: TMA-AZURE-COMPUTE-15.4
title: Ensure Private endpoints are considered for Batch accounts
description: Private endpoints for Azure Batch accounts ensure all network communication occurs over private networks rather than the public internet. Configuring private endpoints for Azure Batch accounts ensures all network traffic remains within the Microsoft Azure backbone network, eliminating exposure to public internet threats. This meets zero-trust security principles by enforcing network-level isolation and reducing the attack surface. The configuration also enables precise network monitoring through Azure Network Watcher and NSG flow logs.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 15.4 Ensure Private endpoints are considered for Batch accounts
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal https://portal.azure.com/ 2. Navigate to Batch Accounts For each Batch Account, perform the following: 1. Under Settings, click on Networking 2. Click the Private access tab 3. For each Private Endpoint listed, ensure that the connection state is Approved Audit from Azure CLI To list Private Endpoints from CLI: az network private-endpoint list \ --resource-group <RESOURCE_GROUP> \ --query "[?privateLinkServiceConnections[?contains(properties.privateLinkServiceId, ''Microsoft.Batch/batchAccounts/<BATCH_ACCOUNT_NAME>'')]]" Expected: Should return at least one private endpoint configuration Audit from PowerShell To list Private Endpoints from PowerShell: Get-AzPrivateEndpoint -ResourceGroupName <RESOURCE_GROUP> | Where-Object { $_.PrivateLinkServiceConnections.PrivateLinkServiceId - match "Microsoft.Batch/batchAccounts/<BATCH_ACCOUNT_NAME>" } Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy
    ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Navigate to your Batch account 2. Under the Settings drop down, click Networking 3. Click the Private access tab 4. Click + Private endpoint 5. Configure: - Virtual network and subnet - DNS integration (auto-approved recommended) - Target subresource: batchAccount Remediate from Azure CLI az network private-endpoint create \ --name batch-pe \ --resource-group <rg> \ --vnet-name <vnet> \ --subnet <subnet> \ --private-connection-resource-id /subscriptions/<sub- id>/resourceGroups/<rg>/providers/Microsoft.Batch/batchAccounts/<account> \ --group-id batchAccount \ --connection-name batch-connection'
