id: TMA-AZURE-COMPUTE-2.8
title: Ensure App Service Environment has internal encryption enabled
description: The App Service Environment operates as a black box system where you cannot see the internal components or the communication within the system. To enable higher throughput, encryption is not enabled by default between internal components. The system is secure as the traffic is inaccessible to being monitored or accessed. However, if you have a compliance requirement that requires complete encryption of the data path from end to end, you can enable encryption of the complete data path with a clusterSetting. Setting InternalEncryption to true encrypts internal network traffic in your App Service Environment between the front ends and workers, encrypts the pagefile, and also encrypts the worker disks.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- compute
- encryption
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.8 Ensure App Service Environment has internal encryption enabled
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Service Environments. 2. Click the name of an App Service Environment. 3. Under Settings, click Configuration. 4. Ensure that Internal encryption is set to On. 5. Repeat steps 1-4 for each App Service Environment. Audit from Azure CLI Run the following command to list App Service Environments: az appservice ase list For each App Service Environment, ensure that clusterSettings includes: { "name": "InternalEncryption", "value": "true" } Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: fb74e86f-d351-4b8d-b034-93da7391c01f - Name: ''App Service Environment should have internal encryption enabled'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to App Service Environments. 2. Click the name of an App Service Environment. 3. Under Settings, click Configuration. 4. Next to Internal encryption, click the radio button next to On. 5. Click Save. 6. Click Continue. 7. Repeat steps 1-6 for each App Service Environment requiring remediation.
