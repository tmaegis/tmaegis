id: TMA-AZURE-COMPUTE-2.1.3
title: Ensure 'PHP version' is currently supported (if in use)
description: Periodically, older versions of PHP may be deprecated and no longer supported. Using a supported version of PHP for App Service apps is recommended to avoid potential unpatched vulnerabilities. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.3 Ensure 'PHP version' is currently supported (if in use)
audit:
  type: manual
  command: 'Take note of the currently supported versions of PHP here: https://www.php.net/supported-versions.php Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, ensure that for a Stack of PHP, the Major version and Minor version reflect a currently supported release. 5. Repeat steps 1-4 for each app. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the PHP version: az webapp config show --resource-group <resource-group-name> --name <app- name> --query "{LinuxFxVersion:linuxFxVersion,PhpVersion:phpVersion}" If PHP is in use, ensure the version is currently supported. Audit from PowerShell Run the following command to list apps: Get-AzWebApp Run the following command to get the app in a resource group with a given name: $app = Get-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name> Run the following command
    to get the PHP version: $app.SiteConfig | select-object LinuxFXVersion, PhpVersion If PHP is in use, ensure the version is currently supported. Repeat for each app. Audit from Azure Policy If referenci...'
remediation:
  type: iac_patch
  command: 'Note: No action is required if PHP is not in use. Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, for a Stack of PHP, set the Major version and Minor version to a currently supported release. 5. Click Save. 6. Click Continue. 7. Repeat steps 1-6 for each app requiring remediation. Remediate from Azure CLI Run the following command to list supported runtimes: az webapp list-runtimes For each app requiring remediation, run the following command with the appropriate parameters to update the PHP version: az webapp config set --resource-group <resource-group-name> --name <app-name> [--linux-fx-version <php-runtime-version>][--php-version <php-version>] Remediate from PowerShell For each app requiring remediation, run the following command to update the PHP version: Set-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name> - phpVersion <php-version> Note: Currently,
    there is no way to update an app''s Linux FX Version setting using PowerShell.'
