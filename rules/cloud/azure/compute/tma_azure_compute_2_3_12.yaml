id: TMA-AZURE-COMPUTE-2.3.12
title: Ensure managed identities are configured
description: Managed identities from Microsoft Entra ID allow function apps to securely access other Azure services without the need to provision or rotate any secrets. Using managed identities with function apps eliminates the need to store and manage credentials to access Azure resources.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.3.12 Ensure managed identities are configured
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Settings, click Identity. 4. Ensure that in the System assigned pane, the Status is set to On, and an Object (principal) ID is displayed, or that in the User assigned pane, a managed identity is listed. 5. Repeat steps 1-4 for each function app. Audit from Azure CLI Run the following command to list function apps: az functionapp list For each function app, run the following command to get the identity setting: az functionapp show --resource-group <resource-group-name> --name <function- app-name> --query "identity" Ensure that type is set to SystemAssigned, UserAssigned, or both. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 0da106f2-4ca3-48e8-bc85-c638fe6aea8f - Name: ''Function apps should use managed identity'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Settings, click Identity. 4. To add a system assigned managed identity: 1. In the System assigned pane, under Status, click On. 2. Click Save. 3. Click Yes. 5. To add a user assigned managed identity: 1. In the User assigned pane, click Add. 2. Use the filter box to search for a managed identity. 3. Select the identity. 4. Click Add. 6. Repeat steps 1-5 for each function app requiring remediation. Remediate from Azure CLI For each function app requiring remediation, run the following command to assign a system-assigned managed identity: az functionapp identity assign --resource-group <resource-group-name> --name <function-app-name> Remediate from PowerShell For each function app requiring remediation, run the following command to assign a system-assigned managed identity: Update-AzFunctionApp -ResourceGroupName <resource-group-name> -Name <function-app-name> -IdentityType
    SystemAssigned -Force'
