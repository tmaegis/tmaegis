id: TMA-AZURE-COMPUTE-2.2.12
title: Ensure managed identities are configured
description: Managed identities from Microsoft Entra ID allow App Service deployment slots to securely access other Azure services without the need to provision or rotate any secrets. Using managed identities with App Service deployment slots eliminates the need to store and manage credentials to access Azure resources.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.12 Ensure managed identities are configured
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Identity. 6. Ensure that in the System assigned pane, the Status is set to On, and an Object (principal) ID is displayed, or that in the User assigned pane, a managed identity is listed. 7. Repeat steps 1-6 for each app and deployment slot. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, ensure that identity contains type set to SystemAssigned, UserAssigned, or both. Audit from PowerShell Run the following command to list apps: Get-AzWebApp Run the following command to list deployment slots for an app: Get-AzWebAppSlot -ResourceGroupName <resource-group-name> -Name <app-name> Run the following
    command to get the deployment slot with a given name: $slot = Get-AzWebAppSlot -ResourceGroupName <resource-group-name> -Name <app- name> -Slot <deployment-slot-name> Run the following command to get th...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Identity. 6. To add a system assigned managed identity: 1. In the System assigned pane, under Status, click On. 2. Click Save. 3. Click Yes. 7. To add a user assigned managed identity: 1. In the User assigned pane, click Add. 2. Use the filter box to search for a managed identity. 3. Select the identity. 4. Click Add. 8. Repeat steps 1-7 for each app and deployment slot requiring remediation. Remediate from PowerShell For each deployment slot requiring remediation, run the following command to assign a system-assigned managed identity: Set-AzWebAppSlot -ResourceGroupName <resource-group-name> -Name <app-name> - Slot <deployment-slot-name> -AssignIdentity $true'
