id: TMA-AZURE-COMPUTE-2.2.8
title: Ensure 'Minimum Inbound TLS Version' is set to '1.2' or higher
description: The TLS (Transport Layer Security) protocol secures the transmission of data over the internet using standard encryption technology. App Service deployment slots use TLS 1.2 for the Minimum Inbound TLS Version by default and allow for the use of TLS versions 1.0, 1.1, and 1.3. NIST strongly suggests the use of TLS 1.2 and recommends the adoption of TLS 1.3. TLS 1.0 and 1.1 are outdated and vulnerable to security risks. Since TLS 1.2 and TLS 1.3 provide enhanced security and improved performance, it is highly recommended to use TLS 1.2 or higher whenever possible.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
- tls
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.8 Ensure 'Minimum Inbound TLS Version' is set to '1.2' or higher
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, under Platform settings, ensure that Minimum Inbound TLS Version is set to 1.2 or higher. 7. Repeat steps 1-6 for each app and deployment slot. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, run the following command to get the TLS version setting: az resource show --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type config --parent sites/<app- name>/slots/<deployment-slot-name> --query properties.minTlsVersion Ensure that "1.2" or higher is returned. Audit from Azure Policy If referencing a digital copy
    of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#vie...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, under Platform settings, click the drop-down next to Minimum Inbound TLS Version and select 1.2 or higher. 7. Click Save. 8. Click Continue. 9. Repeat steps 1-8 for each app and deployment slot requiring remediation. Remediate from Azure CLI For each deployment slot requiring remediation, run the following command to update the TLS version: az resource update --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type config --parent sites/<app- name>/slots/<deployment-slot-name> --set properties.minTlsVersion=<1.2|1.3>'
