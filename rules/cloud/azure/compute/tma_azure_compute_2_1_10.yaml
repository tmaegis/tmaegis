id: TMA-AZURE-COMPUTE-2.1.10
title: Ensure 'Remote debugging' is set to 'Off'
description: Remote debugging allows an App Service app to be debugged in real-time directly in the Azure environment. When remote debugging is enabled, it opens a communication channel that could potentially be exploited by unauthorized users if not properly secured. Disabling remote debugging on an App Service app is primarily about enhancing security. Remote debugging opens a communication channel that can be exploited by attackers. By disabling it, you reduce the number of potential entry points for unauthorized access. If remote debugging is enabled without proper access controls, it can allow unauthorized users to connect to your application, potentially leading to data breaches or malicious code execution. During a remote debugging session, sensitive information might be exposed. Disabling remote debugging helps ensure that such data remains secure. This minimizes the use of remote access t...
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.10 Ensure 'Remote debugging' is set to 'Off'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com 2. Go to App Services 3. Click on each App 4. Under Setting section, Click on Configuration 5. Under the General settings tab, check the Remote debugging option. Ensure it is set to Off. Audit from Azure CLI To check remote debugging status for an existing app, run the following command, az webapp config show --resource-group <resource_group_name> --name <app_name> --query remoteDebuggingEnabled The output should be false if remote debugging is disabled. Audit from PowerShell To check remote debugging status for an existing app, run the following command, Get-AzWebApp -ResourceGroupName <resource_group_name> -Name <app_name> |Select-Object -ExpandProperty SiteConfig The output of remoteDebuggingEnabled should be false if remote debugging is disabled. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in
    Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: cb510bfd-1cba-4d9f-a230-cb0976...'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com 2. Go to App Services 3. Click on each App 4. Under Setting section, Click on Configuration 5. Under the General settings tab, set the Remote debugging option to Off. Remediate from Azure CLI To set remote debugging status to off, run the following command az webapp config set --resource-group <resource_group_name> --name <app_name> --remote-debugging-enabled false Remediation from PowerShell To set remote debugging status to off, run the following command Set-AzWebApp -ResourceGroupName <resource_group_name> -Name <app_name> - RemoteDebuggingEnabled $false
