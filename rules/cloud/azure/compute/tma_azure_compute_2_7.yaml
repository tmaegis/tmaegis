id: TMA-AZURE-COMPUTE-2.7
title: Ensure App Service Environment is provisioned with v3 or higher
description: Ensure App Service Environment is provisioned with v3 or higher to benefit from the latest enhancements. Older versions of App Service Environment require manual management of Azure resources and have greater scaling limitations.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.7 Ensure App Service Environment is provisioned with v3 or higher
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Service Environments. 2. Click the name of an App Service Environment. 3. Ensure that Version displays App Service Environment v3 or higher. 4. Repeat steps 1-3 for each App Service Environment. Audit from Azure CLI Run the following command to list App Service Environments: az appservice ase list For each App Service Environment, ensure that kind is set to ASEV3 or higher. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: eb4d34ab-0929-491c-bbf3-61e13da19f9a - Name: ''App Service Environment should be provisioned with latest versions'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal When creating an App Service Environment from the portal, after clicking + Add, ensure that Create App Service Environment v3 is displayed.
