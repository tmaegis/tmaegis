id: TMA-AZURE-COMPUTE-2.1.11
title: Ensure incoming client certificates are enabled and required (if in use)
description: Client certificates allow for the app to request a certificate for incoming requests. Only clients that have a valid certificate will be able to reach the app. The TLS mutual authentication technique in enterprise environments ensures the authenticity of clients to the server. If incoming client certificates are enabled, then only an authenticated client with valid certificates can access the app.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.11 Ensure incoming client certificates are enabled and required (if in use)
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Login to Azure Portal using https://portal.azure.com 2. Go to App Services 3. Click on each App 4. Under the Settings section, Click on Configuration, then General settings 5. Ensure that the option Client certificate mode located under Incoming client certificates is set to Require Audit from Azure CLI To check Incoming client certificates value for an existing app, run the following command, az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> -- query clientCertEnabled The output should return true if Incoming client certificates value is set to On. Audit from PowerShell List all web apps. Get-AzWebApp For each web app run the following command. Get-AzWebApp -ResourceGroup <app resource group> -Name <app name> Make sure the ClientCertEnabled is set to True. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a
    printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 19dd1db6-f442-49cf-a838-b0786b4401ef - Name: ''App Serv...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com 2. Go to App Services 3. Click on each App 4. Under the Settings section, Click on Configuration, then General settings 5. Set the option Client certificate mode located under Incoming client certificates to Require Remediate from Azure CLI To set Incoming client certificates value for an existing app, run the following command: az webapp update --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> -- set clientCertEnabled=true'
