id: TMA-AZURE-COMPUTE-20.8
title: '[Legacy] Ensure that VHDs are Encrypted'
description: 'NOTE: This is a legacy recommendation. Managed Disks are encrypted by default and recommended for all new VM implementations. VHD (Virtual Hard Disks) are stored in blob storage and are the old-style disks that were attached to Virtual Machines. The blob VHD was then leased to the VM. By default, storage accounts are not encrypted, and Microsoft Defender will then recommend that the OS disks should be encrypted. Storage accounts can be encrypted as a whole using PMK or CMK. This should be turned on for storage accounts containing VHDs. While it is recommended to use Managed Disks which are encrypted by default, "legacy" VHDs may exist for a variety of reasons and may need to remain in VHD format. VHDs are not encrypted by default, so this recommendation intends to address the security of these disks. In these niche cases, VHDs should be encrypted using the procedures in this recommend...'
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
- encryption
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.8 [Legacy] Ensure that VHDs are Encrypted
audit:
  type: manual
  command: 'Audit from Azure CLI For each virtual machine identify if the VM is using a legacy VHD by reviewing the VHD parameter in the output of the following command. The VHD parameter will contain the Storage Account name used for the VHD. az vm show --name <MyVM> --resource-group <MyResourceGroup> Next, identify if the storage account from the VHD parameter is encrypted by reviewing the encryption --> services --> blob --> enabled within the output of the following command and make sure its value is True. az storage account show --name <storage account name> --resource-group <resource group> Audit from PowerShell: Determine whether the VM is using a VHD for the OS Disk and any Data disks. $virtualMachine = Get-AzVM --Name <vm name> --ResourceGroup <resource group name> |Select-Object -ExpandProperty StorageProfile $virtualMachine.OsDisk $virtualMachine.DataDisks Next, use the value from VHD to see if the storage blob holding the VHD is encrypted. $storageAccount = Get-AzStorageAccount
    -Name <storage account name from VHD setting> -ResourceGroupName <resource group name> $storageAccount.Encryption.Services.Blob Audit from Azure Policy If referencing a digital copy of this Benchmark, cli...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Navigate to the storage account that you wish to encrypt 2. Select encryption 3. Select the encryption type that you wish to use If you wish to use a Microsoft-managed key (the default), you can save at this point and encryption will be applied to the account. If you select Customer-managed keys, it will ask for the location of the key (The default is an Azure Key Vault) and the key name. Once these are captured, save the configuration and the account will be encrypted using the provided key. Remediate from Azure CLI: Create the Key Vault az keyvault create --name <name> --resource-group <resourceGroup> --location <location> --enabled-for-disk-encryption Encrypt the disk and store the key in Key Vault az vm encryption enable -g <resourceGroup> --name <name> --disk-encryption- keyvault myKV Remediate from PowerShell This process uses a Key Vault to store the keys Create the Key Vault New-AzKeyvault -name <name> -ResourceGroupName <resourceGroup>
    -Location <location> -EnabledForDiskEncryption Encrypt the disk and store the key in Key Vault $KeyVault = Get-AzKeyVault -VaultName <name> -ResourceGroupName <resourceGroup> Set-AzVMDiskEncryptionExtension...'
