id: TMA-AZURE-COMPUTE-2.3.17
title: Ensure cross-origin resource sharing does not allow all origins
description: Cross-origin resource sharing (CORS) is a security feature that controls how applications interact with resources hosted on different domains. Restrict CORS to only trusted origins to help enforce proper access control and reduce exposure to malicious cross-origin requests.
target: azure
level: 2
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.3.17 Ensure cross-origin resource sharing does not allow all origins
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Service or Function App. 2. Click the name of a function app. 3. Under API, click CORS. 4. Ensure Allowed Origins does not include *. 5. Repeat steps 1-4 for each function app. Audit from Azure CLI Run the following command to list function apps: az functionapp list For each function app, run the following command to get the CORS allowed origins setting: az functionapp show --resource-group <resource-group-name> --name <function- app-name> --query siteConfig.cors.allowedOrigins Ensure that the response does not include *. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 0820b7b9-23aa-4725-a1ce-ae4558f718e5 - Name: ''Function apps should not have CORS configured to allow
    every resource to access your apps'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Service or Function App. 2. Click the name of a function app. 3. Under API, click CORS. 4. Under Allowed Origins, delete the entry that equals *. 5. Specify the origins that should be allowed to make cross-origin calls. 6. Click Save. 7. Repeat steps 1-6 for each function app requiring remediation. Remediate from Azure CLI For each function app requiring remediation, run the following command: az functionapp cors remove --resource-group <resource-group-name> --name <function-app-name> --allowed-origins "*" Use the following command to specify the origins that should be allowed: az functionapp cors add --resource-group <resource-group-name> --name <function-app-name> --allowed-origins <allowed-origins>'
