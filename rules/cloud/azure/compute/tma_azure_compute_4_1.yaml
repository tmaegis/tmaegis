id: TMA-AZURE-COMPUTE-4.1
title: Ensure SSL is configured for CycleCloud
description: The use of SSL ensures that data in transit to and from the Azure CycleCloud server is encrypted. Encryption of data in transit provides integrity and confidentiality to that data. If unencrypted data is intercepted in transit it is highly vulnerable to exposure and exploitation.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
- tls
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 4.1 Ensure SSL is configured for CycleCloud
audit:
  type: manual
  command: 'From SSH 1. Establish a secure shell session with the Azure CycleCloud server. 2. Navigate to the CycleCloud installation directory. 3. Use a text editor (e.g. Vim, Nano, Emacs) to open the cycle_server.properties file. 4. Review the file for the following properties: webServerEnableHttps=true webServerRedirectHttp=true Note that if these properties are defined in the file multiple times, only the last instance of that property definition will be in effect. If either property is set to false, SSL is NOT configured for the CycleCloud server.'
remediation:
  type: iac_patch
  command: 'From SSH 1. Establish a secure shell session with the Azure CycleCloud server. 2. Navigate to the CycleCloud installation directory. 3. Use a text editor (e.g. Vim, Nano, Emacs) to open the cycle_server.properties file. 4. Edit the following properties to reflect true: webServerEnableHttps=true webServerRedirectHttp=true 5. Save and exit from the text editor. 6. Restart the CycleCloud service to enable the new property definitions: /opt/cycle_server/cycle_server restart'
