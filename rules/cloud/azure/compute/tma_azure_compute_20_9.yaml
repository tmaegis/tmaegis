id: TMA-AZURE-COMPUTE-20.9
title: Ensure only MFA enabled identities can access privileged Virtual Machine
description: Verify identities without MFA that can log in to a privileged virtual machine using separate login credentials. An adversary can leverage the access to move laterally and perform actions with the virtual machine's managed identity. Make sure the virtual machine only has necessary permissions, and revoke the admin-level permissions according to the least privileges principal Integrating multi-factor authentication (MFA) as part of the organizational policy can greatly reduce the risk of an identity gaining control of valid credentials that may be used for additional tactics such as initial access, lateral movement, and collecting information. MFA can also be used to restrict access to cloud resources and APIs. An Adversary may log into accessible cloud services within a compromised environment using Valid Accounts that are synchronized to move laterally and perform actions with the vir...
target: azure
level: 2
severity: medium
tags:
- access-control
- azure
- cloud
- compute
- mfa
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.9 Ensure only MFA enabled identities can access privileged Virtual Machine
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Log in to the Azure portal. 2. Select the Subscription, then click on Access control (IAM). 3. Click Role : All and click All to display the drop-down menu. 4. Type Virtual Machine Administrator Login and select Virtual Machine Administrator Login. 5. Review the list of identities that have been assigned the Virtual Machine Administrator Login role. 6. Go to Microsoft Entra ID. 7. For Per-user MFA: 1. Under Manage, click Users. 2. Click Per-user MFA. 3. Ensure that none of the identities assigned the Virtual Machine Administrator Login role from step 4 have Status set to disabled. 8. For Conditional Access: 1. Under Manage, click Security. 2. Under Protect, click Conditional Access. 3. Ensure that none of the identities assigned the Virtual Machine Administrator Login role from step 4 are exempt from a Conditional Access policy requiring MFA for all users.'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Log in to the Azure portal. 2. This can be remediated by enabling MFA for user, Removing user access or Reducing access of managed identities attached to virtual machines. - Case I : Enable MFA for users having access on virtual machines. 1. Go to Microsoft Entra ID. 2. For Per-user MFA: 1. Under Manage, click Users. 2. Click Per-user MFA. 3. For each user requiring remediation, check the box next to their name. 4. Click Enable MFA. 5. Click Enable. 3. For Conditional Access: 1. Under Manage, click Security. 2. Under Protect, click Conditional Access. 3. Update the Conditional Access policy requiring MFA for all users, removing each user requiring remediation from the Exclude list. - Case II : Removing user access on a virtual machine. 1. Select the Subscription, then click on Access control (IAM). 2. Select Role assignments and search for Virtual Machine Administrator Login or Virtual Machine User Login or any role that provides access to log into
    virtual machines. 3. Click on Role Name, Select Assignments, and remove identities with no MFA configured. - Case III : Reducing access of managed identities attached to virtual machines. 1. Select the S...'
