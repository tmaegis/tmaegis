id: TMA-AZURE-COMPUTE-2.4.2
title: Ensure 'Python version' is currently supported (if in use)
description: Periodically, older versions of Python may be deprecated and no longer supported. Using a supported version of Python for function app deployment slots is recommended to avoid potential unpatched vulnerabilities. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.4.2 Ensure 'Python version' is currently supported (if in use)
audit:
  type: manual
  command: 'Take note of the currently supported versions (given a status of "security") of Python here: https://devguide.python.org/versions/ Audit from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, ensure that for a Stack of Python, the Python Version reflects a currently supported release. 7. Repeat steps 1-6 for each function app and deployment slot. Audit from Azure CLI Run the following command to list function apps: az functionapp list For each function app, run the following command to list deployment slots: az functionapp deployment slot list --resource-group <resource-group-name> -- name <function-app-name> For each deployment slot, run the following command to get the Python version: az resource show --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type
    config --parent sites/<function-app- name>/slots/<deployment-slot-name> --query properties.[linuxFxVersion,pythonVersion] If Python is in use, ensure the version is currently supported. Audit fr...'
remediation:
  type: iac_patch
  command: 'Note: No action is required if Python is not in use. Remediate from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, for a Stack of Python, set the Python Version to a currently supported release. 7. Click Save. 8. Click Continue. 9. Repeat steps 1-8 for each function app and deployment slot requiring remediation. Remediate from Azure CLI Run the following command to list supported runtimes: az functionapp list-runtimes For each deployment slot requiring remediation, run the following command with the appropriate parameters to update the Python version: az resource update --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type config --parent sites/<function-app- name>/slots/<deployment-slot-name> --set properties.linuxFxVersion="PYTHON|<python-version>"'
