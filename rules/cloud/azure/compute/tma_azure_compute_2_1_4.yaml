id: TMA-AZURE-COMPUTE-2.1.4
title: Ensure 'Basic Authentication Publishing Credentials' are 'Disabled'
description: Basic Authentication Publishing Credentials provides the ability to publish—or deploy to—an App Service app without a centralized Identity Provider. For a more effective, capable, and secure solution for Identity, Authentication, Authorization, and Accountability, a centralized Identity Provider such as Entra ID is strongly advised. Basic Authentication introduces an identity silo for privileged access to a resource and produces logging which may not provide a full chain of accountability. This can be exploited in numerous ways and represents a significant vulnerability and attack vector.
target: azure
level: 1
severity: medium
tags:
- auth
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.4 Ensure 'Basic Authentication Publishing Credentials' are 'Disabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Search for, and open App Services from the search bar. 2. For each App Service listed: 3. Click on the App Service name. 4. Under the Settings menu item, click on Configuration 5. Under the General settings tab, scroll down to locate the two Basic Auth settings: - SCM Basic Auth Publishing Credentials - FTP Basic Auth Publishing Credentials Both radio buttons should indicate a status of Off. Repeat this procedure for each App Service. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the basic authentication for FTP setting: az resource show --resource-group <resource-group-name> --name ftp -- namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies -- parent sites/<app-name> --query properties.allow Ensure that false is returned. For each app, run the following command to get the basic authentication for SCM setting: az resource show --resource-group <resource-group-name>
    --name scm -- namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies -- parent sites/<app-name> --query properties.allow Ensure that false is returned. Audit from Azure Poli...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Search for, and open App Services from the search bar. 2. For each App Service listed: 3. Click on the App Service name. 4. Under the Settings menu item, click on Configuration 5. Under the General settings tab, scroll down to locate the two Basic Auth settings: - Set the SCM Basic Auth Publishing Credentials radio button to Off - Set the FTP Basic Auth Publishing Credentials radio button to Off CAUTION: The new settings are not yet applied. Applying them may cause your App Service resource to restart - proceed with caution. Click the Save button, then click Continue to apply the updated configuration. Repeat this procedure for each App Service. Remediate from Azure CLI For each app requiring remediation, run the following command to disable basic authentication for FTP: az resource update --resource-group <resource-group-name> --name ftp -- namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies -- parent sites/<app-name> --set
    properties.allow=false For each app requiring remediation, run the following command to disable basic authentication for SCM: az resource update --resource-group <resource-group-name> --name scm -- namesp...'
