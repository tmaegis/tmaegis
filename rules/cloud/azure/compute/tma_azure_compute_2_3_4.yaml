id: TMA-AZURE-COMPUTE-2.3.4
title: Ensure 'FTP state' is set to 'FTPS only' or 'Disabled'
description: By default, App Service supports deployment over FTP. If FTP is essential for a deployment workflow, FTPS should be enforced for all function apps. If FTPS is not explicitly required, the recommended setting is Disabled. FTP is an unencrypted network protocol that transmits data—including passwords—in clear text. The use of this protocol can lead to both data and credential compromise and can present opportunities for exfiltration, persistence, and lateral movement.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.3.4 Ensure 'FTP state' is set to 'FTPS only' or 'Disabled'
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Settings, click Configuration. 4. In the General settings pane, under Platform settings, ensure that FTP state is set to FTPS only or Disabled. 5. Repeat steps 1-4 for each function app. Audit from Azure CLI Run the following command to list function apps: az functionapp list For each function app, run the following command to get the FTPS state setting: az functionapp show --resource-group <resource-group-name> --name <function- app-name> --query siteConfig.ftpsState Ensure that "FtpsOnly" or "Disabled" is returned. Audit from PowerShell Run the following command to list function apps: Get-AzFunctionApp Run the following command to get the function app in a resource group with a given name: $app = Get-AzFunctionApp -ResourceGroupName <resource-group-name> -Name <function-app-name> Run the following command to get the FTPS state setting: $app.SiteConfig.FtpsState Ensure
    that "FtpsOnly" or "Disabled" is returned. Repeat for each function app. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Pol...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Settings, click Configuration. 4. In the General settings pane, under Platform settings, set FTP state to FTPS only or Disabled. 5. Click Save. 6. Click Continue. 7. Repeat steps 1-6 for each function app requiring remediation. Remediate from Azure CLI For each function app requiring remediation, run the following command to set FTPS state to FtpsOnly or Disabled: az functionapp config set --resource-group <resource-group-name> --name <function-app-name> --ftps-state <FtpsOnly|Disabled>'
