id: TMA-AZURE-COMPUTE-2.1.6
title: Ensure 'HTTP version' is set to '2.0' (if in use)
description: Periodically, newer versions are released for HTTP, either due to security flaws or to include additional functionalities. Using the latest HTTP version allows apps to take advantage of security fixes, if any, and/or new functionalities of the newer version. Newer versions may contain security enhancements and additional functionalities. Using the latest version is recommended in order to take advantage of enhancements and new capabilities. With each software installation, organizations need to determine if a given update meets their requirements. They must also verify the compatibility and support provided for any additional software against the update revision that is selected. HTTP 2.0 has additional performance improvements for the head-of-line blocking problem of the old HTTP version, header compression, and request prioritization. HTTP 2.0 no longer supports HTTP 1.1's chunked t...
target: azure
level: 1
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.6 Ensure 'HTTP version' is set to '2.0' (if in use)
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, under Platform settings, ensure that HTTP version is set to 2.0. 5. Repeat steps 1-4 for each app. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the http20Enabled setting: az webapp config show --resource-group <resource-group-name> --name <app- name> --query http20Enabled Ensure that true is returned. Audit from PowerShell Run the following command to list apps: Get-AzWebApp Run the following command to get the app in a resource group with a given name: $app = Get-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name> Run the following command to get the Http20Enabled setting: $app.SiteConfig.Http20Enabled Ensure that True is returned. Repeat for each app. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy
    ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenu...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, under Platform settings, set HTTP version to 2.0. 5. Click Save. 6. Click Continue. 7. Repeat steps 1-6 for each app requiring remediation. Remediate from Azure CLI For each app requiring remediation, run the following command to enable http20Enabled: az webapp config set --resource-group <resource-group-name> --name <app-name> --http20-enabled true'
