id: TMA-AZURE-COMPUTE-2.2.15
title: Ensure configuration is routed through the virtual network integration
description: By default, configuration traffic for App Service deployment slots goes directly over the public route. Container image pulls and content sharing can be routed through the virtual network integration. This recommendation should be applied after integrating an App Service deployment slot with a virtual network. Route container image pulls and content sharing through a virtual network integration for increased security and control.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.15 Ensure configuration is routed through the virtual network integration
audit:
  type: manual
  command: 'Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, ensure that vnetImagePullEnabled and vnetContentShareEnabled are set to true. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 5747353b-1ca9-42c1-a4dd-b874b894f3d4 - Name: ''App Service app slots should enable configuration routing to Azure Virtual Network'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure CLI For each deployment slot requiring remediation, run the following command to route container image pulls and content sharing through the virtual network integration: az resource update --resource-group <resource-group-name> --name <app- name>/slots/<deployment-slot-name> --resource-type "Microsoft.Web/sites" -- set properties.vnetImagePullEnabled=true --set properties.vnetContentShareEnabled=true'
