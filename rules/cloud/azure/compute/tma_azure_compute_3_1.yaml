id: TMA-AZURE-COMPUTE-3.1
title: Ensure Private Virtual Networks are used for Container Instances
description: Private Virtual Networks (vNets) ensure that services and hosts within the subscription environment are appropriately segmented in private subnets. Public IP addressing for container instances should be handled through a NAT gateway and/or Firewall. In addition to the use of a private vNet for container instances, ensure that a Network Security Group (NSG) is configured and applied to your container instance vNet. The NSG will need to be configured with inbound and outbound TCP/UDP traffic rules which reflect the needs of the services running in your container instance. Network segmentation reduces threat surface and limits potential lateral movement in the case of breach. Container instances with Public IP addresses present significant threat surface and should be avoided.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
- containers
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 3.1 Ensure Private Virtual Networks are used for Container Instances
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Container Instances. 2. Select a named container instance. 3. Click on Properties under the Settings section. 4. Ensure the IP address property indicates (Private). 5. Repeat these steps for each named container instance. Audit from Azure CLI Run the following command: az container list For each Container Instance, ensure "type": "Private" is indicated under the "ipAddress" section.'
remediation:
  type: iac_patch
  command: Container Instances which have been created with Public IP addresses will need to be re-created with private IP addresses. During the initial creation of a Container Instance, ensure that the Networking Type of "Private" is selected prior to creating the Container Instance.
