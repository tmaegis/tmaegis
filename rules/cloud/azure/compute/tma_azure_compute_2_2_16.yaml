id: TMA-AZURE-COMPUTE-2.2.16
title: Ensure all traffic is routed through the virtual network
description: Enable vnetRouteAllEnabled to ensure all outbound traffic is routed through the integrated virtual network. This recommendation should be applied after integrating an App Service deployment slot with a virtual network. Routing all outbound traffic through the virtual network enhances security.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.16 Ensure all traffic is routed through the virtual network
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, click the virtual network and subnet name. 7. Under Application routing, ensure that the box next to Outbound internet traffic is checked. 8. Repeat steps 1-7 for each app and deployment slot. Audit form Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, ensure that vnetRouteAllEnabled is set to true. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from
    this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: f5c0bfb3-acea-47b1-b477-b0edcdf6edc1 - Name: ''App Service app slots should enable outbound non-RFC...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, click the virtual network and subnet name. 7. Under Application routing, check the box next to Outbound internet traffic. 8. Click Apply. 9. Repeat steps 1-8 for each app and deployment slot requiring remediation. Remediate from Azure CLI For each deployment slot requiring remediation, run the following command to route all traffic through the virtual network: az resource update --resource-group <resource-group-name> --name <app- name>/slots/<deployment-slot-name> --resource-type "Microsoft.Web/sites" -- set properties.vnetRouteAllEnabled=true'
