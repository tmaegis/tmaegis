id: TMA-AZURE-COMPUTE-2.10
title: Ensure App Service Environment has TLS cipher suite ordering configured
description: 'App Service Environment supports changing the cipher suite from the default. The default set of ciphers is the same set that is used in the multi-tenant App Service. Changing the cipher suite is only possible with App Service Environment, the single- tenant offering, not the multi-tenant offering, because changing it affects the entire App Service deployment. There are two cipher suites that are required for an App Service Environment: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 and TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256. Additionally, you should include the following cipher suites, which are required for TLS 1.3: TLS_AES_256_GCM_SHA384 and TLS_AES_128_GCM_SHA256. Configuring your App Service Environment to use only the ciphers it requires helps to keep the environment secure.'
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
- tls
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.10 Ensure App Service Environment has TLS cipher suite ordering configured
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Resource Explorer. 2. Locate an App Service Environment from the left pane. 3. Ensure the clusterSettings attribute includes: { "name": "FrontEndSSLCipherSuiteOrder", "value": "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_2 56_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256" } 4. Repeat steps 1-3 for each App Service Environment. Audit from Azure CLI Run the following command to list App Service Environments: az appservice ase list For each App Service Environment, ensure that clusterSettings includes: { "name": "FrontEndSSLCipherSuiteOrder", "value": "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM _SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256" } Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 817dcf37-e83d-4999-a472-644eada2ea1e - Name: ''App Service Environment should be configured with strongest TLS Cipher suites'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to Resource Explorer. 2. Locate an App Service Environment from the left pane. 3. In the right pane, click Read/Write to allow editing. 4. Click Edit to edit the resource. 5. Update the clusterSettings attribute to include: { "name": "FrontEndSSLCipherSuiteOrder", "value": "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_2 56_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256" } 6. Click PUT to commit the change. 7. Repeat steps 1-7 for each App Service Environment requiring remediation.'
