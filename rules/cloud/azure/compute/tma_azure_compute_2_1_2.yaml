id: TMA-AZURE-COMPUTE-2.1.2
title: Ensure 'Python version' is currently supported (if in use)
description: Periodically, older versions of Python may be deprecated and no longer supported. Using a supported version of Python for App Service apps is recommended to avoid potential unpatched vulnerabilities. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.2 Ensure 'Python version' is currently supported (if in use)
audit:
  type: manual
  command: 'Take note of the currently supported versions (given a status of "security") of Python here: https://devguide.python.org/versions/ Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, ensure that for a Stack of Python, the Major version and Minor version reflect a currently supported release. 5. Repeat steps 1-4 for each app. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the Python version: az webapp config show --resource-group <resource-group-name> --name <app- name> --query "{LinuxFxVersion:linuxFxVersion,WindowsFxVersion:windowsFxVersion,PythonVersi on:pythonVersion}" If Python is in use, ensure the version is currently supported. Audit from PowerShell $app = Get-AzWebApp -Name <app-name> -ResourceGroup <resource-group-name> $app.SiteConfig |Select-Object LinuxFXVersion, WindowsFxVersion, PythonVersion
    If Python is in use, ensure the version is currently supported. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy defini...'
remediation:
  type: iac_patch
  command: 'Note: No action is required if Python is not in use. Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, for a Stack of Python, set the Major version and Minor version to a currently supported release. 5. Click Save. 6. Click Continue. 7. Repeat steps 1-6 for each app requiring remediation. Remediate from Azure CLI Run the following command to list supported runtimes: az webapp list-runtimes For each app requiring remediation, run the following command with the appropriate parameters to update the Python version: az webapp config set --resource-group <resource-group-name> --name <app-name> [--windows-fx-version "PYTHON|<version>"] [--linux-fx-version "PYTHON|<version>"]'
