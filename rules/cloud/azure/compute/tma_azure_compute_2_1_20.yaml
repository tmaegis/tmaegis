id: TMA-AZURE-COMPUTE-2.1.20
title: Ensure all traffic is routed through the virtual network
description: Enable vnetRouteAllEnabled to ensure all outbound traffic is routed through the integrated virtual network. This recommendation should be applied after integrating an App Service app with a virtual network. Routing all outbound traffic through the virtual network enhances security.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.20 Ensure all traffic is routed through the virtual network
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Outbound traffic configuration, next to Virtual network integration, click the virtual network and subnet name. 5. Under Application routing, ensure that the box next to Outbound internet traffic is checked. 6. Repeat steps 1-5 for each app. Audit form Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to get the virtual network traffic routing setting: az webapp show --resource-group <resource-group-name> --name <app-name> -- query vnetRouteAllEnabled Ensure that true is returned. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: a691eacb-474d-47e4-b287-b4813ca44222
    - Name: ''App Service apps should enable outbound non-RFC 1918 traffic to Azure Virtual Network'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Outbound traffic configuration, next to Virtual network integration, click the virtual network and subnet name. 5. Under Application routing, check the box next to Outbound internet traffic. 6. Click Apply. 7. Repeat steps 1-6 for each app requiring remediation. Remediate from Azure CLI For each app requiring remediation, run the following command to route all traffic through the virtual network: az resource update --resource-group <resource-group-name> --name <app-name> - -resource-type "Microsoft.Web/sites" --set properties.vnetRouteAllEnabled=true'
