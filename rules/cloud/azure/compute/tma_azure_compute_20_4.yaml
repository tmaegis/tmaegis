id: TMA-AZURE-COMPUTE-20.4
title: Ensure that 'Disk Network Access' is NOT set to 'Enable public access from all networks'
description: Virtual Machine Disks and snapshots can be configured to allow access from different network resources. The setting 'Enable public access from all networks' is, in many cases, an overly permissive setting on Virtual Machine Disks that presents atypical attack, data infiltration, and data exfiltration vectors. If a disk to network connection is required, the preferred setting is to 'Disable public access and enable private access.'
target: azure
level: 1
severity: high
tags:
- access-control
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.4 Ensure that 'Disk Network Access' is NOT set to 'Enable public access from all networks'
audit:
  type: manual
  command: 'Audit from Azure Portal Part A. Select the Virtual Machine to Evaluate 1. Using the search bar, search for and open the Virtual Machines service. 2. Click on the name of the Virtual Machine to be audited. Part B. Evaluate each Virtual Machine Disk individually 1. From the selected Virtual Machine resource window, expand the Settings menu item and click Disks. 2. For each disk, click the name of the disk to open the disk resource window. 3. From the selected Disk resource window, expand the Settings menu item, and click Networking. Ensure that Network access is NOT set to Enable public access from all networks. Repeat Part B for each Disk attached to a VM. Repeat Parts A and B to evaluate all Disks in all VMs. Audit from PowerShell For each managed disk, run the following PowerShell command: Get-AzDisk -ResourceGroupName ‘<resource group name>’ -DiskName ‘<disk name>’ Ensure the PublicNetworkAccess setting is Disabled and the NetworkAccessPolicy is set to AllowPrivate or DenyAll.
    Audit from Azure CLI For each managed disk, run the following command: az disk show --disk-name ‘<disk name>’ --resource-group ‘<resource group name>’ Ensure the publicNetworkAccess setting is set to Dis...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal Part A. Select the Virtual Machine to Remediate 1. Using the search bar, search for and open the Virtual Machines service. 2. Click on the name of the Virtual Machine to be remediated. Part B. Remediate each Virtual Machine Disk individually 1. From the selected Virtual Machine resource window, expand the Settings menu item and click Disks. 2. For each disk, click the name of the disk to open the disk resource window. 3. From the selected Disk resource window, expand the Settings menu item, and click Networking. Under Network access, select the radio button for either: - Disable public access and enable private access - Disable public and private access Repeat Part B for each Disk attached to a VM. Repeat Parts A and B to remediate all Disks in all VMs. Remediate from PowerShell To disable PublicNetworkAccess and to set a DenyAll setting for the disk''s NetworkAccessPolicy for each managed disk, run the following command: $disk = Get-AzDisk -ResourceGroupName
    ‘<resource group name>’ -DiskName ‘<disk name>’ $disk.NetworkAccessPolicy = ''DenyAll'' $disk.PublicNetworkAccess = ''Disabled'' Update-AzDisk -ResourceGroup ''<resource group name> -DiskName $disk.Nam...'
