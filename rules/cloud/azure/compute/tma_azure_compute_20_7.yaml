id: TMA-AZURE-COMPUTE-20.7
title: Ensure that Endpoint Protection for all Virtual Machines is installed
description: Install endpoint protection for all virtual machines. Installing endpoint protection systems (like anti-malware for Azure) provides for real- time protection capability that helps identify and remove viruses, spyware, and other malicious software. These also offer configurable alerts when known-malicious or unwanted software attempts to install itself or run on Azure systems.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.7 Ensure that Endpoint Protection for all Virtual Machines is installed
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Security Center 2. Click the Recommendations blade 3. Ensure that there are no recommendations for Endpoint Protection not installed on Azure VMs Audit from Azure CLI az vm show -g <MyResourceGroup> -n <MyVm> -d --query "resources[?type==''Microsoft.Compute/virtualMachines/extensions''].{ExtensionN ame:name}" -o table If extensions are installed, it will list the installed extensions. EndpointSecurity || TrendMicroDSA* || Antimalware || EndpointProtection || SCWPAgent || PortalProtectExtension* || FileSecurity* Alternatively, you can employ your own endpoint protection tool for your OS. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 501541f7-f7e7-4cd6-868c-4190fdad3ac9
    - Name: ''A vulnerability assessment solution should be enabled on your virtual machines'''
remediation:
  type: iac_patch
  command: Follow Microsoft Azure documentation to install endpoint protection from the security center. Alternatively, you can employ your own endpoint protection tool for your OS.
