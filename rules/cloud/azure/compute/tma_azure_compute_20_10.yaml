id: TMA-AZURE-COMPUTE-20.10
title: Ensure Trusted Launch is enabled on Virtual Machines
description: When Secure Boot and vTPM are enabled together, they provide a strong foundation for protecting your VM from boot attacks. For example, if an attacker attempts to replace the bootloader with a malicious version, Secure Boot will prevent the VM from booting. If the attacker is able to bypass Secure Boot and install a malicious bootloader, vTPM can be used to detect the intrusion and alert you. Secure Boot and vTPM work together to protect your VM from a variety of boot attacks, including bootkits, rootkits, and firmware rootkits. Not enabling Trusted Launch in Azure VM can lead to increased vulnerability to rootkits and boot-level malware, reduced ability to detect and prevent unauthorized changes to the boot process, and a potential compromise of system integrity and data security.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.10 Ensure Trusted Launch is enabled on Virtual Machines
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to Virtual Machines 2. For each VM, under Settings, click on Configuration on the left blade 3. Under Security Type, make sure security type is not standard and if it is Trusted Launch Virtual Machines then make sure Enable Secure Boot & Enable vTPM are checked Audit from Azure CLI Run the following command to list VM names and security profile settings: az vm list --query [*].[name,securityProfile] For each VM, ensure that securityType is set to TrustedLaunch, uefiSettings.secureBootEnabled is set to true, and uefiSettings.vTpmEnabled is set to true. Audit from PowerShell Run the following command to list VMs: Get-AzVm Run the following command to get the VM in a resource group with a given name: $vm = Get-AzVm -ResourceGroupName <resource-group> -Name <vm> Run the following command to get the security profile settings for the VM: $vm.SecurityProfile Ensure that SecurityType is set to TrustedLaunch. Run the following command to get the UEFI settings
    for the VM: $vm.SecurityProfile.UefiSettings Ensure that SecureBootEnabled and VTpmEnabled are set to True. Repeat for each VM. Audit from Azure Policy If referencing a digital copy of this Benchmark, c...'
remediation:
  type: iac_patch
  command: 'Note: Trusted launch on existing virtual machines (VMs) is currently not supported for Azure Generation 1 VMs Remediate from Azure Portal 1. Go to Virtual Machines. 2. For each VM, under Settings, click on Configuration on the left blade. 3. Under Security Type, select ''Trusted Launch Virtual Machines''. 4. Make sure Enable Secure Boot & Enable vTPM are checked. 5. Click on Apply. Remediate from Azure CLI Ensure that it is safe to change the state of the VM. Run the following command to deallocate the VM: az vm deallocate --resource-group <resource-group> --name <vm> Run the following command to update the VM, setting security type to TrustedLaunch and enabling secure boot and vTPM: az vm update --resource-group <resource-group> --name <vm> --enable-secure- boot true --enable-vtpm true --security-type TrustedLaunch Run the following command to restart the VM: az vm start --resource-group <resource-group> --name <vm> Repeat for each VM requiring remediation. Remediate from PowerShell
    Ensure that it is safe to change the state of the VM. Run the following command to stop the VM: Stop-AzVm -ResourceGroupName <resource-group> -Name <vm> -Force Run the following command to get the VM...'
