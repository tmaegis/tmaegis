id: TMA-AZURE-COMPUTE-2.6
title: Ensure App Service Environment is deployed with an internal load balancer
description: App Service Environment apps should not be reachable over public internet. To ensure apps deployed in an App Service Environment are not accessible over public internet, one should deploy App Service Environment with an IP address in virtual network. To set the IP address to a virtual network IP, the App Service Environment must be deployed with an internal load balancer. Disabling public network access improves security by ensuring that a service is not exposed on the public internet.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.6 Ensure App Service Environment is deployed with an internal load balancer
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Service Environments. 2. For each App Service Environment, ensure that Virtual IP Type is set to Internal. Audit from Azure CLI Run the following command to list App Service Environments: az appservice ase list For each App Service Environment, ensure that internalLoadBalancingMode is not set to None. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 2d048aca-6479-4923-88f5-e2ac295d9af3 - Name: ''App Service Environment apps should not be reachable over public internet'''
remediation:
  type: iac_patch
  command: 'It is not possible to change the virtual IP configuration of a deployed App Service Environment. When deploying an App Service Environment, next to Virtual IP, select Internal: The endpoint is an internal load balancer (ILB ASE).'
