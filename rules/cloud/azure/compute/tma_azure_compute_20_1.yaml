id: TMA-AZURE-COMPUTE-20.1
title: Ensure Virtual Machines are utilizing Managed Disks
description: 'Migrate blob-based VHDs to Managed Disks on Virtual Machines to exploit the default features of this configuration. The features include: 1. Default Disk Encryption 2. Resilience, as Microsoft will managed the disk storage and move around if underlying hardware goes faulty 3. Reduction of costs over storage accounts Managed disks are by default encrypted on the underlying hardware, so no additional encryption is required for basic protection. It is available if additional encryption is required. Managed disks are by design more resilient that storage accounts. For ARM-deployed Virtual Machines, Azure Adviser will at some point recommend moving VHDs to managed disks both from a security and cost management perspective.'
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 20.1 Ensure Virtual Machines are utilizing Managed Disks
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Using the search feature, go to Virtual Machines 2. Click the Manage view dropdown, then select Edit columns 3. Add Uses managed disks to the selected columns 4. Select Save 5. Ensure all virtual machines listed are using managed disks Audit from PowerShell Get-AzVM | ForEach-Object {"Name: " + $_.Name;"ManagedDisk Id: " + $_.StorageProfile.OsDisk.ManagedDisk.Id;""} Example output: Name: vm1 ManagedDisk Id: /disk1/id Name: vm2 ManagedDisk Id: /disk2/id If the ''ManagedDisk Id'' field is empty the os disk for that vm is not managed. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions - Policy ID: 06a78e20-9358-41c9-923c-fb736d382a4d - Name: ''Audit VMs that do not use managed disks'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Using the search feature, go to Virtual Machines 2. Select the virtual machine you would like to convert 3. Select Disks in the menu for the VM 4. At the top select Migrate to managed disks 5. You may follow the prompts to convert the disk and finish by selecting Migrate to start the process NOTE VMs will be stopped and restarted after migration is complete. Remediate from PowerShell Stop-AzVM -ResourceGroupName $rgName -Name $vmName -Force ConvertTo-AzVMManagedDisk -ResourceGroupName $rgName -VMName $vmName Start-AzVM -ResourceGroupName $rgName -Name $vmName
