id: TMA-AZURE-COMPUTE-2.1.1
title: Ensure 'Java version' is currently supported (if in use)
description: Periodically, older versions of Java may be deprecated and no longer supported. Using a supported version of Java for App Service apps is recommended to avoid potential unpatched vulnerabilities. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.1 Ensure 'Java version' is currently supported (if in use)
audit:
  type: manual
  command: 'Take note of currently supported versions of Java here: https://www.oracle.com/java/technologies/java-se-support-roadmap.html Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Configuration. 4. In the General settings pane, ensure that for a Stack of Java, the Major Version and Minor Version reflect a currently supported release, and that the Java web server version is set to the auto-update option. 5. Repeat steps 1-4 for each app. NOTE: No action is required if Java version is set to Off, as Java is not used by your app. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to check the Java version: az webapp config show --resource-group <resource-group-name> --name <app- name> --query "{LinuxFxVersion:linuxFxVersion, WindowsFxVersion:windowsFxVersion, JavaVersion:javaVersion, JavaContainerVersion:javaContainerVersion, JavaContainer:javaContainer}" If Java is in
    use, ensure the version is currently supported. Audit from PowerShell For each application, store the application information within an object, and then interrogate the SiteConfig information for that appli...'
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Login to Azure Portal using https://portal.azure.com 2. Go to App Services 3. Click on each App 4. Under Settings section, click on Configuration 5. Click on the General settings pane and ensure that for a Stack of Java the Major Version and Minor Version reflect a currently supported release, and that the Java web server version is set to the auto-update option. NOTE: No action is required if Java version is set to Off, as Java is not used by your app. Remediate from Azure CLI To see the list of supported runtimes: az webapp list-runtimes To set a currently supported Java version for an existing app, run the following command: az webapp config set --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> [--java-version <JAVA_VERSION> --java-container <JAVA_CONTAINER> --java- container-version <JAVA_CONTAINER_VERSION> [--windows-fx-version <JAVA_RUNTIME_VERSION>] [--linux-fx-version <JAVA_RUNTIME_VERSION>] If creating a new application to use a
    currently supported version of Java, run the following commands. To create an app service plan: az appservice plan create --resource-group <RESOURCE_GROUP_NAME> --name <PLAN_NAME> --location <LOCATION> [--is...'
