id: TMA-AZURE-COMPUTE-2.2.14
title: Ensure deployment slot is integrated with a virtual network
description: Integrate App Service deployment slots with a virtual network to enable access to resources in or through a non-internet-routable virtual network. Integrate App Service deployment slots with a virtual network for increased security and control.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.14 Ensure deployment slot is integrated with a virtual network
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, ensure that a virtual network and subnet name are displayed. 7. Repeat steps 1-6 for each app and deployment slot. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, ensure that virtualNetworkSubnetId is set to a virtual network subnet ID. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 24b7a1c6-44fe-40cc-a2e6-242d2ef70e98 - Name: ''App Service app slots should be injected into a virtual network'''
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, click Not configured. 7. Click Add virtual network integration. 8. Select an existing App Service Plan connection, or select New connection and select a subscription, virtual network, and subnet. 9. Click Connect. 10. Repeat steps 1-9 for each app and deployment slot requiring remediation.
