id: TMA-AZURE-COMPUTE-2.1.17
title: Ensure private endpoints used to access App Service apps use private DNS zones
description: Use private DNS zones to override DNS resolution for a private endpoint. A private DNS zone links a virtual network to an App Service app. This recommendation assumes application of, and should be applied in conjunction with, the recommendation titled "Ensure private endpoints are used to access App Service apps." It’s important to correctly configure DNS settings to ensure that the fully qualified domain name (FQDN) of the App Service app resolves to the private endpoint IP address.
target: azure
level: 2
severity: low
tags:
- access-control
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.1.17 Ensure private endpoints used to access App Service apps use private DNS zones
audit:
  type: manual
  command: Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Inbound traffic configuration, click the link next to Private endpoints. 5. Click the name of a private endpoint. 6. Under Settings, click DNS configuration. 7. Ensure a configuration is displayed with a value for Private DNS zone. 8. Repeat steps 1-7 for each app and private endpoint.
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Settings, click Networking. 4. Under Inbound traffic configuration, click the link next to Private endpoints. 5. Click the name of a private endpoint. 6. Under Settings, click DNS configuration. 7. Click + Add configuration. 8. Select a Subscription, Private DNS zone, and provide a DNS zone group and Configuration name. 9. Click Add. 10. Repeat steps 1-9 for each app and private endpoint requiring remediation.
