id: TMA-AZURE-COMPUTE-2.2.11
title: Ensure incoming client certificates are enabled and required (if in use)
description: Client certificates allow for the deployment slot to request a certificate for incoming requests. Only clients that have a valid certificate will be able to reach the deployment slot. The TLS mutual authentication technique in enterprise environments ensures the authenticity of clients to the server. If incoming client certificates are enabled, then only an authenticated client with valid certificates can access the deployment slot.
target: azure
level: 2
severity: low
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.11 Ensure incoming client certificates are enabled and required (if in use)
audit:
  type: manual
  command: 'From Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, under Incoming client certificates, ensure that Client certificate mode is set to Required. 7. Repeat steps 1-6 for each app and deployment slot. From Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, ensure that clientCertEnabled is set to true, and clientCertMode is set to Required. Audit from Azure Policy If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the associated Policy definition in Azure. If referencing a printed copy, you can search Policy IDs from this URL: https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions
    - Policy ID: 5b0bd968-5cb5-4513-8987-27786c6f0df8 - Name: ''App Service app slots should have Client Certificates (Incoming client certificates) enabled'''
remediation:
  type: iac_patch
  command: 'Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, under Incoming client certificates, set Client certificate mode to Required. 7. Click Save. 8. Click Continue. 9. Repeat steps 1-8 for each app and deployment slot requiring remediation. Remediate from Azure CLI For each deployment slot requiring remediation, run the following command to enable and require incoming client certificates: az resource update --resource-group <resource-group-name> --name <app- name>/slots/<deployment-slot-name> --resource-type "Microsoft.Web/sites" -- set properties.clientCertEnabled=true --set properties.clientCertMode=Required'
