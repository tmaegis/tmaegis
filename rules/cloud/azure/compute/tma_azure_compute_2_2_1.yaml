id: TMA-AZURE-COMPUTE-2.2.1
title: Ensure 'Java version' is currently supported (if in use)
description: Periodically, older versions of Java may be deprecated and no longer supported. Using a supported version of Java for App Service deployment slots is recommended to avoid potential unpatched vulnerabilities. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
target: azure
level: 1
severity: medium
tags:
- azure
- cloud
- compute
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.2.1 Ensure 'Java version' is currently supported (if in use)
audit:
  type: manual
  command: 'Take note of currently supported versions of Java here: https://www.oracle.com/java/technologies/java-se-support-roadmap.html Audit from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, ensure that for a Stack of Java, the Major version reflects a currently supported release, and that the Java web server version is set to the auto-update option. 7. Repeat steps 1-6 for each app and deployment slot. Audit from Azure CLI Run the following command to list apps: az webapp list For each app, run the following command to list deployment slots: az webapp deployment slot list --resource-group <resource-group-name> --name <app-name> For each deployment slot, run the following command to get the Java version: az resource show --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type
    config --parent sites/<app- name>/slots/<deployment-slot-name> --query properties.[javaContainer,javaContainerVersion,javaVersion,linuxFxVersion,win dowsFxVersion] If Java is in use, ensure the version is...'
remediation:
  type: iac_patch
  command: 'Note: No action is required if Java is not in use. Remediate from Azure Portal 1. Go to App Services. 2. Click the name of an app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Configuration. 6. In the General settings pane, for a Stack of Java, set the Major version to a currently supported release, and set the Java web server version to the auto-update option. 7. Click Save. 8. Click Continue. 9. Repeat steps 1-8 for each app and deployment slot requiring remediation. Remediate from Azure CLI Run the following command to list supported runtimes: az webapp list-runtimes For each deployment slot requiring remediation, run the following command with the appropriate parameters to update the Java version: az resource update --name web --resource-group <resource-group-name> -- namespace Microsoft.Web --resource-type config --parent sites/<app- name>/slots/<deployment-slot-name> --set properties.[javaContainer|javaContainerVersion|javaVersion|linuxFxVersion|win
    dowsFxVersion]="<java-container|java-container-version|java-version|java- runtime-version>"'
