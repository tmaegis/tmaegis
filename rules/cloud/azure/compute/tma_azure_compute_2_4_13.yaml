id: TMA-AZURE-COMPUTE-2.4.13
title: Ensure deployment slot is integrated with a virtual network
description: Integrate function app deployment slots with a virtual network to enable access to resources in or through a non-internet-routable virtual network. This recommendation applies to function apps using the Premium or Dedicated (App Service) plans, which support deployment slots and virtual networking. Integrate function app deployment slots with a virtual network for increased security and control.
target: azure
level: 1
severity: high
tags:
- azure
- cloud
- compute
- network
reference: CIS Microsoft Azure Compute Services Benchmark v2.0.0 - 2.4.13 Ensure deployment slot is integrated with a virtual network
audit:
  type: manual
  command: 'Audit from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, ensure that a virtual network and subnet name are displayed. 7. Repeat steps 1-6 for each function app and deployment slot. Audit from Azure CLI Run the following command to list function apps: az functionapp list For each function app, run the following command to list deployment slots: az functionapp deployment slot list --resource-group <resource-group-name> -- name <function-app-name> For each deployment slot, ensure that virtualNetworkSubnetId is set to a virtual network subnet ID.'
remediation:
  type: iac_patch
  command: Remediate from Azure Portal 1. Go to App Services or Function App. 2. Click the name of a function app. 3. Under Deployment, click Deployment slots. 4. Click the name of a deployment slot. 5. Under Settings, click Networking. 6. Under Outbound traffic configuration, next to Virtual network integration, click Not configured. 7. Click Add virtual network integration. 8. Select an existing App Service Plan connection, or select New connection and select a subscription, virtual network, and subnet. 9. Click Connect. 10. Repeat steps 1-9 for each function app and deployment slot requiring remediation.
