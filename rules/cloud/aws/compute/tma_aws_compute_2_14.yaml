id: TMA-AWS-COMPUTE-2.14
title: Ensure EC2 Auto Scaling Groups Propagate Tags to EC2 Instances that it launches
description: Tags can help with managing, identifying, organizing, searching for, and filtering resources. Additionally, tags can help with security and compliance. Tags can be propagated from an Auto Scaling group to the EC2 instances that it launches. Without tags, EC2 instances created via Auto Scaling can be without tags and could be out of compliance with security policy.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.14 Ensure EC2 Auto Scaling Groups Propagate Tags to EC2 Instances that it launches
audit:
  type: manual
  command: AWS Console 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services and click EC2 under Compute. 3. Select Auto Scaling Groups. 4. For each Auto Scaling Group's Details, ensure that all tags have Tag new instances set to Yes. 5. Repeat Steps 1-4 for each AWS Region used. AWS CLI 1. Run aws autoscaling describe-auto-scaling-groups. 2. Ensure PropogateAtLaunch is true under Tags for each Tag for the Auto Scaling Group. 3. Repeat Steps 1-2 for each AWS Region used.
remediation:
  type: iac_patch
  command: AWS Console 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services and click EC2 under Compute. 3. Select Auto Scaling Groups. 4. Click Edit for each Auto Scaling Group. 5. Check the Tag new instances Box for the Auto Scaling Group. 6. Click Update. 7. Repeat Steps 1-6 for each AWS Region used. AWS CLI 1. Run aws autoscaling create-or-update-tags for tags that are not set to PropogateAtLaunch for each Auto Scaling Group that does not have this property set to true. aws autoscaling create-or-update-tags \ --tags ResourceId=example-autoscaling-group,ResourceType=auto-scaling- group,Key=TagKey,Value=TagValue,PropagateAtLaunch=true 2. Repeat Step 1 for each AWS Region used.
