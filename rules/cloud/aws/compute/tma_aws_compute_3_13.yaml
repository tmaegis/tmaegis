id: TMA-AWS-COMPUTE-3.13
title: Ensure only trusted images are used with Amazon ECS
description: 'Ensure that only trusted container images from verified sources or private repositories are used with Amazon ECS to maintain the integrity and security of workloads. Note: This recommendation assumes that only the latest active revision of a task definition is in use. If older revisions are in use, apply the audit and remediation procedures to those revisions as needed. Using trusted images reduces the risk of vulnerabilities, malware, or unauthorized modifications compromising ECS tasks.'
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.13 Ensure only trusted images are used with Amazon ECS
audit:
  type: manual
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Task definitions. 3. Click the name of a task definition. 4. Click on the latest active revision of the task definition. 5. Click JSON. 6. For each element under containerDefinitions, ensure that image is set to an image trusted by your organization. 7. Repeat steps 1-6 for each task definition. From Command Line: Run the following command to list task definitions: aws ecs list-task-definitions For the latest revision of a task definition, run the following command: aws ecs describe-task-definition --task-definition <task-definition-arn> -- query ''taskDefinition.containerDefinitions[*].image'' Ensure that the command returns only images trusted by your organization. Repeat for each task definition.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Task definitions. 3. Click the name of a task definition. 4. Click on the latest active revision of the task definition. 5. Click Create new revision. 6. Click Create new revision with JSON. 7. For each element under containerDefinitions, set image to an appropriate image trusted by your organization. 8. Repeat steps 1-7 for each task definition requiring remediation. Note: When a task definition is updated, running tasks launched from the previous task definition remain unchanged. Updating a running task requires redeploying it with the new task definition.'
