id: TMA-AWS-COMPUTE-2.1.3
title: Ensure Only Approved Amazon Machine Images (AMIs) are Used
description: Ensure that all base AMIs utilized are approved for use by your organization. An approved AMI is a base EC2 machine image that is a pre-configured operating system configured to run your application. Using approved AMIs helps enforce consistency and security.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.1.3 Ensure Only Approved Amazon Machine Images (AMIs) are Used
audit:
  type: manual
  command: 'Perform the following to confirm only approved AMIs are being used: From the Console: 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/ 2. In the left pane, click Images, then choose AMIs 3. Confirm that Owned by me is selected 4. Review the list of AMIs 5. Confirm that the AMIs listed are approved for use 6. In the left pane, click Instances, then choose Instances 7. Select an EC2 instance for review 8. In the Details tab, review: - AMI Name - AMI location 9. Confirm that the AMI name matches an approved AMI and that the AMI location is within your account 10.Repeat steps 6–9 to verify that all instances are using approved AMIs 10. Repeat the process for all other regions If any AMIs are not approved, refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the following to remove unauthorized AMIs: From the Console: 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/ 2. In the left pane, click Images, then choose AMIs 3. Confirm that Owned by me is selected 4. Review the list of AMIs 5. If an AMI is listed that is not approved, select it 6. Click Actions, then choose Deregister 7. After all unauthorized AMIs have been deregistered, review all EC2 instances: - Click Instances, then choose Instances - Select an EC2 instance for review 8. In the Details tab, review: - AMI Name - AMI location 9. If this information is listed as not available, the instance was built with an unauthorized AMI 10. Follow organizational procedures to secure this instance and replace it with an instance built from an approved AMI, if applicable 11. Repeat steps 7–10 to verify all instances have been created with approved AMIs 12. Repeat the process for all other regions'
