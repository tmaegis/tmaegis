id: TMA-AWS-COMPUTE-2.5
title: Ensure no AWS EC2 Instances are Older than 180 days
description: Identify any running AWS EC2 instances older than 180 days. An EC2 instance is not supposed to run indefinitely and having instance older than 180 days can increase the risk of problems and issues.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.5 Ensure no AWS EC2 Instances are Older than 180 days
audit:
  type: manual
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click INSTANCES, click Instances. 3. Select the EC2 instance. The Instance State must be ''running''. 4. Select the Description tab. 5. Check the Launch time. 6. Determine the instance active age. 7. If the selected EC2 instance active age is greater than 180 days, refer to the remediation below. 8. Repeat steps no. 3 – 7 to verify the launch date for all instances. 9. Go through the other AWS regions and repeat the audit process. From the CLI 1. Run the describe-instances command aws ec2 describe-instances --region us-east-1 --output json --filters "Name=instance-state-code,Values=16" --query "Reservations[*].Instances[*].{Instance:InstanceId}" 2 The output should look like this: [ [ { "Instance": "i-1234567abcdefghi0" } ], [ { "Instance": "i-1234567abcdefghi0" } ], [ { "Instance": "i-1234567abcdefghi0" } ], [ { "Instance": "i-1234567abcdefghi0" } ] ] 3 Run the describe-instances command
    for each instance ID listed: aws ec2 describe-instances --region us-east-1 --instance-ids i- 1234567abcdefghi0 --query "Reservations[*].Instances[*].LaunchTime" 4. The command output should return the insta...'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click INSTANCES, click Instances. 3. Select the EC2 instance identified above in the audit. The Instance State must be ''running''. 4. Click Actions, click Instance State, click Stop. 5. Wait for the Instance State to read ''stopped''. 6. Click ''Actions'' click ''Instance State'', click ''Start'' 7. Select the Description tab. 8. Check the Launch time. Confirm that the instance active age is now set to today''s date and time.'
