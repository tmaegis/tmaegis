id: TMA-AWS-COMPUTE-3.14
title: Ensure 'assignPublicIp' is set to 'DISABLED' for Amazon ECS task sets
description: Ensure that assignPublicIp is set to DISABLED for Amazon ECS task sets, to prevent task sets from being publicly accessible. Enabling public IP assignment could expose task sets to unintended or unauthorized access.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.14 Ensure 'assignPublicIp' is set to 'DISABLED' for Amazon ECS task sets
audit:
  type: manual
  command: 'From Command Line: Run the following command to list clusters: aws ecs list-clusters Run the following command to list services in a cluster: aws ecs list-services --cluster <cluster-arn> Run the following command to view the task sets for a service: aws ecs describe-task-sets --cluster <cluster-arn> --service <service-arn> For each task set, under networkConfiguration > awsvpcConfiguration, ensure assignPublicIp is set to DISABLED. Repeat for each cluster and service.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Compute Services Benchmark v2.0.0 section 3.14 to configure: Ensure ''assignPublicIp'' is set to ''DISABLED'' for Amazon ECS task sets.'
