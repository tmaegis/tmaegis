id: TMA-AWS-COMPUTE-2.10
title: Ensure unused ENIs are removed
description: Identify and delete any unused Amazon AWS Elastic Network Interfaces in order to adhere to best practices and to avoid reaching the service limit. An AWS Elastic Network Interface (ENI) is pronounced unused when is not attached anymore to an EC2 instance.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.10 Ensure unused ENIs are removed
audit:
  type: manual
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click NETWORK & SECURITY, click Network Interfaces. 3. Select the ENI that you want to review 4. Go to the Details tab 5. Check the value set for the Status attribute 6. If it says available, refer to the remediation below. 7. Repeat steps 3 - 6 to determine the current status for any other ENIs within the current region. NOTE Repeat the audit process for all other regions used. From the CLI 1. Run describe-network-interfaces command aws ec2 describe-network-interfaces --region us-east-1 --output json -- filters Name=status,Values=available --query "NetworkInterfaces[*].{ENI:NetworkInterfaceId}" 2. The command output should return an empty list if the default security group is not being used. 3. If there is a list of ENI IDs then refer to the remediation below. 4. Repeat steps 1 - 3 to determine the current status for any other ENIs within the current region. NOTE Repeat the audit process
    for all other regions used.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click NETWORK & SECURITY, click Network Interfaces. 3. Select the ENI that you want to remove 4. Click ''Actions'', then ''delete'' 5. Click Delete 6. Repeat steps 3 - 5 any other ENIs listed in the audit within the current region. NOTE Repeat the audit process for all other regions used. From the CLI 1. Run the delete-network-interface command with the ENI names collected above in the audit. aws ec2 delete-network-interface --region us-east-1 --network-interface-id eni-1234abcd 2. This will remove the ENI that is not being used. 3. Repeat steps 1 - 2 for any ENIs within the current region. NOTE Repeat the audit process for all other regions used.'
