id: TMA-AWS-COMPUTE-2.11
title: Ensure instances stopped for over 90 days are removed
description: Enable this rule to help with the baseline configuration of Amazon Elastic Compute Cloud (Amazon EC2) instances by checking whether Amazon EC2 instances have been stopped for more than the allowed number of days, according to your organization’s standards.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.11 Ensure instances stopped for over 90 days are removed
audit:
  type: manual
  command: From the Console 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/. 2. In the left pane, click Instances, click Instances. 3. Select the Instance for review. 4. Under the Details tab 5. Review the Launch time. If the Launch time of the selected Instance is greater than 90 days, the Instance has been offline and is considered outdated. 6. Repeat steps no. 3 – 5 to verify the Launch date for the other instances. Repeat all steps for the other regions. Refer to the remediation procedure below if any of the Launch times are over 90 days.
remediation:
  type: iac_patch
  command: From the Console 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/. 2. In the left pane, click Instances, click Instances. 3. Select the Instance for that hasn't been used for over 90 days. 4. Under the Details tab 5. Click Instance state, click Terminate instance. 6. Click Terminate. 7.Repeat steps no. 3 – 6 the other instances with a launch date equal to or over 90 days. Repeat all steps for the other regions.
