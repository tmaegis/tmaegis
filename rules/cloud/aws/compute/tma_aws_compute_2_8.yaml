id: TMA-AWS-COMPUTE-2.8
title: Ensure the Use of IMDSv2 is Enforced on All Existing Instances
description: Ensure the Instance Metadata Service Version 2 (IMDSv2) method is enabled on all running instances. The IMDSv2 method uses session-based controls to help protect access and control of Amazon Elastic Compute Cloud (Amazon EC2) instance metadata. With IMDSv2, controls can be implemented to restrict changes to instance metadata.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.8 Ensure the Use of IMDSv2 is Enforced on All Existing Instances
audit:
  type: manual
  command: 'From the Console: 1. At this time the instance metadata setting for existing instances can only be reviewed and confirmed using AWS CLI. From the CLI 1. Run the describe-instances command aws ec2 describe-instances --region us-east-1 --output text --filter "Name=metadata-options.http-tokens,Values=optional" --query "Reservations[*].Instances[*].{Instance:InstanceId}" 2 The output should look like this: i-1234567abcdefghi0 i-1234567abcdefghi0 i-1234567abcdefghi0 The list above contains all the instances that have the metadata version set to optional which means either IMDSv1 or INDSv2 an be used. Refer to the remediation below. Repeat steps 1 – 2 for the other AWS regions.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. At this time the instance metadata setting for existing instances can only be changed using AWS CLI. From the CLI 1. Run the modify-instance-metadata-options command using the list of Instances collect in the audit aws ec2 modify-instance-metadata-options --instance-id i-1234567abcdefghi0 -- http-tokens required --http-endpoint enabled 2. The output should show the information for the instance and the metadata changes: { "InstanceId": "i-1234567abcdefghi0", "InstanceMetadataOptions": { "State": "pending", "HttpTokens": "required", "HttpPutResponseHopLimit": 1, "HttpEndpoint": "enabled" } } 3. Repeat for the other instances and regions collected during the audit.'
