id: TMA-AWS-COMPUTE-2.1.1
title: Ensure Consistent Naming Convention is used for Organizational AMI
description: The naming convention for AMIs (Amazon Machine Images) should be documented and followed for any AMIs created. The majority of AWS resources can be named and tagged. Most organizations have already created standardized naming conventions and have existing rules in effect. These should be extended to include all AWS cloud resources, including Amazon Machine Images (AMIs).
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.1.1 Ensure Consistent Naming Convention is used for Organizational AMI
audit:
  type: manual
  command: 'Perform the following to determine what AMIs are created: From the Console: 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/ 2. In the left pane, under Images, click AMIs 3. Review the list of AMIs 4. Confirm that the AMI name matches the organizational image naming policy From the Command Line: 1. Run: aws ec2 describe-images --owner self --region us-west-2 2. Review the list of AMIs 3. Confirm that the AMI Name matches the organizational image naming policy If any of the AMI names do not match the organization policy, refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'If the AMI name for an AMI does not follow organization policy: Perform the following to copy and rename the AMI: From the Console: 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/ 2. In the left pane click Images, click AMIs 3. Select the AMI that does not comply to the naming policy 4. Click on Actions 5. Click on Copy AMI - Destination region - Select the region the AMI is in. - Name - Enter the new Name - Description - Enter the new description - Encryption - Select if it matches your image policy 6. Click on Copy AMI 7. Once the AMI has finished copying, select the AMI that does not comply to the naming policy 8. Click on Actions 9. Click on Deregister'
