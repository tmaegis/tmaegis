id: TMA-AWS-COMPUTE-12.3
title: Ensure AWS Secrets manager is configured and being used by Lambda for databases
description: Lambda functions often have to access a database or other services within your environment. Credentials used to access databases and other AWS Services need to be managed and regularly rotated to keep access into critical systems secure. Keeping any credentials and manually updating the passwords would be cumbersome, but AWS Secrets Manager allows you to manage and rotate passwords.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 12.3 Ensure AWS Secrets manager is configured and being used by Lambda for databases
audit:
  type: manual
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services, click Secrets Manager under Security, Identity and Compliance. 3. Click on Secrets. 4. Review the secrets listed 5. Confirm that the secret required for Lambda functions is included in the list. 6. If it is, review your code and confirm that you are calling the credentials during runtime. 7. If the credentials are not listed refer to the remediation below. 8. Repeat steps 2-7 for all regions used.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services, click Secrets Manager under Security, Identity and Compliance. 3. Click on Secrets. 4. Click on Store a new secret 5. Select the Secret type 6. Enter the information For the `3 db types` listed enter the credentials and select the database. For `other database` enter the credentials, select the db type and enter the connection parameters. For Other type of secret (Lambda) create the keys and values used. - example Username yepyep Password yepyep choose an encryption key or create a new one if you add a new key it will take you to the KMS console. Once you create the new key you can then select it here. 7. Click Next 8. Give the secret a name associated with your organization style and lambda 9. Click Next 10. Configure the auto rotation Rotation schedule leave as default Select the lambda function you use to rotate the key 11. Click Next 12. Review all the settings 13. Click
    Store'
