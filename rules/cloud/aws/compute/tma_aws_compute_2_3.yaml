id: TMA-AWS-COMPUTE-2.3
title: Ensure Tag Policies are Enabled
description: Tag policies help you standardize tags on all tagged resources across your organization. You can use tag policies to define tag keys (including how they should be capitalized) and their allowed values.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.3 Ensure Tag Policies are Enabled
audit:
  type: manual
  command: From the Console 1. Login to AWS Organizations using https://console.aws.amazon.com/organizations/ 2. In the left pane click on Policies 3. Confirm Tag policies status is enabled. If Tag policies status is disabled refer to the remediation below. From the CLI 1. Run the list-policies command aws organizations list-policies --filter TAG_POLICY 2. If information displays it means you have a tagging policy in place. 3. If empty brackets display [] refer to the remediation below.
remediation:
  type: iac_patch
  command: 'From the Console: You must sign in as an IAM user, assume an IAM role, or sign in as the root user (not recommended) in the organization’s management account. 1. Login to AWS Organizations using https://console.aws.amazon.com/organizations/ 2. In the Left pane click on Policies 3. Click on Tag policies 4. Click on Enable Tag Policies 5. The page is update with a list of the Available policies and the ability to create one. From the Command Line: You must use an IAM user, assume an IAM role, or sign in as the root user (not recommended) in the organization’s management account. 1. Run the enable-policy-type command aws organizations enable-policy-type --root-id <RootID> --policy-type TAG_POLICIES The list of PolicyTypes in the output will now include the specified policy type with the Status of ENABLED.'
