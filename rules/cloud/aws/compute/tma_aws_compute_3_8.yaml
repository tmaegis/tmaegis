id: TMA-AWS-COMPUTE-3.8
title: Ensure Amazon ECS Fargate services are using the latest Fargate platform version
description: Ensure that Amazon ECS Fargate services use the latest Fargate platform version to benefit from the latest security enhancements, performance improvements, and feature updates. Using the latest Fargate platform version ensures services benefit from up-to-date security patches and features.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.8 Ensure Amazon ECS Fargate services are using the latest Fargate platform version
audit:
  type: manual
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Under Services, from the Filter launch type drop-down menu, select FARGATE. 5. Click the name of a service. 6. Click Configuration and networking. 7. Under Service configuration, ensure Platform version is set to 1.4.0 or LATEST for Linux, or 1.0.0 or LATEST for Windows. 8. Repeat steps 1-7 for each ECS cluster and Fargate service. From Command Line: Run the following command to list clusters: aws ecs list-clusters Run the following command to list services in a cluster: aws ecs list-services --cluster <cluster-arn> Run the following command to view the details of a service: aws ecs describe-services --cluster <cluster-arn> --services <service-arn> -- query ''services[*].[platformFamily,platformVersion]'' --output table Where platformFamily is Linux, ensure platformVersion is 1.4.0 or LATEST. Where platformFamily is Windows,
    ensure platformVersion is 1.0.0 or LATEST. Repeat for each cluster and service.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Under Services, from the Filter launch type drop-down menu, select FARGATE. 5. Click the name of a service. 6. Click Update service. 7. Expand the Compute configuration (advanced) section. 8. Under Platform version, select LATEST from the drop-down menu. 9. Click Update. 10. Repeat steps 1-9 for each ECS cluster and Fargate service requiring remediation. From Command Line: For each service requiring remediation, run the following command to set platformVersion to LATEST: aws ecs update-service --cluster <cluster-arn> --service <service-arn> -- platform-version LATEST'
