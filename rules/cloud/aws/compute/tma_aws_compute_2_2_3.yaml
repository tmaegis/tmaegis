id: TMA-AWS-COMPUTE-2.2.3
title: Ensure EBS volume snapshots are encrypted
description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service. Encrypting data at rest reduces the likelihood that it is unintentionally exposed and can nullify the impact of disclosure if the encryption remains unbroken.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
- encryption
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.2.3 Ensure EBS volume snapshots are encrypted
audit:
  type: manual
  command: 'From Console: 1. Login to the EC2 console using https://console.aws.amazon.com/ec2/ 2. Under Elastic Block Store, click Snapshots. 3. Click the snapshot you want to review. 4. Select the Description tab. 5. Review the Encryption setting. 6. If it reads encrypted you are all set. If it is set to Not Encrypted refer to the remediation below. Note: EBS snapshot volume encryption is configured per snapshot. From Command Line: 1. Run describe-snapshots aws ec2 describe-snapshots --owner-ids <account number> --filter Name=status,Values=completed --query "Snapshots[*].{ID:SnapshotId}" 2. This will provide a list of all the snapshots associated with that account in the region. 3. For every snapshot listed - Run - describe-snapshots aws ec2 describe-snapshots --snapshot-id <snap-name> --query "Snapshots[*].{Encrypt:Encrypted}" 4. If the output reads "Encrypt": true, Encryption is set on the snapshot. If the output reads "Encrypt": false refer to the remediation below. Note: EBS snapshot
    volume encryption is configured per snapshot.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the EC2 console using https://console.aws.amazon.com/ec2/ 2. Under Elastic Block Store, click Snapshots`. 3. Select the snapshot you want to encrypt. 4. Click on Actions select Copy. Confirm `Snapshot ID` Set the `Destination Region` Update the `Description` Select the check box for `Encryption` 5. Check the box for Encrypt this snapshot 6. Set the Master Key 7. Click on Copy 8. Repeat steps 3-7 for the snapshots that need to be encrypted. 9. Delete any of the unencrypted snapshots that are not longer needed. Note: EBS snapshot volume encryption is configured per snapshot. From Command Line: Using the snapshot ids gathered from the Audit section 1. Run - copy-snapshot aws ec2 copy-snapshot --source-region <region> --source-snapshot-id <snap- id> --description "Name of the new snapshot" --encrypted 2. This will copy the existing unencrypted snapshot and set it to encrypted The output will show the new SnapshotId 3. Run - describe-snapshots aws ec2 describe-snapshots
    --owner-ids <account id> --filter Name=status,Values=completed --query "Snapshots[*].{ID:SnapshotId}" Once the new Snapshot shows in the list confirm encryption is set 4. Run - describe-snaps...'
