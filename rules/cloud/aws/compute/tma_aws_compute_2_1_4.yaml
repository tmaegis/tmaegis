id: TMA-AWS-COMPUTE-2.1.4
title: Ensure Images (AMI) are not older than 90 days
description: Ensure that your AMIs are not older than 90 days. Using up-to-date AMIs will provide many benefits from OS updates and security patches helping to ensure reliability, security and compliance.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.1.4 Ensure Images (AMI) are not older than 90 days
audit:
  type: manual
  command: 'Perform the following to determine the age of an AMI. From the Console 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/. 2. In the left pane, under Images, click AMIs. 3. Select the AMI for review. 4. Under the Details tab 5. Review the Creation date. If the age of the selected AMI is greater than 90 days, the AMI is considered outdated and it should be updated. 6. Repeat steps no. 3 – 5 to verify the date of the other approved AMIs available. Repeat all steps for the other regions. Refer to the remediation procedure below to update the AMI. From the Command Line: Run the aws ec2 describe-images command aws ec2 describe-images \ --region <region> \ --image-ids <image-ID> Look for CreationDate in response. If the age of the selected AMI is greater than 90 days, the AMI is considered outdated and it should be updated.'
remediation:
  type: iac_patch
  command: Perform these steps if the Creation date is older than 90 days. From the Console 1. Login to the EC2 console at https://console.aws.amazon.com/ec2/. 2. In the left pane, under Images, click AMIs. 3. Select the AMI to be updated. 4. Click on Launch 5. Go through the EC2 Instance creation process. 6. Apply all system, security and application updates that are applicable to the EC2 instance. 7. Once completed click on Instance state, `Stop instance1. 8. Click on Actions, Image and templates, Create image 9. Once the image process has complete return to the AMI list but clicking on Images, AMIs 10. Select the AMI that is older than 90 days. 11. Click on Actions, Deregister Repeat these steps for any other AMIs older than 90 days.
