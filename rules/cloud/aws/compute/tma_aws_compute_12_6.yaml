id: TMA-AWS-COMPUTE-12.6
title: Ensure Lambda functions are not exposed to everyone.
description: A publicly accessible Amazon Lambda function is open to the public and can be reviewed by anyone. To protect against unauthorized users that are sending requests to invoke these functions they need to be changed so they are not exposed to the public. Allowing anyone to invoke and run your Amazon Lambda functions can lead to data exposure, data loss, and unexpected charges on your AWS bill.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 12.6 Ensure Lambda functions are not exposed to everyone.
audit:
  type: manual
  command: 'From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/lambda/. 2. In the left column, under AWS Lambda, click Functions. 3. Under Function name click on the name of the function that you want to review 4. Click the Configuration tab 5. In the left column, click Permissions. 6. In the Resource-based policy section, click View policy document 7. Review the Resource-based policy document box. Find the "Principal" element defined for each policy statement and check the element value. If the element has one of the following values: "" or { "AWS": "" }, it means it is set to "Allow", and if it does not contain a "Condition" clause to filter the access, the selected Amazon Lambda function is set to anonymous access. 8. If any of the Lambda functions have anonymous access set refer to the remediation below. 9. Repeat steps 2 – 7 for each Lambda function available within the current AWS region. 10. Repeat this Audit for all the other AWS regions. From the Command
    line 1. Run ''aws lambda list-functions'' aws lambda list-functions --output table --query "Functions[*].FunctionName" This command will provide a table titles ListFunctions 2. Run aws lambda get-policy...'
remediation:
  type: iac_patch
  command: 'From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/lambda/. 2. In the left column, under AWS Lambda, click Functions. 3. Under Function name click on the name of the function that you want to review 4. Click the Configuration tab 5. In the left column, click Permissions. 6. In the Resource-based policy section, perform the following actions: - Under Policy statements - Select the policy statement that allows anonymous access - Click Delete to remove the non-compliant statement from the resource-based policy attached - Within the Delete statement confirmation box, click Remove - Click Add permissions to add a new policy statement that grants permissions to a trusted entity only. - On the Add permissions page configure the new policy statement to grant access to another AWS account, IAM user, IAM role, or to another AWS service. - Click Save 7. Repeat steps no. 2 – 6 for each Lambda function that fails the Audit above, within the current region. 8.
    Repeat this Audit for all the other AWS regions. From the Command line 1. Run ''aws lambda remove-permission'' aws lambda remove-permission --function-name "name_of_function" --statement- id "SID_of_Statemen...'
