id: TMA-AWS-COMPUTE-8.1
title: Ensure AWS Batch is configured with AWS Cloudwatch Logs.
description: You can configure Batch jobs to send log information to CloudWatch Logs. This enables you to view different logs from all your jobs in one convenient location.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
- logging
reference: CIS AWS Compute Services Benchmark v2.0.0 - 8.1 Ensure AWS Batch is configured with AWS Cloudwatch Logs.
audit:
  type: manual
  command: From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/batch/ 2. On the left hand side under Console settings, Click on Permissions 3. Under Job logs section 4. Confirm that Authorize Batch to use Cloudwatch is set with a green check. 5. If is is showing a red X refer to the remediation below.
remediation:
  type: iac_patch
  command: From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/batch/. 2. In the left column under Console settings, Click on Permissions 3. In the Job logs section click on Edit 4. Click the Authorize Batch to use CloudWatch 5. Click Save
