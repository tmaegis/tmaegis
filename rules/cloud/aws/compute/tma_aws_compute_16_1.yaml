id: TMA-AWS-COMPUTE-16.1
title: Ensure communications between your applications and clients is encrypted.
description: SimSpace Weaver doesn't manage communications between your apps and the clients. Be sure to implement some form of authentication and encryption for all client sessions while using SimSpace Weaver.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
- encryption
reference: CIS AWS Compute Services Benchmark v2.0.0 - 16.1 Ensure communications between your applications and clients is encrypted.
audit:
  type: manual
  command: There is no setting for encryption setup for your clients and applications within SimSpace Weaver service. For this audit you have to confirm that the communication is configured in the app and the client with encryption to protect that traffic.
remediation:
  type: iac_patch
  command: Confirm that the communication you have configured between you application and clients that run inside of SimSpace Weaver are encrypted.
