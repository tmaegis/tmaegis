id: TMA-AWS-COMPUTE-5.8
title: Ensure Lightsail instances are attached to the buckets
description: Attaching an Amazon Lightsail instance to a Lightsail storage bucket gives it full programmatic access to the bucket and its objects. When you attach instances to buckets, you don't have to manage credentials like access keys. Resource access is ideal if you're configuring software or a plugin on your instance to upload files directly to your bucket. For example, if you want to configure a WordPress instance to store media files on a bucket configuration with bucket storage resource access allows for that securely.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 5.8 Ensure Lightsail instances are attached to the buckets
audit:
  type: manual
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services, click Lightsail under Compute. 3. This will open up the Lightsail console. 4. Select Storage. 5. All Lightsail buckets are listed here. 6. Click on a bucket name 7. Click Permissions. 8. Scroll down to Resource access and confirm that your instance is attached. 9. If the instance using this Storage bucket is not attached refer to the remediation below. From the Command Line: 1. Run aws lightsail get-buckets aws lightsail get-buckets This command will provide a list of Buckets tied to Lightsail. 2. If there are no buckets listed then refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com 2. Click All services, click Lightsail under Compute. 3. This will open up the Lightsail console. 4. Confirm that the instance you want to connect to the Storage bucket is in a running state 5. If it is move on to Step 6. If it is not click on the instance name, then click on Start. Wait for the status to read Running 6. Select Storage. 7. All Lightsail buckets are listed here. 8. Click on the bucket you want to associate with the instances. 9. Click Permissions. 10. Scroll down to Resource access. 11. Click on Attach instance 12. Click on Choose an instance 13. Select the instance 14. Click Attach 15. Repeat this for any other instances and buckets that need to be attached. From the Command Line: 1. Run aws lightsail create-bucket aws lightsail create-bucket --bucket-name test-cli-bucket2 --bundle-id small_1_0 This command will create a bucket. If you want to review the bundle size ids run this command.
    aws lightsail get-bucket-bundles "bundles": [ { "bundleId": "small_1_0", "name": "Object Storage 5GB", "price": 1.0, "storagePerMonthInGb": 5, "transferPerMonthInGb": 25, "isActive": true }, { "bundle...'
