reference: CIS AWS Compute Services Benchmark v2.0.0 - 12.4 Ensure least privilege is used with Lambda function access
audit:
  type: manual
  command: Determining the exact permissions required is a manual process and can be challenging, since IAM permissions are very granular and they control access to both the data plane and control plane. Please refer to the references section below for useful documentation on developing the correct IAM policies for Lambda.
remediation:
  type: iac_patch
  command: As building out the IAM permissions for Lambda here are some things to consider. - Set granular IAM permissions for Lambda functions. - Limit user access via IAM permissions to only necessary resources and operations. - Remove unused or outdated IAM Users, Roles and Permissions. - Periodically review and adjust IAM permissions. - Do not allow all-access permissions for Lambda functions as a short cut."
