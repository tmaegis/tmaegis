id: TMA-AWS-COMPUTE-3.12
title: Ensure Amazon ECS task definitions are tagged
description: 'Ensure all Amazon ECS task definitions have resource tags to facilitate asset management, tracking, and compliance. Note: This recommendation assumes that only the latest active revision of a task definition is in use. If older revisions are in use, apply the audit and remediation procedures to those revisions as needed. Consistent tagging supports compliance and helps identify unauthorized or misconfigured resources.'
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.12 Ensure Amazon ECS task definitions are tagged
audit:
  type: manual
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Task definitions. 3. Click the name of a task definition. 4. Click on the latest active revision of the task definition. 5. Click Tags. 6. Ensure at least one tag is listed that does not begin with aws:. Tags prefixed with aws: are AWS-managed. 7. Repeat steps 1-6 for each ECS task definition. From Command Line: Run the following command to list task definitions: aws ecs list-task-definitions For the latest revision of a task definition, run the following command to view the tags: aws ecs list-tags-for-resource --resource-arn <task-definition-arn> Ensure that tags are returned that do not begin with aws:. Tags prefixed with aws: are AWS-managed. Repeat for each task definition.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Task definitions. 3. Click the name of a task definition. 4. Click on the latest active revision of the task definition. 5. Click Create new revision. 6. Click Create new revision again. 7. Expand the Tags section. 8. Click Add tag. 9. Provide a Key and optional Value for the tag. 10. Click Create. 11. Repeat steps 1-10 for each task definition requiring remediation. Note: When a task definition is updated, running tasks launched from the previous task definition remain unchanged. Updating a running task requires redeploying it with the new task definition.'
