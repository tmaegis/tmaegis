id: TMA-AWS-COMPUTE-8.2
title: Ensure Batch roles are configured for cross-service confused deputy prevention
description: The Cross-service confused deputy problem is a security issue where an entity that doesn't have permission to perform an action can coerce a more-privileged entity to perform the action. Cross-service impersonation can result in the confused deputy problem. Cross-service impersonation can occur when one service (the calling service) calls another service (the called service). The calling service can be manipulated to use its permissions to act on another customer's resources in a way it should not otherwise have permission to access.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
- iam
reference: CIS AWS Compute Services Benchmark v2.0.0 - 8.2 Ensure Batch roles are configured for cross-service confused deputy prevention
audit:
  type: manual
  command: 'From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/iam/ 2. On the left hand side under Access management, Click on Roles 3. Search for any roles related to Batch 4. Click on the role and the Assume Role Policy Document and confirm that the AssumeRole Action has a aws:SourceArn key that contains the full ARN of the Batch resource { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Principal": { "Service": "batch.amazonaws.com" }, "Action": "sts:AssumeRole", "Condition": { "ArnLike": { "aws:SourceArn": [ "arn:aws:batch:us-east-1:123456789012:compute- environment/testCE", ] } } } ] } 5. If it is showing an * within the ARN or does not have this condition key specified, then the Batch process has access to all of the resources defined in that environment. "arn:aws:batch:us-east-1:123456789012:compute-environment/*", { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Principal": { "Service": "batch.amazonaws.com" }, "Action":
    "sts:AssumeRole" } ] } 6. Repeat for any roles assigned to Batch that have AssumeRole 7. Refer to the remediation below'
remediation:
  type: iac_patch
  command: 'From the Console 1. Login to the AWS Console using https://console.aws.amazon.com/iam/ 2. On the left hand side under Access management, Click on Roles 3. Search for any roles identified above in the audit. 4. Click on the role and update the Action AssumeRole, aws:SourceArn to contain the full ARN of the resource "aws:SourceArn": [ "arn:aws:batch:us-east-1:123456789012:compute- environment/testCE", 5. Repeat for any roles defined in the Audit.'
