id: TMA-AWS-COMPUTE-3.11
title: Ensure Amazon ECS clusters are tagged
description: Ensure all Amazon ECS clusters have resource tags to facilitate asset management, tracking, and compliance. Consistent tagging supports compliance and helps identify unauthorized or misconfigured resources.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.11 Ensure Amazon ECS clusters are tagged
audit:
  type: manual
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Click Tags. 5. Ensure at least one tag is listed that does not begin with aws:. Tags prefixed with aws: are AWS-managed. 6. Repeat steps 1-5 for each ECS cluster. From Command Line: Run the following command to list clusters: aws ecs list-clusters Run the following command to view the tags for a cluster: aws ecs list-tags-for-resource --resource-arn <service-arn> Ensure that tags are returned that do not begin with aws:. Tags prefixed with aws: are AWS-managed. Repeat for each cluster.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Click Tags. 5. Click Manage tags. 6. Click Add tag. 7. Provide a Key and optional Value for the tag. 8. Click Save. 9. Repeat steps 1-8 for each ECS cluster requiring remediation.'
