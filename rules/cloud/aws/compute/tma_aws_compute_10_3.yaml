id: TMA-AWS-COMPUTE-10.3
title: Ensure access logs are enabled.
description: When you enable load balancing, your AWS Elastic Beanstalk environment is equipped with an Elastic Load Balancing load balancer to distribute traffic among the instances in your environment For security reasons it is important to have a record of all the access logs and this is enabled within the Load Balancer assigned to the Elastic Beanstalk environments.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- compute
- logging
reference: CIS AWS Compute Services Benchmark v2.0.0 - 10.3 Ensure access logs are enabled.
audit:
  type: manual
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com/ec2 2. On the left hand scroll down to Load Balancing and click on Load Balancers 3. Click on the Load balancer associated with the Elastic Beanstalk Environment Typically they have AWSEB in the name. If you utilized Elastic Beanstalk to create the Load balancer the Source Security Group listed in the Description will reference `Elastic Beanstalk` 4. Under the Description tab scroll down to the Attributes section 5. Confirm Access logs is set to Enabled. 6. If status options reads Disabled refer to the remediation below. 7. Repeat steps 3-8 for each environment within the current region. 8. Then repeat the Audit process for all other regions.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to AWS Console using https://console.aws.amazon.com/ec2 2. On the left hand scroll down to Load Balancing and click on Load Balancers 3. Click on the Load balancer associated with the Elastic Beanstalk Environment Typically they have AWSEB in the name. If you utilized Elastic Beanstalk to create the Load balancer the Source Security Group listed in the Description will reference `Elastic Beanstalk~ 4. Under the Description tab scroll down to the Attributes section 5. Under Access logs - Disabled click on Configure access logs. 6. Click the check box next to Enable access logs. 7. enter the se bucket name you have setup for the Elastic Beanstalk access logs. **Note - if you don''t have a s3 bucket already created enter an organization name in accordance with policy and have it identify with Elastic Beanstalk. Then click the check box next to Create this location for me 8. Click Save 9. Scroll down under the description tab and confirm that the Access
    logs are set as described above. 10. Repeat steps 3-11 for each Load balancer created and used with Elastic Beanstalk environment within the current region. 11. Then repeat the remediation process for all ot...'
