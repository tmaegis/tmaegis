id: TMA-AWS-COMPUTE-2.9
title: Ensure use of AWS Systems Manager to manage EC2 instances
description: An inventory and management of Amazon Elastic Compute Cloud (Amazon EC2) instances is made possible with AWS Systems Manager. Use AWS Systems Manager to provide detailed system configurations, operating system patch levels, services name and type, software installations, application name, publisher and version, and other details about your environment.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.9 Ensure use of AWS Systems Manager to manage EC2 instances
audit:
  type: manual
  command: From the Console 1. Login to EC2 using https://console.aws.amazon.com/systems-manager/ 2. On the left Click Node Management, click Inventory. 3. On the Dashboard confirm that all of your Instances are listed as part of your inventory. If any instances are missing or AWS Systems Manager is not configured, refer to the remediation below.
remediation:
  type: iac_patch
  command: 'From the Console These directions already assume your AWS account is setup. They will walk you through how to create non-Admin IAM users and groups for System Manager. **Note - There is additional guidance provided by AWS on the process. 1. Create a user group a. Login to IAM using https://console.aws.amazon.com/iam/ b. On the left Click Access management, click User groups, and then click Create Group. c. On the Create user group page, enter a name for the group d. Select and add the users required to the Group e. Attach permissions policies by selecting ResourceGroupsandTagEditorFullAccess policy. f. Then for Full access to Systems Manager console, click the AmazonSSMFullAccess policy. - OR g. For access to view Systems Manager data, and not create or update resources, click the AmazonSSMReadOnlyAccess policy. h. For access to the Built-In Insights and Dashboard by CloudWatch pages in the Systems Manager console, add these policies: - AWSHealthFullAccess - AWSConfigUserAccess
    - CloudWatchReadOnlyAccess i. Click Create group. If you need additional users follow the next step. If not skip to Step 3. 2. Create users and assign permissions. a. Login to IAM using https://console.aw...'
