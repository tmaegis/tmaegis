id: TMA-AWS-COMPUTE-12.9
title: Ensure there are no Lambda functions with admin privileges within your AWS account
description: Ensure that your Amazon Lambda functions don't have administrative permissions potentially giving the function access to all AWS cloud services and resources. In order to promote the Principle of Least Privilege (POLP) and provide your functions the minimal amount of access required to perform their tasks the right IAM execution role associated with the function should be used. Instead of providing administrative permissions you should grant the role the necessary permissions that the function really needs.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 12.9 Ensure there are no Lambda functions with admin privileges within your AWS account
audit:
  type: manual
  command: From the Console 1. Login in to the AWS Console using https://console.aws.amazon.com/lambda/ 2. In the left column, under AWS Lambda, click Functions. 3. Under Function name click on the name of the function that you want to review 4. Click the Configuration tab 5. Click on Permissions in the left column. 6. In the Execution role section, click the Role name to access the IAM role details. **Note this will bring you to the IAM Console. 7. Select the Permissions tab to view the identity–based policies attached 8. In the Permissions policies section click on the Policy name. 9. Select the Permissions tab. **Note The policy summary should show below in JSON format. 10. Within the {} JSON policy, identify the "Action" element defined for each statement and check the value. 11. If any of the "Action" element values are set to "*" and the "Effect" element is set to "Allow", the role policy provides access to all the supported AWS cloud services and resources. 12. Repeat this step for
    each IAM policy attached to the selected execution role. If one or more policies allow access to all AWS services and resources, the execution role provides administrative permissions. Refer to the remedi...
remediation:
  type: iac_patch
  command: 'From the Console 1. Login in to the AWS Console using https://console.aws.amazon.com/lambda/ 2. In the left column, under AWS Lambda, click Functions. 3. Under Function name click on the name of the function that you want to remediate 4. Click the Configuration tab 5. Click on Permissions in the left column. 6. In the Execution role section, click the Edit 7. Edit basic settings configuration page: - associate the function with an existing, compliant IAM role - click Use an existing role from the Execution role - select the required role from the Existing role dropdown - click Save OR - apply a new execution role to your Lambda function - click Create a new role from AWS policy templates - Provide a name for the new role based on org policy - select only the necessary permission set(s) from the Policy templates - optional dropdown list. - click Save 8. Repeat steps for each Lambda function within the current region that failed the Audit.'
