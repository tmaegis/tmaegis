id: TMA-AWS-COMPUTE-3.10
title: Ensure Amazon ECS services are tagged
description: Ensure all Amazon ECS services have resource tags to facilitate asset management, tracking, and compliance. Consistent tagging supports compliance and helps identify unauthorized or misconfigured resources.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 3.10 Ensure Amazon ECS services are tagged
audit:
  type: manual
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Under Services, click the name of a service. 5. Click Tags. 6. Ensure at least one tag is listed that does not begin with aws:. Tags prefixed with aws: are AWS-managed. 7. Repeat steps 1-6 for each ECS cluster and service. From Command Line: Run the following command to list clusters: aws ecs list-clusters Run the following command to list services in a cluster: aws ecs list-services --cluster <cluster-arn> Run the following command to view the tags for a service: aws ecs list-tags-for-resource --resource-arn <service-arn> Ensure that tags are returned that do not begin with aws:. Tags prefixed with aws: are AWS-managed. Repeat for each cluster and service.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the ECS console using https://console.aws.amazon.com/ecs/. 2. In the left panel, click Clusters. 3. Click the name of a cluster. 4. Under Services, click the name of a service. 5. Click Tags. 6. Click Manage tags. 7. Click Add tag. 8. Provide a Key and optional Value for the tag. 9. Click Save. 10. Repeat steps 1-9 for each ECS cluster and service requiring remediation.'
