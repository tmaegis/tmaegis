id: TMA-AWS-COMPUTE-2.7
title: Ensure Default EC2 Security groups are not being used.
description: When an EC2 instance is launched a specified custom security group should be assigned to the instance. When an EC2 Instance is launched the default security group is automatically assigned. In error a lot of instances are launched in this way, and if the default security group is configured to allow unrestricted access, it will increase the attack footprint allowing the opportunity for malicious activity.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- compute
reference: CIS AWS Compute Services Benchmark v2.0.0 - 2.7 Ensure Default EC2 Security groups are not being used.
audit:
  type: manual
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click INSTANCES, click Instances. 3. On the EC2 Instances page, click inside the attributes filter box 4. Click the Security Group Name from the dropdown list 5. Type default for the attribute value. (This filter will detect the EC2 instances currently associated with the default security group) 6. Refer to the remediation below using list of Ec2 Instance ids captured. NOTE Repeat the audit process for all other regions used. From the CLI 1. Run the describe-instances command aws ec2 describe-instances --region us-east-1 --output json --filters "Name=instance.group-name,Values=default" --query "Reservations[*].Instances[*].{Instance:InstanceId}" 2. The command output should return an empty list if the default security group is not being used. 3. If there is a list of instance IDs then the default security group is currently attached to those EC2 instances. 4. Refer to the remediation below
    using list of EC2 Instance ids captured. NOTE Repeat the audit process for all other regions used.'
remediation:
  type: iac_patch
  command: 'From the Console: 1. Login to EC2 using https://console.aws.amazon.com/ec2/ 2. On the left Click Network & Security, click Security Groups. 3. Select Security Groups 4. Click on the default Security Group you want to review. 5. Click Actions, View details. 6. Select the Inbound rules tab 7. Click on Edit inbound rules 8. Click on Delete for all the rules listed 9. Once there are no rules listed click on ''Save rules` 10. Repeat steps no. 3 – 8 for any other default security groups listed.'
