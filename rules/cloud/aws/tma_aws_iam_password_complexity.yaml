id: TMA-AWS-IAM-PASSWORD-COMPLEXITY
title: Ensure IAM password policy requires upper case, lower case, numbers and symbols
description: Character-class requirements from earlier CIS AWS releases; all four RequireUppercaseCharacters, RequireLowercaseCharacters, RequireNumbers and RequireSymbols must be true. Read-only AWS CLI calls; credentials come from the CLI's normal configuration (AWS_PROFILE, ~/.aws/config and credentials, SSO, or an instance/task role). A missing CLI or credential fails the check.
target: aws
level: 2
severity: medium
tags:
- aws
- iam
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - Identity and Access Management - password policy complexity (verify section number for your release)
audit:
  type: command
  command: 'out=$(aws iam get-account-password-policy --query ''PasswordPolicy.[RequireUppercaseCharacters,RequireLowercaseCharacters,RequireNumbers,RequireSymbols]'' --output text 2>/dev/null) || exit 1

    n=$(printf ''%s\n'' "$out" | tr ''\t'' ''\n'' | grep -c ''^True$'' || true)

    [ "$n" -eq 4 ] && echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: aws iam update-account-password-policy --require-uppercase-characters --require-lowercase-characters --require-numbers --require-symbols (repeat the other policy settings), or the matching flags on aws_iam_account_password_policy.
