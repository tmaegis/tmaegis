id: TMA-AWS-DEFAULT-SG-RESTRICTS-ALL
title: Ensure the default security group of every VPC restricts all traffic
description: Resources launched without an explicit security group land in the default group; with no rules it denies all traffic. Default groups in every enabled region must have no inbound and no outbound rules. Read-only AWS CLI calls; credentials come from the CLI's normal configuration (AWS_PROFILE, ~/.aws/config and credentials, SSO, or an instance/task role). A missing CLI or credential fails the check.
target: aws
level: 2
severity: medium
tags:
- aws
- network
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - Networking - default security group restricts all traffic (verify section number for your release)
audit:
  type: command
  command: "regions=$(aws ec2 describe-regions --query 'Regions[].RegionName' --output text 2>/dev/null) || exit 1\n[ -n \"$regions\" ] || exit 1\nbad=0\nfor r in $regions; do\n  n=$(aws ec2 describe-security-groups --region \"$r\" --filters Name=group-name,Values=default --query 'length(SecurityGroups[?length(IpPermissions) > `0` || length(IpPermissionsEgress) > `0`])' --output text 2>/dev/null) || exit 1\n  [ \"$n\" -eq 0 ] || { echo \"default SG has rules: $r\"; bad=1; }\ndone\n[ \"$bad\" -eq 0 ] && echo compliant"
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Move workloads to purpose-built security groups, then remove all inbound and outbound rules from each default group (aws ec2 revoke-security-group-ingress / revoke-security-group-egress; Terraform: aws_default_security_group with no ingress/egress blocks).'
