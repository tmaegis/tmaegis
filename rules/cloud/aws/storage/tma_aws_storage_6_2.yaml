id: TMA-AWS-STORAGE-6.2
title: Ensure AWS Disaster Recovery Configuration
description: 'It’s important to understand how the network on EDR works. This isn’t a simple service to configure, but it works with multiple work loads over the network. You can connect your on-premises or third-party cloud service to AWS EDR over the network. Below are the descriptions of the AWS network architecture: 1. Your local network inside the data center or cloud a.Connect an AWS Replication Agent to each of your resources. 2. AWS Cloud Architecture a. Choose the AWS Region that you want to house your disaster recovery instances. b.Create AWS API Endpoints for EC2, Disaster Recovery, and S3. c.Upon creation of Disaster Recovery endpoints, two subnets will be created in your VPC i.Staging Area Subnets: Replication servers with EBS volumes attached to each disk on the replication servers. ii.Recovery Subnets: Recovery EC2 instances attached to EBS volumes/ d.Connect local network over TCP p...'
