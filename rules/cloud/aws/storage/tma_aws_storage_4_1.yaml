reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.1 FSX (AWS Elastic File Cache)
audit:
  type: manual
  command: 'Verify compliance with CIS AWS Storage Services Benchmark v1.0.0 section 4.1: FSX (AWS Elastic File Cache).'
remediation:
  type: iac_patch
  command: You can link your cache to S3 data repositories or to any file system that supports the NFSv3 protocol. The NFS data repository can either be on premises or in the cloud and you can link a maximum of eight repositories. All the linked repositories must be using the same file system; either S3 or NFS. When linked to a data repository, Amazon File Cache transparently presents S3 or NFS objects as files and directories. Amazon File Cache is compatible to be used interchangeably with Amazon Elastic Compute Service, Amazon Elastic Container Service, and Amazon Elastic Kubernetes Service.
