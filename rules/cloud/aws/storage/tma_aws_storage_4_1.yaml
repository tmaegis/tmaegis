id: TMA-AWS-STORAGE-4.1
title: FSX (AWS Elastic File Cache)
description: Amazon File Cache is a fully managed, high speed cache on AWS that is used to process file data, regardless of where the data is stored. AWS File Cache is a serverless service on AWS that spares the administrators from the burden of managing file servers and storage volumes, updating hardware, configuring software, running out of capacity, or tuning performance. AWS Elastic cache is capable of handling hundreds of GB/s of throughput and up to millions of operations per second. AWS FSx is an excellent service for cost optimization and high scalability. Amazon File Cache automatically loads data into the cache when it’s accessed for the first time and automatically releases data when it’s not used. Amazon File Cache is used as a temporary, high performance storage location for data that’s stored in on-premises file systems, AWS file systems, and Amazon S3 buckets. This service is used f...
