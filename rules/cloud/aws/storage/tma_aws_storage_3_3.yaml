id: TMA-AWS-STORAGE-3.3
title: Ensure EFS and VPC Integration
description: You can use EFS as a network file system across availability zones on a virtual private cloud. This capability allows the organization to create a highly available file sharing solution. Leveraging AWS VPC and EC2 in tandem with AWS EFS makes for a highly available and scalable cloud file storage solution. Redundancy and scalability are crucial for maintaining uninterrupted services. By integrating these AWS services, users can harness the full power of AWS, ensuring a resilient and scalable infrastructure.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- network
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.3 Ensure EFS and VPC Integration
audit:
  type: manual
  command: 'Audit Procedures for AWS Redundancy and Scalability 1. Create Mount Targets in Each Availability Zone: Ensure EFS is attached in each availability zone by creating mount targets in each subnet. Although multiple subnets can exist per availability zone, verify that EFS is configured to work with one subnet per zone to maintain redundancy. 2. Monitor EFS with CloudWatch: Use AWS CloudWatch to automatically monitor your EFS service. Check that alarms are configured and logs and events are tracked effectively, providing real-time insights into the performance and health of your file systems.'
remediation:
  type: iac_patch
  command: Create an EC2 instance in each availability zone within your VPC.
