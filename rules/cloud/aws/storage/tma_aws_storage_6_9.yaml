id: TMA-AWS-STORAGE-6.9
title: Ensure Continuous Disaster Recovery Operations
description: Maintain ongoing disaster recovery operations to ensure that systems and data can be swiftly restored in the event of a disruption. This involves regularly updating and testing recovery plans, monitoring replication processes, and verifying the integrity and accessibility of backups. Continuously evaluate and improve disaster recovery strategies to adapt to evolving threats and organizational changes, ensuring resilience and minimal downtime during incidents. Maintaining continuous disaster recovery operations is essential for ensuring that systems and data can be quickly and effectively restored following a disruption. Regular updates and tests of recovery plans, along with constant monitoring of replication processes, help verify the integrity and availability of backups. This proactive approach allows organizations to adapt to evolving threats and changes, ensuring resilience and m...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.9 Ensure Continuous Disaster Recovery Operations
audit:
  type: manual
  command: '1. Review Disaster Recovery Plan: o Verify that a comprehensive disaster recovery (DR) plan exists and is regularly updated. o Ensure the DR plan includes detailed procedures for data backup, system recovery, and failover processes. o Check for documentation of roles and responsibilities during a disaster event. 2. Check Backup and Replication Settings: o Confirm that AWS Backup is configured correctly for all critical systems and data. o Review the settings for Amazon RDS, EBS snapshots, S3 versioning, and other AWS services to ensure backups are automated and scheduled appropriately. o Ensure that replication settings are configured to replicate data across multiple AWS regions for added redundancy. 3. Test Recovery Procedures: o Verify that regular recovery drills are conducted to test the DR plan’s effectiveness. o Check the logs and reports from these drills to ensure that any issues identified are addressed promptly. o Ensure that the most recent recovery drill results
    are documented and reviewed by relevant stakeholders. 4. Monitor and Log Review: o Ensure CloudWatch logs and alarms are set up to monitor backup and replication processes. o Review CloudTrail logs to verify...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.9 to configure: Ensure Continuous Disaster Recovery Operations.'
