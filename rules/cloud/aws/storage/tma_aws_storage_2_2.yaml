id: TMA-AWS-STORAGE-2.2
title: Ensure configuring Security Groups
description: Security groups are your first line of defense for the EC2 instance. A security group is a firewall that controls inbound and outbound traffic. Security groups play a critical role in maintaining the security of your AWS resources. It is advisable to restrict traffic to only what is necessary for accessing your instance, thereby minimizing potential security risks.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.2 Ensure configuring Security Groups
audit:
  type: manual
  command: Open traffic for SSH, HTTP, and HTTPS. Make sure to allow traffic from anywhere, unless you will be accessing the instance from a secure workstation or server with a static IP address.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 2.2 to configure: Ensure configuring Security Groups.'
