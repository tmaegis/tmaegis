id: TMA-AWS-STORAGE-6.12
title: Ensure CloudWatch Metrics for AWS EDR
description: Set up and monitor AWS CloudWatch metrics for Endpoint Detection and Response (EDR) to track and analyze the performance and security of your AWS environment. This involves configuring CloudWatch to collect detailed logs and metrics on EDR activities, such as threat detections, response actions, and system health. Regularly review these metrics to identify trends, anomalies, and potential security issues, enabling proactive management and timely responses to ensure the effectiveness of your EDR solution. Implementing AWS CloudWatch metrics for Endpoint Detection and Response (EDR) is essential for maintaining a secure and efficient AWS environment. By collecting detailed logs and metrics on EDR activities, you gain valuable insights into the performance and health of your security measures. Regular review of these metrics allows for the early detection of trends, anomalies, and potent...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.12 Ensure CloudWatch Metrics for AWS EDR
audit:
  type: manual
  command: '1. Sign in to the AWS Management Console: o Open the AWS Management Console and sign in with your credentials. 2. Navigate to CloudWatch: o In the AWS Management Console, navigate to the CloudWatch service. 3. Create a CloudWatch Log Group: o Select Logs from the navigation pane. o Click on Create log group. o Enter a name for the log group and click Create. 4. Configure AWS EDR to Send Logs to CloudWatch: o Go to the AWS EDR (Elastic Disaster Recovery) console. o In the AWS EDR console, configure your settings to send logs and metrics to the CloudWatch log group you created. 5. Set Up CloudWatch Alarms: o In the CloudWatch console, select Alarms from the navigation pane. o Click on Create Alarm. o Select the metric you want to monitor from the list of AWS EDR metrics. o Configure the conditions for the alarm (e.g., threshold, period, etc.). o Set the actions to take when the alarm state is triggered (e.g., send a notification). o Review and create the alarm. 6. Create CloudWatch
