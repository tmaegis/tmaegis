id: TMA-AWS-STORAGE-2.13
title: Ensure creating an SNS subscription
description: Create an SNS notification to send to the system administrator’s email address.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.13 Ensure creating an SNS subscription
audit:
  type: manual
  command: 'Creating an SNS subscription: 1. Navigate to SNS service in the AWS console - https://us-east- 2.console.aws.amazon.com/sns/v3/home?region=us-east-2#/homepage (make sure you are in the correct region). 2. Navigate to “topics”. 3. Create a new topic. 4. Select the ARN of the topic. 5. Select the “Email” protocol if you wish to have the alarms delivered to your email. 6. Enter the correct email address of an administrator. 7. Select “Create Subscription”. To attach the SNS notification service to the alarm - select the SNS subscription that you just created and create the alarm.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 2.13 to configure: Ensure creating an SNS subscription.'
