id: TMA-AWS-STORAGE-3.5
title: Ensure using Security Groups for VPC
description: A security group controls the traffic that is allowed to reach and leave the resources that it is associated with. For example, after you associate a security group with an EC2 instance, it controls the inbound and outbound traffic for the instance.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- network
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.5 Ensure using Security Groups for VPC
audit:
  type: manual
  command: 1. Go to https://console.aws.amazon.com/vpc/ 2. Navigate to Security Groups and select on the VPC that houses your mount target. 3. Ensure that incoming traffic is restricted to SSH access on port 22 using TCP protocol and outbound traffic is accepting all traffic.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 3.5 to configure: Ensure using Security Groups for VPC.'
