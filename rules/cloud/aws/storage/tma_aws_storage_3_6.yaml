id: TMA-AWS-STORAGE-3.6
title: Ensure Secure Ports
description: Securing network ports is essential for protecting AWS storage services like Amazon S3, EFS, and EBS. By configuring security groups and network access control lists (NACLs) to allow only necessary traffic, you minimize the risk of unauthorized access. Regular audits and monitoring of port usage ensure that only approved ports and protocols are operational, enhancing the overall security of your AWS storage environment. By limiting traffic to only necessary and approved ports and protocols, you reduce the attack surface and enhance the overall security of your storage environment. Regular audits and monitoring further ensure that security measures remain effective and up-to- date, safeguarding your data from emerging threats.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.6 Ensure Secure Ports
audit:
  type: manual
  command: '1. Review Security Group Configurations: 1. Navigate to "Security Groups" under "Network & Security". 2. Verify that security groups are configured to allow only necessary inbound and outbound traffic. 3. Ensure rules are in place to restrict access to critical storage services, such as Amazon S3, EFS, and EBS. 2. Check Network Access Control Lists (NACLs): o Steps: 1. Navigate to "Network ACLs" under "Security". 2. Ensure NACLs are configured to control traffic to and from subnets, allowing only necessary ports and protocols. 3. Verify that rules are implemented to deny unauthorized access. 3. Monitor VPC Flow Logs: o Steps: 1. Enable VPC Flow Logs for each VPC. 2. Regularly review flow logs to monitor traffic and identify any unauthorized access attempts or anomalies. 3. Investigate and remediate any unusual traffic patterns. 4. Inspect IAM Policies and Roles: o Steps: 1. Review IAM policies to ensure they enforce least privilege principles for access to storage services. 2.
    Verify that roles are appropriately assigned and used to control access to security groups and NACLs. 5. Enable and Review AWS CloudTrail Logs: o Steps: 1. Ensure CloudTrail is enabled in all regions. 2. R...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 3.6 to configure: Ensure Secure Ports.'
