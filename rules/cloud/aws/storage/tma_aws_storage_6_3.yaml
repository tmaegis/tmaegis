id: TMA-AWS-STORAGE-6.3
title: Ensure functionality of Endpoint Detection and Response (EDR)
description: Establish and maintain an effective Endpoint Detection and Response (EDR) system to proactively monitor, detect, and respond to security threats on endpoints such as computers, mobile devices, and servers. This involves deploying EDR software that continuously collects data from endpoints, analyzes this data for signs of malicious activity, and provides real-time alerts and detailed incident reports. Regularly test and update the EDR system to ensure it can accurately identify and mitigate advanced threats, including zero-day exploits and sophisticated malware, ensuring comprehensive protection and swift response to potential security incidents. Ensuring the functionality of Endpoint Detection and Response (EDR) systems is essential for early detection and swift response to security threats on endpoints. These systems continuously monitor and analyze endpoint data, providing real-time...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.3 Ensure functionality of Endpoint Detection and Response (EDR)
audit:
  type: manual
  command: 1. Preparing the Environment for EDR - Before getting started with EDR, you must prepare the environment that you want to back up. 2. Preparing the Source Server - Allow direct access to Elastic Disaster Recovery and Amazon S3 AWS service API endpoints through HTTPS protocol (TCP port 443). Direct outbound TCP port 1500 from the source server to the staging area subnet, which contains the replication servers. 3. Preparing the Staging Area Subnet - Allow Direct access to EDR, S3, and EC2 through HTTPS protocol (TCP port 443) Direct inbound TCP port 1500 for replication traffic 4. Accessing the AWS Elastic Disaster Recovery Console - o Search for “AWS Elastic Disaster Recovery” in the AWS Console. o Select “Elastic Disaster Recovery” 5. Configuring the Replication Settings Template - Select Configure and Initializein in the AWS Elastic Disaster Recovery screen. You will be navigated to setup your replication settings template. This will create a staging area in a subnet of your
    choice and a replication server instance types. The default replication server instance type will be a t3 micro EC2 instance. This is good for normal workloads with small I/O operations. 6. Next, configure...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.3 to configure: Ensure functionality of Endpoint Detection and Response (EDR).'
