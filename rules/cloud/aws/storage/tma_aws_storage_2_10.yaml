reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.10 Ensure Resource Access via Tag-based Policies
audit:
  type: manual
  command: '1. Review IAM Policies: o Access the IAM console in the AWS Management Console. o Navigate to the "Policies" section and review policies associated with EC2 resources. o Ensure that policies utilize condition keys related to EC2 tags for granting access. 2. IAM Policy Simulator: o Utilize the IAM Policy Simulator to simulate access scenarios based on EC2 tags. o Test various tag-based policy configurations to verify that access is granted or denied appropriately. 3. CloudTrail Analysis: o Access the CloudTrail console and review logs related to IAM policy changes. o Look for API calls related to modifications of policies using tag-based conditions. 4. AWS Config Rules: o Configure AWS Config rules to monitor IAM policies for tag-based conditions. o Set up rules to detect policies that do not include tag-based conditions or are overly permissive. 5. Manual Review: o Manually inspect IAM policies to ensure they include tag-based conditions where applicable. o Verify that policies
