id: TMA-AWS-STORAGE-2.10
title: Ensure Resource Access via Tag-based Policies
description: For optimal granularity in EC2 access, configuring IAM policies via tags proves highly effective. This involves editing the JSON text editor to specify access permissions based on specific tags. In the provided example, I'm granting the "developers" group access exclusively to the newly created EC2 image, as illustrated in the attached screenshot depicting the policy creation process. Implementing IAM policies based on tags in EC2 enables administrators to finely tailor access control, granting permissions dynamically according to resource attributes. This approach enhances security and scalability by aligning access rights with specific resource requirements while minimizing manual intervention.
target: aws
level: 2
severity: medium
tags:
- access-control
- aws
- cloud
