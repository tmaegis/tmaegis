id: TMA-AWS-STORAGE-2.11
title: Ensure Secure Password Policy Implementation
description: Password policies outline the appropriate parameters for password configuration within an organization. Clear password policies provide essential guidelines for maintaining strong authentication practices, reducing the risk of unauthorized access and data breaches within an organization. By enforcing requirements for complex passwords and regular updates, these policies help bolster cybersecurity defenses and ensure compliance with industry standards and regulations.
target: aws
level: 2
severity: low
tags:
- auth
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.11 Ensure Secure Password Policy Implementation
audit:
  type: manual
  command: '1. Review IAM Policies: o Access the IAM console in the AWS Management Console. o Navigate to the "Password Policy" section to review the current password policy settings. o Ensure that the password policy aligns with industry best practices and organizational security requirements, including parameters such as minimum length, complexity requirements, and password expiration. 2. AWS Config Rules: o Configure AWS Config rules to monitor IAM password policies. o Set up rules to check for compliance with password policy requirements, such as minimum length, complexity, and expiration settings. o Use AWS Config to continuously assess the configuration of IAM password policies and identify any non-compliant settings. 3. CloudTrail Analysis: o Access the CloudTrail console and review logs related to IAM password policy changes. o Look for API calls related to modifications of password policy settings. o Analyze the logs to ensure that password policy changes are authorized and adhere
    to organizational security standards. 4. Manual Review: o Manually inspect the IAM password policy settings to verify compliance with security requirements. o Check for parameters such as minimum password...'
remediation:
  type: iac_patch
  command: '1. Revise and Update Password Policies: o Navigate to the IAM dashboard in the AWS Management Console. o Go to the "Account settings" section to review and adjust the password policy. o Strengthen the policy by setting requirements for password length, complexity (including uppercase, lowercase, numbers, and special characters), and rotation policies. 2. Enforce Password Changes: o If the audit reveals passwords that do not comply with the updated policy, require users to change their passwords immediately. o Implement mandatory password updates at regular intervals to ensure ongoing compliance with the policy. 3. Enable AWS Config for Continuous Compliance: o Use AWS Config to continuously monitor and record IAM password policies. o Set up AWS Config rules that automatically check compliance with your organization’s password policy standards. 4. Utilize Multi-Factor Authentication (MFA): o Enable MFA for an additional layer of security on all user accounts, especially for accounts
