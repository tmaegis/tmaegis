id: TMA-AWS-STORAGE-1.2
title: Ensure securing AWS Backups
description: 'As an AWS administrator, it''s important to know what you''re responsible for. You''re responsible for keeping things safe in the cloud, which means taking care of the resources and data on AWS. Here''s what you need to secure, according to AWS documentation: 1. Responsible for alert communication with AWS. 2. Managing access credentials for AWS resources. 3. Configuring backup plans according to organization policies. 4. Ensuring backup recovery capability. 5. Including AWS Backups in the organization''s disaster recovery procedures. 6. Ensuring user awareness and familiarity with AWS Backups platform usage AWS will send periodic emails regarding the status of your backups and any service issues. The administrator must address any communicated issues from AWS, such as billing problems or backup inactivity, and take necessary steps to resolve them.'
target: aws
level: 2
severity: medium
tags:
- aws
- backup
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 1.2 Ensure securing AWS Backups
audit:
  type: manual
  command: 'CREATING AN AWS BACKUP: Creating an AWS Backup involves selecting the desired data, specifying backup frequency, and choosing storage options. Below we’ll walk through how to create and configure an AWS Backup instance. 1. Sign into AWS Console: To sign into the AWS Console ''https://console.aws.amazon.com/billing/home#/'', users navigate to the AWS Management Console website and enter their credentials, including their username and password. 2. Access the AWS Backup Service Dashboard in the AWS Management Console: AWS Management Console and type "Backup" or navigate through the services menu to find the "Storage" category, where AWS Backup is listed. 3. Create Backup Plan: Choose "Create backup plan" from the options provided. You can either create a custom plan tailored to your requirements or option for a per-defined template offered by AWS'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 1.2 to configure: Ensure securing AWS Backups.'
