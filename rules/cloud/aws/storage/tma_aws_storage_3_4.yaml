id: TMA-AWS-STORAGE-3.4
title: Ensure controlling Network access to EFS Services
description: It’s important that you secure access to your resources on your AWS VPC network. There are several ways to ensure that you control what traffic is accessing your resources. Some of which include tightening down network layer security using a Security Group and a NACL within the VPC console. You can also tighten down Security Groups within your EC2 console and by using AWS IAM. Maintaining network security is a high priority to ensure that no unauthorized users can access the data stored on your EFS service. Maintaining network security is a best practice essential for keeping your data safe and secure.
target: aws
level: 2
severity: medium
tags:
