id: TMA-AWS-STORAGE-3.8
title: Ensure managing mount target security groups
description: Managing security groups for mount targets is essential for controlling access to your Amazon EFS file systems. By configuring these security groups, you ensure that only authorized network traffic can access your file systems, enhancing security. Regular reviews and updates of security group rules maintain strict access control, protecting your data from unauthorized access and potential breaches. The rationale for managing security groups for mount targets is to ensure robust access control and security for your Amazon EFS file systems. By configuring these security groups, you restrict access to only authorized network traffic, thereby minimizing the risk of unauthorized access and potential data breaches. Regularly reviewing and updating these rules helps maintain strong security measures and compliance with organizational policies and industry standards.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.8 Ensure managing mount target security groups
audit:
  type: manual
  command: 1. Navigate to EFS. 2. Select file systems. 3. Click the radio box and select “view details”. 4. Select the “manage” button. 5. Select “Networking” tab. 6. This will bring up a screen for each of your mount points. 7. To edit Security Groups, select “Manage”.From here, you can edit security groups for each mount point. This gives you control of how traffic can flow between each subnet.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 3.8 to configure: Ensure managing mount target security groups.'
