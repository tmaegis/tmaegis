reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.5 Ensure creating snapshots of EBS volumes
audit:
  type: manual
  command: 'To audit the use of EBS snapshots in AWS, follow these steps: 1. Access the AWS Management Console: o Log in to your AWS account and navigate to the AWS Management Console. 2. Review EBS Snapshots: o Go to the EC2 Dashboard and select "Snapshots" under the "Elastic Block Store" section. o Check the list of snapshots to ensure regular backups are being created for all critical volumes. 3. Verify Snapshot Policies: o Ensure that snapshot lifecycle policies are in place and configured correctly. o Go to the "Lifecycle Manager" under the EC2 Dashboard and review policies for automated snapshot creation and retention. 4. Check Snapshot Status and Details: o Review the status of each snapshot to ensure they are completed successfully. o Verify the details of snapshots, such as description, creation time, and the volume ID associated with each snapshot. 5. Inspect IAM Policies and Permissions: o Navigate to the IAM Dashboard and review the policies attached to users, groups, and roles.
    o Ensure that only authorized personnel have permissions to create, delete, and manage snapshots. 6. Use AWS Config Rules: o Enable AWS Config to continuously monitor and record AWS resource configuratio...'
remediation:
  type: iac_patch
  command: 'To create an EBS snapshot on AWS, follow these steps: 1. Access the AWS Management Console: o Log in to your AWS account and navigate to the AWS Management Console. 2. Navigate to the EC2 Dashboard: o In the AWS Management Console, select "EC2" from the services menu to open the EC2 Dashboard. 3. Select the Volume: o In the left-hand navigation pane, under "Elastic Block Store," click on "Volumes." o Find the volume you want to snapshot from the list and select it by clicking the checkbox next to it. 4. Create a Snapshot: o With the volume selected, click on the "Actions" button at the top of the page. o From the dropdown menu, select "Create Snapshot." 5. Configure the Snapshot: o In the "Create Snapshot" dialog box, provide a description for the snapshot. This helps identify the snapshot later. o Review the volume ID to ensure it is the correct volume. 6. Initiate the Snapshot Creation: o Click the "Create Snapshot" button to start the snapshot creation process. 7. Monitor
