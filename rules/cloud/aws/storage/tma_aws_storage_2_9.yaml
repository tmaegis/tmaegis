id: TMA-AWS-STORAGE-2.9
title: Ensure Granular Policy Creation
description: Granular policies are meticulously tailored to AWS resources, ensuring precision in access control measures. Emphasizing granular policies in AWS ensures that access control measures are precisely aligned with the requirements of each resource, bolstering security and minimizing unauthorized access. By tailoring policies to specific resources, organizations can adhere more closely to the principle of least privilege, mitigating risks and maintaining compliance with regulatory standards.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.9 Ensure Granular Policy Creation
audit:
  type: manual
  command: '1. Review IAM Policies: o Access the IAM console in the AWS Management Console. o Navigate to the "Policies" section to view all IAM policies. o Examine each policy to ensure they are finely tuned and specific to the resources they are intended to control access to. 2. Utilize AWS Config: o Open the AWS Config console and ensure that AWS Config is enabled for your AWS account. o Set up Config rules to monitor IAM policies for granularity. o Configure rules to detect policies that are overly broad or provide unnecessary permissions. 3. CloudTrail Analysis: o Access the CloudTrail console and review the logs. o Look for API calls related to IAM policy modifications. o Analyze the logs to ensure that policy changes align with the principles of granular access control. 4. Manual Review: o Conduct manual reviews of IAM policies and their associated resources. o Verify that policies are scoped to specific resources and actions, rather than providing blanket permissions. 5. Automated
    Scanning: o Utilize third-party AWS security tools that offer automated scanning and analysis of IAM policies for granularity. o Configure these tools to regularly scan and identify any policies that may n...'
remediation:
  type: iac_patch
  command: '1. Policy Refinement: o Review existing IAM policies to identify those that are overly broad or lack granularity. o Refine these policies to restrict permissions to only the resources and actions necessary for each user or group. 2. IAM Policy Simulator: o Utilize the IAM Policy Simulator in the AWS Management Console to test the effectiveness of policy changes. o Simulate various access scenarios to ensure that policies are granting the intended level of access without unintended consequences. 3. Access Reviews: o Conduct regular access reviews to ensure that IAM policies remain aligned with the principle of least privilege. o Identify and remove any unnecessary permissions or policies that grant excessive access to resources. 4. AWS Config Remediation: o Configure AWS Config rules to automatically remediate non-compliant IAM policies. o Set up remediation actions to adjust policies to adhere to granular access control principles automatically. 5. Employee Training: o Provide
