id: TMA-AWS-STORAGE-4.9
title: Ensure cleaning up FSx Resources
description: Cleaning up FSx resources involves removing unused or unnecessary FSx file systems and associated components to optimize costs and maintain a secure cloud environment. This includes deleting redundant file systems, snapshots, and mount targets, while ensuring all data is backed up or migrated. Regular cleanup prevents resource sprawl, reduces expenses, and maintains the overall health and performance of your AWS infrastructure. The rationale for cleaning up FSx resources is to optimize costs and ensure a secure and efficient cloud environment. By removing unused or unnecessary file systems, snapshots, and mount targets, you prevent resource sprawl and reduce unnecessary expenses. Regular cleanup also helps maintain the overall health and performance of your AWS infrastructure, ensuring it remains organized and secure.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.9 Ensure cleaning up FSx Resources
audit:
  type: manual
  command: To clean the FSx resources - 1. Terminate the EC2 instance. 2. Delete Fsx cache - On the actions drop down, select delete cache. 3. Verify that you want to delete the service. 4. Select Delete. It will take some time to delete the cache. 5. Delete the S3 Bucket Before you can delete the bucket you must first empty the bucket. Check the radio box and select Empty Select the bucket that you want to delete and select Delete n the S3 console.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.9 to configure: Ensure cleaning up FSx Resources.'
