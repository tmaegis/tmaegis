id: TMA-AWS-STORAGE-4.2
title: Amazon Elastic File Cache
description: 'Amazon File Cache is available in the following AWS Regions: 1. US East (N. Virginia) 2. US East (Ohio) 3. US West (Oregon) 4. Canada (Central) 5. Europe (Frankfurt) 6. Europe (Ireland) 7. Europe (London) 8. Europe (Stockholm) 9. Asia Pacific (Hong Kong) 10. Asia Pacific (Mumbai) 11. Asia Pacific (Seoul) 12. Asia Pacific (Tokyo) 13. Asia Pacific (Singapore) 14. Asia Pacific (Sydney) Amazon Elastic File Cache Compatibility: In order to use AWS FSx, you must ensure that the operating system you’re using on the compute instance is compatible with AWS FSx. Below are the compatible operating systems: 1. Amazon Linux 2 and Amazon Linux 2. Red Hat Enterprise Linux (RHEL) 3. CentOS 4. Rocky Linux 5. Ubuntu. The Lustre client must be installed on these systems in order for the FSx service to work. The rationale behind creating Amazon Elastic File Cache is to enhance the performance and scalabi...'
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.2 Amazon Elastic File Cache
audit:
  type: manual
  command: 'Creating Amazon Elastic File Cache: Before you can start using Amazon Elastic File Cache, you must set up an Amazon Elastic Compute Instance and an S3 bucket. We’re going to create a new EC2 instance and S3 bucket for the sake of this tutorial. Creating an EC2 instance for FSx: Make sure that whatever AMI you select is compatible with Lustre 2.12 client. - Navigate to the Amazon EC2 console. - Select “Launch Instance”. - Give your server a name. - Select “Ubuntu” or an operating system that’s compatible with FSx. - Select default VPC and security group. - Select or create private SSH keys. - Leave the rest of the settings default. - Create Instance.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.2 to configure: Amazon Elastic File Cache.'
