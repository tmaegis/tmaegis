id: TMA-AWS-STORAGE-4.5
title: Ensure installation and configuration of Lustre Client
description: To utilize the newly created File Cache, you must install the Lustre Client on your EC2 instance. The Lustre Client facilitates efficient communication between the EC2 instance and the File Cache, ensuring high-performance data access and improved overall system efficiency. This setup is crucial for optimizing data processing and leveraging the benefits of the File Cache.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.5 Ensure installation and configuration of Lustre Client
audit:
  type: manual
  command: 'Follow along to install the Lustre Client on Ubuntu 22.04: 1. Launch your EC2 instance. Navigate to the folder of your secure key and ssh into the instance using this command: - ssh -i "{KEY.pem}" ubuntu@{your ec2 instance} - When prompted to log in with the SSH key, enter in “yes” - You should now be connected to your EC2 instance. 2. Run the following command to download and install the public Lustre key: wget -O - https://fsx-lustre-client-repo-public-keys.s3.amazonaws.com/fsx- ubuntu-public-key.asc | gpg --dearmor | sudo tee /usr/share/keyrings/fsx- ubuntu-public-key.gpg >/dev/null 3. Add the AWS Lustre package repository to your local package manager using the following command: sudo bash -c ''echo "deb [signed-by=/usr/share/keyrings/fsx-ubuntu-public- key.gpg] https://fsx-lustre-client-repo.s3.amazonaws.com/ubuntu jammy main" > /etc/apt/sources.list.d/fsxlustreclientrepo.list && apt-get update'' 4. Determine which kernel is currently running on your client instance and
    update as needed. The AWS Lustre client on Ubuntu 22.02 requires kernel 5.15.0.1020- aws or later for both x86 based EC2 instances and Arm-based EC2 instanced powered by AWS Graviton processors: a. Run the fol...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.5 to configure: Ensure installation and configuration of Lustre Client.'
