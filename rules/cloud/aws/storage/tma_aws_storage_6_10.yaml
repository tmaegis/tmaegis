id: TMA-AWS-STORAGE-6.10
title: Ensure execution of a Disaster Recovery Failover
description: Execute a comprehensive disaster recovery failover to transition operations from the primary system to a backup system during disruptions. This process includes ensuring all critical data and applications are accurately replicated to the backup site for seamless operational continuity. Regularly test and document the failover process to identify and resolve any issues, maintaining readiness to minimize downtime and data loss during real disasters. Executing a comprehensive disaster recovery failover is essential to ensure operational continuity during disruptions. Accurate replication of critical data and applications to the backup site guarantees that business operations can continue seamlessly. Regular testing and documentation of the failover process help identify and resolve potential issues, maintaining a state of readiness and minimizing downtime and data loss in actual disaster...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.10 Ensure execution of a Disaster Recovery Failover
audit:
  type: manual
  command: 'Follow the steps where we learned how to conduct a recovery drill with the below modifications: 1. Choose the server that you want to recover and failover. On the initiate recovery job menu, choose “initiate recovery.” 2. Choose a point in time to recover from backup. 3. Choose initiate recovery to create a recovery job. Note: You can use the job details to monitor the progress and status of the recovery job. After the recovery job has completed, the last recovery result of your source server will report “successful.” The EC2 instance ID of the launched recovery instance will also be listed in the source server overview. You can test if the recovery instance is functioning by testing the EC2 instance that is in the source server overview.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.10 to configure: Ensure execution of a Disaster Recovery Failover.'
