id: TMA-AWS-STORAGE-1.4
title: Ensure to create AWS IAM Policies
description: AWS IAM policies, specify the desired permissions for accessing AWS resources and define the conditions under which those permissions are granted. Configure the appropriate policies to keep your resources secure. Managing AWS IAM policies is crucial to safeguard your backups from unauthorized access, ensuring that only approved users can manipulate or view sensitive data.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 1.4 Ensure to create AWS IAM Policies
audit:
  type: manual
  command: 'To create a role for AWS Backup, follow these steps: 1. Navigate to the "IAM Dashboard" in the AWS Console. 2. Select "Roles" from the left-hand menu. 3. Click on the "Create Role" button. 4. Choose "AWS Service" as the trusted entity. 5. Select "AWS Backup" as the service that will use this role. 6. Choose a policy to apply to the role or create a custom policy. 7. Review the role details and provide a meaningful name for the role. 8. Click on "Create Role" to finalize the creation of the role for AWS Backup.'
remediation:
  type: iac_patch
  command: AWS IAM policies, restricting access to backup resources, and implementing additional security measures to prevent future incidents.
