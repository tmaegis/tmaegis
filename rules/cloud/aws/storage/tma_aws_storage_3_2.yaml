id: TMA-AWS-STORAGE-3.2
title: Ensure Implementation of EFS
description: AWS EFS is a fully managed storage service that enables rapid file system deployment without the need for configuration, patching, or maintenance. The rationale behind using AWS EFS is to simplify and expedite the deployment of file systems, eliminating the need for manual configuration, patching, and maintenance. This allows you to focus on other critical aspects of your operations while benefiting from a reliable, scalable, and fully managed storage solution.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.2 Ensure Implementation of EFS
audit:
  type: manual
  command: '1. Navigate to console - https://us-east- 1.console.aws.amazon.com/efs/home?region=us-east-1#/get-started. 2. Select “Create File System”. Give the file system a name and select the default VPC. Select “Create”. 3. Encrypting data at rest - The EFS is encrypted automatically upon creation.. 4. Attach the EFS to an EC2 instance. 5. Navigate to file system details - Select the radio box next to the file system that was just created and select “view details”. 6. Creating an NFS directory on your EC2 instance - Launch your EC2 instance. Once connected, Type following command: “sudo mkdir efs” to create a new efs directory. 7. Mounting an NFS directory on your EC2 instance - Navigate to find your EC2 DNS information Paste this command into the console after making the efs directory sudo mount -t nfs -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport mount-target-DNS:/ ~/efs-mount-point ``` NOTE: The encryption takes place as soon as you mount the directory.
    This encrypts the data in transit. 8. Terminating the EC2 instance - The EFS file system that was just mounted doesn’t persist on reboot. You can consult the AWS documentation to see how you can write a...'
remediation:
  type: iac_patch
  command: 'To remediate the issues of manual file system management, follow these steps to create and use Amazon EFS: 1. Open the Amazon EFS Console: Sign in to the AWS Management Console and navigate to the Amazon EFS service. 2. Create a New File System: Click on "Create file system" to start the setup process. 3. Configure Settings: Select your desired VPC, availability zones, throughput mode, and any additional settings like lifecycle management. 4. Set Up Access Points: Configure access points to control permissions and simplify access management. 5. Review and Create: Verify your settings and click "Create" to finalize the file system setup. 6. Mount the File System: Use the provided mount targets and instructions to attach the file system to your EC2 instances or other resources.'
