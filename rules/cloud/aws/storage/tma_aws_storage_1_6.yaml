id: TMA-AWS-STORAGE-1.6
title: Ensure AWS Backup with Service Linked Roles
description: AWS Service Linked Roles are IAM roles designed specifically for AWS Backup. These roles come with default configurations allowing access to all AWS resources by default. While Service Linked Roles offer quick deployment, using default configurations isn't recommended for security best practices.
target: aws
level: 2
severity: medium
tags:
- aws
- backup
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 1.6 Ensure AWS Backup with Service Linked Roles
audit:
  type: manual
  command: 'Create service-linked role for AWS Backup: You don''t need to create a service-linked role manually. AWS Backup automatically creates it when you list resources to back up, set up cross-account backup, or perform backups using the AWS Management Console, AWS CLI, or AWS API. If you delete this role, you can recreate it by following the same steps. AWS Backup will create it for you again when needed.'
remediation:
  type: iac_patch
  command: Assess your organization's needs to determine whether to utilize Service Linked Roles for AWS backups.
