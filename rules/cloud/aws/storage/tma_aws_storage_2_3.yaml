id: TMA-AWS-STORAGE-2.3
title: Ensure the proper configuration of EBS storage
description: All computer instances need to have a device on which to store files. EBS is built on top of EC2 instances as a block storage device. Remember that we are working with cloud computing. Rather than purchasing and manually installing disk drives on a server, AWS allows you to virtually add storage using Elastic Block Store (EBS).
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.3 Ensure the proper configuration of EBS storage
audit:
  type: manual
  command: 'Verify compliance with CIS AWS Storage Services Benchmark v1.0.0 section 2.3: Ensure the proper configuration of EBS storage.'
remediation:
  type: iac_patch
  command: '1. Open the Amazon EC2 Console: Navigate to the EC2 Dashboard in the AWS Management Console. 2. Select Volumes: Under the "Elastic Block Store" section, select "Volumes". 3. Create Volume: o Click on "Create Volume". o Choose the volume type (e.g., General Purpose SSD (gp2), Provisioned IOPS SSD (io1), etc.). o Specify the size and availability zone. o Optionally, configure additional settings such as IOPS, encryption, and tags. 4. Attach Volume to Instance: o Select the volume you created. o Click on "Actions" and choose "Attach Volume". o Select the instance to which you want to attach the volume and specify the device name. 5. Format and Mount the Volume (on the instance): o Connect to your instance using SSH. o List available disks using the command: lsblk. o Format the new volume (e.g., sudo mkfs_fs -t ext4 /dev/xvdf for ext4 filesystem). o Create a mount point (e.g., sudo mkdir /mnt/data). o Mount the volume (e.g., sudo mount /dev/xvdf /mnt/data). 6. Configure Automatic
    Mounting (optional): o Edit the /etc/fstab file to add an entry for the new volume to ensure it mounts automatically on system-reboot. o Example entry: /dev/xvdf /mnt/data ext4 defaults,nofail 0 2. By follo...'
