id: TMA-AWS-STORAGE-4.7
title: Ensure mounting FSx cache
description: Mounting the FSx cache is a crucial step to optimize data retrieval and system performance. This process involves connecting the FSx file system to your compute instances, allowing them to access cached data efficiently. Properly mounting the FSx cache ensures low-latency access to frequently used data, enhances overall application performance, and leverages the full capabilities of the AWS FSx service. This setup is essential for achieving high performance and efficient data processing in your AWS environment. By connecting the FSx file system to your compute instances, you enable low-latency access to frequently used data, significantly improving application performance. This setup leverages the full capabilities of the AWS FSx service, ensuring efficient data processing and resource utilization in your AWS environment. Properly mounting the FSx cache is essential for achieving high...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.7 Ensure mounting FSx cache
audit:
  type: manual
  command: 'To mount your cache, follow the next steps: 1. Make a directory for the mount point with the following command: sudo mkdir -p /mnt 2. Mount the Amazon file cache to the directory that you just created. Use the following command and replace these names: o Replace cache_dns_name with the actual file cache’s Domain Name System (DNS) name o Replace mountname with the cache’s mount name, which you can get by running the describe-file-caches AWS CLI command or DescribeFileCaches API operation sudo mount -t lustre -o relatime,flock cache_dns_name@tcp:/mountname /mnt Note: Make sure your EC2 instance is in the same VPC as your cache. If done correctly, the path of your folder will show up in the /mnt folder. You can also use the df command to see the DNS and mount point is attached to your file system:'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.7 to configure: Ensure mounting FSx cache.'
