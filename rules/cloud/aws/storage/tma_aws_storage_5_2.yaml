id: TMA-AWS-STORAGE-5.2
title: Ensure direct data addition to S3
description: Your bucket name must be unique and not already in use on AWS. Click on your bucket name, and in the right corner, you will find an option to upload data directly to your S3 bucket. You can choose the file option to upload individual files, images, or even entire folders. Accessing the upload option within your bucket simplifies the process of adding data, making it easy to manage and organize your files. This streamlined approach allows for efficient data storage, retrieval, and management within the AWS S3 environment, enhancing overall operational efficiency.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 5.2 Ensure direct data addition to S3
audit:
  type: manual
  command: 'Access Point in S3 Bucket: Access points are named network endpoints that are attached to buckets which simplify managing data access at scale in S3. To see if any of the access points attached to this bucket grant public or cross-account access, go to IAM Access Analyzer for S3. 1. Enter a name for the access point. The name must be unique within the AWS account and Region. 2. Choose the VPC (Virtual Private Cloud) and subnet where you want the access point to be accessible. This determines the network traffic routing for the access point. 3. Optionally, you can configure additional settings such as permissions, bucket policy, and endpoint policy for the access point. 4. Review the settings, and click on "Create access point" to create the access point'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 5.2 to configure: Ensure direct data addition to S3.'
