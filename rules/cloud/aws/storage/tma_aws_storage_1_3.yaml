id: TMA-AWS-STORAGE-1.3
title: Ensure to create backup template and name
description: To create a backup plan, select a template and specify a name for the plan. Additionally, define backup rules according to your requirements and then click on create backup option.
target: aws
level: 2
severity: low
tags:
- aws
- backup
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 1.3 Ensure to create backup template and name
audit:
  type: manual
  command: 'Backup Resources: Once you''ve made your backup plan, it''s time to put it into action and start backing up your stuff. Let''s start by backing up an S3 storage bucket. To back up Elastic Beanstalk instance stored on AWS S3, we''ll need to tag its Amazon Resource Name (ARN) with a backup plan. In S3, go to "properties" to attach the backup plan to the resource: 1. Copy the ARN from the console: From the AWS Management Console, copy the ARN (Amazon Resource Name) associated with the Elastic Beanstalk instance. This unique identifier will be used to tag the resource for backup. 2. Assign the resource: o After copying the ARN, return to the AWS Management Console and access Amazon Backup. o Choose the backup plan recently created, then proceed to assign the resource you wish to backup, such as the S3 bucket containing the Elastic Beanstalk resource. o Finally, navigate to "Resource Assignments" to complete the process. Choose "Assign Resources" and provide a name for the assignment.
    For now, maintain the role as Default. In subsequent sections, we''ll explore implementing custom IAM roles and policies for your backup operations. Select the resource(s) that you want to backup. You have t...'
remediation:
  type: iac_patch
  command: The AWS backup vault serves as the storage location for your backups. It's crucial to manage access to these backups to prevent unauthorized access and ensure data security.
