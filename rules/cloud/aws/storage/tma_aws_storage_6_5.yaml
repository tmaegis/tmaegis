id: TMA-AWS-STORAGE-6.5
title: Ensure proper IAM configuration for AWS Elastic Disaster Recovery
description: Set up and maintain Identity and Access Management (IAM) roles and policies specifically for AWS Elastic Disaster Recovery. This includes defining least-privilege access for users and services, creating roles for automated processes, and enforcing multi-factor authentication (MFA) for added security. Regularly review and update IAM policies to adapt to changes in the organization and to maintain compliance with security best practices, ensuring that only authorized personnel and services can access and manage disaster recovery resources. Proper IAM configuration for AWS Elastic Disaster Recovery ensures that only authorized users and services have access to critical recovery functions, reducing the risk of unauthorized access and potential security breaches. Implementing least- privilege access and MFA enhances security by limiting permissions and adding an extra layer of authenticati...
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.5 Ensure proper IAM configuration for AWS Elastic Disaster Recovery
audit:
  type: manual
  command: 'To create DRS Agent User, follow following steps: 1. Navigate to the AWS IAM Console - https://us-east- 1.console.aws.amazon.com/iam/home?region=us-east-1#/home. 2. Create new user. This user will only be able to access the Elastic disaster recovery agent installation resource. Accordingly, name the user “DSRuser”. 3. Allow Programmatic access: This allows the user to access resources programmatically with a secure key rather than having to enter a password. 4. elect “attach policies directly” and search for “AWSElasticDisasterRecoveryAgentInstallationPolicy”. 5. Create user. To create Failback Agent User, Follow the steps above with these two modifications: 1. Name the user “FailbackAgentuser”. 2. Apply the “AWSElasticDisasterRecoveryFailbackInstallationPolicy”.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.5 to configure: Ensure proper IAM configuration for AWS Elastic Disaster Recovery.'
