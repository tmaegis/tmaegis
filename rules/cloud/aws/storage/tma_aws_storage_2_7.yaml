id: TMA-AWS-STORAGE-2.7
title: Ensure creating IAM User
description: IAM users are individuals whose accounts have been created by the AWS administrator, providing them access to specific AWS resources. These users have undergone identity verification with your organization, ensuring that only authorized personnel can manage and interact with your AWS environment. The purpose of creating IAM users and verifying their identities with your organization is to ensure that only authorized individuals have access to AWS resources, enhancing security and preventing unauthorized access. This practice helps maintain control over your AWS environment, ensuring that sensitive data and critical operations are managed by trusted and validated personnel.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.7 Ensure creating IAM User
audit:
  type: manual
  command: '1. Access the AWS Management Console: o Log in to your AWS account and navigate to the AWS Management Console. 2. Review IAM Users: o Go to the IAM Dashboard and select "Users." o Check the list of IAM users to ensure that only authorized users are present. 3. Check User Details: o For each user, click on their name to view their details. o Verify the "User ARN" and ensure that the user was created by an authorized administrator. o Check the "Security credentials" tab to see if Multi-Factor Authentication (MFA) is enabled for added security. 4. Verify Identity Policies: o Review the policies attached to each user to ensure they are appropriate for the user''s role. o Check that permissions follow the principle of least privilege, granting only the necessary access. 5. Monitor Login Activity: o Use AWS CloudTrail to review login activities for each IAM user. o Check for any unusual login patterns or unauthorized access attempts. 6. Use AWS IAM Access Analyzer: o Enable IAM Access
    Analyzer to identify any IAM resources shared outside your AWS account. o Review findings to ensure that only verified and authorized users have access to your resources. 7. Generate IAM Credential Report...'
remediation:
  type: iac_patch
  command: '1. Remove Unauthorized Users: o Go to the IAM Dashboard, select "Users," and review the list of users. o Identify any unauthorized or unverified users and delete their accounts to prevent unauthorized access. 2. Enable Multi-Factor Authentication (MFA): o For each IAM user, go to the "Security credentials" tab and enable MFA. o Ensure all users have MFA configured to enhance security and reduce the risk of unauthorized access. 3. Update User Policies: o Review the policies attached to each IAM user. o Modify policies to follow the principle of least privilege, ensuring users have only the permissions necessary for their role. o Remove any overly permissive policies that could lead to security risks. 4. Rotate Access Keys: o For IAM users with long-lived access keys, create new keys and update the applications or services using them. o Delete the old access keys to reduce the risk of compromised credentials. o Encourage regular rotation of access keys as a security best practice.
