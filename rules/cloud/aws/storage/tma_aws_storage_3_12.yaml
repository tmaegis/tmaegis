id: TMA-AWS-STORAGE-3.12
title: Ensure configuring IAM for AWS Elastic Disaster Recovery
description: Before installing the AWS Elastic Disaster Recovery client, you need to configure AWS IAM permissions and users for both the AWS Replication and AWS Failback Client. Configuring AWS IAM permissions and users before installing the AWS Elastic Disaster Recovery client ensures that the AWS Replication and AWS Failback Client have the necessary access rights. This setup is essential for maintaining security and preventing unauthorized access. Proper IAM configuration guarantees the smooth operation of disaster recovery processes, safeguarding your data and ensuring system reliability.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.12 Ensure configuring IAM for AWS Elastic Disaster Recovery
audit:
  type: manual
  command: 'To create DRS Agent User, follow following steps: 1. Navigate to the AWS IAM Console - https://us-east- 1.console.aws.amazon.com/iam/home?region=us-east-1#/home. 2. Create new user. This user will only be able to access the Elastic disaster recovery agent installation resource. Accordingly, name the user “DSRuser”. 3. Allow Programmatic access: This allows the user to access resources programmatically with a secure key rather than having to enter a password. 4. elect “attach policies directly” and search for “AWSElasticDisasterRecoveryAgentInstallationPolicy”. 5. Create user. To create Failback Agent User, Follow the steps above with these two modifications: 1. Name the user “FailbackAgentuser”. 2. Apply the “AWSElasticDisasterRecoveryFailbackInstallationPolicy”.'
remediation:
  type: iac_patch
  command: Configure IAM Credentials for AWS Elastic Disaster Recovery.
