id: TMA-AWS-STORAGE-6.8
title: Ensure execution of a recovery drill
description: To ensure your organization is prepared for a disaster, it's crucial to verify that your disaster recovery services function as expected. Your IT team should conduct regular recovery drills on your AWS Elastic Recovery Instance to confirm everything operates smoothly and according to plan. Regular recovery drills are essential to verify the functionality of your disaster recovery services and ensure your organization is well-prepared for any disruptions. By conducting these drills on your AWS Elastic Recovery Instance, you can identify and address potential issues before they impact operations. This proactive approach enhances the reliability and effectiveness of your disaster recovery plan, providing confidence that your systems can recover swiftly and efficiently in the event of a disaster.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.8 Ensure execution of a recovery drill
audit:
  type: manual
  command: 'Steps to perform a recovery drill: 1. Navigate to source servers tab in AWS Elastic Disaster Recovery Dashboard. 2. Make sure that all servers you launch show as “Ready” under “status,” report as “healthy” in the data replication status column, and that pending actions show as “initiate drill”. 3. Select “initiate drill” under the orange dropdown menu. Make sure that you don’t initiate a real recovery job. 4. Choose a recovery point. Normally, it makes sense to choose the most recent recovery point, but you can also choose a recovery point from earlier. 5. Select the orange “initiate drill” to initiate the recovery drill. 6. To complete the recovery drill, clean up your resources by deleting the recovery instance by selecting actions and “terminate recovery instances”.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.8 to configure: Ensure execution of a recovery drill.'
