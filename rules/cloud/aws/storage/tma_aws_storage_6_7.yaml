id: TMA-AWS-STORAGE-6.7
title: Ensure proper configuration of the Launch Settings
description: Set up and verify the launch settings to ensure systems and applications start correctly and securely. This includes defining startup parameters, specifying required resources, and configuring security settings to prevent unauthorized changes. Regularly review and update these settings to align with best practices and organizational requirements, ensuring optimal performance and security at launch. Proper configuration of launch settings is crucial for ensuring that systems and applications start securely and perform optimally. Defining startup parameters and resource requirements prevents potential issues and enhances efficiency. Regular reviews and updates to these settings help maintain alignment with best practices and evolving organizational needs, thereby strengthening security and operational reliability from the moment of launch.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.7 Ensure proper configuration of the Launch Settings
audit:
  type: manual
  command: The settings can be changed after instances have been launched, but a new instance must be launched for new launch settings to take effect. 1. Select launch settings on the source server page 2. Configure launch settings o On the launch settings page, next to general launch, select “edit” 3. Configure EC2 launch template o Enable auto assign public IP and change the instance type to a t2.medium 4. Set version to default in the console 5. Set the default version that was just created to default version 6. Return to the dashboard and confirm your configurations are correct.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.7 to configure: Ensure proper configuration of the Launch Settings.'
