id: TMA-AWS-STORAGE-6.4
title: Ensure configuration of replication settings
description: Set up and maintain the replication settings to ensure accurate and efficient data duplication across systems. Proper configuration includes specifying source and target locations, defining replication schedules, and setting bandwidth limits to optimize performance. Regularly review and update these settings to accommodate changes in data volume and network conditions, ensuring data integrity and availability during replication processes. Proper configuration of replication settings is essential to ensure data consistency and availability across systems. Accurate replication schedules and bandwidth management optimize performance and prevent network congestion. Regular reviews and updates of these settings help adapt to changes in data volume and network conditions, maintaining efficient and reliable data replication processes.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.4 Ensure configuration of replication settings
audit:
  type: manual
  command: '1. Select “Configure and Initialize” in in the AWS Elastic Disaster Recovery screen. You will be navigated to setup your replication settings template. This will create a staging area in a subnet of your choice and a replication server instance types. The default replication server instance type will be a t3 micro EC2 instance. This is good for normal workloads with small I/O operations. 2. Next, configure EBS encryption and volume types. This will depend on your workload requirements. To encrypt EBS volumes, leave the setting as “default.” If you wish to make a custom encryption setting, you will need to create an AWS KMS key. 3. Configure the security group to your specific needs. Remember what ports need to be opened on inbound / outbound traffic that was specified in previous steps: o Configure Additional Replication settings. o You can choose how you want your data routed and if you want to throttle network traffic to reserve bandwidth. To keep your data as secure as possible,
    it’s recommended to get set up with a VPN or AWS direct connect, so your backups are not traveling over the public internet. o Point in time policy defines the snapshot retention time. Because Elastic...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.4 to configure: Ensure configuration of replication settings.'
