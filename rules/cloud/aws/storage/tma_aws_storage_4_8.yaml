id: TMA-AWS-STORAGE-4.8
title: Ensure exporting cache to S3
description: The S3 bucket we created earlier will store the files generated at this mount point. The rationale behind using the S3 bucket to store files generated at the mount point is to ensure scalable, durable, and cost-effective storage for your data. By exporting files to S3, you benefit from its high availability and robust data management features, which enhances data security and accessibility. This approach also optimizes storage resource utilization and simplifies data backup and retrieval processes.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.8 Ensure exporting cache to S3
audit:
  type: manual
  command: 'We can export the files that were created to the S3 bucket using the following steps: 1. Create a file on the FSx mount point: 2. Run the command: sudo touch efx.txt 3. Now run the command: sudo lsm hsm_archive efx.txt 4. Now check your S3 bucket that was created earlier.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.8 to configure: Ensure exporting cache to S3.'
