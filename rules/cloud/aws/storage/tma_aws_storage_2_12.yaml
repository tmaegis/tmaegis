id: TMA-AWS-STORAGE-2.12
title: Ensure Monitoring EC2 and EBS with CloudWatch
description: CloudWatch is an AWS monitoring service that allows you to keep an eye on your AWS resources. You can track metrics via log files or worldclass data visuals. AWS CloudWatch allows the administrator to keep an eye on his/her AWS resources. You can set up alarms, monitor activity, and analyze log data. CloudWatch is a must to keep your AWS EBS and EC2 resources secure. Using CloudWatch to monitor EC2 instances and EBS volumes is essential for enhancing operational oversight and ensuring optimal performance within the AWS environment. This approach provides real-time insights into resource usage and system health, enabling proactive adjustments and timely responses to potential issues, thereby maintaining high availability and efficiency.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- monitoring
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.12 Ensure Monitoring EC2 and EBS with CloudWatch
audit:
  type: manual
  command: 'Creating an AWS CloudWatch Dashboard: 1. Navigate to the AWS CloudWatch Console - https://us-east- 2.console.aws.amazon.com/cloudwatch/home?region=us-east-2#home. 2. Select the dashboard type that’s right for you. Give the dashboard a name. Name the dashboard as something memorable. You can select which resources you want to monitor. Select “EBS.” 3. Create an alarm - Alarms are important to send you an alert as soon as something suspicious happens on your volume. You can create an alarm to alert you when a certain threshold of IOPS are reached. To create alarm, follow steps - o Go to “Alarms” on the left hand side of the CloudWatch dashboard. o Select “Create a new alarm”. o Select “EBS”. o Select what you want to monitor. We’re going to choose to monitor the write operations of an EBS volume. o Go back to the volume that was created in EC2 dashboard and copy the volume ID under the “volume ID” field. o Configure the settings that you want to trigger an alarm. o Move onto the
    next step before continuing.'
remediation:
  type: iac_patch
  command: '1. Enable CloudWatch Monitoring: o Access the AWS Management Console, navigate to the EC2 dashboard, and select the instances and EBS volumes. o Enable detailed monitoring on each EC2 instance and EBS volume to collect data at a higher granularity. 2. Configure CloudWatch Alarms: o In the CloudWatch console, set up alarms based on key performance metrics such as CPU utilization, disk read/write operations, and network traffic. o Configure these alarms to notify administrators via email or SMS when thresholds are breached, allowing for immediate action. 3. Establish Baselines: o Analyze historical performance data from CloudWatch to establish baseline performance metrics for each instance and volume. o Use these baselines to identify abnormal behavior or performance degradation over time. 4. Automate Responses: o Utilize AWS CloudWatch Events and AWS Lambda to automate responses to specific alarms, such as scaling operations or initiating recovery processes. o Ensure these automated
    scripts are tested and reflect the operational policies of your organization.'
