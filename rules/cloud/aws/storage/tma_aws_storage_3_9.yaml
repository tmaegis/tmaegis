id: TMA-AWS-STORAGE-3.9
title: Ensure using VPC endpoints - EFS
description: With AWS PrivateLink, VPC Endpoints allow services to communicate within AWS using private IP addresses within approved CIDR ranges. This communication can be achieved without the need for a VPN, ensuring secure and efficient data transfer. The rationale behind using AWS PrivateLink with VPC Endpoints is to enable secure and efficient communication between services within AWS. By using private IP addresses within approved CIDR ranges, it eliminates the need for a VPN, reducing complexity and potential points of failure. This approach enhances security, reduces latency, and ensures data remains within the AWS network, aligning with best practices for secure and reliable cloud architecture.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- network
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.9 Ensure using VPC endpoints - EFS
audit:
  type: manual
  command: 'Creating a FIPS compliant interface endpoint for EFS: 1. Navigate to VPC Console: https://console.aws.amazon.com/vpc/. 2. Select “Endpoints” on the sidebar. 3. Select “Create endpoint. 4. Name the endpoint. 5. Copy and paste this services into the services bar: com.amazonaws.region.elasticfilesystem-fips – replace “region: with us-east-1 or whatever region you’re using. 6. Select your VPC. 7. For subnets, select the availability zone and then select private subnet. 8. Select the Security Group for the VPC endpoint. 9. For policy: select “full access”. 10. Create a tag for future reference / granular IAM permissions. 11. Create endpoint.'
remediation:
  type: iac_patch
  command: Use VPC Endpoints in tandem with AWS Private Link to secure your EFS connections.
