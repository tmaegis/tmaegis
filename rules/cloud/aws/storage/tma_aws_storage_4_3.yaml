id: TMA-AWS-STORAGE-4.3
title: Ensure the creation of an FSX Bucket
description: An S3 bucket will store the data that Amazon Elastic File Cache accesses Storing data in S3 ensures scalability, durability, and cost-efficiency, while Amazon Elastic File Cache enhances access speed by caching frequently accessed data. This combination leverages the strengths of both services, providing a seamless and efficient data storage and retrieval solution.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.3 Ensure the creation of an FSX Bucket
audit:
  type: manual
  command: '1. Navigate to the Amazon S3 bucket console. https://s3.console.aws.amazon.com/s3/. 2. Select “Create Bucket”. 3. Give your bucket a name and select the region. Note: your bucket must be a unique name that’s not used anywhere else on AWS. 4. Block public access: This is an internal service that will not be accessed outside of our internal AWS network. Keep the “block public access” setting checked. 5. Enable bucket versioning. 6. Leave the rest of the settings as default. 7. Select “create bucket.” 8. Create a path in your bucket, give it a name and leave the encryption as default for now.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.3 to configure: Ensure the creation of an FSX Bucket.'
