reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.8 Ensure the Creation of IAM Groups
audit:
  type: manual
  command: '1. Enable AWS CloudTrail: o Navigate to the AWS Management Console and open the CloudTrail service. o Create a new trail or ensure that an existing trail is configured to capture API activity in your AWS account. o Verify that CloudTrail is recording events related to IAM actions, including changes to IAM groups. 2. Review CloudTrail Logs: o Access the CloudTrail console and navigate to the Event History or Insights section. o Filter the logs to focus on IAM-related events, such as CreateGroup, AddUserToGroup, RemoveUserFromGroup, and PutGroupPolicy. o Analyze the logs to track changes made to IAM groups, including user additions/removals and modifications to group policies. 3. Utilize AWS Config: o Open the AWS Config console and ensure that AWS Config is enabled for your AWS account. o Set up AWS Config rules to monitor IAM configurations, including IAM groups. o Configure rules to check for compliance with security standards or organizational policies regarding IAM group settings
    and permissions. 4. Check IAM Console: o Access the IAM console in the AWS Management Console. o Navigate to the "Groups" section to view a list of IAM groups in your account. o Review the details of...'
remediation:
  type: iac_patch
  command: '1. CloudTrail and AWS Config Configuration: o If CloudTrail or AWS Config is not enabled, configure them to capture and monitor IAM activities and configurations respectively. Enable logging and set up appropriate rules to track IAM group changes and ensure compliance. 2. Review CloudTrail Logs for Anomalies: o Regularly review CloudTrail logs to identify any unauthorized or unexpected changes to IAM groups. o Investigate any anomalies detected in the logs, such as unauthorized user additions or policy modifications, and take appropriate action to rectify them. 3. AWS Config Remediation Rules: o Define AWS Config rules to automatically detect non-compliant IAM group configurations. o Configure remediation actions within AWS Config to automatically revert any deviations from the desired IAM group settings back to the compliant state. 4. IAM Group Cleanup: o Periodically review IAM groups to ensure they are still necessary and relevant. o Remove any unused or obsolete IAM groups
