id: TMA-AWS-STORAGE-4.4
title: Ensure the creation of Elastic File Cache
description: With the prerequisites completed, we can now proceed to create our Elastic File Cache. By implementing an Elastic File Cache, frequently accessed data is stored closer to the application, reducing latency and speeding up access times. This approach optimizes resource utilization, improves user experience, and ensures that the system can handle high-demand workloads effectively.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 4.4 Ensure the creation of Elastic File Cache
audit:
  type: manual
  command: '1. Navigate to the AWS Elastic File Cache console: https://console.aws.amazon.com/fsx/. 2. Click the hamburger menu on the left side of the screen and select “caches”. 3. Select “Create Cache” 4. Give your Cache a name. Choose a name that you will remember. 5. Select the amount of storage capacity you need for your cache. We’ll select 1.2 TiB for this tutorial. You can select storage capacity in increments of 1.2 TiB. 6. Select the amount of throughput capacity. The amount of Throughput capacity is calculated by multiplying the cache storage capacity by the throughput tier. For example, for a 1.2 TiB cache, it''s 1200 MB/s; for a 9.6 TiB cache, it''s 9600 MB/s. Throughput capacity is the sustained speed at which the file server that hosts your cache can serve data. 7. In the Network & Security section, provide networking and security group information: o For Virtual Private Cloud (VPC) choose the correct amazon VPC that you want to associate with your cache. We’re going to use
    the default VPC. o For VPC Security Groups, the ID for the default security group for your VPC should already be added. o For Subnet, you can choose any of the available subnets. 8. In the Encryption section...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 4.4 to configure: Ensure the creation of Elastic File Cache.'
