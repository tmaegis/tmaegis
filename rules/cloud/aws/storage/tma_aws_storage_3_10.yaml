id: TMA-AWS-STORAGE-3.10
title: Ensure managing AWS EFS access points
description: EFS access points serve as gateways to your EFS file system, allowing applications to interact with the file system across various resources. Proper configuration of these access points within your applications is crucial to ensure seamless and secure access. By configuring EFS access points, you can control and manage which users have access to specific resources in your EFS environment, enhancing security and operational efficiency. The rationale behind properly configuring EFS access points is to ensure secure and efficient interaction between your applications and the EFS file system. By setting up these access points correctly, you can control and manage user permissions, ensuring that only authorized users can access specific resources. This not only enhances the security of your data but also improves operational efficiency by preventing unauthorized access and potential data b...
target: aws
level: 2
severity: medium
tags:
- access-control
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 3.10 Ensure managing AWS EFS access points
audit:
  type: manual
  command: '1. Creating an EFS access point: You can create an EFS access point through the amazon CLI, AWS console, and with the EFS API. An EFS can only have up to 1,000 access points. 2. Mounting an EFS access point: Consult the section where we mounted an EFS file system on an EC2 instance. While inside the resource you want to configure an access point for, type in this command: mount -t efs -o tls,iam,accesspoint=fsap-abcdef0123456789a fs- abc0123def456789a: /localmountpoint 3. Enforcing a User Identity with an EFS access point: You can enforce user identity to ensure that users and groups with proper permissions are able to access the EFS file system. In order to do this, you must specify the user and group ID you wish to have ownership of the files. When enforcement is enabled, that file that is was created by the user will automatically show ownership to belong to the user. When enforcement is enabled, the access point considers the User ID, group ID, and secondary group ID. It
    ignored the NFS client’s ID. Note: enforcing the user ID is subject to the “ClientRootAccess” IAM permission. If either the User ID or Group ID = 0, then you must explicitly allow “ClientRootAccess” permissi...'
remediation:
  type: iac_patch
  command: Implement AWS EFS access points
