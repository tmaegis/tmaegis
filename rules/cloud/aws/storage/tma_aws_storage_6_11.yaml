- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.11 Ensure execution of a failback
audit:
  type: manual
  command: 'Performing the failback: 1. Download the failback client ISO 2. Attach the ISO to your original server and boot up the server. o The failback client will prompt for the IAM access key and secret key generated when making the user with the permission to access the failback. It will also ask for the region of the recovery instance. Remember: regions are case sensitive. If you’re in US east 1, type “us-east-1.” o If you are failing back to the original server, the failback client will automatically detect the recovery instance and map the data volumes for replication. o If you are failing back to a new server, you may need to manually specify from a list of available recovery instances and map the data volumes. o The failback client will verify that the chosen recovery instance has connectivity to the Elastic Disaster Recovery service. o The replication software will be downloaded to the failback client and then configured. Connectivity will be made between the failback client and
    the replication agent on the recovery instance to begin data replication. 3. Return to the elastic disaster recovery console and recovery instances to see the current state of replication. Failing back to...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.11 to configure: Ensure execution of a failback.'
