id: TMA-AWS-STORAGE-6.6
title: Ensure installation of the AWS Replication Agent
description: Set up and verify the installation of the AWS Replication Agent on all relevant systems to facilitate efficient and reliable data replication. This process includes downloading the agent, configuring it according to best practices, and ensuring it is correctly integrated with your AWS environment. Regularly check the agent’s performance and update it as needed to maintain optimal functionality and data integrity during replication processes. Installing the AWS Replication Agent is crucial for enabling efficient and reliable data replication, ensuring that critical data is accurately duplicated across systems. Proper configuration and integration with your AWS environment optimize the agent’s performance, enhancing data availability and disaster recovery capabilities. Regular checks and updates of the replication agent help maintain its effectiveness, ensuring data integrity and minimi...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.6 Ensure installation of the AWS Replication Agent
audit:
  type: manual
  command: '1. On the source servers page, from Actions, choose add servers to obtain the agent installer link. 2. On your source server (in our case, the EC2 instance that was already created) download the appropriate agent installer for your operating system. o For Linux instance on US-East-1. Substitute your region in the {Region} brackets of this command: wget -O ./aws-replication-installer-init https://aws-elastic-disaster- recovery-us-east-1.s3.us-east-1.amazonaws.com/latest/linux/aws-replication- installer-init 3. Run following command: chmod +x aws-replication-installer-init; sudo ./aws-replication-installer- init 4. Type in your region. Region is case sensitive: if you’re in us-east-1, make sure you type “us-east-1”. 5. If you’re using SSH, you will be prompted with your activation ID and secret activation key. Make sure you have those accessible for the IAM user you’re using. You can generate a new key from the IAM dashboard if you forgot to save your key. 6. Select “Enter” to
    replicate all servers. 7. All servers should replicate. 8. Make sure your OS is up to date. If you run into an error replicating your devices, view the documentation on troubleshooting the AWS replication in...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Storage Services Benchmark v1.0.0 section 6.6 to configure: Ensure installation of the AWS Replication Agent.'
