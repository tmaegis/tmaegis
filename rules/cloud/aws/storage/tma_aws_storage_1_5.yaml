id: TMA-AWS-STORAGE-1.5
title: Ensure to create IAM roles for Backup
description: An AWS Identity and Access Management (IAM) role is similar to a user, in that it is an AWS identity with permissions policies that determine what the identity can and cannot do in AWS. However, instead of being uniquely associated with one person, a role is intended to be assumable by anyone who needs it. While Service Linked Roles offer quick deployment, using default configurations isn't recommended for security best practices.
target: aws
level: 2
severity: low
tags:
- aws
- backup
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 1.5 Ensure to create IAM roles for Backup
audit:
  type: manual
  command: 'To create a role for AWS Backup, follow these steps: 1. Navigate to the "IAM Dashboard" in the AWS Console. 2. Select "Roles" from the left-hand menu. 3. Click on the "Create Role" button. 4. Choose "AWS Service" as the trusted entity. 5. Select "AWS Backup" as the service that will use this role. 6. Choose a policy to apply to the role or create a custom policy. 7. Review the role details and provide a meaningful name for the role. 8. Click on "Create Role" to finalize the creation of the role for AWS Backup.'
remediation:
  type: iac_patch
  command: Assess your organization's needs to determine whether to utilize Service Linked Roles for AWS backups.
