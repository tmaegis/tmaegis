id: TMA-AWS-STORAGE-2.6
title: Ensure Proper IAM Configuration for EC2 Instances
description: IAM, or Identity and Access Management, is a vital security service used to control and manage access to AWS resources, ensuring only authorized users and services can interact with them. It allows you to create users and groups, set permissions, enforce multi-factor authentication, and implement least privilege principles to enhance security and compliance. The rationale behind using IAM is to enhance security by controlling and managing access to AWS resources, ensuring that only authorized users and services can interact with them. This minimizes the risk of unauthorized access and potential security breaches, while also allowing for the implementation of best practices such as multi- factor authentication and least privilege principles, which further strengthen the security and compliance of your AWS environment.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- iam
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 2.6 Ensure Proper IAM Configuration for EC2 Instances
audit:
  type: manual
  command: '1. Access the AWS Management Console: o Log in to your AWS account and navigate to the AWS Management Console. 2. Review IAM Users and Roles: o Go to the IAM Dashboard and select "Users" to review all user accounts. o Check each user for appropriate permissions, MFA enablement, and adherence to the principle of least privilege. o Similarly, review the "Roles" section to ensure roles have the correct permissions and are assigned appropriately. 3. Check IAM Policies: o In the IAM Dashboard, navigate to "Policies" and review both AWS managed and customer-managed policies. o Ensure that policies follow the principle of least privilege and do not grant excessive permissions. 4. Analyze IAM Groups: o Review the groups in the IAM Dashboard under "Groups." o Ensure that users are grouped appropriately and that groups have suitable permissions. 5. Examine MFA Settings: o Verify that Multi-Factor Authentication (MFA) is enabled for all users with console access. o In the IAM Dashboard,
    click on "Users" and check the "Security credentials" tab for each user to confirm MFA setup. 6. Audit IAM Activity: o Use AWS CloudTrail to review logs of IAM activities, including user logins, policy chan...'
remediation:
  type: iac_patch
  command: '1. Restrict Overly Permissive Policies: o Identify and modify any IAM policies that are overly permissive. Update policies to grant the least privilege necessary for users to perform their tasks. o Use IAM policy simulator to test and validate the changes to ensure they do not disrupt operations. 2. Enable Multi-Factor Authentication (MFA): o For all users with console access, enable MFA. This adds an additional layer of security. o Navigate to the IAM Dashboard, select "Users," and enable MFA under the "Security credentials" tab for each user. 3. Rotate Access Keys: o Regularly rotate access keys for IAM users to reduce the risk of compromised credentials. o In the IAM Dashboard, select "Users," go to the "Security credentials" tab, and create new access keys. Then, disable and delete old access keys after confirming the new keys are functioning correctly. 4. Remove Unnecessary Users and Roles: o Delete any IAM users or roles that are no longer needed to minimize potential security
