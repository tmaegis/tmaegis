id: TMA-AWS-STORAGE-6.1
title: Ensure Elastic Disaster Recovery is Configured
description: AWS Elastic Disaster Recovery is a service that enables you to create and maintain backups of your workloads on AWS, particularly your servers. This service is crucial for ensuring high resilience for your AWS workloads. It operates by establishing and maintaining backups in selected AWS regions, guaranteeing that your data is safe, durable, and highly available in the event of issues in the primary availability zone or region where your AWS server is located. AWS Elastic Disaster Recovery is crucial for establishing high resiliency in the cloud, synonymous with effective disaster recovery. High resiliency measures your organization's ability to respond to and recover from disasters impacting IT infrastructure. Achieving high resiliency minimizes downtime and long-term costs associated with outages, while low resiliency can result in prolonged downtime, potential data loss, and even p...
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- storage
reference: CIS AWS Storage Services Benchmark v1.0.0 - 6.1 Ensure Elastic Disaster Recovery is Configured
audit:
  type: manual
  command: '1. Review Disaster Recovery Plans: o Log in to the AWS Management Console. o Navigate to the AWS Elastic Disaster Recovery service. o Locate and open the disaster recovery plans. o Verify that the plans are current and comprehensive, covering all critical workloads. o Ensure that the plans specify clear recovery time objectives (RTO) and recovery point objectives (RPO). 2. Check Backup Configurations: o In the AWS Elastic Disaster Recovery dashboard, review the list of protected servers and workloads. o Confirm that backups are enabled for all critical servers and workloads. o Verify the backup schedule and frequency to ensure they meet organizational requirements. o Check that backups are being stored in the correct AWS regions as specified in the disaster recovery plan. 3. Test Recovery Procedures: o Identify a non-production environment to conduct recovery drills. o Initiate a simulated disaster scenario to test the recovery procedures. o Execute the recovery process for each
    critical workload. o Measure and document the time taken to recover each workload. o Compare the measured recovery times against the RTO and RPO. o Identify and document any issues or delays encountered...'
remediation:
  type: iac_patch
  command: '1. Update Disaster Recovery Plans: o Action: Log in to the AWS Management Console. o Procedure: ▪ Navigate to the AWS Elastic Disaster Recovery service. ▪ Locate and review the current disaster recovery plans. ▪ Update the plans to ensure they are comprehensive and cover all critical workloads. ▪ Ensure that the plans specify clear recovery time objectives (RTO) and recovery point objectives (RPO). ▪ Save and document the updated plans. 2. Correct Backup Configurations: o Action: Verify and adjust backup settings. o Procedure: ▪ In the AWS Elastic Disaster Recovery dashboard, review the list of protected servers and workloads. ▪ Enable backups for any critical servers and workloads that are not currently being backed up. ▪ Adjust the backup schedule and frequency to meet organizational requirements. ▪ Ensure backups are stored in the correct AWS regions as specified in the disaster recovery plan. 3. Conduct Recovery Procedure Drills: o Action: Test and refine recovery procedures.
    o Procedure: ▪ Identify a non-production environment to conduct recovery drills. ▪ Simulate a disaster scenario to test the recovery procedures. ▪ Execute the recovery process for each critical workload...'
