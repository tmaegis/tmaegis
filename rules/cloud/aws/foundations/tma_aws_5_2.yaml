id: TMA-AWS-5.2
title: Ensure management console sign-in without MFA is monitored
description: Real-time monitoring of API calls can be achieved by directing CloudTrail Logs to CloudWatch Logs or an external Security Information and Event Management (SIEM) environment, and establishing corresponding metric filters and alarms. It is recommended that a metric filter and alarm be established for console logins that are not protected by multi-factor authentication (MFA). CloudWatch is an AWS native service that allows you to observe and monitor resources and applications. CloudTrail logs can also be sent to an external Security Information and Event Management (SIEM) environment for monitoring and alerting. Monitoring for single-factor console logins will increase visibility into accounts that are not protected by MFA. These type of accounts are more susceptible to compromise and unauthorized access.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- mfa
- monitoring
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 5.2 Ensure management console sign-in without MFA is monitored
audit:
  type: manual
  command: 'If you are using CloudTrail trails and CloudWatch, perform the following to ensure that there is at least one active multi-region CloudTrail trail with the prescribed metric filters and alarms configured: 1. Identify the log group name that is configured for use with the active multi-region CloudTrail trail: - List all CloudTrail trails: aws cloudtrail describe-trails - Identify multi-region CloudTrail trails: Trails with "IsMultiRegionTrail" set to true - Note the value associated with "Name":<trail-name> - Note the <trail-log-group-name> within the value associated with "CloudWatchLogsLogGroupArn" o Example: arn:aws:logs:<region>:<account-id>:log- group:<trail-log-group-name>:* - Ensure the identified multi-region CloudTrail trail is active: aws cloudtrail get-trail-status --name <trail-name> o ensure IsLogging is set to TRUE - Ensure the identified multi-region CloudTrail trail captures all management events: aws cloudtrail get-event-selectors --trail-name <trail-name> o Ensure
    there is at least one event selector for a trail with IncludeManagementEvents set to true and ReadWriteType set to All 2. Get a list of all associated metric filters for the <trail-log-group-name> capt...'
remediation:
  type: iac_patch
  command: 'If you are using CloudTrail trails and CloudWatch, perform the following steps to set up the metric filter, alarm, SNS topic, and subscription: 1. Create a metric filter based on the provided filter pattern that checks for AWS Management Console sign-ins without MFA and uses the <trail-log-group- name> taken from audit step 1. aws logs put-metric-filter --log-group-name <trail-log-group-name> -- filter-name `<no-mfa-console-signin-metric>` --metric-transformations metricName= `<no-mfa-console-signin- metric>`,metricNamespace=''CISBenchmark'',metricValue=1 --filter-pattern ''{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes") }'' Or, to reduce false positives in case Single Sign-On (SSO) is used in the organization: aws logs put-metric-filter --log-group-name <trail-log-group-name> -- filter-name `<no-mfa-console-signin-metric>` --metric-transformations metricName= `<no-mfa-console-signin- metric>`,metricNamespace=''CISBenchmark'',metricValue=1 --filter-pattern
    ''{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes") && ($.userIdentity.type = "IAMUser") && ($.responseElements.ConsoleLogin = "Success") }'' Note: You can choose your own metric...'
