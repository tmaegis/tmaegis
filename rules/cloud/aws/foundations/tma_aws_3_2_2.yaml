id: TMA-AWS-3.2.2
title: Ensure the Auto Minor Version Upgrade feature is enabled for RDS instances
description: Ensure that RDS database instances have the Auto Minor Version Upgrade flag enabled to automatically receive minor engine upgrades during the specified maintenance window. This way, RDS instances can obtain new features, bug fixes, and security patches for their database engines. AWS RDS will occasionally deprecate minor engine versions and provide new ones for upgrades. When the last version number within a release is replaced, the changed version is considered minor. With the Auto Minor Version Upgrade feature enabled, version upgrades will occur automatically during the specified maintenance window, allowing your RDS instances to receive new features, bug fixes, and security patches for their database engines.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 3.2.2 Ensure the Auto Minor Version Upgrade feature is enabled for RDS instances
audit:
  type: manual
  command: 'From Console: 1. Log in to the AWS management console and navigate to the RDS dashboard at https://console.aws.amazon.com/rds/. 2. In the left navigation panel, click Databases. 3. Select the RDS instance that you want to examine. 4. Click on the Maintenance and backups panel. 5. Under the Maintenance section, search for the Auto Minor Version Upgrade status. - If the current status is Disabled, it means that the feature is not enabled, and the minor engine upgrades released will not be applied to the selected RDS instance. From Command Line: 1. Run the describe-db-instances command to list all RDS database names available in the selected AWS region: aws rds describe-db-instances --region --query ''DBInstances[*].[DBInstanceIdentifier,AutoMinorVersionUpgrade]'' --output table 2. The command output should return each database instance identifier. 3. Run the describe-db-instances command again using a RDS instance identifier returned earlier to determine the Auto Minor Version
    Upgrade status for the selected instance: aws rds describe-db-instances --region <region-name> --db-instance-identifier <db-instance-identifier> --query ''DBInstances[*].AutoMinorVersionUpgrade'' 4. The command...'
remediation:
  type: iac_patch
  command: 'From Console: 1. Log in to the AWS management console and navigate to the RDS dashboard at https://console.aws.amazon.com/rds/. 2. In the left navigation panel, click Databases. 3. Select the RDS instance that you want to update. 4. Click on the Modify button located at the top right side. 5. On the Modify DB Instance: <instance identifier> page, In the Maintenance section, select Auto minor version upgrade and click the Yes radio button. 6. At the bottom of the page, click Continue, and check Apply Immediately to apply the changes immediately, or select Apply during the next scheduled maintenance window to avoid any downtime. 7. Review the changes and click Modify DB Instance. The instance status should change from available to modifying and back to available. Once the feature is enabled, the Auto Minor Version Upgrade status should change to Yes. From Command Line: 1. Run the describe-db-instances command to list all RDS database instance names available in the selected AWS
