id: TMA-AWS-4.9
title: Ensure that object-level logging for read events is enabled for S3 buckets
description: S3 object-level API operations, such as GetObject, DeleteObject, and PutObject, are referred to as data events. By default, CloudTrail trails do not log data events, so it is recommended to enable object-level logging for S3 buckets. Enabling object-level logging will help you meet data compliance requirements within your organization, perform comprehensive security analyses, monitor specific patterns of user behavior in your AWS account, or take immediate actions on any object-level API activity within your S3 buckets using Amazon CloudWatch Events.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- logging
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 4.9 Ensure that object-level logging for read events is enabled for S3 buckets
audit:
  type: manual
  command: 'From Console: 1. Login to the AWS Management Console and navigate to the CloudTrail dashboard at https://console.aws.amazon.com/cloudtrail/. 2. In the left panel, click Trails, and then click the name of the trail that you want to examine. 3. Review General details. 4. Confirm that Multi-region trail is set to Yes 5. Scroll down to Data events 6. Scroll down to Data events and confirm the configuration: - If advanced event selectors is being used, it should read: Data Events: S3 Log selector template Log all events - If basic event selectors is being used, it should read: Data events: S3 Bucket Name: All current and future S3 buckets Read: Enabled 6. Repeat steps 2-5 to verify that each trail has multi-region enabled and is configured to log data events. If a trail does not have multi-region enabled and data event logging configured, refer to the remediation steps. From Command Line: 1. Run the describe-trails command to list all trail names: aws cloudtrail describe-trails --region
    <region-name> --output table --query trailList[*].Name 2. The command output will be table of the trail names. 3. For each trail, run the get-trail command to verify it is a multi-regional trail: aws...'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the AWS Management Console and navigate to S3 dashboard at https://console.aws.amazon.com/s3/. 2. In the left navigation panel, click buckets and then click the name of the S3 bucket that you want to examine. 3. Click the Properties tab to see the bucket configuration in detail. 4. In the AWS Cloud Trail data events section, select the trail name for recording activity. You can choose an existing trail or create a new one by clicking the Configure in CloudTrail button or navigating to the CloudTrail console. 5. Once the trail is selected, select the Data Events check box. 6. Select S3 from the Data event type drop-down. 7. Select Log all events from the Log selector template drop-down. 8. Repeat steps 2-7 to enable object-level logging of read events for other S3 buckets. From Command Line: 1. To enable object-level data events logging for S3 buckets within your AWS account, run the put-event-selectors command using the name of the trail that you want
