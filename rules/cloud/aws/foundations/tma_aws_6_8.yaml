id: TMA-AWS-6.8
title: Ensure VPC Endpoints are used for access to AWS Services
description: Ensure that Amazon VPCs use VPC endpoints (gateway or interface endpoints) for access to AWS services such as Amazon S3 and DynamoDB, so that traffic from workloads to AWS services stays on the Amazon private network instead of traversing the public internet. VPC endpoints provide private connectivity between VPCs and supported AWS services without requiring an internet gateway, NAT gateway, or public IP addresses. Accessing AWS services over the public internet increases exposure to network-level threats, relies on internet routing, and makes it harder to tightly control egress paths. Using VPC endpoints allows workloads to reach AWS services over the Amazon private network, which reduces reliance on internet gateways and NAT gateways, simplifies egress filtering, and helps enforce data-perimeter and “private-only” patterns for sensitive workloads.
target: aws
level: 2
severity: low
tags:
- access-control
- aws
- cloud
- network
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 6.8 Ensure VPC Endpoints are used for access to AWS Services
audit:
  type: manual
  command: 1. Identify in-scope VPCs and services. - Determine which VPCs host production or sensitive workloads that should access AWS services securely via endpoints. - For those VPCs, identify the AWS services they depend on (for example, S3 for data storage, DynamoDB for database, etc.). 2. For each in-scope VPC, check for existing VPC endpoints. aws ec2 describe-vpc-endpoints \ --region REGION \ --filters "Name=vpc-id,Values=VPC_ID" \ --query "VpcEndpoints[*].[VpcEndpointId,VpcEndpointType,ServiceName,State]" \ --output table - Provide the REGION and VPC_ID - VpcEndpointType tells you whether the endpoint is Gateway or Interface. - ServiceName shows which AWS service the endpoint is for (for example, com.amazonaws.us-east-1.s3, com.amazonaws.us-east-1.dynamodb, com.amazonaws.us-east-1.ssm). 3. For each interface endpoint, verify subnet attachment across relevant AZs/subnets. aws ec2 describe-vpc-endpoints \ --region REGION \ --vpc-endpoint-ids INTERFACE_ENDPOINT_ID \ --query "VpcEndpoints[*].[VpcEndpointId,ServiceName,SubnetIds,State]"
    \ --output json - Provide the REGION and INTERFACE_ENDPOINT_ID 4. For each gateway endpoint, verify that the route tables for the relevant subnets send...
remediation:
  type: iac_patch
  command: 'In this example, we are going to add S3 gateway endpoint and SQS interface endpoint to a VPC. You can follow similar remediation instructions for other services. 1. Create S3 Gateway Endpoint aws ec2 create-vpc-endpoint \ --region REGION \ --route-table-ids ROUTE_TABLE_ID \ --vpc-id VPC_ID \ --service-name com.amazonaws.REGION.s3 \ --vpc-endpoint-type Gateway \ --query "VpcEndpoint.VpcEndpointId" \ --output text - Provide values for REGION, ROUTE_TABLE_ID, VPC_ID - AWS automatically creates the routes for the AWS service in the route table provided as part of above command. 2. Verify that the gateway routes have been adequately created aws ec2 describe-route-tables \ --region REGION --route-table-ids ROUTE_TABLE_ID \ --query "RouteTables[0].Routes[?DestinationPrefixListId==''pl-xxxxxxxx'']" - Provide values for REGION, ROUTE_TABLE_ID - pl-xxxxxxxx : replace with the specific prefix list for S3 in that region 3. Create an SQS Interface Endpoint aws ec2 create-vpc-endpoint \ --vpc-id
    VPC_ID \ --service-name com.amazonaws.REGION.sqs \ --vpc-endpoint-type Interface \ --subnet-ids PRIVATE_SUBNET_1_ID PRIVATE_SUBNET_2_ID \ --security-group-ids SECURITY_GROUP_ID \ --vpc-endpoint-policy V...'
