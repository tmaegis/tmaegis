id: TMA-AWS-5.10
title: Ensure security group changes are monitored
description: Real-time monitoring of API calls can be achieved by directing CloudTrail Logs to CloudWatch Logs or an external Security Information and Event Management (SIEM) environment, and establishing corresponding metric filters and alarms. Security groups are stateful packet filters that control ingress and egress traffic within a VPC. It is recommended that a metric filter and alarm be established to detect changes to security groups. CloudWatch is an AWS native service that allows you to observe and monitor resources and applications. CloudTrail logs can also be sent to an external Security Information and Event Management (SIEM) environment for monitoring and alerting. Monitoring changes to security groups will help ensure that resources and services are not unintentionally exposed.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- monitoring
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 5.10 Ensure security group changes are monitored
audit:
  type: manual
  command: 'If you are using CloudTrail trails and CloudWatch, perform the following to ensure that there is at least one active multi-region CloudTrail trail with the prescribed metric filters and alarms configured: 1. Identify the log group name that is configured for use with the active multi-region CloudTrail trail: - List all CloudTrail trails: aws cloudtrail describe-trails - Identify multi-region CloudTrail trails: Trails with "IsMultiRegionTrail" set to true - Note the value associated with "Name":<trail-name> - Note the <trail-log-group-name> within the value associated with "CloudWatchLogsLogGroupArn" o Example: arn:aws:logs:<region>:<account-id>:log- group:<trail-log-group-name>:* - Ensure the identified multi-region CloudTrail trail is active: o aws cloudtrail get-trail-status --name <trail-name> § Ensure IsLogging is set to TRUE - Ensure the identified multi-region CloudTrail trail captures all management events: o aws cloudtrail get-event-selectors --trail-name <trail-name>
    § Ensure there is at least one event selector for a trail with IncludeManagementEvents set to true and ReadWriteType set to All 2. Get a list of all associated metric filters for the <trail-log-group-name>...'
remediation:
  type: iac_patch
  command: 'If you are using CloudTrail trails and CloudWatch, perform the following steps to set up the metric filter, alarm, SNS topic, and subscription: 1. Create a metric filter based on the provided filter pattern that checks for security groups changes and uses the <trail-log-group-name> taken from audit step 1: aws logs put-metric-filter --log-group-name <trail-log-group-name> -- filter-name <security-group-changes-metric> --metric-transformations metricName=<security-group-changes- metric>,metricNamespace="CISBenchmark",metricValue=1 --filter-pattern "{ ($.eventName = AuthorizeSecurityGroupIngress) || ($.eventName = AuthorizeSecurityGroupEgress) || ($.eventName = RevokeSecurityGroupIngress) || ($.eventName = RevokeSecurityGroupEgress) || ($.eventName = CreateSecurityGroup) || ($.eventName = DeleteSecurityGroup) || ($.eventName = ModifySecurityGroupRules) }" Note: You can choose your own metricName and metricNamespace strings. Using the same metricNamespace for all Foundations Benchmark
    metrics will group them together. 2. Create an SNS topic that the alarm will notify: aws sns create-topic --name <sns-topic-name> Note: You can execute this command once and then reuse the same topic...'
