id: TMA-AWS-2.2
title: Maintain current AWS account contact details
description: Ensure contact email and telephone details for AWS accounts are current and mapped to more than one individual in your organization. An AWS account supports a number of contact details, and AWS will use these to contact the account owner if activity judged to be in breach of the Acceptable Use Policy or indicative of a likely security compromise is observed by the AWS Abuse team. Contact details should not be associated with a single individual, as circumstances may arise where that individual is unavailable. Email contact details should point to a mail alias that forwards messages to multiple individuals within the organization; where feasible, phone contact details should point to a PABX hunt group or other call- forwarding system. In AWS Organizations environments, this applies to all member accounts, not just the management account. If an AWS account is observed to be behaving in...
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 2.2 Maintain current AWS account contact details
audit:
  type: manual
  command: This activity can only be performed via the AWS Console, with a user who has permission to read and write Billing information (aws-portal:*Billing). 1. Sign in to the AWS Management Console and open the Billing and Cost Management console at https://console.aws.amazon.com/billing/home#/. 2. On the navigation bar, choose your account name, and then choose Account. 3. Under Contact Information, review and verify the current details.
remediation:
  type: iac_patch
  command: 'This activity can only be performed via the AWS Console, with a user who has permission to read and write Billing information (aws-portal:*Billing). From Console: 1. Sign in to the AWS Management Console and open the Billing and Cost Management console at https://console.aws.amazon.com/billing/home#/. 2. On the navigation bar, choose your account name, and then choose Account. 3. On the Account Settings page, next to Account Settings, choose Edit. 4. Next to the field that you need to update, choose Edit. 5. After you have entered your changes, choose Save changes. 6. After you have made your changes, choose Done. 7. To edit your contact information, under Contact Information, choose Edit. 8. For the fields that you want to change, type your updated information, and then choose Update. From Command Line: 1. Run the following command: aws account get-contact-information ''{ "AddressLine1": "<AddressLine 1>", "AddressLine2": "<AddressLine 2>", "City": "<City>", "CompanyName": "<Company
    Name>", "CountryCode": "<Country Code>", "FullName": "<Full Name>", "PhoneNumber": "<Phone Number>", "PostalCode": "<Postal Code>", "StateOrRegion": "<State or Region>" }'''
