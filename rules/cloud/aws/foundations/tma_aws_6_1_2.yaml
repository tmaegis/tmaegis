reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 6.1.2 Ensure CIFS access is restricted to trusted networks to prevent unauthorized access
audit:
  type: manual
  command: 'From Console: 1. Login to the AWS Management Console. 2. Navigate to the EC2 Dashboard and select the Security Groups section under Network & Security. 3. Identify the security groups associated with instances or resources that may be using CIFS. 4. Review the inbound rules of each security group to check for rules that allow unrestricted access on port 445 (the port used by CIFS). o Specifically, look for inbound rules that allow access from 0.0.0.0/0 or ::/0 on port 445. 5. Document any instances where unrestricted access is allowed and verify whether it is necessary for the specific use case. From Command Line: 1. Run the following command to list all security groups and identify those associated with CIFS: aws ec2 describe-security-groups --region <region-name> --query ''SecurityGroups[*].GroupId'' 2. Check for any inbound rules that allow unrestricted access on port 445 using the following command: aws ec2 describe-security-groups --region < region-name > --group-ids < security-group-id
