remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the AWS Management Console and open the RDS dashboard at https://console.aws.amazon.com/rds/. 2. In the left navigation panel, click on Databases. 3. Select the Database instance that needs to be encrypted. 4. Click the Actions button placed at the top right and select Take Snapshot. 5. On the Take Snapshot page, enter the name of the database for which you want to take a snapshot in the Snapshot Name field and click on Take Snapshot. 6. Select the newly created snapshot, click the Action button placed at the top right, and select Copy snapshot from the Action menu. 7. On the Make Copy of DB Snapshot page, perform the following: - In the New DB Snapshot Identifier field, enter a name for the new snapshot. - Check Copy Tags. The new snapshot must have the same tags as the source snapshot. - Select Yes from the Enable Encryption dropdown list to enable encryption. You can choose to use the AWS default encryption key or a custom key from the Master Key
