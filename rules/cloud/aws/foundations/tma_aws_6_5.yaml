id: TMA-AWS-6.5
title: Ensure the default security group of every VPC restricts all traffic
description: 'A VPC comes with a default security group whose initial settings deny all inbound traffic, allow all outbound traffic, and allow all traffic between instances assigned to the security group. If a security group is not specified when an instance is launched, it is automatically assigned to this default security group. Security groups provide stateful filtering of ingress/egress network traffic to AWS resources. It is recommended that the default security group restrict all traffic, both inbound and outbound. The default VPC in every region should have its default security group updated to comply with the following: - No inbound rules. - No outbound rules. Any newly created VPCs will automatically contain a default security group that will need remediation to comply with this recommendation. Note: When implementing this recommendation, VPC flow logging is invaluable in determining the l...'
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- network
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 6.5 Ensure the default security group of every VPC restricts all traffic
audit:
  type: manual
  command: 'Perform the following to determine if the account is configured as prescribed: Security Group State 1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home. 2. Repeat the following steps for all VPCs, including the default VPC in each AWS region: 3. In the left pane, click Security Groups. 4. For each default security group, perform the following: o Select the default security group. o Click the Inbound Rules tab and ensure no rules exist. o Click the Outbound Rules tab and ensure no rules exist. Security Group Members 1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home. 2. Repeat the following steps for all default groups in all VPCs, including the default VPC in each AWS region: 3. In the left pane, click Security Groups. 4. Copy the ID of the default security group. 5. Change to the EC2 Management Console at https://console.aws.amazon.com/ec2/v2/home. 6. In the filter column type Security Group ID : <security-group-id-from- step-4>.'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the prescribed state: Security Group Members 1. Identify AWS resources that exist within the default security group. 2. Create a set of least-privilege security groups for those resources. 3. Place the resources in those security groups, removing the resources noted in step 1 from the default security group. From Console: 1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home. 2. Repeat the following steps for all VPCs, including the default VPC in each AWS region: 3. In the left pane, click Security Groups. 4. For each default security group, perform the following: o Select the default security group. o Click the Inbound Rules tab. o Remove any inbound rules. o Click the Outbound Rules tab. o Remove any Outbound rules. From Command Line: 1. List all default security groups in the specified region aws ec2 describe-security-groups --region <region-name> --query ''SecurityGroups[?GroupName == `default`]'' 2. Check if the inbound
    rules (IpPermissions) and outbound rules (IpPermissionsEgress) of the default security group are empty. If the rules are not empty, proceed and note down the Security Group ID (GroupId) of the security g...'
