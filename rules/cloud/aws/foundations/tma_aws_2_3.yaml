id: TMA-AWS-2.3
title: Ensure security contact information is registered
description: AWS provides customers with the option to specify contact information for the account's security team. It is recommended that this information be configured. In AWS Organizations environments, this applies to all member accounts. Specifying security-specific contact information helps ensure that security advisories sent by AWS reach the team within your organization that is best equipped to respond to them.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 2.3 Ensure security contact information is registered
audit:
  type: manual
  command: 'Perform the following to determine if security contact information is present: From Console: 1. Click on your account name at the top right corner of the console 2. From the drop-down menu, Click Account 3. Scroll down to the Alternate Contacts section 4. Ensure contact information is specified in the Security contact section From Command Line: 1. Run the following command: aws account put-alternate-contact --alternate-contact-type SECURITY --email- address "" --name "" --phone-number "" 2. Ensure proper contact information is specified for the Security contact.'
remediation:
  type: iac_patch
  command: 'Perform the following to establish security contact information: From Console: 1. Click on your account name at the top right corner of the console 2. From the drop-down menu click My Account 3. Scroll down to the Alternate Contacts section 4. Enter contact information in the Security section From Command Line: Run the following command with the following input parameters: --email-address, -- name, and --phone-number. aws account put-alternate-contact --alternate-contact-type SECURITY --email- address "" --name "" --phone-number "" Note: Consider specifying an internal email distribution list to ensure emails are regularly monitored by more than one individual.'
