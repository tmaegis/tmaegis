id: TMA-AWS-6.1.1
title: Ensure EBS volume encryption is enabled in all regions
description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service. While disabled by default, forcing encryption at EBS volume creation is supported. Encrypting data at rest reduces the likelihood of unintentional exposure and can nullify the impact of disclosure if the encryption remains unbroken.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- encryption
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 6.1.1 Ensure EBS volume encryption is enabled in all regions
audit:
  type: manual
  command: 'From Console: 1. Login to the AWS Management Console and open the Amazon EC2 console using https://console.aws.amazon.com/ec2/. 2. Under Account attributes, click Data Protection and Security. 3. Under EBS encryption, verify that Always encrypt new EBS volumes displays Enabled. 4. Repeat for each region in use. Note: EBS volume encryption is configured per region. From Command Line: 1. Run the following command: aws --region <region> ec2 get-ebs-encryption-by-default 2. Verify that "EbsEncryptionByDefault": true is displayed. 3. Repeat for each region in use. Note: EBS volume encryption is configured per region.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to the AWS Management Console and open the Amazon EC2 console using https://console.aws.amazon.com/ec2/. 2. Under Account attributes, click Data protection and security. 3. Under EBS encryption, Click Manage. 4. Check the Enable box to default encryption. 5. Click Update EBS encryption. 6. Repeat for each region in which EBS volume encryption is not enabled by default. Note: EBS volume encryption is configured per region. From Command Line: 1. Run the following command: aws --region <region> ec2 enable-ebs-encryption-by-default 2. Verify that "EbsEncryptionByDefault": true is displayed. 3. Repeat for each region in which EBS volume encryption is not enabled by default. Note: EBS volume encryption is configured per region.'
