id: TMA-AWS-2.9
title: Ensure IAM password policy prevents password reuse
description: IAM password policies can prevent the reuse of passwords by the same user. It is recommended that the password policy be configured to prevent password reuse. Preventing password reuse increases account resilience against brute force and credential reuse attacks.
target: aws
level: 1
severity: medium
tags:
- auth
- aws
- cloud
- iam
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 2.9 Ensure IAM password policy prevents password reuse
audit:
  type: manual
  command: 'Perform the following to ensure the password policy is configured as prescribed: From Console: 1. Sign in to the AWS Management Console and open the IAM console at https://console.aws.amazon.com/iam 2. Click on Account Settings on the left Pane 3. Ensure Prevent password reuse is checked 4. Ensure Remember XX password(s) is set appropriately (e.g., 24 or greater) From Command Line: 1. Run the following command: aws iam get-account-password-policy 2. Ensure the output includes: "PasswordReusePrevention": 24'
remediation:
  type: iac_patch
  command: 'Perform the following to set the password policy as prescribed: From Console: 1. Login to AWS Console (with appropriate permissions to View Identity Access Management Account Settings) 2. Go to IAM Service 3. Select Account Settings on the left Pane 4. Check Prevent password reuse 5. Set Remember XX password(s) to 24 or greater From Command Line: 1. Run the following command: aws iam update-account-password-policy --password-reuse-prevention 24 Note: All commands starting with "aws iam update-account-password-policy" can be combined into a single command.'
