id: TMA-AWS-3.1.2
title: Ensure MFA Delete is enabled on S3 buckets
description: Once MFA Delete is enabled on your sensitive and classified S3 bucket, it requires the user to provide two forms of authentication. Adding MFA delete to an S3 bucket requires additional authentication when you change the version state of your bucket or delete an object version, adding another layer of security in the event your security credentials are compromised or unauthorized access is granted.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- mfa
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - 3.1.2 Ensure MFA Delete is enabled on S3 buckets
audit:
  type: manual
  command: 'Perform the steps below to confirm that MFA delete is configured on an S3 bucket: From Console: 1. Login to the S3 console at https://console.aws.amazon.com/s3/. 2. Click the check box next to the name of the bucket you want to confirm. 3. In the window under Properties: - Confirm that Versioning is Enabled - Confirm that MFA Delete is Enabled From Command Line: 1. Run the get-bucket-versioning command: aws s3api get-bucket-versioning --bucket my-bucket | grep MfaDelete Example output: <VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"> <Status>Enabled</Status> <MfaDelete>Enabled</MfaDelete> </VersioningConfiguration> If the console or CLI output does not show that Versioning and MFA Delete are enabled, please refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the steps below to enable MFA delete on an S3 bucket: Note: - You cannot enable MFA Delete using the AWS Management Console; you must use the AWS CLI or API. - You must use your ''root'' account to enable MFA Delete on S3 buckets. From Command line: 1. Run the s3api put-bucket-versioning command: aws s3api put-bucket-versioning \ --bucket my-bucket \ --versioning-configuration Status=Enabled,MFADelete=Enabled \ --mfa "arn:aws:iam::<account-id>:mfa/root-account-mfa-device <MFA-code>"'
