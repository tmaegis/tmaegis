id: TMA-AWS-EUC-2.7
title: Ensure access is limited to trusted devices
description: WorkSpaces access should be restricted to trusted devices with valid certificates. WorkSpaces is accessible from any supported device that is connected to the internet. When you enable access to trusted devices, Amazon WorkSpaces uses certificate- based authentication to determine whether a device is trusted.
target: aws
level: 2
severity: low
tags:
- access-control
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.7 Ensure access is limited to trusted devices
audit:
  type: manual
  command: 'Perform the following steps to confirm that Allow Trusted Devices is set. From the Console: 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select the directory id link. 4. Scroll to the Access Control Options section. 5. Confirm that the correct Allow settings are in place. 6. Confirm that certificates have been imported. 7. Confirm that the correct device types have been enabled. If everything is not configured as above refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to set the restriction Allow Trusted Devices Create the Certificates Note - It requires root certificates generated by an internal Certificate Authority (CA) and client certificates that chain up to a root certificate. Requirements - Certificates must be Base64-encoded certificate files in CRT, CERT, or PEM format. - Certificates must include a Common Name. - The maximum length of certificate chain supported is 4. - Use a strong encryption algorithm. Minimum SHA256 with RSA, SHA256 with ECDSA. Other options SHA381 with ECDSA, or SHA512 with ECDSA. - Make sure "key usage: Digital signature" is present on the public key. - For macOS, if the device certificate is in the system keychain, authorize the WorkSpaces client application to access those certificates. Deploy Client Certificates to the Trusted Devices - Client certificates must be installed on the trusted devices for your users. Utilize a third party tool to install the certificates or have the
    certificates installed locally by an administrator. - On Windows, the WorkSpaces client application searches for client certificates in both the user and root certificate stores. - On macOS, the WorkSpaces...'
