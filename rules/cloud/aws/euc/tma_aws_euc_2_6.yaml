id: TMA-AWS-EUC-2.6
title: Ensure Web Access to Workspaces is Disabled
description: WorkSpaces access should be restricted to trusted operating systems and clients WorkSpaces access is supported from a variety of clients and operating systems, including HTML5 based browsers. Disabling Web Access prevents access to the Workspace from HTML5 based browsers, ensuring access can only occur from known operating systems.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.6 Ensure Web Access to Workspaces is Disabled
audit:
  type: manual
  command: 'Perform the following steps to confirm that Web Access is disabled. From the Console: 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select the directory id link you wish to view. 4. Scroll to the Other platforms section. 5. Confirm that Web Access is denied. If everything is not configured as above refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to disable Web Access. From the Console: 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select the directory id link. 4. Scroll to the Other platforms section. 5. Uncheck Web Access. 6. Click Save'
