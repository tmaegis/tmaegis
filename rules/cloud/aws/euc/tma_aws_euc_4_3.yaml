id: TMA-AWS-EUC-4.3
title: Ensure Workdocs access is limited to a range of allowable IP addresses
description: Access to WorkDocs can be limited to an allowed range of IP addresses. Using IP address allow lists, you define and permit access to your WorkDocs site from trusted networks.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.3 Ensure Workdocs access is limited to a range of allowable IP addresses
audit:
  type: manual
  command: 'Perform these steps to review the list of IP addresses allowed to access WorkDocs From the Console: 1. Log into the AWS console. 2. Navigate to WorkDocs or go to WorkDocs Console at https://console.aws.amazon.com/zocalo/ 3. Under My Account, choose Open admin control panel. 4. For IP Allow List, choose Change. 5. Review the IP address ranges and any single IP addresses 6. Click Cancel. If the IP address ranges do not match trusted networks refer to the remediation below to create or edit the IP Allow list.'
remediation:
  type: iac_patch
  command: 'Perform the steps below to create or edit the IP Allow list for WorkDocs From the Console: 1. Log into the AWS console. 2. Navigate to WorkDocs or go to WorkDocs Console at https://console.aws.amazon.com/zocalo/ 3. Under My Account, choose Open admin control panel. 4. For IP Allow List, choose Change. 5. For Enter CIDR value, enter the IP address ranges to allowlist. To allow access from a single IP address, specify /32 as the CIDR prefix. 6. Click Add. 7. Click Save Changes.'
