id: TMA-AWS-EUC-2.11
title: Ensure your WorkSpaces image has the appropriate CIS Operating System Benchmark applied
description: Utilize the CIS Benchmark to secure the Operating system image that you are utilizing for your WorkSpaces. Securing the Operating system with a CIS Benchmark ensures all systems remain in a secure, compliant and hardened state.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.11 Ensure your WorkSpaces image has the appropriate CIS Operating System Benchmark applied
audit:
  type: manual
  command: Spin up a WorkSpaces instance and run a manual assessment by confirming the CIS Operating System Benchmark recommendations for the applicable operating system are applied. You can also utilize a 3rd Party Assessment tool that has been certified for the specific CIS Operating System Benchmark to automate this process.
remediation:
  type: iac_patch
  command: 'Perform the steps below using the downloaded free version of the applicable CIS Operating System Benchmark and manually apply the recommendations for the WorkSpaces instance. Or Utilize a 3rd Party tool to assess and apply the CIS Operating System Benchmark. 1. Launch a WorkSpaces Bundle 2. Access that WorkSpace as an Administrator utilize SSH or RDP. 3. Apply the Benchmark: - Manually - Using Active Directory by creating a GPO that matches the Benchmark. - Or using a Third Party tool that will apply the Benchmark recommendations. 4. Assess the WorkSpaces instance manually or with a 3rd Party tool. 5. Create a workspace bundle that can then be used to launch your production WorkSpaces instances.'
