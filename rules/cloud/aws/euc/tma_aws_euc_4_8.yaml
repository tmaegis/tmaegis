id: TMA-AWS-EUC-4.8
title: Ensure any user that has not accessed WorkDocs in 30 days is set to inactive.
description: User accounts that are not actively using the WorkDocs service should be set to inactive after a period of 30 days. Inactive accounts may appear to not pose a problem but they can provide unauthorized access to files within WorkDocs.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.8 Ensure any user that has not accessed WorkDocs in 30 days is set to inactive.
audit:
  type: manual
  command: Perform the following steps to review list of users From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Under My Account, choose Open admin control panel. 3. Under Manage Users, choose Download user. 4. For Download user, choose All users 5. Review the file to determine if any users have not accessed WorkDocs in the past 30 days. If you find any users that have not accessed WorkDocs in the past 30 days refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the steps below to disable a user's access by changing their status to Inactive. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator. 2. Under My Account, click Open admin control panel. 3. Under Manage Users, choose the pencil icon next to the user's name that needs to be set as inactive. 4. Choose Inactive, and Click Save Changes The inactivated user no longer has access to your Amazon WorkDocs site.
