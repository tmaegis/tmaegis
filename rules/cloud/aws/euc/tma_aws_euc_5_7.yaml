id: TMA-AWS-EUC-5.7
title: Ensure Operating system updates are applied to your base image every 30 days.
description: To ensure that your fleet instances have the latest Windows updates installed, we recommend that you install Windows updates on your image builder, create a new image, and then update your fleet with the new image once a month. All fleet instances used in user streaming sessions have only the Windows and application updates that were installed on the underlying image when it was created. In addition, any updates made to Windows or to applications on the instance during the streaming session will not persist to future sessions by the same user or other users.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
- patching
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.7 Ensure Operating system updates are applied to your base image every 30 days.
audit:
  type: manual
  command: Perform the following steps to review the Image date. From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Images 3. Select the Image Builder tab 4. Select the link for the Image builder name you wish to view. 5. In the Image builder details tab review the Created at date and the AppStream agent version. If the created at date is over 30 days old refer to the remediation below.
remediation:
  type: iac_patch
  command: 'Perform the steps below to create an image and update it. From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. Click Images in the left pane, then Click the Image Builder tab, and Click Launch Image Builder. 3. Choose a base image. The latest base images released by AWS is recommended and selected by default. 4. Click Next. 5. Configure Image Builder, by doing the following: - Name: Type a unique name identifier for the image builder. -Display name (optional): Type a name to display for the image builder (maximum of 100 characters). - Tags (optional): Choose Add Tag, and type the key and value for the tag. To add more tags, repeat this step. - Instance Type: Select the instance type for the image builder. - Network Access Points (Optional): You can create a private link, which is an interface VPC endpoint (interface endpoint), in your virtual private cloud (VPC). To start creating the interface endpoint, select Create PrivateLink.
    - After you create the interface endpoint, you can use it to keep streaming traffic within your VPC. - AppStream 2.0 Agent: This section displays only if you are not using the latest version of the age...'
