id: TMA-AWS-EUC-5.3
title: Ensure maximum session duration is no longer than 10 hours
description: When creating a fleet for AppStream 2.0 configure the Maximum session duration in minutes to be no greater than 600. Having a session duration lasting longer than 10 hours should not be necessary and if running for any malicious reasons provides a greater time for usage than should be allowed.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.3 Ensure maximum session duration is no longer than 10 hours
audit:
  type: manual
  command: Perform the following steps to view the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to view. 4. On the Fleet configuration section confirm that Maximum session duration is set to 600 minutes or less. If Maximum session duration is set to anything greater than 600 minutes refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the following steps to edit the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to edit. 4. Click Actions, Stop 5. Scroll to the Fleet configuration section and click Edit 6. Change the Maximum session duration is set to 600 minutes or less and click Save Changes 7. Click Actions, Start
