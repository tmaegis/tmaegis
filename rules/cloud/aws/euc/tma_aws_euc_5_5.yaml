id: TMA-AWS-EUC-5.5
title: Ensure session Idle disconnect timeout is set to 10 minutes or less
description: Idle disconnect timeout in minutes is the amount of time that users can be inactive before they are disconnected from their streaming session and the Disconnect timeout in minutes time begins. Users are considered idle when they stop providing keyboard or mouse input during their streaming session. File uploads and downloads, audio in, audio out, and pixels changing do not qualify as user activity. Once disconnected from their streaming session the Disconnect timeout begins.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.5 Ensure session Idle disconnect timeout is set to 10 minutes or less
audit:
  type: manual
  command: Perform the following steps to view the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to view. 4. Scroll to the Fleet configuration section and confirm that Idle disconnect timeout is set to 10 minutes or less. If Idle disconnect timeout is set to anything greater than 10 minutes refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the following steps to view the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to view. 4. Scroll to the Fleet configuration section and click Edit 5. Change the Idle disconnect timeout to 5 minutes or less and click Save changes
