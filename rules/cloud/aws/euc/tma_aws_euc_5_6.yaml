id: TMA-AWS-EUC-5.6
title: Ensure internet access is granted and managed through your VPC
description: Default Internet Access from your fleet streaming instances should remain unchecked. When Default Internet Access is enabled, AppStream 2.0 uses the internet gateway in the VPC public subnet to connect to the public internet. The streaming instances are then assigned public IP addresses that are directly accessible from the internet. Internet Access from fleet streaming instances should be controlled using a NAT gateway in the VPC. When Default Internet Access is not enabled, streaming instances are assigned a private IP address that are not directly accessible from the internet.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- euc
- network
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.6 Ensure internet access is granted and managed through your VPC
audit:
  type: manual
  command: Perform the following steps to view the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to view. 4. On the Network details section confirm that Default Internet Access is set to Disabled. If Default internet access is not set to disabled refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the following steps to view the Fleet settings in AppStream From the console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to edit. 4. Click Actions, Stop 5. Scroll to the Network details section and click Edit 6. Deselect Default Internet Access 7. Click Save changes
