id: TMA-AWS-EUC-5.4
title: Ensure session disconnect timeout is set to 5 minutes or less
description: Disconnect timeout in minutes, is the amount of of time that a streaming session remains active after users disconnect. If users try to reconnect to the streaming session after a disconnection or network interruption within the 5 minutes, they are connected to their previous session. Otherwise, they are connected to a new session with a new streaming instance and that instance isn't sitting out there not being used.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.4 Ensure session disconnect timeout is set to 5 minutes or less
audit:
  type: manual
  command: Perform the following steps to view the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to view. 4. On the Fleet configuration section confirm that Disconnect timeout is set to 5 minutes minutes or less. If Disconnect timeout is set to anything greater than 5 minutes refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the following steps to update the Fleet settings in AppStream From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane click on Fleets. 3. Select the link for the fleet name you wish to edit. 4. Scroll to the Fleet configuration section and click Edit 5. Change the Disconnect timeout to 5 minutes or less.
