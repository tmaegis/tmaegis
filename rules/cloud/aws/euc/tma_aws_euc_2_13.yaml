id: TMA-AWS-EUC-2.13
title: Ensure Workspaces images are not older than 90 days.
description: WorkSpaces images should not have a creation time stamp over 90 days. WorkSpaces images require Operating system patches to be applied and updated and by confirming the creation date is not over 90 days old can help ensure that updates are being applied.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.13 Ensure Workspaces images are not older than 90 days.
audit:
  type: manual
  command: 'Perform the following to determine the age of WorkSpaces images. From the Console: 1. Login to the WorkSpaces dashboard at https://console.aws.amazon.com/workspaces/ 2. In the left pane click Images. 3. Review the Created date and confirm that all images are newer than 90 days. If any images are older than 90 days refer to the remediation procedure below.'
remediation:
  type: iac_patch
  command: 'To create a custom image From the Console: Note - If you are still connected to the WorkSpace, disconnect. 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, choose WorkSpaces. 3. Select the WorkSpace and choose Actions, Create Image. - A message displays, prompting you to restart your WorkSpace before continuing. Restarting your WorkSpace updates your Amazon WorkSpaces software to the latest version. Once you have restarted your WorkSpace, repeat Step 4 of this procedure. 5. Click Next. 6. Enter an image name and a description. 7. Click Create Image. While the image is being created, the status of the WorkSpace is Suspended and the WorkSpace is unavailable. In the left pane, click Images. The image is complete when the status of the WorkSpace changes to Available.'
