id: TMA-AWS-EUC-2.9
title: Ensure CloudWatch is set up for WorkSpaces
description: Set up and utilize Amazon CloudWatch Events for successful logins to WorkSpaces. Use Cloudwatch to store/archive WorkSpaces login events for future reference, analysis, and action based on the patterns. Utilize the IP address collected to figure out where users are logged in from, and then build policies to allow access only to files or data from those WorkSpaces that meet company access criteria. With this information you can also use policy controls to block access from unauthorized IP addresses.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.9 Ensure CloudWatch is set up for WorkSpaces
audit:
  type: manual
  command: 'Perform the following steps to review the rules for CloudWatch and WorkSpaces Events From the Console: 1. Login to the CloudWatch console at https://console.aws.amazon.com/cloudwatch/ 2. In the left pane click Rules. 3. Click Rules. 4. Click on the Rule Name for your WorkSpaces Access Events 5. Confirm the Event Pattern { "source": [ "aws.workspaces" ], "detail-type": [ "WorkSpaces Access" ] } 6. Confirm Status is Enabled 7. Confirm at least one Target is created for CloudWatch Log Group If there is no CloudWatch Event created with the rule as outlined above refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to create a Rule for CloudWatch WorkSpaces Events From the Console: 1. Login to the CloudWatch console at https://console.aws.amazon.com/cloudwatch/ 2. In the left pane click Rules. 3. Click Create rule. 4. For Event Source, do the following: - Click `Event Pattern` and Build event pattern to match events by service (the default). 5. For Service Name, click WorkSpaces. 6. For Event Type, click WorkSpaces Access. 7. For Targets, click Add target - Click and Change the Lambda Function to `CloudWatch log group` 8. For Log Group, enter /aws/events/workspaces_access Note - You can add additional targets for other services to act when a WorkSpaces Access event is detected. 9. Click Configure details. 10. For Rule definition, enter a name and description. 11. Click `Create rule'' 12. Click Create rule.'
