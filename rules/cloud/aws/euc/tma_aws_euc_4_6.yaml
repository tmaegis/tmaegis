id: TMA-AWS-EUC-4.6
title: Ensure only specific users are allowed to invite external users
description: The organization should only allow administrators the ability to invite external users to the WorkDocs site. If anyone can invite a user outside of the organization it could potentially lead to security or information leak.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.6 Ensure only specific users are allowed to invite external users
audit:
  type: manual
  command: Perform the steps to confirm Only Administrators can invite new external users for WorkDocs. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - external invites 4. Confirm that only Only administrators can invite new external users If this is not set to "Only administrators can invite new external users" refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the steps to Set Only Administrators can invite new external users for WorkDocs. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - external invites 4. Select Only administrators can invite new external users - Only administrators can invite external users to use Amazon WorkDocs.
