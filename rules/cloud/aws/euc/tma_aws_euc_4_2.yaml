id: TMA-AWS-EUC-4.2
title: Ensure MFA is enabled for WorkDoc users
description: Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance beyond traditional username and password. With MFA enabled, when a user signs in to Amazon WorkDocs, they will be prompted for their user name and password as well as for an authentication code from their MFA token. Enabling MFA provides increased security to a user name and password as it requires the user to possess a solution that displays a time-sensitive authentication code.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- euc
- mfa
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.2 Ensure MFA is enabled for WorkDoc users
audit:
  type: manual
  command: 'Perform the steps below to confirm MFA setup and configuration. From the console: 1. Log in to the Directory Service console at https://console.aws.amazon.com/directoryservicev2 2. Select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directory details page, select the Networking & security tab. 5. In the Multi-factor authentication section, Confirm Radius status is set to Enabled. 6. Open the WorkDocs console at https://console.aws.amazon.com/zocalo/ 7. In the Manage Your WorkDocs Sites page, select the desired site and choose Actions and Manage MFA. 8. Confirm the values are set correctly. Multi-factor authentication is available when the RADIUS Status reads Enabled. From the Command line: 1. Run describe-directories command to list the identifiers of all the Active Directory (AD) Connector directories, available in the selected AWS region: aws ds describe-directories --region us-east-1 --output table --query ''DirectoryDescriptions[*].DirectoryId''
    2. The command output should return a table with the requested resource IDs: --------------------- |DescribeDirectories| +-------------------+ | d-12345abcde | | d-abcd012345 | | d...'
remediation:
  type: iac_patch
  command: 'Perform the following steps to setup MFA on the server and in WorkDocs. From the Console: 1. Identify the IP address of your RADIUS MFA server and your AWS Managed Microsoft AD directory. 2. In the AWS Directory Service console navigation pane, select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directory details page, select the Networking & security tab. 5. In the Multi-factor authentication section, choose Actions, and then choose Enable. 6. On the Enable multi-factor authentication (MFA) page, provide the following values: - Display label - Provide a label name. - RADIUS server DNS name or IP addresses - Port - default 1812 - Shared secret code - Confirm shared secret code To enable multi-factor authentication in WorkDocs: 1. Open WorkDocs console at https://console.aws.amazon.com/zocalo/ 2. In the Manage Your WorkDocs Sites page, select the desired site and choose Actions and Manage MFA. 3. Enter the following values:
    - Enable Multi-Factor Authentication - Check to enable multi-factor authentication. - RADIUS server IP address(es) - The IP addresses of your RADIUS server endpoints - Port - The port that your RADIUS serv...'
