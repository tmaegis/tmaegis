id: TMA-AWS-EUC-4.5
title: Ensure new users can only be invited from allowed domains.
description: Users that are allowed access to shared files or folders in WorkDocs should be limited to specific domains. To control who should be allowed to join your WorkDocs site, users should be limited on who they can invite sharing files or folders with new people from the specified domains.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.5 Ensure new users can only be invited from allowed domains.
audit:
  type: manual
  command: Perform the steps to confirm WorkDocs file and sharing folders is controlled by specified domains. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - Invite settings 4. Confirm that only Users can invite new people from a few specific domains by sharing files or folders with them 5. Confirm the listed Domains is accurate. If the setting is not set to "Users can invite new people from a few specific domains by sharing files or folders with them" or the domains listed is not accurate refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the steps to set WorkDocs file and sharing folders to be controlled by specified domains. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - Invite settings 4. Select Users can invite new people from a few specific domains by sharing files or folders with them 5. Add in or edit the listed allowed Domains.
