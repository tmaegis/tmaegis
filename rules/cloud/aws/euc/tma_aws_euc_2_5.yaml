id: TMA-AWS-EUC-2.5
title: Ensure WorkSpaces traffic is controlled and routed through a NAT Gateway.
description: A network address translation (NAT) gateway enables instances in a private subnet to connect to the internet or other AWS services, but prevents the internet from initiating a direct connection with those instances. WorkSpaces must have access to the internet so that you can install updates to the operating system and deploy applications.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.5 Ensure WorkSpaces traffic is controlled and routed through a NAT Gateway.
audit:
  type: manual
  command: 'Perform the following steps to verify a NAT Gateway is configured and utilized. From the Console: 1. Login to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click Route Tables. 3. On the Route Table tab. 4. Select the public route table set for WorkSpaces. 5. Click the Subnet Associations Tab 6. Confirm that the Subnet ID is set to the WorkSpaces Public subnet. 7. De-select the public route table and select the WorkSpaces Private route table. 8. Click the Subnet Associations Tab 9. Confirm that the Subnet ID is set to the 2 WorkSpaces Private subnet. If the Route tables aren''t set for one route for local traffic and another route that sends all other traffic to the internet gateway for the VPC refer to the remediation procedure below.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to create a NAT gateway From the Console: 1. Login to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click NAT Gateways 3. Click Create NAT Gateway. 4. For NAT Gateway settings - Name - although optional use something to identify it with WorkSpaces - Specify the subnet in which to create the NAT gateway - Select the Elastic IP Allocation ID 5. Click Create a NAT Gateway. _The NAT gateway will display in the console and after a few moments, its status will change to Available. If the NAT gateway goes to a status of Failed, there was an error during creation._ After you''ve created your NAT gateway, you must update your route tables for your private subnets to point internet traffic to the NAT gateway. To create a route for a NAT gateway 1. Log in to the VPC console at https://console.aws.amazon.com/vpc/. 2. In the left pane, Click Route Tables. 3. Select the route table associated with your private subnet. 4. Click Routes
    tab. 5. Click Edit routes 6. Click Add route 7. For Edit routes - Destination, enter 0.0.0.0/0. - Target, select the ID of your NAT gateway. 8. Click Save routes'
