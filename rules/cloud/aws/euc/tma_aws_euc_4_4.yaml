id: TMA-AWS-EUC-4.4
title: Utilize site wide activity feed for monitoring.
description: Admins can view and export the activity feed for an entire WorkDocs site. WorkDoc admins should monitor and export activity feeds for the site as record of activity. These activity reports should be reviewed every month for any abnormalities and rotated every 90 days.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
- monitoring
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.4 Utilize site wide activity feed for monitoring.
audit:
  type: manual
  command: 'Perform the steps below to view site-wide activity feed From the WorkDocs web application: 1. Click Activity feed. 2. Click Filter, then Click Site-wide activity. 3. Select Activity Type filters and choose Date Modified settings as needed, then click Apply. 4. When the filtered activity feed results appear, search by file, folder, or user name to narrow your results. You can also add or remove filters as needed.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to Export site-wide activity feed From the WorkDocs web application: 1. Click Activity feed. 2. Click Filter, then Click Site-wide activity. 3. Select Activity Type filters and choose Date Modified settings as needed, then click Apply. 4. When the filtered activity feed results appear, search by file, folder, or user name to narrow your results. You can also add or remove filters as needed. 5. Click Export 6. Export the activity feed as a .csv or .json file. Any filters you applied are reflected in the exported file.'
