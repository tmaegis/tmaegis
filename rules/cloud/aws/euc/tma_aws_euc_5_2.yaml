id: TMA-AWS-EUC-5.2
title: Ensure a VPC Endpoint is set for AppStream
description: When you select Using a VPC endpoint, this allows users to only stream from this AppStream 2.0 stack when they have network access to the VPC. Virtual Private Cloud (VPC) endpoints allow your users to stream from AppStream 2.0 through your VPC. You can create a VPC endpoint in the VPC of your choosing, then use the endpoint with AppStream 2.0 VPC to maintain the streaming traffic within the VPC.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
- network
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 5.2 Ensure a VPC Endpoint is set for AppStream
audit:
  type: manual
  command: Perform the steps to review the interface endpoint set for AppStream 2.0 From the Console 1. Log in to the AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane, click Stacks, click the link for the stack you wish to view. 3. Scroll to the VPC Endpoints section. 4. Confirm the Streaming Endpoint listed is the endpoint through which to stream traffic. If there is no Streaming endpoint pointing to a specific VPC Endpoint and it is labeled as Internet refer to the remediation below.
remediation:
  type: iac_patch
  command: 'Perform the following steps to create an interface endpoint From the Console: 1. Log in to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click Endpoints, Create Endpoint. 3. Click Create Endpoint. - For Service category, ensure that AWS services is selected. - For Service Name, choose com.amazonaws.<AWS Region>.appstream.streaming. - For VPC, choose a VPC in which to create the interface endpoint. - For Subnets, choose the subnets (Availability Zones) in which to create the endpoint network interfaces. - Ensure that the Enable Private DNS Name check box is selected. - For Security group, select the security group for AppStream 4. Click Create endpoint. To update a stack to use a new interface endpoint 1. Log in to AppStream 2.0 console at https://console.aws.amazon.com/appstream2 2. In the left pane, click Stacks, and click the link of the stack name wish to edit. 3. Scroll to the VPC Endpoints, and then choose Edit. 4. In the Edit VPC Endpoint dialog
    box, for Streaming Endpoint, choose the endpoint you just created. 5. Click Save Changes. Traffic for new streaming sessions will be routed through this endpoint. However, traffic for current streaming...'
