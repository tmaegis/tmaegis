id: TMA-AWS-EUC-4.7
title: Ensure publicly shareable links is not allowed in WorkDocs
description: The organization should not allow publicly shareable links for WorkDocs. If a user can create and send a publicly shareable links allowing a file to be viewed by people outside of the organization it could potentially lead to an security or information leak.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.7 Ensure publicly shareable links is not allowed in WorkDocs
audit:
  type: manual
  command: Perform the steps to confirm publicly shareable links for WorkDocs is not allowed. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - public share settings 4. Confirm that - No public sharing is selected. If this is not selected choice refer to the remediation below.
remediation:
  type: iac_patch
  command: Perform the steps to set set publicly shareable links for WorkDocs to not allowed. From the WorkDocs Admin control panel 1. Log in to WorkDocs as an Administrator 2. Click Security 3. Under - public share settings 4. Select - No public sharing. - Users cannot send view links to anyone outside the organization.
