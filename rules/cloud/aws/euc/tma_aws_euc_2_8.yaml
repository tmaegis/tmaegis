id: TMA-AWS-EUC-2.8
title: Ensure the default IP access control group is disassociated.
description: The default IP Access Control group allows all traffic. Once you create and attach an IP Access Control Group the default is disassociated. IP Access Control group acts as a virtual firewall for your WorkSpaces allowing you to add your trusted networks.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.8 Ensure the default IP access control group is disassociated.
audit:
  type: manual
  command: 'Perform the following steps to review your Directory From the Console: 1. Login to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select your directory id link. 4. Scroll to the IP access control groups section and click Edit. 5. Confirm that you have an IP Access Control Group Associated with this Directory. 6. Make note of the name(s) of the IP Access Control Group. 7. Next review the IP Access Control Group 8. In the navigation pane, click IP Access Controls. 9. Select the name of the IP Access Control Group(s) you record from the Directory. 10. For each IP Access Control Group confirm the source IP address or IP address range, and the Description. If an IP Access Control group doesn''t exist follow the remediation below. From the Command line: Run the describe-ip-groups command aws workspaces describe-ip-groups Review the output for the name and the IP Access controls. If an IP Access Control group doesn''t
    exist refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the steps below to create an IP Access control group. From the Console. 1. Login to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, Click IP Access Controls. 3. Click Create IP Group. 4. In the Create IP Group dialog box, enter a name and description for the group. 5. Click Create. 6. Select the group 7. Click Edit. 8. For each IP address, click Add Rule. 9. For Source, enter the IP address or IP address range. 10. For Description, enter a description. When you are done adding rules, 11. Click Save. Next Associate an IP Access Control Group with a Directory 1. Login to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select the directory id link. 4. Scroll to the IP access control groups section and click Edit. 5. Select the IP access control group and click Associate Note* - If you associate an IP access control group that has no rules with a directory, this blocks
    all access to all WorkSpaces. From the command line: Run the create-ip-group command aws workspaces create-ip-group --group-name name-of-group --user-rules ipRule=ipaddress_list Associate an IP Access Cont...'
