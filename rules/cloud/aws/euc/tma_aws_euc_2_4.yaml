id: TMA-AWS-EUC-2.4
title: Ensure WorkSpaces are deployed in their own virtual private cloud (VPC)
description: Amazon WorkSpaces VPC should be created with two private subnets for your WorkSpaces and a NAT gateway in a public subnet. The NAT gateway will provide WorkSpaces access to the internet for updates to the operating system and so that applications can be deployed using Amazon WorkSpaces Application Manager if that is applicable for your environment.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
- network
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.4 Ensure WorkSpaces are deployed in their own virtual private cloud (VPC)
audit:
  type: manual
  command: 'Perform the following steps to confirm that a VPC exists for WorkSpaces and is configured correctly. From the Console: 1. Login to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click Your VPC''s 3. Select the VPC for WorkSpaces 4. Confirm the IPv4 settings are using a CIDR block from the private (non-publicly routable) IP address ranges. For example, 10.0.0.0/16. For more information, see the references below. 5. Confirm the IPv6 CIDR Block, set to No. 6. Confirm the IPv4 CIDR block for the public subnet (example - WorkSpaces Public Subnet) - Availability Zone, set to No Preference. 7. Confirm the IPv4 CIDR block for the first private subnet (example - WorkSpaces Private Subnet 1) - Availability Zone, set for Amazon WorkSpaces. - Elastic IP Allocation ID - Service endpoints - `Blank` - Enable DNS hostnames, set to `Yes`. - Hardware tenancy, Default. 8. Confirm the IPv4 CIDR block for the first private subnet (example - WorkSpaces Private Subnet 2)
    - Availability Zone set for Amazon WorkSpaces. NOTE-Make sure you select a different Availability Zone from the one you selected for the Workspaces Private Subnet 1 - Elastic IP Allocation ID - Service endp...'
remediation:
  type: iac_patch
  command: 'Perform the following steps to create a VPC for Workspaces From the Console: Allocate an Elastic IP Address 1. Login in to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click Elastic IPs. 3. Click Allocate new address. 4. On the Allocate new address page, for iPv4 address pool, click Amazon pool or Owned by me 5. Click Allocate. 6. Make a note of the Elastic IP address, click Close. Create a VPC with one public subnet and two private subnets as follows. 1. Login in to the VPC console at https://console.aws.amazon.com/vpc/ 2. In the left pane, click VPC Dashboard in the upper-left corner. 3. Click Launch VPC Wizard. 4. Click VPC with Public and Private Subnets 5. Click Select. 6. Configure the VPC as follows: - For IPv4 CIDR block, enter the CIDR block from the private (non-publicly routable) IP address ranges. - example 10.0.0.0/16. - For IPv6 CIDR Block, keep `No IPv6 CIDR Block`. - For VPC name, enter a `name for the VPC` (example: WorkspacesVPC)
    - Public subnet''s IPv4 CIDR - enter a CIDR block from the private (non- publicly routable) IP address range - ie. 10.0.0.0/24. - For Availability Zone, keep `No Preference`. - For Public subnet name, ente...'
