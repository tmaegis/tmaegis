id: TMA-AWS-EUC-2.2
title: Ensure MFA is enabled for WorkSpaces users
description: Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance beyond traditional username and password. With MFA enabled, when a user signs in to Amazon WorkSpaces, they will be prompted for their user name and password as well as for an authentication code from their physical or virtual MFA token. It is recommended that MFA be enabled for all accounts that utilize WorkSpaces. Enabling MFA provides increased security to a username and password as it requires the user to have a virtual or physical hardware solution that displays a time-sensitive code.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- euc
- mfa
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.2 Ensure MFA is enabled for WorkSpaces users
audit:
  type: manual
  command: 'Preform the following steps to check multi-factor authentication is enabled for WorkSpaces From the Console: For AWS Managed AD Authenticated Amazon Workspaces Environments: 1. Identify the IP address of your RADIUS MFA server and your AWS Managed Microsoft AD directory. 2. In the AWS Directory Service console navigation pane, select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directories page, scroll to the Multi-factor authentication section. 5. In the Multi-factor authentication section, confirm that it is enabled and that Radius Status is completed. For Self-Managed AD (with AD Connector) Amazon Workspaces Environments: 1. Identify the IP address and port of your RADIUS MFA server and your AWS Managed Microsoft AD Connector Identifier. 2. In the AWS Workspaces console navigation pane, select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD connector. 4. On the Directories page, select the
    Actions > Update Details. 5. In the Multi-factor authentication section, confirm that it is enabled and that Radius Status is completed, Enable Multi-Factor Authentication is checked and the IP Address of...'
remediation:
  type: iac_patch
  command: 'Perform the steps below to enable multi-factor authentication for WorkSpaces From the console: For AWS Managed Microsoft AD based Workspaces Environments: 1. Identify the IP address of your RADIUS MFA server and your AWS Managed Microsoft AD directory. 2. In the AWS Directory Service console navigation pane, select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directories page, scroll to the Multi-factor authentication section. 5. In the Multi-factor authentication section, click Actions, and then click Enable. 6. On the Enable multi-factor authentication (MFA) page, provide the following values: - Display label - Provide a label name. - RADIUS server DNS name or IP addresses Note - AWS Directory Service does not support RADIUS Challenge/Response authentication. - Port - default 1812 - Shared secret code - Confirm shared secret code - Protocol - MS-CHAPv2 - Server timeout (in seconds) - 20 - Max RADIUS request retries - 3
    *** Multi-factor authentication is available when the RADIUS Status changes to Enabled. 7. Click Enable. For AD Connector based Workspaces Environments: 1. Identify the IP address and port of your RADIUS MFA...'
