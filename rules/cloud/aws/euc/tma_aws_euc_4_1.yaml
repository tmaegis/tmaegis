id: TMA-AWS-EUC-4.1
title: Ensure Administrators of WorkDocs is defined using IAM
description: To allow users to administer Amazon WorkDocs resources, you must create an IAM policy that explicitly grants them the correct permissions. This policy should then be attached to the group or role defined for this administration. WorkDocs Administrators control access and authorization for users of the WorkDocs resources.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- euc
- iam
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 4.1 Ensure Administrators of WorkDocs is defined using IAM
audit:
  type: manual
  command: 'Perform the following to determine what policies are created: From the Console: 1. Login in and open the IAM console at https://console.aws.amazon.com/iam/. 2. In the left pane click on Groups. 3. Click on the group name that should administer WorkDocs. 4. Click on Permissions and confirm that the AmazonWorkDocsFullAccess policy is attached. 5. Click on Users and confirm that the list of names are the users approved to administer WorkDocs. 6. To confirm that the WorkDocs policy (AmazonWorkDocsFullAccess) for admin control is attached to the correct group. From the Command Line: 1. Run the list-attached-group-policies. aws iam list-attached-group-policies --group-name <workdocs_group_name> 2. Confirm that the list of users in that Group is correct aws iam get-group --group-name <workdocs_group_name> If the AWS manage policy or a custom WorkDocs Full Access policy is not attached to the group or the users in the group list is not correct refer to the remediation below.'
remediation:
  type: iac_patch
  command: 'Perform the following to create an IAM group and assign the Amazon WorkDocs Full Access policy to it: From the Console: 1. Log in to the IAM console at https://console.aws.amazon.com/iam/. 2. In the left pane, click Groups and then click Create New Group. 3. In the Group Name box, type the name of the group and then click Next Step. 4. In the list of policies, select the check box for AmazonWorkDocsFullAccess 5. Click Next Step. 6. Click Create Group Perform the following to add a user to a Amazon WorkDocs Full Access group: 1. Log in to the the IAM console at https://console.aws.amazon.com/iam/. 2. In the left pane, click Groups 3. Select the group you created above 4. Click Add Users To Group 5. Select the users to be added to the group 6. Click Add Users'
