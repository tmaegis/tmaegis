id: TMA-AWS-EUC-2.12
title: Restrict WorkSpaces Bundle options to organization approved versions
description: Limit the existing WorkSpaces bundles that can be utilized and provisioned within your AWS account. Limiting the type of AWS WorkSpaces bundle that can be utilized can address internal security and compliance requirements.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.12 Restrict WorkSpaces Bundle options to organization approved versions
audit:
  type: manual
  command: 'Perform the following to ensure available workspace bundles are set. From the Console: 1. Login to the WorkSpaces dashboard at https://console.aws.amazon.com/workspaces/. 2. In the left pane click WorkSpaces to access the instances listing page. 3. Check the bundle type value for each Amazon WorkSpaces instance available in the current AWS region, listed in Bundle column, e.g. 4. If the value listed in the Bundle column is the same for all listed resources, the WorkSpaces instances were launched using the approved bundle type. 5. Change the AWS region from the navigation bar and repeat step no. 4 for all other regions. If the value listed in the Bundle column is not the same for all listed resources, the WorkSpaces instances were not launched using the approved bundle type, refer to the remediation procedure below. From the Command line: 1. Run describe-workspaces command available within the selected region: aws workspaces describe-workspaces --region us-east-1 --output table
    --query ''Workspaces[*].WorkspaceId'' 2 The command output should return a table with the requested WorkSpaces IDs: -------------------- |DescribeWorkspaces| +------------------+ | ws-bbbdddeee | | ws-aaabbb...'
remediation:
  type: iac_patch
  command: 'Preform the following to limit the bundle type Create the required AWS support case: From the Console: 1. Login in to AWS Support Center dashboard at https://console.aws.amazon.com/support/. 2. Click Create a case. 3. For Case details: - Type, choose `Account` - Category, choose `Other Account Issues` - Subject, "Limit AWS WorkSpaces instances launch to approved bundle types". - Description textbox, explain that security and compliance requires the need to limit the provisioning of WorkSpaces instances to an approved bundle type. - Contact options, leave as default or change as needed. 4. Click Submit'
