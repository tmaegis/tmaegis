id: TMA-AWS-EUC-2.10
title: Ensure that patches and updates are performed on the operating system for Workstations
description: In order for Windows updates to occur auto-stop WorkSpaces must be utilized and the default for maintenance mode must be set to enabled. Windows Operating systems updates can be a high security vulnerability and normal updates and patches can help eliminate these vulnerabilities.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- euc
- patching
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.10 Ensure that patches and updates are performed on the operating system for Workstations
audit:
  type: manual
  command: 'Perform the steps to check maintenance mode for your WorkSpaces: From the Console: 1. Login to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select your directory id link. 4. Scroll to the Maintenance mode section and ensure maintenance mode is set to Enabled. If it is set to Enabled you are meeting this recommendation. If it is set to Disabled, refer to the remediation below. From the Command line: 1. Run the workspaces command describe-workspace-directories aws workspaces describe-workspace-directories 2. Review the output under "WorkspaceCreationProperties" for "EnableMaintenanceMode" : true Example output: "WorkspaceCreationProperties" : { "EnableInternetAccess" : false, "EnableWorkDocs" : true, "UserEnabledAsLocalAdministrator" : true "EnableMaintenanceMode" : true }, If it is set to true you are meeting this recommendation. If it is set to false or is not listed in the output at all, refer to the remediation
    below.'
remediation:
  type: iac_patch
  command: 'Perform the following steps to enable maintenance mode From the Console: 1. Login to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select your directory id link. 4. Scroll to the Maintenance mode section and click Edit 5. Select Enable maintenance mode. 6. Click Save. Note** If you prefer to manage updates manually or with another tool document usage of that, and choose Disabled. From the Command line: 1. Run the WorkSpaces modify-workspace-creation-property command aws workspaces modify-workspace-creation-property --resource-id <directory_id> --workspace-creation-properties EnableMaintenanceMode=true'
