id: TMA-AWS-EUC-2.16
title: Ensure FIPS Endpoint encryption is enabled for WorkSpaces.
description: To meet a high level of security and comply with different compliance standards, you must use Federal Information Processing Standards (FIPS) endpoint encryption at the directory level with WorkSpaces. You must also use an AWS Region that is authorized for the same compliance standard that you are trying to achieve.
target: aws
level: 2
severity: medium
tags:
- aws
- cloud
- encryption
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.16 Ensure FIPS Endpoint encryption is enabled for WorkSpaces.
audit:
  type: manual
  command: 'Perform the steps below to determine if FIPS endpoint encryption is enabled. From the Console: 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Select the directory id link. 4. Scroll to the Endpoint encryption section. 5. Endpoint Encryption should read - FIPS 140-2 Validated Mode. If Endpoint Encryption is not listed as FIPS 140-2 Validated Mode refer to the remediation procedure below.'
remediation:
  type: iac_patch
  command: 'Perform the steps below to enable FIPS endpoint encryption at the directory level From the Console: 1. Log in to the WorkSpaces console at https://console.aws.amazon.com/workspaces/ 2. In the left pane, click Directories. 3. Verify that the directory does not have any existing WorkSpaces associated with it. 4. Select the directory id link. 5. Click Actions, Update Details. 6. Scroll to the Endpoint encryption section and select Edit 7. For Endpoint Encryption, choose FIPS 140-2 Validated Mode. 8. Click Save. You can now create WorkSpaces from this directory that utilize FIPS endpoint encryption modules.'
