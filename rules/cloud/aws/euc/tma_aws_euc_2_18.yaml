id: TMA-AWS-EUC-2.18
title: Ensure Radius server is using the recommended security protocol
description: The authentication protocol between the Microsoft AD DCs and the RADIUS server supported are PAP, CHAP, MS-CHAPv1, and MS-CHAPv2. MS-CHAPv2 provides the strongest security of the options supported.
target: aws
level: 2
severity: low
tags:
- aws
- cloud
- euc
reference: CIS AWS End User Compute Services Benchmark v1.2.0 - 2.18 Ensure Radius server is using the recommended security protocol
audit:
  type: manual
  command: 'Perform the steps to check multi-factor authentication using the radius server protocol is set to MS-CHAP v2. From the Console: For AWS Managed AD based environments; 1. Log in to the Directory Service console at https://console.aws.amazon.com/directoryservicev2 2. In the left pane select Directories. 3. Choose the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directory details page, select the Networking & security tab. 5. In the Multi-factor authentication section, confirm that the Protocol is set to MS- CHAPv2. For directory connector / self-managed AD environments 1. Log in to the AWS Workspaces console at https://console.aws.amazon.com/workspaces 2. In the left pane select Directories. 3. Select the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directories page, scroll to the Multi-factor authentication section and select Edit. 5. In the Multi-factor authentication section confirm that, in the Protocol field MS- CHAPv2
    is selected from the dropdown list. If it is not set to MS-CHAPv2 refer to the remediation steps below.'
remediation:
  type: iac_patch
  command: 'Perform the steps below to set the protocol to MS-CHAPv2 for multi-factor authentication. From the console: For AWS Managed AD based environments; 1. Log in to the Directory Service console at https://console.aws.amazon.com/directoryservicev2 2. In the left pane select Directories. 3. On the Directory details page, select the Networking & security tab. 4. In the Multi-factor authentication section, choose Actions, and then choose Edit. 5. On the Enable multi-factor authentication (MFA) page change the following value: 6. Protocol - MS-CHAPv2 7. Click Save. For directory connector / self-managed AD environments 1. Log in to the AWS Workspaces console at https://console.aws.amazon.com/workspaces 2. In the left pane select Directories. 3. Select the directory ID link for your AWS Managed Microsoft AD directory. 4. On the Directories page, scroll to the Multi-factor authentication section and select Edit. 5. In the Multi-factor authentication section modify the protocol using the
    dropdown menu to be MS-CHAPv2 from the currently selected option. 6. Click Save once settings are as desired.'
