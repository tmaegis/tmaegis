id: TMA-AWS-IAM-PASSWORD-REUSE
title: Ensure IAM password policy prevents password reuse
description: Preventing reuse of the last 24 passwords stops users cycling back to a compromised password. Checks PasswordReusePrevention >= 24. Read-only AWS CLI calls; credentials come from the CLI's normal configuration (AWS_PROFILE, ~/.aws/config and credentials, SSO, or an instance/task role). A missing CLI or credential fails the check.
target: aws
level: 1
severity: medium
tags:
- aws
- iam
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - Identity and Access Management - password policy prevents reuse (verify section number for your release)
audit:
  type: command
  command: 'out=$(aws iam get-account-password-policy --query ''PasswordPolicy.PasswordReusePrevention'' --output text 2>/dev/null) || exit 1

    [ "$out" -ge 24 ] 2>/dev/null && echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: aws iam update-account-password-policy --password-reuse-prevention 24 (pass all existing policy settings again, the call replaces the whole policy), or set password_reuse_prevention = 24 in aws_iam_account_password_policy (Terraform).
