id: TMA-AWS-RDS-NOT-PUBLIC
title: Ensure RDS instances are not publicly accessible
description: PubliclyAccessible gives the instance a public DNS/IP reachable from the Internet whenever security groups allow it. No DB instance in any enabled region may be publicly accessible. Read-only AWS CLI calls; credentials come from the CLI's normal configuration (AWS_PROFILE, ~/.aws/config and credentials, SSO, or an instance/task role). A missing CLI or credential fails the check.
target: aws
level: 1
severity: high
tags:
- aws
- database
reference: CIS Amazon Web Services Foundations Benchmark v7.0.0 - Storage - RDS instances not publicly accessible (verify section number for your release)
audit:
  type: command
  command: "regions=$(aws ec2 describe-regions --query 'Regions[].RegionName' --output text 2>/dev/null) || exit 1\n[ -n \"$regions\" ] || exit 1\nbad=0\nfor r in $regions; do\n  out=$(aws rds describe-db-instances --region \"$r\" --query 'DBInstances[?PubliclyAccessible==`true`].DBInstanceIdentifier' --output text 2>/dev/null) || exit 1\n  [ -z \"$out\" ] || { echo \"public: $r $out\"; bad=1; }\ndone\n[ \"$bad\" -eq 0 ] && echo compliant"
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'aws rds modify-db-instance --db-instance-identifier <id> --no-publicly-accessible --apply-immediately (Terraform: publicly_accessible = false); place instances in private subnets.'
