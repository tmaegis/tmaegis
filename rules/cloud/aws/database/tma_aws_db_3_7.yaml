id: TMA-AWS-DB-3.7
title: Ensure to Implement Access Control and Authentication
description: Users should select whether they like to enable authentication. If they want to authenticate a password would be required, which would only allow the authorized person to access the database. Defining access control allows specific workers in a business access to the database.
target: aws
level: 1
severity: medium
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.7 Ensure to Implement Access Control and Authentication
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to implement access control and authentication. - Click on the instance name to access its details page. - In the instance details page, navigate to the Configuration or Connectivity & Security section. 4. Enable IAM Database Authentication - Under the Connectivity or Connectivity & Security section. - Click the Modify or Edit option to enable IAM Database Authentication. - Select the option to enable IAM Database Authentication. - Click Continue or Save to apply the changes. 5. Create and Configure IAM Database Users - Click Users in the left-side menu in the Amazon RDS console. - Click Create database
    user to create a new IAM database user. - Provide a username and select the IAM role or IAM user that will be associated with the database user. - Configure the authentication type, either Password-b...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.7 to configure: Ensure to Implement Access Control and Authentication.'
