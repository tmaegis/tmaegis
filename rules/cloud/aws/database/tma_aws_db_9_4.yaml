id: TMA-AWS-DB-9.4
title: Ensure Authentication and Access Control is Enabled
description: This helps ensure that there are specific IAM roles and policies that are given the necessary information within a Neptune DB cluster to operate as needed.
target: aws
level: 1
severity: medium
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.4 Ensure Authentication and Access Control is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster on which you want to implement authentication and access control. - Click on the cluster name to access its details page. 4. Enable IAM Database Authentication - In the cluster details page, navigate to the Configuration or Database Authentication section. - Under Database Authentication, select the option to enable IAM database authentication. - Click Apply Changes to enable IAM database authentication for the Neptune cluster. 5. Configure IAM Roles and Policies - Open the AWS Identity and Access Management (IAM) console by navigating to IAM in the AWS Management Console. - Create IAM roles
    and policies that define the desired access control for your Neptune resources. - Assign the necessary permissions to the IAM roles to allow specific actions on the Neptune cluster, such as read, write, or...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.4 to configure: Ensure Authentication and Access Control is Enabled.'
