id: TMA-AWS-DB-8.1
title: Ensure Keyspace Security is Configured
description: To access Amazon Keyspaces, the user would be required to log in with their AWS credentials. Once logged in the user can access the AWS resources and can explore the resources that Amazon Keyspaces offers. Amazon Keyspaces offers a lot of security that can mitigate a potential attack.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- crypto
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 8.1 Ensure Keyspace Security is Configured
audit:
  type: manual
  command: '1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Keyspaces Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/keyspaces/. 3. Explore Amazon Keyspaces Security Features - In the Amazon Keyspaces console, navigate to the Features or Security section to explore the available security features. - Take note of the following critical security features: o Encryption at Rest: Understand how Amazon Keyspaces provides encryption at rest for your data. It uses server-side encryption by default, ensuring that data stored in Keyspaces is encrypted. o Encryption in Transit: Learn how to configure encryption in transit for data transmitted between your client applications and Amazon Keyspaces. Amazon Keyspaces supports Transport Layer Security (TLS) encryption to secure the communication
    channel. o Virtual Private Cloud (VPC) Support: Explore the VPC support options Amazon Keyspaces provides. It allows you to deploy your Keyspaces resources within your VPC for enhanced network isolation...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 8.1 to configure: Ensure Keyspace Security is Configured.'
