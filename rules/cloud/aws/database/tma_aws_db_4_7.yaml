id: TMA-AWS-DB-4.7
title: Ensure Monitor and Audit Activity is enabled
description: Regular monitoring and auditing of activity in Amazon DynamoDB help ensure your database's security, performance, and compliance. This keeps track and ensures who has recently modified a document and monitors all activity within the database. This information allows the individual to use the details provided for auditing purposes and to address any compliance requirements.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.7 Ensure Monitor and Audit Activity is enabled
audit:
  type: manual
  command: 1. Enable CloudTrail Logging for DynamoDB - Sign in to the AWS Management Console and open the CloudTrail console at https://console.aws.amazon.com/cloudtrail/. - Choose Trails from the left-side menu. - Click Create trail or select an existing trail. - Specify a trail name, choose an S3 bucket for storing logs, and configure other trail settings. - Under Data events, select the checkbox for DynamoDB to enable logging of DynamoDB data events. - Click Create trail or Save changes to save the CloudTrail configuration. 2. Enable DynamoDB Streams - Sign in to the AWS Management Console and open the DynamoDB console at https://console.aws.amazon.com/dynamodb/. - Select the DynamoDB table you want to monitor. - Click on the Overview tab. - Under the DynamoDB Streams section, click Manage stream. - Enable DynamoDB Streams with the desired view type (e.g., New and old images). - Click Enable. 3. Configure Amazon CloudWatch Alarms - Sign in to the AWS Management Console and open the CloudWatch
    console at https://console.aws.amazon.com/cloudwatch/. - In the left-side menu, click on Alarms. - Click Create alarm. - Select a DynamoDB metric to monitor (e.g., Read or Write capacity units). -...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.7 to configure: Ensure Monitor and Audit Activity is enabled.'
