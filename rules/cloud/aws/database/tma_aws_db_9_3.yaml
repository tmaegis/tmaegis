id: TMA-AWS-DB-9.3
title: Ensure Data in Transit is Encrypted
description: Enabling encryption in transit helps that the data is protected when it is moving from one location to another.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.3 Ensure Data in Transit is Encrypted
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster for which you want to implement encryption in transit. - Click on the cluster name to access its details page. 4. Enable SSL/TLS Encryption - In the cluster details page, navigate to the Configuration or Encryption in Transit section. - Under Encryption in Transit, ensure that the Enable option is selected. - Optionally, you can also select the Enforce option to require SSL/TLS encryption for all client connections to the Neptune cluster. - Click Apply Changes to enable SSL/TLS encryption for the Neptune cluster. 5. Update Client Applications - When connecting to the Neptune cluster, update your
