id: TMA-AWS-DB-11.3
title: Ensure Data at Rest is Encrypted
description: This helps ensure that the data is kept secure and protected when at rest. The user must choose from two key options which then determine when the data is encrypted at rest.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.3 Ensure Data at Rest is Encrypted
audit:
  type: manual
  command: 1. Create an AWS Key Management Service (KMS) Key - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. - Open the AWS Key Management Service (KMS) console. - Create a new KMS key or select an existing one to encrypt your QLDB data at rest. - Configure the key policy to grant the appropriate IAM users or role permissions. 2. Enable Encryption for QLDB - Open the Amazon QLDB console. - Choose the QLDB ledger for which you want to enable encryption at rest. - Click on the Configuration tab. - Under the Encryption section. - Click on the Edit button or Modify option. - Enable encryption for the ledger. - Select the KMS key you created or chose in the first step for encrypting the QLDB data. - Save the changes to enable encryption at rest for the QLDB ledger. 3. Verify Encryption Status - Once the encryption at rest is enabled, the QLDB console will indicate the encryption status as Enabled for the selected ledger. - Ensure that
    the KMS key specified for encryption is the correct key you intended to use. 4. Testing and Verification - Perform read and write operations on your QLDB ledger to validate that the data is encrypted at...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.3 to configure: Ensure Data at Rest is Encrypted.'
