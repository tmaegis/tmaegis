id: TMA-AWS-DB-3.3
title: Ensure to Create a Virtual Private Cloud (VPC)
description: Setting up a Virtual Private Cloud (VPC) protects the private network that has been established from any external networks from interfering. It allows internal networks to communicate with one another with the network that has been established.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.3 Ensure to Create a Virtual Private Cloud (VPC)
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon VPC Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/vpc/. 3. Create a VPC - In the Amazon VPC console, click Your VPCs in the left-side menu. - Click on Create VPC to begin creating a new VPC. - Provide a name and the desired IPv4 CIDR block for your VPC. - Configure additional settings, such as IPv6 CIDR block, tenancy, and DNS resolution. - Click Create to create the VPC. 4. Create Subnets - In the Amazon VPC console, click Subnets in the left-side menu. - Click on Create subnet to create a subnet within the VPC. - Select the VPC you created in the previous step. - Provide a name, choose an availability zone, and specify the IPv4 CIDR block for the subnet. - Configure additional settings, such as IPv6 CIDR block and availability
    zone. - Click Create to create the subnet. 5. Configure Route Tables - In the Amazon VPC console, click on Route Tables in the left-side menu. - Click on Create route table to create a new route...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.3 to configure: Ensure to Create a Virtual Private Cloud (VPC).'
