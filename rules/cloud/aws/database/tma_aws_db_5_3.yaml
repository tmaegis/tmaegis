id: TMA-AWS-DB-5.3
title: Ensure Encryption at Rest and in Transit is configured
description: Enabling encryption at rest and in transit for Amazon ElastiCache helps protect your data when it is stored and transmitted. Enabling encryption at rest secured the users data where it is stored. Enabling encryption in transit helps that the data is protected when it is moving from one location to another.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.3 Ensure Encryption at Rest and in Transit is configured
audit:
  type: manual
  command: '1. Enable Encryption at Rest - Sign in to the AWS Management Console and open the Amazon ElastiCache console at https://console.aws.amazon.com/elasticache/. - Create a new ElastiCache cluster or select an existing cluster. - On the cluster details page, click the Encryption tab. - Select the option to enable encryption Under the Encryption at Rest section. - Choose the desired encryption type: o list text hereDefault Encryption: Select this option to use the default AWS- managed key for encryption. o list text hereCustomer Managed Key (CMK): Select this option to use your own AWS Key Management Service (KMS) customer-managed key for encryption. - If you selected Customer Managed Key (CMK), choose the appropriate KMS key from the dropdown menu. - Click "Save changes" to enable encryption at rest for the ElastiCache cluster. 2. Enable Encryption in Transit - On the ElastiCache cluster details page, click the Encryption tab. - Select the option to enable encryption Under the "Encryption
    in Transit" section. - Choose the desired encryption type: o list text hereTransit encryption enabled with SSL/TLS: Select this option to enable encryption in transit using SSL/TLS encryption. o lis...'
remediation:
  type: iac_patch
  command: The user has two options when it comes to encryption at rest and in transit to choose from. Depending on what actions the user selects from it determines how their data is going to be protected.
