id: TMA-AWS-DB-10.8
title: Ensure Monitoring and Alerting is Enabled
description: Utilize Amazon CloudWatch to monitor key metrics, events, and logs related to Amazon Timestream. Set up appropriate alarms and notifications to detect security incidents or abnormal behavior proactively. This helps the individual know what is being logged within the activity and determine what next step should be if they spot any anomalies.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 10.8 Ensure Monitoring and Alerting is Enabled
audit:
  type: manual
  command: 1. Define Monitoring Objectives Determine the key metrics, events, and logs you want to monitor in Amazon Timestream. Identify the specific monitoring requirements based on your use case, workload, and business needs. 2. Choose Monitoring Tools Evaluate the available monitoring tools for Amazon Timestream, such as AWS CloudWatch, third-party monitoring solutions, or custom-built monitoring systems. Select the monitoring tool that best aligns with your monitoring objectives and requirements. 3. Configure CloudWatch Metrics Utilize Amazon CloudWatch to monitor key performance metrics of Timestream. Enable and configure CloudWatch metrics such as database CPU utilization, storage usage, query latency, and other relevant metrics. Set appropriate thresholds for these metrics to trigger alarms and notifications. 4. Create CloudWatch Alarms Set up CloudWatch alarms based on your defined thresholds and monitoring objectives. Define the conditions that trigger the alarms, such as CPU utilization
    exceeding a certain percentage or query latency exceeding a specific threshold. Configure the notification actions for the alarms, such as sending notifications via email, SMS, or triggering auto...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 10.8 to configure: Ensure Monitoring and Alerting is Enabled.'
