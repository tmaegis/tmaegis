id: TMA-AWS-DB-9.1
title: Ensure Network Security is Enabled
description: This helps ensure that all the necessary security measurements are taken to prevent a cyber-attack. Such as utilizing VPC, creating certain inbound and outbound rules, and ACLs.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.1 Ensure Network Security is Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster for which you want to configure network security. - Click on the cluster name to access its details page. 4. Configure Security Groups - In the cluster details page, navigate to the Connectivity & Security or Network & Security section. - Under Security Groups, click on Manage security groups. - Click on Create new security group or select an existing security group associated with your Neptune cluster. - Configure inbound and outbound rules within the security group to control network traffic. o For inbound rules, specify the allowed source IP addresses or security groups and the necessary
    ports for accessing the Neptune cluster. o For outbound rules, define the allowed destination IP addresses or security groups and the required ports for outbound connections from the Neptune cluster. - Sav...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.1 to configure: Ensure Network Security is Enabled.'
