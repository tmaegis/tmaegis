id: TMA-AWS-DB-6.1
title: Ensure Network Security is Enabled
description: Ensure Network Security is Enabled
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 6.1 Ensure Network Security is Enabled
audit:
  type: manual
  command: 1. Create or Select a Virtual Private Cloud (VPC) - Sign in to the AWS Management Console and open the Amazon VPC console at https://console.aws.amazon.com/vpc/. - Create a new VPC or select an existing VPC where you want to deploy your Amazon MemoryDB clusters. 2. Configure Subnets - In the VPC console, navigate to Subnets in the left-side menu. - Create or select the subnets within your VPC where you want to deploy your Amazon MemoryDB clusters. - Ensure you have private subnets to isolate your MemoryDB clusters from the public internet. 3. Define Security Groups - In the VPC console, navigate to Security Groups in the left-side menu. - Create a new security group or select an existing one for your Amazon MemoryDB clusters. - Configure inbound and outbound rules in the security group to control traffic access. o Allow inbound access only from trusted sources, such as specific IP ranges or security groups, on the necessary ports used by MemoryDB. o Define outbound rules based
    on your requirements, allowing outbound traffic to necessary destinations or ports. - Associate the security group with your Amazon MemoryDB clusters. 4. Configure Network Access Control Lists (ACLs) - In...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 6.1 to configure: Ensure Network Security is Enabled.'
