id: TMA-AWS-DB-4.6
title: Ensure DynamoDB Streams and AWS Lambda for Automated Compliance Checking is Enabled
description: Enabling DynamoDB Streams and integrating AWS Lambda allows you to automate compliance checking and perform actions based on changes made to your DynamoDB data. Enabling the DynamoDB with AWS Lambda allows the individual to either use an existing or create a new execution role that allows Lambda to access DynamoDB and write logs.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.6 Ensure DynamoDB Streams and AWS Lambda for Automated Compliance Checking is Enabled
audit:
  type: manual
  command: 1. Open DynamoDB Console - Sign in to the AWS Management Console and open the DynamoDB console at https://console.aws.amazon.com/dynamodb/. 2. Create or Select a DynamoDB Table - You can create a new DynamoDB table or select an existing one to enable DynamoDB Streams. 3. Enable DynamoDB Streams - In the DynamoDB console, select your table. - Click on the Overview tab. - Under the DynamoDB Streams section, click on Manage stream. - In the Manage stream dialog, choose Enable and select the desired view type (e.g., New and old images). - Click Enable. 4. Create an AWS Lambda Function - Open the AWS Management Console and navigate to the Lambda service at https://console.aws.amazon.com/lambda/. - Click Create function to create a new Lambda function. - Choose a function name, runtime (e.g., Node.js, Python), and other basic settings. - Under Permissions, choose an existing or create a new execution role that allows Lambda to access DynamoDB and write logs. - Click Create function
    to create the Lambda function. 5. Configure AWS Lambda with DynamoDB Stream - Scroll down to the Designer section in the Lambda function editor. - Click on Add trigger. - Select DynamoDB from the trigger li...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.6 to configure: Ensure DynamoDB Streams and AWS Lambda for Automated Compliance Checking is Enabled.'
