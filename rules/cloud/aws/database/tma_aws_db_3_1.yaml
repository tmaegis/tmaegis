id: TMA-AWS-DB-3.1
title: Ensure to Choose the Appropriate Database Engine
description: Ensure to Choose the Appropriate Database Engine
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.1 Ensure to Choose the Appropriate Database Engine
audit:
  type: manual
  command: 1. Evaluate Your Requirements - Understand your application's specific requirements, such as performance, scalability, data volume, and compatibility with existing systems. - Consider factors like data structure, workload type (OLTP or OLAP), and specific features required by your application. 2. Research Available Database Engines - Familiarize yourself with the available database engine options supported by Amazon RDS. - Research each database engine's capabilities, features, performance characteristics, and licensing models. 3. Compare Features and Compatibility - Compare the features and capabilities of each database engine with your application's requirements. - Evaluate data types, indexing options, query optimization, high availability, replication, and backup and restore capabilities. - Consider compatibility with your existing applications, frameworks, and tools. 4. Evaluate Performance and Scalability - Consider the performance characteristics of each database engine,
    including throughput, latency, and concurrency capabilities. - Evaluate scalability options, such as horizontal scaling or vertical scaling. - Analyze benchmarks, customer reviews, and case studies to gai...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.1 to configure: Ensure to Choose the Appropriate Database Engine.'
