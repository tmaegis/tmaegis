id: TMA-AWS-DB-7.11
title: Ensure to Conduct Security Assessments
description: Periodically perform security assessments, including vulnerability assessments and penetration testing, to identify and address any security weaknesses. Review your security configuration against best practices and industry standards. This helps ensure that any vulnerabilities that might lie dormant be addressed promptly, which would reduce the risk of a malicious attack. Reviewing and making sure the security policies are authentic ensures the safety of the organization data.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.11 Ensure to Conduct Security Assessments
audit:
  type: manual
  command: 1. Define the Scope of the Security Assessment - Clearly define the scope of the security assessment for your Amazon DocumentDB cluster. - Determine the objectives, areas of focus, and any specific compliance or security standards you must adhere to. 2. Review Security Documentation - Familiarize yourself with the AWS security best practices and documentation related to Amazon DocumentDB. - Review the AWS Shared Responsibility Model and understand the security controls provided by AWS. 3. Assess Network Security - Review the network security configuration of your Amazon DocumentDB cluster. - Ensure it is deployed within a secure Virtual Private Cloud (VPC) with appropriate security groups and network access control lists (ACLs). - Validate that the network traffic to and from the cluster is appropriately restricted based on your security requirements. 4. Evaluate Encryption Configuration - Assess the encryption settings for your Amazon DocumentDB cluster. - Verify that encryption
    at rest is enabled and that the data stored in the cluster is encrypted. - Validate that encryption in transit is enforced, ensuring that all client connections to the cluster are encrypted using SSL/TL...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.11 to configure: Ensure to Conduct Security Assessments.'
