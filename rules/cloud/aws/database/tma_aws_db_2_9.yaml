id: TMA-AWS-DB-2.9
title: Ensure Database is not Publicly accessible
description: AuroraDB databases must not be publicly accessible. This means the database's network configuration should prevent assignment of public IP addresses or exposure to the public internet, ensuring that connections are only permitted from trusted internal networks. Restricting public access to databases greatly reduces the attack surface for malicious actors. Publicly accessible databases are highly vulnerable to unauthorized login attempts, exploitation of software vulnerabilities and data breaches. Enforcing private access restricts connectivity and enforces the principle of least privilege and network segmentation.
target: aws
level: 1
severity: high
tags:
- access-control
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 2.9 Ensure Database is not Publicly accessible
audit:
  type: manual
  command: '1. Sign in to the AWS Management Console where the Aurora database cluster you are auditing resides. 2. Navigate to the Amazon Aurora and RDS Dashboard. - You can find this under the Database category. 3. Select the DB instance name you wish to audit. - This opens the details page for your specific Aurora DB instance. 4. Under the Connectivity & security tab, check the value of Publicly accessible: - If Set to No, the instance is not publicly accessible; no further network verification is needed. - If Set to Yes, continue with additional steps to fully assess exposure. 5. In the Networking section under Connectivity & security, locate the Subnets for the database: - Right-click on the subnet link and open it in a new tab for further inspection. 6. With the subnet selected, review the attached Route Table: - Check for routes with Destination: 0.0.0.0/0 and Target: an Internet Gateway (ID starts with igw-). - If such a route exists, it enables access to the database from the public
    internet. If the database is marked as "Publicly accessible: Yes" and the subnets contain a route to 0.0.0.0/0 via an Internet Gateway, the instance is exposed to the public internet.'
remediation:
  type: iac_patch
  command: 'Remediation Instructions: Make Aurora DB Instance Non-Publicly Accessible (AWS CLI) Identify all DB instances in the Aurora cluster 1. List your Aurora cluster’s DB instances with: aws rds describe-db-instances --query "DBInstances[?DBClusterIdentifier==''<your-cluster- identifier>''].DBInstanceIdentifier" Replace with your actual Aurora cluster identifier. 2. For each DB instance, run the following command: aws rds modify-db-instance --db-instance-identifier <db-instance-identifier> --no-publicly-accessible --apply-immediately Replace with the name of your DB instance. The --apply-immediately flag ensures the change is applied right away. 3. Verify changes - confirm that “Publicly Accessible” is now set to “No” for each DB instance: aws rds describe-db-instances --db-instance-identifier <db-instance- identifier> --query "DBInstances[0].PubliclyAccessible"'
