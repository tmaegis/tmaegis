id: TMA-AWS-DB-4.1
title: Ensure AWS Identity and Access Management (IAM) is in use
description: AWS Identity and Access Management (IAM) lets you securely control your users' access to AWS services and resources. To manage access control for Amazon DynamoDB, you can create IAM policies that control access to tables and data. IAM policies help you control and maintain access to Amazon DynamoDB as needed.
target: aws
level: 1
severity: high
tags:
- access-control
- aws
- cloud
- database
- iam
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.1 Ensure AWS Identity and Access Management (IAM) is in use
audit:
  type: manual
  command: 1. Open IAM Console - Sign in to the AWS Management Console and open the IAM console at https://console.aws.amazon.com/iam/. 2. Navigate to Policies - In the IAM console, in the navigation pane, choose Policies. 3. Create Policy - Choose Create policy. - You will be taken to the Create policy page. 4. Choose Service - Click on Choose a service. - Type DynamoDB in the search box and select it. 5. Configure Actions - Under the Actions section, select the actions you want to allow the user to perform. - For instance, you can select Read to allow read actions like GetItem, Scan, Query, etc. 6. Set Resources - Under the Resources section, you can specify which tables this policy applies to. - You can choose "All resources" or specify the ARN (Amazon Resource Name) of specific tables. 7. Review Policy - Click on Review policy. - Give your policy a name and description. - Then click Create policy. - Now, you have an IAM policy. 8. Attach Policy - Navigate to the Users, Groups, or Roles
    section in the IAM console. - Choose an existing user, group, or role, or create a new one. - Once you've selected a user, group, or role, click Add permissions. - Choose Attach existing policies directl...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.1 to configure: Ensure AWS Identity and Access Management (IAM) is in use.'
