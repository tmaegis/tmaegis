id: TMA-AWS-DB-3.2
title: Ensure to Create The Appropriate Deployment Configuration
description: This control is important and helps businesses to choose from two deployment options, either single or multi-AZ deployment. Depending on the business factor and their security needs the organization is then encouraged to make a decision that would benefit them.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.2 Ensure to Create The Appropriate Deployment Configuration
audit:
  type: manual
  command: 1. Evaluate High Availability Requirements - Assess the high availability needs of your application. Consider factors such as uptime requirements, business continuity, and disaster recovery. - Determine if your application requires automatic failover, data durability, and minimal downtime during maintenance or outages. 2. Understand RDS Deployment Options - Familiarize yourself with the deployment options available on Amazon RDS. These include single-AZ (Availability Zone) and multi-AZ deployments. - Understand the differences between these options regarding availability, durability, and cost. 3. Single-AZ Deployment - Consider a single-AZ deployment if high availability is not a critical requirement for your application. - In a single-AZ deployment, your database runs in a single Availability Zone, providing basic durability and availability. 4. Multi-AZ Deployment - Choose a multi-AZ deployment if high availability and automatic failover are crucial for your application. - In
    a multi-AZ deployment, your database is replicated synchronously to a standby replica in a different Availability Zone, providing automatic failover in the event of a primary database failure. - Multi-AZ...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.2 to configure: Ensure to Create The Appropriate Deployment Configuration.'
