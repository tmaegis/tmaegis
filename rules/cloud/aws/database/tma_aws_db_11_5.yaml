id: TMA-AWS-DB-11.5
title: Ensure to Implement Access Control and Authentication
description: Utilize QLDB's built-in authentication and access control mechanisms. Define IAM policies to control which users or roles can perform specific actions on QLDB resources. Leverage IAM roles for cross-service access, securely integrating QLDB with other AWS services. Users should select whether they like to enable authentication. If they want to authenticate the user would be required to implement IAM roles would grant or deny permissions within that database.
target: aws
level: 1
severity: high
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.5 Ensure to Implement Access Control and Authentication
audit:
  type: manual
  command: 1. Understand QLDB Authentication and Access Control - Familiarize yourself with the authentication and access control mechanisms provided by QLDB. - Understand the concepts of users, permissions, and roles in QLDB's access control model. 2. Configure IAM for QLDB - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. - Open the Amazon QLDB console. - Go to the Ledgers section. - Select the QLDB ledger for which you want to configure access control. - Under the Configuration tab. - Click on Edit or Modify to make changes. - Enable IAM-based authentication by selecting the appropriate option. - Define the IAM policies that grant or deny permissions for specific QLDB actions. - Configure fine-grained access control by associating IAM policies with IAM users or roles. 3. Create IAM Users or Roles - Identify the individuals or services that require access to QLDB. - Create IAM user accounts for individuals or IAM roles for services.
    - Assign appropriate IAM policies to these users or roles based on their required access levels. 4. Grant Required Permissions - Define IAM policies that grant the necessary permissions for QLDB oper...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.5 to configure: Ensure to Implement Access Control and Authentication.'
