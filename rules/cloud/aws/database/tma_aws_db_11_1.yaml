id: TMA-AWS-DB-11.1
title: Ensure to Implement Identity and Access Management (IAM)
description: This control is important because by having IAM roles implemented in the database it only allows certain people who are authenticated into the database to modify the database and would not give access to unauthorized personnel. This ensures that the data is being protected from any threat actor.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- database
- iam
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.1 Ensure to Implement Identity and Access Management (IAM)
audit:
  type: manual
  command: 1. Understand IAM and QLDB Integration - Familiarize yourself with IAM and its role in controlling access to AWS services, including QLDB. - Understand how IAM policies define permissions and access control rules for QLDB resources. 2. Define IAM Users and Groups - Identify the users and groups that will need access to QLDB. - Create IAM user accounts for individuals who require direct access to QLDB. - Create IAM groups to organize users based on their roles or responsibilities logically. 3. Define IAM Policies - Determine the permissions and actions users and groups need to perform on QLDB resources. - Create custom IAM policies or leverage existing IAM-managed policies to define these permissions. - Consider the principle of least privilege and grant only the necessary permissions for each user or group. 4. Attach IAM Policies to Users and Groups - Associate the appropriate IAM policies with the IAM users and groups. - Ensure that each user or group has the necessary permissions
    to perform their tasks on QLDB. - Regularly review and update the assigned policies as access requirements evolve. 5. Leverage IAM Roles - Identify AWS services or applications that require access to...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.1 to configure: Ensure to Implement Identity and Access Management (IAM).'
