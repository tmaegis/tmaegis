id: TMA-AWS-DB-5.4
title: Ensure Automatic Updates and Patching are Enabled
description: Enabling automatic updates and patching for Amazon ElastiCache ensures that your ElastiCache clusters run the latest software versions with important security fixes and enhancements. Automatic updates help the software be updated and address any vulnerabilities within the software that can help business with any potential exists that can impact the business and prevent any unauthorized access.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- patching
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.4 Ensure Automatic Updates and Patching are Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the ElastiCache Console - Open the Amazon ElastiCache console by navigating to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/elasticache/. 3. Select the ElastiCache Cluster - Choose the ElastiCache cluster you want to enable automatic updates and patching. - Click on the cluster name to access its details page. 4. Enable Automatic Updates - Click on the Configuration tab on the cluster details page. - Scroll down to the Cluster details section. - Under Cluster maintenance and updates, click Modify. - In the Maintenance and updates dialog, find the Auto minor version upgrade option and select Enable. - Leave other settings unchanged or adjust them according to your requirements. - Click Save to apply the changes. 5. Verify Automatic Updates Status - Wait
    for a few moments for the changes to take effect. - Refresh the cluster details page to see the updated configuration. - Verify that the "Auto minor version upgrade" setting is now enabled for the Elast...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 5.4 to configure: Ensure Automatic Updates and Patching are Enabled.'
