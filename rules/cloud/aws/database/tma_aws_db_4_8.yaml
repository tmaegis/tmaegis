id: TMA-AWS-DB-4.8
title: Ensure Database has delete protection enabled
description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion. This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing the risk of data loss through human error or malicious activity. Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion and enhance the overall resilience of their data storage platform.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.8 Ensure Database has delete protection enabled
audit:
  type: manual
  command: 'To check whether delete protection is enabled on your DynamoDB tables, use the following command for each table: aws dynamodb describe-table --table-name <your-table-name> \ --query "{TableName: Table.TableName, DeleteProtectionEnabled: Table.DeletionProtectionEnabled}" \ --output table - Replace with your DynamoDB table name. - This will return True if delete protection is enabled, False otherwise.'
remediation:
  type: iac_patch
  command: 'To enable delete protection on an existing DynamoDB table, use the following command: aws dynamodb update-table \ --table-name my-table \ --deletion-protection-enabled - Replace with your DynamoDB table name. - Delete protection prevents the table from being deleted until the protection is disabled explicitly.'
