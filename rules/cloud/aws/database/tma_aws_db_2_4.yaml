id: TMA-AWS-DB-2.4
title: Ensure IAM Roles and Policies are Created
description: 'AWS Identity and Access Management (IAM) helps manage access to AWS resources. While you cannot directly associate IAM roles with Amazon Aurora instances, you can use IAM roles and policies to define which AWS IAM users and groups have management permissions for Amazon RDS resources and what actions they can perform. Here is a guide: Individual creates IAM roles and polices that define specific permission given to that role. This determines what the identity or instance can and cannot do.'
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- iam
reference: CIS AWS Database Services Benchmark v2.0.0 - 2.4 Ensure IAM Roles and Policies are Created
audit:
  type: manual
  command: '1. Sign in to AWS Management Console - If you do not already have an AWS account, you will need to create one at https://aws.amazon.com. 2. Navigate to IAM Dashboard - Navigate to the IAM service once logged in to the AWS Management Console. - This is under the Security, Identity, & Compliance category. 3. Create a New IAM Role - In the IAM Dashboard, find the Roles section on the left-side navigation pane and click on it. Then, click on the Create Role button. 4. Select the Service that will Use the Role - Choose RDS as the AWS service that will use this new role, then click Next: Permissions. 5. Attach Policy - In the next screen, you can attach policies defining this role’s permissions. You can use the filter to find existing policies like AmazonRDSFullAccess or AmazonRDSReadOnlyAccess. - Select the appropriate policy and then click Next: Tags. 6. Add Tags (Optional) - You can add metadata to the role by attaching tags as key-value pairs. This is optional, and you can proceed
    to the next step if you do not wish to add tags. 7. Review - Provide a name and a description for the role. Review the role and then click Create Role. 8. Creating IAM Policy (Optional) - You can create...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 2.4 to configure: Ensure IAM Roles and Policies are Created.'
