id: TMA-AWS-DB-9.2
title: Ensure Data at Rest is Encrypted
description: This helps ensure that the data is kept secure and protected when at rest. The user must choose from two key options which then determine when the data is encrypted at rest.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.2 Ensure Data at Rest is Encrypted
audit:
  type: manual
  command: '1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster for which you want to enable encryption at rest. - Click on the cluster name to access its details page. 4. Enable Encryption at Rest - In the cluster details page, navigate to the Configuration or Encryption at Rest section. - Under Encryption at Rest, click on Modify. - In the Encryption at Rest dialog box, select the encryption option you prefer: o AWS managed key (default): Choose this option to use the default AWS managed key for encryption. o Customer-managed key (CMK): Choose this option if you want to use your own AWS Key Management Service (KMS) customer-managed key for encryption.
    Select the appropriate CMK from the dropdown menu. - Click Apply Changes to enable encryption at rest for the Neptune cluster. 5. Verify Encryption Status - Wait a few minutes for the changes and configurati...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.2 to configure: Ensure Data at Rest is Encrypted.'
