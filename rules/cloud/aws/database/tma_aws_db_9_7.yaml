id: TMA-AWS-DB-9.7
title: Ensure Monitoring and Alerting is Enabled
description: Ensure Monitoring and Alerting is Enabled
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.7 Ensure Monitoring and Alerting is Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster on which you want to implement monitoring and alerting. - Click on the cluster name to access its details page. 4. Set Up Amazon CloudWatch Metrics - In the cluster details page, navigate to the Monitoring or Metrics section. - Enable CloudWatch metrics for the Neptune cluster by clicking Enable or Configure. - Select the desired metrics to monitor, such as CPU utilization, storage usage, or network throughput. - Choose the appropriate granularity and sampling intervals for the metrics. - Click Save or Apply Changes to enable CloudWatch metrics for the Neptune cluster. 5. Configure CloudWatch
    Alarms - In the CloudWatch console, navigate to Alarms in the left-side menu. - Click Create alarm to configure alarms based on specific metric thresholds. - Select the desired metric to monitor and set...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.7 to configure: Ensure Monitoring and Alerting is Enabled.'
