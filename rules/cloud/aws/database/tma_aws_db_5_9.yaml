id: TMA-AWS-DB-5.9
title: Ensure Audit Logging is Enabled
description: To manage your enterprise caching solution, it is important that you know how your clusters are performing and the resources they are consuming. It's also important that you know the events that are being generated and the costs of your deployment. Amazon CloudWatch provides metrics for monitoring your cache performance. In addition, cost allocation tags help you monitor and manage costs.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- logging
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.9 Ensure Audit Logging is Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Keyspaces Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/keyspaces/. 3. Select the Keyspace - Choose the Keyspace (database) for which you want to enable audit logging. - Click on the Keyspace name to access its details page. 4. Enable Amazon CloudWatch Logs - In the Keyspace details page, click on the Configuration tab. - Under the Logging section, locate the CloudWatch Logs option. - Click on Edit. - Select the Enable option to enable logging for the Keyspace. - Choose an existing CloudWatch Logs log group or create a new one to store the logs generated by the Keyspace activities. - Click Save to enable CloudWatch Logs for the Keyspace. 5. Configure CloudWatch Logs - Open the CloudWatch console by navigating to CloudWatch
    in the AWS Management Console. - In the left-side menu, click on Logs. - Create a new log group or select an existing log group that will store the Keyspaces logs. - Configure log retention settings b...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 5.9 to configure: Ensure Audit Logging is Enabled.'
