id: TMA-AWS-DB-7.9
title: Ensure to Implement Backup and Disaster Recovery
description: Set up automated backups for your DocumentDB instances to ensure data durability and recoverability. Consider implementing a disaster recovery plan that includes data replication across different availability zones or regions. Having the data backed up ensures that all the crucial information is stored securely it defends against any human errors and system errors that resulted in data loss. An organization that has a disaster recovery plan is prepared for any disruption that would impact business operations.
target: aws
level: 1
severity: medium
tags:
- aws
- backup
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.9 Ensure to Implement Backup and Disaster Recovery
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon DocumentDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/docdb/. 3. Select the DocumentDB Cluster - Choose the Amazon DocumentDB cluster for which you want to implement backup and disaster recovery. - Click on the cluster name to access its details page. - In the cluster details page, navigate to the "Backup" section. 4. Enable Automated Backups - Under the Automated backups section. - Click on the Edit button or Modify option to configure automated backup settings. - Enable automated backups by choosing the desired backup retention period. - Specify the number of days for which automated backups should be retained.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.9 to configure: Ensure to Implement Backup and Disaster Recovery.'
