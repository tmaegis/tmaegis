id: TMA-AWS-DB-10.10
title: Ensure Database has automated Backups enabled
description: Ensure that Amazon Timestream tables have automated backups enabled through AWS Backup with a defined backup schedule and retention policy. AWS Backup provides scheduled, automated backup functionality for Timestream tables, creating regular point-in-time snapshots that are retained according to a configurable lifecycle policy. Amazon Timestream stores critical time-series data that is often mission-critical for monitoring, analytics, and operational intelligence. Automated backups through AWS Backup ensure that Timestream tables are continuously protected without requiring manual intervention, and can be rapidly restored in the event of accidental deletion, data corruption, misconfiguration, or application errors.
target: aws
level: 1
severity: medium
tags:
- aws
- backup
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 10.10 Ensure Database has automated Backups enabled
audit:
  type: manual
  command: 'Important Note: Amazon Timestream does not have a native automated backup feature built into the service. Instead, backups are managed through AWS Backup, which provides scheduled, on-demand, and lifecycle-managed backup functionality for Timestream tables. Check if automated backups are enabled via AWS Backup Service: 1. Check if Timestream Database is Assigned to a Backup Plan - List backup plans: aws backup list-backup-plans --query "BackupPlansList[].BackupPlanName" -- output table - For each backup plan, list all backup selections (resource assignments): aws backup list-backup-selections --backup-plan-id <your-backup-plan-id> -- query "BackupSelections[].SelectionId" --output text - For each selection, list assigned resources and search for your database: aws backup get-backup-selection --backup-plan-id <your-backup-plan-id> -- selection-id <selection-id> --query "BackupSelection.Resources" --output text - If your table ARN appears in any selection, it is protected by the
    backup plan. 2. Verify Backup Plan Configuration aws backup get-backup-plan --backup-plan-id <your-backup-plan-id> Look for the "Lifecycle" fields in each backup rule: - "DeleteAfterDays" is the retention...'
remediation:
  type: iac_patch
  command: '1. Create Backup Plan for on-demand snapshots: aws backup create-backup-plan --backup-plan ''{ "BackupPlanName": "<BackupPlanName>", "Rules": [ { "RuleName": "Scheduled-OnDemand-Snapshots", "TargetBackupVaultName": "Default", "ScheduleExpression": "cron(0 3 ? * SUN *)", "StartWindowMinutes": 120, "CompletionWindowMinutes": 360, "Lifecycle": { "DeleteAfterDays": 90 }, "RecoveryPointTags": { "BackupType": "OnDemand" } } ] }'' - Replace "BackupPlanName" with your backup plan name - Replace "Default" with your actual backup vault name if different - Update the "ScheduleExpression", "StartWindowMinutes" based on your unique backup schedule. - Replace "35" with your retention time for PITR if shorter - Replace "90" with your retention time for Snapshots if different This command outputs the BackupPlanId necessary for the next step. 2. Assign Timestream Database to the Backup Plan Replace <BackupPlanId> with the ID from Step 1 and <TableArn> with your Timestream table ARN. aws backup
    create-backup-selection --backup-plan-id <BackupPlanId> --backup- selection ''{ "SelectionName": "timestream-tables", "IamRoleArn": "arn:aws:iam:::role/AWSBackupServiceRolePolicyForBackup", "Resources": ["<Ta...'
