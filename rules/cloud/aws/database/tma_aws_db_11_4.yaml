id: TMA-AWS-DB-11.4
title: Ensure Data in Transit is Encrypted
description: Use Transport Layer Security (TLS) to encrypt communications between clients and your QLDB instance. QLDB provides TLS support by default, allowing secure communication over the network. Configure your client applications to use TLS when connecting to QLDB. Amazon Quantum Ledger Database (QLDB), uses TLS to encrypt data during transit. To secure your data in transit the individual should identify their client application and what is supported by TLS in order to configure it correctly.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.4 Ensure Data in Transit is Encrypted
audit:
  type: manual
  command: 1. Understand TLS Encryption for QLDB - Learn about Transport Layer Security (TLS) and its role in securing data during transit. - Understand how TLS works to establish secure communication channels between clients and QLDB. 2. Configure Clients for TLS Encryption - Ensure that your client applications support TLS encryption for communication with QLDB. - Use the appropriate AWS SDK or QLDB driver that provides TLS encryption support. - Update your application code or configurations to enable TLS encryption. 3. Obtain the QLDB Endpoint - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. - Open the Amazon QLDB console. - Locate the QLDB ledger for which you want to enable encryption in transit. - Note down the QLDB endpoint for your ledger. 4. Establish TLS Connection - Use the QLDB endpoint obtained earlier to establish a TLS connection between your client application and QLDB. - Configure your client application to connect
    to QLDB using the secure HTTPS protocol. - Provide the necessary authentication credentials or tokens required to establish the connection. 5. Verify TLS Encryption - Once the TLS connection is establi...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.4 to configure: Ensure Data in Transit is Encrypted.'
