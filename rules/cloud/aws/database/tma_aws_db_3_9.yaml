id: TMA-AWS-DB-3.9
title: Ensure Monitoring and Logging is Enabled
description: Ensure Monitoring and Logging is Enabled
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.9 Ensure Monitoring and Logging is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to enable monitoring and logging. - Click on the instance name to access its details page. - In the instance details page, navigate to the Configuration or Monitoring & Logs section. 4. Enable Enhanced Monitoring - Under the Monitoring section. - Click on the Modify button or Edit option to enable enhanced monitoring. - Choose the desired monitoring granularity (1-minute or 5-minute intervals) and the retention period for the monitoring data. - Click Continue or Save to apply the changes. 5. Enable Enhanced Logging - Under the Logs or Monitoring & Logs section. - Click on the Modify button or Edit
    option to enable enhanced logging. - Choose the desired log types to enable, such as general, error, slow query, or audit logs. - Configure the log file retention period based on your needs. - Select the d...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.9 to configure: Ensure Monitoring and Logging is Enabled.'
