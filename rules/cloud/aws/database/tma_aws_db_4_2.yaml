id: TMA-AWS-DB-4.2
title: Ensure Fine-Grained Access Control is implemented
description: 'Fine-Grained Access Control (FGAC) on Amazon DynamoDB allows you to control access to data at the row level. Using IAM policies, you can restrict access based on the content within the request. Here is how you can implement FGAC: Fine-Grained access control helps users to create and allow specific permission within that DB.'
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.2 Ensure Fine-Grained Access Control is implemented
audit:
  type: manual
  command: '1. Create an IAM Role - Sign in to the AWS Management Console and open the IAM console at https://console.aws.amazon.com/iam/. - In the navigation pane, choose Roles and select Create role. - Choose AWS service as the type of trusted entity. - Choose DynamoDB as the service that will use this role, then click Next: Permissions. - On the Attach permissions policies page, choose Next: Tags. You do not need to attach a policy to this role yet. - On the Add tags page, choose Next: Review. - On the Review page, for Role name, enter a name for your role, such as DynamoDBFineGrainedAccessRole. - Choose Create role. 2. Create an IAM Policy for Fine-Grained Access Control - In the navigation pane, choose Policies and select Create policy. - Choose the JSON tab. - Paste the following policy into the policy document field, replacing us-west-2, 123456789012, myddbtable, HK, and RANGEK with your own values: { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Action": [ "dynamodb:GetItem",
    "dynamodb:BatchGetItem", "dynamodb:Query", "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:DeleteItem" ], "Resource": "arn:aws:dynamodb:<us-west- 2:123456789012:table/myddbtable>", "Conditi...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.2 to configure: Ensure Fine-Grained Access Control is implemented.'
