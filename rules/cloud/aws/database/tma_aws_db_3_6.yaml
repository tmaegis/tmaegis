id: TMA-AWS-DB-3.6
title: Enable Encryption in Transit
description: Amazon Relational Database uses SSL/TLS to encrypt data during transit. To secure your data in transit the individual should identify their client application and what is supported by SSL/TLS to configure it correctly.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.6 Enable Encryption in Transit
audit:
  type: manual
  command: '1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to implement encryption in transit. - Click on the instance name to access its details page. - In the instance details page, navigate to the Configuration or Encryption & Security section. 4. Enable SSL/TLS - Under the Connectivity or Encryption in Transit section - Click the Modify or Edit option to enable SSL/TLS encryption. - Select the option to enable SSL/TLS encryption. - Choose the SSL/TLS certificate authority (CA) certificate option that best suits your needs: o If you have an existing certificate, select Use a certificate from ACM (AWS Certificate Manager) or Use a certificate from AWS
    Secrets Manager. o If you do not have a certificate, select Generate a new certificate. Click Continue or Save to apply the changes. 5. Verify SSL/TLS Encryption - After enabling SSL/TLS encryption, monitor...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.6 to configure: Enable Encryption in Transit.'
