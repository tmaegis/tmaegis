id: TMA-AWS-DB-8.2
title: Ensure Network Security is Enabled
description: In order to access Amazon Keyspaces the user is required to set specific networking parameters and security measurements without these extra steps they will not be able to access it. Users are required to create or select a virtual private cloud (VPC) and define their inbound and outbound rules accordingly.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 8.2 Ensure Network Security is Enabled
audit:
  type: manual
  command: 1. Create or Select a Virtual Private Cloud (VPC) - Sign in to the AWS Management Console and open the Amazon VPC console at https://console.aws.amazon.com/vpc/. - Create a new VPC or select an existing VPC where you want to deploy your Amazon Keyspaces resources. 2. Configure Subnets - In the VPC console, navigate to Subnets in the left-side menu. - Create or select the subnets within your VPC where you want to deploy your Amazon Keyspaces resources. - Ensure you have private subnets to isolate your Keyspaces resources from the public internet. 3. Define Security Groups - In the VPC console, navigate to Security Groups in the left-side menu. - Create a new security group or select an existing one for your Amazon Keyspaces resources. - Configure inbound and outbound rules in the security group to control traffic access. o Allow inbound access only from trusted sources, such as specific IP ranges or security groups, on the necessary ports used by Amazon Keyspaces. o Define outbound
    rules based on your requirements, allowing outbound traffic to necessary destinations or ports. - Associate the security group with your Amazon Keyspaces resources. 4. Configure Network Access Control...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 8.2 to configure: Ensure Network Security is Enabled.'
