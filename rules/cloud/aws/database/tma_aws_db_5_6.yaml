id: TMA-AWS-DB-5.6
title: Ensure Monitoring and Logging is Enabled
description: Implementing monitoring and logging for Amazon ElastiCache allows you to gain visibility into the performance, health, and behavior of your ElastiCache clusters. This helps the individual know what is being logged within the activity and determine what next step they should take to address any suspicious activity.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.6 Ensure Monitoring and Logging is Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the ElastiCache Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/elasticache/. 3. Select the ElastiCache Cluster - Choose the ElastiCache cluster for which you want to implement monitoring and logging. - Click on the cluster name to access its details page. 4. Enable Enhanced Monitoring - Click on the Monitoring tab on the cluster details page. - Under the Monitoring section, click on the Enable Enhanced Monitoring button. - Select the desired monitoring granularity (1 minute, 5 minutes, or 60 minutes) to capture detailed metrics. - Choose the desired CloudWatch namespace to store the metrics. - Click Save changes to enable enhanced monitoring for the ElastiCache cluster. 5. Set Up CloudWatch Alarms - In the CloudWatch console, navigate
    to Alarms in the left-side menu. - Click Create alarm to create a new alarm. - Select the appropriate ElastiCache metrics from the available options. - Configure the threshold, conditions, and actions...
remediation:
  type: iac_patch
  command: The individual can understand the health, performance, and behavior of their clusters which allows them to address any unusual activity that takes place.
