id: TMA-AWS-DB-3.5
title: Enable Encryption at Rest
description: This helps ensure that the data is kept secure and protected when at rest. The user must choose from two key options which then determine when the data is encrypted at rest.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.5 Enable Encryption at Rest
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to enable encryption at rest. - Click on the instance name to access its details page. - In the instance details page, navigate to the Configuration or Encryption & Security section. 4. Enable Encryption at Rest - Under the Encryption or Encryption at Rest section - Click on the Modify button or the Enable option to enable encryption at rest. - Choose the desired encryption option, either AWS managed keys (default) or Customer managed keys using AWS Key Management Service (KMS). - If selecting AWS managed keys, you do not need to perform additional configuration steps. - If selecting Customer managed
    keys you will need to specify the KMS key you want to use for encryption. - Select the appropriate KMS key or create a new KMS key if necessary. - Click Continue or Save to apply the changes. 5. Monitor...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.5 to configure: Enable Encryption at Rest.'
