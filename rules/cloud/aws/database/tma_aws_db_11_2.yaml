id: TMA-AWS-DB-11.2
title: Ensure Network Access is Secure
description: By applying certain network access such as Virtual Private Cloud (VPC) it protects the private network that has been established from any external networks from interfering. It allows internal networks to communicate with one another with the network that has been established. The Access Control List (ACLs) allows only specific individuals to access the resources. Also, by monitoring and logging the activity within the database it helps the individual know what is being logged within the activity and determine what next step they should take to address it.
target: aws
level: 1
severity: high
tags:
- access-control
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.2 Ensure Network Access is Secure
audit:
  type: manual
  command: 1. Deploy QLDB in a VPC - Create a Virtual Private Cloud (VPC) to isolate your QLDB resources. - Define the network CIDR blocks, subnets, and routing configurations for the VPC. - Ensure that the VPC is correctly configured with appropriate network access controls. 2. Configure Security Groups - Create security groups within your VPC to control inbound and outbound traffic to QLDB. - Determine the necessary protocols and ports for QLDB access. - Configure security group rules to allow access from trusted sources, such as specific IP ranges or other security groups within your VPC. 3. Set Up Network ACLs - Configure Network Access Control Lists (ACLs) within your VPC to provide an additional layer of network security. - Define inbound and outbound rules in the ACLs to allow or deny specific traffic based on IP addresses, ports, or protocols. - Review and adjust the ACL rules to align with your organization's security policies and requirements. 4. Use VPC Endpoints or PrivateLink
    - Consider using VPC endpoints or AWS PrivateLink to securely access QLDB without traversing the public internet. - Set up a VPC endpoint for QLDB to allow private connectivity within your VPC. - Configur...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.2 to configure: Ensure Network Access is Secure.'
