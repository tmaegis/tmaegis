id: TMA-AWS-DB-5.2
title: Ensure Network Security is Enabled
description: Implementing network security for Amazon ElastiCache involves configuring your Virtual Private Cloud (VPC), security groups, and network access controls to control access to your ElastiCache clusters. This helps ensure that the data is safe and protected from any threats and or misconfigurations within the network. This helps to keep a potential hacker getting into the system and compromising the data.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.2 Ensure Network Security is Enabled
audit:
  type: manual
  command: 1. Create or Select a VPC - Sign in to the AWS Management Console and open the Amazon VPC console at https://console.aws.amazon.com/vpc/. - Create a new VPC or select an existing VPC where you want to deploy your ElastiCache cluster. 2. Create Subnets - In the VPC console, navigate to Subnets in the left-side menu. - Create or select the desired subnets within your VPC where you want to deploy your ElastiCache cluster. 3. Configure Security Groups - In the VPC console, navigate to Security Groups in the left-side menu. - Create a new security group. Or select an existing one to configure the security settings for your ElastiCache cluster. - Define inbound and outbound rules to control the traffic flow to and from your ElastiCache cluster. o Allow inbound traffic from trusted sources (e.g., specific IP ranges or security groups) on the necessary ports used by your ElastiCache cluster. o Define outbound rules based on your requirements, such as allowing outbound traffic to specific
    destinations or ports. - Associate the security group with the ElastiCache cluster when creating or modifying it. 4. Set up Network Access Control Lists (ACLs) - In the VPC console, navigate to Network...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 5.2 to configure: Ensure Network Security is Enabled.'
