id: TMA-AWS-DB-7.4
title: Ensure Encryption in Transit is Enabled
description: Amazon Database DB uses SSL/TLS to encrypt data during transit. To secure your data in transit the individual should identify their client application and what is supported by TLS to configure it correctly.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.4 Ensure Encryption in Transit is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon DocumentDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/docdb/. 3. Select the DocumentDB Cluster - Choose the Amazon DocumentDB cluster for which you want to enable encryption in transit. - Click on the cluster name to access its details page. - In the cluster details page, navigate to the "Configuration" section. 4. Enable Encryption in Transit - Under the Network & Security section. - Click on the Edit button or Modify option to configure the encryption settings. - Enable the option for encryption in transit by choosing the appropriate setting. - Note that encryption in transit uses SSL/TLS to secure communications between your applications and the DocumentDB cluster. 5. Save the Configuration - Click on the "Save" button
    to apply the encryption in transit configuration. - DocumentDB will automatically handle the SSL/TLS encryption for network traffic between clients and the cluster. 6. Validate Encryption in Transit -...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.4 to configure: Ensure Encryption in Transit is Enabled.'
