id: TMA-AWS-DB-3.8
title: Ensure to Regularly Patch Systems
description: Ensure to Regularly Patch Systems
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- patching
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.8 Ensure to Regularly Patch Systems
audit:
  type: manual
  command: 1. Stay Informed about Database Engine Updates - Stay up-to-date with the latest information regarding database engine updates and patches provided by the respective database engine vendors (e.g., MySQL, PostgreSQL, Oracle, SQL Server). - Subscribe to release announcements, security bulletins, and updates from the database engine vendor or AWS. 2. Review the Database Engine Documentation - Refer to the documentation provided by the database engine vendor to understand the recommended patching and update processes specific to the database engine you use on Amazon RDS. - Review the vendor's guidelines and best practices for applying updates and patches. 3. Plan for Maintenance Windows - Determine regular maintenance windows during which you can schedule updates and patches for your RDS instances. - Coordinate with your team to ensure minimal disruption to your applications and users during the maintenance window. 4. Enable Automated Minor Version Upgrades - In the Amazon RDS console,
