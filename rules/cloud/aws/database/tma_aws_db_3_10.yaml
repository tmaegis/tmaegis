id: TMA-AWS-DB-3.10
title: Ensure to Enable Backup and Recovery
description: The individual logs into their AWS account and chooses their Amazon relational database that they want to backup. To have the database being backed up automatically the individual is encouraged to enable backup. This ensures that the file is being saved automatically and can prevent it from accidental loss. This ensures that the individual can restore their files quickly in the event of a data loss.
target: aws
level: 1
severity: medium
tags:
- aws
- backup
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.10 Ensure to Enable Backup and Recovery
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to implement backup and recovery. - Click on the instance name to access its details page. - In the instance details page, navigate to the Backup & Restore or Backup section. 4. Configure Automated Backups - Under the Backup section. - Click the Modify or Edit option to configure automated backups. - Enable automated backups by selecting the desired backup retention period. - Specify the preferred backup window during which automated backups can occur. - Choose whether to enable Multi-AZ backups for enhanced durability and availability. - Click Continue or Save to apply the changes. 5. Restore from
    Backups - In the Amazon RDS console, click on Snapshots or Instances in the left-side menu. - Select the snapshot or instance from which you want to perform a restore. - Click Restore snapshot or Restore...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.10 to configure: Ensure to Enable Backup and Recovery.'
