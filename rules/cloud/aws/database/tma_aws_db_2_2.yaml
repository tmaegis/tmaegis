id: TMA-AWS-DB-2.2
title: Ensure Data at Rest is Encrypted
description: Amazon Aurora allows you to encrypt your databases using keys you manage through AWS Key Management Service (KMS). Databases are likely to hold sensitive and critical data; therefore, it is highly recommended to implement encryption to protect your data from unauthorized access or disclosure.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 2.2 Ensure Data at Rest is Encrypted
audit:
  type: manual
  command: '1. Sign in to the AWS Management Console where the Aurora database cluster you are auditing resides. 2. Navigate to the Amazon Aurora and RDS Dashboard: - You can find this under the Database category. 3. Select the DB cluster name you wish to audit: - This opens the details page for your specific Aurora cluster. 4. Check the encryption status under the Configuration section. - Confirm that the field Encryption is marked as Enabled. 5. Verify KMS key usage (if your organization''s standards require a customer- managed key): - In the Encryption section, identify the AWS KMS key associated with the cluster. Click the key link to open its details page. Confirm that it is a customer-managed KMS key, not an AWS-managed key. - Review additional key attributes to ensure compliance, including Key policy, Key rotation status, etc.'
remediation:
  type: iac_patch
  command: 'For existing Aurora databases: In order to encrypt an existing Aurora instance that was not initially created with encryption enabled, you will need to create a snapshot of the instance, make a copy of the snapshot with encryption enabled, and then restore the DB instance from the copied snapshot. For creating new Aurora databases with encryption at rest enabled: 1. Sign in to AWS Management Console If you do not already have an AWS account, you''ll need to create one at https://aws.amazon.com 2. Navigate to the Amazon Aurora and RDS Dashboard: - You can find this under the Database category. 3. Click on Create Database and choose Aurora as your engine option. 4. In the Additional Configuration section, you will see an option labeled Enable encryption. Check this box to enable encryption for data at rest. - You will also need to select a master key to use for encryption. You can choose the default AWS managed key for RDS or a pre-created customer-managed AWS Key Management Service
    (KMS) that aligns with your organization’s key management policies. 5. Launch the DB Instance - After you have selected the appropriate encryption settings, click Create database. - Review your settings...'
