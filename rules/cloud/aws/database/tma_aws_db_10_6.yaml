id: TMA-AWS-DB-10.6
title: Ensure Audit Logging is Enabled
description: Enable AWS CloudTrail to capture and log API calls and activities related to Amazon Timestream. Configure CloudTrail to store the logs in a secure location and regularly review the logs for any unauthorized or suspicious activities. This captures and saves logs of activities that took place in the database.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
reference: CIS AWS Database Services Benchmark v2.0.0 - 10.6 Ensure Audit Logging is Enabled
audit:
  type: manual
  command: 1. Understand Audit Logging in Timestream Familiarize yourself with audit logging and its importance in monitoring and tracking activities in Timestream. Understand that audit logs capture API calls and events related to Timestream actions and resources. 2. Enable AWS CloudTrail Access the AWS Management Console and navigate to the AWS CloudTrail service. Create a new CloudTrail trail or use an existing one to capture Timestream audit logs. Configure the trail to include Timestream as a data source for logging. 3. Configure CloudTrail Logging Options Specify the desired settings for the CloudTrail trail, such as the S3 bucket to store the audit logs and the log file encryption options. Enable logging of management and data events related to Timestream. Configure the trail to capture the necessary information for your audit and compliance requirements. 4. Set Up CloudTrail Notifications and Alerts Configure CloudTrail to send notifications or trigger actions based on specific events
    or conditions. Set up CloudWatch Alarms to monitor and receive notifications for critical Timestream audit events. Define the appropriate alert thresholds and actions to respond to specific events. 5....
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 10.6 to configure: Ensure Audit Logging is Enabled.'
