id: TMA-AWS-DB-3.11
title: Ensure to Regularly Review Security Configuration
description: This helps by reviewing the database factors from database engine, review instance details, security networks, encryption settings, audit logging, and authentication. By updating or removing a few things from these lists it helps tighten security and ensures that the users do not have excessive permissions.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.11 Ensure to Regularly Review Security Configuration
audit:
  type: manual
  command: '1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance you want to review the security configuration. - Click on the instance name to access its details page. 4. Review the Database Engine Documentation - Refer to the documentation provided by the database engine vendor (e.g., MySQL, PostgreSQL, Oracle, SQL Server) to understand the security best practices and configuration options specific to the database engine you use on Amazon RDS. - Review the vendor''s guidelines for securing the database engine and associated components. 5. Review the Instance Details - In the instance details page, review the configuration settings related to security. - Security group
    associations: Ensure the appropriate security groups are assigned to the RDS instance to control inbound and outbound traffic. - IAM database authentication: Verify if IAM database authentication is enabled...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.11 to configure: Ensure to Regularly Review Security Configuration.'
