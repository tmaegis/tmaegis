id: TMA-AWS-DB-7.1
title: Ensure Network Architecture Planning
description: Plan the network architecture to isolate your DocumentDB instances within a secure Virtual Private Cloud (VPC). Configure appropriate security groups and network access control lists (ACLs) to control inbound and outbound traffic to your DocumentDB instances. Depending on how the network is established between devices, which then helps secure data when transferring it from one server to another.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.1 Ensure Network Architecture Planning
audit:
  type: manual
  command: 1. Understand Amazon VPC Basics - Familiarize yourself with Amazon Virtual Private Cloud (VPC) and its concepts. - Learn about VPC components, including subnets, route tables, and security groups. 2. Determine VPC Requirements for DocumentDB - Identify the specific networking requirements for your Amazon DocumentDB deployment. - Consider factors such as network availability, fault tolerance, and security requirements. 3. Create a New VPC or Use an Existing VPC - Decide whether to create a new VPC dedicated to Amazon DocumentDB or use an existing VPC. - If creating a new VPC, follow the steps to create a VPC in the AWS Management Console. 4. Configure Subnets - Determine the number and size of subnets needed for your DocumentDB deployment. - Create the required subnets within your VPC, ensuring proper availability zone distribution. 5. Set Up Routing - Configure the route tables associated with your subnets. - Ensure that the route tables have the necessary routes for proper network
    connectivity. 6. Configure Security Groups - Create or configure security groups to control inbound and outbound traffic to your DocumentDB instances. - Define the necessary inbound rules to allow acc...
remediation:
  type: iac_patch
  command: To establish connection, the users would need to factor in their virtual private cloud (VPC), create subnet, configure routing, and implement ACLs.
