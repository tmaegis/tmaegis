id: TMA-AWS-DB-5.7
title: Ensure Security Configurations are Reviewed Regularly
description: Regularly updating and reviewing the security configuration of your Amazon ElastiCache clusters helps ensure that your clusters are protected against potential vulnerabilities and aligned with your security requirements. This ensures that the clusters are being regularly updated and protected from any potential vulnerabilities as well as meeting the security requirements.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.7 Ensure Security Configurations are Reviewed Regularly
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the ElastiCache Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/elasticache/. 3. Select the ElastiCache Cluster - Choose the ElastiCache cluster you want to update and review the security configuration. Click on the cluster name to access its details page. 4. Review IAM Policies - Navigate to the Configuration tab on the cluster details page. - Click on the IAM Access tab. - Review the IAM policies associated with the ElastiCache cluster and its resources. - Ensure that the IAM policies provide the least privileged access, granting only the necessary permissions to users and roles. - Update the IAM policies as required based on changes in access requirements or security best practices. 5. Review Security Groups - Navigate to the Configuration
