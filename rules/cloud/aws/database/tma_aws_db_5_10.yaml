id: TMA-AWS-DB-5.10
title: Ensure Security Configurations are Reviewed Regularly
description: Regularly updating and reviewing the security configuration of your Amazon Keyspaces environment helps ensure that your database is protected against potential vulnerabilities and aligned with your security requirements.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.10 Ensure Security Configurations are Reviewed Regularly
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Keyspaces Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/keyspaces/. 3. Select the Keyspace - Choose the Keyspace (database) for which you want to update and review the security configuration. - Click on the Keyspace name to access its details page. 4. Review IAM Roles and Permissions - In the Keyspace details page, click on the Configuration tab. - Under the Authentication and access control section, review the IAM roles and permissions associated with the Keyspace. - Ensure that the IAM roles have appropriate permissions and follow the principle of least privilege. - Review the IAM policies and make any necessary updates to align with your security requirements. 5. Review Network Security - In the Keyspace details page,
