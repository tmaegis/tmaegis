id: TMA-AWS-DB-2.11
title: Ensure Database has delete protection enabled
description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion. This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing the risk of data loss through human error or malicious activity. Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion and enhance the overall resilience of their data storage platform.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 2.11 Ensure Database has delete protection enabled
audit:
  type: manual
  command: 'Run the following command to check if deletion protection is enabled on your Aurora DB cluster(s): aws rds describe-db-clusters \ --query "DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,DeletionProtection:De letionProtection}" \ --output table - Review each cluster''s DeletionProtection status. - Clusters marked as true have deletion protection enabled. - Identify any clusters with deletion protection disabled for remediation.'
remediation:
  type: iac_patch
  command: '1. To enable deletion protection on an existing Aurora DB cluster: aws rds modify-db-cluster \ --db-cluster-identifier <your-cluster-name> \ --deletion-protection \ --apply-immediately - Replace with your Aurora cluster ID. - This change is applied immediately without downtime. - Once enabled, the cluster cannot be deleted without first disabling deletion protection.'
