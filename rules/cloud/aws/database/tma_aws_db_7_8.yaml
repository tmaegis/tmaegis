id: TMA-AWS-DB-7.8
title: Ensure to Implement Monitoring and Alerting
description: This helps by alerting the system if any unusual event has occurred or if a particular threshold has been achieved because the user is able to set a desired interval or the cluster. This then allows system administrators to swiftly correct the situation and avoid subsequent complications if something unusual is happening.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.8 Ensure to Implement Monitoring and Alerting
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon DocumentDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/docdb/. 3. Select the DocumentDB Cluster - Choose the Amazon DocumentDB cluster for which you want to implement monitoring and alerting. - Click on the cluster name to access its details page. - In the cluster details page, navigate to the "Monitoring" section. 4. Enable Enhanced Monitoring - Under the Enhanced Monitoring section. - Click on the Edit button or Modify option to configure enhanced monitoring settings. - Enable the desired metrics and set the desired monitoring interval for the cluster. - Enhanced monitoring provides additional insights into the performance and health of your DocumentDB cluster. 5. Set Up CloudWatch Alarms - Scroll down to the CloudWatch
    Alarms section. - Click on the Create alarm button. - Configure the CloudWatch alarm based on the metrics you want to monitor and the thresholds you want to set. - Specify the actions to be taken when...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.8 to configure: Ensure to Implement Monitoring and Alerting.'
