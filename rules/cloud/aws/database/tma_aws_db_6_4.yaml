id: TMA-AWS-DB-6.4
title: Ensure Audit Logging is Enabled
description: Enabling audit logging on Amazon MemoryDB allows you to capture and store logs of activities performed on your clusters. It captures and saves logs of activities that took place in the cluster.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
reference: CIS AWS Database Services Benchmark v2.0.0 - 6.4 Ensure Audit Logging is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon MemoryDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/memorydb/. 3. Select the Cluster - Choose the MemoryDB cluster for which you want to enable audit logging. Click on the cluster name to access its details page. 4. Enable Amazon CloudWatch Logs - In the cluster details page, navigate to the Logging section. - Click on Modify to edit the logging settings. - Select the option to enable CloudWatch Logs. - Choose an existing CloudWatch log group or create a new one to store the logs generated by the MemoryDB cluster activities. - Optionally, you can specify a log retention period to define how long the logs will be stored. - Click Apply Changes to enable CloudWatch Logs for the MemoryDB cluster. 5. Configure CloudWatch
    Logs - Open the CloudWatch console by navigating to CloudWatch in the AWS Management Console. - In the left-side menu, click on Logs. - Create a new log group or select an existing log group that will store...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 6.4 to configure: Ensure Audit Logging is Enabled.'
