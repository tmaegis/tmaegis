id: TMA-AWS-DB-11.7
title: Ensure to Enable Backup and Recovery
description: Having the data backed up ensures that all the crucial information is stored securely it defends against any human errors and system errors that resulted in data loss. An organization that has a disaster recovery plan is prepared for any disruption that would impact business operations.
target: aws
level: 1
severity: medium
tags:
- aws
- backup
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.7 Ensure to Enable Backup and Recovery
audit:
  type: manual
  command: 1. Understand QLDB Backup and Recovery Features - Familiarize yourself with the built-in backup and recovery capabilities provided by QLDB. - Understand the concepts of ledgers, revisions, and journal export for backup and restore operations. 2. Determine Backup and Recovery Requirements - Assess your organization's backup and recovery requirements for QLDB. - Define the recovery point objective (RPO) and recovery time objective (RTO) that align with your business needs. - Determine the desired backup frequency and retention period for your QLDB data. 3. Enable Automatic Backups - Open the Amazon QLDB console. - Select the QLDB ledger for which you want to enable automatic backups. - Click on the Configuration tab. - Under the Backup section, enable automatic backups. - Specify the desired backup retention period for the automatic backups. 4. Perform Manual Backups (Optional) - If you need additional backups or want to perform on-demand backups, initiate manual backups. - Open
    the Amazon QLDB console. - Select the QLDB ledger you want to back up. - Click on the Backups tab. - Choose the Create Backup option. - Provide a meaningful backup name and initiate the backup process. 5....
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.7 to configure: Ensure to Enable Backup and Recovery.'
