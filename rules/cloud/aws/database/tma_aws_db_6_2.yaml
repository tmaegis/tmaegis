reference: CIS AWS Database Services Benchmark v2.0.0 - 6.2 Ensure Data at Rest and in Transit is Encrypted
audit:
  type: manual
  command: '1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon MemoryDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/memorydb/. 3. Select the Cluster - Choose the MemoryDB cluster for which you want to enable encryption at rest and in transit. - Click on the cluster name to access its details page. 4. Enable Encryption at Rest - In the cluster details page, navigate to the Encryption at Rest section. - Click on Modify to edit the encryption settings. - Select the desired encryption option: o AWS Managed Key (Default): Choose this option to use the default AWS managed key for encryption at rest. Amazon MemoryDB automatically encrypts your data using this key. o Customer Managed Key (CMK): Choose this option if you want to use your own AWS Key Management Service (KMS) customer-managed
    key for encryption. Select the appropriate CMK from the dropdown menu. - Click "Apply Changes" to enable encryption at rest for the MemoryDB cluster. 5. Enable Encryption in Transit - In the cluster de...'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 6.2 to configure: Ensure Data at Rest and in Transit is Encrypted.'
