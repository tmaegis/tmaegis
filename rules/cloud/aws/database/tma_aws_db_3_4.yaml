id: TMA-AWS-DB-3.4
title: Ensure to Configure Security Groups
description: Configuring security groups benefits the user because it helps manage networks within the database and gives only certain permission for traffic that leaves and enters the database.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 3.4 Ensure to Configure Security Groups
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon RDS Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/rds/. 3. Select the RDS Instance - Choose the Amazon RDS instance for which you want to configure security groups. Click on the instance name to access its details page. 4. Navigate to the Connectivity & Security Section - In the instance details page, navigate to the Connectivity & Security or "Security" section. 5. View and Modify Existing Security Groups - Under the Security section, you will see the existing security groups associated with the RDS instance. - Take note of the existing security groups and their inbound and outbound rules. 6. Create a New Security Group - If you need to create a new security group for the RDS instance - Click the Create New Security Group
    button. - Provide a name and description for the new security group. - Configure the inbound and outbound rules to control network traffic to and from the RDS instance. - Click "Create" to create the ne...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 3.4 to configure: Ensure to Configure Security Groups.'
