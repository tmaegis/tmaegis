id: TMA-AWS-DB-5.1
title: Ensure Secure Access to ElastiCache
description: Securing access to Amazon ElastiCache involves implementing appropriate authentication and authorization mechanisms.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.1 Ensure Secure Access to ElastiCache
audit:
  type: manual
  command: 1. Use AWS Identity and Access Management (IAM) - Sign in to the AWS Management Console and open the IAM console at https://console.aws.amazon.com/iam/. - Create IAM users or roles for individuals or applications needing ElastiCache access. - Define fine-grained permissions using IAM policies to allow only necessary actions on ElastiCache resources. - Assign IAM policies to the IAM users or roles to grant access. 2. Implement Secure Network Access - Place your ElastiCache cluster within a Virtual Private Cloud (VPC) to control network access. - Create and configure security groups to allow access only from trusted networks or specific IP ranges. - Ensure your VPC's network ACLs (Access Control Lists) are properly configured to restrict inbound and outbound traffic. 3. Enable Encryption in Transit - Configure your ElastiCache cluster to use SSL/TLS encryption for client connections. - Use the --transit-encryption-enabled parameter when creating or modifying the cluster to enable
    encryption in transit. - Update your client applications to connect to the ElastiCache cluster using SSL/TLS. 4. Protect ElastiCache Credentials - Avoid sharing access keys, secret keys, or IAM user crede...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 5.1 to configure: Ensure Secure Access to ElastiCache.'
