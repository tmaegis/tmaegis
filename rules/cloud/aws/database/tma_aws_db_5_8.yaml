id: TMA-AWS-DB-5.8
title: Ensure Authentication and Access Control is Enabled
description: Individual creates IAM roles that would give specific permission to what the user can and cannot do within that database. The Access Control List (ACLs) allows only specific individuals to access the resources.
target: aws
level: 1
severity: high
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.8 Ensure Authentication and Access Control is Enabled
audit:
  type: manual
  command: 1. Sign in to the AWS Management Console - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Keyspaces Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/keyspaces/. 3. Select the Keyspace - Choose the Keyspace (database) for which you want to implement authentication and access control. - Click on the Keyspace name to access its details page. 4. Enable IAM for Cassandra - In the Keyspace details page, click on the Configuration tab. - Under the Authentication and access control section, locate the "IAM for Cassandra" option. - Click on Edit. - Select the Enable option to enable IAM for Cassandra authentication and authorization. - Choose the IAM role(s) that can access the Keyspace - Click Save to enable IAM for Cassandra. 5. Define IAM Roles and Permissions - Open the IAM console by navigating to Identity and Access
    Management (IAM) in the AWS Management Console. - Create IAM roles with appropriate policies defining the desired access level to your Amazon Keyspaces resources. - You may create different roles for d...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 5.8 to configure: Ensure Authentication and Access Control is Enabled.'
