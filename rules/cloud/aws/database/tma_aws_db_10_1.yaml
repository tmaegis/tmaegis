id: TMA-AWS-DB-10.1
title: Ensure Data Ingestion is Secure
description: This helps ensure that the system is updated with any potential vulnerabilities that might pose a threat to the organization. Helps authenticate the sources that are coming to the database and ensures that only authorized users have the credential to access the data.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 10.1 Ensure Data Ingestion is Secure
audit:
  type: manual
  command: 1. Secure Data Sources Ensure that your data sources are protected with appropriate security measures. Implement secure network configurations, access controls, and authentication mechanisms for your data sources. Apply security patches and updates to your data source systems to prevent vulnerabilities. 2. Use HTTPS or AWS Direct Connect When ingesting data into Timestream, use secure communication protocols such as HTTPS. Encrypt data in transit to protect it from unauthorized interception. Consider using AWS Direct Connect for a dedicated private network connection to Timestream, ensuring data privacy. 3. Implement Client-Side Encryption Encrypt your data before sending it to Timestream using client-side encryption. Use industry-standard encryption algorithms and strong encryption keys to protect the confidentiality of your data. Store and manage the encryption keys securely using AWS Key Management Service (KMS). 4. Authenticate Data Sources Implement authentication mechanisms
    for your data sources to ensure only authorized sources can ingest data into Timestream. Use mechanisms such as API keys, access tokens, or client certificates to verify the authenticity of the data sou...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 10.1 to configure: Ensure Data Ingestion is Secure.'
