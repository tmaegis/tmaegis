id: TMA-AWS-DB-11.6
title: Ensure Monitoring and Logging is Enabled
description: Enable QLDB's built-in logging to capture important system events and database activity. Monitor the logs for any suspicious activities or errors. Leverage Amazon CloudWatch to collect and analyze logs, set up alarms, and receive notifications for potential security incidents. This helps the individual know what is being logged within the activity and determine what next step they should take to address it.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
- monitoring
reference: CIS AWS Database Services Benchmark v2.0.0 - 11.6 Ensure Monitoring and Logging is Enabled
audit:
  type: manual
  command: 1. Enable AWS CloudTrail - Sign in to the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. - Open the AWS CloudTrail console. - Create a new trail or select an existing trail. - Configure the trail to capture QLDB API calls and relevant events. - Specify the Amazon S3 bucket where the CloudTrail logs will be stored. - Enable the trail to start capturing QLDB events. 2. Enable Amazon CloudWatch Logs - Open the Amazon CloudWatch console. - Create a new log group or select an existing log group. - Configure the log group to receive QLDB logs from CloudTrail. - Define the log retention period to retain the logs for the desired duration. - Enable CloudWatch Logs to start receiving and storing QLDB logs. 3. Configure Log Metric Filters - In the CloudWatch console, go to the log group that contains the QLDB logs. - Define log metric filters to extract specific information or patterns from the logs. - Create metric filters based on your monitoring
    and alerting requirements. - Specify the target metric and define the filter patterns to match the desired log events. 4. Create CloudWatch Dashboards and Alarms - Create CloudWatch dashboards to vis...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 11.6 to configure: Ensure Monitoring and Logging is Enabled.'
