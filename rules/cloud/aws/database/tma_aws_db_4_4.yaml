id: TMA-AWS-DB-4.4
title: Ensure DynamoDB Encryption in Transit
description: 'Use the SSL/TLS protocol to encrypt data in transit between your applications and DynamoDB. Amazon DynamoDB encrypts data in transit by default using Transport Layer Security (TLS) encryption. Here is a step-by-step guide on how to ensure encryption in transit for your DynamoDB: Amazon DynamoDB uses TLS to encrypt data during transit. To secure your data in transit the individual should identify their client application and what is supported by TLS to configure it correctly.'
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.4 Ensure DynamoDB Encryption in Transit
audit:
  type: manual
  command: '1. Access the DynamoDB Console - Sign in to the AWS Management Console and open the DynamoDB console at https://console.aws.amazon.com/dynamodb/. 2. Create or Select a DynamoDB Table - You can create a new DynamoDB table or select an existing one to configure encryption in transit. 3. Verify Encryption Settings - By default, DynamoDB encrypts data in transit using TLS. To ensure that encryption in transit is enabled: - In the DynamoDB console, select your table. - In the table details, navigate to the Overview tab. - Under the Encryption section, verify that "Encryption at rest" is enabled. This indicates that data is encrypted at rest. - Confirm that Encryption in transit is enabled. It should be enabled by default. 4. Use SSL/TLS Endpoints for API Calls - To ensure that your API calls to DynamoDB are encrypted in transit, use SSL/TLS endpoints: - Use the appropriate SDK or AWS CLI in your application or code that interacts with DynamoDB. - By default, the SDKs and AWS CLI use
    the SSL/TLS endpoints provided by DynamoDB. - Verify that your code is configured to connect to DynamoDB using the appropriate SSL/TLS endpoint.'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.4 to configure: Ensure DynamoDB Encryption in Transit.'
