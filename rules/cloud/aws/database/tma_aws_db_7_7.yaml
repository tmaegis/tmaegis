id: TMA-AWS-DB-7.7
title: Ensure Regular Updates and Patches
description: Stay informed about the latest security updates and patches released by Amazon for DocumentDB. Regularly apply updates and patches to your DocumentDB instances to protect against known vulnerabilities.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- patching
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.7 Ensure Regular Updates and Patches
audit:
  type: manual
  command: 1. Stay Informed - Stay updated with Amazon DocumentDB announcements, release notes, and security bulletins. - Subscribe to AWS newsletters, forums, and notifications to receive timely updates regarding updates and patches. 2. Plan for Maintenance Windows - Determine a suitable maintenance window to apply updates and patches to your DocumentDB cluster. - Consider the impact on your applications and users when scheduling the maintenance window. 3. Monitor the AWS Management Console - Regularly check the AWS Management Console for notifications related to available updates and patches for your DocumentDB cluster. - The console will provide information on new versions and available patches. 4. Review the Release Notes and Changelog - Before applying any updates or patches, review the release notes and changelog for the new version or patch. - Pay attention to any compatibility or breaking changes that may require application adjustments. 5. Create a Test Environment (Optional) -
    If feasible, create a separate test environment that closely resembles your production environment. - Deploy a copy of your DocumentDB cluster in the test environment to test the updates and patches before...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.7 to configure: Ensure Regular Updates and Patches.'
