id: TMA-AWS-DB-2.1
title: Ensure the Use of Security Groups
description: Security groups act as a firewall for associated Amazon RDS DB instances, controlling both inbound and outbound traffic. Creating your severity group either inbound or outbound rules. Inbound rules allow an individual to create a rule that permits the traffic to go to a specific port depending on which source it's coming from. Outbound rules enable your instances to connect with one another allow them to connect to the internet. If needed, you can limit the outgoing traffic.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 2.1 Ensure the Use of Security Groups
audit:
  type: manual
  command: 1. Open the Amazon Console 2. Go to Aurora and RDS (https://console.aws.amazon.com/rds/) 3. Click on Databases 4. For each database instance click the name of the instance and check that there is at least one VPC security group under Connectivity & security -> Security -> VPC security groups
remediation:
  type: iac_patch
  command: 'Here is a step-by-step guide on how to create and use Security Groups for an Amazon Aurora instance: 1. Sign in to AWS Management Console If you do not already have an AWS account, you''ll need to create one at https://aws.amazon.com. 2. Navigate to Amazon EC2 Dashboard Once you have logged in to the AWS Management Console, navigate to the EC2 service. You can find this under the Compute category. 3. Create a New Security Group - In the EC2 Dashboard, find the Network & Security section on the left-side navigation pane, then click Security Groups. - Click on the Create Security Group button. 4. Configure the New Security Group - In the Create Security Group panel, give your new security group a name and a description. - Select the VPC in which your Amazon Aurora instance will be deployed. - Then click Create. 5. Add Rules to the Security Group After creating the Security Group, you can add inbound and outbound rules. For Inbound Rules: - Click on the Inbound rules tab, then click
    Edit inbound rules. - Click Add Rule. For the type, select MYSQL/Aurora. For the source, you can specify the IP addresses allowed to access your Amazon Aurora instance. For Outbound Rules: - Click on the...'
