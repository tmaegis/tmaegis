id: TMA-AWS-DB-6.5
title: Ensure Security Configurations are Reviewed Regularly
description: This helps by removing or updating any IAM roles, security networks, encryption settings, audit logging, and authentication. By updating or removing a few things from these lists it helps tighten security and ensures that the users do not have excessive permissions.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 6.5 Ensure Security Configurations are Reviewed Regularly
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon MemoryDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/memorydb/. 3. Select the Cluster - Choose the Amazon MemoryDB cluster for which you want to update and review the security configuration. - Click on the cluster name to access its details page. 4. Review IAM Roles and Permissions - In the cluster details page, navigate to the Security or Access Control section. - Review the IAM roles and permissions associated with the cluster. - Ensure that the IAM roles have appropriate permissions and follow the principle of least privilege. - Review the IAM policies and make any necessary updates to align with your security requirements. 5. Review Network Security - In the cluster details page, navigate to the Security or Network
    & Security section. - Review the Virtual Private Cloud (VPC), subnets, security groups, and network ACLs associated with the cluster. - Ensure that the VPC and subnet configurations align with your securi...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 6.5 to configure: Ensure Security Configurations are Reviewed Regularly.'
