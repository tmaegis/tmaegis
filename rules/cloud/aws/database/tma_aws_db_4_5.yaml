id: TMA-AWS-DB-4.5
title: Ensure VPC Endpoints are configured
description: Using VPC endpoints with Amazon DynamoDB allows you to securely access DynamoDB resources within your Amazon Virtual Private Cloud (VPC). This keeps your traffic off the public internet. Using VPC endpoint in the DynamoDB helps ensure that the data is secured and that no external networks would have access to the network. It is a private network where the user has access to their desired availability zones and subnets.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 4.5 Ensure VPC Endpoints are configured
audit:
  type: manual
  command: '1. Open Amazon VPC Console - Sign in to the AWS Management Console and open the Amazon VPC console at https://console.aws.amazon.com/vpc/. 2. Create a VPC Endpoint - In the Amazon VPC console, navigate to the Endpoints section in the left-side menu. - Click Create Endpoint. - Select your desired VPC in the VPC dropdown menu. - In the Service category section, choose AWS services. - In the Filter Services search box, enter DynamoDB and select DynamoDB from the results. - Choose your desired availability zone(s) and subnet(s). - Leave the default settings for other options or customize them according to your requirements. - Click Create endpoint. 3. Update Route Tables - In the Amazon VPC console, navigate to the Route Tables section in the left- side menu. - Find the route table associated with your VPC or subnet from which you want to access DynamoDB. 1. Edit the route table and add a route for the DynamoDB VPC endpoint. o Destination: Enter the CIDR block of the DynamoDB VPC
    endpoint, typically in the form of vpce-xxxxxx-xxxxxxx-xxxxxxx- xxxxxxx.vpce.amazonaws.com/32. o Target: Select the VPC endpoint ID from the dropdown menu. 2. Save the changes to update the route table. 3....'
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 4.5 to configure: Ensure VPC Endpoints are configured.'
