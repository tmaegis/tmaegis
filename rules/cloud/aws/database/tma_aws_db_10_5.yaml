id: TMA-AWS-DB-10.5
title: Ensure Fine-Grained Access Control is Enabled
description: Leverage Timestream's fine-grained access control capabilities to control table or row level access. Define access policies that limit access to specific tables, columns, or rows based on user roles or conditions. Implement data filtering and row-level security to restrict access to sensitive information. This helps by having specific permissions which can be denied due to multiple conditions of the database. This allows the user to control certain aspects of the database.
target: aws
level: 1
severity: medium
tags:
- access-control
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 10.5 Ensure Fine-Grained Access Control is Enabled
audit:
  type: manual
  command: 1. Understand Fine-Grained Access Control in Timestream Familiarize yourself with the concept of fine-grained access control and its benefits in Timestream. Understand that fine-grained access control allows you to control access to specific tables, columns, or rows within Timestream databases. 2. Define Timestream Database and Tables Create the necessary Timestream databases and tables that will be used for fine- grained access control. Design your database schema and define the tables, columns, and rows that need granular access control. 3. Create IAM Policies for Fine-Grained Access Access the AWS Management Console and navigate to the IAM service. Define IAM policies that grant or deny permissions for specific Timestream actions, databases, tables, columns, or rows. Leverage Timestream's fine-grained access control policy language to specify the conditions and restrictions for access. 4. Assign IAM Policies to IAM Users, Groups, or Roles Associate the IAM policies created
    earlier with the respective IAM users, groups, or roles. Assign the appropriate policies to grant access to specific Timestream databases, tables, columns, or rows. Follow the principle of least privilege a...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 10.5 to configure: Ensure Fine-Grained Access Control is Enabled.'
