id: TMA-AWS-DB-9.5
title: Ensure Audit Logging is Enabled
description: This control is important because it helps ensure activity within the cluster and identifies who has last modified the document and who has access to it, in case of breaches. It also ensures compliance with regulation requirements.
target: aws
level: 1
severity: medium
tags:
- aws
- cloud
- database
- logging
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.5 Ensure Audit Logging is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon Neptune Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/neptune/. 3. Select the Neptune Cluster - Choose the Amazon Neptune cluster on which you want to enable audit logging. Click on the cluster name to access its details page. 4. Enable Amazon CloudWatch Logs - In the cluster details page, navigate to the Monitoring or Logging section. - Under CloudWatch Logs, click Enable to enable logging for the Neptune cluster. - Select an existing CloudWatch Logs group or create a new one to store the logs. - Choose the appropriate retention period for the logs, considering your compliance and retention requirements. - Click Save or Apply Changes to enable CloudWatch Logs for the Neptune cluster. 5. Configure Log Levels (Optional)
    - In the cluster details page, navigate to the Configuration or Logging section. - Under Logging, you may have the option to configure log levels for different components of Neptune, such as query logs or e...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.5 to configure: Ensure Audit Logging is Enabled.'
