id: TMA-AWS-DB-6.3
title: Ensure Authentication and Access Control is Enabled
description: Users should select whether they like to enable authentication. If they want to authenticate a password would be required, which would only allow the authorized person to access the cluster. Defining access control allows specific workers in a business access to the database.
target: aws
level: 1
severity: medium
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 6.3 Ensure Authentication and Access Control is Enabled
audit:
  type: manual
  command: '1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon MemoryDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/memorydb/. 3. Select the Cluster - Choose the Amazon MemoryDB cluster on which you want to implement authentication and access control. - Click on the cluster name to access its details page. 4. Enable Authentication - In the cluster details page, navigate to the Authentication section. - Click on Modify to edit the authentication settings. - Select the desired authentication option: o No Authentication: This option allows unauthenticated access to your MemoryDB cluster. o Password Authentication: Choose this option to enable password-based authentication. Enter the desired password for the cluster. - Click Apply Changes to enable authentication for the MemoryDB cluster.
