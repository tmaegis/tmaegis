id: TMA-AWS-DB-9.6
title: Ensure Security Configurations are Reviewed Regularly
description: This helps by removing or updating any IAM roles, security networks, encryption settings, audit logging, and authentication. By updating or removing a few things from these lists it helps tighten security and ensures that the users do not have excessive permissions.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 9.6 Ensure Security Configurations are Reviewed Regularly
audit:
  type: manual
  command: 1. Establish a Security Review Schedule - Determine a regular schedule for reviewing and updating the security configuration of your Amazon Neptune environment. - Consider factors such as the frequency of changes, compliance requirements, and industry best practices to determine the appropriate review interval. 2. Monitor AWS Security Bulletins - Stay informed about AWS security updates and announcements related to Amazon Neptune. - Regularly review AWS security bulletins and notifications to identify any security patches, updates, or new features relevant to your Neptune environment. - Take note of any security recommendations or best practices provided by AWS. 3. Review IAM Roles and Policies - Access the AWS Identity and Access Management (IAM) console by navigating to IAM in the AWS Management Console. - Review the IAM roles and policies associated with your Neptune resources. - Ensure that the assigned permissions align with the principle of least privilege and reflect the
    current access requirements. - Update the IAM roles and policies as needed to adapt to changes in user access or security requirements. 4. Review Security Groups and Network ACLs - Access the Amazon Neptu...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 9.6 to configure: Ensure Security Configurations are Reviewed Regularly.'
