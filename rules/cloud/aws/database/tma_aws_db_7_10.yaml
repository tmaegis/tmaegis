id: TMA-AWS-DB-7.10
title: Ensure to Configure Backup Window
description: Ensure to Configure Backup Window
target: aws
level: 1
severity: medium
tags:
- aws
- backup
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.10 Ensure to Configure Backup Window
audit:
  type: manual
  command: 1. Perform Manual Backups (Optional) - If desired, you can also create manual backups of your DocumentDB cluster. - In the cluster details page, navigate to the Backup section. - Click on the Create backup button. - Provide a name for the backup and confirm the action. 2. Restore from Backups (Optional) - If a disaster occurs or you need to restore your DocumentDB cluster to a previous state, you can restore it from the available backups. - In the cluster details page, navigate to the Backup section. - Choose the backup from which you want to restore. - Follow the prompts and provide the necessary information to initiate the restore process. 3. Test Backup and Restore Procedures - Periodically test the backup and restore procedures to ensure they work as expected. - Perform test restores on non-production environments to validate the integrity and completeness of the backup data. 4. Regularly Monitor and Validate Backups - Regularly monitor the backup status and validate that
    the backups are completed successfully. - Monitor backup storage usage to ensure it is within the desired limits and plan for additional storage as needed.
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.10 to configure: Ensure to Configure Backup Window.'
