id: TMA-AWS-DB-5.5
title: Ensure Virtual Private Cloud (VPC) is Enabled
description: Implementing VPC security best practices for Amazon ElastiCache involves configuring your Virtual Private Cloud (VPC) and associated resources to enhance the security of your ElastiCache clusters. This ensures that only authorized users can access their platforms and prevents any mistakes that can lead to a data breach due to the level of security.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- network
reference: CIS AWS Database Services Benchmark v2.0.0 - 5.5 Ensure Virtual Private Cloud (VPC) is Enabled
audit:
  type: manual
  command: 1. Create or Select a VPC - Sign in to the AWS Management Console and open the Amazon VPC console at https://console.aws.amazon.com/vpc/. - Create a new VPC or select an existing VPC to host your ElastiCache clusters. 2. Configure Subnets - In the VPC console, navigate to Subnets in the left-side menu. - Create or select the subnets within your VPC where you want to deploy your ElastiCache clusters. - Ensure you have private subnets for your ElastiCache clusters to avoid exposing them to the public internet. 3. Define Security Groups - In the VPC console, navigate to Security Groups in the left-side menu. - Create a new security group or select an existing one for your ElastiCache clusters. - Configure inbound and outbound rules in the security group to control traffic access. o Allow inbound access only from trusted sources or specific IP ranges required for your applications. o Restrict outbound access to necessary destinations and protocols. - Associate the security group with
    your ElastiCache clusters. 4. Configure Network Access Control Lists (ACLs) - In the VPC console, navigate to Network ACLs in the left-side menu. - Create or select the network ACLs associated with the...
remediation:
  type: iac_patch
  command: The individual is required to create a subnet and configure their inbound and outbound access. Individuals are supposed to configure their ACL and routing ensuring the traffic is flowing smoothly without any interference. This control is important because it only allows authorized user to access their resources as they prefer.
