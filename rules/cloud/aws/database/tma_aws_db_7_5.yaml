id: TMA-AWS-DB-7.5
title: Ensure to Implement Access Control and Authentication
description: Configure authentication mechanisms for your DocumentDB instances, such as using AWS Identity and Access Management (IAM) users or database users. Define appropriate user roles and permissions to control access to the DocumentDB instances and databases.
target: aws
level: 1
severity: medium
tags:
- access-control
- auth
- aws
- cloud
- database
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.5 Ensure to Implement Access Control and Authentication
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon DocumentDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/docdb/. 3. Select the DocumentDB Cluster - Choose the Amazon DocumentDB cluster for which you want to implement access control and authentication. - Click on the cluster name to access its details page. - In the cluster details page, navigate to the "Configuration" section. 4. Enable Authentication - Under the Network & Security section. - Click on the Edit button or Modify option to configure the authentication settings. - Enable the option for authentication by choosing the appropriate setting. - DocumentDB supports authentication through username and password or through AWS Identity and Access Management (IAM) roles. 5. Configure Database Users - In the cluster
    details page, navigate to the Users or Database users section. - Click the Add user button to create a new database user. - Enter the username and password for the database user. - Assign appropriate permi...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.5 to configure: Ensure to Implement Access Control and Authentication.'
