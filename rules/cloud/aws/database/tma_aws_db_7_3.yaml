id: TMA-AWS-DB-7.3
title: Ensure Encryption at Rest is Enabled
description: This helps ensure that the data is kept secure and protected when at rest. The user must choose from two key options which then determine when the data is encrypted at rest.
target: aws
level: 1
severity: high
tags:
- aws
- cloud
- database
- encryption
reference: CIS AWS Database Services Benchmark v2.0.0 - 7.3 Ensure Encryption at Rest is Enabled
audit:
  type: manual
  command: 1. Sign into the AWS Management Console - Sign into the AWS Management Console at https://console.aws.amazon.com/ with your AWS account credentials. 2. Open the Amazon DocumentDB Console - Navigate to the service using the Find Services search bar or by directly accessing the console at https://console.aws.amazon.com/docdb/. 3. Select the DocumentDB Cluster - Choose the Amazon DocumentDB cluster for which you want to enable encryption at rest. - Click on the cluster name to access its details page. - In the cluster details page, navigate to the "Configuration" section. 4. Enable Encryption at Rest - Under the Storage section. - Click on the "Edit" button or "Modify" option to configure the encryption settings. - Choose the option to enable encryption at rest for the cluster. 5. Choose the Encryption Key - Select the AWS Key Management Service (KMS) key that you want to use for encrypting your DocumentDB data. - You can choose an existing KMS key or create a new one. - Ensure that
    the KMS key you select has appropriate permissions for DocumentDB to use it. 6. Save the Configuration - Click the Save button to apply the encryption at rest configuration. - DocumentDB will start the...
remediation:
  type: iac_patch
  command: 'Follow the remediation procedure in CIS AWS Database Services Benchmark v2.0.0 section 7.3 to configure: Ensure Encryption at Rest is Enabled.'
