id: TMA-OCI-4.16
title: Ensure customer created Customer Managed Key (CMK) is rotated at least annually
description: Oracle Cloud Infrastructure Vault securely stores master encryption keys that protect your encrypted data. You can use the Vault service to rotate keys to generate new cryptographic material. Periodically rotating keys limits the amount of data encrypted by one key version. Rotating keys annually limits the data encrypted under one key version. Key rotation thereby reduces the risk in case a key is ever compromised. For every ENABLED key in every ACTIVE vault the newest ENABLED key version must be under 365 days old. Covers every subscribed region and every accessible compartment. Read-only OCI CLI calls; credentials and home region come from the CLI's normal configuration (~/.oci/config, OCI_CLI_PROFILE, OCI_CLI_AUTH). The tenancy OCID is taken from OCI_TENANCY or the first tenancy= line of the config file. A missing CLI or credential fails the check.
target: oci
level: 1
severity: medium
tags:
- oci
- logging
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 4.16 Ensure customer created Customer Managed Key (CMK) is rotated at least annually
audit:
  type: command
  command: |-
    t=${OCI_TENANCY:-$(sed -n 's/^[[:space:]]*tenancy[[:space:]]*=[[:space:]]*//p' "${OCI_CLI_CONFIG_FILE:-$HOME/.oci/config}" 2>/dev/null | head -n 1 | tr -d '\r[:space:]')}
    [ -n "$t" ] || exit 1
    bad=0
    cs=$(oci iam compartment list --compartment-id "$t" --compartment-id-in-subtree true --access-level ACCESSIBLE --all --query 'data[?"lifecycle-state"==`"ACTIVE"`].id' --raw-output 2>/dev/null) || exit 1
    comps="$t $(printf '%s\n' "$cs" | grep -o 'ocid1\.compartment\.[^"]*')"
    rs=$(oci iam region-subscription list --tenancy-id "$t" --query 'data[?status==`"READY"`]."region-name"' --raw-output 2>/dev/null) || exit 1
    regions=$(printf '%s\n' "$rs" | grep -o '"[a-z0-9-]*"' | tr -d '"')
    [ -n "$regions" ] || exit 1
    cut=$(date -u -d '365 days ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-365d +%Y-%m-%dT%H:%M:%S 2>/dev/null) || exit 1
    for r in $regions; do
      for c in $comps; do
        eps=$(oci kms management vault list --compartment-id "$c" --region "$r" --all --query 'data[?"lifecycle-state"==`"ACTIVE"`]."management-endpoint"' --raw-output 2>/dev/null) || exit 1
        for e in $(printf '%s\n' "$eps" | grep -o 'https://[^"]*'); do
          ks=$(oci kms management key list --compartment-id "$c" --endpoint "$e" --all --query 'data[?"lifecycle-state"==`"ENABLED"`].id' --raw-output 2>/dev/null) || exit 1
          for k in $(printf '%s\n' "$ks" | grep -o 'ocid1\.key\.[^"]*'); do
            v=$(oci kms management key-version list --key-id "$k" --endpoint "$e" --all --sort-by TIMECREATED --sort-order DESC --query 'data[?"lifecycle-state"==`"ENABLED"`] | [0]."time-created"' --raw-output 2>/dev/null) || exit 1
            [ -n "$v" ] && [ -z "$(printf '%s\n' "$v" | awk -v c="$cut" 'NF && $1 < c')" ] || { echo "not rotated in 365 days: $r $k"; bad=1; }
          done
        done
      done
    done
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: oci kms management key rotate --key-id <ocid> --endpoint <management-endpoint> for each listed key, and enable auto-rotation where supported.
