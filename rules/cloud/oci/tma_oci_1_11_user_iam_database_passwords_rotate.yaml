id: TMA-OCI-1.11
title: Ensure user IAM Database Passwords rotate within 90 days
description: 'Users can create and manage their database password in their IAM user profile and use that password to authenticate to databases in their tenancy. An IAM database password is a different password than an OCI Console password. It is important to secure and rotate an IAM Database password 90 days or less as it provides the same access the user would have a using a local database user. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: high
tags:
- oci
- iam
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 1.11 Ensure user IAM Database Passwords rotate within 90 days
audit:
  type: manual
  command: 'From Console: 1. Login to OCI Console. 2. Select Identity & Security from the Services menu. 3. Select Users from the Identity menu. 4. Click on an individual user under the Name heading. 5. Click on Database Passwords in the lower left-hand corner of the page. 6. Ensure the date of the Database Passwords under the Created column of the Database Passwords is no more than 90 days 7. Login to OCI Console. 8. Select Identity & Security from the Services menu. 9. Select Domains from the Identity menu. 10. For each domain listed, click on the name and select Users. 11.'
remediation:
  type: iac_patch
  command: 'OCI IAM with Identity Domains From Console: 1. Login to OCI Console. 2. Select Identity & Security from the Services menu. 3. Select Domains from the Identity menu. 4. For each domain listed, click on the name and select Users. 5. Click on an individual user under the Username heading. 6. Click on IAM Database Passwords in the lower left-hand corner of the page. 7. Delete any Database Passwords with a date older than 90 days under the Created column of the Database Passwords.'
