id: TMA-OCI-1.13
title: Ensure all OCI IAM local user accounts have a valid and current email address
description: 'All OCI IAM local user accounts have an email address field associated with the account. It is recommended to specify an email address that is valid and current. If you have an email address in your user profile, you can use the Forgot Password link on the sign on page to have a temporary password sent to you. Having a valid and current email address associated with an OCI IAM local user account allows you to tie the account to identity in your organization. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: medium
tags:
- oci
- iam
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 1.13 Ensure all OCI IAM local user accounts have a valid and current email address
audit:
  type: manual
  command: 'From Console: 1. Login to OCI Console. 2. Select Identity & Security from the Services menu. 3. Select Domains from the Identity menu. 4. For each domain listed, click on the name and select Users. 5. Click on an individual user under the Username heading. 6. Ensure a valid and current email address is next to Email and Recovery email.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to OCI Console. 2. Select Identity & Security from the Services menu. 3. Select Domains from the Identity menu. 4. For each domain listed, click on the name and select Users. 5. Click on each non-complaint user. 6. Click on Edit User. 7. Enter a valid and current email address in the Email and Recovery Email text boxes. 8. Click Save Changes'
