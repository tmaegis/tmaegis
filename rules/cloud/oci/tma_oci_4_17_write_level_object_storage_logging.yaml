id: TMA-OCI-4.17
title: Ensure write level Object Storage logging is enabled for all buckets
description: Object Storage write logs will log all write requests made to objects in a bucket. Enabling an Object Storage write log, the requestAction property would contain values of PUT, POST, or DELETE. This will provide you more visibility into changes to objects in your buckets. Every bucket must be the source of an enabled objectstorage service log with category write. Covers every subscribed region and every accessible compartment. Read-only OCI CLI calls; credentials and home region come from the CLI's normal configuration (~/.oci/config, OCI_CLI_PROFILE, OCI_CLI_AUTH). The tenancy OCID is taken from OCI_TENANCY or the first tenancy= line of the config file. A missing CLI or credential fails the check.
target: oci
level: 2
severity: medium
tags:
- oci
- logging
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 4.17 Ensure write level Object Storage logging is enabled for all buckets
audit:
  type: command
  command: |-
    t=${OCI_TENANCY:-$(sed -n 's/^[[:space:]]*tenancy[[:space:]]*=[[:space:]]*//p' "${OCI_CLI_CONFIG_FILE:-$HOME/.oci/config}" 2>/dev/null | head -n 1 | tr -d '\r[:space:]')}
    [ -n "$t" ] || exit 1
    bad=0
    cs=$(oci iam compartment list --compartment-id "$t" --compartment-id-in-subtree true --access-level ACCESSIBLE --all --query 'data[?"lifecycle-state"==`"ACTIVE"`].id' --raw-output 2>/dev/null) || exit 1
    comps="$t $(printf '%s\n' "$cs" | grep -o 'ocid1\.compartment\.[^"]*')"
    rs=$(oci iam region-subscription list --tenancy-id "$t" --query 'data[?status==`"READY"`]."region-name"' --raw-output 2>/dev/null) || exit 1
    regions=$(printf '%s\n' "$rs" | grep -o '"[a-z0-9-]*"' | tr -d '"')
    [ -n "$regions" ] || exit 1
    srcs=""
    for r in $regions; do
      for c in $comps; do
        gs=$(oci logging log-group list --compartment-id "$c" --region "$r" --all --query 'data[].id' --raw-output 2>/dev/null) || exit 1
        for g in $(printf '%s\n' "$gs" | grep -o 'ocid1\.loggroup\.[^"]*'); do
          l=$(oci logging log list --log-group-id "$g" --region "$r" --all --query 'data[?"is-enabled"==`true` && configuration.source.service==`"objectstorage"` && configuration.source.category==`"write"`].configuration.source.resource' --raw-output 2>/dev/null) || exit 1
          srcs="$srcs
    $(printf '%s\n' "$l" | grep -o '"[^"]*"')"
        done
      done
    done
    for r in $regions; do
      for c in $comps; do
        bs=$(oci os bucket list --compartment-id "$c" --region "$r" --all --query 'data[].name' --raw-output 2>/dev/null) || exit 1
        for b in $(printf '%s\n' "$bs" | sed -n 's/^[[:space:]]*"\([^"]*\)",\{0,1\}[[:space:]]*$/\1/p'); do
          printf '%s\n' "$srcs" | grep -qxF "\"$b\"" || { echo "no write log: $r $b"; bad=1; }
        done
      done
    done
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: Enable a service log for each listed bucket with category Write Access Events (Logging > Logs > Enable service log > Object Storage > <bucket> > Write Access Events, or oci logging log create --log-type SERVICE ...).
