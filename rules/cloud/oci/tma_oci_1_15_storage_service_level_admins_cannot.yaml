id: TMA-OCI-1.15
title: Ensure storage service-level admins cannot delete resources they manage.
description: 'To apply the separation of duties security principle, one can restrict service-level administrators from being able to delete resources they are managing. It means service-level administrators can only manage resources of a specific service but not delete resources for that specific service. Creating service-level administrators without the ability to delete the resource they are managing helps in tightly controlling access to Oracle Cloud Infrastructure (OCI) services by implementing the separation of ... Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 2
severity: medium
tags:
- oci
- iam
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 1.15 Ensure storage service-level admins cannot delete resources they manage.
audit:
  type: manual
  command: 'From Console: 1. Login to OCI console. 2. Go to Identity -> Policies, In the compartment dropdown, choose the compartment. 3. Open each policy to view the policy statements. 4. Verify the policies to ensure that the policy statements that grant access to storage service-level administrators have a condition that excludes access to delete the service they are the administrator for. From CLI: 1.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Login to OCI console. 2. Go to Identity -> Policies, In the compartment dropdown, choose the compartment. Open each policy to view the policy statements. 3. Add the appropriate where condition to any policy statement that allows the storage service-level to manage the storage service.'
