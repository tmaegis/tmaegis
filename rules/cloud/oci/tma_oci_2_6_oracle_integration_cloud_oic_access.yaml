id: TMA-OCI-2.6
title: Ensure Oracle Integration Cloud (OIC) access is restricted to allowed sources.
description: 'Oracle Integration (OIC) is a complete, secure, but lightweight integration solution that enables you to connect your applications in the cloud. It simplifies connectivity between your applications and connects both your applications that live in the cloud and your applications that still live on premises. Restricting connectivity to OIC Instances reduces an OIC instance''s exposure to risk. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: medium
tags:
- oci
- network
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 2.6 Ensure Oracle Integration Cloud (OIC) access is restricted to allowed sources.
audit:
  type: manual
  command: 'From Console: 1. Login into the OCI Console 2. Click in the search bar, top of the screen. 3. Type Advanced Resource Query and hit enter. 4. Click the Advanced Resource Query button in the upper right of the screen. 5. Enter the following query in the query box: query integrationinstance resources 6. For each OIC Instance returned click on the link under Display name 7. Click on Network Access 8 .Ensure Restrict Network Access is selected and the IP Address/CIDR Block as well as Virtual Cloud Networks are correct 8. Repeat for other subscribed regions From CLI: 1.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Follow the audit procedure above. 2. For each OIC instance in the returned results, click the OIC Instance name 3. Click Network Access 4. Either edit the Network Access to be more restrictive From CLI 1. Follow the audit procedure. 2. Get the json input format using the below command: oci integration integration-instance change-network-endpoint --generate-param-json-input 3.For each of the OIC Instances identified get its details.'
