id: TMA-OCI-2.8
title: Ensure Oracle Autonomous Shared Databases (ADB) access is restricted to allowed sources or deployed within a Virtual Cloud Network
description: 'Oracle Autonomous Database Shared (ADB-S) automates database tuning, security, backups, updates, and other routine management tasks traditionally performed by DBAs. ADB-S provide ingress filtering of network traffic or can be deployed within an existing Virtual Cloud Network (VCN). Restricting connectivity to ADB-S Databases reduces an ADB-S database''s exposure to risk. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: medium
tags:
- oci
- network
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 2.8 Ensure Oracle Autonomous Shared Databases (ADB) access is restricted to allowed sources or deployed within a Virtual Cloud Network
audit:
  type: manual
  command: 'From Console: 1. Login into the OCI Console 2. Click in the search bar, top of the screen. 3. Type Advanced Resource Query and hit enter. 4. Click the Advanced Resource Query button in the upper right of the screen. 5. Enter the following query in the query box: query autonomousdatabase resources 6. For each ABD-S database returned click on the link under Display name 7. Click Edit next to Access Control List 8. Ensure `Access Control Rules'' IP Address/CIDR Block as well as VCNs are correct 9. Repeat for other subscribed regions From CLI: 1.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Follow the audit procedure above. 2. For each ADB-S database in the returned results, click the ADB-S database name 3. Click Edit next to Access Control Rules 4. Click +Another Rule and add rules as required 5. Click Save Changes From CLI: 1. Follow the audit procedure. 2. Get the json input format by executing the following command: oci db autonomous-database update --generate-full-command-json-input 3. For each of the ADB-S Database identified get its details. 4.'
