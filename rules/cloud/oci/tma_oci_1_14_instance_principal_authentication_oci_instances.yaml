id: TMA-OCI-1.14
title: Ensure Instance Principal authentication is used for OCI instances, OCI Cloud Databases and OCI Functions to access OCI resources.
description: 'OCI instances, OCI database and OCI functions can access other OCI resources either via an OCI API key associated to a user or via Instance Principal. Instance Principal authentication can be achieved by inclusion in a Dynamic Group that has an IAM policy granting it the required access or using an OCI IAM policy that ... Instance Principal reduces the risks related to hard-coded credentials. Hard-coded API keys can be shared and require rotation, which can open them up to being compromised. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: medium
tags:
- oci
- iam
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 1.14 Ensure Instance Principal authentication is used for OCI instances, OCI Cloud Databases and OCI Functions to access OCI resources.
audit:
  type: manual
  command: 'From Console (Dynamic Groups): 1. Go to https://cloud.oracle.com/identity/domains/ 2. Select a Compartment 3. Click on a Domain 4. Click on Dynamic groups 5. Click on the Dynamic Group 6. Check if the Matching Rules includes the instances accessing your OCI resources. From Console (request.principal): 1. Go to https://cloud.oracle.com/identity/policies 2. Select a Compartment 3. Click on an individual policy under the Name heading. 4.'
remediation:
  type: iac_patch
  command: 'From Console (Dynamic Groups): 1. Go to https://cloud.oracle.com/identity/domains/ 2. Select a Compartment 3. Click on the Domain 4. Click on Dynamic groups 5. Click Create Dynamic Group. 6. Enter a Name 7. Enter a Description 8. Enter Matching Rules to that includes the instances accessing your OCI resources. 9. Click Create.'
