id: TMA-OCI-2.7
title: Ensure Oracle Analytics Cloud (OAC) access is restricted to allowed sources or deployed within a Virtual Cloud Network.
description: 'Oracle Analytics Cloud (OAC) is a scalable and secure public cloud service that provides a full set of capabilities to explore and perform collaborative analytics for you, your workgroup, and your enterprise. Restricting connectivity to Oracle Analytics Cloud instances reduces an OAC instance''s exposure to risk. Reported as a manual review item: the benchmark audit needs console review or organisational judgement.'
target: oci
level: 1
severity: medium
tags:
- oci
- network
reference: CIS Oracle Cloud Infrastructure Foundations Benchmark v3.1.1 - 2.7 Ensure Oracle Analytics Cloud (OAC) access is restricted to allowed sources or deployed within a Virtual Cloud Network.
audit:
  type: manual
  command: 'From Console: 1 Login into the OCI Console 2. Click in the search bar, top of the screen. 3. Type Advanced Resource Query and hit enter. 4. Click the Advanced Resource Query button in the upper right of the screen. 5. Enter the following query in the query box: query analyticsinstance resources 6. For each OAC Instance returned click on the link under Display name. 7. Ensure Access Control Rules IP Address/CIDR Block as well as Virtual Cloud Networks are correct. 8. Repeat for other subscribed regions. From CLI: 1.'
remediation:
  type: iac_patch
  command: 'From Console: 1. Follow the audit procedure above. 2. For each OAC instance in the returned results, click the OAC Instance name 3. Click Edit next to Access Control Rules 4. Click +Another Rule and add rules as required From CLI: 1. Follow the audit procedure. 2. Get the json input format by executing the below command: oci analytics analytics-instance change-network-endpoint --generate-full-command-json-input 3. For each of the OAC Instances identified get its details. 4.'
