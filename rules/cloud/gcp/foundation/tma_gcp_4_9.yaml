id: TMA-GCP-4.9
title: Ensure That Compute Instances Do Not Have Public IP Addresses
description: Compute instances should not be configured to have external IP addresses. To reduce your attack surface, Compute instances should not have public IP addresses. Instead, instances should be configured behind load balancers, to minimize the instance's exposure to the internet.
target: gcp
level: 2
severity: low
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 4.9 Ensure That Compute Instances Do Not Have Public IP Addresses
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to the VM instances page by visiting: https://console.cloud.google.com/compute/instances. 2. For every VM, ensure that there is no External IP configured. From Google Cloud CLI gcloud compute instances list --format=json 1. The output should not contain an accessConfigs section under networkInterfaces. Note that the natIP value is present only for instances that are running or for instances that are stopped but have a static IP address. For instances that are stopped and are configured to have an ephemeral public IP address, the natIP field will not be present. Example output: networkInterfaces: - accessConfigs: - kind: compute#accessConfig name: External NAT networkTier: STANDARD type: ONE_TO_ONE_NAT Exception: Instances created by GKE should be excluded because some of them have external IP addresses and cannot be changed by editing the instance settings. Instances created by GKE should be excluded. These instances have names that start with
    "gke-" and are labeled "goog-gke-node".'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the VM instances page by visiting: https://console.cloud.google.com/compute/instances. 2. Click on the instance name to go the the Instance detail page. 3. Click Edit. 4. For each Network interface, ensure that External IP is set to None. 5. Click Done and then click Save. From Google Cloud CLI 1. Describe the instance properties: gcloud compute instances describe <INSTANCE_NAME> --zone=<ZONE> 2. Identify the access config name that contains the external IP address. This access config appears in the following format: networkInterfaces: - accessConfigs: - kind: compute#accessConfig name: External NAT natIP: 130.211.181.55 type: ONE_TO_ONE_NAT 3. Delete the access config. gcloud compute instances delete-access-config <INSTANCE_NAME> --zone=<ZONE> - -access-config-name <ACCESS_CONFIG_NAME> In the above example, the ACCESS_CONFIG_NAME is External NAT. The name of your access config might be different. Prevention: You can configure the Define allowed
    external IPs for VM instances Organization Policy to prevent VMs from being configured with public IP addresses. Learn more at: https://console.cloud.google.com/orgpolicies/compute- vmExternalIpAccess'
