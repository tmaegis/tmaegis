id: TMA-GCP-7.3
title: Ensure That a Default Customer-Managed Encryption Key (CMEK) Is Specified for All BigQuery Data Sets
description: BigQuery by default encrypts the data as rest by employing Envelope Encryption using Google managed cryptographic keys. The data is encrypted using the data encryption keys and data encryption keys themselves are further encrypted using key encryption keys. This is seamless and do not require any additional input from the user. However, if you want to have greater control, Customer-managed encryption keys (CMEK) can be used as encryption key management solution for BigQuery Data Sets. BigQuery by default encrypts the data as rest by employing Envelope Encryption using Google managed cryptographic keys. This is seamless and does not require any additional input from the user. For greater control over the encryption, customer-managed encryption keys (CMEK) can be used as encryption key management solution for BigQuery Data Sets. Setting a Default Customer-managed encryption key (CMEK) f...
target: gcp
level: 2
severity: medium
tags:
- cloud
- crypto
- encryption
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 7.3 Ensure That a Default Customer-Managed Encryption Key (CMEK) Is Specified for All BigQuery Data Sets
audit:
  type: manual
  command: From Google Cloud Console 1. Go to Analytics 2. Go to BigQuery 3. Under Analysis click on SQL Workspaces, select the project 4. Select Data Set 5. Ensure Customer-managed key is present under Dataset info section. 6. Repeat for each data set in all projects. From Google Cloud CLI List all dataset names bq ls Use the following command to view each dataset details. bq show <data_set_object> Verify the kmsKeyName is present.
remediation:
  type: iac_patch
  command: From Google Cloud CLI The default CMEK for existing data sets can be updated by specifying the default key in the EncryptionConfiguration.kmsKeyName field when calling the datasets.insert or datasets.patch methods
