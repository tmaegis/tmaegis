id: TMA-GCP-6.3.2
title: Ensure 'cross db ownership chaining' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
description: It is recommended to set cross db ownership chaining database flag for Cloud SQL SQL Server instance to off. This flag is deprecated for all SQL Server versions in CGP. Going forward, you can't set its value to on. However, if you have this flag enabled, we strongly recommend that you either remove the flag from your database or set it to off. For cross-database access, use the Microsoft tutorial for signing stored procedures with a certificate. Use the cross db ownership for chaining option to configure cross-database ownership chaining for an instance of Microsoft SQL Server. This server option allows you to control cross-database ownership chaining at the database level or to allow cross-database ownership chaining for all databases. Enabling cross db ownership is not recommended unless all of the databases hosted by the instance of SQL Server must participate in cross-database own...
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.3.2 Ensure 'cross db ownership chaining' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
audit:
  type: manual
  command: 'NOTE: This flag is deprecated for all SQL Server versions. Going forward, you can''t set its value to on. However, if you have this flag enabled it should be removed from your database or set to off. From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console. 2. Select the instance to open its Instance Overview page 3. Ensure the database flag cross db ownership chaining that has been set is listed under the Database flags section. From Google Cloud CLI 1. Ensure the below command returns off for every Cloud SQL SQL Server database instance: gcloud sql instances describe <INSTANCE_NAME> --format=json | jq ''.settings.databaseFlags[] | select(.name=="cross db ownership chaining")|.value'' In the output, database flags are listed under the settings as the collection databaseFlags.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the SQL Server instance for which you want to enable to database flag. 3. Click Edit. 4. Scroll down to the Flags section. 5. To set a flag that has not been set on the instance before, click Add item, choose the flag cross db ownership chaining from the drop-down menu, and set its value to off. 6. Click Save. 7. Confirm the changes under Flags on the Overview page. From Google Cloud CLI 1. Configure the cross db ownership chaining database flag for every Cloud SQL SQL Server database instance using the below command: gcloud sql instances patch <INSTANCE_NAME> --database-flags "cross db ownership chaining"=off Note: This command will overwrite all database flags previously set. To keep those and add new ones, include the values for all flags to be set on the instance; any flag not specifically included is set to its
    default value. For flags that do not take a value, specify the flag name followed by an equals sign ("=").'
