id: TMA-GCP-4.10
title: Ensure That App Engine Applications Enforce HTTPS Connections
description: In order to maintain the highest level of security all connections to an application should be secure by default. Insecure HTTP connections maybe subject to eavesdropping which can expose sensitive data.
target: gcp
level: 2
severity: medium
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 4.10 Ensure That App Engine Applications Enforce HTTPS Connections
audit:
  type: manual
  command: 'Verify that the app.yaml file controlling the application contains a line which enforces secure connections. For example handlers: - url: /.* secure: always redirect_http_response_code: 301 script: auto https://cloud.google.com/appengine/docs/standard/python3/config/appref'
remediation:
  type: iac_patch
  command: 'Add a line to the app.yaml file controlling the application which enforces secure connections. For example handlers: - url: /.* **secure: always** redirect_http_response_code: 301 script: auto [https://cloud.google.com/appengine/docs/standard/python3/config/appref]'
