id: TMA-GCP-6.2.1
title: Ensure ‘Log_error_verbosity’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘DEFAULT’ or Stricter
description: 'The log_error_verbosity flag controls the verbosity/details of messages logged. Valid values are: - TERSE - DEFAULT - VERBOSE TERSE excludes the logging of DETAIL, HINT, QUERY, and CONTEXT error information. VERBOSE output includes the SQLSTATE error code, source code file name, function name, and line number that generated the error. Ensure an appropriate value is set to ''DEFAULT'' or stricter. Auditing helps in troubleshooting operational problems and also permits forensic analysis. If log_error_verbosity is not set to the correct value, too many details or too few details may be logged. This flag should be configured with a value of ''DEFAULT'' or stricter. This recommendation is applicable to PostgreSQL database instances.'
target: gcp
level: 2
severity: medium
tags:
- cloud
- gcp
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.2.1 Ensure ‘Log_error_verbosity’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘DEFAULT’ or Stricter
audit:
  type: manual
  command: From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Instance Overview page 3. Go to Configuration card 4. Under Database flags, check the value of log_error_verbosity flag is set to 'DEFAULT' or stricter. From Google Cloud CLI 1. Use the below command for every Cloud SQL PostgreSQL database instance to verify the value of log_error_verbosity gcloud sql instances describe [INSTANCE_NAME] --format=json | jq '.settings.databaseFlags[] | select(.name=="log_error_verbosity")|.value' In the output, database flags are listed under the settings as the collection databaseFlags.
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the PostgreSQL instance for which you want to enable the database flag. 3. Click Edit. 4. Scroll down to the Flags section. 5. To set a flag that has not been set on the instance before, click Add a Database Flag, choose the flag log_error_verbosity from the drop-down menu and set appropriate value. 6. Click Save to save your changes. 7. Confirm your changes under Flags on the Overview page. From Google Cloud CLI 1. Configure the log_error_verbosity database flag for every Cloud SQL PosgreSQL database instance using the below command. gcloud sql instances patch INSTANCE_NAME --database-flags log_error_verbosity=<TERSE|DEFAULT|VERBOSE> Note: This command will overwrite all database flags previously set. To keep those and add new ones, include the values for all flags you want set on the instance; any flag not specifically
    included is set to its default value. For flags that do not take a value, specify the flag name followed by an equals sign ("=").'
