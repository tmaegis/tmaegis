id: TMA-GCP-2.14
title: Ensure Cloud Asset Inventory Is Enabled
description: GCP Cloud Asset Inventory is services that provides a historical view of GCP resources and IAM policies through a time-series database. The information recorded includes metadata on Google Cloud resources, metadata on policies set on Google Cloud projects or resources, and runtime information gathered within a Google Cloud resource. Cloud Asset Inventory Service (CAIS) API enablement is not required for operation of the service, but rather enables the mechanism for searching/exporting CAIS asset data directly. The GCP resources and IAM policies captured by GCP Cloud Asset Inventory enables security analysis, resource change tracking, and compliance auditing. It is recommended GCP Cloud Asset Inventory be enabled for all GCP projects.
target: gcp
level: 1
severity: high
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.14 Ensure Cloud Asset Inventory Is Enabled
audit:
  type: manual
  command: 'From Google Cloud Console Ensure that the Cloud Asset API is enabled: 1. Go to API & Services/Library by visiting https://console.cloud.google.com/apis/library 2. Search for Cloud Asset API and select the result for Cloud Asset API 3. Ensure that API Enabled is displayed. From Google Cloud CLI Ensure that the Cloud Asset API is enabled: 1. Query enabled services: gcloud services list --enabled --filter=name:cloudasset.googleapis.com If the API is listed, then it is enabled. If the response is Listed 0 items the API is not enabled.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console Enable the Cloud Asset API: 1. Go to API & Services/Library by visiting https://console.cloud.google.com/apis/library 2. Search for Cloud Asset API and select the result for Cloud Asset API 3. Click the ENABLE button. From Google Cloud CLI Enable the Cloud Asset API: 1. Enable the Cloud Asset API through the services interface: gcloud services enable cloudasset.googleapis.com'
