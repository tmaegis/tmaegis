id: TMA-GCP-3.1
title: Ensure That the Default Network Does Not Exist in a Project
description: 'To prevent use of default network, a project should not have a default network. The default network has a preconfigured network configuration and automatically generates the following insecure firewall rules: - default-allow-internal: Allows ingress connections for all protocols and ports among instances in the network. - default-allow-ssh: Allows ingress connections on TCP port 22(SSH) from any source to any instance in the network. - default-allow-rdp: Allows ingress connections on TCP port 3389(RDP) from any source to any instance in the network. - default-allow-icmp: Allows ingress ICMP traffic from any source to any instance in the network. These automatically created firewall rules do not get audit logged by default. Furthermore, the default network is an auto mode network, which means that its subnets use the same predefined range of IP addresses, and as a result, it''s not poss...'
target: gcp
level: 2
severity: low
tags:
- cloud
- gcp
- network
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 3.1 Ensure That the Default Network Does Not Exist in a Project
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to the VPC networks page by visiting: https://console.cloud.google.com/networking/networks/list. 2. Ensure that a network with the name default is not present. From Google Cloud CLI 1. Set the project name in the Google Cloud Shell: gcloud config set project PROJECT_ID 2. List the networks configured in that project: gcloud compute networks list It should not list default as one of the available networks in that project.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the VPC networks page by visiting: https://console.cloud.google.com/networking/networks/list. 2. Click the network named default. 3. On the network detail page, click EDIT. 4. Click DELETE VPC NETWORK. 5. If needed, create a new network to replace the default network. From Google Cloud CLI For each Google Cloud Platform project, 1. Delete the default network: gcloud compute networks delete default 2. If needed, create a new network to replace it: gcloud compute networks create NETWORK_NAME Prevention: The user can prevent the default network and its insecure default firewall rules from being created by setting up an Organization Policy to Skip default network creation at https://console.cloud.google.com/iam-admin/orgpolicies/compute- skipDefaultNetworkCreation.'
