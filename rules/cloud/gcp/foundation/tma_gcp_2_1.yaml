id: TMA-GCP-2.1
title: Ensure That Cloud Audit Logging Is Configured Properly
description: 'It is recommended that Cloud Audit Logging is configured to track all admin activities and read, write access to user data. Cloud Audit Logging maintains two audit logs for each project, folder, and organization: Admin Activity and Data Access. 1. Admin Activity logs contain log entries for API calls or other administrative actions that modify the configuration or metadata of resources. Admin Activity audit logs are enabled for all services and cannot be configured. 2. Data Access audit logs record API calls that create, modify, or read user- provided data. These are disabled by default and should be enabled. There are three kinds of Data Access audit log information: o Admin read: Records operations that read metadata or configuration information. Admin Activity audit logs record writes of metadata and configuration information that cannot be disabled. o Data read: Records operations...'
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.1 Ensure That Cloud Audit Logging Is Configured Properly
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit. 2. Ensure that Admin Read, Data Write, and Data Read are enabled for all Google Cloud services and that no exemptions are allowed. From Google Cloud CLI 1. List the Identity and Access Management (IAM) policies for the project, folder, or organization: gcloud organizations get-iam-policy ORGANIZATION_ID gcloud resource-manager folders get-iam-policy FOLDER_ID gcloud projects get-iam-policy PROJECT_ID 2. Policy should have a default auditConfigs section which has the logtype set to DATA_WRITES and DATA_READ for all services. Note that projects inherit settings from folders, which in turn inherit settings from the organization. When called, projects get-iam-policy, the result shows only the policies set in the project, not the policies inherited from the parent folder or organization. Nevertheless, if the parent folder has Cloud Audit Logging enabled, the project does as
    well. Sample output for default audit configs may look like this: auditConfigs: - auditLogConfigs: - logType: ADMIN_READ - logType: DATA_WRITE - logType: DATA_READ service: allServices 3. Any of the auditCon...'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit. 2. Follow the steps at https://cloud.google.com/logging/docs/audit/configure-data- access to enable audit logs for all Google Cloud services. Ensure that no exemptions are allowed. From Google Cloud CLI 1. To read the project''s IAM policy and store it in a file run a command: gcloud projects get-iam-policy PROJECT_ID > /tmp/project_policy.yaml Alternatively, the policy can be set at the organization or folder level. If setting the policy at the organization level, it is not necessary to also set it for each folder or project. gcloud organizations get-iam-policy ORGANIZATION_ID > /tmp/org_policy.yaml gcloud resource-manager folders get-iam-policy FOLDER_ID > /tmp/folder_policy.yaml 2. Edit policy in /tmp/policy.yaml, adding or changing only the audit logs configuration to: Note: Admin Activity Logs are enabled by default, and cannot be disabled. So they are not listed in
    these configuration changes. auditConfigs: - auditLogConfigs: - logType: DATA_WRITE - logType: DATA_READ service: allServices Note: exemptedMembers: is not set as audit logging should be enabled for all the...'
