remediation:
  type: iac_patch
  command: Enable Secret Manager API for your Project From Google Cloud Console 1. Within the project you wish to enable, select the Navigation hamburger menu in the top left. Hover over APIs & Services to under the heading Serverless, then select Enabled APIs & Services in the menu that opens up. 2. Click the button + Enable APIS and Services 3. In the Search bar, search for Secret Manager API and select it. 4. Click the blue box that says Enable. From Google Cloud CLI 1. Within the project you wish to enable the API in, run the following command. gcloud services enable Secret Manager API Reviewing Environment Variables That Should Be Migrated to Secret Manager From Google Cloud Console 1. Log in to the Google Cloud Web Portal (https://console.cloud.google.com/) 2. Go to Cloud Functions 3. Click on a function name from the list 4. Click on Edit and review the Runtime environment for variables that should be secrets. Leave this list open for the next step. From Google Cloud CLI 1. To view
