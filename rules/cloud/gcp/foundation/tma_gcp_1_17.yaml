id: TMA-GCP-1.17
title: Ensure Essential Contacts is Configured for Organization
description: It is recommended that Essential Contacts is configured to designate email addresses for Google Cloud services to notify of important technical or security information. Many Google Cloud services, such as Cloud Billing, send out notifications to share important information with Google Cloud users. By default, these notifications are sent to members with certain Identity and Access Management (IAM) roles. With Essential Contacts, you can customize who receives notifications by providing your own list of contacts.
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 1.17 Ensure Essential Contacts is Configured for Organization
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to Essential Contacts by visiting https://console.cloud.google.com/iam- admin/essential-contacts 2. Make sure the organization appears in the resource selector at the top of the page. The resource selector tells you what project, folder, or organization you are currently managing contacts for. 3. Ensure that appropriate email addresses are configured for each of the following notification categories: - Legal - Security - Suspension - Technical Alternatively, appropriate email addresses can be configured for the All notification category to receive all possible important notifications. From Google Cloud CLI 1. To list all configured organization Essential Contacts run a command: gcloud essential-contacts list --organization=<ORGANIZATION_ID> 2. Ensure at least one appropriate email address is configured for each of the following notification categories: - LEGAL - SECURITY - SUSPENSION - TECHNICAL Alternatively, appropriate email addresses can be
    configured for the ALL notification category to receive all possible important notifications.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to Essential Contacts by visiting https://console.cloud.google.com/iam- admin/essential-contacts 2. Make sure the organization appears in the resource selector at the top of the page. The resource selector tells you what project, folder, or organization you are currently managing contacts for. 3. Click +Add contact 4. In the Email and Confirm Email fields, enter the email address of the contact. 5. From the Notification categories drop-down menu, select the notification categories that you want the contact to receive communications for. 6. Click Save From Google Cloud CLI 1. To add an organization Essential Contacts run a command: gcloud essential-contacts create --email="<EMAIL>" \ --notification-categories="<NOTIFICATION_CATEGORIES>" \ --organization=<ORGANIZATION_ID>'
