id: TMA-GCP-1.12
title: Ensure That Separation of Duties Is Enforced While Assigning KMS Related Roles to Users
description: It is recommended that the principle of 'Separation of Duties' is enforced while assigning KMS related roles to users. The built-in/predefined IAM role Cloud KMS Admin allows the user/identity to create, delete, and manage service account(s). The built-in/predefined IAM role Cloud KMS CryptoKey Encrypter/Decrypter allows the user/identity (with adequate privileges on concerned resources) to encrypt and decrypt data at rest using an encryption key(s). The built-in/predefined IAM role Cloud KMS CryptoKey Encrypter allows the user/identity (with adequate privileges on concerned resources) to encrypt data at rest using an encryption key(s). The built-in/predefined IAM role Cloud KMS CryptoKey Decrypter allows the user/identity (with adequate privileges on concerned resources) to decrypt data at rest using an encryption key(s). Separation of duties is the concept of ensuring that one indiv...
target: gcp
level: 2
severity: medium
tags:
- cloud
- gcp
- iam
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 1.12 Ensure That Separation of Duties Is Enforced While Assigning KMS Related Roles to Users
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to IAM & Admin/IAM by visiting: https://console.cloud.google.com/iam- admin/iam 2. Ensure no member has the roles Cloud KMS Admin and any of the Cloud KMS CryptoKey Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey Decrypter assigned. From Google Cloud CLI 1. List all users and role assignments: gcloud projects get-iam-policy PROJECT_ID 2. Ensure that there are no common users found in the member section for roles cloudkms.admin and any one of Cloud KMS CryptoKey Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey Decrypter'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam- admin/iam 2. For any member having Cloud KMS Admin and any of the Cloud KMS CryptoKey Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey Decrypter roles granted/assigned, click the Delete Bin icon to remove the role from the member. Note: Removing a role should be done based on the business requirement.'
