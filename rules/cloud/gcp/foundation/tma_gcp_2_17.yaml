id: TMA-GCP-2.17
title: Ensure Logging is enabled for HTTP(S) Load Balancer
description: Logging enabled on a HTTPS Load Balancer will show all network traffic and its destination. Logging will allow you to view HTTPS network traffic to your web applications.
target: gcp
level: 2
severity: low
tags:
- cloud
- gcp
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.17 Ensure Logging is enabled for HTTP(S) Load Balancer
audit:
  type: manual
  command: From Google Cloud Console 1. From Google Cloud home open the Navigation Menu in the top left. 2. Under the Networking heading select Network services. 3. Select the HTTPS load-balancer you wish to audit. 4. Select Edit then Backend Configuration. 5. Select Edit on the corresponding backend service. 6. Ensure that Enable Logging is selected. Also ensure that Sample Rate is set to an appropriate level for your needs. From Google Cloud CLI 1. Run the following command gcloud compute backend-services describe <serviceName> 1. Ensure that enable-logging is enabled and sample rate is set to your desired level.
remediation:
  type: iac_patch
  command: From Google Cloud Console 1. From Google Cloud home open the Navigation Menu in the top left. 2. Under the Networking heading select Network services. 3. Select the HTTPS load-balancer you wish to audit. 4. Select Edit then Backend Configuration. 5. Select Edit on the corresponding backend service. 6. Click Enable Logging. 7. Set Sample Rate to a desired value. This is a percentage as a decimal point. 1.0 is 100%. From Google Cloud CLI 1. Run the following command gcloud compute backend-services update <serviceName> --region=REGION -- enable-logging --logging-sample-rate=<percentageAsADecimal>
