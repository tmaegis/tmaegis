reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 3.10 Ensure that VPC Flow Logs is Enabled for Every Subnet in a VPC Network
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to the VPC network GCP Console visiting https://console.cloud.google.com/networking/networks/list 2. From the list of network subnets, make sure for each subnet: - Flow Logs is set to On - Aggregation Interval is set to 5 sec - Include metadata checkbox is checked - Sample rate is set to 100% Note: It is not possible to determine if a Log filter has been defined from the console. From Google Cloud CLI gcloud compute networks subnets list --format json | \ jq -r ''(["Subnet","Purpose","Flow_Logs","Aggregation_Interval","Flow_Sampling","Met adata","Logs_Filtered"] | (., map(length*"-"))), (.[] | [ .name, .purpose, (if has("enableFlowLogs") and .enableFlowLogs == true then "Enabled" else "Disabled" end), (if has("logConfig") then .logConfig.aggregationInterval else "N/A" end), (if has("logConfig") then .logConfig.flowSampling else "N/A" end), (if has("logConfig") then .logConfig.metadata else "N/A" end), (if has("logConfig") then (.logConfig | has("filterExpr"))
    else "N/A" end) ] ) | @tsv'' | \ column -t The output of the above command will list: - each subnet - the subnet''s purpose - a Enabled or Disabled value if Flow Logs are enabled - the value for...'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the VPC network GCP Console visiting https://console.cloud.google.com/networking/networks/list 2. Click the name of a subnet, The Subnet details page displays. 3. Click the EDIT button. 4. Set Flow Logs to On. 5. Expand the Configure Logs section. 6. Set Aggregation Interval to 5 SEC. 7. Check the box beside Include metadata. 8. Set Sample rate to 100. 9. Click Save. Note: It is not possible to configure a Log filter from the console. From Google Cloud CLI 1. To enable VPC Flow Logs for a network subnet, run the following command: gcloud compute networks subnets update [SUBNET_NAME] --region [REGION] -- enable-flow-logs --logging-aggregation-interval=interval-5-sec --logging- flow-sampling=1 --logging-metadata=include-all 2.Verify a specific subnet: gcloud compute networks subnets describe SUBNET_NAME \ --region=REGION \ --format="get(logConfig.enable,logConfig.flowSampling'
