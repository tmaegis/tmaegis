id: TMA-GCP-8.1
title: Ensure that Dataproc Cluster is encrypted using Customer- Managed Encryption Key
description: When you use Dataproc, cluster and job data is stored on Persistent Disks (PDs) associated with the Compute Engine VMs in your cluster and in a Cloud Storage staging bucket. This PD and bucket data is encrypted using a Google-generated data encryption key (DEK) and key encryption key (KEK). The CMEK feature allows you to create, use, and revoke the key encryption key (KEK). Google still controls the data encryption key (DEK). "Cloud services offer the ability to protect data related to those services using encryption keys managed by the customer within Cloud KMS. These encryption keys are called customer-managed encryption keys (CMEK). When you protect data in Google Cloud services with CMEK, the CMEK key is within your control.
target: gcp
level: 2
severity: medium
tags:
- cloud
- crypto
- encryption
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 8.1 Ensure that Dataproc Cluster is encrypted using Customer- Managed Encryption Key
audit:
  type: manual
  command: 'From Google Cloud Console 1. Login to the GCP Console and navigate to the Dataproc Cluster page by visiting https://console.cloud.google.com/dataproc/clusters. 2. Select the project from the project dropdown list. 3. On the Dataproc Clusters page, select the cluster and click on the Name attribute value that you want to examine. 4. On the details page, select the Configurations tab. 5. On the Configurations tab, check the Encryption type configuration attribute value. If the value is set to Google-managed key, then Dataproc Cluster is not encrypted with Customer managed encryption keys. Repeat step no. 3 - 5 for other Dataproc Clusters available in the selected project. 6. Change the project from the project dropdown list and repeat the audit procedure for other projects. From Google Cloud CLI 1. Run clusters list command to list all the Dataproc Clusters available in the region: gcloud dataproc clusters list --region=''us-central1'' 2. Run clusters describe command to get the
    key details of the selected cluster: gcloud dataproc clusters describe <cluster_name> --region=us-central1 -- flatten=config.encryptionConfig.gcePdKmsKeyName 3. If the above command output return "null", the...'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Login to the GCP Console and navigate to the Dataproc Cluster page by visiting https://console.cloud.google.com/dataproc/clusters. 2. Select the project from the projects dropdown list. 3. On the Dataproc Cluster page, click on the Create Cluster to create a new cluster with Customer managed encryption keys. 4. On Create a cluster page, perform below steps: - Inside Set up cluster section perform below steps: -In the Name textbox, provide a name for your cluster. o From Location select the location in which you want to deploy a cluster. o Configure other configurations as per your requirements. - Inside Configure Nodes and Customize cluster section configure the settings as per your requirements. - Inside Manage security section, perform below steps: o From Encryption, select Customer-managed key. o Select a customer-managed key from dropdown list. o Ensure that the selected KMS Key have Cloud KMS CryptoKey Encrypter/Decrypter role assign to Dataproc
    Cluster service account ("serviceAccount:service-<project_number>@compute- system.iam.gserviceaccount.com"). o Click on Create to create a cluster. - Once the cluster is created migrate all your workload...'
