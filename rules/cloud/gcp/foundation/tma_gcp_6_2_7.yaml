id: TMA-GCP-6.2.7
title: Ensure That the ‘Log_min_duration_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to '-1' (Disabled)
description: The log_min_duration_statement flag defines the minimum amount of execution time of a statement in milliseconds where the total duration of the statement is logged. Ensure that log_min_duration_statement is disabled, i.e., a value of -1 is set. Logging SQL statements may include sensitive information that should not be recorded in logs. This recommendation is applicable to PostgreSQL database instances.
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.2.7 Ensure That the ‘Log_min_duration_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to '-1' (Disabled)
audit:
  type: manual
  command: From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Instance Overview page. 3. Go to the Configuration card. 4. Under Database flags, check that the value of log_min_duration_statement flag is set to -1. From Google Cloud CLI 1. Use the below command for every Cloud SQL PostgreSQL database instance to verify the value of log_min_duration_statement is set to -1. gcloud sql instances describe <INSTANCE_NAME> --format=json| jq '.settings.databaseFlags[] | select(.name=="log_min_duration_statement")|.value' In the output, database flags are listed under the settings as the collection databaseFlags.
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the PostgreSQL instance where the database flag needs to be enabled. 3. Click Edit. 4. Scroll down to the Flags section. 5. To set a flag that has not been set on the instance before, click Add item, choose the flag log_min_duration_statement from the drop-down menu and set a value of -1. 6. Click Save. 7. Confirm the changes under Flags on the Overview page. From Google Cloud CLI 1. List all Cloud SQL database instances using the following command: gcloud sql instances list 2. Configure the log_min_duration_statement flag for every Cloud SQL PosgreSQL database instance using the below command: gcloud sql instances patch <INSTANCE_NAME> --database-flags log_min_duration_statement=-1 Note: This command will overwrite all database flags previously set. To keep those and add new ones, include the values for all flags to
    be set on the instance; any flag not specifically included is set to its default value. For flags that do not take a value, specify the flag name followed by an equals sign ("=").'
