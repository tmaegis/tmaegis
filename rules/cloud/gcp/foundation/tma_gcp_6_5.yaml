id: TMA-GCP-6.5
title: Ensure That Cloud SQL Database Instances Do Not Implicitly Whitelist All Public IP Addresses
description: Database Server should accept connections only from trusted Network(s)/IP(s) and restrict access from public IP addresses. To minimize attack surface on a Database server instance, only trusted/known and required IP(s) should be white-listed to connect to it. An authorized network should not have IPs/networks configured to 0.0.0.0/0 which will allow access to the instance from anywhere in the world. Note that authorized networks apply only to instances with public IPs.
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.5 Ensure That Cloud SQL Database Instances Do Not Implicitly Whitelist All Public IP Addresses
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Click the instance name to open its configuration overview. 3. In the left-side panel, select Connections. 4. Click the Networking tab. 5. Ensure that Authorized networks does not include 0.0.0.0/0. From Google Cloud CLI 1. Get detailed configuration for every Cloud SQL database instance. gcloud sql instances list --format=json Ensure that the section settings: ipConfiguration : authorizedNetworks does not have any parameter value containing 0.0.0.0/0.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Click the instance name to open its Instance details page. 3. Under the Configuration section click Edit configurations 4. Under Configuration options expand the Connectivity section. 5. Click the delete icon for the authorized network 0.0.0.0/0. 6. Click Save to update the instance. From Google Cloud CLI Update the authorized network list by dropping off any addresses. gcloud sql instances patch <INSTANCE_NAME> --authorized- networks=IP_ADDR1,IP_ADDR2... Prevention: To prevent new SQL instances from being configured to accept incoming connections from any IP addresses, set up a Restrict Authorized Networks on Cloud SQL instances Organization Policy at: https://console.cloud.google.com/iam- admin/orgpolicies/sql-restrictAuthorizedNetworks.'
