id: TMA-GCP-6.2.2
title: Ensure That the ‘Log_connections’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘On’
description: Enabling the log_connections setting causes each attempted connection to the server to be logged, along with successful completion of client authentication. This parameter cannot be changed after the session starts. PostgreSQL does not log attempted connections by default. Enabling the log_connections setting will create log entries for each attempted connection as well as successful completion of client authentication which can be useful in troubleshooting issues and to determine any unusual connection attempts to the server. This recommendation is applicable to PostgreSQL database instances.
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.2.2 Ensure That the ‘Log_connections’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘On’
audit:
  type: manual
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Instance Overview page. 3. Go to the Configuration card. 4. Under Database flags, check the value of log_connections flag to determine if it is configured as expected. From Google Cloud CLI 1. Ensure the below command returns on for every Cloud SQL PostgreSQL database instance: gcloud sql instances describe [INSTANCE_NAME] --format=json | jq ''.settings.databaseFlags[] | select(.name=="log_connections")|.value'' In the output, database flags are listed under the settings as the collection databaseFlags.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the PostgreSQL instance for which you want to enable the database flag. 3. Click Edit. 4. Scroll down to the Flags section. 5. To set a flag that has not been set on the instance before, click Add a Database Flag, choose the flag log_connections from the drop-down menu and set the value as on. 6. Click Save. 7. Confirm the changes under Flags on the Overview page. From Google Cloud CLI 1. Configure the log_connections database flag for every Cloud SQL PosgreSQL database instance using the below command. gcloud sql instances patch <INSTANCE_NAME> --database-flags "log_connections"=on Note: This command will overwrite all previously set database flags. To keep those and add new ones, include the values for all flags to be set on the instance; any flag not specifically included is set to its default value. For flags that
    do not take a value, specify the flag name followed by an equals sign ("=").'
