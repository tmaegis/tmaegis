id: TMA-GCP-2.7
title: Ensure That the Log Metric Filter and Alerts Exist for Custom Role Changes
description: It is recommended that a metric filter and alarm be established for changes to Identity and Access Management (IAM) role creation, deletion and updating activities. Google Cloud IAM provides predefined roles that give granular access to specific Google Cloud Platform resources and prevent unwanted access to other resources. However, to cater to organization-specific needs, Cloud IAM also provides the ability to create custom roles. Project owners and administrators with the Organization Role Administrator role or the IAM Role Administrator role can create custom roles. Monitoring role creation, deletion and updating activities will help in identifying any over- privileged role at early stages.
target: gcp
level: 1
severity: medium
tags:
- cloud
- gcp
- iam
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.7 Ensure That the Log Metric Filter and Alerts Exist for Custom Role Changes
audit:
  type: manual
  command: 'From Console: Ensure that the prescribed log metric is present: 1. Go to Logging/Logs-based Metrics by visiting https://console.cloud.google.com/logs/metrics. 2. In the User-defined Metrics section, ensure that at least one metric <Log_Metric_Name> is present with filter text: resource.type="iam_role" AND (protoPayload.methodName="google.iam.admin.v1.CreateRole" OR protoPayload.methodName="google.iam.admin.v1.DeleteRole" OR protoPayload.methodName="google.iam.admin.v1.UpdateRole" OR protoPayload.methodName="google.iam.admin.v1.UndeleteRole") Ensure that the prescribed alerting policy is present: 3. Go to Alerting by visiting https://console.cloud.google.com/monitoring/alerting. 4. Under the Policies section, ensure that at least one alert policy exists for the log metric above. Clicking on the policy should show that it is configured with a condition. For example, Violates when: Any logging.googleapis.com/user/<Log Metric Name> stream is above a threshold of zero(0) for greater
    than zero(0) seconds means that the alert will trigger for any new owner change. Verify that the chosen alerting thresholds make sense for the user''s organization. 5. Ensure that the appropriate notificat...'
remediation:
  type: iac_patch
  command: 'From Console: Create the prescribed log metric: 1. Go to Logging/Logs-based Metrics by visiting https://console.cloud.google.com/logs/metrics and click "CREATE METRIC". 2. Click the down arrow symbol on the Filter Bar at the rightmost corner and select Convert to Advanced Filter. 3. Clear any text and add: resource.type="iam_role" AND (protoPayload.methodName = "google.iam.admin.v1.CreateRole" OR protoPayload.methodName="google.iam.admin.v1.DeleteRole" OR protoPayload.methodName="google.iam.admin.v1.UpdateRole" OR protoPayload.methodName="google.iam.admin.v1.UndeleteRole") 1. Click Submit Filter. Display logs appear based on the filter text entered by the user. 2. In the Metric Editor menu on the right, fill out the name field. Set Units to 1 (default) and Type to Counter. This ensures that the log metric counts the number of log entries matching the advanced logs query. 3. Click Create Metric. Create a prescribed Alert Policy: 1. Identify the new metric that was just created
    under the section User-defined Metrics at https://console.cloud.google.com/logs/metrics. 2. Click the 3-dot icon in the rightmost column for the metric and select Create alert from Metric. A new page displa...'
