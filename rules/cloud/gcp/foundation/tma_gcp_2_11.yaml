id: TMA-GCP-2.11
title: Ensure That the Log Metric Filter and Alerts Exist for Cloud Storage IAM Permission Changes
description: It is recommended that a metric filter and alarm be established for Cloud Storage Bucket IAM changes. Monitoring changes to cloud storage bucket permissions may reduce the time needed to detect and correct permissions on sensitive cloud storage buckets and objects inside the bucket.
target: gcp
level: 2
severity: low
tags:
- access-control
- cloud
- gcp
- iam
- logging
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.11 Ensure That the Log Metric Filter and Alerts Exist for Cloud Storage IAM Permission Changes
audit:
  type: manual
  command: 'From Google Cloud Console Ensure the prescribed log metric is present: 1. For each project that contains cloud storage buckets, go to Logging/Logs- based Metrics by visiting https://console.cloud.google.com/logs/metrics. 2. In the User-defined Metrics section, ensure at least one metric <Log_Metric_Name> is present with the filter text: resource.type="gcs_bucket" AND protoPayload.methodName="storage.setIamPermissions" Ensure that the prescribed alerting policy is present: 3. Go to Alerting by visiting https://console.cloud.google.com/monitoring/alerting. 4. Under the Policies section, ensure that at least one alert policy exists for the log metric above. Clicking on the policy should show that it is configured with a condition. For example, Violates when: Any logging.googleapis.com/user/<Log Metric Name> stream is above a threshold of 0 for greater than 0 seconds means that the alert will trigger for any new owner change. Verify that the chosen alerting thresholds make sense
    for the user''s organization. 5. Ensure that the appropriate notifications channels have been set up. From Google Cloud CLI Ensure that the prescribed log metric is present: 1. List the log metrics: gcloud lo...'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console Create the prescribed log metric: 1. Go to Logging/Logs-based Metrics by visiting https://console.cloud.google.com/logs/metrics and click "CREATE METRIC". 2. Click the down arrow symbol on the Filter Bar at the rightmost corner and select Convert to Advanced Filter. 3. Clear any text and add: resource.type="gcs_bucket" AND protoPayload.methodName="storage.setIamPermissions" 4. Click Submit Filter. Display logs appear based on the filter text entered by the user. 5. In the Metric Editor menu on right, fill out the name field. Set Units to 1 (default) and Type to Counter. This ensures that the log metric counts the number of log entries matching the user''s advanced logs query. 6. Click Create Metric. Create the prescribed Alert Policy: 1. Identify the newly created metric under the section User-defined Metrics at https://console.cloud.google.com/logs/metrics. 2. Click the 3-dot icon in the rightmost column for the new metric and select Create alert from
    Metric. A new page appears. 3. Fill out the alert policy configuration and click Save. Choose the alerting threshold and configuration that makes sense for the user''s organization. For example, a threshold...'
