id: TMA-GCP-7.2
title: Ensure That All BigQuery Tables Are Encrypted With Customer-Managed Encryption Key (CMEK)
description: BigQuery by default encrypts the data as rest by employing Envelope Encryption using Google managed cryptographic keys. The data is encrypted using the data encryption keys and data encryption keys themselves are further encrypted using key encryption keys. This is seamless and do not require any additional input from the user. However, if you want to have greater control, Customer-managed encryption keys (CMEK) can be used as encryption key management solution for BigQuery Data Sets. If CMEK is used, the CMEK is used to encrypt the data encryption keys instead of using google-managed encryption keys. BigQuery by default encrypts the data as rest by employing Envelope Encryption using Google managed cryptographic keys. This is seamless and does not require any additional input from the user. For greater control over the encryption, customer-managed encryption keys (CMEK) can be used a...
target: gcp
level: 2
severity: medium
tags:
- cloud
- crypto
- encryption
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 7.2 Ensure That All BigQuery Tables Are Encrypted With Customer-Managed Encryption Key (CMEK)
audit:
  type: manual
  command: From Google Cloud Console 1. Go to Analytics 2. Go to BigQuery 3. Under SQL Workspace, select the project 4. Select Data Set, select the table 5. Go to Details tab 6. Under Table info, verify Customer-managed key is present. 7. Repeat for each table in all data sets for all projects. From Google Cloud CLI List all dataset names bq ls Use the following command to view the table details. Verify the kmsKeyName is present. bq show <table_object>
remediation:
  type: iac_patch
  command: From Google Cloud CLI Use the following command to copy the data. The source and the destination needs to be same in case copying to the original table. bq cp --destination_kms_key <customer_managed_key> source_dataset.source_table destination_dataset.destination_table
