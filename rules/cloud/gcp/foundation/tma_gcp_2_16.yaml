id: TMA-GCP-2.16
title: Ensure 'Access Approval' is 'Enabled'
description: GCP Access Approval enables you to require your organizations' explicit approval whenever Google support try to access your projects. You can then select users within your organization who can approve these requests through giving them a security role in IAM. All access requests display which Google Employee requested them in an email or Pub/Sub message that you can choose to Approve. This adds an additional control and logging of who in your organization approved/denied these requests. Controlling access to your information is one of the foundations of information security. Google Employees do have access to your organizations' projects for support reasons. With Access Approval, organizations can then be certain that their information is accessed by only approved Google Personnel.
target: gcp
level: 2
severity: low
tags:
- access-control
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 2.16 Ensure 'Access Approval' is 'Enabled'
audit:
  type: manual
  command: 'From Google Cloud Console Determine if Access Transparency is Enabled as it is a Dependency 1. From the Google Cloud Home inside the project you wish to audit, click on the Navigation hamburger menu in the top left. Hover over the IAM & Admin Menu. Select settings in the middle of the column that opens. 2. The status should be "Enabled'' under the heading Access Transparency Determine if Access Approval is Enabled 1. From the Google Cloud Home, within the project you wish to check, click on the Navigation hamburger menu in the top left. Hover over the Security Menu. Select Access Approval in the middle of the column that opens. 2. The status will be displayed here. If you see a screen saying you need to enroll in Access Approval, it is not enabled. From Google Cloud CLI Determine if Access Approval is Enabled 1. From within the project you wish to audit, run the following command. gcloud access-approval settings get 2. The status will be displayed in the output. IF Access Approval
    is not enabled you should get this output: API [accessapproval.googleapis.com] not enabled on project [-----]. Would you like to enable and retry (this will take a few minutes)? (y/N)? After entering Y...'
remediation:
  type: iac_patch
  command: From Google Cloud Console 1. From the Google Cloud Home, within the project you wish to enable, click on the Navigation hamburger menu in the top left. Hover over the Security Menu. Select Access Approval in the middle of the column that opens. 2. The status will be displayed here. On this screen, there is an option to click Enroll. If it is greyed out and you see an error bar at the top of the screen that says Access Transparency is not enabled please view the corresponding reference within this section to enable it. 3. In the second screen click Enroll. Grant an IAM Group or User the role with permissions to Add Users to be Access Approval message Recipients 1. From the Google Cloud Home, within the project you wish to enable, click on the Navigation hamburger menu in the top left. Hover over the IAM and Admin. Select IAM in the middle of the column that opens. 2. Click the blue button the says + ADD at the top of the screen. 3. In the principals field, select a user or group
    by typing in their associated email address. 4. Click on the role field to expand it. In the filter field enter Access Approval Approver and select it. 5. Click save. Add a Group or User as an Approver fo...
