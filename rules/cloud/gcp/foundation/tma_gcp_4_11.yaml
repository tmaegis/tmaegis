id: TMA-GCP-4.11
title: Ensure That Compute Instances Have Confidential Computing Enabled
description: Google Cloud encrypts data at-rest and in-transit, but customer data must be decrypted for processing. Confidential Computing is a breakthrough technology that encrypts data in-use while it is being processed. Confidential Computing environments keep data encrypted in memory and elsewhere outside the central processing unit (CPU). Confidential VMs leverage hardware-based memory encryption technologies, such as AMD Secure Encrypted Virtualization (SEV), AMD SEV-SNP, and Intel Trust Domain Extensions (TDX), depending on the chosen machine type and CPU platform. Customer data will stay encrypted while it is used, indexed, queried, or trained on. Encryption keys are generated by and reside solely in dedicated hardware and are not exportable, enhancing isolation and security. Built-in hardware optimizations ensure Confidential Computing workloads experience minimal to no significant perfor...
target: gcp
level: 2
severity: medium
tags:
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 4.11 Ensure That Compute Instances Have Confidential Computing Enabled
audit:
  type: manual
  command: 'Note: Confidential Computing is currently only supported on limited VM configurations. To learn more about VM configurations supported by Confidential Computing, visit https://cloud.google.com/confidential-computing/confidential-vm/docs/supported- configurations From Google Cloud Console 1. Go to the VM instances page by visiting: https://console.cloud.google.com/compute/instances. 2. Click on the instance name to see its VM instance details page. 3. Ensure that Confidential VM service is Enabled. From Google Cloud CLI 1. List the instances in your project and get details on each instance: gcloud compute instances list --format=json 2. Ensure that enableConfidentialCompute is set to true for all instances with machine type starting with "n2d-". confidentialInstanceConfig: enableConfidentialCompute: true'
remediation:
  type: iac_patch
  command: 'Confidential Computing can only be enabled when an instance is created. You must delete the current instance and create a new one. From Google Cloud Console 1. Go to the VM instances page by visiting: https://console.cloud.google.com/compute/instances. 2. Click CREATE INSTANCE. 3. Fill out the desired configuration for your instance. 4. Under the Confidential VM service section, check the option Enable the Confidential Computing service on this VM instance. 5. Click Create. From Google Cloud CLI Create a new instance with Confidential Compute enabled. gcloud compute instances create <INSTANCE_NAME> --zone <ZONE> -- confidential-compute --maintenance-policy=TERMINATE'
