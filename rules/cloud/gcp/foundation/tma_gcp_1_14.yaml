id: TMA-GCP-1.14
title: Ensure API Keys Are Restricted To Use by Only Specified Hosts and Apps
description: 'API Keys should only be used for services in cases where other authentication methods are unavailable. In this case, unrestricted keys are insecure because they can be viewed publicly, such as from within a browser, or they can be accessed on a device where the key resides. It is recommended to restrict API key usage to trusted hosts, HTTP referrers and apps. It is recommended to use the more secure standard authentication flow instead. Security risks involved in using API-Keys appear below: - API keys are simple encrypted strings - API keys do not identify the user or the application making the API request - API keys are typically accessible to clients, making it easy to discover and steal an API key In light of these potential risks, Google recommends using the standard authentication flow instead of API keys. However, there are limited cases where API keys are more appropriate. For...'
target: gcp
level: 2
severity: low
tags:
- cloud
- crypto
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 1.14 Ensure API Keys Are Restricted To Use by Only Specified Hosts and Apps
audit:
  type: manual
  command: From Google Cloud Console 1. Go to APIs & Services\Credentials using https://console.cloud.google.com/apis/credentials 2. In the section API Keys, Click the API Key Name. The API Key properties display on a new page. 3. For every API Key, ensure the section Key restrictions parameter Application restrictions is not set to None. Or, 1. Ensure Application restrictions is set to HTTP referrers and the referrer is not set to wild-cards (* or *.[TLD] or *.[TLD]/*) allowing access to any/wide HTTP referrer(s) Or, 1. Ensure Application restrictions is set to IP addresses and referrer is not set to any host (0.0.0.0 or 0.0.0.0/0 or ::0) From Google Cloud Command Line 1. Run the following from within the project you wish to audit gcloud services api-keys list --filter="-restrictions:*" -- format="table[box](displayName:label='Key With No Restrictions')"
remediation:
  type: iac_patch
  command: 'From Google Cloud Console Leaving Keys in Place 1. Go to APIs & Services\Credentials using https://console.cloud.google.com/apis/credentials 2. In the section API Keys, Click the API Key Name. The API Key properties display on a new page. 3. In the Key restrictions section, set the application restrictions to any of HTTP referrers, IP addresses, Android apps, iOS apps. 4. Click Save. 5. Repeat steps 2,3,4 for every unrestricted API key. Note: Do not set HTTP referrers to wild-cards (* or *.[TLD] or .[TLD]/) allowing access to any/wide HTTP referrer(s) Do not set IP addresses and referrer to any host (0.0.0.0 or 0.0.0.0/0 or ::0) Removing Keys Another option is to remove the keys entirely. 1. Go to APIs & Services\Credentials using https://console.cloud.google.com/apis/credentials 2. In the section API Keys, select the checkbox next to each key you wish to remove 3. Select Delete and confirm.'
