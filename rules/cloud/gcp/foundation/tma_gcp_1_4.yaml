id: TMA-GCP-1.4
title: Ensure that Security Key Enforcement is Enabled for All Admin Accounts
description: 'Setup Security Key Enforcement for Google Cloud Platform admin accounts. Google Cloud Platform users with Organization Administrator roles have the highest level of privilege in the organization. These accounts should be protected with the strongest form of two-factor authentication: Security Key Enforcement. Ensure that admins use Security Keys to log in instead of weaker second factors like SMS or one- time passwords (OTP). Security Keys are actual physical keys used to access Google Organization Administrator Accounts. They send an encrypted signature rather than a code, ensuring that logins cannot be phished.'
target: gcp
level: 2
severity: medium
tags:
- cloud
- crypto
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 1.4 Ensure that Security Key Enforcement is Enabled for All Admin Accounts
audit:
  type: manual
  command: '1. Identify users with Organization Administrator privileges: gcloud organizations get-iam-policy ORGANIZATION_ID Look for members granted the role "roles/resourcemanager.organizationAdmin". 2. Manually verify that Security Key Enforcement has been enabled for each account.'
remediation:
  type: iac_patch
  command: '1. Identify users with the Organization Administrator role. 2. Setup Security Key Enforcement for each account. Learn more at: https://cloud.google.com/security-key/'
