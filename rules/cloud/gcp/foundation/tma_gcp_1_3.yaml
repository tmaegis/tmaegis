id: TMA-GCP-1.3
title: Ensure that Multi-Factor Authentication is 'Enabled' for All Non-Service Accounts
description: Setup multi-factor authentication for Google Cloud Platform accounts. Multi-factor authentication requires more than one mechanism to authenticate a user. This secures user logins from attackers exploiting stolen or weak credentials.
target: gcp
level: 1
severity: high
tags:
- auth
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 1.3 Ensure that Multi-Factor Authentication is 'Enabled' for All Non-Service Accounts
audit:
  type: manual
  command: 'From Google Cloud Console For each Google Cloud Platform project, folder, or organization: 1. Identify non-service accounts. 2. Manually verify that multi-factor authentication for each account is set.'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console For each Google Cloud Platform project: 1. Identify non-service accounts. 2. Setup multi-factor authentication for each account.'
