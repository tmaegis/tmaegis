reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.2.8 Ensure That 'cloudsql.enable_pgaudit' Database Flag for each Cloud Sql Postgresql Instance Is Set to 'on' For Centralized Logging
audit:
  type: manual
  command: Determining if the pgAudit Flag is set to 'on' From Google Cloud Console 1. Go to https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Overview page. 3. Click Edit. 4. Scroll down and expand Flags. 5. Ensure that cloudsql.enable_pgaudit flag is set to on. From Google Cloud CLI Run the command by providing <INSTANCE_NAME>. Ensure the value of the flag is on. gcloud sql instances describe <INSTANCE_NAME> --format="json" | jq '.settings|.|.databaseFlags[]|select(.name=="cloudsql.enable_pgaudit")|.value ' Determine if the pgAudit extension is installed 1. Connect to the the server running PostgreSQL or through a SQL client of your choice. 2. Run the following command SELECT * FROM pg_extension; 3. If pgAudit is in this list. If so, it is installed. Determine if Data Access Audit logs are enabled for your project and have sufficient privileges 1. From the homepage open the hamburger menu in the top left. 2. Scroll down to IAM & Adminand hover over it.
    3. In the menu that opens up, select Audit Logs 4. In the middle of the page, in the search box next to filter search for Cloud Composer API 5. Select it, and ensure that both 'Admin Read' and 'Data Read' a...
remediation:
  type: iac_patch
  command: 'Initialize the pgAudit flag From Google Cloud Console 1. Go to https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Overview page. 3. Click Edit. 4. Scroll down and expand Flags. 5. To set a flag that has not been set on the instance before, click Add item. 6. Enter cloudsql.enable_pgaudit for the flag name and set the flag to on. 7. Click Done. 8. Click Save to update the configuration. 9. Confirm your changes under Flags on the Overview page. From Google Cloud CLI Run the below command by providing <INSTANCE_NAME> to enable cloudsql.enable_pgaudit flag. gcloud sql instances patch <INSTANCE_NAME> --database-flags cloudsql.enable_pgaudit=on Note: RESTART is required to get this configuration in effect. Creating the extension 1. Connect to the the server running PostgreSQL or through a SQL client of your choice. 2. Run the following command as a superuser. CREATE EXTENSION pgaudit; Updating the previously created pgaudit.log flag for your Logging
    Needs From Console: Note: there are multiple options here. This command will enable logging for all databases on a server. Please see the customizing database audit logging reference for more flag options. 1...'
