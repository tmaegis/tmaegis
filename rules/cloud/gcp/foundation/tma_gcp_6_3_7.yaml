id: TMA-GCP-6.3.7
title: Ensure 'contained database authentication' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
description: A contained database includes all database settings and metadata required to define the database and has no configuration dependencies on the instance of the Database Engine where the database is installed. Users can connect to the database without authenticating a login at the Database Engine level. Isolating the database from the Database Engine makes it possible to easily move the database to another instance of SQL Server. Contained databases have some unique threats that should be understood and mitigated by SQL Server Database Engine administrators. Most of the threats are related to the USER WITH PASSWORD authentication process, which moves the authentication boundary from the Database Engine level to the database level, hence this is recommended not to enable this flag. This recommendation is applicable to SQL Server database instances. When contained databases are enabled, da...
target: gcp
level: 1
severity: medium
tags:
- auth
- cloud
- gcp
reference: CIS Google Cloud Platform Foundation Benchmark v5.0.0 - 6.3.7 Ensure 'contained database authentication' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
audit:
  type: manual
  command: From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the instance to open its Instance Overview page 3. Under the 'Database flags' section, if the database flag contained database authentication is present, then ensure that it is set to 'off'. From Google Cloud CLI 1. Ensure the below command returns off for any Cloud SQL for SQL Server database instance. gcloud sql instances describe <INSTANCE_NAME> --format=json | jq '.settings.databaseFlags[] | select(.name=="contained database authentication")|.value'
remediation:
  type: iac_patch
  command: 'From Google Cloud Console 1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting https://console.cloud.google.com/sql/instances. 2. Select the SQL Server instance for which you want to enable to database flag. 3. Click Edit. 4. Scroll down to the Flags section. 5. If the flag contained database authentication is present and its value is set to ''on'', then change it to ''off''. 6. Click Save. 7. Confirm the changes under Flags on the Overview page. From Google Cloud CLI 1. If any Cloud SQL for SQL Server instance has the database flag contained database authentication set to ''on'', then change it to ''off'' using the below command: gcloud sql instances patch <INSTANCE_NAME> --database-flags "contained database authentication=off" Note: This command will overwrite all database flags previously set. To keep those and add new ones, include the values for all flags to be set on the instance; any flag not specifically included is set to its default value. For
    flags that do not take a value, specify the flag name followed by an equals sign ("=").'
