id: TMA-ORACLE-SAAS-1.2
title: Ensure MFA is Enforced for All SaaS Users
description: 'Multi-Factor Authentication (MFA) requires users to present an additional verification factor beyond username and password. In Oracle Fusion environments, native MFA enforcement via Identity Domain sign-on policies functions only after the environment''s identity service is upgraded to OCI IAM. MFA protects against credential theft and password reuse attacks. Enforcing MFA across all SaaS users - whether they authenticate through the Fusion Identity Domain, an external OCI IAM domain, or another IdP-provides ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: high
tags:
- oracle-saas
- identity
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 1.2 Ensure MFA is Enforced for All SaaS Users
audit:
  type: manual
  command: 1. Check if the Fusion environment is upgraded to OCI IAM or uses an external IdP. 2. If on OCI IAM, review Security Console, User Categories, Two-Factor Authentication and confirm all user categories have MFA enabled. 3. If identity upgrade is not yet performed, verify that MFA is enforced via the external IdP for all users. 4. Test login with a standard SaaS user account and confirm MFA is required (native or via IdP).
remediation:
  type: iac_patch
  command: '1. If the Fusion environment is upgraded to OCI IAM: In Fusion Security Console User Categories, Two-Factor Authentication, enable MFA for all categories. 2. If the environment is not upgraded or uses a federated IdP: Enable MFA in the external IdP or external OCI IAM domain and ensure it applies to all users accessing Fusion. 3. Communicate enrollment instructions and verify MFA enrollment via Fusion My Profile, Manage Secure Verification. 4. Perform test logins to confirm MFA prompts are consistently applied.'
