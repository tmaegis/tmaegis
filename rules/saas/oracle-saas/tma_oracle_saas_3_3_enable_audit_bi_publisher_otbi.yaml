id: TMA-ORACLE-SAAS-3.3
title: Ensure to enable Audit on BI Publisher and OTBI Activity (Execution, Modification, and Usage Analytics)
description: 'Enable auditing and monitoring of all BI Publisher (BIP) and Oracle Transactional Business Intelligence (OTBI) reporting activity within Oracle Fusion Applications. This includes audit of report executions, catalog object creations, deletions, updates, and access control changes, as well as performance and concurrency ... Reports and dashboards in Fusion Applications can access or export large volumes of sensitive operational and financial data. Auditing report execution and modification provides visibility into who viewed, changed, or ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 2
severity: medium
tags:
- oracle-saas
- logging
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 3.3 Ensure to enable Audit on BI Publisher and OTBI Activity (Execution, Modification, and Usage Analytics)
audit:
  type: manual
  command: '1. Check Audit In BI Publisher For Fusion SaaS Cloud Customers? (Doc ID 2059102.1) - KB61120 Login BI with an BI Administrator user Navigate to: Administration -> Manage BI Publisher -> Runtime Configuration -> Properties -> Data Model Ensure Enable SQL session trace is set to True 2. How to Track Delete, Archive and Unarchive Events in BI (KB86271) Go to Navigator Under Tools select Audit Reports Enter the o Date After o User ▪ Product = Oracle Business Intelligence Enterprise Edition ▪ Event Type (Optional) Click on Search Following are the list of Event Type: BI Analysis ...'
remediation:
  type: iac_patch
  command: '1. How To Configure And Use Audit In BI Publisher For Fusion SaaS Cloud Customers? (Doc ID 2059102.1) - KB61120 Login BI with an BI Administrator user Navigate to: Administration -> Manage BI Publisher -> Runtime Configuration -> Properties -> Data Model If the following parameter is set to True: Enable SQL session trace = True 2. How to Track Delete , Archive and Unarchive Events in BI (KB86271) Go to Navigator Under Tools select Audit Reports Enter the o Date After o User ▪ Product = Oracle Business Intelligence Enterprise Edition ▪ Event Type (Optional) Click on Search Following are the list of "Event Type": BI Analysis Accessed, BI Dashboard Accessed, BI Catalog Object Created, BI ...'
