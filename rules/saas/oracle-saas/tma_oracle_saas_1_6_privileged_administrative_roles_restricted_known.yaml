id: TMA-ORACLE-SAAS-1.6
title: Ensure Privileged and Administrative Roles Are Restricted to Known IP Addresses
description: 'When Location-Based Access Control (LBAC) is enabled in Oracle Fusion Applications, administrative and privileged roles must not be configured for unrestricted access. In the Fusion Security Console, privileged roles such as IT Security Manager and Application Implementation Consultant include the option "Enable Role ... Restricting administrative and privileged access to known IP ranges prevents unauthorized or high-risk logins from untrusted networks. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: high
tags:
- oracle-saas
- identity
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 1.6 Ensure Privileged and Administrative Roles Are Restricted to Known IP Addresses
audit:
  type: manual
  command: 1. Confirm that LBAC is enabled for the Fusion environment. 2. Sign in to Fusion Security Console with appropriate privileges. 3. Navigate to Roles, Search, IT Security Manager (and other privileged roles). 4. Open the role and go to the Administration tab. 5. Verify that the checkbox Enable Role for Access from All IP Addresses is not selected. 6. Confirm that privileged roles are associated with the intended network perimeter or known IP range within LBAC configuration.
remediation:
  type: iac_patch
  command: 1. Sign in to Fusion Security Console with an administrative account. 2. Navigate to Roles, Search, IT Security Manager (or equivalent privileged roles). 3. Go to the Administration tab and ensure the checkbox Enable Role for Access from All IP Addresses is cleared. 4. Verify that the role is correctly assigned to the appropriate network perimeter under LBAC settings, restricting access to known IP ranges. 5. Test access from a trusted IP and confirm the role remains functional; test from an unapproved IP to confirm access is denied.
