id: TMA-ORACLE-SAAS-5.3.6
title: Ensure Shared EPM Accounts Are Monitored
description: 'The purpose of this recommendation is to ensure that sharing of EPM user accounts is monitored. Sharing of accounts could have substantial impact on operations, finances and legal/regulatory compliance. For example, sharing makes it impossible to identify the person who performed an erroneous or malicious action. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.3.6 Ensure Shared EPM Accounts Are Monitored
audit:
  type: manual
  command: 'Identify accounts that are used by more than one person. Manual method: In EPM, identify accounts. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor account use and initiate investigation workflows when those assignments change. 1. For example, deploy the following controls using the instructions in Continuously Monitor Transactions: 45001: Shared User Accounts in EPM Account Reconciliation and 45002: Shared User Accounts in EPM Financial Consolidation and Close.'
remediation:
  type: iac_patch
  command: 'When an account is shared: 1. Either: o Inactivate the account. o Change the account password and share the new password with only one user. o Allow sharing to continue and monitor the transactions performed by the users (see below). 2. Review actions since the account was shared.'
