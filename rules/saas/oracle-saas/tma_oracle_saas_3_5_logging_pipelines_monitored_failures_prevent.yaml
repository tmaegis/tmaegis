id: TMA-ORACLE-SAAS-3.5
title: Ensure Logging Pipelines are Monitored for Failures to Prevent Silent Loss of Audit Events
description: 'Audit and monitoring data from Oracle SaaS Applications is often exported and ingested into downstream systems such as Centralized Log Management (CLM) or Security Information and Event Management (SIEM) Platforms. Audit data is critical for detecting malicious activity, ensuring accountability, and meeting compliance requirements. Pipeline failures can result in gaps that prevent accurate forensic investigations and weaken ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 2
severity: medium
tags:
- oracle-saas
- logging
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 3.5 Ensure Logging Pipelines are Monitored for Failures to Prevent Silent Loss of Audit Events
audit:
  type: manual
  command: 1. If using OCI Service Connector Hub, open the OCI Console, review OCI Service Connector Hub to confirm monitoring is enabled on log collection and forwarding pipelines. 2. Check whether alarms exist in OCI Monitoring for connector errors, ingestion failures, or delivery delays. 3. Validate that alerts are directed to responsible administrators via email, pager, or incident management systems. 4. Inspect recent alarm history to confirm that test failures are detected and reported.
remediation:
  type: iac_patch
  command: 1. Configure OCI Monitoring alarms on Service Connector Hub pipelines to trigger when ingestion or forwarding fails. 2. Establish alert rules in Centralized Log Management (CLM) or SIEM Platform to detect periods with no incoming audit events. 3. Route alarms to administrators via Notifications, email, or ticketing systems. 4. Test the monitoring setup by intentionally pausing or misconfiguring a pipeline and verifying that alerts are generated. 5. Document the monitoring and escalation process in the organization's operational runbooks.
