id: TMA-ORACLE-SAAS-5.3.4
title: Ensure Fusion ERP Transactions Allowed by SoD Violations Are Monitored
description: 'The purpose of this recommendation is to ensure that ERP transactions that violate separation of duties policies (SoD) are monitored. Erroneous or malicious transactions could have substantial impact on operations, finances and legal/regulatory compliance. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.3.4 Ensure Fusion ERP Transactions Allowed by SoD Violations Are Monitored
audit:
  type: manual
  command: 'Manual method: Review the transactions: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the following controls using the instructions in Continuously Monitor Transactions: 40001: Supplier and Payables Invoices Created by the Same User, 40004: Payment Process Request Created by Same User Managing Suppliers, 40005: Suppliers and ...'
remediation:
  type: iac_patch
  command: 1. Reverse the transaction if possible. 2. Identify the configurations that allowed the transaction and alter them if possible -for details see the preceding recommendations.
