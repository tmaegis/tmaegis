id: TMA-ORACLE-SAAS-1.5
title: Ensure OCI Console Access Is Restricted to Administrative Accounts
description: 'Ensure that only designated administrative accounts are allowed to log in to the Oracle Cloud Infrastructure (OCI) Console. All non-admin user accounts must have the console password capability disabled, and sign-on policies must restrict Console application access to administrative groups only. The OCI Console provides broad administrative access. Restricting console login exclusively to administrative accounts minimizes the risk of unauthorized changes and reduces the attack surface in case of credential ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- identity
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 1.5 Ensure OCI Console Access Is Restricted to Administrative Accounts
audit:
  type: manual
  command: 1. Navigate to Identity & Security Domains Users. For each non-admin user, confirm that Can use Console password is unchecked under Edit User Capabilities. 2. Navigate to Domains Security Sign-On Policies. Verify there is a policy rule that allows Console access only for designated administrative groups. Confirm that a deny rule is in place for all other users.
remediation:
  type: iac_patch
  command: '1. For each non-admin user: Navigate to Identity & Security Domains Edit User Capabilities. Uncheck Can use Console password. Save changes. 2. Update the Sign-On Policy for the identity domain: Add a rule that allows Console login only for users in an Admin group. Add a default deny rule for all other users. 3. Test the configuration by attempting Console login with both an admin and a non-admin account.'
