id: TMA-ORACLE-SAAS-5.3.5
title: Ensure Fusion HCM Transactions Allowed by SoD Violations Are Monitored
description: 'The purpose of this recommendation is to ensure that HCM transactions that violate separation of duties policies (SoD) are monitored. Erroneous or malicious transactions could have substantial impact on operations, finances and legal/regulatory compliance. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.3.5 Ensure Fusion HCM Transactions Allowed by SoD Violations Are Monitored
audit:
  type: manual
  command: 'Manual method: Review the transactions: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the following controls using the instructions in Continuously Monitor Transactions: 50001: Payroll Transactions and Personal Payment Method Managed by Same User, 50002: Payroll Transactions and Time Cards Managed by Same User, and 50005 ...'
remediation:
  type: iac_patch
  command: 1. Reverse the transaction if possible. 2. Identify the configurations that allowed the transaction and alter them if possible -for details see the preceding recommendations.
