id: TMA-ORACLE-SAAS-4.2.2
title: Ensure Unused Business Setups Are Disabled
description: 'The purpose of this recommendation is to ensure that unused business setups are disabled, or if they cannot or should not be disabled, that the actions they allow are monitored. Business setups could include ledgers, suppliers, and customers, to name only a few. An unused setup could be discovered by a user, then used either erroneously or maliciously. For example, journal entries could be made to unused ledgers, with subsequent impact on financial reporting accuracy; purchase ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.2.2 Ensure Unused Business Setups Are Disabled
audit:
  type: manual
  command: 'Identify business setups that are not associated with transactions. Manual method: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor setup use and initiate investigation workflows when they remain unused: 1.'
remediation:
  type: iac_patch
  command: 'If a business setup that was previously unused is now discovered to have been used, 1. Either: o Make the setup inactive. o Leave the setup active and monitor the transactions performed if the setup is used in transactions (see below). 2. Review those transactions: o Manual method: Review the transactions that include the setup: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1.'
