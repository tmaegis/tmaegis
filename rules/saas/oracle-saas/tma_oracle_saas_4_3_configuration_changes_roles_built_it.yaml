id: TMA-ORACLE-SAAS-4.3
title: Ensure Configuration Changes to Roles Built for IT Superusers Are Monitored
description: 'The purpose of this recommendation is to ensure that pervasive or substantial abilities to configure and change Fusion are monitored. Those abilities let users fundamentally change the behavior of the applications. Erroneous or malicious changes could have substantial impact on operations and finances. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.3 Ensure Configuration Changes to Roles Built for IT Superusers Are Monitored
audit:
  type: manual
  command: 'Identify users who have been assigned an IT superuser role - e.g., Application Implementation Consultant. Manual method: Inspect the role''s assignments in Security Console. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor the role''s assignments and initiate investigation workflows when those assignments change. 1. For example, deploy the control 60024: New Users Assigned to Application Implementation Consultant Role using the instructions in Continuously Monitor Configuration Changes.'
remediation:
  type: iac_patch
  command: 'When a user is assigned to the role: 1. Either: o Remove unwanted assignments. o Leave assignments and monitor the transactions performed by assigned users (see below). 2. Review the user''s actions since then: o Manual method: Review the transactions that the role allows: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the appropriate controls using the instructions in Continuously Monitor Transactions.'
