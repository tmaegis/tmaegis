id: TMA-ORACLE-SAAS-5.3.7
title: Ensure Potential Ghost Employees Are Monitored
description: 'The purpose of this recommendation is to ensure that the ability of employees to be paid without working is monitored. Employees who are paid without working could have substantial impact on operations, finances and legal/regulatory compliance. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.3.7 Ensure Potential Ghost Employees Are Monitored
audit:
  type: manual
  command: 'Identify users who have been paid without working. Manual method: In HCM, identify users who have payroll entries without time entries or other evidence or work. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor suspicious hires and initiate investigation workflows when those assignments change. 1.'
remediation:
  type: iac_patch
  command: 'When a user is paid without working: 1. Either: o Terminate the user''s employment. o Allow employment to continue and monitor the transactions performed by the user and their hiring managers (see below). 2. Review actions since then: o Manual method: Review the transactions performed by the user and their hiring managers: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1.'
