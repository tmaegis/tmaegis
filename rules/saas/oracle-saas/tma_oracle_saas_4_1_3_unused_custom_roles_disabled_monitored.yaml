id: TMA-ORACLE-SAAS-4.1.3
title: Ensure Unused Custom Roles Are Disabled or Monitored
description: 'The purpose of this recommendation is to ensure that unused Custom Roles are disabled, or if they cannot or should not be disabled, that the actions they allow are monitored. An unused custom role could be discovered by a user, assigned to a user (perhaps themself or someone else) either erroneously or maliciously; then the beneficiary of the assignment could perform unintended or ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.1.3 Ensure Unused Custom Roles Are Disabled or Monitored
audit:
  type: manual
  command: 'Identify custom roles that are not assigned to any users. Manual method: Inspect each role''s user assignments in Security Console. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor roles'' assignments and initiate investigation workflows when they remain unassigned. 1. For example, deploy the control 80001: Custom Roles Not Used using the instructions in Continuously Monitor Configuration Changes.'
remediation:
  type: iac_patch
  command: 'If a role that was previously unassigned is now discovered to be assigned to a user: 1. Either: o Make the role inactive. o Leave the role active and monitor the transactions performed if the role is assigned to a user (see below). 2. Review the user''s actions since then: o Manual method: Review the transactions that the role allows: 1. Navigate to Tools Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1.'
