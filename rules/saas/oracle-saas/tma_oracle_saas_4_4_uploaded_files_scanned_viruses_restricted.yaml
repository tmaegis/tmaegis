id: TMA-ORACLE-SAAS-4.4
title: Ensure Uploaded Files Are Scanned for Viruses and Restricted by Extension Policy
description: 'In Oracle EPM Cloud, you can enable pre-upload virus scanning using the setVirusScanOnFileUploads command so that files with malware are blocked before upload. In addition, enforce a file extension policy to restrict potentially dangerous file types (executables, scripts) from being uploaded. Automatically scanning files before upload prevents malicious content from entering the environment. Combined with extension restrictions, this defense-in-depth approach reduces the risk from malware, ransomware, or ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.4 Ensure Uploaded Files Are Scanned for Viruses and Restricted by Extension Policy
audit:
  type: manual
  command: 1. Run epmautomate getVirusScanOnFileUploads to check whether scanning is enabled. If it returns false, scanning is not enforced. ￼ 2. Confirm that the file upload behavior prevents known malicious signatures (e.g. test with EICAR file) or rejects infected files. 3. Review documentation or environment settings that disallow certain binary file types (e.g. .exe, .bat, .msi, .vbs) as indicated in the uploadFile command spec. 4. Ensure that only Service Administrators have permission to run setVirusScanOnFileUploads. 5.
remediation:
  type: iac_patch
  command: Use epmautomate setVirusScanOnFileUploads true to enable virus scanning before files are uploaded. ￼ If needed, define or refine a policy of allowed and disallowed extension types to block risky formats. Test uploads to validate scanning and blocking is working as expected. Ensure that role assignment is controlled so only trusted Service Administrators can modify scan settings. Document exception handling (for business-justified file types) and apply compensating controls.
