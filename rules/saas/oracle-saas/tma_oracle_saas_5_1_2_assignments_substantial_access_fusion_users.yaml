id: TMA-ORACLE-SAAS-5.1.2
title: Ensure Assignments of Substantial Access to Fusion Users Are Monitored
description: 'The purpose of this recommendation is to ensure that assignments of pervasive or substantial abilities to configure and change Fusion, create/approve transactions, and view sensitive data are monitored. Those abilities give users freedom to fundamentally change the behavior of the applications, create/approve transactions, and view sensitive data without the usual separation of duties (SoD) or oversight. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.1.2 Ensure Assignments of Substantial Access to Fusion Users Are Monitored
audit:
  type: manual
  command: 'Identify users who have been assigned privileges that let them change the behavior of the applications, create/approve transactions, and view sensitive data. Manual method: Review assignments - e.g., HDL logs. Automated method: Create Access Controls in Fusion Cloud Applications Risk Management that continuously monitor the roles'' assignments and initiate investigation workflows when those assignments change. 1.'
remediation:
  type: iac_patch
  command: 'When a user is assigned the privileges: 1. Either: o Remove unwanted assignments. o Leave assignments and monitor the transactions performed by assigned users (see below). 2. Review the user''s actions since then: o Manual method: Review the transactions that the privileges allow: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the appropriate controls using the instructions in Continuously Monitor Transactions.'
