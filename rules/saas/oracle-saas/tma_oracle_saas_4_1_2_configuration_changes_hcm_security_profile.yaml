id: TMA-ORACLE-SAAS-4.1.2
title: Ensure Configuration Changes to HCM Security Profile Setups Are Monitored
description: 'The purpose of this recommendation is to ensure that changes to HCM security profiles are appropriate. Each profile gives users access to specific kinds of HCM data, like specfic People or specific Payroll records. Each user can be assigned one or more profiles. Each change to a profile has immediate effect for all users who have the profile. If a profile is changed erroneously or maliciously, users will gain or lose access unexpectedly. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.1.2 Ensure Configuration Changes to HCM Security Profile Setups Are Monitored
audit:
  type: manual
  command: '1. Enable audit of security profile changes using the instructions in Configure Data Roles and Security Profiles for Audit 2. Monitor changes to... 1. That Audit Policy using the instructions in Ensure Changes to Audit Policy Settings are Monitored. 2. Security profiles: ▪ Manual method: Review the Audit History report for profiles: 1. Navigate to Tools, Audit Reports. 2. Set Product. 3. Set Date to desired day/range. 4. Tap Search.'
remediation:
  type: iac_patch
  command: 'If audit has been disabled or was never enabled, see the instructions in Ensure Changes to Audit Policy Settings are Monitored. If unwanted changes were made to a profile: 1. Restore the profile''s intended settings. 2. Review activity that occurred while those changes were in effect: o Manual method: Review the transactions that could be created or approved while the changes were in effect: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1.'
