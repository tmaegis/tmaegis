id: TMA-ORACLE-SAAS-1.7
title: Ensure Privileged Access is Certified Periodically
description: 'The purpose of this recommendation is to ensure that only authorized users retain elevated access, by reviewing users'' abilities periodically - monthly for IT administrators and quarterly for others. Users could accumulate roles and data access as their responsibilities change, giving them elevated or unintended abilities that they could use erroneously or maliciously with substantial impact on operations and ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: high
tags:
- oracle-saas
- identity
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 1.7 Ensure Privileged Access is Certified Periodically
audit:
  type: manual
  command: 'Review users'' abilities Manual method: 1. Navigate to Tools Scheduled Processes 2. Review User and Role Access Audit Report and User Role Membership Report (or schedule them, then review them). Automated method: 1. Initiate one or more Access Certification campaigns in Fusion Cloud Applications Risk Management using the instructions in Digitize Access Certification Workflows. 2.'
remediation:
  type: iac_patch
  command: 'When a role should be removed from a user either: Remove unwanted role. Leave role and monitor the transactions performed by the user (see below). 1. Review the user''s actions since the previous review: Manual method: 1. Navigate to Tools Reports and Analytics. 2. Select the appropriate dashboards or reports. 3. Review the transactions that the role allows. Automated method: 1.Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs. 1. Deploy the appropriate controls using the instructions in Continuously Monitor Transactions.'
