id: TMA-ORACLE-SAAS-5.3.3
title: Ensure SoD Across Fusion and OCI Is Monitored
description: 'The purpose of this recommendation is to ensure that the ability to perform an unwanted combination of actions in Fusion and its OCI environment is monitored. Erroneous or malicious actions could have substantial impact on operations, finances and legal/regulatory compliance. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.3.3 Ensure SoD Across Fusion and OCI Is Monitored
audit:
  type: manual
  command: '1. Identify users who have been assigned combinations of Fusion and OCI privileges that let them perform unwanted actions. o Manual method: In Fusion and OCI''s user access administration tools, identify users that have those combinations. o Automated method: Create Access Controls in Fusion Cloud Applications Risk Management that continuously monitor the privileges'' assignments and initiate investigation workflows when those assignments change. 1.'
remediation:
  type: iac_patch
  command: 'When a user is assigned the privileges: 1. Either: o Remove unwanted assignments. o Leave assignments and monitor the transactions performed by assigned users (see below). 2. Review the user''s actions since then: o Manual method: Review the transactions that the privileges allow: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the appropriate controls using the instructions in Continuously Monitor Transactions.'
