id: TMA-ORACLE-SAAS-4.1.1
title: Ensure Changes to Audit Policy Settings Are Monitored
description: 'The purpose of this recommendation is to ensure that changes to Audit Policies are appropriate. Audit Policies record the changes made to Fusion Application configuration settings, which in turn determine the applications'' behaviors. Each Audit Policy records changes to specific settings. Changes to Audit Policies impact the ability to detect changes to Fusion Application configurations, and consequent changes to the applications'' behaviors. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.1.1 Ensure Changes to Audit Policy Settings Are Monitored
audit:
  type: manual
  command: 'Ensure that Audit Policies are enabled - and remain enabled - for Fusion Application configuration settings that have material impact on finances, operations, and compliance: Manual method: Review the Audit History report for Audit Policies: 1. Navigate to Tools, Audit Reports. 2. Set Product to Audit Policies. 3. Set Date to desired day/range. 4. Tap Search. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor Audit Policy changes and initiate investigation workflows when unwanted changes occur. 1.'
remediation:
  type: iac_patch
  command: '1. Re-enable the Audit Policy. 1. Navigate to My Enterprise, Setup and Maintenance, Manage Audit Policies 2. Tap Configure Business Object Attributes in the Oracle Fusion Applications section. 3. Re-enable the policy. 2. Review activity that occurred while the Audit Policy was disabled: o Manual method: Review the transactions that could be created or approved while the Audit Policy was disabled. 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs.'
