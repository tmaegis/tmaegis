id: TMA-ORACLE-SAAS-4.2.1
title: Ensure Changes to Payment Setups Are Monitored
description: 'The purpose of this recommendation is to ensure that Payment configuration changes are monitored. Each change to a Payment configuration has immediate effect for all subsequent payments. Configurations include payment methods and bank account details. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: medium
tags:
- oracle-saas
- configuration
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 4.2.1 Ensure Changes to Payment Setups Are Monitored
audit:
  type: manual
  command: '1. Enable audit of Payment setup changes: 1. Navigate to My Enterprise, Setup and Maintenance, Manage Audit Policies 2. Tap Configure Business Object Attributes in the Oracle Fusion Applications section. 3. Enable the Audit Policies for Payment setup attributes. 2. Monitor changes to... 1. Those Audit Policies, using the instructions in Ensure Changes to Audit Policy Settings are Monitored. 2. The Payment setups: ▪ Manual method: Review the Audit History reports for the setups: 1. Navigate to Tools, Audit Reports. 2. Set Product. 3. Set Date to desired day/range. 4. Tap Search.'
remediation:
  type: iac_patch
  command: 'If audit has been disabled or was never enabled, see the instructions in Ensure Changes to Audit Policy Settings are Monitored. If unwanted changes were made to a Payment setup: 1. Restore the intended settings. 2. Review activity that occurred while those changes were in effect: o Manual method: Review the transactions that could be created or approved while the changes were in effect: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. o Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1.'
