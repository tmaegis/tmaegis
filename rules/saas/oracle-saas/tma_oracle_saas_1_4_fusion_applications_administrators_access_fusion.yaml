id: TMA-ORACLE-SAAS-1.4
title: Ensure Fusion Applications Administrators Have Access Only to Fusion Applications Resources
description: 'Ensure that Fusion Applications Administrators are granted Console access only to Fusion Applications resources. Their IAM policies must be scoped exclusively to the fusion-applications-family resource type, without granting access to other OCI services. Fusion Applications Administrators are responsible for managing SaaS environments, not the broader OCI infrastructure. Granting them access to additional OCI services (for example, Compute, Networking, Object Storage) ... Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 2
severity: high
tags:
- oracle-saas
- identity
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 1.4 Ensure Fusion Applications Administrators Have Access Only to Fusion Applications Resources
audit:
  type: manual
  command: '1. Navigate to Identity & Security Policies. 2. Review policies attached to groups containing Fusion Applications Administrators. 3. Confirm that: Policies use the fusion-applications-family resource type. No broad tenancy-wide permissions (such as manage all-resources or unrelated service resource types) are present. 4. Verify that Console access for Fusion Administrators shows only Fusion Applications in the navigation menu.'
remediation:
  type: iac_patch
  command: '1. Identify the group(s) used for Fusion Applications Administrators (e.g., FusionAdmins). 2. Remove any existing policies that provide access to non-Fusion OCI services. 3. Create or update the policy to restrict privileges to Fusion Applications only: For administrators: Allow group FusionAdmins to manage fusion-applications-family in tenancy For read-only roles (if needed): Allow group FusionViewers to read fusion-applications-family in tenancy'
