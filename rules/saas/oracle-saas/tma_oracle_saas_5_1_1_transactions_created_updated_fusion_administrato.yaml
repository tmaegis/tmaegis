id: TMA-ORACLE-SAAS-5.1.1
title: Ensure Transactions Created/Updated by Fusion Administrators Are Monitored
description: 'The purpose of this recommendation is to ensure that creation, update and approval of transactions by administrators are monitored. Erroneous or malicious transactions could have substantial impact on operations, finances and legal/regulatory compliance. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 1
severity: high
tags:
- oracle-saas
- monitoring
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 5.1.1 Ensure Transactions Created/Updated by Fusion Administrators Are Monitored
audit:
  type: manual
  command: 'Manual method: Review the transactions: 1. Navigate to Tools, Reports and Analytics. 2. Select the appropriate dashboards or reports. Automated method: Create Transaction Controls in Fusion Cloud Applications Risk Management that continuously monitor those transactions and initiate investigation workflows when unwanted activity occurs: 1. Deploy the following controls using the instructions in Continuously Monitor Transactions: 41001: Approved Payable Invoices by IT Superusers, 41002: Created or Updated Payable Invoices by IT Superusers, 41003: Created or Updated Payments by IT ...'
remediation:
  type: iac_patch
  command: 1. Reverse the transaction if possible. 2. Identify the configurations that allowed the transaction and alter them if possible -for details see the preceding recommendations.
