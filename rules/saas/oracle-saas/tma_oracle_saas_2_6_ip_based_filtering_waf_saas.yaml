id: TMA-ORACLE-SAAS-2.6
title: Ensure IP-Based Filtering with WAF for SaaS is Enforced
description: 'IP-based filtering in WAF for Oracle Fusion Applications restricts access to trusted public IP addresses or CIDR ranges. WAF rules can allow or block specific IP ranges so that only authorized enterprise networks (such as corporate offices, VPN gateways, or partner networks) can reach Fusion Applications. Restricting access by IP address or CIDR reduces the exposure of Fusion Applications to unauthorized traffic from the public internet. Reported as a manual review item: these Fusion/EPM/OCI IAM settings are reviewed in the Oracle SaaS and OCI consoles or reports.'
target: oracle-saas
level: 2
severity: medium
tags:
- oracle-saas
- network
reference: CIS Oracle SaaS Cloud Applications Benchmark v1.0.0 - 2.6 Ensure IP-Based Filtering with WAF for SaaS is Enforced
audit:
  type: manual
  command: 1. Review Service Request (SR) records with Oracle SaaS Operations to confirm that IP-based filtering has been enabled. 2. Verify that the allowlist includes only approved public IP addresses or CIDR ranges corresponding to trusted networks. 3. Ensure no overly broad ranges, such as 0.0.0.0/0, are permitted. 4. Optionally log a Service Request with Oracle SaaS Operations to confirm the current WAF policy configuration. 5. Test connectivity from both an allowed and a disallowed IP address to confirm enforcement.
remediation:
  type: iac_patch
  command: 1. Submit a Service Request to Oracle SaaS Operations requesting IP-based filtering to be enabled for the Fusion environment. 2. Provide Oracle with a list of approved IP addresses or CIDR ranges representing trusted enterprise or VPN networks. 3. Review and approve Oracle's implementation of the filtering policy. 4. Remove any unnecessary or overly broad ranges. 5. Validate enforcement by testing API and UI access from both allowed and disallowed IP addresses. 6. Document exceptions if temporary external access is required.
