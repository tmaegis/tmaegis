id: TMA-GWS-2SV-ENFORCED
title: Ensure 2-Step Verification is enforced for all users
description: 2SV stops most credential phishing and password-spray account takeovers. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: critical
tags:
- google-workspace
- authentication
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Authentication / 2-Step Verification (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Security > Authentication > 2-step verification: select the top-level organizational unit and confirm ''Allow users to turn on 2-Step Verification'' is checked, Enforcement = On [with a short new-user enrollment period], and for admins ''Only security key'' is preferred. Repeat for child OUs that override the setting.'
remediation:
  type: iac_patch
  command: 'Admin console: Security > Authentication > 2-step verification > Enforcement: On (communicate the enrollment deadline first).'
