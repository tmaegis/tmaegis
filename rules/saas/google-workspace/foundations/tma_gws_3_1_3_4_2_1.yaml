id: TMA-GWS-3.1.3.4.2.1
title: Ensure link identification behind shortened URLs is enabled
description: Identify links behind short URLs, and display a warning when you click links to untrusted domains. You should protect your users from potentially malicious links.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.4.2.1 Ensure link identification behind shortened URLs is enabled
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Links and external images, ensure Identify links behind shortened URLs is checked'
remediation:
  type: iac_patch
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Links and external images, set Identify links behind shortened URLs to checked 6. Select Save'
