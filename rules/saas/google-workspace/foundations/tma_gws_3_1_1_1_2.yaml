id: TMA-GWS-3.1.1.1.2
title: Ensure internal sharing options for primary calendars are configured
description: Control how much calendar information users in your organization can share internally. In general, not everyone in the organization needs to know the schedule details of everyone else (operational security). Free/busy indication is enough for most people.
target: google-workspace
level: 2
severity: low
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.1.1.2 Ensure internal sharing options for primary calendars are configured
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Calendar 5. Under Sharing settings, select Internal sharing options for primary calendars 6. Ensure Only free/busy information (hide event details) is selected'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Calendar 5. Under Sharing settings, select Internal sharing options for primary calendars 6. Select Only free/busy information (hide event details) 7. Select Save'
