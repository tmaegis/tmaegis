id: TMA-GWS-3.1.4.1.1
title: Ensure external filesharing in Google Chat and Hangouts is disabled
description: Control how files are shared externally in Google Chat and Hangouts. Files often contain confidential information, and some organizations, particularly in regulated industries, need to control the flow of this information within and outside of their organization.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.4.1.1 Ensure external filesharing in Google Chat and Hangouts is disabled
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Chat and classic Hangouts 4. Select Chat File Sharing 5. Under Setting, verify External filesharing is set to No files'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Chat and classic Hangouts 4. Select Chat File Sharing 5. Under Setting, set External filesharing to No files 6. Select Save'
