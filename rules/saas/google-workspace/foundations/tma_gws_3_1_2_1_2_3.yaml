id: TMA-GWS-3.1.2.1.2.3
title: Ensure shared drive file access is restricted to members only
description: Shared drive file access should be restricted to that shared drive's members Preventing unauthorized users from access sensitive data is paramount in preventing unauthorized or unintentional information disclosures.
target: google-workspace
level: 1
severity: medium
tags:
- access-control
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.2.1.2.3 Ensure shared drive file access is restricted to members only
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Drive and Docs 5. Select Sharing settings 6. Under Shared drive creation, ensure Allow people who aren''t shared drive members to be added to files is unchecked'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Drive and Docs 5. Select Sharing settings 6. Under Shared drive creation, set Allow people who aren''t shared drive members to be added to files to unchecked 7. Select Save'
