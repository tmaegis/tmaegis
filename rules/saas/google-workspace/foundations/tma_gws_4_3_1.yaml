id: TMA-GWS-4.3.1
title: Ensure the Dashboard is reviewed regularly for anomalies
description: 'As an administrator, you can use the security dashboard to see an overview of different security reports. By default, each security report panel displays data from the last 7 days. You can customize the dashboard to view data from Today, Yesterday, This week, Last week, This month, Last month, or Days ago (up to 180 days). Charts/reports available (Minimum, but could be many more depending on account type): - DLP incidents - Top policy incidents - Failed device password attempts - Compromised device events - Suspicious device activities - OAuth scope grants by product (beta customers only) - OAuth grant activity - OAuth grants to new apps - User login attempts – Challenge method - User login attempts – Failed - User login attempts – Suspicious Details on what each of these charts/reports mean can be found here. This report should be reviewed weekly. NOTE: The availability of each indi...'
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 4.3.1 Ensure the Dashboard is reviewed regularly for anomalies
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator. 2. Select Reporting 3. Select Reports 4. Select User Reports 5. Select Security, and a table of results will be displayed with the fields listed in the Recommendation description above. 6. Review the displayed users and values for anomalies'
remediation:
  type: iac_patch
  command: 'The remediation for any anomalies in the various fields varies widely (different sections of the Google Workspace Admin UI). Please refer to Google''s documentation for specifics (here). NOTE: Many of these settings will be remedied by implementing other sections of this Benchmark. For example, an Admin not enrolled in 2-Step Verification can be remedied by implementing the Remediation procedure for the recommendation Ensure 2-Step Verification (Multi-Factor Authentication) is enforced for all users in administrative roles.'
