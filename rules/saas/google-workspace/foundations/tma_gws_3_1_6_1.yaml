id: TMA-GWS-3.1.6.1
title: Ensure accessing groups from outside this organization is set to private
description: Choose whether people outside your organization can access your groups. Group owners can further restrict access as needed. Who can externally view groups internal to the organization should be carefully controlled and their access vetted as needed.
target: google-workspace
level: 1
severity: medium
tags:
- access-control
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.6.1 Ensure accessing groups from outside this organization is set to private
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Groups for Business 5. Select Sharing options 6. Verify Accessing groups from outside this organization is Private'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Groups for Business 5. Select Sharing options 6. Set Accessing groups from outside this organization to Private 7. Select Save'
