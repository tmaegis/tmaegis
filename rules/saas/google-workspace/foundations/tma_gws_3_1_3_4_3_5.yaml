id: TMA-GWS-3.1.3.4.3.5
title: Ensure groups are protected from inbound emails spoofing your domain
description: If a group receives an email that is spoofing your domain it is sent to the spam folder. You should protect your groups from any emails that spoofing your domain.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.4.3.5 Ensure groups are protected from inbound emails spoofing your domain
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Spoofing and authentication, ensure Protect your Groups from inbound emails spoofing your domain is checked 6. Ensure Action is set to Move email to spam'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Spoofing and authentication, set Protect your Groups from inbound emails spoofing your domain to checked 6. Set Action to Move email to spam 7. Select Save'
