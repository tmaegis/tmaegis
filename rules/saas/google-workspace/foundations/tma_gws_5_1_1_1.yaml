id: TMA-GWS-5.1.1.1
title: Ensure the App Usage Report is reviewed regularly for anomalies
description: 'As an administrator, you can use Apps usage reports to get an in-depth understanding of how your users use Google Workspace apps. Fields Available: - User - Gmail storage used (MB) - Drive storage used (MB) - Photos storage used (MB) - Total storage used (MB) - Storage used (%) - Classroom - last used time - Classes created - Posts created - Total emails - Emails sent - Emails received - Gmail (IMAP) - last used time - Gmail (POP) - last used time - Gmail (Web) - last used time - Files edited - Files viewed - Drive - last active time - Files added - Other types added - Google Docs added - Google Sheets added - Google Slides added - Google Forms added - Google Drawings added - Posts - +1s - +1s received - Comments - Comments received - Reshares - Reshares received - Search queries - Search queries from web - Search queries from Android - Search queries from iOS Details on what each of...'
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 5.1.1.1 Ensure the App Usage Report is reviewed regularly for anomalies
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator. 2. Select Reporting 3. Select Reports 4. Select User Reports 5. Select App usage, and a table of results will be displayed with the fields listed in the Recommendation description above. 6. Review the displayed users and values for anomalies'
remediation:
  type: iac_patch
  command: 'The remediation for any anomalies in the various fields varies widely (different sections of the Google Workspace Admin UI). Please refer to Google''s documentation for specifics (here). NOTE: Many of these settings will be remedied by implementing other sections of this Benchmark. For example, an Admin showing recent Gmail (IMAP) - last used time and/or Gmail (POP) - last used time can be remedied by implementing the Remediation procedure for the recommendation Ensure POP and IMAP access is disabled for all users.'
