id: TMA-GWS-3.1.3.6.1
title: Ensure enhanced pre-delivery message scanning is enabled
description: Enables improved detection of suspicious content prior to delivery. As an administrator, you can increase Gmail's ability to identify suspicious content with enhanced pre-delivery message scanning. Typically, when Gmail identifies a possible phishing message, a warning is displayed and the message might be moved to spam.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.6.1 Ensure enhanced pre-delivery message scanning is enabled
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Select Spam, phishing, and malware 6. Ensure Enhanced pre-delivery message scanning. is ON'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Select Spam, phishing, and malware 6. Select Enhanced pre-delivery message scanning. 7. Set Enables improved detection of suspicious content prior to delivery to checked 8. Select Save'
