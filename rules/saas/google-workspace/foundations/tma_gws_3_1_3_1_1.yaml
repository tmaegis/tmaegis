id: TMA-GWS-3.1.3.1.1
title: Ensure users cannot delegate access to their mailbox
description: Mail delegation allows the delegate to read, send, and delete messages on their behalf. For example, a manager can delegate Gmail access to another person in their organization, such as an administrative assistant. Only administrators should be able to delegate access to a user's mailboxes.
target: google-workspace
level: 1
severity: medium
tags:
- access-control
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.1.1 Ensure users cannot delegate access to their mailbox
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under User Settings - Mail delegation, ensure Let users delegate access to their mailbox to other users in the domain is unchecked'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under User Settings - Mail delegation, set Let users delegate access to their mailbox to other users in the domain to unchecked 6. Select Save'
