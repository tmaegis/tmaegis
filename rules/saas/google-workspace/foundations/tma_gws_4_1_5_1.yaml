id: TMA-GWS-4.1.5.1
title: Ensure password policy is configured for enhanced security
description: Configure Google Workspace Password Policy with a more secure length and is enforced upon next sign-in to protect against the use of common password attacks. Strong password policies protect an organization by prohibiting the use of weak passwords.
target: google-workspace
level: 1
severity: high
tags:
- auth
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 4.1.5.1 Ensure password policy is configured for enhanced security
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Security 3. Select Password management 4. Under Strength, ensure Enforce strong passwords is checked 5. Under Length, ensure Minimum Length is set to 14+ 6. Under Strength and Length enforcement, ensure Enforce password policy at next sign-in is set to checked 7. Under Reuse, ensure Allow password reuse is unchecked 8. Under Expiration, ensure Password reset frequency is set to 365 Days'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Security 3. Select Password management 4. Under Strength, set Enforce strong passwords to checked 5. Under Length, set Minimum Length to 14 or greater 6. Under Strength and Length enforcement, set Enforce password policy at next sign-in is checked 7. Under Reuse, set Allow password reuse to unchecked 8. Under Expiration, set Password reset frequency to 365 Days 9. Select Save'
