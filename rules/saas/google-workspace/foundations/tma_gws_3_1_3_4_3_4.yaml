id: TMA-GWS-3.1.3.4.3.4
title: Ensure protection against any unauthenticated emails is enabled
description: Displays a warning when any message is not authenticated (SPF or DKIM). You should protect your users from any emails that aren't authenticated (SPF or DKIM)
target: google-workspace
level: 1
severity: high
tags:
- auth
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.4.3.4 Ensure protection against any unauthenticated emails is enabled
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Spoofing and authentication, ensure Protect against any unauthenticated emails is checked'
remediation:
  type: iac_patch
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Google Workspace 4. Select Gmail 5. Under Safety - Spoofing and authentication, set Protect against any unauthenticated emails to checked 6. Select Save'
