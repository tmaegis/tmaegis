id: TMA-GWS-3.1.3.1.2
title: Ensure offline access to Gmail is disabled
description: Disables the user's ability to utilize various Gmail functions (read, write, search, delete, and label email messages) while not connected to the internet. Prevents the organization's data (user's email) from being copied to remote computers.
target: google-workspace
level: 1
severity: low
tags:
- access-control
- google-workspace
- saas
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - 3.1.3.1.2 Ensure offline access to Gmail is disabled
audit:
  type: manual
  command: 'To verify this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Gmail 4. Select User Settings 5. Under Gmail web offline 6. Ensure Enable Gmail web offline is unchecked'
remediation:
  type: iac_patch
  command: 'To configure this setting via the Google Admin Console: 1. Log in to https://admin.google.com as an administrator 2. Select Apps 3. Select Gmail 4. Select User Settings 5. SelectGmail web offline 6. Set Enable Gmail web offline to unchecked 7. Select Save'
