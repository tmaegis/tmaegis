id: TMA-GWS-LESS-SECURE-APPS
title: Ensure access to less secure apps is disabled
description: Less secure apps sign in with only a password over IMAP/POP/SMTP, bypassing 2SV. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: high
tags:
- google-workspace
- authentication
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Access and data control / Less secure apps (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Security > Access and data control > Less secure apps: confirm ''Disable access to less secure apps [Recommended]'' for the top-level OU. If the setting is no longer shown, Google has retired LSA for the tenant; confirm instead under Apps > Google Workspace > Gmail > End User Access that POP and IMAP access are disabled unless required.'
remediation:
  type: iac_patch
  command: 'Admin console: Security > Access and data control > Less secure apps > Disable access to less secure apps.'
