id: TMA-GWS-GMAIL-AUTO-FORWARD
title: Ensure users cannot automatically forward mail externally
description: Automatic forwarding is a common exfiltration technique after account compromise. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- gmail
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Gmail / Automatic forwarding (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Apps > Google Workspace > Gmail > End User Access > Automatic forwarding: confirm ''Allow users to automatically forward incoming email to another address'' is unchecked for the top-level OU [exceptions only for specific OUs]. Also review Gmail > Compliance routing rules for external forwards.'
remediation:
  type: iac_patch
  command: 'Admin console: Gmail > End User Access > Automatic forwarding: uncheck ''Allow users to automatically forward incoming email to another address''.'
