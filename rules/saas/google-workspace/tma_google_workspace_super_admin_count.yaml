id: TMA-GWS-SUPER-ADMIN-COUNT
title: Ensure between two and four super administrators exist
description: Super admins have unrestricted control; too few risks lock-out, too many widens the attack surface. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: high
tags:
- google-workspace
- admin-roles
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Administrator roles / Super admin accounts (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Account > Admin roles > Super Admin > Admins: confirm 2 to 4 accounts are assigned, each a dedicated admin account [not used for daily email], and that other administrators hold least-privilege custom roles instead.'
remediation:
  type: iac_patch
  command: 'Admin console: Remove the Super Admin role from excess accounts and assign scoped prebuilt or custom admin roles.'
