id: TMA-GWS-API-ACCESS-CONTROL
title: Ensure third-party app access to Google data is restricted
description: Unreviewed OAuth apps can obtain persistent access to Gmail and Drive data. Admin console only; reported as manual.
target: google-workspace
level: 2
severity: high
tags:
- google-workspace
- api-controls
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Access and data control / API controls (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Security > Access and data control > API controls: confirm ''Settings'' blocks or limits access to unconfigured third-party apps [e.g. ''Allow users to access third-party apps that only request basic info needed for Sign in with Google''], review App access control > Manage Third-Party App Access for Trusted/Limited/Blocked entries, and confirm Google services such as Gmail and Drive are Restricted. Also check Apps > Google Workspace Marketplace apps > Settings allows only allowlisted apps.'
remediation:
  type: iac_patch
  command: 'Admin console: API controls > App access control: mark required apps as Trusted, restrict high-risk Google services, and block unconfigured third-party apps.'
