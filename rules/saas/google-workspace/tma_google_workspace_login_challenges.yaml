id: TMA-GWS-LOGIN-CHALLENGES
title: Ensure post-SSO verification and login challenges are enabled
description: Login challenges add a risk-based verification step for suspicious sign-ins, including those through a third-party IdP. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: medium
tags:
- google-workspace
- authentication
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Authentication / Login challenges (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Security > Authentication > Login challenges: confirm ''Post-SSO verification'' is set so that users signing in via a third-party IdP get additional verifications when Google detects a suspicious login, and that the employee ID challenge is configured if used. Review Security > Alert center for suspicious login alerts.'
remediation:
  type: iac_patch
  command: 'Admin console: Security > Authentication > Login challenges > Post-SSO verification: ask users for additional verifications from Google if a login looks suspicious.'
