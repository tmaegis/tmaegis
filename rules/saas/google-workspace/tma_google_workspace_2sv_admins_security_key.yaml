id: TMA-GWS-ADMIN-SECURITY-KEY
title: Ensure super administrators use hardware security keys for 2-Step Verification
description: Phishing-resistant keys protect the accounts that control the whole tenant. Admin console only; reported as manual.
target: google-workspace
level: 2
severity: high
tags:
- google-workspace
- authentication
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Authentication / 2-Step Verification for administrators (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Security > Authentication > 2-step verification: select the OU [or group] containing admin accounts and confirm Methods = ''Only security key''. Then Reporting > User reports > Security: confirm each super admin shows a security key enrolled.'
remediation:
  type: iac_patch
  command: 'Admin console: Place admin accounts in a dedicated OU/group and set 2-step verification Methods to ''Only security key''.'
