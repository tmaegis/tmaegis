id: TMA-GWS-DRIVE-EXTERNAL-SHARING
title: Ensure Drive external sharing is restricted
description: Unrestricted sharing lets users publish files to anyone with the link or to personal accounts. Admin console only; reported as manual.
target: google-workspace
level: 1
severity: high
tags:
- google-workspace
- sharing
reference: CIS Google Workspace Foundations Benchmark v1.4.0 - Drive and Docs / Sharing settings (verify section number for your release)
audit:
  type: manual
  command: 'Admin console > Apps > Google Workspace > Drive and Docs > Sharing settings > Sharing options [top-level OU]: confirm sharing outside the organization is Off or limited to allowlisted domains; ''Warn when files owned by users ... are shared outside'' is checked; ''Allow users to receive files from users or shared drives outside'' is restricted; and General access default is ''Restricted''. Also review Shared drive creation settings.'
remediation:
  type: iac_patch
  command: 'Admin console: Drive and Docs > Sharing settings > Sharing options: set to allowlisted domains only (or Off) and enable the external sharing warning.'
