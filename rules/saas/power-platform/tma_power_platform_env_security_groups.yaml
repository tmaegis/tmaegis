id: TMA-POWERPLATFORM-ENV-SECURITY-GROUPS
title: Ensure Dataverse environments are restricted to a security group
description: Without a security group, every licensed user in the tenant is added to an environment's Dataverse database. Portal-only setting, so this is a manual review.
target: power-platform
level: 2
severity: medium
tags:
- power-platform
- governance
reference: CIS Microsoft Dynamics 365 Power Platform Benchmark v1.0.1 - Environment security groups (no dedicated CIS benchmark exists for Power Platform)
audit:
  type: manual
  command: 'Power Platform admin center > Manage > Environments > select each production/sandbox environment > Edit > Security group: confirm a Microsoft Entra security group is assigned [not ''None'']. Also review Settings > Users + permissions > Security roles for System Administrator assignments.'
remediation:
  type: iac_patch
  command: Assign a dedicated Microsoft Entra security group to each environment in Power Platform admin center > Environments > Edit > Security group, and remove unneeded System Administrator role assignments.
