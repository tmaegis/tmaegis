id: TMA-POWERPLATFORM-4.3
title: Ensure 'App creation notification is enabled in the environment'
description: '10/07/2026 1.0.1 UPDATE - All Recommendations: Updated CIS Controls mappings and added NIST 800-53r5 and CSF 2.0 12/20/2022 1.0.0 Initial Public Release Alerting on the creation of apps allows for administrators to look for risky apps that users have created that could cause data spillage or accidental elevation of privilege.'
target: power-platform
level: 1
severity: medium
tags:
- power-platform
- saas
reference: CIS Microsoft Dynamics 365 Power Platform Benchmark v1.0.1 - 4.3 Ensure 'App creation notification is enabled in the environment'
audit:
  type: manual
  command: 'Verify that App creation notifications are set to enabled. In the Microsoft 365 Security & Compliance Center: - Log in to the Microsoft 365 Security & Compliance Center https://compliance.microsoft.com/ as a tenant Administrator. - Go to Policies > Alert Policy. - Verify a policy exists for app creation notification.'
remediation:
  type: iac_patch
  command: 'Ensure that App creation notifications are set to enabled. In the Microsoft 365 Security & Compliance Center: - Log in to the Microsoft 365 Security & Compliance Center https://compliance.microsoft.com/ as a tenant Administrator. - Go to Policies > Alert Policy > +New Alert policy. - Name policy and select the Severity and Category for the policy. - In the Activity section scroll down to PowerApps app or search for Publish. - Name the alert and select users (emails) to send alerts to. Ensure that a notification is triggered when a new app is created in the environment.'
