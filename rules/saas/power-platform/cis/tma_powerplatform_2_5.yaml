id: TMA-POWERPLATFORM-2.5
title: Ensure 'Cross-tenant isolation is enabled for Power Platform Apps and Flows'
description: Microsoft Power Platform has a rich ecosystem of connectors based on Azure Active Directory (Azure AD) that allow authorized Azure AD users to build compelling apps and flows establishing connections to the business data available through these data stores. Tenant isolation makes it easy for administrators to ensure that these connectors can be harnessed in a safe and secure way within the tenant while minimizing the risk of data exfiltration outside the tenant. Tenant isolation allows admins to effectively govern the movement of tenant data from Azure AD authorized data sources to and from their tenant. With tenant isolation On, all tenants are restricted. Inbound (connections to the tenant from external tenants) and outbound (connections from the tenant to external tenants) cross-tenant connections are blocked by Power Platform even if the user presents valid credentials to the Azur...
target: power-platform
level: 1
severity: high
tags:
- power-platform
- saas
reference: CIS Microsoft Dynamics 365 Power Platform Benchmark v1.0.1 - 2.5 Ensure 'Cross-tenant isolation is enabled for Power Platform Apps and Flows'
audit:
  type: manual
  command: 'Verify that cross-tenant isolation is enabled. In the Power Platform Admin Center: - Log in to https://admin.powerplatform.microsoft.com and select the appropriate environment. - Select Tenant isolation (preview). - Confirm that tenant isolation is on.'
remediation:
  type: iac_patch
  command: 'Ensure that tenant restrictions for outbound connections are setup: There are two steps to get started with tenant restrictions. First, make sure that clients can connect to the right addresses. Second, configure proxy infrastructure. 1. URLs and IP addresses: a. To use tenant restrictions, clients must be able to connect to the following Azure AD URLs to authenticate: login.microsoftonline.com, login.microsoft.com, and login.windows.net. b. Additionally, to access Office 365, clients must also be able to connect to the fully qualified domain names (FQDNs), URLs, and IP addresses defined in Office 365 URLs and IP address ranges. 2. Proxy configuration and requirements: a. The following configuration is required to enable tenant restrictions through the proxy infrastructure. This guidance is generic, refer to the proxy vendor''s documentation for specific implementation steps. b. Prerequisites: 1. The proxy must be able to perform TLS interception, HTTP header insertion, and filter
    destinations using FQDNs/URLs. 2. Clients must trust the certificate chain presented by the proxy for TLS communications. For example, if certificates from an internal public key infrastructure (PKI) ar...'
