id: TMA-POWERPLATFORM-2.2
title: Ensure 'Security roles provide access to the minimum amount of business data required'
description: Users should only have access to data that they really require access to. Make use of the predefined security roles whenever possible and assure the minimum privileges required for the roles and for the users to perform their activities. Microsoft Dynamics 365 makes use of the Dataverse and role-based security model to help secure the access. It also comes with predefined security roles that can be used for granting user access. If the permission for a predefined role requires customization, copy one that exists and work under the copied role, keeping the integrity of the original role. It is important to apply the least privilege and need-to-know principle when customizing and granting users and roles permissions. Details in the reference links. Limiting the access and permissions for the accounts that needs access to the information, reduces the risk of having users with improper ac...
target: power-platform
level: 1
severity: medium
tags:
- access-control
- iam
- power-platform
- saas
reference: CIS Microsoft Dynamics 365 Power Platform Benchmark v1.0.1 - 2.2 Ensure 'Security roles provide access to the minimum amount of business data required'
audit:
  type: manual
  command: 'Ensure that user access to the environment is controlled with security groups. In the Power Platform Admin Center: 1. Log in to https://admin.powerplatform.microsoft.com and select the appropriate environment. 2. Select Settings. 3. Expand Users + permissions then select Security roles. 4. Analyze the predefined Security Roles to determine which fits the environmental needs. 5. Under the More actions click the 3 dots and select copy to audit the roles.'
remediation:
  type: iac_patch
  command: 'Change user roles to meet environment needs via security groups. In the Power Platform Admin Center: 1. Log in to https://admin.powerplatform.microsoft.com and select the appropriate environment. 2. Select Settings. 3. Expand Users + permissions then select Security roles. 4. Edit the Security Role to fit environmental needs.'
