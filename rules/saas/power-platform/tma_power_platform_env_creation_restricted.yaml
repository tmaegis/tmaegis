id: TMA-POWERPLATFORM-ENV-CREATION
title: Ensure production environment creation is restricted to administrators
description: Unrestricted environment creation leads to unmanaged environments outside DLP and backup governance. Requires Microsoft.PowerApps.Administration.PowerShell and an authenticated session (Add-PowerAppsAccount) as a Power Platform administrator; the audit throws if the module is missing.
target: power-platform
level: 1
severity: medium
tags:
- power-platform
- governance
reference: CIS Microsoft Dynamics 365 Power Platform Benchmark v1.0.1 - Environment creation (no dedicated CIS benchmark exists for Power Platform)
audit:
  type: command
  command: '$ErrorActionPreference = ''Stop''; if (-not (Get-Command Get-TenantSettings -ErrorAction SilentlyContinue)) { throw ''Microsoft.PowerApps.Administration.PowerShell is not loaded: run Add-PowerAppsAccount first'' }; $s = Get-TenantSettings -ErrorAction Stop; if ($s.disableEnvironmentCreationByNonAdminUsers -eq $true) { ''compliant'' } else { ''noncompliant'' }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Power Platform admin center > Settings > Tenant settings > Production environment assignments > Only specific admins (or $s = Get-TenantSettings; $s.disableEnvironmentCreationByNonAdminUsers = $true; Set-TenantSettings -RequestBody $s).
