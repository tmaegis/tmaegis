id: TMA-M365-SECURITY-DEFAULTS-CA
title: Ensure security defaults or Conditional Access policies are enforced
description: 'Tenants must either enable Entra ID security defaults or replace them with enabled Conditional Access policies; with neither, MFA and legacy-auth blocking are not enforced. Requires an already-connected Microsoft Graph session: Install-Module Microsoft.Graph; Connect-MgGraph -Scopes Policy.Read.All,Directory.Read.All,RoleManagement.Read.Directory (read-only scopes). The audit throws if no session exists.'
target: m365
level: 1
severity: critical
tags:
- m365
- identity
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - Microsoft Entra ID / Security defaults and Conditional Access (verify section number for your release)
audit:
  type: command
  command: '$ErrorActionPreference = ''Stop''; if (-not (Get-Command Get-MgContext -ErrorAction SilentlyContinue) -or -not (Get-MgContext)) { throw ''Not connected: run Connect-MgGraph first'' }; $sd = (Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy -ErrorAction Stop).IsEnabled; $ca = @(Get-MgIdentityConditionalAccessPolicy -All -ErrorAction Stop | Where-Object { $_.State -eq ''enabled'' }); if ($sd -eq $true -or $ca.Count -gt 0) { ''compliant'' } else { ''noncompliant'' }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Entra admin center > Identity > Overview > Properties > Manage security defaults > Enabled, or (Entra ID P1) create Conditional Access policies for MFA and legacy authentication blocking and then disable security defaults.
