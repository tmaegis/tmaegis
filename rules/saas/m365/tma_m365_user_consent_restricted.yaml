id: TMA-M365-USER-CONSENT
title: Ensure users cannot consent to applications accessing company data
description: 'Illicit consent grants let malicious OAuth apps read mail and files without a password. Compliant when no self-service permission grant policy (ManagePermissionGrantsForSelf.*) is assigned to the default user role. Requires an already-connected Microsoft Graph session: Install-Module Microsoft.Graph; Connect-MgGraph -Scopes Policy.Read.All,Directory.Read.All,RoleManagement.Read.Directory (read-only scopes). The audit throws if no session exists.'
target: m365
level: 2
severity: high
tags:
- m365
- identity
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - Microsoft Entra ID / Enterprise applications - user consent (verify section number for your release)
audit:
  type: command
  command: '$ErrorActionPreference = ''Stop''; if (-not (Get-Command Get-MgContext -ErrorAction SilentlyContinue) -or -not (Get-MgContext)) { throw ''Not connected: run Connect-MgGraph first'' }; $p = Get-MgPolicyAuthorizationPolicy -ErrorAction Stop; $self = @($p.DefaultUserRolePermissions.PermissionGrantPoliciesAssigned | Where-Object { $_ -like ''ManagePermissionGrantsForSelf.*'' }); if ($self.Count -eq 0) { ''compliant'' } else { ''noncompliant'' }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Entra admin center > Enterprise applications > Consent and permissions > User consent settings > Do not allow user consent, and enable the admin consent workflow.
