id: TMA-M365-7.2.11
title: Ensure the SharePoint default sharing link permission is set
description: This setting configures the permission that is selected by default for sharing link from a SharePoint site. The recommended state is View. Setting the view permission as the default ensures that users must deliberately select the edit permission when sharing a link. This approach reduces the risk of unintentionally granting edit privileges to a resource that only requires read access, supporting the principle of least privilege.
target: m365
level: 1
severity: medium
tags:
- access-control
- m365
- saas
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - 7.2.11 Ensure the SharePoint default sharing link permission is set
audit:
  type: manual
  command: 'To audit using the UI: 1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint 2. Expand Policies > Sharing. 3. Scroll to File and folder links. 4. Verify that Choose the permission that''s selected by default for sharing links is set to View. To audit using PowerShell: 1. Connect to SharePoint Online service using Connect-SPOService. 2. Run the following cmdlet: Get-SPOTenant | fl DefaultLinkPermission 3. Verify that the returned value is View.'
remediation:
  type: iac_patch
  command: 'To remediate using the UI: 1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint 2. Expand Policies > Sharing. 3. Scroll to File and folder links. 4. Set Choose the permission that''s selected by default for sharing links to View. To remediate using PowerShell: 1. Connect to SharePoint Online service using Connect-SPOService. 2. Run the following cmdlet: Set-SPOTenant -DefaultLinkPermission View'
