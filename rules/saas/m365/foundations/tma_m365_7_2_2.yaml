id: TMA-M365-7.2.2
title: Ensure SharePoint and OneDrive integration with Azure AD B2B is enabled
description: 'Entra ID B2B provides authentication and management of guests. Authentication happens via one-time passcode when they don''t already have a work or school account or a Microsoft account. Integration with SharePoint and OneDrive allows for more granular control of how guest user accounts are managed in the organization''s AAD, unifying a similar guest experience already deployed in other Microsoft 365 services such as Teams. Note: Global Reader role currently can''t access SharePoint using PowerShell. External users assigned guest accounts will be subject to Entra ID access policies, such as multi-factor authentication. This provides a way to manage guest identities and control access to SharePoint and OneDrive resources. Without this integration, files can be shared without account registration, making it more challenging to audit and manage who has access to the organization''s data.'
target: m365
level: 1
severity: medium
tags:
- m365
- saas
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - 7.2.2 Ensure SharePoint and OneDrive integration with Azure AD B2B is enabled
audit:
  type: manual
  command: 'To audit using PowerShell: 1. Connect to SharePoint Online using Connect-SPOService 2. Run the following command: Get-SPOTenant | ft EnableAzureADB2BIntegration 3. Verify that the returned value is True.'
remediation:
  type: iac_patch
  command: 'To remediate using PowerShell: 1. Connect to SharePoint Online using Connect-SPOService 2. Run the following command: Set-SPOTenant -EnableAzureADB2BIntegration $true'
