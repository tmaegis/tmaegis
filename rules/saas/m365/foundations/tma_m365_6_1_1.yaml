id: TMA-M365-6.1.1
title: Ensure 'AuditDisabled' organizationally is set to 'False'
description: 'The value False indicates that mailbox auditing on by default is turned on for the organization. Mailbox auditing on by default in the organization overrides the mailbox auditing settings on individual mailboxes. For example, if mailbox auditing is turned off for a mailbox (the AuditEnabled property on the mailbox is False), the default mailbox actions are still audited for the mailbox, because mailbox auditing on by default is turned on for the organization. Turning off mailbox auditing on by default ($true) has the following results: - Mailbox auditing is turned off for your organization. - From the time you turn off mailbox auditing on by default, no mailbox actions are audited, even if mailbox auditing is enabled on a mailbox (the AuditEnabled property on the mailbox is True). - Mailbox auditing isn''t turned on for new mailboxes and setting the AuditEnabled property on a new or ex...'
target: m365
level: 1
severity: high
tags:
- logging
- m365
- saas
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - 6.1.1 Ensure 'AuditDisabled' organizationally is set to 'False'
audit:
  type: manual
  command: 'To audit using PowerShell: 1. Connect to Exchange Online using Connect-ExchangeOnline. 2. Run the following PowerShell command: Get-OrganizationConfig | Format-List AuditDisabled 3. Verify that AuditDisabled is set to False.'
remediation:
  type: iac_patch
  command: 'To remediate using PowerShell: 1. Connect to Exchange Online using Connect-ExchangeOnline. 2. Run the following PowerShell command: Set-OrganizationConfig -AuditDisabled $false'
