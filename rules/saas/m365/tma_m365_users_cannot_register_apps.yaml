id: TMA-M365-APP-REGISTRATION
title: Ensure third-party integrated applications cannot be registered by users
description: 'Allowing every user to register applications enables persistence and phishing through attacker-controlled app registrations. Requires an already-connected Microsoft Graph session: Install-Module Microsoft.Graph; Connect-MgGraph -Scopes Policy.Read.All,Directory.Read.All,RoleManagement.Read.Directory (read-only scopes). The audit throws if no session exists.'
target: m365
level: 1
severity: medium
tags:
- m365
- identity
reference: CIS Microsoft 365 Foundations Benchmark v7.0.0 - Microsoft Entra ID / Users can register applications (verify section number for your release)
audit:
  type: command
  command: '$ErrorActionPreference = ''Stop''; if (-not (Get-Command Get-MgContext -ErrorAction SilentlyContinue) -or -not (Get-MgContext)) { throw ''Not connected: run Connect-MgGraph first'' }; $p = Get-MgPolicyAuthorizationPolicy -ErrorAction Stop; if ($p.DefaultUserRolePermissions.AllowedToCreateApps -eq $false) { ''compliant'' } else { ''noncompliant'' }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Entra admin center > Identity > Users > User settings > Users can register applications = No (or Update-MgPolicyAuthorizationPolicy with DefaultUserRolePermissions.AllowedToCreateApps = $false).
