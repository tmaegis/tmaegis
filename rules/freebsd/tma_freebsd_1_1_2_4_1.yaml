id: TMA-FREEBSD-1.1.2.4.1
title: Ensure separate partition exists for /var/tmp
description: 'The /var/tmp directory is a world-writable directory used for temporary storage by all users and some applications. Temporary files residing in /var/tmp are to be preserved between reboots. The reasoning for mounting /var/tmp on a separate partition is as follows. Protection from resource exhaustion The default installation only creates a single / partition. Audit: `mount -p` must list /var/tmp as its own mount point.'
target: freebsd
level: 2
severity: medium
tags:
- freebsd
- hardening
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 1.1.2.4.1 Ensure separate partition exists for /var/tmp
audit:
  type: command
  command: command -v mount >/dev/null 2>&1 || exit 1; l=$(mount -p | awk '$2=="/var/tmp"'); [ -n "$l" ] && echo compliant || echo "/var/tmp is not a separate mount"
  expected_output: compliant
remediation:
  type: iac_patch
  command: For new installations, during installation create a custom partition setup and specify a separate partition for /var/tmp. For systems that were previously installed, create a new partition and configure /etc/fstab as appropriate.
