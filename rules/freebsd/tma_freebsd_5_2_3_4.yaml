id: TMA-FREEBSD-5.2.3.4
title: Ensure discretionary access control permission modification events are collected
description: 'Monitor changes to file permissions, attributes, ownership, and group. The parameters in this section track changes for system calls that affect file permissions and attributes. The following commands and system calls affect the permissions, ownership, and various attributes of files. Monitoring for changes in file attributes could alert a system administrator to activity that could indicate intruder activity or policy violation. Audit: the global flags: line in /etc/security/audit_control must include fm.'
target: freebsd
level: 2
severity: medium
tags:
- freebsd
- permissions
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 5.2.3.4 Ensure discretionary access control permission modification events are collected
audit:
  type: command
  command: l=$(grep "^flags:" /etc/security/audit_control 2>/dev/null) || exit 1; f=",${l#flags:},"; r=compliant; for c in fm; do case "$f" in *,$c,*|*,+$c,*) ;; *) r="flags missing $c";; esac; done; echo "$r"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    f=/etc/security/audit_control
    [ -f "$f" ] || exit 0
    cur=$(grep "^flags:" "$f" | head -n 1); cur=${cur#flags:}
    new=$cur
    for c in fm; do case ",$new," in *,$c,*|*,+$c,*) ;; *) new="${new:+$new,}$c";; esac; done
    [ "$new" = "$cur" ] && exit 0
    tma_bk "$f"
    awk -v n="flags:$new" '/^flags:/ { if (!d) { print n; d=1 }; next } { print } END { if (!d) print n }' "$f" > "$f.tma.$$" && cat "$f.tma.$$" > "$f"
    rm -f "$f.tma.$$"
    audit -s >/dev/null 2>&1 || true
  guidance: "Add the classes fm to the flags: line in /etc/security/audit_control, then run audit -s."
