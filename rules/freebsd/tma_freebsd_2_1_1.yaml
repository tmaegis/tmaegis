id: TMA-FREEBSD-2.1.1
title: Ensure time synchronization is in use
description: 'Synchronize system time between all systems in an environment using a service such as the Network Time Protocol (NTP) daemon, ntpd or chrony which are designed to synchronize system clocks across a variety of systems using a source that is accurate. NTP can be configured to be a client and/or a server. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- hardening
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 2.1.1 Ensure time synchronization is in use
audit:
  type: command
  command: command -v service >/dev/null 2>&1 || exit 1; service ntpd status >/dev/null 2>&1 && echo compliant || echo "ntpd is not running"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    [ -f /etc/ntp.conf ] || printf 'pool 0.freebsd.pool.ntp.org iburst\nrestrict default limited kod nomodify notrap noquery nopeer\nrestrict 127.0.0.1\nrestrict ::1\n' > /etc/ntp.conf
    sysrc ntpd_enable=YES >/dev/null; sysrc ntpd_sync_on_start=YES >/dev/null
    service ntpd start >/dev/null 2>&1 || service ntpd restart >/dev/null 2>&1
    true
  guidance: "sysrc ntpd_enable=\"YES\"; service ntpd start"
