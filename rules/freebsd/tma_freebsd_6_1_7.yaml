id: TMA-FREEBSD-6.1.7
title: Ensure SUID and SGID files are reviewed
description: The owner of a file can set the file's permissions to run with the owner's or group's permissions, even if the user running the program is not the owner or a member of the group. The most common reason for a SUID or SGID program is to enable users to perform functions (such as changing their password) that require root privileges.
target: freebsd
level: 1
severity: high
tags:
- freebsd
- permissions
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 6.1.7 Ensure SUID and SGID files are reviewed
audit:
  type: manual
  command: 'Run the following script to generate a list of SUID and SGID files: #!/bin/sh echo "Generating a list of SUID and SGID files..." # Find SUID files echo "SUID Files:" find / -xdev -type f -perm -4000 -print # Find SGID files echo "SGID Files:" find / -xdev -type f -perm -2000 -print Note: on systems with a large number of files, this may be a long-running process.'
remediation:
  type: iac_patch
  command: Ensure that no rogue SUID or SGID programs have been introduced into the system. Review the files returned by the action in the Audit section and confirm the integrity of these binaries.
