id: TMA-FREEBSD-1.2.3
title: Ensure updates, patches, and additional security software are installed
description: Periodically patches are released for included software either due to security flaws or to include additional functionality. Newer patches may contain security enhancements that would not be available through the latest full update. As a result, it is recommended that the latest software patches be used to take advantage of the latest functionality.
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- services
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 1.2.3 Ensure updates, patches, and additional security software are installed
audit:
  type: manual
  command: 'Run the following command and verify there are no updates or patches to install for the base system: # freebsd-update updatesready If there are updates available it will prompt for installing those updates and if required also ask for rebooting.'
remediation:
  type: iac_patch
  command: 'Use your package manager to update all packages on the system according to site policy. The following command will install all available updates for the base system: # freebsd-update fetch install Once the update process is complete, verify if reboot is required to load changes or not. The system will prompt for reboot. The following command will install all available updates for the third party softwares: # pkg update # pkg upgrade'
