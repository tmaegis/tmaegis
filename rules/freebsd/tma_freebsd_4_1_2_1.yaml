id: TMA-FREEBSD-4.1.2.1
title: Ensure at is restricted to authorized users
description: 'The at utility allows some moderately complex time specifications. It accepts times of the form HHMM or HH:MM to run a job at a specific time of day. On many systems, only the system administrator is authorized to schedule at jobs. Using the at.allow file to control who can run at jobs enforces this policy. It is easier to manage an allow list than a deny list. Audit: /var/at/at.allow must exist with mode 640 or stricter, owner root or daemon, group wheel; at.deny must be absent or equally restricted.'
target: freebsd
level: 1
severity: high
tags:
- freebsd
- accounts
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 4.1.2.1 Ensure at is restricted to authorized users
audit:
  type: command
  command: 'r=compliant; for f in /var/at/at.allow; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root|daemon'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else r="$f: missing"; fi; done; for f in /var/at/at.deny; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root|daemon'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else :; fi; done; echo "$r"'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    for f in /var/at/at.allow; do
      case "$f" in /var/at/at.allow) [ -e "$f" ] || { echo root > "$f"; };; esac
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|daemon|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/at/at.deny; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|daemon|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
  guidance: "Run the following script to: /var/at/at.allow: o Create the file if it doesn't exist o Change owner or user root or daemon o Change group to wheel o Change mode to 640 or more restrictive -IF- /var/at/at.deny exists: o Change owner or user root o Change group to wheel o Change mode to 640 or more restrictive #!/bin/sh { [ ! -e \"/var/at/at.allow\" ] && touch /var/at/at.allow chown root:wheel /var/at/at.allow chmod u-x,g-wx,o-rwx /var/at/at.allow [ -e \"/var/at/at.deny\" ] && chown root:wheel /var/at/at.deny [ -e \"/var/at/at.deny\" ] && chmod u-x,g-wx,o-rwx /var/at/at.deny }"
