id: TMA-FREEBSD-1.3.1
title: Ensure bootloader password is set
description: 'Setting the boot loader password will require that anyone rebooting the system must enter a password before being able to set command line boot parameters. Requiring a boot password upon execution of the boot loader will prevent an unauthorized user from entering boot parameters or changing the boot partition. This prevents users from weakening security (e.g. reducing kernel security level at boot time). Audit: a password= line must be present in /boot/loader.conf (it is stored in plain text).'
target: freebsd
level: 1
severity: high
tags:
- freebsd
- password-policy
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 1.3.1 Ensure bootloader password is set
audit:
  type: file_regex
  file_path: /boot/loader.conf
  pattern: (?m)^\s*password\s*=\s*"?\S
remediation:
  type: iac_patch
  command: 'Add password to the /boot/loader.conf file by having an entry like the following: password=Jmklvqqq8MCqg91L'
