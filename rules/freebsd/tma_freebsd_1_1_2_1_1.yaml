id: TMA-FREEBSD-1.1.2.1.1
title: Ensure /tmp is a separate partition
description: 'The /tmp directory is a world-writable directory used for temporary storage by all users and some applications. /tmp can be configured to use tmpfs. tmpfs puts everything into the kernel internal caches and grows and shrinks to accommodate the files it contains and is able to swap unneeded pages out to swap space. Audit: `mount -p` must list /tmp as its own mount point.'
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- hardening
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 1.1.2.1.1 Ensure /tmp is a separate partition
audit:
  type: command
  command: command -v mount >/dev/null 2>&1 || exit 1; l=$(mount -p | awk '$2=="/tmp"'); [ -n "$l" ] && echo compliant || echo "/tmp is not a separate mount"
  expected_output: compliant
remediation:
  type: iac_patch
  command: '-If- tmpfs is being used First ensure that system will create a tmpfs file system at startup. # sysrc tmpmfs="YES" # sysrc tmpsize="2g" For specific configuration requirements of the /tmp mount for your environment, modify /etc/fstab rather than utilizing sysrc. Example of using tmpfs with specific mount options: tmpfs /tmp tmpfs rw,nosuid,noatime,size=2g 0 0 Note: the size=2g is an example of setting a specific size for tmpfs. Example of using a volume or disk with specific mount options. The source location of the volume or disk will vary depending on your environment: <device> /tmp <fstype> rw,nosuid,noatime 0 0'
