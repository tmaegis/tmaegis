id: TMA-FREEBSD-5.1.3
title: Ensure all logfiles have appropriate access configured
description: 'Log files stored in /var/log/ contain logged information from many services on the system and potentially from other logged hosts as well. Log files must have the correct permissions to ensure that sensitive data is protected and that only the appropriate users/groups have access to them. Audit: each CIS-listed log file in /var/log must be mode 640 or stricter and owned by root:wheel (absent files are skipped).'
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- permissions
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 5.1.3 Ensure all logfiles have appropriate access configured
audit:
  type: command
  command: 'r=compliant; for f in /var/log/messages; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else :; fi; done; for f in /var/log/cron; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else :; fi; done; for f in /var/log/auth.log; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root'' -v g=''wheel'' ''{ok=1;
    for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else :; fi; done; for f in /var/log/maillog; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else :; fi; done; for f in /var/log/xferlog; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r-----'' -v o=''root'' -v g=''wheel'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ]
