    done
    for f in /var/log/xferlog; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/log/debug.log; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/log/console.log; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/log/dmesg; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/log/security; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
    for f in /var/log/all.log; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-rwx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|wheel|" in *"|$x|"*) ;; *) chgrp wheel "$f";; esac
    done
  guidance: "Run the following script to update permissions and ownership on files in /var/log. Although the script is not destructive, ensure that the output is captured if the remediation causes issues. #!/bin/sh # Define the list of log files, their expected permissions, user, and group log_files=\" /var/log/messages:640:root:wheel /var/log/cron:640:root:wheel /var/log/auth.log:640:root:wheel /var/log/maillog:640:root:wheel /var/log/xferlog:640:root:wheel /var/log/debug.log:640:root:wheel /var/log/console.log:640:root:wheel /var/log/dmesg:640:root:wheel /var/log/security:640:root:wheel /var/log/all.log:640:root:wheel \" # Iterate over each log file, its expected permissions, user, and group echo \"$log_files\" | while IFS=: read -r file expected_perms expected_user expected_group; do if [ -f \"$file\" ]; then # Get current permissions, user, and group of the file current_perms=$(stat -f \"%Lp\" \"$file\") current_user=$(stat -f \"%Su\" \"$file\") current_group=$(stat -f \"%Sg\" \"$file\") # Check if permissions are correct if [ \"$current_perms\" -ne \"$expected_perms\" ]; then echo \"Fixing permissions for $file from $current_perms to $expected_perms\" chmod \"$expected_perms\" \"$file\" ... (see CIS section 5.1.3)"
