id: TMA-FREEBSD-3.1.1
title: Ensure IPv6 status is identified
description: Internet Protocol Version 6 (IPv6) is the most recent version of Internet Protocol (IP). It's designed to supply IP addressing and additional security to support the predicted growth of connected devices. IPv6 is based on 128-bit addressing and can support 340 undecillion, which is 340,282,366,920,938,463,463,374,607,431,768,211,456 unique addresses.
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- network
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 3.1.1 Ensure IPv6 status is identified
audit:
  type: manual
  command: 'Run the following to identify if IPv6 is enabled on the system: # [ $(sysctl -nq kern.features.inet6) -eq 1 ] && printf "IPv6 is enabled\n" || printf "IPv6 is not enabled\n"'
remediation:
  type: iac_patch
  command: Enable or disable IPv6 in accordance with system requirements and local site policy
