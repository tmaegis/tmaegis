id: TMA-FREEBSD-2.2.2
title: Ensure ftp server services are not in use
description: 'FTP (File Transfer Protocol) is a traditional and widely used standard tool for transferring files between a server and clients over a network, especially where no authentication is necessary (permits anonymous users to connect to a server). FreeBSD ships with one basic ftpd in the base system and there is also the famous vsftpd available through package. Audit: ftp must not be enabled in /etc/inetd.conf and vsftpd must be absent or not enabled.'
target: freebsd
level: 1
severity: high
tags:
- freebsd
- network
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 2.2.2 Ensure ftp server services are not in use
audit:
  type: command
  command: command -v pkg >/dev/null 2>&1 || exit 1; command -v sysrc >/dev/null 2>&1 || exit 1; r=compliant; grep -Eq "^ftp[[:space:]]" /etc/inetd.conf 2>/dev/null && r="ftp enabled in /etc/inetd.conf"; if [ -n "$(pkg query -g %n 'vsftpd*' 2>/dev/null)" ]; then v=$(sysrc -q -n vsftpd_enable 2>/dev/null); case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) r="vsftpd_enable=$v";; esac; fi; echo "$r"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    tma_comment /etc/inetd.conf '^ftp[[:space:]]'
    service inetd status >/dev/null 2>&1 && service inetd reload >/dev/null 2>&1
    v=$(sysrc -q -n vsftpd_enable 2>/dev/null)
    case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) sysrc vsftpd_enable=NO >/dev/null; service vsftpd onestop >/dev/null 2>&1;; esac
    true
  guidance: "Run the following commands to stop vsftpd / vsftpd6 and remove vsftpd packages: # service onestop vsftpd # service onestop vsftpd6 # pkg remove -g 'vsftpd*' -OR- -IF- the packages is required as a dependency: Run the following commands to stop and disable the vsftpd or vsftpd6 service: # service vsftpd onestop # service vsftpd6 onestop # service vsftpd onedisable # service vsftpd6 onedisable Note: Other ftp server packages may exist. If not required and authorized by local site policy, they should also be removed. If the package is required for a dependency, the service should be stopped and disabled."
