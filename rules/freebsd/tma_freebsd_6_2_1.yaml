id: TMA-FREEBSD-6.2.1
title: Ensure accounts in /etc/master.passwd use shadowed passwords
description: Local accounts can use shadowed passwords. These passwords are saved in a shadow password file, /etc/master.passwd, encrypted by a salted one-way hash. Accounts with a shadowed password have an x in the second field in /etc/passwd. The /etc/passwd file also contains information like user ID's and group ID's that are used by many system programs. Therefore, the /etc/passwd file must remain world- readable.
target: freebsd
level: 1
severity: high
tags:
- freebsd
- password-policy
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 6.2.1 Ensure accounts in /etc/master.passwd use shadowed passwords
audit:
  type: manual
  command: 'Run the following command and verify that no output is returned: # awk -F: ''($2 == "*" ) { print $1 " is not set to shadowed passwords "}'' /etc/master.passwd'
remediation:
  type: iac_patch
  command: Investigate to determine if the account is logged in, what it is being used for, and whether it needs to be forced off.
