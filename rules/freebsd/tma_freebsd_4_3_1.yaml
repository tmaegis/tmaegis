id: TMA-FREEBSD-4.3.1
title: Ensure sudo is installed
description: 'sudo allows a permitted user to execute a command as the superuser or another user, as specified by the security policy. The invoking user''s real (not effective) user ID is used to determine the user name with which to query the security policy. sudo supports a plug-in architecture for security policies and input/output logging. Third parties can develop and distribute their own policy and I/O logging plug-ins to work seamlessly with the sudo front end. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: freebsd
level: 1
severity: high
tags:
- freebsd
- services
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 4.3.1 Ensure sudo is installed
audit:
  type: command
  command: command -v pkg >/dev/null 2>&1 || exit 1; pkg info -e sudo && echo compliant || echo "sudo is not installed"
  expected_output: compliant
remediation:
  type: iac_patch
  command: pkg install sudo
