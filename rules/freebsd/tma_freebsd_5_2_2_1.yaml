id: TMA-FREEBSD-5.2.2.1
title: Ensure audit log storage size is configured
description: Configure the maximum size of the audit log file. Once the log reaches the maximum size, it will be rotated and a new log file will be started. An appropriate size must be determined for log files so that they do not impact the system and audit data is not lost.
target: freebsd
level: 2
severity: medium
tags:
- freebsd
- audit
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 5.2.2.1 Ensure audit log storage size is configured
audit:
  type: manual
  command: 'Run the following command and ensure the output complies with site policy: # grep "^filesz:" /etc/security/audit_control filesz:2M'
remediation:
  type: iac_patch
  command: 'Set the following parameter in /etc/security/audit_control by site policy: filesz:2M'
