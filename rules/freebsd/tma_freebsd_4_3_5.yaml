id: TMA-FREEBSD-4.3.5
title: Ensure re-authentication for privilege escalation is not disabled globally
description: 'The operating system must be configured so that users must re-authenticate for privilege escalation. Without re-authentication, users may access resources or perform tasks for which they do not have authorization. When operating systems provide the capability to escalate a functional capability, it is critical the user re-authenticate. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: freebsd
level: 1
severity: high
tags:
- freebsd
- hardening
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 4.3.5 Ensure re-authentication for privilege escalation is not disabled globally
audit:
  type: command
  command: c=$(cat /usr/local/etc/sudoers /usr/local/etc/sudoers.d/* 2>/dev/null); [ -n "$c" ] || exit 1; printf '%s\n' "$c" | grep -E "^[^#].*!authenticate" | head -n 5 | grep . || echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: Configure the operating system to require users to reauthenticate for privilege escalation. Based on the outcome of the audit procedure, use visudo -f <PATH TO FILE> to edit the relevant sudoers file. Remove any occurrences of !authenticate tags in the file(s).
