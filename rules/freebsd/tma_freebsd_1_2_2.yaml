id: TMA-FREEBSD-1.2.2
title: Ensure package manager repositories are configured
description: Systems need to have the respective package manager repositories configured to ensure that the system is able to receive the latest patches and updates. If a system's package repositories are misconfigured, important patches may not be identified or a rogue repository could introduce compromised software.
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- hardening
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 1.2.2 Ensure package manager repositories are configured
audit:
  type: manual
  command: 'Run the following command to verify repositories are configured correctly. The output may vary depending on which repositories are currently configured on the system. Example: # pkg -vv | sed ''1, /^Repositories/d'' FreeBSD: { url : "pkg+http://pkg.FreeBSD.org/FreeBSD:14:amd64/latest", enabled : no, priority : 0, mirror_type : "SRV", signature_type : "FINGERPRINTS", fingerprints : "/usr/share/keys/pkg" } For the repositories in use, inspect the configuration file to ensure all settings are correctly applied according to site policy. Example: Depending on ... (full steps: CIS section 1.2.2)'
remediation:
  type: iac_patch
  command: Configure your package manager repositories according to site policy.
