id: TMA-FREEBSD-2.2.3
title: Ensure message access server services are not in use
description: 'The dovecot and cyrus-imapd services are open source IMAP and POP3 server packages. Unless POP3 and/or IMAP servers are to be provided by this system, it is recommended that the package be removed to reduce the potential attack surface. Note: Several IMAP/POP3 servers exist and can use other service names. Audit: the package must not be installed, or (when required as a dependency) its rc.conf service must not be enabled.'
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- services
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 2.2.3 Ensure message access server services are not in use
audit:
  type: command
  command: command -v pkg >/dev/null 2>&1 || exit 1; command -v sysrc >/dev/null 2>&1 || exit 1; inst=""; for p in 'dovecot*' 'cyrus-imapd*'; do q=$(pkg query -g %n "$p" 2>/dev/null); [ -n "$q" ] && inst="$inst $q"; done; [ -z "$inst" ] && { echo compliant; exit 0; }; r=compliant; for k in dovecot_enable cyrus_imapd_enable; do v=$(sysrc -q -n $k 2>/dev/null); case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) r="installed:$inst; $k=$v";; esac; done; echo "$r"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    tma_rc_off() {
      v=$(sysrc -q -n "$1" 2>/dev/null)
      case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) sysrc "$1=NO" >/dev/null; for s in $2; do service "$s" onestop >/dev/null 2>&1; done;; esac
      return 0
    }
    tma_rc_off dovecot_enable "dovecot"
    tma_rc_off cyrus_imapd_enable "imapd"
  guidance: "Run the following commands to stop dovecot and cyrus_imapd, and remove dovecot and cyrus-imapd packages: # service dovecot onestop # service cyrus_imapd onestop # pkg remove -g 'dovecot*' 'cyrus-imap*' -OR- -IF- a package is installed and is required for dependencies: Run the following commands to stop and disable dovecot and cyrus_imapd: # service dovecot onestop # service cyrus_imapd onestop # service dovecot onedisable # service cyrus_imapd onedisable"
