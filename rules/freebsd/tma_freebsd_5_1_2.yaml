id: TMA-FREEBSD-5.1.2
title: Ensure newsyslog is configured
description: The system includes the capability of rotating log files regularly to avoid filling up the system with logs or making the logs unmanageably large. The files /etc/newsyslog.conf, /etc/newsyslog.conf.d/*.conf and /usr/local/etc/newsyslog.conf.d/*.conf is the configuration file used to rotate log files created by syslog.
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- audit
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 5.1.2 Ensure newsyslog is configured
audit:
  type: manual
  command: Review /etc/newsyslog.conf, /etc/newsyslog.conf.d/*.conf and /usr/local/etc/newsyslog.conf.d/*.conf and verify logs are rotated according to site policy.
remediation:
  type: iac_patch
  command: Edit /etc/newsyslog.conf, /etc/newsyslog.conf.d/*.conf and /usr/local/etc/newsyslog.conf.d/*.conf to ensure logs are rotated according to site policy.
