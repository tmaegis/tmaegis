id: TMA-FREEBSD-3.3.1
title: Ensure ip forwarding is disabled
description: 'The net.inet.ip.forwarding and net.inet6.ip.forwarding flags tell the system whether it can forward packets. In FreeBSD, there are also two other services, mainly gateway and ipv6_gateway, that enable the same behind the scenes. Setting net.inet.ip.forwarding and net.inet6.ip.forwarding to 0 ensures that a system with multiple interfaces (for example, a hard proxy), will never be able to forward packets, and therefore, never serve as a router. Audit: running kernel values (sysctl -n) must be net.inet.ip.forwarding=0, net.inet6.ip6.forwarding=0 (IPv6 keys are skipped when IPv6 is not compiled in); confirm they are persisted in /etc/sysctl.conf. gateway_enable and ipv6_gateway_enable must not be YES.'
target: freebsd
level: 1
severity: medium
tags:
- freebsd
- network
reference: CIS FreeBSD 14 Benchmark v1.0.1 - 3.3.1 Ensure ip forwarding is disabled
audit:
  type: command
  command: command -v sysctl >/dev/null 2>&1 || exit 1; r=compliant; v=$(sysctl -nq net.inet.ip.forwarding 2>/dev/null); [ "$v" = 0 ] || r="net.inet.ip.forwarding=$v"; v=$(sysctl -nq net.inet6.ip6.forwarding 2>/dev/null); [ -z "$v" ] || [ "$v" = 0 ] || r="net.inet6.ip6.forwarding=$v"; for k in gateway_enable ipv6_gateway_enable; do v=$(sysrc -q -n $k 2>/dev/null); case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) r="$k=$v";; esac; done; echo "$r"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    tma_sysctl() {
      n=$1; v=$2; opt=$3
      cur=$(sysctl -nq "$n" 2>/dev/null)
      if [ -z "$cur" ]; then [ "$opt" = 1 ] || echo "sysctl $n not available" >&2; return 0; fi
      sysctl "$n=$v" >/dev/null 2>&1 || echo "could not set $n" >&2
      tma_setkv /etc/sysctl.conf "$n" "$v"
    }
    tma_sysctl net.inet.ip.forwarding 0 0
    tma_sysctl net.inet6.ip6.forwarding 0 1

    tma_rc_off() {
      v=$(sysrc -q -n "$1" 2>/dev/null)
      case "$v" in [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) sysrc "$1=NO" >/dev/null; for s in $2; do service "$s" onestop >/dev/null 2>&1; done;; esac
      return 0
    }
    tma_rc_off gateway_enable "gateway"
    tma_rc_off ipv6_gateway_enable "ipv6_gateway"
  guidance: "Set net.inet.ip.forwarding=0, net.inet6.ip6.forwarding=0 in /etc/sysctl.conf (or a file under /etc/sysctl.conf.d) and apply with: sysctl net.inet.ip.forwarding=0; sysctl net.inet6.ip6.forwarding=0"
