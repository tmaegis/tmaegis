id: TMA-INTUNE-MACOS-2.8.30
title: Ensure "Allow Diagnostic Submission" is set to "False"
description: macOS devices collect and send diagnostic and usage data to Apple to help improve their products and services. This feature includes Mac Analytics, Siri & Dictation improvements, and app developer sharing. When enabled, the device automatically submits diagnostic information. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.30 Ensure "Allow Diagnostic Submission" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Diagnostic Submission is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Diagnostic Submission is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Diagnostic Submission; On the left side of the page set Allow Diagnostic Submission to False; Verify that Allow Diagnostic Submission is present and set to False'
