id: TMA-INTUNE-MACOS-2.10.2.1
title: Ensure "Download" is set to "AlwaysOn"
description: The "Download" setting controls whether a managed macOS device retrieves software updates in the background. When set to "AlwaysOn", the system automatically downloads available update packages without requiring user initiation. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.10.2.1 Ensure "Download" is set to "AlwaysOn"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Software Update Settings subheading; Under Automatic Actions; Verify that Download is present and set to AlwaysOn. On the device: Double-click Management Profile; Under the Device Declarations section; Click Software Update Settings; Confirm Download is set to On'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Software Update Settings; Expand Automatic Actions; Check Download; On the left side of the page set Download to AlwaysOn; Verify that Download is present and set to AlwaysOn'
