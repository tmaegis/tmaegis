id: TMA-INTUNE-MACOS-2.9.1.5
title: Ensure "Passcode Reuse Limit" is set to "24" or more
description: The Passcode Reuse Limit setting enforces uniqueness requirements by maintaining a record of previously used passcodes. When set to 24, users must create a passcode that differs from their last 24 used passcodes. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.5 Ensure "Passcode Reuse Limit" is set to "24" or more
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Passcode Reuse Limit is present and set to 24 or more. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Unique passcode requirement is set to 24 or more'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Passcode Reuse Limit; On the left side of the page set Passcode Reuse Limit to 24 or more; Verify that Passcode Reuse Limit is present and set to 24 or more'
