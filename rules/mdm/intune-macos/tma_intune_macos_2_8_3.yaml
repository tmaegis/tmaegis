id: TMA-INTUNE-MACOS-2.8.3
title: Ensure "Allow File Sharing Modification" is set to "False"
description: File sharing allows users to share folders and files from their Mac with other users over a network using SMB and other file sharing protocols. The "Allow File Sharing Modification" setting controls whether users can modify the file sharing configuration through System Settings. When this setting is disabled, users cannot enable or disable file sharing services or modify shared folder permissions. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.3 Ensure "Allow File Sharing Modification" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow File Sharing Modification is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow File Sharing Modification is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow File Sharing Modification; On the left side of the page set Allow File Sharing Modification to False; Verify that Allow File Sharing Modification is present and set to False'
