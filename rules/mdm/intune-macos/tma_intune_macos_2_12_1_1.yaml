id: TMA-INTUNE-MACOS-2.12.1.1
title: Ensure "Enable XProtect Malware Upload" is set to "Disabled"
description: XProtect Malware Upload is a feature that allows Gatekeeper to upload suspicious files to Apple's servers for analysis when malware is detected. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.12.1.1 Ensure "Enable XProtect Malware Upload" is set to "Disabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Policy Control heading; Under the System Policy Control subheading; Verify that Enable XProtect Malware Upload is present and set to Disabled. On the device: Double-click com.apple.systempolicy.control Profile; Under the Details section; Confirm XProtect Malware Upload is set to Disallow'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Policy Control then System Policy Control; Check Enable XProtect Malware Upload; On the left side of the page set Enable XProtect Malware Upload to Disabled; Verify that Enable XProtect Malware Upload is present and set to Disabled'
