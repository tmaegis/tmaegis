id: TMA-INTUNE-MACOS-2.8.39
title: Ensure "Allow Cloud Keychain Sync" is set to "False"
description: iCloud Keychain is a feature that synchronizes passwords, credit card information, WiFi network information, and other sensitive credentials across all of a user's Apple devices. When enabled, this data is encrypted and stored in iCloud. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.39 Ensure "Allow Cloud Keychain Sync" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Keychain Sync is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Keychain Sync is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Keychain Sync; On the left side of the page set Allow Cloud Keychain Sync to False; Verify that Allow Cloud Keychain Sync is present and set to False'
