id: TMA-INTUNE-MACOS-2.8.33
title: Ensure "Allow iPhone Mirroring" is set to "False"
description: Phone Mirroring is part of Apple's Continuity features that allows macOS devices to access iPhone functionality. When enabled, users can make and receive phone calls, send and receive SMS messages, and use their iPhone's cellular connection from their Mac. This feature requires devices to be signed into the same Apple ID and connected to the same WiFi network or in Bluetooth range. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.33 Ensure "Allow iPhone Mirroring" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow iPhone Mirroring is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow iPhone Mirroring is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow iPhone Mirroring; On the left side of the page set Allow iPhone Mirroring to False; Verify that Allow iPhone Mirroring is present and set to False'
