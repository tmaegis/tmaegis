id: TMA-INTUNE-MACOS-2.14.1.2
title: Ensure "Enabled" is set to "Disabled"
description: This setting controls whether Apple Intelligence is permitted to interface with third-party generative AI tools. While Apple relies on Private Cloud Compute (PCC) for its native cloud processing, third-party integrations require the transmission of data to external services. Relying on external integrations places trust in a third party's security posture and privacy agreements, introducing additional risk to corporate data. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.1.2 Ensure "Enabled" is set to "Disabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the External Intelligence Settings subheading; Verify that Enabled is present and set to Disabled. On the device: Double-click Management Profile; Under the Device Declarations section; Click External Intelligence Settings; Confirm Allow Integrations is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then External Intelligence Settings; Check Enabled; On the left side of the page set Enabled to Disabled; Verify that Enabled is present and set to Disabled'
