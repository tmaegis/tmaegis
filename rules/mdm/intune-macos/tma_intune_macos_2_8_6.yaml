id: TMA-INTUNE-MACOS-2.8.6
title: Ensure "Allow Media Sharing Modification" is set to "False"
description: Media Sharing settings in macOS allow users to share downloaded content, including music, movies, TV shows, and photos across Apple devices on the same network. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.6 Ensure "Allow Media Sharing Modification" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Media Sharing Modification is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Media Sharing Modification is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Media Sharing Modification; On the left side of the page set Allow Media Sharing Modification to False; Verify that Allow Media Sharing Modification is present and set to False'
