id: TMA-INTUNE-MACOS-2.9.1.9
title: Ensure "Require Complex Passcode" is set to "True"
description: This setting prevents the use of simple device authentication passcodes on macOS devices by disallowing passcodes that contain two consecutive identical characters or three sequential characters. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.9 Ensure "Require Complex Passcode" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Require Complex Passcode is present and set to True. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Require complex is set to Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Require Complex Passcode; On the left side of the page set Require Complex Passcode to True; Verify that Require Complex Passcode is present and set to True'
