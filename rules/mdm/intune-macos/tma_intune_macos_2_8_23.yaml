id: TMA-INTUNE-MACOS-2.8.23
title: Ensure "Allow Password Auto Fill" is set to "False"
description: Password Auto Fill is a feature in macOS that allows automatic population of stored credentials from iCloud Keychain or third-party password managers into Safari and apps. When enabled, the system retrieves passwords from these sources and offers to automatically fill them into login forms. The feature also suggests generated passwords when creating accounts. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.23 Ensure "Allow Password Auto Fill" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Password Auto Fill is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Password AutoFill is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Password Auto Fill; On the left side of the page set Allow Password Auto Fill to False; Verify that Allow Password Auto Fill is present and set to False'
