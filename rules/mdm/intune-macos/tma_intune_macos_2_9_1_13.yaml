id: TMA-INTUNE-MACOS-2.9.1.13
title: Ensure "Change At Next Auth" is set to "Enabled"
description: The "Change At Next Auth" setting enforces a mandatory password change at the user's next login or screen unlock. This is a one-time trigger, once the user has complied, they will not be prompted again unless a their password expires (if set) or change is subsequently made to the DDM Passcode policy configuration in Intune. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.13 Ensure "Change At Next Auth" is set to "Enabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Change At Next Auth is present and set to Enabled. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Force reset is set to Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Change At Next Auth; On the left side of the page set Change At Next Auth to Enabled; Verify that Change At Next Auth is present and set to Enabled'
