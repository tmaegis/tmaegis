id: TMA-INTUNE-MACOS-2.9.1.7
title: Ensure "Regex" is defined
description: The "Regex" setting enforces password complexity requirements by defining a regular expression pattern with which passwords must comply. When configured, the system evaluates new passwords against this pattern, rejecting those that fail to match. This setting utilizes ICU syntax for pattern matching and can be used to prevent passwords from containing specific words or patterns. The provided regex pattern (?i)^(?!.*(password|cis|example)).* blocks passwords containing defined terms regardless of case sensitivity. Additionally the "Description" setting can be defined within Intune where users are shown a condition when they are setting a password, and if they are complaint or not. ... The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.7 Ensure "Regex" is defined
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Password Content Regex is present and set to (?i)^(?!.*(password|cis|example)).* (with appropriate words being contained within this regular expression). On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Regular Expression is set to (?i)^(?!.*(password|cis|example)).* (with appropriate words being contained within this regular expression)'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Custom Regex; On the left side of the page set Regex to (?i)^(?!.*(password|cis|example)).* substituting and adding words as appropriate; Verify that Regex is present and set to (?i)^(?!.*(password|cis|example)).* (with defined appropriate words being contained within this regular expression)'
