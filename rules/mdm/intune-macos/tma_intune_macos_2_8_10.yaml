id: TMA-INTUNE-MACOS-2.8.10
title: Ensure "Allow Cloud Bookmarks" is set to "False"
description: iCloud Bookmarks is a feature that synchronizes web browser bookmarks and reading list items across Apple devices using Apple's iCloud infrastructure. When enabled, bookmarks created in Safari and other compatible browsers are automatically uploaded to iCloud and made available on all devices signed into the same Apple ID. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.10 Ensure "Allow Cloud Bookmarks" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Bookmarks is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Bookmarks is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Bookmarks; On the left side of the page set Allow Cloud Bookmarks to False; Verify that Allow Cloud Bookmarks is present and set to False'
