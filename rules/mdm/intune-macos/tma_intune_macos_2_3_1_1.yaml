id: TMA-INTUNE-MACOS-2.3.1.1
title: Ensure "User Enters Missing Info" is set to "True"
description: This policy setting ensures that users are prompted to enter any missing user account information during FileVault encryption setup. When enabled, the system will require users to confirm their login credentials if they haven't been properly configured for FileVault access. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.1 Ensure "User Enters Missing Info" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that User Enters Missing Info is present and set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault; Check User Enters Missing Info; On the left side of the page set User Enters Missing Info to True; Verify that User Enters Missing Info is present and set to True'
