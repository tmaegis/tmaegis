id: TMA-INTUNE-MACOS-2.8.2
title: Ensure "Allow Password Sharing" is set to "False"
description: The Password Sharing feature allows users to share passwords with nearby devices using AirDrop. When enabled, macOS users can share saved passwords from their keychain with other Apple devices in proximity. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.2 Ensure "Allow Password Sharing" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Password Sharing is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Password Sharing is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Password Sharing; On the left side of the page set Allow Password Sharing to False; Verify that Allow Password Sharing is present and set to False'
