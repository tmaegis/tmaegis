id: TMA-INTUNE-MACOS-2.8.38
title: Ensure "Allow iTunes File Sharing" is set to "False"
description: iTunes File Sharing allows apps to share files between a Mac and iOS/iPadOS devices through iTunes. When enabled, it permits the transfer of data between macOS and mobile devices using the iTunes interface. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.38 Ensure "Allow iTunes File Sharing" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow iTunes File Sharing is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow File Transfer using Finder or iTunes is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow iTunes File Sharing; On the left side of the page set Allow iTunes File Sharing to False; Verify that Allow iTunes File Sharing is present and set to False'
