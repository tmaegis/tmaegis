id: TMA-INTUNE-MACOS-2.8.32
title: Ensure "Allow Password Proximity Requests" is set to "False"
description: The Allow Password Proximity Requests setting controls whether the macOS device can receive password requests from nearby Apple devices using the same Apple ID. When enabled, the Mac can receive notifications asking to share Keychain passwords with nearby Apple devices when those devices attempt to log into websites or apps. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.32 Ensure "Allow Password Proximity Requests" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Password Proximity Requests is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Password Proximity Requests is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Password Proximity Requests; On the left side of the page set Allow Password Proximity Requests to False; Verify that Allow Password Proximity Requests is present and set to False'
