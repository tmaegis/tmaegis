id: TMA-INTUNE-MACOS-2.3.1.6
title: Ensure "Defer" is set to "Enabled"
description: This policy setting enables deferred FileVault encryption enforcement, triggering setup at the next user authentication event such as a logout, reboot, or shutdown. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.6 Ensure "Defer" is set to "Enabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that Defer is present and set to Enabled. On the device: Double-click FileVault Profile or com.apple.MCX.FileVault2 Profile; Under the Details section; Confirm Defer is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault; Check Defer; On the left side of the page set Defer to Enabled; Verify that Defer is present and set to Enabled'
