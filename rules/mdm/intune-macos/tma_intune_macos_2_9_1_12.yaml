id: TMA-INTUNE-MACOS-2.9.1.12
title: Ensure "Minimum Passcode Length" is set to "15" or more
description: When configured to "15" or more, users must create passcodes that contain at least 15 characters when setting or changing their device passcode. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.12 Ensure "Minimum Passcode Length" is set to "15" or more
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Minimum Passcode Length is present and set to 15 or more. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Minimum length is set to 15 or more'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Minimum Passcode Length; On the left side of the page set Minimum Passcode Length to 15 or more; Verify that Minimum Passcode Length is present and set to 15 or more'
