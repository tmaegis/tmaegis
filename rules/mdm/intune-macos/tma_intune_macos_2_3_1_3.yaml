id: TMA-INTUNE-MACOS-2.3.1.3
title: Ensure "Defer Force At User Login Max Bypass Attempts" is set to "0"
description: This policy setting determines the maximum number of times a user can bypass the FileVault login prompt at startup before encryption is forcefully enabled. Setting this value to "0" ensures users cannot defer or bypass the FileVault encryption requirement. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.3 Ensure "Defer Force At User Login Max Bypass Attempts" is set to "0"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that Defer Force At User Login Max Bypass Attempts is present and set to 0. On the device: Double-click FileVault Profile or com.apple.MCX.FileVault2 Profile; Under the Details section; Confirm Force At User Login Cancel Attempts is set to 0'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault; Check Defer Force At User Login Max Bypass Attempts; On the left side of the page set Defer Force At User Login Max Bypass Attempts to 0; Verify that Defer Force At User Login Max Bypass Attempts is present and set to 0'
