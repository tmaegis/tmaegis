id: TMA-INTUNE-MACOS-2.8.37
title: Ensure "Allow Cloud Desktop And Documents" is set to "False"
description: iCloud Desktop and Documents is a feature that automatically synchronizes the contents of a user's Desktop and Documents folders to iCloud storage. These files are made available across all of the user's Apple devices signed into the same Apple ID. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.37 Ensure "Allow Cloud Desktop And Documents" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Desktop And Documents is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Desktop & Documents is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Desktop And Documents; On the left side of the page set Allow Cloud Desktop And Documents to False; Verify that Allow Cloud Desktop And Documents is present and set to False'
