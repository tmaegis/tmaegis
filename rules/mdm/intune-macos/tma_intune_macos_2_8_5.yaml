id: TMA-INTUNE-MACOS-2.8.5
title: Ensure "Allow Air Play Incoming Requests" is set to "False"
description: AirPlay is an Apple technology that allows wireless streaming of audio, video, and screen sharing between devices. When enabled on macOS, it allows the Mac to receive AirPlay requests and function as an AirPlay receiver, permitting other Apple devices to stream content to the Mac's display. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.5 Ensure "Allow Air Play Incoming Requests" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Air Play Incoming Requests is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow AirPlay Incoming Requests is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Air Play Incoming Requests; On the left side of the page set Allow Air Play Incoming Requests to False; Verify that Allow Air Play Incoming Requests is present and set to False'
