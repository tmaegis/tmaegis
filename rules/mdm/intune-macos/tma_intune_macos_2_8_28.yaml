id: TMA-INTUNE-MACOS-2.8.28
title: Ensure "Allow Printer Sharing Modification" is set to "False"
description: Printer Sharing allows users to share connected printers with other devices on the network. The printer sharing modification setting controls whether users can enable or disable printer sharing through System Settings. When printer sharing is enabled, other devices can discover and connect to printers attached to the Mac. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.28 Ensure "Allow Printer Sharing Modification" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Printer Sharing Modification is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Printer Sharing Modification is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Printer Sharing Modification; On the left side of the page set Allow Printer Sharing Modification to False; Verify that Allow Printer Sharing Modification is present and set to False'
