id: TMA-INTUNE-MACOS-2.11.2.1
title: Ensure "Ask For Password" is set to "True" and "Ask For Password Delay" is absent or set to "0"
description: When enabled, the system will prompt for authentication whenever the screen saver is deactivated. When combined with the "Automatic Device Lock" policy defined in the passcode subsection of the benchmark, this will enforce a device lock when the screen saver is triggered. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.11.2.1 Ensure "Ask For Password" is set to "True" and "Ask For Password Delay" is absent or set to "0"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Configuration heading; Under the Screensaver subheading; Verify that Ask For Password is present and set to True; Verify that Ask For Password Delay is absent or set to 0. On the device: Double-click com.apple.screensaverProfile; Under the Details section; Confirm Ask For Password is set to True; Confirm Ask For Password Delay is absent or set to 0'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Configuration then Screensaver; Check Ask For Password; On the left side of the page set Ask For Password to True (a module name must also be provided); Verify that Ask For Password is present and set to True'
