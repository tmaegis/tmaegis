id: TMA-INTUNE-MACOS-2.7.1
title: Ensure "Removal Password" is absent or is securely configured with restricted access
description: The profile removal password setting in Intune device management controls whether a local user can remove the management profile from a macOS device. When this setting is not configured (absent) or is configured with restricted access, it prevents the unauthorized removal of management profiles that enforce organizational security policies. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.7.1 Ensure "Removal Password" is absent or is securely configured with restricted access
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Profile Removal Password heading (if present); Verify that Removal Password is absent or is securely configured with restricted access. On the device: Verify that com.apple.profileRemovalPassword Profile is absent; If it is visible then ensure it is securely configured with restricted access'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Profile Removal Password; Uncheck/Check Removal Password; If configuring, on the left side of the page set Removal Password to a secure password; Verify that Removal Password is absent or is securely configured'
