id: TMA-INTUNE-MACOS-2.3.1.4
title: Ensure "Show Recovery Key" is set to "Disabled"
description: Users will not be able to view their recovery key through the System Settings interface or during FileVault initialization. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.4 Ensure "Show Recovery Key" is set to "Disabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that Show Recovery Key is present and set to Disabled. On the device: Click Privacy & Security; Under the Security section; Click FileVault; Click Show next to Recovery Key; Ensure this cannot be clicked (grayed out)'
remediation:
  type: iac_patch
  command: Select Full Disk Encryption then FileVault; Check Show Recovery Key; On the left side of the page set Show Recovery Key to Disabled; Verify that Show Recovery Key is present and set to Disabled
