id: TMA-INTUNE-MACOS-2.10.3.2
title: Ensure "Enable Rollback" is set to "False"
description: The "Enable Rollback" setting determines whether users are permitted to revert background security improvements. Setting this value to "False" prevents users from removing previously applied security patches from the device. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.10.3.2 Ensure "Enable Rollback" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Software Update Settings subheading; Under Background Security Improvement Settings; Verify that Enable Rollback is present and set to False. On the device: Double-click Management Profile; Under the Device Declarations section; Click Software Update Settings; Confirm Enable Removal is set to Off'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Software Update Settings; Expand Background Security Improvement Settings; Check Enable Rollback; On the left side of the page set Enable Rollback to False; Verify that Enable Rollback is present and set to False'
