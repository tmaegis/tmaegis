id: TMA-INTUNE-MACOS-2.9.1.6
title: Ensure "Require Passcode on Device" is set to "True"
description: This setting requires users to establish a device passcode (PIN) for device authentication. When enabled, users must create and use a passcode to unlock their device. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.6 Ensure "Require Passcode on Device" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Require Passcode on Device is present and set to True. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Require passcode is set to Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Require Passcode on Device; On the left side of the page set Require Passcode on Device to True; Verify that Require Passcode on Device is present and set to True'
