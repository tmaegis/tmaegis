id: TMA-INTUNE-MACOS-2.11.1.2
title: Ensure "System Sleep Timer" is set to "15" or less, but not 0
description: The "System Sleep Timer" controls the duration of inactivity before system sleep activation. This operates independently from the display sleep timer but requires "Display Sleep Timer" configuration to function consistently. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.11.1.2 Ensure "System Sleep Timer" is set to "15" or less, but not 0
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Configuration heading; Under the Energy Saver subheading; Under Desktop Power; Verify that System Sleep Timer is present and set to 15 or less, but not 0; Under Laptop Battery Power; Verify that System Sleep Timer is present and set to 15 or less, but not 0; Under Laptop Power; Verify that System Sleep Timer is present and set to 15 or less, but not 0. On the device: Double-click com.apple.MCX Profile; Under the Details section; Confirm Desktop Power Settings is set to System Sleep Timer = 15 or Not Applicable For This Computer; ...'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Configuration then Energy Saver; Expand Desktop Power; Check System Sleep Timer; Expand Laptop Battery Power; Check System Sleep Timer; Expand Laptop Power Power; Check System Sleep Timer; On the left side of the page set all instances of System Sleep Timer to 15 or less, but not 0; Verify that System Sleep Timer is present three times and is set to 15 or less, but not 0'
