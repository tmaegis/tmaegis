id: TMA-INTUNE-MACOS-2.14.2.3
title: Ensure "Allow Image Playground" is set to "Blocked"
description: Apple Intelligence Image Playground is an AI-powered feature integrated across the operating system that enables users to generate images by combining concepts, text descriptions, and content from the photo library. This functionality is available via the standalone Image Playground app and is integrated into other applications, such as Messages and Freeform. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.3 Ensure "Allow Image Playground" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Verify that Allow Image Playground is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Allow Image Playground is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Check Allow Image Playground; On the left side of the page set Allow Image Playground to Blocked; Verify that Allow Image Playground is present and set to Blocked'
