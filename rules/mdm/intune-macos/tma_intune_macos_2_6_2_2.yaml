id: TMA-INTUNE-MACOS-2.6.2.2
title: Ensure "Enable Firewall" is set to "True"
description: The macOS firewall protects systems from unwanted network connections by blocking unauthorized incoming connections. When enabled, the firewall analyzes inbound traffic and blocks connections that don't meet the rules defined in the firewall configuration. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.6.2.2 Ensure "Enable Firewall" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Networking heading; Under the Firewall subheading; Verify that Enable Firewall is present and set to True. On the device: Double-click com.apple.security.firewall Profile; Under the Details section; Confirm Firewall is set to Enabled'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Networking then Firewall; Check Enable Firewall; On the left side of the page set Enable Firewall to True; Verify that Enable Firewall is present and set to True'
