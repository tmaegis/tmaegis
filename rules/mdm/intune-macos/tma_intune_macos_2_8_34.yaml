id: TMA-INTUNE-MACOS-2.8.34
title: Ensure "Allow Cloud Mail" is set to "False"
description: iCloud Mail is a cloud-based email service that synchronizes email data across Apple devices using Apple's iCloud infrastructure. When enabled, users can send, receive, and store emails through their iCloud account. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.34 Ensure "Allow Cloud Mail" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Mail is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Mail is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Mail; On the left side of the page set Allow Cloud Mail to False; Verify that Allow Cloud Mail is present and set to False'
