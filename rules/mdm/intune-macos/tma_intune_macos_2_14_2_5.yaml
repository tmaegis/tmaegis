id: TMA-INTUNE-MACOS-2.14.2.5
title: Ensure "Force On Device Only Dictation" is set to "Enabled"
description: macOS offers dictation functionality that can either process speech on-device or send audio data to Apple servers for processing. On-device dictation keeps all speech processing local on the Mac instead of transmitting voice data to Apple's servers. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.5 Ensure "Force On Device Only Dictation" is set to "Enabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Verify that Force On Device Only Dictation is present and set to Enabled. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Force On-Device Only Dictation is set to Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Check Force On Device Only Dictation; On the left side of the page set Force On Device Only Dictation to Enabled; Verify that Force On Device Only Dictation is present and set to Enabled'
