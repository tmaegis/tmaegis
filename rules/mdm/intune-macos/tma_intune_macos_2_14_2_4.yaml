id: TMA-INTUNE-MACOS-2.14.2.4
title: Ensure "Allow Apple Intelligence Report" is set to "Blocked"
description: The Apple Intelligence Report is a feature that allows users to generate a detailed log of requests sent from the Mac to Apple's Private Cloud Compute. This report provides a history of the data, payloads, and prompts that were offloaded by the operating system for processing by cloud-based AI infrastructure. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.4 Ensure "Allow Apple Intelligence Report" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Verify that Allow Apple Intelligence Report is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Allow Apple Intelligence Report is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Check Allow Apple Intelligence Report; On the left side of the page set Allow Apple Intelligence Report to Blocked; Verify that Allow Apple Intelligence Report is present and set to Blocked'
