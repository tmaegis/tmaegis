id: TMA-INTUNE-MACOS-2.9.1.11
title: Ensure "Require Alphanumeric Passcode" is set to "Enabled"
description: This setting requires that device passcodes contain at least one alphabetic character (a- z, A-Z) in addition to numerals and other required character types. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.11 Ensure "Require Alphanumeric Passcode" is set to "Enabled"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Require Alphanumeric Passcode is present and set to Enabled. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Require alphanumeric is set to Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Require Alphanumeric Passcode; On the left side of the page set Require Alphanumeric Passcode to Enabled; Verify that Require Alphanumeric Passcode is present and set to Enabled'
