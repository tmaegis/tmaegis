id: TMA-INTUNE-MACOS-2.3.2.1
title: Ensure "Prevent FileVault From Being Disabled" is set to "True"
description: When enabled, this disables the option to turn off FileVault encryption in System Settings and through command-line interfaces. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.2.1 Ensure "Prevent FileVault From Being Disabled" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault Options subheading; Verify that Prevent FileVault From Being Disabled is present and set to True. On the device: Double-click com.apple.MCX Profile; Under the Details section; Confirm FileVault Can''t Disable is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault Options; Check Prevent FileVault From Being Disabled; On the left side of the page set Prevent FileVault From Being Disabled to True; Verify that Prevent FileVault From Being Disabled is present and set to True'
