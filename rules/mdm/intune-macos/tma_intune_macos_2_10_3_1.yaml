id: TMA-INTUNE-MACOS-2.10.3.1
title: Ensure "Enable" is set to "True"
description: When "Background Security Improvement Settings" is enabled, the system automatically downloads and installs targeted security patches and system data files provided by Apple. These improvements are separate from standard operating system updates and are applied silently in the background without requiring user intervention. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.10.3.1 Ensure "Enable" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Software Update Settings subheading; Under Background Security Improvement Settings; Verify that Enable is present and set to True. On the device: Double-click Management Profile; Under the Device Declarations section; Click Software Update Settings; Confirm Enable is set to On'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Software Update Settings; Expand Background Security Improvement Settings; Check Enable; On the left side of the page set Enable to True; Verify that Enable is present and set to True'
