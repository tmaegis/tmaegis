id: TMA-INTUNE-MACOS-2.12.2.1
title: Ensure "Disable Override" is set to "True"
description: This setting disables the contextual menu option in Finder that allows users to bypass Gatekeeper application verification by right-clicking and selecting "Open" on unsigned applications. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.12.2.1 Ensure "Disable Override" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Policy Control heading; Under the System Policy Managed subheading; Verify that Disable Override is present and set to True. On the device: Double-click com.apple.systempolicy.managed Profile; Under the Details section; Confirm Open untrusted apps via Finder is set to Disallow'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Policy Control then System Policy Managed; Check Disable Override; On the left side of the page set Disable Override to True; Verify that Disable Override is present and set to True'
