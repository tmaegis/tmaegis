id: TMA-INTUNE-MACOS-2.8.35
title: Ensure "Allow Universal Control" is set to "False"
description: Universal Control is a feature introduced in macOS 13 that allows users to use a single mouse and keyboard to control multiple Mac or iPad devices simultaneously. When enabled, users can move their cursor seamlessly between devices and drag and drop content across them, without additional hardware or setup. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.35 Ensure "Allow Universal Control" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Universal Control is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Universal Control is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Universal Control; On the left side of the page set Allow Universal Control to False; Verify that Allow Universal Control is present and set to False'
