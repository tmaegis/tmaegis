id: TMA-INTUNE-MACOS-2.14.1.1
title: Ensure "Allow Sign In" is set to "Blocked"
description: This setting determines whether users are permitted to authenticate to third-party generative AI services through native macOS intelligence features. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.1.1 Ensure "Allow Sign In" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the External Intelligence Settings subheading; Verify that Allow Sign In is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click External Intelligence Settings; Confirm Allow Sign-In is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then External Intelligence Settings; Check Allow Sign In; On the left side of the page set Allow Sign In to Blocked; Verify that Allow Sign In is present and set to Blocked'
