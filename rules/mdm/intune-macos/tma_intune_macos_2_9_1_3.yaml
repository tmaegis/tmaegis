id: TMA-INTUNE-MACOS-2.9.1.3
title: Ensure "Automatic Device Lock" is set to "15" or less, but not 0
description: This setting defines the maximum period of inactivity (in minutes) before screen saver is automatically initiated. When combined with the "Ask For Password" policy defined in the system configuration section of the benchmark, this will enforce a device lock after 15 minutes of inactivity. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.3 Ensure "Automatic Device Lock" is set to "15" or less, but not 0
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Automatic Device Lock is present and set to 15 or less, but not 0. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Maximum inactivity is set to 15 minutes or less, but not 0'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Automatic Device Lock; On the left side of the page set Automatic Device Lock to 15 or less, but not 0; Verify that Automatic Device Lock is present and set to 15 or less, but not 0'
