id: TMA-INTUNE-MACOS-2.9.1.8
title: Ensure "Maximum Number of Failed Attempts" is set to "5" or less, but not 0
description: This setting defines the maximum number of failed attempts allowed when entering a passcode at the device's lock screen. When used in combination with the "Failed Attempts Reset In Minutes" policy when the attempt threshold is reached, a time delay is imposed before another passcode attempt can be made. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.8 Ensure "Maximum Number of Failed Attempts" is set to "5" or less, but not 0
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Maximum Number of Failed Attempts is present and set to 5 or less, but not 0. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Maximum failed attempts is set to 5 or less, but not 0'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Maximum Number of Failed Attempts; On the left side of the page set Maximum Number of Failed Attempts to 5 or less, but not 0; Verify that Maximum Number of Failed Attempts is present and set to 5 or less, but not 0'
