id: TMA-INTUNE-MACOS-2.5.1.1
title: Ensure "Activation Lock Allowed While Supervised" is set appropriately
description: When Activation Lock is enabled, a device cannot be erased or reactivated without the associated Apple ID credentials, including after a factory reset. This setting does not enable Activation Lock directly, but instead controls if users are permitted to enable this feature through Find My. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.5.1.1 Ensure "Activation Lock Allowed While Supervised" is set appropriately
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Managed Settings heading; Under the MDM Options subheading; Verify that Activation Lock Allowed While Supervised is set to your organization''s requirements'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Managed Settings then MDM Options; Check Activation Lock Allowed While Supervised; On the left side of the page set Activation Lock Allowed While Supervised to Allowed or Blocked; Verify that Activation Lock Allowed While Supervised is set to your organization''s requirements'
