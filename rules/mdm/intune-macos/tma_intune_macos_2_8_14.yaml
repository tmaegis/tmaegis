id: TMA-INTUNE-MACOS-2.8.14
title: Ensure "Allow Game Center" is set to "False"
description: Game Center is a social gaming network provided by Apple that allows users to track achievements, compare scores on leaderboards, and connect with friends for multiplayer gaming experiences. It stores user profile data including nickname and gaming activity, and enables features such as contact discovery and nearby player detection through network/LAN/Bluetooth connections. When enabled on macOS, users can sign in to Game Center with their Apple ID. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.14 Ensure "Allow Game Center" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Game Center is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Game Center is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Game Center; On the left side of the page set Allow Game Center to False; Verify that Allow Game Center is present and set to False'
