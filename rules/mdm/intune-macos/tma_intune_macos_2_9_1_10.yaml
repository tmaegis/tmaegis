id: TMA-INTUNE-MACOS-2.9.1.10
title: Ensure "Failed Attempts Reset In Minutes" is set to "15" or more
description: This setting determines the number of minutes that must elapse before the failed login counter is reset after reaching the maximum number of unsuccessful login attempts. This policy requires that the "Maximum Number of Failed Attempts" policy is also configured, and it starts a time-based delay before additional login attempts can be processed. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.10 Ensure "Failed Attempts Reset In Minutes" is set to "15" or more
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Failed Attempts Reset In Minutes is present and set to 15 or more. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Failed attempts reset is set to 3 minutes or more'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Failed Attempts Reset In Minutes; On the left side of the page set Failed Attempts Reset In Minutes to 15 or more; Verify that Failed Attempts Reset In Minutes is present and set to 15 or more'
