id: TMA-INTUNE-MACOS-2.9.1.4
title: Ensure "Minimum Complex Characters" is set to "1" or more
description: 'This setting enforces at least one complex character to be contained within user device passcodes. Complex characters are non-alphanumeric symbols such as: &, %, $, #, !, @, and other special characters. A space character is considered a complex character, therefore facilitating the use of passphases without symbols. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).'
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.4 Ensure "Minimum Complex Characters" is set to "1" or more
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Minimum Complex Characters is present and set to 1 or more. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Minimum complex characters is set to 1 or more'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Minimum Complex Characters; On the left side of the page set Minimum Complex Characters to 1 or more; Verify that Minimum Complex Characters is present and set to 1 or more'
