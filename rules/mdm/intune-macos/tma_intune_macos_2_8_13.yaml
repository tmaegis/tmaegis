id: TMA-INTUNE-MACOS-2.8.13
title: Ensure "Allow ARD Remote Management Modification" is set to "False"
description: Apple Remote Desktop (ARD) Remote Management allows administrators to remotely manage Mac systems through the Remote Management service. The Remote Management modification setting controls whether users can modify Remote Management sharing settings through System Settings. When Remote Management is enabled, it opens port 5900 and allows remote connections based on configured permissions. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.13 Ensure "Allow ARD Remote Management Modification" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow ARD Remote Management Modification is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Remote Desktop Management Modification is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow ARD Remote Management Modification; On the left side of the page set Allow ARD Remote Management Modification to False; Verify that Allow ARD Remote Management Modification is present and set to False'
