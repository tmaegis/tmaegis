id: TMA-INTUNE-MACOS-2.12.1.3
title: Ensure Gatekeeper is configured to block all user application installs
description: This setting, when implemented in conjunction with the "Restrict Store Software Update Only" policy, will block all user software installation methods. It requires "Enable Assessment" to be set to "True" (enabling Gatekeeper) and "Allow Identified Developers" to be set to "False", restricting installations to Mac App Store applications only. Setting "Restrict Store Software Update Only" to "True" prevents the Mac App Store from launching and installing applications, effectively preventing all user-initiated application installations. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.12.1.3 Ensure Gatekeeper is configured to block all user application installs
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Policy Control heading; Under the System Policy Control subheading; Verify that Enable Assessment is present and set to True; Verify that Allow Identified Developers is present and set to False For this to be effective, control (Ensure "Restrict Store Software Update Only" is set to "True") must be set. On the device: Double-click com.apple.systempolicy.control Profile; Under the Details section; Confirm Policies is set to Enable; Confirm Identified Developers is set to Disallow'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Policy Control then System Policy Control; Check Enable Assessment; Check Allow Identified Developers; On the left side of the page set Enable Assessment to True; On the left side of the page set Allow Identified Developers to False; Verify that Enable Assessment is present and set to True; Verify that Allow Identified Developers is present and set to False'
