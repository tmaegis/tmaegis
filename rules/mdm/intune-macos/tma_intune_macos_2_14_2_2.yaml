id: TMA-INTUNE-MACOS-2.14.2.2
title: Ensure "Allow Writing Tools" is set to "Blocked"
description: Apple Intelligence Writing Tools are a suite of AI-powered features integrated across the operating system, enabling users to enhance text by proofreading for errors, rewriting content to adjust tone or style, summarizing, and composing new text. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.2 Ensure "Allow Writing Tools" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Verify that Allow Writing Tools is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Allow Writing Tools is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Check Allow Writing Tools; On the left side of the page set Allow Writing Tools to Blocked; Verify that Allow Writing Tools is present and set to Blocked'
