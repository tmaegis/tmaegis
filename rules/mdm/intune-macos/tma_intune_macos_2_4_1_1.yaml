id: TMA-INTUNE-MACOS-2.4.1.1
title: Ensure "Show Full Name" is set to "True"
description: This policy setting controls whether the macOS login window displays a name and password dialog instead of a list of users. When enabled, users must enter both their username and password to authenticate. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.4.1.1 Ensure "Show Full Name" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Login heading; Under the Login Window Behavior subheading; Verify that Show Full Name is present and set to True. On the device: Double-click com.apple.loginwindow Profile; Under the Details section; Confirm Show Full Name is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Login then Login Window Behavior; Check Show Full Name; On the left side of the page set Show Full Name to True; Verify that Show Full Name is present and set to True'
