id: TMA-INTUNE-MACOS-2.3.1.2
title: Ensure "Enable" is set to "On"
description: FileVault provides full disk encryption (XTS-AES-128 with 256-bit key) for the entire system volume on macOS devices. This policy setting ensures FileVault encryption is enabled and enforced. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.2 Ensure "Enable" is set to "On"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that Enable is present and set to On. On the device: Double-click FileVault Profile or com.apple.MCX.FileVault2 Profile; Under the Details section; Confirm Enable is set to On'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault; Check Enable; On the left side of the page set Enable to On; Verify that Enable is present and set to On'
