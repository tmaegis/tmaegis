id: TMA-INTUNE-MACOS-2.8.29
title: Ensure "Allow Fingerprint For Unlock" is set appropriately
description: Touch ID on macOS devices enables users to unlock their devices using fingerprint authentication instead of a password. When enabled, this biometric authentication method can be used for device unlock, system preferences access, password autofill, and at other authentication points. Touch ID stores enrolled fingerprint data in the Secure Enclave, a hardware-based security component isolated from the main processor. All Touch ID operations still require the existence of a password, which must be used after device reboots or when the device has not been unlocked for more than 48 hours. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.29 Ensure "Allow Fingerprint For Unlock" is set appropriately
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Fingerprint For Unlock is present and set to True or False depending on organizational security guidelines. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Touch ID To Unlock Mac is set to True or False depending on organizational security guidelines'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Fingerprint For Unlock; On the left side of the page set Allow Fingerprint For Unlock to True or False depending on organizational security guidelines; Verify that Allow Fingerprint For Unlock is present and set to True or False'
