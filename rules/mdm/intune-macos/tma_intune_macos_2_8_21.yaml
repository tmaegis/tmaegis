id: TMA-INTUNE-MACOS-2.8.21
title: Ensure "Allow Find My Friends" is set to "False"
description: Find My Friends is a built-in macOS feature that enables device location sharing and tracking through Apple's Find My app. When enabled, users can share their device's real-time location with other Apple ID users and allow continuous location monitoring. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.21 Ensure "Allow Find My Friends" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Find My Friends is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Find My Friends is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Find My Friends; On the left side of the page set Allow Find My Friends to False; Verify that Allow Find My Friends is present and set to False'
