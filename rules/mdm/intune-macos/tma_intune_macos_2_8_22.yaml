id: TMA-INTUNE-MACOS-2.8.22
title: Ensure "Allow AirDrop" is set to "False"
description: When enabled, AirDrop allows users to share content with nearby Apple devices without requiring network infrastructure or internet connectivity. AirDrop uses Bluetooth for device discovery and establishes a direct, encrypted WiFi connection for the actual file transfers. The service can be configured to accept transfers from contacts only or from everyone within range. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.22 Ensure "Allow AirDrop" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow AirDrop is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Airdrop is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow AirDrop; On the left side of the page set Allow AirDrop to False; Verify that Allow AirDrop is present and set to False'
