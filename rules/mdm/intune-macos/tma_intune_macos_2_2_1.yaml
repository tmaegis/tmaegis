id: TMA-INTUNE-MACOS-2.2.1
title: Ensure "Restrict Store Software Update Only" is set to "True"
description: This setting prevents users from accessing the App Store application on managed macOS devices, while still allowing system software updates to be installed through the Software Update mechanism. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.2.1 Ensure "Restrict Store Software Update Only" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the App Store heading; Verify that Restrict Store Software Update Only is present and set to True. On the device: Double-click com.apple.appstore Profile; Under the Details section; Confirm Restrict To Software Updates is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select App Store; Check Restrict Store Software Update Only; On the left side of the page set Restrict Store Software Update Only to True; Verify that Restrict Store Software Update Only is present and set to True'
