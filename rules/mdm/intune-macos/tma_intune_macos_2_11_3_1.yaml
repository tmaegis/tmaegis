id: TMA-INTUNE-MACOS-2.11.3.1
title: Ensure "Allow User Overrides" is set to "False"
description: This setting controls whether users can approve system extensions that aren't explicitly allowed by configuration profiles. System extensions are software components that extend the functionality of macOS by integrating with the kernel or other system services without requiring kernel extensions (kexts). The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.11.3.1 Ensure "Allow User Overrides" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Configuration heading; Under the System Extensions subheading; Verify that Allow User Overrides is present and set to False. On the device: Double-click com.apple.system-extension-policy Profile; Under the Details section; Confirm User approvals allowed? is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Configuration then System Extensions; Check Allow User Overrides; On the left side of the page set Allow User Overrides to False; Verify that Allow User Overrides is present and set to False'
