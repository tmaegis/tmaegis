id: TMA-INTUNE-MACOS-2.14.2.1.1.2
title: Ensure "Allow Summary" is set to "Blocked"
description: Apple Intelligence's Mail summarization feature uses AI to quickly condense long emails or entire email threads into a few key sentences or bullet points. These summaries automatically appear beneath emails in the inbox, or can be generated manually via a "Summarize" button within an open email to provide an overview of complex conversations. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.1.1.2 Ensure "Allow Summary" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Under Apps then Mail; Verify that Allow Summary is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Allow Mail Summary is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Expand Apps then expand Mail; Check Allow Summary; On the left side of the page set Allow Summary to Blocked; Verify that Allow Summary is present and set to Blocked'
