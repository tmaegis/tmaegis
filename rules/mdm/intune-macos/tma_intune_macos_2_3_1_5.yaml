id: TMA-INTUNE-MACOS-2.3.1.5
title: Ensure "Force Enable In Setup Assistant" is set to "True"
description: When enabled, the system will prompt for FileVault enablement during initial device setup immediately after MDM enrollment, ensuring early-stage disk encryption implementation. This will only apply to devices that are MDM enrolled before the device has been set up (or after a factory reset). The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.3.1.5 Ensure "Force Enable In Setup Assistant" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Full Disk Encryption heading; Under the FileVault subheading; Verify that Force Enable In Setup Assistant is present and set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Full Disk Encryption then FileVault; Check Force Enable In Setup Assistant; On the left side of the page set Force Enable In Setup Assistant to True; Verify that Force Enable In Setup Assistant is present and set to True'
