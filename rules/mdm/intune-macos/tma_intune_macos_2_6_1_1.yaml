id: TMA-INTUNE-MACOS-2.6.1.1
title: Ensure "Auto Activation" is set to "False"
description: Content caching stores and serves various types of content from Apple, including software updates, app store purchases, iCloud data, and other downloadable content to reduce internet bandwidth usage. When "Auto Activation" is enabled, content caching automatically activates when possible and prevents manual deactivation. This capability requires macOS clients to function as P2P nodes for Apple content distribution. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 2
severity: low
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.6.1.1 Ensure "Auto Activation" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Networking heading; Under the Content Caching subheading; Verify that Auto Activation is present and set to False. On the device: Double-click com.apple.AssetCache.managed Profile; Under the Details section; Confirm Automatically activate Content Caching is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Networking then Content Caching; Check Auto Activation; On the left side of the page set Auto Activation to False; Verify that Auto Activation is present and set to False'
