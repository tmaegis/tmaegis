id: TMA-INTUNE-MACOS-2.8.17
title: Ensure "Allow UI Configuration Profile Installation" is set to "False"
description: This restriction prevents a user from intentionally or unintentionally installing additional configuration profiles through the user interface in macOS. When set to False, users are prevented from installing configuration profiles manually through System Settings or by opening profile files. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.17 Ensure "Allow UI Configuration Profile Installation" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow UI Configuration Profile Installation is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Configuration Profile Installation is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow UI Configuration Profile Installation; On the left side of the page set Allow UI Configuration Profile Installation to False; Verify that Allow UI Configuration Profile Installation is present and set to False'
