id: TMA-INTUNE-MACOS-2.8.25
title: Ensure "Allow Multiplayer Gaming" is set to "False"
description: Multiplayer gaming is a feature of Apple's Game Center service that enables users to participate in gaming sessions with other Game Center users. The feature facilitates real-time gameplay between users, and integrates with Game Center's social features for player matching and session management. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.25 Ensure "Allow Multiplayer Gaming" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Multiplayer Gaming is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Game Center''s "Multiplayer" is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Multiplayer Gaming; On the left side of the page set Allow Multiplayer Gaming to False; Verify that Allow Multiplayer Gaming is present and set to False'
