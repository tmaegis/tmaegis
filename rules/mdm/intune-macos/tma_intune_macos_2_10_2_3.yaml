id: TMA-INTUNE-MACOS-2.10.2.3
title: Ensure "Install Security Update" is set to "AlwaysOn"
description: This recommendation controls whether macOS automatically installs security updates. When configured to "AlwaysOn", the system will automatically install updates specifically designated as security patches without requiring user initiation. This setting applies solely to OS-level security updates and is distinct from full operating system updates and background security improvement settings, such as Rapid Security Responses (RSR) and XProtect. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.10.2.3 Ensure "Install Security Update" is set to "AlwaysOn"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Software Update Settings subheading; Under Automatic Actions; Verify that Install Security Update is present and set to AlwaysOn. On the device: Double-click Management Profile; Under the Device Declarations section; Click Software Update Settings; Confirm Install Security Updates is set to On'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Software Update Settings; Expand Automatic Actions; Check Install Security Update; On the left side of the page set Install Security Update to AlwaysOn; Verify that Install Security Update is present and set to AlwaysOn'
