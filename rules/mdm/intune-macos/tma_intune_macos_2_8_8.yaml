id: TMA-INTUNE-MACOS-2.8.8
title: Ensure "Allow Cloud Document Sync" is set to "False"
description: iCloud Document Sync is an app-level cloud-based service that enables applications to store and synchronize documents and data through iCloud. When enabled, this feature allows apps to automatically save files to iCloud storage, making these documents accessible across multiple devices using the same Apple ID. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.8 Ensure "Allow Cloud Document Sync" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Document Sync is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Drive is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Document Sync; On the left side of the page set Allow Cloud Document Sync to False; Verify that Allow Cloud Document Sync is present and set to False'
