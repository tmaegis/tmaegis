id: TMA-INTUNE-MACOS-2.8.9
title: Ensure "Allow Activity Continuation" is set to "False"
description: Activity Continuation, also known as Handoff, allows users to start work on one macOS device and continue on another Apple device. This feature requires devices to be signed into the same Apple ID and uses Bluetooth and WiFi connections for nearby devices, with iCloud handling transfers between distant devices. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.9 Ensure "Allow Activity Continuation" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Activity Continuation is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Handoff Allowed is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Activity Continuation; On the left side of the page set Allow Activity Continuation to False; Verify that Allow Activity Continuation is present and set to False'
