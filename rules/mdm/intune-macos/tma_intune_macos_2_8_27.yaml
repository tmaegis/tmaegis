id: TMA-INTUNE-MACOS-2.8.27
title: Ensure "Allow Apple Personalized Advertising" is set to "False"
description: Apple provides a framework that allows advertisers to target macOS users with relevant advertisements through the use of a unique identifier. When personalized advertising is enabled, information about user behavior, preferences, and interests is collected and made available to advertisers to facilitate targeted ad delivery. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.27 Ensure "Allow Apple Personalized Advertising" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Apple Personalized Advertising is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Apple Personalized Advertising is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Apple Personalized Advertising; On the left side of the page set Allow Apple Personalized Advertising to False; Verify that Allow Apple Personalized Advertising is present and set to False'
