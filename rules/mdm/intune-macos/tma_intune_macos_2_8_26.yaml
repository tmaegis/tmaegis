id: TMA-INTUNE-MACOS-2.8.26
title: Ensure "Allow Local User Creation" is set to "False"
description: This setting controls whether users can create new local user accounts on macOS devices. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.26 Ensure "Allow Local User Creation" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Local User Creation is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Adding Users is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Local User Creation; On the left side of the page set Allow Local User Creation to False; Verify that Allow Local User Creation is present and set to False'
