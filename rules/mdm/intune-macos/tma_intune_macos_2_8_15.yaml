id: TMA-INTUNE-MACOS-2.8.15
title: Ensure "Allow Auto Unlock" is set to "False"
description: Auto Unlock allows users to automatically unlock their Mac using an Apple Watch. When enabled, this feature permits users to bypass the login screen password requirement when their authenticated Apple Watch is in close proximity to the Mac. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.15 Ensure "Allow Auto Unlock" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Auto Unlock is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow Auto Unlock is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Auto Unlock; On the left side of the page set Allow Auto Unlock to False; Verify that Allow Auto Unlock is present and set to False'
