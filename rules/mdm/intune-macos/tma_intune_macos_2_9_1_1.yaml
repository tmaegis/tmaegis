id: TMA-INTUNE-MACOS-2.9.1.1
title: Ensure "Maximum Passcode Age In Days" is set to "365" or less, but not 0
description: The Max PIN Age setting enforces automatic expiration of device passcodes after a specified number of days. When configured to 365 days or less, users will be prompted to create a new passcode after the specified time period has elapsed, and must do so before being allowed to unlock the device. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: high
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.9.1.1 Ensure "Maximum Passcode Age In Days" is set to "365" or less, but not 0
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Passcode subheading; Verify that Maximum Passcode Age In Days is present and set to 365 or less, but not 0. On the device: Double-click Management Profile; Under the Device Declarations section; Click Passcode; Confirm Maximum age is set to 365 days or less, but not 0'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Passcode; Check Maximum Passcode Age In Days; On the left side of the page set Maximum Passcode Age In Days to 365 or less, but not 0; Verify that Maximum Passcode Age In Days is present and set to 365 or less, but not 0'
