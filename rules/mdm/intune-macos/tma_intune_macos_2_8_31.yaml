id: TMA-INTUNE-MACOS-2.8.31
title: Ensure "Allow Cloud Reminders" is set to "False"
description: iCloud Reminders is a cloud-based service that synchronizes reminder data across Apple devices using Apple's iCloud infrastructure. When enabled, users can create, store, and access reminders through their iCloud account. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.31 Ensure "Allow Cloud Reminders" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Reminders is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Reminders is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Reminders; On the left side of the page set Allow Cloud Reminders to False; Verify that Allow Cloud Reminders is present and set to False'
