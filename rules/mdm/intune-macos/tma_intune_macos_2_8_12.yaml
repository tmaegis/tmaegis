id: TMA-INTUNE-MACOS-2.8.12
title: Ensure "Allow Cloud Calendar" is set to "False"
description: iCloud Calendar is a cloud-based service that synchronizes calendar data across Apple devices using Apple's iCloud infrastructure. When enabled, users can create, store, and access calendars, events, and appointments through their iCloud account, making this information available across multiple devices signed into the same Apple ID. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.12 Ensure "Allow Cloud Calendar" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Calendar is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Calendar is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Calendar; On the left side of the page set Allow Cloud Calendar to False; Verify that Allow Cloud Calendar is present and set to False'
