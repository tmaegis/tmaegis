id: TMA-INTUNE-MACOS-2.10.2.2
title: Ensure "Install OS Updates" is set to "Always On"
description: This recommendation controls whether macOS automatically installs operating system updates. When configured to "Always On", the system will automatically install applicable macOS updates without requiring user initiation. To ensure devices are forcibly updated to an approved OS level, this configuration must be used in combination with recommendation 2.10.1.1 Ensure "Enforce Latest Software Update Version", or an acceptable substitute highlighted in the 2.10.1.1 description section. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.10.2.2 Ensure "Install OS Updates" is set to "Always On"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Software Update Settings subheading; Under Automatic Actions; Verify that Install OS Updates is present and set to Always On. On the device: Double-click Management Profile; Under the Device Declarations section; Click Software Update Settings; Confirm Install OS Updates is set to On'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Software Update Settings; Expand Automatic Actions; Check Install OS Updates; On the left side of the page set Install OS Updates to Always On; Verify that Install OS Updates is present and set to Always On'
