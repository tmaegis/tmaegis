id: TMA-INTUNE-MACOS-2.14.2.1.2.1
title: Ensure "Allow Transcription" is set to "Blocked"
description: Leveraging Apple Intelligence, the Notes app can record audio, such as meetings, lectures, or internal discussions, then convert them into written text transcripts. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.14.2.1.2.1 Ensure "Allow Transcription" is set to "Blocked"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Declarative Device Management (DDM) heading; Under the Intelligence Settings subheading; Under Apps then Notes; Verify that Allow Transcription is present and set to Blocked. On the device: Double-click Management Profile; Under the Device Declarations section; Click Intelligence Settings; Confirm Allow Notes Transcription is set to No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Declarative Device Management (DDM) then Intelligence Settings; Expand Apps then expand Notes; Check Allow Transcription; On the left side of the page set Allow Transcription to Blocked; Verify that Allow Transcription is present and set to Blocked'
