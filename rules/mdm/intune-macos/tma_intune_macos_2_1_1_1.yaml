id: TMA-INTUNE-MACOS-2.1.1.1
title: Ensure "Disable Guest Account" is set to "True"
description: The Guest account allows users to log in to the computer without requiring user authentication. When enabled, the Guest account provides access to the system with a restricted set of privileges but does not require a password. The account is recreated every time a guest logs out. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.1.1.1 Ensure "Disable Guest Account" is set to "True"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Accounts heading; Under the Accounts subheading; Verify that Disable Guest Account is present and set to True. On the device: Double-click com.apple.MCX Profile; Under the Details section; Confirm Disable Guest Account is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Accounts then Accounts; Check Disable Guest Account; On the left side of the page set Disable Guest Account to True; Verify that Disable Guest Account is present and set to True'
