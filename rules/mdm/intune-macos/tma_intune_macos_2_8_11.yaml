id: TMA-INTUNE-MACOS-2.8.11
title: Ensure "Allow Cloud Freeform" is set to "False"
description: Freeform is a collaboration application introduced in macOS 13.1 (Ventura) that provides digital whiteboard functionality across Apple devices. When enabled, iCloud Freeform allows users to create, store, and share interactive whiteboards containing text, images, videos, and other media through Apple's iCloud infrastructure. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.11 Ensure "Allow Cloud Freeform" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Cloud Freeform is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Disallow iCloud Freeform is set to True'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Cloud Freeform; On the left side of the page set Allow Cloud Freeform to False; Verify that Allow Cloud Freeform is present and set to False'
