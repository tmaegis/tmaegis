id: TMA-INTUNE-MACOS-2.11.1.3
title: Ensure "Wake on LAN" is set to "False"
description: This setting controls whether a Mac can be awakened from sleep through network access. When enabled, the system can be remotely activated by wake packets sent over the network, allowing the computer to be accessed when it would otherwise be in sleep mode. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.11.1.3 Ensure "Wake on LAN" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Configuration heading; Under the Energy Saver subheading; Under Desktop Power; Verify that Wake on LAN is present and set to False; Under Laptop Battery Power; Verify that Wake on LAN is present and set to False; Under Laptop Power; Verify that Wake on LAN is present and set to False. On the device: Open a Terminal; Run the following command to verify that a profile is installed that disables Wake On Lan is installed: /usr/bin/sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep "Wake on LAN"; The following output is expected: "Wake on LAN" = 0; ...'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Configuration then Energy Saver; Expand Desktop Power; Check Wake on LAN; Expand Laptop Battery Power; Check Wake on LAN; Expand Laptop Power Power; Check Wake on LAN; On the left side of the page set all instances of Wake on LAN to False; Verify that Wake on LAN is present three times and is set to False'
