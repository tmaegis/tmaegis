id: TMA-INTUNE-MACOS-2.8.1
title: Ensure "Allow Bluetooth Sharing Modification" is set to "False"
description: Bluetooth Sharing allows users to exchange files with other Bluetooth-enabled devices. Setting "Allow Bluetooth Sharing Modification" to "False" prevents users from changing the Bluetooth sharing settings in System Settings. The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.8.1 Ensure "Allow Bluetooth Sharing Modification" is set to "False"
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the Restrictions heading; Verify that Allow Bluetooth Sharing Modification is present and set to False. On the device: Double-click com.apple.applicationaccess Profile; Under the Details section; Confirm Allow Bluetooth Sharing Modification is set to False'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Restrictions; Check Allow Bluetooth Sharing Modification; On the left side of the page set Allow Bluetooth Sharing Modification to False; Verify that Allow Bluetooth Sharing Modification is present and set to False'
