id: TMA-INTUNE-MACOS-2.12.1.2
title: Ensure Gatekeeper is configured for application installs from Identified Developers only
description: This recommendation configures Gatekeeper to allow application installations only from the Mac App Store and identified developers with valid code signatures. It requires both the "Enable Assessment" setting to be set to "True" (enabling Gatekeeper) and the "Allow Identified Developers" setting to be set to "True". The benchmark marks this a Manual check of an Intune macOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-macos
level: 1
severity: medium
tags:
- intune-macos
- intune
- manual-review
reference: CIS Apple macOS 26 Tahoe Intune Benchmark v1.0.0 - 2.12.1.2 Ensure Gatekeeper is configured for application installs from Identified Developers only
audit:
  type: manual
  command: 'macOS: Intune admin center: Expand the System Policy Control heading; Under the System Policy Control subheading; Verify that Enable Assessment is present and set to True; Verify that Allow Identified Developers is present and set to True. On the device: Double-click com.apple.systempolicy.control Profile; Under the Details section; Confirm Policies is set to Enable; Confirm Identified Developers is set to Allow'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select System Policy Control then System Policy Control; Check Enable Assessment; Check Allow Identified Developers; On the left side of the page set Enable Assessment to True; On the left side of the page set Allow Identified Developers to True; Verify that Enable Assessment is present and set to True; Verify that Allow Identified Developers is present and set to True'
