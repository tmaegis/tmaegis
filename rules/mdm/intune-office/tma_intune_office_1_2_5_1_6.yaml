id: TMA-INTUNE-OFFICE-1.2.5.1.6
title: Ensure 'Local Machine Zone Lockdown Security' is set to 'Enabled'
description: 'This setting allows for configuration of policy settings in the zone consistent with a selected security level; for example, Low, Medium Low, Medium, or High. When Internet Explorer opens a Web page, it places restrictions on what the page can do, based on the page''s Internet Explorer security zone. There are several possible security zones, each with different sets of restrictions. The security zone for a page is determined by its location. For example, pages that are located on the Internet will normally be in the more restrictive Internet security zone. They might not be allowed to perform some operations, such as accessing the local hard drive. ... Audit: reads the registry value(s) excel.exe, exprwd.exe, groove.exe, msaccess.exe, mse7.exe, mspub.exe, onent.exe, outlook.exe, powerpnt.exe, pptview.exe, spDesign.exe, visio.exe, winproj.exe, winword.exe that the Intune policy writes under HKEY_LOCAL_MACHINE and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 1.2.5.1.6 Ensure 'Local Machine Zone Lockdown Security' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''groove.exe'' -ErrorAction SilentlyContinue).''groove.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''groove.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''excel.exe'' -ErrorAction SilentlyContinue).''excel.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''excel.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''mspub.exe'' -ErrorAction SilentlyContinue).''mspub.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''mspub.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet
    Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''powerpnt.exe'' -ErrorAction SilentlyContinue).''powerpnt.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''powerpnt.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''pptview.exe'' -ErrorAction SilentlyContinue).''pptview.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''pptview.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''visio.exe'' -ErrorAction SilentlyContinue).''visio.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''visio.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''winproj.exe''
    -ErrorAction SilentlyContinue).''winproj.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''winproj.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''winword.exe'' -ErrorAction SilentlyContinue).''winword.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''winword.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''outlook.exe'' -ErrorAction SilentlyContinue).''outlook.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''outlook.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''spDesign.exe'' -ErrorAction SilentlyContinue).''spDesign.exe''; if (-not ($null -ne $v
    -and @(1) -contains [int64]$v)) { $bad += ''spDesign.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''exprwd.exe'' -ErrorAction SilentlyContinue).''exprwd.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''exprwd.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''msaccess.exe'' -ErrorAction SilentlyContinue).''msaccess.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''msaccess.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''onent.exe'' -ErrorAction SilentlyContinue).''onent.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''onent.exe='' + $v }; $v = (Get-ItemProperty
    -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN'' -Name ''mse7.exe'' -ErrorAction SilentlyContinue).''mse7.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''mse7.exe='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: check all applications: Microsoft Office 2016 (Machine)\Security Settings\IE Security\Local Machine Zone Lockdown Security'
