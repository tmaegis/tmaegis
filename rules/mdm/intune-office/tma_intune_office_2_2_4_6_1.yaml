id: TMA-INTUNE-OFFICE-2.2.4.6.1
title: 'Ensure ''Default file format'' is set to ''Enabled: Excel Workbook (*.xlsx)'''
description: 'This policy setting controls the default file format for saving workbooks in Excel. The recommended state for this setting is: Enabled: Excel Workbook (*.xlsx) Audit: reads the registry value(s) defaultformat that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.6.1 Ensure ''Default file format'' is set to ''Enabled: Excel Workbook (*.xlsx)'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\options'') -Name ''defaultformat'' -ErrorAction SilentlyContinue).''defaultformat''; if (-not ($null -ne $v -and @(51) -contains [int64]$v)) { $_.PSChildName + '':defaultformat='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Excel Workbook (*.xlsx): Microsoft Excel 2016\Excel Options\Save\Default File Format'
