id: TMA-INTUNE-OFFICE-2.5.10.6.3
title: Ensure 'Make Outlook the default program for E- mail, Contacts, and Calendar' is set to 'Enabled'
description: 'This policy setting controls whether Outlook is the default program for e-mail, contacts, and calendar services. If this policy setting is enabled, the "Make Outlook the default program for E-mail, Contacts, and Calendar" check box on the General tab of the Office Center is selected and users cannot change it. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) check default client that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.6.3 Ensure 'Make Outlook the default program for E- mail, Contacts, and Calendar' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\general'') -Name ''check default client'' -ErrorAction SilentlyContinue).''check default client''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':check default client='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Outlook Options\Other\Make Outlook the default program for E-mail, Contacts, and Calendar'
