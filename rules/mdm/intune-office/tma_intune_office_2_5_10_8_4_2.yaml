id: TMA-INTUNE-OFFICE-2.5.10.8.4.2
title: Ensure 'Hide Junk Mail UI' is set to 'Disabled'
description: 'This policy setting controls whether the Junk E-mail Filter is enabled in Outlook. NOTE: This policy setting does not affect the configuration of the Microsoft Exchange Server Intelligent Message Filter (IMF), which provides server-level junk e-mail filtering. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) disableantispam that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.8.4.2 Ensure 'Hide Junk Mail UI' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook'') -Name ''disableantispam'' -ErrorAction SilentlyContinue).''disableantispam''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':disableantispam='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Outlook Options\Preferences\Junk E-mail\Hide Junk Mail UI'
