id: TMA-INTUNE-OFFICE-2.5.7.1
title: 'Ensure ''Disable user entries to server list'' is set to ''Enabled: Publish default, disallow others'''
description: 'This policy setting controls whether Outlook users can add entries to the list of SharePoint servers when establishing a meeting workspace. Policy setting option to determine whether Outlook users can add entries to the published server list: Publish default, disallow others - This option prevents users from adding servers to the default published server list. The recommended state for this setting is: Enabled: Publish default, disallow others. Audit: reads the registry value(s) serverui that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.7.1 Ensure ''Disable user entries to server list'' is set to ''Enabled: Publish default, disallow others'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\meetings\profile'') -Name ''serverui'' -ErrorAction SilentlyContinue).''serverui''; if (-not ($null -ne $v -and @(2) -contains [int64]$v)) { $_.PSChildName + '':serverui='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Publish default, disallow others: Microsoft Outlook 2016\Meeting Workspace\Disable user entries to server list'
