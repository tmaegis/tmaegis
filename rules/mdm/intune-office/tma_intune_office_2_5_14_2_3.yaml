id: TMA-INTUNE-OFFICE-2.5.14.2.3
title: Ensure 'Do not provide Continue option on Encryption warning dialog boxes' is set to 'Enabled'
description: 'This setting controls whether Outlook users are allowed to send e-mail messages after they see an encryption warning dialog. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) disablecontinueencryption that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: high
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.3 Ensure 'Do not provide Continue option on Encryption warning dialog boxes' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''disablecontinueencryption'' -ErrorAction SilentlyContinue).''disablecontinueencryption''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':disablecontinueencryption='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Security\Cryptography\Do not provide Continue option on Encryption warning dialog boxes'
