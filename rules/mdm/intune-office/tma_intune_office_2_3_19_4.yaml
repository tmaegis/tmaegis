id: TMA-INTUNE-OFFICE-2.3.19.4
title: Ensure 'Never allow users to specify groups when restricting permission for documents' is set to 'Enabled'
description: 'This policy setting controls whether Office users can assign permissions to distribution lists when using Information Rights Management. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) neverallowdls that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.19.4 Ensure 'Never allow users to specify groups when restricting permission for documents' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\drm'') -Name ''neverallowdls'' -ErrorAction SilentlyContinue).''neverallowdls''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':neverallowdls='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Office 2016\Manage Restricted Permissions\Never Allow Users to Specify Groups When Restricting Permission for Documents'
