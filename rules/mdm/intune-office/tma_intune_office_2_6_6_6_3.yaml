id: TMA-INTUNE-OFFICE-2.6.6.6.3
title: Ensure 'Make hidden markup visible' is set to 'Enabled'
description: 'This policy setting controls whether hidden markup is visible when users open PowerPoint files in standard or HTML format. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) markupopensave that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.6.6.6.3 Ensure 'Make hidden markup visible' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\powerpoint\options'') -Name ''markupopensave'' -ErrorAction SilentlyContinue).''markupopensave''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':markupopensave='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft PowerPoint 2016\PowerPoint Options\Security\Make hidden markup visible'
