id: TMA-INTUNE-OFFICE-2.5.14.3.21
title: 'Ensure ''Junk E-mail protection level'' is set to ''Enabled: High'''
description: 'This policy setting controls your Junk E-mail protection level. By selecting the High option, Outlook intercepts most junk e-mail, but might incorrectly classify some legitimate messages as junk. Users are advised to check their Junk E- mail folders often. The recommended state for this setting is: Enabled: High. Audit: reads the registry value(s) junkmailprotection that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.21 Ensure ''Junk E-mail protection level'' is set to ''Enabled: High'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\mail'') -Name ''junkmailprotection'' -ErrorAction SilentlyContinue).''junkmailprotection''; if (-not ($null -ne $v -and @(3) -contains [int64]$v)) { $_.PSChildName + '':junkmailprotection='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: High: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Junk E-mail protection level Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
