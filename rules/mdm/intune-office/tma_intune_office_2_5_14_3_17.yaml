id: TMA-INTUNE-OFFICE-2.5.14.3.17
title: Ensure 'Do not allow Outlook object model scripts to run for public folders' is set to 'Enabled'
description: 'This policy setting controls whether Outlook executes scripts that are associated with custom forms or folder home pages for public folders. By enabling this policy setting, Outlook cannot execute any scripts associated with public folders, overriding any configuration changes on users'' computers. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) publicfolderscript that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.17 Ensure 'Do not allow Outlook object model scripts to run for public folders' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''publicfolderscript'' -ErrorAction SilentlyContinue).''publicfolderscript''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':publicfolderscript='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Do not allow Outlook object model scripts to run for public folders Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
