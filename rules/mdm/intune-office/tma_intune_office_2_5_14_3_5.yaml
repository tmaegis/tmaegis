id: TMA-INTUNE-OFFICE-2.5.14.3.5
title: 'Ensure ''Allow Active X One Off Forms'' is set to ''Enabled: Load only Outlook Controls'''
description: 'This policy setting configures the use of third-party ActiveX controls in Outlook. This setting can can be configured so that Safe Controls (Microsoft Forms 2.0 controls and the Outlook Recipient and Body controls) are allowed in one-off forms, or so that all ActiveX controls are allowed to run. The recommended state for this setting is: Enabled: Load only Outlook Controls. Audit: reads the registry value(s) allowactivexoneoffforms that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.5 Ensure ''Allow Active X One Off Forms'' is set to ''Enabled: Load only Outlook Controls'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\outlook\16.0\outlook\security'') -Name ''allowactivexoneoffforms'' -ErrorAction SilentlyContinue).''allowactivexoneoffforms''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':allowactivexoneoffforms='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Load only Outlook Controls: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Allow Active X One Off Forms Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
