id: TMA-INTUNE-OFFICE-2.5.9.2.1
title: Ensure 'PST Null Data on Delete' is set to 'Enabled'
description: 'This policy setting controls whether or not Outlook is forced to fully nullify deleted data in users'' Personal Folder files (.pst) at the time that the data is deleted. NOTE: This setting does not apply to (.ost) files generated when Outlook is connected to either Exchange or Exchange Online. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) pstnullfreeondelete that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.9.2.1 Ensure 'PST Null Data on Delete' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\Office\16.0\Outlook\PST'') -Name ''pstnullfreeondelete'' -ErrorAction SilentlyContinue).''pstnullfreeondelete''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':pstnullfreeondelete='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Miscellaneous\PST Settings\PST Null Data on Delete'
