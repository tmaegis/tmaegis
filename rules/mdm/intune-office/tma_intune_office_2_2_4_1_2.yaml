id: TMA-INTUNE-OFFICE-2.2.4.1.2
title: Ensure 'Ask to update automatic links' is set to 'Enabled'
description: 'This policy setting controls whether Excel prompts users to update automatic links, or whether the updates occur in the background with no prompt. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) fupdateext_78_1 that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.1.2 Ensure 'Ask to update automatic links' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\options\binaryoptions'') -Name ''fupdateext_78_1'' -ErrorAction SilentlyContinue).''fupdateext_78_1''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':fupdateext_78_1='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Excel 2016\Excel Options\Advanced\Ask to Update Automatic Links'
