id: TMA-INTUNE-OFFICE-2.6.6.6.2.4
title: Ensure 'Block macros from running in Office files from the Internet' is set to 'Enabled'
description: 'Windows Attachment Execution Service places a marker in the file’s alternate data stream to indicate it came from the Internet zone. If you enable this policy setting, macros are blocked from running, even if "Enable all macros" is selected in the Macro Settings section of the Trust Center. Users will receive a notification that macros are blocked from running. The exceptions when macros will be allowed to run are: • The Office file is saved to a Trusted Location. • The Office file was previously trusted by the user. • Macros are digitally signed and the matching Trusted Publisher certificate is installed on the device. The recommended state for this setting is: Enabled Audit: reads the registry value(s) blockcontentexecutionfrominternet that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.6.6.6.2.4 Ensure 'Block macros from running in Office files from the Internet' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\policies\microsoft\office\16.0\powerpoint\security'') -Name ''blockcontentexecutionfrominternet'' -ErrorAction SilentlyContinue).''blockcontentexecutionfrominternet''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':blockcontentexecutionfrominternet='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled. Microsoft PowerPoint 2016\PowerPoint Options\Security\Trust Center\Block macros from running in Office files from the Internet
