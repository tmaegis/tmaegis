id: TMA-INTUNE-OFFICE-2.11.8.7.2.2.5
title: Ensure 'Turn off Protected View for attachments opened from Outlook' is set to 'Disabled'
description: 'This policy setting determines if Word files in Outlook attachments open in Protected View. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) disableattachmentsinpv that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.11.8.7.2.2.5 Ensure 'Turn off Protected View for attachments opened from Outlook' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\word\security\protectedview'') -Name ''disableattachmentsinpv'' -ErrorAction SilentlyContinue).''disableattachmentsinpv''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':disableattachmentsinpv='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled. Microsoft Word 2016\Word Options\Security\Trust Center\Protected View\Turn Off Protected View for Attachments Opened From Outlook
