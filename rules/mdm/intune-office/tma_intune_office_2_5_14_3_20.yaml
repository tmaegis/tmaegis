id: TMA-INTUNE-OFFICE-2.5.14.3.20
title: Ensure 'Include Internet in Safe Zones for Automatic Picture Download' is set to 'Disabled'
description: 'This policy setting controls whether pictures and external content in HTML e-mail messages from untrusted senders on the Internet are downloaded without Outlook users explicitly choosing to do so. When Disabled, Outlook does not consider the Internet a safe zone, which means that Outlook will not automatically download content from external servers unless the sender is included in the Safe Senders list. Recipients can choose to download external content from untrusted senders on a message-by-message basis. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) internet that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.20 Ensure 'Include Internet in Safe Zones for Automatic Picture Download' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\mail'') -Name ''internet'' -ErrorAction SilentlyContinue).''internet''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':internet='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Include Internet in Safe Zones for Automatic Picture Download Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
