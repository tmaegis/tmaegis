id: TMA-INTUNE-OFFICE-2.1.1.3.2.4
title: Ensure 'Require that application add-ins are signed by Trusted Publisher' is set to 'Enabled'
description: 'This policy setting controls whether add-ins for the specified Office applications must be digitally signed by a trusted publisher. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) requireaddinsig that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.1.1.3.2.4 Ensure 'Require that application add-ins are signed by Trusted Publisher' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\access\security'') -Name ''requireaddinsig'' -ErrorAction SilentlyContinue).''requireaddinsig''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':requireaddinsig='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled. Microsoft Access 2016\Application Settings\Security\Trust Center\Require that application add-ins are signed by Trusted Publisher
