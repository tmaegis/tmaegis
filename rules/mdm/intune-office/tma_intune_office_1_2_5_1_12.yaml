id: TMA-INTUNE-OFFICE-1.2.5.1.12
title: Ensure 'Restrict File Download' is set to 'Enabled'
description: 'This policy setting suppresses file download prompts that are not user-initiated. In certain circumstances, websites can initiate file download prompts without interaction from users. This technique can allow websites to put unauthorized files on users'' hard drives if they click the wrong button and accept the download. The recommended state for this setting is: Enabled: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe. Audit: reads the registry value(s) excel.exe, exprwd.exe, groove.exe, msaccess.exe, mse7.exe, mspub.exe, onent.exe, outlook.exe, powerpnt.exe, pptview.exe, spDesign.exe, visio.exe, winproj.exe, winword.exe that the Intune policy writes under HKEY_LOCAL_MACHINE and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 1.2.5.1.12 Ensure 'Restrict File Download' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''groove.exe'' -ErrorAction SilentlyContinue).''groove.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''groove.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''excel.exe'' -ErrorAction SilentlyContinue).''excel.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''excel.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''mspub.exe'' -ErrorAction SilentlyContinue).''mspub.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''mspub.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet
    Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''powerpnt.exe'' -ErrorAction SilentlyContinue).''powerpnt.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''powerpnt.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''pptview.exe'' -ErrorAction SilentlyContinue).''pptview.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''pptview.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''visio.exe'' -ErrorAction SilentlyContinue).''visio.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''visio.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''winproj.exe''
    -ErrorAction SilentlyContinue).''winproj.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''winproj.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''winword.exe'' -ErrorAction SilentlyContinue).''winword.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''winword.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''outlook.exe'' -ErrorAction SilentlyContinue).''outlook.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''outlook.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''spDesign.exe'' -ErrorAction SilentlyContinue).''spDesign.exe''; if (-not ($null -ne $v
    -and @(1) -contains [int64]$v)) { $bad += ''spDesign.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''exprwd.exe'' -ErrorAction SilentlyContinue).''exprwd.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''exprwd.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''msaccess.exe'' -ErrorAction SilentlyContinue).''msaccess.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''msaccess.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''onent.exe'' -ErrorAction SilentlyContinue).''onent.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''onent.exe='' + $v }; $v = (Get-ItemProperty
    -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_FILEDOWNLOAD'' -Name ''mse7.exe'' -ErrorAction SilentlyContinue).''mse7.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''mse7.exe='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Check all applications: Microsoft Office 2016 (Machine)\Security Settings\IE Security\Restrict File Download'
