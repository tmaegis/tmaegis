id: TMA-INTUNE-OFFICE-2.5.1.5.2
title: Ensure 'Do not include Internet Calendar integration in Outlook' is set to 'Enabled'
description: 'This policy setting controls Internet Calendar integration in Outlook. The Internet Calendar feature in Outlook enables users to publish calendars online (using the webcal:// protocol) and subscribe to calendars that others have published. When users subscribe to an Internet calendar, Outlook queries the calendar at regular intervals and downloads any changes as they are posted. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) disable that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.1.5.2 Ensure 'Do not include Internet Calendar integration in Outlook' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\webcal'') -Name ''disable'' -ErrorAction SilentlyContinue).''disable''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':disable='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Account Settings\Internet Calendars\Do not include Internet Calendar integration in Outlook'
