id: TMA-INTUNE-OFFICE-2.5.14.1.4
title: Ensure 'Do not permit download of content from safe zones' is set to 'Disabled'
description: 'This policy setting controls whether Outlook automatically downloads content from safe zones when displaying messages. Note: This policy setting is backwards. Despite the name, disabling this policy setting prevents the download of content from safe zones and enabling the policy setting allows it. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) unblocksafezone that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.1.4 Ensure 'Do not permit download of content from safe zones' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\mail'') -Name ''unblocksafezone'' -ErrorAction SilentlyContinue).''unblocksafezone''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':unblocksafezone='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Security\Automatic Picture Download Settings\Do not permit download of content from safe zones'
