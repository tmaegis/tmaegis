id: TMA-INTUNE-OFFICE-2.3.38.1.1
title: Ensure 'Improve Proofing Tools' is set to 'Disabled'
description: 'This policy setting controls whether the Help Improve Proofing Tools feature sends usage data to Microsoft. The Help Improve Proofing Tools feature collects data about use of the Proofing Tools, such as additions to the custom dictionary, and sends it to Microsoft. After about six months, the feature stops sending data to Microsoft and deletes the data collection file from the user''s computer. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) ptwoptin that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 2
severity: low
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.38.1.1 Ensure 'Improve Proofing Tools' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\ptwatson'') -Name ''ptwoptin'' -ErrorAction SilentlyContinue).''ptwoptin''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':ptwoptin='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Office 2016\Tools | Options | Spelling\Proofing Data Collection\Improve Proofing Tools'
