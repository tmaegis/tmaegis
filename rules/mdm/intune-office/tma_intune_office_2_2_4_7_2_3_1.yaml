id: TMA-INTUNE-OFFICE-2.2.4.7.2.3.1
title: Ensure 'Always open untrusted database files in Protected View' is set to 'Enabled'
description: 'This policy setting controls whether database files (.dbf) opened from an untrusted location are always opened in Protected View. Note: This policy setting only applies to subscription versions of Office, such as Microsoft 365 Apps for enterprise. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) enabledatabasefileprotectedview that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.7.2.3.1 Ensure 'Always open untrusted database files in Protected View' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security\protectedview'') -Name ''enabledatabasefileprotectedview'' -ErrorAction SilentlyContinue).''enabledatabasefileprotectedview''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':enabledatabasefileprotectedview='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled. Microsoft Excel 2016\Excel Options\Security\Trust Center\Protected View\Always open untrusted database files in Protected View
