id: TMA-INTUNE-OFFICE-2.5.14.3.29
title: 'Ensure ''Set Outlook object model custom actions execution prompt'' is set to ''Enabled: Automatically Deny'''
description: 'This policy setting controls whether Outlook prompts users before executing a custom action. Custom actions add functionality to Outlook that can be triggered as part of a rule. Among other possible features, custom actions can be created that reply to messages in ways that circumvent the Outlook model''s programmatic send protections. The recommended state for this setting is: Enabled: Automatically Deny. Audit: reads the registry value(s) promptoomcustomaction that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.29 Ensure ''Set Outlook object model custom actions execution prompt'' is set to ''Enabled: Automatically Deny'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''promptoomcustomaction'' -ErrorAction SilentlyContinue).''promptoomcustomaction''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':promptoomcustomaction='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Automatically Deny: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Set Outlook object model custom actions execution prompt Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
