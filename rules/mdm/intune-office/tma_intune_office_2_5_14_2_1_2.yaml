id: TMA-INTUNE-OFFICE-2.5.14.2.1.2
title: 'Ensure ''Missing CRLs'' is set to ''Enabled: Error'''
description: 'This policy setting controls whether Outlook considers a missing certificate revocation list (CRL) a warning or an error. Digital certificates contain an attribute that shows where the corresponding CRL is located. CRLs contain lists of digital certificates that have been revoked by their controlling certification authorities (CAs), typically because the certificates were issued improperly, or their associated private keys were compromised. The recommended state for this setting is: Enabled: Error. Audit: reads the registry value(s) sigstatusnocrl that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.1.2 Ensure ''Missing CRLs'' is set to ''Enabled: Error'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''sigstatusnocrl'' -ErrorAction SilentlyContinue).''sigstatusnocrl''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':sigstatusnocrl='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Error. Microsoft Outlook 2016\Security\Cryptography\Signature Status dialog box\Missing CRLs'
