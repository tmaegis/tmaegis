id: TMA-INTUNE-OFFICE-2.5.14.2.2
title: Ensure 'Do not display 'Publish to GAL' button' is set to 'Enabled'
description: 'This policy setting controls whether Outlook users can publish e-mail certificates to the Global Address List (GAL). The GAL contains information for all email users, distribution groups, and Exchange resources. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) publishtogaldisabled that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.2 Ensure 'Do not display 'Publish to GAL' button' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''publishtogaldisabled'' -ErrorAction SilentlyContinue).''publishtogaldisabled''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':publishtogaldisabled='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Security\Cryptography\Do not display ''Publish to GAL'' button'
