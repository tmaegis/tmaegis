id: TMA-INTUNE-OFFICE-2.3.6.2
title: Ensure 'Disable UI extending from documents and templates' is set to 'Enabled'
description: 'This policy setting controls whether Office applications load any custom user interface (UI) code included with a document or template. Office allows developers to extend the UI with customization code that is included in a document or template. The recommended state for this setting is: Enabled: Disallow in Word, Excel, PowerPoint, Access, Outlook, Publisher, Project, Visio, InfoPath. Audit: for every loaded user profile reads noextensibilitycustomizationfromdocument under ...\office\16.0\common\toolbars\<Word|Excel|PowerPoint|Access|Outlook|Publisher|Project|Visio|InfoPath> and requires 1.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.6.2 Ensure 'Disable UI extending from documents and templates' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $apps = @(''Word'',''Excel'',''PowerPoint'',''Access'',''Outlook'',''Publisher'',''Project'',''Visio'',''InfoPath''); Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $sid = $_.PSChildName; foreach ($a in $apps) { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $sid + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\'' + $a) -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if ($v -ne 1) { $bad += $sid + '':'' + $a + ''='' + $v } } }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Disallow in Word, Excel, PowerPoint, Access, Outlook, Publisher, Project, Visio, InfoPath: Microsoft Office 2016\Customize\Disable UI extending from documents and templates'
