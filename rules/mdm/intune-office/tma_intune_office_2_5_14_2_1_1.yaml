id: TMA-INTUNE-OFFICE-2.5.14.2.1.1
title: Ensure 'Attachment Secure Temporary Folder' is set to 'Disabled'
description: 'This policy setting allows administrators to specify a folder path for the Secure Temporary Files rather than using the one that is randomly generated by Outlook. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) outlooksecuretempfolder that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.1.1 Ensure 'Attachment Secure Temporary Folder' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''outlooksecuretempfolder'' -ErrorAction SilentlyContinue).''outlooksecuretempfolder''; if (-not ($null -eq $v)) { $_.PSChildName + '':outlooksecuretempfolder='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Security\Cryptography\Signature Status dialog box\Attachment Secure Temporary Folder'
