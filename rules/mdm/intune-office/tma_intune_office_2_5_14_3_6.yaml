id: TMA-INTUNE-OFFICE-2.5.14.3.6
title: Ensure 'Allow hyperlinks in suspected phishing e- mail messages' is set to 'Disabled'
description: 'This policy setting controls whether hyperlinks in suspected phishing e-mail messages in Outlook are allowed. By default, Outlook handles suspicious messages in two ways: • If the Junk E-mail Filter does not consider a message to be spam but does consider it to be phishing, the message is left in the Inbox but any links in the message are disabled and users cannot use the Reply and Reply All functionality. In addition, any attachments in the suspicious message are blocked. • If the Junk E-mail Filter considers the message to be both spam and phishing, the message is automatically sent to the Junk E-mail folder. ... Audit: reads the registry value(s) junkmailenablelinks that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.6 Ensure 'Allow hyperlinks in suspected phishing e- mail messages' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\mail'') -Name ''junkmailenablelinks'' -ErrorAction SilentlyContinue).''junkmailenablelinks''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':junkmailenablelinks='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Allow hyperlinks in suspected phishing e-mail messages Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
