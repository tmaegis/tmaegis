id: TMA-INTUNE-OFFICE-2.2.4.7.2.5
title: 'Ensure ''Block Excel XLL Add-ins that come from an untrusted source'' is set to ''Enabled: Blocked'''
description: 'An Excel add-in is a collection of custom code and functionality that enhances Microsoft Excel''s capabilities. These add-ins can be created by third-party developers or by Excel users themselves. Once installed, they become part of Excel and can be used across different workbooks. .XLL Add-ins are native code add-ins written in C or C++ programming languages. They offer high performance and direct access to Excel''s internal functions, making them suitable for complex and computationally intensive tasks. The recommended state for this setting is: Enabled: Blocked. Audit: reads the registry value(s) blockxllfrominternet that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.7.2.5 Ensure ''Block Excel XLL Add-ins that come from an untrusted source'' is set to ''Enabled: Blocked'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security'') -Name ''blockxllfrominternet'' -ErrorAction SilentlyContinue).''blockxllfrominternet''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':blockxllfrominternet='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Excel 2016\Excel Options\Security\Trust Center\Block Excel XLL Add- ins that come from an untrusted source'
