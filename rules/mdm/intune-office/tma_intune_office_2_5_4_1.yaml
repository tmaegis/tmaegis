id: TMA-INTUNE-OFFICE-2.5.4.1
title: Ensure 'Do not allow Home Page URL to be set in folder Properties' is set to 'Enabled'
description: 'Users can set a URL to be used as the Home Page for a folder by entering the URL on the Home Page tab on the folder''s Properties dialog box. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) disable that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.4.1 Ensure 'Do not allow Home Page URL to be set in folder Properties' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\webview'') -Name ''disable'' -ErrorAction SilentlyContinue).''disable''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':disable='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Folder Home Pages for Outlook Special Folders\Do not allow Home Page URL to be set in folder Properties'
