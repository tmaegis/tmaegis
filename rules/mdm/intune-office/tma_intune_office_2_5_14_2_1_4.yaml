id: TMA-INTUNE-OFFICE-2.5.14.2.1.4
title: Ensure 'Promote Level 2 errors as errors, not warnings' is set to 'Disabled'
description: 'This policy setting allows the configuration of Level 2 errors as warnings instead of errors. Level 2 errors occur when the message signature appears to be valid, but there are other issues with the signature. Note: Potential Level 2 error conditions include the following: • Unknown Signature Algorithm • No Signing Certification Found • Bad Attribute Sets • No Issuer Certificate found • No CRL Found • Out-of-date CRL • Root Trust Problem • Out-of-date CTL The recommended state for this setting is: Disabled. Note: The title of the Group Policy text is slightly misleading. ... Audit: reads the registry value(s) promoteerrorsaswarnings that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.1.4 Ensure 'Promote Level 2 errors as errors, not warnings' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''promoteerrorsaswarnings'' -ErrorAction SilentlyContinue).''promoteerrorsaswarnings''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':promoteerrorsaswarnings='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Security\Cryptography\Signature Status dialog box\Promote Level 2 errors as errors, not warnings'
