id: TMA-INTUNE-OFFICE-2.5.10.11
title: Ensure 'Internet and network paths into hyperlinks' is set to 'Disabled'
description: 'This policy setting specifies whether Outlook automatically turns text that represents Internet and network paths into hyperlinks. This option can also be configured by selecting the "Internet and network paths with hyperlinks" check box that is available in Outlook. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) pgrfafo_25_1 that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 2
severity: low
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.11 Ensure 'Internet and network paths into hyperlinks' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\Office\16.0\Outlook\options\autoformat'') -Name ''pgrfafo_25_1'' -ErrorAction SilentlyContinue).''pgrfafo_25_1''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':pgrfafo_25_1='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Outlook Options\Internet and Network Paths into Hyperlinks'
