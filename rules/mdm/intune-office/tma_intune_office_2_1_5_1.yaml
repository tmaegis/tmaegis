id: TMA-INTUNE-OFFICE-2.1.5.1
title: Ensure 'Modal Trust Decision Only' is set to 'Disabled'
description: 'This policy setting controls how Access notifies users about untrusted components. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) modaltrustdecisiononly that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.1.5.1 Ensure 'Modal Trust Decision Only' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\access\security'') -Name ''modaltrustdecisiononly'' -ErrorAction SilentlyContinue).''modaltrustdecisiononly''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':modaltrustdecisiononly='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled. Microsoft Access 2016\Tools | Security\Modal Trust Decision Only
