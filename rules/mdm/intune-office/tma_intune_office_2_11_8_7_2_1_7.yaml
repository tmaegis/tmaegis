id: TMA-INTUNE-OFFICE-2.11.8.7.2.1.7
title: 'Ensure ''Word 95 binary documents and templates'' is set to ''Enabled: Open/Save blocked, use open policy'''
description: 'This policy setting determines whether users can open, view, edit, or save Word 95 binary documents and templates. By choosing the Open/Save blocked, use open policy, both the opening and saving of the file type will be blocked. The file will open based on the policy setting configured in the "default file block behavior" key. The recommended state for this setting is: Enabled: Open/Save blocked, use open policy. Audit: reads the registry value(s) word95files that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.11.8.7.2.1.7 Ensure ''Word 95 binary documents and templates'' is set to ''Enabled: Open/Save blocked, use open policy'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\word\security\fileblock'') -Name ''word95files'' -ErrorAction SilentlyContinue).''word95files''; if (-not ($null -ne $v -and @(2) -contains [int64]$v)) { $_.PSChildName + '':word95files='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Open/Save blocked, use open policy. Microsoft Word 2016\Word Options\Security\Trust Center\File Block Settings\Word 95 Binary Documents and Templates'
