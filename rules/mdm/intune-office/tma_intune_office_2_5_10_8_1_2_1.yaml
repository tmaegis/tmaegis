id: TMA-INTUNE-OFFICE-2.5.10.8.1.2.1
title: Ensure 'Access to published calendars' is set to 'Enabled'
description: 'This policy setting determines what restrictions apply to users who publish their calendars on Office.com or third-party World Wide Web Distributed Authoring and Versioning (WebDAV) servers. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) restrictedaccessonly that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.8.1.2.1 Ensure 'Access to published calendars' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\options\pubcal'') -Name ''restrictedaccessonly'' -ErrorAction SilentlyContinue).''restrictedaccessonly''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':restrictedaccessonly='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Outlook Options\Preferences\Calendar Options\Office.com Sharing Service\Access to published calendars'
