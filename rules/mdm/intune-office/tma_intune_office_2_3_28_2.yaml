id: TMA-INTUNE-OFFICE-2.3.28.2
title: Ensure 'Disable the Office client from polling the SharePoint Server for published links' is set to 'Enabled'
description: 'This policy setting controls whether Office applications can poll Office servers to retrieve lists of published links. Note: This policy setting applies to Microsoft SharePoint Server specifically. It does not apply to Microsoft SharePoint Foundation. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) linkpublishingdisabled that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.28.2 Ensure 'Disable the Office client from polling the SharePoint Server for published links' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\portal'') -Name ''linkpublishingdisabled'' -ErrorAction SilentlyContinue).''linkpublishingdisabled''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':linkpublishingdisabled='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Office 2016\Server Settings\Disable the Office client from polling the SharePoint Server for published links'
