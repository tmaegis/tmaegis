id: TMA-INTUNE-OFFICE-2.5.14.3.24
title: Ensure 'Prevent users from customizing attachment security settings' is set to 'Enabled'
description: 'This policy setting prevents users from overriding the set of attachments blocked by Outlook. Note: Outlook also checks the Level1Remove registry key (which could allow the user to save the file to disk) when this setting is specified. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) disallowattachmentcustomization that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.24 Ensure 'Prevent users from customizing attachment security settings' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook'') -Name ''disallowattachmentcustomization'' -ErrorAction SilentlyContinue).''disallowattachmentcustomization''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':disallowattachmentcustomization='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode > Prevent users from customizing attachment security settings Important: For this setting to apply, the Outlook Security Mode setting must be enabled in Microsoft Outlook 2016\Security\Security Form Settings with Use Outlook Security Group Policy selected, as set in this benchmark.'
