id: TMA-INTUNE-OFFICE-2.2.4.7.2.3.3
title: Ensure 'Do not open files in unsafe locations in Protected View' is set to 'Disabled'
description: 'This policy setting determines if files located in unsafe locations will open in Protected View. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) disableunsafelocationsinpv that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.7.2.3.3 Ensure 'Do not open files in unsafe locations in Protected View' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security\protectedview'') -Name ''disableunsafelocationsinpv'' -ErrorAction SilentlyContinue).''disableunsafelocationsinpv''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':disableunsafelocationsinpv='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled. Microsoft Excel 2016\Excel Options\Security\Trust Center\Protected View\Do Not Open Files in Unsafe Locations in Protected View
