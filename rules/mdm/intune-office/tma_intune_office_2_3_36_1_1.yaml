id: TMA-INTUNE-OFFICE-2.3.36.1.1
title: 'Ensure ''Conversion Service Options'' is set to ''Enabled: Do not allow to use Microsoft Conversion Service'''
description: 'This policy setting controls users'' access to the online features of Office 2016. The recommended state for this setting is: Enabled: Do not allow to use Microsoft Conversion Service Audit: reads the registry value(s) useconversionservices that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 2
severity: low
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.36.1.1 Ensure ''Conversion Service Options'' is set to ''Enabled: Do not allow to use Microsoft Conversion Service'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\internet'') -Name ''useconversionservices'' -ErrorAction SilentlyContinue).''useconversionservices''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':useconversionservices='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Do not allow to use Microsoft Conversion Service: Microsoft Office 2016\Tools | Options | General | Service Options...\Online Content\Conversion Service\Conversion Service Options'
