id: TMA-INTUNE-OFFICE-2.3.9.1
title: 'Ensure ''Document Information Panel Beaconing UI'' is set to ''Enabled: Always show UI'''
description: 'This policy setting controls whether users see a security warning when they open custom Document Information Panels that contain a Web beaconing threat. InfoPath can be used to create custom Document Information Panels that can be attached to Excel workbooks, PowerPoint presentations, and Word documents. The recommended state for this setting is: Enabled: Always show UI. Audit: reads the registry value(s) msoridcuxdocspropertypanelbeaconing that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.9.1 Ensure ''Document Information Panel Beaconing UI'' is set to ''Enabled: Always show UI'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\documentinformationpanel'') -Name ''msoridcuxdocspropertypanelbeaconing'' -ErrorAction SilentlyContinue).''msoridcuxdocspropertypanelbeaconing''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':msoridcuxdocspropertypanelbeaconing='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Always show UI: Microsoft Office 2016\Document Information Panel\Document Information Panel Beaconing UI'
