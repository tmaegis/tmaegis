id: TMA-INTUNE-OFFICE-2.5.11.1
title: Ensure 'Turn off Outlook Social Connector' is set to 'Enabled'
description: 'This policy setting allows the configuration of the Outlook Social Connector. The Outlook Social Connector allows users to work in Outlook while staying up to date on the status and activities of their friends and contacts, whether they''re from an organization, or from social networking sites on the Internet, like Facebook and LinkedIn. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) runosc that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.11.1 Ensure 'Turn off Outlook Social Connector' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\outlook\socialconnector'') -Name ''runosc'' -ErrorAction SilentlyContinue).''runosc''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':runosc='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Outlook Social Connector\Turn off Outlook Social Connector'
