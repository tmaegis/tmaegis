id: TMA-INTUNE-OFFICE-2.2.4.7.2.7
title: 'Ensure ''VBA Macro Notification Settings'' is set to ''Enabled: Disable all except digitally signed macros'''
description: 'This policy setting controls how the specified applications warn users when Visual Basic for Applications (VBA) macros or Excel 4.0 (XLM) macros are present. Multiple Office apps support VBA macros, but XLM macros are only supported by Excel. Disable all except digitally signed macros: The application displays the Trust Bar for digitally signed macros, allowing users to enable them or leave them disabled. Any unsigned macros are disabled, and users are not notified. The recommended state for this setting is: Enabled: Disable all except digitally signed macros. Audit: reads the registry value(s) vbawarnings that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.7.2.7 Ensure ''VBA Macro Notification Settings'' is set to ''Enabled: Disable all except digitally signed macros'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security'') -Name ''vbawarnings'' -ErrorAction SilentlyContinue).''vbawarnings''; if (-not ($null -ne $v -and @(3) -contains [int64]$v)) { $_.PSChildName + '':vbawarnings='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Disable all except digitally signed macros. Microsoft Excel 2016\Excel Options\Security\Trust Center\VBA Macro Notification Settings'
