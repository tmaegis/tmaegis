id: TMA-INTUNE-OFFICE-2.5.10.6.1.2
title: Ensure 'Do not allow folders in non-default stores to be set as folder home pages' is set to 'Enabled'
description: 'This setting allows unblocking of folder home pages for folders in non-default stores. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) nondefaultstorescript that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.6.1.2 Ensure 'Do not allow folders in non-default stores to be set as folder home pages' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''nondefaultstorescript'' -ErrorAction SilentlyContinue).''nondefaultstorescript''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':nondefaultstorescript='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Outlook Options\Other\Advanced\Do not allow folders in non-default stores to be set as folder home pages'
