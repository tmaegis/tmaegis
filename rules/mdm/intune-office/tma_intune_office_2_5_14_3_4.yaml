id: TMA-INTUNE-OFFICE-2.5.14.3.4
title: Ensure 'Outlook Security Mode' is set to 'Enabled'
description: 'This policy setting enables the use of a custom set of security settings that are enforced in Outlook. This must be enabled if other Outlook security policy settings mentioned in this guide are to be applied. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) adminsecuritymode that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.3.4 Ensure 'Outlook Security Mode' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''adminsecuritymode'' -ErrorAction SilentlyContinue).''adminsecuritymode''; if (-not ($null -ne $v -and @(3) -contains [int64]$v)) { $_.PSChildName + '':adminsecuritymode='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Outlook 2016\Security\Security Form Settings\Outlook Security Mode'
