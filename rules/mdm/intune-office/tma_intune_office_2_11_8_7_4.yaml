id: TMA-INTUNE-OFFICE-2.11.8.7.4
title: Ensure 'Turn off file validation' is set to 'Disabled'
description: 'This policy setting allows you to turn off the file validation feature. Office Binary Documents (97-2003) are checked to see if they conform against the file format schema before they are opened. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) enableonload that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.11.8.7.4 Ensure 'Turn off file validation' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\word\security\filevalidation'') -Name ''enableonload'' -ErrorAction SilentlyContinue).''enableonload''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':enableonload='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled. Microsoft Word 2016\Word Options\Security\Turn off file validation
