id: TMA-INTUNE-OFFICE-2.3.27.18
title: Ensure 'Protect document metadata for rights managed Office Open XML Files' is set to 'Enabled'
description: 'This policy setting determines whether metadata is encrypted in Office Open XML files that are protected by Information Rights Management (IRM). The recommended state for this setting is: Enabled. Audit: reads the registry value(s) drmencryptproperty that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.27.18 Ensure 'Protect document metadata for rights managed Office Open XML Files' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\security'') -Name ''drmencryptproperty'' -ErrorAction SilentlyContinue).''drmencryptproperty''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':drmencryptproperty='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Office 2016\Security Settings\Protect document metadata for rights managed Office Open XML Files'
