id: TMA-INTUNE-OFFICE-2.5.14.2.4
title: 'Ensure ''Message Formats'' is set to ''Enabled: S/MIME'''
description: 'This policy setting controls which message encryption formats Outlook can use. Outlook supports three formats for encrypting and signing messages: S/MIME, Exchange, and Fortezza. The recommended state for this setting is: Enabled: S/MIME. Audit: reads the registry value(s) msgformats that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.14.2.4 Ensure ''Message Formats'' is set to ''Enabled: S/MIME'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\outlook\security'') -Name ''msgformats'' -ErrorAction SilentlyContinue).''msgformats''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':msgformats='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: S/MIME: Microsoft Outlook 2016\Security\Cryptography\Message Formats'
