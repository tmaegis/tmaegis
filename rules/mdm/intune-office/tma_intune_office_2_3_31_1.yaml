id: TMA-INTUNE-OFFICE-2.3.31.1
title: Ensure 'Legacy format signatures' is set to 'Disabled'
description: 'This policy setting controls whether users can apply binary format digital signatures to Office 97-2003 documents. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) enablecreationofweakxpsignatures that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: high
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.31.1 Ensure 'Legacy format signatures' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\signatures'') -Name ''enablecreationofweakxpsignatures'' -ErrorAction SilentlyContinue).''enablecreationofweakxpsignatures''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':enablecreationofweakxpsignatures='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Office 2016\Signing\Legacy format signatures'
