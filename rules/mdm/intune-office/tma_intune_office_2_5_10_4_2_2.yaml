id: TMA-INTUNE-OFFICE-2.5.10.4.2.2
title: Ensure 'Plain Text Options' is set to 'Disabled'
description: 'This policy setting controls how plain text messages are formatted when they are sent from Outlook. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) message plain format mime that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.5.10.4.2.2 Ensure 'Plain Text Options' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\Office\16.0\Outlook\options\mail'') -Name ''message plain format mime'' -ErrorAction SilentlyContinue).''message plain format mime''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':message plain format mime='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft Outlook 2016\Outlook Options\Mail Format\Internet Formatting\Plain text options'
