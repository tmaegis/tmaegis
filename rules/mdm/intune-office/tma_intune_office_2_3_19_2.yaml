id: TMA-INTUNE-OFFICE-2.3.19.2
title: Ensure 'Always expand groups in Office when restricting permission for documents' is set to 'Enabled'
description: 'This policy setting controls whether group names automatically expand to display all the members of the group when selected in the Permissions dialog box. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) autoexpanddlsenable that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.19.2 Ensure 'Always expand groups in Office when restricting permission for documents' is set to 'Enabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\drm\autoexpanddls'') -Name ''autoexpanddlsenable'' -ErrorAction SilentlyContinue).''autoexpanddlsenable''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':autoexpanddlsenable='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Microsoft Office 2016\Manage Restricted Permissions\Always expand groups in office when restricting permission for documents'
