id: TMA-INTUNE-OFFICE-2.3.27.7
title: 'Ensure ''Automation Security'' is set to ''Enabled: Disable Macros by default'''
description: 'This policy setting controls whether macros can run in an Office application that is opened programmatically by another application. Policy setting option: Disable macros by default - All macros are disabled in the programmatically opened application. The recommended state for this setting is: Enabled: Disable Macros by default. Audit: reads the registry value(s) automationsecurity that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.27.7 Ensure ''Automation Security'' is set to ''Enabled: Disable Macros by default'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\common\security'') -Name ''automationsecurity'' -ErrorAction SilentlyContinue).''automationsecurity''; if (-not ($null -ne $v -and @(3) -contains [int64]$v)) { $_.PSChildName + '':automationsecurity='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Disable Macros by default: Microsoft Office 2016\Security Settings\Automation Security'
