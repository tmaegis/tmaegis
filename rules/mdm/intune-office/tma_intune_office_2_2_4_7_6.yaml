id: TMA-INTUNE-OFFICE-2.2.4.7.6
title: 'Ensure ''WEBSERVICE Function Notification Settings'' is set to ''Enabled: Disable all without notification'''
description: 'This policy setting controls how Excel will warn users when WEBSERVICE functions are present. When selecting the option "Disable all with notification" the application displays the Trust Bar for all WEBSERVICE functions. This option enforces the default configuration in Office. The recommended state for this setting is: Enabled: Disable all without notification or Enabled: Disable all with notification. Audit: reads the registry value(s) webservicefunctionwarnings that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.2.4.7.6 Ensure ''WEBSERVICE Function Notification Settings'' is set to ''Enabled: Disable all without notification'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security'') -Name ''webservicefunctionwarnings'' -ErrorAction SilentlyContinue).''webservicefunctionwarnings''; if (-not ($null -ne $v -and @(1,2) -contains [int64]$v)) { $_.PSChildName + '':webservicefunctionwarnings='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Disable all without notification or Enabled: Disable all with notification. Microsoft Excel 2016\Excel Options\Security\WEBSERVICE Function Notification Settings'
