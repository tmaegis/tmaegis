id: TMA-INTUNE-OFFICE-1.1.1.1
title: 'Ensure ''Block Flash activation in Office documents'' is set to ''Enabled: Block all activation'''
description: 'This policy setting controls whether the Adobe Flash control can be activated by Office documents. Note that activation blocking applies only within Office processes. "Block all activation" prevents the Flash control from being loaded, whether directly referenced by the document or indirectly by another embedded object. The recommended state for this setting is: Enabled: Block all activation. TMAegis could not derive a reliable registry check from the benchmark text, so this recommendation is a manual review item with the audit steps.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- manual-review
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 1.1.1.1 Ensure ''Block Flash activation in Office documents'' is set to ''Enabled: Block all activation'''
audit:
  type: manual
  command: Navigate to the UI Path articulated in the Remediation section and confirm it is set as prescribed. This setting is backed by the following registry location with a value of Block all Flash activation. HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\office\Common\COM Compatibility\Comment
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Block all activation. Administrative Templates\MS Security Guide\Block Flash activation in Office documents'
