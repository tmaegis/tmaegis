id: TMA-INTUNE-OFFICE-2.1.4.1
title: 'Ensure ''Default file format'' is set to ''Enabled: Access 2007'''
description: 'This policy setting controls whether new database files are created in the new Access format or in a format used by earlier versions of Access. The recommended state for this setting is: Enabled: Access 2007 Audit: reads the registry value(s) default file format that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.1.4.1 Ensure ''Default file format'' is set to ''Enabled: Access 2007'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\access\settings'') -Name ''default file format'' -ErrorAction SilentlyContinue).''default file format''; if (-not ($null -ne $v -and @(12) -contains [int64]$v)) { $_.PSChildName + '':default file format='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: Access 2007. Microsoft Access 2016\Miscellaneous\Default file format'
