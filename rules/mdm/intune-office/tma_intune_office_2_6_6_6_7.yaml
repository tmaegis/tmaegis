id: TMA-INTUNE-OFFICE-2.6.6.6.7
title: Ensure 'Unblock automatic download of linked images' is set to 'Disabled'
description: 'This policy setting determines whether PowerPoint automatically downloads links from external sources. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) downloadimages that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.6.6.6.7 Ensure 'Unblock automatic download of linked images' is set to 'Disabled'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\office\16.0\powerpoint\security'') -Name ''downloadimages'' -ErrorAction SilentlyContinue).''downloadimages''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $_.PSChildName + '':downloadimages='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Disabled: Microsoft PowerPoint 2016\PowerPoint Options\Security\Unblock automatic download of linked images'
