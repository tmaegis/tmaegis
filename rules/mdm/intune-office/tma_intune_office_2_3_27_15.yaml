id: TMA-INTUNE-OFFICE-2.3.27.15
title: 'Ensure ''Load Controls in Forms3'' is set to ''Enabled: 4'''
description: 'This policy setting determines how ActiveX controls in UserForms should be initialized based upon whether they are Safe For Initialization (SFI) or Unsafe for Initialization (UFI). Policy setting option options for load controls in Forms3: 4 - For a UFI signed control, load with the default properties of the control. For an SFI signed control, load in safe mode (considered to be the safest mode). The recommended state for this setting is: Enabled: 4. Audit: reads the registry value(s) loadcontrolsinforms that the Intune policy writes for every loaded user profile (HKEY_USERS) and prints compliant only when each satisfies the benchmark value.'
target: intune-office
level: 1
severity: medium
tags:
- intune-office
- intune
- registry
reference: 'CIS Microsoft Intune for Office Benchmark v1.1.0 - 2.3.27.15 Ensure ''Load Controls in Forms3'' is set to ''Enabled: 4'''
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\vba\security'') -Name ''loadcontrolsinforms'' -ErrorAction SilentlyContinue).''loadcontrolsinforms''; if (-not ($null -ne $v -and @(4) -contains [int64]$v)) { $_.PSChildName + '':loadcontrolsinforms='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended state via configuration profiles, set the following Settings Catalog path to Enabled: 4: Microsoft Office 2016\Security Settings\Load Controls in Forms3'
