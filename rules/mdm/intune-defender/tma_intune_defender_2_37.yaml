id: TMA-INTUNE-DEFENDER-2.37
title: Ensure 'PUA Protection' is set to 'PUA Protection on'
description: 'This policy setting controls detection and action for Potentially Unwanted Applications (PUA), which are sneaky unwanted application bundlers or their bundled applications, that can deliver adware or malware. The recommended state for this setting is: PUA Protection on. Detected items are blocked. They will show in history along with other threats.. For more information, see this link: Block potentially unwanted applications with Microsoft Defender Antivirus | Microsoft Docs Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.37 Ensure 'PUA Protection' is set to 'PUA Protection on'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\PolicyManager'' -Name ''PUAProtection'' -ErrorAction SilentlyContinue).''PUAProtection''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''PUAProtection='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to PUA Protection on. Detected items are blocked. They will show in history along with other threats.: Defender\PUA Protection To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure PUA Protection to PUA Protection on. Detected items are blocked. They will show in history along with other threats.'
