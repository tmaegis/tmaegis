id: TMA-INTUNE-DEFENDER-2.27
title: Ensure 'Check For Signatures Before Running Scan' is set to 'Enabled'
description: 'This policy setting controls whether to check for new virus and spyware security intelligence before running a scan. The recommended state for this setting is: Enabled. Note: This setting applies to scheduled scans and has no effect on scans that are initiated manually from the user interface or to the ones that have been started from the command line using mpcmdrun -Scan. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: high
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.27 Ensure 'Check For Signatures Before Running Scan' is set to 'Enabled'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''CheckForSignaturesBeforeRunningScan'' -ErrorAction SilentlyContinue).''CheckForSignaturesBeforeRunningScan''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''CheckForSignaturesBeforeRunningScan='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Enabled: Defender\Check For Signatures Before Running Scan To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure Check For Signatures Before Running Scan to Enabled'
