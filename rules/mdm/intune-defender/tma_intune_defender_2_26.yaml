id: TMA-INTUNE-DEFENDER-2.26
title: 'Ensure ''ASR: Use advanced protection against ransomware'' is set to ''Audit'' or higher'
description: 'This rule provides an extra layer of protection against ransomware. It uses both client and cloud heuristics to determine whether a file resembles ransomware. This rule doesn''t block files that have one or more of the following characteristics: • The file has already been found to be unharmful in the Microsoft cloud. • The file is a valid signed file. • The file is prevalent enough to not be considered as ransomware. • The rule tends to err on the side of caution to prevent ransomware. The recommended state for this setting is: Audit. Configuring this setting to Block also conforms to the benchmark. Audit: reads the Intune PolicyManager ASR rules value (via the WinningProvider GUID) and requires the rule entry c1db55ab-c21a-4637-bb3f-a12568109d35=1 or c1db55ab-c21a-4637-bb3f-a12568109d35=2 (Block, or Audit for the "Audit or higher" wording).'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: 'CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.26 Ensure ''ASR: Use advanced protection against ransomware'' is set to ''Audit'' or higher'
audit:
  type: registry
  shell: powershell
  command: '$p = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\PolicyManager\current\device\Defender'' -Name ''AttackSurfaceReductionRules_WinningProvider'' -ErrorAction SilentlyContinue).''AttackSurfaceReductionRules_WinningProvider''; if (-not $p) { ''non-compliant: no ASR WinningProvider'' } else { $p = ([string]$p).Trim(''{}''); $k = ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\PolicyManager\Providers\'' + $p + ''\default\Device\Defender''; if (-not (Test-Path $k)) { $k = ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\PolicyManager\Providers\{'' + $p + ''}\default\Device\Defender'' }; $v = (Get-ItemProperty -Path $k -Name ''AttackSurfaceReductionRules'' -ErrorAction SilentlyContinue).''AttackSurfaceReductionRules''; $have = @(([string]$v) -split ''\|'' | ForEach-Object { $_.Trim().ToLower() }); $want = @(''c1db55ab-c21a-4637-bb3f-a12568109d35=1'',''c1db55ab-c21a-4637-bb3f-a12568109d35=2''); if (@($want | Where-Object { $have -contains $_ }).Count -gt
    0) { ''compliant'' } else { ''non-compliant: '' + $v } }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Audit or Block. Defender\Use advanced protection against ransomware
