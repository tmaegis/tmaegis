id: TMA-INTUNE-DEFENDER-2.46
title: Ensure 'Signature Update Interval' is set to '4' or fewer, but not '0'
description: 'This policy setting configures an interval at which to check for security intelligence updates. Security intelligence updates are the continuously updated packages that Microsoft Defender Antivirus uses to recognize, classify, and block the latest malware, spyware, unwanted software, and potentially harmful behaviors. The recommended state for this setting is: 4 or fewer, but not 0. Note: The time value is represented as the number of hours between update checks. Valid values range from 1 (every hour) to 24 (once per day). Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: high
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.46 Ensure 'Signature Update Interval' is set to '4' or fewer, but not '0'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\SignatureUpdates'' -Name ''SignatureUpdateInterval'' -ErrorAction SilentlyContinue).''SignatureUpdateInterval''; if (-not ($null -ne $v -and @(4,3,2,1) -contains [int64]$v)) { $bad += ''SignatureUpdateInterval='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to 4 or fewer, but not 0: Defender\Signature Update Interval To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure Signature Update Interval to 4 or fewer, but not 0'
