id: TMA-INTUNE-DEFENDER-1.3.2
title: Ensure 'Configure the 'Block at First Sight' feature' is set to 'Enabled'
description: 'This policy setting configures whether the device checks (in real time) with the Microsoft Active Protection Service (MAPS) before allowing certain content to be run or accessed. The block at first sight feature works when Microsoft Defender Antivirus encounters a suspicious but undetected file. It then queries the Microsoft cloud protection backend and applies heuristics, machine learning, and automated analysis of the file to determine whether the files are malicious. The recommended state for this setting is: Enabled. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 1.3.2 Ensure 'Configure the 'Block at First Sight' feature' is set to 'Enabled'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'' -Name ''DisableBlockAtFirstSeen'' -ErrorAction SilentlyContinue).''DisableBlockAtFirstSeen''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''DisableBlockAtFirstSeen='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Enabled: Administrative Templates\Microsoft Defender Antivirus\MAPS\Configure the ''Block at First Sight'' feature'
