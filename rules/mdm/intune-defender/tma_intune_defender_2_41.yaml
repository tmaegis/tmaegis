id: TMA-INTUNE-DEFENDER-2.41
title: 'Ensure ''Remote Encryption Protection Configured State'' is set to ''Audit: Generate EDR detections without blocking'' or higher'
description: 'This policy setting sets the mode for Remote Encryption Protection in Microsoft Defender Antivirus, which can detect and block attempts to replace local files with encrypted versions from another device. The recommended state for this setting is: Audit: Generate EDR detections without blocking. Configuring this setting to Block: Prevent suspicious and malicious behaviors also conforms to the benchmark. Note: Configuring the value to either Default or Off does not conform to this benchmark. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: high
tags:
- intune-defender
- intune
- registry
reference: 'CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.41 Ensure ''Remote Encryption Protection Configured State'' is set to ''Audit: Generate EDR detections without blocking'' or higher'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\PolicyManager'' -Name ''RemoteEncryptionProtectionConfiguredState'' -ErrorAction SilentlyContinue).''RemoteEncryptionProtectionConfiguredState''; if (-not ($null -ne $v -and @(2,1) -contains [int64]$v)) { $bad += ''RemoteEncryptionProtectionConfiguredState='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Audit: Generate EDR detections without blocking or Block: Prevent suspicious and malicious behaviors. Defender\Remote Encryption Protection Configured State'
