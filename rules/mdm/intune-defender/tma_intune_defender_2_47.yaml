id: TMA-INTUNE-DEFENDER-2.47
title: 'Ensure ''Submit Samples Consent'' is set to ''Enabled: Send safe samples automatically'' or higher'
description: 'This policy setting configures the behavior of samples sent to Microsoft for submission when opt-in for MAPS telemetry is set. The recommended state for this setting is: Enabled: Send safe samples automatically or Enabled: Send all samples automatically. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: 'CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.47 Ensure ''Submit Samples Consent'' is set to ''Enabled: Send safe samples automatically'' or higher'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'' -Name ''SubmitSamplesConsent'' -ErrorAction SilentlyContinue).''SubmitSamplesConsent''; if (-not ($null -ne $v -and @(1,3) -contains [int64]$v)) { $bad += ''SubmitSamplesConsent='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Enabled: Send safe samples automatically or Enabled: Send all samples automatically: Defender\Submit Samples Consent To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure Submit Samples Consent to Enabled: Send safe samples automaticallyorEnabled: Send all samples automatically`'
