id: TMA-INTUNE-DEFENDER-2.36
title: Ensure 'Oobe Enable Rtp And Sig Update' is set to 'Enabled'
description: 'This policy setting configures whether Real-time Protection and Security Intelligence Updates are enabled during the Out of Box experience (OOBE). The recommended state for this setting is: If you enable this setting, real- time protection and Security Intelligence Updates are enabled during OOBE.. Note: As of the publication of this Benchmark, the setting configuration state in Intune is the sentence above after The recommended state for this setting is: and not Enabled as the title states. This was done to keep title length to a minimum. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.36 Ensure 'Oobe Enable Rtp And Sig Update' is set to 'Enabled'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\PolicyManager'' -Name ''OobeEnableRtpAndSigUpdate'' -ErrorAction SilentlyContinue).''OobeEnableRtpAndSigUpdate''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''OobeEnableRtpAndSigUpdate='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to If you enable this setting, real-time protection and Security Intelligence Updates are enabled during OOBE.. Defender\Oobe Enable Rtp And Sig Update
