id: TMA-INTUNE-DEFENDER-2.3
title: Ensure 'Allow Cloud Protection' is set to 'Allowed'
description: 'This policy setting configures Microsoft Active Protection Service (MAPS). Microsoft MAPS is designed to help Microsoft continually update and improve definitions of malware, spyware and other potentially unwanted software and to help Microsoft improve Windows Defender and related technologies. The recommended state for this setting is: Allowed. Turns on Cloud Protection.. Audit: SpynetReporting under HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet must be absent or 2.'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.3 Ensure 'Allow Cloud Protection' is set to 'Allowed'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'' -Name ''SpynetReporting'' -ErrorAction SilentlyContinue).''SpynetReporting''; if (-not ($null -eq $v -or @(2) -contains [int64]$v)) { $bad += ''SpynetReporting='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Allowed. Turns on Cloud Protection.. Defender\Allow Cloud Protection To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure Allow Cloud Protection to Allowed. Turns on Cloud Protection.'
