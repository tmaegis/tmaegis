id: TMA-INTUNE-DEFENDER-1.10.1
title: Ensure 'Configure Watson events' is set to 'Disabled'
description: 'This policy setting determines whether Watson events are sent to Microsoft. Watson events are the reports that get sent to Microsoft when a program or service crashes or fails, including the possibility of automatic submission. The recommended state for this setting is: Disabled. Audit: reads the registry value(s) behind this Defender policy (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender) and prints compliant only when each satisfies the benchmark value. Policy delivered by Intune only appears here once it has been applied to the device.'
target: intune-defender
level: 2
severity: low
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 1.10.1 Ensure 'Configure Watson events' is set to 'Disabled'
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Reporting'' -Name ''DisableGenericRePorts'' -ErrorAction SilentlyContinue).''DisableGenericRePorts''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableGenericRePorts='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
  shell: powershell
remediation:
  type: iac_patch
  command: To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Disabled. Administrative Templates\Windows Components\Microsoft Defender Antivirus\Reporting\Configure Watson events
