id: TMA-INTUNE-DEFENDER-2.49
title: Ensure 'Remediation action for High severity threats' is set to 'Quarantine or Remove'
description: 'This policy setting configures which automatic remediation action Microsoft Defender Antivirus will take for each threat alert level detection. The recommended state for this setting is: Quarantine. Moves files to quarantine. Configuring this setting to Remove. Removes files from system. also conforms to the benchmark. Audit: value 4 under ...\Windows Defender\Threats\ThreatSeverityDefaultAction must be 2 (Quarantine) or 3 (Remove).'
target: intune-defender
level: 1
severity: medium
tags:
- intune-defender
- intune
- registry
reference: CIS Microsoft Intune for Microsoft Defender Antivirus Benchmark v1.0.0 - 2.49 Ensure 'Remediation action for High severity threats' is set to 'Quarantine or Remove'
audit:
  type: registry
  shell: powershell
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction'' -Name ''4'' -ErrorAction SilentlyContinue).''4''; if (-not ($null -ne $v -and @(''2'',''3'') -contains [string]$v)) { $bad += ''4='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration via configuration profiles, set the following Settings Catalog path to Quarantine. Moves files to quarantine. or Remove. Removes files from system.: Defender\Remediation action for High severity threats To establish the recommended configuration via Endpoint Security Blade: 1. Navigate to Endpoint Security 2. Click Antivirus 3. Click Create Profile 4. Select Windows for the Platform and Microsoft Defender Antivirus for Profile 5. Name the profile 6. Configure Remediation action for High severity threats to Quarantine. Moves files to quarantine or Remove. Removes files from system.'
