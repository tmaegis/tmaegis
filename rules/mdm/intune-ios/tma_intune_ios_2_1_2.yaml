id: TMA-INTUNE-IOS-2.1.2
title: Ensure "Force AirDrop Unmanaged" is set to "True"
description: This forces AirDrop to be considered an unmanaged drop target. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.1.2 Ensure "Force AirDrop Unmanaged" is set to "True"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Verify that Force AirDrop Unmanaged is present and set to True. On the device: Confirm Sharing managed documents using AirDrop not allowed is displayed under Restrictions'
remediation:
  type: iac_patch
  command: 'Intune admin center: Set Force AirDrop Unmanaged to True'
