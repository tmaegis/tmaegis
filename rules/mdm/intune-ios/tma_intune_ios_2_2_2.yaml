id: TMA-INTUNE-IOS-2.2.2
title: Ensure "Require Safari fraud warnings" is set to "Yes"
description: This enforces the feature to display fraud warnings within the Safari web browser. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.2.2 Ensure "Require Safari fraud warnings" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Built-in apps heading; Verify that Require Safari fraud warnings is present and set to Yes. On the device: Tap Restrictions; Confirm Safari fraud warning enforced is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Built-in apps heading; Set Require Safari fraud warnings to Yes'
