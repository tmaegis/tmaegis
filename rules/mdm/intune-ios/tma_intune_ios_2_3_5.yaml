id: TMA-INTUNE-IOS-2.3.5
title: Ensure "Block iCloud Photos sync" is set to "Yes"
description: This prevents photo stream syncing to iCloud. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.3.5 Ensure "Block iCloud Photos sync" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Cloud and Storage heading; Verify that Block iCloud Photos sync is present and set to Yes. On the device: Tap Restrictions; Confirm Photo Stream not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Cloud and Storage heading; Set Block iCloud Photos sync to Yes'
