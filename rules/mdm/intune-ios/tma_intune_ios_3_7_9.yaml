id: TMA-INTUNE-IOS-3.7.9
title: Ensure "Block password sharing" is set to "Yes"
description: This restriction prevents sharing credentials between devices, such as via AirDrop. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.7.9 Ensure "Block password sharing" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Block password sharing is present and set to Yes. On the device: Tap Restrictions; Confirm Password Sharing is not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Block password sharing to Yes'
