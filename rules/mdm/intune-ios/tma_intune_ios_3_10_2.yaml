id: TMA-INTUNE-IOS-3.10.2
title: Ensure the ability to sync with computers has been blocked
description: This recommendation prevents the transfer of data to and from the device. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.10.2 Ensure the ability to sync with computers has been blocked
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select iOS/iPadOS; Select iOS/iPadOS enrollment; Select Enrollment program tokens; Select the enrollment token which applies to the iOS/iPadOS device; Select Profiles; Select Properties; Ensure Sync with computers is set to Deny All This restriction can not be audited from the device'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select iOS/iPadOS; Select iOS/iPadOS enrollment; Select Enrollment program tokens; Select the enrollment token which applies to the iOS/iPadOS device; Select Profiles; Select Properties; Next to the Management Settings heading press Edit; Set Sync with computers to Deny All'
