id: TMA-INTUNE-IOS-3.1.5
title: Ensure "Block access to network drive in Files app" is set to "Yes"
description: This prevents access to networked file shares, such as SMB network drives. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.1.5 Ensure "Block access to network drive in Files app" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Verify that Block access to network drive in Files app is present and set to Yes. On the device: Tap Restrictions; Confirm Network drives not accessible in Files app is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Set Block access to network drive in Files app to Yes'
