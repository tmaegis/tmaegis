id: TMA-INTUNE-IOS-3.1.2
title: Ensure "Treat AirDrop as an unmanaged destination" is set to "Yes"
description: This forces AirDrop to be considered an unmanaged drop target. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.1.2 Ensure "Treat AirDrop as an unmanaged destination" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Verify that Treat AirDrop as an unmanaged destination is present and set to Yes. On the device: Tap Restrictions; Confirm Sharing managed documents using AirDrop not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Set Treat AirDrop as an unmanaged destination to Yes'
