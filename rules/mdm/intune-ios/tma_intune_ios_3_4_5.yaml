id: TMA-INTUNE-IOS-3.4.5
title: Ensure "Block access to USB drive in Files app" is set to "Yes"
description: This will prevent the Files app from accessing USB media to view and/or transfer files. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.4.5 Ensure "Block access to USB drive in Files app" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Connected devices heading; Verify that Block access to USB drive in Files app is present and set to Yes. On the device: Tap Restrictions; Confirm USB drives not accessible in Files app is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Connected devices heading; Set Block access to USB drive in Files app to Yes'
