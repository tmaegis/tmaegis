id: TMA-INTUNE-IOS-2.4.3
title: Ensure "Block Apple Watch auto unlock" is set to "Yes"
description: This will restrict users from being able to automatically unlock their Apple Watch when they unlock their iOS/iPadOS device. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.4.3 Ensure "Block Apple Watch auto unlock" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Connected devices heading; Verify that Block Apple Watch auto unlock is present and set to Yes. On the device: Tap Restrictions; Confirm Phone auto unlock not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Connected devices heading; Set Block Apple Watch auto unlock to Yes'
