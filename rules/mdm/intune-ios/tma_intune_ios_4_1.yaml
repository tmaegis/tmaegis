id: TMA-INTUNE-IOS-4.1
title: Ensure "Jailbroken devices" is set to "Block"
description: This recommendation ensures that jailbroken devices have been blocked by the organization via the compliance policy. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.1 Ensure "Jailbroken devices" is set to "Block"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Under the Compliance settings section; Under the Device Health heading; Verify that Jailbroken devices is present and set to Block'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Select Edit in the Compliance settings section; Under the Device Health heading; Set Jailbroken devices to Block'
