id: TMA-INTUNE-IOS-3.4.2
title: Ensure "Require AirPlay outgoing requests pairing password" is set to "Yes"
description: This restriction enforces the requirement of a pairing password when using AirPlay to stream content to a new Apple device. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.4.2 Ensure "Require AirPlay outgoing requests pairing password" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Connected devices heading; Verify that Require AirPlay outgoing requests pairing password is present and set to Yes. On the device: Tap Restrictions; Confirm AirPlay outgoing requests pairing password enforced is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Connected devices heading; Set Require AirPlay outgoing requests pairing password to Yes'
