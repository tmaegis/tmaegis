id: TMA-INTUNE-IOS-3.10.1
title: Ensure the ability to remove the management profile does not exist
description: This recommendation denies the ability remove an installed configuration profile. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.10.1 Ensure the ability to remove the management profile does not exist
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select iOS/iPadOS; Select iOS/iPadOS enrollment; Select Enrollment program tokens; Select the enrollment token which applies to the iOS/iPadOS device; Select Profiles; Select Properties; Ensure Locked enrollment is set to Yes. On the device: Confirm the Remove Management button is not displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select iOS/iPadOS; Select iOS/iPadOS enrollment; Select Enrollment program tokens; Select the enrollment token which applies to the iOS/iPadOS device; Select Profiles; Select Properties; Next to the Management Settings heading press Edit; Set Locked enrollment to Yes'
