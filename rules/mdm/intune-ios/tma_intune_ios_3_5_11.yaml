id: TMA-INTUNE-IOS-3.5.11
title: Ensure "Force automatic date and time" is set to "Yes"
description: This restriction forces automatic date and time to be used on the device. The time zone updates only when the device can determine its location, such as when a device has a cellular connection or a Wi-Fi connection with location services enabled. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.5.11 Ensure "Force automatic date and time" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Force automatic date and time is present and set to Yes. On the device: Tap Restrictions; Confirm Automatic date & time enforced is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Force automatic date and time to Yes'
