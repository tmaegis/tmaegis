id: TMA-INTUNE-IOS-3.7.4
title: Ensure "Minimum password length" is set to "6" or greater
description: This restriction requires the password length set on the device to be 6 or greater. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.7.4 Ensure "Minimum password length" is set to "6" or greater
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Minimum password length is present and set to 6 or greater. On the device: Tap Restrictions; Tap Passcode; Confirm Minimum length is present and its value is 6 or greater'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Minimum password length to 6 or greater'
