id: TMA-INTUNE-IOS-3.5.10
title: Ensure "Allow activation lock" is set to "Yes"
description: This restriction enables Activation Lock on devices. This feature is commonly seen when a device is marked as lost in the Apple Find My app. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.5.10 Ensure "Allow activation lock" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Allow activation lock is present and set to Yes This restriction can not be audited from the device'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Allow activation lock to Yes'
