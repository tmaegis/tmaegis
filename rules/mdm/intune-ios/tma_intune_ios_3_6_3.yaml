id: TMA-INTUNE-IOS-3.6.3
title: Ensure "Block Today view in lock screen" is set to "Yes"
description: This restriction prevents access to the Today View and search on the lock screen. This can be seen by swiping left on the lock screen. A Passcode/Face ID must be set for this to apply. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.6.3 Ensure "Block Today view in lock screen" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Locked Screen Experience heading; Verify that Block Today view in lock screen is present and set to Yes. On the device: Tap Restrictions; Confirm Today view on lock screen not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Locked Screen Experience heading; Set Block Today view in lock screen to Yes'
