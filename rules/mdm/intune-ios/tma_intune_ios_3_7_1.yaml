id: TMA-INTUNE-IOS-3.7.1
title: Ensure "Require password" is set to "Yes"
description: This restriction enforces a password to be set on the device. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.7.1 Ensure "Require password" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Require password is present and set to Yes. On the device: Tap Restrictions; Tap Passcode; Confirm Passcode required is present and its value is yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Require password to Yes'
