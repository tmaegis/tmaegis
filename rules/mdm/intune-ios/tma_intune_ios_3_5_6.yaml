id: TMA-INTUNE-IOS-3.5.6
title: Ensure "Limit Apple personalized advertising" is set to "Yes"
description: Apple provides a framework that allows advertisers to target Apple users with advertisements relevant to them and their interests by means of a unique identifier. For such personalized advertisements to be delivered, however, detailed information is collected, correlated, and made available to advertisers. This information is valuable to both advertisers and attackers and has been used with other metadata to reveal users' identities. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.5.6 Ensure "Limit Apple personalized advertising" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Limit Apple personalized advertising is present and set to Yes. On the device: Tap Restrictions; Confirm Apple personalized advertising not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Limit Apple personalized advertising to Yes'
