id: TMA-INTUNE-IOS-4.3
title: Ensure "Mark device noncompliant" is set to "Immediately"
description: This recommendation ensures that devices which aren't compliant with the applied compliance policy are marked as not compliant immediately. Although this is the default, there is an option for this to be set between immediately and 365 days. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.3 Ensure "Mark device noncompliant" is set to "Immediately"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Under the Actions for noncompliance heading; Verify that Mark device noncompliant is present and set to Immediately'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Select Edit in the Actions for noncompliance section; Set Mark device noncompliant to 0 which will resolve to immediately'
