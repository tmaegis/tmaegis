id: TMA-INTUNE-IOS-2.5.3
title: Ensure "Block untrusted TLS certificates" is set to "Yes"
description: This recommendation blocks untrusted Transport Layer Security (TLS) certificates. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 2
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.5.3 Ensure "Block untrusted TLS certificates" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Block untrusted TLS certificates is present and set to Yes. On the device: Tap Restrictions; Confirm Establishing untrusted TLS connections not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Block untrusted TLS certificates to Yes'
