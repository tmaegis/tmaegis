id: TMA-INTUNE-IOS-2.7.6
title: Ensure "Maximum minutes of inactivity until screen locks" is set to "2" or less
description: This restriction sets the maximum time of inactivity before the device will be automatically locked. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.7.6 Ensure "Maximum minutes of inactivity until screen locks" is set to "2" or less
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Maximum minutes of inactivity until screen locks is present and set to 2 or less. On the device: Tap Restrictions; Tap Passcode; Confirm Max inactivity is present and its value is 2 minutes or less'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Maximum minutes of inactivity until screen locks to 2 or less'
