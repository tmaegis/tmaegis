id: TMA-INTUNE-IOS-2.1.3
title: Ensure "Require Managed Pasteboard" is set to "True"
description: This enforces copy and paste functionality to respect the "Allow Open From Managed To Unmanaged" and "Allow Open From Unmanaged To Managed" restrictions. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.1.3 Ensure "Require Managed Pasteboard" is set to "True"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Verify that Require Managed Pasteboard is present and set to Yes. On the device: Confirm Copy and paste are managed is displayed under Restrictions'
remediation:
  type: iac_patch
  command: 'Intune admin center: Set Require Managed Pasteboard to True'
