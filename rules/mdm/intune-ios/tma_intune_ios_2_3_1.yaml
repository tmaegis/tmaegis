id: TMA-INTUNE-IOS-2.3.1
title: Ensure "Force encrypted backup" is set to "Yes"
description: This requires device backups to be stored in an encrypted state. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.3.1 Ensure "Force encrypted backup" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Cloud and Storage heading; Verify that Force encrypted backup is present and set to Yes. On the device: Tap Restrictions; Confirm Encrypted backups enforced is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Cloud and Storage heading; Set Force encrypted backup to Yes'
