id: TMA-INTUNE-IOS-2.7.3
title: Ensure "Required password type" is set to "Alphanumeric"
description: This restriction enforces an alphanumeric password on the device. Numeric-only passcode pins would not be allowed. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 2
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.7.3 Ensure "Required password type" is set to "Alphanumeric"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Required password type is present and set to Alphanumeric. On the device: Tap Restrictions; Tap Passcode; Confirm Alphanumeric required is present and its value is Yes'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Required password type to Alphanumeric'
