id: TMA-INTUNE-IOS-2.8.1
title: Ensure "Block voice dialing while device is locked" is set to "Yes"
description: This restriction blocks initiating phone calls from a locked device. Voice dialing is handled separately from Siri. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.8.1 Ensure "Block voice dialing while device is locked" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Wireless heading; Verify that Block voice dialing while device is locked is present and set to Yes. On the device: Tap Restrictions; Confirm Voice dialing while locked not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Wireless heading; Set Block voice dialing while device is locked to Yes'
