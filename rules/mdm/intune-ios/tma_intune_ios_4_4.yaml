id: TMA-INTUNE-IOS-4.4
title: Ensure "Send email to end user" is set to "3 days" or less
description: This recommendation ensures that devices that have been marked as "not compliant" will have an email sent to the assigned primary user of the device. An additional recipient (e.g. SOC or Intune administrator) should also be set. A message template must be created and selected. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 2
severity: low
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.4 Ensure "Send email to end user" is set to "3 days" or less
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Under the Actions for noncompliance heading; Verify that Send email to end user is present and set to 3 days or less'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Select Edit in the Actions for noncompliance section; Set Send email to end user to 3 (or less) which will resolve to 3 days'
