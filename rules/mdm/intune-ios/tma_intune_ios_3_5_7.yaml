id: TMA-INTUNE-IOS-3.5.7
title: Ensure "Block users from erasing all content and settings on device" is set to "Yes"
description: This restriction prevents the "erase all content and settings" option on devices. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.5.7 Ensure "Block users from erasing all content and settings on device" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Block users from erasing all content and settings on device is present and set to Yes. On the device: Tap Restrictions; Confirm Erase content and settings not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Block users from erasing all content and settings on device to Yes'
