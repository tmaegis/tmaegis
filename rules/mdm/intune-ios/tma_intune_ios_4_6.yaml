id: TMA-INTUNE-IOS-4.6
title: Ensure "Mark devices with no compliance policy assigned as" is set to "Not compliant"
description: This recommendation ensures that devices that do not have a compliance policy assigned to them are marked as not compliant. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.6 Ensure "Mark devices with no compliance policy assigned as" is set to "Not compliant"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select Compliance policy settings; Verify that Mark devices with no compliance policy assigned as is set to Not compliant'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select Compliance policy settings; Set Mark devices with no compliance policy assigned as to Not compliant'
