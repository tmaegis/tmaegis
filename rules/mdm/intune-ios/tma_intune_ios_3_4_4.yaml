id: TMA-INTUNE-IOS-3.4.4
title: Ensure "Block iBeacon discovery of AirPrint printers" is set to "Yes"
description: This blocks the iBeacon function that allows users to discover nearby AirPrint Printers. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.4.4 Ensure "Block iBeacon discovery of AirPrint printers" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Connected devices heading; Verify that Block iBeacon discovery of AirPrint printers is present and set to Yes. On the device: Tap Restrictions; Confirm AirPrint iBeacon discovery not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Connected devices heading; Set Block iBeacon discovery of AirPrint printers to Yes'
