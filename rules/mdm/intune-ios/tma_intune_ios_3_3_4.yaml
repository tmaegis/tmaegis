id: TMA-INTUNE-IOS-3.3.4
title: Ensure "Block notes and highlights sync for enterprise books" is set to "Yes"
description: This prevents syncing notes and highlights in enterprise books. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.3.4 Ensure "Block notes and highlights sync for enterprise books" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Cloud and Storage heading; Verify that Block notes and highlights sync for enterprise books is present and set to Yes. On the device: Tap Restrictions; Confirm Synchronizing enterprise books notes and highlights not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Cloud and Storage heading; Set Block notes and highlights sync for enterprise books to Yes'
