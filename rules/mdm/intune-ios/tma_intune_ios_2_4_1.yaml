id: TMA-INTUNE-IOS-2.4.1
title: Ensure "Force Apple Watch wrist detection" is set to "Yes"
description: This restriction forces wrist detection to be enabled to paired Apple Watches. When enforced, the Apple Watch won't display notifications when it's not being worn. The Apple Watch will also lock itself when it has been removed from a user's wrist. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.4.1 Ensure "Force Apple Watch wrist detection" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Connected devices heading; Verify that Force Apple Watch wrist detection is present and set to Yes. On the device: Tap Restrictions; Confirm Wrist detection enforced on Apple Watch is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Connected devices heading; Set Force Apple Watch wrist detection to Yes'
