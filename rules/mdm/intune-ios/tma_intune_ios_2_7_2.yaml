id: TMA-INTUNE-IOS-2.7.2
title: Ensure "Block simple passwords" is set to "Yes"
description: This restriction enforces a block on simple passwords on the device. Passwords such as 1234 and 0000 would be blocked. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.7.2 Ensure "Block simple passwords" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Block simple passwords is present and set to Yes. On the device: Tap Restrictions; Tap Passcode; Confirm Simple passcodes allowed is present and its value is No'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Block simple passwords to Yes'
