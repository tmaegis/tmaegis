id: TMA-INTUNE-IOS-2.7.5
title: Ensure "Maximum minutes after screen lock before password is required" is set to "Immediately"
description: This restriction disables any grace period where a password is not required to be entered after the screen has locked. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.7.5 Ensure "Maximum minutes after screen lock before password is required" is set to "Immediately"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Maximum minutes after screen lock before password is required is present and set to Immediately. On the device: Tap Restrictions; Tap Passcode; Confirm Max grace period is present and its value is Immediately'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Maximum minutes after screen lock before password is required to Immediately'
