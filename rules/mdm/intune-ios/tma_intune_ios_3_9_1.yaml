id: TMA-INTUNE-IOS-3.9.1
title: Ensure a "Lock Screen Message" has been set
description: This recommendation applies to configuring a lock screen message. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.9.1 Ensure a "Lock Screen Message" has been set
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the device features profile which applies to the iOS/iPadOS device; Select the Lock Screen Message heading; Verify that "If Lost, Return to..." Message is present and has an appropriate message associated with it. On the device: Wake the device; Verify on the lock screen that an appropriate message is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Lock Screen Message heading; Set "If Lost, Return to..." Message with an appropriate message'
