id: TMA-INTUNE-IOS-2.6.1
title: Ensure "Block Control Center access in lock screen" is set to "Yes"
description: This restriction prevents access to the Control Center on the lock screen. Passcode/Face ID must be set for this to apply. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.6.1 Ensure "Block Control Center access in lock screen" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Locked Screen Experience heading; Verify that Block Control Center access in lock screen is present and set to Yes. On the device: Tap Restrictions; Confirm Control Center on lock screen not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Locked Screen Experience heading; Set Block Control Center access in lock screen to Yes'
