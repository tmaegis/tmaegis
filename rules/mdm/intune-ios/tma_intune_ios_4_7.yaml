id: TMA-INTUNE-IOS-4.7
title: Ensure "Compliance status validity period (days)" is set to "7" or less
description: This recommendation ensures that if devices do not check-in (report compliance status) within the defined validity period, they are marked as not compliant. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.7 Ensure "Compliance status validity period (days)" is set to "7" or less
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select Compliance policy settings; Verify that Compliance status validity period (days) is set to 7 or less'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select Compliance policy settings; Set Compliance status validity period (days) to 7 or less'
