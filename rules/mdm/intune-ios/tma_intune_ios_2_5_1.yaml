id: TMA-INTUNE-IOS-2.5.1
title: Ensure "Block sending diagnostic and usage data to Apple" is set to "Yes"
description: Apple provides a mechanism to send diagnostic and analytics data back to them in order to help improve the platform. This information sent to Apple may contain internal organizational information that should not be disclosed to third parties. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.5.1 Ensure "Block sending diagnostic and usage data to Apple" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Block sending diagnostic and usage data to Apple is present and set to Yes. On the device: Tap Restrictions; Confirm Diagnostic submission not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Block sending diagnostic and usage data to Apple to Yes'
