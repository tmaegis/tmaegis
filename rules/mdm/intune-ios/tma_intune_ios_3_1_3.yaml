id: TMA-INTUNE-IOS-3.1.3
title: Ensure "Allow copy/paste to be affected by managed open- in" is set to "Yes"
description: This enforces copy/paste restrictions based on configured Block viewing corporate documents in unmanaged apps and Block viewing non-corporate documents in corporate apps. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.1.3 Ensure "Allow copy/paste to be affected by managed open- in" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Verify that Allow copy/paste to be affected by managed open-in is present and set to Yes. On the device: Tap Restrictions; Confirm Copy and paste are managed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the App Store, Doc Viewing, Gaming heading; Set Allow copy/paste to be affected by managed open-in to Yes'
