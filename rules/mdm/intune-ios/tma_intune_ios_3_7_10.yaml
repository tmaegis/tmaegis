id: TMA-INTUNE-IOS-3.7.10
title: Ensure "Require Touch ID or Face ID authentication for AutoFill of password or credit card information" is set to "Yes"
description: This restriction forces an authentication prompt before each AutoFill operation. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: high
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.7.10 Ensure "Require Touch ID or Face ID authentication for AutoFill of password or credit card information" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Require Touch ID or Face ID authentication for AutoFill of password or credit card information is present and set to Yes. On the device: Tap Restrictions; Confirm Authentication before Auto Filling passwords enforced is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Require Touch ID or Face ID authentication for AutoFill of password or credit card information to Yes'
