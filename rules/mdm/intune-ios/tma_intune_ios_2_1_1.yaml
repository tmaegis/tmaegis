id: TMA-INTUNE-IOS-2.1.1
title: Ensure "Allow Open From Managed To Unmanaged" is set to "False"
description: Ensures that documents in managed apps and accounts only open in other managed apps and accounts. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.1.1 Ensure "Allow Open From Managed To Unmanaged" is set to "False"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Verify that Allow Open From Managed To Unmanaged is present and set to False. On the device: Confirm Opening documents from managed to unmanaged apps not allowed is displayed under Restrictions'
remediation:
  type: iac_patch
  command: 'Intune admin center: Set Opening documents from managed to unmanaged apps not allowed to False'
