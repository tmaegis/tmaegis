id: TMA-INTUNE-IOS-4.2
title: Ensure "Minimum OS version" or "Minimum OS build version" has been defined
description: This recommendation ensures that outdated devices that do not adhere to the defined minimum OS version or minimum OS build version are blocked by the organization via the compliance policy. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.2 Ensure "Minimum OS version" or "Minimum OS build version" has been defined
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Under the Compliance settings section; Under the Device Properties heading; Verify that Minimum OS version or Minimum OS build version is present and set to a value that is representative of a recent iOS/iPadOS version or build number'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Properties; Select Edit in the Compliance settings section; Under the Device Properties heading; Set Minimum OS version or Minimum OS build version to a value that is representative of a recent iOS/iPadOS version or build number'
