id: TMA-INTUNE-IOS-2.6.4
title: Ensure "Block Wallet notifications in lock screen" is set to "Yes"
description: This restriction prevents access to the Apple Wallet while the screen is locked. Passcode/Face ID must be set for this to apply. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.6.4 Ensure "Block Wallet notifications in lock screen" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Locked Screen Experience heading; Verify that Block Wallet notifications in lock screen is present and set to Yes. On the device: Tap Restrictions; Confirm Passbook not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Locked Screen Experience heading; Set Block Wallet notifications in lock screen to Yes'
