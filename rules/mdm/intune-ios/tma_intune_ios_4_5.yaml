id: TMA-INTUNE-IOS-4.5
title: Ensure all devices are marked as "compliant"
description: This recommendation ensures that devices that are not compliant to the compliance policy are addressed by either being removed from the organization or ensuring they meet the defined compliance policy. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 4.5 Ensure all devices are marked as "compliant"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Device status; Verify that the compliance status of all devices are set to "Compliant"'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select Compliance policies; Select the compliance policy which applies to the iOS/iPadOS device; Select Device status; Address "Not Compliant" devices by either removing them or ensuring they meet the defiled compliance policy'
