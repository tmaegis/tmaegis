id: TMA-INTUNE-IOS-2.7.7
title: Ensure "Block Touch ID and Face ID unlock" is set to "Yes"
description: This restriction blocks Touch ID and Face ID being used to unlock the device. A standard passcode/password will be the only form of authentication to unlock the device. If this is not set, passcode/password will still be required after a device power-cycles or the device has been reported as lost. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 2
severity: low
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 2.7.7 Ensure "Block Touch ID and Face ID unlock" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Password heading; Verify that Block Touch ID and Face ID unlock is present and set to Yes. On the device: Tap Restrictions; Confirm Touch ID unlock not allowed or Face ID unlock not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Password heading; Set Block Touch ID and Face ID unlock to Yes'
