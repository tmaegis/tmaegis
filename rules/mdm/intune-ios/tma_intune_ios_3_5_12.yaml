id: TMA-INTUNE-IOS-3.5.12
title: Ensure "Block VPN creation" is set to "Yes"
description: This restriction prevents a user from intentionally or unintentionally creating VPN configuration. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.5.12 Ensure "Block VPN creation" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the General heading; Verify that Block VPN creation is present and set to Yes. On the device: Tap Restrictions; Confirm VPN creation not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the General heading; Set Block VPN creation to Yes'
