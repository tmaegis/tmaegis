id: TMA-INTUNE-IOS-3.2.1
title: Ensure "Block Siri while device is locked" is set to "Yes"
description: This prevents access to Siri when the device is locked. The benchmark marks this a Manual check of an Intune iOS/iPadOS policy setting that cannot be read from the endpoint with a script, so TMAegis lists it as a manual review item with the audit steps (the policy must be inspected in the Intune admin center or on the managed device).
target: intune-ios
level: 1
severity: medium
tags:
- intune-ios
- intune
- manual-review
reference: CIS Apple iOS 26 and iPadOS 26 Intune Benchmark v1.0.0 - 3.2.1 Ensure "Block Siri while device is locked" is set to "Yes"
audit:
  type: manual
  command: 'iOS/iPadOS: Intune admin center: Select the Built-in apps heading; Verify that Block Siri while device is locked is present and set to Yes. On the device: Tap Restrictions; Confirm Siri while locked not allowed is displayed'
remediation:
  type: iac_patch
  command: 'Intune admin center: Select the Built-in apps heading; Set Block Siri while device is locked to Yes'
