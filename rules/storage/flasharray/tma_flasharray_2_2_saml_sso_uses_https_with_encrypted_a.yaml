id: TMA-FLASHARRAY-2.2
title: Ensure SAML SSO uses HTTPS with encrypted assertions and signed requests
description: SAML may be used for delegated authentication across various protocols on FlashArray. The array URL, IDP metadata URL, and IDP URL are all required to use https if specified. IDP Metadata URL usage is optional; if one is not used, then you may instead manually configure the IDP URL, verification certificate, and IDP entity ID. Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).
target: flasharray
level: 2
severity: low
tags:
- flasharray
- storage
- encryption
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 2.2 Ensure SAML SSO uses HTTPS with encrypted assertions and signed requests
audit:
  type: manual
  command: 'From the CLI: ; Display the full SAML2 SSO configuration and certificate details by running the command puresso saml2 list --verification-certificate. ; Review the output to confirm that the Array URL and IdP URL fields begin with https://. ; Verify that the Sign Request and Encrypt Assertion attributes are set to True. ; Review the Verification Certificate details to ensure it was issued by a trusted CA and the Valid To date is not expired.'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, update your SAML2 SSO configuration to require HTTPS, signed requests, and encrypted assertions using dedicated credentials. From the GUI: ; Navigate to Settings > Access > Users and Policies and scroll to the SAML2 SSO pane. ; Click the edit icon for the Configuration. ; Update the Array URL and IdP URL fields to ensure they begin with https://. ; Enable Signed Requests: Slide the Sign Request toggle to the right (blue) and enter your array''s signing certificate name in the Signing Credential field.'
