id: TMA-FLASHARRAY-4.7
title: Ensure the health of array connections and offload targets is continuously monitored
description: Whether utilizing array connections or offload targets, FlashArray periodically monitors them for health issues that impact your ability to backup data. Everpure recommends that you monitor the health of your array connections and offload targets, in order to detect unhealthy statuses. Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- data-protection
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 4.7 Ensure the health of array connections and offload targets is continuously monitored
audit:
  type: manual
  command: 'From the CLI: ; Run the command purearray connection list to verify the status of peer array connections. ; Run the command purepod replica-link list to verify the status of ActiveDR connections. ; Run the command pureoffload list to display all connected offload targets. ; Review the outputs to ensure the paths are healthy and not displaying a connecting, quarantined, or unhealthy state.'
remediation:
  type: iac_patch
  command: 'Because this is a continuous monitoring procedure, remediation involves establishing regular manual or automated review processes to track connection metrics and respond to anomalies. From the GUI (for manual monitoring): ; Navigate to Protection > Array. ; In the Connected Arrays panel, monitor the Status column. A status of connecting indicates an unhealthy connection (typically due to network issues), while quarantined indicates an unstable synchronous replication path that has been temporarily embargoed. ; In the Offload Targets panel, monitor the Status column.'
