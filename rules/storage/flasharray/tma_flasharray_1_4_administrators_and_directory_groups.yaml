id: TMA-FLASHARRAY-1.4
title: Ensure administrators and directory groups are granted least- privilege roles via management access policies
description: FlashArray provides utilities for role based access controls, with 4 built-in management access policies, which can be assigned to administrators, directory service groups, or as the maximum role that can be granted by OAuth API Clients. Management access policies may be dynamically created, allowing you to grant users different roles in different scopes (e.g. Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- access-control
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 1.4 Ensure administrators and directory groups are granted least- privilege roles via management access policies
audit:
  type: manual
  command: 'From the CLI: ; Run the command pureadmin list to display all local administrators. ; Review the Access Policy column in the output to confirm that each account has the appropriate minimum-privilege policy attached (and no account is unnecessarily set to array_admin). ; Run the command pureds role list to display the current LDAP/AD group to Purity//FA access policy mappings and verify their assignments. ; Run purepolicy management-access list to inspect the permissions, scopes, and aggregation strategies of all configured access policies.'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, assign users and groups the minimum role needed to accomplish their responsibilities by leveraging Purity//FA''s built-in or custom Management Access Policies. From the GUI: ; Navigate to Settings > Access > Users and Policies. ; For Local Users: In the Users panel, click the edit (three vertical dots) icon for the user account and select Change Access Policy. Remove any overly permissive policies and assign the appropriate minimum-privilege policy. ; For Directory Service Groups: In the Directory Service panel, click the edit icon in the Roles section.'
