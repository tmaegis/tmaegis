id: TMA-FLASHARRAY-1.2
title: Ensure a management LDAP/Active Directory service is configured and enabled with at least one group mapped
description: If your environment does not support SAML, Purity can be integrated with an external identity provider (IDP) that supports LDAP. This allows for password login functionality in the Everpure Web UI and CLI, with user provisioning, password management, and authorization being controlled by the IDP. Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- access-control
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 1.2 Ensure a management LDAP/Active Directory service is configured and enabled with at least one group mapped
audit:
  type: manual
  command: 'From the CLI: ; Run the command pureds list management (or pureds list) to display the current directory service configuration. Verify the URI, Base DN, and Bind User fields are correct and the service is enabled. ; Run the command pureds role list to confirm that role-group mappings are securely defined for array roles. ; Test the configuration: Run the command pureds test to verify that the array can successfully resolve the URIs, bind to the directory using the credentials, and locate the mapped groups without errors.'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, configure the management directory service with your LDAP/AD server parameters, map your directory groups to Purity//FA roles, and rigorously test the connection before enabling it. From the GUI: ; Navigate to Settings > Access > Users and Policies. ; In the Directory Service panel, select the Array Management button, then click the edit icon. ; Enter your LDAP server URIs (using ldaps:// for encrypted connections), Base DN, Bind User, and Bind Password. Click Save. ; In the Roles section of the panel, click the edit icon.'
