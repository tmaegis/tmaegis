id: TMA-FLASHARRAY-1.1
title: Ensure a management SAML SSO configuration is created and enabled
description: Purity can be integrated with an external identity provider (IDP) that supports SAML. This allows for single-sign-on (SSO) functionality in the Everpure Web UI, with user provisioning, authentication, and authorization being controlled by the IDP. Everpure recommends that you create and enable a management SAML configuration. Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- access-control
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 1.1 Ensure a management SAML SSO configuration is created and enabled
audit:
  type: manual
  command: 'From the CLI: ; Run the command puresso saml2 list to display configured SAML providers. ; Review the output to confirm that a SAML provider is present and its enabled status is True. ; Run the command puresso saml2 list --verification-certificate to view the full verification certificate details and verify the certificate issuer and expiry date. ; Test the configuration: Run the command puresso saml2 test [IDP-NAME] to verify the array URL correctness, IdP connectivity, directory service correctness, and verification certificate validity.'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, configure the array as a Service Provider (SP), exchange metadata or certificates with your Identity Provider, and rigorously test the configuration before enabling SSO. From the GUI: ; Navigate to Settings > Access > Users and Policies and scroll to the SAML2 SSO pane. ; Click the + (Create SAML2 SSO) icon. ; In the Name field, enter a local display name for the SAML2 SSO configuration. ; In the Array URL field, enter the FlashArray URL using HTTPS. ; Enter either the IdP Metadata URL, or manually enter the IdP Entity ID, IdP URL, and click Edit next to Verification Certificate to paste your IdP''s PEM- formatted token-signing certificate.'
