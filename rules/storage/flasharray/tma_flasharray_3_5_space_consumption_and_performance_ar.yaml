id: TMA-FLASHARRAY-3.5
title: Ensure space consumption and performance are monitored for anomalies
description: 'FlashArray offers capabilities for monitoring space consumption, data reduction, and performance across a variety of axes. For performance, these include, but are not limited to: ; Array-wide ; By directory ; By volume ; By volume group ; By host ; By host group For space, these include, but are not limited to: ; Array-wide ; By directory ; By volume ; By volume group Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).'
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- file-services
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 3.5 Ensure space consumption and performance are monitored for anomalies
audit:
  type: manual
  command: 'From the CLI: ; Check file system / directory space usage by running the command puredir list --space. ; Check real-time or historical array performance metrics by running the command purearray monitor (or purearray monitor --historical <TIME>). ; Check array-wide space usage by running the command purearray list -- space.'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, implement a regular monitoring process using the built-in Analysis dashboards or automated CLI scripts to track capacity and performance trends. From the GUI: ; Establish a continuous manual monitoring routine using the Analysis > Capacity and Analysis > Performance pages to monitor capacity trends and bandwidth/IOPS metrics. ; Ensure you have configured syslog servers or email alert watchers (as covered in earlier sections) so that built-in capacity alerts (e.g., warnings when storage consumption reaches 90% of usable capacity) are proactively pushed to your monitoring teams. From the CLI:'
