id: TMA-FLASHARRAY-2.9
title: Ensure product diagnostic tests for environmental integrations are run periodically
description: 'For many environmental integrations mentioned in this section, there exists FlashArray functionality to detect that your configuration is still working. Everpure recommends that you periodically run the product diagnostics tests for the following configurations: ; SAML ; LDAP ; Active Directory ; Syslog ; SMTP Email delivery to alert watchers ; SNMP delivery to SNMP managers Manual review in the Purity//FA GUI or CLI (organization-specific or per-object evidence).'
target: flasharray
level: 1
severity: medium
tags:
- flasharray
- storage
- encryption
reference: CIS Everpure FlashArray Purity 6.9.x Benchmark v1.0.0 - 2.9 Ensure product diagnostic tests for environmental integrations are run periodically
audit:
  type: manual
  command: 'From the CLI: ; Request evidence from your monitoring or automation teams that a script periodically connects to the array to execute configuration test commands (e.g., puresso saml2 test, pureds test, purelog syslog test, purealert watcher test, and purearray test ntp).'
remediation:
  type: iac_patch
  command: 'To align with the security recommendations, implement an automated script or a manual maintenance schedule to continuously verify that environmental integrations are fully functional. From the GUI: ; Establish a periodic manual review process to execute available GUI diagnostic tests. ; Test Directory Services: Navigate to Settings > Access > Users and Policies. In the Directory Service panel, click Test to verify that URIs resolve and the array can bind to the LDAP/AD tree. ; Test SAML2 SSO: Navigate to Settings > Access > Users and Policies.'
