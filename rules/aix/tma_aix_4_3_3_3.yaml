id: TMA-AIX-4.3.3.3
title: Ensure ndpd-router is not in use
description: 'This entry starts ndpd-router on system startup. This manages the Neighbor Discovery Protocol (NDP) for non kernel activities. It receives Router Solicitations and sends Router Advertisements. It can also exchange routing information using the RIPng protocol. The ndpd-router manages NDP for non-kernel activities. Unless the server utilizes IPv6, this is not required and should be disabled. Audit: the ndpd-router start line in /etc/rc.tcpip must be commented out and the ndpd-router subsystem must not be active.'
target: aix
level: 1
severity: medium
tags:
- aix
- network
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 4.3.3.3 Ensure ndpd-router is not in use
audit:
  type: command
  command: command -v lssrc >/dev/null 2>&1 || exit 1; [ -r /etc/rc.tcpip ] || exit 1; out=$( { grep -E "^[[:blank:]]*start[[:blank:]]+/usr/(sbin|lib)/ndpd-router([[:blank:]]|$)" /etc/rc.tcpip; lssrc -s ndpd-router | awk 'NR>1 && $NF=="active"' ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf '%s\n' "$out" | head -n 20
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    tma_comment /etc/rc.tcpip '^[[:blank:]]*start[[:blank:]]+/usr/(sbin|lib)/ndpd-router([[:blank:]]|$)'
    lssrc -s ndpd-router 2>/dev/null | awk 'NR>1 && $NF=="active"' | grep -q . && stopsrc -s ndpd-router >/dev/null 2>&1
    true
  guidance: "In /etc/rc.tcpip, comment out the ndpd-router entry: chrctcp -d ndpd-router"
