id: TMA-AIX-5.3.4
title: Ensure user guest is secured
description: 'This change locks and disables login access for the guest user account. This change disables direct local and remote login to the guest user account. Do not set a password on this account to ensure that the only access is via su from the root account. There should not be a requirement to log in as the guest user directly. Audit: `lsuser -a account_locked login rlogin guest` must show true/false/false; an absent account is compliant.'
target: aix
level: 1
severity: medium
tags:
- aix
- accounts
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 5.3.4 Ensure user guest is secured
audit:
  type: command
  command: command -v lsuser >/dev/null 2>&1 || exit 1; lsuser guest >/dev/null 2>&1 || { echo compliant; exit 0; }; out=$(lsuser -a account_locked login rlogin guest 2>/dev/null); [ "$out" = "guest account_locked=true login=false rlogin=false" ] && echo compliant || echo "$out"
  expected_output: compliant
remediation:
  type: command
  command: chuser account_locked=true login=false rlogin=false guest
