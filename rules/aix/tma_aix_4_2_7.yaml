id: TMA-AIX-4.2.7
title: Ensure snmpd is not installed
description: 'Simple Network Management Protocol (SNMP) is a widely used protocol for monitoring the health and welfare of network equipment, computer equipment and devices like UPSs. bos.net.tcp.snmpd is a suite of applications used to implement SNMPv1 (RFC 1157), SNMPv2 (RFCs 1901-1908), and SNMPv3 (RFCs 3411-3418) using both IPv4 and IPv6. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: aix
level: 1
severity: medium
tags:
- aix
- services
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 4.2.7 Ensure snmpd is not installed
audit:
  type: command
  command: command -v lslpp >/dev/null 2>&1 || exit 1; out=$( { lslpp -Lcq bos.net.tcp.snmp >/dev/null 2>&1 && echo "SNMP client fileset exists"; lslpp -Lcq bos.net.tcp.snmpd >/dev/null 2>&1 && echo "SNMP server fileset exists" ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf '%s\n' "$out" | head -n 20
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Execute the following command: installp -ug bos.net.tcp.snmp bos.net.tcp.snmpd'
