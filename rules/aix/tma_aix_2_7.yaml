id: TMA-AIX-2.7
title: Ensure unused symbolic links are removed
description: 'This recommendation finds and removes symbolic links whose targets are missing. Symbolic Links that do not have a valid target are a risk to system integrity. The recommendation is to scan frequently (weekly or daily) for symbolic links without a valid target object and remove them. Do not assume that anyone responsible for maintaining system integrity is (actively) monitoring unknown software. Symbolic links - pointing at nothing - are, by definition, unauthorized and/or belong on a blocklist. Audit: lists dangling symbolic links on local JFS/JFS2 filesystems (long running).'
target: aix
level: 1
severity: medium
tags:
- aix
- hardening
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 2.7 Ensure unused symbolic links are removed
audit:
  type: command
  command: command -v find >/dev/null 2>&1 || exit 1; out=$( { find -L / \( -fstype jfs -o -fstype jfs2 \) -type l -ls ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf '%s\n' "$out" | head -n 20
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'The following command will remove all symbolic links that lack a valid target object: find -L / \( -fstype jfs -o -fstype jfs2 \) -type l | xargs rm'
