id: TMA-AIX-7.1
title: Ensure Fix Level Recommendation Tool Vulnerability Checker Script (FLRTVC) is regularly checked
description: The Fix Level Recommendation Tool Vulnerability Checker Script (FLRTVC) is a ksh script which uses data from the IBM website to compare the installed filesets and interim fixes on the system against known vulnerabilities and HIPER (High Impact PERvasive) issues. Unpatched software can expose systems to known vulnerabilities that may be exploited by attackers. It is recommended that operating system updates be performed on enterprise assets through automated patch management on a monthly, or more frequent, basis.
target: aix
level: 1
severity: low
tags:
- aix
- hardening
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 7.1 Ensure Fix Level Recommendation Tool Vulnerability Checker Script (FLRTVC) is regularly checked
audit:
  type: manual
  command: '1. Obtain the latest version of FLRTVC from IBM and extract the script to a location on your server. 2. - IF - you are checking an air-gapped server obtain the latest version of fix information from IBM and place in the same directory. 3. Run the following command to check for known vulnerabilities # ./flrtvc.ksh 4. The output should contain similar to the following: # FLRTVC Script executed on Mon Oct 27 13:58:30 GMT 2025 using Version: v0.8.12 # This report is based on APAR file dated : 2025.10.13 Fileset|Current Version|Type|EFix Installed|Abstract|Unsafe ... (full steps: CIS section 7.1)'
remediation:
  type: iac_patch
  command: If any vulnerabilities are reported above, you should review the details from the URL provided in the output before obtaining the fix from IBM support to install on the system.
