id: TMA-AIX-4.3.1.1
title: Ensure writesrv service is not in use
description: 'The recommendation is to disable writesrv. This allows users to chat using the system write facility on a terminal. writesrv allows users to chat using the system write facility on a terminal. The recommendation is that this service must be disabled. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: aix
level: 1
severity: medium
tags:
- aix
- services
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 4.3.1.1 Ensure writesrv service is not in use
audit:
  type: command
  command: command -v lsitab >/dev/null 2>&1 || exit 1; command -v lssrc >/dev/null 2>&1 || exit 1; out=$( { lsitab writesrv | grep -v off; lssrc -s writesrv | tail -n 1 | grep -v inoperative ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf '%s\n' "$out" | head -n 20
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    l=$(lsitab writesrv 2>/dev/null)
    if [ -n "$l" ]; then chitab "$(printf '%s\n' "$l" | awk -F: '{ print $1":"$2":off:"$4 }')"; fi
    true
  guidance: "Use the chitab command to disable the writesrv start-up script in /etc/inittab: Note: Do not use the rmitab to remove the writesrv start-up script from /etc/inittab as it may return during a update. /usr/sbin/chitab \"writesrv:23456789:off:/usr/bin/startsrc -swritesrv\" Use stopsrc to ensure that writesrv is not running /usr/bin/stopsrc -s writesrv"
