id: TMA-AIX-4.3.4.22
title: Ensure rsync daemon is not in use
description: 'The rsync daemon can be used to synchronize files between systems over network links. The rsync daemon presents a security risk as the rsync protocol is unencrypted. The rsync.rte fileset should be removed to reduce the attack area of the system. Audit: `lssrc -s inetd -l` must not list the service (count 0).'
target: aix
level: 1
severity: medium
tags:
- aix
- services
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 4.3.4.22 Ensure rsync daemon is not in use
audit:
  type: command
  command: command -v lssrc >/dev/null 2>&1 || exit 1; n=$(lssrc -s inetd -l 2>/dev/null | grep -c 'rsync'); echo "$n"
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    tma_comment /etc/inetd.conf '^[[:blank:]]*rsync[[:blank:]]'
    refresh -s inetd >/dev/null 2>&1 || true
  guidance: "Run the following command to remove the software: # /usr/sbin/installp -u rsync.rte - OR - - IF - the rsync.rte fileset is required as a dependency, or the rsync client is required: In /etc/inetd.conf, comment out the rsync entry: chsubserver -r inetd -C /etc/inetd.conf -d -v 'rsync' -p 'tcp' refresh -s inetd"
