id: TMA-AIX-5.2.11
title: Ensure minalpha is configured
description: 'Defines the minimum number of alphabetic characters in a password. In setting the minalpha attribute, it ensures that passwords have a minimum number of alphabetic characters. Audit: reads `lssec -f /etc/security/user -s default -a minalpha`.'
target: aix
level: 1
severity: medium
tags:
- aix
- password-policy
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 5.2.11 Ensure minalpha is configured
audit:
  type: command
  command: command -v lssec >/dev/null 2>&1 || exit 1; out=$(lssec -f /etc/security/user -s default -a minalpha 2>/dev/null) || exit 1; v=$(printf '%s\n' "$out" | sed -n 's/.*minalpha=\([^ ]*\).*/\1/p'); if [ -n "$v" ] && [ "$v" -ge 3 ]; then echo compliant; else echo "minalpha=$v"; fi
  expected_output: compliant
remediation:
  type: command
  command: chsec -f /etc/security/user -s default -a minalpha=3
