id: TMA-AIX-3.1
title: Ensure default user umask is configured
description: 'The user file-creation mode mask (umask) is used to determine the file permission for newly created directories and files. In AIX, the default permissions for any newly created directory is 0755 (rwxr-xr-x), and for any newly created file it is 0644 (rw-r--r--). The umask modifies the default AIX permissions by restricting (masking) these permissions. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: aix
level: 1
severity: medium
tags:
- aix
- accounts
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 3.1 Ensure default user umask is configured
audit:
  type: command
  command: command -v lssec >/dev/null 2>&1 || exit 1; out=$(lssec -f /etc/security/user -s default -a umask 2>/dev/null) || exit 1; printf '%s\n' "$out" | grep -Eq "^default umask=[0-7]?[2367]7$" && echo compliant || echo "$out"
  expected_output: compliant
remediation:
  type: command
  command: chsec -f /etc/security/user -s default -a umask=027
