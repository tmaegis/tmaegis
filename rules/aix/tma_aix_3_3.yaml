id: TMA-AIX-3.3
title: Ensure there are no system 'default group' writable files (objects)
description: 'The system is audited for group writable files that belong to one of the default AIX groups. An audit should be performed on the system to search for the presence of group writable files and devices. (Directories are covered in a seperate recommendation). Audit: finds objects writable by any administrative (admin=true) group on local JFS/JFS2 filesystems.'
target: aix
level: 2
severity: medium
tags:
- aix
- accounts
reference: CIS IBM AIX 7 Benchmark v1.2.0 - 3.3 Ensure there are no system 'default group' writable files (objects)
audit:
  type: command
  command: command -v lsgroup >/dev/null 2>&1 || exit 1; out=$( { for grp in $(lsgroup -a admin ALL | awk '$2=="admin=true"{print $1}'); do find / \( -fstype jfs -o -fstype jfs2 \) ! -type d -perm -g+w -group "$grp" -print; done ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf '%s\n' "$out" | head -n 20
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Review the currently mounted local filesystems using the following to find all world writable files on local JFS/JFS2 filesystems only: Note: the list generated by the command below is for all groups, not just the default system groups. the command without the argument -ls will create a list than can be fed to /usr/bin/xargs to blindly remove the group write permissions. find -L / \( -fstype jfs -o -fstype jfs2 \) -type f -perm -g+w -ls Remedy any files in the list, e.g., chmod g-w {filename} Document any files, and motivate why they are group writeable, and also add documentation re: when/why this exception ceases.'
