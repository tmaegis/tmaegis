id: TMA-WIN2019-17.6.3
title: Ensure 'Audit Other Object Access Events' is set to 'Success and Failure'
description: 'This policy setting allows you to audit events generated by the management of task scheduler jobs or COM+ objects. For scheduler jobs, the following are audited: • Job created. • Job deleted. • Job enabled. • Job disabled. • Job updated. For COM+ objects, the following are audited: • Catalog object added. • Catalog object updated. • Catalog object deleted. The recommended state for this setting is: Success and Failure.'
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 17.6.3
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9227-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9227-69ae-11d9-bed3-505054503030}' /success:enable /failure:enable
