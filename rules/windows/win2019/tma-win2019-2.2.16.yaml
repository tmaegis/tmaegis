id: TMA-WIN2019-2.2.16
title: Ensure 'Create permanent shared objects' is set to 'No One'
description: 'This user right is useful to kernel-mode components that extend the object namespace. However, components that run in kernel mode have this user right inherently. Therefore, it is typically not necessary to specifically assign this user right. The recommended state for this setting is: No One.'
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- secedit
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 2.2.16
audit:
  type: command
  command: '$f = Join-Path $env:TEMP (''tmaegis-'' + [guid]::NewGuid().ToString() + ''.inf''); secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null; $c = Get-Content $f -ErrorAction SilentlyContinue; Remove-Item $f -Force -ErrorAction SilentlyContinue; $line = $c | Where-Object { $_ -match ''^\s*SeCreatePermanentPrivilege\s*='' } | Select-Object -First 1; $v = if ($line) { ($line -split ''='', 2)[1].Trim().Trim(''"'') } else { $null }; $have = @(if ($v) { $v -split '','' | ForEach-Object { $_.Trim().TrimStart(''*'') } | Where-Object { $_ } }); if ((($have | Sort-Object -Unique) -join '','') -eq '''') { ''compliant'' } else { ''non-compliant: '' + ($have -join '','') }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    function Get-TmaSec([string]$Key) {
      $f = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $c = Get-Content $f -ErrorAction SilentlyContinue
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      $line = $c | Where-Object { $_ -match ('^\s*' + $Key + '\s*=') } | Select-Object -First 1
      if ($line) { ($line -split '=', 2)[1].Trim().Trim('"') } else { $null }
    }
    function Backup-TmaSec {
      $bk = Join-Path $env:ProgramData 'TMAegis\backup'
      New-Item -ItemType Directory -Force -Path $bk | Out-Null
      secedit /export /cfg (Join-Path $bk ('secedit-' + (Get-Date -Format 'yyyyMMddHHmmss') + '.inf')) /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
    }
    function Set-TmaSec([string]$Section, [string]$Line) {
      $inf = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      $db = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.sdb')
      $txt = @('[Unicode]', 'Unicode=yes', '[Version]', 'signature="$CHICAGO$"', 'Revision=1', ('[' + $Section + ']'), $Line) -join "`r`n"
      Set-Content -Path $inf -Value $txt -Encoding Unicode
      secedit /configure /db $db /cfg $inf /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $rc = $LASTEXITCODE
      Remove-Item $inf, $db -Force -ErrorAction SilentlyContinue
      if ($rc -ne 0) { throw ('secedit /configure failed: ' + $rc) }
    }
    $key = 'SeCreatePermanentPrivilege'
    $cur = Get-TmaSec $key
    $have = @(if ($cur) { $cur -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Where-Object { $_ } })
    if ((($have | Sort-Object -Unique) -join ',') -ne '') {
      Backup-TmaSec
      Set-TmaSec 'Privilege Rights' ($key + ' = ' + '')
    }
  guidance: "Set through Group Policy (domain policy for domain members): Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\User Rights Assignment\\Create permanent shared objects"
