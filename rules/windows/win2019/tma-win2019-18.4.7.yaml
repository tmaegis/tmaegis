id: TMA-WIN2019-18.4.7
title: 'Ensure ''NetBT NodeType configuration'' is set to ''Enabled: P-node (recommended)'''
description: 'This setting determines which method NetBIOS over TCP/IP (NetBT) uses to register and resolve names. The available methods are: • The B-node (broadcast) method only uses broadcasts. • The P-node (point-to-point) method only uses name queries to a name server (WINS). • The M-node (mixed) method broadcasts first, then queries a name server (WINS) if broadcast failed. • The H-node (hybrid) method queries a name server (WINS) first, then broadcasts if the query failed. The recommended state for this setting is: Enabled: P-node (recommended) (point- to-point). Note: Resolution through LMHOSTS or DN'
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 18.4.7
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'' -Name ''NodeType'' -ErrorAction SilentlyContinue).''NodeType''; if (-not ($null -ne $v -and @(2) -contains [int64]$v)) { $bad += ''NodeType='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' -Name 'NodeType' -Value 2 -PropertyType DWord -Force | Out-Null
