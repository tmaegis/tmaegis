id: TMA-WIN2019-1.1.2
title: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'
description: This policy setting defines how long a user can use their password before it expires. Values for this policy setting range from 0 to 999 days. If you set the value to 0, the password will never expire. Because threat actors can crack passwords, the more frequently you change the password the less opportunity an threat actor has to use a cracked password. However, the lower this value is set, the higher the potential for an increase in calls to help desk support due to users having to change their password or forgetting which password is current. The recommended state for this setting is 365 or
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- secedit
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 1.1.2
audit:
  type: command
  command: '$f = Join-Path $env:TEMP (''tmaegis-'' + [guid]::NewGuid().ToString() + ''.inf''); secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null; $c = Get-Content $f -ErrorAction SilentlyContinue; Remove-Item $f -Force -ErrorAction SilentlyContinue; $line = $c | Where-Object { $_ -match ''^\s*MaximumPasswordAge\s*='' } | Select-Object -First 1; $v = if ($line) { ($line -split ''='', 2)[1].Trim().Trim(''"'') } else { $null }; if (($null -ne $v -and [int64]$v -le 365 -and [int64]$v -ne 0)) { ''compliant'' } else { ''non-compliant: '' + $v }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    function Get-TmaSec([string]$Key) {
      $f = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $c = Get-Content $f -ErrorAction SilentlyContinue
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      $line = $c | Where-Object { $_ -match ('^\s*' + $Key + '\s*=') } | Select-Object -First 1
      if ($line) { ($line -split '=', 2)[1].Trim().Trim('"') } else { $null }
    }
    function Backup-TmaSec {
      $bk = Join-Path $env:ProgramData 'TMAegis\backup'
      New-Item -ItemType Directory -Force -Path $bk | Out-Null
      secedit /export /cfg (Join-Path $bk ('secedit-' + (Get-Date -Format 'yyyyMMddHHmmss') + '.inf')) /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
    }
    function Set-TmaSec([string]$Section, [string]$Line) {
      $inf = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      $db = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.sdb')
      $txt = @('[Unicode]', 'Unicode=yes', '[Version]', 'signature="$CHICAGO$"', 'Revision=1', ('[' + $Section + ']'), $Line) -join "`r`n"
      Set-Content -Path $inf -Value $txt -Encoding Unicode
      secedit /configure /db $db /cfg $inf /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $rc = $LASTEXITCODE
      Remove-Item $inf, $db -Force -ErrorAction SilentlyContinue
      if ($rc -ne 0) { throw ('secedit /configure failed: ' + $rc) }
    }
    $v = Get-TmaSec 'MaximumPasswordAge'
    if (-not ($null -ne $v -and [int64]$v -le 365 -and [int64]$v -ne 0)) {
      Backup-TmaSec
      net accounts /maxpwage:365 | Out-Null; if ($LASTEXITCODE -ne 0) { throw 'net accounts failed' }
    }
  guidance: "Set through Group Policy (domain policy for domain members): Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Maximum password age"
