id: TMA-WIN2019-19.7.5.1
title: Ensure 'Do not preserve zone information in file attachments' is set to 'Disabled'
description: 'This policy setting allows you to manage whether Windows marks file attachments with information about their zone of origin (such as restricted, Internet, intranet, local). This requires NTFS in order to function correctly, and will fail without notice on FAT32. By not preserving the zone information, Windows cannot make proper risk assessments. The recommended state for this setting is: Disabled. Note: The Attachment Manager feature warns users when opening or executing files which are marked as being from an untrusted source, unless/until the file''s zone information has been removed via the '
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 19.7.5.1
audit:
  type: registry
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments'') -Name ''SaveZoneInformation'' -ErrorAction SilentlyContinue).''SaveZoneInformation''; if (-not ($null -ne $v -and @(2) -contains [int64]$v)) { $_.PSChildName + '':SaveZoneInformation='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure through Group Policy (User Configuration): User Configuration\Policies\Administrative Templates\Windows Components\Attachment Manager\Do not preserve zone information in file attachments'
