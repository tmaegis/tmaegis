id: TMA-WIN2019-18.9.19.2
title: 'Ensure ''Configure security policy processing: Do not apply during periodic background processing'' is set to ''Enabled: FALSE'''
description: 'The "Do not apply during periodic background processing" option prevents the system from updating affected security policies in the background while the computer is in use. When background updates are disabled, updates to security policies will not take effect until the next user logon or system restart. This setting affects all policy settings that use the built-in security template of Group Policy (e.g. Windows Settings\Security Settings). The recommended state for this setting is: Enabled: FALSE (unchecked).'
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 18.9.19.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}'' -Name ''NoBackgroundPolicy'' -ErrorAction SilentlyContinue).''NoBackgroundPolicy''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''NoBackgroundPolicy='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}' -Name 'NoBackgroundPolicy' -Value 0 -PropertyType DWord -Force | Out-Null
