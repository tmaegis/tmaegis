id: TMA-WIN2019-18.10.18.3
title: Ensure 'Enable App Installer Hash Override' is set to 'Disabled'
description: 'This policy setting controls whether or not users can override the SHA256 security validation in the Windows Package Manager settings. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-server-2019-dc
- windows-server-2019-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2019 Benchmark v5.0.0 - 18.10.18.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'' -Name ''EnableHashOverride'' -ErrorAction SilentlyContinue).''EnableHashOverride''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''EnableHashOverride='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller' -Name 'EnableHashOverride' -Value 0 -PropertyType DWord -Force | Out-Null
