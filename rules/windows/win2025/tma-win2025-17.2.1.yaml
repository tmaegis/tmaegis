id: TMA-WIN2025-17.2.1
title: Ensure 'Audit Application Group Management' is set to 'Success and Failure'
description: 'This policy setting allows you to audit events generated by changes to application groups such as the following: • Application group is created, changed, or deleted. • Member is added or removed from an application group. Application groups are utilized by Windows Authorization Manager, which is a flexible framework created by Microsoft for integrating role-based access control (RBAC) into applications. More information on Windows Authorization Manager is available at MSDN - Windows Authorization Manager. The recommended state for this setting is: Success and Failure. Note: Although Microsoft '
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 17.2.1
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9239-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9239-69ae-11d9-bed3-505054503030}' /success:enable /failure:enable
