id: TMA-WIN2025-17.5.4
title: Ensure 'Audit Logon' is set to 'Success and Failure'
description: 'This subcategory reports when a user attempts to log on to the system. These events occur on the accessed computer. For interactive logons, the generation of these events occurs on the computer that is logged on to. If a network logon takes place to access a share, these events generate on the computer that hosts the accessed resource. If you configure this setting to No auditing, it is difficult or impossible to determine which user has accessed or attempted to access organization computers. Events for this subcategory include: • 4624: An account was successfully logged on. • 4625: An account'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 17.5.4
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9215-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9215-69ae-11d9-bed3-505054503030}' /success:enable /failure:enable
