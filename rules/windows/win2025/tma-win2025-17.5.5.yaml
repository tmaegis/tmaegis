id: TMA-WIN2025-17.5.5
title: Ensure 'Audit Other Logon/Logoff Events' is set to 'Success and Failure'
description: 'This subcategory reports other logon/logoff-related events, such as Remote Desktop Services session disconnects and reconnects, using RunAs to run processes under a different account, and locking and unlocking a workstation. Events for this subcategory include: • 4649: A replay attack was detected. • 4778: A session was reconnected to a Window Station. • 4779: A session was disconnected from a Window Station. • 4800: The workstation was locked. • 4801: The workstation was unlocked. • 4802: The screen saver was invoked. • 4803: The screen saver was dismissed. • 5378: The requested credentials d'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 17.5.5
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce921c-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce921c-69ae-11d9-bed3-505054503030}' /success:enable /failure:enable
