id: TMA-WIN2025-18.10.41.1
title: Ensure 'Block all consumer Microsoft account user authentication' is set to 'Enabled'
description: 'This setting determines whether applications and services on the device can utilize new consumer Microsoft account authentication via the Windows OnlineID and WebAccountManager APIs. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 18.10.41.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\MicrosoftAccount'' -Name ''DisableUserAuth'' -ErrorAction SilentlyContinue).''DisableUserAuth''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableUserAuth='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\MicrosoftAccount')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\MicrosoftAccount' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\MicrosoftAccount' -Name 'DisableUserAuth' -Value 1 -PropertyType DWord -Force | Out-Null
