id: TMA-WIN2025-18.6.7.4
title: Ensure 'Enable authentication rate limiter' is set to 'Enabled'
description: 'This policy settings configures the Server Message Block (SMB) server authentication rate limiter. The authentication rate limiter is a feature of SMB that is designed to address brute force attacks. The recommended state for this setting is: Enabled. Note: This setting should be used in conjunction with the setting Set authentication rate limiter delay (milliseconds).'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 18.6.7.4
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer'' -Name ''EnableAuthRateLimiter'' -ErrorAction SilentlyContinue).''EnableAuthRateLimiter''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''EnableAuthRateLimiter='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer' -Name 'EnableAuthRateLimiter' -Value 1 -PropertyType DWord -Force | Out-Null
