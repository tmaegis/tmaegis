id: TMA-WIN2025-18.10.18.4
title: Ensure 'Enable App Installer Local Archive Malware Scan Override' is set to 'Disabled'
description: 'This policy setting controls the ability to override malware scans when the following conditions are true: 1. installing an archive file 2. using a local manifest 3. via command line arguments The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 18.10.18.4
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'' -Name ''EnableLocalArchiveMalwareScanOverride'' -ErrorAction SilentlyContinue).''EnableLocalArchiveMalwareScanOverride''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''EnableLocalArchiveMalwareScanOverride='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppInstaller' -Name 'EnableLocalArchiveMalwareScanOverride' -Value 0 -PropertyType DWord -Force | Out-Null
