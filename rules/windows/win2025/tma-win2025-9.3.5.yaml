id: TMA-WIN2025-9.3.5
title: 'Ensure ''Windows Firewall: Public: Settings: Apply local connection security rules'' is set to ''No'''
description: 'This setting controls whether local administrators are allowed to create connection security rules that apply together with connection security rules configured by Group Policy. The recommended state for this setting is: No.'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 9.3.5
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile'' -Name ''AllowLocalIPsecPolicyMerge'' -ErrorAction SilentlyContinue).''AllowLocalIPsecPolicyMerge''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''AllowLocalIPsecPolicyMerge='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile' -Name 'AllowLocalIPsecPolicyMerge' -Value 0 -PropertyType DWord -Force | Out-Null
