id: TMA-WIN2025-18.6.7.7
title: 'Ensure ''Set authentication rate limiter delay (milliseconds)'' is set to ''Enabled: 2000'' or more'
description: 'This policy settings configures the SMB server invalid authentication delay value in milliseconds. The recommended state for this setting is: Enabled: 2000 or more. Note: This setting should be used in conjunction with the setting Enable authentication rate limiter.'
target: windows
os_family:
- windows-server-2025-dc
- windows-server-2025-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2025 Benchmark v2.1.0 - 18.6.7.7
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer'' -Name ''InvalidAuthenticationDelayTimeInMs'' -ErrorAction SilentlyContinue).''InvalidAuthenticationDelayTimeInMs''; if (-not ($null -ne $v -and [int64]$v -ge 2000)) { $bad += ''InvalidAuthenticationDelayTimeInMs='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\LanmanServer' -Name 'InvalidAuthenticationDelayTimeInMs' -Value 2000 -PropertyType DWord -Force | Out-Null
