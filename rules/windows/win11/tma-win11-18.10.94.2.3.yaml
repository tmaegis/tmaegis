id: TMA-WIN11-18.10.94.2.3
title: Ensure 'Enable features introduced via servicing that are off by default' is set to 'Disabled'
description: 'This policy settings configures whether or not features and enhancements that are introduced through monthly cumulative updates (servicing), are enabled on the system. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.94.2.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'' -Name ''AllowTemporaryEnterpriseFeatureControl'' -ErrorAction SilentlyContinue).''AllowTemporaryEnterpriseFeatureControl''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''AllowTemporaryEnterpriseFeatureControl='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate' -Name 'AllowTemporaryEnterpriseFeatureControl' -Value 0 -PropertyType DWord -Force | Out-Null
