id: TMA-WIN11-17.5.6
title: Ensure 'Audit Special Logon' is set to include 'Success'
description: 'This subcategory reports when a special logon is used. A special logon is a logon that has administrator-equivalent privileges and can be used to elevate a process to a higher level. Events for this subcategory include: • 4964 : Special groups have been assigned to a new logon. The recommended state for this setting is to include: Success.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 17.5.6
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce921b-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success'',''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce921b-69ae-11d9-bed3-505054503030}' /success:enable
