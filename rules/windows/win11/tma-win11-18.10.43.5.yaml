id: TMA-WIN11-18.10.43.5
title: 'Ensure ''Configure Microsoft Defender Application Guard clipboard settings: Clipboard behavior setting'' is set to ''Enabled: Enable clipboard operation from an isolated session to the host'''
description: 'This policy setting allows you to decide how the clipboard behaves while in Microsoft Defender Application Guard. The recommended state for this setting is: Enabled: Enable clipboard operation from an isolated session to the host. Note: Microsoft Defender Application Guard requires a 64-bit version of Windows and a CPU supporting hardware-assisted CPU virtualization (Intel VT-x or AMD-V). This feature is not officially supported on virtual hardware, although it can work on VMs (especially for testing) provided that the hardware-assisted CPU virtualization feature is exposed by the host to the '
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.43.5
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\AppHVSI'' -Name ''AppHVSIClipboardSettings'' -ErrorAction SilentlyContinue).''AppHVSIClipboardSettings''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''AppHVSIClipboardSettings='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\AppHVSI')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\AppHVSI' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\AppHVSI' -Name 'AppHVSIClipboardSettings' -Value 1 -PropertyType DWord -Force | Out-Null
