id: TMA-WIN11-2.3.14.1
title: 'Ensure ''System cryptography: Force strong key protection for user keys stored on the computer'' is set to ''User is prompted when the key is first used'' or higher'
description: 'This policy setting determines whether users'' private keys (such as their S-MIME keys) require a password to be used. The recommended state for this setting is: User is prompted when the key is first used. Configuring this setting to User must enter a password each time they use a key also conforms to the benchmark.'
target: windows
os_family:
- windows-11
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 2.3.14.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Cryptography'' -Name ''ForceKeyProtection'' -ErrorAction SilentlyContinue).''ForceKeyProtection''; if (-not ($null -ne $v -and @(1,2) -contains [int64]$v)) { $bad += ''ForceKeyProtection='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Cryptography')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Cryptography' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Cryptography' -Name 'ForceKeyProtection' -Value 1 -PropertyType DWord -Force | Out-Null
