id: TMA-WIN11-17.3.1
title: Ensure 'Audit PNP Activity' is set to include 'Success'
description: 'This policy setting allows you to audit when plug and play detects an external device. The recommended state for this setting is to include: Success. Note: A Windows 10, Server 2016 or newer OS is required to access and set this value in Group Policy.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 17.3.1
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9248-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success'',''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9248-69ae-11d9-bed3-505054503030}' /success:enable
