id: TMA-WIN11-2.3.11.7
title: 'Ensure ''Network security: LDAP client encryption requirements'' is set to ''Negotiate sealing'' or higher'
description: 'This policy setting determines the level of data encryption that is requested on behalf of clients that issue LDAP BIND requests. The recommended state for this setting is: Negotiate sealing. Configuring this setting to Require sealing also conforms to the Benchmark. Note: This policy setting does not have any impact on LDAP simple bind (ldap_simple_bind) or LDAP simple bind through SSL (ldap_simple_bind_s).'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 2.3.11.7
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LDAP'' -Name ''LDAPClientConfidentiality'' -ErrorAction SilentlyContinue).''LDAPClientConfidentiality''; if (-not ($null -ne $v -and @(1,2) -contains [int64]$v)) { $bad += ''LDAPClientConfidentiality='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LDAP')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LDAP' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LDAP' -Name 'LDAPClientConfidentiality' -Value 1 -PropertyType DWord -Force | Out-Null
