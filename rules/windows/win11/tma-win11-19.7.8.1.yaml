id: TMA-WIN11-19.7.8.1
title: Ensure 'Configure Windows spotlight on lock screen' is set to 'Disabled'
description: 'This policy setting lets you configure Windows Spotlight on the lock screen. The recommended state for this setting is: Disabled. Note: Per Microsoft TechNet, this policy setting only applies to Windows 10 Enterprise and Windows 10 Education editions.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 19.7.8.1
audit:
  type: registry
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\Software\Policies\Microsoft\Windows\CloudContent'') -Name ''ConfigureWindowsSpotlight'' -ErrorAction SilentlyContinue).''ConfigureWindowsSpotlight''; if (-not ($null -ne $v -and @(2) -contains [int64]$v)) { $_.PSChildName + '':ConfigureWindowsSpotlight='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure through Group Policy (User Configuration): User Configuration\Policies\Administrative Templates\Windows Components\Cloud Content\Configure Windows spotlight on lock screen'
