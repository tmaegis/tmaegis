id: TMA-WIN11-18.9.29.6
title: Ensure 'Turn off picture password sign-in' is set to 'Enabled'
description: 'This policy setting allows you to control whether a domain user can sign in using a picture password. The recommended state for this setting is: Enabled. Note: If the picture password feature is permitted, the user''s domain password is cached in the system vault when using it.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.9.29.6
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\System'' -Name ''BlockDomainPicturePassword'' -ErrorAction SilentlyContinue).''BlockDomainPicturePassword''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''BlockDomainPicturePassword='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\System')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\System' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\System' -Name 'BlockDomainPicturePassword' -Value 1 -PropertyType DWord -Force | Out-Null
