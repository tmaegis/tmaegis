id: TMA-WIN11-18.10.49.1
title: Ensure 'Enable news and interests on the taskbar' is set to 'Disabled'
description: 'This policy setting specifies whether the news and interests feature is allowed on the device. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-11
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.49.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds'' -Name ''EnableFeeds'' -ErrorAction SilentlyContinue).''EnableFeeds''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''EnableFeeds='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds' -Name 'EnableFeeds' -Value 0 -PropertyType DWord -Force | Out-Null
