id: TMA-WIN11-18.6.7.5
title: Ensure 'Enable remote mailslots' is set to 'Disabled'
description: 'This policy settings controls whether the SMB server will use remote mailslots over the computer browser service. The remote mailslots protocol is an old, simple, unreliable, and insecure inter-process communication method. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.6.7.5
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Bowser'' -Name ''EnableMailslots'' -ErrorAction SilentlyContinue).''EnableMailslots''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''EnableMailslots='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Bowser')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Bowser' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Bowser' -Name 'EnableMailslots' -Value 0 -PropertyType DWord -Force | Out-Null
