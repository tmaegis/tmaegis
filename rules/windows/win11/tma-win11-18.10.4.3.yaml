id: TMA-WIN11-18.10.4.3
title: Ensure 'Prevent non-admin users from installing packaged Windows apps' is set to 'Enabled'
description: 'This setting manages non-Administrator users'' ability to install Windows app packages. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.4.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Appx'' -Name ''BlockNonAdminUserInstall'' -ErrorAction SilentlyContinue).''BlockNonAdminUserInstall''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''BlockNonAdminUserInstall='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Appx')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Appx' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Appx' -Name 'BlockNonAdminUserInstall' -Value 1 -PropertyType DWord -Force | Out-Null
