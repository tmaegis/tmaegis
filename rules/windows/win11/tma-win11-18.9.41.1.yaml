id: TMA-WIN11-18.9.41.1
title: 'Ensure ''Configure SAM change password RPC methods policy'' is set to ''Enabled: Block all change password RPC methods'''
description: 'This policy setting determines which RPC methods can be used to change passwords stored in the Security Account Manager (SAM). The recommended state for this setting is: Enabled: Block all change password RPC methods.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.9.41.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM'' -Name ''SamrChangeUserPasswordApiPolicy'' -ErrorAction SilentlyContinue).''SamrChangeUserPasswordApiPolicy''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''SamrChangeUserPasswordApiPolicy='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM' -Name 'SamrChangeUserPasswordApiPolicy' -Value 1 -PropertyType DWord -Force | Out-Null
