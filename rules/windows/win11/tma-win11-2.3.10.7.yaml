id: TMA-WIN11-2.3.10.7
title: 'Ensure ''Network access: Remotely accessible registry paths'' is configured'
description: 'This policy setting determines which registry paths will be accessible over the network, regardless of the users or groups listed in the access control list (ACL) of the winreg registry key. The recommended state for this setting is: System\CurrentControlSet\Control\ProductOptions System\CurrentControlSet\Control\Server Applications Software\Microsoft\Windows NT\CurrentVersion Note: When this setting is configured, a list of one or more objects needs to be specified. The delimiter used when entering the list is a line feed or carriage return, that is, type the first object on the list, press t'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 2.3.10.7
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths'' -Name ''Machine'' -ErrorAction SilentlyContinue).''Machine''; if (-not ((@($v) | Where-Object { $_ } | ForEach-Object { $_.ToLower() } | Sort-Object) -join '','') -eq ''system\currentcontrolset\control\productoptions,system\currentcontrolset\control\server applications and software\microsoft\windows nt\currentversion'') { $bad += ''Machine='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths' -Name 'Machine' -Value @('System\CurrentControlSet\Control\ProductOptions','System\CurrentControlSet\Control\Server Applications and Software\Microsoft\Windows NT\CurrentVersion') -PropertyType MultiString -Force | Out-Null
