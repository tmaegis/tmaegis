id: TMA-WIN11-2.3.7.4
title: 'Configure ''Interactive logon: Message text for users attempting to log on'''
description: This policy setting specifies a text message that is displayed to users when they log on. Set the following group policy to a value that is consistent with the security and operational requirements of the organization.
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 2.3.7.4
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'' -Name ''LegalNoticeText'' -ErrorAction SilentlyContinue).''LegalNoticeText''; if (-not ($null -ne $v -and (($v -replace ''\s'','''') -eq ''text''))) { $bad += ''LegalNoticeText='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'LegalNoticeText' -Value 'text' -PropertyType String -Force | Out-Null
