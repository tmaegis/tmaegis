id: TMA-WIN11-19.6.6.1.1
title: Ensure 'Turn off Help Experience Improvement Program' is set to 'Enabled'
description: 'This policy setting specifies whether users can participate in the Help Experience Improvement program. The Help Experience Improvement program collects information about how customers use Windows Help so that Microsoft can improve it. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-11
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 19.6.6.1.1
audit:
  type: registry
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\Software\Policies\Microsoft\Assistance\Client\1.0'') -Name ''NoImplicitFeedback'' -ErrorAction SilentlyContinue).''NoImplicitFeedback''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':NoImplicitFeedback='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure through Group Policy (User Configuration): User Configuration\Policies\Administrative Templates\System\Internet Communication Management\Internet Communication Settings\Turn off Help Experience Improvement Program'
