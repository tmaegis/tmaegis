id: TMA-WIN11-18.10.3.1
title: Ensure 'Turn off API Sampling' is set to 'Enabled'
description: 'This policy setting determines if API data sampling is sent to Microsoft. API sampling monitors the sampled collection of APIs used during system runtime to help diagnose compatibility problems in Windows. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-11
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.3.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppCompat'' -Name ''DisableAPISamping'' -ErrorAction SilentlyContinue).''DisableAPISamping''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableAPISamping='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppCompat')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppCompat' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AppCompat' -Name 'DisableAPISamping' -Value 1 -PropertyType DWord -Force | Out-Null
