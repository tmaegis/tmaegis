id: TMA-WIN11-18.10.57.2.2
title: Ensure 'Disable Cloud Clipboard integration for server-to-client data transfer' is set to 'Enabled'
description: 'This policy setting controls whether data transferred from the remote session to the client using clipboard redirection is added to the client-side cloud clipboard. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-11
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.57.2.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client'' -Name ''DisableCloudClipboardIntegration'' -ErrorAction SilentlyContinue).''DisableCloudClipboardIntegration''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableCloudClipboardIntegration='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client' -Name 'DisableCloudClipboardIntegration' -Value 1 -PropertyType DWord -Force | Out-Null
