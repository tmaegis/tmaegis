id: TMA-WIN11-18.10.77.1.1
title: Ensure 'Automatic Data Collection' is set to 'Enabled'
description: 'This policy setting determines whether Enhanced Phishing Protection can collect additional information such as content displayed, sounds played, and application memory when users enter their work or school password into a suspicious website or app. The recommended state for this setting is: Enabled. Note: Per Microsoft, this information is used only for security purposes and helps SmartScreen determine whether the website or app is malicious.'
target: windows
os_family:
- windows-11
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 11 Enterprise Benchmark v5.1.0 - 18.10.77.1.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components'' -Name ''CaptureThreatWindow'' -ErrorAction SilentlyContinue).''CaptureThreatWindow''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''CaptureThreatWindow='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components' -Name 'CaptureThreatWindow' -Value 1 -PropertyType DWord -Force | Out-Null
