id: TMA-WIN-SMB1
title: Ensure SMBv1 server is disabled
description: SMBv1 is obsolete and exploitable.
target: windows
level: 1
severity: critical
tags:
- windows
- smb
reference: CIS Microsoft Windows Server Benchmark - Network / SMB
audit:
  type: command
  command: (Get-SmbServerConfiguration).EnableSMB1Protocol
  expected_output: 'False'
remediation:
  type: command
  command: Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
