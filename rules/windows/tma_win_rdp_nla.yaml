id: TMA-WIN-RDP-NLA
title: Ensure Network Level Authentication is required for RDP
description: UserAuthentication=1 requires NLA before a session is created.
target: windows
level: 1
severity: high
tags:
- windows
- rdp
reference: CIS Microsoft Windows Server Benchmark - Remote Desktop Services / Security
audit:
  type: command
  command: (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').UserAuthentication
  expected_output: '1'
remediation:
  type: command
  command: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Type DWord
