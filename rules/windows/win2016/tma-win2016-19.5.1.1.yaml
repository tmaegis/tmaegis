id: TMA-WIN2016-19.5.1.1
title: Ensure 'Turn off toast notifications on the lock screen' is set to 'Enabled'
description: This policy setting turns off toast notifications on the lock screen. The recommended state for this setting is Enabled.
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 19.5.1.1
audit:
  type: registry
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\Software\Policies\Microsoft\Windows\CurrentVersion\PushNotifications'') -Name ''NoToastApplicationNotificationOnLockScreen'' -ErrorAction SilentlyContinue).''NoToastApplicationNotificationOnLockScreen''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':NoToastApplicationNotificationOnLockScreen='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure through Group Policy (User Configuration): User Configuration\Policies\Administrative Templates\Start Menu and Taskbar\Notifications\Turn off toast notifications on the lock screen'
