id: TMA-WIN2016-18.10.57.3.11.1
title: Ensure 'Do not delete temp folders upon exit' is set to 'Disabled'
description: 'This policy setting specifies whether Remote Desktop Services retains a user''s per- session temporary folders at logoff. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 18.10.57.3.11.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'' -Name ''DeleteTempDirsOnExit'' -ErrorAction SilentlyContinue).''DeleteTempDirsOnExit''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DeleteTempDirsOnExit='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'DeleteTempDirsOnExit' -Value 1 -PropertyType DWord -Force | Out-Null
