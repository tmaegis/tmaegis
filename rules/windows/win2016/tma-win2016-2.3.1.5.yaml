id: TMA-WIN2016-2.3.1.5
title: 'Configure ''Accounts: Rename guest account'''
description: The built-in local guest account is another well-known name to attackers. It is recommended to rename this account to something that does not indicate its purpose. Even if you disable this account, which is recommended, ensure that you rename it for added security. On Domain Controllers, since they do not have their own local accounts, this rule refers to the built-in Guest account that was established when the domain was first created.
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 1
severity: high
tags:
- cis-converted
- secedit
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 2.3.1.5
audit:
  type: command
  command: '$f = Join-Path $env:TEMP (''tmaegis-'' + [guid]::NewGuid().ToString() + ''.inf''); secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null; $c = Get-Content $f -ErrorAction SilentlyContinue; Remove-Item $f -Force -ErrorAction SilentlyContinue; $line = $c | Where-Object { $_ -match ''^\s*NewGuestName\s*='' } | Select-Object -First 1; $v = if ($line) { ($line -split ''='', 2)[1].Trim().Trim(''"'') } else { $null }; if ($null -ne $v -and $v -ne ''Guest'') { ''compliant'' } else { ''non-compliant: '' + $v }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Set through Group Policy (domain policy for domain members): Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Rename guest account'
