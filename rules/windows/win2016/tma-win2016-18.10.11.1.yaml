id: TMA-WIN2016-18.10.11.1
title: Ensure 'Allow Use of Camera' is set to 'Disabled'
description: 'This policy setting controls whether the use of Camera devices on the machine are permitted. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 18.10.11.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Camera'' -Name ''AllowCamera'' -ErrorAction SilentlyContinue).''AllowCamera''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''AllowCamera='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Camera')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Camera' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Camera' -Name 'AllowCamera' -Value 0 -PropertyType DWord -Force | Out-Null
