id: TMA-WIN2016-18.6.11.4
title: Ensure 'Require domain users to elevate when setting a network's location' is set to 'Enabled'
description: 'This policy setting determines whether to require domain users to elevate when setting a network''s location. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 18.6.11.4
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections'' -Name ''NC_StdDomainUserSetLocation'' -ErrorAction SilentlyContinue).''NC_StdDomainUserSetLocation''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''NC_StdDomainUserSetLocation='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections' -Name 'NC_StdDomainUserSetLocation' -Value 1 -PropertyType DWord -Force | Out-Null
