id: TMA-WIN2016-18.9.27.1
title: Ensure 'Disallow copying of user input methods to the system account for sign-in' is set to 'Enabled'
description: 'This policy prevents automatic copying of user input methods to the system account for use on the sign-in screen. The user is restricted to the set of input methods that are enabled in the system account. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2016-dc
- windows-server-2016-ms
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 18.9.27.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\ControlPanel\International'' -Name ''BlockUserInputMethodsForSignIn'' -ErrorAction SilentlyContinue).''BlockUserInputMethodsForSignIn''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''BlockUserInputMethodsForSignIn='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\ControlPanel\International')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\ControlPanel\International' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\ControlPanel\International' -Name 'BlockUserInputMethodsForSignIn' -Value 1 -PropertyType DWord -Force | Out-Null
