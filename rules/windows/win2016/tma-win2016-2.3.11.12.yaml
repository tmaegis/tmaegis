id: TMA-WIN2016-2.3.11.12
title: 'Ensure ''Network security: Restrict NTLM: Audit NTLM authentication in this domain'' is set to ''Enable all'' (DC only)'
description: 'This policy setting allows auditing of NTLM authentication within the domain from the Domain Controller. The recommended state for this setting is: Enable all. Note: This setting is specific to each Domain Controller and will only log authentications made to that Domain Controller.'
target: windows
os_family:
- windows-server-2016-dc
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2016 Benchmark v4.0.0 - 2.3.11.12
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'' -Name ''AuditNTLMInDomain'' -ErrorAction SilentlyContinue).''AuditNTLMInDomain''; if (-not ($null -ne $v -and @(7) -contains [int64]$v)) { $bad += ''AuditNTLMInDomain='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -Name 'AuditNTLMInDomain' -Value 7 -PropertyType DWord -Force | Out-Null
