id: TMA-WIN10-18.10.43.17
title: Ensure 'Control whether exclusions are visible to local users' is set to 'Enabled'
description: 'This policy setting controls whether Microsoft Defender Antivirus exclusions are visible to local users on the system. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.43.17
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender'' -Name ''HideExclusionsFromLocalUsers'' -ErrorAction SilentlyContinue).''HideExclusionsFromLocalUsers''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''HideExclusionsFromLocalUsers='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender' -Name 'HideExclusionsFromLocalUsers' -Value 1 -PropertyType DWord -Force | Out-Null
