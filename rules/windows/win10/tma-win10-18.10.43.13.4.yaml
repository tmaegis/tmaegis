id: TMA-WIN10-18.10.43.13.4
title: 'Ensure ''Trigger a quick scan after X days without any scans'' is set to ''Enabled: 7'''
description: 'This policy setting configures the number of days after the last scan (of any type) before an aggressive Quick Scan is automatically triggered. The recommended state for this setting is: Enabled: 7 days.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.43.13.4
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''DaysUntilAggressiveCatchupQuickScan'' -ErrorAction SilentlyContinue).''DaysUntilAggressiveCatchupQuickScan''; if (-not ($null -ne $v -and @(7) -contains [int64]$v)) { $bad += ''DaysUntilAggressiveCatchupQuickScan='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan' -Name 'DaysUntilAggressiveCatchupQuickScan' -Value 7 -PropertyType DWord -Force | Out-Null
