id: TMA-WIN10-18.6.4.3
title: Ensure 'Turn off default IPv6 DNS Servers' is set to 'Enabled'
description: 'This policy setting controls whether the DNS client will use the default IPv6 DNS server addresses provided by Windows. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-10
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.6.4.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'' -Name ''DisableIPv6DefaultDnsServers'' -ErrorAction SilentlyContinue).''DisableIPv6DefaultDnsServers''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableIPv6DefaultDnsServers='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name 'DisableIPv6DefaultDnsServers' -Value 1 -PropertyType DWord -Force | Out-Null
