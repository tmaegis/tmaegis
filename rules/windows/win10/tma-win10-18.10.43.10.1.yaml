id: TMA-WIN10-18.10.43.10.1
title: Ensure 'Configure real-time protection and Security Intelligence Updates during OOBE' is set to 'Enabled'
description: 'This policy setting configures whether Real-time Protection and Security Intelligence Updates are enabled during the Out of Box experience (OOBE). The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.43.10.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection'' -Name ''OobeEnableRtpAndSigUpdate'' -ErrorAction SilentlyContinue).''OobeEnableRtpAndSigUpdate''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''OobeEnableRtpAndSigUpdate='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection' -Name 'OobeEnableRtpAndSigUpdate' -Value 1 -PropertyType DWord -Force | Out-Null
