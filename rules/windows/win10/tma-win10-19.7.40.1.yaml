id: TMA-WIN10-19.7.40.1
title: Ensure 'Turn off Windows Copilot' is set to 'Enabled'
description: 'This policy setting configures the use of Windows Copilot. Windows Copilot is an artificial intelligence (AI) assistant that''s integrated in Microsoft Windows workstation OSes, beginning with Windows 11 Release 23H2. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 19.7.40.1
audit:
  type: registry
  command: '$bad = @(); $bad += @(Get-ChildItem Registry::HKEY_USERS | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $_.PSChildName + ''\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot'') -Name ''TurnOffWindowsCopilot'' -ErrorAction SilentlyContinue).''TurnOffWindowsCopilot''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $_.PSChildName + '':TurnOffWindowsCopilot='' + $v } }); if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure through Group Policy (User Configuration): User Configuration\Policies\Administrative Templates\Windows Components\Windows Copilot\Turn off Windows Copilot'
