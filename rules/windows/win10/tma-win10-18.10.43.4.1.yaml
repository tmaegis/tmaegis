id: TMA-WIN10-18.10.43.4.1
title: Ensure 'Enable EDR in block mode' is set to 'Enabled'
description: 'This policy setting controls whether Microsoft Defender Antivirus Endpoint Detection and Response (EDR) is enabled in block mode (passive remediation). The recommended state for this setting is: Enabled. Note: EDR in block mode is only available in Microsoft Defender for Endpoint Plan 2. Note #2: This setting is available with Microsoft Defender Antivirus platform release v4.18.2202.X and newer.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.43.4.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Features'' -Name ''PassiveRemediation'' -ErrorAction SilentlyContinue).''PassiveRemediation''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''PassiveRemediation='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Features')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Features' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Features' -Name 'PassiveRemediation' -Value 1 -PropertyType DWord -Force | Out-Null
