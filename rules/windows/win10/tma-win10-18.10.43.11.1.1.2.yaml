id: TMA-WIN10-18.10.43.11.1.1.2
title: 'Ensure ''Configure Remote Encryption Protection Mode'' is set to ''Enabled: Audit'' or higher'
description: 'This policy setting configures the Brute-Force Protection feature in Microsoft Defender Antivirus. Brute-Force Protection can detect and block attempts to forcibly initiate sign- ins and sessions. The recommended state for this setting is: Enabled: Audit. Configuring this setting to Block also conforms to the benchmark. Note: Configuring the value to either Default or Off does not conform to this benchmark. Note #2: This setting''s name is duplicated in the Remote Encryption Protection section, but they configure two different behaviors.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.43.11.1.1.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection'' -Name ''BruteForceProtectionConfiguredState'' -ErrorAction SilentlyContinue).''BruteForceProtectionConfiguredState''; if (-not ($null -ne $v -and @(2,1) -contains [int64]$v)) { $bad += ''BruteForceProtectionConfiguredState='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection' -Name 'BruteForceProtectionConfiguredState' -Value 2 -PropertyType DWord -Force | Out-Null
