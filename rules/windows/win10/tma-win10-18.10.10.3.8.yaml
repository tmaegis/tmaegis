id: TMA-WIN10-18.10.10.3.8
title: '(BL) Ensure ''Choose how BitLocker-protected removable drives can be recovered: Configure storage of BitLocker recovery information to AD DS:'' is set to ''Enabled: Backup recovery passwords and key packages'''
description: This policy setting allows you to control how BitLocker-protected removable data drives are recovered in the absence of the required credentials. This policy setting is applied when you turn on BitLocker. In "Save BitLocker recovery information to Active Directory Domain Services" choose which BitLocker recovery information to store in AD DS for removable data drives. If you select "Backup recovery password and key package", both the BitLocker recovery password and key package are stored in AD DS. If you select "Backup recovery password only", only the recovery password is stored in AD DS. The
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.10.3.8
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE'' -Name ''RDVActiveDirectoryInfoToStore'' -ErrorAction SilentlyContinue).''RDVActiveDirectoryInfoToStore''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''RDVActiveDirectoryInfoToStore='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE' -Name 'RDVActiveDirectoryInfoToStore' -Value 1 -PropertyType DWord -Force | Out-Null
