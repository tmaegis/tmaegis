id: TMA-WIN10-18.10.10.3.11
title: (BL) Ensure 'Configure use of passwords for removable data drives' is set to 'Disabled'
description: 'This policy setting allows you to specify whether a password is required to unlock BitLocker-protected removable data drives. Note: This setting is enforced when turning on BitLocker, not when unlocking a drive. BitLocker will allow unlocking a drive with any of the protectors available on the drive. The recommended state for this setting is: Disabled.'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 18.10.10.3.11
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE'' -Name ''RDVPassphrase'' -ErrorAction SilentlyContinue).''RDVPassphrase''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''RDVPassphrase='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE' -Name 'RDVPassphrase' -Value 0 -PropertyType DWord -Force | Out-Null
