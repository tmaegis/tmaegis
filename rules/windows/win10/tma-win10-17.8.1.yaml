id: TMA-WIN10-17.8.1
title: Ensure 'Audit Sensitive Privilege Use' is set to 'Success and Failure'
description: 'This subcategory reports when a user account or service uses a sensitive privilege. A sensitive privilege includes the following user rights: • Act as part of the operating system • Back up files and directories • Create a token object • Debug programs • Enable computer and user accounts to be trusted for delegation • Generate security audits • Impersonate a client after authentication • Load and unload device drivers • Manage auditing and security log • Modify firmware environment values • Replace a process-level token • Restore files and directories • Take ownership of files or other objects'
target: windows
os_family:
- windows-10
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0 - 17.8.1
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9228-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9228-69ae-11d9-bed3-505054503030}' /success:enable /failure:enable
