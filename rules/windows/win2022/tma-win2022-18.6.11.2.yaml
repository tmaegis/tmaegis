id: TMA-WIN2022-18.6.11.2
title: Ensure 'Prohibit installation and configuration of Network Bridge on your DNS domain network' is set to 'Enabled'
description: 'You can use this procedure to control a user''s ability to install and configure a Network Bridge. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 18.6.11.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections'' -Name ''NC_AllowNetBridge_NLA'' -ErrorAction SilentlyContinue).''NC_AllowNetBridge_NLA''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''NC_AllowNetBridge_NLA='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\NetworkConnections' -Name 'NC_AllowNetBridge_NLA' -Value 0 -PropertyType DWord -Force | Out-Null
