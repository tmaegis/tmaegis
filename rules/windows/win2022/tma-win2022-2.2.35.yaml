id: TMA-WIN2022-2.2.35
title: Ensure 'Lock pages in memory' is set to 'No One'
description: 'This policy setting allows a process to keep data in physical memory, which prevents the system from paging the data to virtual memory on disk. If this user right is assigned, significant degradation of system performance can occur. The recommended state for this setting is: No One. Note: A Member Server with Microsoft SQL Server installed will require a special exception to this recommendation for additional SQL-generated entries to be granted this user right.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- secedit
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 2.2.35
audit:
  type: command
  command: '$f = Join-Path $env:TEMP (''tmaegis-'' + [guid]::NewGuid().ToString() + ''.inf''); secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null; $c = Get-Content $f -ErrorAction SilentlyContinue; Remove-Item $f -Force -ErrorAction SilentlyContinue; $line = $c | Where-Object { $_ -match ''^\s*SeLockMemoryPrivilege\s*='' } | Select-Object -First 1; $v = if ($line) { ($line -split ''='', 2)[1].Trim().Trim(''"'') } else { $null }; $have = @(if ($v) { $v -split '','' | ForEach-Object { $_.Trim().TrimStart(''*'') } | Where-Object { $_ } }); if ((($have | Sort-Object -Unique) -join '','') -eq '''') { ''compliant'' } else { ''non-compliant: '' + ($have -join '','') }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    function Get-TmaSec([string]$Key) {
      $f = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      secedit /export /cfg $f /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $c = Get-Content $f -ErrorAction SilentlyContinue
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      $line = $c | Where-Object { $_ -match ('^\s*' + $Key + '\s*=') } | Select-Object -First 1
      if ($line) { ($line -split '=', 2)[1].Trim().Trim('"') } else { $null }
    }
    function Backup-TmaSec {
      $bk = Join-Path $env:ProgramData 'TMAegis\backup'
      New-Item -ItemType Directory -Force -Path $bk | Out-Null
      secedit /export /cfg (Join-Path $bk ('secedit-' + (Get-Date -Format 'yyyyMMddHHmmss') + '.inf')) /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
    }
    function Set-TmaSec([string]$Section, [string]$Line) {
      $inf = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.inf')
      $db = Join-Path $env:TEMP ('tmaegis-' + [guid]::NewGuid().ToString() + '.sdb')
      $txt = @('[Unicode]', 'Unicode=yes', '[Version]', 'signature="$CHICAGO$"', 'Revision=1', ('[' + $Section + ']'), $Line) -join "`r`n"
      Set-Content -Path $inf -Value $txt -Encoding Unicode
      secedit /configure /db $db /cfg $inf /areas SECURITYPOLICY USER_RIGHTS /quiet | Out-Null
      $rc = $LASTEXITCODE
      Remove-Item $inf, $db -Force -ErrorAction SilentlyContinue
      if ($rc -ne 0) { throw ('secedit /configure failed: ' + $rc) }
    }
    $key = 'SeLockMemoryPrivilege'
    $cur = Get-TmaSec $key
    $have = @(if ($cur) { $cur -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Where-Object { $_ } })
    if ((($have | Sort-Object -Unique) -join ',') -ne '') {
      Backup-TmaSec
      Set-TmaSec 'Privilege Rights' ($key + ' = ' + '')
    }
  guidance: "Set through Group Policy (domain policy for domain members): Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\User Rights Assignment\\Lock pages in memory"
