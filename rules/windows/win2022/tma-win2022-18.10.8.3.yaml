id: TMA-WIN2022-18.10.8.3
title: 'Ensure ''Turn off Autoplay'' is set to ''Enabled: All drives'''
description: 'This policy setting controls Autoplay. Autoplay starts to read from a drive as soon as the media is inserted in the drive, which causes the setup file for programs or audio media to start immediately. The recommended state for this setting is: Enabled: All drives. Note: This policy setting cannot be used to enable Autoplay on computer drives in which it is disabled by default, such as floppy disk and network drives.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 18.10.8.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'' -Name ''NoDriveTypeAutoRun'' -ErrorAction SilentlyContinue).''NoDriveTypeAutoRun''; if (-not ($null -ne $v -and @(255) -contains [int64]$v)) { $bad += ''NoDriveTypeAutoRun='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' -Name 'NoDriveTypeAutoRun' -Value 255 -PropertyType DWord -Force | Out-Null
