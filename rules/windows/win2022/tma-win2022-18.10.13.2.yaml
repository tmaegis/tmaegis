id: TMA-WIN2022-18.10.13.2
title: Ensure 'Turn off cloud optimized content' is set to 'Enabled'
description: 'This policy setting turns off cloud optimized content in all Windows experiences. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 18.10.13.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\CloudContent'' -Name ''DisableCloudOptimizedContent'' -ErrorAction SilentlyContinue).''DisableCloudOptimizedContent''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DisableCloudOptimizedContent='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\CloudContent')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\CloudContent' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\CloudContent' -Name 'DisableCloudOptimizedContent' -Value 1 -PropertyType DWord -Force | Out-Null
