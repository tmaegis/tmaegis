id: TMA-WIN2022-2.3.17.3
title: 'Ensure ''User Account Control: Behavior of the elevation prompt for standard users'' is set to ''Automatically deny elevation requests'''
description: 'This policy setting controls the behavior of the elevation prompt for standard users. The recommended state for this setting is: Automatically deny elevation requests.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 2.3.17.3
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'' -Name ''ConsentPromptBehaviorUser'' -ErrorAction SilentlyContinue).''ConsentPromptBehaviorUser''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += ''ConsentPromptBehaviorUser='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ConsentPromptBehaviorUser' -Value 0 -PropertyType DWord -Force | Out-Null
