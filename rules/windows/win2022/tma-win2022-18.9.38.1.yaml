id: TMA-WIN2022-18.9.38.1
title: Ensure 'Enable RPC Endpoint Mapper Client Authentication' is set to 'Enabled' (MS only)
description: 'This policy setting controls whether RPC clients authenticate with the Endpoint Mapper Service when the call they are making contains authentication information. The Endpoint Mapper Service on computers running Windows NT4 (all service packs) cannot process authentication information supplied in this manner. The recommended state for this setting is: Enabled. Note: This policy will not be in effect until the system is rebooted.'
target: windows
os_family:
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 18.9.38.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'' -Name ''EnableAuthEpResolution'' -ErrorAction SilentlyContinue).''EnableAuthEpResolution''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''EnableAuthEpResolution='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Rpc')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Rpc' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Rpc' -Name 'EnableAuthEpResolution' -Value 1 -PropertyType DWord -Force | Out-Null
