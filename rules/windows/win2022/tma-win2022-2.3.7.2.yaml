id: TMA-WIN2022-2.3.7.2
title: 'Ensure ''Interactive logon: Don''t display last signed-in'' is set to ''Enabled'''
description: 'This policy setting determines whether the account name of the last user to log on to the client computers in your organization will be displayed on each computer''s respective Windows logon screen. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 2.3.7.2
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'' -Name ''DontDisplayLastUserName'' -ErrorAction SilentlyContinue).''DontDisplayLastUserName''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''DontDisplayLastUserName='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'DontDisplayLastUserName' -Value 1 -PropertyType DWord -Force | Out-Null
