id: TMA-WIN2022-17.5.3
title: Ensure 'Audit Logoff' is set to include 'Success'
description: 'This subcategory reports when a user logs off from the system. These events occur on the accessed computer. For interactive logons, the generation of these events occurs on the computer that is logged on to. If a network logon takes place to access a share, these events generate on the computer that hosts the accessed resource. If you configure this setting to No auditing, it is difficult or impossible to determine which user has accessed or attempted to access organization computers. Events for this subcategory include: • 4634: An account was logged off. • 4647: User initiated logoff. The rec'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 1
severity: high
tags:
- auditpol
- cis-converted
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 17.5.3
audit:
  type: command
  command: '$s = (auditpol /get /subcategory:''{0cce9216-69ae-11d9-bed3-505054503030}'' /r | ConvertFrom-Csv).''Inclusion Setting''; if (@(''Success'',''Success and Failure'') -contains $s) { ''compliant'' } else { ''non-compliant: '' + $s }'
  expected_output: compliant
remediation:
  type: command
  command: auditpol /set /subcategory:'{0cce9216-69ae-11d9-bed3-505054503030}' /success:enable
