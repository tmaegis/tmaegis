id: TMA-WIN2022-18.10.57.3.2.1
title: Ensure 'Restrict Remote Desktop Services users to a single Remote Desktop Services session' is set to 'Enabled'
description: 'This policy setting allows you to restrict users to a single Remote Desktop Services session. The recommended state for this setting is: Enabled.'
target: windows
os_family:
- windows-server-2022-dc
- windows-server-2022-ms
level: 2
severity: medium
tags:
- cis-converted
- registry
- windows
reference: CIS Microsoft Windows Server 2022 Benchmark v5.1.0 - 18.10.57.3.2.1
audit:
  type: registry
  command: '$bad = @(); $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'' -Name ''fSingleSessionPerUser'' -ErrorAction SilentlyContinue).''fSingleSessionPerUser''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''fSingleSessionPerUser='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: if (-not (Test-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services')) { New-Item -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Force | Out-Null }; New-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fSingleSessionPerUser' -Value 1 -PropertyType DWord -Force | Out-Null
