id: TMA-WIN-FIREWALL
title: Ensure Windows Firewall is enabled for all profiles
description: The host firewall must be on for Domain, Private and Public profiles.
target: windows
level: 1
severity: high
tags:
- windows
- firewall
reference: CIS Microsoft Windows Server Benchmark - Windows Defender Firewall with Advanced Security
audit:
  type: command
  command: (Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count
  expected_output: '0'
remediation:
  type: command
  command: Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
