id: TMA-FIREFOX-1.1.31
title: Ensure 'Disable Form History' is set to 'Enabled'
description: 'Form Fill Assistance allows Firefox to save data that has been entered into forms by users so that future operations are performed faster. The recommended state for this setting is: Enabled. Rationale: This mitigates the risk of websites extracting information from prefilled text fields. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox:DisableFormHistory (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 2
severity: low
tags:
- firefox
- browser
- cis-l2
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.31 Ensure 'Disable Form History' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'' -Name ''DisableFormHistory'' -ErrorAction SilentlyContinue).''DisableFormHistory''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DisableFormHistory' -Value 1 -PropertyType DWord -Force | Out-Null
