id: TMA-FIREFOX-1.1.19.1
title: 'Ensure ''Connection Type'' is set to ''Enabled: No Proxy'''
description: 'Firefox can be configured to use one or more proxy servers. When a proxy server is configured for a given protocol (HTTP, FTP, Gopher, etc), Firefox will send applicable requests to that proxy server for fulfillment. The recommended state for this setting is: Enabled: No Proxy. Rationale: Depending on the protocol used, the proxy server will have access to read and/or alter all information communicated between Firefox and the target server, such a web site. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Proxy:Mode (REG_SZ); compliant when it is ''none'' (whitespace-insensitive). Remediation writes none locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: 'CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.19.1 Ensure ''Connection Type'' is set to ''Enabled: No Proxy'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Proxy'' -Name ''Mode'' -ErrorAction SilentlyContinue).''Mode''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and ("$v" -replace ''\s'','''') -eq ''none'')) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Proxy'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Mode' -Value 'none' -PropertyType String -Force | Out-Null
