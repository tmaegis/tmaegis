id: TMA-FIREFOX-1.1.18.10
title: Ensure 'security.mixed_content.block_active_content' is set to 'Enabled'
description: 'This policy setting configures the ability to view HTTP content such as JavaScript, CSS, objects, and xhr requests. The recommended state for this setting is: Enabled. Rationale: Blocking active mixed content minimizes the risk of man-in-the-middle attacks. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences:security.mixed_content.block_active_content (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.18.10 Ensure 'security.mixed_content.block_active_content' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'' -Name ''security.mixed_content.block_active_content'' -ErrorAction SilentlyContinue).''security.mixed_content.block_active_content''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'security.mixed_content.block_active_content' -Value 1 -PropertyType DWord -Force | Out-Null
