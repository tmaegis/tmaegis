id: TMA-FIREFOX-1.1.18.8
title: Ensure 'media.peerconnection.enabled' is set to 'Disabled'
description: 'This policy setting determines whether Web Real Time Communications (WebRTC) is allowed. WebRTC is used for peer-to-peer communication such as file sharing or video calls. The recommended state for this setting is: Disabled. Rationale: WebRTC can expose private information such as internal IP addresses and computer settings. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences:media.peerconnection.enabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.18.8 Ensure 'media.peerconnection.enabled' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'' -Name ''media.peerconnection.enabled'' -ErrorAction SilentlyContinue).''media.peerconnection.enabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'media.peerconnection.enabled' -Value 0 -PropertyType DWord -Force | Out-Null
