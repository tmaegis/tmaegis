id: TMA-FIREFOX-1.1.20.1
title: Ensure 'Search Suggestions' is set to 'Disabled'
description: 'This policy setting determines whether web search suggestions are used in Firefox. The recommended state for this setting is: Disabled. Rationale: Characters that are typed by the user are sent to a search engine before the Enter key is pressed therefore, it is possible for unintended data to be sent. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox:SearchSuggestEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 2
severity: low
tags:
- firefox
- browser
- cis-l2
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.20.1 Ensure 'Search Suggestions' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'' -Name ''SearchSuggestEnabled'' -ErrorAction SilentlyContinue).''SearchSuggestEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SearchSuggestEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
