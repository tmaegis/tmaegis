id: TMA-FIREFOX-1.1.23.1
title: Ensure 'Extension Recommendations' is set to 'Disabled'
description: 'This policy setting configures if Firefox can send recommendations on extensions based on user data as they navigate the web. The recommended state for this setting is: Disabled. Rationale: Enabling recommended extensions could allow data to be transmitted to a third-party, which could lead to sensitive data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging:ExtensionRecommendations (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: low
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.23.1 Ensure 'Extension Recommendations' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging'' -Name ''ExtensionRecommendations'' -ErrorAction SilentlyContinue).''ExtensionRecommendations''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ExtensionRecommendations' -Value 0 -PropertyType DWord -Force | Out-Null
