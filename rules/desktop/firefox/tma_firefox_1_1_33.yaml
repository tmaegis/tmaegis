id: TMA-FIREFOX-1.1.33
title: Ensure 'Disable Private Browsing' is set to 'Enabled'
description: 'This policy setting determines whether private browsing is allowed. The recommended state for this setting is: Enabled. Rationale: Disabling Private Browsing for Firefox will ensure that browsing data is logged on the system, which may be important for forensics. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox:DisablePrivateBrowsing (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.33 Ensure 'Disable Private Browsing' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'' -Name ''DisablePrivateBrowsing'' -ErrorAction SilentlyContinue).''DisablePrivateBrowsing''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DisablePrivateBrowsing' -Value 1 -PropertyType DWord -Force | Out-Null
