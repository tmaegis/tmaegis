id: TMA-FIREFOX-1.1.12.1
title: Ensure 'Activate Flash on websites' is set to 'Disabled'
description: 'This policy setting configures the use of Flash on websites. The recommended state for this setting is: Disabled. Rationale: Firefox ended support for Adobe Flash at the end of 2020. Unsupported software could lead to an attacker exploiting vulnerabilities that are not patched with updates. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\FlashPlugin:Default (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.12.1 Ensure 'Activate Flash on websites' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\FlashPlugin'' -Name ''Default'' -ErrorAction SilentlyContinue).''Default''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\FlashPlugin'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Default' -Value 0 -PropertyType DWord -Force | Out-Null
