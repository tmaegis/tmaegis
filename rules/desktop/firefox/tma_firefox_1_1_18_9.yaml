id: TMA-FIREFOX-1.1.18.9
title: Ensure 'network.IDN_show_punycode' is set to 'Enabled'
description: 'This setting determines whether Internationalized Domain Names (IDNs) displayed in the browser are displayed as Punycode or as Unicode. The recommended state for this setting is: Enabled. Rationale: IDNs displayed in Punycode are easier to identify and therefore help mitigate the risk of accessing spoofed web pages. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences:network.IDN_show_punycode (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 2
severity: medium
tags:
- firefox
- browser
- cis-l2
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.18.9 Ensure 'network.IDN_show_punycode' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'' -Name ''network.IDN_show_punycode'' -ErrorAction SilentlyContinue).''network.IDN_show_punycode''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'network.IDN_show_punycode' -Value 1 -PropertyType DWord -Force | Out-Null
