id: TMA-FIREFOX-1.1.18.1
title: Ensure 'browser.safebrowsing.malware.enabled' is set to 'Enabled'
description: 'This policy setting configures the use of alerts to users if they are visiting a known malicious website. The recommended state for this setting is: Enabled. Rationale: Build-in anti-exploitation features can reduce the risk of a user falling victim to a known malicious web site. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences:browser.safebrowsing.malware.enabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: high
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.18.1 Ensure 'browser.safebrowsing.malware.enabled' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'' -Name ''browser.safebrowsing.malware.enabled'' -ErrorAction SilentlyContinue).''browser.safebrowsing.malware.enabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'browser.safebrowsing.malware.enabled' -Value 1 -PropertyType DWord -Force | Out-Null
