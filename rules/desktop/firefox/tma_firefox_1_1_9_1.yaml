id: TMA-FIREFOX-1.1.9.1
title: Ensure 'Lock Encrypted Media Extensions' is set to 'Enabled'
description: 'This policy setting configures whether encrypted media extensions (EME) are downloaded automatically without user consent. EME is a JavaScript API for playing DRMed video content in HTML. The recommended state for this setting is: Enabled. Rationale: Downloading media from the internet without user consent could lead to malicious content being downloaded and deployed to the system. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\EncryptedMediaExtensions:Locked (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.9.1 Ensure 'Lock Encrypted Media Extensions' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\EncryptedMediaExtensions'' -Name ''Locked'' -ErrorAction SilentlyContinue).''Locked''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\EncryptedMediaExtensions'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Locked' -Value 1 -PropertyType DWord -Force | Out-Null
