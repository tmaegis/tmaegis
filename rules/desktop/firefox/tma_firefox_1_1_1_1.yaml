id: TMA-FIREFOX-1.1.1.1
title: Ensure 'Allow add-on installs from websites' is set to 'Disabled'
description: 'This policy setting configures the ability for websites to automatically install add-ons without an allow list. The recommended state for this setting is: Disabled. Note: If this setting is enabled, an allow list will be needed for approved add-ons. Rationale: Add-ons are extensions of the browser that add new functionality to Firefox or change its appearance. These run in a user session allowing them to manipulate data and the behavior of the way Firefox interacts with other applications and user commands. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\InstallAddonsPermission:Default (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.1.1 Ensure 'Allow add-on installs from websites' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\InstallAddonsPermission'' -Name ''Default'' -ErrorAction SilentlyContinue).''Default''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\InstallAddonsPermission'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Default' -Value 0 -PropertyType DWord -Force | Out-Null
