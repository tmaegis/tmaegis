id: TMA-FIREFOX-1.1.18.7
title: Ensure 'extensions.blocklist.enabled' is set to 'Enabled'
description: 'This feature enables Mozilla Firefox to retrieve a list of blocked applications from the server. The recommended state for this setting is: Enabled. Rationale: Enabling Mozilla to access the list of blocked applications mitigates the risk of installing a known malicious application. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences:extensions.blocklist.enabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.18.7 Ensure 'extensions.blocklist.enabled' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'' -Name ''extensions.blocklist.enabled'' -ErrorAction SilentlyContinue).''extensions.blocklist.enabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Preferences'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'extensions.blocklist.enabled' -Value 1 -PropertyType DWord -Force | Out-Null
