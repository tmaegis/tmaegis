id: TMA-FIREFOX-1.1.6.1
title: 'Ensure ''Cookie Behavior'' is set to ''Enabled: Reject cookies for known trackers and partition third-party cookies'''
description: 'This policy setting configures the ability for third-party cookies to be downloaded to the system. Third party cookies are cookies sent by a domain that differs from the domain in the browser''s address bar. The recommended state for this setting is: Enabled: Reject cookies for known trackers and partition third-party cookies. Rationale: Third party cookies are often used for tracking user browsing behaviors, which has privacy implications. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Cookies:Behavior (REG_SZ); compliant when it is ''reject-tracker-and-partition-foreign'' (whitespace-insensitive). Remediation writes reject-tracker-and-partition-foreign locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: low
tags:
- firefox
- browser
- cis-l1
reference: 'CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.6.1 Ensure ''Cookie Behavior'' is set to ''Enabled: Reject cookies for known trackers and partition third-party cookies'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Cookies'' -Name ''Behavior'' -ErrorAction SilentlyContinue).''Behavior''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and ("$v" -replace ''\s'','''') -eq ''reject-tracker-and-partition-foreign'')) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\Cookies'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Behavior' -Value 'reject-tracker-and-partition-foreign' -PropertyType String -Force | Out-Null
