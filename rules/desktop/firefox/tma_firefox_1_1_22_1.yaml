id: TMA-FIREFOX-1.1.22.1
title: Ensure 'Cryptomining' is set to 'Enabled'
description: 'This policy setting configures Firefox''s Cryptomining Protection. Cryptomining Protection will automatically block known crypto mining domains that distribute crypto mining scripts. The recommended state for this setting is: Enabled. Rationale: Crypto mining scripts utilize a computer''s central processing unit (CPU) to invisibly mine cryptocurrency. This feature allows Firefox to stop this potential malicious content from loading. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Mozilla\Firefox\EnableTrackingProtection:Cryptomining (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: firefox
level: 1
severity: medium
tags:
- firefox
- browser
- cis-l1
reference: CIS Mozilla Firefox ESR GPO Benchmark v1.0.0 - 1.1.22.1 Ensure 'Cryptomining' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\EnableTrackingProtection'' -Name ''Cryptomining'' -ErrorAction SilentlyContinue).''Cryptomining''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\EnableTrackingProtection'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Cryptomining' -Value 1 -PropertyType DWord -Force | Out-Null
