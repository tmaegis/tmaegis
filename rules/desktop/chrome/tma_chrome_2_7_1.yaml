id: TMA-CHROME-2.7.1
title: Ensure 'Enable Google Cloud Print Proxy' is set to 'Disabled'
description: 'This setting enables Google Chrome to act as a proxy between Google Cloud Print and legacy printers connected to the machine. The recommended state for this setting is: Disabled (0) Rationale: Disabling this option will prevent users from printing documents from unmanaged devices to an organization''s printer. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: high
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.7.1 Ensure 'Enable Google Cloud Print Proxy' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''CloudPrintProxyEnabled'' -ErrorAction SilentlyContinue).''CloudPrintProxyEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'CloudPrintProxyEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
