id: TMA-CHROME-1.23
title: Ensure 'Import of homepage from default browser on first run' is set to 'Disabled'
description: 'This setting controls whether users are able to import homepage settings from another browser into Google Chrome as well as whether homepage settings are imported on first use. If you set this setting to Disabled users will be unable to perform an import homepage settings from other browsers into Google Chrome. The recommended state for this setting is: Disabled (0) Rationale: Having the homepage setting automatically imported or allowing users to import this setting from another browser into Google Chrome allows for the potential of compromised settings being imported into Google Chrome. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:ImportHomepage (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.23 Ensure 'Import of homepage from default browser on first run' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ImportHomepage'' -ErrorAction SilentlyContinue).''ImportHomepage''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ImportHomepage' -Value 0 -PropertyType DWord -Force | Out-Null
