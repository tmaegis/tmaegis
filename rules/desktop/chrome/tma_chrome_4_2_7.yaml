id: TMA-CHROME-4.2.7
title: Ensure 'Allow Window Management permission on these sites' Is Configured
description: 'This setting can automatically allow access to the window management permissions for specific sites. If the value for WindowManagementAllowedForUrls is not changed from the default, it will follow the configuration of DefaultWindowManagementSetting. Rationale: Allowing only specific sites to have access to Window Management will only allow permitted sites to see information about the device''s screens, open additional browser windows specifying location, and size of the window. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 2
severity: low
tags:
- chrome
- browser
- cis-l2
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 4.2.7 Ensure 'Allow Window Management permission on these sites' Is Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Allow Window Management permission on these sites is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s allowed URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\WindowManagementAllowedForUrls\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Allow Window Management permission on these sites = Enabled and set Show to the approved URLs'
