id: TMA-CHROME-1.15
title: Ensure 'Enable component updates in Google Chrome' is set to 'Enabled'
description: 'Google Chrome''s Component Updater updates several components of Google Chrome on a regular basis (applies only to Chrome browser components). The recommended state for this setting is: Enabled (1) NOTE: Updates to any component that does not contain executable code, does not significantly alter the behavior of the browser, or is critical for its security will not be disabled (E.g. Rationale: Google Chrome Updater shall be used to keep the components bundled to Chrome up- to-date. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:ComponentUpdatesEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.15 Ensure 'Enable component updates in Google Chrome' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ComponentUpdatesEnabled'' -ErrorAction SilentlyContinue).''ComponentUpdatesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ComponentUpdatesEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
