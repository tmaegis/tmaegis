id: TMA-CHROME-2.8.7
title: Ensure 'Enable the use of relay servers by the remote access host' is set to 'Disabled'.
description: 'Google Chrome allows the use of relay servers when clients are trying to connect to this machine and a direct connection is not available. - Disable (0): The use of relay servers by the remote access host is not allowed - Enabled (1): The use of relay servers by the remote access host is allowed The recommended state for this setting is: Disabled (0) Rationale: Relay servers shall not be used to circumvent firewall restrictions. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowRelayedConnection (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: high
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.8.7 Ensure 'Enable the use of relay servers by the remote access host' is set to 'Disabled'.
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''RemoteAccessHostAllowRelayedConnection'' -ErrorAction SilentlyContinue).''RemoteAccessHostAllowRelayedConnection''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'RemoteAccessHostAllowRelayedConnection' -Value 0 -PropertyType DWord -Force | Out-Null
