id: TMA-CHROME-2.27
title: Ensure 'Http Allowlist' Is Properly Configured
description: 'This setting allows administrators to list specific sites that will not be upgraded to HTTPS and will not show an error interstitial if HTTPS-First Mode is enabled. Note: Wildcards (*, [*], etc.) are not allowed in the URL listings. Rationale: Setting this policy allows organizations to maintain access to servers that do not support HTTPS without having to disable HTTPS-First mode or HTTPS Upgrades. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.27 Ensure 'Http Allowlist' Is Properly Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\HTTP Allowlist is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s allowed URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\HttpAllowlist\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\HTTP Allowlist = Enabled and set Show to the approved URLs'
