id: TMA-CHROME-2.19
title: 'Ensure ''Set the time period for update notifications'' is set to ''Enabled: 86400000'''
description: 'Google Chrome allows to set the time period, in milliseconds, over which users are notified that it must be relaunched to apply a pending update. If not set, or Disabled, the default period of 604800000 milliseconds (7 days) is used. The recommended state for this setting is: Enabled with value 86400000 (1 day) Rationale: This setting is a notification for the end-user informing them that an update has been applied and that the browser must be restarted in order for the update to be completed. Once updates have been pushed by the organization it is pertinent that said update takes effect as soon as possible. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:RelaunchNotificationPeriod (REG_DWORD); compliant when it is 86400000. Remediation writes 86400000 locally; in a domain set it through the ADMX so Group Policy does not
  revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: 'CIS Google Chrome Benchmark v3.0.0 - 2.19 Ensure ''Set the time period for update notifications'' is set to ''Enabled: 86400000'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''RelaunchNotificationPeriod'' -ErrorAction SilentlyContinue).''RelaunchNotificationPeriod''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(86400000) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'RelaunchNotificationPeriod' -Value 86400000 -PropertyType DWord -Force | Out-Null
