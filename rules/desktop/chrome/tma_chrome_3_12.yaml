id: TMA-CHROME-3.12
title: Ensure 'Enable reporting of usage and crash-related data' is set to 'Disabled'
description: "This setting controls anonymous reporting of usage and crash-related data about Google Chrome to Google. The recommended state for this setting is: Disabled (0) NOTE: This setting is not available on Windows instances that are not joined to a Microsoft\xAE Active Directory\xAE domain. Rationale: Anonymous crash/usage data can be used to identify people, companies and information, which can be considered data ex-filtration from company systems. Audit reads the Group Policy registry value and prints 'compliant', 'unset' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\\SOFTWARE\\Policies\\Google\\Chrome:MetricsReportingEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it."
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.12 Ensure 'Enable reporting of usage and crash-related data' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''MetricsReportingEnabled'' -ErrorAction SilentlyContinue).''MetricsReportingEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'MetricsReportingEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
