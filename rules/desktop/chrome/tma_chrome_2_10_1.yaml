id: TMA-CHROME-2.10.1
title: Ensure 'Allow automatic sign-in to Microsoft cloud identity providers' Is Enabled
description: "This policy setting allows accounts backed by a Microsoft\xAE cloud identity provider (i.e., Microsoft Azure Active Directory or the consumer Microsoft account identity provider) can be signed into web properties using that identity automatically. Rationale: Enabling this policy setting allows users to use Microsoft Cloud Authentication for any site that requires CA (Cloud Authentication) and does not require an extension. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps."
target: chrome
level: 1
severity: high
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.10.1 Ensure 'Allow automatic sign-in to Microsoft cloud identity providers' Is Enabled
audit:
  type: manual
  command: "Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\\Policies\\Administrative Templates\\Google\\Google Chrome\\Microsoft\xAE Active Directory\xAE management settings\\Allow automatic sign- in to Microsoft\xAE cloud identity providers is configured as the title requires. This group policy setting is backed by the following registry location which should be set to 1: Registry: HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Google\\Chrome:CloudAPAuthEnabled"
remediation:
  type: iac_patch
  command: "Configure through Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Google\\Google Chrome\\Microsoft\xAE Active Directory\xAE management settings\\Allow automatic sign- in to Microsoft\xAE cloud identity providers = Enabled: Enable Microsoft\xAE cloud authentication"
