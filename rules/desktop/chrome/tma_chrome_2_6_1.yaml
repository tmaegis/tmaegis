id: TMA-CHROME-2.6.1
title: Ensure 'Enable saving passwords to the password manager' is Explicitly Configured
description: 'Google Chrome has a built-in password manager to store passwords for users. Chrome will use local authentication to allow users to gain access to these passwords. The recommended state for this setting is: Explicitly set to Enabled (1) or Disabled (0) based on the organization''s needs. Rationale: The Google Chrome password manager is Enabled by default and each organization should review and determine if they want to allow users to store passwords in the Browser. If another solution is used instead of the built in Chrome option then an organization should configure the setting to Disabled. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.6.1 Ensure 'Enable saving passwords to the password manager' is Explicitly Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Polices\Administrative Templates\Google\Google Chrome\Password manager\Enable saving passwords to the password manager is configured as the title requires. This group policy setting is backed by the following registry location which should be set to 0 or 1 (Organization dependent): Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:PasswordManagerEnabled'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Polices\Administrative Templates\Google\Google Chrome\Password manager\Enable saving passwords to the password manager'
