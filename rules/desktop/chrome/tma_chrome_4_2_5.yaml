id: TMA-CHROME-4.2.5
title: Ensure 'Default clipboard setting' Is 'Enabled' to 'Deny Permissions'
description: 'This setting controls the defaults for clipboard permission access from sites. It can be configured to either: - Disabled (2): Does not allow access to the clipboard site permission by any site - Enabled (3): Sites ask the user to allow access to the clipboard site permission If the value for DefaultClipboardSetting is not changed from the default, it will behave as if it is enabled. Rationale: The clipboard stores data, text, and images that are shared between all applications. An organization would disable clipboard access to restrict sites from reading the contents of the clipboard when visiting. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:DefaultClipboardSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 4.2.5 Ensure 'Default clipboard setting' Is 'Enabled' to 'Deny Permissions'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''DefaultClipboardSetting'' -ErrorAction SilentlyContinue).''DefaultClipboardSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultClipboardSetting' -Value 2 -PropertyType DWord -Force | Out-Null
