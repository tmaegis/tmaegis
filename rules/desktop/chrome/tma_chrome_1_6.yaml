id: TMA-CHROME-1.6
title: Ensure 'Ask where to save each file before downloading' is set to 'Enabled'
description: 'Google Chrome offers to download files automatically to the default download directory without prompting. If this setting is enabled, users are always asked where to save each file before downloading. The recommended state for this setting is: Enabled (1) Rationale: Users shall be prevented from the drive-by-downloads threat. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:PromptForDownloadLocation (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.6 Ensure 'Ask where to save each file before downloading' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''PromptForDownloadLocation'' -ErrorAction SilentlyContinue).''PromptForDownloadLocation''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'PromptForDownloadLocation' -Value 1 -PropertyType DWord -Force | Out-Null
