id: TMA-CHROME-2.3.6
title: Ensure 'Control Manifest v2 extension availability' Is Set to Forced Only
description: 'This policy setting controls extension management settings for Google Chrome, specifically v2 extensions. This policy setting is being sunsetted as Google develops the Manifest v3, but that rollout is currently postponed. Rationale: Setting this to Forced Only will not allow users to install any additional v2 extensions, and all existing, non-forced, v2 extensions will be disabled. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:ExtensionManifestV2Availability (REG_DWORD); compliant when it is 3. Remediation writes 3 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: medium
tags:
- chrome
- browser
- cis-l2
reference: CIS Google Chrome Benchmark v3.0.0 - 2.3.6 Ensure 'Control Manifest v2 extension availability' Is Set to Forced Only
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ExtensionManifestV2Availability'' -ErrorAction SilentlyContinue).''ExtensionManifestV2Availability''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(3) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ExtensionManifestV2Availability' -Value 3 -PropertyType DWord -Force | Out-Null
