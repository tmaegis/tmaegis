id: TMA-CHROME-3.1.1
title: 'Ensure ''Default cookies setting'' is set to ''Enabled: Keep cookies for the duration of the session'''
description: 'When leaving the setting _RestoreOnStartup _unset results in the use of _DefaultCookiesSetting _for all sites, if it''s set. If _DefaultCookiesSetting _is not set, the user''s personal setting applies. Rationale: Permanently stored cookies may be used for malicious intent. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting (REG_DWORD); compliant when it is 4. Remediation writes 4 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: low
tags:
- chrome
- browser
- cis-l2
reference: 'CIS Google Chrome Benchmark v3.0.0 - 3.1.1 Ensure ''Default cookies setting'' is set to ''Enabled: Keep cookies for the duration of the session'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''DefaultCookiesSetting'' -ErrorAction SilentlyContinue).''DefaultCookiesSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(4) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultCookiesSetting' -Value 4 -PropertyType DWord -Force | Out-Null
