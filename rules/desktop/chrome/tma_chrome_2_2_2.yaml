id: TMA-CHROME-2.2.2
title: 'Ensure ''Control use of the Web Bluetooth API'' is set to ''Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API'''
description: 'Google Chrome has an API which allows the access to nearby Bluetooth devices from the browser with users consent. - Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API (2) - Allow sites to ask the user to grant access to a nearby Bluetooth device (3) The recommended state for this setting is: Enabled with a value of Do not allow any site to request access to Bluetooth devices via th... Rationale: A malicious website could exploit a vulnerable Bluetooth device. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:DefaultWebBluetoothGuardSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: medium
tags:
- chrome
- browser
- cis-l2
reference: 'CIS Google Chrome Benchmark v3.0.0 - 2.2.2 Ensure ''Control use of the Web Bluetooth API'' is set to ''Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''DefaultWebBluetoothGuardSetting'' -ErrorAction SilentlyContinue).''DefaultWebBluetoothGuardSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultWebBluetoothGuardSetting' -Value 2 -PropertyType DWord -Force | Out-Null
