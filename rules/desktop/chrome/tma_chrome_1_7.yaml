id: TMA-CHROME-1.7
title: Ensure 'Continue running background apps when Google Chrome is closed' is set to 'Disabled'
description: 'Chrome allows for processes started while the browser is open to remain running once the browser has been closed. It also allows for background apps and the current browsing session to remain active after the browser has been closed. With this setting Disabled, the browser will close its processes and will stop running background apps. The recommended state for this setting is: Disabled (0) Rationale: If this setting is enabled, vulnerable or malicious plugins, apps and processes can continue running even after Chrome has closed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.7 Ensure 'Continue running background apps when Google Chrome is closed' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''BackgroundModeEnabled'' -ErrorAction SilentlyContinue).''BackgroundModeEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'BackgroundModeEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
