id: TMA-CHROME-1.18
title: Ensure 'Enable security warnings for command-line flags' is set to 'Enabled'
description: 'This setting prevents Google Chrome from showing security warnings that potentially dangerous command-line flags are in use at its launch. The recommended state of this setting is: Enabled (0) Rationale: If Google Chrome is being launched with potentially dangerous flags, this information should be exposed to the user as a warning. If not, the user may be unintentionally using non-secure settings and be exposed to security flaws. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:CommandLineFlagSecurityWarningsEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.18 Ensure 'Enable security warnings for command-line flags' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''CommandLineFlagSecurityWarningsEnabled'' -ErrorAction SilentlyContinue).''CommandLineFlagSecurityWarningsEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'CommandLineFlagSecurityWarningsEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
