id: TMA-CHROME-3.8
title: Ensure 'Enable alternate error pages' is set to 'Disabled'
description: 'Google Chrome offers to show suggestions for the page you were trying to reach when it is unable to connect to a web address such as ''Page Not Found''. The recommended state for this setting is: Disabled (0) Rationale: Using navigation suggestions may leak information about the web site intended to be visited. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:AlternateErrorPagesEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.8 Ensure 'Enable alternate error pages' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''AlternateErrorPagesEnabled'' -ErrorAction SilentlyContinue).''AlternateErrorPagesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AlternateErrorPagesEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
