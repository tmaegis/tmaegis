id: TMA-CHROME-4.4
title: Ensure 'Allow or deny audio capture' is set to 'Disabled'
description: 'This setting allows administrators to set whether the end-user is prompted for access to audio capture devices. - Disabled (0): Turns off prompts and audio capture will only work for URLs configured in the AudioCaptureAllowedUrls list. - Enabled (1): With the exception of URLs set in the AudioCaptureAllowedUrls list, users get prompted for audio capture access. Rationale: The end-user having the ability to allow or deny audio capture for websites in Google Chrome could open an organization up to a malicious site that may capture proprietary information through the browser. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:AudioCaptureAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: medium
tags:
- chrome
- browser
- cis-l2
reference: CIS Google Chrome Benchmark v3.0.0 - 4.4 Ensure 'Allow or deny audio capture' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''AudioCaptureAllowed'' -ErrorAction SilentlyContinue).''AudioCaptureAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AudioCaptureAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
