id: TMA-CHROME-3.6
title: Ensure 'Control how Chrome Cleanup reports data to Google' is set to 'Disabled'
description: 'Chrome provides a Cleanup feature to detect unwanted software. If this setting is Enabled, the results of the cleanup may be shared with Google (based on the setting of SafeBrowsingExtendedReportingEnabled) to assist with future unwanted software detection. These results will contain file metadata, automatically installed extensions, and registry keys. Rationale: Anonymous crash/usage data can be used to identify people, companies, and information, which can be considered data ex-filtration from company systems. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:ChromeCleanupReportingEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.6 Ensure 'Control how Chrome Cleanup reports data to Google' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ChromeCleanupReportingEnabled'' -ErrorAction SilentlyContinue).''ChromeCleanupReportingEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ChromeCleanupReportingEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
