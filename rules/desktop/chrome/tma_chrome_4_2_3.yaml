id: TMA-CHROME-4.2.3
title: Ensure 'Allow clipboard for these sites' Is Configured
description: 'This setting allows administrators to list specific sites that have access to the clipboard site permissions. Note: This does not include using keyboard shortcuts. Those are not gated by the clipboard site permission. Rationale: Setting this policy allows specified URLs to have access to the clipboard site permissions. This will allow the specified sites to have access to data on the clipboard that other sites do not. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 4.2.3 Ensure 'Allow clipboard for these sites' Is Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Allow clipboard on these sites is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s allowed URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Allow clipboard on these sites = Enabled and set Show to the approved URLs'
