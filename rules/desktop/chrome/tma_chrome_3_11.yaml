id: TMA-CHROME-3.11
title: Ensure 'Enable or disable spell checking web service' is set to 'Disabled'
description: 'Google Chrome can use Google web service to help resolve spelling errors. The recommended state for this setting is: Disabled (0) Rationale: Information typed in may be leaked to Google''s spellcheck web service. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:SpellCheckServiceEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.11 Ensure 'Enable or disable spell checking web service' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''SpellCheckServiceEnabled'' -ErrorAction SilentlyContinue).''SpellCheckServiceEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SpellCheckServiceEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
