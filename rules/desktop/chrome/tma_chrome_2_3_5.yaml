id: TMA-CHROME-2.3.5
title: Ensure 'Block third-party storage partitioning for these origins' Is Configured
description: 'This setting will block specific sites your organization selects from accessing the storage session from any other site. This will allow an organization to block third party trackers that are embedded on multiple sites from tracking a user across the sites they visit. It will also allow blocking third party access to the user agent and to infer data about the user from the data from another site. Rationale: If your organization does not want to block all third-party sites from accessing the user agent, you can configure a curated list of sites to block. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.3.5 Ensure 'Block third-party storage partitioning for these origins' Is Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block third-party storage partitioning for these origins is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s allowed URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ThirdPartyStoragePartitioningBlockedForOrigins\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block third-party storage partitioning for these origins = Enabled and set Show to the approved URLs'
