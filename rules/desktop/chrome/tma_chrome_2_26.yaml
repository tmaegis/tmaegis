id: TMA-CHROME-2.26
title: Ensure 'Enable Google Search Side Panel' Is Disabled
description: 'This setting controls the Google Search Side Panel. It can be configured to either: - Disabled (0): Disable Google Search Side Panel on all web pages - Enabled (1): Enable Google Search Side Panel on all web pages Rationale: Setting this policy will not allow the Google Search Side Panel on any webpages. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:GoogleSearchSidePanelEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.26 Ensure 'Enable Google Search Side Panel' Is Disabled
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''GoogleSearchSidePanelEnabled'' -ErrorAction SilentlyContinue).''GoogleSearchSidePanelEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'GoogleSearchSidePanelEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
