id: TMA-CHROME-4.3
title: Ensure 'Allow invocation of file selection dialogs' is set to 'Disabled'
description: 'This setting allows access to local files by allowing file selection dialogs in Google Chrome. The recommended state for this setting is: Disabled (0) Rationale: Allowing users to import favorites, upload files, and save links could pose potential security risks by allowing data to be uploaded to external sites or by downloading malicious files. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:AllowFileSelectionDialogs (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: medium
tags:
- chrome
- browser
- cis-l2
reference: CIS Google Chrome Benchmark v3.0.0 - 4.3 Ensure 'Allow invocation of file selection dialogs' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''AllowFileSelectionDialogs'' -ErrorAction SilentlyContinue).''AllowFileSelectionDialogs''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AllowFileSelectionDialogs' -Value 0 -PropertyType DWord -Force | Out-Null
