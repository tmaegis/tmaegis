id: TMA-CHROME-2.8.3
title: Ensure 'Configure the required domain names for remote access clients' is set to 'Enabled' with a domain defined
description: 'Chrome allows the configuration of a list of domains that are allowed to access the user''s system. When enabled, remote systems can only connect if they are one of the specified domains listed. Setting this to an empty list (Disabled) allows remote systems from any domain to connect to this user''s system. Rationale: Remote assistance connections shall be restricted. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: high
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.8.3 Ensure 'Configure the required domain names for remote access clients' is set to 'Enabled' with a domain defined
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Polices\Administrative Templates\Google\Google Chrome\Remote access\Configure the required domain names for remote access clients is configured as the title requires. This registry path will not exist if it is set to Disabled: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\RemoteAccessHostClientDomainList'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Polices\Administrative Templates\Google\Google Chrome\Remote access\Configure the required domain names for remote access clients = Enabled and enter an organizational specific domain(s) (e.g. nodomain.local)'
