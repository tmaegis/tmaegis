id: TMA-CHROME-2.1.1
title: Ensure 'Update policy override' is set to 'Enabled' with 'Always allow updates (recommended)' or 'Automatic silent updates' specified
description: 'Google Update manages installation of available Google Chrome updates from Google. This setting allows users to define whether updates are to be applied automatically. Depending on the business scenario, updates shall be applied periodically or also if the user seeks for updates. Rationale: Software updates shall be applied as soon as they are available since they may include latest security patches. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Update:Update{8A69D345-D564-463C-AFF1-A69D9E530F96} (REG_DWORD); compliant when it is 1 or 3. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.1.1 Ensure 'Update policy override' is set to 'Enabled' with 'Always allow updates (recommended)' or 'Automatic silent updates' specified
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Update'' -Name ''Update{8A69D345-D564-463C-AFF1-A69D9E530F96}'' -ErrorAction SilentlyContinue).''Update{8A69D345-D564-463C-AFF1-A69D9E530F96}''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1,3) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Update'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'Update{8A69D345-D564-463C-AFF1-A69D9E530F96}' -Value 1 -PropertyType DWord -Force | Out-Null
