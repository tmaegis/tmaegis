id: TMA-CHROME-3.9
title: Ensure 'Enable deleting browser and download history' is set to 'Disabled'
description: 'Google Chrome can delete the browser and download history using the clear browsing data menu. The recommended state for this setting is: Disabled (0) NOTE: Even when this setting is disabled, the browsing and download history aren''t guaranteed to be retained. Rationale: If users can delete websites they have visited or files they have downloaded it will be easier for them to hide evidence that they have visited unauthorized or malicious sites. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:AllowDeletingBrowserHistory (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.9 Ensure 'Enable deleting browser and download history' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''AllowDeletingBrowserHistory'' -ErrorAction SilentlyContinue).''AllowDeletingBrowserHistory''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AllowDeletingBrowserHistory' -Value 0 -PropertyType DWord -Force | Out-Null
