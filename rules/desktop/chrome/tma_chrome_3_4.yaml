id: TMA-CHROME-3.4
title: Ensure 'Block third party cookies' is set to 'Enabled'
description: 'Chrome allows cookies to be set by web page elements that are not from the domain in the user''s address bar. Enabling this feature prevents third party cookies from being set. The recommended state for this setting is: Enabled (1) Rationale: Blocking third-party cookies can help protect a user''s privacy by eliminating a number of website tracking cookies. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:BlockThirdPartyCookies (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.4 Ensure 'Block third party cookies' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''BlockThirdPartyCookies'' -ErrorAction SilentlyContinue).''BlockThirdPartyCookies''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'BlockThirdPartyCookies' -Value 1 -PropertyType DWord -Force | Out-Null
