id: TMA-CHROME-4.10
title: Ensure 'Import saved passwords from default browser on first run' is set to 'Disabled'
description: "This setting controls if saved passwords from the default browser can be imported (on first run and later manually). The recommended state for this setting is: Disabled (0) Rationale: In Chrome, passwords can be stored in plain-text and revealed by clicking the \u201Cshow\u201D button next to the password field by going to chrome://settings/passwords/. Audit reads the Group Policy registry value and prints 'compliant', 'unset' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\\SOFTWARE\\Policies\\Google\\Chrome:ImportSavedPasswords (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it."
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 4.10 Ensure 'Import saved passwords from default browser on first run' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ImportSavedPasswords'' -ErrorAction SilentlyContinue).''ImportSavedPasswords''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ImportSavedPasswords' -Value 0 -PropertyType DWord -Force | Out-Null
