id: TMA-CHROME-4.2.8
title: Ensure 'Block Window Management permission on these sites' Is Configured
description: 'This setting can automatically deny access to the window management permissions for specific sites. It can be configured to either: If the value for WindowManagementBlockedForUrls is not changed from the default, it will follow the configuration of DefaultWindowManagementSetting. Rationale: Specifying URLs that do not have access to the window management permissions limits data for sites that have access to data on the clipboard, and allows for more sites to have access. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 2
severity: low
tags:
- chrome
- browser
- cis-l2
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 4.2.8 Ensure 'Block Window Management permission on these sites' Is Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block Window Management permission on these sites is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s allowed URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\WindowManagementBlockedForUrls\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block Window Management permission on these sites = Enabled and set Show to the blocked URLs'
