id: TMA-CHROME-4.2.4
title: Ensure 'Block clipboard on these sites' Is Configured
description: 'This setting allows administrators to list specific sites that do not have access to the clipboard site permissions. Note: This does not include using keyboard shortcuts. Those are not gated by the clipboard site permission. Rationale: Specifying URLs that do not have access to the clipboard site permissions limits data for sites that have access to data on the clipboard, and allows for more sites to have access. Setting this policy denies specified URLs to have access to the clipboard site permissions. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 4.2.4 Ensure 'Block clipboard on these sites' Is Configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block clipboard on these sites is configured as the title requires. This group policy setting is backed by the following registry location which should be set individually to your organization''s blocked URLs: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\ Example:'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Block clipboard on these sites = Enabled and set Show to the blocked URLs'
