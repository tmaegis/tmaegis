id: TMA-CHROME-2.15
title: Ensure 'Force Google SafeSearch' is set to 'Enabled'
description: 'This setting ensures that web search results with Google are performed with SafeSearch set to always active. Disabled means SafeSearch in Google Search is not enforced. The recommended state for this setting is: Enabled (1) Rationale: Allowing search results to present sites that may have malicious content should be prohibited to help ensure users do not accidentally visit sites that are more prone to malicious content including spyware, adware, and viruses. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:ForceGoogleSafeSearch (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: low
tags:
- chrome
- browser
- cis-l2
reference: CIS Google Chrome Benchmark v3.0.0 - 2.15 Ensure 'Force Google SafeSearch' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''ForceGoogleSafeSearch'' -ErrorAction SilentlyContinue).''ForceGoogleSafeSearch''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ForceGoogleSafeSearch' -Value 1 -PropertyType DWord -Force | Out-Null
