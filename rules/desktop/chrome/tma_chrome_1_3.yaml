id: TMA-CHROME-1.3
title: Ensure 'Allow Google Cast to connect to Cast devices on all IP addresses' is set to 'Disabled'
description: 'This setting controls whether Google Cast is able to connect to all IP Addresses or only private IP Addresses as defined in RFC1918 (IPv4) and RFC4193 (IPv6). Note that if the EnabledMediaRouter setting is set to Disabled there is no positive or negative effect for this setting. The recommended state for this setting is: Disabled (0) Rationale: Allowing Google Cast to connect to public IP addresses could allow media and other potentially sensitive data to be exposed to the public. Disabling this setting will ensure that Google Cast is only able to connect to private (ie: internal) IP addresses. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:MediaRouterCastAllowAllIPs (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.3 Ensure 'Allow Google Cast to connect to Cast devices on all IP addresses' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''MediaRouterCastAllowAllIPs'' -ErrorAction SilentlyContinue).''MediaRouterCastAllowAllIPs''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'MediaRouterCastAllowAllIPs' -Value 0 -PropertyType DWord -Force | Out-Null
