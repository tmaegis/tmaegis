id: TMA-CHROME-2.3.2
title: 'Ensure ''Configure allowed app/extension types'' is set to ''Enabled: extension, hosted_app, platform_app, theme'''
description: 'Enabling this setting allows you to specify which app/extension types are allowed. Disabled (0): Results in no restrictions on the acceptable extension and app types. The recommended state for this setting is: Enabled with the values of extension, hosted_app, platform_app, theme. Rationale: App or extension types that could be misused or are deprecated shall no longer be installed. NOTE: Google has removed support for Chrome Apps which includes the types hosted_app and platform_app. List policy: numbered REG_SZ values under HKLM\SOFTWARE\Policies\Google\Chrome\ExtensionAllowedTypes. Compliant when the entries are exactly extension, hosted_app, platform_app, theme.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: 'CIS Google Chrome Benchmark v3.0.0 - 2.3.2 Ensure ''Configure allowed app/extension types'' is set to ''Enabled: extension, hosted_app, platform_app, theme'''
audit:
  type: registry
  command: '$l = @((Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ExtensionAllowedTypes'' -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike ''PS*'' } | ForEach-Object { "$($_.Value)" }); if ($l.Count -eq 0) { ''unset'' } elseif ((($l | ForEach-Object { $_.Trim().ToLower() } | Sort-Object) -join '','') -eq ''extension,hosted_app,platform_app,theme'') { ''compliant'' } else { ''non-compliant: '' + ($l -join '', '') }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    Set-TmaList 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ExtensionAllowedTypes' @('extension','hosted_app','platform_app','theme') $true
  guidance: "Configure through Group Policy: Computer Configuration\\Polices\\Administrative Templates\\Google\\Google Chrome\\Extensions\\Configure allowed app/extension types = Enabled: extension, hosted_app, platform_app, theme"
