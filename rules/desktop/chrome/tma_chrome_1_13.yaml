id: TMA-CHROME-1.13
title: Ensure 'Disable saving browser history' is set to 'Disabled'
description: 'Google Chrome is configured to save the browser history. The recommended state for this setting is: Disabled (0) NOTE: This setting will preserve browsing history that could contain a user''s personal browsing history. Please make sure that this setting is in compliance with organizational policies. Rationale: Browser history shall be saved as it may contain indicators of compromise. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:SavingBrowserHistoryDisabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.13 Ensure 'Disable saving browser history' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''SavingBrowserHistoryDisabled'' -ErrorAction SilentlyContinue).''SavingBrowserHistoryDisabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SavingBrowserHistoryDisabled' -Value 0 -PropertyType DWord -Force | Out-Null
