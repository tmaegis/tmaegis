id: TMA-CHROME-1.9
title: Ensure 'Determine the availability of variations' is set to 'Enable all variations'
description: 'Configuring this setting allows specifying which variations are allowed to be applied in Google Chrome. Variations provide a means for Google to offer modifications to Google Chrome without shipping a new version of the browser by selectively enabling or disabling already existing features. - Enable all variations (0): Allows all variations to be applied to the browser (Default value). Rationale: Google strongly recommends leaving this setting at the default (0 = Enable all variations), so fixes are gradually enabled (or if necessary, rapidly disabled) via the Chrome Variations framework. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: low
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 1.9 Ensure 'Determine the availability of variations' is set to 'Enable all variations'
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Determine the availability of variations is configured as the title requires. This group policy setting is backed by the following registry location which should be set to 0: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ChromeVariations'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Determine the availability of variations = Enabled: Enable all variations'
