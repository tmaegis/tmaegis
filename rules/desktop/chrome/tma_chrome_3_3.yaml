id: TMA-CHROME-3.3
title: Ensure 'Allow websites to query for available payment methods' is set to 'Disabled'
description: 'This setting allows you to set whether a website can check to see if the user has payment methods saved. The recommended state for this setting is: Disabled (0) Rationale: Saving payment information in Google Chrome could lead to sensitive data being leaked and used for non-legitimate purposes. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:PaymentMethodQueryEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 3.3 Ensure 'Allow websites to query for available payment methods' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''PaymentMethodQueryEnabled'' -ErrorAction SilentlyContinue).''PaymentMethodQueryEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'PaymentMethodQueryEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
