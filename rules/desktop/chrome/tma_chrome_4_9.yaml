id: TMA-CHROME-4.9
title: Ensure 'Enable AutoFill for credit cards' is set to 'Disabled'
description: 'Chrome allows users to auto-complete web forms with saved credit card information. Disabling this feature will prompt a user to enter all information manually. The recommended state for this setting is: Disabled (0) Rationale: If an attacker gains access to a user''s machine where the user has stored credit card AutoFill data, information could be harvested. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:AutofillCreditCardEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 4.9 Ensure 'Enable AutoFill for credit cards' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''AutofillCreditCardEnabled'' -ErrorAction SilentlyContinue).''AutofillCreditCardEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AutofillCreditCardEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
