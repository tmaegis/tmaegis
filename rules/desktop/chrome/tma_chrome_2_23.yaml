id: TMA-CHROME-2.23
title: Ensure 'Determines whether the built-in certificate verifier will enforce constraints encoded into trust anchors loaded from the platform trust store' Is Enabled
description: 'This setting controls constraints encoded into trust anchors loaded from the platform trust store. It can be configured to either: - Disabled (0): Do not enforce constraints in locally added trust anchors - Enabled (1): Enforce constraints in locally added trust anchors If the value for EnforceLocalAnchorConstraintsEnabled is not changed from the default, it will behave as if it is enabled. Rationale: Setting this policy will not allow access to any sites that do not enforce constraints. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:EnforceLocalAnchorConstraintsEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 2
severity: medium
tags:
- chrome
- browser
- cis-l2
reference: CIS Google Chrome Benchmark v3.0.0 - 2.23 Ensure 'Determines whether the built-in certificate verifier will enforce constraints encoded into trust anchors loaded from the platform trust store' Is Enabled
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''EnforceLocalAnchorConstraintsEnabled'' -ErrorAction SilentlyContinue).''EnforceLocalAnchorConstraintsEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EnforceLocalAnchorConstraintsEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
