id: TMA-CHROME-2.21
title: Ensure 'Allow reporting of domain reliability related data' Is Disabled
description: 'This setting controls the defaults for clipboard permission access from sites. It can be configured to either: - Disabled (0): Never send domain reliability data to Google - Enabled (1): Domain Reliability data may be sent to Google depending on Chrome User Metrics (UMA) policy If the value for DomainReliabilityAllowed is not changed from the default, it will behave as it is enabled. Rationale: Setting this policy to disabled can stop any accidental data leakage. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:DomainReliabilityAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.21 Ensure 'Allow reporting of domain reliability related data' Is Disabled
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''DomainReliabilityAllowed'' -ErrorAction SilentlyContinue).''DomainReliabilityAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DomainReliabilityAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
