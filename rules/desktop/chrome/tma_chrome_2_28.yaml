id: TMA-CHROME-2.28
title: Ensure 'Enable automatic HTTPS upgrades' Is Enabled
description: 'This setting controls the ability for Google Chrome to upgrade to HTTPS from HTTP while navigating to certain sites. It can be configured to either: - Disabled (0): Disable HTTPS Upgrades - Enabled (1): HTTPS Upgrades may be applied depending on feature launch status If the value for HttpsUpgradesEnabled is not changed from the default, it will behave as if it is enabled. Rationale: Enabling this setting will upgrade the connection to a site from HTTP to HTTPS where available, verifying the identity of the site visited. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:HttpsUpgradesEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 2.28 Ensure 'Enable automatic HTTPS upgrades' Is Enabled
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''HttpsUpgradesEnabled'' -ErrorAction SilentlyContinue).''HttpsUpgradesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'HttpsUpgradesEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
