id: TMA-CHROME-2.9.1
title: Ensure 'Enable First-Party Sets' Is Disabled
description: 'This policy controls access to the First-Party Sets. First-party Sets are a way for sites to declare relationships with each other and enable limited cross-site cookie access for specific, user-facing purposes. It can configured to either: - Disabled (0): Disable First-Party Sets for all affected users - Enabled (1): Enable First-Party Sets for all affected users Rationale: Setting this policy will not allow sites to declare the relationships that allow them to access the cross-site cookies. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
- manual
reference: CIS Google Chrome Benchmark v3.0.0 - 2.9.1 Ensure 'Enable First-Party Sets' Is Disabled
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Enable Firty-Party Sets is configured as the title requires. This group policy setting is backed by the following registry location which should be set to 0: Registry: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:FirstPartySetsEnabled'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Google\Google Chrome\Content settings\Enable Firty-Party Sets = Disabled'
