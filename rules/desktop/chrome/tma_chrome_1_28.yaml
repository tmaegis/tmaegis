id: TMA-CHROME-1.28
title: Ensure 'Suppress the unsupported OS warning' is set to 'Disabled'
description: 'Google Chrome will show a warning that appears when Google Chrome is running on a computer or operating system that is no longer supported. The recommended state for this setting is: Disabled (0) Rationale: The user shall be informed if the used software is no longer supported. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Google\Chrome:SuppressUnsupportedOSWarning (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: chrome
level: 1
severity: medium
tags:
- chrome
- browser
- cis-l1
reference: CIS Google Chrome Benchmark v3.0.0 - 1.28 Ensure 'Suppress the unsupported OS warning' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'' -Name ''SuppressUnsupportedOSWarning'' -ErrorAction SilentlyContinue).''SuppressUnsupportedOSWarning''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SuppressUnsupportedOSWarning' -Value 0 -PropertyType DWord -Force | Out-Null
