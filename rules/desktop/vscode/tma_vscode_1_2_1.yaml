id: TMA-VSCODE-1.2.1
title: Ensure 'AllowedExtensions' is configured
description: 'This policy setting configures a list of extension selectors that determine which extensions are allowed or blocked. The recommended state for this setting is: Enabled with a list of allowed extensions. Rationale: Allowing users to install any extension may result in unintended information disclosure to third parties, or the installation of malware. The benchmark marks this recommendation Manual (organisation-specific value or not reliably checkable), so it is reported as SKIP with review steps.'
target: vscode
level: 2
severity: medium
tags:
- vscode
- developer-tools
- cis-l2
- manual
reference: CIS Visual Studio Code GPO Benchmark v1.0.0 - 1.2.1 Ensure 'AllowedExtensions' is configured
audit:
  type: manual
  command: 'Confirm via Group Policy (gpresult /h or the GPMC) that Computer Configuration\Policies\Administrative Templates\Visual Studio Code\Extensions\AllowedExtensions is configured as the title requires. This group policy setting is backed by the following registry location with a REG_SZ value containing a JSON string. Registry: HKLM\SOFTWARE\Policies\Microsoft\VSCode:AllowedExtensions'
remediation:
  type: iac_patch
  command: 'Configure through Group Policy: Computer Configuration\Policies\Administrative Templates\Visual Studio Code\Extensions\AllowedExtensions = Enabled along with a JSON string defining the approved extensions'
