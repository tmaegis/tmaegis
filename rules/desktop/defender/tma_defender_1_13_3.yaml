id: TMA-DEFENDER-1.13.3
title: 'Ensure ''Scan excluded files and directories during quick scans'' is set to ''Enabled: 1'''
description: 'This policy setting manages whether Microsoft Defender Antivirus scans excluded files and directories when running a Quick Scan. The recommended state for this setting is: Enabled: 1. Rationale: The Real-time Protection feature excludes some files and directories for contextual reasons. This setting ensures that these are scanned during a Quick Scan. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:QuickScanIncludeExclusions (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.13.3 Ensure ''Scan excluded files and directories during quick scans'' is set to ''Enabled: 1'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''QuickScanIncludeExclusions'' -ErrorAction SilentlyContinue).''QuickScanIncludeExclusions''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'QuickScanIncludeExclusions' -Value 1 -PropertyType DWord -Force | Out-Null
