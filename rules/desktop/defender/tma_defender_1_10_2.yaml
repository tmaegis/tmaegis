id: TMA-DEFENDER-1.10.2
title: Ensure 'Configure real-time protection and Security Intelligence Updates during OOBE' is set to 'Enabled'
description: 'This policy setting configures whether Real-time Protection and Security Intelligence Updates are enabled during the Out of Box experience (OOBE). The recommended state for this setting is: Enabled. Rationale: Critical Windows zero-day patch updates should be applied during OOBE to help mitigate against malicious attacks. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection:OobeEnableRtpAndSigUpdate (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: high
tags:
- defender
- antivirus
- cis-l1
reference: CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.10.2 Ensure 'Configure real-time protection and Security Intelligence Updates during OOBE' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection'' -Name ''OobeEnableRtpAndSigUpdate'' -ErrorAction SilentlyContinue).''OobeEnableRtpAndSigUpdate''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Real-TimeProtection'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'OobeEnableRtpAndSigUpdate' -Value 1 -PropertyType DWord -Force | Out-Null
