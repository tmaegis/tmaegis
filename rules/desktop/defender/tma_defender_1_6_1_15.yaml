id: TMA-DEFENDER-1.6.1.15
title: 'Ensure ''Configure Attack Surface Reduction rules: Set the state for each ASR rule'' is set to ''b2b3f03d-6a65-4f7b-a9c7- 1c7ef74a9ba4:1'''
description: 'With this rule, admins can prevent unsigned or untrusted executable files from running from USB removable drives, including SD cards. Blocked file types include executable files (such as .exe, .dll, or .scr). Rule ID and name: - b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4 (Block untrusted and unsigned processes that run from USB) The recommended state for this setting is: b2b3f03d-6a65-4f7b-a9c7- 1c7ef74a9ba4:1 (Block). Rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to infect machines. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules:b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4 (REG_SZ); compliant when it is 1.'
target: defender
level: 1
severity: high
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.6.1.15 Ensure ''Configure Attack Surface Reduction rules: Set the state for each ASR rule'' is set to ''b2b3f03d-6a65-4f7b-a9c7- 1c7ef74a9ba4:1'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'' -Name ''b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'' -ErrorAction SilentlyContinue).''b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(''1'') -contains "$v")) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    Set-TmaReg 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules' 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4' '1' 'String'
  guidance: "Configure through Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Microsoft Defender Antivirus\\Microsoft Defender Exploit Guard\\Attack Surface Reduction\\Configure Attack Surface Reduction rules: Set the state for each ASR rule = b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4 with a value of 1. Test in audit mode (2) first. Local alternative (writes Defender preferences, not the Group Policy value this audit reads): Add-MpPreference -AttackSurfaceReductionRules_Ids b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4 -AttackSurfaceReductionRules_Actions 1"
