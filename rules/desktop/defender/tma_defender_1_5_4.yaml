id: TMA-DEFENDER-1.5.4
title: 'Ensure ''Send file samples when further analysis is required'' is set to ''Enabled: Send safe samples automatically'' or higher'
description: 'This policy setting configures the behavior of samples sent to Microsoft for submission when opt-in for MAPS telemetry is set. The recommended state for this setting is: Enabled: Send safe samples or Enabled: Send all samples. Rationale: For the Block at First Sight feature to function properly, the Send file samples when further analysis is required setting must be configured as prescribed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SubmitSamplesConsent (REG_DWORD); compliant when it is 1 or 3. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.5.4 Ensure ''Send file samples when further analysis is required'' is set to ''Enabled: Send safe samples automatically'' or higher'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'' -Name ''SubmitSamplesConsent'' -ErrorAction SilentlyContinue).''SubmitSamplesConsent''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1,3) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SubmitSamplesConsent' -Value 1 -PropertyType DWord -Force | Out-Null
