id: TMA-DEFENDER-1.13.10
title: 'Ensure ''Trigger a quick scan after X days without any scans'' is set to ''Enabled: 7'''
description: 'This policy setting configures the number of days after the last scan (of any type) before an aggressive Quick Scan is automatically triggered. The recommended state for this setting is: Enabled: 7 days. Rationale: Antivirus scans should be performed on a regular basis so that malicious software can be detected and remediated before malicious activity occurs. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:DaysUntilAggressiveCatchupQuickScan (REG_DWORD); compliant when it is 7. Remediation writes 7 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.13.10 Ensure ''Trigger a quick scan after X days without any scans'' is set to ''Enabled: 7'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''DaysUntilAggressiveCatchupQuickScan'' -ErrorAction SilentlyContinue).''DaysUntilAggressiveCatchupQuickScan''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(7) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DaysUntilAggressiveCatchupQuickScan' -Value 7 -PropertyType DWord -Force | Out-Null
