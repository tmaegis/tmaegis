id: TMA-DEFENDER-1.13.1
title: Ensure 'Check for the latest virus and spyware security intelligence before running a scheduled scan' is set to 'Enabled'
description: 'This policy setting controls whether to check for new virus and spyware security intelligence before running a scan. The recommended state for this setting is: Enabled. Note: This setting applies to scheduled scans and has no effect on scans that are initiated manually from the user interface or to the ones that have been started from the command line using mpcmdrun -Scan. Rationale: A malware scan is only as effective as the threat definitions it uses. Running a scan with outdated intelligence significantly reduces detection accuracy and can create a false sense of security. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:CheckForSignaturesBeforeRunningScan (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.13.1 Ensure 'Check for the latest virus and spyware security intelligence before running a scheduled scan' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''CheckForSignaturesBeforeRunningScan'' -ErrorAction SilentlyContinue).''CheckForSignaturesBeforeRunningScan''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'CheckForSignaturesBeforeRunningScan' -Value 1 -PropertyType DWord -Force | Out-Null
