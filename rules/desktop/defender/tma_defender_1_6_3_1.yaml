id: TMA-DEFENDER-1.6.3.1
title: 'Ensure ''Prevent users and apps from accessing dangerous websites'' is set to ''Enabled: Block'''
description: 'This policy setting controls Microsoft Defender Exploit Guard network protection. The recommended state for this setting is: Enabled: Block. Rationale: This setting can help prevent employees from using any application to access dangerous domains that may host phishing scams, exploit-hosting sites, and other malicious content on the Internet. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\windows Defender\Windows Defender Exploit Guard\Network Protection:EnableNetworkProtection (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.6.3.1 Ensure ''Prevent users and apps from accessing dangerous websites'' is set to ''Enabled: Block'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\windows Defender\Windows Defender Exploit Guard\Network Protection'' -Name ''EnableNetworkProtection'' -ErrorAction SilentlyContinue).''EnableNetworkProtection''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\windows Defender\Windows Defender Exploit Guard\Network Protection'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EnableNetworkProtection' -Value 1 -PropertyType DWord -Force | Out-Null
