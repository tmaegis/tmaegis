id: TMA-DEFENDER-1.13.6
title: 'Ensure ''Specify the day of the week to run a scheduled scan'' is set to ''Enabled: 0'' or higher, but not ''8'''
description: 'This policy setting configures the day of the week to perform a scheduled scan. The recommended state for this setting is: Enabled: 0 or higher, but not 8. This setting can be configured with the following values: - (0x0) Every Day - (0x1) Sunday - (0x2) Monday - (0x3) Tuesday - (0x4) Wednesday - (0x5) Thursday - (0x6) Friday - (0x7) Saturday - (0x8) Never (default) Rationale: Performing a scheduled scan at least once a week is a consistent way to verify that critical parts of the system remain clean. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:ScheduleDay (REG_DWORD); compliant when it is 0 or 1 or 2 or 3 or 4 or 5 or 6 or 7. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: defender
level: 1
severity: medium
tags:
- defender
- antivirus
- cis-l1
reference: 'CIS Microsoft Defender Antivirus Benchmark v1.0.0 - 1.13.6 Ensure ''Specify the day of the week to run a scheduled scan'' is set to ''Enabled: 0'' or higher, but not ''8'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'' -Name ''ScheduleDay'' -ErrorAction SilentlyContinue).''ScheduleDay''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0,1,2,3,4,5,6,7) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ScheduleDay' -Value 0 -PropertyType DWord -Force | Out-Null
