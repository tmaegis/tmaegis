id: TMA-ZOOM-SCREEN-SHARE-HOST-ONLY
title: Ensure screen sharing is restricted to the host by default
description: Account-level Zoom meeting settings are held server-side in the Zoom web portal, not on the endpoint, so this is a manual review.
target: zoom
level: 1
severity: medium
tags:
- zoom
- portal
reference: CIS Zoom Benchmark v1.0.0 - screen sharing is restricted to the host by default
audit:
  type: manual
  command: 'Zoom web portal (admin) > Account Settings > Meeting > In Meeting (Basic): verify ''Screen sharing'' > ''Who can share?'' is set to ''Host Only'' and locked, and ''Who can start sharing when someone else is sharing?'' is ''Host Only''.'
remediation:
  type: iac_patch
  command: Change the setting in the Zoom admin web portal (Account Settings) and lock it so group/user settings cannot override it.
