id: TMA-ZOOM-1.1.3.5.2
title: Ensure allow saving of shared screens with annotations is set to disabled
description: Disable "Allow saving of shared screens with annotations"
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.5.2 Ensure allow saving of shared screens with annotations is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow saving of shared screens with annotations and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow saving of shared screens with annotations and ensure it is disabled.
