id: TMA-ZOOM-1.1.1.8
title: Ensure embed password in meeting link for one-click join is set to enabled
description: Meeting passcode will be encrypted and included in the invite link to allow participants to join with just one click without having to enter the passcode. Increased security to avoid need to punch in passcode. When participant clicks on meeting link that was sent to registered email, users joins meeting automatically.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.8 Ensure embed password in meeting link for one-click join is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Embed passcode in invite link for one-click join, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Embed passcode in invite link for one-click join, and ensure it is set to enabled.
