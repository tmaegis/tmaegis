id: TMA-ZOOM-1.1.5.1
title: Ensure calendar and contacts integration is set to disabled
description: Allow users to integrate calendar and contacts services (Google, Exchange, Office 365) with Zoom. Enabling this option shall invite privacy issues, hence keep this disabled.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.5.1 Ensure calendar and contacts integration is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Calendar and contacts integration, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Calendar and contacts integration, and ensure it is set to disabled.
