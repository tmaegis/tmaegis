id: TMA-ZOOM-1.1.4.3.3
title: Ensure allow users to upload custom backgrounds is set to disabled
description: Customize your background to keep your environment private from others in a meeting. This can be used with or without a green screen. Allow users to upload custom backgrounds. Disabling this option ensures that participants do not have inappropriate backgrounds.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.3.3 Ensure allow users to upload custom backgrounds is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow users to upload custom backgrounds, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow users to upload custom backgrounds, and ensure it is disabled.
