id: TMA-ZOOM-1.1.1.4
title: Ensure require a passcode when scheduling new meetings is set to enabled
description: Require a passcode when scheduling new meetings must be set to enabled. A passcode will be generated when scheduling a meeting and participants require the passcode to join the meeting. Upon scheduling a meeting, a passcode will be generated, this ensures that participants require the passcode to join the meeting.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.4 Ensure require a passcode when scheduling new meetings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode when scheduling new meetings and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode when scheduling new meetings and ensure it is set to enabled.
