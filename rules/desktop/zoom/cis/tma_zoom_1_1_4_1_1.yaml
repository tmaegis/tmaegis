id: TMA-ZOOM-1.1.4.1.1
title: Ensure select data center regions for meetings/webinars hosted by your account is set to enabled
description: Include all data center regions to provide the best experience for participants joining from all regions. Opting out of data center regions may limit CRC, Dial-in, Call Me, and Invite by Phone options for participants joining from those regions.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.1.1 Ensure select data center regions for meetings/webinars hosted by your account is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Select data center regions for meetings/webinars hosted by your account, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Select data center regions for meetings/webinars hosted by your account, and ensure it is enabled.
