id: TMA-ZOOM-1.1.2.10
title: Ensure always display "Zoom Meeting" as the meeting topic is set to enabled
description: Hide actual meeting topic and display "Zoom Meeting" for your scheduled meetings. Helps confidentiality of meeting topic public display.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.10 Ensure always display "Zoom Meeting" as the meeting topic is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Always display "Zoom Meeting" as the meeting topic, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Always display "Zoom Meeting" as the meeting topic, and ensure it is enabled.
