id: TMA-ZOOM-3.1.1.2.4
title: Enable users can change their password 1 time every 24 hours
description: Users can change their password 1 time every 24 hours.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.2.4 Enable users can change their password 1 time every 24 hours
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Users can change their password 1 time every 24 hours, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Users can change their password 1 time every every 24 hours, and ensure it is enabled.
