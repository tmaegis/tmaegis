id: TMA-ZOOM-3.1.1.2.3
title: Ensure users cannot reuse any password used in the last 5 times or more
description: Users cannot reuse any password used in the previous number of times.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.2.3 Ensure users cannot reuse any password used in the last 5 times or more
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Users cannot reuse any password used in the last 5 times or more, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Users cannot reuse any password used in the last 5 times or more, and ensure it is enabled.
