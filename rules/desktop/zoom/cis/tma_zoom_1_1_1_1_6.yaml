id: TMA-ZOOM-1.1.1.1.6
title: Ensure passcode cannot contain consecutive characters is set to enabled
description: For security purposes, Zoom has a few requirements that your passcode must meet. Cannot contain consecutive characters (e.g. “11111”, “12345”, “abcde”, or “qwert”). This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.6 Ensure passcode cannot contain consecutive characters is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Cannot contain consecutive characters (e.g. “11111”, “12345”, “abcde”, or “qwert”), and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Cannot contain consecutive characters (e.g. “11111”, “12345”, “abcde”, or “qwert”), and ensure it is set to enabled.
