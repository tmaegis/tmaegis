id: TMA-ZOOM-1.1.2.7
title: Ensure use personal meeting ID (PMI) when starting an instant meeting is set to disabled
description: Use Personal Meeting ID (PMI) when starting an instant meeting should be set to disabled. Use Personal Meeting ID (PMI) when starting an instant meeting set to disabled ensures that someone who knows a personal meeting ID from a previous meeting cannot join a meeting without a proper invitation and knowing the code.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.7 Ensure use personal meeting ID (PMI) when starting an instant meeting is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Use Personal Meeting ID (PMI) when starting an instant meeting, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Use Personal Meeting ID (PMI) when starting an instant meeting, and ensure it is set to disabled.
