id: TMA-ZOOM-1.1.7.3
title: Ensure use content delivery network (CDN) is set to "Default"
description: Allow connections to different CDNs for a better web browsing experience. All users under your organization will use the selected CDN to access static resources. By default, all users use Amazon CloudFront except users in China. Users in China use Wangsu (China) instead.
target: zoom
level: 2
severity: medium
tags:
- desktop
- network
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.7.3 Ensure use content delivery network (CDN) is set to "Default"
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Use content delivery network (CDN), and check if it is set to enabled and "Default" option is selected.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Use content delivery network (CDN), and ensure it is set to enabled and "Default" option is selected.
