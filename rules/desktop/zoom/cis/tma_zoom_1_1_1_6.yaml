id: TMA-ZOOM-1.1.1.6
title: Ensure require a password for instant meetings is set to enabled
description: A random passcode will be generated when starting an instant meeting. Enabling this setting shall increase security for meetings that are created instantly. A participant requires the passcode to be entered for joining.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.6 Ensure require a password for instant meetings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode for instant meetings, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode for instant meetings, and ensure it is set to enabled.
