id: TMA-ZOOM-1.1.4.16
title: Ensure allow Skype for Business (Lync) client to join a Zoom meeting is set to disabled
description: Allow internal or external Skype for Business (Lync) client to connect to a Zoom meeting.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.16 Ensure allow Skype for Business (Lync) client to join a Zoom meeting is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow Skype for Business (Lync) client to join a Zoom meeting, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow Skype for Business (Lync) client to join a Zoom meeting, and ensure it is disabled.
