id: TMA-ZOOM-1.2.6.2
title: Ensure passcode have at least 1 letter is set to enabled
description: Have at least 1 letter (a, b, c...)
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.6.2 Ensure passcode have at least 1 letter is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> Have at least 1 letter (a, b, c...), and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> Have at least 1 letter (a, b, c...), and ensure it is enabled.
