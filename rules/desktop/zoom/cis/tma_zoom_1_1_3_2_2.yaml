id: TMA-ZOOM-1.1.3.2.2
title: Ensure play sound for "Host and co-host only" is set to enabled
description: Change from "Everyone" option under [Play sound for] to "Host and co-hosts only". This option enables Host and co-hosts to know that participants are joining/leaving.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.2.2 Ensure play sound for "Host and co-host only" is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves -> Play sound for -> Host and co-hosts only, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves -> Play sound for -> Host and co-hosts only, and check ensure it is enabled.
