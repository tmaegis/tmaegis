id: TMA-ZOOM-1.1.1.1.8
title: Ensure only allow numeric passcode is set to disabled
description: For security purposes, Zoom has a few requirements that your passcode must meet. As per passcode requirements, Disable “Only allow numeric passcode”, enabling this shall make the passcode weaker. This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.8 Ensure only allow numeric passcode is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Only allow numeric passcode, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Only allow numeric passcode, and ensure it is disabled.
