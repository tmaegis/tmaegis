id: TMA-ZOOM-1.1.3.4.3
title: Ensure "Who can start sharing when someone else is sharing?" is set to "Host Only"
description: This setting decides who can share screen when someone is already sharing. This option should be restricted to "Host Only". This can be changed or controlled by host for a particular meeting instance.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.4.3 Ensure "Who can start sharing when someone else is sharing?" is set to "Host Only"
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Who can start sharing when someone else is sharing? and check if “Host Only” is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Who can start sharing when someone else is sharing? and ensure “Host Only” is enabled.
