id: TMA-ZOOM-3.1.1.3.2
title: Ensure allow importing of photos from the photo library on the user's device is set to disabled
description: Allow importing of photos from the photo library on the user's device.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.3.2 Ensure allow importing of photos from the photo library on the user's device is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Allow importing of photos from the photo library on the user's device, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Allow importing of photos from the photo library on the user's device, and ensure it is disabled.
