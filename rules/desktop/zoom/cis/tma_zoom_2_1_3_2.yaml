id: TMA-ZOOM-2.1.3.2
title: Ensure enable personal channel in chat window is set to disabled
description: A personal channel allows users to save their private notes, action items, links, and files.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.3.2 Ensure enable personal channel in chat window is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Enable Personal channel in Chat window, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Enable Personal channel in Chat window, and ensure it is disabled.
