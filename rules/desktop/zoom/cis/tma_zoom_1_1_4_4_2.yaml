id: TMA-ZOOM-1.1.4.4.2
title: Enable listening ports range is set as appropriate for organization
description: Listening ports range, select the appropriate ports as per your company or organization settings.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.4.2 Enable listening ports range is set as appropriate for organization
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Peer to Peer connection while only 2 people in a meeting -> Listening ports range, and check if it is enabled, also appropriate ports are selected as per organization.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Peer to Peer connection while only 2 people in a meeting -> Listening ports range, and ensure it is enabled, also appropriate ports are selected as per organization.
