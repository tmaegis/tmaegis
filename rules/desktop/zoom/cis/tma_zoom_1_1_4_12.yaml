id: TMA-ZOOM-1.1.4.12
title: Ensure only show default email when sending email invites is set to enabled
description: Allow users to invite participants by email only by using the default email program selected on their computer.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.12 Ensure only show default email when sending email invites is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Only show default email when sending email invites, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Only show default email when sending email invites, and ensure it is enabled.
