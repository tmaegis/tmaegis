id: TMA-ZOOM-1.2.7.1
title: Ensure recording disclaimer is set to enabled
description: Show a customizable disclaimer to participants before a recording starts. Useful to address privacy requirements that mandates disclaimer prior recording starts.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.7.1 Ensure recording disclaimer is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer, and ensure it is enabled.
