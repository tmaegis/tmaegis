id: TMA-ZOOM-1.1.1.1.3
title: Ensure passcode is set to have at least 1 number
description: For security purposes, Zoom has a few requirements that your passcode must meet. As per passcode requirements, Have at least 1 number (1, 2, 3...). This shall make the passcode strong.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.3 Ensure passcode is set to have at least 1 number
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 number (1, 2, 3...), and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 number (1, 2, 3...), and ensure it is enabled.
