id: TMA-ZOOM-1.1.2.1.1
title: Have a minimum password length
description: For security purposes, Zoom has a few requirements that your password must meet. These apply when setting your initial password and when resetting your password. Minimum password length must be at least 8 characters. This ensures the password complexity requirements are met and a strong password is set for the account.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.1.1 Have a minimum password length
