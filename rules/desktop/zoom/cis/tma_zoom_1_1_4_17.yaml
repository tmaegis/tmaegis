id: TMA-ZOOM-1.1.4.17
title: Ensure request permission to unmute is set to enabled
description: Select this option in the scheduler to request permission to unmute meeting participants and webinar panelists. Permissions, once given, will apply in all meetings scheduled by the same person.
target: zoom
level: 2
severity: low
tags:
- access-control
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.17 Ensure request permission to unmute is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Request permission to unmute, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Request permission to unmute, and ensure it is enabled.
