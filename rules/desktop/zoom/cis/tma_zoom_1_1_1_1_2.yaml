id: TMA-ZOOM-1.1.1.1.2
title: Ensure passcode is set to have at least 1 letter
description: For security purposes, Zoom has a few requirements that your passcode must meet. As per passcode requirements, have at least 1 letter (a, b, c...). This shall make the passcode strong.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.2 Ensure passcode is set to have at least 1 letter
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 letter (a, b, c...), and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 letter (a, b, c...), and ensure it is set to enabled.
