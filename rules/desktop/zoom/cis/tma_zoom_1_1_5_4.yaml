id: TMA-ZOOM-1.1.5.4
title: Ensure enforce OAuth 2.0 for Office 365 calendar integration is set to enabled
description: When turned on, calendar services will be authenticated with protocol OAuth 2.0.
target: zoom
level: 2
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.5.4 Ensure enforce OAuth 2.0 for Office 365 calendar integration is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Enforce OAuth 2.0 for Office 365 calendar integration, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Enforce OAuth 2.0 for Office 365 calendar integration, and ensure it is set to enabled.
