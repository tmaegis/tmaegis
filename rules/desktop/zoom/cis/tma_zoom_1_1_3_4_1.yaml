id: TMA-ZOOM-1.1.3.4.1
title: Ensure screen sharing is set to enabled
description: Allow host and participants to share their screen or content during meetings. Enable this option to ensure further options are customizable to control who can share screen or desktop audio.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.4.1 Ensure screen sharing is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Screen sharing, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Screen sharing, and ensure it is enabled.
