id: TMA-ZOOM-1.1.1.1.1
title: Ensure minimum passcode length is set to at least 6 characters
description: For security purposes, Zoom has a few requirements that your passcode must meet. Minimum passcode length must be at least 6 characters. This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.1 Ensure minimum passcode length is set to at least 6 characters
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have a minimum passcode length, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have a minimum passcode length, and ensure it is set to enabled.
