id: TMA-ZOOM-1.2.7.3
title: Ensure ask host to confirm before starting a recording is set to enabled
description: Ask host to confirm before starting a recording. Further click on "Customize" to modify the consent.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.7.3 Ensure ask host to confirm before starting a recording is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer -> Ask host to confirm before starting a recording, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer -> Ask host to confirm before starting a recording, and ensure it is enabled.
