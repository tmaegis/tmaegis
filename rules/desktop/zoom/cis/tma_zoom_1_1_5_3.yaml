id: TMA-ZOOM-1.1.5.3
title: Ensure consent to Office 365 calendar integration permissions on behalf of entire account is set to disabled
description: When turned off, the Office 365 administrator will need to consent to calendar integrations on behalf of the account. As an administrator, please choose the same settings configured in Office 365. View the settings on Office 365.
target: zoom
level: 2
severity: low
tags:
- access-control
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.5.3 Ensure consent to Office 365 calendar integration permissions on behalf of entire account is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Consent to Office 365 calendar integration permissions on behalf of entire account, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Consent to Office 365 calendar integration permissions on behalf of entire account, and ensure it is set to disabled.
