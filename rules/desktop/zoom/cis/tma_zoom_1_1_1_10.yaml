id: TMA-ZOOM-1.1.1.10
title: Ensure require password for participants joining by phone is set to enabled
description: A numeric passcode will be required for participants joining by phone if your meeting has a passcode. For meeting with an alphanumeric passcode, a numeric version will be generated.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.10 Ensure require password for participants joining by phone is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require passcode for participants joining by phone, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require passcode for participants joining by phone, and ensure it is set to enabled.
