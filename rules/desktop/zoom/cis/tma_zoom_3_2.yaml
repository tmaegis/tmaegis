id: TMA-ZOOM-3.2
title: Ensure integration is set to appropriate organizational needs
description: Integration, this page has option to enable/disable to various applications that can be integrated with zoom.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.2 Ensure integration is set to appropriate organizational needs
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Integration, and check if only necessary options are enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Integration, and ensure only necessary options are enabled.
