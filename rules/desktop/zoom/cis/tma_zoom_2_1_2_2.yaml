id: TMA-ZOOM-2.1.2.2
title: Ensure show H.323 contacts is set to disabled
description: By enabling this option, the user's H.323 contacts will be displayed in the contact's list.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.2.2 Ensure show H.323 contacts is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Show H.323 contacts, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Show H.323 contacts, and ensure it is disabled.
