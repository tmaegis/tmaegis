id: TMA-ZOOM-2.1.4.2
title: Ensure delete local data is set to disabled
description: Specify how long your messages and files are saved on the local device.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.4.2 Ensure delete local data is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Delete local data, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Delete local data, and ensure it is disabled.
