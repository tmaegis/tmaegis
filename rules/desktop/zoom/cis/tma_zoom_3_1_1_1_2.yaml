id: TMA-ZOOM-3.1.1.1.2
title: Ensure password have at least 1 special character is set to enabled
description: 'Have at least 1 special character (!, @, #...)'
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.1.2 Ensure password have at least 1 special character is set to enabled
audit:
  type: manual
  command: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Have at least 1 special character (!, @, #...), and check if it is enabled.'
remediation:
  type: iac_patch
  command: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Have at least 1 special character (!, @, #...), and ensure it is enabled.'
