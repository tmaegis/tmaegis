id: TMA-ZOOM-3.1.1.2.1
title: Ensure new users need to change their passwords upon first sign-in is set to enabled
description: New users need to change their passwords upon first sign-in.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.2.1 Ensure new users need to change their passwords upon first sign-in is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> New users need to change their passwords upon first sign-in, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> New users need to change their passwords upon first sign-in, and ensure it is enabled.
