id: TMA-ZOOM-1.2.3.3
title: Ensure record thumbnails when sharing is set to enabled
description: Record thumbnails when sharing
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.3.3 Ensure record thumbnails when sharing is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Record thumbnails when sharing, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Record thumbnails when sharing, and ensure it is enabled.
