id: TMA-ZOOM-2.1.2.5
title: Ensure announcements is set to disabled
description: Allow specified users to send one-way announcements to everyone in the same account.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.2.5 Ensure announcements is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Announcements, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Announcements, and ensure it is disabled.
