id: TMA-ZOOM-1.1.1.11
title: Ensure only authenticated users can join meetings from Web client is set to enabled
description: Only authenticated users can join meetings from Web client should be set to enabled. This requires users to authenticate and identify themselves prior to logging in and joining a meeting. Only authenticated users can join meetings from Web client. Users will be known and not anonymous meaning anyone can join.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.11 Ensure only authenticated users can join meetings from Web client is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting ->Only authenticated users can join meetings from Web client and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting ->Only authenticated users can join meetings from Web client and ensure it is set to enabled.
