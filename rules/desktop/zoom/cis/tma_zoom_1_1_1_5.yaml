id: TMA-ZOOM-1.1.1.5
title: Ensure room meeting ID passcode is set to enabled
description: All Room Meeting ID meetings that users can join via client, phone, or room systems will be passcode-protected.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.5 Ensure room meeting ID passcode is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Room Meeting ID Passcode, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Room Meeting ID Passcode, and ensure it is set to enabled.
