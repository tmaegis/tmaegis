id: TMA-ZOOM-1.2.8
title: Ensure prevent hosts from accessing their cloud recordings is set to enabled
description: By turning on this setting, the hosts cannot view their meeting cloud recordings. Only the admins who have recording management privilege can access them.
target: zoom
level: 2
severity: low
tags:
- access-control
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.8 Ensure prevent hosts from accessing their cloud recordings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Prevent hosts from accessing their cloud recordings, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Prevent hosts from accessing their cloud recordings, and ensure it is enabled.
