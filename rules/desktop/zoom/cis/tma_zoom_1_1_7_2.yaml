id: TMA-ZOOM-1.1.7.2
title: Ensure display meetings scheduled for others is set to enabled
description: Display meetings scheduled for others. If disabled, users will only see their meetings even if they have schedule-for privilege for others.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.7.2 Ensure display meetings scheduled for others is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Display meetings scheduled for others, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Display meetings scheduled for others, and ensure it is set to enabled.
