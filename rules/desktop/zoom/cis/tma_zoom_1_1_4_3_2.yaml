id: TMA-ZOOM-1.1.4.3.2
title: Ensure allow use of videos for virtual backgrounds is set to disabled
description: Customize your background to keep your environment private from others in a meeting. This can be used with or without a green screen. Allow use of videos for virtual backgrounds.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.3.2 Ensure allow use of videos for virtual backgrounds is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow use of videos for virtual backgrounds, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow use of videos for virtual backgrounds, and ensure it is disabled.
