id: TMA-ZOOM-2.1.4.3
title: Ensure store edited and deleted message revisions is set to disabled
description: Keep the original versions of edited and deleted messages on the Chat History tab.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.4.3 Ensure store edited and deleted message revisions is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Store edited and deleted message revisions, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Store edited and deleted message revisions, and ensure it is disabled.
