id: TMA-ZOOM-1.1.4.4.1
title: Ensure peer to peer connection while only 2 people in a meeting is set to disabled
description: Allow users to directly connect to one another in a 2-person meeting.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.4.1 Ensure peer to peer connection while only 2 people in a meeting is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow users to directly connect to one another in a 2-person meeting, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow users to directly connect to one another in a 2-person meeting, and ensure it is disabled.
