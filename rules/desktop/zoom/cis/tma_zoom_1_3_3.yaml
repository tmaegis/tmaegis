id: TMA-ZOOM-1.3.3
title: Ensure global dial-in countries/regions is set to enabled
description: Click the Edit icon to choose countries/regions that frequently have participants who need to dial into meetings. The dial-in phone numbers of these locations appear in the email invitation, and can be used by participants dialing in from those locations. Further select Dial-in number(s) that are as per your local country or region laws, if any.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.3.3 Ensure global dial-in countries/regions is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Global Dial-in Countries/Regions, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Global Dial-in Countries/Regions, and ensure it is enabled.
