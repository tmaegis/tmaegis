id: TMA-ZOOM-1.2.4.2
title: Ensure automatic recording is set to "Record in the Cloud"
description: Record meetings automatically as they start. This option allows to capture evidence if any incidents that happen at start of meetings. Now select "Record in the cloud" to preserve evidences.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.4.2 Ensure automatic recording is set to "Record in the Cloud"
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording -> Record in the cloud, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording -> Record in the cloud, and ensure it is enabled.
