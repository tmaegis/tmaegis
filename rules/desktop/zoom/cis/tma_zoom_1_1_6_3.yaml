id: TMA-ZOOM-1.1.6.3
title: Ensure when a meeting is cancelled is set to enabled
description: Notify host and participants when the meeting is cancelled.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.3 Ensure when a meeting is cancelled is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When a meeting is cancelled, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When a meeting is cancelled, and ensure it is set to enabled.
