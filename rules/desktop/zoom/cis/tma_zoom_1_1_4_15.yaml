id: TMA-ZOOM-1.1.4.15
title: Ensure allow live streaming meetings is set to disabled
description: Allow live streaming meetings. Select Facebook Or Workplace by Facebook Or Youtube Or Custom Live Streaming Service.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.15 Ensure allow live streaming meetings is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow live streaming meetings, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow live streaming meetings, and ensure it is disabled.
