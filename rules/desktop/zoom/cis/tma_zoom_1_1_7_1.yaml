id: TMA-ZOOM-1.1.7.1
title: Ensure blur snapshot on iOS task switcher is set to enabled
description: Enable this option to hide potentially sensitive information from the snapshot of the Zoom main window. This snapshot display as the preview screen in the iOS tasks switcher when multiple apps are open.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.7.1 Ensure blur snapshot on iOS task switcher is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Blur snapshot on iOS task switcher, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Blur snapshot on iOS task switcher, and ensure it is set to enabled.
