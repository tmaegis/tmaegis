id: TMA-ZOOM-1.1.3.1.2
title: Ensure prevent participants from saving chat is set to enabled
description: Prevent participants from saving chat, ensures that participants do not copy what is pasted in the zoom meeting chat.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.1.2 Ensure prevent participants from saving chat is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Prevent participants from saving chat, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Prevent participants from saving chat, and ensure it is enabled.
