id: TMA-ZOOM-1.1.4.1.2
title: Ensure data center regions is set to local countries
description: Not all data centers are configured. Only the required ones are configured. Choose local or trusted region data centers.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.1.2 Ensure data center regions is set to local countries
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Select data center regions for meetings/webinars hosted by your account, and check if local countries are selected. E.g. For United States, select United States.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Select data center regions for meetings/webinars hosted by your account, and ensures local countries are selected. E.g. For United States, select United States.
