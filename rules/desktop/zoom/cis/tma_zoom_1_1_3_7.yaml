id: TMA-ZOOM-1.1.3.7
title: Ensure require encryption for 3rd party endpoints (SIP/H.323) is set to enabled
description: By default, Zoom requires encryption for all data transferred between the Zoom cloud, Zoom client, and Zoom Room. Turn on this setting to require encryption for 3rd party endpoints (SIP/H.323) as well.
target: zoom
level: 1
severity: high
tags:
- desktop
- encryption
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.7 Ensure require encryption for 3rd party endpoints (SIP/H.323) is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Require encryption for 3rd party endpoints (SIP/H.323) and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Require encryption for 3rd party endpoints (SIP/H.323) and ensure it is enabled.
