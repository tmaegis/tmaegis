id: TMA-ZOOM-1.1.3.1.1
title: Ensure allow meeting participants to send a message visible to all participants is set to disabled
description: Allow meeting participants to send a message visible to all participants. This can be further controlled from client end by the host / co-host.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.1.1 Ensure allow meeting participants to send a message visible to all participants is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow meeting participants to send a message visible to all participants, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow meeting participants to send a message visible to all participants, and ensure it is disabled.
