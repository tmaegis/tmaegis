id: TMA-ZOOM-1.1.3.2.1
title: Ensure sound notification when someone joins or leaves is set to enabled
description: Enable "Play sound when participants join or leave". This can also be controlled from host client end if required to be changed. This option enables Host and co-hosts to know that participants are joining/leaving.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.2.1 Ensure sound notification when someone joins or leaves is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves, and ensure it is enabled.
