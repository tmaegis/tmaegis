id: TMA-ZOOM-1.1.3.3.1
title: Ensure hosts and participants can send files through the in- meeting chat is set to disabled
description: Hosts and participants can send files through the in-meeting chat. As this is account level setting keep this enabled. If option of file transfer is required, then use it along with allowing specific file extension.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.3.1 Ensure hosts and participants can send files through the in- meeting chat is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Hosts and participants can send files through the in-meeting chat., and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Hosts and participants can send files through the in-meeting chat., and ensure it is disabled.
