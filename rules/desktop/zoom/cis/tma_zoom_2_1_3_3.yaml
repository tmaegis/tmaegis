id: TMA-ZOOM-2.1.3.3
title: Ensure allow users to add contacts is set to disabled
description: By disabling this setting, users will not be able to add contacts. If this option is required to be enabled, then choose "Only in the same organization and specified domains" and specify the domains for better security.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.3.3 Ensure allow users to add contacts is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Allow users to add contacts, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Allow users to add contacts, and ensure it is disabled.
