id: TMA-ZOOM-1.1.4.6
title: Ensure remote support is set to disabled
description: Allow meeting host to provide 1:1 remote support to another participant. Do not enable these options unless, you really need them.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.6 Ensure remote support is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Remote support, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Remote support, and ensure it is disabled.
