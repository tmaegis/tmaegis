id: TMA-ZOOM-2.1.4.4
title: Ensure third party archiving is set to disabled
description: Archive messages and files with a third party archiving service. Set up your account to send data to your archiving provider here.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.4.4 Ensure third party archiving is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Third party archiving, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Third party archiving, and ensure it is disabled.
