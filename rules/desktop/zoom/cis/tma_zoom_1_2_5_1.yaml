id: TMA-ZOOM-1.2.5.1
title: Ensure cloud recording downloads is set to enabled
description: Allow anyone with a link to the cloud recording to download
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.5.1 Ensure cloud recording downloads is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording downloads, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording downloads, and ensure it is enabled.
