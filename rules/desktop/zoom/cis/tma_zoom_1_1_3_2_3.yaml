id: TMA-ZOOM-1.1.3.2.3
title: Ensure when someone joins by phone, ask to record their voice to use as the notification is set to enabled
description: Select "Ask to record their voice to use as the notification" option for "When someone joins by phone". This option enables Host and co-hosts to know that participants are joining/leaving while joining from phone.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.2.3 Ensure when someone joins by phone, ask to record their voice to use as the notification is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves -> When someone joins by phone -> Ask to record their voice to use as the notification, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Sound notification when someone joins or leaves -> When someone joins by phone -> Ask to record their voice to use as the notification, and ensure it is enabled.
