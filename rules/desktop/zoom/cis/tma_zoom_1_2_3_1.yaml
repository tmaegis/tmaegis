id: TMA-ZOOM-1.2.3.1
title: Ensure add a timestamp to the recording is set to enabled
description: Add a timestamp to the recording by enabling this option.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.3.1 Ensure add a timestamp to the recording is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Add a timestamp to the recording, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Add a timestamp to the recording, and ensure it is enabled.
