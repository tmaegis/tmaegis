id: TMA-ZOOM-2.1.1.1
title: Ensure screen capture is set to disabled
description: Allow users to take and send screenshots in direct messages or group conversations. Reduces likelihood of data leakage through zoom screenshot sharing.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.1.1 Ensure screen capture is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Sharing -> Screen capture, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Sharing -> Screen capture, and ensure it is disabled.
