id: TMA-ZOOM-1.1.4.9
title: Ensure far end camera control is set to disabled
description: Allow another user to take control of your camera during a meeting. Both users (the one requesting control and the one giving control) must have this option turned on.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.9 Ensure far end camera control is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Far end camera control, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Far end camera control, and ensure it is disabled.
