id: TMA-ZOOM-3.1.1.2.2
title: Ensure password expires automatically and needs to be changed after 365 days
description: Password expires automatically and needs to be changed after the specified number of days.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.2.2 Ensure password expires automatically and needs to be changed after 365 days
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Password expires automatically and needs to be changed after 365 days, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Password Policy -> Password expires automatically and needs to be changed after 365 days, and ensure it is enabled.
