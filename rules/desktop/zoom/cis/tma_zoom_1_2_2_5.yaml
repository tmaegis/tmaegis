id: TMA-ZOOM-1.2.2.5
title: Ensure record an audio only file is set to enabled
description: Record an audio only file. Useful in case of evidence for untampered audio file.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.2.5 Ensure record an audio only file is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record an audio only file, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record an audio only file, and ensure it is enabled.
