id: TMA-ZOOM-1.2.3.4
title: Ensure optimize the recording for 3rd party video editor is set to enabled
description: Optimize the recording for 3rd party video editor
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.3.4 Ensure optimize the recording for 3rd party video editor is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Optimize the recording for 3rd party video editor, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Optimize the recording for 3rd party video editor, and check if it is enabled.
