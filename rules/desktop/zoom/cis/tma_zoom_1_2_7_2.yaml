id: TMA-ZOOM-1.2.7.2
title: Ensure ask participants for consent when a recording starts is set to enabled
description: Ask participants for consent when a recording starts. Further click on "Customize" to modify the consent.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.7.2 Ensure ask participants for consent when a recording starts is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer -> Ask participants for consent when a recording starts, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Recording disclaimer -> Ask participants for consent when a recording starts, and ensure it is enabled.
