id: TMA-ZOOM-1.1.3.9
title: Ensure auto saving chats is set to enabled
description: Automatically save all in-meeting chats so that hosts do not need to manually save the text of the chat after the meeting starts.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.9 Ensure auto saving chats is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Auto saving chats, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Auto saving chats, and ensure it is enabled.
