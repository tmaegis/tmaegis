id: TMA-ZOOM-1.1.2.5
title: Ensure enable personal meeting ID is set to enabled
description: A Personal Meeting ID (PMI) is a dedicated 9-11 digit number which is assigned to each individuals account. This becomes the users personal meeting room. This is the personal room assigned upon account creation.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.5 Ensure enable personal meeting ID is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Enable Personal Meeting ID, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Enable Personal Meeting ID, and ensure it is set to enabled.
