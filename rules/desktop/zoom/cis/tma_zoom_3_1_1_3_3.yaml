id: TMA-ZOOM-3.1.1.3.3
title: Ensure hide billing information from administrators is set to enabled
description: Hide billing information from administrators.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.3.3 Ensure hide billing information from administrators is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Hide billing information from administrators, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Hide billing information from administrators, and ensure it is enabled.
