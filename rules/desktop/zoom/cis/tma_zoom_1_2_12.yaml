id: TMA-ZOOM-1.2.12
title: Ensure allow recovery of deleted cloud recordings from trash is set to enabled
description: Deleted cloud recordings will be kept in trash for 30 days. These files will not count as part of the total storage allowance. Useful when downloaded recordings are accidentally deleted.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.12 Ensure allow recovery of deleted cloud recordings from trash is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Allow recovery of deleted cloud recordings from Trash, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Allow recovery of deleted cloud recordings from Trash, and ensure it is enabled.
