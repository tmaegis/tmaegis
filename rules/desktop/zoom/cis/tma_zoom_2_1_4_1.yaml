id: TMA-ZOOM-2.1.4.1
title: Ensure cloud storage is set to enabled
description: Save messages and files on the cloud for the specified period of time. Select the number of years to store the data as per local laws.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.4.1 Ensure cloud storage is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Cloud storage, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Storage -> Cloud storage, and ensure it is enabled.
