id: TMA-ZOOM-1.1.3.19
title: Ensure allow removed participants to rejoin is set to disabled
description: Allows previously removed meeting participants and webinar panelists to rejoin. If this option is enabled, then any distracting participants that were removed will be able to join back again.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.19 Ensure allow removed participants to rejoin is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow removed participants to rejoin, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow removed participants to rejoin, and ensure it is disabled.
