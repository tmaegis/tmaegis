id: TMA-ZOOM-1.1.3.14
title: Ensure show Zoom windows during screen share is set to enabled
description: Show Zoom windows during screen share. This shall help in quickly controlling a situation where someone needs to be muted/removed from the meeting.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.14 Ensure show Zoom windows during screen share is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Show Zoom windows during screen share, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Show Zoom windows during screen share, and ensure it is enabled.
