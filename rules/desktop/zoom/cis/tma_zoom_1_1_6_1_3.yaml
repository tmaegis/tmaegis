id: TMA-ZOOM-1.1.6.1.3
title: Ensure send a copy to the Alternative Hosts is set to enabled
description: Send a copy to the Alternative Hosts. This can enable alternate hosts to validate the recording for any confidential data prior sharing the video at large.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.1.3 Ensure send a copy to the Alternative Hosts is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Send a copy to the Alternative Hosts, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Send a copy to the Alternative Hosts, and ensure it is set to enabled.
