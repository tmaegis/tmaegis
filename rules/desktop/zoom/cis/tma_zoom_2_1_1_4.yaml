id: TMA-ZOOM-2.1.1.4
title: Ensure file transfer is set to disabled
description: Allow users to send and receive files in direct messages or group conversations. Reduces likelihood of data leakage through zoom screenshot sharing.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.1.4 Ensure file transfer is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Sharing -> File transfer, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Sharing -> File transfer, and ensure it is disabled.
