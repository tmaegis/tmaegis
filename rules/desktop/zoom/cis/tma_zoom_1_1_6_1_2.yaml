id: TMA-ZOOM-1.1.6.1.2
title: Ensure Send a copy to the person who scheduled the meeting/webinar for the host is set to enabled
description: Send a copy to the person who scheduled the meeting/webinar for the host. This can enable meeting scheduler to validate the recording for any confidential data prior sharing the video at large.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.1.2 Ensure Send a copy to the person who scheduled the meeting/webinar for the host is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Send a copy to the person who scheduled the meeting/webinar for the host, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Send a copy to the person who scheduled the meeting/webinar for the host, and ensure it is set to enabled.
