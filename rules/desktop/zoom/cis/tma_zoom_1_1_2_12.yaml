id: TMA-ZOOM-1.1.2.12
title: Ensure mute participants upon entry is set to enabled
description: Automatically mute all participants when they join the meeting. The host controls whether participants can unmute themselves, through client end by enabling "Allow Participants to Unmute Themselves" under more options in participants list.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.12 Ensure mute participants upon entry is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Mute participants upon entry, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Mute participants upon entry, and ensure it is enabled.
