id: TMA-ZOOM-1.1.3.17
title: Ensure nonverbal feedback is set to disabled
description: Participants in a meeting can provide nonverbal feedback and express opinions by clicking on icons in the Participants panel. Disabling this avoids participants misusing this feature.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.17 Ensure nonverbal feedback is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Nonverbal feedback, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Nonverbal feedback, and ensure it is disabled.
