id: TMA-ZOOM-1.1.3.6.3
title: Ensure auto save whiteboard content when sharing is stopped is set to disabled
description: Allow host and participants to share whiteboard during a meeting. And disallow Auto save whiteboard content when sharing is stopped. This can be controlled at meeting level.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.6.3 Ensure auto save whiteboard content when sharing is stopped is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Auto save whiteboard content when sharing is stopped and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Auto save whiteboard content when sharing is stopped and ensure it is disabled.
