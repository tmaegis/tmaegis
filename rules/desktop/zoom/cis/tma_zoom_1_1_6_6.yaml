id: TMA-ZOOM-1.1.6.6
title: Ensure when the cloud recording is going to be permanently deleted from trash is set to enabled
description: When the cloud recording is going to be permanently deleted from trash, Notify the host 7 days before the cloud recording is permanently deleted from trash. This is helpful when there are needs to preserve the recordings as per the applicable data retention guidelines.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.6 Ensure when the cloud recording is going to be permanently deleted from trash is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When the cloud recording is going to be permanently deleted from trash, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When the cloud recording is going to be permanently deleted from trash, and ensure it is set to enabled.
