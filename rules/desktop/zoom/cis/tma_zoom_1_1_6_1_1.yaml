id: TMA-ZOOM-1.1.6.1.1
title: Ensure when a cloud recording is available is set to enabled
description: Notify host when cloud recording is available. This can enable hosts to validate the recording for any confidential data, prior sharing the video at large.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.1.1 Ensure when a cloud recording is available is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When a cloud recording is available, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When a cloud recording is available, and ensure it is set to enabled.
