id: TMA-ZOOM-1.2.2.2
title: Ensure record active speaker with shared screen is set to enabled
description: Record active speaker with shared screen
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.2.2 Ensure record active speaker with shared screen is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record active speaker with shared screen, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record active speaker with shared screen, and ensure it is enabled.
