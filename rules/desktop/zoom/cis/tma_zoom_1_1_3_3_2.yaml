id: TMA-ZOOM-1.1.3.3.2
title: Ensure only allow specified file types is set to enabled
description: Hosts and participants can send files through the in-meeting chat. And that too only the file types that are whitelisted. Provide the list of filetype that needs to be whitelisted e.g. .txt, .docx, .pdf, .xlsx
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.3.2 Ensure only allow specified file types is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Only allow specified file types, and check if it is enabled (i.e. checkbox enabled).
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Only allow specified file types, and ensure it is enabled (i.e. checkbox enabled).
