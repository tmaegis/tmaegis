id: TMA-ZOOM-1.3.1
title: Ensure toll call is set to enabled
description: Include the selected numbers in the Zoom client and the email invitation via the international numbers link. Participants can dial into meeting with the numbers. Further add/modify/remove the toll numbers as per organization requirements.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.3.1 Ensure toll call is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Toll Call, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Toll Call, and ensure it is enabled.
