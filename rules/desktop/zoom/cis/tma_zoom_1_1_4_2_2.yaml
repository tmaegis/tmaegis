id: TMA-ZOOM-1.1.4.2.2
title: Ensure allow host to assign participants to breakout rooms when scheduling is set to enabled
description: Allow host to assign participants to breakout rooms when scheduling.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.2.2 Ensure allow host to assign participants to breakout rooms when scheduling is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow host to assign participants to breakout rooms when scheduling, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Allow host to assign participants to breakout rooms when scheduling, and ensure it is enabled.
