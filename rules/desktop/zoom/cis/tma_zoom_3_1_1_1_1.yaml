id: TMA-ZOOM-3.1.1.1.1
title: Ensure minimum password length is set to 9 characters or greater
description: Have a minimum password length of 9 characters or greater
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.1.1 Ensure minimum password length is set to 9 characters or greater
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> 9 characters or greater, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> 9 characters or greater, and ensure it is enabled.
