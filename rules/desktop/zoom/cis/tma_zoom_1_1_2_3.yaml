id: TMA-ZOOM-1.1.2.3
title: Ensure participants video is set to disabled
description: Start meetings with Participants video on should be set to disabled and locked off. This ensures people joining a meeting do not have their camera on without them realizing. Locking the setting ensures no one changes this when creating a meeting.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.3 Ensure participants video is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Participants video, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Participants video, and ensure it is set to disabled.
