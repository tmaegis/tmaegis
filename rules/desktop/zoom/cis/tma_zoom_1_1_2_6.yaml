id: TMA-ZOOM-1.1.2.6
title: Ensure use personal meeting ID (PMI) when scheduling a meeting is set to disabled
description: Use Personal Meeting ID (PMI) when scheduling a meeting should be set to disabled. This ensures a new meeting ID is used for new scheduled meetings. If there are nuisance users, they cannot be use an old meeting ID to join a meeting.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.6 Ensure use personal meeting ID (PMI) when scheduling a meeting is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Use Personal Meeting ID (PMI) when scheduling a meeting, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Use Personal Meeting ID (PMI) when scheduling a meeting, and ensure it is set to disabled.
