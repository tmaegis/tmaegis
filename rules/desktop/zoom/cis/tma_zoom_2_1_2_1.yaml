id: TMA-ZOOM-2.1.2.1
title: Ensure set chat as a default tab for first-time users is set to disabled
description: By enabling this option, the default tab for first-time users will be switched from Home to Chat.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.2.1 Ensure set chat as a default tab for first-time users is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Set Chat as a default tab for first-time users, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Set Chat as a default tab for first-time users, and ensure it is disabled.
