id: TMA-ZOOM-1.3.2
title: Ensure mask phone number in the participant list is set to enabled
description: 'Phone numbers of users dialing into a meeting will be masked in the participant list. For example: 888****666'
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.3.2 Ensure mask phone number in the participant list is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Mask phone number in the participant list, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Telephone -> Mask phone number in the participant list, and ensure it is enabled.
