id: TMA-ZOOM-1.2.13
title: Ensure multiple audio notifications of recorded meeting is set to enabled
description: Play notification messages to participants who join the meeting audio. These messages play each time the recording starts or restarts, informing participants that the meeting is being recorded. If participants join the audio from telephone, even if this option is disabled, users will hear one notification message per meeting. Useful to address privacy requirements that require recording disclaimer.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.13 Ensure multiple audio notifications of recorded meeting is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Multiple audio notifications of recorded meeting, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Multiple audio notifications of recorded meeting, and ensure it is enabled.
