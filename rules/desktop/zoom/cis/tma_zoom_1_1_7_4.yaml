id: TMA-ZOOM-1.1.7.4
title: Ensure allow users to contact Zoom's support via chat is set to enabled
description: Show Zoom Help badge on the bottom right of the page
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.7.4 Ensure allow users to contact Zoom's support via chat is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Allow users to contact Zoom's Support via Chat, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Admin Options -> Allow users to contact Zoom's Support via Chat, and ensure it is set to enabled.
