id: TMA-ZOOM-1.2.2.4
title: Ensure record active speaker, gallery view and shared screen separately is set to enabled
description: Record active speaker, gallery view and shared screen separately. Useful to identify the participants, from various views at a later point in time for audit purpose.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.2.4 Ensure record active speaker, gallery view and shared screen separately is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record active speaker, gallery view and shared screen separately, and check if it is enabled and sub-options are checked.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Record active speaker, gallery view and shared screen separately, and ensure it is enabled and sub-options are checked.
