id: TMA-ZOOM-3.1.1.1.4
title: Ensure use enhanced weak password detection is set to enabled
description: Use enhanced weak password detection.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.1.4 Ensure use enhanced weak password detection is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Use enhanced weak password detection, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Use enhanced weak password detection, and ensure it is enabled.
