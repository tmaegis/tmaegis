id: TMA-ZOOM-1.1.5.2
title: Ensure ask users to integrate Office 365 calendar when they sign in is set to disabled
description: Upon login, users will be asked for calendar access. Enabling this option invites privacy issues, hence it is best to keep it disabled.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.5.2 Ensure ask users to integrate Office 365 calendar when they sign in is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Ask users to integrate Office 365 calendar when they sign in, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Calendar and Contacts -> Ask users to integrate Office 365 calendar when they sign in, and ensure it is set to disabled.
