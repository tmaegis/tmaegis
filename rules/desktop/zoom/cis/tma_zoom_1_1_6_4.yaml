id: TMA-ZOOM-1.1.6.4
title: Ensure when an alternative host is set or removed from a meeting is set to enabled
description: When an alternative host is set or removed from a meeting, Notify the alternative host who is set or removed. Helpful for any investigation.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.4 Ensure when an alternative host is set or removed from a meeting is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When an alternative host is set or removed from a meeting, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When an alternative host is set or removed from a meeting, and ensure it is set to enabled.
