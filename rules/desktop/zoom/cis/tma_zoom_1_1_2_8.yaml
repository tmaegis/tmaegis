id: TMA-ZOOM-1.1.2.8
title: Ensure add watermark is set to enabled
description: Adding watermark enables author accreditation. Each attendee sees a portion of their own email address embedded as a watermark in any shared content and on the video of the participant who is sharing their screen. This option requires enabling "Only signed-in users can join the meeting" or "Only signed-in users with specified domains can join meetings".
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.8 Ensure add watermark is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Add watermark, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Add watermark, and ensure it is set to enabled.
