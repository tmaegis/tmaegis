id: TMA-ZOOM-1.1.6.5
title: Enable when someone scheduled a meeting for a host is set to enabled
description: When someone scheduled a meeting for a host, Notify the host there is a meeting is scheduled, rescheduled, or cancelled. Helpful in monitoring the schedule by someone who has permissions to schedule a meeting on behalf of host.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.5 Enable when someone scheduled a meeting for a host is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When someone scheduled a meeting for a host, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> When someone scheduled a meeting for a host, and ensure it is set to enabled.
