id: TMA-ZOOM-1.1.2.9
title: Ensure add audio watermark is set to enabled
description: Adding audio watermark, enables invisible accreditation. If an attendee records the meeting, their personal information will be embedded in the audio as an inaudible watermark. This option requires enabling "Only signed-in users can join the meeting" or "Only signed-in users with specified domains can join meetings".
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.9 Ensure add audio watermark is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Add audio watermark, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Add audio watermark, and check if it is set to enabled.
