id: TMA-ZOOM-1.1.3.13
title: Ensure always show meeting control toolbar is set to enabled
description: Always show meeting controls during a meeting. This helps in responding to situations where host / co-host need to quickly navigate controls to handle a situation.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.13 Ensure always show meeting control toolbar is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Always show meeting control toolbar, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Always show meeting control toolbar, and ensure it is enabled.
