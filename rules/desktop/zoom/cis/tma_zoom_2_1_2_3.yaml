id: TMA-ZOOM-2.1.2.3
title: Ensure company contacts is set to disabled
description: In your Zoom applications, the Contacts list will display all members of your account.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.2.3 Ensure company contacts is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Company Contacts, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Company Contacts, and ensure it is disabled.
