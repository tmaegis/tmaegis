id: TMA-ZOOM-1.1.2.11
title: Ensure bypass the password when joining meetings from meeting list is set to enabled
description: When Zoom Rooms join a scheduled meeting on its meeting list, users do not need to manually enter the meeting passcode.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.11 Ensure bypass the password when joining meetings from meeting list is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Bypass the passcode when joining meetings from meeting list, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Schedule Meeting -> Bypass the passcode when joining meetings from meeting list, and ensure it is enabled.
