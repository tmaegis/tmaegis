id: TMA-ZOOM-1.1.6.2
title: Ensure when attendees join meeting before host is set to enabled
description: Notify host when participants join the meeting before them
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.6.2 Ensure when attendees join meeting before host is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Notify host when participants join the meeting before them, and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Email Notification -> Notify host when participants join the meeting before them, and ensure it is set to enabled.
