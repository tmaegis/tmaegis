id: TMA-ZOOM-1.1.4.2.1
title: Ensure breakout room is set to enabled
description: Allow host to split meeting participants into separate, smaller rooms. This is beneficial, when participants need to be moved to separate virtual rooms.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.2.1 Ensure breakout room is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Breakout room, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Breakout room, and ensure it is enabled.
