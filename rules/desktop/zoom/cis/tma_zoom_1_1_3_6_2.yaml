id: TMA-ZOOM-1.1.3.6.2
title: Ensure allow saving of whiteboard content is set to disabled
description: Allow host and participants to share whiteboard during a meeting. And also allow saving of whiteboard content. This can be controlled at meeting level.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.6.2 Ensure allow saving of whiteboard content is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow saving of whiteboard content and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow saving of whiteboard content and ensure it is disabled.
