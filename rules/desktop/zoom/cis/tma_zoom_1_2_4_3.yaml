id: TMA-ZOOM-1.2.4.3
title: Ensure host can pause/stop the auto recording in the cloud is set to enabled
description: Record meetings automatically as they start. This option allows to capture evidence if any incidents that happen at start of meetings. Now select "Host can pause/stop the auto recording in the cloud" to give control to host / co-hosts.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.4.3 Ensure host can pause/stop the auto recording in the cloud is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording -> Host can pause/stop the auto recording in the cloud, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording -> Host can pause/stop the auto recording in the cloud, and ensure it is enabled.
