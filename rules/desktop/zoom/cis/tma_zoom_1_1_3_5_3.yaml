id: TMA-ZOOM-1.1.3.5.3
title: Ensure only the user who is sharing can annotate is set to enabled
description: Enable "Only the user who is sharing can annotate", to ensure that only host can annotate.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.5.3 Ensure only the user who is sharing can annotate is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Only the user who is sharing can annotate and check if it is enabled (i.e, checkbox enabled).
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Only the user who is sharing can annotate and ensure it is enabled (i.e, checkbox enabled).
