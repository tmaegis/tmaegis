id: TMA-ZOOM-1.1.4.13
title: Ensure use HTML format email for Outlook plugin is set to enabled
description: Use HTML formatting instead of plain text for meeting invitations scheduled with the Outlook plugin.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.13 Ensure use HTML format email for Outlook plugin is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Use HTML format email for Outlook plugin, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Use HTML format email for Outlook plugin, and ensure it is enabled.
