id: TMA-ZOOM-1.1.3.20
title: Ensure allow participants to rename themselves is set to enabled
description: Allow meeting participants and webinar panelists to rename themselves. This option is required to identify participants in a meeting that does not require registration. Also, this options helps participants to rename themselves to self-identify.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.20 Ensure allow participants to rename themselves is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow participants to rename themselves, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow participants to rename themselves, and ensure it is enabled.
