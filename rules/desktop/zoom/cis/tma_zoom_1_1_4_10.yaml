id: TMA-ZOOM-1.1.4.10
title: Ensure identify guest participants in the meeting/webinar is set to enabled
description: Participants who belong to your account can see that a guest (someone who does not belong to your account) is participating in the meeting/webinar. The Participants list indicates which attendees are guests. The guests themselves do not see that they are listed as guests.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.10 Ensure identify guest participants in the meeting/webinar is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Identify guest participants in the meeting/webinar, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Identify guest participants in the meeting/webinar, and ensure it is enabled.
