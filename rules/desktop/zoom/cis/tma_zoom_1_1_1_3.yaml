id: TMA-ZOOM-1.1.1.3
title: Ensure waiting room options is set to everyone
description: Click on "Edit Options" to choose who should go in the waiting room? A) Everyone, B) Users not in your account, C) Users who are not in your account and not part of the allowed domains This shall increase the security by choosing which participants should go into waiting room when joining a meeting.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.3 Ensure waiting room options is set to everyone
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Security -> Waiting Room Option and click on “Edit Options” to see which option is selected.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Security -> Waiting Room Option and click on “Edit Options” to and ensure “Everyone” option is selected.
