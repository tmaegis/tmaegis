id: TMA-ZOOM-1.1.2.4
title: Ensure join before host is set to disabled
description: Allow participants to join the meeting before the host arrives should be set to disabled and locked off. This ensures people joining a meeting do not enter a meeting before the host has arrived. If there are annoying users, they cannot be removed or muted until the host arrives. Locking the setting ensures no one changes this when creating a meeting.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.4 Ensure join before host is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Join before host, and check if it is set to disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Scheduled Meeting -> Join before host, and ensure it is set to disabled.
