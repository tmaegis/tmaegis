id: TMA-ZOOM-1.1.3.4.2
title: Ensure "who can share?" is set to "Host Only"
description: Select "Who can share?" as "Host Only" here. This can be controlled by host for a particular meeting at desktop client software.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.4.2 Ensure "who can share?" is set to "Host Only"
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Who can share?, and check if “Host Only” is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Who can share?, and ensure “Host Only” is enabled.
