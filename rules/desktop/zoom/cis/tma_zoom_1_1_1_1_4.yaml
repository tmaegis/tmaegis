id: TMA-ZOOM-1.1.1.1.4
title: Ensure passcode is set to have at least 1 special character
description: 'For security purposes, Zoom has a few requirements that your passcode must meet. As per passcode requirements, Have at least 1 special character (!, @, #...). This shall make the passcode strong. This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.'
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.4 Ensure passcode is set to have at least 1 special character
audit:
  type: manual
  command: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 special character (!, @, #...), and check if it is enabled.'
remediation:
  type: iac_patch
  command: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Have at least 1 special character (!, @, #...), and ensure it is enabled.'
