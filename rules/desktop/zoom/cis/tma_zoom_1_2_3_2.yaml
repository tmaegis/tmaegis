id: TMA-ZOOM-1.2.3.2
title: Ensure display participants' names in the recording is set to enabled
description: This option display participants' names in the recording
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.3.2 Ensure display participants' names in the recording is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Display participants' names in the recording, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Advanced cloud recording settings -> Display participants' names in the recording, and ensure it is enabled.
