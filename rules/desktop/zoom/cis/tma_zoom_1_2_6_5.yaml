id: TMA-ZOOM-1.2.6.5
title: Ensure allow numeric passcode is set to disabled
description: Disable "Only allow numeric passcode"
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.6.5 Ensure allow numeric passcode is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> Only allow numeric passcode, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> Only allow numeric passcode, and ensure it is disabled.
