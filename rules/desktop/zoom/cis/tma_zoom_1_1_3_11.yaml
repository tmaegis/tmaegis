id: TMA-ZOOM-1.1.3.11
title: Ensure co-host is set to enabled
description: Allow the host to add co-hosts. Co-hosts have the same in-meeting controls as the host.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.11 Ensure co-host is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Co-host, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Co-host, and ensure it is enabled.
