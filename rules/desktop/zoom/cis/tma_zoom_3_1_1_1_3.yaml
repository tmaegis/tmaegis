id: TMA-ZOOM-3.1.1.1.3
title: Ensure password cannot contain consecutive characters is set to enabled
description: Cannot contain consecutive characters (e.g. "11111", "12345", "abcde", or "qwert") and specify the length of consecutive characters to 4 or above.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.1.3 Ensure password cannot contain consecutive characters is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Cannot contain consecutive characters (e.g. "11111", "12345", "abcde", or "qwert"), and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Enhanced Password Requirement -> Cannot contain consecutive characters (e.g. "11111", "12345", "abcde", or "qwert"), and ensure it is enabled.
