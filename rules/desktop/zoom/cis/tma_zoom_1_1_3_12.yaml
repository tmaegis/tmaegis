id: TMA-ZOOM-1.1.3.12
title: Ensure polling is set to enabled
description: Add 'Polls' to the meeting controls. This allows the host to survey the attendees. Polls also enables the host to validate if participants are active.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.12 Ensure polling is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Polling, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Polling, and ensure it is enabled.
