id: TMA-ZOOM-1.1.1.7
title: Ensure require a password for Personal Meeting ID (PMI) is set to enabled
description: Enable "Require a passcode for Personal Meeting ID (PMI)" to set a passcode for meetings that use the personal meeting ID (PMI) and then choose "All meetings using PMI" This increases security, and ensures that all meetings that are created using PMI requires a passcode to login.
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.7 Ensure require a password for Personal Meeting ID (PMI) is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode for Personal Meeting ID (PMI), and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Require a passcode for Personal Meeting ID (PMI), and ensure it is set to enabled. After enabling, check if option “All meetings using PMI” is chosen.
