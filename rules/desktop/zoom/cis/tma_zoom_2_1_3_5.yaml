id: TMA-ZOOM-2.1.3.5
title: Ensure show status to external contacts is set to disabled
description: Status indicates the current availability (Available, Away, Do Not Disturb, In a Zoom meeting, Presenting) of users to their contacts. Choose whether or not external contacts can see your users' statuses.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.3.5 Ensure show status to external contacts is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Show status to external contacts, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Show status to external contacts, and ensure it is disabled.
