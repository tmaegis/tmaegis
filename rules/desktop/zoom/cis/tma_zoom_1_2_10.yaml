id: TMA-ZOOM-1.2.10
title: Ensure require passcode to access shared cloud recordings is set to enabled
description: Passcode protection will be enforced for shared cloud recordings. A random passcode will be generated which can be modified by the users. This setting is applicable for newly generated recordings only.
target: zoom
level: 2
severity: medium
tags:
- access-control
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.10 Ensure require passcode to access shared cloud recordings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Require passcode to access shared cloud recordings, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Require passcode to access shared cloud recordings, and ensure it is enabled.
