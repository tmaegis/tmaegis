id: TMA-ZOOM-1.2.6.1
title: Ensure have a minimum passcode length is set to 8 characters or greater
description: Have a minimum passcode length of 8 characters or greater
target: zoom
level: 1
severity: medium
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.6.1 Ensure have a minimum passcode length is set to 8 characters or greater
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> set to 8 characters or greater, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Set minimum passcode strength requirements -> set to 8 characters or greater, and ensure it is enabled.
