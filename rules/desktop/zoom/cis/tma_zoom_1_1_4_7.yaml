id: TMA-ZOOM-1.1.4.7
title: Ensure closed captioning is set to disabled
description: Allow host to type closed captions or assign a participant/third party device to add closed captions.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.7 Ensure closed captioning is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Closed captioning, and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Closed captioning, and ensure it is disabled.
