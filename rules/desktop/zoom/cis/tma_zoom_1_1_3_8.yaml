id: TMA-ZOOM-1.1.3.8
title: Ensure allow meeting participants to send a private 1:1 message to another participant is set to disabled
description: Allow meeting participants to send a private 1:1 message to another participant.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.3.8 Ensure allow meeting participants to send a private 1:1 message to another participant is set to disabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow meeting participants to send a private 1:1 message to another participant., and check if it is disabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Basic) -> Allow meeting participants to send a private 1:1 message to another participant., and ensure it is disabled.
