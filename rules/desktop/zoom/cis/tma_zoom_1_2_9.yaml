id: TMA-ZOOM-1.2.9
title: Ensure IP address access control is set to organization approved ranges
description: Allow cloud recording access only from specific IP address ranges. This option can enable certain IP address range within the organization, to allow download of recording. Once enabled, provide the IP ranges.
target: zoom
level: 2
severity: low
tags:
- access-control
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.9 Ensure IP address access control is set to organization approved ranges
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> IP Address Access Control, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> IP Address Access Control, and ensure it is enabled.
