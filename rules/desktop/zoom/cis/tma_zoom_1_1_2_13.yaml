id: TMA-ZOOM-1.1.2.13
title: Ensure upcoming meeting reminder is set to enabled
description: Enable this option to receive desktop notification for upcoming meetings. Reminder time can be configured in the Zoom Desktop Client.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.2.13 Ensure upcoming meeting reminder is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Settings -> Meeting -> Schedule Meeting -> Upcoming meeting reminder and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Settings -> Meeting -> Schedule Meeting -> Upcoming meeting reminder and ensure it is set to enabled.
