id: TMA-ZOOM-1.1.1.9
title: Ensure only authenticated users can join meetings is set to enabled
description: The participants need to authenticate prior to joining the meetings, hosts can choose one of the authentication methods when scheduling a meeting.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.9 Ensure only authenticated users can join meetings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Security -> Only authenticated users can join meetings and check if it is set to enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> Security -> Only authenticated users can join meetings and ensure it is enabled.
