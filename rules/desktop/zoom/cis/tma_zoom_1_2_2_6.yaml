id: TMA-ZOOM-1.2.2.6
title: Ensure save chat messages from the meeting / webinar is set to enabled
description: Save chat messages from the meeting / webinar. Useful for any investigations.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.2.6 Ensure save chat messages from the meeting / webinar is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Save chat messages from the meeting / webinar, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Cloud recording -> Save chat messages from the meeting / webinar, and ensure it is enabled.
