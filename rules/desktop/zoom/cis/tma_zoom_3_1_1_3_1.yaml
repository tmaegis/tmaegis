id: TMA-ZOOM-3.1.1.3.1
title: Ensure only account admin can change licensed users' personal meeting ID and personal link name
description: Only account admin can change licensed users' Personal Meeting ID and Personal Link Name. After enabling this option, further enable "Personal Meeting ID" and "Personal Link Name" and click save.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 3.1.1.3.1 Ensure only account admin can change licensed users' personal meeting ID and personal link name
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Only account admin can change licensed users' Personal Meeting ID and Personal Link Name, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Advanced -> Security -> Authentication -> Security -> Only account admin can change licensed users' Personal Meeting ID and Personal Link Name, and ensure it is enabled.
