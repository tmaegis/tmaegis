id: TMA-ZOOM-2.2
title: Enable IM groups is set to the organization's needs
description: IM Groups will be displayed in the Contacts section of your Zoom client. Creates groups as required.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.2 Enable IM groups is set to the organization's needs
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Groups -> Add/Modify/Remove groups as per the organizations requirements.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Groups -> Add/Modify/Remove groups as per the organizations requirements.
