id: TMA-ZOOM-2.1.2.4
title: Ensure IM groups is set to enabled
description: In your Zoom applications, the Contacts list will display all members of your account. For "Account Management -> IM Management -> IM Groups" option to work, this option need to be enabled.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.2.4 Ensure IM groups is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> Company Contacts, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Visibility -> IM Groups, and ensure it is enabled.
