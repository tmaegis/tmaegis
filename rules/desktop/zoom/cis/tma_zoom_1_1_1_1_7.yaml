id: TMA-ZOOM-1.1.1.1.7
title: Ensure enhanced weak passcode detection is set to enabled
description: For security purposes, Zoom has a few requirements that your passcode can meet. As per passcode requirements, Use enhanced weak passcode detection. This shall make the passcode strong. This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.
target: zoom
level: 2
severity: low
tags:
- auth
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.1.1.7 Ensure enhanced weak passcode detection is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Use enhanced weak passcode detection, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Security -> Passcode Requirement -> Use enhanced weak passcode detection, and ensure it is enabled.
