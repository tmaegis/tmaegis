id: TMA-ZOOM-2.1.3.1
title: Ensure enable advanced chat encryption is set to enabled
description: Add an additional layer of encryption. Note that some features such as chat archives will be unavailable if this feature is enabled.
target: zoom
level: 2
severity: medium
tags:
- desktop
- encryption
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 2.1.3.1 Ensure enable advanced chat encryption is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Enable advanced chat encryption, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> IM Management -> IM Settings -> Security -> Enable advanced chat encryption, and ensure it is enabled.
