id: TMA-ZOOM-1.1.4.3.1
title: Ensure virtual background is set to enabled
description: Customize your background to keep your environment private from others in a meeting. This can be used with or without a green screen.
target: zoom
level: 1
severity: medium
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.1.4.3.1 Ensure virtual background is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Virtual background, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Meeting -> In Meeting (Advanced) -> Virtual background, and ensure it is enabled.
