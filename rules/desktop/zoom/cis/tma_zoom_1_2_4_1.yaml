id: TMA-ZOOM-1.2.4.1
title: Ensure automatic recording is set to enabled
description: Record meetings automatically as they start. Allows to capture evidence if any incidents that happen at start of meetings.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.4.1 Ensure automatic recording is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Automatic recording, and ensure it is enabled.
