id: TMA-ZOOM-1.2.5.2
title: Ensure only the host can download cloud recordings is set to enabled
description: Enable "Only the host can download cloud recordings" option to block others to download the cloud recordings.
target: zoom
level: 2
severity: low
tags:
- desktop
- zoom
reference: CIS Zoom Benchmark v1.0.0 - 1.2.5.2 Ensure only the host can download cloud recordings is set to enabled
audit:
  type: manual
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Only the host can download cloud recordings, and check if it is enabled.
remediation:
  type: iac_patch
  command: Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account Settings -> Recording -> Only the host can download cloud recordings, and ensure it is enabled.
