id: TMA-ZOOM-ENCRYPTION
title: Ensure meeting encryption is enforced (enhanced or end-to-end)
description: Account-level Zoom meeting settings are held server-side in the Zoom web portal, not on the endpoint, so this is a manual review.
target: zoom
level: 1
severity: medium
tags:
- zoom
- portal
reference: CIS Zoom Benchmark v1.0.0 - meeting encryption is enforced (enhanced or end-to-end)
audit:
  type: manual
  command: 'Zoom web portal (admin) > Account Settings > Meeting > Security: verify ''Allow use of end-to-end encryption'' is enabled with the default type appropriate to policy, and under Meeting > In Meeting (Basic) that ''Require encryption for 3rd party endpoints (SIP/H.323)'' is enabled.'
remediation:
  type: iac_patch
  command: Change the setting in the Zoom admin web portal (Account Settings) and lock it so group/user settings cannot override it.
