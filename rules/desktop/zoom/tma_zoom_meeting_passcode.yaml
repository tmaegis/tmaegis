id: TMA-ZOOM-MEETING-PASSCODE
title: Ensure meeting passcodes are required for all meetings
description: Account-level Zoom meeting settings are held server-side in the Zoom web portal, not on the endpoint, so this is a manual review.
target: zoom
level: 1
severity: high
tags:
- zoom
- portal
reference: CIS Zoom Benchmark v1.0.0 - meeting passcodes are required for all meetings
audit:
  type: manual
  command: 'Zoom web portal (admin) > Account Management > Account Settings > Meeting > Security: verify ''Require a passcode when scheduling new meetings'', ''Require a passcode for instant meetings'', ''Require a passcode for Personal Meeting ID (PMI)'' and ''Embed passcode in invite link'' policy are enabled and locked (padlock) at account level.'
remediation:
  type: iac_patch
  command: Change the setting in the Zoom admin web portal (Account Settings) and lock it so group/user settings cannot override it.
