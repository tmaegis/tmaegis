id: TMA-ZOOM-WAITING-ROOM
title: Ensure the Waiting Room is enabled for meetings
description: Account-level Zoom meeting settings are held server-side in the Zoom web portal, not on the endpoint, so this is a manual review.
target: zoom
level: 1
severity: high
tags:
- zoom
- portal
reference: CIS Zoom Benchmark v1.0.0 - the Waiting Room is enabled for meetings
audit:
  type: manual
  command: 'Zoom web portal (admin) > Account Settings > Meeting > Security: verify ''Waiting Room'' is enabled and locked, and that waiting room options admit only users in your account/approved domains automatically.'
remediation:
  type: iac_patch
  command: Change the setting in the Zoom admin web portal (Account Settings) and lock it so group/user settings cannot override it.
