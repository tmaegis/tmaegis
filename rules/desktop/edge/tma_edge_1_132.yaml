id: TMA-EDGE-1.132
title: 'Ensure ''Notify a user that a browser restart is recommended or required for pending updates'' is set to ''Enabled: Required - Show a recurring prompt to the user indicating that a restart is required'''
description: 'This setting determines whether a notification to restart Microsoft Edge due to an update is recommended or required. The recommended state for this setting is: Enabled: Required - Show a recurring prompt to the user indicating that a restart is required. Rationale: The end-user will receive a notification informing them that an update has been applied and that the browser must be restarted for the update to be completed. Once updates have been pushed by the organization it is pertinent that the update is applied as soon as possible. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:RelaunchNotification (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.132 Ensure ''Notify a user that a browser restart is recommended or required for pending updates'' is set to ''Enabled: Required - Show a recurring prompt to the user indicating that a restart is required'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''RelaunchNotification'' -ErrorAction SilentlyContinue).''RelaunchNotification''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'RelaunchNotification' -Value 2 -PropertyType DWord -Force | Out-Null
