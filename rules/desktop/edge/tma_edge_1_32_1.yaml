id: TMA-EDGE-1.32.1
title: Ensure 'Configure Microsoft Edge Scareware blocker protection' is set to 'Enabled'
description: 'This policy setting controls whether Microsoft Edge enables Scareware blocker, an AI- powered feature for protecting users from potential tech scams. The recommended state for this setting is: Enabled. Rationale: Scareware attacks use full-screen alerts, fake virus warnings, and urgent messaging to trick users into calling fraudulent support numbers or downloading malicious software. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ScarewareBlockerProtectionEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.32.1 Ensure 'Configure Microsoft Edge Scareware blocker protection' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ScarewareBlockerProtectionEnabled'' -ErrorAction SilentlyContinue).''ScarewareBlockerProtectionEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ScarewareBlockerProtectionEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
