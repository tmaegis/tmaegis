id: TMA-EDGE-1.103
title: Ensure 'Enable globally scoped HTTP auth cache' is set to 'Disabled'
description: 'This policy setting controls whether HTTP auth credentials may be automatically used in the context of another web site visited in Microsoft Edge. The recommended state for this setting is: Disabled. Note: This policy is intended to give enterprises a chance to update their login procedures and will be removed in the future. Rationale: Allowing HTTP auth credentials to be shared without the user''s consent could lead to a user sharing sensitive information without their knowledge. Enabling this setting could also lead to some types of cross-site attacks, that would allow users to be tracked across sites without the use of cookies. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:GloballyScopeHTTPAuthCacheEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group
  Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.103 Ensure 'Enable globally scoped HTTP auth cache' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''GloballyScopeHTTPAuthCacheEnabled'' -ErrorAction SilentlyContinue).''GloballyScopeHTTPAuthCacheEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'GloballyScopeHTTPAuthCacheEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
