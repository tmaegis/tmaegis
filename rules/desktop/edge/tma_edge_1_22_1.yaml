id: TMA-EDGE-1.22.1
title: Ensure 'Enable saving passkeys to the password manager' is set to 'Disabled'
description: 'This policy setting controls whether users can save passkeys in the built-in password manager. The recommended state for this setting is: Disabled. Note: If the PasswordManagerEnabled policy is disabled, saving to the built-in password manager is disabled in general, including passkeys. In that case, this policy has no effect. Rationale: Storing passkeys in the browser''s built-in password manager places authentication credentials outside the organization''s centralized credential management framework. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:PasswordManagerPasskeysEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.22.1 Ensure 'Enable saving passkeys to the password manager' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''PasswordManagerPasskeysEnabled'' -ErrorAction SilentlyContinue).''PasswordManagerPasskeysEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'PasswordManagerPasskeysEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
