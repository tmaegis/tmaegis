id: TMA-EDGE-1.135
title: Ensure 'Shopping in Microsoft Edge Enabled' is set to 'Disabled'
description: 'This policy setting allows users to compare the prices of products, get coupons or rebates from the website, auto-apply coupons, and check out faster using autofill data. Coupons for the current retailer and prices from other retailers will be fetched from a server. The recommended state for this setting is: Disabled. Rationale: Shopping in Microsoft Edge shares a user''s browsing and search history to provide price comparison and coupons, which could inadvertently expose and share sensitive data with a third-party. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:EdgeShoppingAssistantEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.135 Ensure 'Shopping in Microsoft Edge Enabled' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''EdgeShoppingAssistantEnabled'' -ErrorAction SilentlyContinue).''EdgeShoppingAssistantEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EdgeShoppingAssistantEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
