id: TMA-EDGE-1.72
title: Ensure 'Clear cached images and files when Microsoft Edge closes' is set to 'Disabled'
description: 'This policy controls whether cached images and files are deleted each time Microsoft Edge closes. The recommended state for this setting is: Disabled. Rationale: Deleting browser data on close will delete information that may be important for a computer investigation and investigators such as Computer Forensics Analysts may not be able to retrieve pertinent information to the investigation. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ClearCachedImagesAndFilesOnExit (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.72 Ensure 'Clear cached images and files when Microsoft Edge closes' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ClearCachedImagesAndFilesOnExit'' -ErrorAction SilentlyContinue).''ClearCachedImagesAndFilesOnExit''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ClearCachedImagesAndFilesOnExit' -Value 0 -PropertyType DWord -Force | Out-Null
