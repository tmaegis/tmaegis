id: TMA-EDGE-1.112
title: Ensure 'Enable service-based extraction for Reading Mode in Microsoft Edge' is set to 'Disabled'
description: 'This policy setting controls whether Microsoft Edge can use the Microsoft online extraction service to improve Reading Mode rendering. The recommended state for this setting is: Disabled. Note: Disabling this policy does not disable Reading Mode. Reading Mode remains available, but extraction quality may be limited. Rationale: When service-based extraction is enabled, the text content of web pages viewed in Reading Mode is transmitted to a Microsoft online service for processing. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:EdgeReadingModeServiceBasedExtractionEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.112 Ensure 'Enable service-based extraction for Reading Mode in Microsoft Edge' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''EdgeReadingModeServiceBasedExtractionEnabled'' -ErrorAction SilentlyContinue).''EdgeReadingModeServiceBasedExtractionEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EdgeReadingModeServiceBasedExtractionEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
