id: TMA-EDGE-1.94
title: Ensure 'Enable Application Bound Encryption' is set to 'Enabled'
description: "This policy setting configures whether encryption keys used for local data storage are bound to Microsoft Edge whenever possible. The recommended state for this setting is: Enabled. Rationale: When this policy setting is disabled, it has a detrimental effect on Microsoft Edge\xB4s security by allowing unknown and potentially hostile apps the possibility to retrieve the encryption keys used to secure data. Audit reads the Group Policy registry value and prints 'compliant', 'unset' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:ApplicationBoundEncryptionEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it."
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.94 Ensure 'Enable Application Bound Encryption' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ApplicationBoundEncryptionEnabled'' -ErrorAction SilentlyContinue).''ApplicationBoundEncryptionEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ApplicationBoundEncryptionEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
