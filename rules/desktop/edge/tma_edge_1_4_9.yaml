id: TMA-EDGE-1.4.9
title: 'Ensure ''Default automatic downloads setting'' is set to ''Enabled: Prevent all websites from performing multiple downloads, even after a user gesture'''
description: 'This policy setting controls whether websites can perform multiple downloads successively without user interaction. The recommended state for this setting is: Enabled: Prevent all websites from performing multiple downloads, even after a user gesture. Rationale: Unintentional malicious content could be downloaded without user interaction if websites are allowed to perform automatic downloads. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultAutomaticDownloadsSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.4.9 Ensure ''Default automatic downloads setting'' is set to ''Enabled: Prevent all websites from performing multiple downloads, even after a user gesture'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultAutomaticDownloadsSetting'' -ErrorAction SilentlyContinue).''DefaultAutomaticDownloadsSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultAutomaticDownloadsSetting' -Value 2 -PropertyType DWord -Force | Out-Null
