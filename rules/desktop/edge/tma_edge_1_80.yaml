id: TMA-EDGE-1.80
title: 'Ensure ''Configure the Share experience'' is set to ''Enabled: Don''t allow using the Share experience'''
description: 'This policy setting allows users to be able to access the Share experience from the Settings and More menu in Microsoft Edge, which can allow information to be shared with other apps on the system. The recommended state for this setting is: Enabled: Don''t allow using the Share experience. Rationale: Having this setting enabled could allow malicious content from Microsoft Edge to be exposed to other parts of the operating system. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ConfigureShare (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.80 Ensure ''Configure the Share experience'' is set to ''Enabled: Don''t allow using the Share experience'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ConfigureShare'' -ErrorAction SilentlyContinue).''ConfigureShare''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ConfigureShare' -Value 1 -PropertyType DWord -Force | Out-Null
