id: TMA-EDGE-1.130
title: Ensure 'Live captions allowed' is set to 'Disabled'
description: 'This policy setting allows users to turn live captions on or off. Live captions are an accessibility feature that converts speech from the audio that plays in Microsoft Edge to text and shows this text in a separate window. The recommended state for this setting is: Disabled. Rationale: Enabling live captions could allow data to be transmitted to a third-party, which could lead to sensitive data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:LiveCaptionsAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.130 Ensure 'Live captions allowed' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''LiveCaptionsAllowed'' -ErrorAction SilentlyContinue).''LiveCaptionsAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'LiveCaptionsAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
