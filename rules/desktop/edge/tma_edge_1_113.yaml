id: TMA-EDGE-1.113
title: Ensure 'Enable site isolation for every site' is set to 'Enabled'
description: 'This policy setting ensures that each website runs in its own process so that a site will not be able to utilize or take data from another running site. The recommended state for this setting is: Enabled. Rationale: Enabling site isolation can help stop sites from inadvertently sharing data with other running sites. This will help protect data from untrusted sources. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:SitePerProcess (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.113 Ensure 'Enable site isolation for every site' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''SitePerProcess'' -ErrorAction SilentlyContinue).''SitePerProcess''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SitePerProcess' -Value 1 -PropertyType DWord -Force | Out-Null
