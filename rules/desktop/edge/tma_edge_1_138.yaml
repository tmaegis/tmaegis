id: TMA-EDGE-1.138
title: Ensure 'Show the Reload in Internet Explorer mode button in the toolbar' is set to 'Disabled'
description: 'This policy setting shows the Reload in Internet Explorer mode button in the toolbar. IE Mode in Microsoft Edge allows organizations that still need Internet Explorer 11, (which is not supported) for backward compatibility with existing websites. The recommended state for this setting is: Disabled. Rationale: Internet Explorer is officially retired and unsupported. Allowing browsers to reconfigure into Internet Explorer mode could open an organization up to malicious sites due to its lack of support for modern security features. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:InternetExplorerModeToolbarButtonEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.138 Ensure 'Show the Reload in Internet Explorer mode button in the toolbar' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''InternetExplorerModeToolbarButtonEnabled'' -ErrorAction SilentlyContinue).''InternetExplorerModeToolbarButtonEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'InternetExplorerModeToolbarButtonEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
