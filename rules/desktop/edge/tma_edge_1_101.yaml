id: TMA-EDGE-1.101
title: Ensure 'Enable deleting browser and download history' is set to 'Disabled'
description: 'This policy controls whether users can delete browser and download history for Microsoft Edge. The recommended state for this setting is: Disabled. Note: Even when this policy is Disabled, the browsing and download history isn''t guaranteed to be retained. Rationale: Deleting browser data will delete information that may be important for a computer investigation. Investigators such as Computer Forensics Analysts may not be able to retrieve pertinent information for the investigation. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:AllowDeletingBrowserHistory (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.101 Ensure 'Enable deleting browser and download history' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''AllowDeletingBrowserHistory'' -ErrorAction SilentlyContinue).''AllowDeletingBrowserHistory''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AllowDeletingBrowserHistory' -Value 0 -PropertyType DWord -Force | Out-Null
