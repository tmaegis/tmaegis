id: TMA-EDGE-1.4.7
title: 'Ensure ''Control use of the Web Bluetooth API'' is set to ''Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API'''
description: 'This policy setting controls whether websites can access connected Bluetooth devices. The recommended state for this setting is: Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API. Rationale: Web Bluetooth could potentially be used for attacks that may bypass other controls regarding connected Bluetooth hardware including microphones, cameras, and other devices which information could be gathered from or inappropriately utilized. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultWebBluetoothGuardSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.4.7 Ensure ''Control use of the Web Bluetooth API'' is set to ''Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultWebBluetoothGuardSetting'' -ErrorAction SilentlyContinue).''DefaultWebBluetoothGuardSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultWebBluetoothGuardSetting' -Value 2 -PropertyType DWord -Force | Out-Null
