id: TMA-EDGE-1.115
title: Ensure 'Enable tab organization suggestions' is set to 'Disabled'
description: 'This policy setting controls whether Microsoft Edge can use its tab organization service to help name or suggest tab groups. The recommended state for this setting is: Disabled. Rationale: Sending Microsoft Edge tab data (URLs, page titles, and existing group information) to the tab organization service could led to privacy concerns or sensitive data being exposed to a third-party. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:TabServicesEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.115 Ensure 'Enable tab organization suggestions' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''TabServicesEnabled'' -ErrorAction SilentlyContinue).''TabServicesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'TabServicesEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
