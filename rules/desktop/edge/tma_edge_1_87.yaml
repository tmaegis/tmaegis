id: TMA-EDGE-1.87
title: 'Ensure ''Default sensors setting'' is set to ''Enabled: Do not allow any site to access sensors'''
description: 'This policy setting configures whether websites can access and use sensors such as motion and light. The recommended state for this setting is: Enabled: Do not allow any site to access sensors. Rationale: Sensor APIs may expose data to sites and services and may even give sites control over functionality. Due to privacy concerns, sensors should never be accessed by websites or third-party vendors. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultSensorsSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: low
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.87 Ensure ''Default sensors setting'' is set to ''Enabled: Do not allow any site to access sensors'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultSensorsSetting'' -ErrorAction SilentlyContinue).''DefaultSensorsSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultSensorsSetting' -Value 2 -PropertyType DWord -Force | Out-Null
