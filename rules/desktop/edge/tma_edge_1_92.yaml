id: TMA-EDGE-1.92
title: 'Ensure ''Dynamic Code Settings'' is set to ''Enabled: Prevent the browser process from creating dynamic code'''
description: 'This policy setting controls the Dynamic Code Settings for Microsoft Edge. The recommended state for this setting is: Enabled: Prevent the browser process from creating dynamic code. Rationale: Leaving this policy in its default state decreases the security of Microsoft Edge by allowing potentially hostile Dynamic Code and third-party code to make changes to Microsoft Edge''s behavior. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DynamicCodeSettings (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.92 Ensure ''Dynamic Code Settings'' is set to ''Enabled: Prevent the browser process from creating dynamic code'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DynamicCodeSettings'' -ErrorAction SilentlyContinue).''DynamicCodeSettings''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DynamicCodeSettings' -Value 1 -PropertyType DWord -Force | Out-Null
