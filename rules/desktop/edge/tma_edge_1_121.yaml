id: TMA-EDGE-1.121
title: Ensure 'Enable User Web App Install From Browser' is set to 'Disabled'
description: 'This policy setting controls whether users can install web apps through Microsoft Edge. The recommended state for this setting is: Disabled. Note: This policy does not affect the WebAppInstallForceList policy. Web apps specified by that policy are installed regardless of this policy setting. This policy does not support dynamic refresh. Changes take effect only after the browser is restarted. Rationale: Allowing users to install web apps through the browser introduces applications to the enterprise environment without IT oversight. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:WebAppInstallByUserEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.121 Ensure 'Enable User Web App Install From Browser' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''WebAppInstallByUserEnabled'' -ErrorAction SilentlyContinue).''WebAppInstallByUserEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'WebAppInstallByUserEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
