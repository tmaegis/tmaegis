id: TMA-EDGE-1.123
title: Ensure 'Enables DALL-E themes generation' is set to 'Disabled'
description: 'This policy setting configures the use of generated browser themes using DALL-E and apply them to Microsoft Edge. DALL-E is an open Artificial Intelligence (AI) system that creates realistic images and art from text descriptions (prompts). The recommended state for this setting is: Disabled. Rationale: The rush to bring GenAI to market has brought to light concerns about the training data rapidly ingested by these large language models (LLMs). Content creators have complained copyright infringement on the content generated by these products. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:AIGenThemesEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.123 Ensure 'Enables DALL-E themes generation' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''AIGenThemesEnabled'' -ErrorAction SilentlyContinue).''AIGenThemesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AIGenThemesEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
