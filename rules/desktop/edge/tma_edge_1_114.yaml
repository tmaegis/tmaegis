id: TMA-EDGE-1.114
title: Ensure 'Enable strict MIME type checking for worker scripts' is set to 'Enabled'
description: 'This policy setting controls whether strict MIME type checking is used for worker scripts. The recommended state for this setting is: Enabled. Note: Microsoft Edge uses strict MIME type checking by default. Enabling this policy enforces the default behavior via policy and prevents administrators from disabling it for compatibility purposes. Rationale: Lax MIME type checking allows resources to load as executable scripts when they were not intended to be used that way. An attacker could exploit this behavior to deliver malicious content with a non-JavaScript MIME type that the browser would still execute as a worker script, bypassing content type... Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:StrictMimetypeCheckForWorkerScriptsEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it
  through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.114 Ensure 'Enable strict MIME type checking for worker scripts' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''StrictMimetypeCheckForWorkerScriptsEnabled'' -ErrorAction SilentlyContinue).''StrictMimetypeCheckForWorkerScriptsEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'StrictMimetypeCheckForWorkerScriptsEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
