id: TMA-EDGE-1.145
title: Ensure 'Text prediction enabled by default' is set to 'Disabled'
description: 'This policy setting controls whether text predictions will be provided for eligible text fields. The Microsoft Turing service uses natural language processing to generate predictions for long-form editable text fields on web pages. The recommended state for this setting is: Disabled. Rationale: Enabling text predictions could allow data to be transmitted to a third-party cloud service, which could lead to sensitive data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:TextPredictionEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.145 Ensure 'Text prediction enabled by default' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''TextPredictionEnabled'' -ErrorAction SilentlyContinue).''TextPredictionEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'TextPredictionEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
