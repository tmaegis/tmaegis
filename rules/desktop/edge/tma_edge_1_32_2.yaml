id: TMA-EDGE-1.32.2
title: Ensure 'Configure Microsoft Edge scareware blocker to block sites detected as potential tech scams' is set to 'Enabled'
description: 'This policy setting controls whether Microsoft Edge blocks sites that are detected as potential tech scams. The recommended state for this setting is: Enabled. Note: If the ScarewareBlockerProtectionEnabled policy is disabled, this policy has no effect. Rationale: Without active blocking of detected scareware sites, Scareware blocker can detect potential tech scams but cannot prevent users from interacting with them. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ScarewareBlockerBlocksDetectedSitesEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.32.2 Ensure 'Configure Microsoft Edge scareware blocker to block sites detected as potential tech scams' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ScarewareBlockerBlocksDetectedSitesEnabled'' -ErrorAction SilentlyContinue).''ScarewareBlockerBlocksDetectedSitesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ScarewareBlockerBlocksDetectedSitesEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
