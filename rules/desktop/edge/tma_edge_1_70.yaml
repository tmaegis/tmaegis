id: TMA-EDGE-1.70
title: 'Ensure ''Browser sign-in settings'' is set to ''Enabled: Disable browser sign-in'''
description: 'This policy setting controls whether a user can sign into Microsoft Edge with an account to use services such as sync and single sign on. The recommended state for this setting is: Enabled: Disable browser sign-in. Note: To control the availability of sync, use the SyncDisabled (Disable synchronization of data using Microsoft sync services) policy. Rationale: Users will not be able to sign into Microsoft Edge with an account. Signing into Edge does not automatically sync users'' data, to control the availability of sync, use the SyncDisabled (Disable synchronization of data using Microsoft sync services) policy. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:BrowserSignin (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: low
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.70 Ensure ''Browser sign-in settings'' is set to ''Enabled: Disable browser sign-in'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''BrowserSignin'' -ErrorAction SilentlyContinue).''BrowserSignin''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'BrowserSignin' -Value 0 -PropertyType DWord -Force | Out-Null
