id: TMA-EDGE-1.64
title: Ensure 'Allow websites to query for available payment methods' is set to 'Disabled'
description: 'This policy setting allows you to set whether a website can check to see if the user has payment methods saved. The recommended state for this setting is: Disabled. Rationale: Saving payment information in Microsoft Edge could lead to sensitive data being leaked and used for non-legitimate purposes. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:PaymentMethodQueryEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.64 Ensure 'Allow websites to query for available payment methods' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''PaymentMethodQueryEnabled'' -ErrorAction SilentlyContinue).''PaymentMethodQueryEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'PaymentMethodQueryEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
