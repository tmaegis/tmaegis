id: TMA-EDGE-1.56
title: Ensure 'Allow socket pool size randomization for proxies' is set to 'Enabled'
description: 'This policy setting controls whether Microsoft Edge randomizes socket pool sizes for proxy connections. Socket pool size randomization is a security mechanism that prevents attackers from using deterministic connection limits to infer cross-site information. The recommended state for this setting is: Enabled. Rationale: Without socket pool size randomization, the deterministic connection limit for proxy connections becomes a side channel that attackers can exploit to infer cross-site information. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:AllowSocketPoolSizeRandomizationForProxies (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.56 Ensure 'Allow socket pool size randomization for proxies' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''AllowSocketPoolSizeRandomizationForProxies'' -ErrorAction SilentlyContinue).''AllowSocketPoolSizeRandomizationForProxies''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AllowSocketPoolSizeRandomizationForProxies' -Value 1 -PropertyType DWord -Force | Out-Null
