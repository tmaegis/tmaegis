id: TMA-EDGE-1.34.6
title: Ensure 'Prevent bypassing of Microsoft Defender SmartScreen warnings about downloads' is set to 'Enabled'
description: 'This policy setting controls whether users may override Microsoft Defender SmartScreen warnings regarding downloads that are unverified. The recommended state for this setting is: Enabled. Rationale: Smartscreen checks downloads and verifies whether they are deemed safe or not. Only allowing verified downloads greatly reduces risk of a download containing a virus, spyware, or other unwanted software. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:PreventSmartScreenPromptOverrideForFiles (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: high
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.34.6 Ensure 'Prevent bypassing of Microsoft Defender SmartScreen warnings about downloads' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''PreventSmartScreenPromptOverrideForFiles'' -ErrorAction SilentlyContinue).''PreventSmartScreenPromptOverrideForFiles''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'PreventSmartScreenPromptOverrideForFiles' -Value 1 -PropertyType DWord -Force | Out-Null
