id: TMA-EDGE-1.4.8
title: 'Ensure ''Control use of the WebHID API'' is set to ''Enabled: Do not allow any site to request access to HID devices via the WebHID API'''
description: 'This policy setting determines whether a website can ask for access to use the WebHID API. The WebHID API allows websites to access alternative auxiliary keyboards and exotic gamepads. The recommended state for this setting is: Enabled: Do not allow any site to request access to HID devices via the WebHID API. Rationale: Disabling the WebHID API prevents HID peripherals from exposing powerful functionality that should not be made accessible to the page without explicit consent. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultWebHidGuardSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.4.8 Ensure ''Control use of the WebHID API'' is set to ''Enabled: Do not allow any site to request access to HID devices via the WebHID API'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultWebHidGuardSetting'' -ErrorAction SilentlyContinue).''DefaultWebHidGuardSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultWebHidGuardSetting' -Value 2 -PropertyType DWord -Force | Out-Null
