id: TMA-EDGE-1.102
title: Ensure 'Enable Drop feature in Microsoft Edge' is set to 'Disabled'
description: 'This policy setting configures the drop feature in Microsoft Edge. The drop feature lets users send messages or files to themselves. The recommended state for this setting is: Disabled. Rationale: Enabling the Microsoft Edge Drop feature could allow sensitive data to be transmitted to a device that is not authorized or a third-party, which could lead to that data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:EdgeEdropenabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.102 Ensure 'Enable Drop feature in Microsoft Edge' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''EdgeEdropenabled'' -ErrorAction SilentlyContinue).''EdgeEdropenabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EdgeEdropenabled' -Value 0 -PropertyType DWord -Force | Out-Null
