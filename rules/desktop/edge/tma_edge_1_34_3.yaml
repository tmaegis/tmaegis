id: TMA-EDGE-1.34.3
title: Ensure 'Enable Microsoft Defender SmartScreen DNS requests' is set to 'Enabled'
description: 'This policy setting configures DNS requests made by Microsoft Defender SmartScreen. The recommended state for this setting is: Enabled. Note: This policy is available only on Windows instances that are joined to a Microsoft Active Directory domain, Windows 10 Pro or Enterprise instances that are enrolled for device management, or macOS instances that are that are managed via MDM or joined to a domain via MCX. Rationale: Whenever SmartScreen is enabled for Edge browser, SmartScreen tries to check if the website is a phishing/malicious URL and does a local DNS query. If the DNS server fails to resolve the website, Web Isolation will not be used to isolate those websites. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:SmartScreenDnsRequestsEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain
  set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: high
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.34.3 Ensure 'Enable Microsoft Defender SmartScreen DNS requests' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''SmartScreenDnsRequestsEnabled'' -ErrorAction SilentlyContinue).''SmartScreenDnsRequestsEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SmartScreenDnsRequestsEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
