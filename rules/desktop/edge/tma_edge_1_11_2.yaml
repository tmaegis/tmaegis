id: TMA-EDGE-1.11.2
title: 'Ensure ''Configure extension management settings'' is set to ''Enabled: { "*": {"installation_mode": "blocked" }}'''
description: 'This policy setting controls extension management settings for Microsoft Edge, including any controlled by existing extension-related policies. This policy supersedes any legacy policies that might be set. The recommended state for this setting is: Enabled: { "*": {"installation_mode": "blocked" }}. NOTE: This policy maps an extension ID or an update URL to its specific setting only. Rationale: Blocking extensions that could potentially allow remote control of the system through the browser is good security practice. If extensions are needed for securing the browser, or for enterprise use, these can be enabled by configuring the setting Allow specific extensions to be installed. Reads the JSON in HKLM\SOFTWARE\Policies\Microsoft\Edge:ExtensionSettings and requires the ''*'' entry to have installation_mode ''blocked''.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.11.2 Ensure ''Configure extension management settings'' is set to ''Enabled: { "*": {"installation_mode": "blocked" }}'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ExtensionSettings'' -ErrorAction SilentlyContinue).''ExtensionSettings''; if ($null -eq $v) { ''unset'' } else { try { $j = $v | ConvertFrom-Json -ErrorAction Stop; if ($j.''*''.installation_mode -eq ''blocked'') { ''compliant'' } else { ''non-compliant: '' + $v } } catch { ''invalid-json'' } }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    $k = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; $n = 'ExtensionSettings'
    $cur = (Get-ItemProperty -LiteralPath $k -Name $n -ErrorAction SilentlyContinue).$n
    if ($cur) {
      try { $j = $cur | ConvertFrom-Json -ErrorAction Stop } catch { throw "$n is not valid JSON; refusing to overwrite it" }
    } else { $j = [pscustomobject]@{} }
    if ($null -eq $j) { $j = [pscustomobject]@{} }
    if (-not ($j.PSObject.Properties | Where-Object { $_.Name -ceq '*' })) { $j | Add-Member -NotePropertyName '*' -NotePropertyValue ([pscustomobject]@{}) }
    $star = $j.'*'
    if ($star.PSObject.Properties | Where-Object { $_.Name -ceq 'installation_mode' }) { $star.installation_mode = 'blocked' }
    else { $star | Add-Member -NotePropertyName 'installation_mode' -NotePropertyValue 'blocked' }
    Set-TmaReg $k $n ($j | ConvertTo-Json -Depth 10 -Compress) 'String'
  guidance: "Configure through Group Policy: Computer Configuration\\Polices\\Administrative Templates\\Microsoft Edge\\Extensions\\Configure extension management settings = Enabled: { \"*\": {\"installation_mode\": \"blocked\" }}. Add per-extension \"allowed\"/\"force_installed\" entries for approved extensions."
