id: TMA-EDGE-1.144
title: Ensure 'Suppress the unsupported OS warning' is set to 'Disabled'
description: 'This policy setting suppresses the warning that appears when Microsoft Edge is running on a computer or operating system that is no longer supported. If this policy is disabled or unset, the warnings will appear on such unsupported computers or operating systems. The recommended state for this setting is: Disabled. Rationale: Users will be notified if the Operating System software is no longer supported. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:SuppressUnsupportedOSWarning (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.144 Ensure 'Suppress the unsupported OS warning' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''SuppressUnsupportedOSWarning'' -ErrorAction SilentlyContinue).''SuppressUnsupportedOSWarning''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'SuppressUnsupportedOSWarning' -Value 0 -PropertyType DWord -Force | Out-Null
