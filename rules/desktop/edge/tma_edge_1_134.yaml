id: TMA-EDGE-1.134
title: 'Ensure ''Set the time period for update notifications'' is set to ''Enabled: 86400000'''
description: 'This setting does not determine if updates are applied, the policy setting allows setting a time period in which users are notified that Microsoft Edge has been updated and must be closed and re-opened. The recommended state for this setting is: Enabled: 86400000. Rationale: This setting is a notification for the end-user informing them that an update has been applied and that the browser must be restarted for the update to be completed. Once updates have been pushed by the organization it is pertinent that said update takes effect as soon as possible. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:RelaunchNotificationPeriod (REG_DWORD); compliant when it is 86400000. Remediation writes 86400000 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.134 Ensure ''Set the time period for update notifications'' is set to ''Enabled: 86400000'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''RelaunchNotificationPeriod'' -ErrorAction SilentlyContinue).''RelaunchNotificationPeriod''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(86400000) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'RelaunchNotificationPeriod' -Value 86400000 -PropertyType DWord -Force | Out-Null
