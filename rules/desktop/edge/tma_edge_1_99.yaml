id: TMA-EDGE-1.99
title: Ensure 'Enable component updates in Microsoft Edge' is set to 'Enabled'
description: 'This policy determines whether updates for Microsoft Edge components are enabled in Microsoft Edge. The recommendation state for this setting is: Enabled. Note: Updates that are deemed "critical for security" are still applied even if you disable this policy as well as any component that doesn''t contain executable code, that doesn''t significantly alter the behavior of the browser. Rationale: Component updates should always be up to date to ensure the latest security patches and capabilities are applied. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ComponentUpdatesEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.99 Ensure 'Enable component updates in Microsoft Edge' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ComponentUpdatesEnabled'' -ErrorAction SilentlyContinue).''ComponentUpdatesEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ComponentUpdatesEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
