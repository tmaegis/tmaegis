id: TMA-EDGE-1.109
title: Ensure 'Enable resolution of navigation errors using a web service' is set to 'Disabled'
description: 'This policy setting controls whether Microsoft Edge can issue a data less connection to a web service to probe networks, (ex: Hotel and Airport Wi-Fi) for connectivity issues. The recommended state for this setting is: Disabled. Note: Except on Windows 8 and later versions of Windows, Microsoft Edge always uses native APIs to resolve connectivity issues. Rationale: This setting could potentially allow information about the user''s network to be disclosed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ResolveNavigationErrorsUseWebService (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.109 Ensure 'Enable resolution of navigation errors using a web service' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ResolveNavigationErrorsUseWebService'' -ErrorAction SilentlyContinue).''ResolveNavigationErrorsUseWebService''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ResolveNavigationErrorsUseWebService' -Value 0 -PropertyType DWord -Force | Out-Null
