id: TMA-EDGE-1.129
title: Ensure 'In-app support Enabled' is set to 'Disabled'
description: 'This policy setting allows users to contact in-app Microsoft support agents directly from the Microsoft Edge browser. The recommended state for this setting is: Disabled. Rationale: In-app support shares a user''s browsing and search history, which could inadvertently expose and share sensitive data with Microsoft. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:InAppSupportEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.129 Ensure 'In-app support Enabled' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''InAppSupportEnabled'' -ErrorAction SilentlyContinue).''InAppSupportEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'InAppSupportEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
