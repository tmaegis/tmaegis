id: TMA-EDGE-1.10.1
title: 'Ensure ''Configure users ability to override feature flags'' is set to ''Enabled: Prevent users from overriding feature flags'''
description: 'This policy setting configures users'' ability to override state of feature flags. Feature flags are settings a team can define that indicate whether a given set of features is visible in the user experience and/or invoked within the functionality. The recommended state for this setting is: Enabled: Prevent users from overriding feature flags. Rationale: The ability to enter commands and override programs should be limited at the CLI to prevent unintentional system configuration alterations. Additionally, feature flags are not necessary for users, as they are typically used by Development teams. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:FeatureFlagoverridesControl (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.10.1 Ensure ''Configure users ability to override feature flags'' is set to ''Enabled: Prevent users from overriding feature flags'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''FeatureFlagoverridesControl'' -ErrorAction SilentlyContinue).''FeatureFlagoverridesControl''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'FeatureFlagoverridesControl' -Value 0 -PropertyType DWord -Force | Out-Null
