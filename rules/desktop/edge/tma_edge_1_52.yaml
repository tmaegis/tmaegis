id: TMA-EDGE-1.52
title: Ensure 'Allow or deny screen capture' is set to 'Disabled'
description: 'This policy setting controls whether Microsoft Edge can use screen-share APIs including web-based online meetings, video, or screen sharing. The recommended state for this setting is: Disabled. Rationale: Allowing screen-share APIs within Microsoft Edge could potentially allow for sensitive data to be shared via screen captures. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ScreenCaptureAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.52 Ensure 'Allow or deny screen capture' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ScreenCaptureAllowed'' -ErrorAction SilentlyContinue).''ScreenCaptureAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ScreenCaptureAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
