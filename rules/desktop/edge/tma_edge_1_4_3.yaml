id: TMA-EDGE-1.4.3
title: 'Ensure ''Control use of insecure content exceptions'' is set to ''Enabled: Do not allow any site to load mixed content'''
description: 'This policy setting allows for the configuration for users to add exceptions to allow mixed content for specific sites. The recommended state for this setting is: Enabled: Do not allow any site to load mixed content Note: This policy can be overridden for specific URL patterns using the insecurecontentAllowedForUrls) (Allow insecure content on specified sites) and insecurecontentBlockedForUrls (Block insecure content... Rationale: Allowing mixed (secure / insecure) content from a site can lead to malicious content being loaded. Mixed content occurs if the initial request is secure over HTTPS, but HTTPS and HTTP content is subsequently loaded to display the web page. HTTPS content is secure. HTTP content is insecure. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultinsecurecontentSetting (REG_DWORD); compliant when
  it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: high
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.4.3 Ensure ''Control use of insecure content exceptions'' is set to ''Enabled: Do not allow any site to load mixed content'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultinsecurecontentSetting'' -ErrorAction SilentlyContinue).''DefaultinsecurecontentSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultinsecurecontentSetting' -Value 2 -PropertyType DWord -Force | Out-Null
