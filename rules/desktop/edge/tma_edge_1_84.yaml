id: TMA-EDGE-1.84
title: 'Ensure ''Control use of the Serial API'' is set to ''Enable: Do not allow any site to request access to serial ports via the Serial API'''
description: 'This policy setting configures whether websites can access the systems serial ports. The recommended state for this setting is: Enable: Do not allow any site to request access to serial ports via the Serial API. Rationale: Preventing access to system serial ports may prevent malicious sites from using these ports and accessing attached devices. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultSerialGuardSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.84 Ensure ''Control use of the Serial API'' is set to ''Enable: Do not allow any site to request access to serial ports via the Serial API'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultSerialGuardSetting'' -ErrorAction SilentlyContinue).''DefaultSerialGuardSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultSerialGuardSetting' -Value 2 -PropertyType DWord -Force | Out-Null
