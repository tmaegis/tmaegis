id: TMA-EDGE-1.141
title: Ensure 'Spell checking provided by Microsoft Editor' is set to 'Disabled'
description: 'This policy setting controls whether the Microsoft Editor service provides enhanced spell and grammar checking for eligible text fields. The recommended state for this setting is: Disabled. Rationale: Microsoft Editor is an AI-powered service that that sends data to a third-party cloud service. Sending this data to the cloud could lead to sensitive data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:MicrosoftEditorProofingEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: low
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.141 Ensure 'Spell checking provided by Microsoft Editor' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''MicrosoftEditorProofingEnabled'' -ErrorAction SilentlyContinue).''MicrosoftEditorProofingEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'MicrosoftEditorProofingEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
