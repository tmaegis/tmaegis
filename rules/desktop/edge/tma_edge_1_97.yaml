id: TMA-EDGE-1.97
title: Ensure 'Enable browser legacy extension point blocking' is set to 'Enabled'
description: "This policy setting sets the ProcessExtensionPointDisablePolicy on Microsoft Edge\xB4s browser process to block code injection from legacy third party applications. The recommended state for this setting is: Enabled. Note: Per Microsoft, only turn off the policy if there are compatibility issues with third- party software that must run inside Microsoft Edge\xB4s browser process. Rationale: If this policy is set to Disabled, it may have a detrimental effect on Microsoft Edge\xB4s security and stability as unknown and potentially hostile code can load inside Microsoft Edge\xB4s browser process. Audit reads the Group Policy registry value and prints 'compliant', 'unset' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:BrowserLegacyExtensionPointsBlockingEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it."
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.97 Ensure 'Enable browser legacy extension point blocking' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''BrowserLegacyExtensionPointsBlockingEnabled'' -ErrorAction SilentlyContinue).''BrowserLegacyExtensionPointsBlockingEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'BrowserLegacyExtensionPointsBlockingEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
