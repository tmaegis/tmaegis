id: TMA-EDGE-1.4.10
title: 'Ensure ''Default geolocation setting'' is set to ''Enabled: Don''t allow any site to track users'' physical location'''
description: 'This policy setting controls whether a user''s physical location can be tracked by websites. The recommended state for this setting is: Enabled: Don''t allow any site to track users'' physical location. Rationale: Geolocation should not be shared with websites to ensure protection of the user''s privacy regarding location. Additionally, location information could lead to clues regarding the user''s network infrastructure surrounding the device they are utilizing. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:DefaultGeolocationSetting (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.4.10 Ensure ''Default geolocation setting'' is set to ''Enabled: Don''t allow any site to track users'' physical location'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''DefaultGeolocationSetting'' -ErrorAction SilentlyContinue).''DefaultGeolocationSetting''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'DefaultGeolocationSetting' -Value 2 -PropertyType DWord -Force | Out-Null
