id: TMA-EDGE-1.58
title: Ensure 'Allow unconfigured sites to be reloaded in Internet Explorer mode' is set to 'Disabled'
description: 'This policy setting allows users to reload unconfigured sites (that are not configured in the Enterprise mode Site List) in Internet Explorer mode when browsing in Microsoft Edge for a site that requires Internet Explorer for compatibility. Rationale: Internet Explorer is officially retired and unsupported. Allowing browsers to reconfigure into Internet Explorer mode could open an organization up to a malicious site due to its lack of support for modern security features. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:InternetExplorerIntegrationReloadInIEModeAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.58 Ensure 'Allow unconfigured sites to be reloaded in Internet Explorer mode' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''InternetExplorerIntegrationReloadInIEModeAllowed'' -ErrorAction SilentlyContinue).''InternetExplorerIntegrationReloadInIEModeAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'InternetExplorerIntegrationReloadInIEModeAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
