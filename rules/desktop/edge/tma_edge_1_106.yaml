id: TMA-EDGE-1.106
title: Ensure 'Enable Process Isolation' is set to 'Enabled'
description: 'This policy setting controls if Microsoft Edge uses Process Isolation. Microsoft Edge uses Process Isolation to prevent authorized applications on the device from reading or modifying the contents of Microsoft Edge''s running processes. This also helps prevent other applications from accessing encrypted data used by Microsoft Edge. The recommended state for this setting is: Enabled. Rationale: Without Process Isolation, authorized or compromised applications on the device can inject into or read from Microsoft Edge''s running processes. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ProcessIsolationEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.106 Ensure 'Enable Process Isolation' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ProcessIsolationEnabled'' -ErrorAction SilentlyContinue).''ProcessIsolationEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ProcessIsolationEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
