id: TMA-EDGE-1.39
title: Ensure 'Allow features to download assets from the Asset Delivery Service' is set to 'Disabled'
description: 'This policy setting configures the Microsoft Edge Asset Delivery Service. The Edge Asset Delivery Service is a general pipeline used to deliver assets to Microsoft Edge Clients. These assets can be configuration files or Machine Learning models that power the features that use this service. The recommended state for this setting is: Disabled. Rationale: To reduce the attack surface of the system, downloads such as those described in this recommendation should not be allowed to automatically download without the approval of an Administrator. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:EdgeAssetDeliveryServiceEnabled (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.39 Ensure 'Allow features to download assets from the Asset Delivery Service' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''EdgeAssetDeliveryServiceEnabled'' -ErrorAction SilentlyContinue).''EdgeAssetDeliveryServiceEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EdgeAssetDeliveryServiceEnabled' -Value 0 -PropertyType DWord -Force | Out-Null
