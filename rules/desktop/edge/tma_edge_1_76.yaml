id: TMA-EDGE-1.76
title: Ensure 'Configure Online Text To Speech' is set to 'Disabled'
description: 'This policy setting determines whether Online Text to Speech voice fonts which is part of Azure Cognitive Services, are available. These voice fonts are higher quality than the pre-installed system voice fonts. The recommended state for this setting is: Disabled. Rationale: Enabling Online Text to Speech could allow data to be transmitted to a third-party, which could lead to sensitive data being exposed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ConfigureOnlineTextToSpeech (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 2
severity: medium
tags:
- edge
- browser
- cis-l2
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.76 Ensure 'Configure Online Text To Speech' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ConfigureOnlineTextToSpeech'' -ErrorAction SilentlyContinue).''ConfigureOnlineTextToSpeech''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ConfigureOnlineTextToSpeech' -Value 0 -PropertyType DWord -Force | Out-Null
