id: TMA-EDGE-1.7.1
title: Ensure 'Enable insecure download warnings' is set to 'Enabled'
description: 'This policy setting configures whether warnings are enabled when potentially dangerous content is downloaded over HTTP. The recommended state for this setting is: Enabled. Rationale: Downloading files over HTTP is not secure, and is vulnerable to interception and modification. Enabling this policy setting helps users avoid potentially harmful content by flagging executables and archives from insecure sources. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ShowDownloadsInsecureWarningsEnabled (REG_DWORD); compliant when it is 1. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: high
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.7.1 Ensure 'Enable insecure download warnings' is set to 'Enabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ShowDownloadsInsecureWarningsEnabled'' -ErrorAction SilentlyContinue).''ShowDownloadsInsecureWarningsEnabled''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ShowDownloadsInsecureWarningsEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
