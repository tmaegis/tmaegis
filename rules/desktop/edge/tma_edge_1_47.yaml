id: TMA-EDGE-1.47
title: Ensure 'Allow importing of saved passwords' is set to 'Disabled'
description: 'This policy setting controls whether users can import saved passwords from another browser into Microsoft Edge as well as whether passwords are imported on first use. The recommended state for this setting is: Disabled. Rationale: Saved passwords that are automatically imported or allowing users to import password data from another browser into Microsoft Edge allows for sensitive data to be imported into Edge. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ImportSavedPasswords (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.47 Ensure 'Allow importing of saved passwords' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ImportSavedPasswords'' -ErrorAction SilentlyContinue).''ImportSavedPasswords''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ImportSavedPasswords' -Value 0 -PropertyType DWord -Force | Out-Null
