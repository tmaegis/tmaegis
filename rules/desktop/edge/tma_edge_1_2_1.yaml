id: TMA-EDGE-1.2.1
title: Ensure 'Enable Google Cast' is set to 'Disabled'
description: 'This policy setting determines whether Google Cast is available to users. The recommended state for this setting is: Disabled. Note: When this setting is set to Disabled the Show the cast icon in the toolbar setting is ignored as the icon is removed. Rationale: The use of Google Cast could allow users to show potentially sensitive information to non-trusted devices. These devices could be in public areas. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:EnableMediaRouter (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: low
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.2.1 Ensure 'Enable Google Cast' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''EnableMediaRouter'' -ErrorAction SilentlyContinue).''EnableMediaRouter''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'EnableMediaRouter' -Value 0 -PropertyType DWord -Force | Out-Null
