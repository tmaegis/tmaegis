id: TMA-EDGE-3.1.1
title: 'Ensure ''Update policy override default'' is set to ''Enabled: Automatic silent updates only'' or Higher'
description: 'This policy settings sets the default behavior for all channels concerning the way Microsoft Edge Update handles available updates for Microsoft Edge. The recommended state for this setting is: Enabled: Always allow updates (recommended) or Enabled: Automatic silent updates only. Note: This setting can be overridden for individual channels by specifying the Update policy override policy for those specific channels. Rationale: Applying software updates as soon as they become available can ensure that systems will always have the most recent critical updates installed. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate:UpdateDefault (REG_DWORD); compliant when it is 1 or 3. Remediation writes 1 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 3.1.1 Ensure ''Update policy override default'' is set to ''Enabled: Automatic silent updates only'' or Higher'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\EdgeUpdate'' -Name ''UpdateDefault'' -ErrorAction SilentlyContinue).''UpdateDefault''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(1,3) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\EdgeUpdate'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'UpdateDefault' -Value 1 -PropertyType DWord -Force | Out-Null
