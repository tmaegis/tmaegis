id: TMA-EDGE-1.82
title: 'Ensure ''Control communication with the Experimentation and Configuration Service'' is set to ''Enabled: Disable communication with the Experimentation and Configuration Service'''
description: 'This policy setting controls whether Microsoft Edge uses the Experimentation and Configuration Service to deploy the Experimentation and Configuration payload which consists of a list of early in development features that Microsoft is enabling for testing and feedback. The recommended state for this setting is: Enabled: Disable communication with the Experimentation and Configuration Service. Rationale: This setting allows feedback (data) to be sent back to a third-party for testing of development features for Microsoft Edge, and can also deliver a payload that contains a list of actions to take on certain domains for compatibility reasons. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:ExperimentationAndConfigurationServiceControl (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through
  the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.82 Ensure ''Control communication with the Experimentation and Configuration Service'' is set to ''Enabled: Disable communication with the Experimentation and Configuration Service'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''ExperimentationAndConfigurationServiceControl'' -ErrorAction SilentlyContinue).''ExperimentationAndConfigurationServiceControl''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'ExperimentationAndConfigurationServiceControl' -Value 0 -PropertyType DWord -Force | Out-Null
