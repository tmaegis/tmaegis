id: TMA-EDGE-1.105
title: 'Ensure ''Enable network prediction'' is set to ''Enabled: Don''t predict network actions on any network connection'''
description: 'This policy setting controls the network prediction feature which controls DNS prefetching, TCP and SSL pre-connection and pre-rendering of web pages. The recommended state for this setting is: Enabled: Don''t predict network actions on any network connection. Rationale: Opening connections to resources that may not be used could increase attack surface and, in some cases, lead to opening connections to resources which the user did not intend to utilize. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:NetworkPredictionOptions (REG_DWORD); compliant when it is 2. Remediation writes 2 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: 'CIS Microsoft Edge Benchmark v5.0.0 - 1.105 Ensure ''Enable network prediction'' is set to ''Enabled: Don''t predict network actions on any network connection'''
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''NetworkPredictionOptions'' -ErrorAction SilentlyContinue).''NetworkPredictionOptions''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(2) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'NetworkPredictionOptions' -Value 2 -PropertyType DWord -Force | Out-Null
