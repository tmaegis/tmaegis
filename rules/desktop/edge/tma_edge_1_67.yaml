id: TMA-EDGE-1.67
title: Ensure 'Automatically open downloaded MHT or MHTML files from the web in Internet Explorer mode' is set to 'Disabled'
description: 'This policy setting controls whether MHT or MHTML files that are downloaded from the web are automatically opened in Internet Explorer mode. MHTML files are archives of HTML code and companion files such as images and audio. The recommended state for this setting is: Disabled. Rationale: Internet Explorer is officially retired and unsupported. Opening files in an unsupported browser that does not have modern protections in place could lead to an attack that exploits a vulnerability in the legacy software. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:InternetExplorerIntegrationZoneIdentifierMhtFileAllowed (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: medium
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.67 Ensure 'Automatically open downloaded MHT or MHTML files from the web in Internet Explorer mode' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''InternetExplorerIntegrationZoneIdentifierMhtFileAllowed'' -ErrorAction SilentlyContinue).''InternetExplorerIntegrationZoneIdentifierMhtFileAllowed''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'InternetExplorerIntegrationZoneIdentifierMhtFileAllowed' -Value 0 -PropertyType DWord -Force | Out-Null
