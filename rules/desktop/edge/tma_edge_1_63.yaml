id: TMA-EDGE-1.63
title: Ensure 'Allow Web Authentication requests on sites with broken TLS certificates' is set to 'Disabled'
description: 'This policy setting configures whether Microsoft Edge will allow web authentication requests on websites that have TLS certificates with errors (i.e. Websites considered not secure). The recommended state for this setting is: Disabled. Rationale: A "broken" TLS certificate cannot be validated by the browser or application due to it being misconfigured, expired, or invalid in some other way. This prevents a secure connection from being made. Audit reads the Group Policy registry value and prints ''compliant'', ''unset'' (policy not configured, reported as FAIL) or the non-compliant value. Registry value: HKLM\SOFTWARE\Policies\Microsoft\Edge:AllowWebAuthnWithBrokenTlsCerts (REG_DWORD); compliant when it is 0. Remediation writes 0 locally; in a domain set it through the ADMX so Group Policy does not revert it.'
target: edge
level: 1
severity: high
tags:
- edge
- browser
- cis-l1
reference: CIS Microsoft Edge Benchmark v5.0.0 - 1.63 Ensure 'Allow Web Authentication requests on sites with broken TLS certificates' is set to 'Disabled'
audit:
  type: registry
  command: '$v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'' -Name ''AllowWebAuthnWithBrokenTlsCerts'' -ErrorAction SilentlyContinue).''AllowWebAuthnWithBrokenTlsCerts''; if ($null -eq $v) { ''unset'' } elseif (($null -ne $v -and @(0) -contains [int64]$v)) { ''compliant'' } else { "non-compliant: $v" }'
  expected_output: compliant
remediation:
  type: command
  command: $p = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'; if (-not (Test-Path -Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name 'AllowWebAuthnWithBrokenTlsCerts' -Value 0 -PropertyType DWord -Force | Out-Null
