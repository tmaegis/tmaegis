id: TMA-OFFICE-2.5.11.1
title: Ensure 'Turn off Outlook Social Connector' is set to 'Enabled'
description: 'This policy setting allows the configuration of the Outlook Social Connector. The Outlook Social Connector allows users to work in Outlook while staying up to date on the status and activities of their friends and contacts, whether they''re from an organization, or from social networking sites on the Internet, like Facebook and LinkedIn. The recommended state for this setting is: Enabled. Rationale: Data may be synchronized between Outlook and the users'' social media networks, like Facebook and LinkedIn. User setting: the audit checks HKEY_USERS\<SID>\SOFTWARE\Policies\Microsoft\office\outlook\socialconnector:runosc (REG_DWORD) in every loaded user hive (S-1-5-21-*) and is compliant when each holds 0. It prints ''no-user-hive-loaded'' (FAIL) when no user profile is loaded, so scan while users are logged on.'
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 2.5.11.1 Ensure 'Turn off Outlook Social Connector' is set to 'Enabled'
audit:
  type: registry
  command: '$sids = @(Get-ChildItem -Path ''Registry::HKEY_USERS'' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $_.PSChildName }); if ($sids.Count -eq 0) { ''no-user-hive-loaded'' } else { $bad = @(); foreach ($s in $sids) { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\outlook\socialconnector'') -Name ''runosc'' -ErrorAction SilentlyContinue).''runosc''; if (-not ($null -ne $v -and @(0) -contains [int64]$v)) { $bad += $s + '':runosc='' + $v } }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') } }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    $sids = @(Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-\d+-\d+-\d+-\d+$' } | ForEach-Object { $_.PSChildName })
    if ($sids.Count -eq 0) { Write-Output 'No loaded user hive (S-1-5-21-*): nothing changed. Re-run while users are logged on.'; return }
    foreach ($s in $sids) {
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\outlook\socialconnector') 'runosc' 0 'DWord'
    }
  guidance: "Configure through Group Policy (User Configuration): User Configuration\\Administrative Templates\\Microsoft Outlook 2016\\Outlook Social Connector\\Turn off Outlook Social Connector = Enabled"
