id: TMA-OFFICE-2.3.12.1.2
title: Ensure 'Disable UI extending from documents and templates' is set to 'Enabled'
description: 'This policy setting controls whether Office applications load any custom user interface (UI) code included with a document or template. Office allows developers to extend the UI with customization code that is included in a document or template. The recommended state for this setting is: Enabled: Disallow in Word, Excel, PowerPoint, Access, Outlook, Publisher, Project, Visio, and InfoPath. Rationale: The Office release allows developers to extend the UI with customization code that is included in a document or template. If the customization code is written by an inexperienced or malicious developer, it could limit the accessibility or availability of important application commands. User setting: the audit walks every loaded user hive under HKEY_USERS (S-1-5-21-*) and requires noextensibilitycustomizationfromdocument = 1 under toolbars\<app> for access, excel, infopath, outlook, powerpoint, project, publisher, visio, word. It prints ''no-user-hive-loaded'' (FAIL) when no user
  profile is loaded, so run it while users are logged on.'
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 2.3.12.1.2 Ensure 'Disable UI extending from documents and templates' is set to 'Enabled'
audit:
  type: registry
  command: '$sids = @(Get-ChildItem -Path ''Registry::HKEY_USERS'' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $_.PSChildName }); if ($sids.Count -eq 0) { ''no-user-hive-loaded'' } else { $bad = @(); foreach ($s in $sids) { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\access'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\excel'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) {
    $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\infopath'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\outlook'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\powerpoint'') -Name ''noextensibilitycustomizationfromdocument''
    -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\project'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\publisher'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty
    -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\visio'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v }; $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\word'') -Name ''noextensibilitycustomizationfromdocument'' -ErrorAction SilentlyContinue).''noextensibilitycustomizationfromdocument''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':noextensibilitycustomizationfromdocument='' + $v } }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') } }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    $sids = @(Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-\d+-\d+-\d+-\d+$' } | ForEach-Object { $_.PSChildName })
    if ($sids.Count -eq 0) { Write-Output 'No loaded user hive (S-1-5-21-*): nothing changed. Re-run while users are logged on.'; return }
    foreach ($s in $sids) {
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\access') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\excel') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\infopath') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\outlook') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\powerpoint') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\project') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\publisher') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\visio') 'noextensibilitycustomizationfromdocument' 1 'DWord'
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\common\toolbars\word') 'noextensibilitycustomizationfromdocument' 1 'DWord'
    }
  guidance: "Configure through Group Policy (User Configuration): User Configuration\\Administrative Templates\\Microsoft Office 2016\\Global Options\\Customize\\Disable UI extending from documents and templates = Enabled: Disallow in Word, Excel, PowerPoint, Access, Outlook, Publisher, Project, Visio, InfoPath"
