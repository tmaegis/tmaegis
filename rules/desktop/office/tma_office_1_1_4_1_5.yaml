id: TMA-OFFICE-1.1.4.1.5
title: Ensure 'Information Bar' is set to 'Enabled'
description: 'This policy setting determines whether the Information Bar is displayed for Internet Explorer processes when file or code installations are restricted. By default, the Information Bar is displayed for Internet Explorer processes. Rationale: The information bar can help users to understand when potentially malicious content has been blocked. ''Enabled: check all applications'' writes one REG_DWORD 1 per Office executable under HKLM\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_SECURITYBAND; the audit requires all 14 executables the ADMX writes (groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spdesign.exe, exprwd.exe, msaccess.exe, onenote.exe, mse7.exe) to be 1 and lists any that are missing or different.'
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 1.1.4.1.5 Ensure 'Information Bar' is set to 'Enabled'
