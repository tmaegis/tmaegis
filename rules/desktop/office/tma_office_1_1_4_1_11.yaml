    if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''spdesign.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_ACTIVEXINSTALL'' -Name ''exprwd.exe'' -ErrorAction SilentlyContinue).''exprwd.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''exprwd.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_ACTIVEXINSTALL'' -Name ''msaccess.exe'' -ErrorAction SilentlyContinue).''msaccess.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''msaccess.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_ACTIVEXINSTALL'' -Name ''onenote.exe'' -ErrorAction SilentlyContinue).''onenote.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad +=
    ''onenote.exe='' + $v }; $v = (Get-ItemProperty -Path ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_RESTRICT_ACTIVEXINSTALL'' -Name ''mse7.exe'' -ErrorAction SilentlyContinue).''mse7.exe''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += ''mse7.exe='' + $v }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') }'
  expected_output: compliant
