id: TMA-OFFICE-2.2.4.7.2.9
title: Ensure 'Macro Notification Settings' is set to 'Require macros to be signed by a trusted publisher'
description: 'This policy setting controls how the specified applications warn users when Visual Basic for Applications (VBA) macros or Excel 4.0 (XLM) macros are present. Multiple Office apps support VBA macros, but XLM macros are only supported by Excel. Disable VBA macros except digitally signed macros: The application displays the Trust Bar for digitally signed macros, allowing users to enable them or leave them disabled. Rationale: When users open files in Excel that contain VBA macros, Excel opens the files with the macros disabled, and displays the Trust Bar with a warning that macros are present and have been disabled. User setting: the audit checks HKEY_USERS\<SID>\SOFTWARE\Policies\Microsoft\office\16.0\excel\security:vbadigsigtrustedpublishers (REG_DWORD) in every loaded user hive (S-1-5-21-*) and is compliant when each holds 1. It prints ''no-user-hive-loaded'' (FAIL) when no user profile is loaded, so scan while users are logged on.'
target: office
level: 1
severity: high
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 2.2.4.7.2.9 Ensure 'Macro Notification Settings' is set to 'Require macros to be signed by a trusted publisher'
audit:
  type: registry
  command: '$sids = @(Get-ChildItem -Path ''Registry::HKEY_USERS'' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $_.PSChildName }); if ($sids.Count -eq 0) { ''no-user-hive-loaded'' } else { $bad = @(); foreach ($s in $sids) { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\16.0\excel\security'') -Name ''vbadigsigtrustedpublishers'' -ErrorAction SilentlyContinue).''vbadigsigtrustedpublishers''; if (-not ($null -ne $v -and @(1) -contains [int64]$v)) { $bad += $s + '':vbadigsigtrustedpublishers='' + $v } }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') } }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    $sids = @(Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-\d+-\d+-\d+-\d+$' } | ForEach-Object { $_.PSChildName })
    if ($sids.Count -eq 0) { Write-Output 'No loaded user hive (S-1-5-21-*): nothing changed. Re-run while users are logged on.'; return }
    foreach ($s in $sids) {
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\16.0\excel\security') 'vbadigsigtrustedpublishers' 1 'DWord'
    }
  guidance: "Configure through Group Policy (User Configuration): User Configuration\\Administrative Templates\\Microsoft Excel 2016\\Excel Options\\Security\\Trust Center\\Macro Notification Settings = Require macros to be signed by a trusted publisher"
