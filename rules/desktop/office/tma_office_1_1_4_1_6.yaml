id: TMA-OFFICE-1.1.4.1.6
title: Ensure 'Local Machine Zone Lockdown Security' is set to 'Enabled'
description: 'When Internet Explorer opens a Web page, it places restrictions on what the page can do, based on the page''s Internet Explorer security zone. There are several possible security zones, each with different sets of restrictions. The security zone for a page is determined by its location. For example, pages that are located on the Internet will normally be in the more restrictive Internet security zone. Rationale: Local Machine zone security applies to all local files and content. This feature helps to mitigate attacks where the Local Machine zone is used as an attack vector to load malicious HTML code. ''Enabled: check all applications'' writes one REG_DWORD 1 per Office executable under HKLM\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_LOCALMACHINE_LOCKDOWN; the audit requires all 14 executables the ADMX writes (groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spdesign.exe, exprwd.exe, msaccess.exe,
  onenote.exe, mse7.exe) to be 1 and lists any that are missing or different.'
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 1.1.4.1.6 Ensure 'Local Machine Zone Lockdown Security' is set to 'Enabled'
