id: TMA-OFFICE-2.3.27.4
title: 'Ensure ''ActiveX Control Initialization'' is set to ''Enabled: 6'''
description: "This policy setting specifies the Microsoft ActiveX\xAE initialization security level for all Microsoft Office applications. The recommended state for this setting is: Enabled: 6 Rationale: Attackers can use ActiveX controls that include malicious code to attack a computer. In addition, malicious code can be used to compromise an ActiveX control and attack a computer. To indicate the safety of an ActiveX control, developers can denote them as Safe For Initialization (SFI). User setting: the audit checks HKEY_USERS\\<SID>\\SOFTWARE\\Policies\\Microsoft\\office\\common\\security:uficontrols (REG_DWORD) in every loaded user hive (S-1-5-21-*) and is compliant when each holds 6. It prints 'no-user-hive-loaded' (FAIL) when no user profile is loaded, so scan while users are logged on."
target: office
level: 1
severity: high
tags:
- office
- productivity
- cis-l1
reference: 'CIS Microsoft Office Enterprise Benchmark v2.0.0 - 2.3.27.4 Ensure ''ActiveX Control Initialization'' is set to ''Enabled: 6'''
audit:
  type: registry
  command: '$sids = @(Get-ChildItem -Path ''Registry::HKEY_USERS'' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match ''^S-1-5-21-\d+-\d+-\d+-\d+$'' } | ForEach-Object { $_.PSChildName }); if ($sids.Count -eq 0) { ''no-user-hive-loaded'' } else { $bad = @(); foreach ($s in $sids) { $v = (Get-ItemProperty -Path (''Registry::HKEY_USERS\'' + $s + ''\SOFTWARE\Policies\Microsoft\office\common\security'') -Name ''uficontrols'' -ErrorAction SilentlyContinue).''uficontrols''; if (-not ($null -ne $v -and @(6) -contains [int64]$v)) { $bad += $s + '':uficontrols='' + $v } }; if ($bad.Count -eq 0) { ''compliant'' } else { ''non-compliant: '' + ($bad -join '', '') } }'
  expected_output: compliant
remediation:
  type: command
  command: |
    $ErrorActionPreference = 'Stop'
    $tmaBk = Join-Path $env:ProgramData 'TMAegis\backup'
    function Backup-TmaKey([string]$p) {
      try {
        if (Test-Path -LiteralPath $p) {
          $k = $p -replace '^Registry::', ''
          New-Item -ItemType Directory -Force -Path $tmaBk | Out-Null
          $f = Join-Path $tmaBk (($k -replace '[\\/:*?"<>|]', '_') + '.reg')
          if (-not (Test-Path -LiteralPath $f)) { & reg.exe export $k $f | Out-Null }
        }
      } catch { }
    }
    function Set-TmaReg([string]$p, [string]$n, $v, [string]$t) {
      Backup-TmaKey $p
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      New-ItemProperty -LiteralPath $p -Name $n -Value $v -PropertyType $t -Force | Out-Null
    }
    function Remove-TmaValue([string]$p, [string]$n) {
      if ((Test-Path -LiteralPath $p) -and ($null -ne (Get-ItemProperty -LiteralPath $p -Name $n -ErrorAction SilentlyContinue))) {
        Backup-TmaKey $p
        Remove-ItemProperty -LiteralPath $p -Name $n -Force
      }
    }
    function Remove-TmaKey([string]$p) {
      if (Test-Path -LiteralPath $p) { Backup-TmaKey $p; Remove-Item -LiteralPath $p -Recurse -Force }
    }
    function Set-TmaList([string]$p, [string[]]$items, [bool]$replace) {
      Backup-TmaKey $p
      if ($replace) { Remove-TmaKey $p }
      if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force | Out-Null }
      $have = @((Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Value)" })
      $n = [int](@((Get-Item -LiteralPath $p).GetValueNames()) | ForEach-Object { $x = 0; if ([int]::TryParse($_, [ref]$x)) { $x } else { 0 } } | Measure-Object -Maximum).Maximum
      foreach ($i in $items) {
        if ($have -notcontains $i) { $n++; New-ItemProperty -LiteralPath $p -Name "$n" -Value $i -PropertyType String -Force | Out-Null }
      }
    }
    $sids = @(Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-\d+-\d+-\d+-\d+$' } | ForEach-Object { $_.PSChildName })
    if ($sids.Count -eq 0) { Write-Output 'No loaded user hive (S-1-5-21-*): nothing changed. Re-run while users are logged on.'; return }
    foreach ($s in $sids) {
      Set-TmaReg ('Registry::HKEY_USERS\' + $s + '\SOFTWARE\Policies\Microsoft\office\common\security') 'uficontrols' 6 'DWord'
    }
  guidance: "Configure through Group Policy (User Configuration): User Configuration\\Administrative Templates\\Microsoft Office 2016\\Security Settings\\ActiveX Control Initialization = Enabled: 6"
