id: TMA-OFFICE-1.1.4.1.1
title: Ensure 'Add-on Management' is set to 'Enabled'
description: "This policy setting manages Internet Explorer add-ons \u2014 which add-ins are always enabled, always disabled (blocked), or configurable by the user. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe). Rationale: Internet Explorer add-ons are pieces of code that run in Internet Explorer to provide additional functionality. Rogue add-ons may contain viruses or other malicious code. Disabling or not configuring this setting could allow malicious code or users to become active on user computers or the network. 'Enabled: check all applications' writes one REG_DWORD 1 per Office executable under HKLM\\SOFTWARE\\Microsoft\\Internet Explorer\\Main\\FeatureControl\\FEATURE_ADDON_MANAGEMENT; the audit requires all 14 executables the ADMX writes (groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe,\
  \ visio.exe, winproj.exe, winword.exe, outlook.exe, spdesign.exe, exprwd.exe, msaccess.exe, onenote.exe, mse7.exe) to be 1 and lists any that are missing or different."
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 1.1.4.1.1 Ensure 'Add-on Management' is set to 'Enabled'
