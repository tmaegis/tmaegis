id: TMA-OFFICE-1.1.4.1.7
title: Ensure 'Mime Sniffing Safety Feature' is set to 'Enabled'
description: 'This policy setting determines whether Internet Explorer MIME sniffing prevents promotion of a file of one type to a more dangerous file type. For example, it does not allow scripts to run from a file marked as text. For Office, this setting affects any web-based content that is accessed within Office. Rationale: MIME file-type spoofing is a potential threat to your organization. It is recommended that you ensure these files are consistently handled to help prevent malicious file downloads that may infect your network. ''Enabled: check all applications'' writes one REG_DWORD 1 per Office executable under HKLM\SOFTWARE\Microsoft\Internet Explorer\Main\FeatureControl\FEATURE_MIME_SNIFFING; the audit requires all 14 executables the ADMX writes (groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spdesign.exe, exprwd.exe, msaccess.exe, onenote.exe, mse7.exe) to be 1 and lists any that are missing or different.'
target: office
level: 1
severity: medium
tags:
- office
- productivity
- cis-l1
reference: CIS Microsoft Office Enterprise Benchmark v2.0.0 - 1.1.4.1.7 Ensure 'Mime Sniffing Safety Feature' is set to 'Enabled'
