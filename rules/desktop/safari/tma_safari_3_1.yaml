id: TMA-SAFARI-3.1
title: 'Ensure ''AutoFill web forms: User names and passwords'' is ''Disabled'''
description: 'Safari can utilize a user-level keychain for credential storage, and then access that information when revisiting websites on the same domain. By disabling this feature the user will be prompted to manually enter their credentials when they visit a website. Rationale: If this setting is enabled, users can have Safari store and retrieve passwords through a user-level keychain and provide them automatically the next time they visit a site. An intruder who has unrestricted access to your computer can gain access to secure site areas. Audit reads AutoFillPasswords from the com.apple.Safari preference domain of the account running the scan (the PDF checks the same token in com.apple.Safari.plist; manual check: Follow the below steps and verify that AutoFill web forms: User names and passwords is Disabled: 1. Click Safari. 2. Click Preferences. 3. Click AutoFill. 4. Verify AutoFill web forms: User names and ). Safari is sandboxed, so the reading process needs Full Disk Access on
  macOS 10.14+. A missing key exits non-zero and is reported as FAIL even where the built-in default is compliant. Values forced by a configuration profile live in /Library/Managed Preferences and are not read here.'
target: safari
level: 2
severity: medium
tags:
- safari
- browser
- cis-l2
reference: 'CIS macOS Safari Benchmark v2.0.0 - 3.1 Ensure ''AutoFill web forms: User names and passwords'' is ''Disabled'''
audit:
  type: command
  command: out=$(defaults read com.apple.Safari AutoFillPasswords 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    # Same account that runs the audit (it reads the scanning user's own preference domain).
    defaults write com.apple.Safari AutoFillPasswords -bool false
    killall cfprefsd 2>/dev/null || true
    [ "$(defaults read com.apple.Safari AutoFillPasswords 2>/dev/null)" = 0 ] || { echo "Safari AutoFillPasswords not 0" >&2; exit 1; }
  guidance: "Follow the below steps to set AutoFill web forms: User names and passwords to Disabled: 1. Click Safari. 2. Click Preferences. 3. Click AutoFill. 4. Uncheck AutoFill web forms: User names and passwords. Or deploy a configuration profile for com.apple.Safari setting AutoFillPasswords = false, or as the logged-in user run: defaults write com.apple.Safari AutoFillPasswords -bool false and restart Safari."
