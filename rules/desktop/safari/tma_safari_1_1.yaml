id: TMA-SAFARI-1.1
title: Ensure 'Open "safe" files after downloading' is 'Disabled'
description: 'The Safari browser contains a feature which causes all files considered "safe" to be automatically opened once they have finished downloading. Rationale: This feature is meant to be a benefit but having the browser automatically open files that could be malicious and downloaded by mistake is a security risk. Audit reads AutoOpenSafeDownloads from the com.apple.Safari preference domain of the account running the scan (the PDF checks the same token in com.apple.Safari.plist; manual check: Follow the below steps and verify that Open "safe" files after downloading is Disabled: 1. Click Safari. 2. Click Preferences. 3. Click General. 4. Verify Open "safe" files after downloading is unchec). Safari is sandboxed, so the reading process needs Full Disk Access on macOS 10.14+. A missing key exits non-zero and is reported as FAIL even where the built-in default is compliant. Values forced by a configuration profile live in /Library/Managed Preferences and are not read here.'
target: safari
level: 1
severity: medium
tags:
- safari
- browser
- cis-l1
reference: CIS macOS Safari Benchmark v2.0.0 - 1.1 Ensure 'Open "safe" files after downloading' is 'Disabled'
audit:
  type: command
  command: out=$(defaults read com.apple.Safari AutoOpenSafeDownloads 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    # Same account that runs the audit (it reads the scanning user's own preference domain).
    defaults write com.apple.Safari AutoOpenSafeDownloads -bool false
    killall cfprefsd 2>/dev/null || true
    [ "$(defaults read com.apple.Safari AutoOpenSafeDownloads 2>/dev/null)" = 0 ] || { echo "Safari AutoOpenSafeDownloads not 0" >&2; exit 1; }
  guidance: "Follow the below steps to set Open \"safe\" files after downloading to Disabled: 1. Click Safari. 2. Click Preferences. 3. Click General. 4. Uncheck the Open \"safe\" files after downloading checkbox. Or deploy a configuration profile for com.apple.Safari setting AutoOpenSafeDownloads = false, or as the logged-in user run: defaults write com.apple.Safari AutoOpenSafeDownloads -bool false and restart Safari."
