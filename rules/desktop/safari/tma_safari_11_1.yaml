id: TMA-SAFARI-11.1
title: Ensure 'Show Status Bar' is not 'Hidden'
description: 'This setting controls whether mousing over a link displays the full URL that the link will follow. Rationale: Showing the full URL allows users to validate that a link is performing the action it claims, and may prevent users from following malicious links. Audit reads ShowOverlayStatusBar from the com.apple.Safari preference domain of the account running the scan (the PDF checks the same token in com.apple.Safari.plist; manual check: Follow the below steps and verify that Show Status Bar is not ''Hidden`: 1. Click View. 2. Verify Hide Status bar is displayed.). Safari is sandboxed, so the reading process needs Full Disk Access on macOS 10.14+. A missing key exits non-zero and is reported as FAIL even where the built-in default is compliant. Values forced by a configuration profile live in /Library/Managed Preferences and are not read here.'
target: safari
level: 1
severity: high
tags:
- safari
- browser
- cis-l1
reference: CIS macOS Safari Benchmark v2.0.0 - 11.1 Ensure 'Show Status Bar' is not 'Hidden'
audit:
  type: command
  command: out=$(defaults read com.apple.Safari ShowOverlayStatusBar 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: '1'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    # Same account that runs the audit (it reads the scanning user's own preference domain).
    defaults write com.apple.Safari ShowOverlayStatusBar -bool true
    killall cfprefsd 2>/dev/null || true
    [ "$(defaults read com.apple.Safari ShowOverlayStatusBar 2>/dev/null)" = 1 ] || { echo "Safari ShowOverlayStatusBar not 1" >&2; exit 1; }
  guidance: "Follow the below steps to set Show Status Bar: 1. Click View. 2. Click Show Status Bar. Or deploy a configuration profile for com.apple.Safari setting ShowOverlayStatusBar = true, or as the logged-in user run: defaults write com.apple.Safari ShowOverlayStatusBar -bool true and restart Safari."
