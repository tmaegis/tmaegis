id: TMA-SAFARI-6.3
title: Ensure 'Block pop-up windows' is 'Enabled'
description: 'The Block pop-up windows feature is used to block pop-up windows which a website might open with or without any user interaction. Pop-ups can be used to open un-trusted malicious content. It is recommended that the Popup Blocker be enabled. Rationale: By enabling Block pop-up windows, pop-ups will be blocked which will reduce the likelihood of being redirected to a malicious site. Audit reads WebKitJavaScriptCanOpenWindowsAutomatically from the com.apple.Safari preference domain of the account running the scan (the PDF checks the same token in com.apple.Safari.plist; manual check: Follow the below steps and verify that Block pop-up windows is Enabled: 1. Click Safari. 2. Click Preferences. 3. Click Security. 4. Verify Block pop-up windows is checked). Safari is sandboxed, so the reading process needs Full Disk Access on macOS 10.14+. A missing key exits non-zero and is reported as FAIL even where the built-in default is compliant. Values forced by a configuration profile live
  in /Library/Managed Preferences and are not read here.'
target: safari
level: 2
severity: medium
tags:
- safari
- browser
- cis-l2
reference: CIS macOS Safari Benchmark v2.0.0 - 6.3 Ensure 'Block pop-up windows' is 'Enabled'
audit:
  type: command
  command: out=$(defaults read com.apple.Safari WebKitJavaScriptCanOpenWindowsAutomatically 2>/dev/null) || exit 1; printf '%s\n' "$out"
  expected_output: '0'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    # Same account that runs the audit (it reads the scanning user's own preference domain).
    defaults write com.apple.Safari WebKitJavaScriptCanOpenWindowsAutomatically -bool false
    killall cfprefsd 2>/dev/null || true
    [ "$(defaults read com.apple.Safari WebKitJavaScriptCanOpenWindowsAutomatically 2>/dev/null)" = 0 ] || { echo "Safari WebKitJavaScriptCanOpenWindowsAutomatically not 0" >&2; exit 1; }
  guidance: "Follow the below steps to set Block pop-up windows to Enabled: 1. Click Safari. 2. Click Preferences. 3. Click Security. 4. Check the Block pop-up windows checkbox Or deploy a configuration profile for com.apple.Safari setting WebKitJavaScriptCanOpenWindowsAutomatically = false, or as the logged-in user run: defaults write com.apple.Safari WebKitJavaScriptCanOpenWindowsAutomatically -bool false and restart Safari."
