id: TMA-MCP-4.3.2
title: Ensure MCP Apps permission requests default-deny, all app-to-host messages are logged, and high-risk channels are consented
description: Where the MCP Apps extension (io.modelcontextprotocol/ui) is in use, the host treats an app's requested capabilities as default-deny, logs every message the app sends to the host, and requires explicit user consent for the high-risk channels. The extension lets a UI resource request the camera, microphone, geolocation, and clipboardWrite permissions and tells apps not to assume any are granted. The host does not honor a requested permission automatically. It grants one only on a recorded per-permission user decision and denies the rest by default. All View-to-host JSON- RPC is auditable, so the host logs every app-to-host message, including ui/message, ui/update-model-context, ui/open-link, tools/call, and resources/read, with the requesting server identity. The extension leaves per- message consent to the host, so as a requirement beyond the extension, the host additionally gates the...
target: mcp-server
level: 1
severity: high
tags:
- access-control
