id: TMA-ROCKY8-7.1.4
title: Ensure access to /etc/group- is configured
description: The /etc/group- file contains a backup list of all the valid groups defined in the system.
target: linux
os_family:
- rocky-8
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Rocky Linux 8 Benchmark v3.0.0 - 7.1.4
audit:
  type: command
  shell: bash
  command: 'alt0() { s=$(stat -Lc ''%a %u %g'' /etc/group- 2>&1) || { echo "step1: $s"; return 1; }; set -- $s; m=$((8#$1)); [ $((m & ~0644)) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ] || { echo "step1: /etc/group- is mode $1 uid $2 gid $3, want 644 or stricter, uid 0, gid 0"; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/group-
    [ -e "$p" ] || exit 0
    chown root:root "$p" 2>/dev/null || chown root "$p"
    chmod 644 "$p"
  guidance: "Run the following commands to remove excess permissions, set owner, and set group on /etc/group-: # chmod u-x,go-wx /etc/group- # chown root:root /etc/group-"
