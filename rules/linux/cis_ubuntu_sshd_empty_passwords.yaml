id: CIS-UBUNTU-5.2.10
title: Ensure SSH PermitEmptyPasswords is disabled
description: The PermitEmptyPasswords parameter specifies if the SSH server allows login to accounts with empty password strings.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: high
tags:
- ssh
- server
reference: "CIS Ubuntu Linux / Rocky Linux Benchmarks - Ensure sshd PermitEmptyPasswords is disabled (verify section number for your release)"
audit:
  type: command
  command: sshd -T 2>/dev/null | grep -i '^permitemptypasswords'
  expected_output: permitemptypasswords no
remediation:
  type: file_line
  file_path: /etc/ssh/sshd_config
  match_regex: (?m)^\s*#?\s*PermitEmptyPasswords\b.*$
  replace_line: PermitEmptyPasswords no
  verify_cmd: sshd -t -f {file}
  backup_files:
  - /etc/ssh/sshd_config
  insert_at: top
