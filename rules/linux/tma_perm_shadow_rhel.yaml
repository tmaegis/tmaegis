id: TMA-LNX-PERM-SHADOW-RHEL
title: Ensure permissions on /etc/shadow are configured
description: /etc/shadow must be 0 root:root.
target: linux
os_family:
- rocky-9
level: 1
severity: high
tags:
- permissions
- files
reference: CIS Linux Benchmark - System File Permissions (verify section number for your distro release)
audit:
  type: command
  command: stat -Lc '%a %U %G' /etc/shadow
  expected_output: 0 root root
remediation:
  type: command
  command: chown root:root /etc/shadow && chmod 0 /etc/shadow
  backup_files: []
