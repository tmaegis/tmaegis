id: TMA-AZL3-7.2.9
title: Ensure local interactive user dot files access is configured
description: While the system administrator can establish secure permissions for users' "dot" files, the users can easily override these. • .forward file specifies an email address to forward the user's mail to. • .rhost file provides the "remote authentication" database for the rcp, rlogin, and rsh commands and the rcmd() function. These files bypass the standard password-based user authentication mechanism. They specify remote hosts and users that are considered trusted (i.e. are allowed to access the local system without supplying a password) • .netrc file contains data for logging into a remote host or
target: linux
os_family:
- azurelinux-3
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS AKS Optimized Azure Linux 3 Benchmark v1.0.0 - 7.2.9
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output2=(); a_output3=()\n   l_maxsize=\"1000\" # Maximum number of local interactive users before warning (Default 1,000)\n   l_valid_shells=\"^($( awk -F\\/ '\"'\"'$NF != \"nologin\" {print}'\"'\"' /etc/shells | sed -rn '\"'\"'/^\\//{s,/,\\\\\\\\/,g;p}'\"'\"' | paste -s -d '\"'\"'|'\"'\"' - ))$\"\n   a_user_and_home=() # Create array with local users and their home directories\n   while read -r l_local_user l_local_user_home; do # Populate array with users and user home location\n      [[ -n \"$l_local_user\" && -n \"$l_local_user_home\" ]] && a_user_and_home+=(\"$l_local_user:$l_local_user_home\")\n   done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '\"'\"'$(NF) ~ pat { print $1 \" \" $(NF-1) }'\"'\"' /etc/passwd)\"\n   l_asize=\"${#a_user_and_home[@]}\" # Here if we want to look at number of users before proceeding\n   [ \"${#a_user_and_home[@]}\" -gt \"$l_maxsize\" ] && printf '\"'\"'%s\\n'\"'\"' \"\" \"  ** INFO **\" \\\
    \n   \"  - \\\"$l_asize\\\" Local interactive users found on the system\" \\\n   \"  - This may be a long running check\" \"\"\n   file_access_chk()\n   {\n      a_access_out=()\n      l_max=\"$( printf '\"'\"'%o'\"'\"' $(( 0777 & ~$l_mask)) )\"\n      if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n         a_access_out+=(\"  - File: \\\"$l_hdfile\\\" is mode: \\\"$l_mode\\\" and should be mode: \\\"$l_max\\\" or more restrictive\")\n      fi\n      if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\n         a_access_out+=(\"  - File: \\\"$l_hdfile\\\" owned by: \\\"$l_owner\\\" and should be owned by \\\"${l_user//|/ or }\\\"\")\n      fi\n      if [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\n         a_access_out+=(\"  - File: \\\"$l_hdfile\\\" group owned by: \\\"$l_gowner\\\" and should be group owned by \\\"${l_group//|/ or }\\\"\")\n      fi\n   }\n   while IFS=: read -r l_user l_home; do\n      a_dot_file=(); a_netrc=(); a_netrc_warn=(); a_bhout=(); a_hdirout=()\n      if [ -d \"$l_home\"\
    \ ]; then\n         l_group=\"$(id -gn \"$l_user\" | xargs)\";l_group=\"${l_group// /|}\"\n         while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_hdfile; do\n            while read -r l_mode l_owner l_gowner; do\n               case \"$(basename \"$l_hdfile\")\" in\n                  .forward | .rhost )\n                     a_dot_file+=(\"  - File: \\\"$l_hdfile\\\" exists\") ;;\n                  .netrc )\n                     l_mask='\"'\"'0177'\"'\"'; file_access_chk\n                     if [ \"${#a_access_out[@]}\" -gt 0 ]; then\n                        a_netrc+=(\"${a_access_out[@]}\")\n                     else\n                        a_netrc_warn+=(\"   - File: \\\"$l_hdfile\\\" exists\")\n                     fi ;;\n                  .bash_history )\n                     l_mask='\"'\"'0177'\"'\"'; file_access_chk\n                     [ \"${#a_access_out[@]}\" -gt 0 ] && a_bhout+=(\"${a_access_out[@]}\") ;;\n                  * )\n                     l_mask='\"'\"'0133'\"'\"\
    '; file_access_chk\n                     [ \"${#a_access_out[@]}\" -gt 0 ] && a_hdirout+=(\"${a_access_out[@]}\") ;;\n               esac\n            done < <(stat -Lc '\"'\"'%#a %U %G'\"'\"' \"$l_hdfile\")\n         done < <(find \"$l_home\" -xdev -type f -name '\"'\"'.*'\"'\"' -print0)\n      fi\n      if [[ \"${#a_dot_file[@]}\" -gt 0 || \"${#a_netrc[@]}\" -gt 0 || \"${#a_bhout[@]}\" -gt 0 || \"${#a_hdirout[@]}\" -gt 0 ]]; then\n         a_output2+=(\" - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\"\" \"${a_dot_file[@]}\" \"${a_netrc[@]}\" \"${a_bhout[@]}\" \"${a_hdirout[@]}\")\n      fi\n      [ \"${#a_netrc_warn[@]}\" -gt 0 ] && a_output3+=(\" - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\"\" \"${a_netrc_warn[@]}\")\n   done <<< \"$(printf '\"'\"'%s\\n'\"'\"' \"${a_user_and_home[@]}\")\"\n   if [ \"${#a_output2[@]}\" -le 0 ]; then # If l_output2 is empty, we pass\n      [ \"${#a_output3[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"  ** WARNING **\" \"${a_output3[@]}\"\
    \n      printf '\"'\"'%s\\n'\"'\"' \"- Audit Result:\" \"  ** PASS **\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"- Audit Result:\" \"  ** FAIL **\" \" - * Reasons for audit failure * :\" \"${a_output2[@]}\" \"\"\n      [ \"${#a_output3[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"  ** WARNING **\" \"${a_output3[@]}\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    # "user home" for interactive users whose home is a plain user directory
    tma_homes() { while IFS=: read -r u p uid gid c h sh; do
      case "$u" in +*|-*) continue;; esac
      printf '%s\n' "$vs" | grep -qxF -- "$sh" || continue
      case "$h" in /|""|/bin*|/sbin*|/usr*|/etc*|/proc*|/sys*|/dev*|/boot*|/run*|/var/run*) continue;; esac
      echo "$u $h"; done < /etc/passwd; }
    tma_homes | while read -r u h; do
      [ -d "$h" ] || continue
      g=$(id -gn "$u")
      find "$h" -xdev -type f -name '.*' 2>/dev/null | while read -r f; do
        case "$(basename "$f")" in
          .forward|.rhost) mv "$f" "$f.tmaegis-disabled"; f="$f.tmaegis-disabled"; mask=8#0133;;
          .netrc|.bash_history) mask=8#0177;;
          *) mask=8#0133;;
        esac
        [ "$(stat -Lc %U "$f")" = "$u" ] || chown "$u" "$f"
        [ "$(stat -Lc %G "$f")" = "$g" ] || chgrp "$g" "$f"
        mo=$(stat -Lc %a "$f"); chmod "$(printf '%o' $((8#$mo & ~$mask & 8#7777)))" "$f"
      done
    done
    true
  guidance: "Making global modifications to users' files without alerting the user community can result in unexpected outages and unhappy users. Therefore, it is recommended that a monitoring policy be established to report user dot file permissions and determine the action to be taken in accordance with site policy. The following script will: • remove excessive permissions on dot files within interactive users' home directories • change ownership of dot files within interactive users' home directories to the user • change group ownership of dot files within interactive users' home directories to the user's primary group • list .forward and .rhost files to be investigated and manually deleted #!/usr/bin/…"
