id: TMA-AZL3-6.1.1.1.3
title: Ensure journald ForwardToSyslog is configured
description: Data from journald should be kept in the confines of the service and not forwarded to other services.
target: linux
os_family:
- azurelinux-3
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS AKS Optimized Azure Linux 3 Benchmark v1.0.0 - 6.1.1.1.3
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   if systemctl is-active rsyslog.service | grep -Psq -- '\"'\"'^active'\"'\"'; then\n      l_setting=\"yes\"\n   else\n      l_setting=\"no\"\n   fi\n   l_parameters=\"systemd/journald.conf:Journal:ForwardToSyslog:$l_setting\"\n   l_analyze_cmd=\"$(readlink -e /bin/systemd-analyze || readlink -e /usr/bin/systemd-analyze)\"\n   a_output=() a_output2=() a_output3=() l_out=\"\" l_out2=\"\" l_opt=\"\"\n\n   f_pass_output()\n   {\n      if [ \"${#a_output[@]}\" -gt 0 ] || [ \"${#a_output2[@]}\" -gt 0 ]; then\n         a_output3+=(\"  - $l_option is correctly set to $l_option_value\" \" in $l_file\" \\\n         \"    but this setting will be ignored do to load preference\")\n      else\n         if [ -n \"$l_out2\" ]; then\n            a_output+=(\"$l_out2\" \"  - Default for $l_option is correctly set to $l_option_value\" \"$l_out\")\n         else\n            a_output+=(\"  - $l_option is correctly set to $l_option_value\" \" in\
    \ $l_file\" \"$l_out\")\n         fi\n      fi\n   }\n\n   f_fail_output()\n   {\n      if [ \"${#a_output[@]}\" -gt 0 ] || [ \"${#a_output2[@]}\" -gt 0 ]; then\n         a_output3+=(\"  - $l_option is incorrectly set to $l_option_value\" \" in $l_file\" \\\n         \"    but this setting will be ignored do to load preference\")\n      else\n         if [ -n \"$l_out2\" ]; then\n            a_output2+=(\"$l_out2\" \"  - Default for $l_option is incorrectly set to $l_option_value\" \"$l_out\")\n         else\n            a_output2+=(\"  - $l_option is incorrectly set to $l_option_value\" \"    in $l_file\" \"$l_out\")\n         fi\n      fi\n   }\n\n   f_option_chk()\n   {\n\n            if [ \"$l_option_value\" = \"$l_value\" ]; then\n               f_pass_output\n            else\n               f_fail_output\n            fi\n   }\n\n   while IFS=: read -r l_conf_file l_block l_option l_value; do\n      l_out=\"    and should be equal to $l_value\"\n      while IFS= read -r l_file;\
    \ do\n         l_file=\"${l_file//# /}\"\n         l_opt=\"$(awk '\"'\"'/\\['\"'\"'\"$l_block\"'\"'\"'\\]/{a=1;next}/\\[/{a=0}a'\"'\"' \"$l_file\" 2>/dev/null | grep -Poi '\"'\"'^\\h*'\"'\"'\"$l_option\"'\"'\"'\\h*=\\h*\\H+\\b'\"'\"' | tail -n 1)\"\n         if [ -n \"$l_opt\" ]; then\n            l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\n            f_option_chk\n         fi\n      done < <(\"$l_analyze_cmd\" cat-config \"$l_conf_file\" | tac | grep -Pio '\"'\"'^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b'\"'\"')\n      # If nothing is explicitly set, check default\n      if [ \"${#a_output[@]}\" -le 0 ] && [ \"${#a_output2[@]}\" -le 0 ]; then\n         l_file=\"/etc/$l_conf_file\"\n         l_opt=\"$(awk '\"'\"'/\\['\"'\"'\"$l_block\"'\"'\"'\\]/{a=1;next}/\\[/{a=0}a'\"'\"' \"$l_file\" 2>/dev/null | grep -Poim 1 '\"'\"'^(\\h*#)?\\h*'\"'\"'\"$l_option\"'\"'\"'\\h*=\\h*\\H+\\b'\"'\"')\"\n         if [ -n \"$l_opt\" ]; then\n            l_option_value=\"$(cut -d= -f2 <<< \"${l_opt//#\
    \ /}\" | xargs)\"\n            l_out2=\" - Note: default value \\\"${l_opt//#/}\\\" is being used in the configuration\"\n            f_option_chk\n         fi\n      fi\n   done <<< \"$l_parameters\"\n\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\" \"\"\n      [ \"${#a_output3[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"  ** Note: **\" \"${a_output3[@]}\" \"\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** FAIL **\" \" - Reason(s) for audit failure:\" \"${a_output2[@]}\"\n      [ \"${#a_output[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"\" \"- Correctly set:\" \"${a_output[@]}\" \"\"\n      [ \"${#a_output3[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"  ** Note: **\" \"${a_output3[@]}\" \"\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_AUDITD_CONF=/etc/audit/auditd.conf
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; }
    tma_audit_pkg() {
      command -v auditctl >/dev/null 2>&1 && [ -f /etc/audit/auditd.conf ] && return 0
      if command -v apt-get >/dev/null 2>&1; then tma_pkg_install auditd; else tma_pkg_install audit; fi; }
    tma_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo >> "$1"; return 0; }
    tma_kv() { # file key value : 'key = value' style (auditd.conf); replaces every uncommented line
      f=$1; k=$2; v=$3
      [ -f "$f" ] || return 0
      tma_bak "$f"
      if grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$f"; then
        sed -i -E "s|^[[:space:]]*$k[[:space:]]*=.*|$k = $v|" "$f"
      else tma_nl "$f"; printf '%s = %s\n' "$k" "$v" >> "$f"; fi; }
    tma_ini_set() { # file section key value : systemd ini 'Key=value'
      f=$1; s=$2; k=$3; v=$4
      mkdir -p "$(dirname "$f")"; [ -f "$f" ] || : > "$f"; tma_nl "$f"
      sed -i -E "/^[[:space:]]*$k[[:space:]]*=/d" "$f"
      if grep -q "^\[$s\]" "$f"; then sed -i "/^\[$s\]/a $k=$v" "$f"; else printf '[%s]\n%s=%s\n' "$s" "$k" "$v" >> "$f"; fi; }
    tma_clear() { # path octal-mask : remove the mask bits from the file mode
      [ -e "$1" ] || return 0
      m=$(stat -Lc %a "$1")
      [ $((8#$m & 8#$2)) -eq 0 ] || chmod "$(printf '%o' $((8#$m & ~8#$2 & 8#7777)))" "$1"; }
    tma_rule() { # rules.d-filename audit-rule-line : append when missing (whitespace-normalised)
      f=/etc/audit/rules.d/$1; shift; l=$*
      mkdir -p /etc/audit/rules.d; [ -f "$f" ] || : > "$f"
      if ! tr -s ' \t' '  ' < "$f" | sed 's/^ //;s/ $//' | grep -Fxq -- "$l"; then tma_nl "$f"; printf '%s\n' "$l" >> "$f"; fi
      chown root:root "$f"; chmod 640 "$f"; }
    tma_rules_load() { command -v augenrules >/dev/null 2>&1 && augenrules --load >/dev/null 2>&1; true; }
    tma_audit_logdir() {
      d=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs 2>/dev/null)
      [ -n "$d" ] && dirname "$d" || echo /var/log/audit; }
    tma_grub_arg() { # key=value : add/replace in GRUB_CMDLINE_LINUX and regenerate grub.cfg
      a=$1; k=${a%%=*}; g=/etc/default/grub
      [ -f "$g" ] || { echo "no $g: bootloader not managed by grub defaults" >&2; return 0; }
      tma_bak "$g"
      if ! grep -q '^GRUB_CMDLINE_LINUX=' "$g"; then tma_nl "$g"; printf 'GRUB_CMDLINE_LINUX="%s"\n' "$a" >> "$g"
      elif grep -E '^GRUB_CMDLINE_LINUX=' "$g" | grep -Eq "[\"' ]$k(=|[\"' ])"; then
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"' ])$k(=[^\"' ]*)?([\"' ])#\1$a\3#" "$g"
      else
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"'])\$#  $a\1#; /^GRUB_CMDLINE_LINUX=/ s#=([\"'])  #=\1#; /^GRUB_CMDLINE_LINUX=/ s#   *# #g" "$g"
      fi
      if command -v update-grub >/dev/null 2>&1; then update-grub >/dev/null 2>&1
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        for c in /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c" >/dev/null 2>&1; done
      elif command -v grub-mkconfig >/dev/null 2>&1; then grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1; fi
      true; }
    k=ForwardToSyslog; v=$(systemctl is-active rsyslog.service >/dev/null 2>&1 && echo yes || echo no)
    D=/etc/systemd/journald.conf.d/60-tmaegis.conf
    tma_bak /etc/systemd/journald.conf
    tma_ini_set /etc/systemd/journald.conf Journal $k $v
    for c in /etc/systemd/journald.conf.d/*.conf; do
      [ -f "$c" ] && [ "$c" != "$D" ] && grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$c" && { tma_bak "$c"; sed -i -E "s/^([[:space:]]*$k[[:space:]]*=)/#\1/" "$c"; }
    done
    tma_ini_set "$D" Journal $k $v

    systemctl restart systemd-journald.service 2>/dev/null
    true
  guidance: "- IF - journald is the preferred method for capturing logs: Set the following parameter in the [Journal] section in /etc/systemd/journald.conf or a file in /etc/systemd/journald.conf.d/ ending in .conf: ForwardToSyslog=no Example: #!/usr/bin/env bash { [ ! -d /etc/systemd/journald.conf.d/ ] && mkdir /etc/systemd/journald.conf.d/ if grep -Psq -- '^\\h*\\[Journal\\] /etc/systemd/journald.conf.d/60- journald.conf; then printf '%s\\n' \"ForwardToSyslog=no\" >> /etc/systemd/journald.conf.d/60- journald.conf else printf '%s\\n' \"[Journal]\" \"ForwardToSyslog=no\" >> /etc/systemd/journald.conf.d/60-journald.conf fi } - ELSEIF - rsyslog is the preferred method for capturing logs: Set the following parameter i…"
