id: TMA-UBUNTU2404-2.1.6
title: Ensure web server services are not in use
description: Web servers provide the ability to host web site content.
target: linux
os_family:
- ubuntu-24.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0 - 2.1.6
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v dpkg-query >/dev/null 2>&1 || { echo "step1: dpkg-query not installed"; return 1; }; o=$(bash -c ''dpkg-query -s apache2 &>/dev/null && echo "apache2 is installed"'' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; command -v dpkg-query >/dev/null 2>&1 || { echo "step2: dpkg-query not installed"; return 1; }; o=$(bash -c ''dpkg-query -s nginx &>/dev/null && echo "nginx is installed"'' 2>/dev/null); [ -z "$o" ] || { echo "step2: $o" | head -c 300; return 1; }; }; alt1() { o=$(bash -c ''systemctl show apache2.socket apache2.service -p UnitFileState,ActiveState | grep -Pi ''"''"''=(enabled|active)''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0 || alt1; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_svc_off httpd.socket httpd.service nginx.service apache2.service
  guidance: "Run the following commands to stop apache2.socket, apache2.service and remove the apache2 package: # systemctl stop apache2.socket apache2.service # apt purge apache2 Run the following commands to stop nginx.service and remove the nginx package: # systemctl stop nginx.service # apt purge nginx - OR - - IF - a package is installed and is required for dependencies: - IF - the apache2 package is required for dependencies: Run the following commands to stop and mask apache2.socket and apache2.service: # systemctl stop apache2.socket apache2.service # systemctl mask apache2.socket apache2.service - IF - the nginx package is required for dependencies: Run the following commands to stop and mask ng…"
