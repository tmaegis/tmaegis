id: TMA-LNX-PERM-PASSWD
title: Ensure permissions on /etc/passwd are configured
description: /etc/passwd must be 644 root:root.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: high
tags:
- permissions
- files
reference: CIS Linux Benchmark - System File Permissions (verify section number for your distro release)
audit:
  type: command
  command: stat -Lc '%a %U %G' /etc/passwd
  expected_output: 644 root root
remediation:
  type: command
  command: chown root:root /etc/passwd && chmod 644 /etc/passwd
  backup_files: []
