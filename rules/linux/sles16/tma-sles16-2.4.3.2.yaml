id: TMA-SLES16-2.4.3.2
title: Ensure access to systemd service unit files is configured
description: systemd service unit files contain information about the service and the process it supervises defines how and when the service is started, stopped, and managed by systemd, which is the init system and service manager.
target: linux
os_family:
- sles-16
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 16 Benchmark v1.0.0 - 2.4.3.2
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n    dirs=()\n    for d in /run/systemd/system /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system; do\n        [ -d \"$d\" ] && dirs+=(\"$d\")\n    done\n    while IFS= read -r -d $'\"'\"'\\0'\"'\"' file; do\n        stat -Lc '\"'\"'File: %n Mode: (%#a) User: (%U) Group: (%G)'\"'\"' \"$file\"\n    done < <(find -L \"${dirs[@]}\" -mount -xdev -type f -name '\"'\"'*.service'\"'\"' \\( ! -user root -o ! -group root -o -perm /133 \\) -print0)\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to set access to mode 0644or more restrictive, owned by the root user, and owned by the root group: # chmod u-x,go-wx # chown root:root </path/to/systemd/.service>'
