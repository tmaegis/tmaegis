id: TMA-SLES16-5.3.2.4.3
title: Ensure pam_unix includes a strong password hashing algorithm
description: A cryptographic hash function converts an arbitrary-length input into a fixed length output. Password hashing performs a one-way transformation of a password, turning the password into another string, called the hashed password.
target: linux
os_family:
- sles-16
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 16 Benchmark v1.0.0 - 5.3.2.4.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v pam-config >/dev/null 2>&1 || { echo "step1: pam-config not installed"; return 1; }; o=$(bash -c ''pam-config --query --unix --unix-sha512'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''auth: sha512'' || { echo step1: missing ''auth: sha512''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''account: sha512'' || { echo step1: missing ''account: sha512''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''password: shadow sha512'' || { echo step1: missing ''password: shadow sha512''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''session: sha512'' || { echo step1: missing ''session: sha512''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v pam-config >/dev/null 2>&1 && pam-config -a --unix-sha512; true
  guidance: "Notes: • If yescrypt becomes available in a future release, this would also be acceptable. It is highly recommended that the chosen hashing algorithm is consistent across /etc/libuser.conf, /etc/login.defs, /etc/pam.d/password-auth, and /etc/pam.d/system-auth. • This only effects local users and passwords created after updating the files to use sha512 or yescrypt. If it is determined that the password algorithm being used is not sha512 or yescrypt, once it is changed, it is recommended that all user ID's be immediately expired and forced to change their passwords on next login. Run one of the following commands to add a strong password hashing algorithm on the password stack's pam_unix.so mo…"
