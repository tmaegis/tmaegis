id: TMA-SLES16-7.2.10
title: Ensure no passwords are stored in /etc/group
description: 'The /etc/group file defines system groups and their memberships. Modern systems store encrypted group passwords in /etc/gshadow. The /etc/group file should contain an x placeholder in the password field, indicating that any gorup password is stored securely in /etc/gshadow. Note: Group passwords are an inherent security problem since more than one person is permitted to know the password. However, groups are a useful tool for permitting co- operation between different users.'
target: linux
os_family:
- sles-16
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 16 Benchmark v1.0.0 - 7.2.10
audit:
  type: command
  shell: bash
  command: 'alt0() { o=$(bash -c ''awk -F: ''"''"''($2 != "x" && $2 != "!" && $2 != "") { print $1 }''"''"'' /etc/group'' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v grpconv >/dev/null 2>&1 && grpconv
    true
  guidance: "1. Review the groups that contain passwords and determine if group passwords are needed. 2. Remove the group password using the following command: # gpasswd --remove-password <group> 3. - IF - /etc/gshadow does not exist create it using the following command: # touch /etc/gshadow 4. - IF - group passwords are needed recreate them per site policy using the gpasswd command"
