id: TMA-SLES16-2.1.18
title: Ensure web server services are not in use
description: Web servers provide the ability to host web site content.
target: linux
os_family:
- sles-16
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 16 Benchmark v1.0.0 - 2.1.18
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v rpm >/dev/null 2>&1 || { echo "step1: rpm not installed"; return 1; }; o=$(bash -c ''rpm -q apache2 nginx'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''package apache2 is not installed'' || { echo step1: missing ''package apache2 is not installed''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''package nginx is not installed'' || { echo step1: missing ''package nginx is not installed''; return 1; }; }; alt1() { o=$(bash -c ''systemctl show httpd.socket httpd.service -p UnitFileState,ActiveState | grep -Pi ''"''"''=(enabled|active)''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0 || alt1; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_svc_off httpd.socket httpd.service nginx.service apache2.service
  guidance: "Run the following commands to stop apache2.service and remove the apache2 package: # systemctl stop apache2.service # zypper remove apache2 Run the following commands to stop nginx.service and remove the nginx package: # systemctl stop nginx.service # zypper remove nginx - OR - - IF - a package is installed and is required for dependencies: Run the following commands to stop and mask apache2.service, and nginx.service: # systemctl stop apache2.service nginx.service # systemctl mask apache2.service nginx.service Note: Other web server packages may exist. If not required and authorized by local site policy, they should also be removed. If the package is required for a dependency, the service a…"
