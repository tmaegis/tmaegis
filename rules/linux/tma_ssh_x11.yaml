id: TMA-LNX-SSH-X11
title: Ensure SSH X11 forwarding is disabled
description: Hardens the SSH daemon directive X11Forwarding.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: medium
tags:
- ssh
- server
reference: CIS Linux Benchmark - Services / SSH Server Configuration (verify section number for your distro release)
audit:
  type: command
  command: sshd -T 2>/dev/null | grep -i '^x11forwarding '
  expected_output: x11forwarding no
remediation:
  type: file_line
  file_path: /etc/ssh/sshd_config
  match_regex: (?mi)^\s*#?\s*X11Forwarding\b.*$
  replace_line: X11Forwarding no
  verify_cmd: sshd -t -f {file}
  backup_files:
  - /etc/ssh/sshd_config
  insert_at: top
