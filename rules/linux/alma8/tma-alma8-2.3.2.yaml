id: TMA-ALMA8-2.3.2
title: Ensure chrony is configured
description: '• server o The server directive specifies an NTP server which can be used as a time source. The client-server relationship is strictly hierarchical: a client might synchronize its system time to that of the server, but the server’s system time will never be influenced by that of a client. o This directive can be used multiple times to specify multiple servers. o The directive is immediately followed by either the name of the server, or its IP address. • pool o The syntax of this directive is similar to that for the server directive, except that it is used to specify a pool of NTP servers rathe'
target: linux
os_family:
- almalinux-8
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS AlmaLinux OS 8 Benchmark v4.0.0 - 2.3.2
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output=() a_output2=() a_config_files=(\"/etc/chrony.conf\")\n   l_include='\"'\"'(confdir|sourcedir)'\"'\"' l_parameter_name='\"'\"'(server|pool)'\"'\"' l_parameter_value='\"'\"'.+'\"'\"'\n   while IFS= read -r l_conf_loc; do\n      l_dir=\"\" l_ext=\"\"\n      if [ -d \"$l_conf_loc\" ]; then\n         l_dir=\"$l_conf_loc\" l_ext=\"*\"\n      elif  grep -Psq '\"'\"'\\/\\*\\.([^#/\\n\\r]+)?\\h*$'\"'\"' <<< \"$l_conf_loc\" || [ -f \"$(readlink -f \"$l_conf_loc\")\" ]; then\n         l_dir=\"$(dirname \"$l_conf_loc\")\" l_ext=\"$(basename \"$l_conf_loc\")\"\n      fi\n      if [[ -n \"$l_dir\" && -n \"$l_ext\" ]]; then\n         while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_file_name; do\n            [ -f \"$(readlink -f \"$l_file_name\")\" ] && a_config_files+=(\"$(readlink -f \"$l_file_name\")\")\n         done < <(find -L \"$l_dir\" -type f -name \"$l_ext\" -print0 2>/dev/null)\n      fi\n   done < <(awk '\"'\"'$1~/^\\s*'\"'\"\
    '\"$l_include\"'\"'\"'$/{print $2}'\"'\"' \"${a_config_files[*]}\" 2>/dev/null)\n   for l_file in \"${a_config_files[@]}\"; do\n      l_parameter_line=\"$(grep -Psi '\"'\"'^\\h*'\"'\"'\"$l_parameter_name\"'\"'\"'(\\h+|\\h*:\\h*)'\"'\"'\"$l_parameter_value\"'\"'\"'\\b'\"'\"' \"$l_file\")\"\n      [ -n \"$l_parameter_line\" ] && a_output+=(\"  - Parameter: \\\"$(tr -d '\"'\"'()'\"'\"' <<< ${l_parameter_name//|/ or })\\\"\" \\\n      \"    Exists in the file: \\\"$l_file\\\" as:\" \"$l_parameter_line\")\n   done\n   [ \"${#a_output[@]}\" -le \"0\" ] && a_output2+=(\"  - Parameter: \\\"$(tr -d '\"'\"'()'\"'\"' <<< ${l_parameter_name//|/ or })\\\"\" \\\n   \"    Does not exist in the chrony configuration\")\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\" \"\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** FAIL **\" \" - Reason(s) for audit failure:\" \"${a_output2[@]}\"\n\
    \   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    c=; for f in /etc/chrony.conf /etc/chrony/chrony.conf; do [ -f "$f" ] && c=$f && break; done
    [ -n "$c" ] || { tma_pkg_install chrony; for f in /etc/chrony.conf /etc/chrony/chrony.conf; do [ -f "$f" ] && c=$f && break; done; }
    [ -n "$c" ] || exit 0
    if ! grep -Eqs '^[[:space:]]*(server|pool)[[:space:]:]' "$c" "$(dirname "$c")"/conf.d/*.conf "$(dirname "$c")"/sources.d/*.sources /etc/chrony.d/*.conf /etc/chrony.d/*.sources; then
      tma_bak "$c"
      printf '\n# added by tmaegis; override with TMA_NTP_POOL\npool %s iburst\n' "${TMA_NTP_POOL:-2.pool.ntp.org}" >> "$c"
      u=$(tma_unit chronyd.service chrony.service) && systemctl try-restart "$u"
    fi
    true
  guidance: "Edit /etc/chrony.conf or a file ending in .sources in /etc/sources.d/ and add or edit server or pool lines as appropriate according to local site policy: Edit the Chrony configuration and add or edit the server and/or pool lines returned by the Audit Procedure as appropriate according to local site policy <[server|pool]> <[remote-server|remote-pool]> Example script to add a drop-in configuration for the pool directive: #!/usr/bin/env bash { [ ! -d \"/etc/sources.d/\" ] && mkdir /etc/sources.d/ printf '%s\\n' \"\" \"#The maxsources option is unique to the pool directive\" \\ \"pool time.nist.gov iburst maxsources 4\" >> /etc/sources.d/60- sources.sources chronyc reload sources &>/dev/null } Example scr…"
