id: TMA-ALMA9-7.2.8
title: Ensure local interactive user home directories are configured
description: The user home directory is space defined for the particular user to set local environment variables and to store personal files. While the system administrator can establish secure permissions for users' home directories, the users can easily override these. Users can be defined in /etc/passwd without a home directory or with a home directory that does not actually exist.
target: linux
os_family:
- almalinux-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS AlmaLinux OS 9 Benchmark v3.0.0 - 7.2.8
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   l_valid_shells=\"^($( awk -F\\/ '\"'\"'$NF != \"nologin\" {print}'\"'\"' /etc/shells | sed -rn '\"'\"'/^\\//{s,/,\\\\/,g;p}'\"'\"' | paste -s -d '\"'\"'|'\"'\"' - ))$\"\n   l_mask='\"'\"'0027'\"'\"'; l_max=\"$( printf '\"'\"'%o'\"'\"' $(( 0777 & ~$l_mask )) )\"\n   while IFS=\" \" read -r l_user l_home; do\n      if [ ! -d \"$l_home\" ]; then\n         printf '\"'\"'%s\\n'\"'\"' \" - User: \\\"$l_user\\\" home directory \\\"$l_home\\\" does not exist\"\n      else\n         while IFS=: read -r l_own l_mode; do\n            [ \"$l_user\" != \"$l_own\" ] && printf '\"'\"'%s\\n'\"'\"' \" - User: \\\"$l_user\\\" home \\\"$l_home\\\" is owned by \\\"$l_own\\\" (should be owned by \\\"$l_user\\\")\"\n            [ $(( $l_mode & $l_mask )) -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \" - User: \\\"$l_user\\\" home \\\"$l_home\\\" is mode \\\"$l_mode\\\" (should be \\\"$l_max\\\" or more restrictive)\"\n         done <<< \"$(stat -Lc '\"'\"\
    '%U:%#a'\"'\"' \"$l_home\")\"\n      fi\n   done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '\"'\"'$(NF) ~ pat { print $1 \" \" $(NF-1) }'\"'\"' /etc/passwd)\"\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    # "user home" for interactive users whose home is a plain user directory
    tma_homes() { while IFS=: read -r u p uid gid c h sh; do
      case "$u" in +*|-*) continue;; esac
      printf '%s\n' "$vs" | grep -qxF -- "$sh" || continue
      case "$h" in /|""|/bin*|/sbin*|/usr*|/etc*|/proc*|/sys*|/dev*|/boot*|/run*|/var/run*) continue;; esac
      echo "$u $h"; done < /etc/passwd; }
    tma_homes | while read -r u h; do
      if [ ! -d "$h" ]; then
        case "$h" in /home/*|/root) ;; *) continue;; esac
        mkdir -p "$h" && chown "$u:$(id -gn "$u")" "$h" && chmod 0750 "$h"
        continue
      fi
      [ "$(stat -Lc %U "$h")" = "$u" ] || chown "$u" "$h"
      mo=$(stat -Lc %a "$h"); chmod "$(printf '%o' $((8#$mo & ~8#027 & 8#7777)))" "$h"
    done
    true
  guidance: "1. If a local interactive user's home directory is undefined and/or does not exist, follow local site policy and perform one of the following: • Lock the user account • Remove the user from the system • Create a directory for the user. If the home directory is undefined, set it to the absolute path of that directory: # usermod --home <directory> <username> 2. For each existing home directory reported by the Audit Procedure, make changes in accordance with local site policy and apply the corresponding action: • The directory is not owned by its user - set the owner: # chown <user> <home_directory> • The directory is more permissive than mode 0750 - remove the excess permissions: # chmod g-w,o…"
