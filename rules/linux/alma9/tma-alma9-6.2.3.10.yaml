id: TMA-ALMA9-6.2.3.10
title: Ensure use of privileged commands are collected
description: Monitor privileged programs, those that have the setuid and/or setgid bit set on execution, to determine if unprivileged users are running these commands.
target: linux
os_family:
- almalinux-9
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS AlmaLinux OS 9 Benchmark v3.0.0 - 6.2.3.10
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   UID_MIN=\"$(awk '\"'\"'/^\\s*UID_MIN/{print $2}'\"'\"' /etc/login.defs)\"\n   for PARTITION in $(findmnt -n -l -k -it $(awk '\"'\"'/nodev/ { print $2 }'\"'\"' /proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '\"'\"'{print $1}'\"'\"'); do\n      while IFS= read -r FILE; do\n         ok=\"\"\n         while IFS= read -r L; do\n            grep -Pq -- '\"'\"'-a\\s+(always,exit|exit,always)'\"'\"' <<< \"$L\" \\\n            && grep -Pq -- '\"'\"'-F\\s+perm=x'\"'\"' <<< \"$L\" \\\n            && grep -Pq -- \"-F\\s+auid>=${UID_MIN}\" <<< \"$L\" \\\n            && grep -Pq -- '\"'\"'-F\\s+auid!=(unset|-1|4294967295)'\"'\"' <<< \"$L\" && ok=\"Y\"\n         done < <(grep -h -- \"path=${FILE}\" /etc/audit/rules.d/*.rules 2>/dev/null)\n         [ -z \"$ok\" ] && printf '\"'\"'MISSING or incomplete on-disk rule: %s\\n'\"'\"' \"$FILE\"\n      done < <(find \"${PARTITION}\" -xdev \\( -path \"*/containers/storage/*\" -o -path\
    \ \"*/containerd/*\" -o -path \"*/kubelet/*\" -o -path \"/snap/*\" \\) -prune -o -perm /6000 -type f -print)\n   done\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; o=$(bash -c '#!/usr/bin/env bash\n\n{\n   UID_MIN=\"$(awk '\"'\"'/^\\s*UID_MIN/{print $2}'\"'\"' /etc/login.defs)\"\n   RUNNING=\"$(auditctl -l)\"\n   for PARTITION in $(findmnt -n -l -k -it $(awk '\"'\"'/nodev/ { print $2 }'\"'\"' /proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '\"'\"'{print $1}'\"'\"'); do\n      while IFS= read -r FILE; do\n         ok=\"\"\n         while IFS= read -r L; do\n            grep -Pq -- '\"'\"'-a\\s+(always,exit|exit,always)'\"'\"' <<< \"$L\" \\\n            && grep -Pq -- '\"'\"'-F\\s+perm=x'\"'\"' <<< \"$L\" \\\n            && grep -Pq -- \"-F\\s+auid>=${UID_MIN}\" <<< \"$L\" \\\n            && grep -Pq -- '\"'\"'-F\\s+auid!=(unset|-1|4294967295)'\"'\"' <<< \"$L\" && ok=\"Y\"\n         done < <(printf '\"'\"'%s\\n'\"'\"' \"$RUNNING\" | grep\
    \ -- \"path=${FILE}\")\n         [ -z \"$ok\" ] && printf '\"'\"'MISSING or incomplete loaded rule: %s\\n'\"'\"' \"$FILE\"\n      done < <(find \"${PARTITION}\" -xdev \\( -path \"*/containers/storage/*\" -o -path \"*/containerd/*\" -o -path \"*/kubelet/*\" -o -path \"/snap/*\" \\) -prune -o -perm /6000 -type f -print)\n   done\n}' 2>&1); [ -z \"$o\" ] || { echo \"step2: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_AUDITD_CONF=/etc/audit/auditd.conf
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; }
    tma_audit_pkg() {
      command -v auditctl >/dev/null 2>&1 && [ -f /etc/audit/auditd.conf ] && return 0
      if command -v apt-get >/dev/null 2>&1; then tma_pkg_install auditd; else tma_pkg_install audit; fi; }
    tma_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo >> "$1"; return 0; }
    tma_kv() { # file key value : 'key = value' style (auditd.conf); replaces every uncommented line
      f=$1; k=$2; v=$3
      [ -f "$f" ] || return 0
      tma_bak "$f"
      if grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$f"; then
        sed -i -E "s|^[[:space:]]*$k[[:space:]]*=.*|$k = $v|" "$f"
      else tma_nl "$f"; printf '%s = %s\n' "$k" "$v" >> "$f"; fi; }
    tma_ini_set() { # file section key value : systemd ini 'Key=value'
      f=$1; s=$2; k=$3; v=$4
      mkdir -p "$(dirname "$f")"; [ -f "$f" ] || : > "$f"; tma_nl "$f"
      sed -i -E "/^[[:space:]]*$k[[:space:]]*=/d" "$f"
      if grep -q "^\[$s\]" "$f"; then sed -i "/^\[$s\]/a $k=$v" "$f"; else printf '[%s]\n%s=%s\n' "$s" "$k" "$v" >> "$f"; fi; }
    tma_clear() { # path octal-mask : remove the mask bits from the file mode
      [ -e "$1" ] || return 0
      m=$(stat -Lc %a "$1")
      [ $((8#$m & 8#$2)) -eq 0 ] || chmod "$(printf '%o' $((8#$m & ~8#$2 & 8#7777)))" "$1"; }
    tma_rule() { # rules.d-filename audit-rule-line : append when missing (whitespace-normalised)
      f=/etc/audit/rules.d/$1; shift; l=$*
      mkdir -p /etc/audit/rules.d; [ -f "$f" ] || : > "$f"
      if ! tr -s ' \t' '  ' < "$f" | sed 's/^ //;s/ $//' | grep -Fxq -- "$l"; then tma_nl "$f"; printf '%s\n' "$l" >> "$f"; fi
      chown root:root "$f"; chmod 640 "$f"; }
    tma_rules_load() { command -v augenrules >/dev/null 2>&1 && augenrules --load >/dev/null 2>&1; true; }
    tma_audit_logdir() {
      d=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs 2>/dev/null)
      [ -n "$d" ] && dirname "$d" || echo /var/log/audit; }
    tma_grub_arg() { # key=value : add/replace in GRUB_CMDLINE_LINUX and regenerate grub.cfg
      a=$1; k=${a%%=*}; g=/etc/default/grub
      [ -f "$g" ] || { echo "no $g: bootloader not managed by grub defaults" >&2; return 0; }
      tma_bak "$g"
      if ! grep -q '^GRUB_CMDLINE_LINUX=' "$g"; then tma_nl "$g"; printf 'GRUB_CMDLINE_LINUX="%s"\n' "$a" >> "$g"
      elif grep -E '^GRUB_CMDLINE_LINUX=' "$g" | grep -Eq "[\"' ]$k(=|[\"' ])"; then
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"' ])$k(=[^\"' ]*)?([\"' ])#\1$a\3#" "$g"
      else
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"'])\$#  $a\1#; /^GRUB_CMDLINE_LINUX=/ s#=([\"'])  #=\1#; /^GRUB_CMDLINE_LINUX=/ s#   *# #g" "$g"
      fi
      if command -v update-grub >/dev/null 2>&1; then update-grub >/dev/null 2>&1
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        for c in /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c" >/dev/null 2>&1; done
      elif command -v grub-mkconfig >/dev/null 2>&1; then grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1; fi
      true; }
    tma_audit_pkg
    f=/etc/audit/rules.d/50-privileged.rules; tma_bak "$f"
    UID_MIN=$(awk '/^[[:space:]]*UID_MIN/{print $2}' /etc/login.defs); UID_MIN=${UID_MIN:-1000}
    ARCHES=""; for A in b64 b32; do ausyscall "$A" execve >/dev/null 2>&1 && ARCHES="$ARCHES $A"; done
    tmp=$f.tmaegis.new; : > "$tmp"
    for P in $(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" | grep -Ev 'noexec|nosuid' | awk '{print $1}'); do
      find "$P" -xdev \( -path '*/containers/storage/*' -o -path '*/containerd/*' -o -path '*/kubelet/*' -o -path '/snap/*' \) -prune -o -perm /6000 -type f -print
    done | sort -u | while IFS= read -r F; do
      if [ -n "$ARCHES" ]; then for A in $ARCHES; do
        echo "-a always,exit -F arch=$A -F path=$F -F perm=x -F auid>=$UID_MIN -F auid!=unset -k privileged"; done
      else echo "-a always,exit -F path=$F -F perm=x -F auid>=$UID_MIN -F auid!=unset -k privileged"; fi
    done >> "$tmp"
    cat "$tmp" > "$f"; rm -f "$tmp"; chown root:root "$f"; chmod 640 "$f"
    tma_rules_load
  guidance: "Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension, with the relevant rules to monitor the use of privileged commands. Example script: #!/usr/bin/env bash { UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs) AUDIT_RULE_FILE=\"/etc/audit/rules.d/50-privileged.rules\" # Emit a rule only for the audit ABIs the running kernel supports ARCHES=\"\"; for ARCH in b64 b32; do ausyscall \"$ARCH\" execve >/dev/null 2>&1 && ARCHES=\"${ARCHES:+$ARCHES }$ARCH\"; done NEW_DATA=() for PARTITION in $(findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print $1}'); do while IFS= read -r FILE; do for ARCH in $ARC…"
