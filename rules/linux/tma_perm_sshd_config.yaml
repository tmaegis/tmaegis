id: TMA-LNX-PERM-SSHD-CONFIG
title: Ensure permissions on /etc/ssh/sshd_config are configured
description: /etc/ssh/sshd_config must be 600 root:root.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: high
tags:
- permissions
- files
reference: CIS Linux Benchmark - System File Permissions (verify section number for your distro release)
audit:
  type: command
  command: stat -Lc '%a %U %G' /etc/ssh/sshd_config
  expected_output: 600 root root
remediation:
  type: command
  command: chown root:root /etc/ssh/sshd_config && chmod 600 /etc/ssh/sshd_config
  backup_files: []
