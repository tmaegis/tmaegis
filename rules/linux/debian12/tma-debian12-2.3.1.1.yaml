id: TMA-DEBIAN12-2.3.1.1
title: Ensure a single time synchronization daemon is in use
description: 'System time should be synchronized between all systems in an environment. This is typically done by establishing an authoritative time server or set of servers and having all systems synchronize their clocks to them. Note: • On virtual systems where host based time synchronization is available consult your virtualization software documentation and verify that host based synchronization is in use and follows local site policy. In this scenario, this section should be skipped • Only one time synchronization method should be in use on the system. Configuring multiple time synchronization methods '
target: linux
os_family:
- debian-12
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 12 Benchmark v2.0.0 - 2.3.1.1
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n    l_output=\"\" l_output2=\"\"\n    service_not_enabled_chk()\n    {\n        l_out2=\"\"\n        if systemctl is-enabled \"$l_service_name\" 2>/dev/null | grep -q '\"'\"'enabled'\"'\"'; then\n            l_out2=\"$l_out2\\n  - Daemon: \\\"$l_service_name\\\" is enabled on the system\"\n        fi\n        if systemctl is-active \"$l_service_name\" 2>/dev/null | grep -q '\"'\"'^active'\"'\"'; then\n            l_out2=\"$l_out2\\n  - Daemon: \\\"$l_service_name\\\" is active on the system\"\n        fi\n    }\n    l_service_name=\"systemd-timesyncd.service\" # Check systemd-timesyncd daemon\n    service_not_enabled_chk\n    if [ -n \"$l_out2\" ]; then\n        l_timesyncd=\"y\"\n        l_out_tsd=\"$l_out2\"\n    else\n        l_timesyncd=\"n\"\n        l_out_tsd=\"\\n  - Daemon: \\\"$l_service_name\\\" is not enabled and not active on the system\"\n    fi\n    l_service_name=\"chrony.service\" # Check chrony\n    service_not_enabled_chk\n\
    \    if [ -n \"$l_out2\" ]; then\n        l_chrony=\"y\"\n        l_out_chrony=\"$l_out2\"\n    else\n        l_chrony=\"n\"\n        l_out_chrony=\"\\n  - Daemon: \\\"$l_service_name\\\" is not enabled and not active on the system\"\n    fi\n    l_status=\"$l_timesyncd$l_chrony\"\n    case \"$l_status\" in\n        yy)\n            l_output2=\" - More than one time sync daemon is in use on the system$l_out_tsd$l_out_chrony\"\n            ;;\n        nn)\n            l_output2=\" - No time sync daemon is in use on the system$l_out_tsd$l_out_chrony\"\n            ;;\n        yn|ny)\n            l_output=\" - Only one time sync daemon is in use on the system$l_out_tsd$l_out_chrony\"\n            ;;\n        *)\n            l_output2=\" - Unable to determine time sync daemon(s) status\"\n            ;;\n    esac\n\n    if [ -z \"$l_output2\" ]; then\n        echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n    else\n        echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - *\
    \ Reasons for audit failure * :\\n$l_output2\\n\"\n    fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    # keep exactly one of chrony / systemd-timesyncd: the one already enabled, else an installed one, else chrony
    tsd=systemd-timesyncd.service; ch=$(tma_unit chronyd.service chrony.service)
    on() { systemctl is-enabled "$1" 2>/dev/null | grep -q '^enabled' && systemctl is-active "$1" 2>/dev/null | grep -q '^active'; }
    keep=
    if [ -n "$ch" ] && on "$ch"; then keep=$ch
    elif on $tsd; then keep=$tsd
    elif [ -n "$ch" ]; then keep=$ch
    elif tma_unit $tsd >/dev/null; then keep=$tsd
    else tma_pkg_install chrony; keep=$(tma_unit chronyd.service chrony.service); fi
    [ -n "$keep" ] || exit 0
    for u in $tsd chronyd.service chrony.service ntp.service ntpd.service; do
      [ "$u" = "$keep" ] && continue
      tma_unit "$u" >/dev/null && { systemctl disable --now "$u" 2>/dev/null; }
    done
    tma_svc_on "$keep"
  guidance: "On physical systems, and virtual systems where host based time synchronization is not available. Select one of the two time synchronization daemons; chrony (1) or systemd- timesyncd (2) and following the remediation procedure for the selected daemon. Note: enabling more than one synchronization daemon could lead to unexpected or unreliable results: 1. chrony Run the following command to install chrony: # apt install chrony Run the following commands to stop and mask the systemd-timesyncd daemon: # systemctl stop systemd-timesyncd.service # systemctl mask systemd-timesyncd.service Note: • Subsection: Configure chrony should be followed • Subsection: Configure systemd-timesyncd should be skipp…"
