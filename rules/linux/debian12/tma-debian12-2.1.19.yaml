id: TMA-DEBIAN12-2.1.19
title: Ensure telnet server services are not in use
description: The telnetd package contains the telnet daemon, which accepts connections from users from other systems via the telnet protocol.
target: linux
os_family:
- debian-12
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 12 Benchmark v2.0.0 - 2.1.19
audit:
  type: command
  shell: bash
  command: 'alt0() { o=$(bash -c ''dpkg-query -l | awk ''"''"''{print $2}''"''"'' | grep -Pio -- ''"''"''^telnetd|^telnetd-ssl''"''"'' &>/dev/null && echo "telnetd is installed"'' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; alt1() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v systemctl >/dev/null 2>&1 || { echo "step1: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-enabled inetutils-inetd.service 2>/dev/null | grep ''"''"''enabled''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step2: grep not installed"; return 1; }; command -v systemctl >/dev/null 2>&1 || { echo "step2: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-active inetutils-inetd.service 2>/dev/null | grep ''"''"''^active''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step2: $o" | head -c 300; return 1; }; }; if alt0 || alt1;
    then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_svc_off telnet.socket
  guidance: "Run the following commands to stop inetutils-inetd.service, and remove the telnetd package: # systemctl stop inetutils-inetd.service # apt purge telnetd - OR - - IF - the telnetd package is required as a dependency: Run the following commands to stop and mask inetutils-inetd.service: # systemctl stop inetutils-inetd.service # systemctl mask inetutils-inetd.service"
