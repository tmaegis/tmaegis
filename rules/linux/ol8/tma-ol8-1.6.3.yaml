id: TMA-OL8-1.6.3
title: Ensure system wide crypto policy macs are configured
description: Message Authentication Code (MAC) algorithm is a family of cryptographic functions that is parameterized by a symmetric key. Each of the functions can act on input data (called a “message”) of variable length to produce an output value of a specified length. The output value is called the MAC of the input message. A MAC algorithm can be used to provide data-origin authentication and data-integrity protection
target: linux
os_family:
- ol-8
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 8 Benchmark v4.0.0 - 1.6.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep -Pi -- ''"''"''^\h*mac\h*=\h*([^#\n\r]+)?-128\b''"''"'' /etc/crypto-'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- policies/state/CURRENT.pol || { echo step1: missing policies/state/CURRENT.pol; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v update-crypto-policies >/dev/null 2>&1 || { echo "update-crypto-policies not available"; exit 0; }
    d=/etc/crypto-policies/policies/modules; mkdir -p $d
    printf '# TMAegis subpolicy NO-WEAKMAC\n%s\n' 'mac = -*-128' > $d/NO-WEAKMAC.pmod
    cur=$(update-crypto-policies --show 2>/dev/null | head -1); [ -n "$cur" ] || cur=DEFAULT
    case ":$cur:" in *:NO-WEAKMAC:*) ;; *) cur="$cur:NO-WEAKMAC";; esac
    update-crypto-policies --set "$cur"
  guidance: "Note: • The commands below are written for the included DEFAULT system-wide crypto policy. If another policy is in use and follows local site policy, replace DEFAULT with the name of your system-wide crypto policy. • Multiple subpolicies may be assigned to a policy as a colon separated list. e.g. DEFAULT:NO-SHA1:NO-SSHCBC • Subpolicies: o Not included in the update-crypto-policies --set command will not be applied to the system wide crypto policy. o must exist before they can be applied to the system wide crypto policy. o .pmod file filenames must be in all upper case, upper case, e.g. NO- WEAKMAC.pmod, or they will not be read by the update-crypto-policies --set command. Create or edit a fi…"
