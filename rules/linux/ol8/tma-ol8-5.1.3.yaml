id: TMA-OL8-5.1.3
title: Ensure access to /etc/sysconfig/sshd is configured
description: The file /etc/sysconfig/sshd contains configuration specifications for the sshd service.
target: linux
os_family:
- ol-8
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 8 Benchmark v4.0.0 - 5.1.3
audit:
  type: command
  shell: bash
  command: 'alt0() { s=$(stat -Lc ''%a %u %g'' /etc/sysconfig/sshd 2>&1) || { echo "step1: $s"; return 1; }; set -- $s; m=$((8#$1)); [ $((m & ~0640)) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ] || { echo "step1: /etc/sysconfig/sshd is mode $1 uid $2 gid $3, want 640 or stricter, uid 0, gid 0"; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/sysconfig/sshd
    [ -e "$p" ] || exit 0
    cur=$(stat -Lc %a "$p")
    chmod "$(printf '%o' $((8#$cur & 8#640)))" "$p"
    chown 0:0 "$p"
  guidance: "Run the following commands to remove excess permissions, set owner, and set group on /etc/sysconfig/sshd: # chmod u-x,g-we,o-rwx /etc/sysconfig/sshd # chown root:root /etc/sysconfig/sshd"
