id: TMA-MINT22-1.4.2
title: Ensure access to bootloader config is configured
description: The grub configuration file contains information on boot settings and passwords for unlocking boot options.
target: linux
os_family:
- linuxmint-22
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Linux Mint 22 Benchmark v1.0.0 - 1.4.2
audit:
  type: command
  shell: bash
  command: 'alt0() { s=$(stat -Lc ''%a %u %g'' /boot/grub/grub.cfg 2>&1) || { echo "step1: $s"; return 1; }; set -- $s; m=$((8#$1)); [ $((m & ~0600)) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ] || { echo "step1: /boot/grub/grub.cfg is mode $1 uid $2 gid $3, want 600 or stricter, uid 0, gid 0"; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/boot/grub/grub.cfg
    [ -e "$p" ] || exit 0
    cur=$(stat -Lc %a "$p")
    chmod "$(printf '%o' $((8#$cur & 8#600)))" "$p"
    chown 0:0 "$p"
  guidance: "Run the following commands to set permissions on your grub configuration: # chown root:root /boot/grub/grub.cfg # chmod u-x,go-rwx /boot/grub/grub.cfg"
