id: TMA-UBUNTU1804-3.5.3.4
title: Ensure loopback traffic is configured
description: Configure the loopback interface to accept traffic. Configure all other interfaces to deny traffic to the loopback network
target: linux
os_family:
- ubuntu-18.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 18.04 LTS Benchmark v2.0.1 ARCHIVE - 3.5.3.4
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v awk >/dev/null 2>&1 || { echo "step1: awk not installed"; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v nft >/dev/null 2>&1 || { echo "step1: nft not installed"; return 1; }; o=$(bash -c ''nft list ruleset | awk ''"''"''/hook input/,/}/''"''"'' | grep ''"''"''iif "lo" accept''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''iif "lo" accept'' || { echo step1: missing ''iif "lo" accept''; return 1; }; command -v awk >/dev/null 2>&1 || { echo "step2: awk not installed"; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step2: grep not installed"; return 1; }; command -v nft >/dev/null 2>&1 || { echo "step2: nft not installed"; return 1; }; o=$(bash -c ''nft list ruleset | awk ''"''"''/hook input/,/}/''"''"'' | grep ''"''"''ip sddr''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''ip saddr 127.0.0.0/8
    counter packets 0 bytes 0 drop'' || { echo step2: missing ''ip saddr 127.0.0.0/8 counter packets 0 bytes 0 drop''; return 1; }; command -v awk >/dev/null 2>&1 || { echo "step3: awk not installed"; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step3: grep not installed"; return 1; }; command -v nft >/dev/null 2>&1 || { echo "step3: nft not installed"; return 1; }; o=$(bash -c ''nft list ruleset | awk ''"''"''/hook input/,/}/''"''"'' | grep ''"''"''ip6 saddr''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''ip6 saddr ::1 counter packets 0 bytes 0 drop'' || { echo step3: missing ''ip6 saddr ::1 counter packets 0 bytes 0 drop''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to implement the loopback rules: # nft add rule inet filter input iif lo accept # nft create rule inet filter input ip saddr 127.0.0.0/8 counter drop # nft add rule inet filter input ip6 saddr ::1 counter drop'
