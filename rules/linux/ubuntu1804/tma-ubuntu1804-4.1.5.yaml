id: TMA-UBUNTU1804-4.1.5
title: Ensure events that modify the system's network environment are collected
description: Record changes to network environment files or system calls. The below parameters monitor the sethostname (set the systems host name) or setdomainname (set the systems domainname) system calls, and write an audit event on system call exit. The other parameters monitor the /etc/issue and /etc/issue.net files (messages displayed pre- login), /etc/hosts (file containing host names and associated IP addresses) and /etc/network (directory containing network interface scripts and configurations) files.
target: linux
os_family:
- ubuntu-18.04
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 18.04 LTS Benchmark v2.0.1 ARCHIVE - 4.1.5
