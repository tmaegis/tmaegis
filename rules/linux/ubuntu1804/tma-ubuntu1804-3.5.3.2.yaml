id: TMA-UBUNTU1804-3.5.3.2
title: Ensure a table exists
description: Tables hold chains. Each table only has one address family and only applies to packets of this family. Tables can have one of five families.
target: linux
os_family:
- ubuntu-18.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 18.04 LTS Benchmark v2.0.1 ARCHIVE - 3.5.3.2
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v nft >/dev/null 2>&1 || { echo "step1: nft not installed"; return 1; }; o=$(bash -c ''nft list tables'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''Return should include a list of nftables:'' || { echo step1: missing ''Return should include a list of nftables:''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to create a table in nftables # nft create table inet <table name> Example: # nft create table inet filter'
