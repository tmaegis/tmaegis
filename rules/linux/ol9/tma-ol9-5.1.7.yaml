id: TMA-OL9-5.1.7
title: Ensure sshd MACs are configured
description: 'This variable limits the types of MAC algorithms that SSH can use during communication. Notes: • Some organizations may have stricter requirements for approved MACs. • Ensure that MACs used are in compliance with site policy. • The only "strong" MACs currently FIPS 140 approved are: o HMAC-SHA1 o HMAC-SHA2-256 o HMAC-SHA2-384 o HMAC-SHA2-512'
target: linux
os_family:
- ol-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 9 Benchmark v3.0.0 - 5.1.7
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n{\n   a_weak=(hmac-md5 hmac-md5-96 hmac-ripemd160 hmac-sha1-96 umac- 64@openssh.com hmac-md5-etm@openssh.com hmac-md5-96-etm@openssh.com hmac- ripemd160-etm@openssh.com hmac-sha1-96-etm@openssh.com umac-64- etm@openssh.com)\n   l_offered=\"$(sshd -T | awk '\"'\"'$1==\"macs\"{print $2}'\"'\"' | tr '\"'\"','\"'\"' '\"'\"'\\n'\"'\"')\"\n   for l_alg in \"${a_weak[@]}\"; do\n      grep -Fxq -- \"$l_alg\" <<< \"$l_offered\" && printf '\"'\"'%s\\n'\"'\"' \"$l_alg\"\n   done\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # tma_sshd_apply "Name value" ... : replace every existing setting, put ours first, validate, reload.
    tma_sshd_apply() {
      c=/etc/ssh/sshd_config
      [ -f "$c" ] || { echo "sshd_config not present, nothing to do"; return 0; }
      files="$c $(ls /etc/ssh/sshd_config.d/*.conf 2>/dev/null)"
      sv=$(mktemp -d)
      for f in $files; do tma_bak "$f"; cp -a "$f" "$sv/$(echo "$f" | tr / _)"; done
      for kv in "$@"; do
        n=${kv%% *}
        for f in $files; do
          [ -L "$f" ] && continue
          sed -i -E "s/^([[:space:]]*$n[[:space:]=].*)$/# tmaegis: \1/I" "$f"
        done
      done
      tmp=$(mktemp); : > "$tmp"
      for kv in "$@"; do printf '%s\n' "$kv" >> "$tmp"; done
      cat "$c" >> "$tmp"; cat "$tmp" > "$c"; rm -f "$tmp"
      if command -v sshd >/dev/null 2>&1 && ! sshd -t 2>/dev/null; then
        echo "sshd -t failed, restoring" >&2
        for f in $files; do cat "$sv/$(echo "$f" | tr / _)" > "$f"; done
        rm -rf "$sv"; return 1
      fi
      rm -rf "$sv"
      for u in sshd ssh; do systemctl reload "$u" 2>/dev/null && break; done
      return 0
    }
    v=$(ssh -Q mac 2>/dev/null | grep -E "^hmac-sha2-(256|512)(-etm@openssh.com)?$|^umac-128@openssh.com$" | paste -sd, -)
    [ -n "$v" ] || v=hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128@openssh.com,hmac-sha2-512,hmac-sha2-256

    tma_sshd_apply "MACs $v"
  guidance: "The MAC algorithms available to the SSH server are governed by the system-wide crypto policy. Disable the weak MACs by configuring the system-wide crypto policy as described in the \"Configure system wide crypto policy\" section. - IF - CVE-2023-48795 (Terrapin) has not been reviewed and addressed, the Encrypt- then-MAC (EtM) MACs should also be disabled through the system-wide crypto policy. Once the crypto policy has been updated, reload the SSH daemon: # systemctl reload-or-restart sshd"
