id: TMA-AZURE-CONTAINER-LINUX-7.2.7
title: Ensure no duplicate group names exist
description: 'Although the groupadd program will not let you create a duplicate group name, it is possible for an administrator to manually edit the /etc/group file and change the group name. Audit: Passes when no value of field 1 in /etc/group appears more than once.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- accounts
reference: CIS Azure Container Linux Benchmark v1.0.0 - 7.2.7 Ensure no duplicate group names exist
audit:
  type: command
  shell: bash
  command: 'cut -d: -f1 /etc/group | sort | uniq -d | grep -q . && echo noncompliant || echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Based on the results of the audit script, establish unique names for the user groups. File group ownerships will automatically reflect the change as long as the groups have unique GIDs.
