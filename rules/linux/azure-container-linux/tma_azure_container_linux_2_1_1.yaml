id: TMA-AZURE-CONTAINER-LINUX-2.1.1
title: Ensure systemd-timesyncd is configured
description: System time should be synchronized between all systems in an environment. On Azure Container Linux this is provided by systemd-timesyncd, a lightweight SNTP client that synchronizes the local clock to remote NTP servers. Azure Container Linux does not ship chrony; systemd-timesyncd is the supported time synchronization mechanism.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- cis-converted
reference: CIS Azure Container Linux Benchmark v1.0.0 - 2.1.1 Ensure systemd-timesyncd is configured
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v systemctl >/dev/null 2>&1 || { echo "step1: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-enabled systemd-timesyncd'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- enabled || { echo step1: missing enabled; return 1; }; command -v systemctl >/dev/null 2>&1 || { echo "step2: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-active systemd-timesyncd'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- active || { echo step2: missing active; return 1; }; command -v timedatectl >/dev/null 2>&1 || { echo "step3: timedatectl not installed"; return 1; }; o=$(bash -c ''timedatectl show -p NTP -p NTPSynchronized'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- NTP=yes || { echo step3: missing NTP=yes; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- NTPSynchronized=yes
    || { echo step3: missing NTPSynchronized=yes; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    if ! grep -Eqs '^[[:space:]]*NTP=[^[:space:]]' /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.d/*.conf; then
      mkdir -p /etc/systemd/timesyncd.conf.d
      printf '[Time]\nNTP=%s\nFallbackNTP=%s\n' "${TMA_NTP_SERVERS:-0.pool.ntp.org 1.pool.ntp.org}" "${TMA_NTP_FALLBACK:-2.pool.ntp.org 3.pool.ntp.org}" > /etc/systemd/timesyncd.conf.d/60-tmaegis.conf
    elif ! grep -Eqs '^[[:space:]]*FallbackNTP=[^[:space:]]' /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.d/*.conf; then
      mkdir -p /etc/systemd/timesyncd.conf.d
      printf '[Time]\nFallbackNTP=%s\n' "${TMA_NTP_FALLBACK:-2.pool.ntp.org 3.pool.ntp.org}" > /etc/systemd/timesyncd.conf.d/61-tmaegis-fallback.conf
    fi
    systemctl try-restart systemd-timesyncd.service 2>/dev/null; true
  guidance: "Configure an NTP server and enable the service. Edit /etc/systemd/timesyncd.conf (or a drop-in) to set the NTP= directive, then enable and start the service: # echo -e '[Time]\\nNTP=time.windows.com' > /etc/systemd/timesyncd.conf.d/10- ntp.conf # systemctl enable --now systemd-timesyncd # timedatectl set-ntp true"
