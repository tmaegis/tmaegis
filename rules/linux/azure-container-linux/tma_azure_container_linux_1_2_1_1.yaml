id: TMA-AZURE-CONTAINER-LINUX-1.2.1.1
title: Ensure GPG keys are configured
description: The RPM Package Manager implements GPG key signing to verify package integrity during and after installation. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- manual-review
reference: CIS Azure Container Linux Benchmark v1.0.0 - 1.2.1.1 Ensure GPG keys are configured
audit:
  type: manual
  command: 'List all GPG key URLs Each repository should have a gpgkey with a URL pointing to the location of the GPG key, either local or remote. # grep -r gpgkey /etc/yum.repos.d/* /etc/dnf/dnf.conf List installed GPG keys Run the following command to list the currently installed keys. These are the active keys used for verification and installation of RPMs. The packages are fake, they are generated on the fly by tdnf or rpm during the import of keys from the URL specified in the repository configuration. Example: # for RPM_PACKAGE in $(rpm -q gpg-pubkey); ...'
remediation:
  type: iac_patch
  command: Update your package manager GPG keys in accordance with site policy.
