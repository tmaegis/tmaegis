id: TMA-AZURE-CONTAINER-LINUX-5.2.15
title: Ensure sshd LogLevel is configured
description: 'SSH provides several logging levels with varying amounts of verbosity. The DEBUG options are specifically not recommended other than strictly for debugging SSH communications. These levels provide so much data that it is difficult to identify important security information, and may violate the privacy of users. Audit: Passes when sshd -T reports loglevel VERBOSE or INFO.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- ssh
- logging
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.2.15 Ensure sshd LogLevel is configured
audit:
  type: command
  shell: bash
  command: out=$(sshd -T 2>/dev/null) || exit 1; printf "%s\n" "$out" | grep -Eiq "^loglevel (VERBOSE|INFO)$" && echo compliant || echo noncompliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # tma_sshd_apply "Name value" ... : replace every existing setting, put ours first, validate, reload.
    tma_sshd_apply() {
      c=/etc/ssh/sshd_config
      [ -f "$c" ] || { echo "sshd_config not present, nothing to do"; return 0; }
      files="$c $(ls /etc/ssh/sshd_config.d/*.conf 2>/dev/null)"
      sv=$(mktemp -d)
      for f in $files; do tma_bak "$f"; cp -a "$f" "$sv/$(echo "$f" | tr / _)"; done
      for kv in "$@"; do
        n=${kv%% *}
        for f in $files; do
          [ -L "$f" ] && continue
          sed -i -E "s/^([[:space:]]*$n[[:space:]=].*)$/# tmaegis: \1/I" "$f"
        done
      done
      tmp=$(mktemp); : > "$tmp"
      for kv in "$@"; do printf '%s\n' "$kv" >> "$tmp"; done
      cat "$c" >> "$tmp"; cat "$tmp" > "$c"; rm -f "$tmp"
      if command -v sshd >/dev/null 2>&1 && ! sshd -t 2>/dev/null; then
        echo "sshd -t failed, restoring" >&2
        for f in $files; do cat "$sv/$(echo "$f" | tr / _)" > "$f"; done
        rm -rf "$sv"; return 1
      fi
      rm -rf "$sv"
      for u in sshd ssh; do systemctl reload "$u" 2>/dev/null && break; done
      return 0
    }

    tma_sshd_apply 'LogLevel VERBOSE'
  guidance: "Edit the /etc/ssh/sshd_config file to set the LogLevel parameter to VERBOSE or INFO above any Include and Match entries as follows: LogLevel VERBOSE - OR - LogLevel INFO Note: First occurrence of an option takes precedence, Match set statements withstanding. If Include locations are enabled, used, and order of precedence is understood in your environment, the entry may be created in a file in Include location."
