id: TMA-AZURE-CONTAINER-LINUX-6.2
title: Ensure logrotate is configured
description: The system includes the capability of rotating log files regularly to avoid filling up the system with logs or making the logs unmanageably large. The file /etc/logrotate.d/syslog is the configuration file used to rotate log files created by syslog or rsyslog. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- manual-review
reference: CIS Azure Container Linux Benchmark v1.0.0 - 6.2 Ensure logrotate is configured
audit:
  type: manual
  command: Review /etc/logrotate.conf and /etc/logrotate.d/* and verify logs are rotated according to site policy.
remediation:
  type: iac_patch
  command: Edit /etc/logrotate.conf and /etc/logrotate.d/* to ensure logs are rotated according to site policy.
