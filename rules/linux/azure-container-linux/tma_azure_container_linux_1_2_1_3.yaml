id: TMA-AZURE-CONTAINER-LINUX-1.2.1.3
title: Ensure package manager repositories are configured
description: Systems need to have the respective package manager repositories configured to ensure that the system is able to receive the latest patches and updates. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- manual-review
reference: CIS Azure Container Linux Benchmark v1.0.0 - 1.2.1.3 Ensure package manager repositories are configured
audit:
  type: manual
  command: 'Run the following command to verify repositories are configured correctly. The output may vary depending on which repositories are currently configured on the system. Example: # dnf repolist Last metadata expiration check: 1:00:00 ago on Mon 1 Jan 2021 00:00:00 BST. repo id repo name status *fedora Fedora 28 - x86_64 57,327 *updates Fedora 28 - x86_64 - Updates 22,133 For the repositories in use, inspect the configuration file to ensure all settings are correctly applied according to site policy. Example: Depending on the distribution being used the repo file name might differ. ...'
remediation:
  type: iac_patch
  command: Configure your package manager repositories according to site policy.
