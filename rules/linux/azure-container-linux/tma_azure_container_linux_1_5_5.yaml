id: TMA-AZURE-CONTAINER-LINUX-1.5.5
title: Ensure access to /etc/issue.net is configured
description: The contents of the /etc/issue.net file are displayed to users prior to login for remote connections from configured services.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- cis-converted
reference: CIS Azure Container Linux Benchmark v1.0.0 - 1.5.5 Ensure access to /etc/issue.net is configured
audit:
  type: command
  shell: bash
  command: 'alt0() { s=$(stat -Lc ''%a %u %g'' /etc/issue.net 2>&1) || { echo "step1: $s"; return 1; }; set -- $s; m=$((8#$1)); [ $((m & ~0644)) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ] || { echo "step1: /etc/issue.net is mode $1 uid $2 gid $3, want 644 or stricter, uid 0, gid 0"; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/issue.net
    [ -e "$p" ] || exit 0
    cur=$(stat -Lc %a "$p")
    chmod "$(printf '%o' $((8#$cur & 8#644)))" "$p"
    chown 0:0 "$p"
  guidance: "Run the following commands to set mode, owner, and group on /etc/issue.net: # chown root:root $(readlink -e /etc/issue.net) # chmod u-x,go-wx $(readlink -e /etc/issue.net)"
