id: TMA-AZURE-CONTAINER-LINUX-5.5.2
title: Ensure system accounts are secured
description: 'There are a number of accounts provided with most distributions that are used to manage applications and are not intended to provide an interactive shell. Audit: Passes when no system account (UID below UID_MIN, excluding root, sync, shutdown and halt) has a valid login shell from /etc/shells.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- accounts
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.5.2 Ensure system accounts are secured
audit:
  type: command
  shell: bash
  command: 'min=$(awk ''/^[[:space:]]*UID_MIN/{print $2}'' /etc/login.defs); min=${min:-1000}; shells=$(awk -F/ ''/^\// && $NF != "nologin"'' /etc/shells); bad=0; while IFS=: read -r u p uid g c h sh; do for x in root sync shutdown halt; do [ "$u" = "$x" ] && continue 2; done; case $u in +*) continue;; esac; [ "$uid" -lt "$min" ] 2>/dev/null || continue; printf "%s\n" "$shells" | grep -qxF -- "$sh" && bad=1; done < /etc/passwd; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    is_valid() { printf '%s\n' "$vs" | grep -qxF -- "$1"; }
    min=$(awk '/^[[:space:]]*UID_MIN/{print $2}' /etc/login.defs 2>/dev/null); min=${min:-1000}
    nl=$(command -v nologin || echo /sbin/nologin)
    while IFS=: read -r u p uid gid c h sh; do
      case "$u" in root|sync|shutdown|halt|+*|-*) continue;; esac
      [ "$uid" -lt "$min" ] 2>/dev/null || continue
      is_valid "$sh" && usermod -s "$nl" "$u"
    done < /etc/passwd
    true
  guidance: "Set the shell for any accounts returned by the audit to nologin: # usermod -s $(which nologin) <user> Lock any non-root accounts returned by the audit: # usermod -L <user> The following script will: • Set the shell for any accounts returned by the audit to nologin • Lock any non-root system accounts returned by the audit #!/usr/bin/env bash { l_output=\"\" l_output2=\"\" l_valid_shells=\"^($( awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\" a_users=(); a_ulock=() # initialize arrays while read -r l_user; ..."
