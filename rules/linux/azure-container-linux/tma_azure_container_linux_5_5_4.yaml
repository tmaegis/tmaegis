id: TMA-AZURE-CONTAINER-LINUX-5.5.4
title: Ensure default user umask is 027 or more restrictive
description: 'The user file-creation mode mask (umask) is use to determine the file permission for newly created directories and files. In Linux, the default permissions for any newly created directory is 0777 (rwxrwxrwx), and for any newly created file it is 0666 (rw- rw-rw-). The umask modifies the default Linux permissions by restricting (masking) these permissions. The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file mode. umask can be set with either octal or Symbolic values: • Octal (Numeric) Value - Represented by either three or four digits. ie umask 0027 or umask 027. If a four digit umask is used, the first digit is ignored. ... Audit: Passes when a default umask of 027 or more restrictive is set in /etc/login.defs, /etc/profile* or /etc/bashrc* and no less restrictive umask is set in those files.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- umask
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.5.4 Ensure default user umask is 027 or more restrictive
audit:
  type: command
  shell: bash
  command: ok=0; grep -Eiq "^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b" /etc/login.defs 2>/dev/null && ok=1; grep -REiq "^\s*umask\s+(0[0-7][2-7]7|[0-7][2-7]7)\b" /etc/profile /etc/profile.d /etc/bashrc 2>/dev/null && ok=1; bad=$(grep -RPih "(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][0-6]\b|[0-7][01][0-7]\b|[0-7][0-7][0-6]\b)" /etc/login.defs /etc/profile /etc/profile.d /etc/bashrc 2>/dev/null); [ $ok -eq 1 ] && [ -z "$bad" ] && echo compliant || echo noncompliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # make every umask line in the given files at least 027
    tma_umask_fix() { for f in "$@"; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      grep -Eqi '^[[:space:]]*umask[[:space:]]' "$f" || continue
      t=$(mktemp); ch=0
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ $line =~ ^([[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+)0*([0-7]{1,4})([[:space:]#].*)?$ ]]; then
          v=$((8#${BASH_REMATCH[2]})); n=$((v | 8#027))
          if [ "$n" != "$v" ]; then line="${BASH_REMATCH[1]}$(printf '%03o' $n)${BASH_REMATCH[3]}"; ch=1; fi
        elif [[ $line =~ ^[[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+[ugoa]*= ]] && [[ $line =~ (g=[rwx]*w|o=[rwx]*[rwx]) ]]; then
          line="umask 027"; ch=1
        fi
        printf '%s\n' "$line" >> "$t"
      done < "$f"
      if [ $ch = 1 ]; then tma_bak "$f"; cat "$t" > "$f"; fi
      rm -f "$t"
    done; }
    tma_umask_fix /etc/profile /etc/bashrc /etc/bash.bashrc /etc/profile.d/*.sh /etc/login.defs /etc/default/login
    if [ -f /etc/login.defs ]; then tma_bak /etc/login.defs
      sed -i -E '/^[[:space:]]*UMASK[[:space:]]/d' /etc/login.defs; printf 'UMASK\t\t027\n' >> /etc/login.defs; fi
    mkdir -p /etc/profile.d
    printf '# CIS: default umask\numask 027\n' > /etc/profile.d/50-tmaegis-umask.sh
    true
  guidance: "Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/ directory and remove or edit all umask entries to follow local site policy. Any remaining entries should be: umask 027, umask u=rwx,g=rx,o= or more restrictive. Configure umask in one of the following files: • A file in the /etc/profile.d/ directory ending in .sh • /etc/profile • /etc/bashrc Example: # vi /etc/profile.d/set_umask.sh umask 027 Run the following command and remove or modify the umask of any returned files: # grep -RPi '(^|^[^#]*)\\s*umask\\s+([0-7][0-7][01][0-7]\\b|[0-7][0-7][0-7][0-6]\\b|[0- 7][01][0-7]\\b|[0-7][0-7][0- 6]\\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(,o=[rw x]{0,3})?\\b)' /etc/login.defs /etc/profile* /etc/bashrc* Follow one of the following methods ..."
