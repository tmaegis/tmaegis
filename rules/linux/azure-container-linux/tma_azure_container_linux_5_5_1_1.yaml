id: TMA-AZURE-CONTAINER-LINUX-5.5.1.1
title: Ensure password expiration is 365 days or less
description: 'The PASS_MAX_DAYS parameter in /etc/login.defs allows an administrator to force passwords to expire once they reach a defined age. It is recommended that the PASS_MAX_DAYS parameter be set to less than or equal to 365 days. Audit: Passes when PASS_MAX_DAYS in /etc/login.defs and the maximum age of every account with a password in /etc/shadow are between 1 and 365 days.'
target: azure-container-linux
level: 1
severity: high
tags:
- azure-container-linux
- passwords
- aging
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.5.1.1 Ensure password expiration is 365 days or less
audit:
  type: command
  shell: bash
  command: 'bad=0; [ -r /etc/shadow ] || exit 1; v=$(awk ''/^[[:space:]]*PASS_MAX_DAYS[[:space:]]/{print $2}'' /etc/login.defs | tail -1); [ -n "$v" ] && [ "$v" -ge 1 ] && [ "$v" -le 365 ] || bad=1; for x in $(awk -F: ''$2 ~ /^[^*!xX]/ && $2 != "" {print ($5==""?"99999":$5)}'' /etc/shadow); do [ "$x" -ge 1 ] && [ "$x" -le 365 ] || bad=1; done; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    tma_logindefs() { k=$1; v=$2; [ -f /etc/login.defs ] || return 0; tma_bak /etc/login.defs
      sed -i -E "/^[[:space:]]*$k[[:space:]]/d" /etc/login.defs; printf '%s\t%s\n' "$k" "$v" >> /etc/login.defs; }
    tma_today() { echo $(( $(date +%s) / 86400 )); }
    # "user lastchg min max warn inactive" for accounts that have a real password hash
    tma_each_pwuser() { awk -F: '$2 ~ /^[^*!xX]/ && $2 != "" {print $1, $3, $4, $5, $6, $7}' /etc/shadow; }
    N=365
    tma_logindefs PASS_MAX_DAYS $N
    t=$(tma_today)
    tma_each_pwuser | while read -r u lc mn mx wr ia; do
      # skip anyone the new limit would expire within a week: no surprise lock-outs
      [ -n "$lc" ] && [ "$lc" -gt 0 ] || continue
      [ $((lc + N)) -gt $((t + 7)) ] && chage -M $N "$u"
    done
    true
  guidance: "Set the PASS_MAX_DAYS parameter to conform to site policy in /etc/login.defs: PASS_MAX_DAYS 365 Modify user parameters for all users with a password set to match: # chage --maxdays 365 <user>"
