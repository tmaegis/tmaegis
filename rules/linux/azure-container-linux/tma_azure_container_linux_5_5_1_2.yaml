id: TMA-AZURE-CONTAINER-LINUX-5.5.1.2
title: Ensure minimum days between password changes is configured
description: 'The PASS_MIN_DAYS parameter in /etc/login.defs allows an administrator to prevent users from changing their password until a minimum number of days have passed since the last time the user changed their password. It is recommended that PASS_MIN_DAYS parameter be set to 1 or more days. Audit: Passes when PASS_MIN_DAYS in /etc/login.defs and the minimum age of every account with a password in /etc/shadow are 1 day or more.'
target: azure-container-linux
level: 1
severity: high
tags:
- azure-container-linux
- passwords
- aging
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.5.1.2 Ensure minimum days between password changes is configured
audit:
  type: command
  shell: bash
  command: 'bad=0; [ -r /etc/shadow ] || exit 1; v=$(awk ''/^[[:space:]]*PASS_MIN_DAYS[[:space:]]/{print $2}'' /etc/login.defs | tail -1); [ -n "$v" ] && [ "$v" -ge 1 ] || bad=1; for x in $(awk -F: ''$2 ~ /^[^*!xX]/ && $2 != "" {print $4}'' /etc/shadow 2>/dev/null); do [ "$x" -ge 1 ] 2>/dev/null || bad=1; done; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    tma_logindefs() { k=$1; v=$2; [ -f /etc/login.defs ] || return 0; tma_bak /etc/login.defs
      sed -i -E "/^[[:space:]]*$k[[:space:]]/d" /etc/login.defs; printf '%s\t%s\n' "$k" "$v" >> /etc/login.defs; }
    tma_today() { echo $(( $(date +%s) / 86400 )); }
    # "user lastchg min max warn inactive" for accounts that have a real password hash
    tma_each_pwuser() { awk -F: '$2 ~ /^[^*!xX]/ && $2 != "" {print $1, $3, $4, $5, $6, $7}' /etc/shadow; }
    N=1
    tma_logindefs PASS_MIN_DAYS $N
    tma_each_pwuser | while read -r u lc mn mx wr ia; do
      [ -n "$mx" ] && [ "$mx" -lt $N ] && continue
      chage -m $N "$u"
    done
    true
  guidance: "Set the PASS_MIN_DAYS parameter to 1 in /etc/login.defs: PASS_MIN_DAYS 1 Modify user parameters for all users with a password set to match: # chage --mindays 1 <user>"
