id: TMA-AZURE-CONTAINER-LINUX-1.4.4
title: Ensure core dump backtraces are disabled
description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted. It can also be used to glean confidential information from a core file.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- cis-converted
reference: CIS Azure Container Linux Benchmark v1.0.0 - 1.4.4 Ensure core dump backtraces are disabled
audit:
  type: command
  shell: bash
  command: |-
    alt0() { o=$(bash -c '#!/usr/bin/env bash

    {
       a_output=(); a_output2=(); a_parlist=("ProcessSizeMax=0")
       l_systemd_config_file="/etc/systemd/coredump.conf" # Main systemd configuration file
       f_config_file_parameter_chk()
       {
          unset A_out; declare -A A_out # Check config file(s) setting
          while read -r l_out; do
             if [ -n "$l_out" ]; then
                if [[ $l_out =~ ^\s*# ]]; then
                   l_file="${l_out//# /}"
                else
                   l_systemd_parameter="$(awk -F= '"'"'{print $1}'"'"' <<< "$l_out" | xargs)"
                   grep -Piq -- "^\h*$l_systemd_parameter_name\b" <<< "$l_systemd_parameter" && A_out+=(["$l_systemd_parameter"]="$l_file")
                fi
             fi
          done < <("$l_systemdanalyze" cat-config "$l_systemd_config_file" | grep -Pio '"'"'^\h*([^#\n\r]+|#\h*\/[^#\n\r\h]+\.conf\b)'"'"')
          if (( ${#A_out[@]} > 0 )); then # Assess output from files and generate output
             while IFS="=" read -r l_systemd_file_parameter_name l_systemd_file_parameter_value; do
                l_systemd_file_parameter_name="${l_systemd_file_parameter_name// /}"
                l_systemd_file_parameter_value="${l_systemd_file_parameter_value// /}"
                if grep -Piq "\b$l_systemd_parameter_value\b" <<< "$l_systemd_file_parameter_value"; then
                   a_output+=(" - \"$l_systemd_parameter_name\" is correctly set to \"$l_systemd_file_parameter_value\"" \
                   "    in \"$(printf '"'"'%s'"'"' "${A_out[@]}")\"")
                else
                   a_output2+=(" - \"$l_systemd_parameter_name\" is incorrectly set to \"$l_systemd_file_parameter_value\"" \
                   "    in \"$(printf '"'"'%s'"'"' "${A_out[@]}")\" and should have a value matching: \"$l_value_out\"")
                fi
             done < <(grep -Pio -- "^\h*$l_systemd_parameter_name\h*=\h*\H+" "${A_out[@]}")
          else
             a_output2=(" - \"$l_systemd_parameter_name\" is not set in an included file" \
             "   *** Note: \"$l_systemd_parameter_name\" May be set in a file that'"'"'s ignored by load procedure ***")
          fi
       }
       l_systemdanalyze="$(readlink -f /bin/systemd-analyze)"
       while IFS="=" read -r l_systemd_parameter_name l_systemd_parameter_value; do # Assess and check parameters

          l_systemd_parameter_name="${l_systemd_parameter_name// /}"; l_systemd_parameter_value="${l_systemd_parameter_value// /}"
          l_value_out="${l_systemd_parameter_value//-/ through }"; l_value_out="${l_value_out//|/ or }"
          l_value_out="$(tr -d '"'"'(){}'"'"' <<< "$l_value_out")"
          f_config_file_parameter_chk
       done < <(printf '"'"'%s\n'"'"' "${a_parlist[@]}")
       if [ "${#a_output2[@]}" -le 0 ]; then
          printf '"'"'%s\n'"'"' "" "- Audit Result:" "  ** PASS **" "${a_output[@]}" ""
       else
          printf '"'"'%s\n'"'"' "" "- Audit Result:" "  ** FAIL **" " - Reason(s) for audit failure:" "${a_output2[@]}"
          [ "${#a_output[@]}" -gt 0 ] && printf '"'"'%s\n'"'"' "" "- Correctly set:" "${a_output[@]}" ""
       fi
    }' 2>&1); printf '%s\n' "$o" | grep -q '\*\* PASS \*\*' || { echo "step1: script did not report PASS"; return 1; }; }; if alt0; then echo compliant; fi
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; return 0; }
    tma_ini_set() { # file section key value
      local f=$1 s=$2 k=$3 v=$4
      [ -e "$f" ] || { mkdir -p "$(dirname "$f")"; : > "$f"; }
      tma_bak "$f"
      awk -v s="$s" -v k="$k" -v v="$v" '
        function flush() { if (insec && !done) { print k "=" v; done=1 } }
        /^[[:space:]]*\[/ { flush(); insec = ($0 ~ "^[[:space:]]*\\[" s "\\][[:space:]]*$"); print; next }
        insec && $0 ~ "^[[:space:]]*" k "[[:space:]]*=" { if (!done) { print k "=" v; done=1 } ; next }
        { print }
        END { flush(); if (!done) { print "[" s "]"; print k "=" v } }' "$f" > "$f.tma" && cat "$f.tma" > "$f"; rm -f "$f.tma"
    }
    tma_grub_regen() {
      if command -v update-grub >/dev/null 2>&1; then update-grub
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        if [ -f /boot/grub2/grub.cfg ]; then grub2-mkconfig -o /boot/grub2/grub.cfg
        else for c in /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c"; done; fi
      elif command -v grub-mkconfig >/dev/null 2>&1; then
        [ -f /boot/grub/grub.cfg ] && grub-mkconfig -o /boot/grub/grub.cfg
      fi; return 0
    }
    tma_cmdline_rm() { # names of kernel args (name or name=value) to drop from the grub defaults
      local a f c k n
      for a in "$@"; do
        for f in /etc/default/grub /etc/default/grub.d/*.cfg; do
          [ -f "$f" ] || continue
          grep -Eq "^[[:space:]]*GRUB_CMDLINE_LINUX" "$f" || continue
          tma_bak "$f"
          sed -i -E "/^[[:space:]]*GRUB_CMDLINE_LINUX/{ :a; s/([\"' ])${a}(=[^\"' ]*)?([ \"'])/\1\3/; ta; s/  +/ /g; s/ ([\"'])\$/\1/ }" "$f"
        done
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --remove-args="$a" >/dev/null 2>&1
      done
      if command -v grub2-editenv >/dev/null 2>&1; then
        k=$(grub2-editenv - list 2>/dev/null | sed -n 's/^kernelopts=//p')
        if [ -n "$k" ]; then n=$k; for a in "$@"; do n=$(printf '%s' "$n" | sed -E "s/(^| )${a}(=[^ ]*)?( |\$)/ /g"); done
          [ "$n" != "$k" ] && grub2-editenv - set "kernelopts=$n"; fi
      fi
      for c in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg; do
        [ -f "$c" ] || continue
        for a in "$@"; do sed -i -E "/^[[:space:]]*(linux|kernelopts)/ s/(^|[ =])${a}(=[^ ]*)?( |\$)/\1\3/g" "$c"; done
      done
      return 0
    }
    tma_cmdline_set() { # name=value pairs forced into GRUB_CMDLINE_LINUX
      local f=/etc/default/grub kv; [ -f "$f" ] || { echo "no $f"; return 0; }
      for kv in "$@"; do
        tma_cmdline_rm "${kv%%=*}" "${kv%%=*}=[^ \"']*" 2>/dev/null
        tma_bak "$f"
        if grep -Eq '^[[:space:]]*GRUB_CMDLINE_LINUX=' "$f"; then
          sed -i -E "s/^([[:space:]]*GRUB_CMDLINE_LINUX=[\"'])(.*)([\"'])\$/\1\2 ${kv}\3/; s/=([\"']) /=\1/" "$f"
        else printf 'GRUB_CMDLINE_LINUX="%s"\n' "$kv" >> "$f"; fi
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --args="$kv" >/dev/null 2>&1
      done
      return 0
    }
    tma_ini_set /etc/systemd/coredump.conf Coredump ProcessSizeMax 0
  guidance: "Create or edit the file /etc/systemd/coredump.conf, or a file in the /etc/systemd/coredump.conf.d directory ending in .conf. Edit or add the following line in the [Coredump] section: ProcessSizeMax=0 Example: #!/usr/bin/env bash { [ ! -d /etc/systemd/coredump.conf.d/ ] && mkdir /etc/systemd/coredump.conf.d/ if grep -Psq -- '^\\h*\\[Coredump\\]' /etc/systemd/coredump.conf.d/60- coredump.conf; then printf '%s\\n' \"ProcessSizeMax=0\" >> /etc/systemd/coredump.conf.d/60- coredump.conf else printf '%s\\n' \"[Coredump]\" \"ProcessSizeMax=0\" >> /etc/systemd/coredump.conf.d/60-coredump.conf fi }"
