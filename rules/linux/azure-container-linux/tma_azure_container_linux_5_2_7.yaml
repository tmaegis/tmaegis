id: TMA-AZURE-CONTAINER-LINUX-5.2.7
title: Ensure sshd access is configured
description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended that at least one of the following options be leveraged: • AllowUsers: • The AllowUsers variable gives the system administrator the option of allowing specific users to ssh into the system. The list consists of space separated user names. Numeric user IDs are not recognized with this variable. If a system administrator wants to restrict user access further by only allowing the allowed users to log in from a particular host, the entry can be specified in the form of user@host. ... Audit: Passes when the effective sshd configuration (sshd -T, needs root) contains an AllowUsers, AllowGroups, DenyUsers or DenyGroups entry. Whether the lists follow site policy and Match blocks need a manual read.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- ssh
- access
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.2.7 Ensure sshd access is configured
audit:
  type: command
  shell: bash
  command: out=$(sshd -T 2>/dev/null) || exit 1; printf "%s\n" "$out" | grep -Pi -- '^\h*(allow|deny)(users|groups)\h+\H+' >/dev/null && echo compliant || echo noncompliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Edit the /etc/ssh/sshd_config file to set one or more of the parameters above any Include and Match set statements as follows: AllowUsers <userlist> - AND/OR - AllowGroups <grouplist> Note: • First occurrence of an option takes precedence, Match set statements withstanding. If Include locations are enabled, used, and order of precedence is understood in your environment, the entry may be created in a .conf file in an Include directory. • Be advised that these options are "ANDed" together. If both AllowUsers and AllowGroups are set, connections will be limited to the list of users that are also a member of an allowed group. It is recommended that only one be set for clarity and ease of administration. • It is easier to manage an allow list than a deny list. ...'
