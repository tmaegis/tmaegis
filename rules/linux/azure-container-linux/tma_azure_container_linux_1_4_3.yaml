id: TMA-AZURE-CONTAINER-LINUX-1.4.3
title: Ensure core file size is configured
description: 'core - limits the core file size hard - for enforcing hard resource limits. These limits are set by the superuser and enforced by the Kernel. The user cannot raise their requirement of system resources above such values. Audit: Passes when a hard core limit of 0 is set for all users in /etc/security/limits.conf or limits.d and no larger value is configured.'
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- kernel
- core-dumps
reference: CIS Azure Container Linux Benchmark v1.0.0 - 1.4.3 Ensure core file size is configured
audit:
  type: command
  shell: bash
  command: f=$(ls /etc/security/limits.conf /etc/security/limits.d/* 2>/dev/null); [ -n "$f" ] || { echo noncompliant; exit 0; }; grep -Psihq -- "^\h*\*\h+hard\h+core\h+0\b" $f && ! grep -Psihq -- "^\h*\*\h+hard\h+core\h+([1-9]|unlimited)" $f && echo compliant || echo noncompliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    mkdir -p /etc/security/limits.d
    for f in /etc/security/limits.conf /etc/security/limits.d/*.conf; do [ -f "$f" ] && sed -ri '/^\s*[^#[:space:]][^#]*\s+hard\s+core\s+([1-9]|unlimited)/ s/^/# /' "$f"; done
    grep -qsE '^\s*\*\s+hard\s+core\s+0\b' /etc/security/limits.conf /etc/security/limits.d/*.conf || echo '* hard core 0' > /etc/security/limits.d/60-tmaegis-core.conf
    true
  guidance: "1. Run the following command to comment out any entries that include a hard value for core greater than 0 in /etc/security/limits.conf and and file in the /etc/security/limits.d/ directory. Example: # sed -ri '/^\\s*[#\\n\\r]+\\s+hard\\s+core\\h+([1-9][0-9]*)/s/^/# /' /etc/security/limits.conf /etc/security/limits.d/* 2. Create or edit a file in /etc/security/limits.d/ and add the following line: * hard core 0 Example: # printf '%s\\n' \"\" \"* hard core 0\" >> /etc/security/limits.d/60-limits.conf"
