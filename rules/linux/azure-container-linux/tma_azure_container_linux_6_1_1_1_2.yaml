id: TMA-AZURE-CONTAINER-LINUX-6.1.1.1.2
title: Ensure journald log file access is configured
description: Journald will create logfiles that do not already exist on the system. This setting controls what permissions will be applied to these newly created files. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: azure-container-linux
level: 1
severity: medium
tags:
- azure-container-linux
- manual-review
reference: CIS Azure Container Linux Benchmark v1.0.0 - 6.1.1.1.2 Ensure journald log file access is configured
audit:
  type: manual
  command: First determine if there is an override file /etc/tmpfiles.d/systemd.conf. If so, this file will override all default settings as defined in /usr/lib/tmpfiles.d/systemd.conf and should be inspected. If no override file exists, inspect the default /usr/lib/tmpfiles.d/systemd.conf against the site specific requirements. Ensure that file permissions are mode 0640 or more restrictive. ...
remediation:
  type: iac_patch
  command: If the default configuration is not appropriate for the site specific requirements, copy /usr/lib/tmpfiles.d/systemd.conf to /etc/tmpfiles.d/systemd.conf and modify as required. Requirements is either 0640 or site policy if that is less restrictive.
