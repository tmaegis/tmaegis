id: TMA-AZURE-CONTAINER-LINUX-5.5.1.3
title: Ensure password expiration warning days is 7 or more
description: 'The PASS_WARN_AGE parameter in /etc/login.defs allows an administrator to notify users that their password will expire in a defined number of days. It is recommended that the PASS_WARN_AGE parameter be set to 7 or more days. Audit: Passes when PASS_WARN_AGE in /etc/login.defs and the warning period of every account with a password in /etc/shadow are 7 days or more.'
target: azure-container-linux
level: 1
severity: high
tags:
- azure-container-linux
- passwords
- aging
reference: CIS Azure Container Linux Benchmark v1.0.0 - 5.5.1.3 Ensure password expiration warning days is 7 or more
audit:
  type: command
  shell: bash
  command: 'bad=0; [ -r /etc/shadow ] || exit 1; v=$(awk ''/^[[:space:]]*PASS_WARN_AGE[[:space:]]/{print $2}'' /etc/login.defs | tail -1); [ -n "$v" ] && [ "$v" -ge 7 ] || bad=1; for x in $(awk -F: ''$2 ~ /^[^*!xX]/ && $2 != "" {print $6}'' /etc/shadow 2>/dev/null); do [ "$x" -ge 7 ] 2>/dev/null || bad=1; done; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    tma_logindefs() { k=$1; v=$2; [ -f /etc/login.defs ] || return 0; tma_bak /etc/login.defs
      sed -i -E "/^[[:space:]]*$k[[:space:]]/d" /etc/login.defs; printf '%s\t%s\n' "$k" "$v" >> /etc/login.defs; }
    tma_today() { echo $(( $(date +%s) / 86400 )); }
    # "user lastchg min max warn inactive" for accounts that have a real password hash
    tma_each_pwuser() { awk -F: '$2 ~ /^[^*!xX]/ && $2 != "" {print $1, $3, $4, $5, $6, $7}' /etc/shadow; }
    N=7
    tma_logindefs PASS_WARN_AGE $N
    tma_each_pwuser | while read -r u lc mn mx wr ia; do chage -W $N "$u"; done
    true
  guidance: "Set the PASS_WARN_AGE parameter to 7 in /etc/login.defs: PASS_WARN_AGE 7 Modify user parameters for all users with a password set to match: # chage --warndays 7 <user>"
