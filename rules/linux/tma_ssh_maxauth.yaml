id: TMA-LNX-SSH-MAXAUTH
title: Ensure SSH MaxAuthTries is 4 or less
description: Hardens the SSH daemon directive MaxAuthTries.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: medium
tags:
- ssh
- server
reference: CIS Linux Benchmark - Services / SSH Server Configuration (verify section number for your distro release)
audit:
  type: command
  command: sshd -T 2>/dev/null | awk '/^maxauthtries /{ if ($2<=4) print "ok"; else print "too-high" }'
  expected_output: ok
remediation:
  type: file_line
  file_path: /etc/ssh/sshd_config
  match_regex: (?mi)^\s*#?\s*MaxAuthTries\b.*$
  replace_line: MaxAuthTries 4
  verify_cmd: sshd -t -f {file}
  backup_files:
  - /etc/ssh/sshd_config
  insert_at: top
