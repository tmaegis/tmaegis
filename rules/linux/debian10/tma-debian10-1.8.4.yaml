id: TMA-DEBIAN10-1.8.4
title: Ensure GDM screen locks when the user is idle
description: 'GNOME Desktop Manager can make the screen lock automatically whenever the user is idle for some amount of time. • idle-delay=uint32 {n} - Number of seconds of inactivity before the screen goes blank • lock-delay=uint32 {n} - Number of seconds after the screen is blank before locking the screen Example key file: # Specify the dconf path [org/gnome/desktop/session] # Number of seconds of inactivity before the screen goes blank # Set to 0 seconds if you want to deactivate the screensaver. idle-delay=uint32 900 # Specify the dconf path [org/gnome/desktop/screensaver] # Number of seconds after the '
target: linux
os_family:
- debian-10
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 10 Benchmark v2.0.0 ARCHIVE - 1.8.4
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   # Check if GNMOE Desktop Manager is installed.  If package isn'\"'\"'t installed, recommendation is Not Applicable\\n\n   # determine system'\"'\"'s package manager\n   l_pkgoutput=\"\"\n   if command -v dpkg-query > /dev/null 2>&1; then\n      l_pq=\"dpkg-query -W\"\n   elif command -v rpm > /dev/null 2>&1; then\n      l_pq=\"rpm -q\"\n   fi\n   # Check if GDM is installed\n   l_pcl=\"gdm gdm3\" # Space seporated list of packages to check\n   for l_pn in $l_pcl; do\n      $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"$l_pkgoutput\\n - Package: \\\"$l_pn\\\" exists on the system\\n - checking configuration\"\n   done\n   # Check configuration (If applicable)\n   if [ -n \"$l_pkgoutput\" ]; then\n      l_output=\"\" l_output2=\"\"\n      l_idmv=\"900\" # Set for max value for idle-delay in seconds\n      l_ldmv=\"5\" # Set for max value for lock-delay in seconds\n      # Look for idle-delay to determine profile in use, needed\
    \ for remaining tests\n      l_kfile=\"$(grep -Psril '\"'\"'^\\h*idle-delay\\h*=\\h*uint32\\h+\\d+\\b'\"'\"' /etc/dconf/db/*/)\" # Determine file containing idle-delay key\n      if [ -n \"$l_kfile\" ]; then\n         # set profile name (This is the name of a dconf database)\n         l_profile=\"$(awk -F'\"'\"'/'\"'\"' '\"'\"'{split($(NF-1),a,\".\");print a[1]}'\"'\"' <<< \"$l_kfile\")\" #Set the key profile name\n         l_pdbdir=\"/etc/dconf/db/$l_profile.d\" # Set the key file dconf db directory\n         # Confirm that idle-delay exists, includes unit32, and value is between 1 and max value for idle-delay\n         l_idv=\"$(awk -F '\"'\"'uint32'\"'\"' '\"'\"'/idle-delay/{print $2}'\"'\"' \"$l_kfile\" | xargs)\"\n         if [ -n \"$l_idv\" ]; then\n            [ \"$l_idv\" -gt \"0\" -a \"$l_idv\" -le \"$l_idmv\" ] && l_output=\"$l_output\\n - The \\\"idle-delay\\\" option is set to \\\"$l_idv\\\" seconds in \\\"$l_kfile\\\"\"\n            [ \"$l_idv\" = \"0\" ] && l_output2=\"\
    $l_output2\\n - The \\\"idle- delay\\\" option is set to \\\"$l_idv\\\" (disabled) in \\\"$l_kfile\\\"\"\n            [ \"$l_idv\" -gt \"$l_idmv\" ] && l_output2=\"$l_output2\\n - The \\\"idle-delay\\\" option is set to \\\"$l_idv\\\" seconds (greater than $l_idmv) in \\\"$l_kfile\\\"\"\n         else\n            l_output2=\"$l_output2\\n - The \\\"idle-delay\\\" option is not set in \\\"$l_kfile\\\"\"\n         fi\n         # Confirm that lock-delay exists, includes unit32, and value is between 0 and max value for lock-delay\n         l_ldv=\"$(awk -F '\"'\"'uint32'\"'\"' '\"'\"'/lock-delay/{print $2}'\"'\"' \"$l_kfile\" | xargs)\"\n         if [ -n \"$l_ldv\" ]; then\n            [ \"$l_ldv\" -ge \"0\" -a \"$l_ldv\" -le \"$l_ldmv\" ] && l_output=\"$l_output\\n - The \\\"lock-delay\\\" option is set to \\\"$l_ldv\\\"\n seconds in \\\"$l_kfile\\\"\"\n            [ \"$l_ldv\" -gt \"$l_ldmv\" ] && l_output2=\"$l_output2\\n - The \\\"lock-delay\\\" option is set to \\\"$l_ldv\\\" seconds\
    \ (greater than $l_ldmv) in \\\"$l_kfile\\\"\"\n         else\n            l_output2=\"$l_output2\\n - The \\\"lock-delay\\\" option is not set in \\\"$l_kfile\\\"\"\n         fi\n         # Confirm that dconf profile exists\n         if grep -Psq \"^\\h*system-db:$l_profile\" /etc/dconf/profile/*; then\n            l_output=\"$l_output\\n - The \\\"$l_profile\\\" profile exists\"\n         else\n            l_output2=\"$l_output2\\n - The \\\"$l_profile\\\" doesn'\"'\"'t exist\"\n         fi\n         # Confirm that dconf profile database file exists\n         if [ -f \"/etc/dconf/db/$l_profile\" ]; then\n            l_output=\"$l_output\\n - The \\\"$l_profile\\\" profile exists in the dconf database\"\n         else\n            l_output2=\"$l_output2\\n - The \\\"$l_profile\\\" profile doesn'\"'\"'t exist in the dconf database\"\n         fi\n      else\n         l_output2=\"$l_output2\\n - The \\\"idle-delay\\\" option doesn'\"'\"'t exist, remaining tests skipped\"\n      fi\n \
    \  else\n      l_output=\"$l_output\\n - GNOME Desktop Manager package is not installed on the system\\n  - Recommendation is not applicable\"\n   fi\n   # Report results. If no failures output in l_output2, we pass\n   [ -n \"$l_pkgoutput\" ] && echo -e \"\\n$l_pkgoutput\"\n   if [ -z \"$l_output2\" ]; then\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n   else\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - Reason(s) for audit failure:\\n$l_output2\\n\"\n      [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
  requires_file:
  - /usr/sbin/gdm3
  - /usr/sbin/gdm
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; return 0; }
    tma_ini_set() { # file section key value
      local f=$1 s=$2 k=$3 v=$4
      [ -e "$f" ] || { mkdir -p "$(dirname "$f")"; : > "$f"; }
      tma_bak "$f"
      awk -v s="$s" -v k="$k" -v v="$v" '
        function flush() { if (insec && !done) { print k "=" v; done=1 } }
        /^[[:space:]]*\[/ { flush(); insec = ($0 ~ "^[[:space:]]*\\[" s "\\][[:space:]]*$"); print; next }
        insec && $0 ~ "^[[:space:]]*" k "[[:space:]]*=" { if (!done) { print k "=" v; done=1 } ; next }
        { print }
        END { flush(); if (!done) { print "[" s "]"; print k "=" v } }' "$f" > "$f.tma" && cat "$f.tma" > "$f"; rm -f "$f.tma"
    }
    tma_grub_regen() {
      if command -v update-grub >/dev/null 2>&1; then update-grub
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        if [ -f /boot/grub2/grub.cfg ]; then grub2-mkconfig -o /boot/grub2/grub.cfg
        else for c in /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c"; done; fi
      elif command -v grub-mkconfig >/dev/null 2>&1; then
        [ -f /boot/grub/grub.cfg ] && grub-mkconfig -o /boot/grub/grub.cfg
      fi; return 0
    }
    tma_cmdline_rm() { # names of kernel args (name or name=value) to drop from the grub defaults
      local a f c k n
      for a in "$@"; do
        for f in /etc/default/grub /etc/default/grub.d/*.cfg; do
          [ -f "$f" ] || continue
          grep -Eq "^[[:space:]]*GRUB_CMDLINE_LINUX" "$f" || continue
          tma_bak "$f"
          sed -i -E "/^[[:space:]]*GRUB_CMDLINE_LINUX/{ :a; s/([\"' ])${a}(=[^\"' ]*)?([ \"'])/\1\3/; ta; s/  +/ /g; s/ ([\"'])\$/\1/ }" "$f"
        done
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --remove-args="$a" >/dev/null 2>&1
      done
      if command -v grub2-editenv >/dev/null 2>&1; then
        k=$(grub2-editenv - list 2>/dev/null | sed -n 's/^kernelopts=//p')
        if [ -n "$k" ]; then n=$k; for a in "$@"; do n=$(printf '%s' "$n" | sed -E "s/(^| )${a}(=[^ ]*)?( |\$)/ /g"); done
          [ "$n" != "$k" ] && grub2-editenv - set "kernelopts=$n"; fi
      fi
      for c in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg; do
        [ -f "$c" ] || continue
        for a in "$@"; do sed -i -E "/^[[:space:]]*(linux|kernelopts)/ s/(^|[ =])${a}(=[^ ]*)?( |\$)/\1\3/g" "$c"; done
      done
      return 0
    }
    tma_cmdline_set() { # name=value pairs forced into GRUB_CMDLINE_LINUX
      local f=/etc/default/grub kv; [ -f "$f" ] || { echo "no $f"; return 0; }
      for kv in "$@"; do
        tma_cmdline_rm "${kv%%=*}" "${kv%%=*}=[^ \"']*" 2>/dev/null
        tma_bak "$f"
        if grep -Eq '^[[:space:]]*GRUB_CMDLINE_LINUX=' "$f"; then
          sed -i -E "s/^([[:space:]]*GRUB_CMDLINE_LINUX=[\"'])(.*)([\"'])\$/\1\2 ${kv}\3/; s/=([\"']) /=\1/" "$f"
        else printf 'GRUB_CMDLINE_LINUX="%s"\n' "$kv" >> "$f"; fi
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --args="$kv" >/dev/null 2>&1
      done
      return 0
    }
    prof=gdm
    mkdir -p /etc/dconf/profile /etc/dconf/db/$prof.d/locks
    pf() { [ -f "$1" ] || : > "$1"; while IFS= read -r l; do grep -qxF "$l" "$1" || printf '%s\n' "$l" >> "$1"; done; }
    printf '%s\n' 'user-db:user
    system-db:gdm
    file-db:/usr/share/gdm/greeter-dconf-defaults' | pf /etc/dconf/profile/$prof
    cat > /etc/dconf/db/$prof.d/00-screensaver <<'TMAEOF'
    [org/gnome/desktop/session]
    idle-delay=uint32 900

    [org/gnome/desktop/screensaver]
    lock-delay=uint32 5
    lock-enabled=true
    TMAEOF
    printf '%s\n' /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-delay /org/gnome/desktop/screensaver/lock-enabled > /etc/dconf/db/$prof.d/locks/00-screensaver
    command -v dconf >/dev/null 2>&1 && dconf update
    true
  guidance: "Create or edit a file in the /etc/dconf/profile/ and verify it includes the following: user-db:user system-db:{NAME_OF_DCONF_DATABASE} Note: local is the name of a dconf database used in the examples. Example: # echo -e '\\nuser-db:user\\nsystem-db:local' >> /etc/dconf/profile/user Create the directory /etc/dconf/db/{NAME_OF_DCONF_DATABASE}.d/ if it doesn't already exist: Example: # mkdir /etc/dconf/db/local.d Create the key file `/etc/dconf/db/{NAME_OF_DCONF_DATABASE}.d/{FILE_NAME} to provide information for the {NAME_OF_DCONF_DATABASE} database: Example script: #!/usr/bin/env bash { l_key_file=\"/etc/dconf/db/local.d/00-screensaver\" l_idmv=\"900\" # Set max value for idle-delay in seconds (betw…"
