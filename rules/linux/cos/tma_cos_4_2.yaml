id: TMA-COS-4.2
title: Ensure logrotate is configured
description: The system includes the capability of rotating log files regularly to avoid filling up the system with logs or making the logs unmanageably large. By keeping the log files smaller and more manageable, a system administrator can easily archive these files to another system and spend less time looking through inordinately large log files.
target: cos
level: 2
severity: low
tags:
- container-optimized-os
- cos
- logging
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 4.2 Ensure logrotate is configured
audit:
  type: manual
  command: Review /etc/logrotate.conf and /etc/logrotate.d/* and verify logs are rotated according to site policy.
remediation:
  type: iac_patch
  command: Edit /etc/logrotate.conf and /etc/logrotate.d/* to ensure logs are rotated according to site policy. /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make these changes persistent across reboots. The steps mentioned above needs to be performed after every boot.
