id: TMA-COS-6.2.19
title: Ensure no duplicate group names exist
description: Although the groupadd program will not let you create a duplicate group name, it is possible for an administrator to manually edit the /etc/group file and change the group name. If a group is assigned a duplicate group name, it will create and have access to files with the first GID for that group in /etc/group . Effectively, the GID is shared, which is a security problem.
target: cos
level: 1
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 6.2.19 Ensure no duplicate group names exist
audit:
  type: command
  shell: bash
  command: 'cut -d: -f1 /etc/group | sort | uniq -d | grep -q . && echo noncompliant || echo compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Based on the results of the audit script, establish unique names for the user groups. File group ownerships will automatically reflect the change as long as the groups have unique GIDs.
