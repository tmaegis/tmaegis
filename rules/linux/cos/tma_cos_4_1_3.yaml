id: TMA-COS-4.1.3
title: Ensure permissions on all logfiles are configured
description: Log files stored in /var/log/ contain logged information from many services on the system, or on log hosts others as well. It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived and protected.
target: cos
level: 2
severity: low
tags:
- access-control
- container-optimized-os
- cos
- logging
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 4.1.3 Ensure permissions on all logfiles are configured
audit:
  type: manual
  command: 'Run the following command and verify that other has no permissions on any files and group does not have write or execute permissions on any files: # find /var/log -type f -ls'
remediation:
  type: iac_patch
  command: 'Run the following commands to set permissions on all existing log files: find /var/log -type f -exec chmod g-wx,o-rwx "{}" + -o -type d -exec chmod g- w,o-rwx "{}" +'
