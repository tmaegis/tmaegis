id: TMA-COS-5.4
title: Ensure root login is restricted to system console
description: The file /etc/securetty contains a list of valid terminals that may be logged in directly as root. Since the system console has special properties to handle emergency situations, it is important to ensure that the console is in a physically secure location and that unauthorized consoles have not been defined.
target: cos
level: 1
severity: high
tags:
- container-optimized-os
- cos
- logging
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.4 Ensure root login is restricted to system console
audit:
  type: manual
  command: '# cat /etc/securetty'
remediation:
  type: iac_patch
  command: Remove entries for any consoles that are not in a physically secure location.
