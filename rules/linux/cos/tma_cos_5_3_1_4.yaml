id: TMA-COS-5.3.1.4
title: Ensure inactive password lock is 30 days or less
description: User accounts that have been inactive for over a given period of time can be automatically disabled. It is recommended that accounts that are inactive for 30 days after password expiration be disabled. Inactive accounts pose a threat to system security since the users are not logging in to notice failed login attempts or other anomalies.
target: cos
level: 2
severity: high
tags:
- auth
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.3.1.4 Ensure inactive password lock is 30 days or less
audit:
  type: command
  shell: bash
  command: 'bad=0; [ -r /etc/shadow ] || exit 1; v=$(sed -n "s/^INACTIVE=//p" /etc/default/user[a]dd 2>/dev/null | tail -1); [ -n "$v" ] && [ "$v" -ge 0 ] && [ "$v" -le 30 ] || bad=1; for x in $(awk -F: ''$2 ~ /^[^*!xX]/ && $2 != "" {print ($7==""?"-1":$7)}'' /etc/shadow); do [ "$x" -ge 0 ] && [ "$x" -le 30 ] || bad=1; done; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    tma_logindefs() { k=$1; v=$2; [ -f /etc/login.defs ] || return 0; tma_bak /etc/login.defs
      sed -i -E "/^[[:space:]]*$k[[:space:]]/d" /etc/login.defs; printf '%s\t%s\n' "$k" "$v" >> /etc/login.defs; }
    tma_today() { echo $(( $(date +%s) / 86400 )); }
    # "user lastchg min max warn inactive" for accounts that have a real password hash
    tma_each_pwuser() { awk -F: '$2 ~ /^[^*!xX]/ && $2 != "" {print $1, $3, $4, $5, $6, $7}' /etc/shadow; }
    N=30
    [ -f /etc/default/useradd ] || { mkdir -p /etc/default; : > /etc/default/useradd; }
    tma_bak /etc/default/useradd
    sed -i -E '/^[[:space:]]*INACTIVE=/d' /etc/default/useradd; echo "INACTIVE=$N" >> /etc/default/useradd
    t=$(tma_today)
    tma_each_pwuser | while read -r u lc mn mx wr ia; do
      # only where the password is not already expired, so -I cannot lock anyone out now
      if [ -z "$mx" ] || [ "$mx" -ge 99999 ]; then chage -I $N "$u"
      elif [ -n "$lc" ] && [ $((lc + mx + N)) -gt $t ]; then chage -I $N "$u"; fi
    done
    true
  guidance: "Run the following command to set the default password inactivity period to 30 days: # useradd -D -f 30 Modify user parameters for all users with a password set to match: # chage --inactive 30 <user>"
