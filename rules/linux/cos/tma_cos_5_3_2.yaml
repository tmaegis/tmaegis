id: TMA-COS-5.3.2
title: Ensure system accounts are secured
description: There are a number of accounts provided with most distributions that are used to manage applications and are not intended to provide an interactive shell. It is important to make sure that accounts that are not being used by regular users are prevented from being used to provide an interactive shell. By default, most distributions set the password field for these accounts to an invalid string, but it is also recommended that the shell field in the password file be set to the nologin shell. This prevents the account from potentially being used to run any commands.
target: cos
level: 2
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.3.2 Ensure system accounts are secured
audit:
  type: command
  shell: bash
  command: 'min=$(awk ''/^[[:space:]]*UID_MIN/{print $2}'' /etc/login.defs); min=${min:-1000}; shells=$(awk -F/ ''/^\// && $NF != "nologin"'' /etc/shells); bad=0; while IFS=: read -r u p uid g c h sh; do for x in root sync shutdown halt; do [ "$u" = "$x" ] && continue 2; done; case $u in +*) continue;; esac; [ "$uid" -lt "$min" ] 2>/dev/null || continue; printf "%s\n" "$shells" | grep -qxF -- "$sh" && bad=1; done < /etc/passwd; [ $bad -eq 0 ] && echo compliant || echo noncompliant'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    is_valid() { printf '%s\n' "$vs" | grep -qxF -- "$1"; }
    min=$(awk '/^[[:space:]]*UID_MIN/{print $2}' /etc/login.defs 2>/dev/null); min=${min:-1000}
    nl=$(command -v nologin || echo /sbin/nologin)
    while IFS=: read -r u p uid gid c h sh; do
      case "$u" in root|sync|shutdown|halt|+*|-*) continue;; esac
      [ "$uid" -lt "$min" ] 2>/dev/null || continue
      is_valid "$sh" && usermod -s "$nl" "$u"
    done < /etc/passwd
    true
  guidance: "Run the commands appropriate for your distribution: Set the shell for any accounts returned by the audit to nologin: # usermod -s $(which nologin) <user> Lock any non root accounts returned by the audit: # usermod -L <user> The following command will set all system accounts to a non login shell: awk -F: '($1!=\"root\" && $1!=\"sync\" && $1!=\"shutdown\" && $1!=\"halt\" && $1!~/^\\+/ && $3>='\"$(awk '/^\\s*SYS_UID_MIN/{print $2}' /etc/login.defs)\"' && $3<='\"$(awk '/^\\s*SYS_UID_MAX/{print $2}' /etc/login.defs)\"' && $7!=\"'\"$(which nologin)\"'\" && $7!=\"/bin/false\") {print $1}' /etc/passwd | while read user; do usermod -s $(which nologin) $user; done The following command will automatically lock not root system accounts: awk -F: '($1!=\"root\" && $1!~/^\\+/ && $3>='\"$(awk '/^\\s*SYS_UID_MIN/{print $2}' /etc/login.defs)\"' && $3<='\"$(awk '/^\\s*SYS_UID_MAX/{print $2}' /etc/login.defs)\"') {print $1}' /etc/passwd | xargs -I '{}' passwd -S '{}' | awk '($2!=\"L\" && $2!=\"LK\") {print $1}' | while read user; do usermod -L $user; done"
