id: TMA-COS-6.2.7
title: Ensure all users' home directories exist
description: Users can be defined in /etc/passwd without a home directory or with a home directory that does not actually exist. If the user's home directory does not exist or is unassigned, the user will be placed in "/" and will not be able to write any files or have local environment variables set.
target: cos
level: 2
severity: low
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 6.2.7 Ensure all users' home directories exist
audit:
  type: manual
  command: 'Run the following script and verify no results are returned: #!/bin/bash grep -E -v ''^(system-halt|sync|system-shutdown)'' /etc/passwd | awk -F: ''($7 != "''"$(which nologin)"''" && $7 != "/bin/false") { print $1 " " $6 }'' | while read -r user dir; do if [ ! -d "$dir" ]; then echo "The home directory ($dir) of user $user does not exist." fi done'
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    # "user home" for interactive users whose home is a plain user directory
    tma_homes() { while IFS=: read -r u p uid gid c h sh; do
      case "$u" in +*|-*) continue;; esac
      printf '%s\n' "$vs" | grep -qxF -- "$sh" || continue
      case "$h" in /|""|/bin*|/sbin*|/usr*|/etc*|/proc*|/sys*|/dev*|/boot*|/run*|/var/run*) continue;; esac
      echo "$u $h"; done < /etc/passwd; }
    tma_homes | while read -r u h; do
      if [ ! -d "$h" ]; then
        case "$h" in /home/*|/root) ;; *) continue;; esac
        mkdir -p "$h" && chown "$u:$(id -gn "$u")" "$h" && chmod 0750 "$h"
        continue
      fi
      [ "$(stat -Lc %U "$h")" = "$u" ] || chown "$u" "$h"
      mo=$(stat -Lc %a "$h"); chmod "$(printf '%o' $((8#$mo & ~8#027 & 8#7777)))" "$h"
    done
    true
  guidance: "If any users' home directories do not exist, create them and make sure the respective user owns the directory. Users without an assigned home directory should be removed or assigned a home directory as appropriate."
