id: TMA-COS-5.1.2
title: Ensure permissions on SSH private host key files are configured
description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method, the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key should be distributed. If an unauthorized user obtains the private SSH host key file, the host could be impersonated
target: cos
level: 1
severity: medium
tags:
- access-control
- container-optimized-os
- cos
- crypto
- ssh
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.1.2 Ensure permissions on SSH private host key files are configured
