id: TMA-COS-5.1.19
title: Ensure SSH PAM is enabled
description: UsePAM Enables the Pluggable Authentication Module interface. If set to “yes” this will enable PAM authentication using ChallengeResponseAuthentication and PasswordAuthentication in addition to PAM account and session module processing for all authentication types When usePAM is set to yes, PAM runs through account and session types properly. This is important if you want to restrict access to services based off of IP, time or other factors of the account. Additionally, you can make sure users inherit certain environment variables on login or disallow access to the server
target: cos
level: 1
severity: medium
tags:
- container-optimized-os
- cos
- ssh
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.1.19 Ensure SSH PAM is enabled
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v sshd >/dev/null 2>&1 || { echo "step1: sshd not installed"; return 1; }; o=$(bash -c ''sshd -T | grep -i usepam'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''usepam yes'' || { echo step1: missing ''usepam yes''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # tma_sshd_apply "Name value" ... : replace every existing setting, put ours first, validate, reload.
    tma_sshd_apply() {
      c=/etc/ssh/sshd_config
      [ -f "$c" ] || { echo "sshd_config not present, nothing to do"; return 0; }
      files="$c $(ls /etc/ssh/sshd_config.d/*.conf 2>/dev/null)"
      sv=$(mktemp -d)
      for f in $files; do tma_bak "$f"; cp -a "$f" "$sv/$(echo "$f" | tr / _)"; done
      for kv in "$@"; do
        n=${kv%% *}
        for f in $files; do
          [ -L "$f" ] && continue
          sed -i -E "s/^([[:space:]]*$n[[:space:]=].*)$/# tmaegis: \1/I" "$f"
        done
      done
      tmp=$(mktemp); : > "$tmp"
      for kv in "$@"; do printf '%s\n' "$kv" >> "$tmp"; done
      cat "$c" >> "$tmp"; cat "$tmp" > "$c"; rm -f "$tmp"
      if command -v sshd >/dev/null 2>&1 && ! sshd -t 2>/dev/null; then
        echo "sshd -t failed, restoring" >&2
        for f in $files; do cat "$sv/$(echo "$f" | tr / _)" > "$f"; done
        rm -rf "$sv"; return 1
      fi
      rm -rf "$sv"
      for u in sshd ssh; do systemctl reload "$u" 2>/dev/null && break; done
      return 0
    }

    tma_sshd_apply 'UsePAM yes'
  guidance: "Edit the /etc/ssh/sshd_config file to set the parameter as follows: UsePAM yes"
