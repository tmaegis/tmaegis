id: TMA-COS-2.1.1.1
title: Ensure time synchronization is in use
description: System time should be synchronized between all systems in an environment. This is typically done by establishing an authoritative time server or set of servers and having all systems synchronize their clocks to them. Time synchronization is important to support time sensitive security mechanisms like Kerberos and also ensures log files have consistent time records across the enterprise, which aids in forensic investigations.
target: cos
level: 1
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 2.1.1.1 Ensure time synchronization is in use
audit:
  type: manual
  command: 'On physical systems or virtual systems where host based time synchronization is not available verify that chrony is installed with the following command: # grep ''\"name\": \"chrony\"'' /etc/cos-package-info.json "name": "chrony", On virtual systems where host based time synchronization is available consult your virtualization software documentation and verify that host based synchronization is in use.'
remediation:
  type: iac_patch
  command: On physical systems or virtual systems where host based time synchronization is not available update to an image that comes with chrony package installed. On virtual systems where host based time synchronization is available consult your virtualization software documentation and setup host based synchronization.
