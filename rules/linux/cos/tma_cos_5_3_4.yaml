id: TMA-COS-5.3.4
title: Ensure default user umask is 027 or more restrictive
description: The default umask determines the permissions of files created by users. The user creating the file has the discretion of making their files and directories readable by others via the chmod command. Users who wish to allow their files and directories to be readable by others by default may choose a different default umask by inserting the umask command into the standard shell configuration files ( .profile , .bashrc , etc.) in their home directories. Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions. A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022 would make files readable by every user on the system.
target: cos
level: 2
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 5.3.4 Ensure default user umask is 027 or more restrictive
audit:
  type: command
  shell: bash
  command: ok=0; grep -Eiq "^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b" /etc/login.defs 2>/dev/null && ok=1; grep -REiq "^\s*umask\s+(0[0-7][2-7]7|[0-7][2-7]7)\b" /etc/profile /etc/profile.d /etc/bashrc 2>/dev/null && ok=1; bad=$(grep -RPih "(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][0-6]\b|[0-7][01][0-7]\b|[0-7][0-7][0-6]\b)" /etc/login.defs /etc/profile /etc/profile.d /etc/bashrc 2>/dev/null); [ $ok -eq 1 ] && [ -z "$bad" ] && echo compliant || echo noncompliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # make every umask line in the given files at least 027
    tma_umask_fix() { for f in "$@"; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      grep -Eqi '^[[:space:]]*umask[[:space:]]' "$f" || continue
      t=$(mktemp); ch=0
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ $line =~ ^([[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+)0*([0-7]{1,4})([[:space:]#].*)?$ ]]; then
          v=$((8#${BASH_REMATCH[2]})); n=$((v | 8#027))
          if [ "$n" != "$v" ]; then line="${BASH_REMATCH[1]}$(printf '%03o' $n)${BASH_REMATCH[3]}"; ch=1; fi
        elif [[ $line =~ ^[[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+[ugoa]*= ]] && [[ $line =~ (g=[rwx]*w|o=[rwx]*[rwx]) ]]; then
          line="umask 027"; ch=1
        fi
        printf '%s\n' "$line" >> "$t"
      done < "$f"
      if [ $ch = 1 ]; then tma_bak "$f"; cat "$t" > "$f"; fi
      rm -f "$t"
    done; }
    tma_umask_fix /etc/profile /etc/bashrc /etc/bash.bashrc /etc/profile.d/*.sh /etc/login.defs /etc/default/login
    if [ -f /etc/login.defs ]; then tma_bak /etc/login.defs
      sed -i -E '/^[[:space:]]*UMASK[[:space:]]/d' /etc/login.defs; printf 'UMASK\t\t027\n' >> /etc/login.defs; fi
    mkdir -p /etc/profile.d
    printf '# CIS: default umask\numask 027\n' > /etc/profile.d/50-tmaegis-umask.sh
    true
  guidance: "Edit the /etc/bash/bashrc, /etc/profile and /etc/profile.d/*.sh files (and the appropriate files for any other shell supported on your system) and add or edit any umask parameters as follows: umask 027"
