id: TMA-COS-3.3.3
title: Ensure iptables is installed
description: iptables allows configuration of the IPv4 and IPv6 tables in the linux kernel and the rules stored within them. Most firewall configuration utilities operate as a front end to iptables. iptables is required for firewall management and configuration.
target: cos
level: 1
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 3.3.3 Ensure iptables is installed
audit:
  type: manual
  command: 'Run the following command and verify iptables is installed: grep ''\"name\": \"iptables\"'' /etc/cos-package-info.json "name": "iptables"'
remediation:
  type: iac_patch
  command: Update to an OS image that includes the iptables package.
