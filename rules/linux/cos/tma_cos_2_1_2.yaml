id: TMA-COS-2.1.2
title: Ensure X Window System is not installed
description: The X Window System provides a Graphical User Interface (GUI) where users can have multiple windows in which to run programs and various add on. The X Windows system is typically used on workstations where users login, but not on servers where users typically do not login. Unless your organization specifically requires graphical login access via X Windows, remove it to reduce the potential attack surface.
target: cos
level: 1
severity: medium
tags:
- container-optimized-os
- cos
reference: CIS Google Container-Optimized OS Benchmark v1.2.0 - 2.1.2 Ensure X Window System is not installed
audit:
  type: manual
  command: 'Verify X Windows System is not installed. The following command should return empty result. # grep xorg /etc/cos-package-info.json'
remediation:
  type: iac_patch
  command: An OS image update that does not include X Window System is required.
