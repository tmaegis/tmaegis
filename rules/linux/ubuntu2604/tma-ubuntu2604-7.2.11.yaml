id: TMA-UBUNTU2604-7.2.11
title: Ensure local interactive user dot directories access is configured
description: 'While the system administrator can establish secure permissions for users'' "dot" directories, the users can easily override these. Dot directories are the hidden subdirectories within a user''s home directory (their names begin with a .) that hold per- user configuration, state, and credential material. Common examples include: • .ssh — holds the user''s SSH private keys, authorized_keys, known_hosts, and client configuration. Read or write access by other users can lead to credential theft or unauthorized authentication. • .gnupg — holds the user''s GnuPG keyring and trust database. • .config, .'
target: linux
os_family:
- ubuntu-26.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 26.04 LTS Benchmark v1.0.0 - 7.2.11
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output2=()\n   l_maxsize=\"1000\" # Maximum number of local interactive users before warning (Default 1,000)\n   l_valid_shells=\"^($( awk -F\\/ '\"'\"'$NF != \"nologin\" {print}'\"'\"' /etc/shells | sed -rn '\"'\"'/^\\//{s,/,\\\\\\\\/,g;p}'\"'\"' | paste -s -d '\"'\"'|'\"'\"' - ))$\"\n   a_user_and_home=() # Create array with local users and their home directories\n   while read -r l_local_user l_local_user_home; do # Populate array with users and user home location\n      [[ -n \"$l_local_user\" && -n \"$l_local_user_home\" ]] && a_user_and_home+=(\"$l_local_user:$l_local_user_home\")\n   done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '\"'\"'$(NF) ~ pat { print $1 \" \" $(NF-1) }'\"'\"' /etc/passwd)\"\n   l_asize=\"${#a_user_and_home[@]}\" # Here if we want to look at number of users before proceeding\n   [ \"${#a_user_and_home[@]}\" -gt \"$l_maxsize\" ] && printf '\"'\"'%s\\n'\"'\"' \"\" \"  ** INFO **\" \\\n   \"  - \\\
    \"$l_asize\\\" Local interactive users found on the system\" \\\n   \"  - This may be a long running check\" \"\"\n   dir_access_chk()\n   {\n      a_access_out=()\n      l_max=\"$( printf '\"'\"'%o'\"'\"' $(( 0777 & ~$l_mask)) )\"\n      if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n         a_access_out+=(\"  - Directory: \\\"$l_hddir\\\" is mode: \\\"$l_mode\\\" and should be mode: \\\"$l_max\\\" or more restrictive\")\n      fi\n      if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\n         a_access_out+=(\"  - Directory: \\\"$l_hddir\\\" owned by: \\\"$l_owner\\\" and should be owned by \\\"${l_user//|/ or }\\\"\")\n      fi\n      if [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\n         a_access_out+=(\"  - Directory: \\\"$l_hddir\\\" group owned by: \\\"$l_gowner\\\" and should be group owned by \\\"${l_group//|/ or }\\\"\")\n      fi\n   }\n   while IFS=: read -r l_user l_home; do\n      a_hddirout=()\n      # Skip home directories that reside on a network / remote filesystem\n    \
    \  l_fstype=\"$(findmnt -no FSTYPE --target \"$l_home\" 2>/dev/null)\"\n      case \"$l_fstype\" in\n         nfs|nfs4|cifs|smbfs|smb3|fuse.sshfs|afs|ncpfs|glusterfs|ceph)\n            printf '\"'\"'%s\\n'\"'\"' \"\" \"  - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\" skipped (remote/network filesystem: $l_fstype)\"\n            continue ;;\n      esac\n      if [ -d \"$l_home\" ]; then\n         l_group=\"$(id -gn \"$l_user\" | xargs)\";l_group=\"${l_group// /|}\"\n         while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_hddir; do\n            while read -r l_mode l_owner l_gowner; do\n               case \"$(basename \"$l_hddir\")\" in\n                  .ssh )\n                     l_mask='\"'\"'0077'\"'\"'; dir_access_chk\n                     [ \"${#a_access_out[@]}\" -gt 0 ] && a_hddirout+=(\"${a_access_out[@]}\") ;;\n                  * )\n                     l_mask='\"'\"'0027'\"'\"'; dir_access_chk\n                     [ \"${#a_access_out[@]}\" -gt 0 ] && a_hddirout+=(\"\
    ${a_access_out[@]}\") ;;\n               esac\n            done < <(stat -Lc '\"'\"'%#a %U %G'\"'\"' \"$l_hddir\")\n         done < <(find \"$l_home\" -xdev -type d -name '\"'\"'.*'\"'\"' -print0)\n      fi\n      if [ \"${#a_hddirout[@]}\" -gt 0 ]; then\n         a_output2+=(\"  - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\"\" \"${a_hddirout[@]}\")\n      fi\n   done <<< \"$(printf '\"'\"'%s\\n'\"'\"' \"${a_user_and_home[@]}\")\"\n   if [ \"${#a_output2[@]}\" -le 0 ]; then # If a_output2 is empty, we pass\n      printf '\"'\"'%s\\n'\"'\"' \"- Audit Result:\" \"  ** PASS **\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"- Audit Result:\" \"  ** FAIL **\" \"  - * Reasons for audit failure * :\" \"${a_output2[@]}\" \"\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    vs=$(awk -F/ '/^\// && $NF != "nologin"' /etc/shells)
    # "user home" for interactive users whose home is a plain user directory
    tma_homes() { while IFS=: read -r u p uid gid c h sh; do
      case "$u" in +*|-*) continue;; esac
      printf '%s\n' "$vs" | grep -qxF -- "$sh" || continue
      case "$h" in /|""|/bin*|/sbin*|/usr*|/etc*|/proc*|/sys*|/dev*|/boot*|/run*|/var/run*) continue;; esac
      echo "$u $h"; done < /etc/passwd; }
    tma_homes | while read -r u h; do
      [ -d "$h" ] || continue
      g=$(id -gn "$u")
      find "$h" -xdev -type d -name '.*' 2>/dev/null | while read -r f; do
        case "$(basename "$f")" in .ssh) mask=8#0077;; *) mask=8#0027;; esac
        [ "$(stat -Lc %U "$f")" = "$u" ] || chown "$u" "$f"
        [ "$(stat -Lc %G "$f")" = "$g" ] || chgrp "$g" "$f"
        mo=$(stat -Lc %a "$f"); chmod "$(printf '%o' $((8#$mo & ~$mask & 8#7777)))" "$f"
      done
    done
    true
  guidance: "Making global modifications to users' directories without alerting the user community can result in unexpected outages and unhappy users. Therefore, it is recommended that a monitoring policy be established to report user dot directory permissions and determine the action to be taken in accordance with site policy. The following script will, within local interactive users' home directories: • remove excessive permissions on dot directories (max 0750; .ssh max 0700) • change ownership of dot directories to the user • change group ownership of dot directories to the user's primary group Note: Like the audit, this remediation scopes its action to local interactive users' home directories only a…"
