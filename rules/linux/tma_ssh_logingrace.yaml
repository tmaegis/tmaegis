id: TMA-LNX-SSH-LOGINGRACE
title: Ensure SSH LoginGraceTime is 60 seconds or less
description: Hardens the SSH daemon directive LoginGraceTime.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: medium
tags:
- ssh
- server
reference: CIS Linux Benchmark - Services / SSH Server Configuration (verify section number for your distro release)
audit:
  type: command
  command: sshd -T 2>/dev/null | awk '/^logingracetime /{ if ($2>0 && $2<=60) print "ok"; else print "bad" }'
  expected_output: ok
remediation:
  type: file_line
  file_path: /etc/ssh/sshd_config
  match_regex: (?mi)^\s*#?\s*LoginGraceTime\b.*$
  replace_line: LoginGraceTime 60
  verify_cmd: sshd -t -f {file}
  backup_files:
  - /etc/ssh/sshd_config
  insert_at: top
