id: TMA-SLES11-4.2.1.1
title: Ensure rsyslog Service is enabled
description: Once the rsyslog package is installed it needs to be activated.
target: linux
os_family:
- sles-11
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 11 Benchmark v2.1.1 - 4.2.1.1
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v chkconfig >/dev/null 2>&1 || { echo "step1: chkconfig not installed"; return 1; }; o=$(bash -c ''chkconfig --list syslog'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''syslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off'' || { echo step1: missing ''syslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off''; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step2: grep not installed"; return 1; }; o=$(bash -c ''grep ^SYSLOG_DAEMON /etc/sysconfig/syslog'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''SYSLOG_DAEMON="rsyslogd"'' || { echo step2: missing ''SYSLOG_DAEMON="rsyslogd"''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to enable syslog: # chkconfig syslog on Edit the /etc/sysconfig/syslog file and set SYSLOG_DAEMON is set to "rsyslogd": SYSLOG_DAEMON="rsyslogd"'
