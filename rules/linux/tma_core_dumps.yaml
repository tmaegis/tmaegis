id: TMA-LNX-KERN-CORE-LIMIT
title: Ensure core dumps are restricted
description: Hard limit on core dump size should be 0.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: medium
tags:
- kernel
- limits
reference: CIS Linux Benchmark - Initial Setup / Process Hardening
audit:
  type: file_regex
  file_path: /etc/security/limits.conf
  pattern: (?m)^\s*\*\s+hard\s+core\s+0\b
remediation:
  type: file_line
  file_path: /etc/security/limits.conf
  match_regex: (?m)^\s*\*\s+hard\s+core\b.*$
  replace_line: '* hard core 0'
  backup_files:
  - /etc/security/limits.conf
