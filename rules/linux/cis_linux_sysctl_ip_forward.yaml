id: "CIS-LINUX-3.2.1"
title: "Ensure IP forwarding is disabled"
description: "The net.ipv4.ip_forward flag controls whether the system forwards packets. Disable it unless the host is a router."
target: "linux"
os_family:
  - "ubuntu-22.04"
  - "ubuntu-24.04"
  - "rocky-9"
level: 1
severity: "medium"
tags:
  - "network"
  - "sysctl"
reference: "CIS Ubuntu Linux / Rocky Linux Benchmarks - Ensure IP forwarding is disabled (verify section number for your release)"
audit:
  type: "command"
  command: "sysctl -n net.ipv4.ip_forward"
  expected_output: "0"
remediation:
  type: "command"
  command: "sysctl -w net.ipv4.ip_forward=0"
