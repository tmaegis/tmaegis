id: TMA-DEBIAN11-5.4.3.3
title: Ensure default user umask is configured
description: 'The user file-creation mode mask (umask) is used to determine the file permission for newly created directories and files. In Linux, the default permissions for any newly created directory is 0777 (rwxrwxrwx), and for any newly created file it is 0666 (rw-rw- rw-). The umask modifies the default Linux permissions by restricting (masking) these permissions. The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file mode. umask can be set with either Octal or Symbolic values: • Octal (Numeric) Value - Represented by either three or four '
target: linux
os_family:
- debian-11
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 11 Benchmark v2.0.0 - 5.4.3.3
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n    l_output=\"\" l_output2=\"\"\n    file_umask_chk()\n    {\n       if grep -Psiq -- '\"'\"'^\\h*umask\\h+(0?[0-7][2- 7]7|u(=[rwx]{0,3}),g=([rx]{0,2}),o=)(\\h*#.*)?$'\"'\"' \"$l_file\"; then\n          l_output=\"$l_output\\n - umask is set correctly in \\\"$l_file\\\"\"\n       elif grep -Psiq -- '\"'\"'^\\h*umask\\h+(([0-7][0-7][01][0-7]\\b|[0-7][0-7][0- 7][0-6]\\b)|([0-7][01][0-7]\\b|[0-7][0-7][0- 6]\\b)|(u=[rwx]{1,3},)?(((g=[rx]?[rx]?w[rx]?[rx]?\\b)(,o=[rwx]{1,3})?)|((g=[wrx ]{1,3},)?o=[wrx]{1,3}\\b)))'\"'\"' \"$l_file\"; then\n          l_output2=\"$l_output2\\n - umask is incorrectly set in \\\"$l_file\\\"\"\n       fi\n    }\n    while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_file; do\n       file_umask_chk\n    done < <(find /etc/profile.d/ -type f -name '\"'\"'*.sh'\"'\"' -print0)\n    [ -z \"$l_output\" ] && l_file=\"/etc/profile\" && file_umask_chk\n    [ -z \"$l_output\" ] && l_file=\"/etc/bashrc\" && file_umask_chk\n\
    \    [ -z \"$l_output\" ] && l_file=\"/etc/bash.bashrc\" && file_umask_chk\n    [ -z \"$l_output\" ] && l_file=\"/etc/pam.d/postlogin\"\n    if [ -z \"$l_output\" ]; then\n       if grep -Psiq -- '\"'\"'^\\h*session\\h+[^#\\n\\r]+\\h+pam_umask\\.so\\h+([^#\\n\\r]+\\h+)?umask=(0?[0-7][2- 7]7)\\b'\"'\"' \"$l_file\"; then\n          l_output1=\"$l_output1\\n - umask is set correctly in \\\"$l_file\\\"\"\n       elif grep -Psiq '\"'\"'^\\h*session\\h+[^#\\n\\r]+\\h+pam_umask\\.so\\h+([^#\\n\\r]+\\h+)?umask=(([0-7][0- 7][01][0-7]\\b|[0-7][0-7][0-7][0-6]\\b)|([0-7][01][0-7]\\b))'\"'\"' \"$l_file\"; then\n          l_output2=\"$l_output2\\n - umask is incorrectly set in \\\"$l_file\\\"\"\n       fi\n    fi\n    [ -z \"$l_output\" ] && l_file=\"/etc/login.defs\" && file_umask_chk\n    [ -z \"$l_output\" ] && l_file=\"/etc/default/login\" && file_umask_chk\n    [[ -z \"$l_output\" && -z \"$l_output2\" ]] && l_output2=\"$l_output2\\n - umask is not set\"\n    if [ -z \"$l_output2\" ]; then\n \
    \      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n - * Correctly configured * :\\n$l_output\\n\"\n    else\n       echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - * Reasons for audit failure * :\\n$l_output2\"\n       [ -n \"$l_output\" ] && echo -e \"\\n- * Correctly configured * :\\n$l_output\\n\"\n    fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # make every umask line in the given files at least 027
    tma_umask_fix() { for f in "$@"; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      grep -Eqi '^[[:space:]]*umask[[:space:]]' "$f" || continue
      t=$(mktemp); ch=0
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ $line =~ ^([[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+)0*([0-7]{1,4})([[:space:]#].*)?$ ]]; then
          v=$((8#${BASH_REMATCH[2]})); n=$((v | 8#027))
          if [ "$n" != "$v" ]; then line="${BASH_REMATCH[1]}$(printf '%03o' $n)${BASH_REMATCH[3]}"; ch=1; fi
        elif [[ $line =~ ^[[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+[ugoa]*= ]] && [[ $line =~ (g=[rwx]*w|o=[rwx]*[rwx]) ]]; then
          line="umask 027"; ch=1
        fi
        printf '%s\n' "$line" >> "$t"
      done < "$f"
      if [ $ch = 1 ]; then tma_bak "$f"; cat "$t" > "$f"; fi
      rm -f "$t"
    done; }
    tma_umask_fix /etc/profile /etc/bashrc /etc/bash.bashrc /etc/profile.d/*.sh /etc/login.defs /etc/default/login
    if [ -f /etc/login.defs ]; then tma_bak /etc/login.defs
      sed -i -E '/^[[:space:]]*UMASK[[:space:]]/d' /etc/login.defs; printf 'UMASK\t\t027\n' >> /etc/login.defs; fi
    mkdir -p /etc/profile.d
    printf '# CIS: default umask\numask 027\n' > /etc/profile.d/50-tmaegis-umask.sh
    true
  guidance: "Run the following script and perform the instructions in the output: #!/usr/bin/env bash { l_output=\"\" l_output2=\"\" l_out=\"\" file_umask_chk() { if grep -Psiq -- '^\\h*umask\\h+(0?[0-7][2- 7]7|u(=[rwx]{0,3}),g=([rx]{0,2}),o=)(\\h*#.*)?$' \"$l_file\"; then l_out=\"$l_out\\n - umask is set correctly in \\\"$l_file\\\"\" elif grep -Psiq -- '^\\h*umask\\h+(([0-7][0-7][01][0-7]\\b|[0-7][0-7][0- 7][0-6]\\b)|([0-7][01][0-7]\\b|[0-7][0-7][0- 6]\\b)|(u=[rwx]{1,3},)?(((g=[rx]?[rx]?w[rx]?[rx]?\\b)(,o=[rwx]{1,3})?)|((g=[wrx ]{1,3},)?o=[wrx]{1,3}\\b)))' \"$l_file\"; then l_output2=\"$l_output2\\n - \\\"$l_file\\\"\" fi } while IFS= read -r -d $'\\0' l_file; do file_umask_chk done < <(find /etc/profile.d/ -type f -name '*.sh' -print0) …"
