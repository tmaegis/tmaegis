id: TMA-DEBIAN11-1.1.1.5
title: Ensure jffs2 kernel module is not available
description: The jffs2 (journaling flash filesystem 2) filesystem type is a log-structured filesystem used in flash memory devices.
target: linux
os_family:
- debian-11
level: 1
severity: medium
tags:
- cis-converted
- kernel
- linux
- modules
reference: CIS Debian Linux 11 Benchmark v2.0.0 - 1.1.1.5
audit:
  type: command
  shell: bash
  command: m=jffs2; found=$(find /lib/modules/$(uname -r)/kernel /usr/lib/modules/$(uname -r)/kernel -path "*/jffs2*" 2>/dev/null | head -n1); if [ -z "$found" ]; then echo compliant; exit 0; fi; lsmod | awk '{print $1}' | grep -Fxq -- "${m//-/_}" && { echo "$m is loaded"; exit 0; }; cfg=$(modprobe --showconfig 2>/dev/null); printf '%s\n' "$cfg" | grep -Pq -- "^\h*blacklist\h+${m//-/_}\b" || { echo "$m is not blacklisted"; exit 0; }; printf '%s\n' "$cfg" | grep -Pq -- "^\h*install\h+${m//-/_}\h+(/usr)?/bin/(true|false)\b" || { echo "$m install is not disabled"; exit 0; }; echo compliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    m=jffs2
    mkdir -p /etc/modprobe.d
    f=/etc/modprobe.d/60-$m.conf
    printf 'install %s /bin/false\nblacklist %s\n' "$m" "$m" > "$f"
    modprobe -r "$m" 2>/dev/null; rmmod "$m" 2>/dev/null; true
  guidance: "Run the following script to disable the jffs2 module: -IF- the module is available in the running kernel: • Create a file ending in .conf with install jffs2 /bin/false in the /etc/modprobe.d/ directory • Create a file ending in .conf with blacklist jffs2 in the /etc/modprobe.d/ directory • Unload jffs2 from the kernel -IF- available in ANY installed kernel: • Create a file ending in .conf with blacklist jffs2 in the /etc/modprobe.d/ directory -IF- the kernel module is not available on the system or pre-compiled into the kernel: • No remediation is necessary #!/usr/bin/env bash { l_mname=\"jffs2\" # set module name l_mtype=\"fs\" # set module type l_mpath=\"/lib/modules/**/kernel/$l_mtype\" l_mpnam…"
