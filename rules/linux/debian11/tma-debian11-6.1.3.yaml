id: TMA-DEBIAN11-6.1.3
title: Ensure cryptographic mechanisms are used to protect the integrity of audit tools
description: Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
target: linux
os_family:
- debian-11
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Debian Linux 11 Benchmark v2.0.0 - 6.1.3
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   l_output=\"\" l_output2=\"\"\n   f_parameter_chk()\n   {\n      l_out=\"\" l_out2=\"\"\n      for l_string in \"${!A_out[@]}\"; do\n         l_file_parameter=\"$(grep -Po -- \"^\\h*$l_parameter_name\\b.*$\" <<< \"$l_string\")\"\n         if [ -n \"$l_file_parameter\" ]; then\n            l_file=\"$(printf '\"'\"'%s'\"'\"' \"${A_out[$l_file_parameter]}\")\"\n            l_out=\"$l_out\\n  - Exists as: \\\"$l_file_parameter\\n   - in the configuration file: \\\"$l_file\\\"\"\n            for l_var in \"${a_items[@]}\"; do\n               if ! grep -Pq -- \"\\b$l_var\\b\" <<< \"$l_file_parameter\"; then\n                  l_out2=\"$l_out2\\n  - Option: \\\"$l_var\\\" is missing from: \\\"$l_file_parameter\\\" in: \\\"$l_file\\\"\"\n               fi\n            done\n         fi\n      done\n      [ -n \"$l_out\" ] && l_output=\"$l_output\\n - Parameter: \\\"$l_parameter_name\\\":$l_out\"\n      [ -z \"$l_out2\" ] && l_output=\"\
    $l_output\\n    - and includes \\\"$(printf '\"'\"'%s+'\"'\"' \"${a_items[@]}\")\\\"\"\n      [ -n \"$l_out2\" ] && l_output2=\"$l_output2\\n - Parameter: \\\"$l_parameter_name\\\":$l_out2\"\n      [[ -z \"$l_out\" && -z \"$l_out2\" ]] && l_output2=\"$l_output2\\n - Parameter: \\\"$l_parameter_name\\\" is not configured\"\n   }\n   f_check_config()\n   {\n      a_items=(\"p\" \"i\" \"n\" \"u\" \"g\" \"s\" \"b\" \"acl\" \"xattrs\" \"sha512\")\n      a_parlist=(\"/sbin/auditctl\" \"/sbin/auditd\" \"/sbin/ausearch\" \"/sbin/aureport\" \"/sbin/autrace\" \"/sbin/augenrules\")\n      unset A_out; declare -A A_out\n      while IFS= read -r l_out; do\n         if [ -n \"$l_out\" ]; then\n            if [[ $l_out =~ ^\\s*# ]]; then\n               l_file=\"${l_out//# /}\"\n            else\n               l_parameter=\"$l_out\"\n               A_out+=([\"$l_parameter\"]=\"$l_file\")\n            fi\n         fi\n      done < <(/usr/bin/systemd-analyze cat-config \"$l_config_file\" | grep -Pio\
    \ '\"'\"'^\\h*([^#\\n\\r]+|#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b)'\"'\"')\n\n      for l_parameter_name in \"${a_parlist[@]}\"; do\n         if [ -f \"$l_parameter_name\" ]; then\n            f_parameter_chk\n         else\n            l_output=\"$l_output\\n - ** Warning **\\n   Audit tool file: \\\"$l_parameter_name\\\" does not exist\\n   Please verify auditd is installed\"\n         fi\n      done\n   }\n   if [ -f \"/etc/aide/aide.conf\" ]; then\n      l_config_file=\"/etc/aide/aide.conf\" && f_check_config\n   elif [ -f \"/etc/aide.conf\" ]; then\n      l_config_file=\"/etc/aide.conf\" && f_check_config\n   else\n      l_output2=\"$l_output2\\n - AIDE configuration file not found.\\n  Please verify AIDE is installed on the system\"\n   fi\n   unset a_items; unset a_parlist; unset A_out\n   if [ -z \"$l_output2\" ]; then\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n - * Correctly configured * :$l_output\"\n   else\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - * Reasons\
    \ for audit failure * :$l_output2\\n\"\n      [ -n \"$l_output\" ] && echo -e \"\\n - * Correctly configured * :\\n$l_output\\n\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_AUDITD_CONF=/etc/audit/auditd.conf
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; }
    tma_audit_pkg() {
      command -v auditctl >/dev/null 2>&1 && [ -f /etc/audit/auditd.conf ] && return 0
      if command -v apt-get >/dev/null 2>&1; then tma_pkg_install auditd; else tma_pkg_install audit; fi; }
    tma_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo >> "$1"; return 0; }
    tma_kv() { # file key value : 'key = value' style (auditd.conf); replaces every uncommented line
      f=$1; k=$2; v=$3
      [ -f "$f" ] || return 0
      tma_bak "$f"
      if grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$f"; then
        sed -i -E "s|^[[:space:]]*$k[[:space:]]*=.*|$k = $v|" "$f"
      else tma_nl "$f"; printf '%s = %s\n' "$k" "$v" >> "$f"; fi; }
    tma_ini_set() { # file section key value : systemd ini 'Key=value'
      f=$1; s=$2; k=$3; v=$4
      mkdir -p "$(dirname "$f")"; [ -f "$f" ] || : > "$f"; tma_nl "$f"
      sed -i -E "/^[[:space:]]*$k[[:space:]]*=/d" "$f"
      if grep -q "^\[$s\]" "$f"; then sed -i "/^\[$s\]/a $k=$v" "$f"; else printf '[%s]\n%s=%s\n' "$s" "$k" "$v" >> "$f"; fi; }
    tma_clear() { # path octal-mask : remove the mask bits from the file mode
      [ -e "$1" ] || return 0
      m=$(stat -Lc %a "$1")
      [ $((8#$m & 8#$2)) -eq 0 ] || chmod "$(printf '%o' $((8#$m & ~8#$2 & 8#7777)))" "$1"; }
    tma_rule() { # rules.d-filename audit-rule-line : append when missing (whitespace-normalised)
      f=/etc/audit/rules.d/$1; shift; l=$*
      mkdir -p /etc/audit/rules.d; [ -f "$f" ] || : > "$f"
      if ! tr -s ' \t' '  ' < "$f" | sed 's/^ //;s/ $//' | grep -Fxq -- "$l"; then tma_nl "$f"; printf '%s\n' "$l" >> "$f"; fi
      chown root:root "$f"; chmod 640 "$f"; }
    tma_rules_load() { command -v augenrules >/dev/null 2>&1 && augenrules --load >/dev/null 2>&1; true; }
    tma_audit_logdir() {
      d=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs 2>/dev/null)
      [ -n "$d" ] && dirname "$d" || echo /var/log/audit; }
    tma_grub_arg() { # key=value : add/replace in GRUB_CMDLINE_LINUX and regenerate grub.cfg
      a=$1; k=${a%%=*}; g=/etc/default/grub
      [ -f "$g" ] || { echo "no $g: bootloader not managed by grub defaults" >&2; return 0; }
      tma_bak "$g"
      if ! grep -q '^GRUB_CMDLINE_LINUX=' "$g"; then tma_nl "$g"; printf 'GRUB_CMDLINE_LINUX="%s"\n' "$a" >> "$g"
      elif grep -E '^GRUB_CMDLINE_LINUX=' "$g" | grep -Eq "[\"' ]$k(=|[\"' ])"; then
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"' ])$k(=[^\"' ]*)?([\"' ])#\1$a\3#" "$g"
      else
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"'])\$#  $a\1#; /^GRUB_CMDLINE_LINUX=/ s#=([\"'])  #=\1#; /^GRUB_CMDLINE_LINUX=/ s#   *# #g" "$g"
      fi
      if command -v update-grub >/dev/null 2>&1; then update-grub >/dev/null 2>&1
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        for c in /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c" >/dev/null 2>&1; done
      elif command -v grub-mkconfig >/dev/null 2>&1; then grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1; fi
      true; }
    command -v aide >/dev/null 2>&1 || tma_pkg_install aide
    sbin=$(readlink -f /sbin)
    if [ -f /etc/aide.conf ]; then cf=/etc/aide.conf
    elif [ -f /etc/aide/aide.conf ]; then cf=/etc/aide/aide.conf
    else echo "AIDE configuration file not found" >&2; exit 0; fi
    tma_bak "$cf"
    tmp=$cf.tmaegis.new
    grep -Ev '^[[:space:]]*(/usr)?/sbin/(auditctl|auditd|ausearch|aureport|autrace|augenrules)[[:space:]]|^# Audit Tools$' "$cf" > "$tmp"
    tma_nl "$tmp"
    { echo '# Audit Tools'
      for t in auditctl auditd ausearch aureport autrace augenrules; do
        echo "$sbin/$t p+i+n+u+g+s+b+acl+xattrs+sha512"
        [ "$sbin" != /sbin ] && echo "/sbin/$t p+i+n+u+g+s+b+acl+xattrs+sha512"
      done; } >> "$tmp"
    cat "$tmp" > "$cf"; rm -f "$tmp"; true
  guidance: "Edit /etc/aide/aide.conf and add or update the following selection lines: # Audit Tools /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512 /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512 /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512 /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512 /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512 /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512 Note: - IF - /etc/aide/aide.conf includes a @@x_include statement: Example: @@x_include /etc/aide/aide.conf.d ^[a-zA-Z0-9_-]+$ • @@x_include FILE • @@x_include DIRECTORY REGEX o @x_include is identical to @@include, except that if a config file is executable it is run and the output is used as config. o If the executable file exi…"
