id: TMA-SLES12-1.1.2
title: Ensure /tmp is configured
description: 'The /tmp directory is a world-writable directory used for temporary storage by all users and some applications. Note: • If an entry for /tmp exists in /etc/fstab it will take precedence over entries in the tmp.mount file. • tmpfs can be resized using the size={size} parameter in /etc/fstab or on the Options line in the tmp.mount file. If we don''t specify the size, it will be half the RAM. Resize tmpfs examples: • /etc/fstab tmpfs /tmp tmpfs rw,noexec,nodev,nosuid,size=2G 0 0 • tmp.mount [Mount] What=tmpfs Where=/tmp Type=tmpfs Options=mode=1777,strictatime,size=2G,noexec,nodev,nosuid'
target: linux
os_family:
- sles-12
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 12 Benchmark v3.2.0 - 1.1.2
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v mount >/dev/null 2>&1 || { echo "step1: mount not installed"; return 1; }; o=$(bash -c ''mount | grep -E ''"''"''\s/tmp\s''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)'' || { echo step1: missing ''tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    findmnt -kn /tmp >/dev/null 2>&1 && exit 0
    if ! grep -qE '^[^#][^[:space:]]*[[:space:]]+/tmp[[:space:]]' /etc/fstab; then
      cp -a /etc/fstab /etc/fstab.tmaegis.bak.$(date +%Y%m%d%H%M%S)
      echo 'tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0' >> /etc/fstab
    fi
    systemctl unmask tmp.mount 2>/dev/null; systemctl daemon-reload 2>/dev/null
    mount /tmp 2>/dev/null || mount -t tmpfs -o rw,nosuid,nodev,noexec,relatime tmpfs /tmp; true
  guidance: "Create or update an entry for /tmp in either /etc/fstab - OR - in a systemd tmp.mount file: - IF - /etc/fstab is used: • Configure /etc/fstab as appropriate. _ Example:_ tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0 • Run the following command to remount /tmp # mount -o remount,noexec,nodev,nosuid /tmp - OR - - IF - an explicit systemd target is used to mount /tmp:_ • Run the following command to create the file /etc/systemd/system/tmp.mount if it doesn't exist: # [ ! -f /etc/systemd/system/tmp.mount ] && cp -v /usr/share/systemd/tmp.mount /etc/systemd/system/ • Edit the file /etc/systemd/system/tmp.mount: Example tmp.mount file: # This file is part of systemd. # # systemd is…"
