id: TMA-SLES12-1.1.6
title: Ensure /dev/shm is configured
description: '/dev/shm is a traditional shared memory concept. One program will create a memory portion, which other processes (if permitted) can access. If /dev/shm is not configured, tmpfs will be mounted to /dev/shm by systemd. Note: • An entry for /dev/shm in /etc/fstab will take precedence. • tmpfs can be resized using the size={size} parameter in /etc/fstab. If we don''t specify the size, it will be half the RAM. Resize tmpfs example: tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid,size=2G 0 0'
target: linux
os_family:
- sles-12
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 12 Benchmark v3.2.0 - 1.1.6
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v mount >/dev/null 2>&1 || { echo "step1: mount not installed"; return 1; }; o=$(bash -c ''mount | grep -E ''"''"''\s/dev/shm\s''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev,noexec)'' || { echo step1: missing ''tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev,noexec)''; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step2: grep not installed"; return 1; }; o=$(bash -c ''grep -E ''"''"''\s/dev/shm\s''"''"'' /etc/fstab'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid 0 0'' || { echo step2: missing ''tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid 0 0''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    if ! grep -qE '^[^#][^[:space:]]*[[:space:]]+/dev/shm[[:space:]]' /etc/fstab; then
      cp -a /etc/fstab /etc/fstab.tmaegis.bak.$(date +%Y%m%d%H%M%S)
      echo 'tmpfs /dev/shm tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0' >> /etc/fstab
    fi
    if findmnt -kn /dev/shm >/dev/null 2>&1; then mount -o remount,nosuid,nodev,noexec /dev/shm 2>/dev/null
    else mount -t tmpfs -o rw,nosuid,nodev,noexec,relatime tmpfs /dev/shm; fi; true
  guidance: "Edit /etc/fstab and add or edit the following line: tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid 0 0 Run the following command to remount /dev/shm: # mount -o remount,noexec,nodev,nosuid /dev/shm"
