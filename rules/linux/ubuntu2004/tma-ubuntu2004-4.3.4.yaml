id: TMA-UBUNTU2004-4.3.4
title: Ensure a nftables table exists
description: Tables hold chains. Each table only has one address family and only applies to packets of this family. Tables can have one of five families.
target: linux
os_family:
- ubuntu-20.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 20.04 LTS Benchmark v3.0.0 - 4.3.4
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v nft >/dev/null 2>&1 || { echo "step1: nft not installed"; return 1; }; o=$(bash -c ''nft list tables'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''Return should include a list of nftables:'' || { echo step1: missing ''Return should include a list of nftables:''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    tma_listen() { # $1 = 4|6 ; prints "proto port" for non-loopback listeners
      ss -$1tuln 2>/dev/null | awk 'NR>1{p=($1 ~ /^udp/)?"udp":"tcp"; a=$5; sub(/.*:/,"",$5); if (a ~ /^(127\.|\[?::1\]?:)/) next; if ($5 ~ /^[0-9]+$/) print p, $5}' | sort -u; }
    tma_ipt_save() { b=$1; command -v "${b}-save" >/dev/null 2>&1 || return 0
      if [ "$b" = iptables ]; then v=v4; s=iptables; else v=v6; s=ip6tables; fi
      if [ -d /etc/iptables ]; then f=/etc/iptables/rules.$v; elif [ -d /etc/sysconfig ]; then f=/etc/sysconfig/$s; else return 0; fi
      tma_bak "$f"; "${b}-save" > "$f"; }
    tma_ipt_loop() { b=$1; command -v "$b" >/dev/null 2>&1 || tma_pkg_install iptables
      $b -C INPUT -i lo -j ACCEPT 2>/dev/null || $b -I INPUT 1 -i lo -j ACCEPT
      $b -C OUTPUT -o lo -j ACCEPT 2>/dev/null || $b -I OUTPUT 1 -o lo -j ACCEPT
      if [ "$b" = iptables ]; then src=127.0.0.0/8; else src=::1; fi
      $b -C INPUT -s $src -j DROP 2>/dev/null || $b -A INPUT -s $src -j DROP; }
    tma_ipt_ports() { b=$1; if [ "$b" = iptables ]; then v=4; else v=6; fi
      tma_listen $v | while read -r pr po; do
        $b -C INPUT -p "$pr" --dport "$po" -m state --state NEW -j ACCEPT 2>/dev/null || $b -A INPUT -p "$pr" --dport "$po" -m state --state NEW -j ACCEPT
      done; }
    tma_ipt_policy() { b=$1; tma_ipt_loop $b
      $b -C INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || $b -I INPUT 2 -m state --state ESTABLISHED,RELATED -j ACCEPT
      for p in $(tma_ssh_ports); do $b -C INPUT -p tcp --dport "$p" -m state --state NEW -j ACCEPT 2>/dev/null || $b -A INPUT -p tcp --dport "$p" -m state --state NEW -j ACCEPT; done
      tma_ipt_ports $b
      if [ "$b" = ip6tables ]; then $b -C INPUT -p ipv6-icmp -j ACCEPT 2>/dev/null || $b -A INPUT -p ipv6-icmp -j ACCEPT
        $b -C OUTPUT -p ipv6-icmp -j ACCEPT 2>/dev/null || $b -A OUTPUT -p ipv6-icmp -j ACCEPT; fi
      for pr in tcp udp icmp; do [ "$b" = ip6tables ] && [ $pr = icmp ] && continue
        $b -C OUTPUT -p $pr -m state --state NEW,ESTABLISHED -j ACCEPT 2>/dev/null || $b -A OUTPUT -p $pr -m state --state NEW,ESTABLISHED -j ACCEPT; done
      $b -P INPUT DROP; $b -P OUTPUT DROP; $b -P FORWARD DROP; }
    tma_nft_ensure() { command -v nft >/dev/null 2>&1 || tma_pkg_install nftables
      nft list tables 2>/dev/null | grep -q . || nft add table inet filter
      nft list table inet filter >/dev/null 2>&1 || nft add table inet filter
      for h in input forward output; do
        nft list ruleset | grep -q "hook $h" || nft add chain inet filter $h "{ type filter hook $h priority 0; }"
      done; }
    tma_nft_chain() { nft list chain inet filter "$1" 2>/dev/null; }
    tma_nft_add() { # $1 chain, rest = rule; idempotent via exact listing check
      c=$1; shift; tma_nft_chain "$c" >/dev/null || return 0
      nft add rule inet filter "$c" "$@" 2>/dev/null || true; }
    tma_nft_loop() { tma_nft_ensure
      tma_nft_chain input | grep -q 'iif "lo" accept' || nft insert rule inet filter input iif lo accept
      tma_nft_chain input | grep -q 'ip saddr 127.0.0.0/8' || nft add rule inet filter input ip saddr 127.0.0.0/8 counter drop
      if grep -qs '^0$' /sys/module/ipv6/parameters/disable; then
        tma_nft_chain input | grep -q 'ip6 saddr ::1' || nft add rule inet filter input ip6 saddr ::1 counter drop
      fi
      tma_nft_chain output | grep -q 'oif "lo" accept' || nft insert rule inet filter output oif lo accept; }
    tma_nft_save() { nft list table inet filter >/dev/null 2>&1 || return 0
      mkdir -p /etc/nftables.d
      { echo 'table inet filter'; echo 'delete table inet filter'; nft list table inet filter; } > /etc/nftables.d/60-tmaegis.nft
      for mc in /etc/nftables.conf /etc/sysconfig/nftables.conf; do
        [ -f "$mc" ] || continue
        grep -qs 'nftables.d' "$mc" || { tma_bak "$mc"; printf 'include "/etc/nftables.d/*.nft"\n' >> "$mc"; }
      done; }
    tma_nft_policy() { tma_nft_loop
      tma_nft_chain input | grep -q 'ct state established,related accept' || nft add rule inet filter input ct state established,related accept
      for p in $(tma_ssh_ports); do tma_nft_chain input | grep -q "tcp dport $p accept" || nft add rule inet filter input tcp dport "$p" ct state new accept; done
      tma_nft_chain input | grep -q ipv6-icmp || nft add rule inet filter input meta l4proto '{ icmp, ipv6-icmp }' accept
      tma_nft_chain output | grep -q 'ct state established,related,new accept' || nft add rule inet filter output ct state established,related,new accept
      tma_nft_chain output | grep -q 'oif "lo" accept' || nft insert rule inet filter output oif lo accept
      tma_nft_chain output | grep -q ipv6-icmp || nft add rule inet filter output meta l4proto ipv6-icmp accept
      # every base chain of every table except firewalld's
      nft list ruleset | awk '/^table /{fam=$2; t=$3} /^\tchain /{c=$2} /hook (input|forward|output) /{ if (t!="firewalld") print fam, t, c }' | while read -r fam t c; do
        nft chain $fam $t $c '{ policy drop ; }' 2>/dev/null
      done
      tma_nft_save; }
    command -v nft >/dev/null 2>&1 || tma_pkg_install nftables
    nft list tables | grep -q . || nft create table inet filter
    tma_nft_save
  guidance: "Run the following command to create a table in nftables # nft create table inet <table name> Example: # nft create table inet filter"
