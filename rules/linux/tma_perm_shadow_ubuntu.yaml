id: TMA-LNX-PERM-SHADOW-UBUNTU
title: Ensure permissions on /etc/shadow are configured
description: /etc/shadow must be 640 root:shadow.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
level: 1
severity: high
tags:
- permissions
- files
reference: CIS Linux Benchmark - System File Permissions (verify section number for your distro release)
audit:
  type: command
  command: stat -Lc '%a %U %G' /etc/shadow
  expected_output: 640 root shadow
remediation:
  type: command
  command: chown root:shadow /etc/shadow && chmod 640 /etc/shadow
  backup_files: []
