id: TMA-SLES15-1.6.3
title: Ensure system wide crypto policy is not set in sshd configuration
description: System-wide Crypto policy can be over-ridden or opted out of for openSSH
target: linux
os_family:
- sles-15
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 15 Benchmark v2.0.1 - 1.6.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep -Pi ''"''"''^\h*CRYPTO_POLICY\h*=''"''"'' /etc/sysconfig/ssh'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''No output should be returned'' || { echo step1: missing ''No output should be returned''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    for f in /etc/sysconfig/ssh; do [ -f "$f" ] && { cp -a "$f" "$f.tmaegis.bak.$(date +%s)" 2>/dev/null; sed -ri "s/^\s*(CRYPTO_POLICY\s*=.*)$/# \1/" "$f"; }; done
    systemctl reload sshd 2>/dev/null || systemctl reload ssh 2>/dev/null; true
  guidance: "Run the following commands: # sed -ri \"s/^\\s*(CRYPTO_POLICY\\s*=.*)$/# \\1/\" /etc/sysconfig/ssh # systemctl reload sshd"
