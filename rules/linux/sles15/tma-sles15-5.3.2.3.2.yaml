id: TMA-SLES15-5.3.2.3.2
title: Ensure password history is enforced for the root user
description: If the pwhistory enforce_for_root option is enabled, the module will enforce password history for the root user as well
target: linux
os_family:
- sles-15
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 15 Benchmark v2.0.1 - 5.3.2.3.2
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v pam-config >/dev/null 2>&1 || { echo "step1: pam-config not installed"; return 1; }; o=$(bash -c ''pam-config --query --pwhistory --pwhistory-enforce_for_root'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''password: enforce_for_root remember=24'' || { echo step1: missing ''password: enforce_for_root remember=24''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    command -v pam-config >/dev/null 2>&1 && pam-config -a --pwhistory --pwhistory-remember=24 --pwhistory-enforce_for_root; true
  guidance: "Run the following command to add enforce_for_root option: # pam-config -a --pwhistory --pwhistory-enforce_for_root"
