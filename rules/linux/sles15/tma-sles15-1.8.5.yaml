id: TMA-SLES15-1.8.5
title: Ensure GDM screen locks cannot be overridden
description: 'GNOME Desktop Manager can make the screen lock automatically whenever the user is idle for some amount of time. By using the lockdown mode in dconf, you can prevent users from changing specific settings. To lock down a dconf key or subpath, create a locks subdirectory in the keyfile directory. The files inside this directory contain a list of keys or subpaths to lock. Just as with the keyfiles, you may add any number of files to this directory. Example Lock File: # Lock desktop screensaver settings /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-delay'
target: linux
os_family:
- sles-15
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 15 Benchmark v2.0.1 - 1.8.5
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   # Check if GNOME Desktop Manager is installed.  If package isn'\"'\"'t installed, recommendation is Not Applicable\\n\n   # determine system'\"'\"'s package manager\n   l_pkgoutput=\"\"\n   if command -v dpkg-query > /dev/null 2>&1; then\n      l_pq=\"dpkg-query -W\"\n   elif command -v rpm > /dev/null 2>&1; then\n      l_pq=\"rpm -q\"\n   fi\n   # Check if GDM is installed\n   l_pcl=\"gdm gdm3\" # Space separated list of packages to check\n   for l_pn in $l_pcl; do\n      $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"$l_pkgoutput\\n - Package: \\\"$l_pn\\\" exists on the system\\n - checking configuration\"\n   done\n   # Check configuration (If applicable)\n   if [ -n \"$l_pkgoutput\" ]; then\n      l_output=\"\" l_output2=\"\"\n      # Look for idle-delay to determine profile in use, needed for remaining tests\n      l_kfd=\"/etc/dconf/db/$(grep -Psril '\"'\"'^\\h*idle- delay\\h*=\\h*uint32\\h+\\d+\\b'\"'\"' /etc/dconf/db/*/\
    \ | awk -F'\"'\"'/'\"'\"' '\"'\"'{split($(NF- 1),a,\".\");print a[1]}'\"'\"').d\" #set directory of key file to be locked\n      l_kfd2=\"/etc/dconf/db/$(grep -Psril '\"'\"'^\\h*lock- delay\\h*=\\h*uint32\\h+\\d+\\b'\"'\"' /etc/dconf/db/*/ | awk -F'\"'\"'/'\"'\"' '\"'\"'{split($(NF- 1),a,\".\");print a[1]}'\"'\"').d\" #set directory of key file to be locked\n      if [ -d \"$l_kfd\" ]; then # If key file directory doesn'\"'\"'t exist, options can'\"'\"'t be locked\n         if grep -Prilq '\"'\"'\\/org\\/gnome\\/desktop\\/session\\/idle-delay\\b'\"'\"' \"$l_kfd\"; then\n            l_output=\"$l_output\\n - \\\"idle-delay\\\" is locked in \\\"$(grep - Pril '\"'\"'\\/org\\/gnome\\/desktop\\/session\\/idle-delay\\b'\"'\"' \"$l_kfd\")\\\"\"\n         else\n            l_output2=\"$l_output2\\n - \\\"idle-delay\\\" is not locked\"\n         fi\n      else\n         l_output2=\"$l_output2\\n - \\\"idle-delay\\\" is not set so it can not be locked\"\n      fi\n      if [ -d \"$l_kfd2\" ];\
    \ then # If key file directory doesn'\"'\"'t exist, options can'\"'\"'t be locked\n         if grep -Prilq '\"'\"'\\/org\\/gnome\\/desktop\\/screensaver\\/lock-delay\\b'\"'\"' \"$l_kfd2\"; then\n            l_output=\"$l_output\\n - \\\"lock-delay\\\" is locked in \\\"$(grep - Pril '\"'\"'\\/org\\/gnome\\/desktop\\/screensaver\\/lock-delay\\b'\"'\"' \"$l_kfd2\")\\\"\"\n         else\n            l_output2=\"$l_output2\\n - \\\"lock-delay\\\" is not locked\"\n         fi\n      else\n         l_output2=\"$l_output2\\n - \\\"lock-delay\\\" is not set so it can not be locked\"\n      fi\n   else\n      l_output=\"$l_output\\n - GNOME Desktop Manager package is not installed on the system\\n  - Recommendation is not applicable\"\n   fi\n   # Report results. If no failures output in l_output2, we pass\n [ -n \"$l_pkgoutput\" ] && echo -e \"\\n$l_pkgoutput\"\n   if [ -z \"$l_output2\" ]; then\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n   else\n      echo -e \"\\n-\
    \ Audit Result:\\n  ** FAIL **\\n - Reason(s) for audit failure:\\n$l_output2\\n\"\n      [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
  requires_file:
  - /usr/sbin/gdm3
  - /usr/sbin/gdm
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; return 0; }
    tma_ini_set() { # file section key value
      local f=$1 s=$2 k=$3 v=$4
      [ -e "$f" ] || { mkdir -p "$(dirname "$f")"; : > "$f"; }
      tma_bak "$f"
      awk -v s="$s" -v k="$k" -v v="$v" '
        function flush() { if (insec && !done) { print k "=" v; done=1 } }
        /^[[:space:]]*\[/ { flush(); insec = ($0 ~ "^[[:space:]]*\\[" s "\\][[:space:]]*$"); print; next }
        insec && $0 ~ "^[[:space:]]*" k "[[:space:]]*=" { if (!done) { print k "=" v; done=1 } ; next }
        { print }
        END { flush(); if (!done) { print "[" s "]"; print k "=" v } }' "$f" > "$f.tma" && cat "$f.tma" > "$f"; rm -f "$f.tma"
    }
    tma_grub_regen() {
      if command -v update-grub >/dev/null 2>&1; then update-grub
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        if [ -f /boot/grub2/grub.cfg ]; then grub2-mkconfig -o /boot/grub2/grub.cfg
        else for c in /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c"; done; fi
      elif command -v grub-mkconfig >/dev/null 2>&1; then
        [ -f /boot/grub/grub.cfg ] && grub-mkconfig -o /boot/grub/grub.cfg
      fi; return 0
    }
    tma_cmdline_rm() { # names of kernel args (name or name=value) to drop from the grub defaults
      local a f c k n
      for a in "$@"; do
        for f in /etc/default/grub /etc/default/grub.d/*.cfg; do
          [ -f "$f" ] || continue
          grep -Eq "^[[:space:]]*GRUB_CMDLINE_LINUX" "$f" || continue
          tma_bak "$f"
          sed -i -E "/^[[:space:]]*GRUB_CMDLINE_LINUX/{ :a; s/([\"' ])${a}(=[^\"' ]*)?([ \"'])/\1\3/; ta; s/  +/ /g; s/ ([\"'])\$/\1/ }" "$f"
        done
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --remove-args="$a" >/dev/null 2>&1
      done
      if command -v grub2-editenv >/dev/null 2>&1; then
        k=$(grub2-editenv - list 2>/dev/null | sed -n 's/^kernelopts=//p')
        if [ -n "$k" ]; then n=$k; for a in "$@"; do n=$(printf '%s' "$n" | sed -E "s/(^| )${a}(=[^ ]*)?( |\$)/ /g"); done
          [ "$n" != "$k" ] && grub2-editenv - set "kernelopts=$n"; fi
      fi
      for c in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg; do
        [ -f "$c" ] || continue
        for a in "$@"; do sed -i -E "/^[[:space:]]*(linux|kernelopts)/ s/(^|[ =])${a}(=[^ ]*)?( |\$)/\1\3/g" "$c"; done
      done
      return 0
    }
    tma_cmdline_set() { # name=value pairs forced into GRUB_CMDLINE_LINUX
      local f=/etc/default/grub kv; [ -f "$f" ] || { echo "no $f"; return 0; }
      for kv in "$@"; do
        tma_cmdline_rm "${kv%%=*}" "${kv%%=*}=[^ \"']*" 2>/dev/null
        tma_bak "$f"
        if grep -Eq '^[[:space:]]*GRUB_CMDLINE_LINUX=' "$f"; then
          sed -i -E "s/^([[:space:]]*GRUB_CMDLINE_LINUX=[\"'])(.*)([\"'])\$/\1\2 ${kv}\3/; s/=([\"']) /=\1/" "$f"
        else printf 'GRUB_CMDLINE_LINUX="%s"\n' "$kv" >> "$f"; fi
        command -v grubby >/dev/null 2>&1 && grubby --update-kernel ALL --args="$kv" >/dev/null 2>&1
      done
      return 0
    }
    prof=gdm
    mkdir -p /etc/dconf/profile /etc/dconf/db/$prof.d/locks
    pf() { [ -f "$1" ] || : > "$1"; while IFS= read -r l; do grep -qxF "$l" "$1" || printf '%s\n' "$l" >> "$1"; done; }
    printf '%s\n' 'user-db:user
    system-db:gdm
    file-db:/usr/share/gdm/greeter-dconf-defaults' | pf /etc/dconf/profile/$prof
    cat > /etc/dconf/db/$prof.d/00-screensaver <<'TMAEOF'
    [org/gnome/desktop/session]
    idle-delay=uint32 900

    [org/gnome/desktop/screensaver]
    lock-delay=uint32 5
    lock-enabled=true
    TMAEOF
    printf '%s\n' /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-delay /org/gnome/desktop/screensaver/lock-enabled > /etc/dconf/db/$prof.d/locks/00-screensaver
    command -v dconf >/dev/null 2>&1 && dconf update
    true
  guidance: "Run the following script to ensure screen locks cannot be overridden: #!/usr/bin/env bash { # Check if GNMOE Desktop Manager is installed. If package isn't installed, recommendation is Not Applicable\\n # determine system's package manager l_pkgoutput=\"\" if command -v dpkg-query > /dev/null 2>&1; then l_pq=\"dpkg-query -W\" elif command -v rpm > /dev/null 2>&1; then l_pq=\"rpm -q\" fi # Check if GDM is installed l_pcl=\"gdm gdm3\" # Space separated list of packages to check for l_pn in $l_pcl; do $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"y\" && echo -e \"\\n - Package: \\\"$l_pn\\\" exists on the system\\n - remediating configuration if needed\" done # Check configuration (If applicable) if [ -n \"$l_pk…"
