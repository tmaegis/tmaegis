id: TMA-SLES15-2.4.1.4
title: Ensure access to /etc/cron.daily is configured
description: The /etc/cron.daily directory contains system cron jobs that need to run on a daily basis. The files in this directory cannot be manipulated by the crontab command, but are instead edited by system administrators using a text editor. The commands below restrict read/write and search access to user and group root, preventing regular users from accessing this directory.
target: linux
os_family:
- sles-15
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS SUSE Linux Enterprise 15 Benchmark v2.0.1 - 2.4.1.4
audit:
  type: command
  shell: bash
  command: 'alt0() { s=$(stat -Lc ''%a %u %g'' /etc/cron.daily/ 2>&1) || { echo "step1: $s"; return 1; }; set -- $s; m=$((8#$1)); [ $((m & ~0700)) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ] || { echo "step1: /etc/cron.daily/ is mode $1 uid $2 gid $3, want 700 or stricter, uid 0, gid 0"; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
  requires_file:
  - /usr/sbin/cron
  - /usr/sbin/crond
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/cron.daily/
    [ -e "$p" ] || exit 0
    cur=$(stat -Lc %a "$p")
    chmod "$(printf '%o' $((8#$cur & 8#700)))" "$p"
    chown 0:0 "$p"
  guidance: "- IF - cron is installed on the system: Run the following commands to set ownership and permissions on the /etc/cron.daily directory: # chown root:root /etc/cron.daily/ # chmod og-rwx /etc/cron.daily/"
