id: TMA-BOTTLEROCKET-1.6
title: Ensure updates, patches, and additional security software are installed
description: Periodically updates are released for included software either due to security flaws or to include additional functionality. Manual review against site policy.
target: bottlerocket
level: 1
severity: medium
tags:
- bottlerocket
- system
reference: CIS Bottlerocket Benchmark v1.0.0 - 1.6 Ensure updates, patches, and additional security software are installed
audit:
  type: manual
  command: 'Verify there are no updates to install. This command should display a list of available updates and return without error: # apiclient update check'
remediation:
  type: iac_patch
  command: 'Update the software on the system according to site policy. This command will apply the latest available update and reboot the system to apply it if necessary: # apiclient update apply --check --reboot'
