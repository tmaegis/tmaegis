id: TMA-BOTTLEROCKET-1.4.1
title: Ensure setuid programs do not create core dumps
description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted. It can also be used to glean confidential information from a core file. The audit reads /proc/sys/fs/suid_dumpable and requires 0. Run tmaegis on the host through the admin container root shell (sudo sheltie).
target: bottlerocket
level: 1
severity: medium
tags:
- bottlerocket
- system
reference: CIS Bottlerocket Benchmark v1.0.0 - 1.4.1 Ensure setuid programs do not create core dumps
audit:
  type: command
  command: |-
    bad=0
    chk() { f=/proc/sys/$(printf %s "$1" | tr . /); v=$(cat "$f" 2>/dev/null) || { echo "$1: not readable"; bad=1; return; }; [ "$v" = "$2" ] || { echo "$1 = $v (expected $2)"; bad=1; }; }
    chk fs.suid_dumpable 0
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=fs.suid_dumpable; v=0
    f=/etc/sysctl.d/60-tmaegis-$p.conf
    for c in /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf; do
      [ -f "$c" ] && [ "$c" != "$f" ] && [ -w "$c" ] && [ ! -L "$c" ] && sed -i -E "s|^([[:space:]]*$p[[:space:]]*=)|# \1|" "$c"
    done
    printf '%s = %s\n' "$p" "$v" > "$f"
    sysctl -w "$p=$v" >/dev/null 2>&1 || true
    sysctl --system >/dev/null 2>&1 || true; true
  guidance: "Run the following command to set the active kernel parameter and persist the setting: # apiclient apply <<EOF [settings.kernel.sysctl] \"fs.suid_dumpable\" = \"0\" EOF"
