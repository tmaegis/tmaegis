id: TMA-BOTTLEROCKET-1.1.1.1
title: Ensure mounting of udf filesystems is disabled
description: The udf filesystem type is the universal disk format used to implement ISO/IEC 13346 and ECMA-167 specifications. This is an open vendor filesystem type for data storage on a broad range of media. This filesystem type is necessary to support writing DVDs and newer optical disc formats. The audit requires the udf module not to be loaded and blocked (modprobe -n -v shows install /bin/true, or apiclient settings.kernel.modules.udf.allowed is false). Run tmaegis on the host through the admin container root shell (sudo sheltie).
target: bottlerocket
level: 2
severity: low
tags:
- bottlerocket
- system
reference: CIS Bottlerocket Benchmark v1.0.0 - 1.1.1.1 Ensure mounting of udf filesystems is disabled
audit:
  type: command
  command: |-
    grep -qw '^udf' /proc/modules 2>/dev/null && { echo 'udf is loaded'; exit 1; }
    o=$(modprobe -n -v udf 2>&1)
    case "$o" in *'install /bin/true'*|*'install /bin/false'*) echo compliant; exit 0 ;; esac
    a=$(apiclient get settings.kernel.modules.udf.allowed 2>/dev/null) || { echo 'udf can be loaded'; exit 1; }
    printf '%s' "$a" | tr -d ' \n' | grep -q '"allowed":false' && echo compliant || echo 'udf is allowed'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    m=udf
    mkdir -p /etc/modprobe.d
    f=/etc/modprobe.d/60-$m.conf
    printf 'install %s /bin/false\nblacklist %s\n' "$m" "$m" > "$f"
    modprobe -r "$m" 2>/dev/null; rmmod "$m" 2>/dev/null; true
  guidance: "Run the following command to disable the udf module: # apiclient set kernel.modules.udf.allowed=false Run the following command to unload the udf module: # rmmod udf"
