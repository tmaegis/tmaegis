id: TMA-BOTTLEROCKET-3.4.2.2
title: Ensure IPv6 loopback traffic is configured
description: Configure the loopback interface to accept traffic. Configure all other interfaces to deny traffic to the loopback network (::1). The audit runs ip6tables -S and requires the INPUT lo ACCEPT, INPUT ::1 DROP and OUTPUT lo ACCEPT rules (rule order is not verified). Run tmaegis on the host through the admin container root shell (sudo sheltie).
target: bottlerocket
level: 2
severity: low
tags:
- bottlerocket
- network
reference: CIS Bottlerocket Benchmark v1.0.0 - 3.4.2.2 Ensure IPv6 loopback traffic is configured
audit:
  type: command
  command: |-
    in=$(ip6tables -S INPUT 2>/dev/null) || exit 1
    out=$(ip6tables -S OUTPUT 2>/dev/null) || exit 1
    bad=0
    printf '%s\n' "$in" | grep -Eq -- '^-A INPUT -i lo( .*)? -j ACCEPT' || { echo 'missing: -A INPUT -i lo -j ACCEPT'; bad=1; }
    printf '%s\n' "$in" | grep -Eq -- '^-A INPUT -s ::1(/128)?( .*)? -j DROP' || { echo 'missing: -A INPUT -s ::1(/128)? -j DROP'; bad=1; }
    printf '%s\n' "$out" | grep -Eq -- '^-A OUTPUT -o lo( .*)? -j ACCEPT' || { echo 'missing: -A OUTPUT -o lo -j ACCEPT'; bad=1; }
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to implement the loopback rules: # ip6tables -A INPUT -i lo -j ACCEPT # ip6tables -A OUTPUT -o lo -j ACCEPT # ip6tables -A INPUT -s ::1 -j DROP'
