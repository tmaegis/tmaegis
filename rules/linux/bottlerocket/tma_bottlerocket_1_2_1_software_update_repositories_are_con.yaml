id: TMA-BOTTLEROCKET-1.2.1
title: Ensure software update repositories are configured
description: Systems need to have software update repositories configured to ensure they receive the latest updates. Manual review against site policy.
target: bottlerocket
level: 1
severity: medium
tags:
- bottlerocket
- system
reference: CIS Bottlerocket Benchmark v1.0.0 - 1.2.1 Ensure software update repositories are configured
audit:
  type: manual
  command: 'Verify software update repositories are configured correctly. This command should display a list of available updates and return without error: # apiclient update check'
remediation:
  type: iac_patch
  command: Configure your software update repositories according to site policy.
