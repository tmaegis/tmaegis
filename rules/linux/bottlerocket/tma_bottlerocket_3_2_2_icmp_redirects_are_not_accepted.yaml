id: TMA-BOTTLEROCKET-3.2.2
title: Ensure ICMP redirects are not accepted
description: ICMP redirect messages are packets that convey routing information and tell your host (acting as a router) to send packets via an alternate path. It is a way of allowing an outside routing device to update your system routing tables. The audit reads the running values from /proc/sys (IPv6 keys only when IPv6 is enabled). Run tmaegis on the host through the admin container root shell (sudo sheltie).
target: bottlerocket
level: 2
severity: low
tags:
- bottlerocket
- network
reference: CIS Bottlerocket Benchmark v1.0.0 - 3.2.2 Ensure ICMP redirects are not accepted
audit:
  type: command
  command: |-
    bad=0
    chk() { f=/proc/sys/$(printf %s "$1" | tr . /); v=$(cat "$f" 2>/dev/null) || { echo "$1: not readable"; bad=1; return; }; [ "$v" = "$2" ] || { echo "$1 = $v (expected $2)"; bad=1; }; }
    chk net.ipv4.conf.all.accept_redirects 0
    chk net.ipv4.conf.default.accept_redirects 0
    [ -d /proc/sys/net/ipv6 ] && chk net.ipv6.conf.all.accept_redirects 0
    [ -d /proc/sys/net/ipv6 ] && chk net.ipv6.conf.default.accept_redirects 0
    [ "$bad" -eq 0 ] && echo compliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    apiclient apply <<EOF
    [settings.kernel.sysctl]
    "net.ipv4.conf.all.accept_redirects" = "0"
    "net.ipv4.conf.default.accept_redirects" = "0"
    "net.ipv6.conf.all.accept_redirects" = "0"
    "net.ipv6.conf.default.accept_redirects" = "0"
    EOF
  guidance: "Run the following command to set the active kernel parameters and persist the settings: # apiclient apply <<EOF [settings.kernel.sysctl] \"net.ipv4.conf.all.accept_redirects\" = \"0\" \"net.ipv4.conf.default.accept_redirects\" = \"0\" \"net.ipv6.conf.all.accept_redirects\" = \"0\" \"net.ipv6.conf.default.accept_redirects\" = \"0\" EOF Run the following commands to flush the routing caches: # sysctl -w net.ipv4.route.flush=1 # sysctl -w net.ipv6.route.flush=1"
