id: TMA-LNX-AUDIT-ENABLED
title: Ensure auditd service is enabled
description: The auditd service records security-relevant events.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 2
severity: medium
tags:
- logging
- auditd
reference: CIS Linux Benchmark - Logging and Auditing / Configure System Accounting (auditd); requires the auditd package
audit:
  type: command
  command: systemctl is-enabled auditd
  expected_output: enabled
remediation:
  type: command
  command: systemctl enable --now auditd
  verify_cmd: systemctl is-active auditd
