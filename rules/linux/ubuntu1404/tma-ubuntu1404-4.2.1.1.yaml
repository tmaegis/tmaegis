id: TMA-UBUNTU1404-4.2.1.1
title: Ensure rsyslog Service is enabled
description: Once the rsyslog package is installed it needs to be activated.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 4.2.1.1
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v initctl >/dev/null 2>&1 || { echo "step1: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config rsyslog'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- rsyslog || { echo step1: missing rsyslog; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''start on filesystem'' || { echo step1: missing ''start on filesystem''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''stop on runlevel [06]'' || { echo step1: missing ''stop on runlevel [06]''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Set the proper start conditions in /etc/init/rsyslog.conf: start on filesystem'
