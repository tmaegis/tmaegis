id: TMA-UBUNTU1404-2.2.11
title: Ensure IMAP and POP3 server is not enabled
description: dovecot is an open source IMAP and POP3 server for Linux based systems.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 2.2.11
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v initctl >/dev/null 2>&1 || { echo "step1: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config dovecot'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- dovecot || { echo step1: missing dovecot; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Remove or comment out start lines in /etc/init/dovecot.conf: #start on runlevel [2345] Notes: Several IMAP/POP3 servers exist and can use other service names. exim and cyrus-imap are example services that provide an HTTP server. These and other services should also be audited.'
