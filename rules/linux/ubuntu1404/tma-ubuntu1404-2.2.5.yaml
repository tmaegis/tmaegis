id: TMA-UBUNTU1404-2.2.5
title: Ensure DHCP Server is not enabled
description: The Dynamic Host Configuration Protocol (DHCP) is a service that allows machines to be dynamically assigned IP addresses.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 2.2.5
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v initctl >/dev/null 2>&1 || { echo "step1: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config isc-dhcp-server'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- isc-dhcp-server || { echo step1: missing isc-dhcp-server; return 1; }; command -v initctl >/dev/null 2>&1 || { echo "step2: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config isc-dhcp-server6'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- isc-dhcp-server6 || { echo step2: missing isc-dhcp-server6; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Remove or comment out start lines in /etc/init/isc-dhcp-server.confand /etc/init/isc-dhcp-server6.conf: #start on runlevel [2345]'
