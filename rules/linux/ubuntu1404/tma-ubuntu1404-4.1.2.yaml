id: TMA-UBUNTU1404-4.1.2
title: Ensure auditd service is enabled
description: Turn on the auditd daemon to record system events.
target: linux
os_family:
- ubuntu-14.04
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 4.1.2
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v ls >/dev/null 2>&1 || { echo "step1: ls not installed"; return 1; }; o=$(bash -c ''ls /etc/rc*.d/S*auditd /etc/rc2.d/S37auditd  /etc/rc3.d/S37auditd  /etc/rc4.d/S37auditd /etc/rc5.d/S37auditd'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''Start links should exist for run levels 2, 3, 4, and 5.'' || { echo step1: missing ''Start links should exist for run levels 2, 3, 4, and 5.''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to enable auditd: # update-rc.d auditd enable'
