id: TMA-UBUNTU1404-2.2.13
title: Ensure HTTP Proxy Server is not enabled
description: Squid is a standard proxy server used in many distributions and environments.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 2.2.13
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v initctl >/dev/null 2>&1 || { echo "step1: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config squid3'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- squid3 || { echo step1: missing squid3; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Remove or comment out start lines in /etc/init/squid3.conf: #start on runlevel [2345]'
