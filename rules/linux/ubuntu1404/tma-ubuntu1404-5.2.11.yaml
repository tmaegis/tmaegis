id: TMA-UBUNTU1404-5.2.11
title: Ensure only approved MAC algorithms are used
description: This variable limits the types of MAC algorithms that SSH can use during communication.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 5.2.11
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep "MACs" /etc/ssh/sshd_config'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-'' || { echo step1: missing ''MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh''; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com,curve25519- || { echo step1: missing etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh; return 1; }; printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- sha256@libssh.org,diffie-hellman-group-exchange-sha256 || { echo step1: missing sha256@libssh.org,diffie-hellman-group-exchange-sha256; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Edit the /etc/ssh/sshd_config file to set the parameter as follows: MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128- etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com'
