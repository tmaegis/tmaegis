id: TMA-UBUNTU1404-2.2.9
title: Ensure FTP Server is not enabled
description: The File Transfer Protocol (FTP) provides networked computers with the ability to transfer files.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 2.2.9
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v initctl >/dev/null 2>&1 || { echo "step1: initctl not installed"; return 1; }; o=$(bash -c ''initctl show-config vsftpd'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- vsftpd || { echo step1: missing vsftpd; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Remove or comment out start lines in /etc/init/vsftpd.conf: #start on runlevel [2345] or net-device-up IFACE!=lo Notes: Additional FTP servers also exist and should be audited.'
