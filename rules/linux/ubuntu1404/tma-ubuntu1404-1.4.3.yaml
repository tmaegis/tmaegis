id: TMA-UBUNTU1404-1.4.3
title: Ensure authentication required for single user mode
description: Single user mode is used for recovery when the system detects an issue during boot or by manual selection from the bootloader.
target: linux
os_family:
- ubuntu-14.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 14.04 LTS Benchmark v2.1.0 ARCHIVE - 1.4.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep ^root:[*\!]: /etc/shadow'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''No results should be returned.'' || { echo step1: missing ''No results should be returned.''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command and follow the prompts to set a password for the rootuser: # passwd root'
