id: TMA-OL6-1.7.4
title: Ensure permissions on /etc/motd are configured
description: The contents of the /etc/motd file are displayed to users after login and function as a message of the day for authenticated users.
target: linux
os_family:
- ol-6
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 6 Benchmark v2.0.0 - 1.7.4
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v stat >/dev/null 2>&1 || { echo "step1: stat not installed"; return 1; }; o=$(bash -c ''stat /etc/motd'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''Access: (0644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)'' || { echo step1: missing ''Access: (0644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=/etc/motd
    [ -e "$p" ] || exit 0
    chown root:root "$p" 2>/dev/null || chown root "$p"
    chmod 644 "$p"
  guidance: "Run the following commands to set permissions on /etc/motd : # chown root:root /etc/motd # chmod u-x,go-wx /etc/motd"
