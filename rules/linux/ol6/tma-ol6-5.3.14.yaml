id: TMA-OL6-5.3.14
title: Ensure only strong Ciphers are used
description: 'This variable limits the ciphers that SSH can use during communication. Notes: • Some organizations may have stricter requirements for approved ciphers. Ensure that ciphers used are in compliance with site policy. • The only "strong" ciphers currently FIPS 140-2 compliant are: aes256-ctr,aes192- ctr,aes128-ctr'
target: linux
os_family:
- ol-6
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 6 Benchmark v2.0.0 - 5.3.14
audit:
  type: command
  shell: bash
  command: 'alt0() { o=$(bash -c ''sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname) /etc/hosts | awk ''"''"''{print $1}''"''"'')" | grep -Ei ''"''"''^\s*ciphers\s+([^#]+,)?(3des- cbc|aes128-cbc|aes192-cbc|aes256-cbc|arcfour|arcfour128|arcfour256|blowfish- cbc|cast128-cbc|rijndael-cbc@lysator.liu.se)\b''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Edit the /etc/ssh/sshd_config file add/modify the Ciphers line to contain a comma separated list of the site approved ciphers Example: Ciphers aes256-ctr,aes192-ctr,aes128-ctr'
