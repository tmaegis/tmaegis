id: TMA-OL6-2.2.17
title: Ensure rpcbind is not installed or the rpcbind service is disabled
description: The rpcbind utility maps RPC services to the ports on which they listen. RPC processes notify rpcbind when they start, registering the ports they are listening on and the RPC program numbers they expect to serve. The client system then contacts rpcbind on the server with a particular RPC program number. The rpcbind service redirects the client to the proper port number so it can communicate with the requested service Portmapper is an RPC service, which always listens on tcp and udp 111, and is used to map other RPC services (such as nfs, nlockmgr, quotad, mountd, etc.) to their corresponding p
target: linux
os_family:
- ol-6
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 6 Benchmark v2.0.0 - 2.2.17
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v rpm >/dev/null 2>&1 || { echo "step1: rpm not installed"; return 1; }; o=$(bash -c ''rpm -q rpcbind'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''package rpcbind is not installed'' || { echo step1: missing ''package rpcbind is not installed''; return 1; }; }; alt1() { command -v chkconfig >/dev/null 2>&1 || { echo "step1: chkconfig not installed"; return 1; }; o=$(bash -c ''chkconfig --list rpcbind'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''rpcbind 0:off 1:off 2:off 3:off 4:off 5:off 6:off'' || { echo step1: missing ''rpcbind 0:off 1:off 2:off 3:off 4:off 5:off 6:off''; return 1; }; }; if alt0 || alt1; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to remove rpcbind # yum remove rpcbind OR if the rpcbind package is required as a dependency: Run the following commands to disable rpcbind: # chkconfig rpcbind off'
