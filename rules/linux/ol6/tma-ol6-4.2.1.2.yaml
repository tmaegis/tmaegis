id: TMA-OL6-4.2.1.2
title: Ensure rsyslog Service is enabled
description: Once the rsyslog package is installed it needs to be activated.
target: linux
os_family:
- ol-6
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 6 Benchmark v2.0.0 - 4.2.1.2
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v chkconfig >/dev/null 2>&1 || { echo "step1: chkconfig not installed"; return 1; }; o=$(bash -c ''chkconfig --list rsyslog'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''rsyslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off'' || { echo step1: missing ''rsyslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to enable rsyslog : # chkconfig rsyslog on'
