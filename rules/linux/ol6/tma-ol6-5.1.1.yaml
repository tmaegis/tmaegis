id: TMA-OL6-5.1.1
title: Ensure cron daemon is enabled
description: The cron daemon is used to execute batch jobs on the system.
target: linux
os_family:
- ol-6
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 6 Benchmark v2.0.0 - 5.1.1
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v chkconfig >/dev/null 2>&1 || { echo "step1: chkconfig not installed"; return 1; }; o=$(bash -c ''chkconfig --list crond'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''crond 0:off 1:off 2:on 3:on 4:on 5:on 6:off'' || { echo step1: missing ''crond 0:off 1:off 2:on 3:on 4:on 5:on 6:off''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    chkconfig crond on
    service crond start 2>/dev/null; true
  guidance: "Run the following command to enable cron : # chkconfig crond on"
