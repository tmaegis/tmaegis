id: TMA-UBUNTU2204-6.1.3.1
title: Ensure access to all logfiles has been configured
description: Log files contain information from many services on the the local system, or in the event of a centralized log server, others systems logs as well. In general log files are found in /var/log/, although application can be configured to store logs elsewhere. Should your application store logs in another, ensure to run the same test on that location.
target: linux
os_family:
- ubuntu-22.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 22.04 LTS Benchmark v3.0.0 - 6.1.3.1
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output=(); a_output2=()\n   f_file_test_chk()\n   {\n      a_out2=()\n      maxperm=\"$( printf '\"'\"'%o'\"'\"' $(( 0777 & ~$perm_mask)) )\"\n      [ $(( $l_mode & $perm_mask )) -gt 0 ] && \\\n         a_out2+=(\"   o Mode: \\\"$l_mode\\\" should be \\\"$maxperm\\\" or more restrictive\")\n      [[ ! \"$l_user\" =~ $l_auser ]] && \\\n         a_out2+=(\"   o Owned by: \\\"$l_user\\\" and should be owned by \\\"${l_auser//|/ or }\\\"\")\n      [[ ! \"$l_group\" =~ $l_agroup ]] && \\\n         a_out2+=(\"   o Group owned by: \\\"$l_group\\\" and should be group owned by \\\"${l_agroup//|/ or }\\\"\")\n      [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\" - File: \\\"$l_fname\\\" is:\" \"${a_out2[@]}\")\n   }\n   while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_file; do\n      while IFS=: read -r l_fname l_mode l_user l_group; do\n         if grep -Pq -- '\"'\"'\\/(apt)\\h*$'\"'\"' <<< \"$(dirname \"$l_fname\")\"; then\n            perm_mask='\"\
    '\"'0133'\"'\"' l_auser=\"root\" l_agroup=\"(root|adm)\"; f_file_test_chk\n         else\n            case \"$(basename \"$l_fname\")\" in\n               lastlog | lastlog.* | wtmp | wtmp.* | wtmp-* | btmp | btmp.* | btmp-* | README)\n                  perm_mask='\"'\"'0113'\"'\"' l_auser=\"root\" l_agroup=\"(root|utmp)\"\n                  f_file_test_chk ;;\n               cloud-init.log* | localmessages* | waagent.log*)\n                  perm_mask='\"'\"'0133'\"'\"' l_auser=\"(root|syslog)\" l_agroup=\"(root|adm)\"\n                  file_test_chk ;;\n               secure{,*.*,.*,-*} | auth.log | syslog | messages)\n                  perm_mask='\"'\"'0137'\"'\"' l_auser=\"(root|syslog)\" l_agroup=\"(root|adm)\"\n                  f_file_test_chk ;;\n               SSSD | sssd)\n                  perm_mask='\"'\"'0117'\"'\"' l_auser=\"(root|SSSD)\" l_agroup=\"(root|SSSD)\"\n                  f_file_test_chk ;;\n               gdm | gdm3)\n                  perm_mask='\"'\"'0117'\"\
    '\"' l_auser=\"root\" l_agroup=\"(root|gdm|gdm3)\"\n                  f_file_test_chk ;;\n               *.journal | *.journal~)\n                  perm_mask='\"'\"'0137'\"'\"' l_auser=\"root\" l_agroup=\"(root|systemd-journal)\"\n                  f_file_test_chk ;;\n               *)\n                  perm_mask='\"'\"'0137'\"'\"' l_auser=\"(root|syslog)\" l_agroup=\"(root|adm)\"\n                  if [ \"$l_user\" = \"root\" ] || ! grep -Pq -- \"^\\h*$(awk -F: '\"'\"'$1==\"'\"'\"'\"$l_user\"'\"'\"'\" {print $7}'\"'\"' /etc/passwd)\\b\" /etc/shells; then\n                     ! grep -Pq -- \"$l_auser\" <<< \"$l_user\" && l_auser=\"(root|syslog|$l_user)\"\n                     ! grep -Pq -- \"$l_agroup\" <<< \"$l_group\" && l_agroup=\"(root|adm|$l_group)\"\n                  fi\n                  f_file_test_chk ;;\n            esac\n         fi\n      done < <(stat -Lc '\"'\"'%n:%#a:%U:%G'\"'\"' \"$l_file\")\n   done < <(find -L /var/log -type f \\( -perm /0137 -o ! -user root -o !\
    \ -group root \\) -print0)\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      a_output+=(\"  - All files in \\\"/var/log/\\\" have appropriate permissions and ownership\")\n      printf '\"'\"'\\n%s'\"'\"' \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\" \"\"\n   else\n      printf '\"'\"'\\n%s'\"'\"' \"- Audit Result:\" \"  ** FAIL **\" \" - Reason(s) for audit failure:\" \"${a_output2[@]}\" \"\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
  requires_file:
  - /usr/sbin/gdm3
  - /usr/sbin/gdm
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_AUDITD_CONF=/etc/audit/auditd.conf
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; }
    tma_audit_pkg() {
      command -v auditctl >/dev/null 2>&1 && [ -f /etc/audit/auditd.conf ] && return 0
      if command -v apt-get >/dev/null 2>&1; then tma_pkg_install auditd; else tma_pkg_install audit; fi; }
    tma_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo >> "$1"; return 0; }
    tma_kv() { # file key value : 'key = value' style (auditd.conf); replaces every uncommented line
      f=$1; k=$2; v=$3
      [ -f "$f" ] || return 0
      tma_bak "$f"
      if grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$f"; then
        sed -i -E "s|^[[:space:]]*$k[[:space:]]*=.*|$k = $v|" "$f"
      else tma_nl "$f"; printf '%s = %s\n' "$k" "$v" >> "$f"; fi; }
    tma_ini_set() { # file section key value : systemd ini 'Key=value'
      f=$1; s=$2; k=$3; v=$4
      mkdir -p "$(dirname "$f")"; [ -f "$f" ] || : > "$f"; tma_nl "$f"
      sed -i -E "/^[[:space:]]*$k[[:space:]]*=/d" "$f"
      if grep -q "^\[$s\]" "$f"; then sed -i "/^\[$s\]/a $k=$v" "$f"; else printf '[%s]\n%s=%s\n' "$s" "$k" "$v" >> "$f"; fi; }
    tma_clear() { # path octal-mask : remove the mask bits from the file mode
      [ -e "$1" ] || return 0
      m=$(stat -Lc %a "$1")
      [ $((8#$m & 8#$2)) -eq 0 ] || chmod "$(printf '%o' $((8#$m & ~8#$2 & 8#7777)))" "$1"; }
    tma_rule() { # rules.d-filename audit-rule-line : append when missing (whitespace-normalised)
      f=/etc/audit/rules.d/$1; shift; l=$*
      mkdir -p /etc/audit/rules.d; [ -f "$f" ] || : > "$f"
      if ! tr -s ' \t' '  ' < "$f" | sed 's/^ //;s/ $//' | grep -Fxq -- "$l"; then tma_nl "$f"; printf '%s\n' "$l" >> "$f"; fi
      chown root:root "$f"; chmod 640 "$f"; }
    tma_rules_load() { command -v augenrules >/dev/null 2>&1 && augenrules --load >/dev/null 2>&1; true; }
    tma_audit_logdir() {
      d=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs 2>/dev/null)
      [ -n "$d" ] && dirname "$d" || echo /var/log/audit; }
    tma_grub_arg() { # key=value : add/replace in GRUB_CMDLINE_LINUX and regenerate grub.cfg
      a=$1; k=${a%%=*}; g=/etc/default/grub
      [ -f "$g" ] || { echo "no $g: bootloader not managed by grub defaults" >&2; return 0; }
      tma_bak "$g"
      if ! grep -q '^GRUB_CMDLINE_LINUX=' "$g"; then tma_nl "$g"; printf 'GRUB_CMDLINE_LINUX="%s"\n' "$a" >> "$g"
      elif grep -E '^GRUB_CMDLINE_LINUX=' "$g" | grep -Eq "[\"' ]$k(=|[\"' ])"; then
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"' ])$k(=[^\"' ]*)?([\"' ])#\1$a\3#" "$g"
      else
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"'])\$#  $a\1#; /^GRUB_CMDLINE_LINUX=/ s#=([\"'])  #=\1#; /^GRUB_CMDLINE_LINUX=/ s#   *# #g" "$g"
      fi
      if command -v update-grub >/dev/null 2>&1; then update-grub >/dev/null 2>&1
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        for c in /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c" >/dev/null 2>&1; done
      elif command -v grub-mkconfig >/dev/null 2>&1; then grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1; fi
      true; }
    # mirrors the CIS per-file policy: mask = mode bits to strip; users/groups = accepted owners
    find -L /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) 2>/dev/null | while IFS= read -r f; do
      mode=$(stat -Lc %a "$f"); u=$(stat -Lc %U "$f"); g=$(stat -Lc %G "$f"); b=${f##*/}; dir=$(dirname "$f")
      mask=137; au=" root syslog "; ag=" root adm "
      case "$dir" in */apt) mask=133; au=" root "; ag=" root adm "; b="";; esac
      case "$b" in
        lastlog|lastlog.*|wtmp|wtmp.*|wtmp-*|btmp|btmp.*|btmp-*|README) mask=113; au=" root "; ag=" root utmp ";;
        SSSD|sssd) mask=117; au=" root SSSD "; ag=" root SSSD ";;
        gdm|gdm3) mask=117; au=" root "; ag=" root gdm gdm3 ";;
        *.journal|*.journal~) mask=137; au=" root "; ag=" root systemd-journal ";;
        cloud-init.log*|localmessages*|waagent.log*) mask=133;;
        secure|secure.*|secure-*|auth.log|syslog|messages) mask=137;;
        *) # service accounts without a login shell may own their own logs
           sh=$(awk -F: -v u="$u" '$1==u{print $7}' /etc/passwd)
           if [ "$u" = root ] || ! grep -Fxq -- "$sh" /etc/shells 2>/dev/null; then
             case "$au" in *" $u "*) ;; *) au="$au$u ";; esac
             case "$ag" in *" $g "*) ;; *) ag="$ag$g ";; esac
           fi;;
      esac
      [ $((8#$mode & 8#$mask)) -eq 0 ] || chmod "$(printf '%o' $((8#$mode & ~8#$mask & 8#7777)))" "$f"
      case "$au" in *" $u "*) ;; *) chown root "$f";; esac
      case "$ag" in *" $g "*) ;; *) chgrp root "$f";; esac
    done
    true
  guidance: "Run the following script to update permissions and ownership on files in /var/log. Although the script is not destructive, ensure that the output is captured in the event that the remediation causes issues. #!/usr/bin/env bash { a_output2=() f_file_test_fix() { a_out2=() maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask)) )\" if [ $(( $l_mode & $perm_mask )) -gt 0 ]; then a_out2+=(\" o Mode: \\\"$l_mode\\\" should be \\\"$maxperm\\\" or more restrictive\" \" x Removing excess permissions\") chmod \"$l_rperms\" \"$l_fname\" fi if [[ ! \"$l_user\" =~ $l_auser ]]; then a_out2+=(\" o Owned by: \\\"$l_user\\\" and should be owned by \\\"${l_auser//|/ or }\\\"\" \" x Changing ownership to: \\\"$l_fix_account\\\"\") chown \"$l_fix_accou…"
