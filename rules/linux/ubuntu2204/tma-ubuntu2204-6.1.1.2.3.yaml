id: TMA-UBUNTU2204-6.1.1.2.3
title: Ensure systemd-journal-upload is enabled and active
description: Journald systemd-journal-upload supports the ability to send log events it gathers to a remote log host.
target: linux
os_family:
- ubuntu-22.04
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Ubuntu Linux 22.04 LTS Benchmark v3.0.0 - 6.1.1.2.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v systemctl >/dev/null 2>&1 || { echo "step1: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-enabled systemd-journal-upload.service'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- enabled || { echo step1: missing enabled; return 1; }; command -v systemctl >/dev/null 2>&1 || { echo "step2: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-active systemd-journal-upload.service'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- active || { echo step2: missing active; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following commands to unmask, enable and start systemd-journal-upload: # systemctl unmask systemd-journal-upload.service # systemctl --now enable systemd-journal-upload.service'
