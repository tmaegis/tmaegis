id: TMA-DEBIAN13-2.3.2.1
title: Ensure systemd-timesyncd configured with authorized timeserver
description: NTP= • A space-separated list of NTP server host names or IP addresses. During runtime this list is combined with any per-interface NTP servers acquired from systemd-networkd.service(8). systemd-timesyncd will contact all configured system or per-interface servers in turn, until one responds. When the empty string is assigned, the list of NTP servers is reset, and all prior assignments will have no effect. This setting defaults to an empty list. FallbackNTP= • A space-separated list of NTP server host names or IP addresses to be used as the fallback NTP servers. Any per-interface NTP servers o
target: linux
os_family:
- debian-13
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 13 Benchmark v1.1.0 - 2.3.2.1
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output=() a_output2=() a_output3=() a_out=() a_out2=() a_parlist=(\"NTP=[^#\\n\\r]+\" \"FallbackNTP=[^#\\n\\r]+\")\n   l_analyze_cmd=\"$(readlink -f /bin/systemd-analyze)\" l_systemd_config_file=\"/etc/systemd/timesyncd.conf\"\n   f_config_file_parameter_chk()\n   {\n      l_used_parameter_setting=\"\"\n      while IFS= read -r l_file; do\n         l_file=\"$(tr -d '\"'\"'# '\"'\"' <<< \"$l_file\")\"\n         l_used_parameter_setting=\"$(grep -PHs -- '\"'\"'^\\h*'\"'\"'\"$l_parameter_name\"'\"'\"'\\b'\"'\"' \"$l_file\" | tail -n 1)\"\n         [ -n \"$l_used_parameter_setting\" ] && break\n      done < <($l_analyze_cmd cat-config \"$l_systemd_config_file\" | tac | grep -Pio '\"'\"'^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b'\"'\"')\n      if [ -n \"$l_used_parameter_setting\" ]; then\n         while IFS=: read -r l_file_name l_file_parameter; do\n            while IFS=\"=\" read -r l_file_parameter_name l_file_parameter_value; do\n\
    \               if grep -Pq -- \"$l_parameter_value\" <<< \"$l_file_parameter_value\"; then\n                  a_out+=(\"  - Parameter: \\\"${l_file_parameter_name// /}\\\"\" \\\n                  \"    correctly set to: \\\"${l_file_parameter_value// /}\\\"\" \\\n                  \"    in the file: \\\"$l_file_name\\\"\")\n               else\n                  a_out2+=(\"  - Parameter: \\\"${l_file_parameter_name// /}\\\"\" \\\n                  \"    incorrectly set to: \\\"${l_file_parameter_value// /}\\\"\" \\\n                  \"    in the file: \\\"$l_file_name\\\"\" \\\n                  \"    Should be set to: \\\"$l_value_out\\\"\")\n               fi\n            done <<< \"$l_file_parameter\"\n         done <<< \"$l_used_parameter_setting\"\n      else\n         a_out2+=(\"  - Parameter: \\\"$l_parameter_name\\\" is not set in an included file\" \\\n         \"   *** Note: \\\"$l_parameter_name\\\" May be set in a file that'\"'\"'s ignored by load procedure ***\")\n   \
    \   fi\n   }\n   while IFS=\"=\" read -r l_parameter_name l_parameter_value; do # Assess and check parameters\n      l_parameter_name=\"${l_parameter_name// /}\"; l_parameter_value=\"${l_parameter_value// /}\"\n      l_value_out=\"${l_parameter_value//-/ through }\"; l_value_out=\"${l_value_out//|/ or }\"\n      l_value_out=\"$(tr -d '\"'\"'(){}'\"'\"' <<< \"$l_value_out\")\"\n      f_config_file_parameter_chk\n   done < <(printf '\"'\"'%s\\n'\"'\"' \"${a_parlist[@]}\")\n   if [ \"${#a_out[@]}\" -gt 0 ]; then\n      a_output+=(\"${a_out[@]}\"); [ \"${#a_out2[@]}\" -gt 0 ] && a_output3+=(\" ** INFO: **\" \"${a_out2[@]}\")\n   else\n      a_output2+=(\"${a_out2[@]}\")\n   fi\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\" \"\"\n      [ \"${#a_output3[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"${a_output3[@]}\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** FAIL **\"\
    \ \" - Reason(s) for audit failure:\" \"${a_output2[@]}\"\n      [ \"${#a_output[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"\" \"- Correctly set:\" \"${a_output[@]}\" \"\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_TS=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak.$TMA_TS" ] && cp -a "$1" "$1.tmaegis.bak.$TMA_TS"; return 0; }
    tma_has_pkg() { rpm -q "$1" >/dev/null 2>&1 && return 0
      command -v dpkg-query >/dev/null 2>&1 && [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
    tma_pkg_upgrade() { if command -v dnf >/dev/null 2>&1; then dnf -y upgrade "$1"; elif command -v yum >/dev/null 2>&1; then yum -y update "$1";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install --only-upgrade "$1"; elif command -v zypper >/dev/null 2>&1; then zypper -n update "$1"; fi; }
    tma_unit() { for u in "$@"; do systemctl list-unit-files "$u" 2>/dev/null | grep -q "^$u" && { echo "$u"; return 0; }; done; return 1; }
    tma_svc_on() { systemctl unmask "$1" >/dev/null 2>&1; systemctl enable --now "$1"; }
    tma_ssh_ports() { { { sshd -T 2>/dev/null || /usr/sbin/sshd -T 2>/dev/null; } | awk '$1=="port"{print $2}'
      ss -tlnp 2>/dev/null | awk '/sshd/{n=split($4,a,":"); print a[n]}'
      awk 'tolower($1)=="port"{print $2}' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null; echo 22; } | grep -E '^[0-9]+$' | sort -un; }
    if ! grep -Eqs '^[[:space:]]*NTP=[^[:space:]]' /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.d/*.conf; then
      mkdir -p /etc/systemd/timesyncd.conf.d
      printf '[Time]\nNTP=%s\nFallbackNTP=%s\n' "${TMA_NTP_SERVERS:-0.pool.ntp.org 1.pool.ntp.org}" "${TMA_NTP_FALLBACK:-2.pool.ntp.org 3.pool.ntp.org}" > /etc/systemd/timesyncd.conf.d/60-tmaegis.conf
    elif ! grep -Eqs '^[[:space:]]*FallbackNTP=[^[:space:]]' /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.d/*.conf; then
      mkdir -p /etc/systemd/timesyncd.conf.d
      printf '[Time]\nFallbackNTP=%s\n' "${TMA_NTP_FALLBACK:-2.pool.ntp.org 3.pool.ntp.org}" > /etc/systemd/timesyncd.conf.d/61-tmaegis-fallback.conf
    fi
    systemctl try-restart systemd-timesyncd.service 2>/dev/null; true
  guidance: "Set NTP and/or FallbackNTP parameters to local site approved authoritative time server(s) in /etc/systemd/timesyncd.conf or a file in /etc/systemd/timesyncd.conf.d/ ending in .conf in the [Time] section: Example file: [Time] NTP=time.nist.gov # Uses the generic name for NIST's time servers FallbackNTP=time-a-g.nist.gov time-b-g.nist.gov time-c-g.nist.gov # Space separated list of NIST time servers Example script to create systemd drop-in configuration file: #!/usr/bin/env bash { a_settings=(\"NTP=time.nist.gov\" \"FallbackNTP=time-a-g.nist.gov time-b- g.nist.gov time-c-g.nist.gov\") [ ! -d /etc/systemd/timesyncd.conf.d/ ] && mkdir /etc/systemd/timesyncd.conf.d/ if grep -Psq -- '^\\h*\\[Time\\]' /et…"
