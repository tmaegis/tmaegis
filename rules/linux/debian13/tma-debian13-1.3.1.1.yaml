id: TMA-DEBIAN13-1.3.1.1
title: Ensure apparmor packages are installed
description: AppArmor provides Mandatory Access Controls.
target: linux
os_family:
- debian-13
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 13 Benchmark v1.1.0 - 1.3.1.1
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v dpkg-query >/dev/null 2>&1 || { echo "step1: dpkg-query not installed"; return 1; }; o=$(bash -c ''dpkg-query -s apparmor &>/dev/null && echo "apparmor is installed"'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''apparmor is installed'' || { echo step1: missing ''apparmor is installed''; return 1; }; command -v dpkg-query >/dev/null 2>&1 || { echo "step2: dpkg-query not installed"; return 1; }; o=$(bash -c ''dpkg-query -s apparmor-utils &>/dev/null && echo "apparmor-utils is installed"'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''apparmor-utils is installed'' || { echo step2: missing ''apparmor-utils is installed''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_pkg_install apparmor apparmor-utils apparmor-parser apparmor-profiles
    command -v apt-get >/dev/null 2>&1 && apt-get -y install --only-upgrade apparmor apparmor-utils 2>/dev/null
    systemctl enable apparmor 2>/dev/null; true
  guidance: "Run the following command to install apparmor and apparmor-utils: # apt install apparmor apparmor-utils"
