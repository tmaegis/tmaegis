id: TMA-DEBIAN13-5.1.13
title: Ensure sshd KexAlgorithms is configured
description: Key exchange is any method in cryptography by which cryptographic keys are exchanged between two parties, allowing use of a cryptographic algorithm. If the sender and receiver wish to exchange encrypted messages, each must be equipped to encrypt messages to be sent and decrypt messages received More information about the openSSH server configuration is available in the "Configure SSH Server" section overview.
target: linux
os_family:
- debian-13
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 13 Benchmark v1.1.0 - 5.1.13
audit:
  type: command
  shell: bash
  command: 'alt0() { o=$(bash -c ''sshd -T | grep -Pi -- ''"''"''kexalgorithms\h+([^#\n\r]+,)?(diffie-hellman-group1- sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b''"''"'''' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # tma_sshd_apply "Name value" ... : replace every existing setting, put ours first, validate, reload.
    tma_sshd_apply() {
      c=/etc/ssh/sshd_config
      [ -f "$c" ] || { echo "sshd_config not present, nothing to do"; return 0; }
      files="$c $(ls /etc/ssh/sshd_config.d/*.conf 2>/dev/null)"
      sv=$(mktemp -d)
      for f in $files; do tma_bak "$f"; cp -a "$f" "$sv/$(echo "$f" | tr / _)"; done
      for kv in "$@"; do
        n=${kv%% *}
        for f in $files; do
          [ -L "$f" ] && continue
          sed -i -E "s/^([[:space:]]*$n[[:space:]=].*)$/# tmaegis: \1/I" "$f"
        done
      done
      tmp=$(mktemp); : > "$tmp"
      for kv in "$@"; do printf '%s\n' "$kv" >> "$tmp"; done
      cat "$c" >> "$tmp"; cat "$tmp" > "$c"; rm -f "$tmp"
      if command -v sshd >/dev/null 2>&1 && ! sshd -t 2>/dev/null; then
        echo "sshd -t failed, restoring" >&2
        for f in $files; do cat "$sv/$(echo "$f" | tr / _)" > "$f"; done
        rm -rf "$sv"; return 1
      fi
      rm -rf "$sv"
      for u in sshd ssh; do systemctl reload "$u" 2>/dev/null && break; done
      return 0
    }
    v=$(ssh -Q kex 2>/dev/null | grep -Ev "sha1|group1-|group14-sha1|^rsa|gss" | paste -sd, -)
    [ -n "$v" ] || v=curve25519-sha256,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

    tma_sshd_apply "KexAlgorithms $v"
  guidance: "Create or edit a *.conf file in the /etc/ssh/sshd_config.d/ and add/modify the KexAlgorithms line to contain a comma separated list of the site unapproved (weak) KexAlgorithms preceded with a - above any Include entries: Example: KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie- hellman-group-exchange-sha1 Note: First occurrence of an option takes precedence. If Include locations are enabled, used, and order of precedence is understood in your environment, the entry may be created in a file in Include location. Run the following command to apply the configuration change to the running sshd daemon without interrupting active sessions: # systemctl reload sshd"
