remediation:
  type: iac_patch
  command: 'Configure rsyslog to forward over TLS using a drop-in file, the recommended method for local rsyslog configuration, and ensure no plaintext forwarding action remains. 1. Run the following command to locate any existing forwarding actions for review: # grep -PHns -- ''type="omfwd"|^\h*[^#]*@'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2. In each file returned, remove or convert to TLS any forwarding action that is not already TLS-secured, so the only remaining forwarding path uses TLS. 3. Create a drop-in file such as /etc/rsyslog.d/60-forward-tls.conf with the TLS forwarding configuration. The example below uses the GnuTLS driver: # Select the TLS driver and trust material globally global( Defau…'
