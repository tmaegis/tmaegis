id: TMA-ROCKY9-6.1.2.11
title: Ensure rsyslog network forwarding uses TLS
description: When rsyslog forwards logs to a remote host, the omfwd output action can wrap the connection in TLS by selecting a TLS network stream driver (gtls or ossl), running that driver in TLS-only mode, and setting a peer authentication mode. The driver may be selected globally (DefaultNetstreamDriver) or per action (StreamDriver), using either the modern advanced (global(...) / action(...)) syntax or the legacy $-directive syntax. This recommendation applies only where rsyslog forwards to a remote host; hosts that do not forward syslog over the network may document it as Not Applicable.
target: linux
os_family:
- rocky-9
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Rocky Linux 9 Benchmark v3.0.0 - 6.1.2.11
