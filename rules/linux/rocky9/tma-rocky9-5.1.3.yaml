id: TMA-ROCKY9-5.1.3
title: Ensure access to SSH private host key files is configured
description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method, the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key should be distributed.
target: linux
os_family:
- rocky-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Rocky Linux 9 Benchmark v3.0.0 - 5.1.3
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n{\n   l_ssh_group=\"\"\n   grep -Psiq -- '\"'\"'^\\h*ID_LIKE=\"?([^#\\n\\r]+)?\\bfedora\\b'\"'\"' /etc/os-release 2>/dev/null && \\\n      grep -Psq -- '\"'\"'^ssh_keys\\b'\"'\"' /etc/group 2>/dev/null && l_ssh_group=\"ssh_keys\"\n   while IFS= read -r l_file; do\n      ssh-keygen -lf \"$l_file\" &>/dev/null || continue\n      while IFS=: read -r l_mode l_owner l_group; do\n         [ \"$l_group\" = \"$l_ssh_group\" ] && l_mask=\"0137\" || l_mask=\"0177\"\n         if [ $(( l_mode & l_mask )) -gt 0 ] || [ \"$l_owner\" != \"root\" ] || \\\n            { [ \"$l_group\" != \"$l_ssh_group\" ] && [ \"$l_group\" != \"root\" ];\n}; then\n            printf '\"'\"'%s\\n'\"'\"' \"\\\"$l_file\\\": mode $l_mode owner $l_owner group $l_group\"\n         fi\n      done < <(stat -Lc '\"'\"'%#a:%U:%G'\"'\"' \"$l_file\")\n   done < <(sshd -T 2>/dev/null | awk '\"'\"'$1==\"hostkey\"{print $2}'\"'\"')\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" |\
    \ head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    [ -d /etc/ssh ] || exit 0
    grp=root; grep -q '^ssh_keys:' /etc/group && grp_keys=ssh_keys || grp_keys=
    for f in $(find /etc/ssh -xdev -maxdepth 1 -type f -name 'ssh_host_*'); do
      case "$f" in
        *.pub) chown root:root "$f"; m=$(stat -Lc %a "$f"); chmod "$(printf '%o' $((8#$m & 8#0644)))" "$f";;
        *)
          g=$(stat -Lc %G "$f"); m=$(stat -Lc %a "$f")
          if [ -n "$grp_keys" ] && [ "$g" = ssh_keys ]; then chown root:ssh_keys "$f"; chmod "$(printf '%o' $((8#$m & 8#0640)))" "$f"
          else chown root:root "$f"; chmod "$(printf '%o' $((8#$m & 8#0600)))" "$f"; fi;;
      esac
    done
    exit 0
  guidance: "Run the following script to set the owner and restrict permissions on each SSH private host key file from the running sshd configuration: #!/usr/bin/env bash { while IFS= read -r l_file; do ssh-keygen -lf \"$l_file\" &>/dev/null || continue chown root:root \"$l_file\" chmod u-x,go-rwx \"$l_file\" done < <(sshd -T 2>/dev/null | awk '$1==\"hostkey\"{print $2}') } • OR - Where host-based authentication requires the ssh_keys group to read the host keys, set group ownership to ssh_keys with mode 0640 or more restrictive instead: #!/usr/bin/env bash { while IFS= read -r l_file; do ssh-keygen -lf \"$l_file\" &>/dev/null || continue chown root:ssh_keys \"$l_file\" chmod u-x,g-wx,o-rwx \"$l_file\" done < <(sshd -T…"
