id: TMA-ALMA10-3.2.6
title: Ensure sctp kernel module is not available
description: The Stream Control Transmission Protocol (SCTP) is a transport layer protocol used to support message oriented communication, with several streams of messages in one connection. It serves a similar function as TCP and UDP, incorporating features of both. It is message-oriented like UDP, and ensures reliable in-sequence transport of messages with congestion control like TCP.
target: linux
os_family:
- almalinux-10
level: 1
severity: medium
tags:
- cis-converted
- kernel
- linux
- modules
reference: CIS AlmaLinux OS 10 Benchmark v1.0.0 - 3.2.6
audit:
  type: command
  shell: bash
  command: m=sctp; found=$(find /lib/modules/$(uname -r)/kernel /usr/lib/modules/$(uname -r)/kernel -path "*/sctp*" 2>/dev/null | head -n1); if [ -z "$found" ]; then echo compliant; exit 0; fi; lsmod | awk '{print $1}' | grep -Fxq -- "${m//-/_}" && { echo "$m is loaded"; exit 0; }; cfg=$(modprobe --showconfig 2>/dev/null); printf '%s\n' "$cfg" | grep -Pq -- "^\h*blacklist\h+${m//-/_}\b" || { echo "$m is not blacklisted"; exit 0; }; printf '%s\n' "$cfg" | grep -Pq -- "^\h*install\h+${m//-/_}\h+(/usr)?/bin/(true|false)\b" || { echo "$m install is not disabled"; exit 0; }; echo compliant
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    m=sctp
    mkdir -p /etc/modprobe.d
    f=/etc/modprobe.d/60-$m.conf
    printf 'install %s /bin/false\nblacklist %s\n' "$m" "$m" > "$f"
    modprobe -r "$m" 2>/dev/null; rmmod "$m" 2>/dev/null; true
  guidance: "Unload and disable the sctp kernel module. 1. Run the following commands to unload the sctp kernel module: # modprobe -r sctp 2>/dev/null # rmmod sctp 2>/dev/null 2. Perform the following to disable the sctp kernel module: Create a file ending in .conf with install sctp /bin/false in the /etc/modprobe.d/ directory Example: # printf '\\n%s\\n' \"install sctp /bin/false\" >> /etc/modprobe.d/60-sctp.conf Create a file ending in .conf with blacklist sctp in the /etc/modprobe.d/ directory Example: # printf '\\n%s\\n' \"blacklist sctp\" >> /etc/modprobe.d/60-sctp.conf"
