id: TMA-AZL2-5.5.3
title: Ensure default group for the root account is GID 0
description: The usermod command can be used to specify which group the root account belongs to. This affects permissions of files that are created by the root account.
target: linux
os_family:
- azurelinux-2
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS AKS Optimized Azure Linux 2 Benchmark v1.1.0 - 5.5.3
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v cut >/dev/null 2>&1 || { echo "step1: cut not installed"; return 1; }; command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep "^root:" /etc/passwd | cut -f4 -d:'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- 0 || { echo step1: missing 0; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    g=$(awk -F: '$1=="root"{print $4}' /etc/passwd)
    [ "$g" = 0 ] || usermod -g 0 root
    true
  guidance: "Run the following command to set the root account default group to GID 0 : # usermod -g 0 root"
