id: TMA-OL7-3.3.10
title: Ensure tcp syn cookies is enabled
description: When tcp_syncookies is set, the kernel will handle TCP SYN packets normally until the half-open connection queue is full, at which time, the SYN cookie functionality kicks in. SYN cookies work by not using the SYN queue at all. Instead, the kernel simply replies to the SYN with a SYN|ACK, but will include a specially crafted TCP sequence number that encodes the source and destination IP address and port number and the time the packet was sent. A legitimate connection would send the ACK packet of the three way handshake with the specially crafted sequence number. This allows the system to verif
target: linux
os_family:
- ol-7
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Oracle Linux 7 Benchmark v4.0.0 - 3.3.10
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   l_output=\"\" l_output2=\"\"\n   a_parlist=(\"net.ipv4.tcp_syncookies=1\")\n   l_ufwscf=\"$([ -f /etc/default/ufw ] && awk -F= '\"'\"'/^\\s*IPT_SYSCTL=/ {print $2}'\"'\"' /etc/default/ufw)\"\n   a_searchpath=(\"/run/sysctl.d/\" \"/etc/sysctl.d/\" \"/usr/local/lib/sysctl.d/\" \"/usr/lib/sysctl.d/\" \"/lib/sysctl.d/\")\n   unset A_files\n   declare -A A_files # Array of \"valid\" files\n   A_files+=([\"sysctl.conf\"]=\"/etc/sysctl.conf\")\n   for l_searchpath in \"${a_searchpath[@]}\"; do\n      if [ -d \"$l_searchpath\" ]; then\n         while IFS= read -r -d $'\"'\"'\\0'\"'\"' l_filename; do\n            if [ -f \"$l_filename\" ]; then\n               l_basename=\"$(basename \"$l_filename\")\"\n               if [ -z \"${A_files[\"$l_basename\"]}\" ]; then\n                  A_files+=([\"$l_basename\"]=\"$l_filename\")\n               fi\n            fi\n         done < <(find \"$l_searchpath\" -type f -name '\"'\"'*.conf'\"\
    '\"' -print0)\n      fi\n   done\n   a_sorted=()\n   while IFS= read -rd '\"'\"''\"'\"' l_key; do\n      a_sorted+=( \"$l_key\" )\n   done < <(printf '\"'\"'%s\\0'\"'\"' \"${!A_files[@]}\" | sort -rz)\n   kernel_parameter_chk()\n   {\n      l_var=\"\" l_var2=\"\"\n      l_krp=\"$(sysctl \"$l_kpname\" | awk -F= '\"'\"'{print $2}'\"'\"' | xargs)\" # Check running configuration\n      if [ \"$l_krp\" = \"$l_kpvalue\" ]; then\n         l_output=\"$l_output\\n - \\\"$l_kpname\\\" is correctly set to \\\"$l_krp\\\" in the running configuration\"\n      else\n         l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is incorrectly set to \\\"$l_krp\\\" in the running configuration and should have a value of: \\\"$l_kpvalue\\\"\"\n      fi\n      if [ -n \"$l_ufwscf\" ]; then # Check UFW kernel parameter file first\n         if grep -Pqs -- \"^\\h*$l_kpname\\b\" \"$l_$l_ufwscf\"; then\n            l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" \"$l_$l_ufwscf\" | tail -n 1)\"\n      \
    \   fi\n      fi\n      if grep -Pqs -- \"^\\h*$l_kpname\\b\" /etc/sysctl.conf; then # Check /etc/sysctl.conf parameter file next\n         l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" /etc/sysctl.conf | tail -n 1)\"\n      fi\n      if [ -z \"$l_var\" ]; then # If non found yet, now we loop find actual conf file parameter setting based on presence\n         for l_keyname in \"${a_sorted[@]}\";do\n            if grep -Pqs -- \"^\\h*$l_kpname\\b\" \"${A_files[\"$l_keyname\"]}\"; then\n\n               l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" \"${A_files[\"$l_keyname\"]}\" | tail -n 1)\"\n               break\n            fi\n         done\n      fi\n      if [ -n \"$l_var\" ]; then\n         while IFS=\":\" read -r l_conf_file l_var2; do\n            while IFS=\"=\" read -r l_fkpname l_fkpvalue; do\n            l_fkpname=\"${l_fkpname// /}\"; l_fkpvalue=\"${l_fkpvalue// /}\"\n               if [ \"$l_fkpvalue\" = \"$l_kpvalue\" ]; then\n                 \
    \ l_output=\"$l_output\\n - \\\"$l_kpname\\\" is correctly set to \\\"$l_fkpvalue\\\" in \\\"$l_conf_file\\\"\\n\"\n               else\n                  l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is incorrectly set to \\\"$l_fkpvalue\\\" in \\\"$l_conf_file\\\" and should have a value of: \\\"$l_kpvalue\\\"\\n\"\n               fi\n            done <<< \"$l_var2\"\n         done <<< \"$l_var\"\n      else\n         l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is not set in an included file\\n   ** Note: \\\"$l_kpname\\\" May be set in a file that'\"'\"'s ignored by load procedure **\\n\"\n      fi\n   }\n   while IFS=\"=\" read -r l_kpname l_kpvalue; do # Assess and check parameters\n      l_kpname=\"${l_kpname// /}\"; l_kpvalue=\"${l_kpvalue// /}\"\n      if ! grep -Pqs '\"'\"'^\\h*0\\b'\"'\"' /sys/module/ipv6/parameters/disable && grep -q '\"'\"'^net.ipv6.'\"'\"' <<< \"$l_kpname\"; then\n         l_output=\"$l_output\\n - IPv6 is disabled on the system, \\\"$l_kpname\\\" is not\
    \ applicable\"\n      else\n         kernel_parameter_chk\n      fi\n   done < <(printf '\"'\"'%s\\n'\"'\"' \"${a_parlist[@]}\")\n   unset A_files; unset a_sorted # Remove arrays\n   if [ -z \"$l_output2\" ]; then # Provide output from checks\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n   else\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - Reason(s) for audit failure:\\n$l_output2\\n\"\n      [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=net.ipv4.tcp_syncookies; v=1
    f=/etc/sysctl.d/60-tmaegis-$p.conf
    for c in /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf; do
      [ -f "$c" ] && [ "$c" != "$f" ] && [ -w "$c" ] && [ ! -L "$c" ] && sed -i -E "s|^([[:space:]]*$p[[:space:]]*=)|# \1|" "$c"
    done
    printf '%s = %s\n' "$p" "$v" > "$f"
    sysctl -w "$p=$v" >/dev/null 2>&1 || true
    sysctl --system >/dev/null 2>&1 || true; true
  guidance: "Set the following parameter in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending in .conf: • net.ipv4.tcp_syncookies = 1 Example: # printf '%s\\n' \"net.ipv4.tcp_syncookies = 1\" >> /etc/sysctl.d/60- netipv4_sysctl.conf Run the following command to set the active kernel parameters: # { sysctl -w net.ipv4.tcp_syncookies=1 sysctl -w net.ipv4.route.flush=1 } Note: If these settings appear in a canonically later file, or later in the same file, these settings will be overwritten"
