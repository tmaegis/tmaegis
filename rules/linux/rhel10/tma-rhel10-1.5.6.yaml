id: TMA-RHEL10-1.5.6
title: Ensure kernel.kptr_restrict is configured
description: kernel.kptr_restrict sets whether restrictions are placed on exposing kernel addresses via /proc and other interfaces. • kptr_restrict = 0 - The address is hashed before printing. (equivalent to %p.) • kptr_restrict = 1 - kernel pointers printed using the %pK format specifier will be replaced with 0's. • kptr_restrict = 2 - kernel pointers printed using %pK will be replaced with 0's regardless of privileges.
target: linux
os_family:
- rhel-10
level: 1
severity: medium
tags:
- cis-converted
- kernel
- linux
- sysctl
reference: CIS Red Hat Enterprise Linux 10 Benchmark v1.0.1 - 1.5.6
audit:
  type: command
  shell: bash
  command: 'chk() { p=$1; allowed=" $2 "; case $p in net.ipv6.*) [ -d /proc/sys/net/ipv6 ] || return 0;; esac; v=$(sysctl -n "$p" 2>/dev/null) || { echo "$p: not available"; return 1; }; case "$allowed" in *" $v "*) ;; *) echo "$p is $v (running)"; return 1;; esac; sd=$(readlink -e /lib/systemd/systemd-sysctl || readlink -e /usr/lib/systemd/systemd-sysctl); f=$("$sd" --cat-config 2>/dev/null | grep -Po "^\h*${p//./\.}\h*=\h*\K\H+" | tail -n1); [ -n "$f" ] || { echo "$p is not set in any sysctl configuration file"; return 1; }; case "$allowed" in *" $f "*) ;; *) echo "$p is $f in configuration"; return 1;; esac; }; if chk kernel.kptr_restrict ''1 2''; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=kernel.kptr_restrict; v=1
    f=/etc/sysctl.d/60-tmaegis-$p.conf
    for c in /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf; do
      [ -f "$c" ] && [ "$c" != "$f" ] && [ -w "$c" ] && [ ! -L "$c" ] && sed -i -E "s|^([[:space:]]*$p[[:space:]]*=)|# \1|" "$c"
    done
    printf '%s = %s\n' "$p" "$v" > "$f"
    sysctl -w "$p=$v" >/dev/null 2>&1 || true
    sysctl --system >/dev/null 2>&1 || true; true
  guidance: "1. Review all files being used by systemd sysctl and comment out or remove all kernel.kptr_restrict lines that are not kernel.kptr_restrict=1 or kernel.kptr_restrict=2. Example script: #!/usr/bin/env bash { l_option=\"kernel.kptr_restrict\" l_value=\"(1|2)\" l_grep=\"${l_option//./(\\\\.|\\\\/)}\" a_files=() l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl \\ || readlink -e /usr/lib/systemd/systemd-sysctl)\" l_ufw_file=\"$([ -f /etc/default/ufw ] && \\ awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\" [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\ a_files+=(\"$l_ufw_file\"); a_files+=(\"/etc/sysctl.conf\") while IFS= read -r l_fname; do l_file=\"$(readlink -e \"${l_fname//# /}\")\" [ -n \"$l_file\" ] …"
