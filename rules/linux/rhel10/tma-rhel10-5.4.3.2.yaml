id: TMA-RHEL10-5.4.3.2
title: Ensure default user shell timeout is configured
description: 'TMOUT is an environmental setting that determines the timeout of a shell in seconds. • TMOUT=n - Sets the shell timeout to n seconds. A setting of TMOUT=0 disables timeout. • readonly TMOUT- Sets the TMOUT environmental variable as readonly, preventing unwanted modification during run-time. • export TMOUT - exports the TMOUT variable System Wide Shell Configuration Files: • /etc/profile - used to set system wide environmental variables on users shells. The variables are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for all shell '
target: linux
os_family:
- rhel-10
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Red Hat Enterprise Linux 10 Benchmark v1.0.1 - 5.4.3.2
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output=(); a_output2=(); l_tmout_set=\"900\"\n   f_tmout_read_chk()\n   {\n      a_out=(); a_out2=()\n      l_tmout_readonly=\"$(grep -P -- '\"'\"'^\\h*(typeset\\h\\- xr\\hTMOUT=\\d+|([^#\\n\\r]+)?\\breadonly\\h+TMOUT\\b)'\"'\"' \"$l_file\")\"\n      l_tmout_export=\"$(grep -P -- '\"'\"'^\\h*(typeset\\h\\- xr\\hTMOUT=\\d+|([^#\\n\\r]+)?\\bexport\\b([^#\\n\\r]+\\b)?TMOUT\\b)'\"'\"' \"$l_file\")\"\n      if [ -n \"$l_tmout_readonly\" ]; then\n         a_out+=(\"  - Readonly is set as: \\\"$l_tmout_readonly\\\" in: \\\"$l_file\\\"\")\n      else\n         a_out2+=(\"  - Readonly is not set in: \\\"$l_file\\\"\")\n      fi\n      if [ -n \"$l_tmout_export\" ]; then\n         a_out+=(\"  - Export is set as: \\\"$l_tmout_export\\\" in: \\\"$l_file\\\"\")\n      else\n         a_out2+=(\"  - Export is not set in: \\\"$l_file\\\"\")\n      fi\n   }\n   while IFS= read -r l_file; do\n      l_tmout_value=\"$(grep -Po -- '\"'\"'^([^#\\\
    n\\r]+)?\\bTMOUT=\\d+\\b'\"'\"' \"$l_file\" | awk -F= '\"'\"'{print $2}'\"'\"')\"\n      f_tmout_read_chk\n      if [ -n \"$l_tmout_value\" ]; then\n         if [[ \"$l_tmout_value\" -le \"$l_tmout_set\" && \"$l_tmout_value\" -gt \"0\" ]]; then\n            a_output+=(\" - TMOUT is set to: \\\"$l_tmout_value\\\" in: \\\"$l_file\\\"\")\n            [ \"${#a_out[@]}\" -gt 0 ] && a_output+=(\"${a_out[@]}\")\n            [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\"${a_out[@]}\")\n         fi\n         if [[ \"$l_tmout_value\" -gt \"$l_tmout_set\" || \"$l_tmout_value\" -le \"0\" ]]; then\n            a_output2+=(\" - TMOUT is incorrectly set to: \\\"$l_tmout_value\\\" in: \\\"$l_file\\\"\")\n            [ \"${#a_out[@]}\" -gt 0 ] && a_output2+=(\"  ** Incorrect TMOUT value **\" \"${a_out[@]}\")\n            [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\"${a_out2[@]}\")\n         fi\n      else\n         [ \"${#a_out[@]}\" -gt 0 ] &&  a_output2+=(\" - TMOUT is not set\" \"${a_out[@]}\")\n \
    \        [ \"${#a_out2[@]}\" -gt 0 ] &&  a_output2+=(\" - TMOUT is not set\" \"${a_out2[@]}\")\n      fi\n   done < <(grep -Pls -- '\"'\"'^([^#\\n\\r]+)?\\bTMOUT\\b'\"'\"' /etc/*bashrc /etc/profile /etc/profile.d/*.sh)\n   [[ \"${#a_output[@]}\" -le 0 && \"${#a_output2[@]}\" -le 0 ]] && a_output2+=(\" - TMOUT is not configured\")\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** FAIL **\" \"  * Reasons for audit failure *\" \"${a_output2[@]}\" \"\"\n      [ \"${#a_output[@]}\" -gt 0 ] && printf '\"'\"'%s\\n'\"'\"' \"- Correctly set:\" \"${a_output[@]}\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # make every umask line in the given files at least 027
    tma_umask_fix() { for f in "$@"; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      grep -Eqi '^[[:space:]]*umask[[:space:]]' "$f" || continue
      t=$(mktemp); ch=0
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ $line =~ ^([[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+)0*([0-7]{1,4})([[:space:]#].*)?$ ]]; then
          v=$((8#${BASH_REMATCH[2]})); n=$((v | 8#027))
          if [ "$n" != "$v" ]; then line="${BASH_REMATCH[1]}$(printf '%03o' $n)${BASH_REMATCH[3]}"; ch=1; fi
        elif [[ $line =~ ^[[:space:]]*[Uu][Mm][Aa][Ss][Kk][[:space:]]+[ugoa]*= ]] && [[ $line =~ (g=[rwx]*w|o=[rwx]*[rwx]) ]]; then
          line="umask 027"; ch=1
        fi
        printf '%s\n' "$line" >> "$t"
      done < "$f"
      if [ $ch = 1 ]; then tma_bak "$f"; cat "$t" > "$f"; fi
      rm -f "$t"
    done; }
    N=900
    # one authoritative file; any other TMOUT assignment is commented out (audit demands readonly+export in each file mentioning it)
    for f in /etc/profile /etc/bashrc /etc/bash.bashrc /etc/bash/bashrc /etc/profile.d/*.sh; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      [ "$f" = /etc/profile.d/50-tmaegis-tmout.sh ] && continue
      grep -Eq '^[^#]*\bTMOUT\b' "$f" || continue
      tma_bak "$f"; sed -i -E '/^[[:space:]]*#/! s/^([^#]*\bTMOUT\b.*)$/# tmaegis: \1/' "$f"
    done
    mkdir -p /etc/profile.d
    printf '# CIS: idle shell timeout\nTMOUT=%s\nreadonly TMOUT\nexport TMOUT\n' "$N" > /etc/profile.d/50-tmaegis-tmout.sh
    chmod 644 /etc/profile.d/50-tmaegis-tmout.sh
    for f in /etc/bash/bashrc /etc/profile; do [ -f "$f" ] && ! grep -q '^TMOUT=' "$f" && [ "$f" = /etc/bash/bashrc ] && printf 'TMOUT=%s\nreadonly TMOUT\nexport TMOUT\n' "$N" >> "$f"; done
    true
  guidance: "Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/ directory and remove or edit all TMOUT=_n_ entries to follow local site policy. TMOUT should not exceed 900 or be equal to 0. Configure TMOUT in one of the following files: • A file in the /etc/profile.d/ directory ending in .sh • /etc/profile • /etc/bashrc Example command to set TMOUT to 900 seconds in a file in /etc/profile.d/: # printf '%s\\n' \"# Set TMOUT to 900 seconds\" \"typeset -xr TMOUT=900\" > /etc/profile.d/50-tmout.sh TMOUT configuration examples: typeset -xr TMOUT=900 Deprecated methods: • As multiple lines: TMOUT=900 readonly TMOUT export TMOUT • As a single line: readonly TMOUT=900 ; export TMOUT"
