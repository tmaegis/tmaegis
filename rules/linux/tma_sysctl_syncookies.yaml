id: TMA-LNX-NET-SYNCOOKIES
title: Ensure TCP SYN cookies are enabled
description: Kernel parameter net.ipv4.tcp_syncookies should be 1.
target: linux
os_family:
- ubuntu-22.04
- ubuntu-24.04
- rocky-9
level: 1
severity: medium
tags:
- kernel
- sysctl
- network
reference: CIS Linux Benchmark - Network Configuration / Kernel Parameters (verify section number for your distro release)
audit:
  type: command
  command: sysctl -n net.ipv4.tcp_syncookies
  expected_output: '1'
remediation:
  type: command
  command: sysctl -w net.ipv4.tcp_syncookies=1 && printf 'net.ipv4.tcp_syncookies = 1\n' > /etc/sysctl.d/60-tmaegis-net_ipv4_tcp_syncookies.conf
  backup_files:
  - /etc/sysctl.d/60-tmaegis-net_ipv4_tcp_syncookies.conf
