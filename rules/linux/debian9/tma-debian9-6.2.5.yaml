id: TMA-DEBIAN9-6.2.5
title: Ensure root is the only UID 0 account
description: Any account with UID 0 has superuser privileges on the system.
target: linux
os_family:
- debian-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 9 Benchmark v1.0.1 ARCHIVE - 6.2.5
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v awk >/dev/null 2>&1 || { echo "step1: awk not installed"; return 1; }; command -v cat >/dev/null 2>&1 || { echo "step1: cat not installed"; return 1; }; o=$(bash -c ''cat /etc/passwd | awk -F: ''"''"''($3 == 0) { print $1 }''"''"'''' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- root || { echo step1: missing root; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Remove any users other than root with UID 0 or assign them a new UID if appropriate.
