id: TMA-DEBIAN9-4.2.2.1
title: Ensure syslog-ng service is enabled
description: Once the syslog-ng package is installed it needs to be activated.
target: linux
os_family:
- debian-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Debian Linux 9 Benchmark v1.0.1 ARCHIVE - 4.2.2.1
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v systemctl >/dev/null 2>&1 || { echo "step1: systemctl not installed"; return 1; }; o=$(bash -c ''systemctl is-enabled syslog-ng'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- enabled || { echo step1: missing enabled; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Run the following command to enable syslog-ng: # update-rc.d syslog-ng enable'
