id: TMA-RHEL9-5.2.7
title: Ensure re-authentication for privilege escalation is not disabled globally
description: By default sudo re-authenticates the invoking user before escalating privileges. The !authenticate tag, where present in the sudoers configuration, disables that re- authentication; without it, sudo prompts the user to confirm their identity before running elevated commands.
target: linux
os_family:
- rhel-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Red Hat Enterprise Linux 9 Benchmark v3.0.0 - 5.2.7
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; o=$(bash -c ''grep -r ''"''"''^[^#].*!authenticate''"''"'' /etc/sudoers /etc/sudoers.d/'' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Configure the operating system to require users to reauthenticate for privilege escalation. Based on the outcome of the audit procedure, use visudo -f <PATH TO FILE> to edit the relevant sudoers file. Remove any occurrences of !authenticate tags in the file(s). Because sudo applies the last matching definition, ensure no later-parsed file in /etc/sudoers.d re-introduces an !authenticate tag; see this section's overview for how the sudoers files combine.
