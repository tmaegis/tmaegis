id: TMA-RHEL9-6.1.2.7
title: Ensure rsyslog is not configured as a log server
description: rsyslog can be configured to receive log messages from remote hosts over the network by loading a remote-input module (imtcp, imudp, imptcp, or imrelp) and starting a listener, which makes the host act as a central log server.
target: linux
os_family:
- rhel-9
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Red Hat Enterprise Linux 9 Benchmark v3.0.0 - 6.1.2.7
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_conf=(/etc/rsyslog.conf /etc/rsyslog.d/*.conf)\n   while IFS= read -r l_inc; do\n      for l_f in $l_inc; do\n         [ -d \"$l_f\" ] && a_conf+=(\"$l_f\"/*.conf) || a_conf+=(\"$l_f\")\n      done\n   done < <(grep -Psoih -- '\"'\"'^\\h*(?:\\$IncludeConfig\\h+|include\\h*\\(\\h*file\\h*=\\h*\"?)\\K[^\")\\h]+'\"'\"' \"${a_conf[@]}\" 2>/dev/null)\n   grep -Psi -- '\"'\"'^\\h*module\\(load=\"?(imtcp|imudp|imptcp|imrelp)\"?\\)'\"'\"' \"${a_conf[@]}\" 2>/dev/null\n   grep -Psi -- '\"'\"'^\\h*input\\(type=\"?(imtcp|imudp|imptcp|imrelp)\"?'\"'\"' \"${a_conf[@]}\" 2>/dev/null\n   grep -Psi -- '\"'\"'^\\h*\\$ModLoad\\h+(imtcp|imudp|imptcp|imrelp)\\b'\"'\"' \"${a_conf[@]}\" 2>/dev/null\n   grep -Psi -- '\"'\"'^\\h*\\$(InputTCPServerRun|UDPServerRun|InputPTCPServerRun|InputRELPServerRun) \\b'\"'\"' \"${a_conf[@]}\" 2>/dev/null\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant;\
    \ fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    TMA_AUDITD_CONF=/etc/audit/auditd.conf
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$(date +%Y%m%d%H%M%S)"; }
    tma_audit_pkg() {
      command -v auditctl >/dev/null 2>&1 && [ -f /etc/audit/auditd.conf ] && return 0
      if command -v apt-get >/dev/null 2>&1; then tma_pkg_install auditd; else tma_pkg_install audit; fi; }
    tma_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo >> "$1"; return 0; }
    tma_kv() { # file key value : 'key = value' style (auditd.conf); replaces every uncommented line
      f=$1; k=$2; v=$3
      [ -f "$f" ] || return 0
      tma_bak "$f"
      if grep -Eq "^[[:space:]]*$k[[:space:]]*=" "$f"; then
        sed -i -E "s|^[[:space:]]*$k[[:space:]]*=.*|$k = $v|" "$f"
      else tma_nl "$f"; printf '%s = %s\n' "$k" "$v" >> "$f"; fi; }
    tma_ini_set() { # file section key value : systemd ini 'Key=value'
      f=$1; s=$2; k=$3; v=$4
      mkdir -p "$(dirname "$f")"; [ -f "$f" ] || : > "$f"; tma_nl "$f"
      sed -i -E "/^[[:space:]]*$k[[:space:]]*=/d" "$f"
      if grep -q "^\[$s\]" "$f"; then sed -i "/^\[$s\]/a $k=$v" "$f"; else printf '[%s]\n%s=%s\n' "$s" "$k" "$v" >> "$f"; fi; }
    tma_clear() { # path octal-mask : remove the mask bits from the file mode
      [ -e "$1" ] || return 0
      m=$(stat -Lc %a "$1")
      [ $((8#$m & 8#$2)) -eq 0 ] || chmod "$(printf '%o' $((8#$m & ~8#$2 & 8#7777)))" "$1"; }
    tma_rule() { # rules.d-filename audit-rule-line : append when missing (whitespace-normalised)
      f=/etc/audit/rules.d/$1; shift; l=$*
      mkdir -p /etc/audit/rules.d; [ -f "$f" ] || : > "$f"
      if ! tr -s ' \t' '  ' < "$f" | sed 's/^ //;s/ $//' | grep -Fxq -- "$l"; then tma_nl "$f"; printf '%s\n' "$l" >> "$f"; fi
      chown root:root "$f"; chmod 640 "$f"; }
    tma_rules_load() { command -v augenrules >/dev/null 2>&1 && augenrules --load >/dev/null 2>&1; true; }
    tma_audit_logdir() {
      d=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs 2>/dev/null)
      [ -n "$d" ] && dirname "$d" || echo /var/log/audit; }
    tma_grub_arg() { # key=value : add/replace in GRUB_CMDLINE_LINUX and regenerate grub.cfg
      a=$1; k=${a%%=*}; g=/etc/default/grub
      [ -f "$g" ] || { echo "no $g: bootloader not managed by grub defaults" >&2; return 0; }
      tma_bak "$g"
      if ! grep -q '^GRUB_CMDLINE_LINUX=' "$g"; then tma_nl "$g"; printf 'GRUB_CMDLINE_LINUX="%s"\n' "$a" >> "$g"
      elif grep -E '^GRUB_CMDLINE_LINUX=' "$g" | grep -Eq "[\"' ]$k(=|[\"' ])"; then
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"' ])$k(=[^\"' ]*)?([\"' ])#\1$a\3#" "$g"
      else
        sed -i -E "/^GRUB_CMDLINE_LINUX=/ s#([\"'])\$#  $a\1#; /^GRUB_CMDLINE_LINUX=/ s#=([\"'])  #=\1#; /^GRUB_CMDLINE_LINUX=/ s#   *# #g" "$g"
      fi
      if command -v update-grub >/dev/null 2>&1; then update-grub >/dev/null 2>&1
      elif command -v grub2-mkconfig >/dev/null 2>&1; then
        for c in /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg; do [ -f "$c" ] && grub2-mkconfig -o "$c" >/dev/null 2>&1; done
      elif command -v grub-mkconfig >/dev/null 2>&1; then grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1; fi
      true; }
    files="/etc/rsyslog.conf $(ls /etc/rsyslog.d/*.conf 2>/dev/null)"
    for f in $files; do
      [ -f "$f" ] || continue
      if grep -Eiq '^[[:space:]]*(module\([[:space:]]*load="?(imtcp|imudp|imptcp|imrelp)"?|input\([[:space:]]*type="?(imtcp|imudp|imptcp|imrelp)"?|\$ModLoad[[:space:]]+(imtcp|imudp|imptcp|imrelp)\b|\$(InputTCPServerRun|UDPServerRun|InputPTCPServerRun|InputRELPServerRun)[[:space:]])' "$f"; then
        tma_bak "$f"
        sed -i -E 's/^([[:space:]]*(module\([[:space:]]*load="?(imtcp|imudp|imptcp|imrelp)"?|input\([[:space:]]*type="?(imtcp|imudp|imptcp|imrelp)"?|\$ModLoad[[:space:]]+(imtcp|imudp|imptcp|imrelp)\b|\$(InputTCPServerRun|UDPServerRun|InputPTCPServerRun|InputRELPServerRun)[[:space:]]).*)$/# tmaegis: \1/I' "$f"
      fi
    done
    systemctl restart rsyslog.service 2>/dev/null
    true
  guidance: "1. Should any active log server configuration be found by the audit, edit the file(s) where those directives appear - /etc/rsyslog.conf, a drop-in under /etc/rsyslog.d/, or any non-standard file identified by the audit's configuration discovery - and remove or comment out the remote-input module load, input, and run directives for all of imtcp, imudp, imptcp, and imrelp. Ensure none of the following entries are present: advanced format module(load=\"imtcp\") module(load=\"imudp\") module(load=\"imptcp\") module(load=\"imrelp\") input(type=\"imtcp\" port=\"514\") input(type=\"imudp\" port=\"514\") input(type=\"imptcp\" port=\"514\") input(type=\"imrelp\" port=\"2514\") deprecated legacy format $ModLoad imtcp $ModLoa…"
