id: TMA-AMZN2-6.2.3.22
title: Ensure the running and on disk configuration is the same
description: 'The Audit system have both on disk and running configuration. It is possible for these configuration settings to differ. Note: Due to the limitations of augenrules and auditctl, it is not absolutely guaranteed that loading the rule sets via augenrules --load will result in all rules being loaded or even that the user will be informed if there was a problem loading the rules.'
target: linux
os_family:
- amzn-2
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Amazon Linux 2 Benchmark v4.0.0 - 6.2.3.22
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v augenrules >/dev/null 2>&1 || { echo "step1: augenrules not installed"; return 1; }; o=$(bash -c ''augenrules --check'' 2>&1); printf ''%s\n'' "$o" | tr -s '' \t'' ''  '' | sed ''s/^ //;s/ $//'' | grep -Fxq -- ''/usr/sbin/augenrules: No change'' || { echo step1: missing ''/usr/sbin/augenrules: No change''; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'If the rules are not aligned across all three () areas, run the following command to merge and load all rules: # augenrules --load Check if reboot is required. if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then echo "Reboot required to load rules"; fi'
