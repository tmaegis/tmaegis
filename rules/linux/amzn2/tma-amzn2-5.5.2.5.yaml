id: TMA-AMZN2-5.5.2.5
title: Ensure root path integrity
description: The root user can execute any command on the system and could be fooled into executing programs unintentionally if the PATH is not set correctly.
target: linux
os_family:
- amzn-2
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Amazon Linux 2 Benchmark v4.0.0 - 5.5.2.5
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_output2=() l_pmask=\"0022\"\n   l_maxperm=\"$( printf '\"'\"'%o'\"'\"' $(( 0777 & ~$l_pmask )) )\"\n   l_root_path=\"$(sudo su - root -c env | awk -F= '\"'\"'$1==\"PATH\"{print $2}'\"'\"')\"\n   IFS=\":\" read -ra a_path_loc <<< \"$l_root_path\"\n   grep -q -- \"::\" <<< \"$l_root_path\" && \\\n   a_output2+=(\" - root'\"'\"'s path contains a empty directory (::)\")\n   grep -Pq -- \":\\h*$\" <<< \"$l_root_path\" && \\\n   a_output2+=(\" - root'\"'\"'s path contains a trailing (:)\")\n   grep -Pq -- '\"'\"'(^\\h*|:)\\.(:|\\h*$)'\"'\"' <<< \"$l_root_path\" && \\\n   a_output2+=(\" - root'\"'\"'s path contains current working directory (.)\")\n   for l_path in \"${a_path_loc[@]}\"; do\n      if [ -d \"$l_path\" ]; then\n         while IFS=: read -r l_fmode l_fown; do\n            [ \"$l_fown\" != \"root\" ] && \\\n            a_output2+=(\" - Directory: \\\"$l_path\\\" is owned by: \\\"$l_fown\\\"\" \\\n            \"    should\
    \ be owned by \\\"root\\\"\")\n            [ $(( $l_fmode & $l_pmask )) -gt 0 ] && \\\n            a_output2+=(\" - Directory: \\\"$l_path\\\" is mode: \\\"$l_fmode\\\"\" \\\n            \"    and should be mode: \\\"$l_maxperm\\\" or more restrictive\")\n         done <<< \"$(stat -Lc '\"'\"'%#a:%U'\"'\"' \"$l_path\")\"\n      else\n         a_output2+=(\" - \\\"$l_path\\\" is not a directory\")\n      fi\n   done\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** PASS **\" \\\n      \" - Root'\"'\"'s path is correctly configured\"\n   else\n      printf '\"'\"'%s\\n'\"'\"' \"\" \"- Audit Result:\" \"  ** FAIL **\" \\\n      \"- * Reasons for audit failure * :\" \"${a_output2[@]}\"\n   fi\n}' 2>&1); printf '%s\\n' \"$o\" | grep -q '\\*\\* PASS \\*\\*' || { echo \"step1: script did not report PASS\"; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    p=$(sudo -Hiu root env 2>/dev/null | sed -n 's/^PATH=//p'); [ -n "$p" ] || p=$PATH
    printf '%s\n' "$p" | tr ':' '\n' | while read -r dir; do
      [ -n "$dir" ] && [ "$dir" != . ] && [ -d "$dir" ] || continue
      chown root "$dir" 2>/dev/null
      chmod go-w "$dir" 2>/dev/null
    done
    true
  guidance: "Correct or justify any: • Locations that are not directories • Empty directories (::) • Trailing (:) • Current working directory (.) • Non root owned directories • Directories that less restrictive than mode 0755"
