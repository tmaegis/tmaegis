id: TMA-AMZN2-1.4.1.6
title: Ensure no unconfined services exist
description: Unconfined processes run in unconfined domains
target: linux
os_family:
- amzn-2
level: 2
severity: low
tags:
- cis-converted
- linux
reference: CIS Amazon Linux 2 Benchmark v4.0.0 - 1.4.1.6
audit:
  type: command
  shell: bash
  command: 'alt0() { command -v grep >/dev/null 2>&1 || { echo "step1: grep not installed"; return 1; }; command -v ps >/dev/null 2>&1 || { echo "step1: ps not installed"; return 1; }; o=$(bash -c ''ps -eZ | grep unconfined_service_t'' 2>/dev/null); [ -z "$o" ] || { echo "step1: $o" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Investigate any unconfined processes found during the audit action. If necessary create a customize SELinux policy to allow necessary actions for the service. Warning: Knowledge about creating and configuring SELinux policies is needed. A Basic example on how to create a policy is included below. 1. Identify the unconfined service: determine the name and process of the service 2. Identify the functionality: determine if the functionality is required for operations 3. Create or add to the custom allow list in the SELinux policy configuration Example SELinux policy configuration: service_allowlist_policy.te # Example SELinux policy configuration for allowing access to specific actions and reso…'
