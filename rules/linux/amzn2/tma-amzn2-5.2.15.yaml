id: TMA-AMZN2-5.2.15
title: Ensure sshd MACs are configured
description: This variable limits the types of MAC algorithms that SSH can use during communication. More information about the openSSH server configuration is available in the "Configure SSH Server" section overview.
target: linux
os_family:
- amzn-2
level: 1
severity: medium
tags:
- cis-converted
- linux
reference: CIS Amazon Linux 2 Benchmark v4.0.0 - 5.2.15
audit:
  type: command
  shell: bash
  command: "alt0() { o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_list=(\"hmac-md5\" \"hmac-md5-96\" \"hmac-ripemd160\" \"hmac-sha1-96\" \\\n   \"umac-64@openssh.com\" \"hmac-md5-etm@openssh.com\" \"hmac-md5-96- etm@openssh.com\" \\\n   \"hmac-ripemd160-etm@openssh.com\" \"hmac-sha1-96-etm@openssh.com\" \\\n   \"umac-64-etm@openssh.com\" \"umac-128-etm@openssh.com\")\n   l_macs=\"$(sshd -T 2>&1 | awk '\"'\"'$1==\"macs\"{print $2}'\"'\"')\"\n   for l_weak in \"${a_list[@]}\"; do\n      grep -Psio -- '\"'\"'\\b'\"'\"'\"${l_weak//\\./\\\\.}\"'\"'\"'\\b'\"'\"' <<< \"$l_macs\"\n   done\n}' 2>&1); [ -z \"$o\" ] || { echo \"step1: $o\" | head -c 300; return 1; }; o=$(bash -c '#!/usr/bin/env bash\n\n{\n   a_list=(\"hmac-sha1-etm@openssh.com\" \"hmac-sha2-256-etm@openssh.com\" \\\n   \"hmac-sha2-512-etm@openssh.com\")\n   l_macs=\"$(sshd -T 2>&1 | awk '\"'\"'$1==\"macs\"{print $2}'\"'\"')\"\n   for l_etm in \"${a_list[@]}\"; do\n      grep -Psio -- '\"'\"'\\b'\"'\"'\"${l_etm//\\./\\\\.}\"'\"'\"'\\\
    b'\"'\"' <<< \"$l_macs\"\n   done\n}' 2>&1); [ -z \"$o\" ] || { echo \"step2: $o\" | head -c 300; return 1; }; }; if alt0; then echo compliant; fi"
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_ts=$(date +%Y%m%d%H%M%S)
    tma_bak() { [ -e "$1" ] || return 0; ls "$1".tmaegis.bak.* >/dev/null 2>&1 || cp -a "$1" "$1.tmaegis.bak.$tma_ts"; }
    tma_applied() { return 0; }

    # tma_sshd_apply "Name value" ... : replace every existing setting, put ours first, validate, reload.
    tma_sshd_apply() {
      c=/etc/ssh/sshd_config
      [ -f "$c" ] || { echo "sshd_config not present, nothing to do"; return 0; }
      files="$c $(ls /etc/ssh/sshd_config.d/*.conf 2>/dev/null)"
      sv=$(mktemp -d)
      for f in $files; do tma_bak "$f"; cp -a "$f" "$sv/$(echo "$f" | tr / _)"; done
      for kv in "$@"; do
        n=${kv%% *}
        for f in $files; do
          [ -L "$f" ] && continue
          sed -i -E "s/^([[:space:]]*$n[[:space:]=].*)$/# tmaegis: \1/I" "$f"
        done
      done
      tmp=$(mktemp); : > "$tmp"
      for kv in "$@"; do printf '%s\n' "$kv" >> "$tmp"; done
      cat "$c" >> "$tmp"; cat "$tmp" > "$c"; rm -f "$tmp"
      if command -v sshd >/dev/null 2>&1 && ! sshd -t 2>/dev/null; then
        echo "sshd -t failed, restoring" >&2
        for f in $files; do cat "$sv/$(echo "$f" | tr / _)" > "$f"; done
        rm -rf "$sv"; return 1
      fi
      rm -rf "$sv"
      for u in sshd ssh; do systemctl reload "$u" 2>/dev/null && break; done
      return 0
    }
    v=$(ssh -Q mac 2>/dev/null | grep -E "^hmac-sha2-(256|512)(-etm@openssh.com)?$|^umac-128@openssh.com$" | paste -sd, -)
    [ -n "$v" ] || v=hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128@openssh.com,hmac-sha2-512,hmac-sha2-256

    tma_sshd_apply "MACs $v"
  guidance: "1. Edit the /etc/ssh/sshd_config file and add/modify the MACs line to contain a comma separated allow list of the site unapproved (strong) MACs: Example: MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha1- etm@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1 2. - IF - CVE-2023-48795 has not been reviewed and addressed, the following etm MACs should be added to the exclude list: hmac-sha1-etm@openssh.com,hmac- sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com"
