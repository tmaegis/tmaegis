id: TMA-IBM-Z-6.5.5
title: Ensure permission and user audit bits for z/OS UNIX file system objects that are part of the base TCP/IP component are configured
description: z/OS UNIX directories and files of the Base TCP/IP component provide the configuration, operational, and executable properties of IBM's TCP/IP system product. Failure to properly secure these objects may lead to unauthorized access resulting in the compromise of the integrity and availability of the operating system environment, ACP, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.5 Ensure permission and user audit bits for z/OS UNIX file system objects that are part of the base TCP/IP component are configured
audit:
  type: manual
  command: 'Verify that the permission bits and user audit bits for base TCP/IP components files match or are more restrictive than the specified settings listed in the table: File Permission Bits User Audit Bits /etc/hosts 744 faf /etc/protocol 744 faf /etc/resolv.conf 744 faf /etc/services 740 faf /usr/lpp/tcpip/bin 755 faf /usr/lpp/tcpip/sbin 755 faf Note: Some of the files listed above may not be used in every configuration.'
remediation:
  type: iac_patch
  command: 'To modify the audit flags for a UNIX file use the chaudit command: chaudit w=sf,rx+f /etc/hosts chaudit w=sf,rx+f /etc/protocol chaudit w=sf,rx+f /etc/resolv.conf chaudit w=sf,rx+f /etc/services chaudit w=sf,rx+f /usr/lpp/tcpip/bin chaudit w=sf,rx+f /usr/lpp/tcpip/sbin To modify the access permissions for a UNIX file use the chmod command: chmod 744 /etc/hosts chmod 744 /etc/protocol chmod 744 /etc/resolv.conf chmod 740 /etc/services chmod 755 /usr/lpp/tcpip/bin chmod 755 /usr/lpp/tcpip/sbin'
