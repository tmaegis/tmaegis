id: TMA-IBM-Z-2.4.1
title: Ensure that the assignment of the RACF OPERATIONS attribute is justified
description: A user possessing the OPERATIONS attribute has authorization to do maintenance operations on all RACF-protected data sets, tape volumes, and DASD volumes except those where the access list specifically limits the OPERATIONS user to a lower access authority than the operation requires. Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.4.1 Ensure that the assignment of the RACF OPERATIONS attribute is justified
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACUSR Review the OPERATIONS column under the ATTRIBUTE TYPE grouping. Verify when SYSTEM or GROUP appears if the assignment is justified for the user.'
remediation:
  type: iac_patch
  command: 'To remove the OPERATIONS attribute use the RACF ALTUSER command: ALTUSER <user-id> NOOPERATIONS To remove group-OPERATIONS authority use the RACF CONNECT command: CONNECT <user-id> + GROUP(group) + NOOPERATIONS'
