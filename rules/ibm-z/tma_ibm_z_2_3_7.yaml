id: TMA-IBM-Z-2.3.7
title: Ensure that SETROPTS NOADDCREATOR is in effect
description: The SETROPTS NOADDCREATOR parameter specifies that if a user defines any new DATASET or general resource profile using ADDSD, RDEFINE or RACROUTE REQUEST=DEFINE, or creates discrete profiles other than DATASET and TAPEVOL using RACROUTE REQUEST=DEFINE, RACF does not place the profile creator's user ID on the profile's access list.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.3.7 Ensure that SETROPTS NOADDCREATOR is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following message is present: ADDCREATOR IS NOT IN EFFECT.'
remediation:
  type: iac_patch
  command: 'To modify the parameter use the RACF SETROPTS command: SETROPTS NOADDCREATOR'
