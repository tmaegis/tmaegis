id: TMA-IBM-Z-6.6.3
title: Ensure a warning banner for the TN3270 telnet server is configured
description: A logon banner can be used to inform users about the environment during the initial logon. For example, the logon banners can be used to warn users against unauthorized entry and the possibility of legal action for unauthorized users and advise all users that system use constitutes consent to monitoring.
target: ibm-z
level: 1
severity: low
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.6.3 Ensure a warning banner for the TN3270 telnet server is configured
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TN3270E started tasks. Note: If a TN3270E started task is inactive, review the procedure libraries defined to JES2 and locate the TN3270E JCL member. Verify that the following parameters are coded in TN3270E configuration files specified by PROFILE DD statements: All un-formatted System Services (USS) tables referenced in BEGINVTAM USSTCP statements include MSG10 text that specifies a logon banner. Note: If the INCLUDE statement is coded in the Telnet profile, the data set specified on this statement must be ... (full steps: CIS section 6.6.3)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TN3270E configuration files.
