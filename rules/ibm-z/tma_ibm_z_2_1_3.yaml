id: TMA-IBM-Z-2.1.3
title: Ensure that the SETROPTS WHEN(PROGRAM) value is active
description: SETROPTS WHEN(PROGRAM) activates RACF program control, which includes both access control to load modules and program access to data sets. To set up access control to load modules, you must identify your controlled programs by creating a profile for each in the PROGRAM class. Not protecting critical programs and not ensuring a clean address space can compromise the security of the processing environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.3 Ensure that the SETROPTS WHEN(PROGRAM) value is active
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Look for the following message: WHEN(PROGRAM -- BASIC) Verify that the message appears. Note: The message may specify BASIC, ENHANCED-WARNING, or ENHANCED. This is determined by the IRR.PGMSECURITY profile in the FACILITY resource class, and the specific value in the message is not relevant for this control.'
remediation:
  type: iac_patch
  command: 'To modify the WHEN(PROGRAM) parameter use the RACF SETROPTS command: SETROPTS WHEN(PROGRAM)'
