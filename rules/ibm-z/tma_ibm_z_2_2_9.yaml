id: TMA-IBM-Z-2.2.9
title: Ensure that access to the SYS1.IMAGELIB data set is controlled
description: SYS1.IMAGELIB is a partitioned data set containing Universal Character Set (UCS), Forms Control Buffer (FCB), and printer control information. Most IBM standard UCS images are included in SYS1.IMAGELIB during system installation. This data set should be protected as a z/OS system data set. SYS1.IMAGELIB is automatically APF-authorized.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.2.9 Ensure that access to the SYS1.IMAGELIB data set is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering SYS1.IMAGELIB Request reports generated using IRRDBU00 output that will allow you to: Verify That the SYS1.IMAGELIB data set is secured by a profile in the DATASET class that: Has UACC of NONE Is not in WARNING mode AUDIT a minimum of SUCCESS(UPDATE) and FAILURES(READ) ID(*) is not used to grant access greater than READ UPDATE and higher permits are restricted to: o Systems Programmers'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.IMAGELIB'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + DATA(''SYSTEM UNIVERSAL CHARACTER SET (UCS), FORMS CONTROL - BUFFER (FCB), AND PRINTER CONTROL INFORMATION'') PERMIT ''SYS1.IMAGELIB'' GENERIC + ACCESS(READ) ID(*) PERMIT ''SYS1.IMAGELIB'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.IMAGELIB'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.IMAGELIB'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained
    via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the ... (see CIS section 2.2.9)'
