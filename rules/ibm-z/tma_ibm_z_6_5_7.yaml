id: TMA-IBM-Z-6.5.7
title: Ensure that the SERVAUTH resource class is enabled
description: IBM Provides the SERVAUTH Class for use in protecting a variety of TCP/IP features/functions/products both IBM and third-party. Failure to activate this class will result in unprotected resources. This exposure may threaten the integrity of the operating system environment and compromise the confidentiality of customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.7 Ensure that the SERVAUTH resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that SERVAUTH appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that SERVAUTH appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that SERVAUTH appears.'
remediation:
  type: iac_patch
  command: 'To activate RACF classes use the RACF SETROPTS command: SETROPTS CLASSACT(SERVAUTH) To enable generic profile checking for a RACF class use the RACF SETROPTS command: SETROPTS GENERIC(SERVAUTH) To RACLIST a RACF class use the RACF SETROPTS command: SETROPTS RACLIST(SERVAUTH)'
