id: TMA-IBM-Z-9.1
title: Ensure that access to z/OS UNIX SURROGAT resources is controlled
description: Resources in the SURROGAT class that start with BPX.SRV protect the ability to switch to another identity without providing an authenticator. Servers do this programmatically to run under the identity of their clients, and users can issue the shell su command to switch to another identity. Improper protection of BPX.SRV SURROGAT resources can result in unintended privilege escalation and loss of accountability.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.1 Ensure that access to z/OS UNIX SURROGAT resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that SURROGAT appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that SURROGAT appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that SURROGAT appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the SURROGAT entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering BPX.SRV prefixed resources Request reports generated using IRRDBU00 ... (full steps: CIS section 9.1)'
remediation:
  type: iac_patch
  command: 'To activate the SURROGAT class use the RACF SETROPTS command: SETROPTS CLASSACT(SURROGAT) To enable generic profile checking for the SURROGAT class use the RACF SETROPTS command: SETROPTS GENERIC(SURROGAT) To RACLIST the SURROGAT class use the RACF SETROPTS command: SETROPTS RACLIST(SURROGAT) To modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER command: RALTER SURROGAT BPX.SRV.<qualifier> + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
