id: TMA-IBM-Z-2.2.18
title: Ensure that access to IBM Health Checker resources is controlled
description: IBM Health Checker for z/OS is a z/OS component that installations can use to gather information about their system environment and system parameters to help identify potential configuration problems before they impact availability or cause outages. Failure to control access to Health Checker for z/OS resources in the XFACILIT class can result in inadvertent disclosure of system configuration data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.2.18 Ensure that access to IBM Health Checker resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that XFACILIT appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that XFACILIT appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that XFACILIT appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that: The XFACILIT entry has: o -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no HZS prefixed entries Request reports generated using IRRDBU00 output that will ... (full steps: CIS section 2.2.18)'
remediation:
  type: iac_patch
  command: 'To activate RACF classes use the RACF SETROPTS command: SETROPTS CLASSACT(XFACILIT) To enable generic profile checking for a RACF class use the RACF SETROPTS command: SETROPTS GENERIC(XFACILIT) To RACLIST a RACF class use the RACF SETROPTS command: SETROPTS RACLIST(XFACILIT) To create catch-all profiles use the RACF RDEFINE command: RDEFINE XFACILIT HZS.** + UACC(NONE) + AUDIT(FAILURES(READ)) + DATA(''IBM HEALTH CHECKER CATCH-ALL PROFILE'') PERMIT HZS.** CLASS(XFACILIT) + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH RACLIST(XFACILIT) To modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER command: RALTER <class> <profile> + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT <profile> CLASS(<class>) + DELETE ID(<non-compliant>) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>)
    Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both ... (see CIS section 2.2.18)'
