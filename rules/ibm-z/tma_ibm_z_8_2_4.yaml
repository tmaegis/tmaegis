id: TMA-IBM-Z-8.2.4
title: Ensure that access to JESNEWS resources is controlled
description: JESNEWS is a spool data set that is added after the job separator when SYSOUT is printed. Installation use this facility to communicate information to their user community. Ensure that access authorization for updating JESNEWS is restricted to appropriate personnel (i.e. users responsible for maintaining the JES News data set).
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.2.4 Ensure that access to JESNEWS resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that JESSPOOL appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the JESSPOOL entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- Note: The following specific entries can be considered compliant for JESSPOOL, but are not ... (full steps: CIS section 8.2.4)'
remediation:
  type: iac_patch
  command: 'To activate the JESSPOOL class use the RACF SETROPTS command: SETROPTS CLASSACT(JESSPOOL) To enable generic profile checking for the JESSPOOL class use the RACF SETROPTS command: SETROPTS GENERIC(JESSPOOL) To RACLIST the JESSPOOL class use the RACF SETROPTS command: SETROPTS RACLIST(JESSPOOL) To create a JESSPOOL profile use the RACF RDEFINE, PERMIT, and SETROPTS commands: RDEFINE JESSPOOL <localnodeid>.*.$JESNEWS.*.*.JESNEWS + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''CATCH-ALL JES2 JESNEWS'') PERMIT <localnodeid>.*.$JESNEWS.*.*.JESNEWS CLASS(JESSPOOL) + ACCESS(READ) ID(*) PERMIT <localnodeid>.*.$JESNEWS.*.*.JESNEWS CLASS(JESSPOOL) + ACCESS(ALTER) ID(OPERATOR SYSPROG) SETROPTS REFRESH RACLIST(JESSPOOL) To modify the UACC, WARN, or AUDIT settings for a general resource profile use the RACF RALTER and SETROPTS commands: RALTER JESSPOOL <localnodeid>.*.$JESNEWS.*.*.JESNEWS + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH RACLIST(JESSPOOL) To remove a non-compliant access
    list entries use the RACF PERMIT command: PERMIT <profile> CLASS(JESSPOOL) + DELETE ID(<non-compliant>) SETROPTS REFRESH RACLIST(JESSPOOL) To remove a non-compliant GAC entry you ... (see CIS section 8.2.4)'
