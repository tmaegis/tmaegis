id: TMA-IBM-Z-6.4.4
title: Ensure that access to syslog daemon archive data sets is controlled
description: syslogd can be configured to automatically archive log files to sequential or Generation Data Group (GDG) data sets. These archive data sets contain log information from multiple z/OS system components and must be properly protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.4.4 Ensure that access to syslog daemon archive data sets is controlled
audit:
  type: manual
  command: 'Request a list of all syslogd archive data set prefixes specified by the BeginArchiveParms keyword in /etc/syslog.conf configurations. Note: the /etc/syslog.conf file may not be the configuration file the syslogd daemon uses. It is necessary to check the script or JCL used to start the daemon to determine the actual configuration file. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering syslogd archive data sets Request reports generated using ... (full steps: CIS section 6.4.4)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''<syslogd-archive>'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + DATA(''UNIX SYSLOGD ARCHIVE'') PERMIT ''<syslogd-archive>'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''<syslogd-archive>'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''<syslogd-archive>'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable
    GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH ... (see CIS section 6.4.4)'
