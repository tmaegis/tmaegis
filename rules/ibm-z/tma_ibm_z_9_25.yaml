id: TMA-IBM-Z-9.25
title: Ensure that the FSSEC resource class is enabled
description: By default, UNIX security attribute (e.g. owner, permission bits) changes are not logged in SMF Type 80 records. These changes should be logged, just as changes to RACF profiles should be logged. In the absence of SMF Type 80 records for UNIX file security attribute changes, it is more difficult to debug authorization problems and investigate potential attacks.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.25 Ensure that the FSSEC resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that FSSEC appears. Review the command output in the LOGOPTIONS "ALWAYS" CLASSES = section. Verify that FSSEC appears.'
remediation:
  type: iac_patch
  command: 'To activate the FSSEC class use the RACF SETROPTS command: SETROPTS CLASSACT(FSSEC) Note: Activating the FSSEC class enables the use of ACLs in authorization checking. To enforce logging in the FSSEC class use the RACF SETROPTS command: SETROPTS LOGOPTIONS(ALWAYS(FSSEC))'
