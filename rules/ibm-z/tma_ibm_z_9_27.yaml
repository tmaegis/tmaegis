id: TMA-IBM-Z-9.27
title: Ensure that data sets containing user file systems do not have the user ID as the high-level qualifier
description: A naming convention is generally established when allocating new zFS user file systems for a UNIX user to have as their home directory. If the high-level qualifier for this data set is the user's RACF user ID, then the user has read and write access to it outside of the UNIX environment where UNIX authorization checks are not made.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- accounts
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.27 Ensure that data sets containing user file systems do not have the user ID as the high-level qualifier
audit:
  type: manual
  command: Check the names of the zFS aggregates used for user file systems. The shell df command displays all file systems by path name and by zFS data set name. Verify that the data sets in the Filesystem column containing user file systems do not have the user ID as the high-level qualifier.
remediation:
  type: iac_patch
  command: Establish a plan by which to replace these file systems. Modify your provisioning steps (for example, your automount policy) to discontinue the user ID-based naming convention in the high-level qualifier.
