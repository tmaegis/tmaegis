id: TMA-IBM-Z-6.7.2
title: Ensure that access to the system data sets used to support the VTAM network is controlled
description: Ensure that RACF data set rules for all VTAM system data sets restrict access to only network systems programming staff. These data sets include libraries containing VTAM load modules and exit routines, and VTAM start options and definition statements. Failure to properly control VTAM datasets could potentially compromise the network operations.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.7.2 Ensure that access to the system data sets used to support the VTAM network is controlled
audit:
  type: manual
  command: 'FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering VTAM system data sets Request reports generated using IRRDBU00 output that will allow you to: Verify That VTAM system data sets are secured by profiles in the DATASET class that: Have UACC of NONE Are not in WARNING mode AUDIT a minimum of FAILURES(READ) ID(*) is not used to grant access READ and higher permits are restricted to: o Systems Programmers'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''<vtam-dataset>'' GENERIC + UACC(NONE) + AUDIT(FAILURES(READ)) + DATA(''MASTER CATALOG'') PERMIT ''<vtam-dataset>'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''<vtam-dataset>'' GENERIC + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''<vtam-dataset>'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE
    to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
