id: TMA-IBM-Z-6.5.1
title: Ensure configuration files for the TCP/IP stack are explicitly specified
description: The TCP/IP stack reads two configuration files to determine values for critical operational parameters. These file names are specified in multiple locations and, depending on the process, are referenced differently. Inappropriate values could result in undesirable operations and degraded security. This exposure may result in unauthorized access impacting data integrity or the availability of some system services.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.1 Ensure configuration files for the TCP/IP stack are explicitly specified
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TCP/IP stack started tasks. Note: If a TCP/IP stack is inactive, review the procedure libraries defined to JES2 and locate the TCP/IP stack JCL member. Verify that: The following DD statements appear: o SYSTCPD o PROFILE If a PARM parameter is specified on the EXEC statement and it includes an ENVAR keyword and it specifies the RESOLVER_CONFIG variable: o The RESOLVER_CONFIG value must be set to the same file name specified on the SYSTCPD DD statement.'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating started task procedures to add DD statements or update non-compliant PARM parameters.
