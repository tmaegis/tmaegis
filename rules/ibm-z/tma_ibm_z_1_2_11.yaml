id: TMA-IBM-Z-1.2.11
title: Ensure that no expired digital certificates are used
description: When an X.509 certificate stored in RACF has the TRUST or HIGHTRUST status, it can be used by RACF for its intended purpose (map to a user ID, or treat as a trusted certificate authority or trusted site). X.509 certificates expire to prevent prolonged use of potentially compromised private keys and outdated cryptographic algorithms, ensuring that security infrastructure remains up-to-date against evolving threats and that the information within the ...
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.2.11 Ensure that no expired digital certificates are used
audit:
  type: manual
  command: 'Note: Certificates used for password enveloping can continue to be used after expiring and should not be removed if password enveloping is still active. Request reports generated using IRRDBU00 output that will allow you to: Verify that each certificate with a TRUST or HIGHTRUST status is not expired. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_CERTIFICATE_EXPIRATION) Verify that the health check returns this message: IRRH277I No exceptions are detected. Expired ... (full steps: CIS section 1.2.11)'
remediation:
  type: iac_patch
  command: 'Note: Certificates used for password enveloping can continue to be used after expiring and should not be removed if password enveloping is still active. Follow site procedures for certificate life cycle management.'
