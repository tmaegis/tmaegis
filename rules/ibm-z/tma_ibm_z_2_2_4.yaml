id: TMA-IBM-Z-2.2.4
title: Ensure that access to data sets in the PARMLIB concatenation is controlled
description: The z/OS PARMLIB concatenation contains the parameters which control system Initial Program Load (IPL), configuration characteristics, security facilities, and performance. Unauthorized UPDATE authority could result in the compromise of the operating system environment, RACF, and customer data. Unauthorized READ authority provides a means for the surveillance and mapping of the system configuration.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.2.4 Ensure that access to data sets in the PARMLIB concatenation is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering PARMLIB data sets Request reports generated using IRRDBU00 output that will allow you to: Verify That PARMLIB data sets are secured by profiles in the DATASET class that: Have UACC of NONE Are not in WARNING mode AUDIT a minimum of SUCCESS(UPDATE) and FAILURES(READ) ID(*) is not used to grant access READ permits are restricted to: o Security Administrators o Systems Operators o Systems ... (full steps: CIS section 2.2.4)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''<profile>'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''PARMLIB'') PERMIT ''<profile>'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''<profile>'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''<profile>'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL
    profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
