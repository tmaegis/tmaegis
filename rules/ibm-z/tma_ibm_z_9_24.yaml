id: TMA-IBM-Z-9.24
title: Ensure rlogin is not active
description: The rlogin command enables log in to a remote system and navigate through the remote file system and manipulate its contents, copy files, or execute remote commands. rlogin server processing operates in clear text and therefore should be disabled.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- accounts
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.24 Ensure rlogin is not active
audit:
  type: manual
  command: The rlogind server should not be activated through the inet deamon (through /etc/inetd.conf) or permitted in the list of TCPIP services (/etc/services or <hlq>.ETC.SERVICES).
remediation:
  type: iac_patch
  command: The site will have to follow their standard change management procedure for disabling non-compliant z/OS UNIX deamons.
