id: TMA-IBM-Z-2.4.8
title: Ensure that access to the SYS1.UADS data set is controlled
description: SYS1.UADS is the data set in which emergency user IDs are maintained. This ensures that logon processing can occur even if RACF is not functional. Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.4.8 Ensure that access to the SYS1.UADS data set is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering SYS1.UADS Request reports generated using IRRDBU00 output that will allow you to: Verify That SYS1.UADS is secured by a profile in the DATASET class that: Has UACC of NONE Is not in WARNING mode AUDIT a minimum of SUCCESS(READ) and FAILURES(READ) ID(*) is not used to grant access greater than READ READ permits are restricted to: o Auditors o Systems Operators o Systems Programmers UPDATE and ... (full steps: CIS section 2.4.8)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.UADS'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''SYSTEM USER ATTRIBUTE DATA SET (UADS)'') PERMIT ''SYS1.UADS'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.UADS'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.UADS'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to
    remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
