id: TMA-IBM-Z-4.4
title: Ensure that RACF application identity mapping (AIM) is at stage 3
description: Application identity mapping in its final stage, stage 3, is an alternative to the use of mapping profiles to associate RACF user and group names with z/OS UNIX, Lotus Notes, and Novell Directory Services identifiers. For these associations, IRRIRA00 converts the database mapping profile information into an alias index, which uses less space.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 4.4 Ensure that RACF application identity mapping (AIM) is at stage 3
audit:
  type: manual
  command: 'Request the SYSPRINT from IRRIRA00 run without parameters, similar to this example job: //DBSTAGE JOB //STEP EXEC PGM=IRRIRA00 //SYSPRINT DD SYSOUT=A Verify that the message returned is: IRR66017I The system is currently operating in stage 3. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_AIM_STAGE) Verify that the message returned is: IRRH500I The RACF database is at the suggested stage of application identity mapping (AIM). The database is at AIM stage 03.'
remediation:
  type: iac_patch
  command: Refer to the Security Server RACF System Programmer's Guide for considerations and instructions on using the IRRIRA00 utility to advances the application identity mapping stage for RACF databases.
