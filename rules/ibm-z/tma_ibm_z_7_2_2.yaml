id: TMA-IBM-Z-7.2.2
title: Ensure crypto key lifecycle auditing is enabled
description: ICSF can be configured to audit the lifecycle of key material, for example, key creation, key activation, key deletion, etc. The lifecycle events are recorded using SMF Type 82 records. By configuring ICSF to audit key lifecycle events, it is possible to preserve a record of all major events in a key's lifecycle.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.2.2 Ensure crypto key lifecycle auditing is enabled
audit:
  type: manual
  command: 'Issue the following z/OS console command: DISPLAY ICSF,OPTIONS Look for the following message: AUDITKEYLIFECKDS: Audit CCA symmetric key lifecycle events SYSNAME LABEL TOKEN Verify that the LABEL and TOKEN column values are Yes. Look for the following message: AUDITKEYLIFEPKDS: Audit CCA asymmetric key lifecycle events SYSNAME LABEL TOKEN Verify that the LABEL and TOKEN column values are Yes. Look for the following message: AUDITKEYLIFETKDS: Audit PKCS #11 key lifecycle events SYSNAME TOKOBJ SESSOBJ Verify that the TOKOBJ and SESSOBJ column values are Yes.'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating parameters in the ICSF installation options data set to update non-compliant parameters.
