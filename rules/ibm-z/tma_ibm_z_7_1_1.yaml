id: TMA-IBM-Z-7.1.1
title: Ensure that access to ICSF installation data sets is controlled
description: The data sets installed by Integrated Crypto Service Facility (ICSF) need to be protected from unauthorized modifications or deletions. ICSF can use privileged functions and/or have access to sensitive data. Failure to properly restrict access to their installed data sets could result in a loss of system integrity or customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.1.1 Ensure that access to ICSF installation data sets is controlled
audit:
  type: manual
  command: 'Integrated Crypto Service Facility (ICSF) system data sets include, but are not limited to: CSF.SCSFCLI0 CSF.SCSFHDRS CSF.SCSFMOD0 CSF.SCSFMOD1 CSF.SCSFMSG0 CSF.SCSFOBJ CSF.SCSFPNL0 CSF.SCSFSKL0 CSF.SCSFTLIB Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering ICSF system data sets Request reports generated using IRRDBU00 output that will allow you to: Verify that ICSF system data sets are secured by RACF profiles in the DATASET class that: Have ... (full steps: CIS section 7.1.1)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''CSF.**'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''ICSF SYSTEM DATA SETS'') PERMIT ''CSF.**'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''CSF.**'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''CSF.**'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL
    profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
