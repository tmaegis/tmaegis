id: TMA-IBM-Z-2.1.11
title: Ensure that RACF remote sharing connections use the TCP/IP protocol
description: Each individual RACF remote sharing (RRSF) connection to a remote node can use either the original APPC protocol or the newer TCP/IP protocol. APPC can only use DES-based encryption, which is far weaker than the encryption offered by TCP/IP.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.11 Ensure that RACF remote sharing connections use the TCP/IP protocol
audit:
  type: manual
  command: 'Note: The subsystem-prefix must be supplied by the site. For example if a site has chosen "@" then the command would be @TARGET. Issue the following TSO command: <subsystem-prefix>TARGET LISTPROTCOL Verify that the string APPC does not appear in the resulting IRRM009I messages.'
remediation:
  type: iac_patch
  command: Consult the z/OS Security Server RACF System Programmer's Guide for guidance on modifying and securing RRSF connections.
