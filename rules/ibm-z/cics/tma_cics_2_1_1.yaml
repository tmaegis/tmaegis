id: TMA-CICS-2.1.1
title: Ensure that passwords are redacted in line traces
description: CICS traces out information in a trace data, and in dumps for diagnostic purposes. CICS does not display sensitive information in traced internal function calls, but may display information in certain network trace information. The CONFDATA parameter can be used to redact known sensitive information in network trace information.
target: cics
level: 1
severity: high
tags:
- cics
- password-policy
reference: CIS IBM CICS Transaction Server 6.1 Benchmark v1.1.0 - 2.1.1 Ensure that passwords are redacted in line traces
audit:
  type: manual
  command: Issue the z/OSMF Compliance data collection REST API to drive collection of compliance evidence in the SMF 1154 record. https://{host}:{port}/zosmf/compliance/rest/v1/facts 1. Wait for the data to be collected; this may take up to a minute in some regions. 2. Customize and run the DFH$54P sample JCL to create a spreadsheet containing data for all of the CICS TS regions. 3. Open the spreadsheet and review the settings of the CONFDATA column. They should all be set to HIDE.
remediation:
  type: iac_patch
  command: Setting this value to SHOW can reveal passwords and similar sensitive information to someone investigating diagnostic.
