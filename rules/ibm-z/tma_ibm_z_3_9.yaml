id: TMA-IBM-Z-3.9
title: Ensure that required SMF data record types are collected
description: 110 0 ~ CICS journaling 110 1 ~ CICS monitoring 110 2 ~ CICS statistics 110 3 ~ Shared temporary storage queue server statistics 110 4 ~ Coupling facility data table server statistics 110 5 ~ Named counter sequence number server statistics 118 TCP/IP Statistics 119 TCP/IP Statistics 123 IBM z/OS Connect EE
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.9 Ensure that required SMF data record types are collected
audit:
  type: manual
  command: 'Issue the following z/OS console command: D SMF,O Look for the following messages: TYPE(<{aa,bb|aa,bb:zz|aa,bb:zz,…}>) Verify that at a minimum these types and subtypes are collected: Type Subtype'
remediation:
  type: iac_patch
  command: 'To make changes persistent update the SMFPRMxx parmlib member to collect the required types. The specific parameter to use will depend on whether a site uses log streams for SMF recording. Note: The two alphameric characters, represented by xx, are appended to SMFPRM to identify your SMFPRMxx member. The site should follow their standard procedures for cycling the SMF started task to apply the changes.'
