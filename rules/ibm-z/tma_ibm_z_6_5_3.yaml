id: TMA-IBM-Z-6.5.3
title: Ensure hosts identified by the NSINTERADDR statement are protected
description: If the hosts identified by NSINTERADDR statement are not properly protected they can be stolen, damaged, or disturbed. Without adequate physical security, unauthorized users can access the host and the hosts' components. Therefore, they can interfere with the normal operations of the host. Improper control of hosts and the hosts' components could compromise network operations.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.3 Ensure hosts identified by the NSINTERADDR statement are protected
audit:
  type: manual
  command: '1. Refer to the Data configuration file specified on the SYSTCPD DD statement in the TCP/IP started task JCL. 2. Gather the following information for any NSINTERADDR statement coded in the TCP/IP Data configuration file: o Identify the physical location of the host running a DNS server (i.e., on-site or off-site at organization, city, state). o Obtain the description of the physical security controls used to limit access to the area where the host is located.'
remediation:
  type: iac_patch
  command: Verify that if the NSINTERADDR statements are not specified in the TCP/IP Data configuration file, this is not applicable. Verify that the NSITERADDR statements specified in the TCP/IP Data configuration file. The NSINTERADDR statements refer to hosts connected directly to networks within the physical premises of the host site. The NSINTERADDR statements refer to hosts that are located in areas with physical access limited to authorized personnel. Ensure that the hosts and the hosts components identified in the NSINTERADDR statement are protected. Ensure that any NSINTERADDR statements coded in the TCPIP.DATA file refer to hosts connected directly to networks within the physical premises of the host site and located in areas with physical access limited to authorized personnel.
