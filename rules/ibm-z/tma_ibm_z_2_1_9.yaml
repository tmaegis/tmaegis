id: TMA-IBM-Z-2.1.9
title: Ensure that access to the RACF remote sharing facility data sets is controlled
description: When using the RACF remote sharing facility (RRSF) to propagate RACF requests across the network, each node in the configured network has a pair of VSAM files (INMSG and OUTMSG) to save queued work until it is sent, and its receipt is confirmed by the remote node. These files must be protected. Disclosure of this information can compromise user credentials and give clues to the protection mechanisms in effect.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.9 Ensure that access to the RACF remote sharing facility data sets is controlled
audit:
  type: manual
  command: 'Note: The subsystem-prefix must be supplied by the site. For example if a site has chosen "@" then the command would be @TARGET. Issue the following TSO command: <subsystem-prefix>TARGET LIST NODE(*) Review the command output in the FILE USAGE section to determine the RRSF workspace data sets to be evaluated. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_RRSF_RESOURCES) To obtain a list of RRSF workspace data sets. Issue the following TSO command for each RRSF workspace ... (full steps: CIS section 2.1.9)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.RACF.NODE1.**'' GENERIC + UACC(NONE) + AUDIT(FAILURES(READ)) + DATA(''RACF REMOTE SHARING FACILITY (RRSF) FILES'') PERMIT ''SYS1.RACF.NODE1.**'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.RACF.NODE1.**'' GENERIC + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.RACF.NODE1.**'''' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC
    for a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH ... (see CIS section 2.1.9)'
