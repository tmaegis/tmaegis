id: TMA-IBM-Z-6.4.1
title: Ensure syslog daemon is started at z/OS initialization
description: The Syslog daemon, known as syslogd, is a z/OS UNIX daemon that provides a central processing point for log messages issued by other z/OS UNIX processes. The messages may be of varying importance levels including general process information, diagnostic information, critical error notification, and audit-class information.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.4.1 Ensure syslog daemon is started at z/OS initialization
audit:
  type: manual
  command: 'Verify with the site that the syslog daemon (syslogd) is started automatically during the initialization for every z/OS system. Note: syslogd may be started from the UNIX shell, a cataloged procedure (STC), or the BPXBATCH program. Additionally, other mechanisms (e.g., CONTROL-O) may be used to automatically start syslogd. Verify that the WLM service class under which syslogd is classified, is of a high enough to ensure syslogd will not starve for dispatching priority.'
remediation:
  type: iac_patch
  command: Consult the z/OS Communications Server - IP Configuration Guide for guidance on starting and stopping syslogd.
