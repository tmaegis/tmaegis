id: TMA-IBM-Z-8.3.2
title: Ensure that access to JESJOBS CANCEL resources is controlled
description: Resources with a CANCEL high-level qualifier in the JESJOBS resource class control the use of the cancel SSI 2 (used by the CANCEL TSO command) and the cancel function of the job modify SSI 85. Canceling jobs can cause the job to terminate the current phase of processing and optionally purge the job from the system.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.3.2 Ensure that access to JESJOBS CANCEL resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that JESJOBS appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that JESJOBS appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the JESJOBS entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no CANCEL prefixed entries Request reports generated using IRRDBU00 output that will allow you to: Verify That a catch-all profile named CANCEL.* or CANCEL.** or CANCEL.*.** has been ... (full steps: CIS section 8.3.2)'
remediation:
  type: iac_patch
  command: 'To activate the JESJOBS class use the RACF SETROPTS command: SETROPTS CLASSACT(JESJOBS) To enable generic profile checking for the JESJOBS class use the RACF SETROPTS command: SETROPTS GENERIC(JESJOBS) To create a JESJOBS profile use the RACF RDEFINE and PERMIT commands: RDEFINE JESJOBS CANCEL.** + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''CATCH-ALL PROFILE'') PERMIT CANCEL.** CLASS(JESJOBS) + ACCESS(ALTER) ID(OPERATOR SYSPROG) To modify the UACC, WARN, or AUDIT settings for a general resource profile use the RACF RALTER command: RALTER JESJOBS CANCEL.** + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT <profile> CLASS(JESJOBS) + DELETE ID(<non-compliant>) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when
    making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for ... (see CIS section 8.3.2)'
