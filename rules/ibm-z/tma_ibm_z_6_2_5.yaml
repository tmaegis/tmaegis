id: TMA-IBM-Z-6.2.5
title: Ensure user exits for the FTP server are not used without approval
description: Several user exit points in the FTP Server component are available to permit customization of its operating behavior. These exits can be used to modify functions such as FTP command usage, client connection controls, post processing tasks, and SMF record modifications. Without proper review and adequate documentation of these exit programs, undesirable operations and degraded security may result.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- accounts
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.2.5 Ensure user exits for the FTP server are not used without approval
audit:
  type: manual
  command: '1. Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTP started task JCL. o Refer to the file(s) allocated by the STEPLIB DD statement in the FTP started task JCL. o Refer to the libraries specified in the system LINKLIST and LPA. If any FTP Server exits are in use, identify them and validate that they were reviewed for integrity and approved by the site. 2. Ensure the following items are in effect for FTP Server user exits: o The FTCHKCMD, FTCHKIP, FTCHKJES, FTCHKPWD, FTPSMFEX and FTPOSTPR modules are not located in the FTP ... (full steps: CIS section 6.2.5)'
remediation:
  type: iac_patch
  command: 'Review the configuration statements in the FTP.DATA file. Review the FTP daemon STEPLIB, system LINKLIST, and Link Pack Area libraries. If FTP Server exits are enabled or present and have not been approved by the site IAM and not securely written and implemented by the site systems programmer, they should not be installed. Verify that none of the following exits are installed unless they have met the requirements listed above: FTCHKCMD FTCHKIP FTCHKJES FTCHKPWD FTPOSTPR FTPSMFEX'
