id: TMA-IBM-Z-3.5
title: Ensure that SETROPTS INITSTATS is in effect
description: 'SETROPTS INITSTATS records statistics on all user profiles in the system. INITSTATS records the following: The date and time RACF processes a RACROUTE REQUEST=VERIFY (for example, logon or batch job initiation) for a particular user. The number of RACROUTE REQUEST=VERIFYs for a user to a particular group.'
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.5 Ensure that SETROPTS INITSTATS is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Verify that INITSTATS appears. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_PASSWORD_CONTROLS) Verify that INITSTATS in effect has a Value of YES.'
remediation:
  type: iac_patch
  command: 'To modify the INITSTATS parameter use the RACF SETROPTS command: SETROPTS INITSTATS Note: For applications that specify the APPL operand on the RACROUTE REQUEST=VERIFY macro, you can define a profile in the APPL class to specify that the application needs only daily statistics recorded for its users. To do this, specify the RACF-INITSTATS(DAILY) string in the APPLDATA field.'
