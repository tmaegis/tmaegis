id: TMA-IBM-Z-9.17
title: Ensure that security commands in /etc/rc are safe
description: The /etc/rc file contains customization commands for z/OS UNIX System Services Application Services. Part of theses commands are changing files authorization bits and might change auditing options. Sensitive configuration files or logs must be restricted to authorized personnel and audited for system integrity. Text and must not be changed by application services customization commands.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.17 Ensure that security commands in /etc/rc are safe
audit:
  type: manual
  command: 'Verify that any any chmod or chaudit commands targeting sensitive files in active /etc/rc are either removed or configured to set the following values: File Permission Bits User Audit Bits / 755 faf /bin 755 fff /bin/sh 755 faf /dev 755 fff /dev/console 740 fff /dev/null 666 fff /etc 755 faf /etc/auto.master 740 faf /etc/inetd.conf 740 faf File Permission Bits User Audit Bits /etc/init.options 740 faf /etc/log 744 fff /etc/profile 755 faf /etc/rc 744 faf /etc/steplib 740 faf /etc/tablename 740 faf /lib 755 fff /samples 755 fff /tmp 777 fff /u 755 fff /usr ... (full steps: CIS section 9.17)'
remediation:
  type: iac_patch
  command: The site will follow their standard change management process for updating /etc/rc to compliant values.
