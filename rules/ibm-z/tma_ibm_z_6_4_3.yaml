id: TMA-IBM-Z-6.4.3
title: Ensure permission and user audit bits for syslog daemon component are configured
description: Directories and files of the syslog daemon provide the configuration and executable properties of this product. These directories and files must be properly protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data. Failure to properly secure these objects could lead to unauthorized access. This exposure may result in the compromise of the integrity and availability of the operating system environment, ACP, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.4.3 Ensure permission and user audit bits for syslog daemon component are configured
audit:
  type: manual
  command: 'Verify that the permission bits and user audit bits for syslog daemon UNIX files match or are more restrictive than the specified settings listed in the table: File Permission Bits User Audit Bits /usr/sbin/syslogd 740 fff /etc/syslog.conf 744 faf Notes: The /usr/sbin/syslogd object is a symbolic link to /usr/lpp/tcpip/sbin/syslogd. The permission and user audit bits on the target of the symbolic link must have the required settings. The /etc/syslog.conf file may not be the configuration file the daemon uses. It is necessary to check the script or JCL used ... (full steps: CIS section 6.4.3)'
remediation:
  type: iac_patch
  command: 'To modify the audit flags for a UNIX file use the chaudit command: chaudit rwx=f /usr/lpp/tcpip/sbin/syslogd chaudit w=sf,rx+f /etc/syslog.conf To modify the access permissions for a UNIX file use the chmod command: chmod 740 /usr/lpp/tcpip/sbin/syslogd chmod 744 /etc/syslog.conf'
