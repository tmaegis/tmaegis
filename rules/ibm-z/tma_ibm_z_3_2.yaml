id: TMA-IBM-Z-3.2
title: Ensure that SETROPTS SAUDIT is in effect
description: The SETROPTS SAUDIT parameter specifies whether RACF is to log RACF commands issued by users with the SPECIAL or group-SPECIAL attribute. The improper setting of this field can compromise the security of the z/OS environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.2 Ensure that SETROPTS SAUDIT is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Verify that SAUDIT appears. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_AUDIT_CONTROLS) Verify that SETROPTS SAUDIT is in effect has a Value of YES.'
remediation:
  type: iac_patch
  command: 'To modify the SAUDIT parameter use the RACF SETROPTS command: SETROPTS SAUDIT'
