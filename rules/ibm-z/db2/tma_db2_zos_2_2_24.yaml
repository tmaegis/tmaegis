id: TMA-DB2-ZOS-2.2.24
title: Ensure that access to SYSIBM.SYSSEQUENCEAUTH is restricted
description: The SYSIBM.SYSSEQUENCEAUTH table contains users, groups, or roles that have been granted one or more privileges on a sequence. PUBLIC should be restricted from accessing this table. PUBLIC should not have access to this information. Exposing user's privileges over sequences can enable attackers to gain access to your organization's data.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.2.24 Ensure that access to SYSIBM.SYSSEQUENCEAUTH is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND TTNAME = ''SYSSEQUENCEAUTH'' AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has SELECT privilege and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profile that controls access to the SYSIBM.SYSSEQUENCEAUTH table in the MDSNTB class. Examine the universal access (UACC) ... (full steps: CIS section 2.2.24)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke access from PUBLIC: REVOKE ALL ON SYSIBM.SYSSEQUENCEAUTH FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the profile and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
