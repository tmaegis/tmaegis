id: TMA-DB2-ZOS-2.4.4
title: Secure system DBADM authority access
description: The system DBADM authority defines privileges on databases in the Db2 system. It allows an administrator to manage databases across a Db2 subsystem. It is recommended that the system DBADM authority be granted to an authorized ID or a role. If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability of data in the Db2 subsystem will be at increased risk.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.4.4 Secure system DBADM authority access
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check system DBADM authority access: SELECT GRANTEE, GRANTEETYPE FROM SYSIBM.SYSUSERAUTH WHERE SDBADMAUTH = ''Y''; Review the access list to ensure that the grants are aligned with your organization''s access policies. For external security users: Issue the RACF RLIST command to list the profile that controls access to the system DBADM authority in the DSNADM class. Examine the universal access (UACC) and user (USER) settings for the profile. If the UACC setting is READ or the USER setting ... (full steps: CIS section 2.4.4)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the SQL REVOKE statement to revoke system DBADM access from any unauthorized ID or role. For external security users: Issue the RACF RALTER command to update the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
