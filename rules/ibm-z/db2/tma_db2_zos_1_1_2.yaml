id: TMA-DB2-ZOS-1.1.2
title: Ensure that Db2 USS file system is protected
description: The USS file system that contains Db2 product code, such as the IBM Data Server Driver for JDBC and SQLJ, Db2 supplied Java classes, Db2 Java stored procedures support code, and native DLL libraries must be protected from unauthorized modifications or deletions. The USS file systems that contain system and product code must be restricted to authorized personnel and audited. Failure to protect can result in a loss of system services.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.1.2 Ensure that Db2 USS file system is protected
audit:
  type: manual
  command: Starting with the directory with pathname /usr/lpp/db2x10 (where 'x' represents the release indicator) and for each of the sub-directories, issue the following command to review the directory and file permissions. ls -l [pathname]
remediation:
  type: iac_patch
  command: Issue the chmod command to change the access permission as needed.
