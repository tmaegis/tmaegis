id: TMA-DB2-ZOS-2.5.2
title: Secure sensitive data in memory
description: The ENCRYPT_DATAKEY built-in function can be used to encrypt data at the column level. The DECRYPT_DATAKEY_datatype built-in functions can be used to decrypt data. It is recommended to encrypt sensitive data at the column level. If the columns are not encrypted, sensitive data can be exposed in memory.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.5.2 Secure sensitive data in memory
audit:
  type: manual
  command: Identify the columns that contain sensitive data in a table. Query the columns to verify that the data is encrypted.
remediation:
  type: iac_patch
  command: Use the ENCRYPT_DATAKEY and DECRYPT_DATAKEY_datatype built-in functions to encrypt and decrypt the columns that contain sensitive data.
