id: TMA-DB2-ZOS-1.2.2
title: Ensure that authorization is enabled
description: The AUTH subsystem parameter controls authorization checking in Db2. It is recommended that this parameter is set to YES. Disabling all authorization checking opens all Db2 access to PUBLIC.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.2.2 Ensure that authorization is enabled
audit:
  type: manual
  command: Run the DSNTEJ6Z job to obtain the current value of the AUTH subsystem parameter. Verify that the value is set to YES.
remediation:
  type: iac_patch
  command: 1. Edit the DSNTIJUZ job and set the DSN6SPRM.AUTH parameter to YES. 2. Submit DSNTIJUZ to assemble the subsystem parameter. 3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the change.
