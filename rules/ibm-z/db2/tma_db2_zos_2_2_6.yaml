id: TMA-DB2-ZOS-2.2.6
title: Ensure that access to SYSIBM.SYSCONTROLS is restricted
description: The SYSIBM.SYSCONTROLS table contains row permissions and column masks. PUBLIC should be restricted from accessing this table. This table contains sensitive information. No PUBLIC access should be allowed to reduce the risk to your organization's data.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.2.6 Ensure that access to SYSIBM.SYSCONTROLS is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND TTNAME = ''SYSCONTROLS'' AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has SELECT privilege and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profile that controls access to the SYSIBM.SYSCONTROLS table in the MDSNTB class. Examine the universal access (UACC) and user ... (full steps: CIS section 2.2.6)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke access from PUBLIC: REVOKE ALL ON SYSIBM.SYSCONTROLS FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the profile and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
