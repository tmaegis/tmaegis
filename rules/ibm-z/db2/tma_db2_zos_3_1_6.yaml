id: TMA-DB2-ZOS-3.1.6
title: Enable auditing of database administrator access
description: Database administrators manage databases and objects in a database or all databases in the system. Security administrators manage security objects and access control. Auditing tasks performed by database administrators and security administrators can help detect unauthorized or malicious activities that are intended to do harm to Db2 data or the processing environment.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 3.1.6 Enable auditing of database administrator access
audit:
  type: manual
  command: '3.1 Audit considerations 3.1.1 Ensure that audit tracing is enabled during Db2 start up (Manual)   3.1.2 Ensure that critical audit traces are always enabled (Manual)   3.1.3 Ensure that authorization failures are audited (Manual)   3.1.4 Enable audit policies to audit installation system administrator and system operator access (Manual)   3.1.5 Enable auditing of system administrator access (Manual)   3.1.6 Enable auditing of database administrator access (Manual)   Appendix: Change History Date Version Changes for this version Jun 1, 2022 ... (full steps: CIS section 3.1.6)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Enable AUDITPOLICIES with the DBADMIN category to audit system DBADM, DATAACCESS, ACCESSCTRL, SECADM, database DBADM, DBCTRL, and DBMAINT authorities. For external security users: Specify AUDIT(ALL) for the Db2 administrator profiles in RACF and start SMF 80 trace.'
