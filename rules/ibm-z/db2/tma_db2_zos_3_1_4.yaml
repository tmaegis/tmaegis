id: TMA-DB2-ZOS-3.1.4
title: Enable audit policies to audit installation system administrator and system operator access
description: Installation system administrators and installation system operators perform Db2 installation and migration. The installation system administrator role also includes most of the administrative authority, which can perform important tasks such as starting and stopping Db2, controlling traces, accessing all data, and granting and revoking privileges from other users.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 3.1.4 Enable audit policies to audit installation system administrator and system operator access
audit:
  type: manual
  command: 'Issue the following SQL statement to verify that audit policy is enabled to audit installation SYSADM, installation SYSOPR, or all authorities in SYSADMIN category: SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE SYSADMIN IN (''I'',''R'',''*'');'
remediation:
  type: iac_patch
  command: Enable AUDITPOLICIES with the SYSADMIN category to audit installation SYSADM and installation SYSOPR authorities.
