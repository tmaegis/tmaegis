id: TMA-DB2-ZOS-3.1.2
title: Ensure that critical audit traces are always enabled
description: Audit traces that are critical for protecting the security of the system and data should not be stopped without special permission from an external security product such as RACF or without using security administrator authority. If critical audit policies are stopped, important audit data could be lost.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 3.1.2 Ensure that critical audit traces are always enabled
audit:
  type: manual
  command: 'Issue the following SQL statement to verify that tamper-proof or secure audit policies are defined to audit critical data: SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN (''T'',''S'');'
remediation:
  type: iac_patch
  command: According to your organization's policies, define new audit policies or update existing audit policies to be defined as secure or tamper-proof by specifying the DB2START column value of 'S', or 'T'. For tamper-proof audit policies, perform additional steps in RACF, as required.
