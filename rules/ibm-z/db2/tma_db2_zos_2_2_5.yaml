id: TMA-DB2-ZOS-2.2.5
title: Ensure that access to trusted context tables is restricted
description: The following tables are related to trusted context and contain details about trusted context, attributes for trusted context, and the authids that are allowed to use the trusted context. SYSIBM.SYSCONTEXT SYSIBM.SYSCONTEXTAUTHIDS SYSIBM.SYSCTXTTRUSTATTRS PUBLIC should be restricted from accessing these tables.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.2.5 Ensure that access to trusted context tables is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE, TCREATOR, TTNAME FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND TTNAME IN (''SYSCONTEXT'',''SYSCONTEXTAUTHIDS'', ''SYSCTXTTRUSTATTRS'') AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has SELECT privilege and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profiles that control access to the trusted context tables in the ... (full steps: CIS section 2.2.5)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the SQL REVOKE statement to revoke access from PUBLIC. For external security users: Issue the RACF RALTER command to update the profiles and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
