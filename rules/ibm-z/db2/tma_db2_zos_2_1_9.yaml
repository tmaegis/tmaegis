id: TMA-DB2-ZOS-2.1.9
title: Ensure that grant authorization IDs are defined in RACF
description: When Db2 native security is used for access control, you can grant privileges to users or groups using the SQL GRANT statement. If privileges are granted to an authorization- name, it is recommended that you also define the grantee users or groups in RACF. Defining an authorization ID in RACF provides user accountability and prevents unauthorized access through orphan grantees.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.1.9 Ensure that grant authorization IDs are defined in RACF
audit:
  type: manual
  command: Issue the RACF LISTGRP and LISTUSER commands to determine if the authorization IDs are defined in RACF and review the output.
remediation:
  type: iac_patch
  command: Issue the RACF ADDUSER and ADDGROUP commands to define the authorization IDs in RACF.
