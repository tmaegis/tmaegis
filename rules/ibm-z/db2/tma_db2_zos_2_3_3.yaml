id: TMA-DB2-ZOS-2.3.3
title: Ensure that access to the query accelerator tables is restricted
description: 'When a query accelerator is used, the following tables are used by Db2 to control the acceleration behavior: SYSACCEL.SYSACCELERATORS SYSACCEL.SYSACCELERATEDTABLES SYSACCEL.SYSACCELERATEDPACKAGES SYSACCEL.SYSACCELERATEDTABLESAUTH PUBLIC should be restricted from accessing these tables. PUBLIC access to these tables exposes the accelerator server definition, accelerator behavior, and access information and can lead to inconsistent behavior between Db2 and the accelerator.'
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.3.3 Ensure that access to the query accelerator tables is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSACCEL'' AND TTNAME LIKE ''SYSACCEL%'' AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has access and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profiles that control access to the accelerator tables in the MDSNTB class. Examine the universal access (UACC) and user (USER) ... (full steps: CIS section 2.3.3)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the SQL REVOKE statement to revoke access from PUBLIC. For external security users: Issue the RACF RALTER command to update the profiles and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
