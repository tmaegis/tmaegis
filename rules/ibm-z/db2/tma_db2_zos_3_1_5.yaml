id: TMA-DB2-ZOS-3.1.5
title: Enable auditing of system administrator access
description: System administrator authorities perform system administrator tasks and include administrative authorities such as SYSADM, SYSCTRL, and SYSOPR. The SYSADM authority has access to all data. Auditing tasks that are performed by system administrators can help detect unauthorized or malicious activities intended to do harm to Db2 data or the processing environment.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 3.1.5 Enable auditing of system administrator access
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to verify that the audit policy is enabled to audit SYSADM, SYSCTRL, SYSOPR or all authorities in SYSADMIN category: SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE SYSADMIN IN (''L'',''O'',''S'',''*''); For external security users: Ensure that SMF 80 trace is ON and the Db2 administrator profiles in RACF have AUDIT(ALL) specified.'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Enable AUDITPOLICIES with the SYSADMIN category to audit SYSADM, SYSCTRL, and SYSOPR authorities. For external security users: Specify AUDIT(ALL) for the Db2 administrator profiles in RACF and start SMF 80 trace.'
