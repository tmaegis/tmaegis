id: TMA-DB2-ZOS-3.1.3
title: Ensure that authorization failures are audited
description: Audit trace CLASS 1 (IFCID140) audits access attempts that were denied due to inadequate authorization. If this audit traces is not enabled, issues can go undiscovered, and compromises and other incidents can occur without being quickly detected. Auditing authorization failures can help detect unauthorized activities quickly to avoid system or data being compromised. Undetected failed authorization attempts can increase risk to the system and data.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 3.1.3 Ensure that authorization failures are audited
audit:
  type: manual
  command: 'Display the IFCID140 trace: -DISPLAY TRACE (AUDIT) Review the output to make sure IFCID140 trace is enabled.'
remediation:
  type: iac_patch
  command: Enable IFCID140 trace either by issuing the START TRACE command or through the audit policy CHECKING category.
