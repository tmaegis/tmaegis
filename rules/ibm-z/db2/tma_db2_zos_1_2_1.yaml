id: TMA-DB2-ZOS-1.2.1
title: Ensure that RACF changes are accepted immediately
description: The AUTHEXIT_CACHEREFRESH subsystem parameter refreshes the global authentication cache entries for user profile changes in RACF and authorization cache entries for external security users for resource and user profile changes. It is recommended that this security subsystem parameter is set to ALL. Removing the cache entries prevents users whose profiles are changed in RACF from accessing Db2 resources.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.2.1 Ensure that RACF changes are accepted immediately
audit:
  type: manual
  command: Run the DSNTEJ6Z job to obtain the current value of the AUTHEXIT_CACHEREFRESH subsystem parameter. Verify that the value is set to ALL.
remediation:
  type: iac_patch
  command: 1. Edit the DSNTIJUZ job and set the DSN6SPRM.AUTHEXIT_CACHEREFRESH parameter to ALL. 2. Submit DSNTIJUZ to assemble the subsystem parameter. 3. Stop and restart Db2 for the change to take effect.
