id: TMA-DB2-ZOS-2.6.2
title: Secure column values using column mask
description: A column mask defines a column access control rule that specifies the conditions under which a user, group, or role can receive the masked values that are returned for a column. Enabling column masking is recommended for tables that contain sensitive data to mask out column values that are returned, according to your organization's security and database access policies.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.6.2 Secure column values using column mask
audit:
  type: manual
  command: 'Issue the following SQL statement and review the output to verify that column masks are enabled and that they comply with your organization''s existing security policy: SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''M'';'
remediation:
  type: iac_patch
  command: Issue the SQL CREATE MASK statement to create a column mask for column access control according to your organization's policy. Issue the SQL ALTER TABLE statement with the ACTIVATE COLUMN ACCESS CONTROL option to activate the column masks.
