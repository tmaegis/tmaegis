id: TMA-DB2-ZOS-2.1.6
title: Secure connections by using trusted contexts
description: Trusted context provides the capability to enforce the security attributes for a connection, switch users in the connection with optional authentication, and acquire one or more privileges that are not available outside of the trusted context. It is recommended that you enable trusted context for connections that use shared IDs.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.1.6 Secure connections by using trusted contexts
audit:
  type: manual
  command: 1. Issue the following SQL statement to verify that a trusted context is enabled. SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE, ENABLED, ALLOWPUBLIC, AUTHENTICATEPUBLIC FROM SYSIBM.SYSCONTEXT; SELECT CONTEXTID, NAME, VALUE FROM SYSIBM.SYSCTXTTRUSTATTRS; SELECT CONTEXTID, AUTHID, AUTHENTICATE, ROLE FROM SYSIBM.SYSCONTEXTAUTHIDS; 2. Review the trusted context definition.
remediation:
  type: iac_patch
  command: Create and enable trusted contexts based on the rules of your organization.
