id: TMA-DB2-ZOS-1.2.4
title: Ensure that generic error codes are returned for remote security errors
description: The EXTSEC subsystem parameter specifies whether detailed reason codes are returned to a DRDA client when a DDF connection request fails due to security errors. It is recommended to set the value to NO to return generic error codes to the clients. The detailed error codes can expose the reason for a potential fraudulent logon attempt.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.2.4 Ensure that generic error codes are returned for remote security errors
audit:
  type: manual
  command: Run the DSNTEJ6Z job to obtain the current value of the EXTSEC subsystem parameter. Verify that the value is set to NO.
remediation:
  type: iac_patch
  command: 1. Edit the DSNTIJUZ job and set the DSN6SYSP.EXTSEC parameter to NO. 2. Submit DSNTIJUZ to assemble the subsystem parameter. 3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the change.
