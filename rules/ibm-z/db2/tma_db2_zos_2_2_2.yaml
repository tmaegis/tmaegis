id: TMA-DB2-ZOS-2.2.2
title: Ensure that access to SYSIBM.SYSAUDITPOLICIES is restricted
description: The SYSIBM.SYSAUDITPOLICIES table contains all audit policies. PUBLIC should be restricted from accessing this table. Exposing sensitive information about the auditing security on Db2 servers can compromise security. Access to the audit policies can enable attackers to avoid detection.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- audit
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.2.2 Ensure that access to SYSIBM.SYSAUDITPOLICIES is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND TTNAME = ''SYSAUDITPOLICIES'' AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has SELECT privilege and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profile that controls access to the SYSIBM.SYSAUDITPOLICIES table in the MDSNTB class. Examine the universal access (UACC) ... (full steps: CIS section 2.2.2)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke access from PUBLIC: REVOKE ALL ON SYSIBM.SYSAUDITPOLICIES FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the profile and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
