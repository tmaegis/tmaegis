id: TMA-DB2-ZOS-2.5.1
title: Ensure that data is encrypted at rest and in-flight
description: Db2 for z/OS uses z/OS DFSMS data set encryption to transparently encrypt Db2 data sets. DFSMS data set encryption can be used to encrypt various types of Db2 data sets including Db2-managed table space and index space data sets, log data sets, and data sets that are used by Db2 utilities. DFSMS data set encryption uses a key label to encrypt and decrypt the data.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.5.1 Ensure that data is encrypted at rest and in-flight
audit:
  type: manual
  command: 'Check whether the Db2 data sets are encrypted by using the following options: The REPORT TABLESPACESET utility The ADMIN_DS_LIST Db2-supplied stored procedure For current active log data sets, the DISPLAY LOG command For current archive log data sets, the DISPLAY ARCHIVE command DFSMS interfaces such as IDCAMS LISTCAT and SMF records'
remediation:
  type: iac_patch
  command: Use the instructions in Encrypting data with z/OS data set encryption to encrypt the various types of data sets.
