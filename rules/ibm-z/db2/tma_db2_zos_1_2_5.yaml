id: TMA-DB2-ZOS-1.2.5
title: Separate security administration from system administration
description: The SEPARATE_SECURITY subsystem parameter allows you to separate security administrator duties from the Db2 system administrator duties when using native Db2 authorization. It is recommended to set SEPARATE_SECURITY=YES. When SEPARATE_SECURITY is set to YES, SECADM authority is required for security administration.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.2.5 Separate security administration from system administration
audit:
  type: manual
  command: Run the DSNTEJ6Z job to obtain the current value of the SEPARATE_SECURITY subsystem parameter. Verify that the value is set to YES.
remediation:
  type: iac_patch
  command: 1. Ensure that the current SQLID is one of the authorization IDs of the process for applications that use SYSADM authority to set current SQLID. 2. Ensure that the binder has BINDAGENT privilege from the owner for the bind and rebind processes that use SYSADM, SYSCTRL, or system DBADM authority to specify the OWNER keyword. 3. Edit the DSNTIJUZ job and set the DSN6SPRM.SEPARATE_SECURITY parameter to YES. 4. Submit DSNTIJUZ to assemble the subsystem parameter. 5. Either issue the -SET SYSPARM command or stop and restart Db2 to activate the changes.
