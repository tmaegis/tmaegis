id: TMA-DB2-ZOS-1.2.3
title: Ensure that the default authorization IDs are changed from the installation defined
description: The following subsystem parameters specify default authorization IDs. It Is recommended to change the installation-specified default values and ensure the authorization IDs are defined in RACF. SYSTEM ADMIN 1 - Specifies the first of two authorization IDs to which installation SYSADM authority is assigned.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- hardening
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 1.2.3 Ensure that the default authorization IDs are changed from the installation defined
audit:
  type: manual
  command: Run the DSNTEJ6Z job to obtain the current values of the SYSTEM ADMIN 1, SYSTEM ADMIN 2, SYSTEM OPERATOR 1, SYSTEM OPERATOR 2, SECURITY ADMIN 1, SECURITY ADMIN 2, and UNKNOWN AUTHID subsystem parameters. Verify that the default values are changed.
remediation:
  type: iac_patch
  command: 1. Edit the DSNTIJUZ job and set the default values for SYSTEM ADMIN 1, SYSTEM ADMIN 2, SYSTEM OPERATOR 1, SYSTEM OPERATOR 2, SECURITY ADMIN 1, SECURITY ADMIN 2, and UNKNOWN AUTHID subsystem parameters. 2. Submit DSNTIJUZ to assemble the subsystem parameters. 3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the changes.
