id: TMA-DB2-ZOS-2.1.5
title: Secure remote connections by using TCP/IP Network Access control with the RACF SERVAUTH class
description: The z/OS communications server TCP/IP network access control provides the ability to control access to Db2 from a range of IP addresses that are defined as a security zone. The TCP/IP network access control with RACF SERVAUTH class protects access to Db2 by allowing users to connect only from approved part of the network.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- network
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.1.5 Secure remote connections by using TCP/IP Network Access control with the RACF SERVAUTH class
audit:
  type: manual
  command: '1.Review your TCP/IP profile data set for the NETACCESS statement definition and determine if the security zones are defined correctly. You can use the NETSTAT CONFIG (TSO) or netstat -x f (USS) command to display the current TCP/IP configuration, including the NETACCESS rules. Both of the commands in the example below display the current configuration for the TCP/IP stack named TCPIP2: (TSO) NETSTAT CONFIG TCP TCPIP2 (USS) netstat -f -p tcpip2 2.Issue the RACF RLIST command to display the list of users or groups that have access to the corresponding ... (full steps: CIS section 2.1.5)'
remediation:
  type: iac_patch
  command: 1. Configure the TCP/IP network access control by using the NETACCESS statement in your TCP/IP profile. 2. Permit users access to the corresponding profile for the TCP network security zone access in the RACF SERVAUTH class based on the rules of your organization.
