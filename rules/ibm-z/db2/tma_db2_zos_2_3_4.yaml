id: TMA-DB2-ZOS-2.3.4
title: Ensure that access to profile tables is restricted
description: 'When profiles are used for monitoring and controlling Db2 in specific application contexts, the following tables are used to define the profiles, provide the filtering criteria, and specify the action that Db2 takes for the processes that meet the filtering criteria: SYSIBM.DSN_PROFILE_TABLE SYSIBM.DSN_PROFILE_HISTORY SYSIBM.DSN_PROFILE_ATTRIBUTES ...'
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- accounts
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.3.4 Ensure that access to profile tables is restricted
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check if PUBLIC has access: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND TTNAME LIKE ''DSN_PROFILE%'' AND GRANTEE = ''PUBLIC''; Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC has access and the remediation steps should be followed. For external security users: Issue the RACF RLIST command to list the profile that controls access to the profile tables in the MDSNTB class. Examine the universal access (UACC) and user (USER) settings ... (full steps: CIS section 2.3.4)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the SQL REVOKE statement to revoke access from PUBLIC. For external security users: Issue the RACF RALTER command to update the profiles and change the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
