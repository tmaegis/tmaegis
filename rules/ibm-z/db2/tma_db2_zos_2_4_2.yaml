id: TMA-DB2-ZOS-2.4.2
title: Secure SYSCTRL authority access
description: The SYSCTRL authority defines the system control authority. It is recommended that the SYSCTRL authority be granted to an authorization ID or a role. Allowing SYSCTRL authority for PUBLIC jeopardizes the Db2 system and organizational data.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.4.2 Secure SYSCTRL authority access
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check SYSCTRL authority access: SELECT GRANTEE, GRANTEETYPE FROM SYSIBM.SYSUSERAUTH WHERE SYSCTRLAUTH IN (''G'',''Y''); If PUBLIC has SYSCTRL access, follow the remediation steps. Review the access list to ensure that the grants are aligned with your organization''s access policies. For external security users: Issue the RACF RLIST command to list the profile that controls access to the SYSCTRL authority in the DSNADM class. Examine the universal access (UACC) and user (USER) settings for the ... (full steps: CIS section 2.4.2)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke SYSCTRL access from PUBLIC: REVOKE SYSCTRL FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
