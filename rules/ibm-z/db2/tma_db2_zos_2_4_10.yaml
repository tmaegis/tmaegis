id: TMA-DB2-ZOS-2.4.10
title: Secure database DBCTRL authority access
description: The DBCTRL authority defines privileges on a database. It includes the DBMAINT privileges on a specific database. A user with the DBCTRL authority can run utilities that can change the data. It is recommended that the DBCTRL authority be granted to an authorized ID or a role. Allowing DBCTRL authority for PUBLIC jeopardizes the Db2 system and organizational data. If an account that possesses this authority is compromised or used in a malicious manner, Db2 data will be at increased risk.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.4.10 Secure database DBCTRL authority access
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check DBCTRL authority access: SELECT GRANTEE, GRANTEETYPE, NAME FROM SYSIBM.SYSDBAUTH WHERE DBCTRLAUTH IN (''G'',''Y''); If PUBLIC has DBCTRL access, follow the remediation steps. Review the access list to ensure that the grants are aligned with your organization''s access policies. For external security users: Issue the RACF RLIST command to list the profile that controls access to the DBCTRL authority in the DSNADM class. Examine the universal access (UACC) and user (USER) settings for the ... (full steps: CIS section 2.4.10)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke DBCTRL access from PUBLIC: REVOKE DBCTRL FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
