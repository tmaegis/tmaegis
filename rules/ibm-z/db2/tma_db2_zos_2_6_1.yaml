id: TMA-DB2-ZOS-2.6.1
title: Secure row access using row permission
description: A row permission defines a row access control rule that specifies the conditions under which a user, group, or role can access rows of data in a table. It is recommended to enable row permission for tables that contain sensitive data and allow access to users according to your organization's security and database access policies.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.6.1 Secure row access using row permission
audit:
  type: manual
  command: 'Issue the following SQL statement and review the output to verify that the row permissions are enabled and that they comply with your organization''s existing security policy: SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''R'';'
remediation:
  type: iac_patch
  command: Issue the SQL CREATE PERMISSION statement to create a row permission for row access control according to your organization's policy. Issue the SQL ALTER TABLE statement with the ACTIVATE ROW ACCESS CONTROL option to activate the row permissions.
