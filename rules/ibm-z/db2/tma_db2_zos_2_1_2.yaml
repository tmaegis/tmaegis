id: TMA-DB2-ZOS-2.1.2
title: Ensure secure authentication is enabled for remote access
description: The TCPALVER subsystem parameter specifies the type of security credentials to accept for TCP/IP connection requests. It is recommended that you set the parameter to SERVER_ENCRYPT and require encrypted security credentials. With the required permissions to use the RACF passticket service, you can use RACF passticket to connect to Db2.
target: db2-zos
level: 1
severity: high
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.1.2 Ensure secure authentication is enabled for remote access
audit:
  type: manual
  command: 1. Run the DSNTEJ6Z job to obtain the current value of the TCPALVER subsystem parameter. 2. Verify that the parameter is set to SERVER_ENCRYPT.
remediation:
  type: iac_patch
  command: 1. Configure your remote systems and clients to use secure credentials. 2. Turn on IFCID 365 trace to audit authentication information for remote connections. 3. Edit the DSNTIJUZ job and set DSN6FAC.TCPALVER=SERVER_ENCRYPT. 4. Submit DSNTIJUZ to assemble the zparm. 5. Issue the -SET SYSPARM command or stop and restart Db2 for the change to take effect.
