id: TMA-DB2-ZOS-2.4.11
title: Secure database DBMAINT authority access
description: The DBMAINT authority defines certain privileges on a database. Its holder can grant the privileges on a specific database to an ID and can perform actions such as creating objects within that database. It is recommended that the DBMAINT authority be granted to an authorized ID or a role. Allowing DBMAINT authority for PUBLIC jeopardizes the Db2 system and organizational data. If an account that possesses this authority is compromised or used in a malicious manner, Db2 data will be at increased risk.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.4.11 Secure database DBMAINT authority access
audit:
  type: manual
  command: 'For Db2 internal security users: Issue the following SQL statement to check DBMAINT authority access: SELECT GRANTEE, GRANTEETYPE, NAME FROM SYSIBM.SYSDBAUTH WHERE DBMAINTAUTH IN (''G'',''Y''); If PUBLIC has DBMAINT access, follow the remediation steps. Review the access list to ensure that the grants are aligned with your organization''s access policies. For external security users: Issue the RACF RLIST command to list the profile that controls access to the DBMAINT authority in the DSNADM class. Examine the universal access (UACC) and user (USER) settings for ... (full steps: CIS section 2.4.11)'
remediation:
  type: iac_patch
  command: 'For Db2 internal security users: Issue the following SQL statement to revoke DBMAINT access from PUBLIC: REVOKE DBMAINT FROM PUBLIC; For external security users: Issue the RACF RALTER command to update the UACC setting to NONE. Issue the RACF PERMIT command to remove the ID(*) and specify users or groups.'
