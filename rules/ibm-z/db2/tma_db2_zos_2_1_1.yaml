id: TMA-DB2-ZOS-2.1.1
title: Ensure subsystem access is protected
description: The profiles specified in the DSNR RACF resource class control access to a Db2 for z/OS subsystem from another environment. It is recommended that you activate the DSNR class and define a profile with a name in the form of subsystem.environment for each subsystem and environment combination that you want to use.
target: db2-zos
level: 1
severity: medium
tags:
- db2-zos
- permissions
reference: CIS IBM Db2 13 for z/OS Benchmark v1.0.0 - 2.1.1 Ensure subsystem access is protected
audit:
  type: manual
  command: The RACF RLIST command displays the list of users or groups who have access to the corresponding profile for subsystem access in the DSNR class. RLIST DSNR subsystem.environment ALL Review the output to make sure that access is permitted according to the rules of your organization. Ensure that you specify UACC(NONE) and no ID(*) to prevent universal access.
remediation:
  type: iac_patch
  command: Permit users access to the corresponding profile for subsystem access based on the rules of your organization.
