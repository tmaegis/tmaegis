id: TMA-IBM-Z-8.5.2
title: Ensure that RACF is called for data sets opened by JES2
description: The Program Property Table (PPT) provides an option to bypass password checking for data sets (NOPASS). This causes OPEN processing to bypass the call to RACF data set access authorization for the specified address space. JES2 is defined with the attribute PASS which requires that RACF be called for all data set access.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.5.2 Ensure that RACF is called for data sets opened by JES2
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM SYSPPT Verify that the BYPASS PASSWORD PROTECTION column value for HASJES20 is NO.'
remediation:
  type: iac_patch
  command: Update the SHEDxx PARMLIB member to remove the NOPASS specification for HASJES20.
