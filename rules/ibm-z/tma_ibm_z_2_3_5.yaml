id: TMA-IBM-Z-2.3.5
title: Ensure that the ACEECHK resource class is enabled
description: The ACEE (Accessor Environment Element) is a control block that contains a description of a user's security environment, including user ID, current connect group, user attributes, and group authorities. An ACEE is constructed during user identification and verification, using information in the user's RACF profile, and is anchored in the user's address space.
target: ibm-z
level: 2
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.3.5 Ensure that the ACEECHK resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that ACEECHK appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that ACEECHK appears. Request reports generated using IRRDBU00 output that will allow you to: Verify that any IRR.EXCLUDE prefixed profile in the ACEECHK class has a documented justification. Note: When RACF detects an ACEE modification it will check the ACEECHK class for the existence of a best fit IRR.EXCLUDE prefixed profile, which enables IRR421I ... (full steps: CIS section 2.3.5)'
remediation:
  type: iac_patch
  command: 'To activate the ACEECHK class use the RACF SETROPTS command: SETROPTS CLASSACT(ACEECHK) To RACLIST the ACEECHK class use the RACF SETROPTS command: SETROPTS RACLIST(ACEECHK)'
