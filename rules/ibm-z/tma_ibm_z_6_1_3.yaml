id: TMA-IBM-Z-6.1.3
title: Ensure AT-TLS protection is enabled for CSSMTP
description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that subsequently flows between the two. Failure to properly enforce adequate encryption strength could result in the loss of data privacy.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.1.3 Ensure AT-TLS protection is enabled for CSSMTP
audit:
  type: manual
  command: 'Refer to the CSSMTP configuration file specified on the CONFIG DD statement in the CSSMTP started task JCL. Verify that each TargetServer statement specifies the SECURE YES parameter. Note: For any TargetServer that does not specify SECURE YES, then verify that each JES batch job that sends mail through CSSMTP uses the STARTTLS command to specifically request TLS protection of its outbound mail to the target Message Transfer Agent (MTA).'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating CSSMTP configuration file statements with compliant values.
