id: TMA-IBM-Z-1.1.8
title: Ensure that the SETROPTS RVARYPW values are secured with KDFAES
description: RVARY passwords are used to respond to requests to approve RVARY command processing, where SWITCH is the response to a request to switch RACF databases or change the operating mode of RACF, and STATUS is the response to a request to change RACF or database status from ACTIVE to INACTIVE or from INACTIVE to ACTIVE.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.1.8 Ensure that the SETROPTS RVARYPW values are secured with KDFAES
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following messages are present: INSTALLATION DEFINED RVARY SWITCH KDFAES PASSWORD IS IN EFFECT. INSTALLATION DEFINED RVARY STATUS KDFAES PASSWORD IS IN EFFECT.'
remediation:
  type: iac_patch
  command: 'To modify modify the RVARYPW parameter use the RACF SETROPTS command: SETROPTS RVARYPW(SWITCH(xxxxx) STATUS(yyyyy) KDFAES) Note: You may use your existing passwords. SETROPTS does not keep a history for RVARY passwords.'
