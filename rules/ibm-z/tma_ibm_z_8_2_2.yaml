id: TMA-IBM-Z-8.2.2
title: Ensure that access to JES2 spool resources is controlled
description: JESSPOOL resources controls access to data stored on the JES SPOOL data sets. This includes all SYSOUT and instream data set, JCL, SYSLOG, JESTRACE, and JESNEWS data sets stored on spool and the control blocks that represent those data set. Failure to manager access to resources in the JESSPOOL class may threaten the integrity and availability of the operating system environment and compromise the confidentiality of customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.2.2 Ensure that access to JES2 spool resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that JESSPOOL appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the JESSPOOL entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- Note: The following specific entries can be considered compliant, but are not encouraged ... (full steps: CIS section 8.2.2)'
remediation:
  type: iac_patch
  command: 'To activate the JESSPOOL class use the RACF SETROPTS command: SETROPTS CLASSACT(JESSPOOL) To enable generic profile checking for the JESSPOOL class use the RACF SETROPTS command: SETROPTS GENERIC(JESSPOOL) To RACLIST the JESSPOOL class use the RACF SETROPTS command: SETROPTS RACLIST(JESSPOOL) To create a JESSPOOL profile use the RACF RDEFINE, PERMIT, and SETROPTS commands: RDEFINE JESSPOOL ** + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''CATCH-ALL PROFILE FOR JES SPOOL OUTPUT'') PERMIT ** CLASS(JESSPOOL) + ACCESS(ALTER) ID(OPERATOR SYSPROG) SETROPTS REFRESH RACLIST(JESSPOOL) To modify the UACC, WARN, or AUDIT settings for a general resource profile use the RACF RALTER and SETROPTS commands: RALTER JESSPOOL ** + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH RACLIST(JESSPOOL) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ** CLASS(JESSPOOL) + DELETE ID(<non-compliant>) SETROPTS REFRESH RACLIST(JESSPOOL) To remove a non-compliant GAC entry
    you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is ... (see CIS section 8.2.2)'
