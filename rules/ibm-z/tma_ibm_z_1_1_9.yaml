id: TMA-IBM-Z-1.1.9
title: Ensure SETROPTS PASSWORD(MIXEDCASE) is in effect
description: SETROPTS PASSWORD(MIXEDCASE) indicates that all applications on this system and those that share the RACF database support mixed-case and lowercase passwords. Password composition or complexity requirements are used to increase the strength of a user-created password of a given length.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- password-policy
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.1.9 Ensure SETROPTS PASSWORD(MIXEDCASE) is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the PASSWORD PROCESSING OPTIONS: section. Verify the following messages are present: MIXED CASE PASSWORD SUPPORT IS IN EFFECT'
remediation:
  type: iac_patch
  command: 'To enable mixed-case and lowercase passwords use the MIXEDCASE parameter of the RACF SETROPTS command: SETROPTS PASSWORD(MIXEDCASE)'
