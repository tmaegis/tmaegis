id: TMA-IBM-Z-7.1.3
title: Ensure CSFINPV2 requires signature verification
description: Certain z/OS load modules can have an associated signature generated by IBM that is verified by the system when the module is loaded into system storage for execution. The way to ensure the signature verification occurs is by defining a profile in the PROGRAM class with the SIGVER segment. By verifying the IBM generated signature when a module is loaded into storage, the integrity and authenticity of the module are guaranteed.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.1.3 Ensure CSFINPV2 requires signature verification
audit:
  type: manual
  command: 'Request reports generated using IRRDBU00 output that will allow you to: Verify that a CSFINPV2 profile in the PROGRAM class is defined and: Is not in WARNING mode AUDIT a minimum of FAILURES(READ) Has a SIGVER segment with the following values: o FAILLOAD is ANYBAD o SIGAUDIT is ANYBAD o SIGREQUIRED is YES'
remediation:
  type: iac_patch
  command: 'To create a PROGRAM profile use the RACF RDEFINE and PERMIT commands: RDEFINE PROGRAM CSFINPV2 + AUDIT(FAILURES(READ)) + ADDMEM(''SYS1.SIEALNKE''//NOPADCHK) + SIGVER( + FAILLOAD(ANYBAD) + SIGAUDIT(ANYBAD) + SIGREQUIRED(YES) + ) SETROPTS REFRESH WHEN(PROGRAM) To modify the AUDIT, WARN, or SIGVER segment settings for a general resource profile use the RACF RALTER command: RALTER PROGRAM ICHDSM00 + AUDIT(FAILURES(READ)) + NOWARNING + SIGVER( + FAILLOAD(ANYBAD) + SIGAUDIT(ANYBAD) + SIGREQUIRED(YES) + ) SETROPTS REFRESH WHEN(PROGRAM)'
