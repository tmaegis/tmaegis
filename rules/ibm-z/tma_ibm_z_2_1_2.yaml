id: TMA-IBM-Z-2.1.2
title: Ensure that access to active SMF collection files is controlled
description: SMF data collection is the system activity journaling facility of the z/OS system. With the proper parameter designations, it serves as the basis to ensure individual user accountability. SYS1.MANxx datasets should be created once and reused when cleared. Users may have UPDATE access to the datasets, but ALTER allows for dataset deletion and should be avoided. ALTER access reduces the integrity and availability of the operating system environment and reduces compromises of confidential customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.2 Ensure that access to active SMF collection files is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering SYS1.MANxx datasets Request reports generated using IRRDBU00 output that will allow you to: Verify that SYS1.MANxx data sets are secured by RACF profiles in the DATASET class that: Have UACC of NONE Are not in WARNING mode AUDIT a minimum of SUCCESS(UPDATE) and FAILURES(READ) ID(*) is not used to grant access READ and higher permits are restricted to: o Systems Programmers o IDs authorized to access these resources at this level'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.MAN*'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + DATA(''SMF COLLECTION FILES'') PERMIT ''SYS1.MAN*'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.MAN*'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.MAN*'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to
    use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
