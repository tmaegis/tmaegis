id: TMA-IBM-Z-9.23
title: Ensure USS Telnet server is not active
description: Running the USS Telnet server is a security concern as telnet data flow is not encrypted. SSH is recommended. Using an unencrypted network protocol results in clear text passwords being sent across the network connection.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.23 Ensure USS Telnet server is not active
audit:
  type: manual
  command: The otelnetd server should not be activated through the inet deamon (through /etc/inetd.conf) or permitted in the list of TCPIP services (/etc/services or <hlq>.ETC.SERVICES).
remediation:
  type: iac_patch
  command: The site will have to follow their standard change management procedure for disabling non-compliant z/OS UNIX deamons.
