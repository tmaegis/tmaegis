id: TMA-IBM-Z-8.3.6
title: Ensure that access to JESJOBS JOBNFY resources is controlled
description: Resources with a JOBNFY high-level qualifier in the JESJOBS resource class control the use of the HTTP post notification of job status. Users of the JOBS REST API (and the internal reader) can specify an address where a HTTP POST notification is sent when certain job transitions occur (such as the job completes).
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.3.6 Ensure that access to JESJOBS JOBNFY resources is controlled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that JESJOBS appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that JESJOBS appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the JESJOBS entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no JOBNFY prefixed entries Request reports generated using IRRDBU00 output that will allow you to: Verify That a catch-all profile named JOBNFY.* or JOBNFY.** or JOBNFY.*.** has been ... (full steps: CIS section 8.3.6)'
remediation:
  type: iac_patch
  command: 'To activate the JESJOBS class use the RACF SETROPTS command: SETROPTS CLASSACT(JESJOBS) To enable generic profile checking for the JESJOBS class use the RACF SETROPTS command: SETROPTS GENERIC(JESJOBS) To create a JESJOBS profile use the RACF RDEFINE and PERMIT commands: RDEFINE JESJOBS JOBNFY.** + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''CATCH-ALL PROFILE'') PERMIT JOBNFY.** CLASS(JESJOBS) + ACCESS(READ) ID(SYSPROG) To modify the UACC, WARN, or AUDIT settings for a general resource profile use the RACF RALTER command: RALTER JESJOBS JOBNFY.** + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT <profile> CLASS(JESJOBS) + DELETE ID(<non-compliant>) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes
    to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class ... (see CIS section 8.3.6)'
