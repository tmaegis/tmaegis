id: TMA-IBM-Z-6.3.2
title: Ensure SSH daemon is configured to use FIPS 140-2 compliant cryptographic provider
description: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. Cryptographic modules must adhere to the higher standards approved by the United States federal government since this provides assurance they have been tested and validated. The FIPS-140 standard requires strict adherence to the use of strong cryptographic algorithms and keys and built-in integrity checks by compliant cryptographic modules.
target: ibm-z
level: 2
severity: medium
tags:
- ibm-z
- ssh
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.3.2 Ensure SSH daemon is configured to use FIPS 140-2 compliant cryptographic provider
audit:
  type: manual
  command: 'Review the active sshd_config (OpenSSH daemon configuration files). Verify that: The Ciphers keyword list contains ciphers prefixed with aes and without the @openssh.com suffix. The MACs keyword list contains entries greater than hmac-sha-256 Review the active zos_sshd_config (z/OS-specific OpenSSH daemon configuration files). Verify that: The CiphersSource keyword value is ICSF The FIPSMODE keyword value is yes The HostKeyRingLabel keyword is coded The KexAlgorithmsSource keyword value is ICSF The MacsSource keyword value is ICSF'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating sshd_config configuration files with compliant values.
