id: TMA-IBM-Z-1.2.5
title: Ensure that the OPERCMDS resource class is enabled
description: SETROPTS CLASSACT(OPERCMDS) specifies that the class OPERCMDS will have RACF protection is to be in effect for it. These values become effective immediately after the command SETROPTS CLASSACT(OPERCMDS) is issued. If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields, individually or in combination with another, can compromise the security of the processing environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.2.5 Ensure that the OPERCMDS resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that OPERCMDS appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that OPERCMDS appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that OPERCMDS appears.'
remediation:
  type: iac_patch
  command: 'To activate the OPERCMDS class use the RACF SETROPTS command: SETROPTS CLASSACT(OPERCMDS) To enable generic profile checking for the OPERCMDS class use the RACF SETROPTS command: SETROPTS GENERIC(OPERCMDS) To RACLIST the OPERCMDS class use the RACF SETROPTS command: SETROPTS RACLIST(OPERCMDS)'
