id: TMA-IBM-Z-2.1.6
title: Ensure that the SETROPTS ERASE value is set to ALL
description: SETROPTS ERASE(ALL) specifies that data management is to erase all scratched data sets including temporary data sets. NOERASE specifies that no DASD data sets are erased when deleted. The system-wide options control the default settings for determining how RACF will function when handling requests for access to the operating system environment, RACF, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.6 Ensure that the SETROPTS ERASE value is set to ALL
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output and look for the following message: ERASE-ON-SCRATCH IS ACTIVE, CURRENT OPTIONS: ERASE-ON-SCRATCH FOR ALL DATA SETS IS IN EFFECT Verify that the message appears. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_ERASE_ON_SCRATCH) Verify that the health check returns this message for each system: IRRH338I SETROPTS ERASE(ALL) is in effect.'
remediation:
  type: iac_patch
  command: 'To modify the ERASE parameter use the RACF SETROPTS command: SETROPTS ERASE(ALL)'
