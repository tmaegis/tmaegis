id: TMA-IBM-Z-9.14
title: Ensure that z/OS UNIX permission bits and audit bits are configured to audit sensitive file access
description: 'With z/OS UNIX a file owner or a security auditor can specify if auditing is turned on or off, and when audit records should be written for a directory or a file: for successful accesses, failed accesses, or for all accesses. Sensitive files or directories access should be audited. The permissions bits also set access permissions for three classes: owner, group, and other.'
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.14 Ensure that z/OS UNIX permission bits and audit bits are configured to audit sensitive file access
audit:
  type: manual
  command: 'Verify that the permission bits and user audit bits for sensitive files or directories match or are more restrictive than the specified settings listed in the table: File Permission Bits User Audit Bits /usr/lpp/tcpip/sbin/syslogd 740 rwx=f /etc/syslog.conf 744 w=sf,rx+f /etc/hosts 744 w=sf,rx+f /etc/protocol 744 w=sf,rx+f /etc/resolv.conf 744 w=sf,rx+f /etc/services 740 w=sf,rx+f /usr/lpp/tcpip/bin 755 w=sf,rx+f /usr/lpp/tcpip/sbin 755 w=sf,rx+f'
remediation:
  type: iac_patch
  command: 'To modify the audit flags for a UNIX file use the chaudit command: chaudit rwx=f /usr/lpp/tcpip/sbin/syslogd chaudit w=sf,rx+f /etc/syslog.conf chaudit w=sf,rx+f /etc/hosts chaudit w=sf,rx+f /etc/protocol chaudit w=sf,rx+f /etc/resolv.conf chaudit w=sf,rx+f /etc/services chaudit w=sf,rx+f /usr/lpp/tcpip/bin chaudit w=sf,rx+f /usr/lpp/tcpip/sbin To modify the access permissions for a UNIX file use the chmod command: chmod 740 /usr/lpp/tcpip/sbin/syslogd chmod 744 /etc/syslog.conf chmod 744 /etc/hosts chmod 744 /etc/protocol chmod 744 /etc/resolv.conf chmod 740 /etc/services chmod 755 /usr/lpp/tcpip/bin chmod 755 /usr/lpp/tcpip/sbin'
