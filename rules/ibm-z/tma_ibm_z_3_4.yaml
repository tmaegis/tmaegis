id: TMA-IBM-Z-3.4
title: Ensure that SETROPTS OPERAUDIT is in effect
description: The SETROPTS OPERAUDIT parameter specifies whether RACF is to log all actions allowed only because a user has the OPERATIONS or group-OPERATIONS attribute. The improper setting of this field can compromise the security of the z/OS environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.4 Ensure that SETROPTS OPERAUDIT is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Verify that OPERAUDIT appears. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_AUDIT_CONTROLS) Verify that SETROPTS OPERAUDIT is in effect has a Value of YES.'
remediation:
  type: iac_patch
  command: 'To modify the OPERAUDIT parameter use the RACF SETROPTS command: SETROPTS OPERAUDIT'
