id: TMA-IBM-Z-8.6.2
title: Ensure that bypass label processing is not set on any JOBCLASS
description: BLP=YES on a JOBCLASS statement allows certain security checks to be skipped when accessing certain tape data set. There are other ways to manage this setting than the JOBCLASS statement that allow for more granular authorization such as access via the RACF TAPEVOL resource class. Using BLP=YES on a JOBCLASS statement could inadvertently expose data on tapes to unauthorized personnel.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.6.2 Ensure that bypass label processing is not set on any JOBCLASS
audit:
  type: manual
  command: 'Issue the following JES command for each JES2 subsystem: $D JOBCLASS(*),BLP Verify that every JOBCLASS is defined with BLP=NO.'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process to correct non- compliant JES2 initialization statement JOBCLASS entries.
