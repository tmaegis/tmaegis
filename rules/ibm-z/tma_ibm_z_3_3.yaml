id: TMA-IBM-Z-3.3
title: Ensure that SETROPTS AUDIT is enabled for ACTIVE classes
description: SETROPTS AUDIT specifies the names of the classes for which you want RACF to perform auditing. For the classes you specify, RACF logs all uses of the RACROUTE REQUEST=DEFINE SVC and all changes made to profiles by RACF commands. When the class specified is USER, RACF logs all password and password phrase changes made by RACROUTE REQUEST=VERIFY.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.3 Ensure that SETROPTS AUDIT is enabled for ACTIVE classes
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the AUDIT CLASSES = section. Verify that all ACTIVE classes appear.'
remediation:
  type: iac_patch
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the AUDIT CLASSES = section. Verify that all ACTIVE classes appear. Remediation Procedure To enable AUDIT for all classes use the RACF SETROPTS command: SETROPTS AUDIT(*) Notes: It is generally recommended to activate auditing for all classes via (*) to ease administrative overhead. INACTIVE classes will not generate audit records so there is no disadvantage to enabling the option. If you activate auditing for a class using SETROPTS AUDIT, RACF activates auditing for all classes in the class descriptor table that have the same POSIT value as the class you specify. For example, the classes TIMS, GIMS, and AIMS all have a POSIT value of 4 in their respective class descriptor table entries. If you activate auditing for any one of these classes, you activate auditing for all of them.'
