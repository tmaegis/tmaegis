id: TMA-IBM-Z-1.2.7
title: Ensure that the FACILITY resource class is enabled
description: SETROPTS CLASSACT(FACILITY) specifies that the class FACILITY class is active and that RACF protection is to be in effect for it. These values become effective immediately after the command SETROPTS CLASSACT(FACILITY) and SETROPTS RACLIST(FACILITY) are issued. If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields, individually or in combination with another, can compromise the security of the processing environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.2.7 Ensure that the FACILITY resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that FACILITY appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that FACILITY appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that FACILITY appears.'
remediation:
  type: iac_patch
  command: 'Note: The FACILITY class can be used for a wide variety of purposes depending on the products installed on your system. Care must be taken when enabling the class for the first time. To activate the FACILITY class use the RACF SETROPTS command: SETROPTS CLASSACT(FACILITY) To enable generic profile checking for the FACILITY class use the RACF SETROPTS command: SETROPTS GENERIC(FACILITY) To RACLIST the FACILITY class use the RACF SETROPTS command: SETROPTS RACLIST(FACILITY)'
