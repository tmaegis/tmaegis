id: TMA-IBM-Z-6.2.7
title: Ensure SMF recording options for the FTP Server are configured
description: The FTP Server can provide audit data in the form of SMF records. The SMF data produced by the FTP Server provides transaction information for both successful and unsuccessful FTP commands. Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit activities.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.2.7 Ensure SMF recording options for the FTP Server are configured
audit:
  type: manual
  command: 'Request a copy of the FTP server configuration statements in FTP.DATA for any active site FTP server started tasks. Verify that: The SMF statement is coded with the TYPE119 value The SMFJES statement is coded with the TYPE119 value The SMFSQL statement is coded with the TYPE119 value The following statements are omitted or commented out: o SMFAPPE o SMFDEL o SMFEXIT o SMFLOGN o SMFREN o SMFRETR o SMFSTOR'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating FTP server configuration statements in FTP.DATA with compliant values.
