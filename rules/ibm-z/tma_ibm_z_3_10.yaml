id: TMA-IBM-Z-3.10
title: Ensure that RACF audit logs is reviewed on a regular basis
description: Logging, the recording of data about specific events, is the key to auditing the use of RACF at your installation. But you also need to ensure the logs are reviewed at least daily. It is very important for any organization to have security logs and actively using them to monitor security-related activities.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.10 Ensure that RACF audit logs is reviewed on a regular basis
audit:
  type: manual
  command: 'Verify that site auditors are reviewing RACF event logs (SMF type 80) at least daily, and analyze any security related events. Including but not limited to: invalid access attempts new accounts creation elevation of privileges change of identity access to sensitive resources'
remediation:
  type: iac_patch
  command: 'Ensure that site auditors are reviewing RACF event logs (SMF type 80) at least daily, and analyze any security related events. Including but not limited to: invalid access attempts new accounts creation elevation of privileges change of identity access to sensitive resources'
