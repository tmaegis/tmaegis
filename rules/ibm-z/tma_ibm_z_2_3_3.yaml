id: TMA-IBM-Z-2.3.3
title: Ensure that the SETROPTS PROTECTALL value is set to FAIL
description: When PROTECTALL processing is active and set to FAIL, the system automatically rejects any request to create or access a data set that is not RACF-protected. This includes DASD data sets, tape data sets, catalogs, and GDG base names. Temporary data sets that comply with standard MVS temporary data set naming conventions are excluded from PROTECTALL processing.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.3.3 Ensure that the SETROPTS PROTECTALL value is set to FAIL
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following messages are present: PROTECT-ALL IS ACTIVE, CURRENT OPTIONS: PROTECT-ALL FAIL OPTION IS IN EFFECT Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_PROTECTALL_FAIL) Verify the following message is present: IRRH332I SETROPTS PROTECTALL(FAIL) is in effect.'
remediation:
  type: iac_patch
  command: 'To modify the PROTECTALL parameter use the RACF SETROPTS command: SETROPTS PROTECTALL(FAILURES)'
