id: TMA-IBM-Z-9.26
title: Ensure that programs cannot execute from the /tmp directory
description: By default, programs and scripts can be run from within any file system in the hierarchy. This ability should be restricted from within the /tmp directory. The FSEXEC class can be used to prevent file execution from an individual file system regardless of permission bits, file ownership, or even superuser privilege.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.26 Ensure that programs cannot execute from the /tmp directory
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that FSEXEC appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that FSEXEC appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the FSEXEC entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering /tmp Request reports generated using IRRDBU00 output that will allow you to: Verify that a fully qualified /tmp profile is defined in the FSEXEC class that: Has a UACC of ... (full steps: CIS section 9.26)'
remediation:
  type: iac_patch
  command: 'To activate the FSEXEC class use the RACF SETROPTS command: SETROPTS CLASSACT(FSEXEC) To RACLIST the FSEXEC class use the RACF SETROPTS command: SETROPTS RACLIST(FSEXEC) To create catch-all profiles use the RACF RDEFINE command: RDEFINE FSEXEC /tmp + UACC(NONE) + AUDIT(FAILURES(READ)) + DATA(''CONTROL EXECUTE FROM UNIX TMP DIRECTORY'') SETROPTS REFRESH RACLIST(FSEXEC) Note: Profile names in the FSEXEC class are case sensitive. To modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER command: RALTER FSEXEC /tmp + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING SETROPTS REFRESH RACLIST(FSEXEC) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated
    GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
