id: TMA-IBM-Z-6.6.4
title: Ensure AT-TLS protection is enabled for the TN3270 telnet server
description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that subsequently flows between the two. To apply TLS protection of adequate strength, the TN3270 Telnet server must be configured to use AT-TLS protection.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.6.4 Ensure AT-TLS protection is enabled for the TN3270 telnet server
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TN3270E started tasks. Note: If a TN3270E started task is inactive, review the procedure libraries defined to JES2 and locate the TN3270E JCL member. Verify that the following parameters are coded in TN3270E configuration files specified by PROFILE DD statements: Each TELNETPARMS block specifies the TTLSPORT statement, and the PORT statement is not used. The TELNETPARMS CONNTYPE statement is coded within each TELNETPARMS block with either the SECURE, NEGTSECURE or NONE value. Note: If the INCLUDE statement is ... (full steps: CIS section 6.6.4)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TN3270E configuration files.
