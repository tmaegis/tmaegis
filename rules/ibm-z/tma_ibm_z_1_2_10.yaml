id: TMA-IBM-Z-1.2.10
title: Ensure that the CONSOLxx members are configured
description: MCS consoles can be used to issue operator commands. This exposure may threaten the integrity and availability of the operating system environment and compromise the confidentiality of customer data. Failure to control access to MCS consoles could result in unauthorized personnel issuing sensitive operator commands.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.2.10 Ensure that the CONSOLxx members are configured
audit:
  type: manual
  command: 'Review the current PARMLIB CONSOLxx members. Verify that the DEFAULT statement for each CONSOLxx member specifies LOGON(REQUIRED). Note: At the discretion of the site ISSO LOGON(AUTO) may be used. If LOGON(AUTO) is used verify that the console user IDs are defined with minimal access. Verify that the CONSOLE statement for each console: Assigns a unique name using the NAME parameter. Specifies a default authority of INFO using the AUTH parameter. Exceptions: o The AUTH parameter is not valid for consoles defined with UNIT(PRT). o The system console is ... (full steps: CIS section 1.2.10)'
remediation:
  type: iac_patch
  command: Update non-compliant entries in PARMLIB CONSOLxx members and re-IPL the system.
