id: TMA-IBM-Z-2.1.8
title: Ensure that access to RACF database data sets is controlled
description: RACF database files contain all access control information for the operating system environment and system resources as well as user registry, user permissions and user authentication data (including encrypted passwords and passphrases), private X.509 certificate keys, and more. An unsecured RACF database poses significant risks, including unauthorized access to sensitive data, system compromise, and potential operational disruption, due to the comprehensive access control information it stores.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.8 Ensure that access to RACF database data sets is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering RACF primary and backup databases as well as any copies Request reports generated using IRRDBU00 output that will allow you to: Verify that the RACF primary and backup databases as well as any copies are secured by profiles in the DATASET class that: Have UACC of NONE Are not in WARNING mode AUDIT a minimum of SUCCESS(READ) and FAILURES(READ) ID(*) is not used to grant access READ permits are ... (full steps: CIS section 2.1.8)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.RACF.*'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + DATA(''RACF DTABASE'') PERMIT ''SYS1.RACF.*'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.RACF.*'' GENERIC + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.RACF.*'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a class you will need to use both RACF RDELETE to remove the associated
    GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH GLOBAL(<class>) SETROPTS NOGLOBAL(<class>)'
