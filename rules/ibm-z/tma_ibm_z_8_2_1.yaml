id: TMA-IBM-Z-8.2.1
title: Ensure that the JESSPOOL resource class is enabled
description: JESSPOOL resources control access to data stored on the JES spool data sets. This includes all SYSOUT and instream data set, JCL, SYSLOG, JESTRACE, and JESNEWS data sets stored on spool and the control blocks that represent those data set. If the JESSPOOL class is not active, the integrity and availability of the operating system environment is compromised, and potentially sensitive customer data is exposed.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.2.1 Ensure that the JESSPOOL resource class is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that JESSPOOL appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that JESSPOOL appears.'
remediation:
  type: iac_patch
  command: 'To activate the JESSPOOL class use the RACF SETROPTS command: SETROPTS CLASSACT(JESSPOOL) To enable generic profile checking for the JESSPOOL class use the RACF SETROPTS command: SETROPTS GENERIC(JESSPOOL) To RACLIST the JESSPOOL class use the RACF SETROPTS command: SETROPTS RACLIST(JESSPOOL)'
