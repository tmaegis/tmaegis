id: TMA-IBM-Z-7.2.7
title: Ensure all ICSF key data sets are enabled for sysplex sharing
description: When the ICSF Key Datasets are shared among members of a sysplex, it is critical that updates to the data sets are communicated across all members of the sysplex group. To enable the sysplex communication, the ICSF Installation Options Dataset must contain the appropriate sysplex enablement keywords.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.2.7 Ensure all ICSF key data sets are enabled for sysplex sharing
audit:
  type: manual
  command: '1. From the ICSF Primary Menu panel, select option 3 OPSTAT. 2. From the ICSF Installation Options panel, select option 1 OPTIONS. Verify that: The SYSPLEXCKDS value is YES,FAIL(YES) The SYSPLEXPKDS value is YES,FAIL(YES) The SYSPLEXTKDS value is YES,FAIL(YES)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating parameters in the ICSF installation options data set to update non-compliant parameters.
