id: TMA-IBM-Z-6.6.2
title: Ensure VTAM session setup controls for the TN3270E telnet server are configured
description: After a connection from a Telnet client to the TN3270E Telnet Server has been established, the process of session setup with a VTAM application occurs. A number of BEGINVTAM statements must be coded in a specific configuration to ensure adequate control to VTAM applications is maintained. Failure to code the appropriate statements could result in unauthorized access to the host and application resources. This exposure may impact data integrity or the availability of some system services.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.6.2 Ensure VTAM session setup controls for the TN3270E telnet server are configured
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TN3270E started tasks. Note: If a TN3270E started task is inactive, review the procedure libraries defined to JES2 and locate the TN3270E JCL member. Verify that the following parameters are coded in TN3270E configuration files specified by PROFILE DD statements: 1. Within each BEGINVTAM statement block, one BEGINVTAM USSTCP statement is coded that specifies only the table name operand. No client identifier, such as host name or IP address, is specified so the statement applies to all connections not otherwise ... (full steps: CIS section 6.6.2)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TN3270E configuration files.
