id: TMA-IBM-Z-1.1.7
title: Ensure that the SETROPTS PASSWORD(WARNING) value is set to a minimum of 5
description: 'WARNING specifies the number of days before a password expires when RACF is to issue a warning message to the user. Note: If you specify WARNING, INITSTATS must be in effect. System users should be warned about impending password expiration to allow secure passwords to be chosen and to allow the changing of a password at a convenient time to help minimize password change impact.'
target: ibm-z
level: 1
severity: low
tags:
- ibm-z
- password-policy
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 1.1.7 Ensure that the SETROPTS PASSWORD(WARNING) value is set to a minimum of 5
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Verify that INITSTATS appears. Review the command output in the PASSWORD PROCESSING OPTIONS: section. Look for the following message: PASSWORD EXPIRATION WARNING LEVEL IS <nnn> DAYS. Verify the value is equal to or greater than 5 days.'
remediation:
  type: iac_patch
  command: 'To modify the WARNING parameter use the RACF SETROPTS command: SETROPTS PASSWORD(WARNING(5)) Note: If you specify a WARNING value that exceeds the INTERVAL value, a warning message is issued at each logon. If you do not want the warning with each logon, specify a value for WARNING that is less than the value you specify for INTERVAL. If you specify WARNING, INITSTATS must be in effect. To enable INITSTATS use the RACF SETROPTS command: SETROPTS INITSTATS'
