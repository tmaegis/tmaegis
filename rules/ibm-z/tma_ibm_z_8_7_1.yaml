id: TMA-IBM-Z-8.7.1
title: Ensure that RJE workstations and NJE nodes enforce password protection
description: JES2 RJE workstations and NJE nodes provide a method of sending and receiving data (e.g. jobs, job output, and commands) from remote locations. Failure to properly identify and control these remote facilities could result in unauthorized sources transmitting data to and from the operating system.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- password-policy
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.7.1 Ensure that RJE workstations and NJE nodes enforce password protection
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that FACILITY appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that FACILITY appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that FACILITY appears. Request reports generated using IRRDBU00 output that will allow you to: Verify That the following profiles have been defined in the FACILITY class: NJE.* or NJE.** RJE.* or RJE.** Note: Defining these profiles will force user ID and ... (full steps: CIS section 8.7.1)'
remediation:
  type: iac_patch
  command: 'To activate the FACILITY class use the RACF SETROPTS command: SETROPTS CLASSACT(FACILITY) To enable generic profile checking for the FACILITY class use the RACF SETROPTS command: SETROPTS GENERIC(FACILITY) To RACLIST the FACILITY class use the RACF SETROPTS command: SETROPTS RACLIST(FACILITY) To create a the profiles use the RACF RDEFINE and SETROPTS commands: RDEFINE FACILITY NJE.** + DATA(''ENFORCE USER ID AND PASSWORD PROTECTION FOR NJE NODES'') RDEFINE FACILITY RJE.** + DATA(''ENFORCE USER ID AND PASSWORD PROTECTION FOR RJE WORKSTATIONS'') SETROPTS REFRESH FACLIST(FACILITY)'
