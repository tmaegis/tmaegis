id: TMA-IBM-Z-6.4.2
title: Ensure that the STARTED resource class is used to assign user IDs with proper parameters to syslog daemon started tasks
description: Syslog daemon, known as syslogd, is a zOS UNIX daemon that provides a central processing point for log messages issued by other zOS UNIX processes. It is also possible to receive log messages from other network-connected hosts. Failure to properly define and control the Syslog daemon could lead to unauthorized access. This exposure may result in the compromise of the integrity and availability of the operating system environment, ACP, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.4.2 Ensure that the STARTED resource class is used to assign user IDs with proper parameters to syslog daemon started tasks
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that STARTED appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that STARTED appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that STARTED appears. Request the following DSMON report: FUNCTION SYSTEM RACSPT Verify that the syslogd started task(s) appear in the FROM PROFILES IN THE STARTED CLASS: section and not the FROM THE STARTED PROCEDURES TABLE (ICHRIN03): section. Use the ... (full steps: CIS section 6.4.2)'
remediation:
  type: iac_patch
  command: 'To activate the STARTED class use the RACF SETROPTS command: SETROPTS CLASSACT(STARTED) To enable generic profile checking for the STARTED class use the RACF SETROPTS command: SETROPTS GENERIC(STARTED) To RACLIST the STARTED class use the RACF SETROPTS command: SETROPTS RACLIST(STARTED) To create a STARTED profile use the RACF RDEFINE and SETROPTS commands: RDEFINE STARTED SYSLOGD.* + UACC(NONE) + DATA(''UNIX SYSLOG DAEMON'') + STDATA( + USER(<syslogd-user>) + GROUP(<syslogd-group>) + ) SETROPTS REFRESH RACLIST(STARTED) To make a user ID PROTECTED use the RACF ALTUSER command: ALTUSER <syslogd-user> + NOPASSWORD + NOPHRASE + NOOIDCARD To modify the OMVS segment for a user ID use the RACF ALTUSER command: ALTUSER <syslogd-user> + OMVS( + UID(0) + HOME(''/'') + PROGRAM(''/bin/sh'') + ) Notes: 1. If the security administrator has defined the SHARED.IDS profile in the UNIXPRIV class, the UID value must be unique. Use the SHARED keyword in addition to UID to assign a value that is
    already in use. 2. OMVS DIRECTORY and PROGRAM values are case sensitive, so be sure they are entered as-is and not translated to upper case. To add an access list entries use the RACF ... (see CIS section 6.4.2)'
