id: TMA-IBM-Z-9.13
title: Ensure that z/OS UNIX BPXPRMxx parameters in PARMLIB are configured for security
description: Parameter settings in PARMLIB member BPXPRMxx and /etc specify values for z/OS UNIX security controls. The parameters in BPXRPMxx and /etc impact data access and operating system services.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.13 Ensure that z/OS UNIX BPXPRMxx parameters in PARMLIB are configured for security
audit:
  type: manual
  command: 'Review the logical PARMLIB data sets (ex. SYS1.PARMLIB(BPXPRMxx)). Verify the UNIX parameters are set according to the following table: Keyword Value MOUNT NOSETUID ROOT SETUID SETUID (for Vendor-provided files) SECURITY STARTUP_PROC OMVS STEPLIBLIST /etc/steplib SUPERUSER BPXROOT TTYGROUP TTY UMASK specify that other write bits are not ON USERIDALIASTABLE omitted or commented out'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change process for updating non-compliant entries.
