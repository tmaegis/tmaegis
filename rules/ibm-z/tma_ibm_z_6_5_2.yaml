id: TMA-IBM-Z-6.5.2
title: Ensure TCP/IP stack configuration defined in TCPIP.DATA meets minimum requirements
description: During the initialization of TCP/IP servers and clients, the TCPIP.DATA configuration file provides information that is essential for proper operations of TCP/IP applications. The TCPIP.DATA file acts as the anchor configuration data set for the TCP/IP stack and all TCP/IP servers and clients running in z/OS.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.2 Ensure TCP/IP stack configuration defined in TCPIP.DATA meets minimum requirements
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TCP/IP stack started tasks. Note: If an TCP/IP stack is inactive, review the procedure libraries defined to JES2 and locate the FTP JCL member. Verify that the following parameters are coded in TCPIP.DATA files specified by SYSTCPD DD statements: DATASETPREFIX DOMAINORIGIN HOSTNAME TCPIPJOBNAME'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TCPIP.DATA configuration files.
