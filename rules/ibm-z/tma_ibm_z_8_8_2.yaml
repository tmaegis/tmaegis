id: TMA-IBM-Z-8.8.2
title: Ensure that the SETROPTS JES(XBMALLRACF) is enabled
description: XBM (Execution Batch Monitor) is a function that allows jobs to be submitted that only provide instream data to a pre-defined JCL PROC. The classic use of this is to perform student compiles in an educational environment. Even though the JCL PROC is pre- defined, proper auditing of what the JCL is accessing requires that a RACF identify exists for all jobs.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.8.2 Ensure that the SETROPTS JES(XBMALLRACF) is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following message appears: JES-XBMALLRACF OPTION IS ACTIVE'
remediation:
  type: iac_patch
  command: 'To modify the JES parameter use the RACF SETROPTS command: SETROPTS JES(XBMALLRACF)'
