id: TMA-IBM-Z-7.3.5
title: Ensure ICSF key store policy controls are enabled
description: ICSF Key Store Policy governs the use of key tokens in callable services. A key token is just a control block of key material that can be passed directly as an input parameter to an ICSF callable service - as opposed to specifying the label of a key stored in an ICSF Key Data Set. The Key Store Policy settings control how permission to use a key token is performed.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.3.5 Ensure ICSF key store policy controls are enabled
audit:
  type: manual
  command: 'Request reports generated using IRRDBU00 output that will allow you to: Verify the following fully qualified profiles are defined in the XFACILIT class: CSF.CKDS.TOKEN.CHECK.LABEL.FAIL CSF.PKDS.TOKEN.CHECK.LABEL.FAIL'
remediation:
  type: iac_patch
  command: 'To create general resource profiles use the RACF RDEFINE command: RDEFINE XFACILIT CSF.CKDS.TOKEN.CHECK.LABEL.FAIL + DATA(''ACTIVATES ICSF KEY STORE POLICY FOR CKDS IN FAIL MODE'') RDEFINE XFACILIT CSF.PKDS.TOKEN.CHECK.LABEL.FAIL + DATA(''ACTIVATES ICSF KEY STORE POLICY FOR PKDS IN FAIL MODE'') Note: Depending on the RACF class settings you may be required to issue a RACF SETROPTS REFRESH command for updates to be effective.'
