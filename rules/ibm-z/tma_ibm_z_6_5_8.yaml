id: TMA-IBM-Z-6.5.8
title: Ensure that the STARTED resource class is used to assign user IDs with proper parameters to base TCP/IP component started tasks
description: The TCP/IP started tasks require special privileges and access to sensitive resources to provide its system services. Failure to properly define and control these TCP/IP started tasks could lead to unauthorized access. This exposure may result in the compromise of the integrity and availability of the operating system environment, ACP, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- accounts
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.8 Ensure that the STARTED resource class is used to assign user IDs with proper parameters to base TCP/IP component started tasks
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that STARTED appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that STARTED appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that STARTED appears. Request the following DSMON report: FUNCTION SYSTEM RACSPT Verify that the TCP/IP and EZAZSSI started task(s) appear in the FROM PROFILES IN THE STARTED CLASS: section and not the FROM THE STARTED PROCEDURES TABLE (ICHRIN03): section. ... (full steps: CIS section 6.5.8)'
remediation:
  type: iac_patch
  command: 'To activate the STARTED class use the RACF SETROPTS command: SETROPTS CLASSACT(STARTED) To enable generic profile checking for the STARTED class use the RACF SETROPTS command: SETROPTS GENERIC(STARTED) To RACLIST the STARTED class use the RACF SETROPTS command: SETROPTS RACLIST(STARTED) To create a STARTED profile use the RACF RDEFINE and SETROPTS commands: RDEFINE STARTED TCPIP.* + UACC(NONE) + DATA(''TCP/IP STACK'') + STDATA( + USER(<tcpip-user>) + GROUP(<tcpip-group>) + TRUSTED + ) RDEFINE STARTED EZAZSSI.* + UACC(NONE) + DATA(''START VMCF AND TNF AS RESTARTABLE SUBSYSTEMS'') + STDATA( + USER(<ezazssi-user>) + GROUP(<ezazssi-group>) + ) SETROPTS REFRESH RACLIST(STARTED) To make a user ID PROTECTED use the RACF ALTUSER command: ALTUSER <user-id> + NOPASSWORD + NOPHRASE + NOOIDCARD To modify the OMVS segment for a user ID use the RACF ALTUSER command: ALTUSER <tcpip-id> + OMVS( + UID(0) + HOME(''/'') + PROGRAM(''/bin/sh'') + ) Notes: 1. If the security administrator has defined
    the SHARED.IDS profile in the UNIXPRIV class, the UID value must be unique. Use the SHARED keyword in addition to UID to assign a value that is already in use. 2. OMVS DIRECTORY and ... (see CIS section 6.5.8)'
