id: TMA-IBM-Z-6.6.5
title: Ensure SMF recording options for the TN3270 telnet server are configured
description: The TN3270 Telnet Server can provide audit data in the form of SMF records. The SMF data produced provides information about individual sessions. This data includes the VTAM application, the remote and local IP addresses, and the remote and local IP port numbers. Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit activities.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.6.5 Ensure SMF recording options for the TN3270 telnet server are configured
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TN3270E started tasks. Note: If a TN3270E started task is inactive, review the procedure libraries defined to JES2 and locate the TN3270E JCL member. Verify that the following parameters are coded in TN3270E configuration files specified by PROFILE DD statements: The TELNETPARMS SMFINIT statement is coded with the TYPE119 operand within each TELNETPARMS statement block. The TELNETPARMS SMFTERM statement is coded with the TYPE119 operand within each TELNETPARMS statement block. Note: If the INCLUDE statement is ... (full steps: CIS section 6.6.5)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TN3270E configuration files.
