id: TMA-IBM-Z-6.5.4
title: Ensure TCP/IP stack configuration defined in PROFILE.TCPIP meets minimum requirements
description: The PROFILE.TCPIP configuration file provides system operation and configuration parameters for the TCP/IP stack. Inappropriate values could result in undesirable operations and degraded security. This exposure may result in unauthorized access impacting data integrity or the availability of some system services.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- accounts
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.5.4 Ensure TCP/IP stack configuration defined in PROFILE.TCPIP meets minimum requirements
audit:
  type: manual
  command: 'This exposure may result in unauthorized access impacting data integrity or the availability of some system services. Audit Procedure Request a copy of all JESJCL of all active site TCP/IP stack started tasks. Note: If an TCP/IP stack is inactive, review the procedure libraries defined to JES2 and locate the FTP JCL member. Verify that the following parameters in PROFILE.TCPIP files specified by PROFILE DD statements: The SMFPARMS statement is omitted or commented out. The DELETE statement is omitted or commented out. The SMFCONFIG statement is coded with ... (full steps: CIS section 6.5.4)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating PROFILE.TCPIP configuration files.
