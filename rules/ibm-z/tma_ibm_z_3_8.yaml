id: TMA-IBM-Z-3.8
title: Ensure that an automated process is in place to collect and retain SMF data
description: SMF data collection provides a standardized method for recording all system activity to a recording media (DATASET or LOGSTREAM), including the audit trails from RACF. Failure to collect and manage adequate retention of SMF records can result in the loss of critical system data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.8 Ensure that an automated process is in place to collect and retain SMF data
audit:
  type: manual
  command: Review SMF data collection and retention processes. Ensure that the processes utilized include a process which is automatically started to dump SMF collection files immediately upon their becoming full. To ensure that all SMF data is collected in a timely manner, and to reduce the risk of data loss.
remediation:
  type: iac_patch
  command: 'Ensure that automated mechanisms are in place to collect and retain all SMF data produced on the system. Dump the SMF files (MANx) in systems based on the following guidelines: 1. Dump each SMF file as it fills up during the normal course of daily processing. 2. Dump all remaining SMF data at the end of each processing day. The same procedure applies if you use LOGSTREAM.'
