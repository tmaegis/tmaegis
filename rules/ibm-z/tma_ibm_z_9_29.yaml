id: TMA-IBM-Z-9.29
title: Ensure that servers are running with z/OS UNIX level security
description: Running with z/OS UNIX level security ensures that system programmers with UID(0) cannot establish thread-level security under any other z/OS UNIX user without authentication. This capability is restricted to server user IDs with READ or UPDATE access to BPX.SERVER in the FACILITY class. In contrast, with UNIX level security, anyone with UID(0) or access to BPX.SUPERUSER in the FACILITY class can establish thread-level security under any other z/OS UNIX user without authentication. This violates separation of duties and least privilege.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- services
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 9.29 Ensure that servers are running with z/OS UNIX level security
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ACTIVE CLASSES = section. Verify that FACILITY appears. Review the command output in the GENERIC PROFILE CLASSES = section. Verify that FACILITY appears. Review the command output in the SETR RACLIST CLASSES = section. Verify that FACILITY appears. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the FACILITY entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering the BPX.SERVER resource Request reports generated using IRRDBU00 ... (full steps: CIS section 9.29)'
remediation:
  type: iac_patch
  command: 'To activate the FACILITY class use the RACF SETROPTS command: SETROPTS CLASSACT(FACILITY) To enable generic profile checking for the FACILITY class use the RACF SETROPTS command: SETROPTS GENERIC(FACILITY) To RACLIST the FACILITY class use the RACF SETROPTS command: SETROPTS RACLIST(FACILITY) To create a BPX.SERVER profile use the RACF RDEFINE command: RDEFINE FACILITY BPX.SERVER + UACC(NONE) + AUDIT(FAILURES(READ)) + DATA(''ACCESS TO UNIX SERVER SYSTEM CALLS'') SETROPTS REFRESH RACLIST(FACILITY) To modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER command: RALTER FACILITY BPX.SERVER + UACC(NONE) + AUDIT(FAILURES(READ)) + NOWARNING SETROPTS REFRESH RACLIST(FACILITY) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT BPX.SERVER CLASS(FACILITY) + DELETE ID(<non-compliant>) SETROPTS REFRESH RACLIST(FACILITY) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>)
    SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC ... (see CIS section 9.29)'
