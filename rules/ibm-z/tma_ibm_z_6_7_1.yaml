id: TMA-IBM-Z-6.7.1
title: Ensure VTAM USSTAB definitions are being used for secured terminals
description: VTAM options and definitions are used to define VTAM operational capabilities. They must be strictly controlled. Unauthorized users could override or change start options or network definitions. Failure to properly control VTAM resources could potentially compromise the network operations.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.7.1 Ensure VTAM USSTAB definitions are being used for secured terminals
audit:
  type: manual
  command: 'VTAM Systems Programmer supplies the following information: Documentation regarding terminal naming standards. Documentation of all procedures controlling terminal logons to the system. A complete list of all USS commands used by terminal users to log on to the system. Members and data set names containing USSTAB and LOGAPPL definitions of all terminals that can log on to the system (e.g. SYS1.VTAMLST). Members and data set names containing logon mode parameters. Check that the USSTAB definitions are only used for secure terminals (e.g., terminals that are ... (full steps: CIS section 6.7.1)'
remediation:
  type: iac_patch
  command: The Systems programmer will verify that USSTAB definitions are only used for secure terminals. Only terminals that are locally attached to the host or connected to the host via secure leased lines located in a secured area. Only authorized personnel may enter the area where secure terminals are located. USSTAB or LOGAPPL definitions are used to control logon from secure terminals. These terminals can log on directly to any VTAM application (e.g., TSO, CICS, etc.) of their choice and bypass Session Manager services. Secure terminals are usually locally attached to the host or connected to the host via a private LAN without access to an external network. Only authorized personnel may enter the area where secure terminals are located.
