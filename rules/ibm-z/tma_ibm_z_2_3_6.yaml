id: TMA-IBM-Z-2.3.6
title: Ensure that SETROPTS ENHANCEDGENERICOWNER is in effect
description: SETROPTS GENERICOWNER restricts the creation of profiles in all general resource classes except the PROGRAM class. This offers enhanced restrictions on the creation of profiles for general resources.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.3.6 Ensure that SETROPTS ENHANCEDGENERICOWNER is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following message is present: ENHANCED GENERIC OWNER ONLY IS IN EFFECT'
remediation:
  type: iac_patch
  command: 'To enable ENHANCEDGENERICOWNER use the RACF SETROPTS command: SETROPTS ENHANCEDGENERICOWNER'
