id: TMA-IBM-Z-4.2
title: Ensure that the RACF PRIM and BACK databases are isolated
description: RACF backup and recovery data files provide the only means of recovering RACF database in the event of its damage. In the case where this damage is to the physical volume on which it resides, and any of these recovery data files exist on this volume as well, then complete recovery of the RACF database would be extremely difficult, if even possible.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 4.2 Ensure that the RACF PRIM and BACK databases are isolated
audit:
  type: manual
  command: 'Issue the following TSO command: RVARY LIST Verify that the VOLUME values for the PRIM and BACK are different for RACF databases that have YES in the ACTIVE column.'
remediation:
  type: iac_patch
  command: 'Issue the following TSO command: RVARY LIST Verify that the VOLUME values for the PRIM and BACK are different for RACF databases that have YES in the ACTIVE column. Remediation Procedure Consult the z/OS Security Server RACF Security System Programmer''s Guide for guidance on moving the RACF database data sets. Note: Depending upon your configuration, modify the ICHRDSNT load module table or the IRRPRMxx PARMLIB member and plan an IPL of the system (or the entire sysplex if in DATASHARING mode).'
