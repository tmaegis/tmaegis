id: TMA-IBM-Z-6.3.3
title: Ensure SSH daemon is configured with a logon banner
description: A logon banner can be used to inform users about the environment during the initial logon. Logon banners are used to warn users against unauthorized entry and the possibility of legal action for unauthorized users and advise all users that system use constitutes consent to monitoring. Failure to display a logon banner prior to a logon attempt will negate legal proceedings resulting from unauthorized access to system resources.
target: ibm-z
level: 1
severity: low
tags:
- ibm-z
- ssh
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.3.3 Ensure SSH daemon is configured with a logon banner
audit:
  type: manual
  command: Review the active sshd_config (OpenSSH daemon configuration files). Verify that the Banner keyword is coded. Verify that the permission bits and user audit bits for OpenSSH Banner UNIX files match or are more restrictive than the specified settings listed in the table. Permission Bits User Audit Bits 744 faf
remediation:
  type: iac_patch
  command: 'The site will need to follow their standard change management process for updating sshd_config configuration files with compliant values. To modify the audit flags for a UNIX file use the chaudit command: chaudit w=sf,rx+f /etc/ssh.banner To modify the access permissions for a UNIX file use the chmod command: chmod 744 /etc/ssh.banner'
