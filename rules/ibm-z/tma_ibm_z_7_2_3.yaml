id: TMA-IBM-Z-7.2.3
title: Ensure crypto key usage auditing is enabled
description: ICSF can be configured to audit the use of key material, whether or not the key material is stored in an ICSF key data set. By configuring ICSF to audit key usage events, it is possible to document which users and/or jobs are using key material.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- audit
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 7.2.3 Ensure crypto key usage auditing is enabled
audit:
  type: manual
  command: 'Issue the following z/OS console command: DISPLAY ICSF,OPTIONS Look for the following message: AUDITKEYUSGCKDS: Audit CCA symmetric key usage events SYSNAME LABEL TOKEN Interval Days/HH.MM.SS Verify that the LABEL and TOKEN column values are Yes. Look for the following message: AUDITKEYUSGPKDS: Audit CCA asymmetric key usage events SYSNAME LABEL TOKEN Interval Days/HH.MM.SS Verify that the LABEL and TOKEN column values are Yes. Look for the following message: AUDITPKCS11USG: Audit PKCS #11 usage events SYSNAME TOKOBJ SESSOBJ NOKEY Interval Days/HH.MM.SS ... (full steps: CIS section 7.2.3)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating parameters in the ICSF installation options data set to update non-compliant parameters.
