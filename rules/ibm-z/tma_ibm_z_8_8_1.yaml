id: TMA-IBM-Z-8.8.1
title: Ensure that the SETROPTS JES(BATCHALLRACF) is enabled
description: SETROPTS BATCHALLRACF specifies that JES is to test for the presence of a user ID and password on the job statement or for propagated RACF identification information for all batch jobs. The system-wide option controls the default settings for determining how RACF will function when handling requests for access to the operating system environment, RACF, and customer data.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 8.8.1 Ensure that the SETROPTS JES(BATCHALLRACF) is enabled
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Verify the following message appears: JES-BATCHALLRACF OPTION IS ACTIVE Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_BATCHALLRACF) Verify that the message returned is: IRRH331E SETROPTS JES(BATCHALLRACF) is in effect.'
remediation:
  type: iac_patch
  command: 'To modify the JES parameter use the RACF SETROPTS command: SETROPTS JES(BATCHALLRACF)'
