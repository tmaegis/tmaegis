id: TMA-IBM-Z-2.1.4
title: Ensure that access to the ICHDSM00 (DSMON) program is controlled
description: ICHDSM00 is the data security monitor utility (DSMON). READ authority to this program in the PROGRAM class is one way a user can have authority to run the utility. RACF ships the utility in SYS1.LINKLIB. ICHDSM00 provides information on the security posture of the system. Such information should not be available to general users.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.4 Ensure that access to the ICHDSM00 (DSMON) program is controlled
audit:
  type: manual
  command: 'Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the PROGRAM entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering the ICHDSM00 resource Request reports generated using IRRDBU00 output that will allow you to: Verify that a ICHDSM00 profile in the PROGRAM class is defined and: Has a UACC of NONE Is not in WARNING mode AUDIT a minimum of SUCCESS(READ) and FAILURES(READ) ID(*) is not used to grant access READ and higher permits are restricted to: o Auditors o Security Administrators o Systems Programmers o IDs ... (full steps: CIS section 2.1.4)'
remediation:
  type: iac_patch
  command: 'To create a PROGRAM profile use the RACF RDEFINE and PERMIT commands: RDEFINE PROGRAM ICHDSM00 + UACC(NONE) + AUDIT(ALL(READ)) + ADDMEM(''SYS1.LINKLIB''//NOPADCHK) + DATA(''DATA SECURITY MONITOR UTILITY (DSMON)'') PERMIT ICHDSM00 CLASS(PROGRAM) + ACCESS(READ) ID(AUDITOR SECADMIN SYSPROG) SETROPTS REFRESH WHEN(PROGRAM) To modify the UACC, WARN, or AUDIT settings for a general resource profile use the RACF RALTER command: RALTER PROGRAM ICHDSM00 + UACC(NONE) + AUDIT(ALL(READ)) + NOWARNING SETROPTS REFRESH WHEN(PROGRAM) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ICHDSM00 CLASS(PROGRAM) + DELETE ID(<non-compliant>) SETROPTS REFRESH WHEN(PROGRAM) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for
    a class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH ... (see CIS section 2.1.4)'
