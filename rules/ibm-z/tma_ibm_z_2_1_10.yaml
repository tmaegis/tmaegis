id: TMA-IBM-Z-2.1.10
title: Ensure that access to the RACF parameter library is controlled
description: The started procedure in SYS1.PROCLIB that starts the RACF subsystem address space contains an optional RACFPARM DD statement that identifies a file containing commands to run during subsystem initialization. This file must be protected with a DATASET profile. When these commands execute, they do so under the identity associated with the RACF subsystem, and OPERCMDS checking is not performed. Anyone with UPDATE access can insert commands.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- permissions
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 2.1.10 Ensure that access to the RACF parameter library is controlled
audit:
  type: manual
  command: 'Request a list of any and all RACF parameter library data sets referenced by the RACFPARM DD. Request the following DSMON report: FUNCTION SYSTEM RACGAC Verify that the DATASET entry has: -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering the RACF parameter library data sets Request reports generated using IRRDBU00 output that will allow you to: Verify That the RACF parameter library data sets are secured by profiles in the DATASET class that: Have UACC of NONE Are not in WARNING mode AUDIT a minimum of SUCCESS(UPDATE) and ... (full steps: CIS section 2.1.10)'
remediation:
  type: iac_patch
  command: 'To create a DATASET profile use the RACF ADDSD and PERMIT commands: ADDSD ''SYS1.RACF.PARM'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + DATA(''RACF PARAMETER LIBRARY'') PERMIT ''SYS1.RACF.PARM'' GENERIC + ACCESS(ALTER) ID(SYSPROG) SETROPTS REFRESH GENERIC(DATASET) To modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF ALTDSD command: ALTDSD ''SYS1.RACF.PARM'' GENERIC + UACC(NONE) + AUDIT(SUCCESS(UPDATE),FAILURES(READ)) + NOWARNING SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant access list entries use the RACF PERMIT command: PERMIT ''SYS1.RACF.PARM'' GENERIC + DELETE ID(<non-compliant>) SETROPTS REFRESH GENERIC(DATASET) To remove a non-compliant GAC entry you need to use both RACF RALTER and SETROPTS commands: RALTER GLOBAL <class> DELMEM(<entry>) SETROPTS REFRESH GLOBAL(<class>) Note: Access gained via global access checking is not logged, so caution must be used when making changes to GAC entries. To disable GAC for a
    class you will need to use both RACF RDELETE to remove the associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class: RDELETE GLOBAL <class> SETROPTS REFRESH ... (see CIS section 2.1.10)'
