id: TMA-IBM-Z-3.1
title: Ensure that SETROPTS CMDVIOL is in effect
description: The SETROPTS CMDVIOL parameter specifies whether RACF is to log violations detected by RACF commands. The improper setting of this field can compromise the security of the z/OS environment.
target: ibm-z
level: 1
severity: medium
tags:
- ibm-z
- hardening
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 3.1 Ensure that SETROPTS CMDVIOL is in effect
audit:
  type: manual
  command: 'Issue the following TSO command: SETROPTS LIST Review the command output in the ATTRIBUTES = section. Verify that CMDVIOL appears. Alternatively, if IBM Health Checker for z/OS is installed and active, you can request the HZSPRINT output for: CHECK(IBMRACF,RACF_AUDIT_CONTROLS) Verify that SETROPTS CMDVIOL is in effect has a Value of YES.'
remediation:
  type: iac_patch
  command: 'To modify the CMDVIOL parameter use the RACF SETROPTS command: SETROPTS CMDVIOL'
