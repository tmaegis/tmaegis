id: TMA-IBM-Z-6.6.1
title: Ensure configuration statements for the TN3270E telnet server are configured
description: The TN3270E Telnet Server profile (often called the "Telnet profile") configuration file provides system operation and configuration parameters for the TN3270E Telnet Server. Several of these parameters have potential impact to system security. Failure to code the appropriate values could result in unexpected operations, degraded security, or unauthorized access impacting data integrity or the availability of some system services.
target: ibm-z
level: 1
severity: high
tags:
- ibm-z
- network
reference: CIS IBM z/OS with RACF Benchmark v1.0.0 - 6.6.1 Ensure configuration statements for the TN3270E telnet server are configured
audit:
  type: manual
  command: 'Request a copy of all JESJCL of all active site TN3270E started tasks. Note: If a TN3270E started task is inactive, review the procedure libraries defined to JES2 and locate the TN3270E JCL member. Verify that the following parameters are coded in TN3270E configuration files specified by PROFILE DD statements: TELNETGLOBAL block (only one defined) o If the TNSACONFIG statement is coded, the COMMUNITY parameter must be specified with a value other than public. TELNETPARMS block (one defined for each port the server is listening to) o The INACTIVE and ... (full steps: CIS section 6.6.1)'
remediation:
  type: iac_patch
  command: The site will need to follow their standard change management process for updating TN3270E configuration files.
