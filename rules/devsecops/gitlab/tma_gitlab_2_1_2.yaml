id: TMA-GITLAB-2.1.2
title: Ensure all aspects of the pipeline infrastructure and configuration are immutable
description: Ensure the pipeline orchestrator and its configuration are immutable. An immutable infrastructure is one that cannot be changed during execution of the pipeline. This can be done, for example, by using Infrastructure as Code for configuring the pipeline and the pipeline environment. Utilizing such infrastructure creates a more predictable environment because updates will require re-deployment to prevent any previous configuration from interfering. Because it is dependent on automation, it is easier to revert changes. Testing code is also simpler because it is based on virtualization. Most importantly, an immutable pipeline infrastructure ensures that a potential attacker seeking to compromise the build environment itself would not be able to do so if the orchestrator, its configuration, and any other component cannot be changed. Verifying that all aspects of the pipeline infrastructur...
target: gitlab
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 2.1.2 Ensure all aspects of the pipeline infrastructure and configuration are immutable
audit:
  type: manual
  command: Verify that the pipeline orchestrator, its configuration, and all other aspects of the build environment are immutable.
remediation:
  type: iac_patch
  command: Use an immutable pipeline orchestrator and ensure that its configuration and all other aspects of the built environment are immutable, as well.
