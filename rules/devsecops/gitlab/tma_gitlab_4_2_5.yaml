id: TMA-GITLAB-4.2.5
title: Ensure anonymous access to artifacts is revoked
description: For GitLab projects anonymous access is not available. Verify that all that require access controls are Private or Internal. Disable the option to view artifacts as an anonymous user in order to protect private artifacts from being exposed.
target: gitlab
level: 1
severity: high
tags:
- access-control
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 4.2.5 Ensure anonymous access to artifacts is revoked
audit:
  type: manual
  command: 'Reviewing a project''s visibility for artifacts: - On the left sidebar, select Search or go to and find your project. - Select Settings > General. - Expand Visibility, project features, permissions. - From the Project visibility dropdown list, review the current selection.'
remediation:
  type: iac_patch
  command: 'Changing a project''s visibility for artifacts: - On the left sidebar, select Search or go to and find your project. - Select Settings > General. - Expand Visibility, project features, permissions. - From the Project visibility dropdown list, select an option. The visibility setting for a project must be at least as restrictive as the visibility of its parent group. - Select Save changes.'
