id: TMA-GITLAB-1.3.3
title: Ensure minimum number of administrators are set for the organization
description: Ensure the organization has a minimum number of administrators. Organization administrators have the highest level of permissions, including the ability to add/remove collaborators, create or delete repositories, change branch protection policy, and convert to a publicly-accessible repository. Due to the permissive access granted to an organization administrator, it is highly recommended to keep the number of administrator accounts as minimal as possible.
target: gitlab
level: 1
severity: high
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.3.3 Ensure minimum number of administrators are set for the organization
audit:
  type: manual
  command: 'Verify the minimum number of administrators in your project by performing the following: - On the left sidebar, select Search or go to and find your project. - Select Manage > Members. - At the top of the member list, from the dropdown list, select Max role the members have in the group and descending order. - If there are minimum number of members with Owner/Maintainer role in the list, you are compliant.'
remediation:
  type: iac_patch
  command: 'Set the minimum number of administrators in your project by performing the following: - On the left sidebar, select Search or go to and find your project. - Select Manage > Members. - At the top of the member list, from the dropdown list, select Max role the members have in the group and descending order. - Next to the project member you want to remove, select Remove member.'
