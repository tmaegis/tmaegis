id: TMA-GITLAB-4.1.2
title: Ensure artifacts are encrypted before distribution
description: Encrypt artifacts before they are distributed and ensure only trusted platforms have decryption capabilities. Build artifacts might contain sensitive data such as production configurations. In order to protect them and decrease the risk for breach, it is recommended to encrypt them before delivery. Encryption makes data unreadable, so even if attackers gain access to these artifacts, they won't be able to harvest sensitive data from them without the decryption key.
target: gitlab
level: 2
severity: high
tags:
- devsecops
- encryption
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 4.1.2 Ensure artifacts are encrypted before distribution
audit:
  type: manual
  command: Ensure every artifact is encrypted before it is delivered.
remediation:
  type: iac_patch
  command: Encrypt every artifact before distribution.
