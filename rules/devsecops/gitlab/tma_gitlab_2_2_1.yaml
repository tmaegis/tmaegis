id: TMA-GITLAB-2.2.1
title: Ensure build workers are single-used
description: Use a clean instance of build worker for every pipeline run. Using a clean instance of build worker for every pipeline run eliminates the risks of data theft, data integrity breaches, and unavailability. It limits the pipeline's access to data stored on the file system from previous runs, and the cache is volatile. This prevents malicious changes from affecting other pipelines or the Continuous Integration/Continuous Delivery system itself.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 2.2.1 Ensure build workers are single-used
audit:
  type: manual
  command: Ensure that every pipeline that is being run has its own clean, new runner. In GitLab, each of your jobs runs in a newly provisioned VM, which is dedicated to the specific job. The VM is active only for the duration of the job and immediately deleted. This means that any changes that your job makes to the virtual machine will not be available to a subsequent job. The virtual machine where your job runs has sudo access with no password.
remediation:
  type: iac_patch
  command: Create a clean build worker for every pipeline that is being run, or use build platform- hosted runners, as they typically offer a clean instance for every run. In GitLab, use Runner SaaS to ensure all of these settings are available by default and that each job runs in a dedicated VM.
