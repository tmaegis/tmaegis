id: TMA-GITLAB-1.3.7
title: Ensure two administrators are set for each repository
description: Ensure every repository has two users with administrative permissions. Repository administrators have the highest permissions to said repository. These include the ability to add/remove collaborators, change branch protection policy, and convert to a publicly-accessible repository. Due to the liberal access granted to a repository administrator, it is highly recommended that only two contributors occupy this role.
target: gitlab
level: 2
severity: high
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.3.7 Ensure two administrators are set for each repository
audit:
  type: manual
  command: 'For every group, verify there are two administrators by performing the following: - On the left sidebar, at the bottom, select Admin Area. - Select Overview > Users. - List users selecting the Admin tab. - Verify that there are only 2 members with Admin permission.'
remediation:
  type: iac_patch
  command: 'For every group in use, set two administrators by performing the following: - On the left sidebar, at the bottom, select Admin Area. - Select Overview > Users. - List users selecting the Admin tab. - Find the team or person whose you''d like to revoke admin permissions. To edit a user, in the user’s row, select Edit.'
