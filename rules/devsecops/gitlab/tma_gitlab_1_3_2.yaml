id: TMA-GITLAB-1.3.2
title: Ensure top-level group creation is limited to specific members
description: Limit ability to create teams to trusted and specific users. The ability to create new teams should be restricted to specific members in order to keep the organization orderly and ensure users have access to only the lowest privilege level necessary. Teams typically inherit permissions from their parent team, thus if base permissions are less restricted and any user has the ability to create a team, a permission leverage could occur in which certain data is made available to users who should not have access to it. Such a situation could potentially lead to the creation of shadow teams by an attacker. Restricting team creation will also reduce additional clutter in the organizational structure, and as a result will make it easier to track changes and anomalies.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.3.2 Ensure top-level group creation is limited to specific members
audit:
  type: manual
  command: 'For every organization, ensure that top-level group creation is limited to specific, trusted users by performing the following: - On the left sidebar, at the bottom, select Admin Area. - Select Settings > General. - Expand Account and limit. - Verify that the Allow new users to create top-level groups checkbox is not checked.'
remediation:
  type: iac_patch
  command: 'For every organization, limit top-level group creation to specific, trusted users by performing the following: - On the left sidebar, at the bottom, select Admin Area. - Select Settings > General. - Expand Account and limit. - Clear the Allow new users to create top-level groups checkbox.'
