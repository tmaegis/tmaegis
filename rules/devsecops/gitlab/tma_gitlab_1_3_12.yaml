id: TMA-GITLAB-1.3.12
title: Ensure Git access is limited based on IP addresses
description: Limit Git access based on IP addresses by having a allowlist of IP addresses from which connection is possible. Allowing access to Git repositories (source code) only from specific IP addresses adds yet another layer of restriction and reduces the risk of unauthorized connection to the organization's assets. This will prevent attackers from accessing Source Code Management (SCM), as they would first need to know the allowed IP addresses to gain access to them.
target: gitlab
level: 2
severity: medium
tags:
- access-control
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.3.12 Ensure Git access is limited based on IP addresses
audit:
  type: command
  shell: bash
  command: 'command -v glab >/dev/null 2>&1 || exit 1

    glab auth status >/dev/null 2>&1 || exit 1

    proj=$(glab repo view -F json 2>/dev/null) || exit 1

    printf "%s" "$proj" | grep -q ''"id":'' && echo compliant || echo non-compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To restrict group access by IP address: 1. On the left sidebar, select Search or go to and find your group. 2. Select Settings > General. 3. Expand the Permissions and group features section. 4. In the Restrict access by IP address text box, enter a list of IPv4 or IPv6 address ranges in CIDR notation. This list: o Has no limit on the number of IP address ranges. o Has a size limit of 1 GB. o Applies to both SSH or HTTP authorized IP address ranges. You cannot split this list by type of authorization. 5. Select Save changes.'
