id: TMA-GITLAB-5.1.3
title: Ensure scanners are in place to identify and prevent sensitive data in deployment configuration
description: Detect and prevent sensitive data – such as confidential ID numbers, passwords, etc. – in deployment configurations. Sensitive data in deployment configurations might create a major incident if an attacker gains access to it, as this can cause data loss and theft. It is important to keep sensitive data safe and to not expose it in the configuration. In order to prevent a possible exposure, set scanners that will identify and prevent such data in deployment configurations.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 5.1.3 Ensure scanners are in place to identify and prevent sensitive data in deployment configuration
audit:
  type: manual
  command: For each deployment configuration file, verify that scanners are set to identify and prevent the existence of sensitive data within it.
remediation:
  type: iac_patch
  command: For each deployment configuration file, set scanners to identify and prevent sensitive data within it.
