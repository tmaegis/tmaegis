id: TMA-GITLAB-1.3.5
title: Ensure the organization is requiring members to use Multi- Factor Authentication (MFA)
description: Require members of the organization to use Multi-Factor Authentication (MFA) in addition to a standard user name and password when authenticating to the source code management platform. By default every user authenticates within the system by password only. If the password of a user is compromised, however, the user account and every repository to which they have access are in danger of data loss, malicious code commits, and data theft. It is therefore recommended that each user has Multi-Factor Authentication enabled. This adds an additional layer of protection to ensure the account remains secure even if the user's password is compromised.
target: gitlab
level: 2
severity: high
tags:
- auth
- devsecops
- gitlab
- mfa
reference: CIS GitLab Benchmark v1.0.1 - 1.3.5 Ensure the organization is requiring members to use Multi- Factor Authentication (MFA)
audit:
  type: command
  shell: bash
  command: 'command -v glab >/dev/null 2>&1 || exit 1

    glab auth status >/dev/null 2>&1 || exit 1

    proj=$(glab repo view -F json 2>/dev/null) || exit 1

    printf "%s" "$proj" | grep -q ''"id":'' && echo compliant || echo non-compliant'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Use the UI: 1. On the left sidebar, select Search or go to. 2. Select Admin Area. 3. On the left sidebar, select Settings > General. 4. Expand the Sign-in restrictions section: o Select Enforce two-factor authentication to enable this feature. o In Two-factor grace period, enter a number of hours. If you want to enforce 2FA on next sign-in attempt, enter 0. Use the API: Use the application settings API to modify the following settings: - require_two_factor_authentication, set to TRUE.'
