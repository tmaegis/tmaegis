id: TMA-GITLAB-5.2.1
title: Ensure deployments are automated
description: Automate deployments of production environment and application. Automating the deployments of both production environment and applications reduces the risk for human mistakes — such as a wrong configuration or exposure of sensitive data — because it requires less human interaction or intervention. It also eases redeployment of the environment. It is best to automate with Infrastructure as Code (IaC) because it offers more control over changes made to the environment creation configuration and stores to a version control platform.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 5.2.1 Ensure deployments are automated
audit:
  type: manual
  command: For each deployment process, ensure it is automated.
remediation:
  type: iac_patch
  command: Automate each deployment process of the production environment and application.
