id: TMA-GITLAB-2.2.4
title: Ensure build workers have minimal network connectivity
description: Ensure that build workers have minimal network connectivity. Restricting the network connectivity of build workers decreases the possibility that an attacker would be capable of entering the organization from the outside. If the build workers are connected to the public internet without any restriction, it is far simpler for attackers to compromise them. Limiting network connectivity between build workers also protects the organization in case an attacker was successful and subsequently attempts to spread the attack to other components of the environment.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
- network
reference: CIS GitLab Benchmark v1.0.1 - 2.2.4 Ensure build workers have minimal network connectivity
audit:
  type: manual
  command: 'Verify that build workers, environment, and any other components have only the required minimum of network connectivity. Review these configuration measures for your self-managed runners: - Configuring runner virtual machines in their own network segment - Blocking SSH access from the Internet to runner virtual machines - Restricting traffic between runner virtual machines - Filtering access to cloud provider metadata endpoints'
remediation:
  type: iac_patch
  command: 'Limit the network connectivity of build workers, environment, and any other components to the necessary minimum. Ensure these configuration measures are in place for your self-managed runners: - Configuring runner virtual machines in their own network segment - Blocking SSH access from the Internet to runner virtual machines - Restricting traffic between runner virtual machines - Filtering access to cloud provider metadata endpoints'
