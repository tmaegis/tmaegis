id: TMA-GITLAB-4.3.3
title: Ensure changes in package registry configuration are audited
description: Audit changes of the package registry configuration. The package registry is a crucial component in the software supply chain. It stores artifacts with potentially sensitive data that will eventually be deployed and used in production. Every change made to the package registry configuration must be examined carefully to ensure no exposure of the registry's sensitive data. This examination also ensures no malicious actors have performed modifications to a stored artifact. Auditing the configuration and its changes helps in decreasing such risks.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
- logging
reference: CIS GitLab Benchmark v1.0.1 - 4.3.3 Ensure changes in package registry configuration are audited
audit:
  type: manual
  command: Verify that all changes to the packages registry configuration are audited.
remediation:
  type: iac_patch
  command: Audit the changes to the package registry configuration.
