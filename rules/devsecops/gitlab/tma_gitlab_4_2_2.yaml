id: TMA-GITLAB-4.2.2
title: Ensure number of permitted users who may upload new artifacts is minimized
description: Minimize ability to upload artifacts to the lowest number of trusted users possible. Artifacts might contain sensitive data. Even the simplest mistake can also lead to trust issues with customers and harm the integrity of the product. To decrease these risks, allow only trusted and qualified users to upload new artifacts. Those users are less likely to make mistakes. Having the lowest number of such users possible will also decrease the risk of hacked user accounts, which could lead to a massive breach or artifact compromising.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 4.2.2 Ensure number of permitted users who may upload new artifacts is minimized
audit:
  type: manual
  command: Ensure only trusted and qualified users can upload new artifacts, and that their number is the lowest possible. - On the left sidebar, select Search or go to and find your project. - Select Manage > Members. - At the top of the member list, from the dropdown list, select Max role the members have in the group and descending order. - If there are minimum number of members with Owner/Maintainer role in the list, you are compliant.
remediation:
  type: iac_patch
  command: Allow only trusted and qualified users to upload new artifacts and limit them in number. - On the left sidebar, select Search or go to and find your project. - Select Manage > Members. - At the top of the member list, from the dropdown list, select Max role the members have in the group and descending order. - Next to the project member you want to remove, select Remove member.
