id: TMA-GITLAB-3.1.5
title: Ensure trusted package managers and repositories are defined and prioritized
description: Prioritize trusted package registries over others when pulling a package. When pulling a package by name, the package manager might look for it in several package registries, some of which may be untrusted or badly configured. If the package is pulled from such a registry, there is a higher likelihood that it could prove malicious. In order to avoid this, configure packages to be pulled from trusted package registries.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 3.1.5 Ensure trusted package managers and repositories are defined and prioritized
audit:
  type: manual
  command: For each package registry in use, ensure it is trusted. The GitLab package registry is enabled by default.
remediation:
  type: iac_patch
  command: For each package to be downloaded, configure it to be downloaded from a trusted source. To view your GitLab package registry and its contents, click on "Deploy" --> "Package Registry."
