id: TMA-GITLAB-1.1.1
title: Ensure any changes to code are tracked in a version control platform
description: Manage all code projects in a version control platform. Version control platforms keep track of every modification to code. They represent the cornerstone of code security, as well as allowing for better code collaboration within engineering teams. With granular access management, change tracking, and key signing of code edits, version control platforms are the first step in securing the software supply chain.
target: gitlab
level: 1
severity: low
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.1.1 Ensure any changes to code are tracked in a version control platform
audit:
  type: manual
  command: Ensure that all code activity is managed in a GitLab repository for every micro- service or application developed by your organization.
remediation:
  type: iac_patch
  command: Upload existing code projects to a GitLab group or instance and create an identity for each active team member who might contribute or need access to it.
