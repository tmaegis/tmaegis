id: TMA-GITLAB-5.2.2
title: Ensure the deployment environment is reproducible
description: Verify that the deployment environment – the orchestrator and the production environment where the application is deployed – is reproducible. This means that the environment stays the same in each deployment if the configuration has not changed. A reproducible build is a build that produces the same artifact when given the same input data, and in this case the same environment. Ensuring that the same environment is produced when given the same input helps verify that no change has been made to it. This action allows an organization to trust that its deployment environment is built only from safe code and configuration that has been reviewed and tested and has not been tainted or changed abruptly.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 5.2.2 Ensure the deployment environment is reproducible
audit:
  type: manual
  command: Verify that the deployment/production environment is reproducible.
remediation:
  type: iac_patch
  command: Adjust the process that deploys the deployment/production environment to build the same environment each time when the configuration has not changed.
