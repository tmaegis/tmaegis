id: TMA-GITLAB-4.2.6
title: Ensure minimum number of administrators are set for the package registry
description: Ensure the package registry has a minimum number of administrators. Package registry admins have the ability to add/remove users, repositories, packages. Due to the permissive access granted to an admin, it is highly recommended to keep the number of administrator accounts as minimal as possible.
target: gitlab
level: 1
severity: high
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 4.2.6 Ensure minimum number of administrators are set for the package registry
audit:
  type: manual
  command: Verify that your package registry has only the minimum number of administrators. For each project that you administer on GitLab, you can see every team or person with access to the project. Project-level permissions determine actions such as downloading, pushing, or deleting packages.
remediation:
  type: iac_patch
  command: 'Set the minimum number of administrators in your package registry. To accomplish this: For each project that you administer on GitLab, you can see an overview of every team or person with access to the repository. Provide access to the appropriate people or teams.'
