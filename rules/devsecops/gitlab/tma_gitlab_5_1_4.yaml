id: TMA-GITLAB-5.1.4
title: Limit access to deployment configurations
description: Restrict access to the deployment configuration to trusted and qualified users only. Deployment configurations are sensitive in nature. The tiniest mistake can lead to downtime or bugs in production, which can have a direct effect on the product's integrity and customer trust. Misconfigurations might also be used by malicious actors to attack the production platform. To avoid such harm as much as possible, ensure only trusted and qualified users have access to such configurations. This will also reduce the number of accounts that might affect the environment in case of an attack.
target: gitlab
level: 1
severity: medium
tags:
- access-control
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 5.1.4 Limit access to deployment configurations
audit:
  type: manual
  command: Verify each deployment configuration is accessible only to known and authorized users.
remediation:
  type: iac_patch
  command: Restrict access to the deployment configuration to trusted and qualified users.
