id: TMA-GITLAB-2.4.6
title: Ensure pipeline steps sign the Software Bill of Materials (SBOM) produced
description: SBOM (Software Bill of Materials) is a file that specifies each component of software or a build process. It should be generated after every pipeline run. After it is generated, it must then be signed. Software Bill of Materials (SBOM) is a file used to validate the integrity and security of a build pipeline. Signing it ensures that no one tampered with the file when it was delivered. Such interference can happen if someone tries to hide unusual activity. Validating the SBOM signature can detect this activity and prevent much greater incident.
target: gitlab
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- gitlab
- sbom
reference: CIS GitLab Benchmark v1.0.1 - 2.4.6 Ensure pipeline steps sign the Software Bill of Materials (SBOM) produced
audit:
  type: manual
  command: For each pipeline, ensure it signs the Software Bill of Materials it produces on every run.
remediation:
  type: iac_patch
  command: For each pipeline, configure it to sign its produced Software Bill of Materials on every run.
