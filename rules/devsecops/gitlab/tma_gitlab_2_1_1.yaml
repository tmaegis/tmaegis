id: TMA-GITLAB-2.1.1
title: Ensure each pipeline has a single responsibility
description: Ensure each pipeline has a single responsibility in the build process. Build pipelines generally have access to multiple secrets depending on their purposes. There are, for example, secrets of the test environment for the test phase, repository and artifact credentials for the build phase, etc. Limiting access to these credentials/secrets is therefore recommended by dividing pipeline responsibilities, as well as having a dedicated pipeline for each phase with the lowest privilege instead of a single pipeline for all. This will ensure that any potential damage caused by attacks on a workflow will be limited.
target: gitlab
level: 2
severity: low
tags:
- ci-cd
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 2.1.1 Ensure each pipeline has a single responsibility
audit:
  type: manual
  command: For each pipeline, ensure it has only one responsibility in the build process.
remediation:
  type: iac_patch
  command: Divide each multi-responsibility pipeline into multiple pipelines, each having a single responsibility with the least privilege. Additionally, create all new pipelines with a sole purpose going forward.
