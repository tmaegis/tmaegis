id: TMA-GITLAB-1.1.2
title: Ensure any change to code can be traced back to its associated task
description: Use a task management system to trace any code back to its associated task. The ability to trace each piece of code back to its associated task simplifies the Agile and DevOps process by enabling transparency of any code changes. This allows faster remediation of bugs and security issues, while also making it harder to push unauthorized code changes to sensitive projects. Additionally, using a task management system simplifies achieving compliance, as it is easier to track each regulation.
target: gitlab
level: 1
severity: medium
tags:
- devsecops
- gitlab
reference: CIS GitLab Benchmark v1.0.1 - 1.1.2 Ensure any change to code can be traced back to its associated task
audit:
  type: manual
  command: Ensure every code change can be traced back to its origin task in a task management system.
remediation:
  type: iac_patch
  command: Use GitLab issues to manage tasks as the starting point for each code change. Whether it is a new feature, bug fix, or security fix - all should originate from a dedicated task (GitLab issue) in your organization's task management system. Tasks (issues) should be linked to Merge Requests, and Merge requests should be linked to Issues.
