id: TMA-SSC-1.2.7
title: Ensure inactive repositories are reviewed and archived periodically
description: Track inactive repositories and remove them periodically. Inactive repositories (i.e., no new changes introduced for a long period of time) can enlarge the surface of a potential attack or data leak. These repositories are more likely to be improperly managed, and thus could possibly be accessed by many users in an organization. Note Bug fixes and deployment of necessary changes could prove complicated for archived repositories.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.2.7 Ensure inactive repositories are reviewed and archived periodically
audit:
  type: manual
  command: Verify that all the repositories in the organization are active, and those that are not are reviewed or archived.
remediation:
  type: iac_patch
  command: Review all inactive repositories and archive them periodically. 1.3 Contribution Access This section consists of security recommendations for managing access to the application code. This includes managing both internal and external access, administrator accounts, permissions, identification methods, etc. Securing these items is important for software safety, because every security constraint on access is an obstacle in the way of attacks. This section differentiates between common user account and admin account. It is important to understand that due to the high permissions of the admin account, it should be used only for administrative work and not for everyday tasks. 17 CIS Software Supply Chain Security Guide
