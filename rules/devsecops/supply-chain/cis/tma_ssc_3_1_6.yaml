id: TMA-SSC-3.1.6
title: Ensure a signed SBOM of the code is supplied
description: An SBOM is a file that specifies each component of software or a build process. When using a dependency, demand its SBOM and ensure it is signed for validation purposes. An SBOM creates trust between its provider and its users by ensuring that the software supplied is the software described, without any potential interference in between. Signing an SBOM creates a checksum for it, which will change if the SBOM’s content was changed. With that checksum, a software user can be certain nothing had happened to it during the supply chain, engendering trust in the software. When there is no such trust in the software, the risk surface is increased because one cannot know if the software is potentially vulnerable. Demanding a signed SBOM and validating it decreases that risk.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- sbom
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.1.6 Ensure a signed SBOM of the code is supplied
audit:
  type: manual
  command: For every artifact supplied, ensure it has a validated, signed SBOM.
remediation:
  type: iac_patch
  command: For every artifact supplied, require, and verify a signed SBOM from its supplier. 44 CIS Software Supply Chain Security Guide
