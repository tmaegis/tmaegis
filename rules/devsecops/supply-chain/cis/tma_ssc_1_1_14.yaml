id: TMA-SSC-1.1.14
title: Ensure branch protection rules are enforced for administrators
description: Ensure administrators are subject to branch protection rules. Administrators by default are excluded from any branch protection rules. This means these privileged users (on both the repository and organization levels) are not subject to protections meant to prevent untrusted code insertion, including malicious code. This is extremely important since administrator accounts are often targeted for account hijacking due to their privileged role. Note Administrator users will not be able to push code directly to the protected branch without being compliant with listed branch protection rules.
target: supply-chain
level: 1
severity: high
tags:
- branch-protection
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.14 Ensure branch protection rules are enforced for administrators
audit:
  type: manual
  command: For each repository in use, validate branch protection rules also apply to administrator accounts.
remediation:
  type: iac_patch
  command: For each repository in use, enforce branch protection rules on administrators, as well.
