id: TMA-SSC-5.1.4
title: Ensure access to deployment configurations are limited to specific members
description: Restrict access to the deployment configuration to trusted and qualified users only. Deployment configurations are sensitive in nature. The tiniest mistake can lead to downtime or bugs in production, which can have a direct effect on the product’s integrity and customer trust. Misconfigurations might also be used by malicious actors to attack the production platform. To avoid such harm as much as possible, ensure only trusted and qualified users have access to such configurations. This will also reduce the number of accounts that might affect the environment in case of an attack. Note Reducing the number of users who have access to the deployment configuration means those users would lose their ability to make direct changes to that configuration.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.1.4 Ensure access to deployment configurations are limited to specific members
audit:
  type: manual
  command: Verify each deployment configuration is accessible only to known and authorized users.
remediation:
  type: iac_patch
  command: Restrict access to the deployment configuration to trusted and qualified users.
