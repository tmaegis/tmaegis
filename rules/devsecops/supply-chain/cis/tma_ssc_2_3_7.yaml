id: TMA-SSC-2.3.7
title: Ensure pipelines are automatically scanned for vulnerabilities
description: Scan pipelines for vulnerabilities. It is recommended that this be implemented automatically. Automatic scanning for vulnerabilities detects known vulnerabilities in pipeline instructions and components, allowing faster patching in case one is found. These vulnerabilities can lead to a potentially massive breach if not handled as fast as possible, as attackers might also be aware of such vulnerabilities.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.3.7 Ensure pipelines are automatically scanned for vulnerabilities
audit:
  type: manual
  command: For each pipeline, verify that it is automatically scanned for vulnerabilities.
remediation:
  type: iac_patch
  command: For each pipeline, set automated vulnerability scanning. 38 CIS Software Supply Chain Security Guide
