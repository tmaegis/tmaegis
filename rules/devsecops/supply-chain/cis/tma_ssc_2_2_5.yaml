id: TMA-SSC-2.2.5
title: Ensure run-time security is enforced for build workers
description: Add traces to build workers’ operating systems and installed applications so that in run time, collected events can be analyzed to detect suspicious behavior patterns and malware. Build workers are exposed to data exfiltration attacks, code injection attacks, and more while running. It is important to secure them from such attacks by enforcing run-time security on the build worker itself. This will identify attempted attacks in real time and prevent them.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.2.5 Ensure run-time security is enforced for build workers
audit:
  type: manual
  command: Verify that a run-time security solution is enforced on every active build worker.
remediation:
  type: iac_patch
  command: Deploy and enforce a run-time security solution on build workers. 34 CIS Software Supply Chain Security Guide
