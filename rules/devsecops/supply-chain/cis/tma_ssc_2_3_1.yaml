id: TMA-SSC-2.3.1
title: Ensure all build steps are defined as code
description: Use pipeline as code for build pipelines and their defined steps. Storing pipeline instructions as code in a version control system means automation of the build steps and less room for human error, which could potentially lead to a security breach. Additionally, it creates the ability to revert to a previous pipeline configuration in order to pinpoint the affected change should a malicious incident occur.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.3.1 Ensure all build steps are defined as code
audit:
  type: manual
  command: Verify that all build steps are defined as code and stored in a version control system.
remediation:
  type: iac_patch
  command: Convert pipeline instructions into code-based syntax and upload them to the organization’s version control platform. 36 CIS Software Supply Chain Security Guide
