id: TMA-SSC-1.1.16
title: Ensure force push code to branches is denied
description: The “force push” option allows users with “push” permissions to force their changes directly to the branch without a pull request, and thus should be disabled. The “force push” option allows users to override the existing code with their own code. This can lead to both intentional and unintentional data loss, as well as data infection with malicious code. Disabling the “force push” option prohibits users from forcing their changes to the main branch, which ultimately prevents malicious code from entering source code. Note Users cannot “force push” to protected branches.
target: supply-chain
level: 1
severity: high
tags:
- branch-protection
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.16 Ensure force push code to branches is denied
audit:
  type: manual
  command: For each repository in use, validate that no one can “force push” code.
remediation:
  type: iac_patch
  command: For each repository in use, block the option to “force push” code.
