id: TMA-SSC-1.3.7
title: Ensure two administrators are set for each repository
description: Ensure every repository has two users with administrative permissions. Repository administrators have the highest permissions to said repository. These include the ability to add/remove collaborators, change branch protection policy, and convert to a publicly accessible repository. Due to the liberal access granted to a repository administrator, it is highly recommended that only two contributors occupy this role. Note Removing administrative users from a repository would result in them losing high- level access to that repository.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.7 Ensure two administrators are set for each repository
audit:
  type: manual
  command: For every repository in use, verify there are two administrators.
remediation:
  type: iac_patch
  command: For every repository in use, set two administrators. 20 CIS Software Supply Chain Security Guide
