id: TMA-SSC-1.3.13
title: Ensure anomalous code behavior is tracked
description: Track code anomalies. Carefully analyze any code anomalies within the organization. For example, a code anomaly could be a push made outside of working hours. Such a code push has a higher likelihood of being the result of an attack, as most if not all members of the organization would likely be outside the office. Another example is an activity that exceeds the average activity of a particular user. Tracking and auditing such behaviors creates additional layers of security and can aid in early detection of potential attacks.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.13 Ensure anomalous code behavior is tracked
audit:
  type: manual
  command: For every repository in use, ensure code anomalies relevant to the organization are promptly investigated.
remediation:
  type: iac_patch
  command: For every repository in use, track and investigate anomalous code behavior and activity. 23 CIS Software Supply Chain Security Guide 1.4 Third-Party This section consists of security recommendations for using third-party applications in the code repositories. Applications are typically automated integrations that improve the workflow of an organization — for example, OAuth applications or Github applications. Those applications are written by third-party developers and therefore should be reviewed carefully before use. It is important to monitor their use and permissions because unused applications or unnecessary high permissions can enlarge the attack surface.
