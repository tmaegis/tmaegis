id: TMA-SSC-3.1.4
title: Ensure dependencies are monitored between open-source components
description: Monitor, or ask software suppliers to monitor, dependencies between open-source components in use. Monitoring dependencies between open-source components helps to detect if software has fallen victim to attack on a common open-source component. Swift detection can aid in quick application of a fix. It also helps find potential compliance problems with components usage. Some dependencies might not be compatible with the organization’s policies, and other dependencies might have a license that is not compatible with how the organization uses this specific dependency. If dependencies are monitored, such situations can be detected and mitigated sooner, potentially deterring malicious attacks.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- monitoring
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.1.4 Ensure dependencies are monitored between open-source components
audit:
  type: manual
  command: For each open-source component, ensure its dependencies are monitored.
remediation:
  type: iac_patch
  command: For each open-source component, monitor its dependencies.
