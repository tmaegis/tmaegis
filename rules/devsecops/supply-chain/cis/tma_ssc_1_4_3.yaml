id: TMA-SSC-1.4.3
title: Ensure the access granted to each installed application is limited to the least privilege needed
description: Ensure installed application permissions are limited to the lowest privilege level required. Applications are typically automated integrations that can improve the workflow of an organization. They are written by third-party developers and therefore should be reviewed carefully before use. It is recommended to use the “principle of least privilege,” granting applications the lowest level of permissions required. This may prevent harm from a potentially malicious application with unnecessarily high-level permissions leaking data or modifying source code.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.4.3 Ensure the access granted to each installed application is limited to the least privilege needed
audit:
  type: manual
  command: Verify that each installed application has the least privilege needed.
remediation:
  type: iac_patch
  command: Grant permissions to applications by the “principle of least privilege,” meaning the lowest possible permission necessary. 1.5 Code Risks This section consists of recommendations for many security code scanners. This includes, for example, looking for hard-coded secrets, common misconfigurations that are vulnerable to attack or restrictive licenses. Because an application code has a lot of components, it is important to scan each part that can lead to attack — from secrets to licenses.
