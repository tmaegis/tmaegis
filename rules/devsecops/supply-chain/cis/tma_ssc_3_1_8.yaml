id: TMA-SSC-3.1.8
title: Ensure all packages used are more than 60 days old
description: Use packages that are more than 60 days old. Third-party packages are a major risk since an organization cannot control their source code, and there is always the possibility these packages could be malicious. It is therefore good practice to remain cautious with any third-party or open-source package, especially new ones, until they can be verified that they are safe to use. Avoiding a new package allows the organization to fully examine it, its maintainer, and its behavior, and gives enough time to determine whether or not to use it. Note Developers may not use packages that are less than 60 days old.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.1.8 Ensure all packages used are more than 60 days old
audit:
  type: manual
  command: For every package used, ensure it is more than 60 days old.
remediation:
  type: iac_patch
  command: If a package used is less than 60 days old, stop using it and find another solution. 3.2 Validate Packages This section consists of security recommendations for managing package validations and checks. Third-party packages and dependencies might put the organization in danger, not only by being vulnerable to attacks, but also by being improperly used and harming license conditions. To protect the software supply chain from these dangers, it is important to validate packages and understand how and if to use them. This section’s recommendations cover this topic. 45 CIS Software Supply Chain Security Guide
