id: TMA-SSC-2.2.6
title: Ensure build workers are automatically scanned for vulnerabilities
description: Scan build workers for vulnerabilities. It is recommended that this be done automatically. Automatic scanning for vulnerabilities detects known weaknesses in environmental sources in use, such as docker images or kernel versions. Such vulnerabilities can lead to a massive breach if these environments are not replaced as fast as possible, since attackers also know about these vulnerabilities and often try to take advantage of them. Setting automatic scanning that scans environmental sources ensures that if any new vulnerability is revealed, it can be replaced quickly and easily. This protects the worker from being exposed to attacks.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.2.6 Ensure build workers are automatically scanned for vulnerabilities
audit:
  type: manual
  command: For each build worker, ensure the environmental sources it uses are scanned for vulnerabilities.
remediation:
  type: iac_patch
  command: For each build worker, automatically scan its environmental sources, such as docker images, for vulnerabilities.
