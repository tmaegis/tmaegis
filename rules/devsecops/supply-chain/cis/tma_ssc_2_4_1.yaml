id: TMA-SSC-2.4.1
title: Ensure all artifacts on all releases are signed
description: Sign all artifacts in all releases with user or organization keys. Signing artifacts is used to validate both their integrity and security. Organizations signal that artifacts may be trusted and they themselves produced them by ensuring that every artifact is properly signed. The presence of this signature also makes potentially malicious activity far more difficult.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.4.1 Ensure all artifacts on all releases are signed
audit:
  type: manual
  command: Ensure every artifact in every release is signed.
remediation:
  type: iac_patch
  command: For every artifact in every release, verify that all are properly signed. 39 CIS Software Supply Chain Security Guide
