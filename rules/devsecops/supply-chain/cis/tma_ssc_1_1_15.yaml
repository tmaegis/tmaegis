id: TMA-SSC-1.1.15
title: Ensure pushing or merging of new code is restricted to specific individuals or teams
description: Ensure that only trusted users can push or merge new code to protected branches. Requiring that only trusted users may push or merge new changes reduces the risk of unverified code, especially malicious code, to a protected branch by reducing the number of trusted users who are capable of doing such. Note Only administrators and trusted users can push or merge to the protected branch.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.15 Ensure pushing or merging of new code is restricted to specific individuals or teams
audit:
  type: manual
  command: For each repository that is being used, ensure only trusted and responsible users can push or merge new code.
remediation:
  type: iac_patch
  command: For each repository in use, allow only trusted and responsible users to push or merge new code. 12 CIS Software Supply Chain Security Guide
