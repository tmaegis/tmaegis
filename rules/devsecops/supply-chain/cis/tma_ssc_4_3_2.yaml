id: TMA-SSC-4.3.2
title: Ensure all versions of an existing artifact have their signatures validated
description: Validate the signatures of all versions of an existing artifact. In order to be certain a version of an existing and trusted artifact is not malicious or delivered by someone looking to interfere with the supply chain, it is a good practice to validate the signatures of each version. Doing so decreases the risk of using a compromised artifact, which might lead to a breach.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.3.2 Ensure all versions of an existing artifact have their signatures validated
audit:
  type: manual
  command: For each artifact, ensure that all of its versions are signed and validated before it is uploaded or used.
remediation:
  type: iac_patch
  command: For each artifact, sign and validate each version before uploading or using the artifact.
