id: TMA-SSC-2.2.1
title: Ensure build workers are single-used
description: Use a clean instance of build worker for every pipeline run. Using a clean instance of build worker for every pipeline run eliminates the risks of data theft, data integrity breaches, and unavailability. It limits the pipeline’s access to data stored on the file system from previous runs, and the cache is volatile. This prevents malicious changes from affecting other pipelines or the Continuous Integration/Continuous Delivery (CI/CD) system itself. Note Data and cache will not be saved in different pipeline runs.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.2.1 Ensure build workers are single-used
audit:
  type: manual
  command: Ensure that every pipeline that is being run has its own clean, new runner.
remediation:
  type: iac_patch
  command: Create a clean build worker for every pipeline that is being run, or use build platform-hosted runners, as they typically offer a clean instance for every run. 32 CIS Software Supply Chain Security Guide
