id: TMA-SSC-1.3.5
title: Ensure the organization is requiring members to use Multi-Factor Authentication (MFA)
description: Require members of the organization to use Multi-Factor Authentication (MFA) in addition to a standard user name and password when authenticating to the source code management platform. By default, every user authenticates within the system by password only. If the password of a user is compromised, however, the user account and every repository to which they have access is in danger of data loss, malicious code commits, and data theft. It is therefore recommended that each user has Multi-Factor Authentication enabled. This adds an additional layer of protection to ensure the account remains secure even if the user’s password is compromised. Note Members could be removed from the organization if they do not have Multi-Factor Authentication already enabled. If this is the case, it is recommended that an invitation be sent to reinstate the user’s access and former privileges. They must...
target: supply-chain
level: 1
severity: high
tags:
- auth
- devsecops
- mfa
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.5 Ensure the organization is requiring members to use Multi-Factor Authentication (MFA)
audit:
  type: manual
  command: For every organization that exists in your source code management platform, verify that Multi- Factor Authentication is enforced and is the only way to authenticate.
remediation:
  type: iac_patch
  command: Use the built-in setting to ensure the enforcement of Multi-Factor Authentication for each member of the organization. 19 CIS Software Supply Chain Security Guide
