id: TMA-SSC-1.1.18
title: Ensure any merging of code is automatically scanned for risks
description: Ensure that every pull request is required to be scanned for risks. Scanning pull requests to detect risks allows for early detection of vulnerable code and/or dependencies and helps mitigate potentially malicious code.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.18 Ensure any merging of code is automatically scanned for risks
audit:
  type: manual
  command: For each repository in use, ensure that every pull request must be scanned for risks.
remediation:
  type: iac_patch
  command: For every repository in use, enforce risk scanning on every pull request. 13 CIS Software Supply Chain Security Guide
