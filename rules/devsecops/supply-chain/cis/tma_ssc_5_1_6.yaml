id: TMA-SSC-5.1.6
title: Ensure deployment configuration manifests are verified
description: Verify the deployment configuration manifests. To ensure that the configuration manifests used are trusted and have not been infected by malicious actors before arriving at the platform, it is important to verify the manifests. This may be done by comparing the checksum of the manifest file to its checksum in a trusted source. If a difference arises, this is a sign that an unknown actor has interfered and may have added malicious instructions. If this manifest is used, it might harm the environment and application deployment, which could end in a massive breach and leave the organization exposed to data leaks, etc.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.1.6 Ensure deployment configuration manifests are verified
audit:
  type: manual
  command: For each deployment configuration manifest in use, ensure it has been verified.
remediation:
  type: iac_patch
  command: Verify each deployment configuration manifest in use.
