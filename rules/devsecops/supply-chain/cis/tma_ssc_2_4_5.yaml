id: TMA-SSC-2.4.5
title: Ensure pipeline steps produce a Software Bill of Materials (SBOM)
description: An SBOM is a file that specifies each component of software or a build process. Generate an SBOM after each run of a pipeline. Generating an SBOM after each run of a pipeline will validate the integrity and security of that pipeline. Recording every step or component role in the pipeline ensures that no malicious acts have been committed during the pipeline’s run.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- sbom
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.4.5 Ensure pipeline steps produce a Software Bill of Materials (SBOM)
audit:
  type: manual
  command: For each pipeline, ensure it produces an SBOM on every run.
remediation:
  type: iac_patch
  command: For each pipeline, configure it to produce an SBOM on every run.
