id: TMA-SSC-2.1.5
title: Ensure access to build environments is limited
description: Restrict access to the build environment (orchestrator, pipeline executor, their environment, etc.) to trusted and qualified users only. A build environment contains sensitive data such as environment variables, secrets, and the source code itself. Any user that has access to this environment can make changes to the build process, including changes to the code within it. Restricting access to the build environment to trusted and qualified users only will reduce the risk for mistakes such as exposure of secrets or misconfiguration. Limiting access also reduces the number of accounts that are vulnerable to hijacking in order to potentially harm the build environment. Note Reducing the number of users who have access to the build process means those users would lose their ability to make direct changes to that process.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.1.5 Ensure access to build environments is limited
audit:
  type: manual
  command: Verify each build environment is accessible only to known and authorized users.
remediation:
  type: iac_patch
  command: Restrict access to the build environment to trusted and qualified users. 31 CIS Software Supply Chain Security Guide
