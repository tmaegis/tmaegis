id: TMA-SSC-1.1.3
title: Ensure any change to code receives approval of two strongly authenticated users
description: Ensure that every code change is reviewed and approved by two authorized contributors who are both strongly authenticated, from the team relevant to the code change. To prevent malicious or unauthorized code changes, the first layer of protection is the process of code review. This process involves engineer teammates reviewing each other’s code for errors, optimizations, and general knowledge-sharing. With proper peer reviews in place, an organization can detect unwanted code changes very early in the process of release. In order to help facilitate code review, companies should employ automation to verify that every code change has been reviewed and approved by at least two team members before it is pushed into the code base. These team members should be from the team that is related to the code change, so it will be a meaningful review. Note To enforce a code review requirement, veri...
target: supply-chain
level: 1
severity: medium
tags:
- auth
- devsecops
