reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.3 Ensure any change to code receives approval of two strongly authenticated users
audit:
  type: manual
  command: For every code repository in use, verify that two approvals from the specific code repository team are required in order to push new code to the code base.
remediation:
  type: iac_patch
  command: An organization can protect specific code branches — for example, the “main” branch, which often is the version deployed to production — by setting protection rules. These rules secure your code repository from unwanted or unauthorized changes. You may set requirements for any code change to that branch, and thus specify a minimum number of reviewers required to approve a change. 6 CIS Software Supply Chain Security Guide
