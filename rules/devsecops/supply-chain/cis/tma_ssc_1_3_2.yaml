id: TMA-SSC-1.3.2
title: Ensure team creation is limited to specific members
description: Limit the ability to create teams to trusted and specific users. The ability to create new teams should be restricted to specific members in order to keep the organization orderly and ensure users have access to only the lowest privilege level necessary. Teams typically inherit permissions from their parent team; thus, if base permissions are less restricted and any user has the ability to create a team, a permission leverage could occur in which certain data is made available to users who should not have access to it. Such a situation could potentially lead to the creation of shadow teams by an attacker. Restricting team creation will also reduce additional clutter in the organizational structure, and as a result will make it easier to track changes and anomalies. Note Only specific users will be able to create new teams.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.2 Ensure team creation is limited to specific members
audit:
  type: manual
  command: For every organization, ensure that team creation is limited to specific, trusted users.
