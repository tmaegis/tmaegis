id: TMA-SSC-1.4.2
title: Ensure stale applications are reviewed and inactive ones are removed
description: Ensure stale (inactive) applications are reviewed and removed if no longer in use. Applications that have been inactive for a long period of time are enlarging the surface of attack for data leaks. They are more likely to be improperly managed, and could possibly be accessed by third-party developers as a tool for collecting internal data of the organization or repository in which they are installed. It is important to remove these inactive applications as soon as possible.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.4.2 Ensure stale applications are reviewed and inactive ones are removed
audit:
  type: manual
  command: Verify that all the applications in the organization are actively used, and remove those that are no longer in use.
remediation:
  type: iac_patch
  command: Review all stale applications and periodically remove them. 24 CIS Software Supply Chain Security Guide
