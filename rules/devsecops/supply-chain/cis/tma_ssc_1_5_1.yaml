id: TMA-SSC-1.5.1
title: Ensure scanners are in place to identify and prevent sensitive data in code
description: Detect and prevent sensitive data in code, such as confidential ID numbers, passwords, etc. Having sensitive data in the source code makes it easier for attackers to maliciously use such information. In order to avoid this, designate scanners to identify and prevent the existence of sensitive data in the code.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.5.1 Ensure scanners are in place to identify and prevent sensitive data in code
audit:
  type: manual
  command: For every repository in use, verify that scanners are set to identify and prevent the existence of sensitive data in code.
remediation:
  type: iac_patch
  command: For every repository in use, designate scanners to identify and prevent sensitive data in code. 25 CIS Software Supply Chain Security Guide
