id: TMA-SSC-1.3.8
title: Ensure strict base permissions are set for repositories
description: Base permissions define the permission level automatically granted to all organization members. Define strict base access permissions for all of the repositories in the organization, including new ones. Defining strict base permissions is the best practice in every role-based access control (RBAC) system. If the base permission is high — for example, “Write” permission — every member of the organization will have “Write” permission to every repository in the organization. This will apply regardless of the specific permissions a user might need, which generally differ between organization repositories. The higher the permission, the higher the risk for incidents such as bad code commit or data breach. It is therefore recommended to set the base permissions to the strictest level possible. Note Users might not be able to access organization repositories or perform some acts as commits....
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.8 Ensure strict base permissions are set for repositories
audit:
  type: manual
  command: Verify that strict base permissions are set for the organization repositories — either “None” or “Read.”
remediation:
  type: iac_patch
  command: Set strict base permissions for the organization repositories — either “None” or “Read.”
