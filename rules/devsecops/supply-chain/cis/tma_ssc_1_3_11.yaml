id: TMA-SSC-1.3.11
title: Ensure an organization provides SSH certificates
description: 'As an organization, become an SSH Certificate Authority (CA) and provide SSH keys for accessing repositories. There are two ways for remotely working with Source Code Management: via HTTPS, which requires authentication by user/password, or via SSH, which requires the use of SSH keys. SSH authentication is better in terms of security; key creation and distribution, however, must be done in a secure manner. This can be accomplished by implementing SSH certificates, which are used to validate the server’s identity. A developer will not be able to connect to a Git server if its key cannot be verified by the SSH Certificate Authority (CA) server. As an organization, one can verify the SSH certificate signature used to authenticate if a CA is defined and used. This ensures that only verified developers can access organization repositories, as their SSH key will be the only one signed by th...'
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- ssh
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.11 Ensure an organization provides SSH certificates
audit:
  type: manual
  command: Verify that the organization has an SSH Certificate Authority server and provides an SSH certificate with which to sign keys.
remediation:
  type: iac_patch
  command: Deploy an SSH Certificate Authority server and configure it to provide an SSH certificate with which to sign keys. 22 CIS Software Supply Chain Security Guide
