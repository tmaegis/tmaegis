id: TMA-SSC-5.2.4
title: Ensure default passwords are not used
description: Do not use default passwords of deployment tools and components. Many deployment tools and components are provided with default passwords for the first login. This password is intended to be used only on the first login and should be changed immediately after. Using the default password increases the attack risk. It is very important to ensure that default pasxswords are not used in deployment tools and components.
target: supply-chain
level: 1
severity: medium
tags:
- auth
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.2.4 Ensure default passwords are not used
audit:
  type: manual
  command: For each deployment tool, ensure the password is not the default one.
remediation:
  type: iac_patch
