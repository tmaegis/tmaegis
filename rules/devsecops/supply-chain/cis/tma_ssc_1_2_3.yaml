id: TMA-SSC-1.2.3
title: Ensure repository deletion is limited to specific users
description: Ensure only a limited number of trusted users can delete repositories. Restricting the ability to delete repositories protects the organization from intentional and unintentional data loss. This ensures that users cannot delete repositories or cause other potential damage — whether by accident or due to their account being hacked — unless they have the correct privileges. Note Certain users will not be permitted to delete repositories.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.2.3 Ensure repository deletion is limited to specific users
audit:
  type: manual
  command: Verify that only a limited number of trusted users can delete repositories.
remediation:
  type: iac_patch
  command: Enforce repository deletion by a few trusted and responsible users only.
