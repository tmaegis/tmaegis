id: TMA-SSC-2.3.6
title: Ensure pipelines are automatically scanned for misconfigurations
description: Scan the pipeline for misconfigurations. It is recommended that this be performed automatically. Automatic scans for misconfigurations detect human mistakes and misconfigured tasks. This protects the environment from backdoors caused by such mistakes, which create easier access for attackers. For example, a task that mistakenly configures credentials to persist on the disk makes it easier for an attacker to steal them. This type of incident can be prevented by auto-scanning.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.3.6 Ensure pipelines are automatically scanned for misconfigurations
audit:
  type: manual
  command: For each pipeline, verify that it is automatically scanned for misconfigurations.
remediation:
  type: iac_patch
  command: For each pipeline, set automated misconfiguration scanning.
