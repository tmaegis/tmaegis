id: TMA-SSC-1.1.19
title: Ensure any changes to branch protection rules are audited
description: Ensure that changes in the branch protection rules are audited. Branch protection rules should be configured on every repository. The only users who may change such rules are administrators. In a case of an attack on an administrator account or of human error on the part of an administrator, protection rules could be disabled, and thus decrease source code confidentiality as a result. It is important to track and audit such changes to prevent potential incidents as soon as possible.
target: supply-chain
level: 1
severity: medium
tags:
- branch-protection
- devsecops
- logging
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.19 Ensure any changes to branch protection rules are audited
audit:
  type: manual
  command: Ensure a tracking system is in place that logs changes in branch protection rules (webhooks, etc.).
remediation:
  type: iac_patch
  command: Use, maintain, or create a tracking system that tracks changes in branch protection rules (webhooks, etc.). 14 CIS Software Supply Chain Security Guide 1.2 Repository Management This section consists of security recommendations for proper code repository management. Code repositories are where the application code is stored and organized. It is important to keep code repositories organized and maintained to avoid data loss, data theft, and other attacks that may happen unknowingly when a repository is not maintained well. The recommendations of this section are setting guides to do so.
