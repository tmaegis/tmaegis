id: TMA-SSC-2.2.7
title: Ensure build workers’ deployment configuration is stored in a version control platform
description: Store the deployment configuration of build workers in a version control platform, such as Github. Build workers are a sensitive part of the build phase. They generally have access to the code repository, the Continuous Integration platform, the deployment platform, etc. This means that an attacker gaining access to a build worker may compromise other platforms in the organization and cause a major incident. One thing that can protect workers is to ensure that their deployment configuration is safe and well-configured. Storing the deployment configuration in version control enables more observability of these configurations because everything is catalogued in a single place. It adds another layer of security, as every change will be reviewed and noticed, and thus malicious changes will theoretically occur less. In the case of a mistake, bug, or security incident, it also offers an eas...
target: supply-chain
level: 1
severity: medium
