id: TMA-SSC-3.2.2
title: Ensure packages are automatically scanned for known vulnerabilities
description: Automatically scan every package for vulnerabilities. Automatic scanning for vulnerabilities detects known vulnerabilities in packages and dependencies in use, allowing faster patching when one is found. Such vulnerabilities can lead to a massive breach if not handled as fast as possible, as attackers will also know about those vulnerabilities and swiftly try to take advantage of them. Scanning packages regularly for vulnerabilities can also verify usage compliance with the organization’s security policy.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.2.2 Ensure packages are automatically scanned for known vulnerabilities
audit:
  type: manual
  command: Ensure automatic scanning of packages for vulnerabilities is enabled.
remediation:
  type: iac_patch
  command: Set automatic scanning of packages for vulnerabilities.
