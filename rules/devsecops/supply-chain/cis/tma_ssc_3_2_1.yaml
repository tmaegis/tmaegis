id: TMA-SSC-3.2.1
title: Ensure an organization-wide dependency usage policy is enforced
description: Enforce a policy for dependency usage across the organization. For example, disallow the use of packages less than 60 days old. Enforcing a policy for dependency usage in an organization helps to manage dependencies across the organization and ensure that all usage is compliant with security policy. If, for example, the policy limits the package managers that can be used, enforcing it will make sure that every dependency is installed only from these package managers, and limit the risk of installing from any untrusted source.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.2.1 Ensure an organization-wide dependency usage policy is enforced
audit:
  type: manual
  command: Verify that a policy for dependency usage is enforced across the organization.
remediation:
  type: iac_patch
  command: Enforce policies for dependency usage across the organization.
