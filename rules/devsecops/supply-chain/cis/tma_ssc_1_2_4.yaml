id: TMA-SSC-1.2.4
title: Ensure issue deletion is limited to specific users
description: Ensure only trusted and responsible users can delete issues. Issues are a way to keep track of things happening in repositories, such as setting new milestones or requesting urgent fixes. Deleting an issue is not a benign activity, as it might harm the development workflow or attempt to hide malicious behavior. Because of this, it should be restricted and allowed only by trusted and responsible users. Note Certain users will not be permitted to delete issues.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.2.4 Ensure issue deletion is limited to specific users
audit:
  type: manual
  command: Verify that only trusted and responsible users can delete issues.
remediation:
  type: iac_patch
  command: Restrict issue deletion to a few trusted and responsible users only.
