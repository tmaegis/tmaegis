id: TMA-SSC-1.1.10
title: Ensure open Git branches are up to date before they can be merged into code base
description: Organizations should make sure each suggested code change is in full sync with the existing state of its origin code repository before allowing merging. Git branches can easily become outdated since the origin code repository is constantly being edited. This means engineers working on separate code branches can accidentally include outdated code with potential security issues that might have already been fixed, overriding the potential solutions for those security issues when merging their own changes. Note If enforced, outdated branches would not be able to be merged into their origin repository without first being updated to contain any recent changes.
target: supply-chain
level: 1
severity: medium
tags:
- branch-protection
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.10 Ensure open Git branches are up to date before they can be merged into code base
audit:
  type: manual
  command: For each code repository in use, verify that open branches must be updated before merging is permitted.
remediation:
  type: iac_patch
  command: For each code repository in use, enforce a policy to only allow merging open branches if they are current with the latest change from their origin repository.
