id: TMA-SSC-2.3.8
title: Ensure scanners are in place to identify and prevent sensitive data in pipeline files
description: Detect and prevent sensitive data, such as confidential ID numbers, passwords, etc., in pipelines. Sensitive data in pipeline configuration, such as cloud provider credentials or repository credentials, create vulnerabilities with which malicious actors could steal such information if they gain access to a pipeline. In order to mitigate this, set scanners that will identify and prevent the existence of sensitive data in the pipeline.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.3.8 Ensure scanners are in place to identify and prevent sensitive data in pipeline files
audit:
  type: manual
  command: For every pipeline that is in use, verify that scanners are set to identify and prevent the existence of sensitive data within it.
remediation:
  type: iac_patch
  command: For every pipeline that is in use, set scanners that will identify and prevent sensitive data within it. 2.4 Pipeline Integrity This section consists of security recommendations for keeping pipeline integrity. Integrity means ensuring that the pipelines, the dependencies they use, and their artifacts are all authentic and what they intended to be. Securing the pipeline integrity is to verify that every change and process running during the build pipeline run is what it is supposed to be. One way to do that, for example, is to lock each dependency to a certain secured version. It is important to insist on securing that because this is the way to set trust with the customer.
