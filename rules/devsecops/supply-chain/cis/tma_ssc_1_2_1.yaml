id: TMA-SSC-1.2.1
title: Ensure all public repositories contain a SECURITY.md file
description: Limit the ability to create repositories to trusted users and teams. Restricting repository creation to trusted users and teams is recommended in order to keep the organization properly structured, track fewer items, prevent impersonation, and to not overload the version control system. It will allow administrators easier source code tracking and management capabilities, as they will have fewer repositories to track. The process of detecting potential attacks becomes far more straightforward, as well, since the easier it is to track the source code, the easier it is to detect malicious acts within it. Additionally, the possibility of a member creating a public repository and sharing the organization’s data externally is significantly decreased. Note Specific users will not be permitted to create repositories.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.2.1 Ensure all public repositories contain a SECURITY.md file
audit:
  type: manual
  command: Verify that only trusted users and teams can create repositories.
remediation:
  type: iac_patch
  command: Restrict repository creation to trusted users and teams only. 15 CIS Software Supply Chain Security Guide
