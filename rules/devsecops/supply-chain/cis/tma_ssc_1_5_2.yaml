id: TMA-SSC-1.5.2
title: Ensure scanners are in place to secure Continuous Integration (CI) pipeline instructions
description: Detect and prevent misconfigurations and insecure instructions in Continuous Integration (CI) pipelines. Detecting and fixing misconfigurations or insecure instructions in CI pipelines decreases the risk for a successful attack through or on the CI pipeline. The more secure the pipeline, the less risk there is for potential exposure of sensitive data, a deployment being compromised, or external access mistakenly being granted to the CI infrastructure or the source code.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.5.2 Ensure scanners are in place to secure Continuous Integration (CI) pipeline instructions
audit:
  type: manual
  command: For every CI pipeline, verify that scanners are set to identify and prevent misconfigurations and insecure instructions.
remediation:
  type: iac_patch
  command: For every CI pipeline, set scanners to identify and prevent misconfigurations and insecure instructions.
