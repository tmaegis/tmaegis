reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.1.7 Ensure deployment configuration manifests are pinned to a specific, verified version
audit:
  type: manual
  command: For every deployment configuration manifest in use, ensure it is pinned to a specific version or commit Secure Hash Algorithm (SHA).
remediation:
  type: iac_patch
  command: For every deployment configuration manifest in use, pin to a specific version or commit Secure Hash Algorithm (SHA). 58 CIS Software Supply Chain Security Guide 5.2 Deployment Environment This section consists of security recommendations for the management of the deployment environment. The deployment environment is the orchestrator and the production environment where the application is deployed. It directly affects the customer experience and trust in a product, which has serious effects on the organization itself. Securing it varies from access management to automation.
