id: TMA-SSC-4.2.5
title: Ensure anonymous access to artifacts is revoked
description: Disable anonymous access to artifacts. Most artifact repositories support anonymous users, such as JFrog and Nexus. For unauthorized users, this defaults to a user with only read permissions, though more permissions may be added. Disable the option to view artifacts as “Anonymous User” in order to protect private artifacts from being exposed. This way, only trusted and authorized members will be able to access artifacts. Note Only logged and authorized users will be able to access artifacts.
target: supply-chain
level: 1
severity: high
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.2.5 Ensure anonymous access to artifacts is revoked
audit:
  type: manual
  command: For each artifact or package manager in use, verify that anonymous access is disabled.
remediation:
  type: iac_patch
  command: Disable the anonymous access option on every artifact or package manager in use. 4.3 Package Registries This section consists of security recommendations for management of package registries and artifacts that are stored in them. Package registries are where the organization artifacts are stored. To keep an artifact safe, you must keep the registry where it is stored safe too. Furthermore, you need to ensure that every artifact that reaches the registry is safe to use and does not put the registry in danger. 51 CIS Software Supply Chain Security Guide
