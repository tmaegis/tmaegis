  command: Ensure authentication is required to access the build environment.
remediation:
  type: iac_patch
  command: Require authentication to access the build environment and disable anonymous access. 2.2 Build Worker This section consists of security recommendations for build workers management and use. Build workers are often called “runners.” They are the infrastructure on which the pipeline runs. Build workers are considered sensitive because usually they have access to multiple, if not all, software supply chain components. One worker can run code checkout with source code management access, run tests, and push to the registry that requires access to it. Also, some of the pipeline commands running in a build worker can be vulnerable to attack and enlarge the attack surface. Because of all of that, it is especially important to ensure that the build workers are protected.
