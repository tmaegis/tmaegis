id: TMA-SSC-2.1.6
title: Ensure users must authenticate to access the build environment
description: Require users to log in to access the build environment — the orchestrator, the pipeline executer, where the build workers are running, etc. Requiring users to authenticate, and disabling anonymous access to the build environment, allows an organization to track every action on that environment, good or bad, to its actor. This will help in recognizing an attack and its attacker because authentication is required. Note Anonymous users will not be able to access the build environment.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
