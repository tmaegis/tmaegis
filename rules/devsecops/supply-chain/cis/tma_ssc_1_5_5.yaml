id: TMA-SSC-1.5.5
title: Ensure scanners are in place for open-source vulnerabilities in used packages
description: Detect, prevent and monitor known open-source vulnerabilities in packages that are being used. Open-source vulnerabilities might exist before one starts to use a package, but they are also discovered over time. New attacks and vulnerabilities are announced every now and then. It is important to keep track of these and to monitor whether the dependencies used are affected by the recent vulnerability. Detecting and fixing those packages’ vulnerabilities decreases the attack surface within deployed and running applications that use such packages. It prevents security flaws from reaching the production environment that could eventually lead to a security breach.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.5.5 Ensure scanners are in place for open-source vulnerabilities in used packages
audit:
  type: manual
  command: For every repository that is in use, verify that scanners are set to monitor, identify, and prevent open-source vulnerabilities in packages.
remediation:
  type: iac_patch
  command: For every repository that is in use, set scanners that will monitor, identify, and prevent open- source vulnerabilities in packages. 27 CIS Software Supply Chain Security Guide
