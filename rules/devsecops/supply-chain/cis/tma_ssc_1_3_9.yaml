id: TMA-SSC-1.3.9
title: Ensure an organization’s identity is confirmed with a “Verified” badge
description: Confirm the domains an organization owns with a “Verified” badge. Verifying the organization’s domains gives developers assurance that a given domain is truly the official home for a public organization. Attackers can pretend to be an organization and steal information via a faked/spoofed domain; therefore, the use of a “Verified” badge instills more confidence and trust between developers and the open-source community.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.9 Ensure an organization’s identity is confirmed with a “Verified” badge
audit:
  type: manual
  command: Ensure the organization has a “Verified” badge next to its name.
remediation:
  type: iac_patch
  command: Verify the organization’s domains and secure a “Verified” badge next to its name. 21 CIS Software Supply Chain Security Guide
