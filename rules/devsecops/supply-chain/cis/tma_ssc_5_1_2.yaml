id: TMA-SSC-5.1.2
title: Ensure changes in deployment configuration are tracked
description: Audit and track changes made in deployment configuration. Deployment configuration is sensitive in nature. The tiniest mistake can lead to downtime or bugs in production, which consequently may have a direct effect on both product integrity and customer trust. Misconfigurations might also be used by malicious actors to attack the production platform. Because of this, every change in the configuration needs a review and possible “revert” in case of a mistake or malicious change. Auditing every change and tracking them helps detect and fix such incidents more quickly.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.1.2 Ensure changes in deployment configuration are tracked
audit:
  type: manual
  command: For each deployment configuration, ensure changes made to it are audited and tracked.
remediation:
  type: iac_patch
  command: For each deployment configuration, track and audit changes made to it.
