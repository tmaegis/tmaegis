id: TMA-SSC-4.4.2
title: Ensure private artifacts are not allowed to be pulled from external registries
description: Proxy registries can proxy requests of internal packages to a public registry if grouped with an internal hosted registry. Block the option to request private packages from the proxy registry so that they will be pulled only from the hosted registry. When a proxy registry receives a request for private packages, it looks for them within public registries. This can lead to potential name shadowing, meaning that if a malicious package has the same name as the internal one, it will therefore be pulled, which can lead to a massive breach or malevolent code running in private, closed environments. To protect the internal environment from such incidents, it is recommended to block the option to pull private packages from the proxy and public registries. Note Public packages with similar names to private ones will not be able to be pulled.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.4.2 Ensure private artifacts are not allowed to be pulled from external registries
audit:
  type: manual
  command: For every proxy registry in use, ensure the pulling of internal packages is blocked.
remediation:
  type: iac_patch
  command: For each proxy registry in use, block the option to pull internal packages. 54 CIS Software Supply Chain Security Guide 5 Deployment This section consists of security recommendations for management of the release process, the application deployment, and the configuration and files that come with it. This is the final phase of the software supply chain. After that, the client already uses the application, and it is running in production. This phase contains the deployment orchestrator, the deployment configuration, the manifest files, and the deployment environment. It is important to secure all of these to deliver the software to the client safely. 5.1 Deployment Configuration This section consists of security recommendations for management of the deployment configuration. This consists of the files, instructions, and access management of the deployment configuration. Usually, the configuration files are stored in a version control system, so they need to be protected in it as
    well.
