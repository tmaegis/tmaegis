id: TMA-SSC-1.3.10
title: Ensure Source Code Management (SCM) email notifications are restricted to verified domains
description: Restrict the organization’s Source Code Management (SCM) email notifications to approved domains only. Restricting Source Code Management email notifications to verified domains only prevents data leaks, as personal emails and custom domains are more prone to account takeover via DNS hijacking or password breach. Note Only members with approved email would be able to receive Source Code Management notifications.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.3.10 Ensure Source Code Management (SCM) email notifications are restricted to verified domains
audit:
  type: manual
  command: Ensure Source Code Management email notifications are restricted to approved domains only.
remediation:
