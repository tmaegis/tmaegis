id: TMA-SSC-1.1.7
title: Ensure code owner’s review is required when a change affects owned code
description: Ensure trusted code owners are required to review and approve any code change proposal made to their respective owned areas in the code base. Configuring code owners ensures that no code, especially code that could prove malicious, will slip into the source code or configuration files of a repository. This allows an organization to mark areas in the code base that are especially sensitive or more prone to an attack. It can also enforce review by specific individuals who are designated as owners to those areas so that they may filter out unauthorized or unwanted changes beforehand. Note If an organization enforces code owner-based reviews, some code change proposals would not be able to be merged to the code base before specific, trusted individuals approve them.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.7 Ensure code owner’s review is required when a change affects owned code
audit:
  type: manual
  command: For each repository in use, verify that code owners are required to review all code change proposals relevant to areas they own.
remediation:
  type: iac_patch
  command: For each repository in use, configure code owner-required approvals for each change proposal related to code they own. 8 CIS Software Supply Chain Security Guide
