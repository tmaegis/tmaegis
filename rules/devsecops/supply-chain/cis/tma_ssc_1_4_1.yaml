id: TMA-SSC-1.4.1
title: Ensure administrator approval is required for every installed application
description: Ensure an administrator approval is required when installing applications. Applications are typically automated integrations that improve the workflow of an organization. They are written by third-party developers and therefore should be validated before using in case they are malicious or cannot be trusted. Because administrators are expected to be the most qualified and trusted members of the organization, they should review the applications being installed and decide whether they are both trusted and necessary. Note Applications will not be installed without administrator approval.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.4.1 Ensure administrator approval is required for every installed application
audit:
  type: manual
  command: Verify that applications are installed only after receiving administrator approval.
remediation:
  type: iac_patch
  command: Require administrator approval for every installed application.
