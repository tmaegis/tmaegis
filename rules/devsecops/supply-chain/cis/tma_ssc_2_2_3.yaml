id: TMA-SSC-2.2.3
title: Ensure the duties of each build worker are segregated
description: Separate responsibilities in the build workflow, such as testing, compiling, pushing artifacts, etc., to different build workers so that each worker will have a single duty. Separating duties and allocating them to many workers makes it easier to verify each step in the build process and ensure there is no corruption. It also limits the effect of an attack on a build worker, as such an attack would be less critical if the worker has less access and fewer duties that are subject to harm.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.2.3 Ensure the duties of each build worker are segregated
audit:
  type: manual
  command: For each build worker, ensure it has the least responsibility possible, preferably only one duty.
remediation:
  type: iac_patch
  command: For each build worker, limit its responsibility to one duty. 33 CIS Software Supply Chain Security Guide
