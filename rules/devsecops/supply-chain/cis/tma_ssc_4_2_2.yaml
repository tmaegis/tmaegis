id: TMA-SSC-4.2.2
title: Ensure number of permitted users who may upload new artifacts is minimized
description: Minimize the ability to upload artifacts to the lowest number of trusted users possible. Artifacts might contain sensitive data. Even the simplest mistake can also lead to trust issues with customers and harm the integrity of the product. To decrease these risks, allow only trusted and qualified users to upload new artifacts. Those users are less likely to make mistakes. Having the lowest number of such users possible will also decrease the risk of hacked user accounts, which could lead to a massive breach or artifact compromise
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.2.2 Ensure number of permitted users who may upload new artifacts is minimized
audit:
  type: manual
  command: Ensure only trusted and qualified users can upload new artifacts, and that their number is the lowest possible.
remediation:
  type: iac_patch
  command: Allow only trusted and qualified users to upload new artifacts, and limit them in number.
