id: TMA-SSC-3.2.4
title: Ensure packages are automatically scanned for ownership change
description: Scan every package automatically for ownership change. A change in package ownership is not a regular action. In some cases it can lead to a massive problem (for example, the “event-stream” incident). Open-source contributors are not always trusted, since by its very nature everyone can contribute. This means malicious actors can become contributors as well. Package maintainers might transfer their ownership to someone they do not know if maintaining the package is too much for them, in some cases without the other user’s knowledge. This has led to known security breaches in the past. It is best to be aware of such activity as soon as it happens and to carefully examine the situation before continuing using the package in order to determine its safety.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 3.2.4 Ensure packages are automatically scanned for ownership change
audit:
  type: manual
  command: Ensure automatic scanning of packages for ownership change is set.
remediation:
  type: iac_patch
  command: 'Set automatic scanning of packages for ownership change. 47 CIS Software Supply Chain Security Guide 4 Artifacts This section consists of security recommendations for the management of artifacts produced by build pipelines, as well as ones used by the application in the build process itself. Artifacts are packaged versions of software. They are stored in package registries (or artifact managers) and require securing from the moment they are created, through the time they are copied and updated, and up to deployment to their relevant environment. 4.1 Verification This section consists of security recommendations for managing verification of artifacts. When build artifacts are being pushed to the registry, a lot of different attacks can happen: a malicious artifact with the same name can be pushed, the artifact can be stolen over the network or if the registry is hacked, and others. It is important to secure artifacts by ensuring that various verification methods, listed in the
    recommendations in this section, are available.'
