id: TMA-SSC-5.2.3
title: Ensure access to production environment is limited
description: Restrict access to the production environment to a few trusted and qualified users only. The production environment is an extremely sensitive one. It directly affects the customer experience and trust in a product, which has serious effects on the organization itself. Because of this sensitive nature, it is important to restrict access to the production environment to only a few trusted and qualified users. This will reduce the risk of mistakes such as exposure of secrets or misconfiguration. This restriction also reduces the number of accounts that are vulnerable to hijacking in order to potentially harm the production environment. Note Reducing the number of users who have access to the production environment means those users would lose their ability to make direct changes to that environment.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.2.3 Ensure access to production environment is limited
audit:
  type: manual
  command: Verify that the production environment is accessible only to trusted and qualified users.
remediation:
  type: iac_patch
  command: Restrict access to the production environment to trusted and qualified users.
