id: TMA-SSC-2.1.4
title: Ensure the creation of the build environment is automated
description: Automate the creation of the build environment. Automating the deployment of the build environment reduces the risk for human mistakes — such as a wrong configuration or exposure of sensitive data — because it requires less human interaction and intervention. It also eases redeployment of the environment. It is best to automate with Infrastructure as Code because it offers more control over changes made to the environment creation configuration and stores to a version control platform.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.1.4 Ensure the creation of the build environment is automated
audit:
  type: manual
  command: Verify that the deployment of the build environment is automated and can be easily redeployed.
remediation:
  type: iac_patch
  command: Automate the deployment of the build environment.
