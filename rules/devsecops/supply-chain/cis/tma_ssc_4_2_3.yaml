id: TMA-SSC-4.2.3
title: Ensure user access to the package registry utilizes Multi-Factor Authentication (MFA)
description: Enforce Multi-Factor Authentication (MFA) for user access to the package registry. By default, every user authenticates to the system by password only. If a user’s password is compromised, the user account and all its related packages are in danger of data theft and malicious builds. It is therefore recommended that each user enables Multi-Factor Authentication. This additional step guarantees that the account stays secure even if the user’s password is compromised, as it adds another layer of authentication.
target: supply-chain
level: 1
severity: high
tags:
- access-control
- auth
- devsecops
- mfa
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.2.3 Ensure user access to the package registry utilizes Multi-Factor Authentication (MFA)
audit:
  type: manual
  command: For each package registry in use, verify that Multi-Factor Authentication is enforced and is the only way to authenticate.
remediation:
  type: iac_patch
  command: For each package registry in use, enforce Multi-Factor Authentication as the only way to authenticate. 50 CIS Software Supply Chain Security Guide
