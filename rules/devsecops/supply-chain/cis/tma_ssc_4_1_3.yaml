id: TMA-SSC-4.1.3
title: Ensure only authorized platforms have decryption capabilities of artifacts
description: Grant decryption capabilities of artifacts only to trusted and authorized platforms. Build artifacts might contain sensitive data such as production configuration. To protect them and decrease the risk of a breach, it is recommended to encrypt them before delivery. This will make them unreadable for every unauthorized user who does not have the decryption key. By implementing this, the decryption capabilities become overly sensitive in order to prevent a data leak or theft. Ensuring that only trusted and authorized platforms can decrypt the organization’s packages decreases the possibility for an attacker to gain access to the critical data in artifacts.
target: supply-chain
level: 1
severity: medium
tags:
- auth
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.1.3 Ensure only authorized platforms have decryption capabilities of artifacts
audit:
  type: manual
  command: Ensure only trusted and authorized platforms have decryption capabilities of the organization’s artifacts.
remediation:
  type: iac_patch
  command: 'Grant decryption capabilities of the organization’s artifacts only for trusted and authorized platforms. 4.2 Access to Artifacts This section consists of security recommendations for access management of artifacts. Artifacts are often stored in registries, some external and some internal. Those registries have user entities that control access and permissions. Artifacts are considered sensitive, because they are being delivered to the customer, and are prone to many attacks: data theft, dependency confusion, malicious packages, and more. That is why their access management should be restrictive and careful.'
