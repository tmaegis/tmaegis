id: TMA-SSC-2.4.2
title: Ensure all external dependencies used in the build process are locked
description: External dependencies may be public packages needed in the pipeline, or perhaps the public image being used for the build worker. Lock these external dependencies in every build pipeline. External dependencies are sources of code that are not under organizational control. They might be intentionally or unintentionally infected with malicious code or have known vulnerabilities, which could result in sensitive data exposure, data harvesting, or the erosion of trust in an organization. Locking each external dependency to a specific, safe version gives more control and less chance for risk.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.4.2 Ensure all external dependencies used in the build process are locked
audit:
  type: manual
  command: Ensure every external dependency being used in pipelines is locked.
remediation:
  type: iac_patch
  command: For all external dependencies being used in pipelines, verify they are locked.
