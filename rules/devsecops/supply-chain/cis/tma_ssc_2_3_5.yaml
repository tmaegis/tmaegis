id: TMA-SSC-2.3.5
title: Ensure access to build process triggering is minimized
description: Restrict access to pipeline triggers. Build pipelines are used for multiple reasons. Some are very sensitive, such as pipelines that deploy to production. In order to protect the environment from malicious acts or human mistakes, such as a developer deploying a bug to production, it is important to apply the “principle of least privilege” to pipeline triggering. This principle requires restrictions placed on which users can run which pipeline. It allows for sensitive pipelines to only be run by administrators, who are generally the most trusted and skilled members of the organization.
target: supply-chain
level: 1
severity: medium
tags:
- access-control
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.3.5 Ensure access to build process triggering is minimized
audit:
  type: manual
  command: For every pipeline in use, verify only the necessary users have permission to trigger it.
remediation:
  type: iac_patch
  command: For every pipeline in use, grant only the necessary users permission to trigger it.
