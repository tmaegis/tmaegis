id: TMA-SSC-1.1.9
title: Ensure all checks have passed before merging new code
description: Before a code change request can be merged to the code base, all predefined checks must successfully pass. On top of manual reviews of code changes, a code protect should contain a set of prescriptive checks that validate each change. Organizations should enforce those status checks so that changes can only be introduced if all checks have successfully passed. This set of checks should serve as the absolute quality, stability, and security conditions that must be met in order to merge new code to a project. Note Code changes in which all checks do not pass successfully would not be able to be pushed into the code base of the specific code repository.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.9 Ensure all checks have passed before merging new code
audit:
  type: manual
  command: Ensure that for each code repository in use, status checks are required to pass before allowing any code change proposal merge.
remediation:
  type: iac_patch
  command: Configure each code repository to require all status checks to pass before permitting a merge of new code. 9 CIS Software Supply Chain Security Guide
