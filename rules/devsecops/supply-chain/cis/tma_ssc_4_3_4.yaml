id: TMA-SSC-4.3.4
title: Ensure webhooks of the package registry are secured
description: Use secured webhooks of the package registry. Webhooks are used for triggering an HTTP request based on an action made in the platform. Typically, package registries feature webhooks when a package receives an update. Since webhooks are an HTTP POST request, they can be malformed if not secured over SSL. To prevent a potential hack and compromise of the webhook or to the registry or web server accepting the request, use only secured webhooks.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 4.3.4 Ensure webhooks of the package registry are secured
audit:
  type: manual
  command: For each webhook in use, ensure it is secured (HTTPS).
remediation:
  type: iac_patch
  command: For each webhook in use, change it to secured (over HTTPS). 4.4 Origin Traceability This section consists of security recommendations for managing the traceability of artifacts. This means ensuring that both the organization and customers know where this artifact came from, such as with an SBOM, and also verifying that it came from the registry it was supposed to come from.
