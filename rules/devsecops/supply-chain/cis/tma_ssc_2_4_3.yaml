id: TMA-SSC-2.4.3
title: Ensure dependencies are validated before being used
description: Validate every dependency of the pipeline before use. To ensure that a dependency used in a pipeline is trusted and has not been infected by a malicious actor (e.g., the Codecov incident), validate dependencies before using them. This can be accomplished by comparing the checksum of the dependency to its checksum in a trusted source. If a difference arises, this is a sign that an unknown actor has interfered and may have added malevolent code. If this dependency is used, it will infect the environment, which could end in a massive breach and leave the organization exposed to data leaks, etc.
target: supply-chain
level: 1
severity: medium
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.4.3 Ensure dependencies are validated before being used
audit:
  type: manual
  command: For every dependency used in every pipeline, ensure it has been validated.
remediation:
  type: iac_patch
  command: For every dependency used in every pipeline, validate each one.
