id: TMA-SSC-2.4.6
title: Ensure pipeline steps sign the SBOM produced
description: An SBOM is a file that specifies each component of software or a build process. It should be generated after every pipeline run. After it is generated, it must then be signed. An SBOM is a file used to validate the integrity and security of a build pipeline. Signing it ensures that no one tampered with the file when it was delivered. Such interference can happen if someone tries to hide unusual activity. Validating the SBOM signature can detect this activity and prevent much greater incident.
target: supply-chain
level: 1
severity: medium
tags:
- ci-cd
- devsecops
- sbom
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 2.4.6 Ensure pipeline steps sign the SBOM produced
audit:
  type: manual
  command: For each pipeline, ensure it signs the SBOM it produces on every run.
remediation:
  type: iac_patch
  command: For each pipeline, configure it to sign its produced SBOM on every run. 41 CIS Software Supply Chain Security Guide 3 Dependencies This section consists of security recommendations for the management of various dependencies introduced as part of the software build and release process. These are comprised of anything that goes into application code or is used by build pipelines themselves. Dependencies are a huge part of the software supply chain, as they are integrated in a lot of important phases. They are often written by third-party developers and might be vulnerable to certain attacks, such as the “log4j” attack. Because of that it is particularly important to secure them and their use in the supply chain. 3.1 Third-Party Packages This section consists of security recommendations for the use and management of third-party dependencies and packages. As a consumer of various third-party packages, you need to ensure certain conditions exist to trust them and use them safely. Using
    third-party packages affects not only the software, but also its customers, so it is important to carefully examine each one of these packages.
