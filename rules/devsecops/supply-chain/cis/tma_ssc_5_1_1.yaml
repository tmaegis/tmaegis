id: TMA-SSC-5.1.1
title: Ensure deployment configuration files are separated from source code
description: Deployment configurations are often stored in a version control system. Separate deployment configuration files from source code repositories. Deployment configuration manifests are often stored in version control systems. Storing them in dedicated repositories, separately from source code repositories, has several benefits. First, it adds order to both maintenance and version control history. This makes it easier to track code or manifest changes, as well as spot any malicious code or misconfigurations. Second, it helps achieve the “principle of least privilege.” Because access can be configured differently for each repository, fewer users will have access to this configuration, which is typically sensitive.
target: supply-chain
level: 1
severity: high
tags:
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 5.1.1 Ensure deployment configuration files are separated from source code
