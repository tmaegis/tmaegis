id: TMA-SSC-1.1.17
title: Ensure branch deletions are denied
description: Ensure that users with only push access are incapable of deleting a protected branch. When enabling deletion of a protected branch, any user with at least push access to the repository can delete a branch. This can be potentially dangerous, as a simple human mistake or a hacked account can lead to data loss if a branch is deleted. It is therefore crucial to prevent such incidents by denying protected branch deletion. Note Protected branches cannot be deleted.
target: supply-chain
level: 1
severity: medium
tags:
- branch-protection
- devsecops
- supply-chain
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - 1.1.17 Ensure branch deletions are denied
audit:
  type: manual
  command: For each repository that is being used, verify that protected branches cannot be deleted.
remediation:
  type: iac_patch
  command: For each repository that is being used, block the option to delete protected branches via branch protection rules.
