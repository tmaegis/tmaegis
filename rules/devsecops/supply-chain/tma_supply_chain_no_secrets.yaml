id: TMA-SUPPLY-CHAIN-NO-COMMITTED-SECRETS
title: Ensure no credentials or private keys are committed to the repository
description: Credentials in source control are exposed to everyone with read access and to every clone and fork, and stay in history. The audit runs git grep over tracked text files for AWS access key IDs, PEM/OpenSSH/PGP private keys, GitHub tokens and Slack tokens and lists matching files (never the secret itself). It covers the current tree only; scan history with a dedicated tool (gitleaks, trufflehog). Run tmaegis from inside the repository; the audit fails when git is missing or the working directory is not a git repository.
target: supply-chain
level: 1
severity: critical
tags:
- supply-chain
- source-code
- secrets
reference: CIS Software Supply Chain Security Guide Benchmark v1.0.0 - Source Code - prevent sensitive data in code repositories (verify section number for your release)
audit:
  type: command
  command: "top=$(git rev-parse --show-toplevel 2>/dev/null) || exit 1\ncd \"$top\" || exit 1\nhits=$(git grep -I -l -E 'AKIA[0-9A-Z]{16}|-----BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED|PGP) )?PRIVATE KEY( BLOCK)?-----|gh[pousr]_[A-Za-z0-9]{36}|xox[abprs]-[A-Za-z0-9-]{10,}' 2>/dev/null)\nrc=$?\ncase $rc in\n  0) echo \"possible secrets committed in:\"; printf '%s\\n' \"$hits\" ;;\n  1) echo compliant ;;\n  *) exit 1 ;;\nesac"
  expected_output: compliant
remediation:
  type: iac_patch
  command: Revoke and rotate every exposed credential first, then remove the file (git rm --cached), move secrets to a secret manager / CI secrets, purge history with git filter-repo if required, and enable push protection / pre-commit secret scanning (gitleaks, GitHub secret scanning).
