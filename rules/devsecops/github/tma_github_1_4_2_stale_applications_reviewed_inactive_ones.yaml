id: TMA-GITHUB-1.4.2
title: Ensure stale applications are reviewed and inactive ones are removed
description: 'Ensure stale (inactive) applications are reviewed and removed if no longer in use. Applications that have been inactive for a long period of time are enlarging the surface of attack for data leaks. They are more likely to be improperly managed, and could possibly be accessed by third-party developers ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: low
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.4.2 Ensure stale applications are reviewed and inactive ones are removed
audit:
  type: manual
  command: 'Verify that all the applications in the organization are actively used, and remove those that are no longer in use. Expected state: Review all stale applications and periodically remove them.'
remediation:
  type: iac_patch
  command: Review all stale applications and periodically remove them.
