id: TMA-GITHUB-3.1.2
title: Ensure Software Bill of Materials (SBOM) is required from all third-party suppliers
description: 'A Software Bill Of Materials (SBOM) is a file that specifies each component of software or a build process. Require an SBOM from every third-party provider. A Software Bill of Materials (SBOM) for every third-party artifact helps to ensure an artifact is safe to use and fully compliant. This file lists all important metadata, especially all the dependencies of an artifact ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.2 Ensure Software Bill of Materials (SBOM) is required from all third-party suppliers
audit:
  type: manual
  command: 'For every third-party dependency in use, ensure it has a Software Bill of Materials. Expected state: For every third-party dependency in use, require a Software Bill of Materials from its supplier.'
remediation:
  type: iac_patch
  command: For every third-party dependency in use, require a Software Bill of Materials from its supplier.
