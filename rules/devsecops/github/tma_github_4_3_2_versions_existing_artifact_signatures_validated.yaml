id: TMA-GITHUB-4.3.2
title: Ensure all versions of an existing artifact have their signatures validated
description: 'Validate the signature of all versions of an existing artifact. In order to be certain a version of an existing and trusted artifact is not malicious or delivered by someone looking to interfere with the supply chain, it is a good practice to validate the signatures of each version. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.3.2 Ensure all versions of an existing artifact have their signatures validated
audit:
  type: manual
  command: For each artifact, ensure that all of its versions are signed and validated before it is uploaded or used. Ensure every artifact in the package registry has been validated with its signature. On GitHub, navigate to a pull request On the pull request, click <> Commits and view the detailed information regarding the signature.
remediation:
  type: iac_patch
  command: For each artifact, sign and validate each version before uploading or using the artifact.
