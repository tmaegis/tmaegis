id: TMA-GITHUB-4.2.5
title: Ensure anonymous access to artifacts is revoked
description: 'For GitHub Private or Internal repositories anonymous access is not available. Verify that all repos that require access controls are Private or Internal. Disable the option to view artifacts as an anonymous user in order to protect private artifacts from being exposed. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.2.5 Ensure anonymous access to artifacts is revoked
audit:
  type: manual
  command: 'To Audit the existing settings: 1. On your GitHub Enterprise Server instance, navigate to the main page of the repository. 2. Under your repository name, click Settings 3. Under "Danger Zone", to the right of to "Change repository visibility", click Change visibility. Review the current selection.'
remediation:
  type: iac_patch
  command: Changing a repository's visibility 1. On your GitHub Enterprise Server instance, navigate to the main page of the repository. 2. Under your repository name, click Settings 3. Under "Danger Zone", to the right of to "Change repository visibility", click Change visibility. 4. Select a visibility. 5. Choose Mark private Make Internal 6. To verify that you're changing the correct repository's visibility, type the name of the repository you want to change the visibility of.
