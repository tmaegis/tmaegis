id: TMA-GITHUB-2.1.2
title: Ensure all aspects of the pipeline infrastructure and configuration are immutable
description: 'Ensure the pipeline orchestrator and its configuration are immutable. An immutable infrastructure is one that cannot be changed during execution of the pipeline. This can be done, for example, by using Infrastructure as Code for configuring the pipeline and the pipeline environment. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.2 Ensure all aspects of the pipeline infrastructure and configuration are immutable
audit:
  type: manual
  command: 'Verify that the pipeline orchestrator, its configuration, and all other aspects of the build environment are immutable. Expected state: Use an immutable pipeline orchestrator and ensure that its configuration and all other aspects of the built environment are immutable, as well.'
remediation:
  type: iac_patch
  command: Use an immutable pipeline orchestrator and ensure that its configuration and all other aspects of the built environment are immutable, as well.
