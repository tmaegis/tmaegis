id: TMA-GITHUB-2.3.6
title: Ensure pipelines are automatically scanned for misconfigurations
description: 'Scan the pipeline for misconfigurations. It is recommended that this be performed automatically. Automatic scans for misconfigurations detect human mistakes and misconfigured tasks. This protects the environment from backdoors caused by such mistakes, which create easier access for attackers. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.3.6 Ensure pipelines are automatically scanned for misconfigurations
audit:
  type: manual
  command: 'For each pipeline, verify that it is automatically scanned for misconfigurations. Expected state: For each pipeline, set automated misconfiguration scanning.'
remediation:
  type: iac_patch
  command: For each pipeline, set automated misconfiguration scanning.
