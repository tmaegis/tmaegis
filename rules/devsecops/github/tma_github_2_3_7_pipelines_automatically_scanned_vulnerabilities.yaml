id: TMA-GITHUB-2.3.7
title: Ensure pipelines are automatically scanned for vulnerabilities
description: 'Scan pipelines for vulnerabilities. It is recommended that this be implemented automatically. Automatic scanning for vulnerabilities detects known vulnerabilities in pipeline instructions and components, allowing faster patching in case one is found. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.3.7 Ensure pipelines are automatically scanned for vulnerabilities
audit:
  type: manual
  command: 'For each pipeline, verify that it is automatically scanned for vulnerabilities. Expected state: For each pipeline, set automated vulnerability scanning.'
remediation:
  type: iac_patch
  command: For each pipeline, set automated vulnerability scanning.
