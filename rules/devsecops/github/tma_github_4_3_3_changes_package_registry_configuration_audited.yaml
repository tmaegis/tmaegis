id: TMA-GITHUB-4.3.3
title: Ensure changes in package registry configuration are audited
description: 'Audit changes of the package registry configuration. The package registry is a crucial component in the software supply chain. It stores artifacts with potentially sensitive data that will eventually be deployed and used in production. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.3.3 Ensure changes in package registry configuration are audited
audit:
  type: manual
  command: 'Verify that all changes to the packages registry configuration are audited. Search the audit log with repo category actions Expected state: Audit the changes to the package registry configuration.'
remediation:
  type: iac_patch
  command: Audit the changes to the package registry configuration.
