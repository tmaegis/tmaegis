id: TMA-GITHUB-2.1.3
title: Ensure the build environment is logged
description: 'Keep build logs of the build environment detailing configuration and all activity within it. Also, consider to store them in a centralized organizational log store. Logging the environment is important for two primary reasons: one, for debugging and investigating the environment in case of a bug or security incident; and two, for reproducing the environment easily when needed. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.3 Ensure the build environment is logged
audit:
  type: manual
  command: 'Verify that the build environment is logged and stored in a centralized organizational log store. Expected state: Keep logs of the build environment. For example, use the .buildinfo file for Debian build workers. Also, store the logs in a centralized organizational log store.'
remediation:
  type: iac_patch
  command: Keep logs of the build environment. For example, use the .buildinfo file for Debian build workers. Also, store the logs in a centralized organizational log store.
