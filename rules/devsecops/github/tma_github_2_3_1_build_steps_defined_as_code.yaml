id: TMA-GITHUB-2.3.1
title: Ensure all build steps are defined as code
description: 'Use pipeline as code for build pipelines and their defined steps. Storing pipeline instructions as code in a version control system means automation of the build steps and less room for human error, which could potentially lead to a security breach. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.3.1 Ensure all build steps are defined as code
audit:
  type: manual
  command: 'Verify that all build steps are defined as code and stored in a version control system. Expected state: Convert pipeline instructions into code-based syntax and upload them to the organization''s version control platform.'
remediation:
  type: iac_patch
  command: Convert pipeline instructions into code-based syntax and upload them to the organization's version control platform.
