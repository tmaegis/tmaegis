id: TMA-GITHUB-5.2.3
title: Ensure access to production environment is limited
description: 'Restrict access to the production environment to a few trusted and qualified users only. The production environment is an extremely sensitive one. It directly affects the customer experience and trust in a product, which has serious effects on the organization itself. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.2.3 Ensure access to production environment is limited
audit:
  type: manual
  command: 'Verify that the production environment is accessible only to trusted and qualified users. Expected state: Restrict access to the production environment to trusted and qualified users.'
remediation:
  type: iac_patch
  command: Restrict access to the production environment to trusted and qualified users.
