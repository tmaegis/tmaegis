id: TMA-GITHUB-5.1.2
title: Ensure changes in deployment configuration are audited
description: 'Audit and track changes made in deployment configuration. Deployment configuration is sensitive in nature. The tiniest mistake can lead to downtime or bugs in production, which consequently may have a direct effect on both product integrity and customer trust. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.1.2 Ensure changes in deployment configuration are audited
audit:
  type: manual
  command: 'For each deployment configuration, ensure changes made to it are audited and tracked. Expected state: For each deployment configuration, track and audit changes made to it.'
remediation:
  type: iac_patch
  command: For each deployment configuration, track and audit changes made to it.
