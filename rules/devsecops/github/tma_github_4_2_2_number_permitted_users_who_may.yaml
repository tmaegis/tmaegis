id: TMA-GITHUB-4.2.2
title: Ensure number of permitted users who may upload new artifacts is minimized
description: 'Minimize ability to upload artifacts to the lowest number of trusted users possible. Artifacts might contain sensitive data. Even the simplest mistake can also lead to trust issues with customers and harm the integrity of the product. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.2.2 Ensure number of permitted users who may upload new artifacts is minimized
audit:
  type: manual
  command: 'Ensure only trusted and qualified users can upload new artifacts, and that their number is the lowest possible. Expected state: Allow only trusted and qualified users to upload new artifacts and limit them in number.'
remediation:
  type: iac_patch
  command: Allow only trusted and qualified users to upload new artifacts and limit them in number.
