id: TMA-GITHUB-1.1.18
title: Ensure any merging of code is automatically scanned for risks
description: 'Ensure that every pull request is required to be scanned for risks. Scanning pull requests to detect risks allows for early detection of vulnerable code and/or dependencies and helps mitigate potentially malicious code. Code scanning must be active: CodeQL default setup configured or at least one code scanning analysis uploaded. Uses the GitHub REST/GraphQL API through gh api (read-only). The repository comes from GH_REPO or the current git checkout (gh''s {owner}/{repo} resolution, GH_HOST for GitHub Enterprise Server); the organization comes from GH_ORG (default: the repository owner). Fails when gh is missing or unauthenticated (gh auth login or GH_TOKEN); organization settings and branch protection need an owner/admin token.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.1.18 Ensure any merging of code is automatically scanned for risks
audit:
  type: command
  command: |-
    command -v gh >/dev/null 2>&1 || exit 1
    gh auth status >/dev/null 2>&1 || exit 1
    info=$(gh api 'repos/{owner}/{repo}' --jq '.full_name + " " + .default_branch' 2>/dev/null) || exit 1
    R=${info% *}; B=${info#* }
    [ -n "$R" ] && [ -n "$B" ] || exit 1
    d=$(gh api "repos/$R/code-scanning/default-setup" --jq .state 2>/dev/null) || d=none
    n=$(gh api "repos/$R/code-scanning/analyses?per_page=1" --jq length 2>/dev/null) || n=0
    { [ "$d" = configured ] || [ "${n:-0}" -gt 0 ]; } && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: Enable code scanning (Settings > Code security > Code scanning > CodeQL default setup) or add a workflow that runs on push and pull_request to the default branch and uploads SARIF results.
