id: TMA-GITHUB-4.1.3
title: Ensure only authorized platforms have decryption capabilities of artifacts
description: 'Grant decryption capabilities of artifacts only to trusted and authorized platforms. Build artifacts might contain sensitive data such as production configuration. To protect them and decrease the risk of a breach, it is recommended to encrypt them before delivery. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.1.3 Ensure only authorized platforms have decryption capabilities of artifacts
audit:
  type: manual
  command: 'Ensure only trusted and authorized platforms have decryption capabilities of the organization''s artifacts. Expected state: Grant decryption capabilities of the organization''s artifacts only for trusted and authorized platforms.'
remediation:
  type: iac_patch
  command: Grant decryption capabilities of the organization's artifacts only for trusted and authorized platforms.
