id: TMA-GITHUB-1.5.2
title: Ensure scanners are in place to secure Continuous Integration (CI) pipeline instructions
description: 'Detect and prevent misconfigurations and insecure instructions in CI pipelines Detecting and fixing misconfigurations or insecure instructions in CI pipelines decreases the risk for a successful attack through or on the CI pipeline. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.5.2 Ensure scanners are in place to secure Continuous Integration (CI) pipeline instructions
audit:
  type: manual
  command: 'Verify that a CI instructions scanning tool is set to identify and prevent misconfigurations and insecure instructions and that it scans all CI pipelines. Expected state: Set a CI instructions scanning tool to identify and prevent misconfigurations and insecure instructions and scans all CI pipelines.'
remediation:
  type: iac_patch
  command: Set a CI instructions scanning tool to identify and prevent misconfigurations and insecure instructions and scans all CI pipelines.
