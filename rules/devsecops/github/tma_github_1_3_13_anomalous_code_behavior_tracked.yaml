id: TMA-GITHUB-1.3.13
title: Ensure anomalous code behavior is tracked
description: 'Track code anomalies. Carefully analyze any code anomalies within the organization. For example, a code anomaly could be a push made outside of working hours. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: low
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.3.13 Ensure anomalous code behavior is tracked
audit:
  type: manual
  command: 'For every repository in use, ensure code anomalies relevant to the organization are promptly investigated. Expected state: For every repository in use, track and investigate anomalous code behavior and activity.'
remediation:
  type: iac_patch
  command: For every repository in use, track and investigate anomalous code behavior and activity.
