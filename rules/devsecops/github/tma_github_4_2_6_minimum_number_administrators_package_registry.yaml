id: TMA-GITHUB-4.2.6
title: Ensure minimum number of administrators are set for the package registry
description: 'Ensure the package registry has a minimum number of administrators. Package registry admins have the ability to add/remove users, repositories, packages. Due to the permissive access granted to an admin, it is highly recommended to keep the number of administrator accounts as minimal as ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.2.6 Ensure minimum number of administrators are set for the package registry
audit:
  type: manual
  command: Verify that your package registry has only the minimum number of administrators. For each repository that you administer on GitHub, you can see an overview of every team or person with access to the repository. From the overview, you can also invite new teams or people, change each team or person's role for the repository, or remove access to the repository.
remediation:
  type: iac_patch
  command: 'Set the minimum number of administrators in your package registry. To accomplish this: For each repository that you administer on GitHub, you can see an overview of every team or person with access to the repository. From the overview, choose Manage access and provide access to the appropriate people or teams.'
