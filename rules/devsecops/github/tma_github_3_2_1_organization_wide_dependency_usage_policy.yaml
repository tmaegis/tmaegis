id: TMA-GITHUB-3.2.1
title: Ensure an organization-wide dependency usage policy is enforced
description: 'Enforce a policy for dependency usage across the organization. For example, disallow the use of packages less than 60 days old. Enforcing a policy for dependency usage in an organization helps to manage dependencies across the organization and ensure that all usage is compliant with security policy. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.2.1 Ensure an organization-wide dependency usage policy is enforced
audit:
  type: manual
  command: 'Verify that a policy for dependency usage is enforced across the organization. Expected state: Enforce policies for dependency usage across the organization.'
remediation:
  type: iac_patch
  command: Enforce policies for dependency usage across the organization.
