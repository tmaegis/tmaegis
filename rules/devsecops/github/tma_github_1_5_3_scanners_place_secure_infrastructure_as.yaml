id: TMA-GITHUB-1.5.3
title: Ensure scanners are in place to secure Infrastructure as Code (IaC) instructions
description: 'Detect and prevent misconfigurations or insecure instructions in Infrastructure as Code (IaC) files, such as Terraform files. Detecting and fixing misconfigurations and/or insecure instructions in IaC (Infrastructure as Code) files decreases the risk for data leak or data theft. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.5.3 Ensure scanners are in place to secure Infrastructure as Code (IaC) instructions
audit:
  type: manual
  command: 'For every repository that holds IaC instructions files, verify that a scanning tool is set to identify and prevent misconfigurations and insecure instructions. Expected state: For every repository that holds IaC instructions files, set a scanning tool to identify and prevent misconfigurations and insecure instructions.'
remediation:
  type: iac_patch
  command: For every repository that holds IaC instructions files, set a scanning tool to identify and prevent misconfigurations and insecure instructions.
