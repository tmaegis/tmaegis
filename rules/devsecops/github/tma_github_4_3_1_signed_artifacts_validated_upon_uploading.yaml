id: TMA-GITHUB-4.3.1
title: Ensure all signed artifacts are validated upon uploading the package registry
description: 'Validate artifact signatures before uploading to the package registry. Cryptographic signature is a tool to verify artifact authenticity. Every artifact is supposed to be signed by its creator in order to confirm that it was not compromised before reaching the client. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.3.1 Ensure all signed artifacts are validated upon uploading the package registry
audit:
  type: manual
  command: Ensure every artifact in the package registry has been validated with its signature. 1. On GitHub, navigate to a pull request 2. On the pull request, click <> Commits and view the detailed information regarding the signature.
remediation:
  type: iac_patch
  command: Validate every artifact with its signature before uploading it to the package registry. It is recommended to do so automatically.
