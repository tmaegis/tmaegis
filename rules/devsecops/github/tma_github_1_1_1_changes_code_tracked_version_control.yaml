id: TMA-GITHUB-1.1.1
title: Ensure any changes to code are tracked in a version control platform
description: 'Manage all code projects in a version control platform. Version control platforms keep track of every modification to code. They represent the cornerstone of code security, as well as allowing for better code collaboration within engineering teams. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: low
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.1.1 Ensure any changes to code are tracked in a version control platform
audit:
  type: manual
  command: 'Ensure that all code activity is managed through Github repository for every micro-service or application developed by an organization. Expected state: Upload existing code projects to a dedicated Github organization and repositories and create an identity for each active team member who might contribute or need access to it.'
remediation:
  type: iac_patch
  command: Upload existing code projects to a dedicated Github organization and repositories and create an identity for each active team member who might contribute or need access to it.
