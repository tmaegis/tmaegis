id: TMA-GITHUB-2.2.8
title: Ensure resource consumption of build workers is monitored
description: 'Monitor the resource consumption of build workers and set alerts for high consumption that can lead to resource exhaustion. Resource exhaustion is when machine resources or services are highly consumed until exhausted. Resource exhaustion may lead to DOS (Denial of Service). Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.8 Ensure resource consumption of build workers is monitored
audit:
  type: manual
  command: 'Verify that there is monitoring of resources consumption for each build worker. Expected state: Set reources consumption monitoring for each build worker.'
remediation:
  type: iac_patch
  command: Set reources consumption monitoring for each build worker.
