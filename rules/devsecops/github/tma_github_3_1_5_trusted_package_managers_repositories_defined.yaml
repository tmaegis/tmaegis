id: TMA-GITHUB-3.1.5
title: Ensure trusted package managers and repositories are defined and prioritized
description: 'Prioritize trusted package registries over others when pulling a package. When pulling a package by name, the package manager might look for it in several package registries, some of which may be untrusted or badly configured. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.5 Ensure trusted package managers and repositories are defined and prioritized
audit:
  type: manual
  command: 'For each package registry in use, ensure it is trusted. Expected state: For each package to be downloaded, configure it to be downloaded from a trusted source.'
remediation:
  type: iac_patch
  command: For each package to be downloaded, configure it to be downloaded from a trusted source.
