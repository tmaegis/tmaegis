id: TMA-GITHUB-3.1.4
title: Ensure dependencies are monitored between open-source components
description: 'Monitor, or ask software suppliers to monitor, dependencies between open-source components in use. Monitoring dependencies between open-source components helps to detect if software has fallen victim to attack on a common open-source component. Swift detection can aid in quick application of a fix. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.4 Ensure dependencies are monitored between open-source components
audit:
  type: manual
  command: 'For each open-source component, ensure its dependencies are monitored. Expected state: For each open-source component, monitor its dependencies.'
remediation:
  type: iac_patch
  command: For each open-source component, monitor its dependencies.
