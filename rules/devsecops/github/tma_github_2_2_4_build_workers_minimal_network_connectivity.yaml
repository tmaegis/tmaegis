id: TMA-GITHUB-2.2.4
title: Ensure build workers have minimal network connectivity
description: 'Ensure that build workers have minimal network connectivity. Restricting the network connectivity of build workers decreases the possibility that an attacker would be capable of entering the organization from the outside. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.4 Ensure build workers have minimal network connectivity
audit:
  type: manual
  command: 'Verify that build workers, environment, and any other components have only the required minimum of network connectivity. Expected state: Limit the network connectivity of build workers, environment, and any other components to the necessary minimum.'
remediation:
  type: iac_patch
  command: Limit the network connectivity of build workers, environment, and any other components to the necessary minimum.
