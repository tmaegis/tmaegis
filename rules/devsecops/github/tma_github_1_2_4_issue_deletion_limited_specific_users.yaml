id: TMA-GITHUB-1.2.4
title: Ensure issue deletion is limited to specific users
description: 'Ensure only trusted and responsible users can delete issues. Issues are a way to keep track of things happening in repositories, such as setting new milestones or requesting urgent fixes. Deleting an issue is not a benign activity, as it might harm the development workflow or ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.2.4 Ensure issue deletion is limited to specific users
audit:
  type: manual
  command: 'Verify that only a limited number of trusted users can delete issues by performing either of the following steps: If Your organizations > Settings > Access > Member privileges > Allow members to delete issues for this organization is selected, verify that every admin member is trusted by you: 1. In every repository, on GitHub.com, navigate to the main page of the repository. 2. Under your repository name, click Settings and then in the "Access" section of the sidebar, click Collaborators & teams. 3.'
remediation:
  type: iac_patch
  command: 'Restrict issue deletion to a few trusted and responsible users only by performing either of the following steps: If Your organizations > Settings > Access > Member privileges > Allow members to delete issues for this organization is selected, allow only trusted members to have admin privileges: 1. In every repository, on GitHub.com, navigate to the main page of the repository. 2. Under your repository name, click Settings and then in the "Access" section of the sidebar, click Collaborators & teams. 3. Under "Manage access" use the dropdown Role menu to filter and search for admin members.'
