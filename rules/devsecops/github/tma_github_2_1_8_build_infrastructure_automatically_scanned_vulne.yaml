id: TMA-GITHUB-2.1.8
title: Ensure the build infrastructure is automatically scanned for vulnerabilities
description: 'Scan the build infrastructure and its dependencies for vulnerabilities. It is recommended that this be done automatically. Automatic scanning for vulnerabilities detects known vulnerabilities in the tooling used by the build infrastructure and its dependencies. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.8 Ensure the build infrastructure is automatically scanned for vulnerabilities
audit:
  type: manual
  command: 'Verify that your build infrastructure is automatically scanned for vulnerabilities. Expected state: Set an automated vulnerability scanning for your build infrastructure.'
remediation:
  type: iac_patch
  command: Set an automated vulnerability scanning for your build infrastructure.
