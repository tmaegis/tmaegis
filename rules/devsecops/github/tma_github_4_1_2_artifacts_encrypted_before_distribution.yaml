id: TMA-GITHUB-4.1.2
title: Ensure artifacts are encrypted before distribution
description: 'Encrypt artifacts before they are distributed and ensure only trusted platforms have decryption capabilities. Build artifacts might contain sensitive data such as production configurations. In order to protect them and decrease the risk for breach, it is recommended to encrypt them before delivery. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: high
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.1.2 Ensure artifacts are encrypted before distribution
audit:
  type: manual
  command: 'Ensure every artifact is encrypted before it is delivered. Expected state: Encrypt every artifact before distribution.'
remediation:
  type: iac_patch
  command: Encrypt every artifact before distribution.
