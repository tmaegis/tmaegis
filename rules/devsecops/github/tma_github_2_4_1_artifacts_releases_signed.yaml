id: TMA-GITHUB-2.4.1
title: Ensure all artifacts on all releases are signed
description: 'Sign all artifacts in all releases with user or organization keys. Signing artifacts is used to validate both their integrity and security. Organizations signal that artifacts may be trusted and they themselves produced them by ensuring that every artifact is properly signed. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.4.1 Ensure all artifacts on all releases are signed
audit:
  type: manual
  command: 'Ensure every artifact in every release is signed. Expected state: For every artifact in every release, verify that all are properly signed.'
remediation:
  type: iac_patch
  command: For every artifact in every release, verify that all are properly signed.
