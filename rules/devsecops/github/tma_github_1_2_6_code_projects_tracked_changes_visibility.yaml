id: TMA-GITHUB-1.2.6
title: Ensure all code projects are tracked for changes in visibility status
description: 'Ensure every change in visibility of projects is tracked. Visibility of projects determines who can access a project and/or fork it: anyone, designated users, or only members of the organization. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: low
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.2.6 Ensure all code projects are tracked for changes in visibility status
audit:
  type: manual
  command: 'Ensure that every change in project visibility is tracked and investigated, by performing the following regularly: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Archives" section of the sidebar, click Logs, then click Audit log. 4. Use the repo qualifier in your query and look for access category. Ensure every change is reasonable and secure and is investigated if it is not.'
remediation:
  type: iac_patch
  command: 'Track every change in project visibility and investigate if suspicious behavior occurs, by performing the following regularly: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Archives" section of the sidebar, click Logs, then click Audit log. 4. Use the repo qualifier in your query and look for access category. Ensure every change is reasonable and secure and investigate if it is not.'
