id: TMA-GITHUB-5.1.1
title: Ensure deployment configuration files are separated from source code
description: 'Deployment configurations are often stored in a version control system. Separate deployment configuration files from source code repositories. Deployment configuration manifests are often stored in version control systems. Storing them in dedicated repositories, separately from source code repositories, has several benefits. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.1.1 Ensure deployment configuration files are separated from source code
audit:
  type: manual
  command: 'Ensure each deployment configuration file is stored separately from source code. Expected state: Store each deployment configuration file in a dedicated repository separately from source code.'
remediation:
  type: iac_patch
  command: Store each deployment configuration file in a dedicated repository separately from source code.
