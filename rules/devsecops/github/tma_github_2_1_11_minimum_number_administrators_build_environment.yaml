id: TMA-GITHUB-2.1.11
title: Ensure minimum number of administrators are set for the build environment
description: 'Ensure the build environment has a minimum number of administrators. Build environment administrators have the highest level of permissions, including the ability to add/remove users, create or delete pipelines, control build workers, change build trigger permissions and more. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.11 Ensure minimum number of administrators are set for the build environment
audit:
  type: manual
  command: 'Verify that the build environment has only the minimum number of administrators. Expected state: Set the minimum number of administrators in the build environment.'
remediation:
  type: iac_patch
  command: Set the minimum number of administrators in the build environment.
