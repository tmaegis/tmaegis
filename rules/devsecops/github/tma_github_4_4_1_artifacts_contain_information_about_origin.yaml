id: TMA-GITHUB-4.4.1
title: Ensure artifacts contain information about their origin
description: 'When delivering artifacts, ensure they have information about their origin. This may be done by providing a Software Bill of Manufacture (SBOM) or some metadata files. Information about artifact origin can be used for verification purposes. Having this kind of information allows the user to decide if the organization supplying the artifact is trusted. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.4.1 Ensure artifacts contain information about their origin
audit:
  type: manual
  command: 'For each artifact, ensure it has information about its origin. Expected state: For each artifact supplied, supply information about its origin. For each artifact in use, ask for information about its origin.'
remediation:
  type: iac_patch
  command: For each artifact supplied, supply information about its origin. For each artifact in use, ask for information about its origin.
