id: TMA-GITHUB-1.5.6
title: Ensure scanners are in place for open-source license issues in used packages
description: 'Detect open-source license problems in used dependencies and fix them. A software license is a legal document that establishes several key conditions between a software company or developer and a user in order to allow the use of software. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.5.6 Ensure scanners are in place for open-source license issues in used packages
audit:
  type: manual
  command: 'Ensure a license scanning tool is set up to identify open-source license problems and that every package you use is scanned by it. Expected state: Designate a license scanning tool to identify open-source license problems and fix them and scan every package you use.'
remediation:
  type: iac_patch
  command: Designate a license scanning tool to identify open-source license problems and fix them and scan every package you use.
