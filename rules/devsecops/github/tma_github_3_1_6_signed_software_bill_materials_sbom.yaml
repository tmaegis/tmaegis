id: TMA-GITHUB-3.1.6
title: Ensure a signed Software Bill of Materials (SBOM) of the code is supplied
description: 'A Software Bill of Materials (SBOM) is a file that specifies each component of software or a build process. When using a dependency, demand its SBOM and ensure it is signed for validation purposes. A Software Bill of Materials (SBOM) creates trust between its provider and its users by ensuring that the software supplied is the software described, without any potential interference in between. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.6 Ensure a signed Software Bill of Materials (SBOM) of the code is supplied
audit:
  type: manual
  command: 'For every artifact supplied, ensure it has a validated, signed Software Bill of Materials. Expected state: For every artifact supplied, require and verify a signed Software Bill of Materials from its supplier.'
remediation:
  type: iac_patch
  command: For every artifact supplied, require and verify a signed Software Bill of Materials from its supplier.
