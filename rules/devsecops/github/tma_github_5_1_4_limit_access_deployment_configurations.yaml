id: TMA-GITHUB-5.1.4
title: Limit access to deployment configurations
description: 'Restrict access to the deployment configuration to trusted and qualified users only. Deployment configurations are sensitive in nature. The tiniest mistake can lead to downtime or bugs in production, which can have a direct effect on the product''s integrity and customer trust. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.1.4 Limit access to deployment configurations
audit:
  type: manual
  command: 'Verify each deployment configuration is accessible only to known and authorized users. Expected state: Restrict access to the deployment configuration to trusted and qualified users.'
remediation:
  type: iac_patch
  command: Restrict access to the deployment configuration to trusted and qualified users.
