id: TMA-GITHUB-2.4.3
title: Ensure dependencies are validated before being used
description: 'Validate every dependency of the pipeline before use. To ensure that a dependency used in a pipeline is trusted and has not been infected by malicious actor (for example, the codecov incident), validate dependencies before using them. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.4.3 Ensure dependencies are validated before being used
audit:
  type: manual
  command: 'For every dependency used in every pipeline, ensure it has been validated. Expected state: For every dependency used in every pipeline, validate each one.'
remediation:
  type: iac_patch
  command: For every dependency used in every pipeline, validate each one.
