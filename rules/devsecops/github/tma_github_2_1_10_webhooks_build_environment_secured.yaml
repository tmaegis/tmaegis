id: TMA-GITHUB-2.1.10
title: Ensure webhooks of the build environment are secured
description: 'Use secured webhooks of the build environment. Webhooks are used for triggering an HTTP request based on an action made in the platform. Typically, build environment feature webhooks for a pipeline trigger based on source code event. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.10 Ensure webhooks of the build environment are secured
audit:
  type: manual
  command: 'For each webhook in use, ensure it is secured (HTTPS). Expected state: For each webhook in use, change it to secured (over HTTPS).'
remediation:
  type: iac_patch
  command: For each webhook in use, change it to secured (over HTTPS).
