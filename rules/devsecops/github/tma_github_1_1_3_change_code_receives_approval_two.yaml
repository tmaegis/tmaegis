id: TMA-GITHUB-1.1.3
title: Ensure any change to code receives approval of two strongly authenticated users
description: 'Ensure that every code change is reviewed and approved by two authorized contributors who are both strongly authenticated - using Multi-Factor Authentication (MFA), from the team relevant to the code change. To prevent malicious or unauthorized code changes, the first layer of protection is the process of code review. This process involves engineer teammates reviewing each other''s code for errors, optimizations, and general ... Checks the default branch: a pull request with at least 2 approving reviews is required. Satisfied by classic branch protection or an active ruleset (rules/branches). Uses the GitHub REST/GraphQL API through gh api (read-only). The repository comes from GH_REPO or the current git checkout (gh''s {owner}/{repo} resolution, GH_HOST for GitHub Enterprise Server); the organization comes from GH_ORG (default: the repository owner). Fails when gh is missing or unauthenticated (gh auth login or GH_TOKEN); organization settings and branch protection need an
  owner/admin token.'
target: github
level: 1
severity: high
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.1.3 Ensure any change to code receives approval of two strongly authenticated users
audit:
  type: command
  command: |-
    command -v gh >/dev/null 2>&1 || exit 1
    gh auth status >/dev/null 2>&1 || exit 1
    info=$(gh api 'repos/{owner}/{repo}' --jq '.full_name + " " + .default_branch' 2>/dev/null) || exit 1
    R=${info% *}; B=${info#* }
    [ -n "$R" ] && [ -n "$B" ] || exit 1
    p=$(gh api "repos/$R/branches/$B/protection" --jq '(.required_pull_request_reviews.required_approving_review_count // 0) >= 2' 2>/dev/null) || p=false
    s=$(gh api "repos/$R/rules/branches/$B" --jq 'any(.[]; .type == "pull_request" and (.parameters.required_approving_review_count // 0) >= 2)' 2>/dev/null) || s=false
    [ "$p" = true ] || [ "$s" = true ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Settings > Branches (or Rules > Rulesets) for the default branch: enable Require a pull request before merging with Required approvals = 2 (gh api -X PUT repos/<owner>/<repo>/branches/<branch>/protection ... required_approving_review_count=2), and require MFA for the organization.'
