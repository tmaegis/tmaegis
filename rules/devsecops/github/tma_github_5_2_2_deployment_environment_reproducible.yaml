id: TMA-GITHUB-5.2.2
title: Ensure the deployment environment is reproducible
description: 'Verify that the deployment environment - the orchestrator and the production environment where the application is deployed - is reproducible. This means that the environment stays the same in each deployment if the configuration has not changed. A reproducible build is a build that produces the same artifact when given the same input data, and in this case the same environment. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.2.2 Ensure the deployment environment is reproducible
audit:
  type: manual
  command: 'Verify that the deployment/production environment is reproducible. Expected state: Adjust the process that deploys the deployment/production environment to build the same environment each time when the configuration has not changed.'
remediation:
  type: iac_patch
  command: Adjust the process that deploys the deployment/production environment to build the same environment each time when the configuration has not changed.
