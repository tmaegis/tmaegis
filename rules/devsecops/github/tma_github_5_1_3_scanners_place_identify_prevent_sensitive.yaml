id: TMA-GITHUB-5.1.3
title: Ensure scanners are in place to identify and prevent sensitive data in deployment configuration
description: 'Detect and prevent sensitive data - such as confidential ID numbers, passwords, etc. -in deployment configurations. Sensitive data in deployment configurations might create a major incident if an attacker gains access to it, as this can cause data loss and theft. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.1.3 Ensure scanners are in place to identify and prevent sensitive data in deployment configuration
audit:
  type: manual
  command: 'For each deployment configuration file, verify that scanners are set to identify and prevent the existence of sensitive data within it. Expected state: For each deployment configuration file, set scanners to identify and prevent sensitive data within it.'
remediation:
  type: iac_patch
  command: For each deployment configuration file, set scanners to identify and prevent sensitive data within it.
