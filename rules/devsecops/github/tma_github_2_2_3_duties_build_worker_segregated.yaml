id: TMA-GITHUB-2.2.3
title: Ensure the duties of each build worker are segregated
description: 'Separate responsibilities in the build workflow, such as testing, compiling, pushing artifacts, etc., to different build workers so that each worker will have a single duty. Separating duties and allocating them to many workers makes it easier to verify each step in the build process and ensure there is no corruption. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.3 Ensure the duties of each build worker are segregated
audit:
  type: manual
  command: 'For each build worker, ensure it has the least responsibility possible, preferably only one duty. Expected state: For each build worker, limit its responsibility to one duty.'
remediation:
  type: iac_patch
  command: For each build worker, limit its responsibility to one duty.
