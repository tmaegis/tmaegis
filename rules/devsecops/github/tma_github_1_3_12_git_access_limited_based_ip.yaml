id: TMA-GITHUB-1.3.12
title: Ensure Git access is limited based on IP addresses
description: 'Limit Git access based on IP addresses by having a allowlist of IP addresses from which connection is possible. Allowing access to Git repositories (source code) only from specific IP addresses adds yet another layer of restriction and reduces the risk of unauthorized connection to the organization''s assets. GraphQL ipAllowListEnabledSetting must be ENABLED with at least one allow-list entry (GitHub Enterprise Cloud). Uses the GitHub REST/GraphQL API through gh api (read-only). The repository comes from GH_REPO or the current git checkout (gh''s {owner}/{repo} resolution, GH_HOST for GitHub Enterprise Server); the organization comes from GH_ORG (default: the repository owner). Fails when gh is missing or unauthenticated (gh auth login or GH_TOKEN); organization settings and branch protection need an owner/admin token.'
target: github
level: 2
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.3.12 Ensure Git access is limited based on IP addresses
audit:
  type: command
  command: |-
    command -v gh >/dev/null 2>&1 || exit 1
    gh auth status >/dev/null 2>&1 || exit 1
    O=${GH_ORG:-$(gh api 'repos/{owner}/{repo}' --jq .owner.login 2>/dev/null)}
    [ -n "$O" ] || exit 1
    v=$(gh api graphql -f query='query($o: String!) { organization(login: $o) { ipAllowListEnabledSetting ipAllowListEntries(first: 1) { totalCount } } }' -f o="$O" --jq '.data.organization.ipAllowListEnabledSetting == "ENABLED" and .data.organization.ipAllowListEntries.totalCount > 0' 2>/dev/null) || exit 1
    [ "$v" = true ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Organization Settings > Authentication security > IP allow list: add the allowed CIDRs and select Enable IP allow list.'
