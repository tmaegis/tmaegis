title: Ensure packages are automatically scanned for known vulnerabilities
description: 'Automatically scan every package for vulnerabilities. Automatic scanning for vulnerabilities detects known vulnerabilities in packages and dependencies in use, allowing faster patching when one is found. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
