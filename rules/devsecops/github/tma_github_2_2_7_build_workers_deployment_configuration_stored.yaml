id: TMA-GITHUB-2.2.7
title: Ensure build workers' deployment configuration is stored in a version control platform
description: 'Store the deployment configuration of build workers in a version control platform, such as Github. Build workers are a sensitive part of the build phase. They generally have access to the code repository, the Continuous Integration platform, the deployment platform, etc. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.7 Ensure build workers' deployment configuration is stored in a version control platform
audit:
  type: manual
  command: 'Verify that the deployment configuration of build workers is stored in a version control platform. Expected state: Document and store every deployment configuration of build workers in a version control platform.'
remediation:
  type: iac_patch
  command: Document and store every deployment configuration of build workers in a version control platform.
