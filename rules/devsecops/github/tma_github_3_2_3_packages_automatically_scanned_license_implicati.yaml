id: TMA-GITHUB-3.2.3
title: Ensure packages are automatically scanned for license implications
description: 'A software license is a document that provides legal conditions and guidelines for the use and distribution of software, usually defined by the author. It is recommended to scan for any legal implications automatically. When using packages with software licenses, especially commercial ones which tend to be the strictest, it is important to verify that the use of the package meets the conditions of the license. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.2.3 Ensure packages are automatically scanned for license implications
audit:
  type: manual
  command: 'Ensure license implication rules are configured and are scanned automatically. Expected state: Set automatic package scanning for license implications.'
remediation:
  type: iac_patch
  command: Set automatic package scanning for license implications.
