id: TMA-GITHUB-2.3.4
title: Ensure changes to pipeline files are tracked and reviewed
description: 'Track and review changes to pipeline files. Pipeline files are sensitive files. They have the ability to access sensitive data and control the build process, thus it is just as important to review changes to pipeline files as it is to verify source code. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: low
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.3.4 Ensure changes to pipeline files are tracked and reviewed
audit:
  type: manual
  command: 'For each pipeline file, ensure changes to it are being tracked and reviewed. Expected state: For each pipeline file, track changes to it and review them.'
remediation:
  type: iac_patch
  command: For each pipeline file, track changes to it and review them.
