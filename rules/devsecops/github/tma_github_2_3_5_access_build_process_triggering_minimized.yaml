id: TMA-GITHUB-2.3.5
title: Ensure access to build process triggering is minimized
description: 'Restrict access to pipeline triggers. Build pipelines are used for multiple reasons. Some are very sensitive, such as pipelines which deploy to production. In order to protect the environment from malicious acts or human mistakes, such as a developer ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.3.5 Ensure access to build process triggering is minimized
audit:
  type: manual
  command: 'For every pipeline in use, verify only the necessary users have permission to trigger it. Expected state: For every pipeline in use, grant only the necessary users permission to trigger it.'
remediation:
  type: iac_patch
  command: For every pipeline in use, grant only the necessary users permission to trigger it.
