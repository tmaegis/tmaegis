id: TMA-GITHUB-2.1.6
title: Ensure users must authenticate to access the build environment
description: 'Require users to login in to access the build environment - where the orchestrator, the pipeline executer, where the build workers are running, etc. Requiring users to authenticate and disabling anonymous access to the build environment allows organization to track every action on that environment, good or bad, to its actor. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.6 Ensure users must authenticate to access the build environment
audit:
  type: manual
  command: 'Ensure authentication is required to access the build environment. Expected state: Require authentication to access the build environment and disable anonymous access.'
remediation:
  type: iac_patch
  command: Require authentication to access the build environment and disable anonymous access.
