id: TMA-GITHUB-2.4.2
title: Ensure all external dependencies used in the build process are locked
description: 'External dependencies may be public packages needed in the pipeline, or perhaps the public image being used for the build worker. Lock these external dependencies in every build pipeline. External dependencies are sources of code that aren''t under organizational control. They might be intentionally or unintentionally infected with malicious code or have known vulnerabilities, which could result in ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.4.2 Ensure all external dependencies used in the build process are locked
audit:
  type: manual
  command: 'Ensure every external dependency being used in pipelines is locked. Expected state: For all external dependencies being used in pipelines, verify they are locked.'
remediation:
  type: iac_patch
  command: For all external dependencies being used in pipelines, verify they are locked.
