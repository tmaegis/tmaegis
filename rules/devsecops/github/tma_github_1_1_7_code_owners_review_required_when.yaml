id: TMA-GITHUB-1.1.7
title: Ensure code owner's review is required when a change affects owned code
description: 'Ensure trusted code owners are required to review and approve any code change proposal made to their respective owned areas in the code base. Configuring code owners ensures that no code, especially code which could prove malicious, will slip into the source code or configuration files of a repository. Checks the default branch: code owner review is required. Satisfied by classic branch protection or an active ruleset (rules/branches). Uses the GitHub REST/GraphQL API through gh api (read-only). The repository comes from GH_REPO or the current git checkout (gh''s {owner}/{repo} resolution, GH_HOST for GitHub Enterprise Server); the organization comes from GH_ORG (default: the repository owner). Fails when gh is missing or unauthenticated (gh auth login or GH_TOKEN); organization settings and branch protection need an owner/admin token.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.1.7 Ensure code owner's review is required when a change affects owned code
audit:
  type: command
  command: |-
    command -v gh >/dev/null 2>&1 || exit 1
    gh auth status >/dev/null 2>&1 || exit 1
    info=$(gh api 'repos/{owner}/{repo}' --jq '.full_name + " " + .default_branch' 2>/dev/null) || exit 1
    R=${info% *}; B=${info#* }
    [ -n "$R" ] && [ -n "$B" ] || exit 1
    p=$(gh api "repos/$R/branches/$B/protection" --jq '.required_pull_request_reviews.require_code_owner_reviews == true' 2>/dev/null) || p=false
    s=$(gh api "repos/$R/rules/branches/$B" --jq 'any(.[]; .type == "pull_request" and .parameters.require_code_owner_review == true)' 2>/dev/null) || s=false
    [ "$p" = true ] || [ "$s" = true ] && echo compliant
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Settings > Branches (or Rules > Rulesets) for the default branch: enable Require review from Code Owners.'
