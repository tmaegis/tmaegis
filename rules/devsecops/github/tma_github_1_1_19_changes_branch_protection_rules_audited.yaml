id: TMA-GITHUB-1.1.19
title: Ensure any changes to branch protection rules are audited
description: 'Ensure that changes in the branch protection rules are audited. Branch protection rules should be configured on every repository. The only users who may change such rules are administrators. In a case of an attack on an administrator account or of human error on the part of an ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.1.19 Ensure any changes to branch protection rules are audited
audit:
  type: manual
  command: 'Ensure changes in branch protection rules are audited by performing the following regularly: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Archives" section of the sidebar, click Logs, then click Audit log. 4. Use the action qualifier in your query and look for protected_branch category. Ensure every action is reasonable and secure and is investigated if not.'
remediation:
  type: iac_patch
  command: 'Use the audit log to audit changes in branch protection rules by performing the following: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Archives" section of the sidebar, click Logs, then click Audit log. 4. Use the action qualifier in your query and look for protected_branch category. Ensure every action is reasonable and secure and investigate if not.'
