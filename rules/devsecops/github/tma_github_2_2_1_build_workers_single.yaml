id: TMA-GITHUB-2.2.1
title: Ensure build workers are single-used
description: 'Use a clean instance of build worker for every pipeline run. Using a clean instance of build worker for every pipeline run eliminates the risks of data theft, data integrity breaches, and unavailability. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.1 Ensure build workers are single-used
audit:
  type: manual
  command: 'Ensure that every pipeline that is being run has its own clean, new runner. Expected state: Create a clean build worker for every pipeline that is being run, or use build platform-hosted runners, as they typically offer a clean instance for every run.'
remediation:
  type: iac_patch
  command: Create a clean build worker for every pipeline that is being run, or use build platform-hosted runners, as they typically offer a clean instance for every run.
