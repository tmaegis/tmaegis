id: TMA-GITHUB-4.2.1
title: Ensure the authority to certify artifacts is limited
description: 'Software certification is used to verify the safety of certain software usage and to establish trust between the supplier and the consumer. Any artifact can be certified. Limit the authority to certify different artifacts. Artifact certification is a powerful tool in establishing trust. Clients use a software certificate to verify that the artifact is safe to use according to their security policies. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.2.1 Ensure the authority to certify artifacts is limited
audit:
  type: manual
  command: 'Ensure only certain artifacts can be certified by certain parties. Expected state: Limit which artifact can be certified by which authority.'
remediation:
  type: iac_patch
  command: Limit which artifact can be certified by which authority.
