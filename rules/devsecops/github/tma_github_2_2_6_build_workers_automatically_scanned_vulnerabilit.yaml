id: TMA-GITHUB-2.2.6
title: Ensure build workers are automatically scanned for vulnerabilities
description: 'Scan build workers for vulnerabilities. It is recommended that this be done automatically. Automatic scanning for vulnerabilities detects known weaknesses in environmental sources in use, such as docker images or kernel versions. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.6 Ensure build workers are automatically scanned for vulnerabilities
audit:
  type: manual
  command: 'For each build worker, ensure the environmental sources it uses are scanned for vulnerabilities. Expected state: For each build worker, automatically scan its environmental sources, such as docker image, for vulnerabilities.'
remediation:
  type: iac_patch
  command: For each build worker, automatically scan its environmental sources, such as docker image, for vulnerabilities.
