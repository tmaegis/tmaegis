id: TMA-GITHUB-2.1.5
title: Ensure access to build environments is limited
description: 'Restrict access to the build environment (orchestrator, pipeline executor, their environment, etc.) to trusted and qualified users only. A build environment contains sensitive data such as environment variables, secrets, and the source code itself. Any user that has access to this environment can make changes to the build process, including changes to ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.5 Ensure access to build environments is limited
audit:
  type: manual
  command: 'Verify each build environment is accessible only to known and authorized users. Expected state: Restrict access to the build environment to trusted and qualified users.'
remediation:
  type: iac_patch
  command: Restrict access to the build environment to trusted and qualified users.
