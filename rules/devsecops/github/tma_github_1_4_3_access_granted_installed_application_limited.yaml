id: TMA-GITHUB-1.4.3
title: Ensure the access granted to each installed application is limited to the least privilege needed
description: 'Ensure installed application permissions are limited to the lowest privilege level required. Applications are typically automated integrations that can improve the workflow of an organization. They are written by third-party developers, and therefore should be reviewed carefully before use. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.4.3 Ensure the access granted to each installed application is limited to the least privilege needed
audit:
  type: manual
  command: 'Verify that each installed application has the least privilege needed: a. For GitHub Apps, perform the following: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Integrations" section of the sidebar, click GitHub Apps. 4. Next to every GitHub App, click Configure. 5. Review the GitHub App''s permissions and repository access. Verify that the App permissions are the least possible and that it can access only necessary repositories.'
remediation:
  type: iac_patch
  command: 'Grant permissions to applications by the "least privilege" principle, meaning the lowest possible permission necessary: a. For GitHub Apps, perform the following: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Integrations" section of the sidebar, click GitHub Apps. 4. Next to every GitHub App, click Configure. 5. Review the GitHub App''s permissions and repository access. Edit the permissions granted to the least possible. For example, restrict the number of repositories the App can access. 6. Click Save.'
