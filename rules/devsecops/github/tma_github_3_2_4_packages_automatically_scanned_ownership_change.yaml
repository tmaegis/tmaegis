id: TMA-GITHUB-3.2.4
title: Ensure packages are automatically scanned for ownership change
description: 'Scan every package automatically for ownership change. A change in package ownership is not a regular action. In some cases it can lead to a massive problem (for example, the "event-stream" incident). Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.2.4 Ensure packages are automatically scanned for ownership change
audit:
  type: manual
  command: 'Ensure automatic scanning of packages for ownership change is set. Expected state: Set automatic scanning of packages for ownership change.'
remediation:
  type: iac_patch
  command: Set automatic scanning of packages for ownership change.
