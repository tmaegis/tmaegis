id: TMA-GITHUB-5.1.6
title: Ensure deployment configuration manifests are verified
description: 'Verify the deployment configuration manifests. To ensure that the configuration manifests used are trusted and have not been infected by malicious actors before arriving at the platform, it is important to verify the manifests. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.1.6 Ensure deployment configuration manifests are verified
audit:
  type: manual
  command: 'For each deployment configuration manifest in use, ensure it has been verified. Expected state: Verify each deployment configuration manifest in use.'
remediation:
  type: iac_patch
  command: Verify each deployment configuration manifest in use.
