id: TMA-GITHUB-2.4.6
title: Ensure pipeline steps sign the Software Bill of Materials (SBOM) produced
description: 'SBOM (Software Bill of Materials) is a file that specifies each component of software or a build process. It should be generated after every pipeline run. After it is generated, it must then be signed. Software Bill of Materials (SBOM) is a file used to validate the integrity and security of a build pipeline. Signing it ensures that no one tampered with the file when it was delivered. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.4.6 Ensure pipeline steps sign the Software Bill of Materials (SBOM) produced
audit:
  type: manual
  command: 'For each pipeline, ensure it signs the Software Bill of Materials it produces on every run. Expected state: For each pipeline, configure it to sign its produced Software Bill of Materials on every run.'
remediation:
  type: iac_patch
  command: For each pipeline, configure it to sign its produced Software Bill of Materials on every run.
