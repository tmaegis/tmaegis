id: TMA-GITHUB-4.2.4
title: Ensure user management of the package registry is not local
description: 'Manage users and their access to the package registry with an external authentication server and not with the package registry itself. Some package registries offer a tool for user management, aside from the main Lightweight Directory Access Protocol (LDAP) or Active Directory (AD) server of the organization. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- artifacts
reference: CIS GitHub Benchmark v1.2.0 - 4.2.4 Ensure user management of the package registry is not local
audit:
  type: manual
  command: 'For each package registry, verify that its user access is not managed locally, but instead with the main authentication server of the organization. Expected state: For each package registry, use the main authentication server of the organization for user management and do not manage locally.'
remediation:
  type: iac_patch
  command: For each package registry, use the main authentication server of the organization for user management and do not manage locally.
