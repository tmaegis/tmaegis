id: TMA-GITHUB-1.3.2
title: Ensure team creation is limited to specific members
description: 'Limit ability to create teams to trusted and specific users. The ability to create new teams should be restricted to specific members in order to keep the organization orderly and ensure users have access to only the lowest privilege level necessary. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- source-code
reference: CIS GitHub Benchmark v1.2.0 - 1.3.2 Ensure team creation is limited to specific members
audit:
  type: manual
  command: 'For every organization, ensure that team creation is limited to specific, trusted users by performing the following: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Access" section of the sidebar, click Member privileges. 4. Under "Team creation rules", verify that Allow members to create teams is not selected.'
remediation:
  type: iac_patch
  command: 'For every organization, limit team creation to specific, trusted users by performing the following: 1. In the top right corner of GitHub.com, click your profile photo, then click Your organizations. 2. Next to the organization, click Settings. 3. In the "Access" section of the sidebar, click Member privileges. 4. Under "Team creation rules", deselect Allow members to create teams. 5. Click Save.'
