id: TMA-GITHUB-3.1.3
title: Ensure signed metadata of the build process is required and verified
description: 'Require and verify signed metadata of the build process for all dependencies in use. The metadata of a build process lists every action that took place during an artifact build. It is used to ensure that an artifact has not been compromised during the build, that no malicious code was injected into it ... Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.3 Ensure signed metadata of the build process is required and verified
audit:
  type: manual
  command: For each artifact used, ensure it was supplied with verified and signed metadata of its build process. The signature should be the organizational signature and should be verifiable by common Certificate Authority servers.
remediation:
  type: iac_patch
  command: For each artifact in use, require and verify signed metadata of the build process.
