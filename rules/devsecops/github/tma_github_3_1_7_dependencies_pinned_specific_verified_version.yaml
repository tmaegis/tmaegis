id: TMA-GITHUB-3.1.7
title: Ensure dependencies are pinned to a specific, verified version
description: 'Pin dependencies to a specific version. Avoid using the "latest" tag or broad version. When using a wildcard version of a package, or the "latest" tag, the risk of encountering a new, potentially malicious package increases. The "latest" tag pulls the last package pushed to the registry. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.7 Ensure dependencies are pinned to a specific, verified version
audit:
  type: manual
  command: 'For every dependency in use, ensure it is pinned to a specific version. Expected state: For every dependency in use, pin to a specific version.'
remediation:
  type: iac_patch
  command: For every dependency in use, pin to a specific version.
