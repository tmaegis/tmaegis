id: TMA-GITHUB-2.2.2
title: Ensure build worker environments and commands are passed and not pulled
description: 'A worker''s environment can be passed (for example, a pod in a Kubernetes cluster in which an environment variable is passed to it). It also can be pulled, like a virtual machine that is installing a package. Ensure that the environment and commands are passed to the workers and not pulled from it. Passing an environment means additional configuration happens in the build time phase and not in run time. It will also pass locally and not remotely. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.2.2 Ensure build worker environments and commands are passed and not pulled
audit:
  type: manual
  command: 'For each build worker, ensure its environment and commands are passed and not pulled. Expected state: For each build worker, pass its environment and commands to it instead of pulling it.'
remediation:
  type: iac_patch
  command: For each build worker, pass its environment and commands to it instead of pulling it.
