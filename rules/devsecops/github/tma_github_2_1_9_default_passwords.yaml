id: TMA-GITHUB-2.1.9
title: Ensure default passwords are not used
description: 'Do not use default passwords of build tools and components. Sometimes build tools and components are provided with default passwords for the first login. This password is intended to be used only on the first login and should be changed immediately after. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- build-pipelines
reference: CIS GitHub Benchmark v1.2.0 - 2.1.9 Ensure default passwords are not used
audit:
  type: manual
  command: 'For each build tool, ensure the password used is not the default one. Expected state: For each build tool, change the default password.'
remediation:
  type: iac_patch
  command: For each build tool, change the default password.
