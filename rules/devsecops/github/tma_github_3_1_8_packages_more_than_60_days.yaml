id: TMA-GITHUB-3.1.8
title: Ensure all packages used are more than 60 days old
description: 'Use packages that are more than 60 days old. Third-party packages are a major risk since an organization cannot control their source code, and there is always the possibility these packages could be malicious. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 2
severity: medium
tags:
- github
- dependencies
reference: CIS GitHub Benchmark v1.2.0 - 3.1.8 Ensure all packages used are more than 60 days old
audit:
  type: manual
  command: 'For every package used, ensure it is more than 60 days old. Expected state: If a package used is less than 60 days old, stop using it and find another solution.'
remediation:
  type: iac_patch
  command: If a package used is less than 60 days old, stop using it and find another solution.
