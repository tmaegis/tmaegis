id: TMA-GITHUB-5.2.4
title: Ensure default passwords are not used
description: 'Do not use default passwords of deployment tools and components. Many deployment tools and components are provided with default passwords for the first login. This password is intended to be used only on the first login and should be changed immediately after. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: high
tags:
- github
- deployment
reference: CIS GitHub Benchmark v1.2.0 - 5.2.4 Ensure default passwords are not used
audit:
  type: manual
  command: 'For each deployment tool, ensure the password is not the default one. Expected state: For each deployment tool, change the password.'
remediation:
  type: iac_patch
  command: For each deployment tool, change the password.
