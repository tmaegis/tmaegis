id: TMA-GITHUB-2.1.4
title: Ensure the creation of the build environment is automated
description: 'Automate the creation of the build environment. Automating the deployment of the build environment reduces the risk for human mistakes - such as a wrong configuration or exposure of sensitive data - because it requires less human interaction and intervention. Reported as a manual review item: no reliable read-only gh api check exists for this control.'
target: github
level: 1
severity: medium
tags:
