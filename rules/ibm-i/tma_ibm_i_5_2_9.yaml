id: TMA-IBM-I-5.2.9
title: Intrusion Detection
description: The intrusion detection and prevention system (IDS) notifies you of attempts to hack into, disrupt, or deny service to the system. IDS also monitors for potential extrusions, where your system might be used as the source of the attack. Most intrusions follow a pattern of information gathering, attempted access, and then destructive attacks. Some attacks can be detected and neutralized by the target system. Other attacks cannot be effectively neutralized by the target system.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.9 Intrusion Detection
audit:
  type: manual
  command: Review IBM i Intrusion Detection Policies with your network security team and ensure that Intrusion Detection Policies are configured per your specific requirements.
remediation:
  type: iac_patch
  command: To establish the recommended configuration, review Intrusion Detection in the IBM i Knowledge Center and Configure Intrusion Detection per your specific requirements.
