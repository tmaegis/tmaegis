id: TMA-IBM-I-4.2
title: User Profile (*USRPRF) Access Controls (Private authority)
description: Resource security is an important aspect of your system security and defines which users are allowed to use objects on the system and what operations they are allowed to perform on those objects. Granting a private authority of *USE or greater to any *USRPRF object allows an attacker to swap with these profiles and use their privileges and authorizations without their passwords or credentials outside of designed application access requirements ...
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- accounts
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 4.2 User Profile (*USRPRF) Access Controls (Private authority)
audit:
  type: manual
  command: Replace xxxxxx for USER(<xxxxxx>) with the USER_NAME from the audit
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, change any *USRPRF (SYSTEM_OBJECT NAME) objects identified in the audit to the default shipped and creation value *EXCLUDE to secure all user profiles from malicious use. RVKOBJAUT OBJ(<xxxxxx>) OBJTYPE(*USRPRF) USER(<xxxxxx>) AUT(*ALL) Note: Replace xxxxxx for OBJ(<xxxxxx>) with the SYSTEM_OBJECT_NAME from the'
