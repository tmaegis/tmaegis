id: TMA-IBM-I-5.1.1.23
title: Set Password Expiration Warning
description: Controls the number of days prior to a password expiring to begin displaying password expiration warning messages on the Sign-on Information display.
target: ibm-i
level: 1
severity: low
tags:
- ibm-i
- password-policy
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.23 Set Password Expiration Warning
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QPWDEXPWRN) (or WRKSYSVAL QPWDEXPWRN) and verify the value is "7". Remediate with: CHGSYSVAL SYSVAL(QPWDEXPWRN) VALUE(''7'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "7": QPWDEXPWRN CHGSYSVAL SYSVAL(QPWDEXPWRN) VALUE(''7'')'
