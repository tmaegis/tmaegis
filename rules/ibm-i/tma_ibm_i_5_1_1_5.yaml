id: TMA-IBM-I-5.1.1.5
title: Set Auditing Force Level
description: Determines how many auditing journal entries records are cached in memory before they are physically written to disk from memory. This will provide the best auditing performance and lets the system determine the appropriate setting based on performance history.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.5 Set Auditing Force Level
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUDFRCLVL) (or WRKSYSVAL QAUDFRCLVL) and verify the value is *SYS. Remediate with: CHGSYSVAL SYSVAL(QAUDFRCLVL) VALUE(''*SYS'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *SYS: QAUDFRCLVL CHGSYSVAL SYSVAL(QAUDFRCLVL) VALUE(''*SYS'')'
