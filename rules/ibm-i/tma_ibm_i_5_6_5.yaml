id: TMA-IBM-I-5.6.5
title: System Service Tools Allow New Digital Certificates
description: 'This policy setting determines if new certificates can be added to the local system''s *SIGNATUREVERIFICATION certificate store and also allows passwords for digital certificate stores to be reset by any user with *ALLOBJ and *SECADM. The recommended state for this setting is: 0 Under normal operations, new certificates should rarely be added to the local system''s *SIGNATUREVERIFICATION certificate store. More importantly, passwords for digital certificate stores should be secured from being reset by any user with *ALLOBJ and *SECADM.'
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.6.5 System Service Tools Allow New Digital Certificates
audit:
  type: manual
  command: On a command line type DSPSSTSECA and press ENTER Verify that the Service tools Allow add of digital certificates is set to *NO
remediation:
  type: iac_patch
  command: To change the service tools Allow add of digital certificates value. CHGSSTSECA REQUSRID(<xxxxxx>) REQPWD(<xxxxxx>) ADDDIGCERT(*NO)
