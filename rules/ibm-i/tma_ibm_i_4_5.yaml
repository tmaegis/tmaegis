id: TMA-IBM-I-4.5
title: User Profile Action Auditing
description: This subcategory reports when a user account or service uses a sensitive privilege. Auditing these events may be useful when investigating a security incident. The CHGUSRAUD (Change User Audit) command allows a user with audit (*AUDIT) special authority to set up or change auditing for a user.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 4.5 User Profile Action Auditing
audit:
  type: manual
  command: 'PRTUSRPRF SELECT(*SPCAUT) SPCAUT(*ALL) Type WRKSPLF to locate your spool file with the name QPSECUSR and User Data PRTUSRPRF. View spool file output and use the DSPUSRPRF command to ensure that all administrators with special authorities have an action auditing value of *CMD. Note that administrative Special Authorities are cumulative from User Profile and Group Profiles. IBM supplied user profiles with the exception of QSECOFR should be excluded from the audit. A list of IBM supplied user profiles can be obtained from the references below. 1. Type DSPUSRPRF ... (full steps: CIS section 4.5)'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, change the action auditing value of all administrative special authority users to include *CMD action auditing: CHGUSRAUD USRPRF(<xxxxxx>) AUDLVL(*CMD)'
