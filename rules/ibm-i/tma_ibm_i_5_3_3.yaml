id: TMA-IBM-I-5.3.3
title: IBM i SMB Signing
description: SMB signing (also known as security signatures) is a security mechanism in the SMB protocol. This setting requires clients connecting to the IBM i NetServer to sign requests for more secure communications. Session hijacking uses tools that allow attackers who have access to the same network as the client or server to interrupt, end, or steal a session in progress.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.3.3 IBM i SMB Signing
audit:
  type: manual
  command: Type ADDLIBLE NETSRVCMD Type GO NETS Select option 10. Display Attributes Ensure that Message authentication *REQUIRED is displayed Ensure that *SAME is displayed for the Message authentication Pending value to ensure no changes are pending.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, do the following: Type ADDLIBLE NETSRVCMD Type CHGNSVA MSGAUT(*REQUIRED) Type ENDNSV Type STRNSV RESET(*YES)'
