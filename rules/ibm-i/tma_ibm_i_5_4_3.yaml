id: TMA-IBM-I-5.4.3
title: Configuring SSH - disallow host based authentication
description: The recommendation is to edit the /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config file to ensure that host- based authentication is disallowed. Using host-based authentication, any user on a trusted host can log into another host on which this feature is enabled. Since this feature depends only on system authentication and not on user authentication, it must be disabled.
target: ibm-i
level: 1
severity: high
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.3 Configuring SSH - disallow host based authentication
audit:
  type: manual
  command: 'DSPF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type HostbasedAuthentication and press F16 (shift F4) Control: HostbasedAuthentication___________________________________ The display should yield the following output: HostbasedAuthentication no'
remediation:
  type: iac_patch
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' file to ensure that host based authentication is disallowed: Replace: #HostbasedAuthentication no With: HostbasedAuthentication no Re-cycle the sshd daemon to pick up the configuration changes:'
