id: TMA-IBM-I-5.2.8
title: Function Usage
description: You need to set up security for every person who will be authorized to use your system. User security setup involves installing application libraries and setting up user groups and profiles. Several tasks are necessary to set up user security on your system by using the command line interface. Limiting users access to security related functions provides an additional layer of defense. Access to powerful administrative functions should be limited in accordance with the Principle of Least Privilege (PoLP).
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.8 Function Usage
audit:
  type: manual
  command: 'On a command line, type STRSQL and press Enter Copy or type the following SQL statement to the terminal and press Enter. SELECT ALL FCNID, DFTUSG FROM QSYS2/FCN_INFO WHERE FCNID IN (''QIBM_ACCESS_ALLOBJ_JOBLOG'', ''QIBM_ACCESS_ALLOBJ_JOBLOG'', ''QIBM_ACS_HTTP_PROXY'', ''QIBM_ACS_HTTP_PROXY_OSPM'', ''QIBM_ALLOBJ_TRACE_ANY_USER'',''QIBM_DB_DDMDRDA'', ''QIBM_DB_ZDA'', ''QIBM_DB_SECADM'', ''QIBM_DB_SQLADM'', ''QIBM_DB_SYSMON'', ''QIBM_DIRSRV_ADMIN'', ''QIBM_ENVVAR_SYS'', ''QIBM_LIST_ALL_OBJS'', ''QIBM_LIST_ALL_OBJS_SQL'', ''QIBM_QSY_SYSTEM_CERT_STORE'', ''QIBM_QYAS_SERVICE_DISKMGMT'' ... (full steps: CIS section 5.2.8)'
remediation:
  type: iac_patch
  command: Set all functions in the audit procedure to a default usage of DENIED and authorize specific administrative users/groups in accordance with the Principle of Least Privilege (PoLP) using the CHGFCNUSG command as in the following example. CHGFCNUSG FCNID(QIBM_XXXXXX_XXXXXX) DEFAULT(*DENIED).
