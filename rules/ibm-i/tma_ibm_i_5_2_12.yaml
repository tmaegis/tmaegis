id: TMA-IBM-I-5.2.12
title: SMTP Mail Relay
description: Simple Mail Transfer Protocol (SMTP) is the protocol that allows the operating system to send and receive e-mail. SMTP on the IBM i operating system supports the distribution of notes, messages, and ASCII text documents. Spammers can connect to the server and forge sender information to send spam to legitimate users. The business may suffer financial as well as reputational loss through the use of a mail relay used to send spam.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.12 SMTP Mail Relay
audit:
  type: manual
  command: Type command CHGSMTPA and press F4 and then press F9 to display all parameters. Page down one time and ensure that Allowed relayed mail is set to a value of *NONE. Page down again and ensure that Allow authentication is not set to a value of *RELAY or *LCLRLY.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, disable mail relay for SMTP: CHGSMTPA ALWRLY(*NONE) ALWAUTH(*NONE)'
