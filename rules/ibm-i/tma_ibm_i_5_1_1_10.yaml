id: TMA-IBM-I-5.1.1.10
title: Set Automatic Virtual Device Creation
description: Determines whether automatic device creation is allowed, and if so, how many devices can be configured automatically. Specify a value 1 through 32500 for this system value that is both sufficient to support the needs of the business and not too large to represent a denial of service exposure, since it represents a finite limit.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.10 Set Automatic Virtual Device Creation
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUTOVRT) (or WRKSYSVAL QAUTOVRT) and verify the value is 32500 or less to specify an adequate number of devices to support the business. Remediate with: CHGSYSVAL SYSVAL(QAUTOVRT) VALUE(<XXXXXX>)'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to 32500 or less to specify an adequate number of devices to support the business: QAUTOVRT CHGSYSVAL SYSVAL(QAUTOVRT) VALUE(<XXXXXX>)'
