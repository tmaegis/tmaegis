id: TMA-IBM-I-5.1.1.6
title: Set Auditing Level
description: Determines the level of auditing on the system. At a minimum the following settings must be set; *AUTFAIL - Authority failures. *CREATE - Objects are created *DELETE - Objects are deleted *OBJMGT - Object management tasks. *PGMFAIL - Program failures, i.e. This will make it easier to view the security audit journal as it determines which security- related events are logged.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.6 Set Auditing Level
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUDLVL) (or WRKSYSVAL QAUDLVL) and verify the value is *AUTFAIL, *CREATE, *DELETE, *OBJMGT, *PGMFAIL, *SAVRST, *SECURITY, *SERVICE, *SYSMGT. Remediate with: CHGSYSVAL SYSVAL(QAUDLVL) VALUE(''*AUTFAIL *CREATE *DELETE *OBJMGT *PGMFAIL *SAVRST *SECURITY *SERVICE *SYSMGT'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *AUTFAIL, *CREATE, *DELETE, *OBJMGT, *PGMFAIL, *SAVRST, *SECURITY, *SERVICE, *SYSMGT: QAUDLVL CHGSYSVAL SYSVAL(QAUDLVL) VALUE(''*AUTFAIL *CREATE *DELETE *OBJMGT *PGMFAIL *SAVRST *SECURITY *SERVICE *SYSMGT'')'
