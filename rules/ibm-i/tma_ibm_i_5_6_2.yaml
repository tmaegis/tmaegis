id: TMA-IBM-I-5.6.2
title: System Service Tools Changing the maximum failed sign-on attempts
description: 'This policy setting determines the number of failed logon attempts before the account is locked. The recommended state for this setting is: 5 Setting an account lockout threshold reduces the likelihood that an attack will be successful. Setting the account lockout threshold too low introduces risk of increased accidental lockouts and/or a malicious actor intentionally locking out accounts.'
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.6.2 System Service Tools Changing the maximum failed sign-on attempts
audit:
  type: manual
  command: On a command line type DSPSSTSECA and press ENTER Verify that the Service tools Maximum sign-on attempts is set to 5
remediation:
  type: iac_patch
  command: To change the default maximum failed sign-on attempts before the user ID is disabled, follow these steps. CHGSSTSECA REQUSRID(<xxxxxx>) REQPWD(<xxxxxx>) MAXSGN(5)
