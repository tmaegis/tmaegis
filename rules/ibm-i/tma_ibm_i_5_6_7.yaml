id: TMA-IBM-I-5.6.7
title: System Service Tools locking security-related system values
description: 'This policy setting determines if users are prevented from changing security-related system values during normal operations. The recommended state for this setting is: 0 During normal operations, changes to the security related system values should be locked to prevent them from being changed.'
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.6.7 System Service Tools locking security-related system values
audit:
  type: manual
  command: DSPSSTSECA and press Enter. Observe the value for Allow change of security related system values and verify it = *NO
remediation:
  type: iac_patch
  command: To lock System Security Values. CHGSSTSECA REQUSRID(<xxxxxx>) REQPWD(<xxxxxx>) SECSYSVAL(*NO)
