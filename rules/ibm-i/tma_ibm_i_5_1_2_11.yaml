id: TMA-IBM-I-5.1.2.11
title: Set Inactivity Time-out Interval
description: Determines the interval in minutes that a workstation can be inactive before the system sends a message to a message queue or ends the job. All users must use a password protected screen saver that locks the PC after 15 minutes of inactivity to comply with Payment Card Industry Data Security Standards.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.11 Set Inactivity Time-out Interval
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QINACTITV) (or WRKSYSVAL QINACTITV) and verify the value is "15" (The system times out inactive jobs after 15 minutes of inactivity). Remediate with: CHGSYSVAL SYSVAL(QINACTITV) VALUE(''15'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "15" (The system times out inactive jobs after 15 minutes of inactivity): QINACTITV CHGSYSVAL SYSVAL(QINACTITV) VALUE(''15'')'
