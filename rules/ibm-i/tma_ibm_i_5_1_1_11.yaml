id: TMA-IBM-I-5.1.1.11
title: Set Create Authority
description: Specifies the default public authority. This lets the public view newly created objects, but not change them. This will ensure the integrity of the newly created objects.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.11 Set Create Authority
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QCRTAUT) (or WRKSYSVAL QCRTAUT) and verify the value is *USE. Remediate with: CHGSYSVAL SYSVAL(QCRTAUT) VALUE(''*USE'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *USE: QCRTAUT CHGSYSVAL SYSVAL(QCRTAUT) VALUE(''*USE'')'
