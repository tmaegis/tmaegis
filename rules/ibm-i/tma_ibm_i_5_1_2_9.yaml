id: TMA-IBM-I-5.1.2.9
title: Set Disconnect-Job Interval
description: Specifies the interval in minutes that a job can be disconnected before the system ends the job. A disconnected job uses up system resources, as well as retaining any locks on objects, and should be ended eventually to avoid this.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.9 Set Disconnect-Job Interval
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QDSCJOBITV) (or WRKSYSVAL QDSCJOBITV) and verify the value is "15" (Times out disconnected jobs after 15 minutes). Remediate with: CHGSYSVAL SYSVAL(QDSCJOBITV) VALUE(''15'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "15" (Times out disconnected jobs after 15 minutes): QDSCJOBITV CHGSYSVAL SYSVAL(QDSCJOBITV) VALUE(''15'')'
