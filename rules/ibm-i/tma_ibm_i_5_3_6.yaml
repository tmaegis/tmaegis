id: TMA-IBM-I-5.3.6
title: NetServer Browse Interval
description: Browse Announcements specify whether the server should announce its presence to the network. For an added measure of security, you can hide IBM i NetServer from the Windows My Network Places.
target: ibm-i
level: 2
severity: low
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.3.6 NetServer Browse Interval
audit:
  type: manual
  command: Type ADDLIBLE NETSRVCMD Type GO NETS Select option 10. Display Attributes Ensure that Browse interval is 0 is displayed Ensure that 0 is displayed for the Browse interval Pending value to ensure no changes are pending.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, do the following: Type ADDLIBLE NETSRVCMD Type CHGNSVA BROWSEITV(*NONE) Type ENDNSV Type STRNSV RESET(*YES)'
