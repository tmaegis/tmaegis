id: TMA-IBM-I-5.1.1.19
title: Set Maximum Sign-on Action
description: Determines the action the system takes when a user reaches the maximum number of sign-on attempts. Disables the user profile when the maximum sign-on limit is reached. This disables the user profile when the number of incorrect sign-on attempts for the user reaches the value in the QMAXSIGN system value, regardless of whether the incorrect sign-on attempts were from the same or different devices.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.19 Set Maximum Sign-on Action
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QMAXSGNACN) (or WRKSYSVAL QMAXSGNACN) and verify the value is "2". Remediate with: CHGSYSVAL SYSVAL(QMAXSGNACN) VALUE(''2'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "2": QMAXSGNACN CHGSYSVAL SYSVAL(QMAXSGNACN) VALUE(''2'')'
