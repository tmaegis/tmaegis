id: TMA-IBM-I-5.1.1.32
title: Set Scan File System Control
description: Controls the integrated file system scanning on the system when exit programs are registered with any of the integrated file system scan-related exit points. This ensures that any failure from the scan exit programs prevents the associated operations, and also disallows the exit program additional access levels.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- permissions
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.32 Set Scan File System Control
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QSCANFSCTL) (or WRKSYSVAL QSCANFSCTL) and verify the value is *ERRFAIL and *NOWRTUPG. Remediate with: CHGSYSVAL SYSVAL(QSCANFSCTL) VALUE(''*ERRFAIL *NOWRTUPG'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *ERRFAIL and *NOWRTUPG: QSCANFSCTL CHGSYSVAL SYSVAL(QSCANFSCTL) VALUE(''*ERRFAIL *NOWRTUPG'')'
