id: TMA-IBM-I-4.9
title: User Profiles With Command Line Access
description: User Profiles with command line access can run commands they are authorized to from a command line. Application user profiles should be limited to menus and restricted from directly running system commands from a command line.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- accounts
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 4.9 User Profiles With Command Line Access
audit:
  type: manual
  command: On a command line, type STRSQL and press Enter Enter the following SQL statement and press Enter. SELECT ALL USER_NAME, STATUS, LMTCPB, SPCAUT FROM QSYS2/USER_INFO T01 WHERE LMTCPB <> '*YES' IBM supplied user profiles will appear in the report and should be excluded from the audit. A list of IBM supplied user profiles can be obtained from the references below.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, change all non-administrative application users to command line capability to *YES: CHGUSRPRF USRPRF(<xxxxxx>) LMTCPB(*YES)'
