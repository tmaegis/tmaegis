id: TMA-IBM-I-5.4.1
title: Configuring SSH - server protocol 2
description: The recommendation is to edit the /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config file and allow the SSH2 protocol only. This is the SSH server configuration file. There are publicly known vulnerabilities in SSH1 protocol, because of which the SSH1 protocol was deprecated in early 2001. SSH2 is a complete re-write of SSH1 with additional security features. All SSH connections should communicate over the SSH2 protocol.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.1 Configuring SSH - server protocol 2
audit:
  type: manual
  command: 'DSPF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type Protocol and press F16 (shift F4) Control: Protocol_________________________________________ The display should yield the following output: Protocol 2'
remediation:
  type: iac_patch
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' file and explicitly define the SSH2 protocol: Replace: #Protocol 2,1 With: Protocol 2 Re-cycle the sshd daemon to pick up the configuration changes:'
