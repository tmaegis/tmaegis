id: TMA-IBM-I-5.1.1.7
title: Set Security Auditing Level Extensions
description: Allows additional space to specify more than sixteen audit values. You can specify more than one value for the QAUDLVL2 system value, unless you specify *NONE. For the QAUDLVL2 system value to take effect, the QAUDCTL system value must include *AUDLVL and the QAUDLVL system value must include *AUDLVL2.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.7 Set Security Auditing Level Extensions
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUDLVL2) (or WRKSYSVAL QAUDLVL2) and verify the value is the value set by CHGSYSVAL SYSVAL(QAUDLVL2) VALUE(*NONE). Remediate with: CHGSYSVAL SYSVAL(QAUDLVL2) VALUE(*NONE)'
remediation:
  type: iac_patch
  command: CHGSYSVAL SYSVAL(QAUDLVL2) VALUE(*NONE)
