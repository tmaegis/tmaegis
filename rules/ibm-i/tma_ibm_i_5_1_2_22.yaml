id: TMA-IBM-I-5.1.2.22
title: Set Remote Sign-on Value
description: Determine whether and how automatic sign-on from a remote system is allowed.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.22 Set Remote Sign-on Value
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QRMTSIGN) (or WRKSYSVAL QRMTSIGN) and verify the value is *FRCSIGNON. Remediate with: CHGSYSVAL SYSVAL(QRMTSIGN) VALUE(''*FRCSIGNON'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *FRCSIGNON: QRMTSIGN CHGSYSVAL SYSVAL(QRMTSIGN) VALUE(''*FRCSIGNON'')'
