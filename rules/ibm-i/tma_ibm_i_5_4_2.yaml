id: TMA-IBM-I-5.4.2
title: Configuring SSH - banner configuration
description: The recommendation is to edit the /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config file and configure a path to a login herald message. The login herald configured previously is not displayed during the initiation of a new SSH connection. Prior to a password being entered the user should accept the terms and conditions of the corporate acceptable usage policy.
target: ibm-i
level: 1
severity: low
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.2 Configuring SSH - banner configuration
audit:
  type: manual
  command: 'DSPF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type Banner and press F16 (shift F4) Control: Banner_________________________________________ The display should yield the following output: Banner /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/ssh_banner'
remediation:
  type: iac_patch
  command: 'Create an SSH banner file: EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/ssh_banner'' Enter appropriate text and save the file. NOTE: The content of the banner file can reflect any internal acceptable usage policy standards EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' file and customize the Banner parameter Replace: #Banner /some/path With: Banner /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/ssh_banner Re-cycle the sshd daemon to pick up the configuration changes:'
