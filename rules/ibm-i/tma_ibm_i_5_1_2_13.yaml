id: TMA-IBM-I-5.1.2.13
title: Set Limit Device Sessions
description: Specifies if users can have concurrent device sessions. This is recommended because limiting users to a single device reduces the likelihood of sharing passwords and leaving devices unattended.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.13 Set Limit Device Sessions
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QLMTDEVSSN) (or WRKSYSVAL QLMTDEVSSN) and verify the value is ''1''. Remediate with: CHGSYSVAL SYSVAL(QLMTDEVSSN) VALUE(''1'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to ''1'': QLMTDEVSSN CHGSYSVAL SYSVAL(QLMTDEVSSN) VALUE(''1'')'
