id: TMA-IBM-I-5.4.5
title: Configuring SSH - set MaxAuthTries to 4 or Less
description: The MaxAuthTries parameter specifies the maximum number of authentication attempts permitted per connection. When the login failure count reaches half the number, error messages will be written to the syslog file detailing the login failure. Setting the MaxAuthTries parameter to a low number will minimize the risk of successful brute force attacks to the SSH server. While the recommended setting is 4, it is set the number based on site policy.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.5 Configuring SSH - set MaxAuthTries to 4 or Less
audit:
  type: manual
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type MaxAuthTries and press F16 (shift F4) Control: MaxAuthTries____________________________________ The display should yield the following output: MaxAuthTries 4'
remediation:
  type: iac_patch
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' file: Replace: #MaxAuthTries 4 With: MaxAuthTries 4 Re-cycle the sshd daemon to pick up the configuration changes:'
