id: TMA-IBM-I-5.4.8
title: Configuring SSH - Limit Access Via SSH
description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended that at least one of the following options be leveraged: AllowUsers The AllowUsers variable gives the system administrator the option of allowing specific users to ssh into the system. The list consists of comma separated user names.'
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.8 Configuring SSH - Limit Access Via SSH
audit:
  type: manual
  command: 'DSPF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type Allow and press F16 (shift F4) Control: Allow_________________________________________ The display should yield the following output: AllowUsers <userlist> AllowGroups <grouplist> DenyUsers <userlist> DenyGroups <grouplist>'
remediation:
  type: iac_patch
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd''_config file: Set one of the following: AllowUsers <userlist> AllowGroups <grouplist> DenyUsers <userlist> DenyGroups <grouplist> Re-cycle the sshd daemon to pick up the configuration changes:'
