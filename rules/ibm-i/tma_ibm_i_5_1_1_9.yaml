id: TMA-IBM-I-5.1.1.9
title: Set Automatic Remote Controller Configuration
description: Determines whether automatic remote workstation controller configuration is enabled.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.9 Set Automatic Remote Controller Configuration
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUTORMT) (or WRKSYSVAL QAUTORMT) and verify the value is "0" (OFF). Remediate with: CHGSYSVAL SYSVAL(QAUTORMT) VALUE(''0'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "0" (OFF): QAUTORMT CHGSYSVAL SYSVAL(QAUTORMT) VALUE(''0'')'
