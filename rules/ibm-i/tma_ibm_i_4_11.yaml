id: TMA-IBM-I-4.11
title: Group Profiles With Passwords
description: Group profiles should not have a password as they are usually not associated with a unique account. Unique accounts provide accountability to the actions they perform.
target: ibm-i
level: 1
severity: high
tags:
- ibm-i
- password-policy
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 4.11 Group Profiles With Passwords
audit:
  type: manual
  command: On a command line, type STRSQL and press Enter Copy or type the following SQL statement to the terminal and press Enter. SELECT All T01.GROUPNAME, T02.NOPWD FROM QSYS2/GROUPLIST T01 INNER JOIN QSYS2/USER_INFO T02 ON T01.GROUPNAME = T02.USER_NAME WHERE T02.NOPWD = 'NO' Verify that the display returns no group profiles with a password (NOPWD = NO).
remediation:
  type: iac_patch
  command: CHGUSRPRF USRPRF(<xxxxxx>) PASSWORD(*NONE) Where USRPRF(<xxxxxx>) in the above example is the group profile/s from the above audit.
