id: TMA-IBM-I-5.2.6
title: NFS Shares
description: Disable NFS completely or force NFSv4 with Kerberos. NFS in general with AUTH_SYS security is not considered a secure protocol. If NFS is used in a L2 environment, NFSv4 should be the only protocol version allowed and RPCSEC_GSS authentication with Kerberos should be required. With the RPCSEC_GSS Kerberos mechanism, the server no longer depends on the client to correctly represent which user is accessing the file, as is the case with AUTH_SYS.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.6 NFS Shares
audit:
  type: manual
  command: CALL QCMD Press F10 to include detailed messages CALL QZNFRTVE Place your cursor on each of the exports and press F1 to display the export Ensure that on the detailed message that VERS=4, SEC=KRB5 is displayed NFSv4 should be the only protocol version allowed and RPCSEC_GSS authentication with Kerberos should be required.
remediation:
  type: iac_patch
  command: 'To change existing exports to require NFSv4 and RPCSEC_GSS authentication with Kerberos you can either modify the /etc/exports file or use the CHGNFSEXP command. Specify VERS=4 and SEC=KRB5 and any additional required options. Example: CHGNFSEXP ''-O XX,VERS=4,SEC=KRB5'' ''/xxxxxx'' A sample entry in /etc/exports might look like: /home/data -vers=4,sec=krb5.'
