id: TMA-IBM-I-5.1.2.8
title: Set Create Object Audit Level
description: Determines the default object auditing level for new objects. An audit record is written for any security relevant action that affects the read or change of all newly created objects.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.8 Set Create Object Audit Level
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QCRTOBJAUD) (or WRKSYSVAL QCRTOBJAUD) and verify the value is *ALL. Remediate with: CHGSYSVAL SYSVAL(QCRTOBJAUD) VALUE(''*ALL'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *ALL: QCRTOBJAUD CHGSYSVAL SYSVAL(QCRTOBJAUD) VALUE(''*ALL'')'
