id: TMA-IBM-I-5.1.2.14
title: Set Limit Security Officer Access to Workstations
description: Limits users with *ALLOBJ or *SERVICE special authority to authorized devices. This system value controls whether users with *ALLOBJ or *SERVICE special authorities need explicit authority to specific work stations.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- permissions
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.14 Set Limit Security Officer Access to Workstations
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QLMTSECOFR) (or WRKSYSVAL QLMTSECOFR) and verify the value is "1". Remediate with: CHGSYSVAL SYSVAL(QLMTSECOFR) VALUE(''1'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "1": QLMTSECOFR CHGSYSVAL SYSVAL(QLMTSECOFR) VALUE(''1'')'
