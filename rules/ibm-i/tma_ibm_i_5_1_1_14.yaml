id: TMA-IBM-I-5.1.1.14
title: Set Force Conversion On Restore
description: Determines under what conditions objects will be forced to convert when they are being restored to the system. When an object is translated it is recompiled using a trusted translator guaranteed not to circumvent the integrity of the system. (See also QALWOBJRST & QVFYOBJRST, 2.1.1.1 and 2.1.1.49) This setting attempts to strike a balance between ensuring system integrity and incurring the overhead of recompiling programs that do not appear to have been altered.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.14 Set Force Conversion On Restore
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QFRCCVNRST) (or WRKSYSVAL QFRCCVNRST) and verify the value is "3". Remediate with: CHGSYSVAL SYSVAL(QFRCCVNRST) VALUE(''3'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "3": QFRCCVNRST CHGSYSVAL SYSVAL(QFRCCVNRST) VALUE(''3'')'
