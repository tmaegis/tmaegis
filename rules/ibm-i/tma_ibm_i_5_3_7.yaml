id: TMA-IBM-I-5.3.7
title: Malware Defenses
description: The Integrated File System (IFS) is a part of the IBM i operating system. It supports stream input/output and storage management similar to personal computer and UNIX operating systems. An infected file that is copied, moved, or saved from a PC to the IFS and then redistributed to another PC can transmit a virus to the new PC.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.3.7 Malware Defenses
audit:
  type: manual
  command: Evaluate your system requirements and ensure that any installed anti-virus product is updated and meets your organization's requirements.
remediation:
  type: iac_patch
  command: Evaluate Scanning Options and 3rd party anti-virus products to adequately protect your system. See information on NetServer Shares for more information. Additionally, review information on system values QSCANFS and QSCANFSCTL
