id: TMA-IBM-I-5.1.2.5
title: Set Auditing Force Level
description: Determines how many auditing journal entries records are cached in memory before they are physically written to disk from memory. This will provide the best auditing performance.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.5 Set Auditing Force Level
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUDFRCLVL) (or WRKSYSVAL QAUDFRCLVL) and verify the value is "1". Remediate with: CHGSYSVAL SYSVAL(QAUDFRCLVL) VALUE(1)'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "1": QAUDFRCLVL CHGSYSVAL SYSVAL(QAUDFRCLVL) VALUE(1)'
