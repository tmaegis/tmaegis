id: TMA-IBM-I-5.2.2
title: DDM Remote Configuration List (SNA) Attributes
description: The Secure Location (SECURELOC) defines how security information is handled for program start requests received from remote system. Setting SECURELOC to a value of *NO specifies that the local system is not a secure system. All DDM Remote Configuration List entries shall specify *VFYENCPWD for the Secure Location (SECURELOC) parameter.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.2 DDM Remote Configuration List (SNA) Attributes
audit:
  type: manual
  command: DSPCFGL CFGL(QAPPNRMT) -Note that if you receive the message "Configuration list QAPPNRMT not found", this indicates that your system is not configured for DDM over SNA and this setting is irrelevant. Ensure that all Secure Loc parameters = *VFYENCPWD.
remediation:
  type: iac_patch
  command: To establish the recommended configuration, change all Remote Location Secure Loc parameters to *VFYENCPWD. WRKCFGL CFGL(QAPPNRMT) Select 2 to change the QAPPNRMT Configuration List Change all Secure Loc parameters to *VFYENCPWD
