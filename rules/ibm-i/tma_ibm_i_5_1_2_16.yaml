id: TMA-IBM-I-5.1.2.16
title: Set Maximum Sign-on Attempts
description: Determines the maximum number of invalid sign-on attempts a user is allowed. This setting helps to prevent unauthorized access into user profiles by giving the user a limited number of login attempts before disabling the user profile
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.16 Set Maximum Sign-on Attempts
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QMAXSIGN) (or WRKSYSVAL QMAXSIGN) and verify the value is "3". Remediate with: CHGSYSVAL SYSVAL(QMAXSIGN) VALUE(''3'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "3": QMAXSIGN CHGSYSVAL SYSVAL(QMAXSIGN) VALUE(''3'')'
