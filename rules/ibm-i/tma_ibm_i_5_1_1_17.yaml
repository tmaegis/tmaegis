id: TMA-IBM-I-5.1.1.17
title: Set Limit Device Sessions
description: Specifies if users can have concurrent device sessions.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.17 Set Limit Device Sessions
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QLMTDEVSSN) (or WRKSYSVAL QLMTDEVSSN) and verify the value is any value between 1 and 9. Remediate with: CHGSYSVAL SYSVAL(QLMTDEVSSN) VALUE(<x>)'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to any value between 1 and 9: QLMTDEVSSN CHGSYSVAL SYSVAL(QLMTDEVSSN) VALUE(<x>)'
