id: TMA-IBM-I-5.2.5
title: NFS Shares
description: The Network File System (NFS) provides the user with access to data and objects that are stored on a remote NFS server. In addition, any file system mounted locally through the Network File System will have the features, characteristics, limitations, and dependencies of the directory or file system it was mounted from on the remote server.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.5 NFS Shares
audit:
  type: manual
  command: CALL QCMD Press F10 to include detailed messages CALL QZNFRTVE Place your cursor on each of the exports and press F1 to display the export Ensure that on the detailed message that "ANON=4294967295(*NONE)" is displayed Configure NFS on the remote host so that only authorized hosts can mount its remote shares.
remediation:
  type: iac_patch
  command: 'To change existing exports that allow anonymous access you can either modify the /etc/exports file or use the CHGNFSEXP command. Specify the ANON=-1 option and any additional required options. Example: CHGNFSEXP ''-O XX,ANON=-1'' ''/xxxxxx'' A sample entry in /etc/exports might look like: /home/data -anon=-1.'
