id: TMA-IBM-I-5.1.2.1
title: Set Allow Restoration of Security-Sensitive Objects
description: Does not allow objects with security-sensitive attributes to be restored. Because some programs may cause serious problems, this system value provides a method to protect your system.
target: ibm-i
level: 2
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.1 Set Allow Restoration of Security-Sensitive Objects
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QALWOBJRST) (or WRKSYSVAL QALWOBJRST) and verify the value is *NONE. Remediate with: CHGSYSVAL SYSVAL(QALWOBJRST) VALUE(''*NONE'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *NONE: QALWOBJRST CHGSYSVAL SYSVAL(QALWOBJRST) VALUE(''*NONE'')'
