id: TMA-IBM-I-5.1.1.31
title: Set Scan File System
description: Specifies the integrated file system in which objects will be scanned when exit programs are registered with any of the integrated file system scan-related exit points. This provides an additional layer of security because this option can be used to scan for a virus.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- permissions
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.31 Set Scan File System
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QSCANFS) (or WRKSYSVAL QSCANFS) and verify the value is *ROOTOPNUD. Remediate with: CHGSYSVAL SYSVAL(QSCANFS) VALUE(''*ROOTOPNUD'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *ROOTOPNUD: QSCANFS CHGSYSVAL SYSVAL(QSCANFS) VALUE(''*ROOTOPNUD'')'
