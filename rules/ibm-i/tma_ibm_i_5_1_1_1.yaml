id: TMA-IBM-I-5.1.1.1
title: Set Allow Restoration of Security-Sensitive Objects
description: Determines if the system will allow authorized users to restore system-state objects or programs that adopt authority to the system. System administrators must use this privileged access to restore objects frequently as a part of their routine IBM-supplied PTF O/S maintenance as well as related to back-up and recovery processes for applications.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.1 Set Allow Restoration of Security-Sensitive Objects
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QALWOBJRST) (or WRKSYSVAL QALWOBJRST) and verify the value is *ALWPTF. Remediate with: CHGSYSVAL SYSVAL(QALWOBJRST) VALUE(''*ALWPTF'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *ALWPTF: QALWOBJRST CHGSYSVAL SYSVAL(QALWOBJRST) VALUE(''*ALWPTF'')'
