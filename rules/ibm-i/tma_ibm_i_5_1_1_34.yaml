id: TMA-IBM-I-5.1.1.34
title: Set Shared Memory Control
description: Controls whether or not users are allowed to use shared memory APIs or mapped memory objects that have write capability to modify shared memory.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.34 Set Shared Memory Control
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QSHRMEMCTL) (or WRKSYSVAL QSHRMEMCTL) and verify the value is "1". Remediate with: CHGSYSVAL SYSVAL(QSHRMEMCTL) VALUE(''1'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following value to "1": QSHRMEMCTL CHGSYSVAL SYSVAL(QSHRMEMCTL) VALUE(''1'')'
