id: TMA-IBM-I-5.4.6
title: Configuring SSH - set Idle Timeout Interval for User Login
description: The two options ClientAliveInterval and ClientAliveCountMax control the timeout of ssh sessions. When the ClientAliveInterval variable is set, ssh sessions that have no activity for the specified length of time are terminated. When the ClientAliveCountMax variable is set, sshd will send client alive messages at every ClientAliveInterval interval.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- ssh
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.4.6 Configuring SSH - set Idle Timeout Interval for User Login
audit:
  type: manual
  command: 'DSPF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' On the Control field, type ClientAliveCountMax and press F16 (shift F4) Control: ClientAliveCountMax__________________________________ Verify the ClientAliveInterval is between 1 and 300 and ClientAliveCountMax is 0: ClientAliveCountMax 0 ClientAliveInterval 300'
remediation:
  type: iac_patch
  command: 'EDTF ''/QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config'' file: Replace: #ClientAliveCountMax 0 #ClientAliveInterval 300 With: ClientAliveCountMax 0 ClientAliveInterval 300 Re-cycle the sshd daemon to pick up the configuration changes:'
