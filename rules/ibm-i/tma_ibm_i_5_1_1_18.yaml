id: TMA-IBM-I-5.1.1.18
title: Set Limit Security Officer Access to Workstations
description: Limits users with *ALLOBJ or *SERVICE special authority to authorized devices.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- permissions
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.18 Set Limit Security Officer Access to Workstations
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QLMTSECOFR) (or WRKSYSVAL QLMTSECOFR) and verify the value is "0". Remediate with: CHGSYSVAL SYSVAL(QLMTSECOFR) VALUE(''0'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "0": QLMTSECOFR CHGSYSVAL SYSVAL(QLMTSECOFR) VALUE(''0'')'
