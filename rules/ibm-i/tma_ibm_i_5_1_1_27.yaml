id: TMA-IBM-I-5.1.1.27
title: Set Retain Server Security
description: The Retain Server Security Data (QRETSVRSEC) system value is no longer used. The QRETSVRSEC system value no longer needs to be set to '1' to retain the security data needed by a server for authentication. This includes the Server Authentication Entry interfaces and the Validation List (*VLDL) interfaces.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.27 Set Retain Server Security
audit:
  type: manual
  command: 'Verify the configuration described in CIS IBM i V7R5M0 Benchmark v2.1.0 section 5.1.1.27: The Retain Server Security Data (QRETSVRSEC) system value is no longer used. The QRETSVRSEC system value no longer needs to be set to ''1'' to retain the security data needed by a server for authentication.'
remediation:
  type: iac_patch
  command: Apply the remediation in CIS IBM i V7R5M0 Benchmark v2.1.0 section 5.1.1.27.
