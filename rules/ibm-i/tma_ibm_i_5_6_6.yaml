id: TMA-IBM-I-5.6.6
title: System Service Tools IDs and Privileges
description: This policy setting determines the functional privileges of System Service Tool Users. All System Service Tools Users are powerful administrators. Service Tools Users should follow the same policy as Operating System Users.
target: ibm-i
level: 1
severity: high
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.6.6 System Service Tools IDs and Privileges
audit:
  type: manual
  command: 1. Type DSPSSTUSR and press Enter. 2. Review the screen output information with your system administrator and ensure that all SST users have unique profiles. Do not use the shipped IBM User IDs. 3. Ensure that all Service Tools IDs have the proper functional privileges for their job roles.
remediation:
  type: iac_patch
  command: Disable/Remove default and inactive IDs and ensure that each ID has the required privileges. Ensure that each unique SST ID has privileges commensurate with the Principle of Least Privilege for each unique job role.
