id: TMA-IBM-I-5.2.7
title: Exit Points
description: The IBM i provides several host servers and related objects that are common for the IBM® i Access family. For each Host server, IBM provides one or more exit points to control the activity of the host server. The registration facility (WRKREGINF) shows information about IBM® i exit points and their associated exit programs.
target: ibm-i
level: 1
severity: high
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.7 Exit Points
audit:
  type: manual
  command: 'On a command line, type STRSQL and press Enter Copy or type the following SQL statement to the terminal and press Enter. SELECT T01.EXIT_NAME, T01.EXIT_FMT, T01.REGISTERED, T01.EXIT_PGMS, T02.NUMBER, T02.LIBRARY, T02."PROGRAM", T02.TEXT FROM QSYS2/EXIT_POINT T01 LEFT OUTER JOIN QSYS2/EXIT_PGM T02 ON T01.EXIT_NAME = T02.EXIT_NAME WHERE T01.EXIT_NAME LIKE ''QIBM_QTMF%'' OR T01.EXIT_NAME LIKE ''QIBM_QZRC_RMT%'' OR T01.EXIT_NAME LIKE ''QIBM_QMF_MESSAGE%'' OR T01.EXIT_NAME LIKE ''QIBM_QZDA%'' OR T01.EXIT_NAME LIKE ''QIBM_QZRC%'' OR T01.EXIT_NAME LIKE ''QIBM_QDB_OPEN%'' OR ... (full steps: CIS section 5.2.7)'
remediation:
  type: iac_patch
  command: Write or purchase user exit programs and register to associated exit points using the WRKREGINF and ADDEXITPGM commands.
