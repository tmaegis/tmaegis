id: TMA-IBM-I-5.2.13
title: SNMP Access
description: SNMPv3 allows SNMP access based on the configuration of SNMPv3 users. These users are not the same as an IBM i user profile. The authentication and privacy protocols used by SNMPv3 provide enhanced security over SNMPv1. SNMPv3 is highly recommended because it provides enhanced security over SNMPv1. An SNMPv1 community name is not encrypted, and is therefore vulnerable to packet sniffing.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- network
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.2.13 SNMP Access
audit:
  type: manual
  command: Type command CHGSNMPA and press F4. Page down several times and ensure that Allow SNMPv3 support is set to a value of *V3ONLY.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, change SNMP to use *V3ONLY only: CHGSNMPA ALWSNMPV3(*V3ONLY)'
