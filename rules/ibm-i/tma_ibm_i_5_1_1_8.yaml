id: TMA-IBM-I-5.1.1.8
title: Set Automatic Device Configuration
description: Specifies whether locally attached devices are configured automatically. Automatic configuration changes the device description to match the keyboard attached. You may not want to use automatic configuration if you are using manual configuration to set up a device with a different keyboard type than the hardware reports.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.8 Set Automatic Device Configuration
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUTOCFG) (or WRKSYSVAL QAUTOCFG) and verify the value is "0" (OFF). Remediate with: CHGSYSVAL SYSVAL(QAUTOCFG) VALUE(''0'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "0" (OFF): QAUTOCFG CHGSYSVAL SYSVAL(QAUTOCFG) VALUE(''0'')'
