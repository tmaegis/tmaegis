id: TMA-IBM-I-5.1.1.30
title: Set Remote Service Attribute
description: Determines if the remote system service ability is enabled.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- services
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.30 Set Remote Service Attribute
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QRMTSRVATR) (or WRKSYSVAL QRMTSRVATR) and verify the value is "0". Remediate with: CHGSYSVAL SYSVAL(QRMTSRVATR) VALUE(''0'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "0": QRMTSRVATR CHGSYSVAL SYSVAL(QRMTSRVATR) VALUE(''0'')'
