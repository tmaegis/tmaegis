id: TMA-IBM-I-5.1.1.39
title: Set Use Adopted Authority
description: Controls those users allowed to create or change programs that use adopted authority from other programs that call it. If an authorization list is specified, *PUBLIC(EXCLUDE) should be used.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.39 Set Use Adopted Authority
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QUSEADPAUT) (or WRKSYSVAL QUSEADPAUT) and verify the value is the value set by CHGSYSVAL SYSVAL(QUSEADPAUT) VALUE(QUSEADPAUT). Remediate with: CHGSYSVAL SYSVAL(QUSEADPAUT) VALUE(QUSEADPAUT)'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, enter a name for the authorization list for the following system value: QUSEADPAUT CRTAUTL AUTL(QUSEADPAUT) AUT(*EXCLUDE) CHGOBJOWN OBJ(QUSEADPAUT) OBJTYPE(*AUTL) NEWOWN(QSYS) CHGSYSVAL SYSVAL(QUSEADPAUT) VALUE(QUSEADPAUT)'
