id: TMA-IBM-I-5.5.1
title: IBM i Patch Management
description: This settings describes the IBM i patch management process. Important IBM i updates are obtained through PTF (Program Temporary Fix) levels. Updates can contain important bug fixes and/or security patches, and should be installed as soon as possible.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.5.1 IBM i Patch Management
audit:
  type: manual
  command: On a command line, type STRSQL and press Enter Enter the following SQL statement and press Enter. SELECT ALL GRP_CRNCY, GRP_ID, GRP_LVL, GRP_IBMLVL, GRP_LSTUPD, GRP_RLS, GRP_SYSSTS, GRP_TITLE FROM SYSTOOLS/GRPPTFCUR T01 WHERE GRP_ID IN ('SF99958', 'SF99955', 'SF99952', 'SF99959') The following 4 PTF Groups should show that the INSTALLED LEVEL IS CURRENT. SF99958 750 Group Security SF99955 750 Java SF99952 750 IBM HTTP Server for i SF99959 750 Group Hiper
remediation:
  type: iac_patch
  command: Download and apply the current PTF group levels.
