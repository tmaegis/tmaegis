id: TMA-IBM-I-5.1.1.13
title: Set Display User Sign-on Information
description: Specifies whether the sign-on information display appears when a user signs on. Promotes logon monitoring. This is recommended so that users can monitor attempted use of their profiles.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- accounts
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.13 Set Display User Sign-on Information
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QDSPSGNINF) (or WRKSYSVAL QDSPSGNINF) and verify the value is "1" (ON). Remediate with: CHGSYSVAL SYSVAL(QDSPSGNINF) VALUE(''1'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "1" (ON): QDSPSGNINF CHGSYSVAL SYSVAL(QDSPSGNINF) VALUE(''1'')'
