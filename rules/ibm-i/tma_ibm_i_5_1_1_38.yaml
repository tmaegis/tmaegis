id: TMA-IBM-I-5.1.1.38
title: Set System Library List
description: The system library list (QSYSLIBL) system value is used as the first part of the library list associated with a job. The libraries in the system part of the library list of a job are searched before any other libraries in the library list of a job. The list can contain as many as 15 names. The security of the System Library List is a vital part of your overall system security. All libraries in the System Library List should provide *PUBLIC *USE authority.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.38 Set System Library List
audit:
  type: manual
  command: DSPSYSVAL SYSVAL(QSYSLIBL) Make note of all Libraries in the System part of the library list DSPOBJAUT OBJ(<xxxxxx>) OBJTYPE(*LIB) For each library in the list Ensure that each library in the list grants *PUBLIC *USE Object Authority and that any additional Users with an authority greater than *USE are properly authorized by the business to introduce changes into the library.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the *PUBLIC authority to *USE to all libraries in the System part of the library list QSYSLIBL that grant an authority greater than *USE: GRTOBJAUT OBJ(<xxxxxx>) OBJTYPE(*LIB) USER(*PUBLIC) AUT(*USE) REPLACE(*YES)'
