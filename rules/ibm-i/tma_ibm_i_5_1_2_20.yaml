id: TMA-IBM-I-5.1.2.20
title: Set Password Rules
description: Specifies the rules used to check whether a password is formed correctly. This provides additional security by having a system in place to verify if a password meets the specified rules set.
target: ibm-i
level: 2
severity: high
tags:
- ibm-i
- password-policy
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.20 Set Password Rules
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QPWDRULES) (or WRKSYSVAL QPWDRULES) and verify the value is the value set by CHGSYSVAL SYSVAL(QPWDRULES) VALUE(''*ALLCRTCHG *LMTPRFNAME *MAXLEN128 *MINLEN14 *REQANY3''). Remediate with: CHGSYSVAL SYSVAL(QPWDRULES) VALUE(''*ALLCRTCHG *LMTPRFNAME *MAXLEN128 *MINLEN14 *REQANY3'')'
remediation:
  type: iac_patch
  command: CALL QCMD CHGSYSVAL SYSVAL(QPWDRULES) VALUE('*ALLCRTCHG *LMTPRFNAME *MAXLEN128 *MINLEN14 *REQANY3')
