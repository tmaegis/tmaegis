id: TMA-IBM-I-5.3.1
title: IBM i NetServer Guest Profile
description: 'This policy setting determines whether a Guest account is configured. The Guest account allows unauthenticated network users to gain access to the system. The recommended state for this setting is: *NONE. The default Guest account allows unauthenticated network users to log on as Guest with no password. These unauthorized users could access any resources that are accessible to the Guest account over the network.'
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- accounts
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.3.1 IBM i NetServer Guest Profile
audit:
  type: manual
  command: Type ADDLIBLE NETSRVCMD Type GO NETS Select option 10. Display Attributes Ensure that Guest profile *NONE is displayed Ensure that *SAME is displayed for the Guest profile Pending value to ensure no changes are pending.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, do the following: Type ADDLIBLE NETSRVCMD Type CHGNSVA GUESTPRF(*NONE) Type ENDNSV Type STRNSV RESET(*YES)'
