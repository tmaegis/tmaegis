id: TMA-IBM-I-5.1.2.21
title: Set Password Validation Program
description: This provides the ability for a user-written program to do additional validation on passwords. This provides additional security by using the programs to do additional checking of user-assigned passwords before they are accepted by the system.
target: ibm-i
level: 2
severity: high
tags:
- ibm-i
- password-policy
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.2.21 Set Password Validation Program
audit:
  type: manual
  command: DSPSYSVAL SYSVAL(QPWDVLDPGM) Ensure that the value specified the name of a Password Validation Program or *REGFAC.
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, create a password validation program and set the following system value to either a value of the name of your program and library or *REGFAC: QPWDVLDPGM CHGSYSVAL SYSVAL(QPWDVLDPGM) VALUE(<pgmxxx libxxx>) Note that if using a value of *REGFAC, you must also register the program to the QIBM_QSY_VLD_PASSWRD exit point, format VLDP0200. ADDEXITPGM EXITPNT(QIBM_QSY_VLD_PASSWRD) FORMAT(VLDP0200) PGMNBR(*HIGH) PGM(<libxxx/pgmxxx>) See the References for additional information.'
