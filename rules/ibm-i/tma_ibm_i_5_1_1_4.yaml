id: TMA-IBM-I-5.1.1.4
title: Set Auditing End Action
description: Determines the action the system should take if it is unable to continue auditing (e.g. the audit record is full). System continues to operate but sends a message to the system operator and to the QSYS/QSYSMSG of the message.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- audit
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.4 Set Auditing End Action
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QAUDENDACN) (or WRKSYSVAL QAUDENDACN) and verify the value is *NOTIFY. Remediate with: CHGSYSVAL SYSVAL(QAUDENDACN) VALUE(''*NOTIFY'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to *NOTIFY: QAUDENDACN CHGSYSVAL SYSVAL(QAUDENDACN) VALUE(''*NOTIFY'')'
