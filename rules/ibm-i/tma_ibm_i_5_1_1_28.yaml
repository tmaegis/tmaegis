id: TMA-IBM-I-5.1.1.28
title: Set Remote IPL
description: Determines if an operator is allowed to IPL the machine remotely. Disabling this provides additional security by not allowing power-on and restart to be done remotely.
target: ibm-i
level: 1
severity: medium
tags:
- ibm-i
- hardening
reference: CIS IBM i V7R5M0 Benchmark v2.1.0 - 5.1.1.28 Set Remote IPL
audit:
  type: manual
  command: 'Run DSPSYSVAL SYSVAL(QRMTIPL) (or WRKSYSVAL QRMTIPL) and verify the value is "0". Remediate with: CHGSYSVAL SYSVAL(QRMTIPL) VALUE(''0'')'
remediation:
  type: iac_patch
  command: 'To establish the recommended configuration, set the following system value to "0": QRMTIPL CHGSYSVAL SYSVAL(QRMTIPL) VALUE(''0'')'
