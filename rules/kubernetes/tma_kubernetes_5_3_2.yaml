id: TMA-KUBERNETES-5.3.2
title: Ensure that all Namespaces have Network Policies defined
description: Use network policies to isolate traffic in your cluster network. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions. Lists namespaces without any NetworkPolicy. The benchmark marks this Manual; this audit automates its kubectl inventory step.
target: kubernetes
level: 2
severity: medium
tags:
- kubernetes
- policies
- network
reference: CIS Kubernetes Benchmark v2.1.0 - 5.3.2 Ensure that all Namespaces have Network Policies defined
audit:
  type: command
  command: |-
    ns=$(kubectl get namespaces -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}') || exit 1
    np=$(kubectl get networkpolicies -A -o go-template='{{range .items}}{{.metadata.namespace}}{{"\n"}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$ns" | awk -v ex='^(kube-system|kube-public|kube-node-lease)$' 'NF && $1 !~ ex' | grep -vxF "$(printf '%s\n' "$np" | sort -u)")
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | sed 's/^/no NetworkPolicy: /' | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: Follow the documentation and create NetworkPolicy objects as you need them.
