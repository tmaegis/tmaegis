id: TMA-KUBERNETES-5.6.2
title: Ensure that the seccomp profile is set to docker/default in your pod definitions
description: Enable docker/default seccomp profile in your pod definitions. The benchmark marks this recommendation Manual.
target: kubernetes
level: 2
severity: low
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.6.2 Ensure that the seccomp profile is set to docker/default in your pod definitions
audit:
  type: manual
  command: 'Review the pod definitions in your cluster. It should create a line as below: securityContext: seccompProfile: type: RuntimeDefault'
remediation:
  type: iac_patch
  command: 'Use security context to enable the docker/default seccomp profile in your pod definitions. An example is as below: securityContext: seccompProfile: type: RuntimeDefault'
