id: TMA-KUBERNETES-4.2.13
title: Ensure that a limit is set on pod PIDs
description: Ensure that the Kubelet sets limits on the number of PIDs that can be created by pods running on the node. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
reference: CIS Kubernetes Benchmark v2.1.0 - 4.2.13 Ensure that a limit is set on pod PIDs
audit:
  type: manual
  command: Review the Kubelet's start-up parameters for the value of --pod-max-pids, and check the Kubelet configuration file for the PodPidsLimit . If neither of these values is set, then there is no limit in place.
remediation:
  type: iac_patch
  command: Decide on an appropriate level for this parameter and set it, either via the --pod-max-pids command line parameter or the PodPidsLimit configuration file setting.
