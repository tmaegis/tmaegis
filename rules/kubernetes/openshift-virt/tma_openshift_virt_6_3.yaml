id: TMA-OPENSHIFT-VIRT-6.3
title: Ensure all CPU vulnerabilities are mitigated
description: Ensure that all known CPU vulnerabilities are mitigated. This ensures that known attacks, such as Spectre, Meltdown, etc. either do not affect the node or are mitigated via software. The benchmark marks this recommendation Manual; TMAegis reports it as a manual review item with the audit steps.
target: openshift-virt
level: 1
severity: medium
tags:
- openshift-virt
- manual-review
reference: CIS Red Hat OpenShift Virtual Machine Extension Benchmark v1.0.0 - 6.3 Ensure all CPU vulnerabilities are mitigated
audit:
  type: manual
  command: 'View CPU mitigations: $ ls /sys/devices/system/cpu/vulnerabilities Output may resemble the following: "Not affected" CPU is not affected by the vulnerability "Vulnerable" CPU is affected and no mitigation in effect "Mitigation: $M" CPU is affected and mitigation $M is in effect'
remediation:
  type: iac_patch
  command: Add the appropriate kernel arguments to the MachineConfigPools of the workers nodes and reboot them. See Documentation Chapter 1.Customizing nodes | Red Hat Product Documentation
