id: TMA-KUBERNETES-3.1.1
title: Client certificate authentication should not be used for users
description: Kubernetes provides the option to use client certificates for user authentication. However as there is no way to revoke these certificates when a user leaves an organization or loses their credential, they are not suitable for this purpose. It is not possible to fully disable client certificate use within a cluster as it is used for component to component authentication. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- control-plane
reference: CIS Kubernetes Benchmark v2.1.0 - 3.1.1 Client certificate authentication should not be used for users
audit:
  type: manual
  command: Review user access to the cluster and ensure that users are not making use of Kubernetes client certificate authentication.
remediation:
  type: iac_patch
  command: Alternative mechanisms provided by Kubernetes such as the use of OIDC should be implemented in place of client certificates.
