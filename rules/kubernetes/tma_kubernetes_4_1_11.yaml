id: TMA-KUBERNETES-4.1.11
title: Ensure that the kubelet drop-in configuration directory and files have restrictive permissions
description: If the kubelet is configured with a drop-in configuration directory (--config-dir), ensure the directory and all .conf files within it have ownership set to root:root with permissions 755 for the directory and 644 for the files. Runs on each node; passes when the kubelet does not use --config-dir.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
- kubelet
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.11 Ensure that the kubelet drop-in configuration directory and files have restrictive permissions
audit:
  type: command
  command: |-
    set -f
    psarg() { ps -eo args 2>/dev/null | grep -E "^([^ ]*/)?$1( |\$)" | head -n 1 | awk -v k="--$2" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    d=$(psarg kubelet config-dir)
    if [ -z "$d" ]; then echo compliant; exit 0; fi
    [ -d "$d" ] || exit 1
    ok=1
    p=$(stat -Lc %a "$d") || exit 1; o=$(stat -Lc %U:%G "$d") || exit 1
    if [ $((0$p & 0022)) -ne 0 ] || [ "$o" != root:root ]; then echo "noncompliant: $d $p $o"; ok=0; fi
    for f in "$d"/*.conf; do
      [ -e "$f" ] || continue
      p=$(stat -Lc %a "$f") || exit 1; o=$(stat -Lc %U:%G "$f") || exit 1
      if [ $((0$p & 0133)) -ne 0 ] || [ "$o" != root:root ]; then echo "noncompliant: $f $p $o"; ok=0; fi
    done
    if [ "$ok" -eq 1 ]; then echo compliant; fi
  expected_output: compliant
  requires_file:
  - /var/lib/kubelet/config.yaml
  - /etc/kubernetes/kubelet.conf
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    set -f
    psarg() { ps -eo args 2>/dev/null | grep -E "^([^ ]*/)?$1( |\$)" | head -n 1 | awk -v k="--$2" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    d=$(psarg kubelet config-dir)
    if [ -z "$d" ]; then echo compliant; exit 0; fi
    [ -d "$d" ] || exit 1
    chmod go-w "$d"; chown root:root "$d"
    for f in "$d"/*.conf; do [ -e "$f" ] || continue
      p=$(stat -Lc %a "$f"); chmod "$(printf '%o' $(( (0$p) & ~0133 & 07777 )))" "$f"; chown root:root "$f"; done
  guidance: "# Set directory permissions chown root:root /etc/kubernetes/kubelet.conf.d chmod 755 /etc/kubernetes/kubelet.conf.d # Set file permissions chown root:root /etc/kubernetes/kubelet.conf.d/*.conf chmod 644 /etc/kubernetes/kubelet.conf.d/*.conf"
