id: TMA-KUBERNETES-1.2.4
title: Ensure that the --kubelet-client-certificate and --kubelet-client-key arguments are set as appropriate
description: Enable certificate based kubelet authentication. Audited on control-plane nodes from the running process arguments (falls back to the kubeadm static pod manifest); SKIPs on nodes without that manifest.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- api-server
- kubelet
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.4 Ensure that the --kubelet-client-certificate and --kubelet-client-key arguments are set as appropriate
audit:
  type: command
  command: |-
    set -f
    a=$(ps -eo args 2>/dev/null | grep -E '^([^ ]*/)?kube-apiserver( |$)' | head -n 1)
    [ -n "$a" ] || a=$(sed -n 's/^[[:space:]]*-[[:space:]]*"\{0,1\}\(--[^"]*\)"\{0,1\}[[:space:]]*$/\1/p' /etc/kubernetes/manifests/kube-apiserver.yaml | tr '\n' ' ')
    [ -n "$a" ] || exit 1
    g() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    has() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++) if($i==k||index($i,k"=")==1) f=1} END{exit !f}'; }
    ok=1
    v=$(g kubelet-client-certificate); [ -n "$v" ] || { echo "noncompliant: --kubelet-client-certificate not set"; ok=0; }
    v=$(g kubelet-client-key); [ -n "$v" ] || { echo "noncompliant: --kubelet-client-key not set"; ok=0; }
    if [ "$ok" -eq 1 ]; then echo compliant; fi
  expected_output: compliant
  requires_file:
  - /etc/kubernetes/manifests/kube-apiserver.yaml
remediation:
  type: iac_patch
  command: Follow the Kubernetes documentation and set up the TLS connection between the apiserver and kubelets. Then, edit API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml on the Control Plane node and set the kubelet client certificate and key parameters as below. --kubelet-client-certificate=<path/to/client-certificate-file> --kubelet-client-key=<path/to/client-key-file>
