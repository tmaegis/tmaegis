id: TMA-KUBERNETES-3.2.2
title: Ensure that the audit policy covers key security concerns
description: Ensure that the audit policy created for the cluster covers key security concerns. The benchmark marks this recommendation Manual.
target: kubernetes
level: 2
severity: medium
tags:
- kubernetes
- control-plane
- logging
reference: CIS Kubernetes Benchmark v2.1.0 - 3.2.2 Ensure that the audit policy covers key security concerns
audit:
  type: manual
  command: Review the audit policy provided for the cluster and ensure that it covers at least the following areas :-• Access to Secrets managed by the cluster. Care should be taken to only log Metadata for requests to Secrets, ConfigMaps, and TokenReviews, in order to avoid the risk of logging sensitive data. • Modification of pod and deployment objects. • Use of pods/exec, pods/portforward, pods/proxy and services/proxy. • Use of the CertificateSigningRequest API which allows for creation of new credentials.
remediation:
  type: iac_patch
  command: Consider modification of the audit policy in use on the cluster to include these items, at a minimum.
