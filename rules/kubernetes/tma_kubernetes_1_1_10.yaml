id: TMA-KUBERNETES-1.1.10
title: Ensure that the Container Network Interface file ownership is set to root:root
description: Ensure that the Container Network Interface files have ownership set to root:root. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- control-plane
- network
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 1.1.10 Ensure that the Container Network Interface file ownership is set to root:root
audit:
  type: manual
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, stat -c %U:%G <path/to/cni/files> Verify that the ownership is set to root:root.
remediation:
  type: iac_patch
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, chown root:root <path/to/cni/files>
