id: TMA-KUBERNETES-4.1.9
title: If the kubelet config.yaml configuration file is being used validate permissions set to 600 or more restrictive
description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions of 600 or more restrictive. Runs on each node; the path can be overridden with the kubelet_config_yaml environment variable (as in CIS-CAT).
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
- kubelet
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.9 If the kubelet config.yaml configuration file is being used validate permissions set to 600 or more restrictive
audit:
  type: command
  command: |-
    set -f
    psarg() { ps -eo args 2>/dev/null | grep -E "^([^ ]*/)?$1( |\$)" | head -n 1 | awk -v k="--$2" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    p0=$(psarg kubelet config)
    f=""; for x in ${kubelet_config_yaml:-} ${p0:-} /var/lib/kubelet/config.yaml; do if [ -e "$x" ]; then f=$x; break; fi; done
    [ -n "$f" ] || exit 1
    p=$(stat -Lc %a "$f") || exit 1
    if [ $((0$p & 0177)) -eq 0 ]; then echo compliant; else echo "noncompliant: $f mode $p"; fi
  expected_output: compliant
  requires_file:
  - /var/lib/kubelet/config.yaml
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    set -f
    psarg() { ps -eo args 2>/dev/null | grep -E "^([^ ]*/)?$1( |\$)" | head -n 1 | awk -v k="--$2" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    p0=$(psarg kubelet config)
    f=""; for x in ${kubelet_config_yaml:-} ${p0:-} /var/lib/kubelet/config.yaml; do if [ -e "$x" ]; then f=$x; break; fi; done
    [ -n "$f" ] || exit 1
    p=$(stat -Lc %a "$f"); chmod "$(printf '%o' $(( (0$p) & ~0177 & 07777 )))" "$f"
  guidance: "Run the following command (using the config file location identified in the Audit step) chmod 600 /var/lib/kubelet/config.yaml"
