id: TMA-KUBERNETES-4.2.14
title: Ensure that the --seccomp-default parameter is set to true
description: Ensure that the Kubelet enforces the use of the RuntimeDefault seccomp profile The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: low
tags:
- kubernetes
- worker-node
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 4.2.14 Ensure that the --seccomp-default parameter is set to true
audit:
  type: manual
  command: Review the Kubelet's start-up parameters for the value of --seccomp-default, and check the Kubelet configuration file for the seccompDefault . If neither of these values is set, then the seccomp profile is not in use.
remediation:
  type: iac_patch
  command: Set the parameter, either via the --seccomp-default command line parameter or the seccompDefault configuration file setting.
