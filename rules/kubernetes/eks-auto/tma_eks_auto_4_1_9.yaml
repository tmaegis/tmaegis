id: TMA-EKS-AUTO-4.1.9
title: Grant persistent storage provisioning access only where StorageClasses and PersistentVolumeClaims are required
description: Permission to create persistent storage in EKS Auto Mode should be granted only where it is required. In EKS, this includes direct creation of PersistentVolume objects and, more commonly in Auto Mode, the ability to trigger dynamic provisioning through PersistentVolumeClaim and StorageClass use, because EKS storage integrations such as the Amazon EBS CSI driver and EKS Auto Mode can automatically provision backing storage when applications ... The benchmark marks this recommendation Manual.
target: eks-auto
level: 1
severity: medium
tags:
- eks-auto
- policies
reference: CIS Amazon Elastic Kubernetes Service (EKS) Auto Mode Benchmark v1.0.0 - 4.1.9 Grant persistent storage provisioning access only where StorageClasses and PersistentVolumeClaims are required
audit:
  type: manual
  command: Review EKS RBAC to identify any users, groups, or service accounts that can create PersistentVolume, PersistentVolumeClaim, or StorageClass resources. In EKS, this review should give particular attention to PersistentVolumeClaim and StorageClass permissions because persistent storage is commonly provisioned dynamically through StorageClass and PersistentVolumeClaim objects in EKS Auto Mode rather than by manually creating PersistentVolume objects.
remediation:
  type: iac_patch
  command: Remove persistent storage creation rights from any user, group, or service account that does not require them, and replace broad assignments with the lowest privilege role and narrowest scope possible. In EKS, prioritize PersistentVolumeClaim and StorageClass permissions because persistent storage is commonly provisioned dynamically through the EKS Auto Mode block storage path rather than by manually creating PersistentVolume objects. Limit direct PersistentVolume and StorageClass administration to approved administrators, and allow workloads to use only the PersistentVolumeClaim access required for approved storage classes. After changes are made, verify that required applications can still provision storage through the intended EKS Auto Mode storage class and PVC path.
