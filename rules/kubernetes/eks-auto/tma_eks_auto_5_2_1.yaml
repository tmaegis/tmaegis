id: TMA-EKS-AUTO-5.2.1
title: Use dedicated service accounts for EKS Auto Mode workload identities
description: Using dedicated Kubernetes service accounts for EKS Auto Mode workload identities helps isolate AWS permissions by application, job, or trust boundary instead of sharing a single identity across multiple workloads. This supports more controlled access to AWS services and reduces the blast radius if one workload is compromised or misconfigured. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions. Reports pods running as the namespace default service account.
target: eks-auto
level: 1
severity: high
tags:
- eks-auto
- managed-services
- rbac
reference: CIS Amazon Elastic Kubernetes Service (EKS) Auto Mode Benchmark v1.0.0 - 5.2.1 Use dedicated service accounts for EKS Auto Mode workload identities
audit:
  type: command
  command: |-
    out=$(kubectl get pods -A -o go-template='{{range .items}}{{.metadata.namespace}} {{.metadata.name}} {{.spec.serviceAccountName}}{{"\n"}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$out" | awk -v ex='^(kube-system|kube-public|kube-node-lease)$' 'NF && $1 !~ ex && ($3=="default" || $3=="<no")')
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: Use dedicated Kubernetes service accounts for EKS Auto Mode workloads and map AWS access to those accounts through EKS Pod Identity, or IRSA where required. Create one least privilege IAM role per application or permission boundary, update workloads to reference the intended serviceAccountName, disable token automounting where Kubernetes API access is not needed, and restrict node instance profile access so pods cannot inherit broader node credentials. • Create a dedicated Kubernetes service account for each application or distinct AWS permission boundary instead of sharing the namespace default service account. • Associate that service account with a least privilege IAM role by using EKS Pod Identity where supported, or IRSA where Pod Identity is not supported or not selected. For EKS Pod Identity, create an association between the Kubernetes namespace, service account, and IAM role.
