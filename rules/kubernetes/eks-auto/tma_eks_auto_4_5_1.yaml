id: TMA-EKS-AUTO-4.5.1
title: Use dedicated namespaces to separate workload boundaries
description: Namespaces create administrative boundaries in EKS by dividing a cluster into logical partitions for teams, applications, environments, or tenants. They are a core building block for soft multitenancy, and several controls used to separate workloads, including quotas, network policies, and service accounts, are defined to the namespace. The benchmark marks this recommendation Manual.
target: eks-auto
level: 1
severity: medium
tags:
- eks-auto
- policies
reference: CIS Amazon Elastic Kubernetes Service (EKS) Auto Mode Benchmark v1.0.0 - 4.5.1 Use dedicated namespaces to separate workload boundaries
audit:
  type: manual
  command: Verify that namespaces are being used as intentional administrative boundaries for groups, applications, or environments in the EKS Auto Mode cluster. Namespaces should be paired with scoped access controls and namespace governance such as quotas, limits, service accounts, and network policies. In EKS Auto Mode, customers remain responsible for application containers, workload access, and namespace governance even though AWS manages more of the underlying infrastructure.
remediation:
  type: iac_patch
  command: Create dedicated namespaces for groups, applications, or environments that need separate administrative scope, and move workloads out of the default namespace. Strengthen each namespace boundary with targeted access, quotas, limits, service accounts, and network policies, and reduce cluster permissions that bypass the intended separation model. EKS Auto Mode manages more of the data plane infrastructure, but namespace design, workload placement, access control, and application governance remain customer responsibilities. Create dedicated namespaces for each group, application, or environment that needs its own administrative boundary. kubectl create namespace $NAMESPACE • Move user workloads out of the default namespace and into the appropriate managed namespace.
