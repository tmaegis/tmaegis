id: TMA-EKS-AUTO-4.1.10
title: Grant nodes/proxy access only to approved identities that require node-level access
description: Access to the nodes/proxy subresource in EKS Auto Mode should be limited to identities with a documented node administration or troubleshooting need. This review should cover custom Role and ClusterRole rules, RoleBinding and ClusterRoleBinding assignments, and any service accounts that receive node subresource access. The benchmark marks this recommendation Manual.
target: eks-auto
level: 1
severity: medium
tags:
- eks-auto
- policies
reference: CIS Amazon Elastic Kubernetes Service (EKS) Auto Mode Benchmark v1.0.0 - 4.1.10 Grant nodes/proxy access only to approved identities that require node-level access
audit:
  type: manual
  command: Review EKS Auto Mode custom Kubernetes RBAC to identify custom Role and ClusterRole objects that grant access to the nodes/proxy subresource, and validate that each permission is required for an approved troubleshooting, maintenance, or platform administration function. Focus this review on customer RBAC because EKS creates its own default RBAC identities for cluster components, while customer defined node-proxy access is usually introduced through native Kubernetes RBAC.
remediation:
  type: iac_patch
  command: Reduce custom RBAC access to the nodes/proxy API path so it is limited to approved administrative identities that require node access. In EKS, use access entries and associated access policies for standard cluster access wherever possible, and reserve custom Kubernetes RBAC for cases where the predefined access policies do not meet the requirement. Keep nodes/proxy limited to tightly controlled troubleshooting, maintenance, or platform administration use cases, and avoid assigning it to workload service accounts or broadly shared Kubernetes groups. • Remove nodes/proxy from any custom Role or ClusterRole where node proxy is not explicitly required. • Where some node access is still needed, replace nodes/proxy with narrower permissions on only the specific resources and verbs required, and reduce scope from ClusterRole to namespace Role where the function allows it.
