id: TMA-EKS-AUTO-4.2.3
title: Require workload pods to run with hostIPC set to false
description: 'Require workload pods to run with hostIPC set to false or leave it unset by restricting spec.hostIPC: true in EKS Auto Mode workload namespaces. In the EKS Pod Security Standards model, this is done through Pod Security Admission or an equivalent policy engine, and baseline or restricted enforcement should be applied to workload namespaces where host IPC namespace sharing is not approved. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions.'
target: eks-auto
level: 1
severity: medium
tags:
- eks-auto
- policies
reference: CIS Amazon Elastic Kubernetes Service (EKS) Auto Mode Benchmark v1.0.0 - 4.2.3 Require workload pods to run with hostIPC set to false
audit:
  type: command
  command: |-
    out=$(kubectl get pods -A -o go-template='{{range .items}}{{.metadata.namespace}} {{.metadata.name}} {{.spec.hostIPC}}{{"\n"}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$out" | awk -v ex='^(kube-system|kube-public|kube-node-lease)$' 'NF && $1 !~ ex && ($3=="true")')
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure Pod Security Admission on workload namespaces so pods that request spec.hostIPC: true are denied at admission time. For this control, baseline is sufficient because it prohibits hostIPC, while restricted provides stronger hardening for workload namespaces that can meet the additional requirements. Use enforce for remediation because it rejects violating pods. Use warn and audit for rollout visibility, but do not treat them as enforcement. Configure each workload namespace to enforce the restricted profile. kubectl label ns $NAMESPACE pod-security.kubernetes.io/enforce=restricted --overwrite If restricted is too disruptive for a valid workload namespace, enforce baseline as the minimum profile for this specific control.'
