id: TMA-KUBERNETES-1.1.20
title: Ensure that the Kubernetes PKI certificate file permissions are set to 644 or more restrictive
description: Ensure that Kubernetes PKI certificate files have permissions of 644 or more restrictive. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- control-plane
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 1.1.20 Ensure that the Kubernetes PKI certificate file permissions are set to 644 or more restrictive
audit:
  type: manual
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, stat -c '%a' /etc/kubernetes/pki/*.crt Verify that the permissions are 644 or more restrictive. or ls -l /etc/kubernetes/pki/*.crt Verify -rw------
remediation:
  type: iac_patch
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, chmod -R 644 /etc/kubernetes/pki/*.crt
