id: TMA-KUBERNETES-2.4
title: Ensure that the --peer-cert-file and --peer-key-file arguments are set as appropriate
description: etcd should be configured to make use of TLS encryption for peer connections. Audited on control-plane nodes from the running process arguments (falls back to the kubeadm static pod manifest); SKIPs on nodes without that manifest.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- etcd
reference: CIS Kubernetes Benchmark v2.1.0 - 2.4 Ensure that the --peer-cert-file and --peer-key-file arguments are set as appropriate
audit:
  type: command
  command: |-
    set -f
    a=$(ps -eo args 2>/dev/null | grep -E '^([^ ]*/)?etcd( |$)' | head -n 1)
    [ -n "$a" ] || a=$(sed -n 's/^[[:space:]]*-[[:space:]]*"\{0,1\}\(--[^"]*\)"\{0,1\}[[:space:]]*$/\1/p' /etc/kubernetes/manifests/etcd.yaml | tr '\n' ' ')
    [ -n "$a" ] || exit 1
    g() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    has() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++) if($i==k||index($i,k"=")==1) f=1} END{exit !f}'; }
    ok=1
    v=$(g peer-cert-file); [ -n "$v" ] || { echo "noncompliant: --peer-cert-file not set"; ok=0; }
    v=$(g peer-key-file); [ -n "$v" ] || { echo "noncompliant: --peer-key-file not set"; ok=0; }
    if [ "$ok" -eq 1 ]; then echo compliant; fi
  expected_output: compliant
  requires_file:
  - /etc/kubernetes/manifests/etcd.yaml
remediation:
  type: iac_patch
  command: Follow the etcd service documentation and configure peer TLS encryption as appropriate for your etcd cluster. Then, edit the etcd pod specification file /etc/kubernetes/manifests/etcd.yaml on the master node and set the below parameters. --peer-client-file=</path/to/peer-cert-file> --peer-key-file=</path/to/peer-key-file>
