id: TMA-KUBERNETES-4.1.6
title: Ensure that the --kubeconfig kubelet.conf file ownership is set to root:root
description: Ensure that the kubelet.conf file ownership is set to root:root. Runs on each node; the path can be overridden with the kubelet_config environment variable (as in CIS-CAT).
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
- kubelet
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.6 Ensure that the --kubeconfig kubelet.conf file ownership is set to root:root
audit:
  type: command
  command: |-
    set -f
    f=""; for x in ${kubelet_config:-} /etc/kubernetes/kubelet.conf; do if [ -e "$x" ]; then f=$x; break; fi; done
    [ -n "$f" ] || exit 1
    o=$(stat -Lc %U:%G "$f") || exit 1
    if [ "$o" = "root:root" ]; then echo compliant; else echo "noncompliant: $f $o"; fi
  expected_output: compliant
  requires_file:
  - /etc/kubernetes/kubelet.conf
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    set -f
    f=""; for x in ${kubelet_config:-} /etc/kubernetes/kubelet.conf; do if [ -e "$x" ]; then f=$x; break; fi; done
    [ -n "$f" ] || exit 1
    chown root:root "$f"
  guidance: "Run the below command (based on the file location on your system) on the each worker node. For example, chown root:root /etc/kubernetes/kubelet.conf"
