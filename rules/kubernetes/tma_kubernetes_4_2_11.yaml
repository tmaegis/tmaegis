id: TMA-KUBERNETES-4.2.11
title: Verify that the RotateKubeletServerCertificate argument is set to true
description: Enable kubelet server certificate rotation. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
- kubelet
reference: CIS Kubernetes Benchmark v2.1.0 - 4.2.11 Verify that the RotateKubeletServerCertificate argument is set to true
audit:
  type: manual
  command: 'Ignore this check if serverTLSBootstrap is true in the kubelet config file or if the --rotate-server-certificates parameter is set on kubelet Run the following command on each node: ps -ef | grep kubelet Verify that RotateKubeletServerCertificate argument exists and is set to true.'
remediation:
  type: iac_patch
  command: 'Edit the kubelet service file /etc/kubernetes/kubelet.conf on each worker node and set the below parameter in KUBELET_CERTIFICATE_ARGS variable. --feature-gates=RotateKubeletServerCertificate=true Based on your system, restart the kubelet service. For example: systemctl daemon-reload systemctl restart kubelet.service'
