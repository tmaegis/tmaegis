id: TMA-GKE-AUTOPILOT-4.5.1
title: Enforce image provenance using Binary Authorization for GKE
description: Use Binary Authorization for GKE to enforce image provenance and deploy time trust policies before container images are admitted to the GKE Autopilot cluster. Policies should allow only approved images, trusted registries, or images with required attestations from approved build, security, or release processes. The benchmark marks this recommendation Manual.
target: gke-autopilot
level: 2
severity: low
tags:
- gke-autopilot
- policies
- registry
reference: CIS Google Kubernetes Engine (GKE) Autopilot Benchmark v2.0.0 - 4.5.1 Enforce image provenance using Binary Authorization for GKE
audit:
  type: manual
  command: Review the GKE Autopilot cluster and confirm that Binary Authorization enforcement is enabled and confirm it does not simply allow all images and that it requires approved images, trusted registries, or attestations from trusted attestors where appropriate. Binary Authorization works with GKE clusters, including Autopilot clusters, and evaluates the configured policy at deploy time.
remediation:
  type: iac_patch
  command: Enable Binary Authorization enforcement for the GKE Autopilot cluster and configure the policy to block unapproved images at deploy time. Use approved image rules, trusted registries, or attestation based requirements aligned to the build, security scan, and release approval process. Validate the policy in dry run or a lower environment before enforcing broadly in production.
