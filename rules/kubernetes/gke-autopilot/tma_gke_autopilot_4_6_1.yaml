id: TMA-GKE-AUTOPILOT-4.6.1
title: Use namespaces to separate workload administration and resource governance
description: Use dedicated namespaces to separate GKE Autopilot workloads by application, team, environment, or tenant. Namespaces provide a logical boundary for organizing resources and applying namespace level governance, but they should be paired with access, quota, network, and pod security controls. The benchmark marks this recommendation Manual.
target: gke-autopilot
level: 1
severity: medium
tags:
- gke-autopilot
- policies
reference: CIS Google Kubernetes Engine (GKE) Autopilot Benchmark v2.0.0 - 4.6.1 Use namespaces to separate workload administration and resource governance
audit:
  type: manual
  command: 'Run the following command and review the namespaces created in the cluster: kubectl get namespaces --show-labels Verify that user workloads are placed in dedicated namespaces based on application, environment, or tenant, rather than being deployed into the default namespace. In addition, confirm that each workload namespace has both ownership and appropriate namespace level controls, such as RBAC RoleBindings, ResourceQuotas, NetworkPolicies, and Pod Security labels where required.'
remediation:
  type: iac_patch
  command: Create dedicated namespaces for GKE Autopilot workloads based on application, environment, or tenant boundaries. Move production workloads out of the default namespace and apply consistent namespace level governance so administration, access, and resource controls are easier to manage. • Create a dedicated namespace before deploying new application resources. • Move production workloads out of the default namespace where applicable. • Apply namespace labels for owner, application, environment, tenant, and cost allocation. • Configure least privilege RBAC using namespace level Roles and RoleBindings where possible. • Apply ResourceQuotas, NetworkPolicies, and Pod Security labels based on workload risk and governance requirements.
