id: TMA-KUBERNETES-1.2.20
title: Ensure that the --request-timeout argument is set as appropriate
description: Set global request timeout for API server requests as appropriate. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- api-server
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.20 Ensure that the --request-timeout argument is set as appropriate
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-apiserver Verify that the --request-timeout argument is either not set or set to an appropriate value.'
remediation:
  type: iac_patch
  command: Edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml and set the below parameter as appropriate and if needed. For example, --request-timeout=300s
