id: TMA-KUBERNETES-1.1.9
title: Ensure that the Container Network Interface file permissions are set to 600 or more restrictive
description: Ensure that the Container Network Interface files have permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- control-plane
- network
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 1.1.9 Ensure that the Container Network Interface file permissions are set to 600 or more restrictive
audit:
  type: manual
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, stat -c %a <path/to/cni/files> Verify that the permissions are 600 or more restrictive.
remediation:
  type: iac_patch
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, chmod 600 <path/to/cni/files>
