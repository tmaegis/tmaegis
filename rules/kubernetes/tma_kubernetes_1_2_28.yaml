id: TMA-KUBERNETES-1.2.28
title: Ensure that encryption providers are appropriately configured
description: Where etcd encryption is used, appropriate providers should be configured. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- api-server
- secrets
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.28 Ensure that encryption providers are appropriately configured
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-apiserver Get the EncryptionConfig file set for --encryption-provider-config argument. Verify that aescbc, kms, or secretbox is set as the encryption provider for all the desired resources.'
remediation:
  type: iac_patch
  command: Follow the Kubernetes documentation and configure a EncryptionConfig file. In this file, choose aescbc, kms, or secretbox as the encryption provider.
