id: TMA-KUBERNETES-3.2.1
title: Ensure that a minimal audit policy is created
description: Kubernetes can audit the details of requests made to the API server. The --audit-policy-file flag must be set for this logging to be enabled. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- control-plane
- logging
reference: CIS Kubernetes Benchmark v2.1.0 - 3.2.1 Ensure that a minimal audit policy is created
audit:
  type: manual
  command: 'Run the following command on one of the cluster master nodes: ps -ef | grep kube-apiserver Verify that the --audit-policy-file is set. Review the contents of the file specified and ensure that it contains a valid audit policy.'
remediation:
  type: iac_patch
  command: Create an audit policy file for your cluster.
