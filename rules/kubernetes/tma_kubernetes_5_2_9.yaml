id: TMA-KUBERNETES-5.2.9
title: Minimize the admission of containers with capabilities assigned
description: Do not generally permit containers with capabilities The benchmark marks this recommendation Manual.
target: kubernetes
level: 2
severity: medium
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.9 Minimize the admission of containers with capabilities assigned
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that at least one policy requires that capabilities are dropped by all containers.
remediation:
  type: iac_patch
  command: Review the use of capabilities in applications running on your cluster. Where a namespace contains applications which do not require any Linux capabilities to operate consider adding a policy which forbids the admission of containers which do not drop all capabilities.
