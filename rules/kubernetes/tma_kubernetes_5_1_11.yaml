id: TMA-KUBERNETES-5.1.11
title: Minimize access to the approval sub-resource of certificatesigningrequests objects
description: Users with access to the update the approval sub-resource of CertificateSigningRequests objects can approve new client certificates for the Kubernetes API effectively allowing them to create new high-privileged user accounts. This can allow for privilege escalation to full cluster administrator, depending on users configured in the cluster The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.11 Minimize access to the approval sub-resource of certificatesigningrequests objects
audit:
  type: manual
  command: Review the users who have access to update the approval sub-resource of CertificateSigningRequests objects in the Kubernetes API.
remediation:
  type: iac_patch
  command: Where possible, remove access to the approval sub-resource of CertificateSigningRequests objects.
