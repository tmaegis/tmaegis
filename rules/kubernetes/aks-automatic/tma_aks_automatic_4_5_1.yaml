id: TMA-AKS-AUTOMATIC-4.5.1
title: Create administrative boundaries between resources using namespaces
description: Create administrative boundaries between resources by organizing AKS workloads into separate namespaces and scoping access to those namespaces with Kubernetes RBAC or Azure RBAC for Kubernetes Authorization. Azure RBAC for Kubernetes Authorization is preconfigured in AKS Automatic, while Kubernetes RBAC remains applicable to service accounts and any additional Kubernetes RBAC bindings. The benchmark marks this recommendation Manual.
target: aks-automatic
level: 1
severity: low
tags:
- aks-automatic
- policies
reference: CIS Azure Kubernetes Service Automatic (AKS Automatic) Benchmark v1.0.0 - 4.5.1 Create administrative boundaries between resources using namespaces
audit:
  type: manual
  command: Verify that namespaces are not only present, but are being used as intentional administrative boundaries for teams, applications, or environments within the AKS cluster. Namespaces are the logical isolation boundary for workloads and resources in a shared cluster, and they should be paired with access controls and other governance within each namespace such as quotas and network policies. Namespaces alone are not sufficient for hostile multitenancy, so the audit should focus on whether they are being used consistently to separate administration and operations as intended.
remediation:
  type: iac_patch
  command: Microsoft recommends namespaces as the logical isolation boundary for workloads and resources in shared clusters, combined with governance within each namespace such as quotas and network policies. Where stronger tenant isolation is required, Microsoft recommends separate clusters rather than relying on namespaces alone. 1. Create separate namespaces for each team, application, or environment that requires its own administrative scope. 2. Use managed namespaces when centralized configuration of access, quotas, network policies, labels, and annotations is appropriate. 3. Move user workloads out of the default namespace and into the appropriate namespace. 4. Rebind access using Role and RoleBinding objects in the required namespace, or Azure RBAC assignments limited to the required namespace where applicable. 5.
