id: TMA-AKS-AUTOMATIC-4.1.12
title: Minimize access to the service account token creation
description: Minimize access to service account token creation so that only tightly controlled administrative or platform identities can request tokens for Kubernetes service accounts in AKS. AKS uses service accounts as a core Kubernetes identity type and documents that workloads can use Service Account Token Volume Projection to obtain a Kubernetes token. The benchmark marks this recommendation Manual.
target: aks-automatic
level: 1
severity: high
tags:
- aks-automatic
- policies
- rbac
reference: CIS Azure Kubernetes Service Automatic (AKS Automatic) Benchmark v1.0.0 - 4.1.12 Minimize access to the service account token creation
audit:
  type: manual
  command: Confirm that the ability to create service account tokens is limited to identities that require it for approved platform or workload operations. Service accounts remain Kubernetes identities governed by Kubernetes RBAC. AKS Automatic preconfigures Azure RBAC for Kubernetes Authorization, so review its Azure role assignments alongside Kubernetes RBAC bindings. • Review both Kubernetes RBAC and the preconfigured Azure RBAC for Kubernetes Authorization. • Review Role and ClusterRole rules for create access to serviceaccounts/token, including wildcard verbs or resources.
remediation:
  type: iac_patch
  command: Review all Role and ClusterRole definitions for access to the serviceaccounts/token subresource. Remove that permission from any user, group, CI/CD identity, or workload service account that does not have a documented operational requirement. Also review the preconfigured Azure RBAC for Kubernetes Authorization because Microsoft Entra identities and Kubernetes service accounts follow different authorization paths. 1. Review Role and ClusterRole objects for serviceaccounts/token access. 2. Remove that permission from broad operational roles, CI/CD identities, and workload service accounts. 3. Reassign it only to approved administrative or platform identities with a documented need. 4. Remove unnecessary Azure role assignments or custom role permissions that provide equivalent access. 5. Validate that required workload identity and projected token flows still function correctly. 6.
