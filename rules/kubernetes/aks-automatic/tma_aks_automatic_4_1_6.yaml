id: TMA-AKS-AUTOMATIC-4.1.6
title: Ensure that Service Account Tokens are only mounted where necessary
description: Verify that service account tokens in AKS Automatic are mounted only for pods that require Kubernetes API access or an explicitly configured workload identity flow. Confirm that pods and service accounts are not broadly relying on default token mounting, and that token projection is limited to workloads with a defined operational need. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions. Reports pods with an auto-mounted service account token (kube-api-access-* volume).
target: aks-automatic
level: 1
severity: high
tags:
- aks-automatic
- policies
- rbac
reference: CIS Azure Kubernetes Service Automatic (AKS Automatic) Benchmark v1.0.0 - 4.1.6 Ensure that Service Account Tokens are only mounted where necessary
audit:
  type: command
  command: |-
    out=$(kubectl get pods -A -o go-template='{{range .items}}{{.metadata.namespace}} {{.metadata.name}}{{range .spec.volumes}} {{.name}}{{end}}{{"\n"}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$out" | awk -v ex='^(kube-system|kube-public|kube-node-lease|gatekeeper-system|azure-arc)$' 'NF && $1 !~ ex && ($0 ~ / kube-api-access-/)')
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Apply the following steps to reduce unnecessary service account token mounting in AKS Automatic: • Set automountServiceAccountToken to false for pods and service accounts that do not require Kubernetes API access. • Update workloads to use a dedicated serviceAccountName only where a service account token is operationally required, instead of inheriting token behavior from the namespace default service account. • For workloads that need Azure resource access, use the preconfigured Microsoft Entra Workload ID with a dedicated service account, the required pod label, and explicit workload configuration rather than broad default token mounting. • Revalidate workloads after the change to confirm that only pods with a documented need continue to receive service account tokens.'
