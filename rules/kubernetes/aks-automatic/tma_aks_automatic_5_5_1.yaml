id: TMA-AKS-AUTOMATIC-5.5.1
title: Use Microsoft Entra ID authorization for the Kubernetes API
description: Use Microsoft Entra ID authorization for the Kubernetes API The benchmark marks this recommendation Manual.
target: aks-automatic
level: 2
severity: medium
tags:
- aks-automatic
- managed-services
reference: CIS Azure Kubernetes Service Automatic (AKS Automatic) Benchmark v1.0.0 - 5.5.1 Use Microsoft Entra ID authorization for the Kubernetes API
audit:
  type: manual
  command: Review the AKS cluster to confirm AKS managed Microsoft Entra integration is enabled and Microsoft Entra ID authorization for the Kubernetes API is turned on as expected for AKS Automatic. Then verify that access for users, groups, and service principals is being granted through Azure role assignments for Kubernetes authorization rather than primarily through Kubernetes RoleBinding and ClusterRoleBinding objects for those Entra identities.
remediation:
  type: iac_patch
  command: AKS Automatic already provides Microsoft Entra integration and Azure RBAC for Kubernetes authorization, so remediation normally consists of correcting Azure role assignments rather than enabling the authorization model. For stronger control, pair this with disabling local accounts so static --admin access does not remain available as an alternate path. If local accounts are disabled on an existing cluster, rotate cluster certificates to revoke previously issued local account credentials. For custom resource access, use an approved custom role and Azure ABAC conditions to limit access to the required CRD groups and kinds where supported. 1. Confirm the preconfigured Microsoft Entra integration and Azure RBAC authorization settings remain enabled. Investigate any cluster that does not report the expected AKS Automatic values. 2.
