id: TMA-KUBERNETES-5.1.12
title: Minimize access to webhook configuration objects
description: Users with rights to create/modify/delete validatingwebhookconfigurations or mutatingwebhookconfigurations can control webhooks that can read any object admitted to the cluster, and in the case of mutating webhooks, also mutate admitted objects. This could allow for privilege escalation or disruption of the operation of the cluster. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.12 Minimize access to webhook configuration objects
audit:
  type: manual
  command: Review the users who have access to validatingwebhookconfigurations or mutatingwebhookconfigurations objects in the Kubernetes API.
remediation:
  type: iac_patch
  command: Where possible, remove access to the validatingwebhookconfigurations or mutatingwebhookconfigurations objects
