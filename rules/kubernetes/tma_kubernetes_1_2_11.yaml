id: TMA-KUBERNETES-1.2.11
title: Ensure that the admission control plugin AlwaysPullImages is set
description: Always pull images. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- api-server
- registry
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.11 Ensure that the admission control plugin AlwaysPullImages is set
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-apiserver Verify that the --enable-admission-plugins argument is set to a value that includes AlwaysPullImages.'
remediation:
  type: iac_patch
  command: Edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml on the Control Plane node and set the --enable-admission-plugins parameter to include AlwaysPullImages. --enable-admission-plugins=...,AlwaysPullImages,...
