id: TMA-KUBERNETES-5.2.10
title: Minimize the admission of Windows HostProcess Containers
description: Do not generally permit Windows containers to be run with the hostProcess flag set to true. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.10 Minimize the admission of Windows HostProcess Containers
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that each policy disallows the admission of hostProcess containers
remediation:
  type: iac_patch
  command: Add policies to each namespace in the cluster which has user workloads to restrict the admission of hostProcess containers.
