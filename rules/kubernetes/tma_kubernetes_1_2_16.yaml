id: TMA-KUBERNETES-1.2.16
title: Ensure that the --audit-log-path argument is set
description: Enable auditing on the Kubernetes API Server and set the desired audit log path. Audited on control-plane nodes from the running process arguments (falls back to the kubeadm static pod manifest); SKIPs on nodes without that manifest.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- api-server
- logging
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.16 Ensure that the --audit-log-path argument is set
audit:
  type: command
  command: |-
    set -f
    a=$(ps -eo args 2>/dev/null | grep -E '^([^ ]*/)?kube-apiserver( |$)' | head -n 1)
    [ -n "$a" ] || a=$(sed -n 's/^[[:space:]]*-[[:space:]]*"\{0,1\}\(--[^"]*\)"\{0,1\}[[:space:]]*$/\1/p' /etc/kubernetes/manifests/kube-apiserver.yaml | tr '\n' ' ')
    [ -n "$a" ] || exit 1
    g() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++){if($i==k&&i<NF)v=$(i+1); else if(index($i,k"=")==1)v=substr($i,length(k)+2)}} END{if(v!="")print v}'; }
    has() { printf '%s\n' "$a" | awk -v k="--$1" '{for(i=1;i<=NF;i++) if($i==k||index($i,k"=")==1) f=1} END{exit !f}'; }
    ok=1
    v=$(g audit-log-path); [ -n "$v" ] || { echo "noncompliant: --audit-log-path not set"; ok=0; }
    if [ "$ok" -eq 1 ]; then echo compliant; fi
  expected_output: compliant
  requires_file:
  - /etc/kubernetes/manifests/kube-apiserver.yaml
remediation:
  type: iac_patch
  command: 'Edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml on the Control Plane node and set the --audit-log-path parameter to a suitable path and file where you would like audit logs to be written, for example: --audit-log-path=/var/log/apiserver/audit.log'
