id: TMA-KUBERNETES-5.2.7
title: Minimize the admission of root containers
description: Do not generally permit containers to be run as the root user. The benchmark marks this recommendation Manual.
target: kubernetes
level: 2
severity: medium
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.7 Minimize the admission of root containers
audit:
  type: manual
  command: 'List the policies in use for each namespace in the cluster, ensure that each policy either restricts the use of root containers by setting MustRunAsNonRoot or MustRunAs with the range of UIDs not including 0, or requires pods to set hostUsers: false to enable user namespaces.'
remediation:
  type: iac_patch
  command: 'Create a policy for each namespace in the cluster, ensuring that either MustRunAsNonRoot or MustRunAs with the range of UIDs not including 0, is set. Alternatively, require pods to set hostUsers: false to enable user namespaces. User namespaces require Linux kernel 6.3+ and a compatible container runtime (containerd 2.0+ or CRI-O 1.25+).'
