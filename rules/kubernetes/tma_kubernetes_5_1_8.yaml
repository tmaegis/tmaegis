id: TMA-KUBERNETES-5.1.8
title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
description: Cluster roles and roles with the impersonate, bind or escalate permissions should not be granted unless strictly required. Each of these permissions allow a particular subject to escalate their privileges beyond those explicitly granted by cluster administrators The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.8 Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
audit:
  type: manual
  command: Review the users who have access to cluster roles or roles which provide the impersonate, bind, or escalate privileges.
remediation:
  type: iac_patch
  command: Where possible, remove the impersonate, bind, and escalate rights from subjects.
