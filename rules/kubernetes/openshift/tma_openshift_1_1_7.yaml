id: TMA-OPENSHIFT-1.1.7
title: Ensure that the etcd pod specification file permissions are set to 600 or more restrictive
description: Ensure that the /etc/kubernetes/manifests/etcd.yaml file has permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- control-plane
- etcd
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.7 Ensure that the etcd pod specification file permissions are set to 600 or more restrictive
audit:
  type: manual
  command: 'In OpenShift 4, starting with OpenShift 4.4, the etcd pod specification file is generated by the cluster etcd operator. The default etcd pod specification file is available here: openshift/cluster-etcd-operator Run the following command. for i in $(oc get pods -n openshift-etcd -l app=etcd -o name | grep etcd ) do echo "check pod $i" oc rsh -n openshift-etcd $i \ stat -c %a /etc/kubernetes/manifests/etcd-pod.yaml done Verify that the permissions are 600 or more restrictive.'
remediation:
  type: iac_patch
  command: There is no remediation for updating the permissions of etcd-pod.yaml. The file is owned by an OpenShift operator and any changes to the file will result in a degraded cluster state. Please do not attempt to remediate the permissions of this file.
