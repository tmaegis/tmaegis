id: TMA-OPENSHIFT-1.2.31
title: Ensure unsupported configuration overrides are not used
description: OpenShift supported an option called unsupportedConfigOverrides that allowed users to opt into unsupported behavior. This option is no longer supported by OpenShift and should not be used. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.31 Ensure unsupported configuration overrides are not used
audit:
  type: manual
  command: 'Make sure the unsupportedConfigOverrides in your deployment returns null using the following command: oc get kubeapiserver/cluster -o jsonpath=''{.spec.unsupportedConfigOverrides}'' The output should return null. Any other return value is a finding and you should migrate away from that particular configuration.'
remediation:
  type: iac_patch
  command: set this value to null
