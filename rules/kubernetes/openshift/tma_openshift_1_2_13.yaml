id: TMA-OPENSHIFT-1.2.13
title: Ensure that the admission control plugin NodeRestriction is set
description: Limit the Node and Pod objects that a kubelet could modify. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.13 Ensure that the admission control plugin NodeRestriction is set
audit:
  type: manual
  command: 'In OpenShift, the NodeRestriction admission plugin is enabled by default. Use the following command to obtain a list of configured admission controllers: oc -n openshift-kube-apiserver get configmap config -o json | jq -r ''.data."config.yaml"'' | jq ''.apiServerArguments."enable-admission-plugins"'' Verify the list includes NodeRestriction.'
remediation:
  type: iac_patch
  command: Enable the NodeRestriction admission plugin.
