id: TMA-OPENSHIFT-1.2.7
title: Ensure that the APIPriorityAndFairness feature gate is enabled
description: Limit the rate at which the API server accepts requests. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.7 Ensure that the APIPriorityAndFairness feature gate is enabled
audit:
  type: manual
  command: 'OpenShift 4.5 and forward uses the api priority and fairness feature to limit the rate at which the API server accepts requests. Run the following command: #Verify the APIPriorityAndFairness feature-gate oc get kubeapiservers.operator.openshift.io cluster -o json | jq ''.spec.observedConfig.apiServerArguments'' For 4.5, verify that the feature-gate is turned on for the APIServer priority and fairness: APIPriorityAndFairness=true. In OCP 4.5 and earlier, the default set of admission plugins are compiled into the apiserver and are not visible in the configuration yaml.'
remediation:
  type: iac_patch
  command: 'Turn on for the APIServer priority and fairness: `APIPriorityAndFairness=true'
