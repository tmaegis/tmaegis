id: TMA-OPENSHIFT-2.7
title: Ensure that a unique Certificate Authority is used for etcd
description: Use a different certificate authority for etcd from the one used for Kubernetes. The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: medium
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.7 Ensure that a unique Certificate Authority is used for etcd
audit:
  type: manual
  command: OpenShift 4 includes multiple CAs providing independent chains of trust, which ensure that a platform CA will never accidentally sign a certificate that can be used for the wrong purpose, increasing the security posture of the cluster. OpenShift uses a separate CA for etcd. These internal self-signing CAs enable automation because the key is known to the cluster. The certificates generated by each CA are used to identify a particular OpenShift platform component to another OpenShift platform component.
remediation:
  type: iac_patch
  command: None required. Certificates for etcd are managed by the OpenShift cluster etcd operator.
