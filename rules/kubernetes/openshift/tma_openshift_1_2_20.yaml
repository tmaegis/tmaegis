id: TMA-OPENSHIFT-1.2.20
title: Ensure that the maximumRetainedFiles argument is set to 10 or as appropriate
description: Retain 10 or an appropriate number of old log files. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.20 Ensure that the maximumRetainedFiles argument is set to 10 or as appropriate
audit:
  type: manual
  command: 'OpenShift audit works at the API server level, logging all requests coming to the server. Run the following command to verify the number of retained log files: oc get configmap config -n openshift-kube-apiserver -ojson | jq -r ''.data["config.yaml"]'' | jq -r ''.apiServerArguments["audit-log-maxbackup"][]?'' Verify the output is at least 10.'
remediation:
  type: iac_patch
  command: Set maximumRetainedFiles argument to 10
