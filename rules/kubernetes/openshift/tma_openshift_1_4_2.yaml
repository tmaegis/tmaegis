id: TMA-OPENSHIFT-1.4.2
title: Verify that the scheduler API service is protected by RBAC
description: Do not bind the scheduler service to non-loopback insecure addresses. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- scheduler
- rbac
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.4.2 Verify that the scheduler API service is protected by RBAC
audit:
  type: manual
  command: In OpenShift 4, The Kubernetes Scheduler operator manages and updates the Kubernetes Scheduler deployed on top of OpenShift. By default, the operator exposes metrics via metrics service. The metrics are collected from the Kubernetes Scheduler operator. Profiling data is sent to healthzPort, the port of the localhost healthz endpoint. Changing this value may disrupt components that monitor the kubelet health.
remediation:
  type: iac_patch
  command: protect scheduler API service by RBAC
