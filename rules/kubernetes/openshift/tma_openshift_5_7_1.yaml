id: TMA-OPENSHIFT-5.7.1
title: Create administrative boundaries between resources using namespaces
description: Use namespaces to isolate your Kubernetes objects. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: low
tags:
- openshift
- policies
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.7.1 Create administrative boundaries between resources using namespaces
audit:
  type: manual
  command: OpenShift Projects wrap Kubernetes namespaces and are used by default in OpenShift 4. Run the following command to obtain a list of all non-default OpenShift and Kubernetes namespaces in the cluster. oc get namespaces -o json | jq '.items[] | select(.metadata.name|test("(?!default|kube-.|openshift.)^.*")) | .metadata.name' Ensure that these namespaces are the ones you need and are adequately administered as per your requirements.
remediation:
  type: iac_patch
  command: Follow the documentation and create namespaces for objects in your deployment as you need them.
