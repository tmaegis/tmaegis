id: TMA-OPENSHIFT-5.1.2
title: Minimize access to secrets
description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users to reduce the risk of privilege escalation. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- policies
- rbac
- secrets
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.1.2 Minimize access to secrets
audit:
  type: manual
  command: 'Review the users who have get, list or watch access to secrets objects in the Kubernetes API. Executing the command below will return a list of users and groups who are allowed to get secrets: oc adm policy who-can get secrets The following command returns the users and groups who are allowed to list secrets: oc adm policy who-can list secrets The following command returns the users and groups who are allowed to watch secrets: oc adm policy who-can watch secrets'
remediation:
  type: iac_patch
  command: Where possible, remove get, list and watch access to secret objects in the cluster.
