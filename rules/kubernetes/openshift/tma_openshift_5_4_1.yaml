id: TMA-OPENSHIFT-5.4.1
title: Prefer using secrets as files over secrets as environment variables
description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment variable secrets. The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: medium
tags:
- openshift
- policies
- secrets
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.4.1 Prefer using secrets as files over secrets as environment variables
audit:
  type: manual
  command: Information about ways to provide sensitive data to pods is included in the documentation. Providing sensitive data to pods Run the following command to find references to objects which use environment variables defined from secrets. oc get all -o jsonpath='{range .items[?(@..secretKeyRef)]} {.kind} {.metadata.name} {"\n"}{end}' -A
remediation:
  type: iac_patch
  command: If possible, rewrite application code to read secrets from mounted secret files, rather than from environment variables.
