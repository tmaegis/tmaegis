id: TMA-OPENSHIFT-1.2.23
title: Ensure that the --service-account-lookup argument is set to true
description: Validate service account before validating token. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.23 Ensure that the --service-account-lookup argument is set to true
audit:
  type: manual
  command: 'OpenShift denies access for any OAuth Access token that does not exist in its etcd data store. OpenShift does not use the service-account-lookup flag even when it is set. Run the following command: oc get configmap config -n openshift-kube-apiserver -ojson | jq -r ''.data["config.yaml"]'' | jq ''.apiServerArguments."service-account-lookup"[]'' Verify that if the --service-account-lookup argument exists it is set to true.'
remediation:
  type: iac_patch
  command: Set the --service-account-lookup argument to true
