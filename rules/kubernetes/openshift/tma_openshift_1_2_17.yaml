id: TMA-OPENSHIFT-1.2.17
title: Ensure that the healthz endpoint is protected by RBAC
description: Disable profiling, if not needed. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- rbac
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.17 Ensure that the healthz endpoint is protected by RBAC
audit:
  type: manual
  command: Profiling is enabled by default in OpenShift. The API server operators expose Prometheus metrics via the metrics service. Profiling data is sent to healthzPort, the port of the localhost healthz endpoint. Changing this value may disrupt components that monitor the kubelet health. The default port value is 10248, and the healthz BindAddress is 127.0.0.1 To ensure the collected data is not exploited, profiling endpoints are exposed at each master port and secured via RBAC (see cluster-debugger role).
remediation:
  type: iac_patch
  command: Create an RBAC service account
