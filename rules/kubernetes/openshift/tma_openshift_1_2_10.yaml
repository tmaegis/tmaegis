id: TMA-OPENSHIFT-1.2.10
title: Ensure that the admission control plugin ServiceAccount is set
description: Automate service accounts management. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.10 Ensure that the admission control plugin ServiceAccount is set
audit:
  type: manual
  command: The ServiceAccount admission control plugin is enabled by default. Every service account has an associated user name that can be granted roles, just like a regular user. The user name for each service account is derived from its project and the name of the service account. Service accounts are required in each project to run builds, deployments, and other pods. The default service accounts that are automatically created for each project are isolated by the project namespace.
remediation:
  type: iac_patch
  command: Configure the ServiceAccount admission controller.
