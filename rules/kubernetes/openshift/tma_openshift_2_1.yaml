id: TMA-OPENSHIFT-2.1
title: Ensure that the --cert-file and --key-file arguments are set as appropriate
description: Configure TLS encryption for the etcd service. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.1 Ensure that the --cert-file and --key-file arguments are set as appropriate
audit:
  type: manual
  command: OpenShift uses X.509 certificates to provide secure communication to etcd. OpenShift generates these files and sets the arguments appropriately. OpenShift does not use the etcd-certfile or etcd-keyfile flags. Keys and certificates for control plane components like kube-apiserver, kube-controller-manager, kube-scheduler and etcd are stored with their respective static pod configurations in the directory /etc/kubernetes/static-pod-resources/*/secrets.
remediation:
  type: iac_patch
  command: OpenShift does not use the etcd-certfile or etcd-keyfile flags. Certificates for etcd are managed by the etcd cluster operator.
