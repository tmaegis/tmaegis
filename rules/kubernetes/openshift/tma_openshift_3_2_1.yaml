id: TMA-OPENSHIFT-3.2.1
title: Ensure that a minimal audit policy is created
description: Kubernetes can audit the details of requests made to the API server. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- logging
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 3.2.1 Ensure that a minimal audit policy is created
audit:
  type: manual
  command: In OpenShift, auditing of the API Server is on by default. Audit provides a security-relevant chronological set of records documenting the sequence of activities that have affected the system by individual users, administrators, or other components of the system. Audit works at the API server level, logging all requests coming to the server.
remediation:
  type: iac_patch
  command: Enable the Default audit profile.
