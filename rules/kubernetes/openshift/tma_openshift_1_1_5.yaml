id: TMA-OPENSHIFT-1.1.5
title: Ensure that the scheduler pod specification file permissions are set to 600 or more restrictive
description: Ensure that the scheduler pod specification file has permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.5 Ensure that the scheduler pod specification file permissions are set to 600 or more restrictive
audit:
  type: manual
  command: In OpenShift 4 the kube-scheduler is deployed as a static pod and its pod specification file is created on control plane nodes at /etc/kubernetes/manifests/kube-scheduler-pod.yaml. It is mounted via hostpath to the kube-controller-manager pods via /etc/kubernetes/static-pod-resources/kube-scheduler-pod.yaml with permissions 644. To verify, run the following command.
remediation:
  type: iac_patch
  command: There is no remediation for updating the permissions of kube-scheduler-pod.yaml. The file is owned by an OpenShift operator and any changes to the file will result in a degraded cluster state. Please do not attempt to remediate the permissions of this file.
