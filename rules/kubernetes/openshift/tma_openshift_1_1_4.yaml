id: TMA-OPENSHIFT-1.1.4
title: Ensure that the controller manager pod specification file ownership is set to root:root
description: Ensure that the controller manager pod specification file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.4 Ensure that the controller manager pod specification file ownership is set to root:root
audit:
  type: manual
  command: 'OpenShift 4 deploys two controller managers: the OpenShift Controller manager and the Kube Controller manager. The OpenShift Controller manager is managed as a deployment. The pod specification yaml for openshift-controller-manager is stored in etcd. The Kube Controller manager is managed as a static pod. The pod specification file for the openshift-kube-controller-manager is created on control plane nodes at /etc/kubernetes/manifests/kube-controller-manager-pod.yaml.'
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to root:root.
