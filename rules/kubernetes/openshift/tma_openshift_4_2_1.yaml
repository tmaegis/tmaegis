id: TMA-OPENSHIFT-4.2.1
title: Activate Garbage collection in OpenShift Container Platform 4, as appropriate
description: Configure garbage collection for containers and images as appropriate The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: low
tags:
- openshift
- worker-node
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 4.2.1 Activate Garbage collection in OpenShift Container Platform 4, as appropriate
audit:
  type: manual
  command: 'Two types of garbage collection are performed on an OpenShift Container Platform node: • Container garbage collection: Removes terminated containers. • Image garbage collection: Removes images not referenced by any running pods. Container garbage collection can be performed using eviction thresholds. Image garbage collection relies on disk usage as reported by cAdvisor on the node to decide which images to remove from the node.'
remediation:
  type: iac_patch
  command: To configure, follow the directions in Garbage Collection Remediation
