id: TMA-OPENSHIFT-5.7.4
title: The default namespace should not be used
description: Kubernetes provides a default namespace, where objects are placed if no namespace is specified for them. Placing objects in this namespace makes application of RBAC and other controls more difficult. The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: low
tags:
- openshift
- policies
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.7.4 The default namespace should not be used
audit:
  type: manual
  command: In OpenShift, projects (namespaces) are used to group and isolate related objects. When a request is made to create a new project using the web console or oc new-project command, an endpoint in OpenShift Container Platform is used to provision the project according to a template, which can be customized. The cluster administrator can allow and configure how developers and service accounts can create, or self-provision, their own projects. Regular users do not have access to the default project.
remediation:
  type: iac_patch
  command: Ensure that namespaces are created to allow for appropriate segregation of Kubernetes resources and that all new resources are created in a specific namespace.
