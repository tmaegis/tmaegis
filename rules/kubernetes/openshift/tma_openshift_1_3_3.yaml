id: TMA-OPENSHIFT-1.3.3
title: Ensure that the --service-account-private-key-file argument is set as appropriate
description: Explicitly set a service account private key file for service accounts on the controller manager. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- controller-manager
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.3.3 Ensure that the --service-account-private-key-file argument is set as appropriate
audit:
  type: manual
  command: 'OpenShift starts the Kubernetes Controller Manager with service-account-private-key-file set to /etc/kubernetes/static-pod-resources/secrets/service-account-private-key/service-account.key. The bootstrap configuration and overrides are available here: kube-controller-manager-pod bootstrap-config-overrides Run the following command: oc get configmaps config -n openshift-kube-controller-manager -ojson | \ jq -r ''.data["config.yaml"]'' | \ jq -r ''.extendedArguments["service-account-private-key-file"][]'' Verify that the following is returned ...'
remediation:
  type: iac_patch
  command: set --service-account-private-key-file argument as appropriate
