id: TMA-OPENSHIFT-1.2.22
title: Ensure that the --request-timeout argument is set
description: The API server minimum request timeout defines the minimum number of seconds a handler must keep a request open before timing it out. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.22 Ensure that the --request-timeout argument is set
audit:
  type: manual
  command: 'OpenShift configures the min-request-timeout flag via apiServerArguments[min-request-timeout], which overrides request-timeout and provides a more balanced timeout approach. Run the following command: oc get configmap config -n openshift-kube-apiserver -ojson | jq -r ''.data["config.yaml"]'' | jq ''.apiServerArguments["min-request-timeout"]'' Verify that the min-request-timeout argument is set to 3600.'
remediation:
  type: iac_patch
  command: Set --request-timeout argument
