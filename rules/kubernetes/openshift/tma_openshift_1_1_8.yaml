id: TMA-OPENSHIFT-1.1.8
title: Ensure that the etcd pod specification file ownership is set to root:root
description: Ensure that the /etc/kubernetes/manifests/etcd.yaml file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- control-plane
- etcd
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.8 Ensure that the etcd pod specification file ownership is set to root:root
audit:
  type: manual
  command: 'In OpenShift 4, starting with OpenShift 4.4, the etcd pod specification file is generated by the cluster etcd operator. The pod specification file is created on control plane nodes at /etc/kubernetes/manifests/etcd-member.yaml with ownership root:root. The default etcd pod specification file is available here: openshift/cluster-etcd-operator Run the following command : #Verify openshift-etcd ownership for i in $(oc get pods -n openshift-etcd -l app=etcd -o name | grep etcd ) do echo "check pod $i" oc rsh -n openshift-etcd $i \ stat -c %U:%G /etc/kubernetes/manifests/etcd-pod.yaml ...'
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to root:root.
