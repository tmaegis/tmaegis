id: TMA-OPENSHIFT-5.5.1
title: Configure Image Provenance using image controller configuration parameters
description: Configure Image Provenance for your deployment. The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: low
tags:
- openshift
- policies
- registry
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.5.1 Configure Image Provenance using image controller configuration parameters
audit:
  type: manual
  command: 'Review the image controller parameters in your cluster and verify that image provenance is configured as appropriate. Run the following command to return all registry sources: oc get image.config.openshift.io/cluster -o json | jq .spec.registrySources If nothing is returned, this is a finding and you should refer to the OpenShift image guide for configuring trusted registries.'
remediation:
  type: iac_patch
  command: 'Follow the OpenShift documentation: Image configuration resources'
