id: TMA-OPENSHIFT-4.2.11
title: Verify that the RotateKubeletServerCertificate argument is set to true
description: Enable kubelet server certificate rotation. The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: medium
tags:
- openshift
- worker-node
- kubelet
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 4.2.11 Verify that the RotateKubeletServerCertificate argument is set to true
audit:
  type: manual
  command: 'Run the following command to check if the RotateKubeletServerCertificate feature gate is enabled on each node: for node in $(oc get nodes -ojsonpath=''{.items[*].metadata.name}''); do oc get --raw /api/v1/nodes/$node/proxy/configz | jq ''.kubeletconfig.featureGates.RotateKubeletServerCertificate'' done Verify that all nodes return true. Run the following command to check that each node is configured to rotate certificates: for node in $(oc get nodes -ojsonpath=''{.items[*].metadata.name}'').'
remediation:
  type: iac_patch
  command: Set the RotateKubeletServerCertificate argument to true.
