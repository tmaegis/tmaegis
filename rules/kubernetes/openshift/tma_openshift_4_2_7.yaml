id: TMA-OPENSHIFT-4.2.7
title: Ensure that the --make-iptables-util-chains argument is set to true
description: Allow Kubelet to manage iptables. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- worker-node
- kubelet
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 4.2.7 Ensure that the --make-iptables-util-chains argument is set to true
audit:
  type: manual
  command: Use the following command to ensure each node sets makeIPTablesUtilChains to true. for node in $(oc get nodes -ojsonpath='{.items[*].metadata.name}'); do oc get --raw /api/v1/nodes/$node/proxy/configz | jq '.kubeletconfig.makeIPTablesUtilChains' done Verify the output returned for each node is true.
remediation:
  type: iac_patch
  command: Set makeIPTablesUtilChains argument to `true'.
