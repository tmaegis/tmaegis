id: TMA-OPENSHIFT-1.1.21
title: Ensure that the OpenShift PKI key file permissions are set to 600
description: Ensure that the OpenShift PKI key files have permissions of 600. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.21 Ensure that the OpenShift PKI key file permissions are set to 600
audit:
  type: manual
  command: Keys for control plane components like kube-apiserver, kube-controller-manager, ube-scheduler and etcd are stored with their respective static pod configurations in the directory /etc/kubernetes/static-pod-certs/secrets. Key files all have permissions 600. Run the following command. for i in $(oc -n openshift-kube-apiserver get pod -l app=openshift-kube-apiserver -o jsonpath='{.items[*].metadata.name}') do echo $i static-pod-certs oc exec -n openshift-kube-apiserver $i -c kube-apiserver -- \ find /etc/kubernetes/static-pod-certs -type f -wholename '*/secrets/*.key' -exec stat -c %a ...
remediation:
  type: iac_patch
  command: No remediation required; file permissions are managed by the operator.
