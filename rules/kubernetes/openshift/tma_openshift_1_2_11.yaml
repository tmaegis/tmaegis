id: TMA-OPENSHIFT-1.2.11
title: Ensure that the admission control plugin NamespaceLifecycle is set
description: Reject creating objects in a namespace that is undergoing termination. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.11 Ensure that the admission control plugin NamespaceLifecycle is set
audit:
  type: manual
  command: 'OpenShift enables the NamespaceLifecycle plugin by default. Use the following command to obtain a list of configured admission controllers: oc -n openshift-kube-apiserver get configmap config -o json | jq -r ''.data."config.yaml"'' | jq ''.apiServerArguments."enable-admission-plugins"'' Verify that NamespaceLifecycle is present in the returned list.'
remediation:
  type: iac_patch
  command: Configure NamespaceLifecycle admission controller.
