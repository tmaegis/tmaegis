id: TMA-OPENSHIFT-1.2.4
title: Verify that the kubelet certificate authority is set as appropriate
description: Verify kubelet's certificate before establishing connection. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- kubelet
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.4 Verify that the kubelet certificate authority is set as appropriate
audit:
  type: manual
  command: OpenShift does not use the --kubelet-certificate-authority flag. OpenShift utilizes X.509 certificates for authentication of the control-plane components. OpenShift configures the API server to use an internal certificate authority (CA) to validate the user certificate sent during TLS negotiation. If the CA validation of the certificate is successful, the request is authenticated and user information is derived from the certificate subject fields.
remediation:
  type: iac_patch
  command: No remediation is required. OpenShift platform components use X.509 certificates for authentication. OpenShift manages the CAs and certificates for platform components. This is not configurable.
