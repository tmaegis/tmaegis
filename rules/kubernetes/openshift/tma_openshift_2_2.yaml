id: TMA-OPENSHIFT-2.2
title: Ensure that the --client-cert-auth argument is set to true
description: Enable client authentication on etcd service. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.2 Ensure that the --client-cert-auth argument is set to true
audit:
  type: manual
  command: 'OpenShift uses X.509 certificates to provide secure communication to etcd. OpenShift installation generates these files and sets the arguments appropriately. The following certificates are generated and used by etcd and other processes that communicate with etcd: • Client certificates: Client certificates are currently used by the API server only, and no other service should connect to etcd directly except for the proxy.'
remediation:
  type: iac_patch
  command: This setting is managed by the cluster etcd operator. No remediation required.
