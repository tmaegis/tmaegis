id: TMA-OPENSHIFT-1.3.4
title: Ensure that the --root-ca-file argument is set as appropriate
description: Allow pods to verify the API server's serving certificate before establishing connections. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- controller-manager
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.3.4 Ensure that the --root-ca-file argument is set as appropriate
audit:
  type: manual
  command: 'Certificates for OpenShift platform components are automatically created and rotated by the OpenShift Container Platform. Run the following command: oc get configmaps config -n openshift-kube-controller-manager -ojson | \ jq -r ''.data["config.yaml"]'' | \ jq -r ''.extendedArguments["root-ca-file"][]'' Verify that the --root-ca-file argument exists and is set to /etc/kubernetes/static-pod-resources/configmaps/serviceaccount-ca/ca-bundle.crt.'
remediation:
  type: iac_patch
  command: set --root-ca-file argument
