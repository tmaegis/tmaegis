id: TMA-OPENSHIFT-5.1.5
title: Ensure that default service accounts are not actively used.
description: The default service account should not be used to ensure that rights granted to applications can be more easily audited and reviewed. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- policies
- rbac
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.1.5 Ensure that default service accounts are not actively used.
audit:
  type: manual
  command: Every OpenShift project has its own service accounts. Every service account has an associated user name that can be granted roles, just like a regular user. The user name for each service account is derived from its project and the name of the service account. Service accounts are required in each project to run builds, deployments, and other pods. The default service accounts that are automatically created for each project are isolated by the project namespace.
remediation:
  type: iac_patch
  command: Create service accounts as needed.
