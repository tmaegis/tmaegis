id: TMA-OPENSHIFT-2.3
title: Ensure that the --auto-tls argument is not set to true
description: Do not use self-signed certificates for TLS. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.3 Ensure that the --auto-tls argument is not set to true
audit:
  type: manual
  command: OpenShift configures etcd with secure communication. Openshift installs etcd as static pods on control plane nodes, and mounts the configuration files from /etc/etcd/ on the host. The etcd.conf file includes auto-tls configurations as referenced in /etc/etcd/etcd.conf. OpenShift 4 includes multiple CAs providing independent chains of trust, which ensure that a platform CA will never accidentally sign a certificate that can be used for the wrong purpose, increasing the security posture of the cluster.
remediation:
  type: iac_patch
  command: This setting is managed by the cluster etcd operator. No remediation required.
