id: TMA-OPENSHIFT-1.1.18
title: Ensure that the Controller Manager kubeconfig file ownership is set to root:root
description: Ensure that the kubeconfig file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.18 Ensure that the Controller Manager kubeconfig file ownership is set to root:root
audit:
  type: manual
  command: 'Run the following command: for i in $(oc get pods -n openshift-kube-controller-manager -l app=kube-controller-manager -oname) do oc exec -n openshift-kube-controller-manager $i -- \ stat -c %U:%G /etc/kubernetes/static-pod-resources/configmaps/controller-manager-kubeconfig/kubeconfig done Verify that the ownership is set to root:root.'
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to root:root.
