id: TMA-OPENSHIFT-1.1.17
title: Ensure that the Controller Manager kubeconfig file permissions are set to 600 or more restrictive
description: Ensure that the kubeconfig file mounted into the Controller Manager has permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.17 Ensure that the Controller Manager kubeconfig file permissions are set to 600 or more restrictive
audit:
  type: manual
  command: The kubeconfig file for kube-controller-manager is stored in the ConfigMap controller-manager-kubeconfig in the namespace openshift-kube-controller-manager. The kubeconfig file is referenced in the pod via hostpath and is stored in /etc/kubernetes/static-pod-resources/configmaps/controller-manager-kubeconfig/kubeconfig with permissions 600. Run the following command.
remediation:
  type: iac_patch
  command: There is no remediation for updating the permissions of the kubeconfig file. The file is owned by an OpenShift operator and any changes to the file will result in a degraded cluster state. Please do not attempt to remediate the permissions of this file.
