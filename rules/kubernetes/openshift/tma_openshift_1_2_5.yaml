id: TMA-OPENSHIFT-1.2.5
title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
description: Do not always authorize all requests. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: critical
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.5 Ensure that the --authorization-mode argument is not set to AlwaysAllow
audit:
  type: manual
  command: It is not possible to configure an OpenShift cluster to allow all requests. OpenShift is configured at bootstrap time to use RBAC to authorize requests. Role-based access control (RBAC) objects determine what actions a user is allowed to perform on what objects in an OpenShift cluster. Cluster administrators manage RBAC for the cluster. Project owners can manage RBAC for their individual OpenShift projects. The OpenShift API server configmap does not use the authorization-mode flag.
remediation:
  type: iac_patch
  command: RBAC is always on and the OpenShift API server does not use the values assigned to the flag authorization-mode.
