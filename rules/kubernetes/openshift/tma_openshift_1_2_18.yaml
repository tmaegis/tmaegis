id: TMA-OPENSHIFT-1.2.18
title: Ensure that the --audit-log-path argument is set
description: Enable auditing on the Kubernetes API Server and set the desired audit log path. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
- logging
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.18 Ensure that the --audit-log-path argument is set
audit:
  type: manual
  command: 'OpenShift audit works at the API server level, logging all requests coming to the server. API server audit is on by default. Run the following command to find the Kubernetes API audit log path: oc get configmap config -n openshift-kube-apiserver -ojson | jq -r ''.data["config.yaml"]'' | jq ''.apiServerArguments["audit-log-path"]'' Verify the path is /var/log/kube-apiserver/audit.log.'
remediation:
  type: iac_patch
  command: Set the --audit-log-path argument
