id: TMA-OPENSHIFT-1.3.2
title: Ensure that the --use-service-account-credentials argument is set to true
description: Use individual service account credentials for each controller. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- controller-manager
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.3.2 Ensure that the --use-service-account-credentials argument is set to true
audit:
  type: manual
  command: 'In OpenShift, --use-service-account-credentials is set to true by default for the Controller Manager. The bootstrap configuration and overrides are available here: kube-controller-manager-pod bootstrap-config-overrides Run the following command on the master node: oc get configmaps config -n openshift-kube-controller-manager -ojson | \ jq -r ''.data["config.yaml"]'' | \ jq -r ''.extendedArguments["use-service-account-credentials"][]'' Verify that the --use-service-account-credentials argument is set to true.'
remediation:
  type: iac_patch
  command: set --use-service-account-credentials to true
