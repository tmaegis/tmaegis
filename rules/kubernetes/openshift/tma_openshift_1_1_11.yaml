id: TMA-OPENSHIFT-1.1.11
title: Ensure that the etcd data directory permissions are set to 700 or more restrictive
description: Ensure that the etcd data directory has permissions of 700 or more restrictive. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- control-plane
- etcd
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.11 Ensure that the etcd data directory permissions are set to 700 or more restrictive
audit:
  type: manual
  command: In OpenShift 4, etcd members are deployed on the master nodes as static pods. The pod specification file is created on control plane nodes at /etc/kubernetes/manifests/etcd-member.yaml. The etcd database is stored on the container host in /var/lib/etcd and mounted to the etcd-member container via the host path mount data-dir with the same filesystem path (/var/lib/etcd). The permissions for this directory on the container host is 700. Starting with OCP 4.4, etcd is managed by the cluster-etcd-operator. The etcd operator will help to automate restoration of master nodes.
remediation:
  type: iac_patch
  command: No remediation required. File permissions are managed by the etcd operator.
