id: TMA-OPENSHIFT-1.1.12
title: Ensure that the etcd data directory ownership is set to root:root
description: Ensure that the etcd data directory ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- control-plane
- etcd
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.12 Ensure that the etcd data directory ownership is set to root:root
audit:
  type: manual
  command: In OpenShift 4, etcd members are deployed on the master nodes as static pods. The etcd database is stored on the master nodes in /var/lib/etcd and mounted to the etcd-member container via the host path mount data-dir with the same filesystem path (/var/lib/etcd). The ownership for this directory on the etcd-member container and on the container host is root:root. Starting with OCP 4.4, etcd is managed by the cluster-etcd-operator. The etcd operator will help to automate restoration of master nodes. There is also a new etcdctl container in the etcd static pod for quick debugging.
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to root:root.
