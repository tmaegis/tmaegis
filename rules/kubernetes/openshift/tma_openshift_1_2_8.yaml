id: TMA-OPENSHIFT-1.2.8
title: Ensure that the admission control plugin AlwaysAdmit is not set
description: Do not allow all requests. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.8 Ensure that the admission control plugin AlwaysAdmit is not set
audit:
  type: manual
  command: 'This controller is disabled by default in OpenShift and cannot be enabled. It has also been deprecated by the Kubernetes community as it behaves as if there were no controller. Use the following command to verify the configured admission controllers: oc -n openshift-kube-apiserver get configmap config -o json | jq -r ''.data."config.yaml"'' | jq ''.apiServerArguments."enable-admission-plugins"'' The output should not include AlwaysAdmit.'
remediation:
  type: iac_patch
  command: None.
