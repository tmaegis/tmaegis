id: TMA-OPENSHIFT-1.1.1
title: Ensure that the API server pod specification file permissions are set to 600 or more restrictive
description: Ensure that the API server pod specification file has permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.1 Ensure that the API server pod specification file permissions are set to 600 or more restrictive
audit:
  type: manual
  command: 'OpenShift 4 deploys two API servers: the OpenShift API server and the Kube API server. The OpenShift API server delegates requests for Kubernetes objects to the Kube API server. The OpenShift API server is managed as a deployment. The pod specification yaml for openshift-apiserver is stored in etcd. The Kube API Server is managed as a static pod. The pod specification file for the kube-apiserver is created on the control plane nodes at /etc/kubernetes/manifests/kube-apiserver-pod.yaml.'
remediation:
  type: iac_patch
  command: There is no remediation for updating the permissions of kube-apiserver-pod.yaml. The file is owned by an OpenShift operator and any changes to the file will result in a degraded cluster state. Please do not attempt to remediate the permissions of this file.
