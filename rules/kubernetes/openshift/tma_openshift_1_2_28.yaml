id: TMA-OPENSHIFT-1.2.28
title: Ensure that the --etcd-cafile argument is set as appropriate
description: etcd should be configured to make use of TLS encryption for client connections. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.28 Ensure that the --etcd-cafile argument is set as appropriate
audit:
  type: manual
  command: OpenShift uses X.509 certificates to provide secure communication to etcd. OpenShift does not use values assigned to the etcd-cafile argument. OpenShift generates the etcd-cafile and sets the arguments appropriately in the API server. OpenShift includes multiple certificate authorities (CAs) providing independent chains of trust, increasing the security posture of the cluster. The certificates generated by each CA are used to identify a particular OpenShift platform component to another OpenShift platform component. Communication with etcd is secured by the etcd serving CA.
remediation:
  type: iac_patch
  command: Ensure that the --etcd-cafile argument is set as appropriate
