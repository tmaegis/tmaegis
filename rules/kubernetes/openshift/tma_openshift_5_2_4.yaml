id: TMA-OPENSHIFT-5.2.4
title: Minimize the admission of containers wishing to share the host network namespace
description: Do not generally permit containers to be run with the hostNetwork flag set to true. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- policies
- pod-security
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.2.4 Minimize the admission of containers wishing to share the host network namespace
audit:
  type: manual
  command: 'Use the following command to list all SCCs with allowHostNetwork set to false: oc get scc -A -o json | jq ''.items[] | select(.allowHostNetwork==false) | .metadata.name'' Verify at least one SCC is returned.'
remediation:
  type: iac_patch
  command: Create an SCC that sets allowHostNetwork to false and take it into use by assigning it to applicable users and groups.
