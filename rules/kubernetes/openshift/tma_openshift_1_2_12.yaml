id: TMA-OPENSHIFT-1.2.12
title: Ensure that the admission control plugin SecurityContextConstraint is set
description: Reject creating pods that do not match Pod Security Policies. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.12 Ensure that the admission control plugin SecurityContextConstraint is set
audit:
  type: manual
  command: OpenShift provides the same protection via the SecurityContextConstraints admission plugin, which is enabled by default. The PodSecurityPolicy admission control plugin is disabled by default as it is still beta and not yet supported with OpenShift. Security Context Constraints (SCCs) and Pod Security Policy cannot be used on the same cluster.
remediation:
  type: iac_patch
  command: Configure the SecurityContextConstraints admission controller.
