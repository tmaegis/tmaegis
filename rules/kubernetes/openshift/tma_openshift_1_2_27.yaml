id: TMA-OPENSHIFT-1.2.27
title: Ensure that the --client-ca-file argument is set as appropriate
description: Setup TLS connection on the API server. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.27 Ensure that the --client-ca-file argument is set as appropriate
audit:
  type: manual
  command: OpenShift uses X.509 certificates to provide secure connections between API server and node/kubelet by default. OpenShift configures the client-ca-file value and does not use value assigned to the client-ca-file flag. OpenShift generates the necessary files and sets the arguments appropriately. The API server is accessible by clients external to the cluster at api.<cluster_name>.<base_domain>.
remediation:
  type: iac_patch
  command: Ensure that the --client-ca-file argument is set as appropriate
