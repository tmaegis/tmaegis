id: TMA-OPENSHIFT-1.2.9
title: Ensure that the admission control plugin AlwaysPullImages is not set
description: Always pull images. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
- registry
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.9 Ensure that the admission control plugin AlwaysPullImages is not set
audit:
  type: manual
  command: 'Use the following command to obtain a list of configured admission controllers: oc -n openshift-kube-apiserver get configmap config -o json | jq -r ''.data."config.yaml"'' | jq ''.apiServerArguments."enable-admission-plugins"'' Verify the list does not include AlwaysPullImages.'
remediation:
  type: iac_patch
  command: Modify the failed cluster and remove the 'AlwaysPullImages' configuration setting.
