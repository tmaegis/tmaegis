id: TMA-OPENSHIFT-2.6
title: Ensure that the --peer-auto-tls argument is not set to true
description: Do not use automatically generated self-signed certificates for TLS connections between peers. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.6 Ensure that the --peer-auto-tls argument is not set to true
audit:
  type: manual
  command: OpenShift does not use the --peer-auto-tls argument. OpenShift 4 includes multiple CAs providing independent chains of trust, which ensure that a platform CA will never accidentally sign a certificate that can be used for the wrong purpose, increasing the security posture of the cluster. These internal self-signing CAs enable automation because the key is known to the cluster. The certificates generated by each CA are used to identify a particular OpenShift platform component to another OpenShift platform component.
remediation:
  type: iac_patch
  command: This setting is managed by the cluster etcd operator. No remediation required.
