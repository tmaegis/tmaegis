id: TMA-OPENSHIFT-1.2.30
title: Ensure that the API Server only makes use of Strong Cryptographic Ciphers
description: Ensure that the API server is configured to only use strong cryptographic ciphers. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.30 Ensure that the API Server only makes use of Strong Cryptographic Ciphers
audit:
  type: manual
  command: 'Ciphers for the API servers, authentication operator, and ingress controller can be configured using the tlsSecurityProfile parameter. The ingress controller provides external access to the API server. There are four TLS security profile types: • Old • Intermediate • Modern • Custom Only the Old, Intermediate and Custom profiles are supported at this time. Custom provides the ability to specify individual TLS security profile parameters. Follow the steps in the documentation to configure the cipher suite for Ingress and the API server.'
remediation:
  type: iac_patch
  command: Use the Intermediate or above TLS profile, which requires a minimum of TLS 1.2.
