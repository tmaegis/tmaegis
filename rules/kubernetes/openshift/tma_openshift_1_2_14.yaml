id: TMA-OPENSHIFT-1.2.14
title: Ensure that the --insecure-bind-address argument is not set
description: Do not bind the insecure API service. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.14 Ensure that the --insecure-bind-address argument is not set
audit:
  type: manual
  command: The openshift-kube-apiserver is served over HTTPS with authentication and authorization; the secure API endpoint for the penshift-kube-apiserver is bound to 0.0.0.0:6443 by default. Note that the openshift-apiserver is not running in the host network namespace. The port is not exposed on the node, but only through the pod network. Use the following command to obtain a list of configured feature gates on the API server.
remediation:
  type: iac_patch
  command: Remove --insecure-bind-address from the openshift-kube-apiserver
