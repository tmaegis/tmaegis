id: TMA-OPENSHIFT-1.2.19
title: Ensure that the audit logs are forwarded off the cluster for retention
description: Retain the logs for at least 30 days or as appropriate. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
- logging
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.19 Ensure that the audit logs are forwarded off the cluster for retention
audit:
  type: manual
  command: 'OpenShift audit works at the API server level, logging all requests coming to the server. Audit is on by default. Best practice is to ship audit logs off the cluster for retention. OpenShift includes the optional Cluster Logging operator and the elasticSearch operator. OpenShift cluster logging can be configured to send logs to destinations outside of your OpenShift Container Platform cluster instead of the default elasticsearch log store using the following methods: • Sending logs using the fluentd forward protocol.'
remediation:
  type: iac_patch
  command: Follow the documentation for log forwarding. Forwarding logs to third party systems.
