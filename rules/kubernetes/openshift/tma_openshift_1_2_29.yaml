id: TMA-OPENSHIFT-1.2.29
title: Ensure that encryption providers are appropriately configured
description: Where etcd encryption is used, appropriate providers should be configured. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- secrets
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.29 Ensure that encryption providers are appropriately configured
audit:
  type: manual
  command: OpenShift supports encryption of data at rest of etcd datastore, but it is up to the customer to configure. The asecbc cipher had been the only supported cipher up to OCP 4.13. Starting with OCP 4.13, the aescgm cipher can be used as well. No other ciphers are supported. Keys are stored on the filesystem of the master and automatically rotated.
remediation:
  type: iac_patch
  command: Follow the OpenShift documentation for encrypting etcd data.
