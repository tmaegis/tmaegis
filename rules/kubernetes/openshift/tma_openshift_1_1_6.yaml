id: TMA-OPENSHIFT-1.1.6
title: Ensure that the scheduler pod specification file ownership is set to root:root
description: Ensure that the scheduler pod specification file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.6 Ensure that the scheduler pod specification file ownership is set to root:root
audit:
  type: manual
  command: In OpenShift 4, the kube-scheduler is deployed as a static pod and its pod specification file is created on control plane nodes at /etc/kubernetes/manifests/kube-scheduler-pod.yaml. It is mounted via hostpath to the kube-controller-manager pods via /etc/kubernetes/static-pod-resources/kube-scheduler-pod.yaml with ownership root:root. Run the following command.
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to root:root.
