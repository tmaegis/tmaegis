id: TMA-OPENSHIFT-5.7.3
title: Apply Security Context to Your Pods and Containers
description: Apply Security Context to Your Pods and Containers The benchmark marks this recommendation Manual.
target: openshift
level: 2
severity: low
tags:
- openshift
- policies
- pod-security
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.7.3 Apply Security Context to Your Pods and Containers
audit:
  type: manual
  command: Review the pod definitions in your cluster and verify that you have security contexts defined as appropriate. OpenShift's Security Context Constraint feature is on by default in OpenShift 4 and applied to all pods deployed. SCC selection is determined by a combination of the values in the securityContext and the rolebindings for the account deploying the pod.
remediation:
  type: iac_patch
  command: Follow the Kubernetes documentation and apply security contexts to your pods. For a suggested list of security contexts, you may refer to the CIS Security Benchmark for Docker Containers.
