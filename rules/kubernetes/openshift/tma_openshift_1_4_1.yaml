id: TMA-OPENSHIFT-1.4.1
title: Ensure that the healthz endpoints for the scheduler are protected by RBAC
description: Disable profiling, if not needed. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- scheduler
- rbac
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.4.1 Ensure that the healthz endpoints for the scheduler are protected by RBAC
audit:
  type: manual
  command: In OpenShift 4, The Kubernetes Scheduler operator manages and updates the Kubernetes Scheduler deployed on top of OpenShift. By default, the operator exposes metrics via metrics service. The metrics are collected from the Kubernetes Scheduler operator. Profiling data is sent to healthzPort, the port of the localhost healthz endpoint. Changing this value may disrupt components that monitor the kubelet health.
remediation:
  type: iac_patch
  command: Enable profiling.
