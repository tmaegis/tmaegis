id: TMA-OPENSHIFT-5.2.2
title: Minimize the admission of containers wishing to share the host process ID namespace
description: Do not generally permit containers to be run with the hostPID flag set to true. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- policies
- pod-security
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.2.2 Minimize the admission of containers wishing to share the host process ID namespace
audit:
  type: manual
  command: 'Use the following command to list all SCCs with allowHostPID set to true: oc get scc -o json | jq ''.items[] | select(.allowHostPID) | .metadata.name'' Verify that at least one SCC is returned.'
remediation:
  type: iac_patch
  command: Create an SCC that sets allowHostPID to false and take it into use by assigning it to applicable users and groups.
