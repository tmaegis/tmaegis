id: TMA-OPENSHIFT-1.2.26
title: Ensure that the --tls-cert-file and --tls-private-key-file arguments are set as appropriate
description: Setup TLS connection on the API server. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.26 Ensure that the --tls-cert-file and --tls-private-key-file arguments are set as appropriate
audit:
  type: manual
  command: OpenShift uses X.509 certificates to provide secure connections between API server and node/kubelet by default. OpenShift does not use values assigned to the tls-cert-file or tls-private-key-file flags. OpenShift generates the certificate files and sets the arguments appropriately. The API server is accessible by clients external to the cluster at api.<cluster_name>.<base_domain>.
remediation:
  type: iac_patch
  command: Ensure that the --tls-cert-file and --tls-private-key-file arguments are set
