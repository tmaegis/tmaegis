id: TMA-OPENSHIFT-1.1.10
title: Ensure that the Container Network Interface file ownership is set to openvswitch:openvswitch
description: Ensure that the Container Network Interface files have ownership set to openvswitch:openvswitch. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- network
- file-permissions
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.10 Ensure that the Container Network Interface file ownership is set to openvswitch:openvswitch
audit:
  type: manual
  command: The Cluster Network Operator (CNO) deploys and manages the cluster network components on an OpenShift Container Platform cluster. This includes the Container Network Interface (CNI) default network provider plug-in selected for the cluster during installation. OpenShift Container Platform uses the Multus CNI plug-in to allow chaining of CNI plug-ins. The default Pod network must be configured during cluster installation. By default, the CNO deploys the OpenShift SDN as the default Pod network.
remediation:
  type: iac_patch
  command: Execute the chown command to remediate ownership and set it file ownership to openvswitch:openvswitch.
