id: TMA-OPENSHIFT-2.5
title: Ensure that the --peer-client-cert-auth argument is set to true
description: etcd should be configured for peer authentication. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- etcd
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 2.5 Ensure that the --peer-client-cert-auth argument is set to true
audit:
  type: manual
  command: OpenShift uses X.509 certificates to provide secure communication to etcd. OpenShift generates these files and sets the arguments appropriately. etcd certificates are used for encrypted communication between etcd member peers, as well as encrypted client traffic. Peer certificates are generated and used for communication between etcd members. Openshift installs etcd as static pods on control plane nodes, and mounts the configuration files from /etc/etcd/ on the host. The etcd.conf file includes peer-client-cert-auth configurations as referenced in /etc/etcd/etcd.conf.
remediation:
  type: iac_patch
  command: set --peer-client-cert-authargument totrue'.
