id: TMA-OPENSHIFT-1.3.1
title: Ensure that controller manager healthz endpoints are protected by RBAC
description: Disable profiling, if not needed. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- controller-manager
- rbac
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.3.1 Ensure that controller manager healthz endpoints are protected by RBAC
audit:
  type: manual
  command: By default, the Controller Manager operator exposes metrics via the metrics service. Profiling data is sent to healthzPort, the port of the localhost healthz endpoint. Changing this value may disrupt components that monitor the kubelet health. To ensure the collected data is not exploited, profiling endpoints are secured via RBAC (see cluster-debugger role). By default, the profiling endpoints are accessible only by users bound to cluster-admin or cluster-debugger role. Profiling can not be disabled.
remediation:
  type: iac_patch
  command: Create OpenShift Controller Manager and the Kubernetes Controller Manager and protect it by RBAC
