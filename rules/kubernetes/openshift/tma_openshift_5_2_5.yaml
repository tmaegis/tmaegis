id: TMA-OPENSHIFT-5.2.5
title: Minimize the admission of containers with allowPrivilegeEscalation
description: Do not generally permit containers to be run with the allowPrivilegeEscalation flag set to true. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- policies
- pod-security
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.2.5 Minimize the admission of containers with allowPrivilegeEscalation
audit:
  type: manual
  command: 'Use the following command to list all SCCs with allowPrivilegeEscalation set to false: oc get scc -A -o json | jq ''.items[] | select(.allowPrivilegeEscalation==false) | .metadata.name'' Verify that there is at least one SCC is returned.'
remediation:
  type: iac_patch
  command: Create an SCC that sets allowPrivilegeEscalation to false and take it into use by assigning it to applicable users and groups.
