id: TMA-OPENSHIFT-1.1.2
title: Ensure that the API server pod specification file ownership is set to root:root
description: Ensure that the API server pod specification file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- control-plane
- file-permissions
- api-server
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.1.2 Ensure that the API server pod specification file ownership is set to root:root
audit:
  type: manual
  command: 'OpenShift 4 deploys two API servers: the OpenShift API server and the Kube API server. The OpenShift API server is managed as a deployment. The pod specification yaml for openshift-apiserver is stored in etcd. The Kube API Server is managed as a static pod. The pod specification file for the kube-apiserver is created on the control plane nodes at /etc/kubernetes/manifests/kube-apiserver-pod.yaml. The kube-apiserver is mounted via hostpath to the kube-apiserver pods via /etc/kubernetes/static-pod-resources/kube-apiserver-pod.yaml with ownership root:root.'
remediation:
  type: iac_patch
  command: No remediation required; file permissions are managed by the operator.
