id: TMA-OPENSHIFT-1.2.6
title: Verify that RBAC is enabled
description: Turn on Role Based Access Control. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: high
tags:
- openshift
- api-server
- rbac
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.6 Verify that RBAC is enabled
audit:
  type: manual
  command: OpenShift is configured at bootstrap time to use Role-Based Access Control (RBAC) to authorize requests. RBAC objects determine what actions a user is allowed to perform on what objects in an OpenShift cluster. Cluster administrators manage RBAC for the cluster. Project owners can manage RBAC for their individual OpenShift projects.
remediation:
  type: iac_patch
  command: Turn on Role Based Access Control.
