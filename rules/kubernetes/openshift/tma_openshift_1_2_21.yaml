id: TMA-OPENSHIFT-1.2.21
title: Configure Kubernetes API Server Maximum Audit Log Size
description: Audit logs are rotated upon reaching a maximum size, which is set to 100 MB or greater by default. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- api-server
- logging
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 1.2.21 Configure Kubernetes API Server Maximum Audit Log Size
audit:
  type: manual
  command: 'OpenShift audit works at the API server level, logging all requests coming to the server. Configure via audit-log-maxsize. Run the following command: oc get configmap config -n openshift-kube-apiserver -ojson | jq -r ''.data["config.yaml"]'' | jq -r ''.apiServerArguments["audit-log-maxsize"][]?'' Verify that the audit-log-maxsize argument is set to 100 or greater'
remediation:
  type: iac_patch
  command: The audit-log-maxsize parameter is set by default by Red Hat and not supported to change.
