id: TMA-OPENSHIFT-5.3.1
title: Ensure that the CNI in use supports Network Policies
description: There are a variety of CNI plugins available for Kubernetes. If the CNI in use does not support Network Policies it may not be possible to effectively restrict traffic in the cluster. The benchmark marks this recommendation Manual.
target: openshift
level: 1
severity: medium
tags:
- openshift
- policies
- network
reference: CIS Red Hat OpenShift Container Platform Benchmark v2.0.0 - 5.3.1 Ensure that the CNI in use supports Network Policies
audit:
  type: manual
  command: Review the documentation of the CNI plugin (OpenShift SDN or OVN-Kubernetes) in use by the cluster, and confirm that it supports ingress and egress network policies. OpenShift Container Platform uses a software-defined networking (SDN) approach to offer a unified cluster network that enables communication between Pods across the OpenShift Container Platform cluster. This Pod network can be established and maintained by either the OpenShift SDN plugin, which configures an overlay network using Open vSwitch (OVS), or by the OVN-Kubernetes plugin.
remediation:
  type: iac_patch
  command: Implement a network policy.
