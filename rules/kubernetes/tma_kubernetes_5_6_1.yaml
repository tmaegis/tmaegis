id: TMA-KUBERNETES-5.6.1
title: Create administrative boundaries between resources using namespaces
description: Use namespaces to isolate your Kubernetes objects. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: low
tags:
- kubernetes
- policies
reference: CIS Kubernetes Benchmark v2.1.0 - 5.6.1 Create administrative boundaries between resources using namespaces
audit:
  type: manual
  command: Run the below command and review the namespaces created in the cluster. kubectl get namespaces Ensure that these namespaces are the ones you need and are adequately administered as per your requirements.
remediation:
  type: iac_patch
  command: Follow the documentation and create namespaces for objects in your deployment as you need them.
