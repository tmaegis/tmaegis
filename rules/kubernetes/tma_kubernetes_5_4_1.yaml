id: TMA-KUBERNETES-5.4.1
title: Prefer using secrets as files over secrets as environment variables
description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment variable secrets. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions. Reports containers using env valueFrom.secretKeyRef or envFrom.secretRef. The benchmark marks this Manual; this audit automates its kubectl inventory step.
target: kubernetes
level: 2
severity: medium
tags:
- kubernetes
- policies
- secrets
reference: CIS Kubernetes Benchmark v2.1.0 - 5.4.1 Prefer using secrets as files over secrets as environment variables
audit:
  type: command
  command: |-
    out=$(kubectl get pods -A -o go-template='{{range .items}}{{$ns:=.metadata.namespace}}{{$p:=.metadata.name}}{{range .spec.containers}}{{$c:=.name}}{{range .env}}{{if .valueFrom}}{{if .valueFrom.secretKeyRef}}{{$ns}} {{$p}} {{$c}} env{{"\n"}}{{end}}{{end}}{{end}}{{range .envFrom}}{{if .secretRef}}{{$ns}} {{$p}} {{$c}} envFrom{{"\n"}}{{end}}{{end}}{{end}}{{range .spec.initContainers}}{{$c:=.name}}{{range .env}}{{if .valueFrom}}{{if .valueFrom.secretKeyRef}}{{$ns}} {{$p}} {{$c}} env{{"\n"}}{{end}}{{end}}{{end}}{{range .envFrom}}{{if .secretRef}}{{$ns}} {{$p}} {{$c}} envFrom{{"\n"}}{{end}}{{end}}{{end}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$out" | awk -v ex='^(kube-system|kube-public|kube-node-lease)$' 'NF && $1 !~ ex && (1)')
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: If possible, rewrite application code to read secrets from mounted secret files, rather than from environment variables.
