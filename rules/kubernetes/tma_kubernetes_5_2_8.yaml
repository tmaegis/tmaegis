id: TMA-KUBERNETES-5.2.8
title: Minimize the admission of containers with the NET_RAW capability
description: Do not generally permit containers with the potentially dangerous NET_RAW capability. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.8 Minimize the admission of containers with the NET_RAW capability
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that at least one policy disallows the admission of containers with the NET_RAW capability.
remediation:
  type: iac_patch
  command: Add policies to each namespace in the cluster which has user workloads to restrict the admission of containers with the NET_RAW capability.
