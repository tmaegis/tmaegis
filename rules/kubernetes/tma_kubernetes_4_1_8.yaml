id: TMA-KUBERNETES-4.1.8
title: Ensure that the client certificate authorities file ownership is set to root:root
description: Ensure that the certificate authorities file ownership is set to root:root. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- worker-node
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.8 Ensure that the client certificate authorities file ownership is set to root:root
audit:
  type: manual
  command: 'Run the following command: ps -ef | grep kubelet Find the file specified by the --client-ca-file argument. Run the following command: stat -c %U:%G <filename> Verify that the ownership is set to root:root.'
remediation:
  type: iac_patch
  command: Run the following command to modify the ownership of the --client-ca-file. chown root:root <filename>
