id: TMA-KUBERNETES-5.1.10
title: Minimize access to the proxy sub-resource of nodes
description: Users with access to the proxy sub-resource of node objects automatically have permissions to use the kubelet API, which may allow for privilege escalation or bypass cluster security controls such as audit logs. The kubelet provides an API which includes rights to execute commands in any container running on the node. Access to this API is covered by permissions to the main Kubernetes API via the node object. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.10 Minimize access to the proxy sub-resource of nodes
audit:
  type: manual
  command: Review the users who have access to the proxy sub-resource of node objects in the Kubernetes API.
remediation:
  type: iac_patch
  command: Where possible, remove access to the proxy sub-resource of node objects.
