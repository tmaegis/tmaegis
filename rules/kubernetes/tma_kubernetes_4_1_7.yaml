id: TMA-KUBERNETES-4.1.7
title: Ensure that the certificate authorities file permissions are set to 644 or more restrictive
description: Ensure that the certificate authorities file has permissions of 644 or more restrictive. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- worker-node
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.7 Ensure that the certificate authorities file permissions are set to 644 or more restrictive
audit:
  type: manual
  command: 'Run the following command: ps -ef | grep kubelet Find the file specified by the --client-ca-file argument. Run the following command: stat -c %a <filename> Verify that the permissions are 644 or more restrictive.'
remediation:
  type: iac_patch
  command: Run the following command to modify the file permissions of the --client-ca-file chmod 644 <filename>
