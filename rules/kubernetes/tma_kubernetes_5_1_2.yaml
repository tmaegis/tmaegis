id: TMA-KUBERNETES-5.1.2
title: Minimize access to secrets
description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users to reduce the risk of privilege escalation. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
- secrets
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.2 Minimize access to secrets
audit:
  type: manual
  command: Review the users who have get, list, or watch access to secrets objects in the Kubernetes API.
remediation:
  type: iac_patch
  command: Where possible, restrict access to secret objects in the cluster by removing get, list, and watch permissions.
