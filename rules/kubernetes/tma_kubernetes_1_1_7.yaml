id: TMA-KUBERNETES-1.1.7
title: Ensure that the etcd pod specification file permissions are set to 600 or more restrictive
description: Ensure that the /etc/kubernetes/manifests/etcd.yaml file has permissions of 600 or more restrictive.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- control-plane
- etcd
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 1.1.7 Ensure that the etcd pod specification file permissions are set to 600 or more restrictive
audit:
  type: command
  command: |-
    set -f
    f=""; for x in /etc/kubernetes/manifests/etcd.yaml; do if [ -e "$x" ]; then f=$x; break; fi; done
    [ -n "$f" ] || exit 1
    p=$(stat -Lc %a "$f") || exit 1
    if [ $((0$p & 0177)) -eq 0 ]; then echo compliant; else echo "noncompliant: $f mode $p"; fi
  expected_output: compliant
  requires_file:
  - /etc/kubernetes/manifests/etcd.yaml
remediation:
  type: command
  command: chmod u-x,go-rwx /etc/kubernetes/manifests/etcd.yaml
