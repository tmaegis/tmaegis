id: TMA-KUBERNETES-5.1.13
title: Minimize access to the service account token creation
description: Users with rights to create new service account tokens at a cluster level, can create long-lived privileged credentials in the cluster. This could allow for privilege escalation and persistent access to the cluster, even if the users account has been revoked. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.13 Minimize access to the service account token creation
audit:
  type: manual
  command: Review the users who have access to create the token sub-resource of serviceaccount objects in the Kubernetes API.
remediation:
  type: iac_patch
  command: Where possible, remove access to the token sub-resource of serviceaccount objects.
