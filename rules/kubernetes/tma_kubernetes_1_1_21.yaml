id: TMA-KUBERNETES-1.1.21
title: Ensure that the Kubernetes PKI key file permissions are set to 600
description: Ensure that Kubernetes PKI key files have permissions of 600. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- control-plane
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 1.1.21 Ensure that the Kubernetes PKI key file permissions are set to 600
audit:
  type: manual
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, stat -c '%a' /etc/kubernetes/pki/*.key Verify that the permissions are 600 or more restrictive. or ls -l /etc/kubernetes/pki/*.key Verify that the permissions are -rw------
remediation:
  type: iac_patch
  command: Run the below command (based on the file location on your system) on the Control Plane node. For example, chmod -R 600 /etc/kubernetes/pki/*.key
