id: TMA-KUBERNETES-5.2.12
title: Minimize the admission of containers which use HostPorts
description: Do not generally permit containers which require the use of HostPorts. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.12 Minimize the admission of containers which use HostPorts
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that each policy disallows the admission of containers which have hostPort sections.
remediation:
  type: iac_patch
  command: Add policies to each namespace in the cluster which has user workloads to restrict the admission of containers which use hostPort sections.
