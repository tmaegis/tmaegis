id: TMA-KUBERNETES-5.2.11
title: Minimize the admission of HostPath volumes
description: Do not generally admit containers which make use of hostPath volumes. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.11 Minimize the admission of HostPath volumes
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that each policy disallows the admission of containers with hostPath volumes.
remediation:
  type: iac_patch
  command: Add policies to each namespace in the cluster which has user workloads to restrict the admission of containers which use hostPath volumes.
