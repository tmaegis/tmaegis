id: TMA-KUBERNETES-4.2.4
title: Verify that if defined, readOnlyPort is set to 0
description: Disable the read-only port. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- worker-node
- kubelet
reference: CIS Kubernetes Benchmark v2.1.0 - 4.2.4 Verify that if defined, readOnlyPort is set to 0
audit:
  type: manual
  command: 'Run the following command on each node: ps -ef | grep kubelet Verify that the --read-only-port argument exists and is set to 0. If the --read-only-port argument is not present, check that there is a Kubelet config file specified by --config. Check that if there is a readOnlyPort entry in the file, it is set to 0.'
remediation:
  type: iac_patch
  command: 'If using a Kubelet config file, edit the file to set readOnlyPort to 0. If using command line arguments, edit the kubelet service file /etc/kubernetes/kubelet.conf on each worker node and set the below parameter in KUBELET_SYSTEM_PODS_ARGS variable. --read-only-port=0 Based on your system, restart the kubelet service. For example: systemctl daemon-reload systemctl restart kubelet.service'
