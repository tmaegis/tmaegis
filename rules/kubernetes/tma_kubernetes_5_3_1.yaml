id: TMA-KUBERNETES-5.3.1
title: Ensure that the CNI in use supports Network Policies
description: There are a variety of CNI plugins available for Kubernetes. If the CNI in use does not support Network Policies it may not be possible to effectively restrict traffic in the cluster. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- policies
- network
reference: CIS Kubernetes Benchmark v2.1.0 - 5.3.1 Ensure that the CNI in use supports Network Policies
audit:
  type: manual
  command: Review the documentation of CNI plugin in use by the cluster, and confirm that it supports Ingress and Egress network policies.
remediation:
  type: iac_patch
  command: If the CNI plugin in use does not support network policies, consideration should be given to making use of a different plugin, or finding an alternate mechanism for restricting traffic in the Kubernetes cluster.
