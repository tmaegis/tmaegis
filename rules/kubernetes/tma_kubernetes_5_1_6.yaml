id: TMA-KUBERNETES-5.1.6
title: Ensure that Service Account Tokens are only mounted where necessary
description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly needs to communicate with the API server The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- policies
- rbac
reference: CIS Kubernetes Benchmark v2.1.0 - 5.1.6 Ensure that Service Account Tokens are only mounted where necessary
audit:
  type: manual
  command: 'Review pod and service account objects in the cluster and ensure that the option below is set, unless the resource explicitly requires this access. automountServiceAccountToken: false'
remediation:
  type: iac_patch
  command: Modify the definition of pods and service accounts which do not need to mount service account tokens to disable it.
