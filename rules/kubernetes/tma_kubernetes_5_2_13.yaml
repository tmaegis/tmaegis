id: TMA-KUBERNETES-5.2.13
title: Minimize the admission of containers which have unmasked procmounts
description: Do not generally permit containers which require the use of unmasked proc mounts The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- policies
- pod-security
reference: CIS Kubernetes Benchmark v2.1.0 - 5.2.13 Minimize the admission of containers which have unmasked procmounts
audit:
  type: manual
  command: List the policies in use for each namespace in the cluster, ensure that each policy disallows the admission of containers which have unmasked procMount sections.
remediation:
  type: iac_patch
  command: Add policies to each namespace in the cluster which has user workloads to restrict the admission of containers which have unmasked procMount sections.
