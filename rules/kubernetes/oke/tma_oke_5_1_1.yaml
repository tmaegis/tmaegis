id: TMA-OKE-5.1.1
title: Ensure image vulnerability scanning uses OCIR or a third party provider
description: Container image vulnerability scanning helps strengthen the security of OKE workloads by identifying known software weaknesses in the images those workloads run. This supports a more secure software supply chain and helps reduce the chance that vulnerable images are promoted into Kubernetes environments. The benchmark marks this recommendation Manual.
target: oke
level: 1
severity: medium
tags:
- oke
- managed-services
- registry
reference: CIS Oracle Cloud Infrastructure Container Engine for Kubernetes (OKE) Benchmark v2.0.0 - 5.1.1 Ensure image vulnerability scanning uses OCIR or a third party provider
audit:
  type: manual
  command: Verify that image vulnerability scanning is enabled for repositories that store images used by OKE workloads. For images stored in OCIR, review the Container Registry image scanner or OCI Vulnerability Scanning container scan targets and scan results. If a third party scanner is used instead, obtain equivalent evidence that images deployed to OKE are scanned and that findings are available for review. Checks the container scan targets in the compartment.
remediation:
  type: iac_patch
  command: Enable image vulnerability scanning for OCIR repositories that supply container images to OKE workloads, or use an approved third party image scanning provider that produces equivalent vulnerability findings before image promotion and deployment. For OCIR, configure OCI Vulnerability Scanning with a container scan recipe and target for the repositories that store OKE images. Identify the OCIR repositories and compartments that provide images to OKE workloads. This establishes which repositories must be included in the scanning coverage. Configure OCI Vulnerability Scanning for the required repositories. Create a container image scan recipe in the compartment that will manage the scan configuration.
