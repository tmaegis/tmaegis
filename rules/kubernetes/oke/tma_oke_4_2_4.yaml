id: TMA-OKE-4.2.4
title: Minimize the admission of containers wishing to share the host network namespace
description: 'Minimize the admission of pods that request spec.hostNetwork: true in OKE so that sharing the host network namespace is limited to tightly controlled, explicitly approved platform scenarios. In OKE, this is done through Pod Security Admission or an equivalent policy engine. Because the baseline profile prohibits hostNetwork, and restricted inherits the baseline restrictions, general workload namespaces should not permit host network sharing. Requires kubectl with cluster-wide read access (KUBECONFIG); system namespaces are excluded and listed resources must be remediated or documented as exceptions.'
target: oke
level: 1
severity: high
tags:
- oke
- policies
- pod-security
- network
reference: CIS Oracle Cloud Infrastructure Container Engine for Kubernetes (OKE) Benchmark v2.0.0 - 4.2.4 Minimize the admission of containers wishing to share the host network namespace
audit:
  type: command
  command: |-
    out=$(kubectl get pods -A -o go-template='{{range .items}}{{.metadata.namespace}} {{.metadata.name}} {{.spec.hostNetwork}}{{"\n"}}{{end}}') || exit 1
    bad=$(printf '%s\n' "$out" | awk -v ex='^(kube-system|kube-public|kube-node-lease)$' 'NF && $1 !~ ex && ($3=="true")')
    if [ -z "$bad" ]; then echo compliant; else printf '%s\n' "$bad" | head -n 25; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'Configure Pod Security Admission on workload namespaces so pods that request spec.hostNetwork: true are denied at admission time. Use enforce on workload namespaces with restricted, or at minimum baseline, and reserve any exceptions for narrowly approved platform workloads. After updating namespace enforcement, remove hostNetwork: true from affected manifests and redeploy those workloads so new pods are evaluated under the enforced policy. For this control, the baseline and restricted Pod Security Standards disallow hostNetwork, while restricted is typically the stronger choice for user workloads. Label each workload namespace to enforce restricted. kubectl label ns NAMESPACE pod-security.kubernetes.io/enforce=restricted --overwrite Add warn and audit during rollout if you want visibility into violations, but do not rely on them for remediation because they do not block pod creation.'
