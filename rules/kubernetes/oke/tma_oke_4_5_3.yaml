id: TMA-OKE-4.5.3
title: The default namespace should not be used
description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces that reflect the intended team, application, or environment boundary. In OKE, namespaces are a primary logical partition for organizing workloads and supporting multi tenancy in a shared cluster. The benchmark marks this recommendation Manual.
target: oke
level: 1
severity: low
tags:
- oke
- policies
reference: CIS Oracle Cloud Infrastructure Container Engine for Kubernetes (OKE) Benchmark v2.0.0 - 4.5.3 The default namespace should not be used
audit:
  type: manual
  command: Review the OKE cluster and verify that the default namespace is not being used for normal application administration or routine workload placement. Objects that do not explicitly specify a namespace are created in default, so the audit should confirm that teams, applications, and environments are instead using dedicated namespaces that align with namespace level access control, quotas, limits, service accounts, and network policies.
remediation:
  type: iac_patch
  command: Move user workloads out of the default namespace and place them in dedicated namespaces that reflect the intended team, application, or environment boundary. In OKE, namespaces are the core logical partition for multi tenancy, but they only become meaningful administrative boundaries when they are paired with namespace level access, service accounts, quotas, limits, and network policies. Because namespaced objects are created in default when no namespace is specified, remediation should address both existing workloads and the deployment process that created them there. • Create dedicated namespaces for each team, application, or environment that needs its own administrative boundary. • Move user workloads out of the default namespace and into the appropriate managed namespaces.
