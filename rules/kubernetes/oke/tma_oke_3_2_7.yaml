id: TMA-OKE-3.2.7
title: Ensure kubelet tlsCertFile and tlsPrivateKeyFile are configured appropriately
description: Setup TLS connection on the Kubelets. For OKE worker nodes, this control validates that the kubelet HTTPS serving endpoint uses an appropriate TLS certificate and private key configuration rather than relying on an unintended or unmanaged serving identity. Reads every node's effective kubelet configuration through the API server (kubectl get --raw /api/v1/nodes/<node>/proxy/configz); requires kubectl with nodes/proxy access.
target: oke
level: 1
severity: high
tags:
- oke
- worker-node
- kubelet
reference: CIS Oracle Cloud Infrastructure Container Engine for Kubernetes (OKE) Benchmark v2.0.0 - 3.2.7 Ensure kubelet tlsCertFile and tlsPrivateKeyFile are configured appropriately
audit:
  type: command
  command: |-
    nodes=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}') || exit 1
    [ -n "$nodes" ] || exit 1
    ok=1
    for n in $nodes; do
      c=$(kubectl get --raw "/api/v1/nodes/$n/proxy/configz") || exit 1
      if ! { printf '%s' "$c" | grep -Eq '"tlsCertFile":"[^"]+"' && printf '%s' "$c" | grep -Eq '"tlsPrivateKeyFile":"[^"]+"'; }; then echo "noncompliant: $n"; ok=0; fi
    done
    if [ "$ok" -eq 1 ]; then echo compliant; fi
  expected_output: compliant
remediation:
  type: iac_patch
  command: If the audit shows that the kubelet serving certificate and private key are not configured appropriately, first confirm the inspection reflects the effective node configuration. In OKE, remediation should be performed through the supported managed node initialization, node pool update, or node replacement workflow, not by directly editing the kubelet config file on the host. Oracle supports custom cloud-init initialization scripts for managed nodes, including kubelet extra args, and updated worker node properties are applied through new or replacement worker nodes. Remediation of new cluster When creating a new OKE cluster or node pool, ensure each worker node starts with the intended kubelet serving certificate and private key configuration. If customization is required, place the certificate, private key, and kubelet reference in the supported managed node initialization path.
