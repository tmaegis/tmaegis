id: TMA-KUBERNETES-1.3.1
title: Ensure that the --terminated-pod-gc-threshold argument is set as appropriate
description: Activate garbage collector on pod termination, as appropriate. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: low
tags:
- kubernetes
- controller-manager
reference: CIS Kubernetes Benchmark v2.1.0 - 1.3.1 Ensure that the --terminated-pod-gc-threshold argument is set as appropriate
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-controller-manager Verify that the --terminated-pod-gc-threshold argument is set as appropriate.'
remediation:
  type: iac_patch
  command: 'Edit the Controller Manager pod specification file /etc/kubernetes/manifests/kube-controller-manager.yaml on the Control Plane node and set the --terminated-pod-gc-threshold to an appropriate threshold, for example: --terminated-pod-gc-threshold=10'
