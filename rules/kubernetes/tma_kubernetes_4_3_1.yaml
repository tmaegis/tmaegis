id: TMA-KUBERNETES-4.3.1
title: Ensure that the kube-proxy metrics service is bound to localhost
description: Do not bind the kube-proxy metrics port to non-loopback addresses. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
reference: CIS Kubernetes Benchmark v2.1.0 - 4.3.1 Ensure that the kube-proxy metrics service is bound to localhost
audit:
  type: manual
  command: 'review the start-up flags provided to kube proxy Run the following command on each node: ps -ef | grep -i kube-proxy Ensure that the --metrics-bind-address parameter is not set to a value other than 127.0.0.1. From the output of this command gather the location specified in the --config parameter. Review any file stored at that location and ensure that it does not specify a value other than 127.0.0.1 for metricsBindAddress.'
remediation:
  type: iac_patch
  command: Modify or remove any values which bind the metrics service to a non-localhost address
