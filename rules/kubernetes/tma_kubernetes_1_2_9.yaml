id: TMA-KUBERNETES-1.2.9
title: Ensure that the admission control plugin EventRateLimit is set
description: Limit the rate at which the API server accepts requests. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- api-server
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.9 Ensure that the admission control plugin EventRateLimit is set
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-apiserver Verify that the --enable-admission-plugins argument is set to a value that includes EventRateLimit.'
remediation:
  type: iac_patch
  command: Follow the Kubernetes documentation and set the desired limits in a configuration file. Then, edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml and set the below parameters. --enable-admission-plugins=...,EventRateLimit,... --admission-control-config-file=<path/to/configuration/file>
