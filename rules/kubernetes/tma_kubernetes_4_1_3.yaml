id: TMA-KUBERNETES-4.1.3
title: If proxy kubeconfig file exists ensure permissions are set to 600 or more restrictive
description: If kube-proxy is running, and if it is using a file-based kubeconfig file, ensure that the proxy kubeconfig file has permissions of 600 or more restrictive. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: medium
tags:
- kubernetes
- worker-node
- file-permissions
reference: CIS Kubernetes Benchmark v2.1.0 - 4.1.3 If proxy kubeconfig file exists ensure permissions are set to 600 or more restrictive
audit:
  type: manual
  command: 'Find the kubeconfig file being used by kube-proxy by running the following command: ps -ef | grep kube-proxy If kube-proxy is running, get the kubeconfig file location from the --kubeconfig parameter. To perform the audit: Run the below command (based on the file location on your system) on the each worker node. For example, stat -c %a <path><filename> Verify that a file is specified and it exists with permissions are 600 or more restrictive.'
remediation:
  type: iac_patch
  command: Run the below command (based on the file location on your system) on the each worker node. For example, chmod 600 <proxy kubeconfig file>
