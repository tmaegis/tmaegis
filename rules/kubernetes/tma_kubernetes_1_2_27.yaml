id: TMA-KUBERNETES-1.2.27
title: Ensure that the --encryption-provider-config argument is set as appropriate
description: Encrypt etcd key-value store. The benchmark marks this recommendation Manual.
target: kubernetes
level: 1
severity: high
tags:
- kubernetes
- api-server
- secrets
reference: CIS Kubernetes Benchmark v2.1.0 - 1.2.27 Ensure that the --encryption-provider-config argument is set as appropriate
audit:
  type: manual
  command: 'Run the following command on the Control Plane node: ps -ef | grep kube-apiserver Verify that the --encryption-provider-config argument is set to a EncryptionConfig file. Additionally, ensure that the EncryptionConfig file has all the desired resources covered especially any secrets.'
remediation:
  type: iac_patch
  command: 'Follow the Kubernetes documentation and configure a EncryptionConfig file. Then, edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml on the master node and set the --encryption-provider-config parameter to the path of that file: --encryption-provider-config=</path/to/EncryptionConfig/File>'
