id: TMA-SOLARIS-4.3
title: Enable Auditing of File Metadata Modification Events
description: 'The Solaris Audit service can be configured to record file metadata modification events for every process running on the system. This will allow the auditing service to determine when file ownership, permissions and related information is changed. This recommendation will provide an audit trail that contains information related to changes of file metadata. The Solaris Audit service is used to provide a more centralized and complete window into activities such as these. Audit: each listed event must carry the cis class in /etc/security/audit_event.'
target: solaris
level: 1
severity: medium
tags:
- solaris
- audit
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 4.3 Enable Auditing of File Metadata Modification Events
audit:
  type: command
  command: '[ -r /etc/security/audit_event ] || exit 1; r=compliant; for e in AUE_CHMOD AUE_CHOWN AUE_FCHOWN AUE_FCHMOD AUE_LCHOWN AUE_ACLSET AUE_FACLSET; do awk -F: -v e="$e" ''$2==e && $4 ~ /(^|,)cis(,|$)/ {f=1} END {exit !f}'' /etc/security/audit_event || r="$e not assigned to the cis class"; done; echo "$r"'
  expected_output: compliant
remediation:
  type: iac_patch
  command: 'To enforce this setting, run the following commands to modify the /etc/security/audit_event file and add the cis audit class to the following audit events: # awk ''BEGIN{FS=":"; OFS=":"} {if ($2 ~ /AUE_CHMOD|AUE_CHOWN|AUE_FCHOWN|AUE_FCHMOD|AUE_LCHOWN|AUE_ACLSET|AUE_FACLSET/ ) $4=$4",cis";} {print} '' /etc/security/audit_event > /etc/security/audit_event.CIS # cp /etc/security/audit_event.CIS /etc/security/audit_event'
