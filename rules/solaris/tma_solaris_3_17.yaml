id: TMA-SOLARIS-3.17
title: Disable Network Routing
description: 'The network routing daemon, in.routed, manages network routing tables. If enabled, it periodically supplies copies of the system''s routing tables to any directly connected hosts and networks and picks up routes supplied to it from other networks and hosts. Routing Internet Protocol (RIP) is a legacy protocol with a number of security weaknesses including a lack of authentication, zoning, pruning, etc. Audit: ipv4/ipv6 routing and forwarding must be disabled both persistently and currently (routeadm -p).'
target: solaris
level: 1
severity: medium
tags:
- solaris
- network
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 3.17 Disable Network Routing
audit:
  type: command
  command: 'command -v routeadm >/dev/null 2>&1 || exit 1; out=$(routeadm -p 2>/dev/null) || exit 1; r=compliant; for k in ipv4-routing ipv4-forwarding ipv6-routing ipv6-forwarding; do l=$(printf ''%s\n'' "$out" | grep "^$k "); case "$l" in *persistent=disabled*current=disabled*|*current=disabled*persistent=disabled*) ;; *) r="$k: $l";; esac; done; echo "$r"'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    routeadm -d ipv4-forwarding -d ipv4-routing -d ipv6-forwarding -d ipv6-routing
    routeadm -u
  guidance: "routeadm -d ipv4-forwarding -d ipv4-routing -d ipv6-forwarding -d ipv6-routing; routeadm -u"
