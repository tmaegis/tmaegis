id: TMA-SOLARIS-9.5
title: Verify System File Permissions
description: The pkg verify and command checks the accuracy of installed directory structures and files. It is important to ensure that system files and directories are maintained with the permissions they were intended to have from the OS vendor (Oracle).
target: solaris
level: 1
severity: medium
tags:
- solaris
- permissions
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 9.5 Verify System File Permissions
audit:
  type: manual
  command: 'Perform the following to verify that the result is as recommended: # pkg verify Errors may be a simple reflection of changes made earlier in this benchmark, such as alteration of the ownership of the cron process, so this result indicates that pkg verify is doing its job and detecting file changes.'
remediation:
  type: iac_patch
  command: 'Correct or justify any items discovered in the Audit step. Perform the following to set correct any identified package errors: # pkg fix Exercise caution in running this command as it may reverse modifications implemented previously including some of those recommended by this document. Rather than use this command broadly, it is recommended that it be used more tactically to correct specific package problems when possible.'
