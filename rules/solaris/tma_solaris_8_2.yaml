id: TMA-SOLARIS-8.2
title: Enable a Warning Banner for the FTP service
description: 'The action for this item sets a warning message for FTP users before they log in. If FTP is permitted for use in your environment, it is important to ensure that Warning Banners inform users who are attempting to access the system of their legal status regarding using the system. Audit: pattern match on /etc/proftpd.conf as described in the CIS audit procedure.'
target: solaris
level: 1
severity: low
tags:
- solaris
- network
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 8.2 Enable a Warning Banner for the FTP service
audit:
  type: file_regex
  file_path: /etc/proftpd.conf
  pattern: (?m)^\s*DisplayConnect\s+/etc/issue
  requires_file:
  - /etc/proftpd.conf
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: # echo "DisplayConnect /etc/issue" >> /etc/proftpd.conf # svcadm restart ftp'
