id: TMA-SOLARIS-8.4
title: Enable a Warning Banner for the GNOME Service
description: 'The GNOME Display Manager is used for login session management. See the manual page gdm(1) for more information on configuration of the settings, which can be user or group specific. The remediation action for this item sets a pre-login warning message for GDM users. Additional methods can be employed to display a similar message to a user post- authentication. For more information, see the Oracle Solaris 11 Security Guidelines document. Audit: only evaluated where GDM is installed.'
target: solaris
level: 1
severity: low
tags:
- solaris
- services
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 8.4 Enable a Warning Banner for the GNOME Service
audit:
  type: file_regex
  file_path: /etc/gdm/Init/Default
  pattern: --title="Security Message" --filename=/etc/issue
  requires_file:
  - /etc/gdm/Init/Default
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: Edit the /etc/gdm/Init/Default file to add the following content before the last line of the file. /usr/bin/zenity --text-info --width=800 --height=300 --title="Security Message" --filename=/etc/issue'
