id: TMA-SOLARIS-10.1
title: SN.1 Restrict access to suspend feature
description: Solaris 11 does not enable the suspend capability by default and now uses the poweradm command to suspend the system. Bear in mind that users with physical access to a system can simply remove power from the machine if they are truly motivated to take the system off-line, and granting the capability to use poweradm may be a more graceful way of allowing desktop users to ...
target: solaris
level: 2
severity: medium
tags:
- solaris
- permissions
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 10.1 SN.1 Restrict access to suspend feature
audit:
  type: manual
  command: 'Perform the following to verify that the result is as recommended: # poweradm list | grep suspend suspend/suspend-enable current=false, smf=false'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: # poweradm set suspend-enable=false # poweradm update'
