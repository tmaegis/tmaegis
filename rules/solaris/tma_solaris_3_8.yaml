id: TMA-SOLARIS-3.8
title: Restrict Core Dumps to Protected Directory
description: 'The action described in this section creates a protected directory to store core dumps and also causes the system to create a log entry whenever a regular process dumps core. Core dumps, particularly those from set-UID and set-GID processes, may contain sensitive data. Audit: setid core dumps must be disabled, global dumps disabled or written under /var/share/cores, and /var/share/cores must be mode 700 owned by root.'
target: solaris
level: 1
severity: medium
tags:
- solaris
- hardening
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 3.8 Restrict Core Dumps to Protected Directory
audit:
  type: command
  command: 'command -v coreadm >/dev/null 2>&1 || exit 1; out=$(coreadm 2>/dev/null) || exit 1; r=compliant; printf ''%s\n'' "$out" | grep -Eq "per-process setid core dumps:[[:blank:]]*disabled" || r="per-process setid core dumps enabled"; printf ''%s\n'' "$out" | grep -Eq "global core dumps:[[:blank:]]*disabled|global core file pattern:[[:blank:]]*/var/share/cores/" || r="global core dumps not restricted to /var/share/cores"; s=$(ls -ld /var/share/cores/ 2>/dev/null | awk ''{print $1, $3}''); case "$s" in "drwx------ root"|"drwx------+ root") ;; *) r="/var/share/cores: $s";; esac; echo "$r"'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    mkdir -p /var/share/cores && chown root:root /var/share/cores && chmod 700 /var/share/cores
    coreadm -g /var/share/cores/core.%f.%p -e global -d proc-setid -d global-setid
  guidance: "To implement the recommendation, run the following commands: # chmod 700 /var/share/cores # coreadm -g /var/share/cores/core_%n_%f_%u_%g_%t_%p \\ -e log -e global -e global-setid \\ -d process -d proc-setid If the local site chooses, dumping of core files can be completely disabled with the following command: # coreadm -d global -d global-setid -d process -d proc-setid"
