id: TMA-SOLARIS-9.3
title: Check That Defined Home Directories Exist
description: 'Users can be defined to have a home directory in passwd(4), even if the directory does not actually exist. If the user''s home directory does not exist, the user will be placed in "/" and will not be able to write any files or have local environment variables set. Audit: every account home directory must exist (uucp/nuucp are excluded as CIS notes).'
target: solaris
level: 1
severity: medium
tags:
- solaris
- accounts
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 9.3 Check That Defined Home Directories Exist
audit:
  type: command
  command: 'command -v logins >/dev/null 2>&1 || exit 1; out=$( { logins -xo | awk -F: ''{print $1, $6}'' | while read user home; do [ -d "$home" ] || echo "$user"; done | grep -Evx "uucp|nuucp" ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf ''%s\n'' "$out" | head -n 20'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Correct or justify any items discovered in the Audit step. Determine if there exists any users whose home directories do not exist, and work with those users to determine the best course of action in accordance with site policy.
