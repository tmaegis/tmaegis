id: TMA-SOLARIS-9.15
title: Check User Home Directory Ownership
description: 'The user home directory is space defined for the particular user to set local environment variables and to store personal files. Since the user is accountable for files stored in the user home directory, the user must be the owner of the directory. Audit: home directories of password-enabled accounts must be owned by the account (missing uucp/nuucp homes are ignored).'
target: solaris
level: 1
severity: medium
tags:
- solaris
- accounts
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 9.15 Check User Home Directory Ownership
audit:
  type: command
  command: 'command -v logins >/dev/null 2>&1 || exit 1; out=$( { logins -xo | awk -F: ''($8 == "PS") { print $1, $6 }'' | while read user home; do [ -d "$home" ] || continue; find "$home" -type d -prune ! -user "$user" -ls; done ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf ''%s\n'' "$out" | head -n 20'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Correct or justify any items discovered in the Audit step. Determine if there exists any users whose home directory is not properly owned, and work with those users to determine the best course of action in accordance with site policy.
