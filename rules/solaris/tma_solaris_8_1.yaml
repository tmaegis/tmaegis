id: TMA-SOLARIS-8.1
title: Create Warnings for Standard Login Services
description: 'The contents of the /etc/issue file are displayed prior to the login prompt on the system''s console and serial devices and also prior to logins via telnet and Secure Shell. The contents of the /etc/motd file are generally displayed after all successful logins, regardless from where the user is logging in. Audit: /etc/motd and /etc/issue must contain a banner and be mode 644 or more restrictive (motd root:sys, issue root:root); review wording.'
target: solaris
level: 1
severity: low
tags:
- solaris
- accounts
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 8.1 Create Warnings for Standard Login Services
audit:
  type: command
  command: 'r=compliant; for f in /etc/motd /etc/issue; do [ -s "$f" ] || r="$f is empty or missing"; done; for f in /etc/motd; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r--r--'' -v o=''root'' -v g=''sys'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else r="$f: missing"; fi; done; for f in /etc/issue; do if [ -e "$f" ]; then set -- $(ls -ld "$f"); s=$(printf ''%s %s %s\n'' "$1" "$3" "$4" | awk -v m=''rw-r--r--'' -v o=''root'' -v g=''root'' ''{ok=1; for(i=1;i<=9;i++) if(substr(m,i,1)=="-" && substr($1,i+1,1)!="-") ok=0; if(o!="" && $2 !~ ("^(" o ")$")) ok=0; if(g!="" && $3 !~ ("^(" g ")$")) ok=0; print (ok ? "ok" : $0)}''); [ "$s" = ok ] || r="$f: $s"; else r="$f: missing"; fi; done; echo "$r"'
  expected_output: compliant
remediation:
  type: command
  command: |
    set -u
    export DEBIAN_FRONTEND=noninteractive
    tma_pkg_remove() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y remove "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y remove "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y purge "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n remove "$p"; fi; done; }
    tma_pkg_install() { for p in "$@"; do
      if command -v dnf >/dev/null 2>&1; then dnf -y install "$p";
      elif command -v yum >/dev/null 2>&1; then yum -y install "$p";
      elif command -v apt-get >/dev/null 2>&1; then apt-get -y install "$p";
      elif command -v zypper >/dev/null 2>&1; then zypper -n install "$p"; fi; done; }
    tma_svc_off() { for u in "$@"; do systemctl stop "$u" 2>/dev/null; systemctl mask "$u" 2>/dev/null; done; return 0; }
    tma_bk() { [ -e "$1" ] && [ ! -e "$1.tmaegis.bak" ] && cp -p "$1" "$1.tmaegis.bak"; return 0; }
    # tma_setkv FILE KEY VALUE: KEY=VALUE, replacing any active KEY= line (file created if missing)
    tma_setkv() {
      f=$1; k=$2; v=$3; t="$f.tma.$$"
      tma_bk "$f"
      { [ -f "$f" ] && grep -v "^[[:space:]]*$k[[:space:]]*=" "$f"; echo "$k=$v"; } > "$t" || { rm -f "$t"; return 1; }
      if [ -f "$f" ]; then cat "$t" > "$f"; else mv "$t" "$f"; fi
      rm -f "$t"; return 0
    }
    # tma_comment FILE ERE: comment out active lines matching ERE (backup first)
    tma_comment() {
      f=$1; re=$2; [ -f "$f" ] || return 0
      grep -Eq "$re" "$f" || return 0
      tma_bk "$f"; t="$f.tma.$$"
      awk -v re="$re" '$0 ~ re && $0 !~ /^[[:space:]]*#/ { print "#TMAegis# " $0; next } { print }' "$f" > "$t" || { rm -f "$t"; return 1; }
      cat "$t" > "$f"; rm -f "$t"; return 0
    }
    for f in /etc/motd /etc/issue; do [ -s "$f" ] || r="$f is empty or missing"; done; for f in /etc/motd; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-wx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|sys|" in *"|$x|"*) ;; *) chgrp sys "$f";; esac
    done
    for f in /etc/issue; do
      [ -e "$f" ] || continue
      chmod u-x,g-wx,o-wx "$f"
      x=$(ls -ld "$f" | awk '{print $3}'); case "|root|" in *"|$x|"*) ;; *) chown root "$f";; esac
      x=$(ls -ld "$f" | awk '{print $4}'); case "|root|" in *"|$x|"*) ;; *) chgrp root "$f";; esac
    done
  guidance: "Perform the following to implement the recommended state: # echo \"Authorized users only. All activity may be monitored and reported.\" > /etc/motd # echo \"Authorized users only. All activity may be monitored and reported.\" > /etc/issue # chown root:root /etc/issue # chmod 644 /etc/issue"
