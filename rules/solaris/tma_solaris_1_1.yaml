id: TMA-SOLARIS-1.1
title: Use the Latest Package Updates
description: The Solaris 11 OS should be periodically updated to install or upgrade software packages that will enhance the security, reliability, and performance of the system. For the Solaris 11 OS, there will be no more software patches issued, but rather security and other improvements will be installed by updating one or more software packages.
target: solaris
level: 1
severity: medium
tags:
- solaris
- hardening
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 1.1 Use the Latest Package Updates
audit:
  type: manual
  command: 'To verify that the system is operating with the latest software updates, perform the following and verify that the result is as shown: # pkg update -n No updates available for this image. In addition, you can manually verify the update associated with the running system using the following command. The output of this command will indicate the operation system version and update number as well as the Software Repository Update (SRU) number. pkg info entire Name: entire Summary: entire incorporation including Support Repository Update (Oracle Solaris ... (full steps: CIS section 1.1)'
remediation:
  type: iac_patch
  command: 'Run the following command to refresh the package catalog, download and apply any available updates: # pkg update'
