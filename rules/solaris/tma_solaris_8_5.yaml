id: TMA-SOLARIS-8.5
title: Check that the Banner Setting for telnet is Null
description: 'The BANNER variable in the file /etc/default/telnetd can be used to display text before the telnet login prompt. Traditionally, it has been used to display the OS level of the target system. The warning banner provides information that can be used in reconnaissance for an attack. By default, this file is distributed with the BANNER variable set to null. Audit: pattern match on /etc/default/telnetd as described in the CIS audit procedure.'
target: solaris
level: 1
severity: low
tags:
- solaris
- network
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 8.5 Check that the Banner Setting for telnet is Null
audit:
  type: file_regex
  file_path: /etc/default/telnetd
  pattern: (?m)^BANNER=\s*$
  requires_file:
  - /etc/default/telnetd
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: # cd /etc/default # awk ''/^BANNER=/ { $1 = "BANNER=" }; { print }'' telnetd > telnetd.CIS # mv telnetd.CIS telnetd'
