id: TMA-SOLARIS-10.2
title: SN.2 Remove Support for Internet Services (inetd)
description: If the actions in this section result in disabling all inetd-based services, then there is no point in running inetd at boot time. If inetd-based services are ever re-enabled in the future it will be necessary to re- enable the inetd daemon as well ("svcadm enable svc:/network/inetd:default").
target: solaris
level: 2
severity: medium
tags:
- solaris
- services
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 10.2 SN.2 Remove Support for Internet Services (inetd)
audit:
  type: manual
  command: 'Perform the following to verify that the result is as recommended: # svcs -Ho state svc:/network/inetd disabled'
remediation:
  type: iac_patch
  command: 'Perform the following to implement the recommended state: # svcadm disable svc:/network/inetd'
