id: TMA-SOLARIS-9.10
title: Check Permissions on User "." (Hidden) Files
description: 'While the system administrator can establish secure permissions for users'' "dot" files, the users can easily override these. Group or world-writable user configuration files may enable malicious users to steal or modify other users'' data or to gain another user''s system privileges. Audit: automated read-only check derived from the CIS audit procedure; it prints "compliant" when the control is met.'
target: solaris
level: 1
severity: medium
tags:
- solaris
- accounts
reference: CIS Oracle Solaris 11.4 Benchmark v1.1.0 - 9.10 Check Permissions on User "." (Hidden) Files
audit:
  type: command
  command: 'command -v logins >/dev/null 2>&1 || exit 1; out=$( { for dir in $(logins -ox | awk -F: ''($8 == "PS") { print $6 }''); do find "$dir"/.[A-Za-z0-9]* ! -type l \( -perm -20 -o -perm -02 \) -ls; done ; } 2>/dev/null ); [ -z "$out" ] && echo compliant || printf ''%s\n'' "$out" | head -n 20'
  expected_output: compliant
remediation:
  type: iac_patch
  command: Correct or justify any items discovered in the Audit step. Determine if any user hidden files are world-readable or writable, and work with those users to determine the best course of action in accordance with site policy.
