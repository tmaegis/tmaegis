# TMAegis Configuration File (BYOK & Local AI)
ai:
  # Supported providers: "ollama", "claude", "openai", "gemini"
  provider: "ollama"
  model: "qwen3.5:9b"
  endpoint: "http://localhost:11434"
  # Set via environment variables for security: TMAEGIS_AI_API_KEY
  api_key_env: "TMAEGIS_AI_API_KEY"
  redact_secrets: true

engine:
  concurrency: 4
  snapshot_dir: "/var/lib/tmaegis/snapshots"
  deadman_timeout_sec: 60
  rules_dir: "./rules"

plugins:
  directory: "./plugins"
  enabled:
    - "notify-webhook"

ui:
  # Display language (BCP 47), e.g. en-US, en-GB, vi, zh-Hans, de. Empty = auto-detect.
  # Override per run with --lang or TMAEGIS_LANG; `tmaegis lang` lists all.
  language: ""
