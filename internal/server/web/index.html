<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMAegis Security Center</title>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><img src="logo-mark.svg" alt="" width="28" height="28"><span>TMAegis<sup>™</sup> Security Center</span></h1>
  <form id="auth" autocomplete="off">
    <input id="token" type="password" placeholder="Server token" aria-label="Server token">
    <button type="submit">Connect</button>
  </form>
</header>
<nav>
  <button data-tab="dashboard" class="active">Fleet</button>
  <button data-tab="rules">Rule explorer</button>
</nav>
<main>
  <p id="msg" role="status"></p>
  <section id="tab-dashboard">
    <div class="cards">
      <div class="card"><span id="avg" class="big">–</span><small>Average compliance</small></div>
      <div class="card"><span id="hosts" class="big">–</span><small>Hosts reporting</small></div>
      <div class="card"><span id="crit" class="big">–</span><small>Critical + high failures</small></div>
    </div>
    <table id="host-table"><thead><tr><th>Host</th><th>Score</th><th>Passed</th><th>Failed</th><th>Last report</th></tr></thead><tbody></tbody></table>
    <h2 id="detail-title" hidden></h2>
    <table id="detail" hidden><thead><tr><th>Rule</th><th>Severity</th><th>Status</th><th>Details</th></tr></thead><tbody></tbody></table>
  </section>
  <section id="tab-rules" hidden>
    <div class="filters">
      <input id="q" type="search" placeholder="Search rules" aria-label="Search rules">
      <select id="target" aria-label="Target"><option value="">All targets</option></select>
      <select id="severity" aria-label="Severity"><option value="">Any severity</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select>
    </div>
    <table id="rule-table"><thead><tr><th>ID</th><th>Title</th><th>Target</th><th>Level</th><th>Severity</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
