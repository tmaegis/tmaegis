name: TMAegis CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer commit cancels the run of the previous one on the same branch, which saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The private repository has no free Actions minutes, so CI runs only in the public repository, which
# receives this workflow with every publish (scripts/publish_public.sh).
jobs:
  build-and-test:
    if: github.repository == 'tmaegis/tmaegis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download Dependencies
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Check Formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Unit Tests
        run: go test -race -v ./...

      - name: Cross-Compile Binaries (Linux, Windows, macOS)
        run: make build-all

  web-portal:
    if: github.repository == 'tmaegis/tmaegis'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-portal/package-lock.json
      - run: npm ci
      - run: npm run gen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: SKIP_GEN=1 npm run build

# The internal ai-pipeline is not in the public repository; run it locally with `make ai-pipeline-test`.
