name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

# A re-pushed tag must not start a second build that uploads the same files at the same time.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: github.repository == 'tmaegis/tmaegis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job: a registry problem must never block the GitHub Release itself.
  docker:
    if: github.repository == 'tmaegis/tmaegis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "list=ghcr.io/tmaegis/tmaegis:${v},ghcr.io/tmaegis/tmaegis:latest" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
